    ### 动态任务调度


    scikit-learn 中实现的大多数算法都能够使用 `joblib`，它提供了基于线程/进程的单机多核分发能力。通过使用 Dask，我们可以将这些算法分发到集群上，就像我们在第
    2 章的 HPC 集群示例中使用 ipyparallel 所做的那样。


    Dask 更加灵活，为所有不同类型的分布式系统提供了并行支持，如图 3-1-5 所示。


    ![../images/494613_1_En_3_Chapter/494613_1_En_3_Fig5_HTML.jpg](img/494613_1_En_3_Fig5_HTML.jpg)


    图 3-1-5


    (a) scikit-learn 借助 JobLib 可以将训练任务分发到单机多核上。 (b) 使用 Dask，同样的过程可以分发到单机多核甚至机器集群上。


    让我们以优化支持向量机的超参数为例，比较使用 scikit-learn 进行串行优化和使用 Dask 进行分布式调优的时间：


    ```

    from sklearn.datasets import load_digits

    from sklearn.model_selection import GridSearchCV, train_test_split

    from sklearn.svm import SVC

    X, y = load_digits().data, load_digits().target

    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size = 0.3, shuffle=True)

    c = 0.001

    gamma = 1e-10

    param_grid = {

    "C": [c*(10**i) for i in range(1,14)],

    "gamma": [gamma*(10**i) for i in range(1,14)]

    }

    clf = SVC(kernel=''rbf'')

    search = GridSearchCV(clf, param_grid, cv=3)

    ```


    在上面的代码中，我们加载了 `digits` 数据集，并将使用 `GridSearchCV()` 优化 `C` 和 `gamma`。首先，让我们使用一个没有
    Joblib 的纯 ScikitLearn 示例。


    ```

    >>> import time

    >>> since = time.time()

    >>> model = search.fit(X_train, y_train)

    >>> print(time.time()-since)

    ```


    在超参数网格上总共会进行 169 次试验，耗时 75.01 秒。请注意，我们是在串行运行网格搜索。


    现在，让我们使用 Dask 将试验并行化到多个核心上：


    ```

    >>> import joblib

    >>> import time

    >>> from dask.distributed import Client

    >>> client = Client(processes=False)

    >>> since = time.time()

    >>> with joblib.parallel_backend(''dask'', scatter=[X_train, y_train]):

    model = search.fit(X_train, y_train)

    >>> print(time.time()-since)

    ```


    现在 JobLib 将使用 Dask 的客户端，在本例中是一个本地集群，用于将 169 种可能的组合分发到多个核心上。完成相同任务所需的时间为 34.73
    秒。这仅使用四个核心就有了巨大的改进，因此在真正的机器集群上还有很大的改进空间。查看 Dask 仪表盘以可视化核心使用情况，如图 3-1-6 所示。


    ![../images/494613_1_En_3_Chapter/494613_1_En_3_Fig6_HTML.jpg](img/494613_1_En_3_Fig6_HTML.jpg)


    图 3-1-6


    任务流窗格显示四个水平条，代表四个核心


    注意


    以上所有实验均在本地机器上执行，调度器和集群是同一个。在“动态任务调度”部分给出的示例中，我们可以单独使用 scikit-learn 将任务分发到单机多核上，而无需使用
    Dask。


    ### 使用 Dask 进行超参数优化


    正如我们在前几个示例中看到的，我们可以使用 Dask 进行超参数优化，以解决时间和内存限制。让我们回顾一下 scikit-learn 中的超参数优化算法及其分发方式：


    *   我们可以使用简单直接的 scikit-learn 的随机搜索和网格搜索，并传递参数 `''n_jobs''=-1` 以使用单机上的所有核心。这解决了计算/时间限制。

    *   我们可以使用 scikit-learn 并将其代码包裹在 `with parallel_backend(''dask''):` 中，就像我们在“动态任务调度”部分的示例中所做的那样，无论是随机搜索、网格搜索还是任何其他使用
    `*joblib*` 实现的算法。我们可以使用单机上的所有核心，或者将它们分发到集群上，这取决于 `dask.distributed` 的 `client()`
    是如何定义的。如果使用集群，这可以进一步减少时间。


    现在让我们看看 Dask 还为我们提供了哪些用于超参数优化的功能。


    #### Dask 随机搜索和网格搜索


    我们不能使用 scikit-learn 提供的随机搜索或网格搜索来训练大型数据集，因为它们不支持 `partial_fit`。然而，Dask 为这两种算法提供了即插即用的替代方案：`dask_ml.model_selection.GridSearchCV`
    和 `dask_ml.model_selection.RandomizedSearchCV`。Dask 和 Scikit-Learn 中各自算法的接口是相似的，但
    Dask 的版本实现了 `partial_fit`，这样我们就可以将 scikit-learn 的机器学习算法包装在 `Incremental` 中，并将其传递给这些超参数优化算法。


    这种设置不仅可以分块训练模型，还可以将其分发到集群上，从而同时解决时间和内存问题。步骤基本上是一个直接的脚本，与我们之前所做的相同：


    1.  定义一个客户端。

    2.  定义搜索空间。

    3.  创建一个大型数据集来测试我们的分布式模型。

    4.  训练测试分割。

    5.  定义使用部分拟合的机器学习算法，例如 SGD 分类器。

    6.  将机器学习算法包装在 `Incremental` 中，以便在将其分发到核心/集群时可以分块管理和训练数据。

    7.  在此基础上使用从 Dask 导入的网格搜索，因为它实现了 `partial_fit`。

    8.  在 `joblib.parallel_backend` 下训练模型，以便可以进一步分发。


    然而，在遵循这些步骤时，我遇到了一个有趣的问题。当我执行代码时，我检查了 Dask 仪表盘。内存开始被填满。问题出在准确率评分上。在我使用了 `dask_ml`
    中的准确率指标后，问题得到了解决。


    让我们看一个示例：


    ```

    from dask_ml import datasets

    from dask_ml.wrappers import Incremental

    from dask_ml.model_selection import train_test_split, GridSearchCV

    from dask_ml.metrics import accuracy_score

    from sklearn.metrics import make_scorer

    from sklearn.linear_model import SGDClassifier

    import joblib

    import dask.array as da

    from dask.distributed import Client

    client = Client(processes=False)

    print(client.dashboard_link)

    param_grid = {

    "penalty": [''l1'', ''l2''],

    "tol": [1e-2, 1e-3, 1e-4]

    }

    X, y = datasets.make_classification(n_samples=100000000,

    n_features=7,

    random_state=0,

    chunks=100000)

    # 提供来自 ''dask_ml'' 的准确率指标

    scorer = make_scorer(accuracy_score)

    X_train, X_test, y_train, y_test = train_test_split(X, y)

    clf = SGDClassifier(loss=''log'')

    clf_wrap = Incremental(clf, scoring=scorer)

    searh_clf = GridSearchCV(clf_wrap, param_grid, cv=3)

    with joblib.parallel_backend(''dask''):

    model = searh_clf.fit(X_train, y_train)

    ```


    注意


    经过一番摸索，我发现默认情况下使用的是 `SGDClassifier.score` 进行评分计算，它会将 `dask arrays` 的块转换为 `ndarray`，从而导致内存使用过高。当我使用
    `dask_ml` 中的评分器时，问题就解决了。


    因此，你需要注意确保数据的块不会被转换为 `numpy array`；否则会导致内存被填满。这里使用 Dask 数据框和 Dask 数组的目的就是为了不填满内存。

