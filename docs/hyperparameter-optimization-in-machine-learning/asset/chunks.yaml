- fmt: "### Dask Distributed\n\n`dask.distributed`是一个小型库，它扩展了`dask`以实现动态任务调度。在使用`dask`时，我们主要使用`dask.distributed`中的`Client()`：\n\
    \n```\n>>> from dask.distributed import Client\n>>> client = Client()\n```\n\n\
    `Client()`帮助你连接到分布式集群。一个`Dask`集群会被传递给`Client()`，具体取决于集群类型。`Dask`支持多种不同的集群类型，例如：\n\
    \n- **SSH**：如果你有一个非托管的集群，你需要使用SSH协议连接到每台机器。在这种情况下，请使用以下代码：\n\n    ```\n    >>>\
    \ from dask.distributed import Client, SSHCluster\n    >>> cluster = SSHCluster(\n\
    \    [\"localhost\", \"localhost\", \"localhost\"],\n    connect_options={\"known_hosts\"\
    : None},\n    worker_options={\"nthreads\": 2},\n    scheduler_options={\"port\"\
    : 0,\n    \"dashboard_address\": \":8797\"},\n    )\n    >>> client = Client(cluster)\n\
    \    ```\n\n    这里我们为所有工作节点定义了IP地址，`connect_options`可以包含SSH连接的密码等信息。\n\n- **Kubernetes**：使用Kubernetes集群是使用`Dask`部署分布式应用程序的一种快速简便的方法：\n\
    \n    ```\n    >>> from dask_kubernetes import KubeCluster\n    >>> cluster =\
    \ KubeCluster.from_yaml('worker-template.yaml')\n    >>> cluster.scale(40) #add\
    \ 40 worker nodes\n    >>> from dask.distributed import Client\n    >>> client\
    \ = Client(cluster)\n    ```\n\n    你可以根据需要定义工作节点，甚至可以使用`cluster.adapt()`代替`cluster.scale()`来根据工作负载进行伸缩。\n\
    \n除了这些集群类型，`Dask`还支持在HPC、YARN（一个Apache Hadoop集群）以及由Amazon、Google等提供的基于云的集群上进行分布式计算。\n\
    \n通过向`Client()`传递`processes=False`，将创建一个本地集群，并且任务将在多个核心上并行执行：\n\n```\n>>> from\
    \ dask.distributed import Client\n>>> client = Client(processes=False)\n>>> print(client)\n\
    Client\nScheduler: tcp://127.0.0.1:35053\nDashboard: http://127.0.0.1:8787/status\n\
    Cluster\nWorkers: 1\nCores: 4\nMemory: 16.73 GB\n```\n\n这显示了客户端和集群的详细信息。在这个例子中，我使用了一台机器同时作为调度器和工作节点。在实际集群中，你可以利用更多的核心、工作节点和更大的内存。\n\
    \n`Dask`提供的一个出色功能是在仪表盘上可视化分布式计算（注意客户端信息下的仪表盘地址）。在这里，你可以在搜索执行后实时查看核心的利用率。稍后我们将看一些示例。\n\
    \n### 并行集合\n\n如图[3-1-2](#494613_1_En_3_Chapter.xhtml#Fig2)所示，一个`Dask`数据框的块由多个小的Pandas数据框组成。类似地，一个`Dask`数组由更小的NumPy数组组成。你可以决定块的大小，使其能够放入内存。\n\
    \n![../images/494613_1_En_3_Chapter/494613_1_En_3_Fig2_HTML.jpg](images/494613_1_En_3_Chapter/494613_1_En_3_Fig2_HTML.jpg)\n\
    \n图 3-1-2\n\n`Dask`数据框（左）和`Dask`数组（右）\n\n此外，对`Dask`数据框的操作模仿了Pandas数据框的API，数组也是如此。例如：\n\
    \n```\n#pandas\nimport pandas as pd\ndf = pd.read_csv(\"./dataset/train.csv\"\
    )\nprint(df.Age.mean())\n#dask\nimport dask.dataframe as dd\ndf = dd.read_csv(\"\
    ./dataset/train.csv\")\nprint(df.Age.mean().compute())\n```\n\n唯一的区别是，你需要在`Dask`中使用`.compute()`来执行操作。不过，并非所有NumPy和Pandas的接口都受支持。\n\
    \n由于`Dask`的并行集合可以帮助解决内存限制问题，让我们对一个原本无法放入内存的大型数据集进行建模，更不用说训练了。\n\n首先初始化客户端：\n\n\
    ```\n>>> from dask.distributed import Client\n>>> client = Client(processes=False)\n\
    ```\n\n现在创建`Dask`集合：\n\n```\n>>> from dask_ml import datasets\n>>> from dask_ml.model_selection\
    \ import train_test_split\n>>> import dask.array as da\n>>> X, y = datasets.make_classification(n_samples=100000000,\n\
    n_features=7,\nrandom_state=0,\nchunks=100000)\n>>> classes = da.unique(y_train).compute()\n\
    >>> X_train, X_test, y_train, y_test = train_test_split(X, y)\n```\n\n现在我们有了一个巨大的数据集，它有1亿行，每行有7个特征和2个类别。图[3-1-3](#494613_1_En_3_Chapter.xhtml#Fig3)显示了一个5.6\
    \ GB的数据被分成1000个块，每个块有100,000行，大小为5.6 MB。\n\n![../images/494613_1_En_3_Chapter/494613_1_En_3_Fig3_HTML.jpg](images/494613_1_En_3_Chapter/494613_1_En_3_Fig3_HTML.jpg)\n\
    \n图 3-1-3\n\n(a) 是变量`X`的表示，(b) 是变量`y`的表示\n\n创建块的目的是不必将整个数据集加载到内存中；只有scikit-learn中支持`partial_fit`的算法才能做到这一点。我将使用`SGDClassifier`来对数据集进行建模：\n\
    \n```\n>>> from sklearn.linear_model import SGDClassifier\n>>> clf = SGDClassifier(loss='log',\
    \ penalty=\"l2\", tol=0.01)\n```\n\n执行`clf.fit(X_train, y_train)`将对数据集进行一次迭代。为了进一步对分类器进行多次迭代训练，我们可以使用一个简单的`for`循环。我们需要将scikit-learn的`SGDClassifier`包装到`Dask`的`Incremental`函数中，该函数管理数据，以便模型能够分块进行训练。\n\
    \n```\n>>> from dask_ml.wrappers import Incremental\n>>> clf = Incremental(clf,\
    \ scoring=\"accuracy\")\n>>> clf.fit(X_train, y_train, classes=classes)\n```\n\
    \n一旦你执行了这段代码，请查看`Dask`仪表盘，你可以在那里可视化正在进行的各种进程，如图[3-1-4](#494613_1_En_3_Chapter.xhtml#Fig4)所示。\n\
    \n![../images/494613_1_En_3_Chapter/494613_1_En_3_Fig4_HTML.jpg](images/494613_1_En_3_Chapter/494613_1_En_3_Fig4_HTML.jpg)\n\
    \n图 3-1-4\n\n`Dask`仪表盘的“任务流”窗格显示了代表四个核心的四个条。"
  raw: "### Dask Distributed\n\n*dask*. *distributed* is a small library that extends\
    \ to *dask* for dynamic task scheduling. While using dask we primarily use *Client*()\
    \ from `dask.distributed`:\n\n```\n>>> from dask.distributed import Client\n>>>\
    \ client = Client()\n```\n\n*Client*() helps you connect to the distributed cluster.\
    \ A Dask cluster is passed to *Client*(), depending upon the cluster type. Dask\
    \ support several different cluster types, such as the following:\n\n*   *SSH*:\
    \ If you have an unmanaged cluster, you need to connect to each machine using\
    \ the SSH protocol. In that case, use the following:\n\n    ```\n    >>> from\
    \ dask.distributed import Client, SSHCluster\n    >>> cluster = SSHCluster(\n\
    \    [\"localhost\", \"localhost\", \"localhost\"],\n    connect_options={\"known_hosts\"\
    : None},\n    worker_options={\"nthreads\": 2},\n    scheduler_options={\"port\"\
    : 0,\n    \"dashboard_address\": \":8797\"},\n    )\n    >>> client = Client(cluster)\n\
    \    ```\n\nHere we define IPs for all the worker, `connect_options` can contain\
    \ information like passwords for SSH connections.\n\n*   *Kubernetes*: Using a\
    \ Kubernetes cluster is a quick and easy way to deploy distributed applications\
    \ using Dask:\n\n    ```\n    >>> from dask_kubernetes import KubeCluster\n  \
    \  >>> cluster = KubeCluster.from_yaml('worker-template.yaml')\n    >>> cluster.scale(40)\
    \ #add 40 worker nodes\n    >>> from dask.distributed import Client\n    >>> client\
    \ = Client(cluster)\n    ```\n\nYou can define worker machines as per your need,\
    \ or even scale them as per workload using *cluster*. *adapt*() instead of *cluster*.\
    \ *scale*().\n\nAlong with these cluster types, Dask also facilitates distribution\
    \ over HPC, YARN (an Apache Hadoop cluster), and cloud-based clusters provided\
    \ by Amazon, Google, and so forth.\n\nBy passing '`processes=False'` to *Client*(),\
    \ a local cluster will be created and trials will be parallelized over cores:\n\
    \n```\n>>> from dask.distributed import Client\n>>> client = Client(processes=False)\n\
    >>> print(client)\nClient\nScheduler: tcp://127.0.0.1:35053\nDashboard: http://127.0.0.1:8787/status\n\
    Cluster\nWorkers: 1\nCores: 4\nMemory: 16.73 GB\n```\n\nThis shows the client\
    \ and cluster details. In this case, I have used a single machine as both scheduler\
    \ and worker. On an actual cluster, you can utilize many more cores and workers,\
    \ and much more memory.\n\nA brilliant feature provided by Dask is the visualization\
    \ of the distributed computing on the Dashboard (note the Dashboard address under\
    \ the client info). Here you can visualize in real time the utilization of the\
    \ cores once the search is executed. Later we’ll take a look at some examples.\n\
    \n### Parallel Collections\n\nAs you can see in Figure [3-1-2](#494613_1_En_3_Chapter.xhtml#Fig2),\
    \ chunks of a Dask dataframe consist of several small Pandas dataframes. Similarly,\
    \ a Dask array consists of smaller NumPy arrays. You can decide the size of chunks\
    \ such that they fit in memory.\n\n![../images/494613_1_En_3_Chapter/494613_1_En_3_Fig2_HTML.jpg](images/494613_1_En_3_Chapter/494613_1_En_3_Fig2_HTML.jpg)\n\
    \nFigure 3-1-2\n\nDask dataframe (left) and Dask array (right)\n\nMoreover, operations\
    \ over Dask dataframe mimics API of pandas dataframe, and the same goes for arrays.\
    \ For example:\n\n```\n#pandas\nimport pandas as pd\ndf = pd.read_csv(\"./dataset/train.csv\"\
    )\nprint(df.Age.mean())\n#dask\nimport dask.dataframe as dd\ndf = dd.read_csv(\"\
    ./dataset/train.csv\")\nprint(df.Age.mean().compute())\n```\n\nThe only difference\
    \ is that you need to use `.compute()` to execute the operations in Dask. Not\
    \ all NumPy and Pandas interfaces are supported though.\n\nSince Daks parallel\
    \ collections can help to solve memory constraints, let’s model a large dataset\
    \ that wouldn’t otherwise fit in the memory, let alone train.\n\nFirst initialize\
    \ the client:\n\n```\n>>> from dask.distributed import Client\n>>> client = Client(processes=False)\n\
    ```\n\nNow make the Dask collection:\n\n```\n>>> from dask_ml import datasets\n\
    >>> from dask_ml.model_selection import train_test_split\n>>> import dask.array\
    \ as da\n>>> X, y = datasets.make_classification(n_samples=100000000,\nn_features=7,\n\
    random_state=0,\nchunks=100000)\n>>> classes = da.unique(y_train).compute()\n\
    >>> X_train, X_test, y_train, y_test = train_test_split(X, y)\n```\n\nNow we have\
    \ a huge dataset, which has 100 million rows with seven features each and two\
    \ classes. Figure [3-1-3](#494613_1_En_3_Chapter.xhtml#Fig3) shows a data 5.6\
    \ GB large divided into 1000 chunks of 100,000 rows and 5.6 MB each.\n\n![../images/494613_1_En_3_Chapter/494613_1_En_3_Fig3_HTML.jpg](images/494613_1_En_3_Chapter/494613_1_En_3_Fig3_HTML.jpg)\n\
    \nFigure 3-1-3\n\n(a) is a representation of variable X and (b) is a representation\
    \ of variable y\n\nThe point of creating chunks is to not have to load the entire\
    \ dataset in memory; only algorithms with 'partial_fit' in scikit-learn support\
    \ this. I’ll be using SGD Classifier to model the dataset:\n\n```\n>>> from sklearn.linear_model\
    \ import SGDClassifier\n>>> clf = SGDClassifier(loss='log', penalty=\"l2\", tol=0.01)\n\
    ```\n\nExecuting `clf.fit(X_train, y_train)` will iterate over the dataset a single\
    \ time. To train the classifier further for multiple iterations, we can use a\
    \ simple `for` loop. We’ll have to wrap scikit-learn’s SGD classifier into Dask’s\
    \ `Incremental` function , which manages the data so that the model will be trained\
    \ in chunks.\n\n```\n>>> from dask_ml.wrappers import Incremental\n>>> clf = Incremental(clf,\
    \ scoring=\"accuracy\")\n>>> clf.fit(X_train, y_train, classes=classes)\n```\n\
    \nOnce you execute this, check out the Dask dashboard, where you can visualize\
    \ various processes going on, as shown in Figure [3-1-4](#494613_1_En_3_Chapter.xhtml#Fig4).\n\
    \n![../images/494613_1_En_3_Chapter/494613_1_En_3_Fig4_HTML.jpg](images/494613_1_En_3_Chapter/494613_1_En_3_Fig4_HTML.jpg)\n\
    \nFigure 3-1-4\n\nThe Dask dashboard Task Stream pane shows the four bars representing\
    \ four cores."
  trans: "\n### Dask 分布式\n\n*dask*.*distributed* 是一个小型库，它扩展了 *dask* 以实现动态任务调度。在使用\
    \ dask 时，我们主要使用 `dask.distributed` 中的 *Client*()：\n\n```\n>>> from dask.distributed\
    \ import Client\n>>> client = Client()\n```\n\n*Client*() 帮助你连接到分布式集群。一个 Dask\
    \ 集群会被传递给 *Client*()，具体取决于集群类型。Dask 支持多种不同的集群类型，例如：\n\n*   *SSH*：如果你有一个非托管集群，你需要使用\
    \ SSH 协议连接到每台机器。在这种情况下，请使用以下代码：\n\n    ```\n    >>> from dask.distributed import\
    \ Client, SSHCluster\n    >>> cluster = SSHCluster(\n    [\"localhost\", \"localhost\"\
    , \"localhost\"],\n    connect_options={\"known_hosts\": None},\n    worker_options={\"\
    nthreads\": 2},\n    scheduler_options={\"port\": 0,\n    \"dashboard_address\"\
    : \":8797\"},\n    )\n    >>> client = Client(cluster)\n    ```\n\n这里我们为所有工作节点定义了\
    \ IP 地址，`connect_options` 可以包含 SSH 连接的密码等信息。\n\n*   *Kubernetes*：使用 Kubernetes\
    \ 集群是使用 Dask 部署分布式应用程序的一种快速简便的方法：\n\n    ```\n    >>> from dask_kubernetes import\
