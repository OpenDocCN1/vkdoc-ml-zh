    序言 1


    我必须承认，在我训练第一个机器学习模型时，手动调整参数是我真正享受的事情。我会更改一个参数，运行训练脚本，然后等待评估分数是否有所提升。这是一种小小的罪恶快感。


    但随着我在机器学习领域投入更多时间，我意识到还有其他更有影响力的领域可以投入精力。我意识到我可以（也应该）将参数调整工作外包出去。


    我了解了随机搜索，并开始在项目中使用它。在某个时候，我觉得自己可以做得比随机搜索更好，于是开始阅读关于更高级的超参数优化算法和库的资料。


    我找到的许多文章都相当肤浅和基础，但我记得读过一篇关于 Hyperopt（最流行的超参数优化库之一）的深入、实践性强且易于理解的文章。它是由 Tanay Agrawal
    撰写的。那篇文章可能仍然是我读过关于这个主题最有价值的文章之一。我在一篇博客文章中提到了它，我们就是这样认识的。


    当 Tanay 告诉我他正在写一本关于超参数优化的书时，我毫不犹豫地提出审阅。说实话，我真的很想比别人先读到它！令我惊讶的是，Tanay 同意了，我也得以在这里那里提了一些意见。


    这本书真正深入探讨了超参数优化的理论与实践。我非常喜欢它如何深入解释理论，但又不过于复杂。实践示例围绕当今广泛使用的库和框架展开，这使得这本书与时俱进，最重要的是，非常实用。


    我向任何希望超越基础知识、学习超参数优化的“为什么”、“怎么做”和“是什么”的机器学习从业者推荐这本书。


    > Jakub Czakon


    > 高级数据科学家


    > Neptune.ai


    序言 2


    在这本书中，Tanay 带你踏上一段互动之旅——从最字面的意义上说，因为每一行代码都可以在笔记本中运行——深入探索超参数的奥秘。它帮助任何人快速上手，使用他们选择的任何库来调整和改进他们的深度学习项目。


    作者以透彻且易于理解的方式，精心涵盖了机器学习模型中超参数的内部工作原理，这将使你能够理解并使用不同的库在此基础上进行构建。这本书还揭开了最黑的黑匣子：自动化机器学习中的超参数优化。


    这是一本关于复杂主题的友好指南，同时充满了即使是高级从业者也会喜欢的尖端精华内容。


    > Akruti Acharya


    > 数据科学家


    > Curl HG


    引言


    在构建机器学习模型时，选择正确的超参数是数据科学从业者面临的最大问题之一。本书是一本超参数优化（HPO）指南。它从*超参数*最基本的定义开始，一直带你到使用先进的
    HPO 技术构建你自己的 AutoML 脚本。本书面向学生和数据科学专业人士。


    本书共五章。第 1 章帮助你理解超参数如何影响模型构建的整体过程。它阐述了 HPO 的重要性。第 2 章介绍了基本且易于实现的 HPO 方法。第 3 章带你了解应对时间和内存限制的各种技术。第
    4 章和第 5 章讨论了贝叶斯优化、相关库和 AutoML。


    本书旨在让读者以直观且实用的方式理解 HPO 概念，并为每个部分提供代码实现。希望你喜欢。


    致谢


    我要感谢 Kailash Ahirwar（MateLabs 首席技术官）作为我的优秀导师。非常感谢 MateLabs 和 Curl HG 团队的持续支持。我感谢
    Akruti Acharya 和 Jakub Czakon 在撰写本书时提供的富有洞察力的意见。我还要感谢 Paankhi Agrawal、Sahil Sharma、H.-Y.
    Amanieu 博士、Anubhav Kesari、Abhishek Kumar、Amog Chandrashekar 等人。没有家人的爱与鼓励，这本书是不可能完成的。


    关于作者 关于技术审校


    # 1. 超参数简介


    人工智能（AI）突然无处不在，从商业分析、医疗保健、汽车工业到你在日常生活中可能享受的各种平台，如社交媒体、游戏和广泛的娱乐产业，都在发生变革。计划在视频流应用上看部电影，但决定不了看哪部？在
    AI 的帮助下，你最终可能会观看基于你过去电影选择推荐的一部。


    机器学习是 AI 的一个子集，涉及算法从以往经验中学习。在某些情况下，机器学习已经达到了人类水平的准确性。例如，最先进的深度神经网络（DNN）在某些任务（如图像分类、目标检测等）上表现与人类一样好，尽管这与模拟人类智能不同（但这是一步）。


    在机器学习算法中，调整超参数是构建高效模型的重要方面之一。在本章中，你将了解*超参数*一词的含义，并学习超参数如何影响构建机器学习模型的整体过程。

    '
- fmt: '# Introduction to Machine Learning


    `Machine learning` is the study of algorithms which perform a task without explicitly
    defining the code to perform it, instead using data to learn. Machine learning
    enables algorithms to learn on their own without human intervention.


    Tom M. Mitchell, a computer scientist and, at the time of writing, a professor
    at Carnegie Mellon University, defines machine learning as follows: “A computer
    program is said to learn from experience `E` with respect to some class of tasks
    `T` and performance measure `P` if its performance at tasks in `T`, as measured
    by `P`, improves with experience `E`.”


    Machine learning algorithms have several subdivisions based on the type of problem
    that needs to be solved. Here I will introduce you to three main types:


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig1_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig1_HTML.jpg)


    Figure 1-1-1


    Examples of supervised machine learning (left) and unsupervised machine learning
    (right)


    - `Supervised machine learning algorithms`: Labeled data is provided, we build
    a model over it to predict such labels given variables. As an example, suppose
    you want to purchase a spaceship. Several factors would help you to decide which
    spaceship to buy: cost, size of spaceship, build quality, whether it has hyperdrive,
    its weaponry system, and so on. Now we have data of hundreds of spaceships with
    such feature information and their price, so we build a model and predict the
    price. This comes under the regression problem. `Regression problems` have continuous
    target values, and if the target values are discrete, we call them `classification
    problems`. A third type of problem features time-stamps, `time series forecasting`,
    where the next data point is somewhat dependent on the previous information, so
    your algorithm needs to keep in memory information from the previous data points.
    The image on the left in Figure [1-1-1](#494613_1_En_1_Chapter.xhtml#Fig1) is
    an example of a classification problem. We need labeled data in order to learn
    to draw a seperation between them.


    - `Unsupervised machine learning algorithms`: These kinds of problems do not have
    a target value. Suppose you have to group the hypothetical spaceships in clusters
    according to their features; you would use a `clustering algorithm` to do so.
    Unsupervised machine learning is used to detect patterns among the dataset. You
    don’t know which cluster is which, but you do know that all the spaceships in
    one cluster are similar to each other; the right image in Figure [1-1-1](#494613_1_En_1_Chapter.xhtml#Fig1)
    shows an example.


    - `Reinforcement machine learning algorithms`: A reinforcement machine learning
    algorithm learns from the environment; if it performs well, it gets a reward,
    and the goal is to maximize the reward. For example, consider the Chrome “running
    dinosaur” game (go to `chrome://dino/` and press the spacebar). The dinosaur continuously
    runs toward obstacles. To increase your score, you have to press the spacebar
    at the precise time to make the dinosaur jump over the obstacles. Here those points
    are the reward and jumping is the variable that needs to be decided at the right
    time. In problems like this, we use reinforcement machine learning algorithms.
    The `Q-learning algorithm` is one example of a reinforcement machine learning
    algorithm. One of the most brilliant applications of reinforcement machine learning
    is a robot learning to walk through trial and error.


    There’s a lot more to machine learning. You need to be familiar with the basics
    of machine learning before jumping into hyperparameters and their optimization
    methodologies. If you are new to machine learning or if you want to brush up on
    the basic concepts, refer to Appendix I and Appendix II. Appendix I covers practical
    application of machine learning and some of its basic aspects. Appendix II gives
    you a brief introduction to fully connected neural networks and the PyTorch and
    Keras frameworks for implementation.'
