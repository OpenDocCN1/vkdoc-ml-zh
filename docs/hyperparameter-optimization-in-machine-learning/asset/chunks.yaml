- fmt: '## Parallel Hyperparameter Optimization


    Both grid search and random search are brute-force methods; they do not depend
    on the previous results to select the next set of hyperparameters. And we can
    use this to our advantage by processing the trials in parallel. The scikit-learn
    implementation of these algorithms provides a parameter, `n_job`, that can be
    set to `-1` to specify that all cores of the local machine should be used.


    In this section we’ll see how we can distribute algorithms like grid search on
    a high-performance computing (HPC) cluster. An HPC cluster is simply a bunch of
    high-end computers (called *nodes*) that are configured so that they can be in
    constant communication with the help of a fast interconnect, providing computing
    power similar to that of a supercomputer. An HPC cluster consists of the following
    components, depicted in Figure [2-3-1](#494613_1_En_2_Chapter.xhtml#Fig6):


    ![../images/494613_1_En_2_Chapter/494613_1_En_2_Fig6_HTML.jpg](images/494613_1_En_2_Chapter/494613_1_En_2_Fig6_HTML.jpg)


    Figure 2-3-1


    HPC cluster


    - *Login node*: From here we can remotely access the cluster using our machine,
    through secure protocols such as Secure Shell (SSH). It is used to upload and
    execute the code.

    - *Data transfer node*: Again, secure protocols such as SSH are used with commands
    like `scp` and `rsync` to transfer large amounts of data from our machine to the
    HCP cluster. The transfer is secured by an encryption tunnel.

    - *Computer nodes*: There are different types of computer nodes, including regular
    ones with hardware specifications similar to those of our personal machines, “fat”
    computer nodes with huge amounts of data storage (in terabytes), and high-end
    nodes consisting of GPUs and CPUs. These nodes together help in computation.

    - *Infinite Band (IB) switch*: This switch enables fast communication between
    nodes, with high throughput and very low latency.

    - *Storage*: Here large files can be stored and can be transferred via the data
    transfer node.


    However, working with high-performance computing clusters is not as simple as
    setting `n_job = -1`, and using clusters to their maximum potential is even difficult.
    We’ll be using the Slurm workload manager, an open source job scheduler for computer
    clusters for queuing, and ipyparallel for parallel computations over multiple
    threads.


    You can use the following code for HPC and Amazon EC2 clusters with minor modifications
    based on the respective requirements.


    Now we’ll again optimize SVM’s hyperparameters C and gamma on the MNIST dataset
    (refer to Appendix [II](https://doi.org/10.1007/978-1-4842-6579-6) to know more
    about MNIST).


    The following code is inspired by the work^([¹](#fn1)) of Dr. Hugues-Yanis Amanieu,
    a data scientist in production engineering at Leclanché.


    First we’ll log in to the login node, using SSH:


    ```

    $ ssh username@ip

    ```


    Now that we are logged in to the HPC cluster, we’ll create a virtual environment:


    ```

    $ virtualenv hpc_tuning

    $ source hpc_tuning/bin/activate

    ```


    And install all the dependencies, slurm, slurm-client, ipyparallel, joblib, ipython,
    and of course scikit-learn in your virtual environment `tuning`. We can alternatively
    download and install them through Anaconda as well (in a conda virtual environment).


    Next we’ll write a shell script (`launch.sh`) in which we’ll use Slurm to schedule
    the jobs:


    ```

    #this will activate the virtualenv

    source hpc_tuning/bin/activate

    #creating a new job profile name for ipython which slurm will use

    profile=job_${JOB_NAME}

    #creates an config file for ipython

    ipython profile create ${profile}

    #starts ip controller

    ipcontroller --ip="*" --profile=${profile} &

    sleep 10

    #srun runs ipengine on all the cores

    srun ipengine --profile=${profile} --location=$(hostname) &

    sleep 25

    #execute the python file, where we''ll define the grid search to #distribute on
    cluster

    python $1 -p ${profile}

    ```


    Let’s explore this code in detail.


    - First we activate a virtual environment where everything is installed from scratch,
    so that we don’t face any dependencies issues.

    - After that, we assign a variable `profile`, where we define a string that will
    be the name/identity of our job.

    - Once the ID is created, we use the `ipython` command to create a profile, which
    initializes a folder containing configuration information.

    - Now we have a controller and engines. The controller schedules and queues the
    jobs, and engines compute the data and store the results. We are using ipython
    for communication between the controller and the engines.

    - The `ipcontroller` command starts the controller and the `ipengine` command
    starts the engines. While starting `ipcontroller`, we need the controller to listen
    to all the engines, and the argument `--ip="*"` allows the controller to listen
    on all interfaces.

    - For engines to connect with the controller, we use `ipengine` with the argument
    `--location=="ip"`, where we provide the IP address of the controller. `ipcontroller`
    creates a file named `ipcontroller-engine.json` that needs to be copied to all
    the engines; however, in our case we assume the engines and the controller share
    the same file system, in which case engines will automatically find the location
    of the `json` file.


    Note in the preceding code that we are using `srun` to run `ipengine`; `srun`
    is a Slurm command that runs `ipengine` on all the available cores. Finally, we
    run the Python script containing the scikit-learn code, and an argument profile
    name is passed.


    Let’s write the Python script (`python_script.py`):


    ```

    import argparse

    import os

    import sys

    import time

    import pandas as pd

    from sklearn.externals.joblib import parallel_backend

    from sklearn.externals.joblib import register_parallel_backend

    from sklearn.externals.joblib import cpu_count

    from sklearn.datasets import load_digits

    from sklearn.model_selection import GridSearchCV

    from sklearn.model_selection import train_test_split

    from sklearn.svm import SVC

    from ipyparallel import Client

    from ipyparallel.joblib import IPythonParallelBackend

    # append file dir path to sys path, so imports from custom function would # work

    FILE_DIR = os.path.dirname(os.path.abspath(__file__))

    sys.path.append(FILE_DIR)

    # argparser to take profile name as argument from our shell script

    parser = argparse.ArgumentParser()

    parser.add_argument("-p", "--profile", default="job_hp_test",

    help="Name of IPython profile to use")

    args = parser.parse_args()

    profile = args.profile

    # counts total number of available cores

    print(cpu_count())

    # Create a Client instance providing the name of profile created on shell script

    c = Client(profile=profile)

    # Ensure all engines(c) are running in the working directory

    c[:].map(os.chdir, [FILE_DIR]*len(c))

    # print list of engine ids

    print(c.ids)

    # restrict all the engines

    bview = c.load_balanced_view()

    register_parallel_backend(''threading'',

    lambda : IPythonParallelBackend(view=bview))

    # loading the data

    digits = load_digits()

    # splitting the data to train and test

    X_train, X_test, y_train, y_test = train_test_split(digits.data,

    digits.target,

    test_size=0.3)

    # prepare the hyperparameter grid

    param_grid = {

    "C": [c*(10**i) for i in range(1,14)],

    "gamma": [gamma*(10**i) for i in range(1,14)]

    }

    # defining classifier with default hyperparameters

    svc = SVC()

    # defining GridSearchCV

    search = GridSearchCV(svc,

    param_grid,

    return_train_score=True,

    n_jobs=len(c))

    # start timer

    since = time.time()

    # using parallel backend to start the parallel processing

    with parallel_backend(''threading''):

    search.fit(X_train, y_train)

    # end the timer

    time_taken = time.time() - since

    # converting and saving the results to .csv file

    print(f"Saving results to {FILE_DIR}")

    results = search.cv_results_

    results = pd.DataFrame(results)

    results.to_csv(os.path.join(FILE_DIR,''scores.csv''))

    print(f"Results Saved!")

    # Display the time taken

    print(f"Tuning Time: {time_taken}")

    ```'
