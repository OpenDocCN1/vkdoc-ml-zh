  raw: '### Dynamic Task Scheduling


    Most of the algorithms implemented in scikit-learn are capable of using ''joblib'',
    which provides thread/process-based distribution over the cores of a single machine.
    Using Dask, we can distribute these algorithms over a cluster, just like we did
    in the HPC cluster example in Chapter [2](#494613_1_En_2_Chapter.xhtml) using
    ipyparallel.


    Dask, being much more flexible, provides support for parallelism on all different
    kinds of distributed systems, as depicted in 3-1-5.


    ![../images/494613_1_En_3_Chapter/494613_1_En_3_Fig5_HTML.jpg](images/494613_1_En_3_Chapter/494613_1_En_3_Fig5_HTML.jpg)


    Figure 3-1-5


    (a) scikit-learn with the help of JobLib can distribute training over cores of
    a single machine. (b) With Dask, the same process can be distributed over cores
    of a single machine or even a cluster of machines


    Let’s take an example of optimizing hyperparameters of support vector machine
    using both serial optimization using scikit-learn and distributing trails using
    Dask and compare the time:


    ```

    from sklearn.datasets import load_digits

    from sklearn.model_selection import GridSearchCV, train_test_split

    from sklearn.svm import SVC

    X, y = load_digits().data, load_digits().target

    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size = 0.3, shuffle=True)

    c = 0.001

    gamma = 1e-10

    param_grid = {

    "C": [c*(10**i) for i in range(1,14)],

    "gamma": [gamma*(10**i) for i in range(1,14)]

    }

    clf = SVC(kernel=''rbf'')

    search = GridSearchCV(clf, param_grid, cv=3)

    ```


    In the preceding code, we have loaded the ‘digits’ dataset, and we’ll be optimizing
    ‘C’ and ‘gamma’ using `GridSearchCV()`. First, let’s use just ScikitLearn example
    without Joblib.


    ```

    >>> import time

    >>> since = time.time()

    >>> model = search.fit(X_train, y_train)

    >>> print(time.time()-since)

    ```


    The total number of trials would be 169 across the grid of hyperparameters, taking
    75.01 seconds. Note that we are running Grid Search serially.


    Now let’s use Dask to parallelize our trials over the cores:


    ```

    >>> import joblib

    >>> import time

    >>> from dask.distributed import Client

    >>> client = Client(processes=False)

    >>> since = time.time()

    >>> with joblib.parallel_backend(''dask'', scatter=[X_train, y_train]):

    model = search.fit(X_train, y_train)

    >>> print(time.time()-since)

    ```


    Now JobLib will use Dask’s client, which is, in this case, a local cluster for
    distribution of 169 possible combinations over the cores. The time taken for the
    same task was 34.73 seconds. This is a huge improvement with just four cores,
    and hence there’s a huge scope of improvement on an actual cluster of machines.
    Check the Dask dashboard to visualize the core usage, as shown in Figure [3-1-6](#494613_1_En_3_Chapter.xhtml#Fig6).


    ![../images/494613_1_En_3_Chapter/494613_1_En_3_Fig6_HTML.jpg](images/494613_1_En_3_Chapter/494613_1_En_3_Fig6_HTML.jpg)


    Figure 3-1-6


    Task Stream pane showing four horizontal bars denoting four cores


    Note


    All of the previous experiments are performed on a local machine, where both the
    scheduler and cluster are the same. In the example presented in the “Dynamic Task
    Scheduling” section, we could use scikit-learn alone to distribute over the cores
    of a single machine instead of using Dask.


    ### Hyperparameter Optimization with Dask


    As we saw in last few examples, we can use Dask for hyperparameter optimization
    to solve both time and memory constraints. Let’s review the algorithms for hyperparameter
    optimization in scikit-learn and their distribution:


    *   We can use plain and simple scikit-learn’s Random Search and Grid Search and
    pass the argument `''n_jobs''=-1` to use all cores on a single machine. This solves
    the compute/time constraint.


    *   We can use scikit-learn and wrap its code in `with parallel_backend(''dask''):`
    as we did in the example in the “Dynamic Task Scheduling” section, be it Random
    Search or Grid Search or any other algorithm implemented with ‘*joblib*’. We can
    either use all cores on a single machine or distribute them over a cluster, depending
    on how dask.distributed’s `client()` is defined. This reduces time even more if
    a cluster is used.


    Now let’s see what else Dask offers us for hyperparameter optimization.


    #### Dask Random Search and Grid Search


    We cannot use Random Search or Grid Search provided by scikit-learn to train a
    large dataset because they do not support ‘partial_fit’. However, Dask gives us
    drop-in replacements for both of these algorithms, `dask_ml.model_selection.GridSearchCV`
    and `dask_ml.model_selection.RandomizedSearchCV`. Interface for respective algorithms
    in both Dask and Scikit-Learn is similar, but the one from Dask implements ‘partial_fit’,
    so that we can wrap a machine learning algorithm from scikit-learn in `Incremental`
    and pass it to these hyperparameter optimization algorithms.


    The setting can not only train the model in chunks of data but also distribute
    it on a cluster, solving both time and memory issues. The steps are pretty much
    a straightforward script, the same as what we did before:


    1.  Define a client.


    2.  Define a search space.


    3.  Make a huge dataset to test our distributed model.


    4.  Train Test Split.


    5.  Define the ML algorithm which uses partial fit, like SGD classifier.


    6.  Wrap the ML algorithm in `Incremental` so that data can be managed and trained
    in chunks while distributing it to cores/cluster.


    7.  Use Grid Search on top of that which is imported from Dask since it implements
    ‘partial_fit’.


    8.  Train the model under `joblib.parallel_backend` so that it can be further
    distributed.


    However, there’s an interesting problem I faced while following these steps. When
    I executed the code I checked the Dask dashboard. The memory started to fill up.
    The problem was due to the accuracy score. After I used accuracy metrics from
    ‘dask_ml’, the problem was solved.


    Let’s check out an example:


    ```

    from dask_ml import datasets

    from dask_ml.wrappers import Incremental

    from dask_ml.model_selection import train_test_split, GridSearchCV

    from dask_ml.metrics import accuracy_score

    from sklearn.metrics import make_scorer

    from sklearn.linear_model import SGDClassifier

    import joblib

    import dask.array as da

    from dask.distributed import Client

    client = Client(processes=False)

    print(client.dashboard_link)

    param_grid = {

    "penalty": [''l1'', ''l2''],

    "tol": [1e-2, 1e-3, 1e-4]

    }

    X, y = datasets.make_classification(n_samples=100000000,

    n_features=7,

    random_state=0,

    chunks=100000)

    # providing an accuracy metrics from ''dask_ml''

    scorer = make_scorer(accuracy_score)

    X_train, X_test, y_train, y_test = train_test_split(X, y)

    clf = SGDClassifier(loss=''log'')

    clf_wrap = Incremental(clf, scoring=scorer)

    searh_clf = GridSearchCV(clf_wrap, param_grid, cv=3)

    with joblib.parallel_backend(''dask''):

    model = searh_clf.fit(X_train, y_train)

    ```


    Note


    After some poking around, I found out that while score calculation by default
    ‘SGDClassifier.score’ was being used which was converting chunks of ‘dask arrays’
    to ‘ndarray’, which was resulting in high memory usage. When I used a scorer from
    ‘dask_ml’, it solved the issue.


    So, you need to take care that the chunks of your data are not converted to ‘numpy
    array’; otherwise it would end up filling memory. The idea of using a Dask dataframe
    and Dask array here is to not fill memory.'
