    - Import all the libraries that were installed previously in our virtual environment.

    - Since we need to use the profile name by which the ipython profile was created,
    we use `argparser` and take the name from the shell script as an argument.

    - Initialize the client, giving it the profile name of the cluster to prepare
    all the engines. `c.ids` is used to get a list of all the engine IDs.

    - Restrict load balancing across all the engines.

    - Before running the algorithm parallelly, we define the back-end name as a string
    (`''threading''`), for which we use the function `register_parallel_backend`;
    later we’ll use `''threading''` while running the training of the model.

    - Load the dataset, split it to train and test, and define the grid for C and
    gamma.

    - Initialize `SVC()` and define `GridSearchCV()`, with `n_jobs` set to either
    `-1` (use all available cores) or `len(total_engines)` (use a defined number of
    cores).

    - We previously defined the name of the back end for parallel computation of jobs
    using `register_parallel_backend` with `''threading''`. We now use that name to
    run `parallel_backend` and Grid Search for ‘C’ and ‘gamma’ for SVM.

    - Save the results.

    - Execute the command `sbatch launch.sh python_script.py`; `sbatch` is a Slurm
    command that submits the written script to Slurm.

    - Transfer the result files using the `scp` command.


    And that is how we can optimize a huge number of hyperparameters on a cluster
    of computers while using it to its maximum potential. You can use random search
    in place of grid search as well. Using HPC will decrease your time consumption
    by a huge amount.


    We reviewed some exhaustive and brute-force methods for hyperparameter optimization
    that would take a really long time if applied to problems like Neural Network
    Architecture Search and are not feasible. In later chapters we’ll see some more
    algorithms and libraries that would be able to handle these complex tasks. However,
    in problems with fewer hyperparameters and a narrower search range, or where as
    a data scientist you can decide the approximate values or reduce the search space
    by looking at the dataset, these algorithms can be fruitful, and using them with
    machines such as those in HPC clusters can even increase their efficiency.


