- fmt: '## Hyperopt-Sklearn


    `Hyperopt-sklearn`^([⁸](#fn8))是一个基于`Hyperopt`的库^([⁹](#fn9))，它使用`Hyperopt`对`scikit-learn`算法进行算法选择和超参数调优。


    该库可以节省大量时间，因为它为`scikit-learn`中提供的算法创建了自己的搜索空间。你可以进行端到端的建模，因为它还提供了数据预处理的算法选择和调优选项（尽管并非所有`scikit-learn`算法都已实现）。


    `hpsklearn`的使用风格与`sklearn`类似，实现了`fit()`、`.score()`和`.predict()`等方法，就像`scikit-learn`的`Grid`/`Random
    Search`一样。提供搜索空间是可选的。让我们看几个例子来更好地理解它。


    ```python

    from sklearn.datasets import load_boston

    from sklearn.model_selection import train_test_split

    from hpsklearn import HyperoptEstimator, any_regressor,

    any_preprocessing, svr

    from hyperopt import tpe, hp

    import math as m

    X, y = load_boston().data, load_boston().target

    X_train, X_test, y_train, y_test = train_test_split(X,y, test_size=0.2)

    model = HyperoptEstimator(regressor=any_regressor(''test1_reg''),

    preprocessing=any_preprocessing(''test1_preprocessing''),

    algo=tpe.suggest,

    verbose=True,

    max_evals=100)

    model.fit(X_train, y_train, n_folds=3, cv_shuffle=True)

    print(model.score(X_test, y_test))

    print(mdoel.best_model())

    ```


    就像`scikit-learn`中的任何其他分类器/回归器一样，我们可以使用`HyperoptEstimator`，这意味着即使在现有代码中，你也只需要修改一行代码即可引入这个超参数调优库。在上面的代码中，我们让`hpsklearn`自由选择任何算法、超参数集以及任何预处理（归一化/标准化等）。然而，我们也可以限制某些算法的调优和预处理选择。例如：


    ```python

    model = HyperoptEstimator(regressor=svr(''test_svr''),

    preprocessing=[],

    algo=tpe.suggest,

    verbose=True,

    max_evals=100)

    ```


    你可以将前面代码中的模型初始化替换为这一行，以便仅对支持向量回归器进行调优，并且不使用任何预处理。或者，你可以像这样更改一个或多个超参数的搜索空间：


    ```python

    space = {''C'':hp.loguniform(''C'',-2*m.log(10),11*m.log(10)),

    ''gamma'':hp.loguniform(''gamma'',-9*m.log(10),3*m.log(10))

    }

    model = HyperoptEstimator(regressor=svr(''test_svr'', **space[''param'']),

    preprocessing=[],

    algo=tpe.suggest,

    verbose=True,

    max_evals=100)

    ```


    在这里，已定义超参数（`C`和`gamma`）的默认搜索空间将被自定义搜索空间覆盖。你可以对预处理执行相同的操作。


    由于该库支持SVM、决策树、KNN等算法，你可以使用`hpsklearn`获得基线准确率，然后使用自定义搜索空间并尝试不同的模型来进一步调优模型。


    ## Hyperas


    另一个极其有用的开源超参数优化库是`Hyperas`^([^(10)](#fn10))，它是`Hyperopt`的一个封装，用于优化`Keras`神经网络的架构。这个库的编写方式可以让你免于为神经网络创建复杂的搜索空间；相反，你可以使用简单的`Keras`代码，并添加少量范围定义。以下是一个帮助你理解`Hyperas`概念的示例：


    ```python

    from hyperopt import Trials, STATUS_OK, tpe

    from keras.datasets import mnist

    from keras.layers.core import Dense, Dropout, Activation

    from keras.models import Sequential

    from keras.utils import np_utils

    import numpy as np

    from hyperas import optim

