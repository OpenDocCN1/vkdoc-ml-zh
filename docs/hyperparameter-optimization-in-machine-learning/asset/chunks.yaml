- fmt: "### Dynamic Task Scheduling\n\nMost of the algorithms implemented in `scikit-learn`\
    \ are capable of using `joblib`, which provides thread/process-based distribution\
    \ over the cores of a single machine. Using `Dask`, we can distribute these algorithms\
    \ over a cluster, just like we did in the HPC cluster example in Chapter [2](#494613_1_En_2_Chapter.xhtml)\
    \ using `ipyparallel`.\n\n`Dask`, being much more flexible, provides support for\
    \ parallelism on all different kinds of distributed systems, as depicted in 3-1-5.\n\
    \n![../images/494613_1_En_3_Chapter/494613_1_En_3_Fig5_HTML.jpg](images/494613_1_En_3_Chapter/494613_1_En_3_Fig5_HTML.jpg)\n\
    \n**Figure 3-1-5**  \n(a) `scikit-learn` with the help of `JobLib` can distribute\
    \ training over cores of a single machine. (b) With `Dask`, the same process can\
    \ be distributed over cores of a single machine or even a cluster of machines.\n\
    \nLet’s take an example of optimizing hyperparameters of support vector machine\
    \ using both serial optimization using `scikit-learn` and distributing trails\
    \ using `Dask` and compare the time:\n\n```\nfrom sklearn.datasets import load_digits\n\
    from sklearn.model_selection import GridSearchCV, train_test_split\nfrom sklearn.svm\
    \ import SVC\nX, y = load_digits().data, load_digits().target\nX_train, X_test,\
    \ y_train, y_test = train_test_split(X, y, test_size = 0.3, shuffle=True)\nc =\
    \ 0.001\ngamma = 1e-10\nparam_grid = {\n\"C\": [c*(10**i) for i in range(1,14)],\n\
    \"gamma\": [gamma*(10**i) for i in range(1,14)]\n}\nclf = SVC(kernel='rbf')\n\
    search = GridSearchCV(clf, param_grid, cv=3)\n```\n\nIn the preceding code, we\
    \ have loaded the `digits` dataset, and we’ll be optimizing `C` and `gamma` using\
    \ `GridSearchCV()`. First, let’s use just `ScikitLearn` example without `Joblib`.\n\
    \n```\n>>> import time\n>>> since = time.time()\n>>> model = search.fit(X_train,\
    \ y_train)\n>>> print(time.time()-since)\n```\n\nThe total number of trials would\
    \ be 169 across the grid of hyperparameters, taking 75.01 seconds. Note that we\
    \ are running Grid Search serially.\n\nNow let’s use `Dask` to parallelize our\
    \ trials over the cores:\n\n```\n>>> import joblib\n>>> import time\n>>> from\
    \ dask.distributed import Client\n>>> client = Client(processes=False)\n>>> since\
    \ = time.time()\n>>> with joblib.parallel_backend('dask', scatter=[X_train, y_train]):\n\
    model = search.fit(X_train, y_train)\n>>> print(time.time()-since)\n```\n\nNow\
    \ `JobLib` will use `Dask`’s client, which is, in this case, a local cluster for\
    \ distribution of 169 possible combinations over the cores. The time taken for\
    \ the same task was 34.73 seconds. This is a huge improvement with just four cores,\
    \ and hence there’s a huge scope of improvement on an actual cluster of machines.\
    \ Check the `Dask` dashboard to visualize the core usage, as shown in Figure [3-1-6](#494613_1_En_3_Chapter.xhtml#Fig6).\n\
    \n![../images/494613_1_En_3_Chapter/494613_1_En_3_Fig6_HTML.jpg](images/494613_1_En_3_Chapter/494613_1_En_3_Fig6_HTML.jpg)\n\
    \n**Figure 3-1-6**  \nTask Stream pane showing four horizontal bars denoting four\
    \ cores.\n\n> **Note**  \n> All of the previous experiments are performed on a\
    \ local machine, where both the scheduler and cluster are the same. In the example\
    \ presented in the “Dynamic Task Scheduling” section, we could use `scikit-learn`\
    \ alone to distribute over the cores of a single machine instead of using `Dask`.\n\
    \n### Hyperparameter Optimization with Dask\n\nAs we saw in last few examples,\
    \ we can use `Dask` for hyperparameter optimization to solve both time and memory\
    \ constraints. Let’s review the algorithms for hyperparameter optimization in\
    \ `scikit-learn` and their distribution:\n\n- We can use plain and simple `scikit-learn`’s\
    \ Random Search and Grid Search and pass the argument `n_jobs=-1` to use all cores\
    \ on a single machine. This solves the compute/time constraint.\n- We can use\
    \ `scikit-learn` and wrap its code in `with parallel_backend('dask'):` as we did\
    \ in the example in the “Dynamic Task Scheduling” section, be it Random Search\
    \ or Grid Search or any other algorithm implemented with `joblib`. We can either\
    \ use all cores on a single machine or distribute them over a cluster, depending\
    \ on how `dask.distributed`’s `client()` is defined. This reduces time even more\
    \ if a cluster is used.\n\nNow let’s see what else `Dask` offers us for hyperparameter\
    \ optimization.\n\n#### Dask Random Search and Grid Search\n\nWe cannot use Random\
    \ Search or Grid Search provided by `scikit-learn` to train a large dataset because\
    \ they do not support `partial_fit`. However, `Dask` gives us drop-in replacements\
    \ for both of these algorithms, `dask_ml.model_selection.GridSearchCV` and `dask_ml.model_selection.RandomizedSearchCV`.\
    \ Interface for respective algorithms in both `Dask` and `Scikit-Learn` is similar,\
    \ but the one from `Dask` implements `partial_fit`, so that we can wrap a machine\
