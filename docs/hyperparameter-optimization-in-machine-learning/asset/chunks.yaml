    and *μ* + 2*σ* covers around 95% of the area and *μ* − 3*σ* and *μ* + 3*σ* covers
    99.7 % of the area.


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig19_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig19_HTML.jpg)


    Figure 1-5-7


    A Gaussian distribution with mean 0 and standard deviation 1


    Here’s the code to sample random values from Gaussian data:


    ```

    from scipy.stats import norm

    import seaborn as sns

    mean = 0

    std_dev = 1

    data = norm.rvs(size=10000,loc=0,scale=1)

    ax = sns.distplot(data,

    bins=100,

    hist_kws={''alpha'':0.8})

    ax.set(xlabel=''Gaussian Distribution '', ylabel="Frequency")

    ```


    Figure [1-5-8](#494613_1_En_1_Chapter.xhtml#Fig20) shows a histogram plotted from
    random values sampled from a Gaussian distribution.


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig20_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig20_HTML.jpg)


    Figure 1-5-8


    Histogram for Gaussian distribution


    #### Exponential Distribution


    Another important distribution is *exponential distribution* . As the name suggests,
    values increase exponentially. There’s a parameter rate (*λ*) which controls the
    slope of distribution.


    ```

    from scipy.stats import expon

    import seaborn as sns

    loc = 10

    lambda_inverse = 1

    data = expon.rvs(size=10000,loc=loc,scale=lambda_inverse)

    ax = sns.distplot(data,

    bins=100,

    hist_kws={''alpha'':0.8})

    ax.set(xlabel=''Exponential Distribution'', ylabel="Frequency")

    ```


    Figure [1-5-9](#494613_1_En_1_Chapter.xhtml#Fig21) shows a histogram for when
    a random value is selected from a lognormal distribution which can be plotted
    using the above code.


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig21_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig21_HTML.jpg)


    Figure 1-5-9


    Histogram for an exponential distribution


    We’ll encounter a lot more distributions in subsequent chapters as we use them.
    We’ll see which hyperparameters are suited for which distributions and why. Now
    that you have an understanding of hyperparameters, in Chapter [2](#494613_1_En_2_Chapter.xhtml)
    we’ll explore some basic hyperparameter tuning methods.


    # 2. Hyperparameter Optimization Using Scikit-Learn


    In the previous chapter, you learned what hyperparameters are and how they affect
    the performance of an algorithm. Now that you know how important it is to tune
    hyperparameters, this chapter introduces you to some simple yet powerful uses
    of algorithms implemented in the scikit-learn library for hyperparameter optimization.
    Scikit-learn is one of the most widely used open source libraries for machine
    learning practices. It’s simple to use and really effective in predictive analysis.


    ## Changing Hyperparameters


    You know from Chapter [1](#494613_1_En_1_Chapter.xhtml) how support vector machine
    (SVM) works. You’ll now see how changing two of the hyperparameters—C, the regularization
    factor, and gamma, the kernel coefficient—affects the results while the kernel
    is fixed (RBF) on the Titanic dataset (Dataset explained in Appendix [I](https://doi.org/10.1007/978-1-4842-6579-6)).


    Figure [2-1(a)](#494613_1_En_2_Chapter.xhtml#Fig1) shows the comparison between
    gamma and C; the lighter color in the heat map represents higher accuracy. We
    see that with higher values of C (10^11) and lower values of gamma (10^-8), we
    get more test accuracy, and with lower values of C (10^4) and relatively higher
    values of gamma (10^-3), we get comparative accuracy. The graph in Figure [2-1(b)](#494613_1_En_2_Chapter.xhtml#Fig1)
    shows that as the value of gamma increases, keeping the C constant at 1, the difference
    between train accuracy (blue line) and test accuracy (orange line) after a certain
    point keeps on increasing, resulting in overfitting of the model, which proves
    that we need to regularize the model by decreasing C.


    ![../images/494613_1_En_2_Chapter/494613_1_En_2_Fig1_HTML.png](images/494613_1_En_2_Chapter/494613_1_En_2_Fig1_HTML.png)


    Figure 2-1


    (a) Heatmap on different values of gamma and C. (b) Changing accuracy as gamma
    increases'
