    ### 概率分布


    有无限多种可能的连续和离散概率分布函数可以对随机值进行采样，因此我们将通过讨论实践中常用的几种分布来缩小范围。概率总是在一个范围内计算的，例如图 1-5-4
    所示的高斯分布示例。


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig16_HTML.jpg](img/494613_1_En_1_Fig16_HTML.jpg)


    图 1-5-4


    均值为 0、标准差为 1 的高斯分布


    在图 1-5-4 中，如果我们想为变量 *x* 采样一个值，*x* 可以取无限多个值。*p*(*x*) 为特定值的概率将为 0。因此，我们讨论的是*概率密度函数*，即一个范围内的概率。例如
    *p*(*x* < 0) = 0.5。因为它占整个分布面积的一半。类似地，-1 到 0 范围内的概率密度可以通过计算面积来获得，而面积可以通过沿连续曲线进行积分来计算。


    这解释了为什么我们需要获取一个范围的概率密度而不是一个点的概率。接下来，我们将使用一个名为 *scipy*.*stats* 的模块来为变量 *x* 采样值，以便讨论一些常用的分布。


    #### 均匀分布


    在*均匀分布*中，如果宽度相同，则不同范围内的概率密度保持不变。图 1-5-5 显示了一个示例。


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig17_HTML.jpg](img/494613_1_En_1_Fig17_HTML.jpg)


    图 1-5-5


    a 和 b 之间的均匀分布


    曲线下的面积为 1。因此，我们可以将高度计算为 1/(*b* − *a*)，其中 *b* 是上限，*a* 是下限。让我们使用 *scipy*.*stats*
    从均匀分布中采样值：


    ```

    from scipy.stats import uniform

    import seaborn as sns

    n = 10000

    start = 10

    width = 10

    data = uniform.rvs(size=n, loc = start, scale=width)

    ax = sns.distplot(data,

    bins=100,

    hist_kws={''alpha'':0.8})

    ax.set(xlabel=''Uniform Distribution '', ylabel="Frequency")

    ```


    图 1-5-6 显示了均匀分布的直方图，其中 a=10 且 b=20。我在这两个数字之间采样了 10,000 个随机值。


