    ## Parallelizing Trials in TPE


    We can exploit TPE even more by parallelizing the trials. Multiple candidates
    can be drawn at once from distribution *l*(*x*), and these can be evaluated in
    parallel. By default, `fmin` is executed serially and uses the argument `trials
    = Trials()`, which uses a list. However, we can use `MongoTrials()` instead to
    evaluate these trials parallelly.


    The first requirement, obviously, is to install MongoDB. After that, there are
    four simple steps to start the asynchronous optimization:


    - When using `fmin`, pass trials as `MongoTrials()`.

    - Start a visible MongoDB server.

    - Execute the Python file.

    - Run `hyperopt-mongo-worker`, which is a worker script placed in bin of your
    Python environment while installing Hyperopt.


    Let’s use `MongoTrials()` for the previous toy example of `f(a, b) = a² - b²`:


    ```python

