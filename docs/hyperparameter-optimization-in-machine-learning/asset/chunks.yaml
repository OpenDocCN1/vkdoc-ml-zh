    ### 神经网络


    一个基本的*神经网络*由节点和节点层构成，这些节点本质上就是前一层输出与权重相乘的结果（详见附录二）。我们将此处的权重和偏置称为*参数*（因为它们由基于数据集的建模算法决定），而将节点数、层数等称为*超参数*（因为我们需要人为干预来决定它们）。


    定义神经网络的架构是当今深度学习从业者面临的最具挑战性的任务之一。架构无法通过暴力搜索发现，因为神经网络的时间复杂度非常高，尝试所有超参数组合是不可能的。因此，创建神经网络架构更像是一门艺术，依赖于逻辑和更先进的超参数调优算法。


    神经网络中可能存在大量不同的超参数，这里我们讨论其中几种：


    *   **层数**：增加层数会提升神经网络的深度，同时也增强了学习更复杂特征的能力。


    *   **节点数**：节点数因层而异，但第一个隐藏层和最后一个隐藏层的节点数必须分别等于输入特征的数量和要预测的类别数量。对于隐藏层，按惯例我们使用 2
    的幂次方作为节点数，即 2、4、8、16、32、64、128、256、512、1024 等。这是因为硬件在以 2 的幂次方存储数字时效率更高，尽管没有证据表明这是选择这类超参数的最优方式。


    *   **批量大小**：如果我们从数据集中抽取一个子样本，它应该能代表整个数据集的属性。这个批次可用于计算梯度并更新权重。我们遍历所有子样本，直到覆盖整个数据集。这样做的目的是节省内存空间。但你需要为子集大小选择最优值，因为批量大小过小会导致在接近最小值时波动更大，而过大则可能引发内存错误。


    *   **激活函数**：激活函数用于在每个节点上引入非线性。在决定激活函数时，我们需要确保几点：它们将被用于成千上万个节点，并且反向传播会使用它们的导数，因此函数及其导数的计算复杂度都应较低。一些广泛使用的激活函数包括
    ReLU、Sigmoid 和 Leaky ReLU。


    *   **损失函数**：损失函数的选择基于输出类型，例如是二分类、多分类、回归等。还有其他因素。例如，在最后一层使用 sigmoid 激活函数并结合二次损失函数可能会导致学习速度减慢。因此，需要留意这类问题。此外，损失函数本身也有可以调优的内部超参数。


    *   **优化器**：在“理解超参数”部分，我们讨论了一种优化方法——梯度下降。还有其他更先进的优化方法，如 Adagrad、Adam 优化器等，这些优化器也包含各种影响整体优化效果的超参数。


    神经网络中还有更多超参数，例如批量归一化、Dropout 等。随着技术的进步，这些变量每隔一段时间就会增加。


    本节旨在让你了解什么是超参数以及它们如何工作。随着我们继续深入，我们将在寻找最优值的过程中讨论更多这类算法及其超参数。


    ## 可能超参数值的分布


    超参数的值可能因其功能而异。对于像网格搜索（在第 2 章讨论）这样的算法，我们会遍历超参数的某些排列组合。但大多数超参数优化算法是随机选取变量的。这些随机值可能属于某种特定类型的分布。例如，我们在“神经网络”部分看到，我们选择层中节点数的值为
    2 的幂次方。因此，我们将集合{2, 4, 8, 16, 32, 64, 128, 256, 512...}视为一种分布。


    提示


    Seeing Theory ([`https://seeing-theory.brown.edu/`](https://seeing-theory.brown.edu/))
    是一个很棒的网站，提供了概率和统计的交互式可视化。请查看该网站的第 3 章，了解概率分布的可视化。


    随机变量可能取值的可能性由概率分布定义。假设我们必须为超参数选择一个随机值；其底层分布可以是以下任何一种：


    *   离散概率分布


    *   连续概率分布


    对于离散变量和连续变量，存在不同类型的概率分布。但在深入探讨这些类型之前，我们先看看什么是离散变量和连续变量。


    ### 离散变量


    一组值中，每个值与下一个值之间存在某个正有限距离，这称为*离散分布*。离散变量可以是有限值，也可以是无限值，具体取决于范围。图 1-5-1 展示了有限离散分布和无限离散分布。


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig13_HTML.jpg](img/494613_1_En_1_Fig13_HTML.jpg)


    图 1-5-1


    两种分布，(a) 有限离散 和 (b) 无限离散


    有限离散值位于两个有限实数之间，如图 1-5-1(a)所示，其值位于区间[−0.4, 1.0]内，步长为 0.2。然而，无限离散值可以延伸到无穷大，每个值与下一个值和前一个值之间仍然保持一个正有限距离。在图
    1-5-1(b)中，值位于区间−0.4, +∞)内，步长仍为 0.2。


    请注意，步长不一定必须相同。它可以是指数级的、递增的等等。图[1-5-2 中的示例展示了一个均匀分布。


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig14_HTML.jpg](img/494613_1_En_1_Fig14_HTML.jpg)


    图 1-5-2


    一个有限分布的例子，*f*(*x*) = *x* + 2，其中 *x* ∈ [0, 5]，每个 *x* 值之间的差为 1


    回顾“支持向量机”部分，超参数 *kernel* 的可能值可以是 *rbf*、*sigmoid*、*linear*、*polynomial* 等。*‘kernel’*
    会有一个有限的值集。这可以被视为一个*有限离散值*的例子。我们可以将这些超参数表示如下：


    *   *rbf* ↔︎ 1


    *   *sigmoid* ↔︎ 2


    *   *linear* ↔︎ 3


    *   等等


    在同一个算法中，我们有另一个超参数 *‘degree’*，其值可以是任何可能的整数。这是一个*无限离散值*的例子。然而，这并不意味着我们要从 −∞ 搜索到
    +∞。结果会在极端值处饱和，而且在无限空间中搜索实际上也是不可能的。因此，我们将使用一个巨大的范围（“巨大”是相对的；在某些情况下 10 可能很大，而在其他情况下
    10¹⁰⁰可能很大）来包含该分布。

