    ## 树结构帕森估计器


    树结构帕森估计器（Tree-structured Parzen estimator）是一种流行的贝叶斯优化方法，它使用期望改进采集函数^(⁷)。在 TPE
    中，*p*(*y*| *x*) 是通过 *p*(*x*| *y*) 和 *p*(*y*) 依据贝叶斯定理建模的，这与直接建模 *p*(*y*| *x*) 的高斯过程（GP）不同。


    ![$$ p\left(y|x\right)=\frac{\left(p\left(x|y\right)\ast p(y)\right)}{p(x)} $$](img/494613_1_En_4_Chapter_TeX_Equ1.png)


    （公式 4.2.1）


    *p*(*x*| *y*) 表示为：


    *p*(*x*| *y*) = *l*(*x*) *如果* *y* < *y** （公式 4.2.2）


    以及


    *p*(*x*| *y*) = *g*(*x*) *如果* *y* >= *y** （公式 4.2.3）


    这里，*y** 是一个分位数，被称为*阈值损失分数*。*l*(*x*) 和 *g*(*x*) 是超参数分布。因此，对于某些超参数集 (*x*[i])，如果预测的损失分数
    (*y*) 小于 *y**，则意味着这些集合位于分布 *l*(*x*) 中；如果 *y* 大于 *y**，则它们位于分布 *g*(*x*) 中。我们可以通过图
    4-2-1 清楚地理解这一点。


    ![../images/494613_1_En_4_Chapter/494613_1_En_4_Fig2_HTML.jpg](img/494613_1_En_4_Fig2_HTML.jpg)


    图 4-2-1


    在超参数 *x*[*i*0] 上，低于 *y*^* 的点来自分布 *l*(*x*)，高于 *y*^* 的点来自分布 *g*(*x*)


    选择 *y** 的值，使其大于 *f* (*x*) 的最佳观测值，即 *y* < *y**，因此我们必须找到位于 *l*(*x*) 分布中的超参数集，以便预测的损失分数小于
    *y**。


    设


    *p*(*y* < *y*^∗) = *γ* （公式 4.2.4）


    并且连续边际概率为


    ![$$ p(x)={\int}_Rp\left(x|y\right).p(y). dy $$](img/494613_1_En_4_Chapter_TeX_Equ2.png)


    （公式 4.2.5）


    现在我们优化 EI：


    ![$$ {EI}_{y\ast }(x)={\int}_{-\infty}^{y^{\ast }}\left({y}^{\ast }-y\right).p\left(y|x\right).
    dy $$](img/494613_1_En_4_Chapter_TeX_IEq1.png) = ![$$ {\int}_{-\infty}^{y^{\ast
    }}\left({y}^{\ast }-y\right)\frac{p\left(x|y\right).p(y)}{p(x)}. dy $$](img/494613_1_En_4_Chapter_TeX_IEq2.png)
        （公式 4.2.6）


    利用公式 4.2.2、4.2.3 和 4.2.4，公式 4.2.5 可以写成如下形式：


    ![$$ p(x)={\int}_Rp\left(x|y\right).p(y). dy=\gamma .l(x)+\left(1-\gamma \right).g(x)
    $$](img/494613_1_En_4_Chapter_TeX_Equ3.png)


    （公式 4.2.7）


    现在，公式 4.2.6 中的分母项被简化为公式 4.2.7，它不依赖于 *y*。让我们简化分子：


    ![$$ {\int}_{-\infty}^{y^{\ast }}\left({y}^{\ast }-y\right).p\left(x|y\right).p(y).
    dy=l(x){\int}_{-\infty}^{y^{\ast }}\left({y}^{\ast }-y\right).p(y). dy=\gamma
    .{y}^{\ast }.l(x)-l(x){\int}_{-\infty}^{y^{\ast }}p(y). dy $$](img/494613_1_En_4_Chapter_TeX_Equ4.png)


    （公式 4.2.8）


    将公式 4.2.7 和 4.2.8 结合起来，我们得到期望改进的值：


    ![$$ {EI}_{y\ast }(x)=\frac{\gamma .{y}^{\ast }.l(x)-l(x){\int}_{-\infty}^{y^{\ast
    }}p(y). dy}{\gamma .l(x)+\left(1-\gamma \right).g(x)} $$](img/494613_1_En_4_Chapter_TeX_Equc.png)


    进一步简化，我们得到：


    ![$$ {EI}_{y\ast }(x)=\frac{\ l(x)\left[\gamma .{y}^{\ast }-{\int}_{-\infty}^{y^{\ast
    }}p(y). dy\right]}{\gamma .l(x)+\left(1-\gamma \right).g(x)} $$](images/494613_1_En_4_Chapter/494613_1_En_4_Chapter_TeX_Equd.png)


    因此：


    ![$$ {EI}_{y\ast }(x)\propto {\left[\gamma +\frac{g(x)}{l(x)}.\left(1-\gamma \right)\right]}^{-1}
    $$](images/494613_1_En_4_Chapter/494613_1_En_4_Chapter_TeX_Equ5.png)


    （公式 4.2.9）


    公式 4.2.9 明确告诉我们，期望改进与比率 *g*(*x*)/*l*(*x*) 成反比。这意味着我们更希望我们的超参数 (*x*) 位于分布 *l*(*x*)
    中，而不是 *g*(*x*) 中，以增加 EI。


    因此，在每次迭代中，从 *l*(*x*) 中抽取候选值，并返回损失分数最小的那个，从而选择最佳超参数。


    现在你已经基本了解了在贝叶斯方法中我们如何对代理函数和采集函数进行建模，接下来我们将介绍一个实现了 TPE 的开源库：Hyperopt。


    ## Hyperopt


    Hyperopt 是一个出色的开源库，用于分布式异步超参数优化，它实现了诸如随机搜索、TPE 和自适应 TPE 等算法。在本节中，我们将重点介绍如何使用 Hyperopt
    库来优化超参数。


    Hyperopt 可以处理复杂的搜索空间，包括对离散值和连续值的搜索。我们可以使用该库在算法之间进行搜索，并为这些算法找到最佳的超参数集。在处理深度学习问题时，我们面对的是数百维度的空间，为了充分利用深度网络的潜力，我们需要超参数设置达到最优。使用网格搜索或随机搜索并不可行，因为每次训练网络的成本相当高。在这种情况下，使用贝叶斯优化可能是最佳选择。


    要使用 Hyperopt，我们需要一个搜索空间和一个目标函数。让我们看一个简单的例子：


    ![$$ f\left(a,b\right)={a}²-{b}² $$](img/494613_1_En_4_Chapter_TeX_Eque.png)


    这里，我们最小化 *f* (*a*, *b*)，其中 *a* ∈ [−2, 3] 且 *b* ∈ [−1, 2]。


    让我们使用 Hyperopt 来优化这个问题：


    ```

    from hyperopt import tpe, fmin, hp

    def objective_func(args):

    a = args[''a'']

    b = args[''b'']

    f = a**2 - b**2

    return f

    range_a = hp.uniform(''a'', -2, 3)

    range_b = hp.uniform(''b'', -1, 2)

    space = {''a'': range_a,

    ''b'': range_b}

    best = fmin(objective_func, space, algo=tpe.suggest, max_evals=100)

    ```


    上述代码使用 TPE 来找到使 *f* (*a*, *b*) 最小的 *a* 和 *b* 的最佳值。我们可以看到，函数在 *a* = 0 和 *b* = 2
    时取得最小值，最小值为 *f*[*min*] = −4。让我们看看 Hyperopt 在 1000 次试验中是如何逼近这个问题的。


    图 4-3-1 显示，*a* 和 *b* 的值分别趋近于 0 和 2，而 *f* 的值在早期试验中就趋近于 −4。这是一个简单的函数，其最优值是整数。对于更复杂的函数，其值必须从连续分布中选取，TPE
    被证明是高效的。


    ![../images/494613_1_En_4_Chapter/494613_1_En_4_Fig3_HTML.jpg](img/494613_1_En_4_Fig3_HTML.jpg)


    图 4-3-1


    使用 TPE 在 1000 次迭代中绘制 *f*、*a* 和 *b* 的值


    如前所述，要使用 Hyperopt，我们必须定义一个目标函数和搜索空间。在前面的代码中，我们的目标函数将超参数作为输入，并输出一个我们希望最小化的分数。为了创建搜索空间，对于每个超参数，我们必须使用
    Hyperopt 对象形式的分布。我们有多种选择，例如均匀分布、正态分布、对数均匀分布、对数正态分布等，我们将在下一节中更详细地讨论这些。最后，我们将目标函数和搜索空间都传递给
    `fmin()` 函数，同时使用 TPE 算法进行优化。我们还需要决定试验次数，就像我们在使用随机搜索时那样。该函数返回一个字典，其中包含了所有迭代中的最佳试验结果。

