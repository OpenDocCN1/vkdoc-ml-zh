    让我们逐步分析上述 Python 脚本中发生的情况：


    *   导入之前在我们的虚拟环境中安装的所有库。


    *   由于我们需要使用创建 ipython 配置文件的配置文件名称，因此我们使用 argparser 并从 shell 脚本中获取该名称作为参数。


    *   初始化客户端，为其提供集群的配置文件名称，以准备所有引擎。`c.ids` 用于获取所有引擎 ID 的列表。


    *   限制所有引擎之间的负载均衡。


    *   在并行运行算法之前，我们将后端名称定义为一个字符串（`''threading''`），为此我们使用函数 `register_parallel_backend`；稍后我们将在运行模型训练时使用
    `''threading''`。


    *   加载数据集，将其拆分为训练集和测试集，并定义 C 和 gamma 的网格。


    *   初始化 `SVC()` 并定义 `GridSearchCV()`，其中 `n_jobs` 设置为 `-1`（使用所有可用核心）或 `len(total_engines)`（使用指定数量的核心）。


    *   我们之前使用 `register_parallel_backend` 和 `''threading''` 定义了用于并行计算作业的后端名称。现在我们使用该名称运行
    `parallel_backend` 和网格搜索，以寻找 SVM 的 ''C'' 和 ''gamma'' 参数。


    *   保存结果。


    *   执行命令 `sbatch launch.sh python_script.py`；`sbatch` 是一个 Slurm 命令，用于将编写的脚本提交给
    Slurm。


    *   使用 `scp` 命令传输结果文件。


    这就是我们如何在充分利用计算机集群潜力的同时，优化大量超参数的方法。你也可以使用随机搜索来代替网格搜索。使用 HPC 将大幅减少你的时间消耗。


    我们回顾了一些详尽且暴力的超参数优化方法，这些方法如果应用于神经网络架构搜索等问题，将耗费极长的时间，并且不可行。在后续章节中，我们将看到更多能够处理这些复杂任务的算法和库。然而，在超参数较少、搜索范围较窄的问题中，或者当数据科学家可以通过查看数据集来决定近似值或缩小搜索空间时，这些算法可能会很有效，并且将它们与
    HPC 集群等机器结合使用，甚至可以提高其效率。


    脚注 1


    # 3. 解决时间和内存限制


    在调整超参数时，我们面临两个主要问题：


    *   **内存限制**：有时我们必须处理数百 GB 的数据。我们无法在 RAM 中存储如此大量的数据。在训练神经网络时，我们会分批发送数据。一种可能的解决方案是使用更大的内存，但这并不总是可行的。


    *   **时间/计算限制**：假设我们的数据可以放入内存，但我们正在训练一个深度神经网络（DNN），或者超参数优化的搜索空间巨大。这可能会消耗大量时间。


    解决这两个问题的一个方法是使用更好的硬件。例如，在深度神经网络的情况下，可以使用图形处理单元（GPU）、张量处理单元（TPU）等来加速训练。尽管更好的硬件可以在一定程度上解决问题，但并非总是能在如此高端的机器上工作。在第
    2 章中，我们将网格搜索分布到 HPC 集群上，这解决了时间限制问题，但 HPC 集群是一种昂贵的资源。还有一些更简单的方法，即使用不同类型的集群。在本章中，我们将讨论比
    HPC 更简单的替代方案，这些方案可以同时处理内存和时间限制。我们将主要关注训练的分发，以有效利用可用资源。


    我们将从 Dask 开始，它非常适合分发机器学习过程，并且与 scikit-learn 配合得最好。然后，我们将看到使用 PyTorch Distributed
    和 Horovod 等包来分发神经网络的简单方法。


    ## Dask


    Dask ([`https://dask.org/`](https://dask.org/)) 是 Python 中用于并行计算的库。它使用*动态任务调度*，类似于我们在第
    2 章中使用 ipyparallel 在 HPC 集群上所做的工作，这解决了计算限制的问题。然而，在分发方面，Dask 比 ipyparallel 灵活得多。使用动态任务调度，我们可以将训练分发到不同的机器上（而不仅仅是同一台机器上的多个核心）。


    但是，假设我们遇到内存限制，因为我们的数据太大，无法一次性加载到内存中。Dask 通过提供*并行集合*（如 Dask Dataframe、Dask array
    等）来解决这个问题，这些集合将数据集分发给可以用于分布式环境或解决超内存问题的块。使用 Dask 执行的进程通常包含以下方面：


    *   *集合 → 任务图 → 多线程/多处理或分发*


    首先，将 Dask 集合传递给任务图，该任务图是所有操作（如预处理、超参数优化、评估等）的完整流水线。在这里，任务可以并行化或以串行方式排列。最后，调度程序可以使用动态任务调度来执行任务图。如果使用单台机器，则可以使用多线程/多处理在核心上并行化；在集群上，任务图可以分发到节点上。在图
    3-1-1 所示的任务图示例中，操作 (a) 和 (b) 是独立的，因此两者可以并行执行。(a) 中的任务 1、2 和 3 将串行执行。如果 (a) 在 (b)
    之前完成，任务 7 将等待 (b) 完成。


    ![../images/494613_1_En_3_Chapter/494613_1_En_3_Fig1_HTML.jpg](img/494613_1_En_3_Fig1_HTML.jpg)


    图 3-1-1


    任务图示例

