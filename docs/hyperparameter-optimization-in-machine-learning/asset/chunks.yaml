    # 3. Solving Time and Memory Constraints


    We face two major problems while tuning hyperparameters:


    - **Memory constraint**: Sometimes we have to deal with hundreds of gigabytes
    of data. We cannot store such a huge amount of data in RAM. While training a neural
    network, we send data in batches. One of the possible solutions is larger memory,
    which is not feasible always.

    - **Time/computation constraint**: Let’s say our data fits into memory, but we
    are training a deep neural network (DNN) or there is a huge search space for hyperparameter
    optimization. This can consume a great amount of time.


    One solution to both of these problems is to use better hardware. For example,
    in the case of a deep neural network, graphics processing units (GPUs), tensor
    processing units (TPUs), and so forth can be used to accelerate the training.
    Although better hardware will solve the problem up to some extent, it’s not always
    possible to work on such high-end machines. In Chapter [2](#494613_1_En_2_Chapter.xhtml),
    we distributed grid search over an HPC cluster, which solved the time constraint,
    but an HPC cluster is a costly resource. There are ways much easier, using different
    types of clusters. In this chapter, we’ll discuss easier alternatives to HPC that
    deal with both memory and time constraints. We’ll mainly focus on distribution
    of training to efficiently use available resources.


    We’ll start with Dask, which is great for distributing machine learning processes
    and works best with `scikit-learn`. We’ll then see easy ways to distribute neural
    networks using packages like PyTorch Distributed and Horovod.


    ## Dask


    Dask ([`https://dask.org/`](https://dask.org/)) is a library in Python for parallel
    computation. It uses *dynamic task scheduling*, similar to what we did using `ipyparallel`
    on the HPC cluster in Chapter [2](#494613_1_En_2_Chapter.xhtml), which addresses
    the problem of computational constraint. However, Dask is much more flexible than
    `ipyparallel` for distribution. Using dynamic task scheduling, we can distribute
    training over different machines (not just over multiple cores on the same machine).


    But suppose we have a memory constraint because our data is so huge that it can’t
    be loaded into memory at once. Dask solves this by offering *parallel collections*
    like Dask Dataframe, Dask array, and so forth, which distributes dataset into
    chunks that can either be used on a distributed environment or solve larger-than-memory
    problems. A process executed using Dask typically contains the following aspects:


    - *Collection → Task Graph → Multi-Threading/Processing or Distribution*


    First, a Dask collection is passed to a task graph, which is the complete pipeline
    of all the operations like preprocessing, hyperparameter optimization, evaluation,
    and so on. Here tasks can be parallelized or arranged in a serial manner. Finally,
    the scheduler can execute task graphs using dynamic task scheduling. If a single
    machine is used, multithreading/multiprocessing can be used to parallelize it
    over cores, and on a cluster, a task graph can be distributed over nodes. In the
    example of a task graph shown in Figure [3-1-1](#494613_1_En_3_Chapter.xhtml#Fig1),
    operations (a) and (b) are independent, so both of them can be executed parallelly.
    Task 1, 2, and 3 inside (a) will be executed serially. If (a) is completed before
    (b), task 7 will wait for (b) to get completed.


    ![../images/494613_1_En_3_Chapter/494613_1_En_3_Fig1_HTML.jpg](images/494613_1_En_3_Chapter/494613_1_En_3_Fig1_HTML.jpg)


    Figure 3-1-1


    An example of a task graph'
