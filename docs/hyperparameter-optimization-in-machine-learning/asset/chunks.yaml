- fmt: '### TPOT


    The Tree-based Pipeline Optimization Tool (`TPOT`) is an AutoML framework that
    uses genetic programming to optimize the machine learning pipeline.


    As we have discussed, data preprocessing typically consists of data cleaning (label
    encoding, dropping unimportant columns, and scaling), which is something we must
    take care of beforehand. The more complex tasks, such as feature selection, feature
    reduction, and feature construction, are handled by `TPOT`. It further selects
    the best model with the best set of hyperparameters. Figure [5-2-2](#494613_1_En_5_Chapter.xhtml#Fig4)
    shows the features that are automated by `TPOT`.


    Genetic algorithms are slow but excel at finding the best route for a given dataset.
    We would need to train for a long time before reaching the best set of hyperparameters.


    Understanding `TPOT` first requires understanding what genetic algorithms are.
    As the name suggests, the concept of genetic algorithms is derived from Darwin’s
    theory of natural selection. A genetic algorithm continuously evolves, by selecting
    the best algorithm. For the best algorithm it goes to its children doing some
    random modifications in hyperparameters and evaluating models to find the best
    fit.


    ![../images/494613_1_En_5_Chapter/494613_1_En_5_Fig4_HTML.jpg](images/494613_1_En_5_Chapter/494613_1_En_5_Fig4_HTML.jpg)


    Figure 5-2-2


    `TPOT` covers around 80% of the job


    Now we’ll look at an example of how `TPOP` works, using `TPOT` for the Iris dataset,
    since it’s already a clean dataset:


    ```

    from tpot import TPOTClassifier

    from sklearn.datasets import load_iris

    from sklearn.model_selection import train_test_split

    import numpy as np

    iris = load_iris()

    X_train, X_test, y_train, y_test = train_test_split(

    iris.data.astype(np.float64),

    iris.target.astype(np.float64),

    test_size=0.25

    )

    ```


    Loading the dataset and splitting it to train and test.


    ```

    tpot = TPOTClassifier(generations=5, population_size=50, verbosity=2)

    tpot.fit(X_train, y_train)

    ```


    We train `TPOT` for five generations; the default is 100 generations. The interface
    of this framework is quite similar to `scikit-learn`.


    And voila! I achieved 100% accuracy on the test set on the trained model.


    To make things even easier, we have an option to export the selected pipeline
    to a Python script, which can then easily be deployed.


    ```

    tpot.export(''tpot_iris_pipeline.py'')

    ```


    The preceding line of code auto-generates the following `tpot_iris_pipeline.py`
    file:


    ```

    import numpy as np

    import pandas as pd

    from sklearn.model_selection import train_test_split

    from sklearn.neural_network import MLPClassifier

    # NOTE: Make sure that the outcome column is labeled ''target'' in the data #
    file

    tpot_data = pd.read_csv(''PATH/TO/DATA/FILE'', sep="COLUMN_SEPARATOR",

    dtype=np.float64)

    features = tpot_data.drop(''target'', axis=1)

    training_features, testing_features, training_target, testing_target = \

    train_test_split(features, tpot_data[''target''],

    random_state=None)

    # Average CV score on the training set was: 0.9913043478260869

    exported_pipeline = MLPClassifier(alpha=0.1, learning_rate_init=0.1)

    exported_pipeline.fit(training_features, training_target)

    results = exported_pipeline.predict(testing_features)

    ```


    For more time we optimize, the better the results we’ll get.


    There are many more libraries for AutoML, such as `auto-sklearn`, `H2O AutoML`,
    and `AutoKeras`. AutoML not only is beneficial to data scientists to accelerate
    the process but also has enabled people with no knowledge of coding to use machine
    learning. AutoML certainly holds a great position in the future of artificial
    intelligence.


    As you’ve witnessed in this chapter, hyperparameter optimization plays a huge
    role in AutoML, enabling us to generate the best machine learning models in the
    least amount of time.


    To conclude this book, I wish you success as you optimize your hyperparameters
    using more advanced methods like Bayesian optimization and pruning algorithms
    instead of manually tuning or grid search. Happy optimization!


