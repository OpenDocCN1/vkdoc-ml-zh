    # 5. Optuna and AutoML


    We can now create an efficient model using the techniques that were discussed
    in the previous chapters. Bayesian optimization goes a long way in finding optimal
    hyperparameters. This chapter provides an overview of the Optuna framework and
    discusses further the role of hyperparameter optimization in automated machine
    learning. We’ll use Optuna to create our own little AutoML script. And then we’ll
    explore the Tree-based Pipeline Optimization Tool (TPOT), an AutoML tool that
    uses genetic programming to optimize machine learning pipelines.


    ## Optuna


    Like Hyperopt discussed in Chapter [4](#494613_1_En_4_Chapter.xhtml), Optuna^([^(11)](#fn11))
    is open source library that uses Bayesian optimization. The underlying algorithms
    Optuna uses are the same as in Hyperopt, but the Optuna framework is much more
    flexible. Optuna can be easily used with PyTorch, Keras, scikit-learn, Apache
    MXNet, and other libraries. The API is very similar to Hyperopt’s API, with a
    few changes. Let’s dive into an example:


    ```

    from sklearn.datasets import load_digits

    from sklearn.model_selection import train_test_split, cross_val_score

    from sklearn.neighbors import KNeighborsClassifier

    from sklearn.svm import SVC

    import optuna

    from optuna.samplers import TPESampler

    digits = load_digits()

    X_train, X_test, y_train, y_test = train_test_split(digits.data,

    digits.target,

    test_size=0.3)

    def objective_func(trial):

    classifier_name = trial.suggest_categorical("classifier",

    ["SVC", "RandomForest"])

    if classifier_name == "SVC":

    c = trial.suggest_loguniform("svc_c", 1e-2, 1e+11)

    gamma = trial.suggest_loguniform("svc_gamma", 1e-9, 1e+3)

    kernel = trial.suggest_categorical("svc_kernel",

    [''rbf'',''poly'',''rbf'',''sigmoid''])

    degree = trial.suggest_categorical("svc_degree", range(1,15))

    clf = SVC(C=c, gamma=gamma, kernel=kernel, degree=degree)

    else:

    algorithm = trial.suggest_categorical("algorithm",

    [''ball_tree'', "kd_tree"])

    leaf_size = trial.suggest_categorical("leaf_size",

    range(1,50))

    metric = trial.suggest_categorical("metric",

    ["euclidean","manhattan",

    "chebyshev","minkowski"])

    clf = KNeighborsClassifier(algorithm=algorithm,

    leaf_size=leaf_size,

    metric=metric)

    clf.fit(X_train, y_train)

    val_acc = clf.score(X_test, y_test)

    return val_acc

    study = optuna.create_study(direction=''maximize'', sampler=TPESampler())

    study.optimize(objective_func, n_trials=100)

    best_trial = study.best_trial.value

    print(f"Best trial  accuracy: {best_trial}")

    print("parameters for best trail are :")

    for key, value in study.best_trial.params.items():

    print(f"{key}: {value}")

    ```


