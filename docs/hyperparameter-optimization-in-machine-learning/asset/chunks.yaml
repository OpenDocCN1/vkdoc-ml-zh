    your algorithm needs to keep in memory information from the previous data points.
    The image on the left in Figure [1-1-1](#494613_1_En_1_Chapter.xhtml#Fig1) is
    an example of a classification problem. We need labeled data in order to learn
    to draw a seperation between them.


    *   *Unsupervised machine learning algorithms* : These kinds of problems do not
    have a target value. Suppose you have to group the hypothetical spaceships in
    clusters according to their features; you would use a *clustering algorithm* to
    do so. Unsupervised machine learning is used to detect patterns among the dataset.
    You don’t know which cluster is which, but you do know that all the spaceships
    in one cluster are similar to each other; the right image in Figure [1-1-1](#494613_1_En_1_Chapter.xhtml#Fig1)
    shows an example.


    *   *Reinforcement machine learning algorithms* : A reinforcement machine learning
    algorithm learns from the environment; if it performs well, it gets a reward,
    and the goal is to maximize the reward. For example, consider the Chrome “running
    dinosaur” game (go to `chrome://dino/` and press the spacebar). The dinosaur continuously
    runs toward obstacles. To increase your score, you have to press the spacebar
    at the precise time to make the dinosaur jump over the obstacles. Here those points
    are the reward and jumping is the variable that needs to be decided at the right
    time. In problems like this, we use reinforcement machine learning algorithms.
    The *Q-learning algorithm* is one example of a reinforcement machine learning
    algorithm. One of the most brilliant applications of reinforcement machine learning
    is a robot learning to walk through trial and error.


    There’s a lot more to machine learning. You need to be familiar with the basics
    of machine learning before jumping into hyperparameters and their optimization
    methodologies. If you are new to machine learning or if you want to brush up on
    the basic concepts, refer to Appendix I and Appendix II. Appendix I covers practical
    application of machine learning and some of its basic aspects. Appendix II gives
    you a brief introduction to fully connected neural networks and the PyTorch and
    Keras frameworks for implementation.'
  trans: '

    ## 机器学习简介


    *机器学习*是研究无需明确定义执行代码，而是利用数据进行学习的算法。机器学习使算法能够在无需人工干预的情况下自主学习。


    计算机科学家、时任卡内基梅隆大学教授的汤姆·M·米切尔对机器学习定义如下：“如果计算机程序在任务*T*中的性能（由性能度量*P*衡量）随着经验*E*而提升，则称该程序从经验*E*中学习。”


    机器学习算法根据所需解决问题的类型可分为多个子类。在此我将介绍三种主要类型：


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig1_HTML.jpg](img/494613_1_En_1_Fig1_HTML.jpg)


    图 1-1-1


    监督式机器学习（左）与无监督式机器学习（右）示例


    *   *监督式机器学习算法*：提供带标签的数据，我们基于这些数据构建模型，以根据变量预测此类标签。例如，假设你想购买一艘宇宙飞船。多个因素会帮助你决定购买哪艘飞船：成本、飞船尺寸、建造质量、是否配备超光速引擎、武器系统等等。现在我们拥有数百艘飞船的数据，包含这些特征信息及其价格，因此我们构建一个模型来预测价格。这属于回归问题。*回归问题*具有连续的目标值，如果目标值是离散的，我们则称之为*分类问题*。第三类问题涉及时间戳，即*时间序列预测*，其中下一个数据点在一定程度上依赖于先前信息，因此算法需要记住先前数据点的信息。图
    1-1-1 左侧的图像是一个分类问题的示例。我们需要带标签的数据才能学习如何在它们之间画出分隔线。


    *   *无监督式机器学习算法*：这类问题没有目标值。假设你需要根据特征将假设的宇宙飞船进行聚类分组，你会使用*聚类算法*来完成。无监督式机器学习用于检测数据集中的模式。你不知道哪个簇对应什么，但你知道同一簇中的所有飞船彼此相似；图
    1-1-1 右侧的图像展示了一个示例。


    *   *强化机器学习算法*：强化机器学习算法从环境中学习；如果表现良好，它会获得奖励，目标是最大化奖励。例如，考虑 Chrome 浏览器中的“奔跑恐龙”游戏（访问
    `chrome://dino/` 并按空格键）。恐龙不断向障碍物奔跑。为了提高分数，你必须在精确的时间按下空格键，让恐龙跳过障碍物。这里的分数就是奖励，跳跃则是需要在正确时机决定的变量。在类似问题中，我们使用强化机器学习算法。*Q-learning
    算法*是强化机器学习算法的一个例子。强化机器学习最出色的应用之一是通过试错学习行走的机器人。


    机器学习远不止于此。在深入探讨超参数及其优化方法之前，你需要熟悉机器学习的基础知识。如果你是机器学习新手，或者想重温基本概念，请参考附录 I 和附录 II。附录
    I 涵盖了机器学习的实际应用及其一些基本方面。附录 II 简要介绍了全连接神经网络以及用于实现的 PyTorch 和 Keras 框架。

    '
- fmt: '# Understanding Hyperparameters


    There are two kinds of variables when dealing with machine learning algorithms,
    depicted in Figure [1-2-1](#494613_1_En_1_Chapter.xhtml#Fig2):


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig2_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig2_HTML.jpg)


    Figure 1-2-1


    The box inside represents model parameters, where the machine learning algorithm
    is at work. The outer box represents the hyperparameters, which we have to set
    before algorithm starts training.


    - **Parameters**: These are the parameters that the algorithm tunes according
    to dataset that is provided (you don’t have a say in that tuning).

    - **Hyperparameters**: These are the higher-level parameters that you set manually
    before starting the training, which are based on properties such as the characteristics
    of the data and the capacity of the algorithm to learn.


    I’ll present a machine learning algorithm as an example to show you the difference
    between a parameter and a hyperparameter. Let’s take a very basic algorithm, linear
    regression.


    The hypothesis function in linear regression is as follows:


    ![$$ f\left(\varTheta, {\varTheta}_c\right)=\varTheta .x+{\varTheta}_c $$](images/494613_1_En_1_Chapter/494613_1_En_1_Chapter_TeX_Equ1.png)


    (Equation 1.2.1)


    Here, `x` and `Θ` are vectors, `x` being a vector of features and `Θ` being the
    weights assigned to each feature, and `Θ[c]` is a constant bias.


    Let’s consider as an example the classic problem of house price prediction. The
    price of a house is dependent on certain factors, including square footage of
    the house, number of bedrooms, number of washrooms, crime rate in the locality,
    distance from public transportation (bus station, airport, railway station), school
    district, distance to the nearest hospital, and so forth. All of these can be
    considered as features; that is, the `x` vector in our hypothesis function in
    Equation 1.2.1. The price of a house increases, for example, as the number of
    bedrooms increases and the square footage increases; these features would have
    positive weightage (`Θ`). The price of a house decreases, for example, the greater
    the distance to schools and hospitals and the higher the crime rate in the neighborhood;
    they would have negative `Θ`. In Equation 1.2.1, `f(Θ, Θ[c])` gives the price
    of the house.


    We can use an optimization algorithm to find the best value of `Θ` for each feature
    based on the previous observations. So, the `Θ` vector is controlled and adjusted
    by the optimization algorithm (for instance, gradient descent). These weights
    are **parameters**.


    Let’s discuss the optimization function gradient descent, which will help you
    to understand hyperparameters.


    We’ll start by assigning some random numbers (i.e., **weights**) to our parameters.
    For one observation, if we have vector `x` (with numerical values for each feature)
    and vector `Θ` (random numerical values for each weight), by using Equation 1.2.1,
    we get the value of `f(Θ, Θ[c])`. This will be our prediction, which will be some
    random value (`p[1]′`) because weights are random. And we have a true value of
    the house price (`p[1]`).


    We can calculate the difference, `C[1]` (for first observation), `|p[1] - p[1]′|`.
    This is a loss which we have to reduce. Similarly, if we calculate the average
    of summation of loss (`C`) for all the observation:


    ![$$ C\left(\varTheta, \varTheta c\right)=\left(1/n\right)\sum \mid {p}_i-{p_i}^{''}\mid
    $$](images/494613_1_En_1_Chapter/494613_1_En_1_Chapter_TeX_Equ2.png)


    (Equation 1.2.2)


    Equation 1.2.2 is termed as loss function, the goal of optimization function is
    to reduce the value of `C`, so we can give more accurate predictions. The loss
    function is dependent on weights and bias, as depicted in Figure [1-2-2](#494613_1_En_1_Chapter.xhtml#Fig3).


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig3_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig3_HTML.jpg)


    Figure 1-2-2


    Loss curves in three dimensions, with `x` and `y` axes being weights and `z` axis
    the loss.


    Three-dimensional curves in Figure [1-2-2](#494613_1_En_1_Chapter.xhtml#Fig3)
    can be possible representations of a loss function. Remember we started our weights
    and biases with random values; now we need to change those values such that loss
    moves to its minima. As per calculus, `C` changes as follows:


    ![$$ \varDelta C\cong \sum \left(\delta C/{\delta \varTheta}_i\right)\ast {\varDelta
    \varTheta}_i $$](images/494613_1_En_1_Chapter/494613_1_En_1_Chapter_TeX_Equ3.png)


    (Equation 1.2.3)


    `i = {0, n}`, `Θ[0]` being `Θ[c]`.


    We’ll represent `[(δC/δΘ[0]), (δC/δΘ[1])...]` as vector and `[ΔΘ[0], ΔΘ[1]...]`
    as vector `ΔΘ`; hence:


    ![$$ \varDelta C\cong \ddot{\nabla}C\ast \varDelta \Theta $$](images/494613_1_En_1_Chapter/494613_1_En_1_Chapter_TeX_Equ4.png)


    (Equation 1.2.4)


    But suppose the following:


    ![$$ \varDelta \Theta =-\alpha \ddot{\nabla}C $$](images/494613_1_En_1_Chapter/494613_1_En_1_Chapter_TeX_Equ5.png)


    (Equation 1.2.5)


    Substituting it in Equation 1.2.4, we get this result:


    ![$$ \varDelta C\cong -\alpha \ast {\left(\ddot{\nabla}C\right)}^2 $$](images/494613_1_En_1_Chapter/494613_1_En_1_Chapter_TeX_Equa.png)


    Here, `α` being a positive number, change in loss will always be negative, and
    we want our loss to be negative always. So Equation 1.2.5 stands true.


    Therefore by Equation 1.2.5, we get


    ![$$ \left({\varTheta_i}^{''}-{\varTheta}_i\right)=-\alpha \ast \delta C/{\delta
    \varTheta}_i $$](images/494613_1_En_1_Chapter/494613_1_En_1_Chapter_TeX_Equb.png)


    ![$$ \therefore {\varTheta_i}^{''}=\kern0.5em {\varTheta}_i-\alpha \ast \delta
    C/{\delta \varTheta}_i $$](images/494613_1_En_1_Chapter/494613_1_En_1_Chapter_TeX_Equ6.png)


    (Equation 1.2.6)


    Where `Θ[i]′` is the new updated value for weight `Θ[i]`. In Equation 1.2.6, the
    updated value of weight `Θ[i]′` is dependent on the previous value of weight (`Θ[i]`),
    the gradient (`δC/δΘ[i]`), and a positive number `α`; `α` here is one of the hyperparameters
    for gradient descent. It controls the performance of the algorithm. For each observation,
    we run this updating equation and decrease the loss while changing values of weights,
    eventually reaching the minima for the loss function.'
