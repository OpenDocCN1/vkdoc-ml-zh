    ## Hyperopt


    Hyperopt is a brilliant open source library for distributed asynchronous hyperparameter
    optimization that implements algorithms like random search, TPE, and adaptive
    TPE. In this section we’ll focus on how we can use the Hyperopt library to optimize
    hyperparameters.


    Hyperopt handles awkward search spaces, which includes searching over both discrete
    and continuous values. We can use the library to search between algorithms and
    find the best set of hyperparameters for those algorithms. When working on problems
    in deep learning, we deal in hundreds of dimensions, and to exploit the full potential
    of deep networks, we need the hyperparameter setting to be optimal. Using grid
    search or random search would not be an option, because each training of the network
    is quite costly. In such cases, using Bayesian optimization can be the best option.


    To use Hyperopt we need a search space and an objective function. Let’s take a
    simple example:


    ![$$ f\left(a,b\right)={a}^2-{b}^2 $$](images/494613_1_En_4_Chapter/494613_1_En_4_Chapter_TeX_Eque.png)


    Here, we minimize *f* (*a*, *b*) such that *a* ∈ [−2, 3] and *b* ∈ [−1, 2].


    Let’s use Hyperopt to optimize this problem:


    ```

    from hyperopt import tpe, fmin, hp

    def objective_func(args):

    a = args[''a'']

    b = args[''b'']

    f = a**2 - b**2

    return f

    range_a = hp.uniform(''a'', -2, 3)

    range_b = hp.uniform(''b'', -1, 2)

    space = {''a'': range_a,

    ''b'': range_b}

    best = fmin(objective_func, space, algo=tpe.suggest, max_evals=100)

    ```


    The preceding piece of code uses TPE to find the best values of *a* and *b* such
    that *f* (*a*, *b*) is minimum. We can see that function would be minimum at *a* = 0
    and *b* = 2, and the minimum value would be *f*[*min*] =  − 4\. Let’s see how
    Hyperopt in 1000 trials approached the problem.


    Figure [4-3-1](#494613_1_En_4_Chapter.xhtml#Fig3) shows that the values of *a*
    and *b* are saturating over 0 and 2 respectively, and the value of *f* is saturating
    over −4 in the early trials. This was an easy function where optimal values were
    integers. For more complicated functions where values must be picked from a continuous
    distribution, TPE proves to be efficient.


    ![../images/494613_1_En_4_Chapter/494613_1_En_4_Fig3_HTML.jpg](images/494613_1_En_4_Chapter/494613_1_En_4_Fig3_HTML.jpg)


    Figure 4-3-1


    Plotting value of *f*, *a* and *b* over 1000 iterations using TPE


    As mentioned earlier, to use Hyperopt we must define an objective function and
    search space. In the previous code, our objective function takes hyperparameters
    as inputs and outputs a score that we want to minimize. To create the search space,
    for each hyperparameter we must use distribution in the form of a Hyperopt object.
    We have a wide variety of options, uniform, normal, loguniform, lognormal, and
    so on, which we’ll discuss in more detail in the next section. Finally, we pass
    both the objective function and search space to the `fmin()` function while using
    the algorithm TPE for optimization. We also decide the number of trials, just
    as we did when using random search. A dictionary is returned that give the best
    trials out of all the iterations.'
