    model.add(Dropout({{uniform(0, 0.8)}}))

    model.add(Activation({{choice([''relu'', ''elu''])}}))

    if {{choice([''one'', ''two''])}} == ''two'':

    model.add(Dense({{choice([32, 64, 256, 512, 1024])}}))

    model.add(Dropout({{uniform(0, 0.8)}}))

    model.add(Activation({{choice([''relu'', ''elu''])}}))

    ```


    If the number of chosen layers is two, only then will it create another layer.


    Hyperas is a very simple and easy-to-use wrapper around Hyperopt, and you can
    use it to quickly tune your models, but if you want more flexibility, use Hyperopt,
    which works wonders even with the most complex search spaces.


    In this chapter you learned how Bayesian hyperparameter optimization works and
    how you can use Hyperopt in your problems. These techniques can easily increase
    your time efficiency and optimize your resource utilization.


