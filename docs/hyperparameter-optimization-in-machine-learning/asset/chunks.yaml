- fmt: '# Sequential Model-Based Global Optimization


    It is notable that in machine learning, functions are expensive and slow to train
    and evaluate. In this section we’ll look at sequential model-based global optimization
    (`SMBO`) to solve the problem of hyperparameter optimization. `SMBO` uses the
    approach of Bayesian optimization, which is used to keep track of previous evaluations
    and select the subsequent set of hyperparameters based on a probabilistic model.


    ![$$ p\left(y|x\right) $$](images/494613_1_En_4_Chapter/494613_1_En_4_Chapter_TeX_Equa.png)


    Our objective function (machine learning algorithm) being `f`, `y` is the score
    calculated by evaluating `f` on the set of hyperparameters `x`. In Bayesian optimization,
    essentially there are four important aspects (defined after the following step
    list): search space, objective function, probabilistic regression model, and acquisition
    function.


    Whole Bayesian optimization can be summarized in the following steps:


    1. Build a regression model.

    2. Initialize some random sets of hyperparameters (in the case of the first trial,
    because we need to feed initial hyperparameters from somewhere).

    3. Evaluate the model on the set of hyperparameters suggested by the acquisition
    function (if the first trial, choose hyperparameters from step 2) and calculate
    the score on the objective function.

    4. Update the surrogate model as per the new suggested hyperparameters and scores.

    5. Repeat steps 3 and 4, for a defined number of iterations.


    A `search space` (`X`), as you learned in Chapter [1](#494613_1_En_1_Chapter.xhtml),
    is a defined range where we provide hyperparameter optimization algorithms a range
    to choose. Depending on the hyperparameter, ranges can be continuous or discrete.
    For example, choosing a kernel function in SVM is a discrete hyperparameter, but
    gamma is chosen from a continuous distribution. Search spaces can be really complicated.
    For example, choosing the number of nodes in each hidden layer in a neural network
    depends on the number of hidden layers.


    An `objective function` (`f`) is a function that trains a machine learning model
    on a given set of hyperparameters and the output is either an accuracy score or
    a loss score depending on the acquisition function. In the following example,
    we are calculating the accuracy score, if the returned value is minimized, we''ll
    maximize the accuracy score by minimizing its negative.


    ```

    X, y = load_data()  # X and y are some preprocessed data

    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size = 0.3)

    def objective_function(hyperparameters):

    C = hyperparameters["C"]

    gamma = hyperparameters["gamma"]

    model = SVC(C=C, gamma=gamma)

    model.fit(X_train, y_train)

    score = model.score(X_test, y_test)

    # since we want to maximize score, taking it''s negative

    return -score

    ```


    `Probabilistic Regression Model` (`p(y|x)` or `M`) also called Surrogate function
    is built using previous evaluations and is a probabilistic modeling of the objective
    function, so each iteration updates the surrogate by evaluating hyperparameters
    on the objective function. A surrogate function is *less costly to evaluate* in
    comparison with an objective function, and a surrogate function decides the next
    set of hyperparameters to be evaluated by the objective function, thus reducing
    the cost of optimization. A surrogate can be formulated by different methods,
    such as Gaussian process (`GP`), Random forest, or tree-structured Parzen estimator
    (`TPE`). Here’s a brief overview of how these surrogates are formed:


    - In Gaussian process, function `f` is assumed to be a realization of Gaussian
    distribution, where predictions follow a normal distribution. `GP` models `p(y|x)`
    directly.

    - In `TPE`, `p(y|x)` is modeled on both `p(x|y)` and `p(y)`. We’ll discuss `TPE`
    in more detail later in this chapter.


    An `acquisition function` (`S`) selects the next set of hyperparameters using
    the surrogate model and the predicted loss score on the previous set of hyperparameters.
    There are several acquisition functions, such as probability of improvement, expected
    improvement, conditional entropy of minimizer, and bandit-based criteria. The
    most commonly used is expected improvement:


    ![$$ {EI}_{y\ast }(x):= {\int}_{-\infty}^{y\ast}\mathit{\max}\left({y}^{\ast }-y,0\right).p\left(y|x\right).
    dy $$](images/494613_1_En_4_Chapter/494613_1_En_4_Chapter_TeX_Equb.png)


    Here, `EI` is being modeled by surrogate and the loss score. `y*` is some threshold
    value, while `y = f(x)` is the score obtained from the objective function on the
    proposed set of hyperparameters `x`. `p(y|x)` is the surrogate model. A positive
    value of the preceding integral means that chances are good that the proposed
    hyperparameters would yield better results. On the proposed set `x`, if `y` increases
    negatively, `EI` will be positive, hence indicating a better choice of hyperparameters.


    Here is a generalized pseudo-code template of how the `SMBO` method works:


    ![../images/494613_1_En_4_Chapter/494613_1_En_4_Figa_HTML.jpg](images/494613_1_En_4_Chapter/494613_1_En_4_Figa_HTML.jpg)


    In this pseudo-code, `f` is the objective function, `X` is the search space for
    hyperparameters, `S` is the acquisition function, and `M` is the regression model
    (surrogate).


    First we initialize `D` with some random samples from the search space; `D` store
    history of evaluations in the form of (`x[i]`, `y[i]`), where `x[i]` represents
    the subsequent sets of hyperparameters and `y[i]` represents the loss scores.


    We now run the loop for defined number of trials `T`. First the surrogate is updated
    using history `D`. Now `S` suggests a set of hyperparameters `xi`. `xi` is sent
    to `f` and a loss score is calculated. History is now saved in `D`, which would
    be used again to update the surrogate.


    After `T` trials, we would have the best set of hyperparameters.


    You don’t have to implement these methods, because all the probabilistic regression
    models can be found implemented in different libraries. For example, Hyperopt^([³](#fn3))
    implements a `TPE`, Spearmint^([⁴](#fn4)) and `MOE`^([⁵](#fn5)) implement a Gaussian
    process, and `SMAC`^([⁶](#fn6)) implements a random forest-based surrogate.


    Next we’ll discuss in detail the working of the tree-structured Parzen estimator
    along with the expected improvement acquisition function.'
