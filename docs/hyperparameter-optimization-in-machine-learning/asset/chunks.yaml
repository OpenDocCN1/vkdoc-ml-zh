- fmt: '### Continuous Variables


    *Continuous distribution* is a set of infinite possible values lying between two
    real numbers, as depicted in Figure [1-5-3](#494613_1_En_1_Chapter.xhtml#Fig15).


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig15_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig15_HTML.jpg)


    Figure 1-5-3


    Infinite numbers lie between 1.0 and 2.0


    Again taking an example from the “Support Vector Machine” section, we have hyperparameters
    like `C` and `gamma` in SVM, the values of which lie on a continuous distribution;
    that is, we can have infinite possible values between a range.


    ### Probabilistic Distributions


    There are infinite possible continuous and discrete probabilistic distribution
    functions to sample random values, so we’ll narrow the scope by discussing a few
    commonly used in practice. Probability is always calculated between a range, such
    as in the example Gaussian distribution shown in Figure [1-5-4](#494613_1_En_1_Chapter.xhtml#Fig16).


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig16_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig16_HTML.jpg)


    Figure 1-5-4


    A Gaussian distribution with mean 0 and standard deviation 1


    In Figure [1-5-4](#494613_1_En_1_Chapter.xhtml#Fig16), if we want to sample a
    value for variable `x`, there are infinite values that `x` can assume. The probability
    for `p(x)` to be a specific value would be 0. So we talk in terms of *probability
    density function*, which are probabilities in a range. For example `p(x < 0) =
    0.5`. Since it’s half of the area from the whole distribution. Similarly, probability
    density in the range -1 to 0 can be calculated by using the area, which can be
    calculated using integration along the continuous curve.


    This explains why we need to get the probability density of a range instead of
    a value. Next we’ll use a module named `scipy.stats` to sample values for variable
    `x` for purposes of discussing some commonly used distributions.


    #### Uniform Distribution


    In *uniform distribution*, probability density remains the same across ranges
    if the width is the same. Figure [1-5-5](#494613_1_En_1_Chapter.xhtml#Fig17) shows
    an example.


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig17_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig17_HTML.jpg)


    Figure 1-5-5


    A uniform distribution between a and b


    The area under the curve is 1. So we can calculate the height as `1/(b - a)`,
    where `b` is the upper limit and `a` is the lower limit. Let’s use `scipy.stats`
    to sample values from the uniform distribution:


    ```

    from scipy.stats import uniform

    import seaborn as sns

    n = 10000

    start = 10

    width = 10

    data = uniform.rvs(size=n, loc = start, scale=width)

    ax = sns.distplot(data,

    bins=100,

    hist_kws={''alpha'':0.8})

    ax.set(xlabel=''Uniform Distribution '', ylabel="Frequency")

    ```


    Figure [1-5-6](#494613_1_En_1_Chapter.xhtml#Fig18) shows the histogram for the
    uniform distribution, where `a=10` and `b=20`. I have sampled 10,000 random values
    between two numbers.


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig18_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig18_HTML.jpg)


    Figure 1-5-6


    Histogram for uniform distribution


    #### Gaussian Distribution


    A *Gaussian distribution* (or *normal distribution*) is one of the most commonly
    observed distributions in nature. Most of the machine learning algorithms assume
    the dataset to be Gaussian; that is, less number of outliers and most data concentrated
    in clusters. Lesser frequency on extremities and higher frequency on the mean.


    For a mean (`μ`) of 0 and standard deviation (`σ`) of 1, you can see a Gaussian
    distribution in Figure [1-5-4](#494613_1_En_1_Chapter.xhtml#Fig16). Note that
    on the `x` axis, if you mark `μ - σ` and `μ + σ`, as in Figure [1-5-7](#494613_1_En_1_Chapter.xhtml#Fig19),
    you’ll find that it covers approximately 68% of the area. Similarly, `μ - 2σ`
    and `μ + 2σ` covers around 95% of the area and `μ - 3σ` and `μ + 3σ` covers 99.7%
    of the area.


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig19_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig19_HTML.jpg)


    Figure 1-5-7


    A Gaussian distribution with mean 0 and standard deviation 1


    Here’s the code to sample random values from Gaussian data:


    ```

    from scipy.stats import norm

    import seaborn as sns

    mean = 0

    std_dev = 1

    data = norm.rvs(size=10000,loc=0,scale=1)

    ax = sns.distplot(data,

    bins=100,

    hist_kws={''alpha'':0.8})

    ax.set(xlabel=''Gaussian Distribution '', ylabel="Frequency")

    ```


    Figure [1-5-8](#494613_1_En_1_Chapter.xhtml#Fig20) shows a histogram plotted from
    random values sampled from a Gaussian distribution.


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig20_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig20_HTML.jpg)


    Figure 1-5-8


    Histogram for Gaussian distribution


    #### Exponential Distribution


    Another important distribution is *exponential distribution*. As the name suggests,
    values increase exponentially. There’s a parameter rate (`λ`) which controls the
    slope of distribution.


    ```

    from scipy.stats import expon

    import seaborn as sns

    loc = 10

    lambda_inverse = 1

    data = expon.rvs(size=10000,loc=loc,scale=lambda_inverse)

    ax = sns.distplot(data,

    bins=100,

    hist_kws={''alpha'':0.8})

    ax.set(xlabel=''Exponential Distribution'', ylabel="Frequency")

    ```


    Figure [1-5-9](#494613_1_En_1_Chapter.xhtml#Fig21) shows a histogram for when
    a random value is selected from a lognormal distribution which can be plotted
    using the above code.


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig21_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig21_HTML.jpg)


    Figure 1-5-9


    Histogram for an exponential distribution


    We’ll encounter a lot more distributions in subsequent chapters as we use them.
    We’ll see which hyperparameters are suited for which distributions and why. Now
    that you have an understanding of hyperparameters, in Chapter [2](#494613_1_En_2_Chapter.xhtml)
    we’ll explore some basic hyperparameter tuning methods.


    # 2. Hyperparameter Optimization Using Scikit-Learn


    In the previous chapter, you learned what hyperparameters are and how they affect
    the performance of an algorithm. Now that you know how important it is to tune
    hyperparameters, this chapter introduces you to some simple yet powerful uses
    of algorithms implemented in the `scikit-learn` library for hyperparameter optimization.
    `Scikit-learn` is one of the most widely used open source libraries for machine
    learning practices. It’s simple to use and really effective in predictive analysis.


    ## Changing Hyperparameters


    You know from Chapter [1](#494613_1_En_1_Chapter.xhtml) how support vector machine
    (SVM) works. You’ll now see how changing two of the hyperparameters—`C`, the regularization
    factor, and `gamma`, the kernel coefficient—affects the results while the kernel
    is fixed (RBF) on the Titanic dataset (Dataset explained in Appendix [I](https://doi.org/10.1007/978-1-4842-6579-6)).


