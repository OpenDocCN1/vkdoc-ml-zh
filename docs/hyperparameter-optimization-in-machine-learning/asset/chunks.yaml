  trans: '

    ## 理解超参数


    在处理机器学习算法时，存在两种变量，如图 1-2-1 所示：


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig2_HTML.jpg](img/494613_1_En_1_Fig2_HTML.jpg)


    图 1-2-1


    内部的方框代表模型参数，机器学习算法在此处运行。外部的方框代表超参数，我们必须在算法开始训练之前设置好它们。


    *   ***参数***：这些是算法根据所提供的数据集进行调整的参数（你对此调整过程没有发言权）。

    *   ***超参数***：这些是你在开始训练之前手动设置的更高级别的参数，其设置依据包括数据特征以及算法的学习能力等属性。


    我将以一个机器学习算法为例，向你展示参数与超参数之间的区别。我们以一个非常基础的算法——线性回归为例。


    线性回归中的假设函数如下：


    ![$$ f\left(\varTheta, {\varTheta}_c\right)=\varTheta .x+{\varTheta}_c $$](img/494613_1_En_1_Chapter_TeX_Equ1.png)


    （公式 1.2.1）


    这里，*x* 和 Θ 是向量，*x* 是特征向量，Θ 是分配给每个特征的权重，而 Θ[c] 是一个常数偏置。


    我们以经典的房价预测问题为例。房价取决于某些因素，包括房屋面积、卧室数量、卫生间数量、所在地区的犯罪率、与公共交通（公交站、机场、火车站）的距离、学区、与最近医院的距离等等。所有这些都可以视为特征；也就是公式
    1.2.1 中假设函数里的 *x* 向量。例如，随着卧室数量增加和房屋面积增大，房价会上升；这些特征将具有正的权重（Θ）。而距离学校和医院越远、社区犯罪率越高，房价则会下降；这些特征将具有负的
    Θ。在公式 1.2.1 中，f(Θ, Θ[c]) 给出了房价。


    我们可以使用优化算法，根据先前的观测数据为每个特征找到最佳的 Θ 值。因此，Θ 向量由优化算法（例如梯度下降）控制和调整。这些权重就是***参数***。


    接下来，我们讨论一下优化函数——梯度下降，这将有助于你理解超参数。


    我们首先为参数分配一些随机数（即*权重*）。对于一个观测样本，如果我们有向量 *x*（每个特征都有数值）和向量 Θ（每个权重都有随机数值），通过使用公式 1.2.1，我们得到
    f(Θ, Θ[c]) 的值。这将是我们预测的值，由于权重是随机的，这个预测值将是一个随机值（p[1]′）。同时，我们拥有房价的真实值（p[1]）。


    我们可以计算差值 C[1]（对于第一个观测样本），即 |p[1]-p[1]′|。这是一个我们需要减小的损失。类似地，如果我们计算所有观测样本的损失（C）之和的平均值：


    ![$$ C\left(\varTheta, \varTheta c\right)=\left(1/n\right)\sum \mid {p}_i-{p_i}^{''}\mid
    $$](img/494613_1_En_1_Chapter_TeX_Equ2.png)


    （公式 1.2.2）


    公式 1.2.2 被称为损失函数，优化函数的目标是减小 C 的值，这样我们就能给出更准确的预测。损失函数依赖于权重和偏置，如图 1-2-2 所示。


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig3_HTML.jpg](img/494613_1_En_1_Fig3_HTML.jpg)


    图 1-2-2


    三维空间中的损失曲线，x 轴和 y 轴为权重，z 轴为损失


    图 1-2-2 中的三维曲线可能是损失函数的几种表现形式。请记住，我们是从随机值开始初始化权重和偏置的；现在我们需要改变这些值，使得损失趋向其最小值。根据微积分，C
    的变化如下：


    ![$$ \varDelta C\cong \sum \left(\delta C/{\delta \varTheta}_i\right)\ast {\varDelta
    \varTheta}_i $$](img/494613_1_En_1_Chapter_TeX_Equ3.png)


    （公式 1.2.3）


    *i* = {0, *n*}，其中 Θ[0] 为 Θ[c]


    我们将 [(δC/δΘ[0]), (δC/δΘ[1])...] 表示为向量，将 [ΔΘ[0], ΔΘ[1]...] 表示为向量 ΔΘ；因此：


    ![$$ \varDelta C\cong \ddot{\nabla}C\ast \varDelta \Theta $$](img/494613_1_En_1_Chapter_TeX_Equ4.png)


    （公式 1.2.4）


    但假设如下：


    ![$$ \varDelta \Theta =-\alpha \ddot{\nabla}C $$](img/494613_1_En_1_Chapter_TeX_Equ5.png)


    （公式 1.2.5）


    将其代入公式 1.2.4，我们得到如下结果：


    ![$$ \varDelta C\cong -\alpha \ast {\left(\ddot{\nabla}C\right)}² $$](img/494613_1_En_1_Chapter_TeX_Equa.png)


    这里，由于 α 是一个正数，损失的变化将始终为负，而我们希望损失始终为负。因此公式 1.2.5 成立。


    所以，根据公式 1.2.5，我们得到：


    ![$$ \left({\varTheta_i}^{''}-{\varTheta}_i\right)=-\alpha \ast \delta C/{\delta
    \varTheta}_i $$](img/494613_1_En_1_Chapter_TeX_Equb.png)


    ![$$ \therefore {\varTheta_i}^{''}=\kern0.5em {\varTheta}_i-\alpha \ast \delta
    C/{\delta \varTheta}_i $$](img/494613_1_En_1_Chapter_TeX_Equ6.png)


    （公式 1.2.6）


    其中 Θ[i]′ 是权重 Θ[i] 更新后的新值。在公式 1.2.6 中，权重 Θ[i]′ 的更新值依赖于权重的先前值（Θ[i]）、梯度（δC/δΘ[i]）以及一个正数
    α；这里的 α 是梯度下降的超参数之一。它控制着算法的性能。对于每个观测样本，我们运行这个更新方程，在改变权重值的同时减小损失，最终使损失函数达到最小值。

    '
- fmt: '# The Need for Hyperparameter Optimization


    In the previous section, we used a positive number `α` in Equation 1.2.6 to control
    the algorithm. This `α` is called the *learning rate* in the gradient descent
    algorithm. It controls the rate by which loss reaches its minima. Figures [1-3-1](#494613_1_En_1_Chapter.xhtml#Fig4),
    [1-3-2](#494613_1_En_1_Chapter.xhtml#Fig5), and [1-3-3](#494613_1_En_1_Chapter.xhtml#Fig6)
    demonstrate how, as described in following figures.


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig6_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig6_HTML.jpg)


    Figure 1-3-3


    Optimal value of `α`


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig5_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig5_HTML.jpg)


    Figure 1-3-2


    Large value of `α`


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig4_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig4_HTML.jpg)


    Figure 1-3-1


    Small value of `α`


    In Figure [1-3-1](#494613_1_En_1_Chapter.xhtml#Fig4) the value of `α` is small;
    it will reach the convergence point, but the `ΔΘ` (that is, the change in weights)
    will be so small that a huge number of steps would be required, hence increasing
    time. A large value of learning rate (`α`) will change loss drastically, hence
    overshooting and leading to divergence, as shown in Figure [1-3-2](#494613_1_En_1_Chapter.xhtml#Fig5).
    However, if we find an optimal value of `α`, we’ll be able to reach the convergence
    in less time and without overshooting, as represented in Figure [1-3-3](#494613_1_En_1_Chapter.xhtml#Fig6).
    And that is the reason we need to tune `α` to its most efficient value, and this
    process of optimization is called *hyperparameter tuning*.


    In more advanced variants of the gradient descent algorithm, we start with bigger
    steps (that is, a greater value of learning rate) to save time, and as we reach
    the convergence point, we decrease the value to avoid overshooting. But the factor
    by which we decrease `α` is now another hyperparameter. So, now you understand
    the importance of tuning these hyperparameters.


    To tune such hyperparameters, you must have a good understanding of the algorithm
    and how these hyperparameters are affecting the performance. Even if you plan
    to use hyperparameter tuning algorithms (introduced in later chapters), it’s very
    important to set a good starting point and ending point. This will save you a
    lot of time and boost the performance of your algorithm.


    # Algorithms and Their Hyperparameters


    In this section I’ll discuss some basic machine learning algorithms to help you
    understand how their hyperparameters work. I’ll discuss these hyperparameters
    with `scikit-learn` conventions, but since they are generic, you can use them
    for other implementations or even self-implemented algorithms. I won’t go deep
    into mathematics but will give you enough to get an intuition of how they affect
    the algorithm. In Chapter [2](#494613_1_En_2_Chapter.xhtml), we’ll look at how
    a bad set of hyperparameters can result in a poor model, whereas a good set creates
    an excellent machine learning model.


    ## K-Nearest Neighbor


    The K-nearest neighbor (KNN) algorithm can be used as a supervised or unsupervised
    machine learning algorithm and can be applied to classification, regression, clustering,
    and outlier detection problems. KNN assumes similar points are in closer proximity,
    as depicted in Figure [1-4-1](#494613_1_En_1_Chapter.xhtml#Fig7).


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig7_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig7_HTML.jpg)


    Figure 1-4-1


    A classification dataset with two dimensions when used with KNN shows the decision
    boundaries


    K-nearest neighbor finds the `K` (number of nearest points) labeled samples in
    the closest proximity to the point that is to be predicted. This `K` can be defined
    by the user. And the closest proximity, hence the distance, can be calculated
    by different metrics, such as Euclidean distance, Manhattan distance, and so on.
    To find these nearest points, indexing algorithms like `kd-tree` and `ball tree`
    are used. Let’s discuss these hyperparameters.


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig8_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig8_HTML.jpg)


    Figure 1-4-2


    Top image with `k=3` and bottom image with `k=15`


    - **K number of nearest neighbor**: We set the value of `K`, which is a positive
    integer that decides the number of labeled samples from the training dataset that
    are to be considered to predict the new data point. Figure [1-4-2](#494613_1_En_1_Chapter.xhtml#Fig8)
    shows how increasing the `K` can result in smoother boundaries. And when `k=3`,
    boundaries are more constrained.


    - **Weights**: We can either give our nearest neighbors equal priority or decide
    their weights on the basis of distance from the query point; the further the point,
    the lesser the weightage.


    - **Indexing algorithm**: Indexing algorithms are used to map the nearest points.
    Since brute force would result in distance computation of all the pairs of data
    points in a dataset, we use tree-based indexing algorithms like `kd-tree` and
    `ball tree`. `kd-tree` partitions data in cartesian axes and `ball tree` in nested
    hyper-sphere. When the number of dimensions is higher, `ball tree` is more efficient
    than `kd-tree`.


    - **Distance metric**: A metric is to be used to calculate the distance between
    points. It can be Euclidean or Manhattan or higher orders of the Minkowski metric.'
