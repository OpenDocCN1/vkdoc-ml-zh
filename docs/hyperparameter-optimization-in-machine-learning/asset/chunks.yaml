  raw: '### Visualization


    Optuna provides elegant visualization. Figure [5-1-1](#494613_1_En_5_Chapter.xhtml#Fig1)
    is generated by Optuna using *optuna*. *visualization*. *plot* _ *optimization* _ *history*(*study*).
    You can pass the `study` object and it’ll create a graph. You can point on each
    scatter point and observe different hyperparameters used. There are even more
    visualization options.


    Callbacks, an argument in *study*.*optimize()* which invokes callback after each
    trial. Using this you can visualize progress on dashboards like *tensorboardX*
    in real time.


    Callbacks work something like this:


    ```

    import optuna

    from optuna.samplers import TPESampler

    def log(study, trial):

    print(f"Trial No.={trial.number}, HP_Set={trial.params}, \

    Score={trial.value}")

    print(f"Best Value ={study.best_value}")

    # def objective_func()

    study = optuna.create_study(sampler=TPESampler())

    study.optimize(objective_func, n_trials=100, callbacks=[log])

    ```


    It’s really easy to work with. You can write these results in the dashboard and
    they’ll get updated after each trial.


    ### Distributed Optimization


    Just like Hyperopt, Optuna supports distributed optimization, but working with
    Optuna’s implementation is easier than working with Hyperopt’s implementation.
    Let’s how we can configure it:


    ```

    study = optuna.create_study(study_name=''distributed_test'',

    storage=''database_url'',

    load_if_exists=True)

    ```


    Define database url while instantiating ‘*create* _ *study*()’. And set ‘load_if_exits=True’
    this instead of creating a new study would look for a previous study named “distributed_test”.
    That way, every time a worker starts, it won’t create a new study but instead
    look for the existing one, and thus won’t start training from scratch.


    For a comprehensive comparison of Hyperopt and Optuna, refer to the following
    article by Jakub Czakon, Senior Data Scientist at Neptune.ai: “Optuna vs Hyperopt:
    Which Hyperparameter Optimization Library Should You Choose?”^([^(12)](#fn12)).


    Now, let’s explore an example of how we can optimize the hyperparameters of a
    neural network using Optuna. We’ll be working with the MNIST dataset and Keras. We
    start by importing libraries and split the data to train and test set.


    ```

    from keras.datasets import mnist

    from keras.layers.core import Dense, Dropout, Activation

    from keras.models import Sequential

    from keras.utils import np_utils

    import numpy as np

    import optuna

    from optuna.samplers import TPESampler

    (x_train, y_train), (x_test, y_test) = mnist.load_data()

    x_train = x_train.reshape(60000, 784)

    x_test = x_test.reshape(10000, 784)

    x_train = x_train.astype(''float32'')

    x_test = x_test.astype(''float32'')

    x_train /= 255

    x_test /= 255

    classes = 10

    input_shape = 784

    y_train = np_utils.to_categorical(y_train, classes)

    y_test = np_utils.to_categorical(y_test, classes)

    x_train, y_train, x_test, y_test, input_shape, classes

    ```


    ```

    def log(study, trial):

    print(f"Trial No.={trial.number}, HP_Set={trial.params}, \

    Score={trial.value}")

    print(f"Best Value ={study.best_value}")

    def objective_func(trial):

    model = Sequential()

    hidden_layer_unit_choice = [32, 64, 256, 512, 1024]

    hidden_layers = trial.suggest_int(''hidden_layers'', 1, 6)

    model.add(Dense(units=trial.suggest_categorical(''layer1'', [8, 16]),

    input_shape=(input_shape, ),

    name=''dense1''))

    model.add(Activation(activation=trial.suggest_categorical(

    f''activation1'',

    [''relu'',

    ''elu''])))

    for i in range(1, hidden_layers):

    model.add(Dense(units=trial.suggest_categorical(

    f''layer{i+1}'',

    hidden_layer_unit_choice)))

    model.add(Dropout(trial.suggest_uniform(

    f''dropout{i+1}'', 0, 0.8)))

    model.add(Activation(

    activation=trial.suggest_categorical(

    f''activation{i+1}'',

    [''relu'',

    ''elu''])))

    model.add(Dense(classes))

    model.add(Activation(activation=''softmax''))

    model.compile(loss=''categorical_crossentropy'',

    metrics=[''accuracy''],

    optimizer=trial.suggest_categorical(''optimizer'',

    [''rmsprop'', ''adam'', ''sgd'']))

    result = model.fit(x_train, y_train,

    batch_size=4,

    epochs=1,

    verbose=3,

    validation_split=0.2)

    validation_acc = np.amax(result.history[''val_accuracy''])

    print(''Validation accuracy:'', validation_acc)

    return validation_acc

    ```


    Define the objective function. In the preceding code, we see hyperparameters beign
    selected for each layer on the fly, just by giving unique names to labels.


    And lastly, we start the optimization:


    ```

    study = optuna.create_study(direction=''maximize'', sampler=TPESampler())

    study.optimize(objective_func, n_trials=50, callbacks=[log])

    best_trial = study.best_trial.value

    print(f"Best trial  accuracy: {best_trial}")

    print("parameters for best trail are :")

    for key, value in study.best_trial.params.items():

    print(f"{key}: {value}")

    ```


