  引言


  在构建机器学习模型时，选择正确的超参数是数据科学从业者面临的最大问题之一。本书是一本超参数优化（HPO）指南。它从*超参数*最基本的定义开始，一直带你到使用先进的
  HPO 技术构建你自己的 AutoML 脚本。本书面向学生和数据科学专业人士。


  本书共五章。第 1 章帮助你理解超参数如何影响模型构建的整体过程。它阐述了 HPO 的重要性。第 2 章介绍了基本且易于实现的 HPO 方法。第 3 章带你了解应对时间和内存限制的各种技术。第
  4 章和第 5 章讨论了贝叶斯优化、相关库和 AutoML。


  本书旨在让读者以直观且实用的方式理解 HPO 概念，并为每个部分提供代码实现。希望你喜欢。


