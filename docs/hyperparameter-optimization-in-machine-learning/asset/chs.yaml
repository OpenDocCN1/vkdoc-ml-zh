  \n图 3-1-1\n\n任务图示例\n\n\n\n### Dask 分布式\n\n*dask*.*distributed* 是一个小型库，它扩展了 *dask*\
  \ 以实现动态任务调度。在使用 dask 时，我们主要使用 `dask.distributed` 中的 *Client*()：\n\n```\n>>> from\
