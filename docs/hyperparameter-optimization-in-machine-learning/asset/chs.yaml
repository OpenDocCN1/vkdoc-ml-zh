  ## Dask\n\nDask ([`https://dask.org/`](https://dask.org/)) 是 Python 中用于并行计算的库。它使用*动态任务调度*，类似于我们在第\
  \ 2 章中使用 ipyparallel 在 HPC 集群上所做的工作，这解决了计算限制的问题。然而，在分发方面，Dask 比 ipyparallel 灵活得多。使用动态任务调度，我们可以将训练分发到不同的机器上（而不仅仅是同一台机器上的多个核心）。\n\
  \n但是，假设我们遇到内存限制，因为我们的数据太大，无法一次性加载到内存中。Dask 通过提供*并行集合*（如 Dask Dataframe、Dask array\
  \ 等）来解决这个问题，这些集合将数据集分发给可以用于分布式环境或解决超内存问题的块。使用 Dask 执行的进程通常包含以下方面：\n\n*   *集合 → 任务图\
