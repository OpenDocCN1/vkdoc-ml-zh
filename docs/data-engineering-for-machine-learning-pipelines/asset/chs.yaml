  \ IP 地址字段。\n\n图 17-11\nCosmos DB 的防火墙规则规范\n\n你可以保留网络设置和其他设置不变，然后单击“创建”。Azure 可能需要几分钟来预配新集群。让我们看看如何连接并将\
  \ JSON 文档上传到 Cosmos DB：\n\n```\nfrom azure.cosmos import CosmosClient\nimport config\n\
