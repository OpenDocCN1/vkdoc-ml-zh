  \n11. 工作流管理与编排入门\n\n引言\n组织越来越多地利用数据，创建更多的数据团队，并执行各种数据项目。除了构建和部署产品与服务外，公司还越来越多地创建更多的数据团队，并执行从数据发现到获取价值，再到确保最佳安全和隐私数据实践的各种数据项目。\n\
  数据项目可以基于 IT 产品、IT 服务、共享服务以及组织中的其他任务和活动。根据数据项目的性质和类型，数据管道可能会变得复杂和精密。有效管理这些复杂任务，确保准确编排和管理工作流以产生预期结果，这一点至关重要。\n\
  每个数据项目都需要透明度和可观测性，以了解项目做什么、如何运作、从哪些系统获取数据以及向哪些系统提供数据。每个数据作业或数据管道都足够重要，以至于在作业失败时，需要重新启动作业并对导致失败的任何系统进行故障排除。随着大数据革命，组织越来越多地寻求利用各种机器生成的数据。随着数据管道数量的增加，管理它们又增加了一层复杂性。\n\
  \n在本章结束时，您将学习到：\n\n*   工作流管理的基础知识及其对工程数据管道的重要性\n*   工作流编排的概念及其如何优化数据管道操作\n*   cron\
  \ 调度器及其在任务自动化中的作用\n*   创建、监控和管理 cron 作业及 cron 日志记录\n*   cron 日志记录以及调度和编排 cron 作业的实际应用\n\
  \n工作流编排简介\n\n工作流\n工作流编排在 IT 和数据革命之前就已经存在了很长时间。工作流本身可以意味着一组按特定顺序执行以生产产品的任务或活动。每个任务都有一组特定的输入、处理和输出。给定任务的输出作为后续任务的输入。反之，给定任务的输入包含前一个任务的输出。这样，任务必须按照特定顺序遵循一组特定的步骤。\n\
  在任何给定的数据工程或机器学习作业的上下文中，工作流基本上是一组数据管道，包含需要按特定顺序执行的任务和活动。给定管道的输入依赖于前一个管道的输出。\n\n为了进一步说明这一点，让我们以\
  \ Acme 面包公司为例，这是一家虚构的面包制造厂。是的，这是对《乐一通》的引用。假设制作面包的基本过程包括以下需要按特定顺序执行的步骤：\n\n1.  原料混合：将面团、酵母、水和盐按特定、测量的比例在大型搅拌机中混合在一起。\n\
  2.  发酵：将揉好的混合物分成小份，放置在室温下，使面团变得更蓬松并膨胀（变大）。\n3.  烘烤：在受控的温度和压力参数下，在烤箱中烘烤面团，并将湿度控制在适当水平，以获得所需的面包稠度。\n\
  4.  质量控制：确保生产的面包均匀一致，符合质量标准。\n5.  切片和包装：将制作好的面包切片，用纸袋包装，并印上烘烤时间和安全食用期限。\n6.  分销：将用纸袋包装好的面包再次装入箱子，并装载到各种卡车上。然后，这些卡车将面包箱运送到包括杂货店和餐馆在内的各个目的地。\n\
  \n这可能看起来像这样：\n\n![](img/615530_1_En_11_Fig1_HTML.jpg)\n\n一个装配线工作流的图示，包括原料混合、发酵、烘烤、质量控制、切片和包装以及分销。\n\
  \n图 11-1\n装配线工作流示例\n\n这是工作流最基本的例子。\n在前面列出的步骤中，不能互换给定的步骤。这些步骤必须完全按照相同的顺序执行。此外，给定步骤的输出构成下一步的输入。因此，下一步的输出成为后续步骤的输入，依此类推。\n\
  \nETL 和 ELT 数据管道工作流\n烘焙一条面包的过程涉及一组需要按特定顺序执行的步骤。类似地，在数据工程或机器学习项目的上下文中，存在一组需要按特定顺序执行的函数/作业/任务。编写这些数据管道的方法有很多种；其中一种最常见和众所周知的类型称为\
  \ ETL 工作流。ETL 代表提取、转换和加载。在这种类型的工作流中，数据被提取并放置在临时区域，应用必要的转换，然后将最终的工作产品传输到另一个系统，用于下游处理和使用。\n\
  一个简单的例子是工资处理数据管道。假设工资数据从像 PeopleSoft 这样的 ERP 系统中提取，其他费用数据从其他源系统中提取；然后，这些数据在临时区域中被清理、整理并整合成一个统一的数据集。下一阶段是转换阶段，在此阶段计算净工资、税金和扣除额等关键指标。然后，生成的数据集被加载到工资系统中，用于支付处理和报告。这可能看起来像这样：\n\
  \n![](img/615530_1_En_11_Fig2_HTML.jpg)\n\n一个流程图，包括：1. 提取，包括 ERP 软件、数据库拉取和源数据库；2.\
  \ 转换，包括数据转换区域、集成区域、验证和测试；3. 加载，包括目标系统和后处理任务。\n\n图 11-2\n工资处理管道的示例 ETL 架构\n\nETL\
  \ 的一个近期变体被称为 ELT。ELT 代表提取、加载和转换。在这种情况下，来自各种来源的数据被提取并加载到目标系统中。然后，直接在数据上应用各种转换和业务规则。在\
  \ ELT 工作流中，可能有也可能没有临时层。ELT 工作流在云数据存储的情况下更为常见。当处理多样化的数据类型时，ELT 更合适。大多数云提供商提供无服务器数据湖/仓库解决方案来服务\
  \ ELT 管道，使其具有成本效益且易于维护。\n让我们举一个 ELT 数据管道可能是什么样子的例子。假设关系数据库数据来自一个关于各种产品的库存系统，以及仓库日志传感器读数的\
  \ JSON 数据，以及其他一些数据。以频繁的时间间隔获取这些数据将构成提取阶段。对于加载阶段，想象我们有一个 Google BigQuery，我们将所有数据转储到其中。转换阶段是数据被清理、整理，并要么集成到统一数据集中，要么加载到维度表中以供进一步分析。\n\
  这可能看起来像这样：\n\n![](img/615530_1_En_11_Fig3_HTML.jpg)\n\n一个流程图，包括：1. 提取，包括开始、MongoDB\
  \ 和关系数据库，从 Mongo 和关系数据库提取；2. 转换，包括目标受众、统一数据集、在 Google BigQuery 内转换以及数据集的目的；3. 加载，包括加载数据到\
  \ BigQuery。\n\n图 11-3\n库存数据处理管道的示例 ELT 架构\n\n工作流配置\n工作流配置是另一个需要理解的关键概念。工作流配置基本上是一组驱动工作流过程的配置参数。工作流配置对于成功交付产品或解决方案（在此例中是面包）至关重要且关键。\n\
  \n在这个例子中，工作流配置可能涉及以下方面：\n\n1.  原料混合：每种原料的确切数量，并且测量使用相同的标度。\n2.  发酵：发酵室的受控温度，涂抹在发酵板上的确切油量，以及一个自动计时器，一旦发酵完成的小时数达到，就会发出警报。\n\
  3.  烘烤：温度传感器的校准，需要在烤箱中停留的总时间，以及在此期间烤箱的确切温度（前 10 分钟，170°C；第二个 10 分钟，200°C；冷却 10 分钟，150°C）。\n\
  4.  质量控制：每生产 1,000 条面包，缺陷数量应减少到 3 条以下，等等。\n5.  切片和包装：切片机应配置为特定尺寸，以便面包切割均匀；包装纸应清洁且无缺陷。\n\
  6.  分销：各种类型的箱子以及它们能装多少条面包；卡车内的温度；交货时间应在 x 小时内。\n\n前面的工作流配置有助于组织简化生产流程，改进和建立均匀性和一致性，规划采购和人力需求，以及优化资源利用。这种级别的详细配置有助于理解生产优质面包所需遵循的步骤。\n\
  \n类似地，在数据工程或机器学习管道的情况下，也存在工作流配置参数。其中一些可能如下：\n\n1.  如果作业被安排定期运行，那么该作业可能需要最新或新鲜的数据；因此，最近一次源系统刷新的时间和日期至关重要。\n\
  2.  组织开始采用数据治理最佳实践。其中一种实践是创建一个服务帐户或专门的用户帐户（取决于数据车间的大小、性质和复杂性）。必须配置适当的凭据才能访问正确的数据，这对于构建更好的数据产品至关重要。\n\
  3.  一个数据管道可能包含多个转换和业务规则。这些转换本质上是应用于从系统获取的数据的函数。这种转换逻辑和业务规则也是工作流配置。\n4.  在尝试将最终数据产品加载到适当的系统时，可能存在强制将数据加载到模式中的约束。模式只是一个定义了所有字段及其数据类型的表结构。模式也可以是另一个工作流配置参数。\n\
  \n工作流编排\n\n工作流编排指的是对整个过程的集中化管理和控制。工作流编排涉及规划、调度和控制生产过程的每个步骤及其各自的工作流配置参数，以确保所有任务都在定义的控件内并按适当顺序执行。工作流编排优化了资源利用，有助于规划原材料的采购，并在开发的每个产品中建立高质量和一致性，最终实现组织的无缝运作。在此上下文中，工作流编排将指：\n\
  \n1.  定义整个工作流：定义过程的每个步骤，并内置配置参数。\n2.  调度：将调度已定义的工作流，其中一个过程将在装配链中的过程完成后启动。\n3.  一个中央控制室，监督从原料混合到将面包包装到箱子中的整个车间，叉车操作员会将箱子放到卡车上。\n\
  4.  自动化：计算机指定并控制每个工业设备（如烤箱、发酵室等）的配置参数。\n5.  错误处理和路由：如果装配链中的机器未能处理其任务，工作流编排系统将为特定设备实施重试（自动重启机器），并触发某些事件以避免瓶颈。\n\
  6.  与外部系统集成：工作流编排跟踪已发货的箱子数量、已生产的面包数量、哪个市场集群收到了多少箱子、消耗的原材料单位数量、机器开启的小时数以及其他此类数据，并将它们提供给外部系统。\n\
  \n工作流编排使工厂车间能够以最小化错误、高效和可预测的方式运行。\n\n类似地，在数据管道的上下文中，一些工作流编排可以看作如下：\n\n1.  定义整个工作流，其中数据工程管道的每个步骤都配置了适当的参数以成功执行。\n\
  2.  如果任务无法连接到源系统或目标系统，则有一种机制可以在几秒钟后自动重新执行函数，以期连接到该系统。\n3.  内置或良好集成的机密管理，以便开发或生产数据管道利用适当的凭据来执行作业。\n\
  4.  自动记录作业执行的事件，这些事件以后可用于数据分析，特别是识别某些类型事件中的任何模式。\n5.  集中式监控和可观测性，以便在一个界面下查看、管理、监控和控制所有数据管道。\n\
  \n注意\n\n数据管道与制造车间中的任务或过程非常相似。数据管道将有一个输入（原始数据被获取的地方）、一个转换层（执行各种操作并整合业务逻辑）和一个输出（最终产品被生产出来并发送到下一个流程的地方）。数据管道之所以被称为数据管道，是因为一个过程的输入基本上是另一个过程的输出，而该给定作业的输出又成为另一个数据过程的输入。通常，数据管道本质上是瞬态的。\n\
  \nCron 作业调度器简介\n最早的工作流编排器之一是 Unix 操作系统中的 cron 作业调度器。Cron 代表“命令在线运行”，是一个在操作系统后台运行的守护进程。起源于\
  \ 20 世纪 70 年代，cron 调度器至今仍被许多组织使用。Cron 作业调度器支持任务自动化，并调度任务在未来特定时间间隔执行。\n\n概念\ncron\
  \ 调度器的核心是所谓的 cron 守护进程。该进程在系统启动时在后台运行。cron 守护进程执行在名为 crontab 的文件中提到的命令。有两个文件指定用户及其对\
  \ cron 调度器环境的访问权限。\n\n这些文件可能位于：\n\n```\n/etc/cron.allow\n/etc/cron.deny\n/etc/cron.d/cron.allow\n\
  /etc/cron.d/cron.deny\n```\n\n注意\n\n对于 Ubuntu 和 Debian 操作系统，cron.allow 和 cron.deny\
  \ 文件不存在，这意味着默认情况下，Ubuntu 和 Debian 操作系统的所有用户都可以访问 cron 调度器。\n\ncron 调度器环境的最基本单元是\
  \ cron 作业。一个 cron 作业代表一个被调度执行的任务或作业。一个 cron 作业是 crontab 中的一行，代表一个 shell 命令的一次执行。\n\
  \nCrontab 文件\n\nCrontab 是 cron table 的缩写。Crontab 是一个维护用户 crontab 文件的实用程序。crontab\
  \ 文件是为给定的 Linux 用户自动生成的。无论是否有任务或作业被调度运行，cron 守护进程都会运行这个 crontab 文件。crontab 文件可以被视为一个注册表，其中包含已调度作业的列表。crontab\
  \ 文件属于 root 或超级用户。您可以成为超级用户来创建 crontab 文件或编辑现有的 crontab 文件。crontab 文件的默认位置是：\n\n\
  ```\n/var/spool/cron/crontabs/\n```\n\n要创建一个新的 crontab 文件，请在命令行中使用 `crontab -e`。效果如下：\n\
  \n![](img/615530_1_En_11_Fig4_HTML.jpg)\n\n一个软件窗口，带有用于创建新 crontab 文件的命令行。\n\n图 11-4\n\
  创建新的 crontab 文件\n\n您将看到以下模板，用于编写您自己的 cron 作业：\n\n![](img/615530_1_En_11_Fig5_HTML.jpg)\n\
  \n一个名为 GNU Nano 6.2 的软件窗口，带有用于向 crontab 文件写入任务的命令行。\n\n图 11-5\n向 crontab 写入任务\n\n\
  要列出所有当前的 crontab 文件，您可以尝试以下命令：\n\n```\nls -l /var/spool/cron/crontabs/\n```\n\n\
  让我们看一下 crontab 文件的语法。\ncrontab 文件中的每一行代表一个给定 cron 作业的条目。\n一个 crontab 文件条目包含六个字段，由空格分隔。\n\
  \n格式如下：\n\n```\nminute hour day-of-month month weekday command\n```\n\n*   `minute`\
  \ 列表示作业应该运行的具体分钟。它只能包含数值。值可以是 0 到 59 之间的任何数字。\n*   `hour` 列表示作业应该运行的小时，只接受数值。值可以是\
  \ 0 到 23 之间的任何数字。\n*   `day-of-month` 列表示给定日历月中的某一天。如您所知，月份包含 28、29、30 或 31 天，具体取决于月份以及是否是闰年。您可以指定\
  \ 1 到 31 之间的数值。\n*   `month` 列表示一个日历月，可以取 1 到 12 之间的数值。这些数值分别代表从一月到十二月的日历月。\n* \
  \  `weekday` 列表示一周中的某一天，从星期日到星期六。它可以取 0 到 6 之间的任何值，其中 0 代表星期日，6 代表星期六。\n*   `shell\
  \ command` 是发出需要运行的命令的地方。\n\n注意\n\n在 crontab 文件中，我们有一个星号操作符。`*` 操作符可以应用于 crontab\
  \ 条目的前五列。当在相应的列中提及 `*` 时，意味着它可以在给定允许范围内的所有间隔上运行。以下是一个示例：\n`15 6 * * * /user/parallels/bin/helloworld`\n\
  上述 crontab 条目将每天早上 6:15 运行 hello world 脚本。具体来说，该脚本将在每个月的每一天、每个月以及每个工作日运行。\n\nCron\
  \ 日志记录\n\ncron 守护进程在每次系统启动、执行新作业、解释命令时遇到问题或在作业执行期间遇到错误时，都会写入一条日志条目。不幸的是，日志条目不包含错误的来源。如果您使用的是基于\
  \ Debian 的操作系统（Ubuntu 等），那么您可以在此处找到日志：\n\n```\n/var/log/syslog\n```\n\n对于基于 Fedora\
  \ 的发行版，日志位于：\n\n```\n/var/log/cron\n```\n\n您可以通过以下命令获取最近的 cron 日志条目：\n\n```\ngrep\
  \ CRON /var/log/syslog | tail -100\n```\n\nCron 中的日志记录存储了许多关键信息。日志条目以作业启动时的日期时间戳开头，然后是工作站的主机名、该工作站的用户帐户以及执行的命令。以下是一个日志条目的示例：\n\
  \n```\nJan 29 15:55:07 linux CRON[1257]: (parallels) CMD (/home/parallels/helloworld.py)\n\
  ```\n\n在前面的示例中，日志条目以日期时间戳开头，然后是主机名（本例中为 linux），接着是主机上的用户（本例中为 parallels），最后是执行的命令（本例中为执行名为\
  \ helloworld.py 的 Python 脚本）。\n\nCron 作业用法\n在本节中，我们将看一些编写 cron 作业的简单示例。让我们从编写一个简单的\
  \ shell 脚本开始，并使用简单的 cron 作业脚本对其进行调度。\n\n我们将创建一个名为 `cronexample.sh` 的 shell 脚本。在终端中输入以下内容：\n\
  \n```\nnano cronexample.sh\n```\n\n并在 nano 编辑器中输入以下代码：\n\n```\n#!/bin/bash\necho\
  \ \"Hello from the world of Cron scheduling\"\necho \"Execution at: $(date)\"\n\
  ```\n\n它应该看起来像这样：\n\n![](img/615530_1_En_11_Fig6_HTML.jpg)\n\n一个名为 GNU Nano 6.2\
  \ 的软件窗口，带有用于编写简单 shell 脚本的命令行。\n\n图 11-6\n编写一个简单的 shell 脚本\n\n保存文件并退出编辑器。让我们为此文件提供执行权限：\n\
  \n```\nchmod +x cronexample.sh\n```\n\n现在进入 crontab 以调度此 shell 脚本的执行：\n\n```\ncrontab\
  \ -u parallels -e\n```\n\n所有这些看起来像这样：\n\n![](img/615530_1_En_11_Fig7_HTML.jpg)\n\
  \n一个名为 GNU Nano 6.2 的软件窗口，带有用于调度先前编写的 shell 脚本执行的命令行。\n\n图 11-7\n调度先前编写的 shell 脚本的执行\n\
  \n我们得到的是：\n\n```\n* * * * * /home/parallels/Documents/cronexample.sh\n```\n\n这一行脚本将每分钟、每天、每周、每月执行该命令。\n\
  \n现在让我们通过另一个示例引入另一个操作符：\n\n```\n*/6 * * * * /home/parallels/Documents/cronexample.sh\n\
  ```\n\n我们有一个 `/` 操作符，称为步长值。在这种情况下，我们为分钟字段合并了步长值。这个示例意味着无论小时、天、月、日期等如何，每六分钟运行一次以下脚本。\n\
  `/` 步长操作符也可以扩展到其他字段，从而实现更复杂的应用。\n\n以下是一个示例：\n\n```\n*/24 */4 * * * /home/parallels/Documents/cronexample.sh\n\
  ```\n\n这将使 cron 调度器在每个第 4 小时的第 24 分钟运行此脚本。以下是一个示例调度：\n\n```\nfirst execution at\
  \ 2024-02-09 12:00:00\nfollowed by execution at 2024-02-09 12:24:00\nfollowed by\
  \ execution at 2024-02-09 12:48:00\nfollowed by execution at 2024-02-09 16:00:00\n\
  followed by execution at 2024-02-09 16:24:00\n```\n\n让我们看看为给定字段提供一个列表。以下是一个示例：\n\
  \n```\n*/30 */18 * * */1,4,7 /home/parallels/Documents/cronexample.sh\n```\n\n在前面的示例中，我们在每个第\
  \ 18 小时的每半小时，在星期一、星期四和星期日运行 `cronexample.sh`。以下是调度可能的样子：\n\n```\nfirst execution\
  \ at 2024-02-09 18:00:00\nfollowed by execution at 2024-02-09 18:30:00\nfollowed\
  \ by execution at 2024-02-10 00:00:00\nfollowed by execution at 2024-02-10 00:30:00\n\
  followed by execution at 2024-02-10 18:00:00\n```\n\n第一次执行在 18:00 开始，随后在同一小时内间隔\
  \ 30 分钟。后续执行在第二天中午进行，提供了 18 小时的时间窗口。\n\n注意\n\n对于任何给定的调度，时钟从 12:00:00 开始。\n\n我们也可以在\
  \ crontab 中创建一个范围。\n\n以下是一个示例：\n\n```\n0 22 * */6 1-5 /home/parallels/Documents/cronexample.sh\n\
  ```\n\n在此示例中，我们已将此脚本调度为在晚上 10 点运行，每周一至周五，每六个月运行一次。\n\n以下是调度可能的样子：\n\n```\nfirst\
  \ execution at 2024-07-01 22:00:00\nfollowed by execution at 2024-07-02 22:00:00\n\
  followed by execution at 2024-07-03 22:00:00\nfollowed by execution at 2024-07-04\
  \ 22:00:00\nfollowed by execution at 2024-07-05 22:00:00\n```\n\n现在，让我们尝试组合范围操作符和步长值操作符：\n\
  \n```\n36 9-17/2 * * * /home/parallels/Documents/cronexample.sh\n```\n\n在此示例中，我们已将脚本调度为在给定小时的第\
  \ 36 分钟运行，在上午 9 点到下午 5 点之间每 2 小时运行一次：\n\n效果如下：\n\n```\nfirst execution at 2024-02-09\
  \ 13:36:00\nfollowed by execution at 2024-02-09 15:36:00\nfollowed by execution\
  \ at 2024-02-09 17:36:00\nfollowed by execution at 2024-02-10 09:36:00\nfollowed\
  \ by execution at 2024-02-10 11:36:00\n```\n\n让我们看一个使用单词字符串而不是数字的示例。以下是一个示例：\n\n\
  ```\n0 9-17/3 */12 JAN,MAR,MAY,JUL,OCT,NOV,DEC MON /home/parallels/Documents/cronexample.sh\n\
  ```\n\n这个 crontab 脚本将在每个月的第 12 天执行 shell 脚本，如果该天恰好是一月、三月、五月、七月、十月、十一月和十二月的星期一，并且在执行脚本的那天，它将在上午\
  \ 9 点到下午 5 点之间每三个小时执行一次。\n\n以下是一个示例调度：\n\n```\nfirst execution at 2024-03-25 09:00:00\n\
  followed by execution at 2024-03-25 12:00:00\nfollowed by execution at 2024-03-25\
  \ 15:00:00\nfollowed by execution at 2024-05-13 09:00:00\nfollowed by execution\
  \ at 2024-05-13 12:00:00\n```\n\n让我们再看几个操作符：\n\n```\n*/15 3 L 6-9 FRI#4 /home/parallels/Documents/cronexample.sh\n\
  ```\n\n注意使用了字符 `L` 和井号 `#`。`L` 字符表示给定字段的最后一个值。`#` 哈希操作符表示该月的第 n 天。在这种情况下，脚本被调度为每\
  \ 15 分钟执行一次，在凌晨 3 点到 3:59 之间，在该月的最后一天执行，如果该最后一天恰好是该月的第四个星期五，并且在六月、八月和九月这些月份中。\n\n\
  Cron 调度器应用\n在建立基础设施和工程数据系统的世界中，有许多应用涉及使用 cron 调度器。让我们详细看看其中一些应用。\n\n数据库备份\n数据库备份是创建组织主文件和事务表副本的过程。这是一项关键操作，因为数据是最有价值的资产，并且日常业务和运营都需要数据。根据备份的类型和频率，存在各种类型的数据库备份方法。有差异备份、增量备份和完整备份。\n\
  \n让我们看一个简单的示例，其中调度了一个执行数据库备份操作的 shell 脚本：\n\n```\n0 2 * * * /home/parallels/mysql_backup.sh\n\
  ```\n\n此脚本将每天凌晨 2 点运行，执行 shell 脚本文件中提到的指令。\n\n数据处理\n许多组织都在使用各种生成数据的系统。组织内的数据团队通常会每天生成报告或执行某些数据的文件传输。这些在特定源系统中出现的数据处理任务可以使用\
  \ cron 调度器实用程序自动化。\n\n让我们看看调度一个执行数据处理或每天生成报告的批处理作业：\n\n```\n45 3 * * * /home/parallels/Documents/data_processing.sh\n\
  ```\n\n上述 cron 调度器将每天凌晨 3:45 处理批处理操作，从而准备报告或执行文件传输到另一个位置。\n\n电子邮件通知\n电子邮件通知是向一个或多个人发送特定消息的过程。在数据系统和工程领域，可以设置接收关于已处理任务状态（备份数据库、准备数据集、数据挖掘等）的电子邮件通知。存在多个库用于设置电子邮件服务器配置并将输出消息发送到适当的电子邮件。\n\
  \n让我们看一个简单的示例：\n\n```\n45 7 * * MON-FRI /home/parallels/email_notification.sh\n\
  ```\n\n上述命令将在周一至周五每天早上 7:45 发送关于各种任务的电子邮件通知。\n\nCron 替代方案\ncron 作业调度器有几个替代方案；其中一些替代方案仍然基于早期版本的\
  \ cron 调度器实用程序。但有一个在管理员社区中被广泛使用和尊重的替代方案，称为 `systemd timer`。Systemd 是一个软件套件，提供各种组件来管理\
  \ Linux 操作系统中的系统进程。Systemd timer 是 systemd 的组件之一，提供作业调度机制。作业可以被调度在特定的时间间隔运行，或者基于某个事件运行。\n\
  \n结论\n工作流管理和编排是数据工程中的基本组成部分。在本章中，我们研究了 crontab 和 cron 调度，以及如何使用它们来编排复杂的作业和自动化日常任务。看似简单的概念，却是自动化重复性任务的强大调度工具。您在本章中学到的基础知识和关键概念，在您研究现代数据编排平台（我们将在接下来的几章中看到）时可能会对您有所帮助。高效的工作流管理、调度和编排是释放数据基础设施全部潜力的关键。\n\
  \n12. 使用 Apache Airflow 编排数据工程管道\n\n简介\nApache Airflow 是一个开源的工作流编排平台。它使工程师能够将有向无环图（DAG）形式的工作流进行定义、调度和编排。Airflow\
  \ 支持与流行的数据存储和处理系统进行广泛集成，适用于从 ETL（提取、转换、加载）流程到复杂的机器学习管道的各种用例。凭借其可扩展和可扩展的架构、出色的图形用户界面以及丰富的插件和扩展集合，Airflow\
  \ 被广泛用于提高生产力并确保数据的可靠性和质量。我们将深入探讨 Apache Airflow 的架构、各种组件以及使其成为强大工作流编排器的关键概念。\n\n\
  在本章结束时，您将学习到：\n\n*   Apache Airflow 的基础知识及其架构\n*   在开发环境中设置、安装和配置 Airflow\n*   关键概念，如\
  \ DAG、操作符和宏\n*   使用 Xcom 进行任务间通信，以及使用参数和变量进行灵活的工作流配置\n*   使用触发器和任务流控制复杂工作流\n\nApache\
  \ Airflow 简介\nApache Airflow 是一个开源的工作流管理和编排平台。Airflow 起源于大约十年前（2014 年）的 Airbnb。创建\
  \ Airflow 是为了以编程方式调度和编排工作流。\n\n设置与安装\n\n以下是我们如何开始使用 Apache Airflow。我正在使用的版本是 Apache\
  \ Airflow 2.8.1。让我们从创建一个新的虚拟环境开始：\n\n```\npython -m venv airflow-dev\n```\n\n以下是在\
  \ Linux 中激活虚拟环境的方法：\n\n```\nsource airflow-dev/bin/activate\n```\n\n如果您使用的是 MS Windows，请使用：\n\
  \n```\nairflow-dev/Scripts/activate\n```\n\n在您的开发工作区中的某个位置创建一个新文件夹：\n\n```\nmkdir\
  \ airflow_sandbox\n```\n\n现在，复制文件夹路径并设置 AIRFLOW_HOME 环境变量。确保在系统中安装 Apache Airflow\
  \ 之前执行此操作：\n\n```\nexport AIRFLOW_HOME=/home/parallels/development/airflow_sandbox\n\
  ```\n\n以下说明摘自 Apache Airflow 网站。我们将使用以下命令获取 Python 版本：\n\n```\nPYTHON_VERSION=\"\
  $(python --version | cut -d \" \" -f 2 | cut -d \".\" -f 1-2)\"\n```\n\n如前所述，我们希望安装\
  \ Apache Airflow 版本 2.8.1。以下是执行此步骤的命令：\n\n```\npip install \"apache-airflow==2.8.1\"\
  \ \\\n—-constraint \"https://raw.githubusercontent.com/apache/airflow/constraints-2.8.1/constraints-${PYTHON_VERSION}.txt\"\
  \n```\n\n此命令将开始安装 Apache Airflow 及其依赖项。效果如下：\n\n![](img/615530_1_En_12_Fig1_HTML.jpg)\n\
  \n带有安装 Apache Airflow 及其依赖项的命令行的文本图形。\n\n图 12-1\nPip 安装 Apache Airflow\n\n现在，让我们初始化后端数据库，创建一个管理员用户，并通过输入以下内容启动所有组件：\n\
  \n```\nairflow standalone\n```\n\n![](img/615530_1_En_12_Fig2_HTML.jpg)\n\n带有初始化后端数据库、创建管理员用户和启动所有组件的命令行的文本图形。\n\
  \n图 12-2\n初始化 Apache Airflow 的后端配置\n\n完成此步骤后，让我们通过以下命令初始化 Apache Airflow Web 服务器：\n\
  \n```\nairflow webserver —D\n```\n\n此命令将启动 Airflow Web 服务器作为后台进程。效果如下：\n\n![](img/615530_1_En_12_Fig3_HTML.jpg)\n\
  \n带有启动 Airflow Web 服务器作为后台进程的命令行的文本图形。\n\n图 12-3\nApache Airflow 初始化\n\n一旦 Web 服务器运行起来，让我们尝试运行调度器。以下命令将启动\
  \ Airflow 调度器：\n\n```\nairflow scheduler -D\n```\n\n您可以打开浏览器并输入以下 URL 来访问 Apache\
  \ Airflow 图形用户界面。\nURL 是：\n`http://localhost:8080`\n对您来说可能如下所示：\n\n![](img/615530_1_En_12_Fig4_HTML.jpg)\n\
  \n一个 Airflow 窗口的截图，收集用户名和密码等登录信息。下方有一个名为“登录”的按钮。\n\n图 12-4\nApache Airflow GUI\n\
  \n当您运行 `airflow standalone` 命令时，它应该已经创建了一个管理员帐户，密码存储在 AIRFLOW_HOME 位置内的一个文本文件中。从文本文件\
  \ `standalone_admin_password.txt` 中获取密码。效果如下：\n\n![](img/615530_1_En_12_Fig5_HTML.jpg)\n\
  \n带有从文本文件获取密码的命令行的文本图形。\n\n图 12-5\n从文本文件获取用户凭据\n\n登录成功后，您可能会看到以下包含预构建作业的屏幕：\n\n\
  ![](img/615530_1_En_12_Fig6_HTML.jpg)\n\n一个 Airflow 窗口的截图，菜单项 DAG 已打开。下方有五个条目，包含所有者、运行次数、调度、上次运行和下次运行的详细信息。\n\
  \n图 12-6\nApache Airflow 主屏幕\n\nAirflow 架构\nAirflow 为您提供了一个定义、调度和编排作业及工作流的平台。如前所述，工作流可以是一系列任务，其中给定任务的输出作为后续任务的输入。在\
  \ Apache Airflow 中，工作流由有向无环图表示。有向无环图是一个数学术语，表示由边连接的一系列节点，在其结构中任何地方都不形成闭环。在 Apache\
  \ Airflow 的上下文中，有向无环图表示一系列相互连接和依赖但绝不会形成循环的任务。它们简称为 DAG。\n一个 DAG 工作流将任务表示为节点；数据源和依赖关系表示为边。DAG\
  \ 表示任务应执行的顺序。任务本身包含描述要做什么的程序化指令。DAG 的概念是 Apache Airflow 功能的核心。除此之外，还有一些核心组件对于 Apache\
  \ Airflow 的功能至关重要。让我们详细看看这些核心特性，从我们已经熟悉的组件开始。\n\nWeb 服务器\nWeb 服务器组件提供 Apache Airflow\
  \ 软件的用户界面功能。正如我们在上一节中看到的，Web 服务器作为守护进程运行。安装显示为本地机器/单机独立进程。您可以以分布式进程部署 Apache Airflow，其中\
  \ Web 服务器可以拥有自己的实例并具有更高的安全参数。Web 服务器为开发人员提供了一个用户界面，用于查看当前已调度的各种作业、它们被配置运行的调度、上次运行的时间以及给定作业工作流中包含的各种任务。\n\
  \n数据库\nApache Airflow 的数据库组件包含各种作业的元数据。其中一些元数据信息包括任务或工作流的上次运行、先前运行的状态等。具有现代用户界面的\
  \ Web 服务器从此数据库中检索信息。Apache Airflow 使用 SQLAlchemy 作为其默认数据存储。对于生产实例，建议设置不同的数据库后端，如\
  \ Postgres 或 MySQL。后端数据库设置涉及为 Airflow 实例创建一个单独的数据库、一个单独的数据库用户、向 Airflow 用户授予 Airflow\
  \ 数据库的所有权限，并将新创建的 Airflow 用户添加到数据库的访问控制列表中。最后，初始化新的后端数据库，并在 Airflow 配置文件中的连接字符串中使用适当的数据库驱动程序（稍后我们将对此进行更多介绍）。\n\
  \n执行器\n执行器是运行给定工作流中任务的方式。执行器实际上是调度器组件的一部分。它带有几个可插拔的执行器。这些执行器提供了运行工作流的不同机制。有两种主要类型的可插拔执行器，即本地执行器和远程执行器。顾名思义，本地执行器在您的工作站（本地）上运行任务，而远程执行器则在多个工作节点环境（分布式环境）中运行这些任务。例如，LocalExecutor\
  \ 在您的本地工作站上运行，并支持并行性和超线程。另一个值得一提的 KubernetesExecutor，它在 Kubernetes 集群中的单独 Pod 中运行每个任务。Pod\
  \ 类似于容器，而 Kubernetes 是一个容器编排平台。您必须设置一个 Kubernetes 集群才能使用 KubernetesExecutor。\n\n\
  调度器\n这是 Apache Airflow 架构中最重要的组件。调度器组件监控所有工作流以及每个工作流中的所有任务。一旦任务的所有底层依赖项完成，调度器就会触发任务的执行。调度器是一个需要手动启动的独立服务，正如我们在“设置与安装”部分中看到的。Apache\
  \ Airflow 支持同时运行多个调度器组件以提高性能。调度器组件利用执行器来执行准备就绪的任务。\n\n配置文件\n\nAirflow 配置文件不是 Apache\
  \ Airflow 架构的一部分；但是，它控制着工作方式和功能。Apache Airflow 带有一个选项，可以通过 `airflow.cfg` 文件微调各种选项。当您在您的工作站上安装\
  \ Apache Airflow 时，会创建此文件。每个可配置的属性都提供了描述和默认配置选项。您可以使用记事本或文本编辑器简单地打开 Airflow 配置文件。您也可以通过输入以下命令从命令行获取选项列表：\n\
  \n```\nairflow config list\n```\n\n配置在命令行上的显示方式如下：\n\n![](img/615530_1_En_12_Fig7_HTML.jpg)\n\
  \n带有显示配置的命令行的文本图形。\n\n图 12-7\nApache Airflow 配置\n\n如果您想更改存放 DAG 的位置，那么您可以在此处指定文件夹的位置：\n\
  \n```\n[core]\ndags_folder = /user/parallels//\n```\n\n如果您想指定或更改 Airflow 打算使用的执行器，那么您可以在此处进行：\n\
  \n```\n[core]\nexecutor = LocalExecutor\n```\n\n如果您希望将默认的 sqlite 后端更改为 MySQL 或 Postgres\
  \ 数据库实例，那么您可以将数据库字符串从 sqlite 驱动程序和凭据更改为 mysqldriver 或 psycopg2 驱动程序以及相应的凭据。您可以在此处替换数据库字符串：\n\
  \n```\n[database]\nsql_alchemy_conn = sqlite:////\n```\n\n如果您希望获得对 Apache Airflow\
  \ 开发或沙箱实例的可见性，并启用查看配置的能力，则将以下参数设置为 True：\n\n```\n[webserver]\nexpose_config=False\n\
  ```\n\n一旦您进行了必要的更改，重新启动 Airflow 服务器至关重要。一个良好的生产实践是在 systemd 服务中创建一个服务，以便启动、停止和重新启动\
  \ Airflow 服务器。您可以在 Apache Airflow 的 GitHub 存储库中找到 systemd 服务配置文件。但是，对于开发实例，更容易的方法是识别进程\
  \ ID（也称为 PID），尝试终止该进程，然后使用以下命令启动 Apache Airflow 服务器：\n\n```\nairflow webserver -p\
  \ 8080 -D\n```\n\n注意\n\n`-p` 指的是指定端口，而 `-D` 是将服务器作为守护进程（通常称为后台进程）运行。\n\n此外，您可以使用终端中的以下命令获取环境中加载的所有当前\
  \ DAG 的列表：\n\n```\nairflow dags list\n```\n\n一个简单的示例\n\n让我们看一个 Apache Airflow 的简单示例，并在以下部分中检查各种组件。以下是一个简单的入门示例：\n\
  \n```\nfrom datetime import datetime\nfrom airflow import DAG\nfrom airflow.operators.python\
  \ import PythonOperator\ndef say_hello():\nprint(\"Hello, World!\")\ndef print_time():\n\
  now = datetime.today()\nprint(now)\nreturn now\nfirst_airflow_dag = DAG(\n'hello_world',\n\
  description='A simple DAG that prints Hello, World!',\nschedule=None,\n)\nhello_task\
  \ = PythonOperator(\ntask_id='say_hello_task',\npython_callable=say_hello,\ndag=first_airflow_dag,\n\
  )\ndisplay_time = PythonOperator(\ntask_id='print_time',\npython_callable=print_time,\n\
  dag=first_airflow_dag\n)\nhello_task >> display_time\n```\n\n我们首先导入所需的类和方法。此代码中有两个函数：第一个函数将打印一个字符串，另一个函数将显示当前日期和时间。然后，我们定义\
  \ DAG，在其中指定各种详细信息，如名称、描述和调度。这些 DAG 也可以接受更复杂的配置。然后，我们为每个函数定义任务，并将它们与我们的 DAG 关联起来。最后，我们定义要执行的任务的顺序。虽然这不会在命令行中打印任何内容，但这有助于理解使用\
  \ Apache Airflow 进行工作流定义的各种部分。要让 DAG 显示在您的用户界面上，请确保将 Python 脚本放在适当的文件夹中。\n\n注意\n\
  \n您必须将 Python 脚本放在 `airflow.cfg` 配置文件中引用的文件夹中，才能查看和监控您的 DAG。确保您的 `dags_folder` 属性指向包含您需要运行的脚本的适当文件夹。此外，找到名为\
  \ `expose_config` 的配置参数，并将该参数设置为 `True`。这将暴露 Web 服务器中的所有配置参数。在开发或沙箱实例中，这些可能有助于故障排除。\n\
  \nAirflow DAG\n有向无环图，或简称为 DAG，是工作流管理和编排系统（在本例中是 Apache Airflow）的核心。一个典型的 DAG 将包含通过各种数据库连接和依赖关系相互连接的各种任务，这样图中任何地方都不会形成循环。\n\
  以下是一个 DAG 的简单示例：\n连接到数据库 ➤ 提取表 ➤ 执行转换 ➤ 加载数据集 ➤ 关闭数据库 ➤ 电子邮件通知\n\n![](img/615530_1_En_12_Fig8_HTML.jpg)\n\
  \n一个 Airflow 窗口的截图，菜单项 Grid 被选中。一个名为 hello world 的 DAG 已打开，显示其详细信息、图形、甘特图和代码。\n\n\
  图 12-8\n在 Apache Airflow GUI 中查看 DAG\n\n这些 DAG 将定义和控制这些任务如何执行；但是，它们没有关于这些任务实际做什么的信息。在某种程度上，这些\
  \ DAG 是任务无关的。\n\n在数据管道中声明 DAG 有三种方法。最基本和熟悉的方法是使用构造函数并将 DAG 传递给您计划使用的操作符。效果如下：\n\n\
  ```\nmy_test_airflow_dag = DAG(\ndag_id = 'hello_world',\ndescription='A simple\
  \ DAG that prints Hello, World!',\nstart_date=datetime.datetime(2024,2,5)\nschedule=\"\
  @weekly\",\n)\nEmptyOperator(task_id=\"my_task\", dag=\"my_test_airflow_dag\")\n\
  ```\n\n您也可以使用 Python 上下文管理器声明 DAG，并在上下文中添加操作符：\n\n```\nwith my_test_airflow_dag(\n\
  dag_id = 'hello_world',\ndescription='A simple DAG that prints Hello, World!',\n\
  start_date=datetime.datetime(2024,2,5)\nschedule=\"@weekly\",\n):\nPythonOperator(task_id=\"\
  hello_world_task\")\n```\n\n最后，您可以定义一个函数，在该函数中指定所有操作符；然后您可以使用装饰器将该函数转换为 DAG 生成器。效果如下：\n\
  \n```\n@dag(\ndag_id = 'hello_world',\ndescription='A simple DAG that prints Hello,\
  \ World!',\nstart_date=datetime.datetime(2024,2,5)\nschedule=\"@weekly\",\n)\ndef\
  \ some_random_function():\nEmptyOperator(task_id=\"hello_world_task\")\nPythonOperator(task_id=\"\
  print_current_date\")\nsome_random_function()\n```\n\n每当您运行一个 DAG 时，Apache Airflow\
  \ 将创建一个新的 DAG 实例并运行该实例。这些被称为 DAG 运行。类似地，在运行时也会创建 DAG 内定义的任务的新实例。这些被称为任务实例。\n\n任务\n\
  \nDAG 需要任务来运行。任务是任何给定 DAG 的核心。它们可以被视为工作单元。在运行期间，您将创建一个新的任务实例，即任务实例。这些任务实例有开始日期、结束日期和状态。任务具有状态，代表生命周期的阶段。以下是一个示例生命周期：\n\
  \n```\nNone ➤ Scheduled ➤ Queued ➤ Running ➤ Success\n```\n\n有三种类型的任务，即操作符、传感器和任务流。如前一节所述，任务使用关系相互连接。在此上下文中，任务之间的依赖关系表示为关系。以下是如何在\
  \ Apache Airflow 中表示关系的示例。假设我们有三个任务，即提取、转换和加载。提取任务的输出作为转换任务的输入，转换任务的输出作为加载任务的输入。以下是这些任务在关系中的表示方式：\n\
  \n```\nextract_data >> transform_data >> load_data\nTask1 >> Task2 >> Task3\n```\n\
  \n操作符\nApache Airflow 中的操作符代表执行特定任务的模板。Apache Airflow 拥有大量已经开发好的操作符列表。一些操作符适用于特定的云环境、数据库等。让我们看一个利用\
  \ bash 操作符下载平面文件并将其保存在特定目录中的简单示例。\n\n以下是相同的代码：\n\n```\nfrom airflow.decorator import\
  \ dag\nfrom airflow.operators.bash import BashOperator\nfrom datetime import datetime\n\
  @dag(\ndag_id=\"extract_task\",\nschedule=None,\nstart_date=datetime(2024,2,2)\n\
  )\ndef extract_task():\nBashOperator(\ntask_id=\"data_extract\",\nbash_command=\"\
  wget -c https://www.dol.gov/sites/dolgov/files/ETA/naws/pdfs/NAWS_F2Y197.csv -O\
  \ /Users//airflow/wash-electric-vehicles.csv\",\n)\nextract_task()\n```\n\n每次您使用\
  \ Apache Airflow 调度和编排数据管道时，都必须重新初始化数据库。您可以使用以下命令执行此操作：\n\n```\nairflow db init\n\
  ```\n\n此命令将从文件夹中获取 DAG，您可以在用户界面中看到列出的 DAG。效果如下：\n\n![](img/615530_1_En_12_Fig9_HTML.jpg)\n\
  \n一个 Airflow 窗口的截图，菜单项 DAGs 已打开。有一个名为 Extract task 的条目，包含所有者、运行次数、调度、上次运行、下次运行和最近任务的详细信息。\n\
  \n图 12-9\nApache Airflow 中活动的 DAG 列表\n\n传感器\n\n传感器也是一种操作符，但它执行一个非常独特的功能。传感器可用于创建一个事件，等待某事发生。一旦事件发生，它将触发下游作业。如果事件没有发生，它将持续等待。传感器通常用于等待文件到达文件系统、监控外部\
  \ API 和数据库，或者只是等待不同任务的完成。以下是一些常用的传感器及其在数据管道工作流中的使用方式：\n\n*   ExternalTaskSensor：`ExternalTaskSensor`\
  \ 等待不同 DAG 中的外部任务完成。\n*   SQLSensor：`SQLSensor` 执行 SQL 查询，并等待直到查询返回结果。\n*   FileSensor：`FileSensor`\
  \ 等待文件或文档出现在给定的文件夹或文件位置。\n*   TimeSensor：等待某个时间点。\n\n让我们看一个传感器的简单示例。我们有一个文件传感器，它会持续等待，直到文件在指定时间内到达文件夹/文件系统。每当文件到达相应的文件夹位置时，DAG\
  \ 将运行下游任务，该任务会回显文件已到达。在此上下文中，假设文件将由另一个进程放置在相应的文件夹中：\n\n```\nfrom datetime import\
  \ datetime\nfrom airflow.decorators import dag\nfrom airflow.sensors.filesystem\
  \ import FileSensor\nfrom airflow.operators.bash import BashOperator\n@dag(\ndag_id\
  \ = \"file_sensor_example\",\nstart_date=datetime(2024,2,3)\n)\ndef wait_for_file():\n\
  FileSensor(\ntask_id=\"wait_for_file\",\nfilepath=\"/Users//airflow/testfile.txt\"\
  ,\nmode=\"poke\",\ntimeout=300,\npoke_interval=25,\n)\n@dag(\ndag_id = \"file_sensor_example\"\
  ,\nstart_date=datetime(2024,2,3)\n)\ndef file_notification():\nBashOperator(\ntask_id=\"\
  file_notification_task\",\nbash_command='echo \"file is available here\"'\n)\nwait_for_file\
  \ >> file_notification\n```\n\n任务流\n\n正如您在之前的章节中所看到的，在开发数据管道时，您必须开始规划任务和 DAG。如果您有主要用纯\
  \ Python 代码编写而不使用 Airflow 操作符的数据管道，那么任务流装饰器将有助于创建 DAG，而无需编写额外的操作符代码：\n\n```\nfrom\
  \ airflow.decorators import dag, task\n@dag(schedule=\"@daily\", start_date=(2024,2,2))\n\
  def taskflow_example():\n@task(task_id=\"extract\", retries=5)\ndef extract():\n\
  \"\"\"\nExtract data from the data source.\nIf there is a connection issue, attempt\
  \ to\nestablish the connection again\n\"\"\"\nreturn dataset\n@task(task_id=\"transform\"\
  )\ndef transform(dataset):\n\"\"\"\nPerform the necessary transformation for\nthe\
  \ extracted dataset\n\"\"\"\nreturn processed_dataset\n@task(task_id=\"loaddata\"\
  , retries=5)\ndef load(processed_dataset):\n\"\"\"\nObtain the dataset and transport\
  \ it to file system.\nRetry the task if there is an issue with connection.\n\"\"\
  \"\npass\nextract_data = extract()\ntransform_data = transform(dataset)\nload_data\
  \ = load(processed_dataset)\ntaskflow()\n```\n\n在此示例中，我们有三个函数，每个函数执行一个单独的活动。我们有一个任务装饰器，它会使这些函数成为一个任务，而父函数已用\
  \ DAG 装饰。\n\nXcom\n默认情况下，任务会孤立地执行或运行它们被提供的指令，并且不与其他任务或进程通信。Xcom 是 Apache Airflow\
  \ 独有的概念，支持任务之间的交叉通信。使用 Xcom，您可以从一个任务实例获取信息或值，并在另一个任务实例中使用它。虽然也可以通过将值导出到文件或数据库，然后读取文件或数据库来获取值，从而以编程方式实现这一点，但\
  \ Xcom 功能是原生的，并且可以被认为是更安全的。\n\n从开发的角度来看，交叉通信可以通过两个步骤实现。首先，您为任务创建一个 Xcom，然后从您创建它的地方拉取值。就创建\
  \ Xcom 而言，您可以简单地返回一个函数的值，或者您可以使用 Xcom push 方法。效果如下：\n\n```\n@task\ndef some_function(value):\n\
  result = some_other_function(*args)\nvalue.xcom_push(key=\"Result_Func1\", value=result)\n\
  ```\n\nXcom pull 方法将尝试使用 task_id 和键来获取值。以下是一个示例：\n\n```\ndef another_function(value):\n\
  value_from_some_function = value.xcom_pull(key=\"Result_Func1\", task_id=\"some_function\"\
  )\npass\n```\n\n钩子\nApache Airflow 通过钩子的概念，让您可以轻松地连接到外部数据平台和系统。Airflow 中的钩子让您可以连接到外部系统，而无需编写代码手动连接到这些系统。钩子还内嵌了可选的“重试”逻辑。Airflow\
  \ 提供了许多内置钩子，并且还有一个开发者社区正在为各种应用程序开发自定义钩子。让我们看一个简单的说明。\n\n让我们看看以下连接到数据库的代码：\n\n```\n\
  import psycopg2\ndef querydb():\nconn_params = {\n\"host\": localhost,\n\"database\"\
  : testDB1,\n\"port\": 5432,\n\"user\": \"username\",\n\"password\": \"password\"\
  \n}\ntry:\nconn = psycopg2.connect(**conn_params)\ncur = conn.cursor()\nsql = \"\
  select * from table1\"\ncur.execute(sql)\nrows = cur.fetchall()\nfor row in rows:\n\
  print(row)\nexcept:\nprint(\"error connecting to database\")\n```\n\n现在让我们使用 Airflow\
  \ 钩子连接到同一个数据库。代码可能如下所示：\n\n```\nfrom airflow.hooks.postgres_hook import PostgresHook\n\
  def querydb():\ndbhook = PostgresHook(postgres_conn_id='Postgres_TestDB1')\nsql\
  \ = \"select * from table1\"\nrows = dbhook.get_records(sql)\nfor row in rows:\n\
  print(row)\n```\n\n注意在连接和检索行时使用了 Postgres 数据库钩子；此处不需要指定数据库连接参数。\n\n注意\n\n在 Airflow\
  \ 中使用钩子之前，您必须先在 Airflow 中单独设置外部数据系统的凭据。\n您可以访问 Airflow UI ➤ Admin ➤ Connections\
  \ ➤ New Connection。\n一旦您配置了外部数据系统，您就可以获得一个连接 ID，可以在钩子中使用它。\n\n变量\nApache Airflow\
  \ 变量是可以在 Airflow DAG 中定义和使用的键值对。这些变量的作用域是全局的，可以从任何任务中访问。DAG 中的任务可以查询这些变量。您也可以在模板中使用这些变量。以下是如何在\
  \ Apache Airflow 中设置变量。一个很好的应用是存储一些在项目期间保持静态的数据库或访问凭据。当使用 Airflow 变量存储 API 密钥、密码和其他敏感信息时，Airflow\
  \ 会自动屏蔽这些变量。此外，Airflow 还会加密这些变量。因此，建议使用变量来存储敏感信息，而不是其他可能缺乏屏蔽和加密功能的选项。\n\n您可以通过管道、命令行界面甚至用户界面（Web\
  \ 服务器）以编程方式创建 Apache Airflow 变量。以下是在命令行界面中设置 Airflow 变量的示例：\n\n```\nairflow variables\
  \ set server_ip 192.0.0.1\nairflow variables set -j aws_creds '{\"AWS_SECRET\":\
  \ \"your_secret_here\"}'\n```\n\n您也可以从 Apache Airflow Web 服务器设置或批量上传 JSON。要开始，请导航到\
  \ Web 服务器中的 Admin 菜单，然后单击 Variables：\n\n![](img/615530_1_En_12_Fig10_HTML.jpg)\n\
  \n一个 Airflow 窗口的截图，菜单项包括 DAGs、Cluster activity、Datasets、Security、Browse、Admin 和\
  \ Docs。未找到任何记录。\n\n图 12-10\n在 Apache Airflow 中创建变量\n\n您可以单击 `+` 按钮创建一个新变量。它将呈现一个新屏幕，您可以在其中输入键、值和描述。\n\
  效果如下：\n\n![](img/615530_1_En_12_Fig11_HTML.jpg)\n\n一个 Airflow 窗口的截图，用于添加变量信息，如键、值和描述。底部有一个保存按钮。\n\
  \n图 12-11\n填充变量的键、值和描述\n\n您可以使用以下语法检索这些变量：\n\n```\nvar.value.\n```\n\n以下是一个示例说明：\n\
  \n```\nfrom airflow.models import Variable\ndef get_aws_parameters():\naws_access_key\
  \ = Variable.get(\"aws_key\",default_var=None)[\"aws_access_key\"]\naws_secret_key\
  \ = Variable.get(\"aws_key\",default_var=None)[\"aws_secret_key\"]\nPythonOperator(\n\
  task_id=\"get_aws_parameters\",\npython_callable=get_aws_parameters,\n)\n```\n\n\
  参数\nParams 是 parameters 的缩写。与变量类似，参数是您可以在运行时传递给 Airflow DAG 运行或任务实例的参数。不同之处在于，传递给参数的值不会被加密，因此不应将其用于存储敏感信息。您可以在\
  \ DAG 级别或单个任务级别传递参数。任务级别的参数优先于 DAG 级别的参数。\n\n让我们看看在任务级别传递参数：\n\n```\nBashOperator(\n\
  task_id=\"an_example_task\",\nbash_command=\"echo {{ params.my_param }}\",\nparams={\"\
  my_param\": \"this is an example parameter\"},\n)\n```\n\n以下是另一个在 DAG 级别传递参数的说明：\n\
  \n```\nfrom datetime import datetime\nfrom airflow.decorators import dag, task\n\
  @dag(\nstart_date=datetime(2024, 2, 2),\nschedule=None,\ncatchup=False,\nparams={\n\
  \"Person\": \"JohnDoe\",\n\"Value\": 10\n},\n)\ndef demo_dag():\n@task\ndef demo_task(**context):\n\
  print(context[\"params\"][\"Person\"])\nprint(context[\"params\"][\"Value\"] + 10)\n\
  print_all_params()\ndemo_dag()\n```\n\n与 Apache Airflow 中的变量相比，参数更加本地化。如果您想在每次运行时为任务传递不同的值，参数将是一个不错的选择。\n\
  \n模板\n\n在 Apache Airflow 中，模板化的概念利用了一个名为 `Jinja` 的 Python 模板框架，它允许您在运行时将数据传递到任务实例中。这些\
  \ Jinja 模板使您能够在运行时填充值。此模板化的语法如下：\n\n```\n{{ your-value-here }}\n```\n\n模板化最常见的应用是获取\
  \ Apache Airflow 中的执行信息。这些包括正在运行的任务实例的日期、执行日期以及当前 DAG 的开始和结束日期间隔。这些模板在 Apache Airflow\
  \ 中最常用的操作符中得到支持。您还可以通过添加过滤器或函数来扩展这些模板的功能。以下是如何在 Airflow 中使用模板：\n\n```\nBashOperator(\n\
  task_id=\"begin and end date interval\"\nbash_command='echo \"the DAG started at\
  \ {{ data_interval_start }} and finished at {{ data_interval_end }}\"'\n)\n```\n\
  \n宏\n\nApache Airflow 中的宏使您能够注入预定义的函数，以便在模板中使用。它们位于模板中的 `macros` 命名空间下。目前，Airflow\
  \ 宏支持来自 Python 库的方法，即 time、datetime、uuid、random 和 dateutil。以下是一个使用宏的示例：\n\n```\n\
  from datetime import datetime\nBashOperator(\ntask_id=\"display_current_datetime\"\
  ,\nbash_command='echo \"It is currently {{ macros.datetime.now() }}\"'\n)\n```\n\
  \n在前面的示例中，我们使用 macros 命名空间调用了 Python 库中的一个方法。如果您尝试在没有 macros 命名空间的情况下调用它，该命令将不会返回日期时间。\n\
  \n控制 DAG 工作流\n通常，生产应用程序或数据管道会变得更加复杂，任务流可能比我们看到的示例更复杂。可能需要在生产数据管道的各个阶段设置决策循环。典型的场景可能看起来像根据给定上游任务的结果，执行下游任务的子集或仅执行管道下游的某些部分。其他场景可能看起来像根据条件跳过整个下游任务。因此，不仅需要调度和编排\
  \ DAG 数据管道，还需要控制这些 DAG 的条件执行逻辑。在 Apache Airflow 中，这被称为分支。\n您可以通过两种不同的概念来控制 DAG 的执行：分支和触发。在分支中，您利用操作符来定义条件执行。在本节中，我们将介绍两个常用的操作符：BranchPythonOperator\
  \ 和 ShortCircuitOperator。\n\nBranchPythonOperator 是 Apache Airflow 中的一个操作符，它允许您评估某个条件（或决策循环），并决定您希望执行下游任务的哪个子集。它的工作方式是，操作符会评估来自任务的条件，并返回一个任务\
  \ ID 或任务 ID 列表以在下游执行。以下是 BranchPythonOperator 的示例说明：\n\n```\ndef decision_loop(result):\n\
  if value > 0.5:\nreturn ['third_task', 'fifth_task']\nreturn ['fourth_task']\nbranching\
  \ = BranchPythonOperator(\ntask_id='branch',\npython_callable=decision_loop,\n)\n\
  ```\n\n此示例使用了较旧的语法，您可以在其中创建相应操作符类的实例，而最新的语法则使用一个装饰器来处理相应操作符的实例化和操作。\n\n让我们看一个使用新语法的示例：\n\
  \n```\nfrom airflow.decorators import dag, task\nfrom datetime import datetime\n\
  from random import randint\n@dag(\nstart_date=datetime(2024, 2, 2),\nschedule=None,\n\
  catchup=False\n)\ndef branch():\n@task\ndef cur_task():\nreturn randint(1,100)\n\
  @task.branch\ndef decision_loop(value_from_cur_task):\nif ((value_from_cur_task\
  \ > 0) and (value_from_cur_task  40) and (value_from_cur_task <= 80)):\nreturn 'other_task'\n\
  else:\nreturn 'hello_world'\n@task\ndef i_am_next():\npass\n@task\ndef next_to_that():\n\
  pass\n@task\ndef other_task():\npass\n@task\ndef hello_world():\npass\nvalue_from_cur_task\
  \ = cur_task()\ndecision_loop(value_from_cur_task)\n```\n\n此示例使用了任务装饰器。根据给定任务生成的值，检查一个条件，并根据评估结果返回相应的任务\
  \ ID，这将决定运行哪个下游任务。在代码中，`@task.branch` 是 `BranchPythonOperator` 的装饰器版本。\n\n另一个可用于控制工作流的操作符称为\
  \ ShortCircuitOperator。如果 ShortCircuitOperator 满足给定条件，它将跳过所有下游任务。让我们看一个示例：\n\n```\n\
  from airflow.decorators import task, dag\nfrom airflow.models.baseoperator import\
  \ chain\nfrom datetime import datetime\nfrom random import getrandbits\n@dag(\n\
  start_date=datetime(2024, 2, 2),\nschedule='@daily',\ncatchup=False,\n)\ndef sc1():\n\
  @task\ndef begin():\nreturn bool(getrandbits(1))\n@task.short_circuit\ndef decision_loop(value):\n\
  return value\n@task\ndef success():\nprint('Not skipping the execution')\nchain(decision_loop(begin()),\
  \ success())\nsc1()\n```\n\n在此示例中，我们有一个简单的函数，它返回一个随机的 true 或 false，并将其提供给决策循环函数。如果随机函数返回\
  \ true，则执行下游任务 success()；如果随机函数未返回 true，则跳过下游任务。因此，每次运行此 DAG 时，您都会获得不同的结果。\n\n触发器\n\
  正如我们在前面的章节中讨论的，一个给定的任务只有在所有前置任务成功完成后才会执行。我们已经看到了根据条件控制执行的方法。让我们想象一个场景，其中有 `n` 个任务线性调度，一个任务在其前置任务成功完成后开始执行。\n\
  假设我们有一个需求：如果一个任务失败，则忽略所有其他后续任务，并且必须只运行结论任务。您不能短路剩余的工作流，因为那样会跳过包括结论任务在内的所有任务。这就是触发器概念的有用之处。\n\
  \n您可以通过向任务添加 `trigger_rule` 参数，在任务本身内部配置触发器。让我们看一个示例：\n\n```\nfrom airflow.decorators\
  \ import dag, task\nfrom airflow.utils.trigger_rule import TriggerRule\nfrom datetime\
  \ import datetime\nimport random\n@dag(\nstart_date=datetime(2024,2,2),\ndag_id=\"\
  trigger_illustration\",\nschedule=\"@daily\"\n)\ndef dag_trigger():\n@task(task_id=\"\
  begin\")\ndef begin():\nprint(\"Task execution begins\")\n@task(task_id=\"random_task\"\
  )\ndef random_task():\nif random.choice([True,False]):\nraise ValueError(\"Task\
  \ 2nd in queue unsuccessful\")\nelse:\nprint(\"Task 2nd in queue executed\")\n@task(\n\
  task_id=\"task3\",\ntrigger_rule=TriggerRule.NONE_FAILED_MIN_ONE_SUCCESS\n)\ndef\
  \ task3():\nprint(\"Task 3rd in queue executed\")\n@task(\ntask_id=\"task4\",\n\
  trigger_rule=TriggerRule.NONE_FAILED_MIN_ONE_SUCCESS\n)\ndef task4():\nprint(\"\
  Task 4th in queue executed\")\n@task(\ntask_id=\"conclusion_task\",\ntrigger_rule=TriggerRule.ONE_FAILED\n\
  )\ndef conclusion_task():\nprint(\"One of the tasks unsuccessful\")\n#begin() >>\
  \ random_task()\n#random_task() >> [task3(), task4()] >> conclusion_task()\nbegin()\
  \ >> random_task() >> [task3(), task4()] >> conclusion_task()\ndag_trigger()\n```\n\
  \n在前面的示例中，我们有五个任务，其中一个任务被配置为执行或不执行，在此期间必须执行结论任务。通过指定各种触发规则，我们能够在任务未执行的情况下跳过下游任务并执行结论任务。\n\
  \n结论\n正如我们在本章中所探讨的，Apache Airflow 是一个强大的工作流编排工具，也是编排数据工程和机器学习作业的良好解决方案。Apache Airflow\
  \ 已经存在了近十年，支持工作流编排并提供高级功能和自定义选项。所有云供应商似乎都提供 Apache Airflow 即服务，这表明它在行业中被广泛采用。我们研究了如何设置\
  \ Airflow、Airflow 系统的架构、组件以及它们如何协同工作。然后，我们研究了 DAG、钩子、操作符、变量、宏、参数、触发器和其他概念，以及如何利用它们来编排数据管道。在下一章中，我们将介绍另一个工作流编排工具，它更加强大，并且使您能够无需\
  \ DAG 即可工作。工作流编排工具的选择取决于项目需求、当前基础设施和团队。\n\n13. 使用 Prefect 编排数据工程管道\n\n简介\n之前我们研究了\
  \ Apache Airflow，这是最广泛采用的工作流编排解决方案。Apache Airflow 得到了社区的广泛采用和支持。在本章中，我们将介绍另一个名为\
  \ Prefect 的工作流编排解决方案。我们将研究其架构以及如何在没有 DAG 的情况下创建工作流。不过，您仍然可以在 Prefect 中定义 DAG。Prefect\
  \ 的特性、组件和典型工作流看起来与我们之前看到的 Apache Airflow 不同。至于哪个工具是更好的选择，这取决于许多因素，如团队、需求、基础设施等。\n\
  \n在本章结束时，您将学习到：\n\n*   Prefect 工作流编排的基础知识和关键概念\n*   设置、安装和配置 Prefect 开发环境\n*   Prefect\
  \ 的核心概念，如流程、任务和结果\n*   工件、变量和持久化结果\n*   状态、块和状态更改钩子\n*   任务运行器\n\nPrefect 简介\nPrefect\
  \ 是第二代开源工作流编排平台，旨在帮助自动化、编排、执行和管理各种基于 Python 的任务和流程。Prefect 可以在运行时生成动态工作流。Prefect\
  \ 的学习曲线平缓，这意味着使用 Prefect 进行工作流所需的时间相对较少。使用 Prefect，可以将 Python 函数转换为可被编排、监控和观察的工作单元。Prefect\
  \ 提供的一些突出特性是：\n调度：调度作业或任务通常通过 cron 调度或使用专用的编排服务来完成。使用 Prefect，可以在简约的 Web UI 中创建、修改和查看调度。Prefect\
  \ 提供 cron 调度、间隔调度和用于更复杂事件调度的重复规则调度。\n重试：数据工程师经常编写代码，以便在失败时重试某个操作。这通常用于需要连接到数据库的情况，作为定期运行的数据集成/工程管道的一部分。使用\
  \ Prefect，可以简单地使用 Python 装饰器来指定重试次数，从而消除了对多行代码及其相关可维护性的需求。\n日志记录：日志记录是在数据管道执行期间发生事件时注册或记录信息的过程。日志记录可以包括高级信息，如注册连接到数据库的状态，以及低级信息，如捕获执行期间某个时间点的变量值。Prefect\
  \ 会自动记录各种操作的日志，而无需使用 Prefect 执行额外的配置。\n缓存：缓存是一种将数据副本存储在特定位置（通常称为缓存）的方法。其思想是高效地检索这些项目，以便在其他作业中重用。使用\
  \ Prefect，可以缓存任务的结果并将其持久化到指定位置。\n异步：Async 是 asynchronous 的缩写，是一种在主流程之外执行任务的方法。使用\
  \ Prefect，可以异步运行任务，这意味着 Prefect 可以在等待另一个任务完成时启动另一个任务，而不会停止程序的执行。\n通知：通知是数据管道在数据管道执行之前、期间或之后发送的关于事件或更新的消息。Prefect\
  \ Cloud 通过提供各种警报机制（如电子邮件、短信以及 Slack、MS Teams 等平台）来启用关于数据管道的通知。\n可观测性：Prefect Cloud\
  \ 提供了一个类似仪表板的用户界面，用户可以在其中观察和监控各种已调度、正在运行或已完成的任务和流程。\n在传统的数据栈中，必须编写多行代码，并且在某些情况下，需要利用另一个工具或软件来实现这些功能。与类似的编排平台相比，Prefect\
  \ 能够开箱即用地提供这些功能，这被认为是有吸引力的。\nPrefect 有两个不同的版本，即 Prefect Core 和 Prefect Cloud。Prefect\
  \ Cloud 是 Prefect Technologies, Inc. 的商业产品，带有一个类似仪表板的用户界面，用户可以在其中观察和监控工作流，以及一些其他功能，如基于角色的访问控制和与其他工具和技术的集成等。\n\
  Prefect Core 是一个提供核心功能的开源框架。您可以在自己的基础设施内运行 Prefect Core。Prefect Core 是一个 Python\
  \ 包，提供 Prefect 的核心组件。您可以从 Python 包安装程序中获取 Prefect。\n\n设置与安装\n\n要在您的工作站上设置 Prefect，让我们在您的系统中创建一个新的虚拟环境：\n\
  \n```\nsudo apt update / brew update\npython3 -m venv prefect\nsource prefect/bin/activate\n\
  ```\n\n如果您使用的是 MS Windows 操作系统，请使用以下命令：\n\n```\nprefect/Scripts/activate\n```\n\n\
  接下来，在您的系统中安装 Prefect：\n\n```\npip install -U prefect\n```\n\n让我们通过运行以下命令来验证安装过程：\n\
  \n```\nprefect version\n```\n\n终端将打印类似这样的内容：\n\n![](img/615530_1_En_13_Fig1_HTML.jpg)\n\
  \n一个终端输出的截图，显示已安装的 Prefect 版本 2.14.21，API 版本 0.8.4，Python 版本 3.11.5，以及系统详细信息，包括\
  \ Linux 架构、SQLite 数据库版本 3.41.2 和 Git 提交哈希。\n\n图 13-1\n检查已安装的 Prefect 版本\n\nPrefect\
  \ 服务器\n\nPrefect Server 是一个开源后端，有助于监控和执行 Prefect 流程。Prefect Server 是 Prefect Core\
  \ 包的一部分。Prefect Server 在其用户界面中提供以下选项：\n\n*   流程运行\n*   流程\n*   部署\n*   工作池\n*  \
  \ 块\n*   变量\n*   通知\n*   任务运行并发\n*   工件\n\n以下是如何设置本地服务器：\n\n```\nprefect server\
  \ start\n```\n\n如果 Web 服务器成功启动，您将看到以下屏幕：\n\n![](img/615530_1_En_13_Fig2_HTML.jpg)\n\
  \n一个终端输出，指示各种包（包括 Prefect 2.14.21）已成功安装。提供了启动 Prefect 服务器并使用本地 API URL `http://127.0.0.1:4200`\
  \ 进行配置的说明，以及 API 文档和仪表板的链接。\n\n图 13-2\n启动 Prefect 服务器\n\n导航到浏览器并输入此 URL 以访问用户界面：\n\
  `http://127.0.0.1:4200`\n\n![](img/615530_1_En_13_Fig3_HTML.jpg)\n\nPrefect 仪表板在\
  \ localhost 127.0.0.1:4200 的截图，侧面板突出显示了 Dashboard 选项。主区域提示用户运行一个流程以开始，并带有一个标有“开始”的按钮。底部有一条消息提到了\
  \ Prefect Cloud 的扩展选项。\n\n图 13-3\nWeb 浏览器中的 Prefect 用户界面\n\n从软件设计的角度来看，似乎有三个主要组件：\n\
  \n*   Prefect 核心，提供核心的 Prefect 功能和工作流编排引擎\n*   用于 Prefect 元数据的后端数据库，默认附带 sqlite，并且可以配置为\
  \ Postgres 数据库\n*   用于观察和监控工作流、机密管理和其他编排相关功能的 Web 服务器\n\n您可以通过发出以下命令来重置后端 Prefect\
  \ 数据库：\n\n```\nprefect server database reset -y\n```\n\nPrefect 是一个开源的工作流编排系统，它管理组织的数据管道，并提供各种开箱即用的功能，使所有数据作业和管道具有一致性。此外，Prefect\
  \ 提供了整个组织数据管道的集中视图，包括当前运行的状态和运行历史。Prefect 还提供了一个机密管理系统，可以在其中存储安全的登录凭据和其他关键凭据，与组织当前的工具集集成，并提供自定义集成。\n\
  \nPrefect 开发\n\n流程\n\n流程是 Prefect 开发中最基本的单元。流程是工作流逻辑的容器，允许用户管理和理解其工作流的状态。它在 Python\
  \ 中表示为一个单一函数。要将 Python 函数转换为 Prefect 流程，需要向该函数添加以下装饰器：\n\n```\n@flow\n```\n\n添加此装饰器后，函数的行为会发生变化，呈现以下特性：\n\
  \n*   流程状态的变化会报告给 API，从而实现对流程执行的实时观察。\n*   可以验证输入参数，从而实现数据完整性和一致性。\n*   可以在失败时执行重试（需要作为参数提及）。\n\
  *   可以强制执行超时，以防止意外的长时间运行的工作流。\n\n流程可以包含对其他流程或任务的调用，Prefect 将其称为“子流程”。\n\n流程运行\n\
  流程运行代表流程执行的单个实例。可以通过简单地运行包含该流程的 Python 脚本来创建流程运行。也可以通过设置 Prefect Cloud 或自托管 Prefect\
  \ Server 上的部署来启动流程运行。如果流程运行包含任务或子流程，则 Prefect 将跟踪每个子流程运行与父流程运行的关系。\n\n以下是一个基本 Prefect\
  \ 流程的示例：\n\n```\nfrom prefect import flow\n@flow()\ndef hello_world():\nprint(\"\
  Hello World of Prefect!\")\nhello_world()\n```\n\n让我们看一个利用可以传递给装饰器的各种参数的 Prefect\
  \ 流程的说明：\n\n```\nfrom prefect import flow\n@flow(name = \"MyFirstFlow\",\ndescription\
  \ = \"This flow prints Hello World\",\nretries = 3,\nretry_delay_seconds = 10,\n\
  flow_run_name = \"Hello World Flow\",\ntimeout_seconds = 300\n)\ndef hello_world():\n\
  print(\"Hello World of Prefect!\")\nhello_world()\n```\n\n除了流程的名称和描述，我们还可以配置重试。`retries`\
  \ 参数是在流程运行失败时重试执行的次数。您还可以通过设置 `retry_delay_seconds` 参数来指定失败后重试流程前等待的秒数。此外，还有 `timeout_operator`，如果流程超过指定的运行时间，它会将流程标记为失败。\n\
  要执行此 Python 程序，只需从终端执行该程序。执行后，您将看到类似于以下所示的日志跟踪：\n\n![](img/615530_1_En_13_Fig4_HTML.jpg)\n\
  \n一个终端输出，指示使用 Prefect 执行 Python 脚本 prefect_1.py。名为 elated turkey 的流程运行已成功创建并完成，并显示消息\
  \ Hello World of Prefect。流程运行完成状态显示为 completed。\n\n图 13-4\n执行 Prefect 流程\n\n如您所见，Prefect\
  \ 已执行了一个流程实例，并且此流程运行已被赋予一个名称。您还可以看到流程以 completed 状态结束。让我们看看用户界面：\n\n![](img/615530_1_En_13_Fig5_HTML.jpg)\n\
  \nPrefect 流程运行仪表板的截图。提供了流程、部署、工作池和标签的过滤器，以及过去一周的数据范围和一个状态字段。底部显示了一个标题为“my first\
  \ flow hello world flow”的流程运行，时间戳为 2024 年 2 月 15 日。\n\n图 13-5\n在用户界面中观察 Prefect\
  \ 流程\n\n界面\n回想一下，我们分别为流程和流程实例分配了名称“MyFirstFlow”和“Hello World Flow”。当您单击流程运行名称时，可以获得相同的日志跟踪和一些其他详细信息。效果如下：\n\
  \n![](img/615530_1_En_13_Fig6_HTML.jpg)\n\nPrefect 流程运行仪表板的截图，显示 1 个标题为“My first\
  \ flow hello world flow”的流程运行。该流程标记为已完成，时间戳为 2024 年 2 月 15 日。日志选项卡已突出显示，并选择了级别“全部”和排序“从旧到新”。信息选项显示“finished\
  \ in state completed”。\n\n图 13-6\nPrefect 流程的日志跟踪\n\n虽然流程是 Prefect 中工作流的基本概念，但一个流程可以包含一个或多个任务。\n\
  让我们看看任务的概念。\n\n任务\n任务是 Prefect 中代表单个离散工作单元的函数。完全有可能仅使用流程来创建工作流，其中过程被封装为带有流程装饰器的\
  \ Python 函数。然而，任务允许将工作流逻辑分解为更小的包，这些包可以在各种其他流程和子流程中重用。任务类似于函数，它们接受输入、执行函数并返回输出。任务可以在定义流程的同一个\
  \ Python 文件中定义。任务也可以在一个模块中定义，并可以被导入以在流程定义中使用。所有任务都必须从流程内部调用，这一点至关重要。\n任务从上游依赖项接收元数据，包括在执行之前依赖项的状态，无论是否从它们接收数据输入。这使开发人员能够使任务在另一个任务完成之前等待。在\
  \ Prefect 中，任务的使用是可选的。您可以将所有代码写在一个巨大的函数中，并为该函数使用 `@flow` 装饰器。Prefect 可以执行该函数。但是，将代码组织成尽可能多的小任务可能有助于获得运行时状态的可见性，并有助于调试代码。如果没有任务，如果一个作业在一个流程中运行并且任何一行代码失败，那么整个流程将失败。如果使用任务将流程分解为多个任务，那么调试起来会相对容易。\n\
  \n每个 Prefect 工作流必须包含一个主要的、入口点的 `@flow` 函数。从该流程函数中，可以调用许多任务、子流程和其他 Python 函数。默认情况下，任务不能在其他任务中调用；在从其他任务调用任务时，必须使用特殊的语法：\n\
  \n```\nfrom prefect import flow, task\n@task\ndef task1():\nprint(\"I am task1\"\
  )\n@task\ndef task2():\ntask1.fn()\nprint(\"I am task2\")\n@flow\ndef flow1():\n\
  task1()\ntask2()\nflow1()\n```\n\n在前面的示例中，我们看到了两个合并到一个流程中的任务。虽然 Prefect 不允许从其他任务触发任务，但有一个选项可以通过使用\
  \ `fn()` 方法直接调用任务的函数。您可以看到函数 `task1` 已在 `task2()` 函数内部被调用。这将是该函数的一次性执行，并且当从任务调用此函数时，您无法利用重试等\
  \ Prefect 功能。\n让我们看看这个程序的输出。\n当您从终端运行此代码时，您可能会收到类似于以下的日志跟踪：\n\n![](img/615530_1_En_13_Fig7_HTML.jpg)\n\
  \n一个终端输出，指示执行了一个名为 charcoal silkworm 的 Prefect 流程，包含 2 个任务：task1 和 task2，两者都已创建并成功执行。流程运行和任务运行以\
  \ completed 状态结束，任务立即执行。\n\n图 13-7\n在命令行中观察 Prefect 流程的输出\n\n此 Prefect 流程有两个任务，即\
  \ task1 和 task2，其中 task2 直接调用 task1 的函数。因此，您将看到 task1() 的执行和 task2() 的执行，其中包括 task1\
  \ 的打印函数。\n\n任务提供参数以进行进一步自定义。其中一些列在下面。以下是一个包含可选参数的任务示例：\n\n```\nfrom prefect import\
  \ flow, task\n@task\ndef task1(\nname=\"Task1\",\ndescription=\"This is the task1\
  \ returns a string\",\ntags=[test],\nretries=2,\nretry_delay_seconds=10\n):\nprint(\"\
  I am task1\")\n@task\ndef task2(\nname=\"Task2\",\ndescription=\"This is the task2\
  \ returns a string and \\\ncalls the task1 function directly\",\ntags=[test],\n\
  retries=2,\nretry_delay_seconds=10\n):\ntask1.fn()\nprint(\"I am task2\")\n@flow\n\
  def flow1(\nname=\"MainFlow\",\ndescription=\"Main flow with tasks included\",\n\
  retries=1\n):\ntask1()\ntask2()\nflow1()\n```\n\n除了提供任务的名称和描述，您还可以指定在任务执行失败时重试特定任务的次数，以及重试前等待的持续时间。还有一个布尔参数，用于指定是否将任务运行结果持久化到存储中。\n\
  \n结果\n结果非常直接。它们代表流程或任务返回的数据。如前所述，任务或流程基本上是可能返回值的 Python 函数。\n\n以下是一个如何返回结果的简单示例：\n\
  \n```\nfrom prefect import flow, task\n@task\ndef my_task():\nreturn 1\n@flow\n\
  def my_flow():\ntask_result = my_task()\nreturn task_result + 1\nresult = my_flow()\n\
  assert result == 2\n```\n\n在前面的示例中，您可以看到任务（带有任务装饰器的函数）的输出被保存到一个变量中。流程的输出也被保存到一个变量中。虽然此程序能够将任务和流程的结果保存到变量中，但该程序无法持久化它们。\n\
  \n持久化结果\nPrefect 不会存储结果，除非它们有助于 Prefect 减少读写结果存储的开销。结果被持久化到一个存储位置，Prefect 存储对结果的引用。\n\
  \n以下功能依赖于结果的持久化：\n\n*   任务缓存键\n*   流程运行重试\n*   禁用内存中缓存\n\n要在 Prefect 中持久化结果，您需要启用结果持久化参数，指定存储位置，并且还可以选择将输出序列化为\
  \ JSON 或使用 pickle 序列化器。根据程序中使用的参数，结果可以持久化到给定任务、所有任务或一个流程。考虑以下示例：\n\n```\nfrom prefect\
  \ import flow, task\n@task\ndef task1(a: int, b: int) -> int:\nc = a + b\nreturn\
  \ c\n@flow(retries=2)\ndef flow():\nans = task1(2,3)\nprint(ans)\nflow()\n```\n\n\
  在此示例中，流程启用了 `retries` 参数，这将要求所有任务的结果都被持久化。但是，流程重试不需要流程本身被持久化。让我们尝试运行此程序：\n\n![](img/615530_1_En_13_Fig8_HTML.jpg)\n\
  \n一个终端输出，指示执行了一个名为 jovial sponge 的 Prefect 流程，包含一个任务 task1。该任务已立即执行并以 completed\
  \ 状态结束，流程在命令行中持久化了其结果。\n\n图 13-8\n在命令行中观察 Prefect 流程的输出持久化\n\n我们可以观察到程序成功执行。当您在\
  \ Prefect 服务器中检查结果时，您可能会看到结果被持久化了，而流程没有。效果如下：\n\n![](img/615530_1_En_13_Fig9_HTML.jpg)\n\
  \n一个 Prefect 仪表板，带有流程运行选项卡。类型为 list 的未持久化结果，以及 task1-0 运行的结果（类型为 int）被持久化到特定文件路径。\n\
  \n图 13-9\n结果持久化在存储中\n\n您也可以手动切换结果持久化。切换持久化将覆盖 Prefect 可能自行做出的任何操作。以下是一个示例：\n\n```\n\
  from prefect import flow, task\n@task(persist_result=False)\ndef my_task(a: int,\
  \ b: int) -> int:\nc = a * b\nreturn c\n@flow(persist_result=True)\ndef my_flow()\
  \ -> int:\nresult = my_task(5,6)\nreturn result\nmy_flow()\n```\n\n在前面的示例中，任务的 `persist_result`\
  \ 已设置为 False。这意味着该任务永远不会持久化。任何依赖于持久化的功能都可能无法工作并导致错误。但是，对于流程，`persist_result` 已设置为\
  \ True。即使某个功能不需要，流程也会持久化结果。\n让我们运行此代码：\n\n![](img/615530_1_En_13_Fig10_HTML.jpg)\n\
  \n一个终端输出，指示执行了一个名为 asparagus panda 的 Prefect 流程，其中任务 my_task_0 立即执行并成功完成，流程以 completed\
  \ 状态结束。\n\n图 13-10\n切换持久化\n\n代码运行没有错误。回想一下，我们要求任务不持久化结果，而要求流程持久化结果。让我们看看 Prefect\
  \ 服务器中的流程运行输出：\n\n![](img/615530_1_En_13_Fig11_HTML.jpg)\n\n一个 Prefect 流程运行仪表板，结果显示为类型\
  \ int 的结果已持久化到某处，而任务运行显示 my_task_0 的结果为类型 int 的未持久化结果。\n\n图 13-11\nPrefect 服务器中的流程运行输出\n\
  \n在这里，我们看到虽然任务没有持久化结果，但流程将结果存储在了本地存储中。\n\n进一步检查，该文件的序列化输出如下：\n\n```\n{\n\"serializer\"\
  : {\n\"type\": \"pickle\",\n\"picklelib\": \"cloudpickle\",\n\"picklelib_version\"\
  : \"2.2.1\"\n},\n\"data\": \"gAVLHi4=\\n\",\n\"prefect_version\": \"2.14.21\"\n\
  }\n```\n\n您可以选择指定一个特定的位置来存储结果。\n\nPrefect 中的工件\n在 Prefect 中，工件指的是持久化的输出，如链接、报告、表格或文件。它们存储在\
  \ Prefect Cloud 或 Prefect Server 实例上，并在用户界面中呈现。工件支持轻松跟踪和监控流程随时间产生和更新的对象。已发布的工件可以与任务运行、任务名称或流程运行相关联。工件提供了显示表格、Markdown\
  \ 报告和指向各种外部数据的链接的能力。\n工件可以帮助管理与团队或组织共享信息，提供有用的见解和上下文。工件的一些常见用例是：\n文档：文档是 Prefect\
  \ 工件最常见的用途。可以发布关于特定流程的各种报告和文档，其中可能包括示例数据，以便与团队共享信息并帮助跟踪工作进度。还可以随时间跟踪工件，以帮助查看数据的进展和更新。为此，工件必须共享相同的键。\n\
  数据质量报告：工件可以帮助在任务期间发布数据质量检查。在训练大型机器学习模型的情况下，可以利用工件发布性能图表。通过为多个工件指定相同的键，还可以跟踪非常具体的内容，例如数据管道中的异常。\n\
  调试：使用工件，可以发布关于结果写入时间和位置的各种信息。还可以添加指向存储位置的外部或内部链接。\n\n链接工件\n可以通过调用 `create_link_artifact()`\
  \ 方法来创建工件。每个 `create_link_artifact()` 方法都会生成一个不同的工件，并具有以下参数。\n\n以下是一个包含链接的工件的简单示例：\n\
  \n```\nfrom prefect import flow\nfrom prefect.artifacts import create_link_artifact\n\
  @flow\ndef my_flow():\ncreate_link_artifact(\nkey=\"artifcatkey1\",\nlink=\"https://www.google.com/\"\
  ,\nlink_text=\"Google\",\ndescription=\"Here is a search engine\"\n)\nif __name__\
  \ == \"__main__\":\nmy_flow()\n```\n\n当我们运行此代码时，它将为我们生成一个工件。让我们尝试找到它。在您的 Prefect\
  \ 服务器中，单击 Flow Runs 并导航到 Artifacts 列：\n\n![](img/615530_1_En_13_Fig12_HTML.jpg)\n\
  \n一个 Prefect 仪表板，显示一个流程运行，其类型为 int 的结果已持久化到存储位置，以及在流程运行 outstanding boar 期间创建的一个名为\
  \ artifact key 1 的 Markdown 工件。\n\n图 13-12\nPrefect 服务器中的工件\n\n当您单击工件时，它可能会像这样呈现链接工件：\n\
  \n![](img/615530_1_En_13_Fig13_HTML.jpg)\n\n一个 Prefect 仪表板，显示一个工件键 `artifcatkey1`。下方显示文本“Here\
  \ are the details of the search engine artifact as Google”。\n\n图 13-13\n呈现链接工件\n\
  \nMarkdown 工件\n\nMarkdown 是一种轻量级标记语言，可用于向纯文本文档添加格式元素。需要将 Markdown 语法添加到各种文本中，以指示哪些单词或短语看起来不同以及如何不同。要创建\
  \ Markdown 工件，需要使用 `create_markdown_artifact()` 函数：\n\n```\nfrom prefect import\
  \ flow, task\nfrom prefect.artifacts import create_markdown_artifact\n@task(name=\"\
  Manufacturing Report\")\ndef markdown_task():\nmarkdown_report = f\"\"\"\n\n\n\n\
  # 制造报告\n\n## 摘要\n在菠萝电脑公司，我们在过去一个季度制造了以下产品。\n\n## 各部门数据管道\n| 产品         | 数量   |\n\
  |:--------------|-------:|\n| 便携式电脑   | 60000  |\n| 平板电脑     | 70000  |\n| 手机  \
  \       | 80000  |\n\n## 结论\n这些数字非常鼓舞人心，体现了我们勤奋且足智多谋的制造团队的实力。\n\n```python\ncreate_markdown_artifact(\n\
  key=\"manufacturing-report-1a\",\nmarkdown=markdown_report,\ndescription=\"季度制造报告\"\
  ,\n)\n@flow()\ndef my_flow():\nmarkdown_task()\nif __name__ == \"__main__\":\nmy_flow()\n\
  ```\n\n运行上述 Python 代码后，我们可以在同一位置访问该 Markdown 制品。\n该制品的外观如下：\n\n![](img/615530_1_En_13_Fig14_HTML.jpg)\n\
  \n一个完美的仪表盘展示了季度制造报告，包括菠萝电脑公司制造的产品及其数量：便携式电脑 60,000 台、平板电脑 70,000 台、手机 80,000 台。结论部分强调了团队的强劲表现。\n\
  \n图 13-14\nMarkdown 制品的输出\n\n表格制品\n\n可以通过使用 `create_table_artifact()` 函数来创建表格制品。示例如下：\n\
  \n```python\nfrom prefect.artifacts import create_table_artifact\nfrom prefect import\
