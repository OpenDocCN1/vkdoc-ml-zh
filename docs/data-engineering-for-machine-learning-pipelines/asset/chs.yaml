  c  0.003117 -0.677547 -0.262260  0.684654  1.064416

  d -0.811899  1.571434  0.169619  0.424022  0.108066

  e -0.366923  0.365224 -0.173412 -1.852635  0.019401

  chunk2 f  1.102141  1.069164 -0.446039 -1.744530  1.069642

