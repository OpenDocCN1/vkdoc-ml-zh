  \ is : {js['id']}\")\ndef primaryfunc():\nc_name = connect()\nupsert(c_name)\nprimaryfunc()\n\
  ```\n\nAzure Synapse Analytics\n到目前为止，我们已经研究了对象存储、关系数据库解决方案和 NoSQL 数据库解决方案。Azure\
  \ Synapse Analytics 是 Microsoft 提供的一种现代存储解决方案，它能够将关系型、非结构化和半结构化数据存储到单个存储解决方案中。一旦数据进入\
  \ Synapse Analytics，就可以轻松使用各种计算层（如 Hadoop、Spark 或 Databricks）来查询数据并生成分析见解。此外，Synapse\
  \ 数据湖提供了将数据以 Parquet 格式保存的选项，从而减少数据占用的空间。\n你可以通过两种形式使用 Synapse Analytics，即专用 SQL\
  \ 池和无服务器 SQL 池。专用 SQL 池以前称为 Azure SQL 数据仓库。专用 SQL 池是在实例创建期间预配的计算资源集合。与 Azure SQL\
  \ 和 Cosmos DB 类似，这些实例的大小由称为数据仓库单位的单位来衡量。数据仓库单位代表一定数量的计算、内存和 IO 资源。\n顾名思义，无服务器 SQL\
  \ 池是无服务器的。无需配置底层基础设施，也无需进行集群维护。你只需为运行的数据处理付费，因此无需为底层基础设施付费。你可以在几分钟内启动并运行查询数据。此服务在你的数据湖之上创建一个查询层，你可以在数据之上运行\
  \ T-SQL 查询。\n从架构的角度来看，Synapse Analytics 将计算与存储分离。你可以独立于数据来扩展计算。在内部，Synapse SQL 使用基于节点的架构，该架构由控制节点和计算节点组成。提交的\
  \ T-SQL 代码被路由到控制节点。控制节点使用分布式查询引擎来优化查询以进行并行处理，并将任务分配给计算节点以并行执行查询。\n让我们创建一个 Azure\
  \ Synapse Analytics 实例。我们首先导航到 Azure 控制台并搜索 Synapse Analytics。当 Synapse Analytics\
  \ 服务页面为我们呈现时，我们将选择创建一个新的 Synapse 工作区。我们首先指定订阅组、资源组和托管资源组。托管资源组是 Azure 为 Synapse\
  \ 工作区创建的补充资源所在的位置。\n界面如下所示：\n\n![](img/615530_1_En_17_Fig12_HTML.jpg)\n\n一个标题为“创建\
  \ Synapse 工作区”的网页截图。表单包含订阅、资源组、托管资源组等字段。在工作区详细信息下，它列出了工作区名称、区域、Data Lake Storage\
  \ Gen2、帐户名称和文件系统名称。底部有一个已勾选的“分配我自己”复选框。\n\n图 17-12\n创建 Azure Synapse 工作区\n\n我们还必须定义工作区的名称和位置；此外，我们必须指定当前的数据湖或创建一个新的数据湖，这是配置工作区的一部分。输入基本信息后，让我们在安全设置中指定一个本地用户。\n\
  一旦 Synapse Analytics 启动并运行，你就可以在仪表板中查看它。界面如下所示：\n\n![](img/615530_1_En_17_Fig13_HTML.jpg)\n\
  \n一个包含 s1 sandbox dl storage account 选项的菜单截图。选项包括概述、活动日志、标签、诊断并解决问题、访问控制、数据迁移、事件、存储浏览器和数据存储。在基本信息下，它列出了资源组、位置、订阅、磁盘状态以及更多带有值的项目。\n\
  \n图 17-13\nAzure Synapse 工作区的仪表板\n\nAzure Data Factory\nAzure Data Factory 是一种完全托管的数据集成服务。该服务以无服务器方式提供，因为你无需为底层硬件付费。你可以通过可视化方式或编程方式设计数据集成管道。它拥有多个内置连接器，可实现更顺畅的集成；它还与\
  \ git 良好集成，因此你可以在适用的情况下推送代码更改。Azure Data Factory 允许你创建自定义事件触发器，当触发某个事件时，这些触发器会自动执行某些操作。\n\
  \n![](img/615530_1_En_17_Fig14_HTML.jpg)\n\n一个包含“基本信息”、“安全性”、“网络”、“标签”、“查看 + 创建”菜单的截图。在“安全性”下，它突出显示了身份验证，并包括身份验证方法、SQL\
  \ Server 管理员登录名、SQL 密码和确认密码字段。\n\n图 17-14\nAzure 身份验证\n\n使用 Azure Data Factory，可以在从一个系统加载数据到另一个系统时压缩数据，从而消耗更少的带宽。要开始使用\
