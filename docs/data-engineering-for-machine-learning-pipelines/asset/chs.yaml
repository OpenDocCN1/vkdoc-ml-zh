  图 17-35\n活动 ML 计算实例的图示\n\n让我们构建一个分类器模型，该模型根据给定的观察集来分类一个人是否患有糖尿病。根据你的方便，你可以选择使用 Jupyter\
  \ notebook 或访问 Visual Studio Code。我们的目标是使用 Azure ML Studio 训练模型，并使用 Azure Functions\
  \ 部署模型。\n\n以下是模型代码：\n\n```\nimport pandas as pd\nimport numpy as np\nimport pickle\n\
  from sklearn.ensemble import RandomForestRegressor\nfrom sklearn.model_selection\
  \ import train_test_split\ndf = pd.read_csv(\"diabetes.tsv\",sep=\"\\t\")\n#print(\"\
  Top records of the dataset\")\n#print(df.head())\n#print(\"Analytics on dataset\"\
  )\n#print(df.describe())\ndf = df.drop_duplicates()\ndf = df.fillna(0)\n```\n\n\n\
  # 获取与 Y 相关性最小的数据点\neliminate = np.argmin(df.corr()[\"Y\"].values)\n\n# 删除最不重要的特征\n\
  final_df = df.drop(columns=df.columns[eliminate])\n\n# 随机森林模型参数\nparams = {\n\"\
  max_depth\": 4,\n\"n_estimators\": 250,\n\"min_samples_leaf\": 4\n}\nx = final_df.drop([\"\
  Y\"], axis=1)\ny = final_df[\"Y\"]\nX_train, X_test, y_train, y_test = train_test_split(x,\
  \ y, test_size=0.2)\nmodel = RandomForestRegressor(**params)\ntrained_model = model.fit(X_train,\
  \ y_train)\npred = trained_model.predict(X_test)\nfile = 'model.pkl'\npickle.dump(model,\
  \ open(file, 'wb'))\n```\n\n你可以将此代码作为起点，构建自己的特征，并尝试其他分类器。导出 pickle 文件后，我们可以继续创建新的\
  \ Azure 函数来部署模型。如果你之前已经按照“Azure Functions”部分的内容操作过，那么请导航到终端并创建一个名为 diabetes 的新 Azure\
  \ 函数。\n\n操作示例如下：\n\n```\nfunc init diabetes --worker-runtime python --model v2\n\
  ```\n\n我们将使用 Azure Functions 将模型部署为无服务器 API，并利用 HTTP 触发器。现在，切换到 diabetes 文件夹并打开\
  \ function_app.py 文件。此函数目前仅在本地延迟部署。接下来，我们将此函数部署到 Azure 函数应用中。\n\n以下是部署模型的代码：\n\n\
  ```\nimport azure.functions as func\nimport pickle\nimport json\nimport logging\n\
  app = func.FunctionApp()\nclassifier = ['Diabetic', 'Not-diabetic']\n@app.function_name('pima-indian-diabetes-model')\n\
  @app.route(route=\"pidm\", auth_level=func.AuthLevel.ANONYMOUS)\ndef main(requests:\
  \ func.HttpRequest) -> func.HttpResponse:\nfilepath = 'model.pkl'\nwith open(filepath,\
  \ 'rb') as file:\nmodel = pickle.load(file)\ndata = requests.get_json()[\"data\"\
  ]\ny_pred = model.predict(data)[0]\npred_class = classifier[y_pred]\nlogging.info(f\"\
  For the data points: {data}, the prediction is, {pred_class}\")\nresponse = {\"\
  class\": pred_class}\nreturn func.HttpResponse(json.dumps(response))\n```\n\n结论\n\
  到目前为止，我们已经探索了从对象存储到高级分析、NoSQL 解决方案、使用 Azure 数据工厂进行数据集成、Azure Functions 以及 Azure\
