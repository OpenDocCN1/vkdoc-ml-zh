  \ Google Bigtable\n\nBigtable 是 Google Cloud 提供的一种 NoSQL 服务。这种 NoSQL 数据存储专为高吞吐量传入数据和低延迟数据库应用而设计。Bigtable\
  \ 用于需要快速获取数据的应用场景，例如股票交易、实时游戏和流媒体平台。Bigtable 是一种反范式化数据库，不支持表之间的连接操作。\n\n> **注意**\
  \  \n> 低延迟数据库是一种数据库管理系统，能够提供非常快的响应时间，例如毫秒级别。\n\nGoogle Bigtable 是一个键值存储，不支持二级索引（键除外），并且列的顺序不必固定。你仍然可以将数据存储在表中，并且在一个给定的\
  \ Bigtable 实例中可以包含多个表。在没有模式的情况下，你可以尝试将结构（或模式）相似的数据存储在同一个表中。此外，所有操作在行级别都是原子性的。我认为，当一个操作向\
  \ Bigtable 写入多行但失败时，可能会出现某些行已写入而某些行未写入的情况。\n\n在设计 Bigtable 行键时，阐明数据将如何被查询以及如何检索数据非常重要。你可以在行键中嵌入多个由分隔符分隔的标识符。在\
  \ Bigtable 中，行按行键的字典序排序，因此设计一个以通用值开头、以最细粒度值结尾的行键可能是有益的。\n\nGoogle Bigtable 将表定义为由行键索引的值的逻辑组织。让我们创建一个\
  \ Bigtable 实例。导航到 GCP 控制台并输入“Bigtable”。找到该服务后，选择创建一个实例。\n\n你也可以在工作站上安装适用于 Python\
  \ 的 Google Bigtable 客户端。根据文档（[`https://cloud.google.com/python/docs/reference/bigtable/latest`](https://cloud.google.com/python/docs/reference/bigtable/latest)），安装方法如下：\n\
  \n```\npip install google-cloud-bigtable\n```\n\n你总是需要创建一个 Bigtable 实例。一个实例通常包含一个或多个位于不同时区的集群。每个集群包含一个或多个计算节点。这些计算节点负责管理你的数据并执行其他任务。要创建实例，你必须指定存储类型，可以选择硬盘或\
  \ SSD。\n\n以下是创建实例时的界面示例：\n\n![](img/615530_1_En_16_Fig13_HTML.jpg)\n\n一张截图显示了配置第一个集群的设置。前面的步骤（命名实例和选择存储类型）已完成勾选。在“配置第一个集群”下，集群\
  \ ID、区域和可用区字段已填写。节点扩缩模式选择了“手动分配”。\n\n**图 16-13** 创建新的 Google Bigtable 实例\n\n让我们尝试将\
  \ JSON 文档上传到 Google Bigtable。\n\n以下是 JSON 文档的结构示例：\n\n```\n{\n  \"id\": 2,\n  \"\
  first_name\": \"Rube\",\n  \"last_name\": \"Mackett\",\n  \"email\": \"rmackett1@japanpost.jp\"\
  ,\n  \"gender\": \"Male\",\n  \"ip_address\": \"153.211.80.48\"\n}\n```\n\n以下是将\
  \ JSON 加载到 Google Bigtable 的示例应用：\n\n```\nfrom google.cloud import bigtable\nfrom\
  \ google.cloud.bigtable import column_family\nimport json\nimport configparser\n\
  \nconfig = configparser.ConfigParser()\npath = '/Users/pk/Documents/de/gcp/credentials.cfg'\n\
  \n# 配置信息\nproject_id = config.get('bigtable','project_id')\ninstance_id = config.get('bigtable','instance_id')\n\
  table_id = config.get('bigtable','table_id')\njson_file_path = \"/Users/pk/Downloads/randomdata.json\"\
  \n\n# 认证并连接到 Bigtable\nclient = bigtable.Client(project=project_id, admin=True)\n\
  instance = client.instance(instance_id)\ntable = instance.table(table_id)\n\nmax_versions_rule\
