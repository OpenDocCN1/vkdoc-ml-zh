  \n图 13-18\nPrefect 服务器中的块页面\n\nPrefect 为众多云数据存储和其他外部系统提供了块。也可以在 Prefect 中创建自定义块。Prefect\
  \ 的自定义块基于 Pydantic 库中的 `BaseModel` 类构建。虽然所有块在存储前都会被加密，但也可以使用 Pydantic 的 `SecretStr`\
  \ 字段类型来混淆字段。\n让我们创建一个新块。在此处，点击“添加块”；你将看到一个包含各种块的列表。以下是创建自定义 AWS S3 块的示例。S3 是亚马逊云服务提供的一种对象存储云服务。要创建一个新的\
  \ S3 块，只需在搜索栏中输入“s3”，即可获得 S3 块。在块中输入所需详细信息并保存。效果如下所示：\n\n![](img/615530_1_En_13_Fig19_HTML.jpg)\n\
  \n一个 Prefect 仪表盘显示了一个 AWS S3 存储桶块，并带有提示“将此代码片段粘贴到你的流程中以使用此块”、一个用于帮助的问号图标，以及一个“查看文档”选项。存储桶详细信息包括存储桶路径\
