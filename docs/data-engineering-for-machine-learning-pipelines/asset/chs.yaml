  ### 组合多个 Pandas 对象


  Pandas 库提供了多种方法和策略来组合一个或多个数据结构，无论是序列还是数据框。不仅如此，Pandas 还提供了比较两个相同数据结构的数据集以了解它们之间差异的能力。


  需要了解的最重要的功能之一是 Pandas 库提供的 merge 方法。merge() 方法提供了类似关系数据库的连接操作。这些由 merge() 方法提供的连接是在内存中执行的。


  merge() 方法提供了左连接、右连接、内连接、外连接和交叉连接选项。


  让我们详细了解一下它们。为了便于说明，我们假设严格关注具有行和列的数据框。


  #### 左连接


  给定两个数据框，对它们进行左连接意味着保留左侧数据框中的所有内容，并添加来自右侧数据框的任何匹配信息。假设我们有两个数据框，分别是 a 和 b。该过程首先保留数据框
  a 中的所有内容，然后从数据框 b 中寻找可能的匹配。匹配通常基于数据框中的公共列或键进行搜索。当找到匹配时，将匹配的列从 b 中取出并与 a 合并。如果存在匹配的行但信息仅部分填充，则剩余部分将填充为
  NA。


  具体如下所示。让我们初始化两个数据框：


  ```

  left_df1 = pd.DataFrame({

  ''ID'': [1, 2, 3, 4, 5],

  ''Name'': [''Alice'', ''Bob'', ''Charlie'', ''David'', ''John''],

  ''DeptID'': [101, 102, 103, 104, 103]

  })

  ```


  将输出


  ```

  ID     Name  DeptID

  0   1    Alice     101

  1   2      Bob     102

  2   3  Charlie     103

  3   4    David     104

  4   5     John     103

  right_df1 = pd.DataFrame({

  ''DeptID'': [101, 102, 103],

  ''DeptName'': [''HR'', ''IT'', ''Marketing'']

  })

  ```


  将输出


  ```

  DeptID   DeptName

  0     101         HR

  1     102         IT

  2     103  Marketing

  ```


  #### 使用 merge() 进行左连接


  现在让我们使用 merge() 方法执行左连接：


  ```

  leftjoin = pd.merge(

  left_df1,

  right_df1,

  on="DeptID",

  how="left"

  )

  print(leftjoin)

  ```


  将输出


  ```

  ID     Name  DeptID   DeptName

  0   1    Alice     101         HR

  1   2      Bob     102         IT

  2   3  Charlie     103  Marketing

  3   4    David     104        NaN

  4   5     John     103  Marketing

  ```


  在前面的示例中，您可以看到 left_df 中的所有内容都被保留，而只有来自 right_df 的匹配列被合并。left_df 中有一行在 right_df 中没有匹配的行，该行被填充为
  NaN，作为缺失值。


  #### 右连接


  右连接可以看作是左连接的逆操作。


  给定两个数据框，对它们进行右连接意味着保留右侧数据框中的所有内容，并添加来自左侧数据框的任何匹配信息。


  在我们之前的示例中，我们有两个数据框，分别是 left_df 和 right_df。


  右连接将首先保留数据框 right_df 中的所有内容，然后从数据框 left_df 中寻找可能的匹配。匹配通常基于数据框中的公共列或键进行搜索。当找到匹配时，将匹配的列从
  left_df 中取出并与 right_df 合并。如果存在匹配的行但信息仅部分填充，则剩余部分将填充为 NA。


  数据框 right_df 包含以下数据：


  ```

  DeptID   DeptName

  0     101         HR

  1     102         IT

  2     103  Marketing

  ```


  数据框 left_df 包含以下数据：


  ```

  ID     Name  DeptID

  0   1    Alice     101

  1   2      Bob     102

  2   3  Charlie     103

  3   4    David     104

  4   5     John     103

  ```


  让我们尝试对这些数据框执行右连接：


  ```

  rightjoin = pd.merge(

  left_df1,

  right_df1,

  on="DeptID",

  how="right"

  )

  print(rightjoin)

  ```


  将输出


  ```

  ID     Name  DeptID   DeptName

  0   1    Alice     101         HR

  1   2      Bob     102         IT

  2   3  Charlie     103  Marketing

  3   5     John     103  Marketing

  ```


  在右连接的情况下，右侧的表保持不变。将扫描左侧的表以根据部门 ID 列识别匹配信息。然后，匹配的列将被提取出来并附加到右侧的表中。




  #### 外连接


  在关系型数据库领域中，这些被称为全外连接。外连接是指，给定两个数据框，两者都会被保留，不会丢失任何数据。外连接产生的缺失值数量最多，但它会保留两个数据框中的所有数据：


  ```

  outerjoin = pd.merge(

  left_df1,

  right_df1,

  on="DeptID",

  how="outer"

  )

  print(outerjoin)

  ```


  将输出


  ```

  ID     Name  DeptID   DeptName

  0   1    Alice     101         HR

  1   2      Bob     102         IT

  2   3  Charlie     103  Marketing

  3   5     John     103  Marketing

  4   4    David     104        NaN

  ```


  外连接试图捕获两个表中的所有数据，并在无法匹配的位置分配一个缺失值（非数字）。


  #### 内连接


  内连接是全外连接的反向操作。这种连接是指，给定两个数据框，仅返回匹配的列作为结果数据框。两个数据框中的部分匹配项将被排除，仅返回完全匹配的项。


  以下是相同示例的代码：


  ```

  innerjoin = pd.merge(

  left_df1,

  right_df1,

  on="DeptID",

  how="inner"

  )

  print(innerjoin)

  ```


  将输出


  ```

  Out[174]:

  ID     Name  DeptID   DeptName

  0   1    Alice     101         HR

  1   2      Bob     102         IT

  2   3  Charlie     103  Marketing

  3   5     John     103  Marketing

  ```


  如您所见，存在部分匹配的行已从结果数据集中排除。


  #### 交叉连接


  交叉连接也称为笛卡尔连接。它是指给定数据框中的每一行都与另一个数据框中的行进行分配或合并。不需要公共键。


  以下是其实现方式。


  让我们初始化两个数据框。


  ```

  df_one = pd.DataFrame({

  ''ID'': [1, 2],

  ''Name'': [''John'', ''Doe'']

  })

  ```


  将输出


  ```

  ID  Name

  0   1  John

  1   2   Doe

  df_two = pd.DataFrame({

  ''ItemID'': [101, 102],

  ''Item'': [''Laptop'', ''Cable'']

  })

  ```


  将输出


  ```

  ItemID    Item

  0     101  Laptop

  1     102   Cable

  ```


  现在让我们执行交叉连接：


  ```

  cross_join = pd.merge(

  df_one,

  df_two,

  how="cross"

  )

  print(cross_join)

  ```


  将输出


  ```

  ID   Name  ItemID    Item

  0   1  Alice     101  Laptop

  1   1  Alice     102   Cable

  2   2    Bob     101  Laptop

  3   2    Bob     102   Cable

  ```


  ## 数据重塑


  数据重塑是在保留数据集中包含的值和观测值的同时，转换数据结构的过程。进行数据重塑的目的是在改变数据维度的同时，发现新的信息和见解，而无需更改数值。


  ### pivot( )


  数据重塑最常见的概念是数据透视表。由 Microsoft Excel 推广开来，数据透视表可以重新排列行和列的数据。常见应用包括为仪表盘、进一步分析等准备数据。


  以下是一个数据透视表的示例。假设我们有以下数据集：


  ```

  data = {

  ''Date'':

  [''2023-06-01'', ''2023-06-01'', ''2023-06-01'', ''2023-06-02'', ''2023-06-02'',
  ''2023-06-02''],

  ''City'':

  [''Cupertino'', ''Portland'', ''Fort Worth'', ''Cupertino'', ''Portland'', ''Fort
  Worth''],

  ''Temperature'':

  [56, 65, 69, 59, 61, 66]

  }

  df = pd.DataFrame(data)

  ```


  将输出


  ```

  Date        City  Temperature

  0  2023-06-01   Cupertino           56

  1  2023-06-01    Portland           65

  2  2023-06-01  Fort Worth           69

  3  2023-06-02   Cupertino           59

  4  2023-06-02    Portland           61

  5  2023-06-02  Fort Worth           66

  ```


  现在让我们重塑数据，使城市列中的值成为列类别：


  ```

  pivoted_df = df.pivot(

  index=''Date'',

  columns=''City'',

  values=''Temperature''

  )

  print(pivoted_df)

  ```


  将输出


