  \ \n```\n\nAzure Machine Learning\nAzure Machine Learning 是一种完全托管的机器学习服务，可帮助开发代码、训练机器学习模型、执行、部署和管理已部署的机器学习模型。Azure\
  \ Machine Learning 服务提供无服务器计算。Azure Machine Learning 提供的主要服务是 Azure ML Studio 和用于机器学习的\
  \ Python SDK。使用 Azure ML Studio，你可以使用 Jupyter Notebook 编写自己的代码，并使用 Azure ML 服务执行相同的代码。Azure\
  \ 还提供了一个低代码选项，使你能够拖放 ML 数据资产和组件来设计、训练和部署机器学习模型。\n要开始使用 Azure Machine Learning，请导航到管理控制台并搜索“Azure\
  \ machine learning”。你将在市场选项中找到 Azure Machine Learning。选择该服务并创建一个新的机器学习工作区。为你的订阅和工作区提供适当的详细信息。\n\
  界面如下所示：\n\n![](img/615530_1_En_17_Fig29_HTML.jpg)\n\n一个标题为“Azure Machine Learning”的对话框截图。表单包含订阅、资源组、名称、区域、存储帐户、密钥保管库和\
  \ Application Insights 等字段。每个字段都有一个下拉菜单，其中包含可供选择的选项。它有“查看 + 创建”、“上一步”和“下一步”按钮。\n\
  \n图 17-29\n在 Azure Machine Learning 中创建机器学习工作区\n\n工作区选项用于启用 Azure Machine Learning\
  \ 提供的所有资源的集中视图。当你预配新的 Azure Machine Learning 工作区时，Azure 会自动创建一组专用于 Azure Machine\
  \ Learning 的服务。这些是存储帐户、密钥保管库、容器注册表和 Insights。\n存储帐户是为 Azure Machine Learning 数据资产、日志和报告（如果有）新创建的存储空间。还有一个创建\
  \ Blob 的选项。密钥保管库是一种机密管理资源，用于安全存储机器学习工作区中使用的敏感信息。Insights 将在监控机器学习项目期间提供操作见解和诊断信息。容器注册表处理用于机器学习模型、开发环境等的\
  \ Docker 容器。\n创建并可用服务后，界面如下所示：\n\n![](img/615530_1_En_17_Fig30_HTML.jpg)\n\n一个页面截图。左侧列出了“所有工作区”、“主页”、“模型目录”、“创作”和“资产”。右侧列出了\
  \ 3 个快捷方式：“创建笔记本”、“添加计算”。在快捷方式下方，包括“计算实例”。\n\n图 17-30\nAzure ML 服务主页\n\nAzure ML\
  \ 数据资产\n以前在 Azure ML Studio 中称为数据集，数据资产就像是 Azure Machine Learning 中的一个存储库，你可以在其中创建对位于其他位置的数据集的引用。你可以从\
  \ Azure 数据存储、公共 URL 和 Azure 开放数据集创建数据集引用。由于数据仍保留在其位置，因此你不会产生存储成本。数据资产中的这些数据集是延迟评估的，这有助于高效使用计算。你可以存储在数据资产中的数据集有两种类型，即\
  \ FileDataSet 和 TabularDataSet。\nFileDataSets 是对位于其他位置的一个或多个数据集的引用。源数据集可以是任何格式，FileDataSets\
  \ 创建可在机器学习工作流中使用的引用。如果你引用的数据集已经清理完毕并准备好在机器学习管道中使用，那么 FileDataSets 是一个不错的选择。\nTabularDataSet\
  \ 是另一种类型的数据集，它以其原生格式解析源数据集（一个或多个数据集）并将其转换为表格格式。然后可以将此表格格式数据集导入 Jupyter notebook\
  \ 或 Spark 环境。TabularDataSet 可以解析 JSON 文件、Parquet 文件、SQL 查询的结果以及简单的逗号分隔文件。\n以下是如何从\
  \ Azure ML Studio 创建这两种数据集类型中的任何一种。你可以单击 Azure ML Studio 中“资产”下的“数据”选项。\n界面如下所示：\n\
  \n![](img/615530_1_En_17_Fig31_HTML.jpg)\n\n一个页面截图。左侧列出了“所有工作区”、“主页”、“模型目录”、“创作”和“资产”。右侧列出了“数据”。在“数据”下，它列出了“数据资产”、“数据存储”、“数据集监视器”和“数据导入”。它突出显示了“创建”按钮。中央面板中有一个文件夹图标。\n\
  \n图 17-31\nAzure ML Studio 中的数据资产\n\n进入此页面后，单击“创建”。你可以指定数据集的名称和描述，并从“类型”下拉菜单中选择“文件”或“表格”。\n\
  界面如下所示：\n\n![](img/615530_1_En_17_Fig32_HTML.jpg)\n\n一个包含数据类型和数据源的对话框截图。右侧有名称、描述和类型字段。类型字段有一个下拉菜单，其中包含“表格”、“文件”、“文件夹”和“表”选项。已选择“表格”。\n\
  \n图 17-32\n在 Azure ML Studio 中指定数据资产\n\nAzure ML 作业\nAzure Machine Learning 基本上是一组在底层集群上运行的机器学习任务。你可以构建一个\
  \ ML 训练作业，它可能包含一组训练机器学习模型的任务；你也可以构建一个扫描作业，它可能包含一组使用多个超参数执行机器学习模型的任务，并选择最能最小化成本函数的最佳模型。这些作业还会生成日志条目，Azure\
  \ ML Studio 可以跟踪每个 ML 作业的指标。\n要开始开发机器学习模型，你需要一个机器学习工作区和一个计算实例。在前面的部分中，我们已经创建了一个工作区。要创建新的计算实例，你可以选择“管理”下的“计算”选项，或者只需单击仪表板上的“添加计算实例”。\n\
  界面如下所示：\n\n![](img/615530_1_En_17_Fig33_HTML.jpg)\n\n一个页面截图。左侧列出了“数据”和“计算”等选项。右侧列出了\
  \ 3 个快捷方式：“创建笔记本”、“添加计算”。在快捷方式下方，包括“计算实例”。\n\n图 17-33\n在 Azure ML Studio 中添加新的计算实例\n\
  \n你可以为计算实例指定名称，并选择是需要基于 CPU 的实例还是基于 GPU 的实例。实例类型的选择将基于你打算执行的机器学习任务的性质。\nGPU 始终与并行性和高性能计算相关联，因此，如果你的机器学习模型利用并行性（通过\
  \ Dask 或 Ray），你可以选择此选项。某些应用程序，如训练具有多个层的深度学习模型或计算机视觉任务（图像处理），非常适合使用 GPU。某些机器学习应用程序，如文本建模、大型模型或构建推荐引擎，其底层任务受益于并行性，可以通过\
  \ CPU 和 GPU 架构进行训练。对于表格数据，基于 CPU 的计算可能就足够了。\n选择虚拟机后，你可以保留其他选项不变，然后继续创建计算实例。界面如下所示：\n\
  \n![](img/615530_1_En_17_Fig34_HTML.jpg)\n\n一个页面截图，包括“所需设置”、“计划”、“安全性”、“应用程序”、“标签”和“查看”。在“配置所需设置”下，它有“计算名称”、“虚拟机类型”、“虚拟机大小”以及一个包含“名称”、“类别”、“可用配额”和“成本”的表格。底部有“查看\
  \ + 创建”按钮。\n\n图 17-34\n在 Azure ML Studio 中创建新的计算实例\n\n创建计算实例后，你可以开始利用该计算资源来开发你的机器学习模型。你可以选择\
  \ Jupyter Notebook 选项或基于 Web 的 VS Code 编辑器。\n界面如下所示：\n\n![](img/615530_1_En_17_Fig35_HTML.jpg)\n\
