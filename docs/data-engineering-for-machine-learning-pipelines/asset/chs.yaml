  \n16. 使用 Google Cloud Platform 构建数据管道\n\n引言\n在本章中，我们将研究 Google Cloud Platform，它是云计算的早期采用者之一。我们将探索\
  \ GCP 的各种服务，重点关注数据工程和机器学习能力。我们将从理解 Google Cloud Platform 的核心概念和查看关键服务开始。然后详细研究 Google\
  \ Cloud Platform 提供的各种数据系统服务。最后，我们将研究 Google Vertex AI，这是一个完全托管的机器学习平台，用于在一个服务内构建、训练和部署机器学习模型。\n\
  \n在本章结束时，您将学习\n\n*   Google Cloud Platform 的基础知识\n\n*   如何设置 Google CLI 来管理资源\n\n\
  *   Google 的对象存储和用于虚拟机及数据系统的计算引擎\n\n*   Google 的数据处理工具 Dataproc，用于运行 Spark 和 Hadoop\
  \ 工作负载\n\n*   使用 Google Vertex AI 开发、训练和部署机器学习模型\n\n当您开始探索 Google Cloud Platform\
  \ 的旅程时，请您务必注意管理云资源，尤其是在您使用完它们之后。在传统基础设施的情况下，您可以在使用完后关闭计算机。然而，在云基础设施的情况下，您通常购买的是基于按需付费模式的计划，即使资源未被使用，您也需要为其付费。注销\
  \ GCP 并不意味着关闭您已购买的服务。这对于虚拟机、数据库和任何其他计算密集型资源尤其重要。请务必养成检查活动资源并关闭这些特定资源的习惯。如果您不再计划使用某项服务，可以将其删除。这样，您只需为积极使用的服务付费，从而控制成本。我还要感谢\
  \ GCP 为新用户提供免费额度，并积极支持新学习者降低他们的成本。\n\nGoogle Cloud Platform\nGoogle Cloud Platform\
  \ 是 Google 提供的一套云计算服务。Google 早在 2008 年就开始提供云计算，当时他们提供了 App Engine，这是一个用于托管和管理 Web\
  \ 应用程序的平台，其数据中心完全由 Google 管理。Google 的数据中心遍布全球。它们被指定为区域和可用区。每个区域包含一组可用区。这些可用区彼此隔离。Google\
  \ Cloud 提供各种服务，这些服务可以是硬件或软件产品或资源。\nGoogle Cloud 有项目的概念。如果您尝试使用 Google Cloud 服务，那么它必须是一个项目的一部分。Google\
  \ 将项目定义为一个由设置、权限和其他描述您应用程序的元数据组成的实体。每次创建新项目时，Google Cloud 都会为您提供一个项目名称、项目 ID 和项目编号。您可以创建多个项目，并关联到同一个账户进行计费。\n\
  在 AWS 中，我们看到了资源层次结构的概念，其中我们有一个根账户，使我们能够通过 AWS Organizations 创建组织单位，并从中创建 AWS 账户，并在这些账户内配置各种服务。在\
  \ GCP 中，层次结构始于一个组织资源，它类似于 AWS 根账户。\n组织资源控制计费、访问控制列表和管理各种资源。一个组织节点可以有一个或多个文件夹，每个文件夹代表组织内的某种子组织或部门。每个文件夹可以有一个或多个项目。项目代表组织中的最低层次。任何给定的项目都是可以配置虚拟机或存储实例的地方。\n\
  出于说明目的，让我们将文件夹设置为 GCP 设置的一部分。您首先需要一个 Google 帐户。我建议您首先创建一个沙箱文件夹，并在其中创建您的项目。当您获得进展后，可以设置一个开发文件夹，并在那里测试您的用例。Google\
  \ Cloud 可以通过图形用户界面、命令行界面以及提供 API 来管理资源和服务的客户端库进行访问和交互。\n\n设置 GCP 账户\n让我们从访问 [`https://cloud.google.com`](https://cloud.google.com)\
  \ 开始。\n单击“登录”并按照屏幕上的说明创建新的 Google 帐户或登录现有的 Google 帐户。根据需要输入详细信息，然后继续开始。我们想要进入 Google\
  \ Cloud 控制台页面（类似于 AWS 管理控制台）。\n以下是 Google 控制台页面的可能样子：\n\n![](img/615530_1_En_16_Fig1_HTML.jpg)\n\
  \n一个 Google Cloud Platform 的截图。仪表板页面左侧有项目信息，中间有与 API 相关的信息，右侧有 Google Cloud Platform\
  \ 状态和与监控相关的链接。\n\n图 16-1\nGoogle Cloud 控制台页面\n\nGoogle Cloud Storage\nGoogle 的 Cloud\
  \ Storage 是一项对象存储服务。Cloud Storage 将数据存储为唯一的对象或 blob。与关系数据库管理系统不同，您无需定义模式即可使用 Cloud\
  \ Storage。您可以存储数据文件、图像、视频、音频等。这些文件被称为对象。这些对象被放置在称为存储桶的容器中。这些对象可以通过唯一键以 URL 的形式引用。Cloud\
  \ Storage 有多种数据存储类型和应用；您可以首先存储您网站的内容、以关系表形式收集数据的数据文件、定期存档、您在网站上托管的视频和采访、文档等。这些文件被视为原子性的，这意味着如果您尝试访问一个对象，您访问的是整个对象。\n\
  就数据安全而言，您可以利用 Google IAM 和 Cloud Storage 的访问控制列表机制进行身份验证和授权。在 Cloud Storage 中，单个对象也有自己的访问控制列表。对象存储服务的名称必须是唯一的，因为\
  \ Cloud Storage 具有全局命名空间。一旦您使用某个名称创建了对象服务，以后就无法修改该名称。但是，您可以重命名存储桶内的对象。\nGoogle 的\
  \ Cloud Storage 提供四种不同的存储类别，即：标准存储、近线存储、冷线存储和归档存储。标准存储选项适用于频繁访问且仅存储短时间的数据。近线存储适用于存储访问频率较低、可用性稍低的数据，数据至少存储\
  \ 30 天。冷线存储的可用性较低，适用于存储不常访问的数据，数据至少存储 90 天。归档存储适用于灾难恢复和长期备份，这些数据访问频率不高，并且服务的可用性可能不如其他三种存储类别。\n\
  Cloud Storage 提供对象生命周期管理配置，您可以在其中为给定的存储桶定义和设置条件。例如，您可以根据某个时间阈值更改对象的存储类别。您可以指定某个对象或存储桶应保留的天数。您可以启用对象版本控制，这样同一对象存在多个变体。但是，这会显著增加存储大小和产生的成本，因此建议谨慎使用。\n\
