  \n*   AWS 区域：选择地理上靠近你所在位置的区域。\n*   存储桶类型：如果你是 AWS 新手，最好选择通用存储桶。\n*   存储桶名称：除了遵循\
  \ AWS 的存储桶命名指南外，还应采用包含组织代码、部门代码、项目类型以及它是开发沙箱还是生产存储桶的命名约定；当你需要筛选多个存储桶时，这将大有帮助。\n\n\
  界面如下：\n\n![](img/615530_1_En_15_Fig18_HTML.jpg)\n\nAmazon S3 控制台截图显示了一个通用存储桶列表。用户当前正在查看名为\
  \ b p r o d e v bucket 1 的存储桶，位于美国东部区域。该存储桶及其内容均不公开。\n\n图 15-18\n创建新存储桶\n\n上传文件\n\
  \n以下是一个使用 AWS 命令行界面在指定存储桶中上传对象（文件）的示例：\n\n```\naws s3api put-object \\\n--bucket\
