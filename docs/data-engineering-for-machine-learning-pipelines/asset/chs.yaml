  ```


  这也可以扩展到列：


  让我们定义列索引：


  ```

  multi_index_col = [

  np.array(

  [''chunk1a'',''chunk1a'',''chunk1a'',

  ''chunk2a'',''chunk2a'',''chunk2a'']

  ),

  np.array(

  [''k'',''l'',''m'',

