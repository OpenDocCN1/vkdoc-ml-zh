  \n图 1-12\n\n合并后删除分支\n\n#### Gitignore\n\n数据管道有时包含敏感信息，如密码、临时文件以及其他不应提交到仓库的信息。我们使用“.gitignore”功能来有意忽略某些文件。\n\
  \n在你的文件夹根目录下创建一个“.gitignore”文件，并指定 GitHub 应忽略的各种文件。\n\n以下是一个简单的 .gitignore 示例，你也可以将其纳入你的数据管道中：\n\
  \n![](img/615530_1_En_1_Fig13_HTML.jpg)\n\n一个用户界面文件窗口的截图，标题为“G N U nano 6.2”。内部文本显示：忽略所有日志文件，忽略我的环境文件，忽略任何配置文件，以及忽略任何与集成开发环境相关的编辑器文件。\n\
  \n图 1-13\n\n一个 .gitignore 文件示例\n\n创建完成后，让我们暂存此文件并将其添加到本地仓库：\n\n```\ngit add .gitignore\n\
  git commit -m \"添加了 .gitignore 文件\"\n```\n\n注意\n\n建议谨慎操作，不要将机密信息推送到你的仓库。如果你已经有一些不需要被\
  \ git 跟踪的文件，那么你可以通过`git rm —cached secret_passwords.txt`来移除这些文件。\n\n我们在这里只是浅尝辄止地介绍了\
  \ git。我鼓励你访问 [`http://git-scm.org`](http://git-scm.org) 来了解更多关于 git 的功能。\n\n## SQL\
  \ 编程\n\nSQL 是每个数据工程职业的核心。我们所有的历史数据和企业系统都配备了关系型数据库系统。SQL 是访问、查询和处理这些关系型数据库系统中数据的方式。SQL\
  \ 代表结构化查询语言。让我们看一些基本语法。我们将使用 Postgres 数据库语法来演示一些我认为在日常任务中相关的概念和功能。\n\n### 基本 SQL\
  \ 查询\n\n任何 SQL 查询的起点是\n\n```\nSELECT * FROM TableName\n```\n\n这将返回包含所有行和列的表。\n\n\
  ```\nSELECT\nfieldname1,\nfieldname2\nFROM\nTableName\n```\n\n将返回这两个字段的所有行。\n\n\
  ```\nSELECT\nfieldname1,\nfieldname2\nFROM\nTableName\nLIMIT\n\n```\n\n将返回所有列，但只返回十行。\n\
  \n通常，我们可能不会编写执行全表扫描的 SQL 代码，除非它是一个“相对”较小的表，或者由于其他原因有必要这样做。典型的 SQL 查询会携带字段名以及带有条件表达式的某种过滤器。\n\
  \n### 条件数据过滤\n\n以下是一个查询，它根据两个条件返回产品类别：产品类别的起始字母和字符数：\n\n```\nSELECT\nproduct_id,\n\
  LENGTH(product_id) as charlength\nFROM\nproductTable\nWHERE\nproduct_id LIKE 'H%'\
  \ AND\nLENGTH(product_id) BETWEEN 2 and 4\nORDER BY\ncharlength\n```\n\n### 连接 SQL\
  \ 表\n\n在某些情况下，我们必须处理多个表才能获取特定数据。这涉及到连接这些表。有几种类型的连接，即左连接、右连接、内连接、外连接、笛卡尔连接和自连接。以下是一个示例：\n\
  \n```\nSELECT\nproductTable.fieldname1,\nproductTable.fieldname2,\ninventory.fieldname1,\n\
  inventory.fieldname4\nFROM\nproductTable\nLEFT JOIN\ninventory\nON\nproductTable.id\
  \ = inventory.product_id\n```\n\n#### SQL 中的自连接\n\n另一个有助于你开发工作的重要概念是自连接的概念。它基本上是将一个给定的表与完全相同的表进行连接。假设你有一个员工表，包含员工\
  \ ID、姓名和经理 ID，其中每个员工都被分配了一个 ID、他们的姓名以及他们主管的 ID。我们需要获得一个包含员工姓名和经理姓名的表。\n\n以下是它的样子：\n\
  \n```\nSELECT\nEmp.id,\nEmp.name,\nMang.name\nFROM\nEmployee Emp\nINNER JOIN\nEmployee\
  \ Mang\nON\nEmp.id = Mang.manager_id\n```\n\n在上述代码中，我们使用不同的别名引用同一个表，并根据它们的 ID 值进行连接。还有公用表表达式（CTE）的概念，其中一个查询的结果被临时持久化，以便与另一个查询执行特定操作。\n\
  \n### 公用表表达式\n\n公用表表达式包含子查询，这些子查询临时存储一个结果，主查询可以使用适当的 SQL 命令引用该结果并执行。CTE 是简化复杂查询并增强可读性的一种方式。\n\
  \n以下是一个通用的 CTE：\n\n```\nWITH productRaw AS (\nSELECT\np_name AS name,\np_qty AS\
  \ qty,\np_price AS price\nFROM\nproductsTable\n),\ncalculateGT AS (\nSELECT\nname,\n\
  qty,\nprice,\n(qty*price) AS grand_total\nFROM\nproductRaw\n)\nSELECT\nname,\nqty,\n\
  price,\ngrand_total\nFROM\ncalculateGT\n```\n\n当然，可能有更优化的方法来计算给定每个产品的价格和数量的总计金额。这里的想法是展示如何利用多个查询结果的临时持久化，并利用该结果生成最终的结果表。\n\
  \n### SQL 中的视图\n\n在 SQL 中，我们可以将这些查询的结果作为数据库中的对象持久化。这是通过视图的形式完成的。有两种类型的视图：标准视图和物化视图。\n\
  \n\n\n#### 标准视图\n\n标准视图是您可以在数据库中设置的视图，用于显示包含多个连接、筛选条件、函数等特定查询的结果。当您查询一个标准视图时（而不是运行一大段复杂的\
  \ SQL 代码），它总是会返回最新的结果。\n\n以下是标准视图可能的样子：\n\n```\nCREATE VIEW prod_inventory_report\
  \ AS\nSELECT\nproductTable.fieldname1,\nproductTable.fieldname2,\ninventory.fieldname1,\n\
  inventory.fieldname4\nFROM\nproductTable\nLEFT JOIN\ninventory\nON\nproductTable.id\
  \ = inventory.product_id;\n```\n\n让我们查询这个视图：\n\n```\nSELECT\n*\nFROM\nprod_inventory_report\n\
  ```\n\n#### 物化视图\n\n物化视图将视图的结果存储在一个物理表中（标准视图不会物理存储结果，而是每次调用底层的查询）。因此，您以物化视图的名义创建了一个物理表，所以性能会显著提升。但是，您需要设置触发器来定期刷新物化视图。\n\
  \n以下是物化视图可能的样子（语法与标准视图类似）：\n\n```\nCREATE MATERIALIZED VIEW IF NOT EXISTS prod_inventory_report\
  \ AS\nSELECT\nproductTable.fieldname1,\nproductTable.fieldname2,\ninventory.fieldname1,\n\
  inventory.fieldname4\nFROM\nproductTable\nLEFT JOIN\ninventory\nON\nproductTable.id\
  \ = inventory.product_id\nWITH DATA\nWITH REFRESH ON DEMAND\nWITH TABLESPACE pg_default\n\
  ```\n\n### SQL 中的临时表\n\n临时表是 SQL 中另一个有用的工具。这些表在特定的数据库会话期间创建，并且只持续到会话结束。它们有限的生命周期以及会话结束时自动删除这些表的特点，正是它们被称为临时表的原因。\n\
  \n以下是其可能的样子：\n\n```\nCREATE TEMPORARY TABLE prod_report\n(\nproduct_name VARCHAR(80),\n\
  product_quantity INTEGER,\ninventory_city VARCHAR(50),\ninventory_state VARCHAR(50)\n\
  )\nON COMMIT PRESERVE ROWS;\n```\n\n对于临时表，其模式和数据（如果在创建表后插入数据）都只在该数据库会话期间存在。当您指定\
  \ `PRESERVE ROWS` 时，它们会在会话结束时被删除。您也可以指定 `DELETE ROWS`，这样会立即删除。\n\n### SQL 中的窗口函数\n\
  \n窗口函数用于计算表中给定列的聚合值；但是，它们会保留其身份标识。SQL 中的聚合通常只涉及获取指标，而会忽略其他字段。窗口函数则会保留表的身份标识。\n\n\
  #### SQL 聚合函数\n\n让我们看一个例子：\n\n```\nSELECT\nDepartment,\nEmpID,\nSalary,\navg(Salary)\
  \ OVER (PARTITION BY Department)\nFROM\nEmployees;\n```\n\n这个例子会获取各个字段，并计算每个部门的平均薪资。结果可能如下所示：\n\
  \n```\nDepartment | EmpID | Salary | avg\n-----------+-------+--------+-------\n\
  IT        |    11 |   5200 | 4633.0\nIT        |     7 |   4200 | 4633.0\nIT   \
  \     |     9 |   4500 | 4633.0\nDS        |     5 |   3500 | 3700.0\nDS       \
  \ |     2 |   3900 | 3700.0\nHR        |     3 |   4800 | 4900.0\nHR        |  \
  \   1 |   5000 | 4900.0\n```\n\n如您所见，窗口函数计算了统计平均薪资，并按每个部门分组，同时保留了表结构，并为计算出的平均值添加了一个新列。\n\
  \n#### SQL 排名函数\n\n让我们看另一个例子。让我们根据每个部门内员工的收入为其分配一个排名。\n\n以下是其实现方式：\n\n```\nSELECT\n\
  Department,\nEmpID,\nSalary,\nRANK() OVER (PARTITION BY Department ORDER BY Salary\
  \ DESC)\nFROM\nEmployees;\n```\n\n这可能会返回一个如下所示的表：\n\n```\nDepartment | EmpID | Salary\
  \ | rank\n-----------+-------+--------+-------\nIT        |    11 |   5200 | 1\n\
  IT        |     9 |   4500 | 2\nIT        |     7 |   4200 | 3\nDS        |    \
  \ 2 |   3900 | 1\nDS        |     5 |   3500 | 2\nHR        |     1 |   5000 | 1\n\
  HR        |     3 |   4800 | 2\n```\n\n#### 查询调优与执行计划优化\n\nSQL 是数据领域中极其强大的工具。然而，理解\
  \ SQL 查询在底层是如何工作的非常重要，这样才能避免过度使用 SQL 引擎和托管 SQL 数据库的服务器。在本节中，我将与您分享一些方法，用于最小化查询执行时间、提升查询性能以及减少硬件资源消耗。\n\
  \n理解对于特定项目、每个数据库以及每个模式，最常被查询的表以及您施加条件的字段至关重要。然后，为这些最常用表的字段创建索引。\n\n您还可以创建涉及多个字段（通常是两到三个字段）的索引。这被称为复合索引，有助于提升查询性能。\n\
  \n当您有一个涉及连接和其他操作的较大查询时，请使用公用表表达式（CTE）的概念来简化复杂的逻辑。\n\n尽量通过定义具体字段来最小化任何涉及全表扫描的查询，避免使用“Select\
  \ *”。\n\n如果您确实有一个复杂查询，请考虑使用物化视图来预计算并存储这些查询的结果。当复杂查询的结果在读取操作上负载很重时，物化视图是最佳选择。\n\n\
  在需要将结果临时写入一个表，但又不想让该表持久存在于数据库中的情况下，可以考虑使用临时表。\n\n尽量减少在 SQL 查询中使用子查询；如果您最终编写了子查询，请始终将排序操作放在主查询中，并尽量避免在子查询中指定\
  \ `ORDER BY`。\n\n当指定包含 `OR` 语句的条件时，这里有一个您可以考虑的方法：编写两个独立的查询，然后将查询结果合并。\n\n## 结论\n\
  \n到目前为止，我们已经涵盖了很多内容，从复习 Python 编程到动手实践 git 和 GitHub，再到回顾 SQL 基础知识。您在这里学到的概念和技术将作为解决复杂数据工程项目的基础。Python\
  \ 的数据生态系统将使您能够编写高效的数据管道，用于数据转换和分析任务。Git 将使您能够与团队协作，参与协作式软件开发，并在数据管道演进过程中维护一个清晰且有文档记录的历史。SQL\
  \ 技能对于处理构成几乎所有数据架构基础的关系型数据库系统来说，将证明是不可或缺的。我鼓励您练习、探索并应用您所学到的知识。话虽如此，让我们在接下来的几章中，一起进入数据整理这个激动人心的主题。\n\
  \n"
- '# 2. 使用 Pandas 进行数据整理




  ## 引言


  数据整理是将来自不同数据源的数据集进行转换、操作和准备的过程。数据清洗和数据操作是描述同一过程的其他术语。在本章中，我们将介绍最古老的 Python 数据分析库
  Pandas。我由衷地认为，Pandas 库在 Python 语言被广泛用于数据分析和操作任务方面发挥了重要作用。在本章中，我们将探讨 Pandas 2.0（Pandas
  的一个主要版本），研究其数据结构、处理缺失值、执行数据转换、组合多个数据对象以及其他相关主题。


  学完本章，你将了解：


  *   Pandas 2.0 的核心数据结构：Series 和 DataFrame，以及它们如何在数据整理中使用

  *   用于访问和切片 Pandas 数据结构的各种索引技术

  *   如何有效处理缺失值，并通过重塑、数据透视和数据聚合来执行数据转换

  *   如何使用合并、连接和拼接操作符组合多个 Pandas 对象


  Pandas 是一个为数据操作和转换而构建的 Python 库。Pandas 构建在 NumPy 之上，NumPy 是另一个用于科学和数值计算的 Python
  库。


  Pandas 主要由用户社区驱动，是开源的，并且可以免费修改、分发和用于商业目的。Pandas 诞生于 2011 年，在过去十年中经历了重大演变，最近发布了一个主要版本，其代码库经过重写，功能得到增强，并且能够与其他库良好交互。Pandas
  库每月下载量超过 1 亿次，是数据操作和转换的事实标准（来源：[`http://library.io`](http://library.io/)）。


  即使不在生产环境中使用 Pandas 和 NumPy，了解其数据结构和方法也肯定有助于熟悉其他数据操作库。Pandas 为许多其他 Python 库设定了标准。


  ## 数据结构


  Pandas 主要提供两种数据结构：Series 和 DataFrame。Series 是一个 n 维数组，而 DataFrame 是一个二维的带标签数据结构，支持类似电子表格或
  SQL 表输出的表格结构。


  ### Series


  Series 数据结构允许处理带标签和不带标签的数据数组。数据可以是整数、浮点数、文本字符串或任何其他 Python 对象。


  Pandas 库提供的方法被称为对象。要调用 Series 对象，需要初始化其构造函数并提供适当的参数。一个空的初始化如下所示：


  ```

  pd.Series()

  ```


  以下是一个简单的 Series 初始化示例：


  ```

  a = [1,2,3,4,5]

  b = pd.Series(data=np.random.rand(5), index=a)

  ```


  也可以使用 Python 字典生成 Series。示例如下：


  ```

  simple_dict1 = {

  "library" : "pandas",

  "version" : 2.0,

  "year" : 2023

  }

  simple_series = pd.Series(simple_dict1)

  ```


  还可以获取和设置给定 Series 中的值。以下是获取值的方法：


  ```

  simple_series["year"]

  ```


  我们将得到：


  ```


  ```


  要修改 Series 中的值，可以执行以下操作：


  ```

  simple_series["year"] = 2024

  ```


  我们将得到：


  ```

  simple_series

  library    pandas

  version       2.0

  year         2024

  dtype: object

  ```


  在此输出中，`dtype` 是 NumPy 的数据类型对象，它包含了数据的类型，在此例中为对象。


  ### DataFrame


  DataFrame 是 Pandas 中最常用的数据结构。Pandas DataFrame 是一个二维的结构化对象数组，可以包含整数、浮点数、文本字符串或其他
  Python 对象（Series、另一个 DataFrame 等）。


  在编写生产代码时，可能会从以不同格式存储的外部数据集生成 DataFrame。然而，理解 DataFrame 的关键属性至关重要。其中一些属性如下：


  *   **Data**：数据点或实际数据。它可以是一个或多个 Series 或字典数据类型。数据可能包含整数、浮点数、字符串或任何其他 Python 对象。

  *   **Index**：数据点的行标签以及 DataFrame 本身的索引。

  *   **Columns**：数据点的列标签。

  *   **Dtype**：DataFrame 的数据类型。


  一个简单的初始化如下所示：


  ```

  data = {

  "i": [121, 144, 169],

  "j": [11, 12, 13]

  }

  df_data = pd.DataFrame(data=data, index=["a","b","c"])

  print(df_data)

  i   j

  a  121  11

  b  144  12

  c  169  13

  ```


  ## 索引


  索引简单来说就是 DataFrame 中的行引用。索引有助于标识 Pandas 数据结构。也可以说，索引是一种引用指针的方式，该指针标识 Pandas DataFrame
  中的特定行或行子集。这是一种提高数据检索性能的方法。




  ### 基本索引方法


  让我们来看一个在 Pandas 数据框中进行索引的示例。首先，我们将加载数据集并重命名某些冗长的列：


  ```

  df = pd.read_csv(

  "/your-path-to-the-file/winequality/winequality-red.csv"

  ,sep=";"

  ,usecols=[''residual sugar'', ''chlorides'', ''total sulfur dioxide'', ''density'',
  ''pH'', ''alcohol'', ''quality'']

  )

  df = df.rename({

  ''residual sugar'': ''rSugar'',

  ''total sulfur dioxide'': ''total_so2''

  },

  axis=1

  )

  ```


  以下是从数据框中返回单行的方法：


  ```

  print(df.iloc[5])

  ```


  将输出


  ```

  rSugar        1.8000

  chlorides     0.0750

  total_so2    40.0000

  density       0.9978

  pH            3.5100

  alcohol       9.4000

  quality       5.0000

  Name: 5, dtype: float64

  ```


  通过将列表作为参数传递，可以按以下方式返回多行：


  ```

  print(df.loc[[5,9,22]])

  ```


  将输出


  ```

  rSugar  chlorides  total_so2  density    pH  alcohol  quality

  5      1.8      0.075       40.0   0.9978  3.51      9.4        5

  9      6.1      0.071      102.0   0.9978  3.35     10.5        5

  22     1.6      0.106       37.0   0.9966  3.17      9.5        5

  ```


  也可以按以下方式将列表作为参数传递：


  ```

  pinot_noir = [1,4,7,22,39]

  df.iloc[pinot_noir]

  ```


  将输出


