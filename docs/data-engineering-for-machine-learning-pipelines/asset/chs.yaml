  ## Polars/SQL 交互


  虽然 Polars 库没有底层的 SQL 引擎，但它支持使用类似 SQL 的语句与数据对象进行交互。因此，当你向 Polars 数据对象发出类似 SQL 的语句时，Polars
  会将其转换为相应的表达式，并继续为你提供快速的结果（一如既往）。你可以在平面文件、JSON 文件甚至 Pandas 数据对象上执行“SQL 查询”。让我们看一个包含随机健康数据的数据集的示例。


  让我们初始化这个随机数据集：


  ```

  import polars as pl

  df = pl.read_csv(

  "path-to-your-folder/random_health_data.csv"

  )

  print(df.head())

  ```


  将输出


  ```

  shape: (5, 7)

  ┌────┬──────────────┬────┬─────┬──────┬────────────┬─────────┐

  │ id  ┆ name             ┆ age  ┆ state ┆ gender ┆ exercise_daily? ┆ copay_paid
  │

  │ --- ┆ ---              ┆ ---  ┆ ---   ┆ ---    ┆ ---             ┆ ---        │

  │ i64 ┆ str              ┆ str  ┆ str   ┆ str    ┆ bool            ┆ str        │

  ╞════╪═════════════╪═════╪═════╪══════╪════════════╪═════════╡

  │ 1   ┆ Allayne Moffett  ┆ null ┆ SC    ┆ Male   ┆ null            ┆ $206.76    │

  │ 2   ┆ Kerby Benjafield ┆ null ┆ NM    ┆ Male   ┆ true            ┆ $21.58     │

  │ 3   ┆ Raina Vallentin  ┆ null ┆ MI    ┆ Female ┆ true            ┆ $125.18    │

  │ 4   ┆ Kaela Trodden    ┆ null ┆ OH    ┆ Female ┆ false           ┆ $86.20     │

  │ 5   ┆ Faber Kloisner   ┆ null ┆ MN    ┆ Male   ┆ false           ┆ $219.38    │

  └────┴──────────────┴────┴─────┴──────┴────────────┴─────────┘

  ```


  这个虚构的数据集包含患者姓名、人口统计数据点（如性别和年龄）、他们居住的州，以及另一个名为“copay_paid”的列。请注意最后一列“copay_paid”，它是一个字符串，开头包含一个特殊字符。要将此列转换为数值数据类型，我们需要移除特殊字符（美元符号），并将剩余部分转换为小数。


  以下是我们如何从数据集中移除特殊字符的方法：


  ```

  df = df.with_columns(

  pl.col("copay_paid") \

  .str \

  .slice(1) \

  .alias("copay_paid")

  )

  print(df.head())

  ```


  将输出


  ```

  shape: (5, 7)

  ┌────┬──────────────┬────┬─────┬──────┬────────────┬─────────┐

  │ id  ┆ name             ┆ age  ┆ state ┆ gender ┆ exercise_daily? ┆ copay_paid
  │

  │ --- ┆ ---              ┆ ---  ┆ ---   ┆ ---    ┆ ---             ┆ ---        │

  │ i64 ┆ str              ┆ str  ┆ str   ┆ str    ┆ bool            ┆ str        │

  ╞════╪═════════════╪═════╪═════╪══════╪════════════╪═════════╡

  │ 1   ┆ Allayne Moffett  ┆ null ┆ SC    ┆ Male   ┆ null            ┆ 206.76     │

  │ 2   ┆ Kerby Benjafield ┆ null ┆ NM    ┆ Male   ┆ true            ┆ 21.58      │

  │ 3   ┆ Raina Vallentin  ┆ null ┆ MI    ┆ Female ┆ true            ┆ 125.18     │

  │ 4   ┆ Kaela Trodden    ┆ null ┆ OH    ┆ Female ┆ false           ┆ 86.20      │

  │ 5   ┆ Faber Kloisner   ┆ null ┆ MN    ┆ Male   ┆ false           ┆ 219.38     │

  └────┴──────────────┴────┴─────┴──────┴────────────┴─────────┘

  ```


  现在，我们可以将字符串数据类型转换为小数数据类型。以下是实现方法：


  ```

  df = df.with_columns(

  pl.col("copay_paid")\

  .str \

  .to_decimal() \

  .alias("copay"))

  print(df.head())

  ```


  将输出


  ```

  shape: (5, 8)

  ┌────┬──────────────┬─────┬─────┬──────┬────────────┬─────────┬──────────┐

  │ id  ┆ name             ┆ age  ┆ state ┆ gender ┆ exercise_daily? ┆ copay_paid
  ┆ copay        │

  │ --- ┆ ---              ┆ ---  ┆ ---   ┆ ---    ┆ ---             ┆ ---        ┆
  ---          │

  │ i64 ┆ str              ┆ str  ┆ str   ┆ str    ┆ bool            ┆ str        ┆
  decimal[*,2] │

  ╞════╪═════════════╪═════╪═════╪══════╪════════════╪═════════╪══════════╡

  │ 1   ┆ Allayne Moffett  ┆ null ┆ SC    ┆ Male   ┆ null            ┆ 206.76     ┆
  206.76       │

  │ 2   ┆ Kerby Benjafield ┆ null ┆ NM    ┆ Male   ┆ true            ┆ 21.58      ┆
  21.58        │

  │ 3   ┆ Raina Vallentin  ┆ null ┆ MI    ┆ Female ┆ true            ┆ 125.18     ┆
  125.18       │

  │ 4   ┆ Kaela Trodden    ┆ null ┆ OH    ┆ Female ┆ false           ┆ 86.20      ┆
  86.20        │

  │ 5   ┆ Faber Kloisner   ┆ null ┆ MN    ┆ Male   ┆ false           ┆ 219.38     ┆
  219.38       │

  └────┴──────────────┴─────┴─────┴──────┴────────────┴─────────┴──────────┘

  ```


  现在让我们初始化 Polars 的 SQL 上下文。SQL 上下文对象存储了类似 SQL 的语句与 Polars 表达式之间的映射关系。因此，这一步是必不可少的。


  以下是实现方法：


  ```

  pl_sql = pl.SQLContext(

  random_health_data = df

  )

  ```


  你会注意到 Polars 数据框被引用为“random_health_data”。这将是我们在编写类似 SQL 的语句时的表名。让我们定义查询：


  ```

  query1 = """

  select

  state,

  count(name) as total_Patients,

  max(copay) as most_Expensive

  from

  random_health_data

  where

  state is not null

  and copay is not null

  group by

  state

  order by

  mostExpensive desc

  limit


  """

  ```


  现在，我们可以使用 SQL 上下文来执行 SQL 查询。以下是实现方法：


  ```

  sqlresult = pl_sql.execute(

  query1,

  eager=True

  )

  print(sqlresult)

  ```


  将输出


  ```

  shape: (10, 3)

  ┌─────┬──────────┬───────────┐

  │ state ┆ totalPersons ┆ mostExpensive │

  │ ---   ┆ ---          ┆ ---           │

  │ str   ┆ u32          ┆ decimal[*,2]  │

  ╞═════╪══════════╪═══════════╡

  │ CA    ┆ 95           ┆ 274.51        │

  │ HI    ┆ 8            ┆ 274.03        │

  │ VA    ┆ 26           ┆ 273.82        │

  │ AZ    ┆ 22           ┆ 273.68        │

  │ WI    ┆ 11           ┆ 273.41        │

  │ NY    ┆ 35           ┆ 272.23        │

  │ FL    ┆ 62           ┆ 271.62        │

  │ IA    ┆ 16           ┆ 270.97        │

  │ TN    ┆ 16           ┆ 270.54        │

  │ MA    ┆ 16           ┆ 269.18        │

  └─────┴──────────┴───────────┘

  ```


  注意


  你可能已经注意到在 SQL 上下文中执行 SQL 查询时使用了“`eager=True`”。你也可以将该选项设置为 False 以启用惰性执行。这将返回一个 Polars
  惰性数据框。你可以继续在下游数据处理任务中使用该惰性数据框。




