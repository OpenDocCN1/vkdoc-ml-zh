  **Google Vertex AI**

  Google 的 Vertex AI 是一个完全托管的机器学习平台，可让您训练和部署机器学习模型。

  一旦您训练好模型，就可以将其部署在 Vertex 上，使模型使用者能够获得旨在为企业创造价值的实时智能和洞察。这个机器学习平台拥有众多功能，并且与 AWS 和
  Microsoft 提供的其他领先机器学习平台高度可比。

  让我们从头开始构建一个自定义机器学习模型，这次我们将使用 AutoML 功能。AutoML 代表自动化机器学习，是自动化机器学习模型的过程，包括预处理、特征工程、模型选择和超参数调优。

  Google Vertex AI 提供两种用于构建机器学习模型的开发环境：Vertex AI Workbench 和 Colab 笔记本。我们在上一节中已经了解了
  Vertex AI Workbench，并利用该笔记本构建了机器学习模型。这些工作台环境通过虚拟机提供，并且可自定义，同时支持 GPU。

  Google Colab 笔记本是一种托管笔记本环境，可让您与他人协作，同时 Google 为您管理底层基础设施。您可以选择自定义底层计算和配置运行时。在 Google
  Colab 中，表格文件的上传大小不能超过 20 兆字节，而在 Vertex AI Workbench 中，您可以处理大小高达 100 兆字节的表格数据集。


  让我们来看看如何使用 Google Vertex AI 构建机器学习模型并将模型作为端点托管。我们使用鸢尾花数据集来解决一个多类分类问题。以下是供您参考的机器学习代码。我鼓励您将此代码作为起点，并尝试其他分类器：


  ```

  import pandas as pd

  import pandas as pd

  from xgboost import XGBClassifier

  from sklearn.model_selection import train_test_split

  from sklearn.metrics import accuracy_score

  from sklearn.preprocessing import LabelEncoder

  import pickle

  training_dataset = pd.read_csv(''iris.csv'')

  dataset = training_dataset.values


  '
- '# split data into X and y

  X = dataset[:,0:4]

  Y = dataset[:,4]

  label_encoder = LabelEncoder()

  label_encoder = label_encoder.fit(Y)

  label_encoded_y = label_encoder.transform(Y)

  seed = 7

  test_size = 0.33

  X_train, X_test, y_train, y_test = train_test_split(

  X,

  label_encoded_y,

  test_size=test_size,

  random_state=seed

  )

  xgmodel = XGBClassifier()

  xgmodel.fit(

  X_train,

  y_train

  )

  print(xgmodel)


  '
- '# make predictions for test data

  predictions = xgmodel.predict(X_test)




  '
- '# 评估预测结果

  accuracy = accuracy_score(

  y_test,

  predictions

  )

  print("准确率: %.2f%%" % (accuracy * 100.0))

  filename = "model.pkl"

  pickle.dump(xgmodel, open(filename, ''wb''))

  ```


  注意


  Pickle 文件

  是二进制文件，用于序列化 Python 对象，例如字典、列表等。将 Python 对象转换为字节流的过程称为 pickling 或序列化。反之亦然。你可以反序列化或解封一个
  pickle 文件。由于 pickle 文件是 Python 特有的，因此被认为是安全的。在 Python 生态系统中，Pickling 常用于机器学习建模。


