  \nPython 中的装饰器是一种为现有函数添加额外功能的方式。装饰器本身就是一个函数。在参数列中，它会将另一个函数作为输入参数。用微积分的术语来说，它相当于函数的函数。如果数学不是你的强项，那么让我们看一个简单的例子。\n\
