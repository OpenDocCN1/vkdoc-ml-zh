  YAML 文件中的变量


  可以在项目 YAML 文件中引用变量。在 Prefect 中引用 YAML 文件的语法是 `{{ variable name }}`。以下是 Prefect 文档提供的一个示例，其中传递了一个变量来为部署拉取步骤中的
  git 仓库指定分支：


  ```

  pull:

  - prefect.deployments.steps.git_clone:

  repository: https://github.com/PrefectHQ/hello-projects.git

  branch: "{{ prefect.variables.deployment_branch }}"

  ```


  上述变量将在运行时进行评估。也可以在不直接更新部署的情况下更改或修改变量。


  任务运行器

  在 Prefect 中，任务可以以不同的方式运行。它们是执行任务的并发、并行和分布式方式。执行任务时无需指定任务运行器。任务简单地作为 Python 函数执行，并为该函数产生适当的返回值。通过使用默认设置，当在流程中调用任务时，Prefect
  会顺序执行该函数。

  顺序执行是一种方法，其中函数或任务一个接一个地执行，只有在前一个任务或函数完成后才执行下一个。这是最简单的任务执行模型，它按特定顺序一次执行一个任务。Prefect
  提供了一个内置的任务运行器，称为 `SequentialTaskRunner`。


  这个 `SequentialTaskRunner` 同时适用于 Python 中的同步和异步函数。以下是一个示例：


  ```

  from prefect import flow, task

  from prefect.task_runners import SequentialTaskRunner

  @task

  def task1():

  print("I am task1")

  @task

  def task2():

  task1.fn()

  print("I am task2")


  '
- '# 使用 submit 可以创建 Prefect Future，有助于返回任务的状态和结果

  @flow (task_runner=SequentialTaskRunner())

  def flow1():

  task1.submit()

  task2.submit()

  if __name__ == "__main__":

  flow1()

  ```


  Prefect 还提供了 `ConcurrentTaskRunner`，这是另一个内置的任务运行器。


  `ConcurrentTaskRunner` 以并发方式执行任务，其中多个函数或任务可以启动、运行和完成，而无需等待另一个进程完成。一个任务的执行不会阻塞流程中另一个任务的执行。以下是一个示例：


  ```

  from prefect import flow, task

  from prefect.task_runners import ConcurrentTaskRunner

  import time

  @task

  def stop_at_floor(floor):

  print(f"elevator moving to floor {floor}")

  time.sleep(floor)

  print(f"elevator stops on floor {floor}")

  @flow(task_runner=ConcurrentTaskRunner())

  def elevator():

  for floor in range(10, 0, -1):

  stop_at_floor.submit(floor)

  if __name__ == "__main__":

  elevator()

  ```


  此外，Prefect 还附带 `DaskTaskRunner`，这是一个并行任务运行器。它需要安装 Python 包 `prefect-dask`。`DaskTaskRunner`
  将任务提交给分布式调度器。对于任何给定的流程运行，都会创建一个临时的 Dask 集群。以下是一个示例：


  ```

  import dask

  from prefect import flow, task

  from prefect_dask.task_runners import DaskTaskRunner

  @task

  def show(x):

  print(x)


  '
