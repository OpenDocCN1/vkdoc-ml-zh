  ## Great Expectations 中的数据验证工作流


  到目前为止，我们已经了解了如何通过命令行界面入门，遵循各种选项和设置，并创建了一个非常简单的“Hello World”式的 Great Expectations
  项目。上一节的目的在于让你熟悉 Great Expectations 的功能和环境，因为它与创建 Pydantic 模型类或 Pandera 模式验证有所不同。


  在本节中，我们将探讨开发数据管道时需要遵循的典型数据验证工作流。以下是 Great Expectations 制定的步骤：


  1.  在工作站上安装 Great Expectations。

  2.  创建数据上下文，初始化数据上下文组件以存储元数据和其他设置管理。

  3.  连接数据，列出从 Pandas 数据帧到基于云的数据库的所有数据源，并为每个数据源执行必要步骤。

  4.  创建验证器，以便针对数据验证期望套件。

  5.  创建期望，为数据编写断言。

  6.  运行检查点，使用验证器对一批数据运行期望。

  7.  查看验证结果，即数据针对某个期望或期望套件进行验证后生成的结果。


  我们在“设置与安装”部分已经了解了在使用 CLI 之前安装 Great Expectations 的过程。成功安装 Great Expectations 后，就该设置数据上下文了。数据上下文包含期望、期望存储、检查点和数据文档的配置。初始化数据上下文非常简单，只需导入库并运行
  `get_context()` 方法：


  ```

  import great_expectations as ge

  context = ge.get_context()

  print(context)

  ```


