  Azure Data Factory 控制台\n\n在使用 Azure Data Factory 设计数据集成作业时，你可以创作一个数据集成作业，内部称为管道，它是一组逻辑上排列好要执行的活动。管道内的活动执行单个任务。你可以执行各种活动，这些活动可以连接源和目标数据系统、传输数据以及执行各种转换。\n\
