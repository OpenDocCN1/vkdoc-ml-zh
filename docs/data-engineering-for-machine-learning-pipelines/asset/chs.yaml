  Great Expectations 中的期望存储




  ## 结论


  我们继续深入探讨了数据验证的相关内容。Great Expectations 是一个创新的数据验证库，它内置了预定义的期望规则。这些预定义期望的数量持续增长，也为探索对数据进行验证的各种方法提供了丰富的资源。你还可以使用这些预定义期望创建一个模板，称为期望存储。在我看来，Great
  Expectations 社区发展非常迅速，因为在撰写本书的过程中，我已经经历了两个不同的版本。当你阅读本书时，你将见证一个重大的 1.0 版本发布。


