  \ pull request”。\n\n以下是它的样子：\n\n![](img/615530_1_En_1_Fig10_HTML.jpg)\n\n一个用户界面窗口的截图，展示了比较更改和创建拉取请求的过程。\n\
  \n图 1-10\n\n比较更改并创建拉取请求的过程\n\n一旦你创建了拉取请求，现在你需要将拉取请求合并到远程主分支。\n\n以下是它的可能样子：\n\n![](img/615530_1_En_1_Fig11_HTML.jpg)\n\
