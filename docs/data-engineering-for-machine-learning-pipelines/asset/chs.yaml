  使用制品键检查特定制品\n\nPrefect 中的状态\n状态基本上是指系统中某个对象在特定时间点的状态或状况。在 Prefect 中，状态包含关于特定任务运行或流程运行状态的信息。提及流程或任务的状态，指的是流程运行或任务运行的状态。例如，如果一个流程旨在成功、完成或正在运行，那么它直接指的是流程运行的状态。Prefect\
  \ 状态描述了程序在其执行生命周期中的当前位置。Prefect 中有终端状态和非终端状态。\n\n以下是各种状态及其描述：\n\n表 13-1\n各种状态及其描述表\n\
  \n| 状态 | 类型 | 描述 |\n| --- | --- | --- |\n| SCHEDULED | 非终端 | 运行将在未来的特定时间开始。 |\n\
  | PENDING | 非终端 | 运行已提交，但正在等待满足必要的先决条件。 |\n| RUNNING | 非终端 | 运行代码当前正在执行。 |\n| PAUSED\
  \ | 非终端 | 运行代码已停止执行，直到收到手动批准才能继续。 |\n| CANCELING | 非终端 | 代码运行的基础设施正在被清理。 |\n| COMPLETED\
  \ | 终端 | 运行成功完成。 |\n| FAILED | 终端 | 由于代码问题，运行未完成，且没有剩余的重新尝试次数。 |\n| CRASHED | 终端\
  \ | 由于基础设施问题，运行未完成。 |\n\n在 Prefect 中，流程对象的任务可以返回数据对象、Prefect 状态对象或 Prefect futures（数据和状态对象的组合）。让我们看一个关于数据对象的示例：\n\
  \n```python\nfrom prefect import flow, task\n@task\ndef add_one(x):\nreturn x +\
  \ 1\n@flow\ndef my_flow():\nresult = add_one(1) # 返回 int\n```\n\n状态对象是一个 Prefect\
  \ 对象，指示给定流程运行或任务运行的状态。你可以通过将“`return_state`”参数设置为 true 来返回一个 Prefect 状态。示例如下：\n\n\
  ```python\nfrom prefect import flow, task\n@task\ndef square(x):\nreturn x * x\n\
  @flow\ndef my_flow():\nstate = square(5, return_state=True)\nresult = state.result()\n\
  return result\nmy_flow()\n```\n\nPrefect future 是一个 Prefect 对象，同时包含数据和状态。你可以通过在函数后添加“`.submit()`”来返回一个\
  \ Prefect future：\n\n```python\nfrom prefect import flow, task\n@task\ndef square(x):\n\
  return x * x\n@flow\ndef my_flow():\nstate = square.submit(5)\ndata = state.result()\n\
  pstate = state.wait()\nreturn data, pstate\nprint(my_flow())\n```\n\n返回值决定了流程的最终状态。\n\
  \n状态变更钩子\n状态变更钩子是一种工作流控制机制概念。当流程或任务改变其状态或发生状态转换时，状态变更钩子允许你根据给定任务或流程中的状态变更类型来定义响应动作。对于任务，你可以在状态变为完成或失败时定义响应动作。对于流程，你可以在其状态变为完成、取消、崩溃或失败时定义响应动作。\n\
  \n让我们看一个示例：\n\n```python\nfrom prefect import flow, task\ndef success_hook(task,\
  \ task_run, state):\nprint(\"任务运行成功\")\ndef failure_hook(task, task_run, state):\n\
  print(\"任务运行失败\")\ndef conclusive_hook(task, task_run, state):\nprint(\"无论任务运行成功还是失败，此钩子都会运行。\"\
  )\ndef flow_cancellation_hook(task, task_run, state):\nprint(f\"流程 {flow.run} 已取消\"\
  )\ndef flow_crashed_hook(task, task_run, state):\nprint(\"流程已崩溃\")\ndef flow_completion_hook(flow,\
  \ flow_run, state):\nprint(\"流程已完成执行\")\n@task(\non_completion=[success_hook, conclusive_hook],\n\
  on_failure=[failure_hook, conclusive_hook]\n)\ndef my_task():\nprint(\"此任务成功\")\n\
  @flow(\non_completion=[flow_completion_hook],\non_cancellation=[flow_cancellation_hook,\
  \ conclusive_hook],\non_crashed=[flow_crashed_hook]\n)\ndef my_flow():\nmy_task()\n\
  my_flow()\n```\n\n从前面的代码中可以看到，对于给定的状态转换，我们指定了不止一个状态变更钩子（以列表形式）。此外，你可以为多个任务和流程的相同状态转换指定相同的状态钩子。这样，当你拥有多个任务和流程时，你可以轻松地根据任务和流程中的状态变更来控制工作流。\n\
  \n\n\n块（Blocks）\n块是 Prefect 的重要特性之一。块有助于存储配置和身份验证信息，并提供与其他系统交互的接口。\n使用 Prefect 块，可以安全地存储身份验证信息、从环境变量中提取值，以及存储各种源系统、下游系统、通信渠道和其他系统的配置信息。利用块，可以查询数据库中的数据、从\
  \ AWS S3 等云数据存储中上传或下载数据、向 Microsoft Teams 频道发送消息，以及访问 GitHub 等源代码管理工具。块在 Prefect\
  \ Server 和 Prefect Cloud 中均可使用。\n需要注意的是，块用于存储在运行时不会更改或修改的配置。在块中定义的内容在流程运行期间不可更改。可以使用\
  \ Prefect UI 创建块以及修改现有块。\n以下是其在 Prefect UI 上的显示方式：\n\n![](img/615530_1_En_13_Fig18_HTML.jpg)\n\
