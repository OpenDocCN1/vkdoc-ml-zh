  \ Python 3.9 或更高版本，你可以使用“Dict”或“dict”。\n\n让我们看另一个名为 Union 的示例，其中变量可以是几种类型之一：\n\n\
  ```\nfrom typing import Union\nvar4: list[Union[int, float]] = [3, 5, 5.9, 6.2]\n\
  ```\n\n在 Python 3.10+ 中，你还可以使用 `|` 运算符。以下是一些示例：\n\n```\nvar5: list[int | float]\
  \ = [3, 5, 5.9, 6.2]\nvar6: list[int | str | float] = [5, 6, \"foo\", \"bar\", 7.8]\n\
  ```\n\n### Python 中的生成器\n\n生成器类似于 Python 中的常规函数，但它使用 `yield` 关键字而不是 `return` 关键字来返回结果。`yield`\
  \ 关键字有助于返回一个迭代器，当对其进行迭代时，该迭代器会提供一系列值。而 `return` 关键字则返回函数的一次性结果。\n\n让我们看一个简单的示例：\n\
  \n```\ndef generator_square(n):\nx = 0\nwhile x <= n:\nyield x*x\nx += 1\nfor i\
  \ in generator_square(10):\nprint(i)\n```\n\n在这个示例中，我们有一个生成给定数字平方的函数。这个函数在被调用时，不会一次性返回一个列表，而是只返回函数的一个实例。该函数返回一个生成器对象。因此，当你迭代这个函数时，每次迭代都会得到一个值。\n\
  \n### Enumerate 函数\n\n《牛津英语词典》将“enumerate”定义为“逐一列出或提及若干事物”。你只需要记住这一点。`enumerate`\
  \ 函数应用于某种数据类型时，会返回一个枚举对象。这些枚举对象返回带有索引的数据类型，索引从 0 开始，并包含索引对应的值。\n\n以下是一个基本说明：\n\n\
  ```\na = ['apples','oranges','melons','bananas']\nprint(a)\n```\n\n会输出：\n\n```\n\
  ['apples', 'oranges', 'melons', 'bananas']\n```\n\n然而，如果你枚举同一个列表，你会得到类似这样的结果：\n\n\
  ```\nfor i in enumerate(a):\nprint(i)\n```\n\n会输出：\n\n```\n(0, 'apples')\n(1, 'oranges')\n\
  (2, 'melons')\n(3, 'bananas')\n```\n\n以下是一个使用带类型提示的元组以提高可读性的示例：\n\n```\nvar10: tuple[int,\
  \ str] = ([1,\"apple\"],[2,\"orange\"],[3,\"melon\"],[4,\"banana\"])\nprint(var10)\n\
  ([1, 'apple'], [2, 'orange'], [3, 'melon'], [4, 'banana'])\nfor i,j in enumerate(var10):\n\
  print(i,\"-->\",j)\n```\n\n会输出：\n\n```\n0 --> [1, 'apple']\n1 --> [2, 'orange']\n\
  2 --> [3, 'melon']\n3 --> [4, 'banana']\n```\n\n对于字典来说，字典本身已经有键，因此没有必要再添加索引。然而，这并非限制因素。我们仍然可以使用\
  \ `enumerate` 来迭代字典，但需要遍历每个（键，值）元组。我们需要使用 `items()` 方法来从字典中获取每个元组。\n\n以下是一个迭代字典的示例：\n\
  \n```\nsample_dict = {1:\"apple\", 2:\"orange\",3:\"melon\",4:\"banana\"}\nprint(sample_dict)\n\
  ```\n\n会输出：\n\n```\n{1: 'apple', 2: 'orange', 3: 'melon', 4: 'banana'}\n```\n\n\
  这是另一个示例：\n\n```\nfor i,j in sample_dict.items():\nprint(f\"Key is {i} and Value\
  \ is {j}\")\n```\n\n会输出：\n\n```\nKey is 1 and Value is apple\nKey is 2 and Value\
  \ is orange\nKey is 3 and Value is melon\nKey is 4 and Value is banana\n```\n\n\
  让我们使用 `enumerate`，其中变量“i”代表索引，变量“j”代表字典中的每个键值对：\n\n```\nfor i, j in enumerate(sample_dict.items()):\n\
  print(i,j)\n```\n\n会输出：\n\n```\n0 (1, 'apple')\n1 (2, 'orange')\n2 (3, 'melon')\n\
  3 (4, 'banana')\n```\n\n让我们在这里尝试另一种变体：\n\n```\nfor index, (key, value) in enumerate(sample_dict.items()):\n\
