  \n![](img/615530_1_En_17_Fig24_HTML.jpg)\n\n一个页面截图，左侧有一个选项列表。它包括“仪表板”、“运行”和“管道运行”。在“管道运行”下，它包括“所有管道运行”、“测试复制-活动运行”。“活动运行”包括活动名称、活动状态和活动类型。\n\
  \n图 17-24\n在 Azure Data Factory 中监视和重新运行数据管道\n\nAzure Functions\nAzure Functions\
  \ 是一种无服务器计算选项，它允许执行执行特定任务的函数，而无需担心底层硬件。Azure 会自动为这些函数提供更新的服务器来执行，并在需要时进行扩展。这些计算资源在运行时动态分配并自动缩放。你只需为你执行的代码（执行持续时间和使用的计算资源）付费。你可以使用\
  \ Azure Functions 构建 API、响应另一个服务上发生的事件等。\nAzure Functions 的亮点是触发器和绑定的使用。使用触发器和绑定，你可以创建与其他服务交互的函数。触发器基本上是启动函数执行的事件或条件。在\
  \ Azure Functions 中，每个函数只能有一个触发器。例如，你可以有一个具有 HTTP 触发器的 Azure 函数，该触发器接收请求并触发函数提供响应；你可以有一个服务触发器，当事件发生时（例如在\
  \ Blob 存储中上传了新文件，甚至是一个简单的计时器，按特定计划设置函数执行）激活 Azure 函数。\nAzure Functions 中的绑定提供了一种连接到各种数据源的方法；因此，你可以与服务交互（写入和读取数据）。在给定的\
  \ Azure 函数中，你可以有多个绑定。Azure Functions 支持两种类型的绑定，即输入和输出绑定。输入绑定可能包括从数据存储系统（如 Blob 存储、数据库、文件系统等）读取数据，输出绑定可能是将数据发送到另一个服务。Azure\
  \ Functions 实际上支持在给定函数中使用多个输入和输出绑定。\n要创建新的 Azure 函数，请导航到 Azure 仪表板，并搜索“Function\
  \ App”。界面如下所示：\n\n![](img/615530_1_En_17_Fig25_HTML.jpg)\n\n一个标记为“Function App”的网页截图。菜单包括“创建”、“管理视图”、“刷新”、“导出到\
