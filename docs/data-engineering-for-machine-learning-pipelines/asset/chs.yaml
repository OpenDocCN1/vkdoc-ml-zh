  '
- "# 4. 使用 CuDF 进行 GPU 驱动的数据整理\n\n## 引言\n\n随着数据量的持续增长，有时基于 CPU 的数据处理可能难以在合理的时间内提供一致的结果。这时\
  \ GPU 计算就派上了用场，它利用图形处理单元来革新数据操作和分析。在本章中，我们将探讨 CuDF，这是一个与现有 Python 生态系统良好集成的 GPU\
  \ 加速数据操作库。在深入了解 CuDF 之前，让我们也回顾一下基于 CPU 和 GPU 的计算架构以及 GPU 编程的概念。\n\n在本章结束时，你将能够\n\
  \n*   理解 CPU 与 GPU 计算的区别，以及它们如何影响数据处理。\n\n*   熟悉 GPU 编程概念。\n\n*   在 Google Colab\
  \ 上设置 CuDF 并执行基本的数据加载操作。\n\n*   应用高级数据转换，如分组、聚合和窗口函数，并探索特征工程能力。\n\n*   使用各种连接方式组合多个\
  \ CuDF 对象，并利用 CuDF 的 Pandas 加速模式来加速 Pandas 代码。\n\n## CPU 与 GPU\n\nCPU 代表中央处理单元。CPU\
  \ 处理计算机中的所有处理任务。在硬件层面，CPU 有一个微处理器，它将程序转换为机器语言并执行字节码。CPU 内部还有一个时钟机制，用于设置 CPU 的电子脉冲生成频率。时钟频率越高，处理速度越快。\n\
  \n注意\n\nCPU 也有缓存，这是一个存储单元，用于保存给定计算迭代所需的数据。缓存应该比物理内存更快，目前似乎有三个级别的缓存。还有一个内存管理单元，负责在\
  \ CPU 和 RAM 之间进行通信和协调以处理各种任务时控制数据移动。\n\n在各种任务的处理类型中，图形处理被认为是复杂的，并涉及复杂的数学运算。例如，渲染精确的图形、高细节视频、科学模拟，甚至带有物理引擎的视频游戏。这些任务需要同时（并行）进行复杂的处理和计算复杂的数学函数。图形处理单元的发展主要是为了应对这些大规模并行的复杂计算任务。\n\
  \n与 CPU 类似，图形处理单元也拥有微处理器、内存管理单元和其他此类组件。微处理器由多个计算核心组成。然而，与 CPU 相比，这些核心更小，但它们在并行处理能力方面非常强大。CPU\
  \ 和 GPU 之间的区别在于，CPU 专注于处理更多样化和多变的任务和指令。例如，CPU 可能执行诸如将文件从一个地方复制到另一个地方、运行用户提供的程序、加载系统程序以及在电子表格程序中进行数字运算等任务。这些任务在性质上并不相似。CPU\
  \ 可以在完成处理的同时轻松地在它们之间切换。另一方面，GPU 专注于对某种程度相似的计算进行大规模并行处理。GPU 从 CPU 接收指令并并行执行它们，以加速处理并渲染显示。\n\
  \n### CUDA 简介\n\nCUDA 代表计算统一设备架构。CUDA 是由 NVIDIA 开发的软件框架，专门用于为 NVIDIA GPU 编写代码。它支持在\
  \ NVIDIA GPU 上执行内核，利用其并行计算能力进行复杂的数据处理。虽然用 C 语言编写，但 CUDA 也通过 CuPy 和 PyCUDA 等库支持 Python\
  \ 编程。然而，需要注意的是，使用 CUDA 软件框架开发的程序仅适用于 NVIDIA GPU，不兼容其他制造商的 GPU。\n\n注意\n\n在当前的硬件制造市场中，有几家公司生产\
  \ GPU。NVIDIA 是著名的 GPU 制造商之一。\n\n还有 OpenCL，它也是一个类似于 CUDA 的固件。OpenCL 更通用，也可以用于非 NVIDIA\
  \ GPU。\n\n\n\n## GPU 编程概念\n\nGPU 编程通常始于接收来自 CPU 的指令。CPU 被称为主机，它负责识别可用的 GPU 及其处理核心，并为\
  \ GPU 提供指令。GPU 则被称为设备单元。例如，如果要执行一个大型软件程序，CPU 会首先识别出所有指定给 GPU 的特定函数。一旦这些特定函数被识别出来，它们就会在\
  \ GPU 上执行。\n\n### 内核\n\n内核是由开发者编写的代码包（包含特定函数）。它们通过 CUDA 编译器编译成机器码。内核是为在 GPU 上执行而编写的函数。\n\
  \n该过程始于 CPU 调用内核函数。除了调用内核，主机还会调用执行配置，确定内核执行需要多少个并行线程。GPU 使用一个由块组成的网格来执行内核，每个块包含一组线程。GPU\
  \ 块的调度部分会将这些线程发送到 GPU 上的流式多处理器。一旦执行完成，主机将从 GPU 内存中检索结果。至此，一个完整的执行周期就完成了。\n\n###\
  \ 内存管理\n\n在 GPU 上执行内核函数期间，执行（相同）内核函数的线程可能会在不同的内存位置读写数据。这些线程可以访问本地内存、共享内存和全局内存。本地内存的作用域主要限于给定线程。共享内存是仅限给定块作用域的内存，但可由其下的所有线程访问。全局内存是\
  \ GPU 和 CPU 都可以访问的内存。给定块中的所有线程可以同步它们的执行，以实现更好的内存访问。\n\n## CuDF 简介\n\nCuDF 是一个 Python\
  \ 库，提供各种专门在 NVIDIA GPU 上执行的数据操作和转换方法及函数。CuDF 利用 Apache Arrow 实现列式格式的数据结构。所有 CuDF\
  \ 的函数和方法都基于 libcudf，这是一个用于 C++ 编程的 CUDA 库。\n\nCuDF 与 Pandas 类似，区别在于它是专门为在 NVIDIA\
  \ GPU 上运行而设计的。这个 GPU 加速的数据操作和转换库在处理大型数据集时（与 Pandas 相比）提供了更高效的数据处理能力。\n\n### CuDF\
  \ 与 Pandas 对比\n\nCuDF 和 Pandas 提供了大多数执行类似操作的方法和函数。然而，这两个 Python 库在某些方面存在差异。\n\n\
  首先，CuDF 和 Pandas 都支持类似的数据结构（Series、DataFrames 等）。两者都支持对数据结构进行类似的转换操作，例如各种连接、数据框过滤、索引、分组和窗口操作。CuDF\
  \ 支持许多现有的 Pandas 数据类型，并为特殊数据类型提供支持。最好查阅相关文档以获取详细信息。\n\n在 Pandas 中，空值会被转换为非数字（NaN），而在\
  \ CuDF 中，所有数据类型都可以包含缺失值。\n\n在 CuDF 中，遍历数据结构并非最佳实践。你仍然可以编写代码来循环遍历数据框中的给定列并执行某种计算；然而，这可能会导致性能不佳。更好的选择是使用内置的\
  \ CuDF 方法执行转换，或者将 CuDF 数据框转换为 Pandas 或 Arrow 数据框，执行必要的操作，然后将结果数据框转换回 CuDF 数据框。\n\
  \n在执行连接或分组操作时，Pandas 会对数据框进行排序，而 CuDF 不会对元素进行任何排序或排序操作。如果你需要对元素进行某种排序，则需要在代码中启用\
  \ `sort=True`。\n\n### 环境搭建\n\n尽管安装页面提供了更多安装和使用 CuDF 的选项，但我推荐以下方法，以便你能快速上手 CuDF。\n\
  \n你需要一块计算能力为 6.0 及以上的 NVIDIA GPU。首先，CuDF 库构建在 CUDA 之上，CUDA 是专为 NVIDIA GPU 设计的并行处理框架。NVIDIA\
  \ 提供各种 GPU 产品，你可以在其产品目录中查看。\n\n其次，计算能力只是表示其 GPU 更新型号的一个高级术语。我对计算能力的理解是，版本号越高，GPU\
  \ 性能越好，能够处理更复杂的操作，并且效率更高。\n\n注意\n\n可以把它想象成 iPhone，较新的版本相比旧款 iPhone 拥有更多功能。计算能力就像是在说更新的\
  \ iPhone 型号。\n\n你还需要一个 Linux 发行版。虽然你可能可以通过 WSL 在 Windows 操作系统上工作，但拥有一个安装了 gcc++\
  \ 9.0 及以上版本的 Linux 实例可能会更有帮助。\n\n注意\n\n如果你使用的是 Windows 操作系统，那么你可能需要一块计算能力为 7.0 或更高（更新的型号）的\
  \ GPU。\n\n你需要合适的 NVIDIA 驱动程序和 CUDA 驱动程序，可能需要 CUDA 驱动程序版本 11.2 或更新版本。\n\n你还需要在系统上安装最新版本的\
  \ Python 3。\n\n最好卸载任何默认加载的现有 CUDA 工具包和 CUDA 包。\n\n我建议使用一个专门的虚拟环境来执行 CuDF 管道。更好的做法是在你的系统中设置一个\
  \ conda 或 miniconda 环境，然后执行 conda 安装。\n\n具体操作如下：\n\n```\nconda create --solver=libmamba\
  \ -n rapids-23.12 -c rapidsai -c conda-forge -c nvidia  \\\nrapids=23.12 python=3.10\
