  17. 使用 Microsoft Azure 构建工程数据管道




  简介

  Azure 云

  计算是微软提供的一项完全托管的计算服务。Azure 的概念最早于 2008 年的一次会议上提出，微软于 2010 年推出了 Windows Azure 服务，后更名为
  Microsoft Azure。目前，它通过各种部署模式提供一套全面的计算、数据库、分析及其他服务。微软在全球拥有数据中心，服务于各行各业。在本章中，我们将重点介绍
  Azure 的一些关键组件和服务，特别是与数据工程和机器学习相关的部分。


  学完本章，你将了解：


  *   如何设置 Microsoft Azure 账户以及 Azure 的资源层级结构

  *   微软名为 Azure Blob Storage 的对象存储及其概念与设置

  *   名为 Azure SQL 的关系数据库服务及其概念与安装

  *   Cosmos DB（一种 NoSQL 数据库）及其架构与概念

  *   完全托管的数据仓库环境

  *   无服务器函数与数据集成服务

  *   Azure Machine Learning Studio 及其概念


  在你开始探索 Microsoft Azure 平台之际，我恳请你务必注意管理云资源，尤其是在使用完毕后。对于传统基础设施，你可以在使用完毕后关闭计算机。然而，对于云基础设施，由于你通常采用按需付费模式，即使资源未被使用，也会产生费用。注销
  Azure 并不意味着关闭你已购买的服务。这一点对于虚拟机、数据库以及其他计算密集型资源尤为重要。请务必养成检查活跃资源并关闭这些特定资源的习惯。如果你不再计划使用某项服务，可以将其删除。这样，你只需为实际使用的服务付费，从而控制成本。同时，我也要感谢
  Azure 为新用户提供免费额度，并积极支持新学习者降低使用成本。


  Azure 简介

  Azure 是微软的云计算平台，提供多项与谷歌和亚马逊云服务相媲美的服务。Azure 的服务对于那些重度依赖微软技术的组织尤其具有吸引力。

  微软在数据管理领域享有长期声誉。微软是构建 ETL 工具的早期采用者之一，这些工具在促进不同数据源之间的数据移动方面发挥了重要作用。要开始使用 Microsoft
  Azure，你需要先访问微软网站注册一个 Microsoft 账户，然后才能尝试获取 Azure 的访问权限。拥有 Microsoft 账户后，你可以注册免费的
  Azure 服务。与 AWS 和 Google Cloud 类似，你需要向微软提供各种信息才能获得 Azure 服务的访问权限。


  让我们熟悉一下 Microsoft Azure 的资源层级结构。这有助于配置和管理特定账户（尤其是组织账户）所提供服务和负载的配置。最高层级称为管理组。管理组负责管理特定账户对各种服务的利用率。管理组使组织能够对管理组内的所有用户应用各种策略，并对一个或多个
  Azure 服务产品应用访问控制。从根管理组，你可以创建一个或多个管理组，这些管理组可能对应一个业务组或某种计费模式。只需从 Azure 仪表板中搜索“管理组”一词即可进入该部分，你可以为你的组织创建一个管理组。你可以将管理组命名为你的组织、组织内的部门或特定项目名称。


  如果你经常访问某个服务产品页面，那么将该页面固定到仪表板可能会更方便。为此，只需单击管理组标题旁边的图钉状图标即可。效果如下所示：


  ![](img/615530_1_En_17_Fig1_HTML.jpg)


  一个网页截图，标题为仪表板，管理组名称为 mg 1。页面有一个搜索栏，以及一系列选项，包括概述、订阅、资源组、资源、活动日志和访问控制。还有创建、添加订阅和刷新按钮。在“基本信息”下方有一个按名称或
  ID 搜索的搜索栏。


  图 17-1

  Azure 管理组仪表板




  在给定的管理组中，你可以拥有一个或多个订阅。你可以在“管理组”部分看到订阅选项。订阅是一种方案，它允许一个或多个用户访问一个或多个 Azure 服务产品。例如，你可以为特定团队在管理组中设置两个订阅，即开发订阅和生产订阅。你可能允许生产订阅拥有更多资源，并对开发订阅施加某些限制。另一个例子是为组织提供的每个产品或服务创建一个订阅，以便能够计算成本。


  在任何给定的订阅中，我们有一个称为资源组的概念。这是一个基于项目的资源分组，或一个或多个 Azure 服务的分组。例如，如果你希望建立一个数据仓库项目，并且需要数据库、数据仓库、数据集成服务、机密管理、数据建模工具服务以及日志记录和监控服务，那么你可以创建一个包含这些服务的资源组。这在治理和设置访问策略的背景下非常有益。


  最后，最低层的抽象在 Azure 中称为资源。这些是 Azure 提供的各种服务。它可以是一个数据库或一个你需要付费使用的工具。资源是任何由网络、存储或计算实体组成的东西。例如，一个使用计算能力将数据从源移动到目标的无服务器数据集成服务就是资源的一个例子。


  从数据产品和服务角度来看，让我们探讨一下存储系统、数据库服务以及数据摄取和集成服务等。


  Azure Blob 存储

  如前几节所述，对象存储是一种通用的存储系统，并且已成为云供应商成功的产品。Azure Blob 存储是一种对象存储，是与 AWS 提供的 S3 和 Google
  Cloud 提供的 Bigtable 相媲美的解决方案。Azure Blob 存储是一个高度可扩展且安全的存储平台，可以存储结构化和非结构化数据。Azure Blob
  存储提供基于策略和角色的访问控制以及数据生命周期管理。


  注意


  “Blob”是一个数据库术语，是二进制大对象的缩写。Blob 可以将任何类型的数据存储为二进制对象。它非常适合存储图像、音频、视频或 PDF 内容。不过，这些
  blob 数据是不可索引的。还有 clob，它是字符大对象的缩写，用于存储大量文本数据，如文档、大型代码片段等。


  要创建新的 blob 存储，请从主仪表板中选择“存储”并创建一个新的存储。提供实例名称并选择一个就近的区域。此外，选择标准性能和经济型复制。你可能会看到其他选项，例如选择客户管理的加密密钥等其他至关重要的选项。微软会花一点时间运行验证来检查你的选择，然后才会启用“创建”按钮。创建完成后，等待几分钟，让资源在你的帐户中部署。部署完成后，界面如下所示：


  ![](img/615530_1_En_17_Fig2_HTML.jpg)


