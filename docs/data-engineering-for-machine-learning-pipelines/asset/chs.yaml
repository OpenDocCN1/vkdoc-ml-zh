  可以使用 `.loc` 和 `.iloc` 方法来检索数据框的特定行。`.iloc` 方法是一种位置索引，它通过引用基于整数的位置来选择位置，从而尝试访问行和列；而
  `.loc` 是一种基于标签的索引，通过标签来访问行和列。


  假设我们有一个索引顺序不固定的数据框，例如：


  ```

  idx_series = pd.Series(["peach", "caramel", "apples", "melon", "orange", "grapes"],
  index=[74, 75, 76, 1, 2, 3])

  ```


  这将生成一个如下的 Pandas 序列：


  ```

  74      peach

  75    caramel

  76     apples

  1       melon

  2      orange

  3      grapes

  dtype: object

  ```


  当使用 loc 方法时，Pandas 会尝试定位作为参数传递的标签。这里，标签“1”对应的值是 melon：


  ```

  idx_series.loc[1]

  Out[107]: ''melon''

  ```


  相比之下，iloc 方法会尝试定位作为参数传递的整数位置。整数引用从 0 开始，到列表长度减 1 结束。因此，第一行将返回 caramel：


  ```

  idx_series.iloc[1]

  Out[108]: ''caramel''

  ```




  ### 多重索引


  多重索引允许通过引用多个索引，从行和列中同时选择数值。可以使用适当的方法从数组、元组和数据框中创建多重索引。最简单的方法是使用数组定义多重索引，然后直接将其传入数据框或序列。Pandas
  会自动将其整合到其数据结构中。示例如下：


  首先，我们来创建多重索引：


  ```

  import numpy as np

  multi_index_arr = [

  np.array(

  [''chunk1'',''chunk1'',''chunk1'',''chunk1'',''chunk1'',

  ''chunk2'',''chunk2'',''chunk2'',''chunk2'',''chunk2'']

  ),

  np.array(

  [''a'',''b'',''c'',''d'',''e'',

  ''f'',''g'',''h'',''i'',''j'']

  )

  ]

  ```


  现在将这个数组传入数据框。为了方便，这里初始化了一个包含随机数的数据框：


  ```

  df = pd.DataFrame(

  np.random.randn(10,5),

  index=multi_index_arr

  )

  print(df)

  ```


  以下是该数据框的结果：


  ```

