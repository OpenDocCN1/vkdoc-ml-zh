  \nAzure Cosmos DB\nAzure Cosmos DB 是 Microsoft 提供的一种托管 NoSQL 数据库服务。它是一种多功能服务产品，可以提供\
  \ SQL 和 NoSQL 数据库开发，包括关系数据模型、文档存储、图形数据库和向量数据库。Cosmos DB 提供多种 API，每种 API 模拟不同的数据库引擎。这些包括关系\
  \ SQL、用于文档数据库的 MongoDB、用于列式数据库的 Cassandra DB、用于图形数据库的 Gremlin 以及用于键值数据库的 Table。从某种意义上说，Cosmos\
  \ DB 是一种多模型数据库服务，你可以根据数据库应用程序的需求使用合适的 API。在数据库迁移的情况下，你可以选择与你打算迁移的当前关系或 NoSQL 数据库相对应的\
  \ API。\n你可以通过两种方式使用 Cosmos DB，即预配吞吐量和无服务器模型。顾名思义，在预配吞吐量中，你可以预配你期望数据库提供的吞吐量，同时定义你希望为数据库应用程序获得的性能级别。这里的度量单位称为请求单位。另一种使用\
  \ Cosmos DB 的方法是通过无服务器模型。\n无服务器模型仅根据它接收和处理的请求数量向你收费。就计费而言，预配吞吐量将根据已预配但未消耗的请求单位数量计算账单，而在无服务器的情况下，计费是根据在一小时内通过执行数据库操作消耗的请求单位数量计算的。\n\
  \n注意\n\n请求单位是衡量你如何使用服务的一种方式。你使用 Cosmos DB 执行的每个操作都会消耗一定量的计算、存储和物理内存。请求单位是根据此类消耗计算的。例如，发送到\
  \ Cosmos DB 的查询将花费一定数量的请求单位来检索结果。获取结果所需的确切请求单位数量可能取决于表的大小、查询编译时间和行数等参数。\n\n让我们看看如何使用\
  \ MongoDB API 创建一个 Cosmos DB 实例。一旦你选择了 API，该实例的 API 将保持不变。如果你希望使用另一个 API，你可能希望使用相应的\
  \ API 创建另一个实例。在我们的例子中，我们选择 MongoDB API。如果你熟悉 MongoDB，那么其用法将与 Cosmos DB 非常相似。以下是在\
  \ Cosmos DB 中选择 API 的位置：\n\n![](img/615530_1_En_17_Fig7_HTML.jpg)\n\n一个标记为“创建 Azure\
