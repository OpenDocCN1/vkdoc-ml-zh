  \n图 17-10\n为 MongoDB 集群配置 Cosmos DB 的硬件\n\n你还可以在网络选项中指定防火墙规则和连接方法。界面如下所示：\n\n![](img/615530_1_En_17_Fig11_HTML.jpg)\n\
