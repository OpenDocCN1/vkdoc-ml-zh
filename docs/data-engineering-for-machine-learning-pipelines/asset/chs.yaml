  Redshift 是一个大规模可扩展的云数据仓库。它允许您加载 PB 级的数据，执行复杂的分析查询以使用 SQL 检索数据，并连接商业智能应用程序以呈现报告和仪表板。当数据仓库环境处于空闲状态时，您无需付费，因为只有在您通过传递查询或加载数据与\
  \ Redshift 积极交互时才会产生费用。Amazon Redshift 基于开放标准的 PostgreSQL；但是，它已被定制以支持在线分析处理应用程序和其他读取密集型应用程序。\n\
  Amazon Redshift 是一个类似列存储的数据仓库，具有可扩展性，并由 AWS 完全管理。以列存储方式存储数据可减少 Redshift 上的输入输出操作次数，并优化分析查询的性能。此外，您还可以指定\
  \ Redshift 中的数据被压缩，从而进一步减少存储需求，甚至优化查询。当您对压缩数据执行查询时，数据会被解压缩并运行。\nAmazon Redshift\
  \ 实例以集群形式创建。一个集群有一个领导节点和多个计算节点。领导节点管理通信，包括与客户端应用程序和计算节点的通信。对于用户提供的分析查询，领导节点会创建一个执行计划，并列出返回结果所需的执行步骤。领导节点编译查询并将一部分执行任务分配给计算节点。领导节点会将查询分配给包含查询中提到的底层表的计算节点。\n\
  计算节点本身被划分为多个切片。每个切片在计算节点内分配一部分物理内存和存储空间。因此，当领导节点将工作分配给计算节点时，工作实际上会到达给定计算节点内的给定切片。然后，计算节点会在集群内并行处理任务。一个集群可以包含一个或多个数据库，数据存储在计算节点中。\n\
  让我们尝试设置一个新的 Amazon Redshift 集群。首先，我们必须创建一个工作组。Redshift 中的工作组是一组计算资源，还包括 VPC 配置、子网组、安全组和一个端点。让我们访问\
  \ AWS 管理控制台并搜索 Redshift。进入主页面后，我们选择创建一个工作组。您将被引导至一个页面，您可以在其中指定工作组的 RPU。RPU 是 Redshift\
  \ 处理单元，是可用计算资源的度量单位。您还可以选择 VPC 配置和子网组。以下是您可能看到的界面：\n\n![](img/615530_1_En_15_Fig21_HTML.jpg)\n\
  \n一个用于在 Amazon Redshift 中创建工作组的表单截图，显示了“审核并创建”步骤。该表单包括工作组名称、基础容量、VPC、安全组和子网等字段，部分已填写。之前的步骤涵盖了命名空间选择、基础容量以及网络和安全设置。\n\
  \n图 15-21\n在 Amazon Redshift 中创建工作组\n\n指定了各种参数后，您可能希望导航到预置集群仪表板以创建一个新集群。创建新集群时，您可以指定集群的名称、希望在集群上拥有的节点数量，以及希望为数据仓库集群获得的计算类型、RAM\
