  \ 集群中该主题读取的消息。`ParseFromString()` 方法来自 Protobuf Python 库，它使你能够将二进制对象反序列化为结构化数据。希望这些示例能帮助你巩固\
  \ Kafka 编程中的基础思维和最常用的类与方法。\n\n流处理\n到目前为止，我们已经了解了 Kafka 如何发布和订阅事件。我们还看到 Kafka 将事件存储在\
  \ Kafka 集群中。在本节中，我们将探讨 Kafka 如何处理和分析存储在 Kafka 集群中的这些事件。这就是我们在 Kafka 中所说的流处理。让我们先定义一下事件。它就是在某个时间点发生的事情。它可以是任何东西，从学生在在线系统中注册课程，到电视观众在真人秀节目中为他们最喜欢的表演者投票。事件本质上是不可变的提交日志，只允许追加操作。你无法撤销一个事件；以学生为例，你可以退出已注册的课程，但请记住，这将成为另一个事件。\n\
  流处理可以通过两种方法执行：一种是 Kafka Streams，另一种是 kSQL。\nKafka Streams 是一个 Java 库，为流处理应用程序提供了各种方法；而\
  \ kSQL 是一个模块，允许使用 SQL 方言构建流处理管道。ksqlDB 是一个专门为存储、处理和分析来自流处理应用程序的事件而构建的数据库。\nksqlDB\
  \ 不是关系型数据库，也完全不能替代关系型数据库。ksqlDB 中没有索引的概念。ksqlDB 中的表与关系型数据库管理系统中的表不同。ksqlDB 的表更像是一个物化视图，而不是一个表。\n\
  流也可以被定义为一组事件，你可以从中派生出一个表，例如，一家公司的股票在给定时间间隔内在证券交易所上市/交易的价格。一段时间内的股票价格序列就是一个流。同一个流可以被视为一个表，用于描述该公司的最新股票价格。\n\
  \n有状态处理 vs. 无状态处理\n\n在 ksqlDB 中可以执行两种类型的流处理，即：有状态处理和无状态处理。Kafka 中的无状态处理是指处理事件时无需依赖与先前消息相关的信息。由于无状态处理不需要了解过去发生或将来会发生的任何消息，因此处理起来更简单、更快速。以下是一些示例：\n\
  \n*   对值进行转换，不涉及任何关于过去或未来消息的知识，例如，将摄氏度转换为华氏度\n*   基于某个条件过滤值，该条件不需要了解其他消息，例如，过滤出温度大于\
  \ 35 摄氏度的数据\n*   创建分支，根据应用于消息的条件将输入流分支到多个输出流\n\n另一方面，有状态处理需要关于先前消息的信息。通常，它涉及执行需要一个或多个状态的操作。常见的应用包括在给定的窗口（基于时间的窗口或基于计数的窗口）内准备聚合。以下是一些示例：\n\
  \n*   在时间窗口内执行聚合，例如，获取给定时间间隔内的总数、总和、平均值和中位数\n*   基于消息之间的关系执行连接操作，例如，连接来自多个流的数据\n\
  \n\n\n一个流处理应用通常涉及从一条或多条流中**摄取**数据，在适用时进行转换，并将其加载到存储中。一个普通的流处理应用可能包含许多活动部件，从数据摄取和执行转换（这可能意味着数据被写入临时区域，因此这又是另一个存储）到写入存储。ksqlDB\
  \ 简化了整个流处理应用，并将其缩减为仅两个服务：执行计算的 ksqlDB 和构成存储的 Kafka。在 ksqlDB 中，你可以利用 Kafka 将数据从其他系统流式传输到\
  \ Kafka，以及从 Kafka 传输到其他下游系统。\n\n有必要重申一下，ksqlDB 是独立于 Apache Kafka 的软件包。因此，我们将继续使用我们现有的集群，并可能创建新的流。\n\
