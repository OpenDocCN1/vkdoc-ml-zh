  \ S3 服务中所有存储桶的命令：\n\n```\naws s3 ls\n```\n\n以下是一个列出指定存储桶中所有文件的命令：\n\n```\naws s3\
  \ ls s3://\n```\n\nAWS S3\nAWS S3 代表简单安全存储（Simple Secure Storage），是一种对象存储服务。S3 允许保留非结构化数据。S3\
  \ 被认为针对“多次读取、一次写入”的使用场景进行了优化。与将数据存储为文件的文件系统不同，S3 以对象的形式存储数据。它是存储照片、视频和类似内容的绝佳选择。AWS\
  \ 提供了编程接口，允许应用程序对存储在 S3 对象存储上的数据执行创建、更新、读取和删除操作。\n\nAmazon 在其 S3 服务中提供了多种存储类型。Amazon\
  \ S3 Standard 适用于读取量大的数据，是追求高吞吐量和低延迟的应用程序的理想选择。Amazon S3 IA（低频访问）适用于访问和读取频率不高的数据；理想的应用场景包括业务恢复和灾难规划、长期备份等。Amazon\
  \ S3 Glacier 适用于可能永远不会被访问但需要保留的数据；应用场景包括生命周期结束的数据、为监管和合规目的而保留的备份等。\n\n注意\n\n让我们学习几个术语。在云对象存储的上下文中，我们有两个术语用于描述访问模式和存储需求。这两个术语分别是“热数据”和“冷数据”。\n\
  **热数据** 是一个或多个用户同时频繁访问或使用的数据。这些数据需要随时可用，并且需求持续不断。\n**冷数据** 很少被访问；数据包括定期备份和历史数据。提供经济高效的存储（而非像热数据那样优化性能）可能是明智之举。\n\
  \nAWS 支持全局存储桶系统。要创建全局存储桶，必须在给定分区内使用唯一的名称。还可以选择创建可供所有人访问的公共存储桶。以下是创建 AWS S3 存储桶的方法：\n\
