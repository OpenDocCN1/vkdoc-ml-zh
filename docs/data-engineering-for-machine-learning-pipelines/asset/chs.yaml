  \n**Kafka Connect**\n我们在之前的讨论中看到，Kafka Connect 如何帮助我们可靠地在 Apache Kafka 和其他数据库系统之间进行扩展和数据流传输。Kafka\
  \ Connect 提供了一种称为连接器的工具，它可以与其他数据系统连接，以启用和协调数据流。有两种类型的连接器，即源连接器和汇连接器。源连接器从数据系统中提取数据，将其流式传输到\
  \ Kafka 主题，而汇连接器则将数据从 Kafka 主题传送到数据系统。\n\nKafka Connect 服务可以以独立模式安装，也可以为生产目的以分布式模式部署。Kafka\
  \ Connect 是流式数据/ETL（提取、转换、加载）管道的一个重要方面，尤其是在架构中包含 Kafka 时。您可以通过 ksqlDB 使用 Kafka Connect\
  \ 服务连接到外部数据系统。请在此处查看 Oracle 数据库示例连接器；括号内包含值的字段需要填入相应的数据库凭据：\n\n```\nCREATE SOURCE\
  \ CONNECTOR IF NOT EXISTS CustomerDB WITH (\n'connector.class'          = 'OracleDatabaseSource',\n\
  'kafka.api.key'            = '',\n'kafka.api.secret'         = '',\n'connection.host'\
  \          = '',\n'connection.port'          = '1521',\n'connection.user'      \
  \    = '',\n'connection.password'      = '',\n'db.name'                  = '',\n\
  'table.whitelist'          = 'CUSTOMERS',\n'timestamp.column.name'    = 'created_at',\n\
  'output.data.format'       = 'JSON',\n'db.timezone'              = 'UCT',\n'tasks.max'\
  \                = '1'\n);\n```\n\n**最佳实践**\n\n如您所见，我们使用商业发行版 Confluent 演示了 Kafka\
  \ 流式数据管道。在撰写本章时，供应商提供了数百美元的云积分，可用于获取他们的服务。这样，任何想要初步了解 Kafka 的人都可以利用他们的服务来运行示例集群。同时，注意后台未使用的\
  \ Kafka 集群也是一个好习惯。以下是一些可用于清理未使用 Kafka 资源的命令：\n\n```\nDROP STREAM IF EXISTS customers;\n\
  ```\n\n您还可以异步删除支持该表或流的相应主题：\n\n```\nDROP TABLE IF EXISTS t_customers DELETE TOPIC;\n\
  ```\n\n您也可以移除 Kafka 连接器：\n\n```\nDROP CONNECTOR IF EXISTS customerDB;\n```\n\n**结论**\n\
  可以肯定地说，Apache Kafka 代表了我们在构建实时数据管道和流分析解决方案方面的一种范式转变。其架构具有可扩展性、分布式和容错性，为构建和管理能够处理现代数据流的复杂数据管道提供了可靠的基础。我们讨论了\
  \ Kafka 架构及其各种组件，以及它们如何协同工作。我们研究了发布者-订阅者模型以及主题如何存储在数据库中。然后，我们研究了使用 ksqlDB 的流式数据管道，以及如何分析数据以获得业务洞察。希望您从本章学到的技能和知识能够帮助您构建实时数据管道。\n\
  \n10. 使用 FastAPI 进行机器学习工程和数据 REST API 开发\n\n\n\n引言\n在数据工程和机器学习建模这个复杂的领域中，存在多个动态环节（正如你目前所见），提供数据服务并部署机器学习模型以供使用至关重要。在本章中，我们将讨论\
  \ FastAPI。FastAPI 是一个 Python 库，主要用于支持 Web 应用程序开发和微服务开发。我们将着眼于 FastAPI，其唯一目的是利用该库来提供数据服务并将机器学习模型作为服务交付。尽管\
  \ Django 在基于 Python 的应用程序开发领域赢得了众多青睐，但 FastAPI 简单、强大且功能非常强大。对于机器学习工程师或数据工程师来说，理解应用程序编程接口的概念非常重要。\n\
  \n本章结束时，你将学习到\n\n*   Web 服务和 API 的基础知识、各种类型的 API 及其概念\n*   FastAPI 及其设置过程\n*   Pydantic\
  \ 与 FastAPI 的集成，实现强大的数据验证\n*   FastAPI 依赖注入的概念与实现\n*   数据库集成，包括 SQL、NoSQL 和对象关系映射方法\n\
  *   使用 FastAPI 构建 RESTful 数据 API\n*   使用 FastAPI 进行机器学习 API 的开发与部署\n\nWeb 服务与 API\
  \ 简介\n企业倾向于通过提供有价值的数据产品来为其内部或外部客户创造价值。数据产品由数据工程师通过识别各种数据源、执行各种操作，并将来自这些多个来源的数据进行组合而构建（操作顺序不一定相同）。然后，这些数据资产被共享给各种内部和外部客户。企业和\
  \ IT 系统共享数据并相互通信的有效方式之一就是 API 的概念。API 代表应用程序编程接口。API 由各种公司和组织构建，以允许不同的用户群体利用其服务。一个提供数据即服务（DaaS）的组织的好例子是\
  \ OpenWeather API。\n\nOpenWeather API\nOpenWeather API 是由 OpenWeather 提供的一项数据服务，该公司通过\
  \ REST API 调用向个人和组织提供天气数据。OpenWeather API 使工程师能够以编程方式访问广泛的天气数据。其中一些数据包括全球各个地点的当前天气数据、预报和历史数据。他们为当前天气数据、预报天气数据、每日汇总、历史数据等提供了各种\
  \ API 端点。你可以在以下网站注册 OpenWeather API 以获取访问密钥。通过使用该访问密钥，你可以获取各种数据：\n[`https://openweathermap.org/api`](https://openweathermap.org/api)\n\
  \nAPI 的类型\n并非所有 API 都以相同的方式构建，它们服务的用户群体也不尽相同。最常见的 API 类别是开放 API。这些 API 由各种组织提供，并且可以免费访问和使用。工程师可以不受任何限制地访问和使用这些服务。另一类\
  \ API 是内部 API。这些 API 同样提供服务；但是，它们对组织内部是私有的。它们不对外公开。相反，它们仅由给定组织内的各个团队访问和利用，以获取数据和功能。内部\
  \ API 还有另一种变体，称为合作伙伴 API。这些 API 同样具有一定程度的机密性；但是，它们可能服务于该组织及其部分合作伙伴组织。\n除了不同的类别及其服务目的之外，还有多种访问\
  \ API 的方法；其中一些如下所示。\n\nSOAP API\nSOAP 代表简单对象访问协议。SOAP API 已经存在很长时间，并用于企业级应用程序。SOAP\
  \ 主要用于在两个应用程序之间交换结构化数据。SOAP 使用 HTTP 或 SMTP 来传输消息。它们使用 XML 模板进行消息格式化。\n\nREST API\n\
  REST 代表表述性状态转移。REST 是一种用于构建轻量级和可扩展 API 的架构风格。它们利用 HTTP 方法进行通信。一些 HTTP 方法包括 GET、PUT、POST\
  \ 等。REST API 以 JSON 或 XML 格式返回数据。这些 API 通常用于基于 Web 的应用程序和移动应用程序。\n\nGraphQL API\n\
  GraphQL 代表图形查询语言。顾名思义，GraphQL 使用基于查询的请求来获取数据，确保只获取所需的数据。GraphQL 的重点在于避免过度获取。虽然这些信息对你来说可能有点难以理解（取决于你的背景），但最好知道存在这样的\
  \ API。\n\nWebhooks\nWebhooks 是另一种类型的 API，可实现系统之间的实时通信。与 REST API 类似，Webhooks 也使用\
  \ HTTP 请求进行通信。\n\nAPI 的典型流程\nAPI 充当软件应用程序之间的中间人，使它们能够更顺畅地相互交互。通信可以在两个软件应用程序之间进行，也可以是工程师寻求从主机获取服务。\n\
  这一切始于其中一方（我们称之为客户端）通过 API 向主机发送请求。API 携带消息并将其提交给主机。主机将处理该消息，准备必要的程序，并提供所请求的信息。\n\
  现在，主机（我们称之为服务器）响应客户端。响应中包含针对相应请求的信息。这种交互或通信（无论你更喜欢哪种称呼）是通过数据交换发生的。这些数据以某种方式结构化，以便\
  \ API 和服务器能够理解。这通常被称为数据格式。最常见的数据格式是 JSON 和 XML。这些数据格式确保所有三方——客户端、API 和服务器——能够理解彼此之间的交互。\n\
  \n端点\n如前所述，API 是中介；它们充当两方之间的桥梁。API 提供了一种机制，供客户端发起与服务器的对话。其中一种机制称为 URL 或 URI，即统一资源定位符或统一资源标识符。它包含服务器的地址，以便将请求发送到正确的地址。\n\
  \n让我们看下面的例子：\n\n*   简·多伊，\n*   会计部，\n*   ABC 公司，\n*   美国某镇\n\n假设有人向这个地址发送一封实体邮件，那么它将到达相应的城镇，到达相关的组织（在此例中是假设的），到达相应的部门，并到达该部门中指定的收件人。\n\
  REST API 端点类似于刚才提到的人的地址。\n\nURL 或 URI 的结构如下：\n\n```\nhttps://developer.MyFavoriteMovieTheatre.com/api/movie-theatre/showtimes?movie_id=5&date=2023-06-06\n\
  ```\n\n\n\n在此处\n[`https://developer.MyFavoriteMovieTheatre.com`](https://developer.myfavoritemovietheatre.com)\n\
  是 API 的基础 URL。\n`/api/movie-theatre/showtimes`\n表示用于检索放映时间的路径参数。\n`movie_id=5`\n\
  和 `date=2023-06-06`\n表示查询参数。它们允许你指定想要观看的电影和日期。`movie_id` 参数对应某一天上映的电影。\n整个 URL 被称为端点。端点就像之前提到的物理地址一样，是地址。通过指定正确的基础\
  \ URL、正确的路径和适当的查询参数，电影院服务器将能够处理你的请求并检索响应。\n\nAPI 通常需要身份验证。这样做是为了确保只有经过授权的用户或应用程序才能访问其功能。有多种方式可以对\
  \ API 进行身份验证。一些常见的方式包括使用 API 密钥、令牌和其他身份验证机制。\n\nAPI 将数据从源端移动到目标端，并提供了一种更简单的方式来摄取数据。\n\
  \nAPI 开发流程\n要构建一个 API，我们首先要定义 API 需求，例如它可能需要访问的数据、它将执行的操作以及它将产生的结果等等。一旦定义了需求，就可以着手构建数据模型、方法、端点，并定义请求、身份验证、授权等的响应数据格式。根据需求实现\
  \ API，在此过程中设置所需的服务器及其基础设施，实现代码和依赖项（如果有），以及其他相关任务。在实现阶段或实现后阶段，对特性和功能进行充分的测试可能是一个好步骤。最后一步是将\
  \ API 部署到生产服务器；性能和用法监控可能有助于解决任何可能需要改进的地方。\n\nREST API\n如前所述，REST 是表述性状态传递的缩写。它是符合\
  \ REST 架构标准的 Web 服务类型之一。REST 架构标准利用给定网络上的客户端-服务器通信。REST 架构是无状态的，这意味着服务器不会为来自客户端的请求维护会话信息。相反，请求消息本身将包含足够的信息供服务器处理该请求。\n\
  \nRESTful 服务监听 HTTP 方法并从服务器检索响应。HTTP 代表超文本传输协议。HTTP 方法的作用是告诉服务器需要执行哪个操作来为请求检索响应。HTTP\
  \ 方法分为两类：安全 HTTP 方法和幂等 HTTP 方法。安全 HTTP 方法无论被调用多少次，总是返回相同或相似的响应。安全 HTTP 方法不会更改服务器上的数据。幂等方法可能能够更改服务器上的数据。一些更常见的\
  \ HTTP 方法（或动词）包括：\n\n*   **GET**：从服务器读取数据，不以任何方式更改或修改资源。\n\n    *   以下是一个简单的 GET\
  \ 请求，用于请求某家多厅影院的所有电影：\n\n    ```\n    GET /multiplexapi/movies/\n    ```\n\n*  \
  \ **HEAD**：类似于 GET，仅检索头部数据而不包含内容。\n\n    *   以下是一个 HEAD 请求，用于查看电影的最后更新时间：\n\n  \
  \  ```\n    HEAD /multiplexapi/theatreslist\n    ```\n\n*   **POST**：触发一个动作或可用于创建新数据；会在服务器上进行更改。\n\
  \n    *   以下是为观影者创建新预订的示例：\n\n    ```\n    POST /multiplexapi/bookings\n    ```\n\
  \n*   **PUT**：用新数据替换当前数据；可视为执行更新操作。\n\n    *   以下是更新电影放映时间的示例：\n\n    ```\n    PUT\
  \ /multiplex/movies/SampleMovie { “showtime”: “5:55PM” }\n    ```\n\n*   **PATCH**：类似于\
  \ PUT，但部分替换或更新当前数据为新数据。\n\n    *   以下是更新在第三影厅放映的“SampleMovie”剩余座位数的示例：\n\n    ```\n\
  \    PATCH /multiplex/threatre/3 { “seats_available” : 5 }\n    ```\n\n*   **OPTIONS**：用于获取给定\
  \ URL 到服务器的一组允许的 HTTP 方法。\n\n    *   以下是检查各种预订选项的示例：\n\n    ```\n    OPTIONS /multiplexapi/bookings\n\
  \    ```\n\n*   **CONNECT**：用于建立到服务器的隧道的方法。\n\n    *   以下是建立到多厅影院的 TCP 连接的示例：\n\n\
  \    ```\n    CONNECT app.multiplexapi.com:3690\n    ```\n\nHTTP 状态码\n\n当服务器收到来自客户端的请求时，它会处理并准备一个响应。HTTP\
  \ 状态码是与响应一起接收的代码。以下是客户端收到的一些常见状态码：\n\n表 10-1\n一些常见的 HTTP 状态码及其描述\n\n| HTTP 状态码 |\
  \ 描述 |\n| :--- | :--- |\n| 200 OK | 请求成功，服务器返回了请求的数据。 |\n| 201 Created | 请求成功，作为结果创建了新资源。\
  \ |\n| 204 No Content | 请求成功，但无需返回任何内容（通常用于 DELETE 操作）。 |\n| 301 Permanent Redirect\
  \ | 请求的页面已永久移动到新的 URL。 |\n| 400 Bad Request | 由于客户端错误，服务器无法处理请求。 |\n| 401 Unauthorized\
  \ | 服务器需要用户身份验证（有效凭据）才能处理请求。 |\n| 403 Forbidden | 服务器理解你的请求，但拒绝授权，尽管提供了有效凭据（可能权限不足）。\
  \ |\n| 404 Not Found | 请求的内容在服务器上找不到。 |\n| 500 Internal Server Error | 由于某些意外问题，服务器似乎无法找到请求的内容。\
  \ |\n| 503 Service Unavailable | 服务器目前无法处理请求。 |\n\n这些 Web 服务通过 API 向外界公开其数据或服务。\n\
  要使用 Python 构建 API，有相当多的包可用。有 Flask，这是一个以构建简单、易于设置和较小型的 API 而闻名的 Python 库。流行的还有 Django\
  \ 和 FastAPI。Django 已经存在很长时间，功能更多，是比 Flask 更好的选择。在本章中，我们将深入探讨 FastAPI。\n\nFastAPI\n\
  FastAPI 相对于其他 Python 库提供了一些优势；首先，FastAPI 通过 `asyncio` 支持 Python 的异步编程。FastAPI 自动生成基于\
  \ Open API 标准的文档，允许 API 的用户浏览文档并测试各种端点。最重要的是，顾名思义，FastAPI 性能高，比许多其他 Python 库更快。\n\
  \n设置与安装\n\n以下是在你的机器上设置 FastAPI 的方法：\n\n```\npip install fastapi\n```\n\nFastAPI\
  \ 不附带 Web 服务器；让我们也安装一个 Web 服务器：\n\n```\npip install \"uvicorn[standard]\"\n```\n\
  \n假设你正在使用虚拟开发环境，我也鼓励你考虑这个命令：\n\n```\npip install \"fastapi[all]\"\n```\n\n这将安装 FastAPI、Pydantic\
  \ 和 Starlette Python 库使用的所有可选依赖项，其中包括 “uvicorn” Web 服务器和异步客户端 “http”。\n\n现在让我们考虑一个使用\
  \ FastAPI 的简单 Hello World 应用程序。如下所示：\n\n```\nfrom fastapi import FastAPI, APIRouter\n\
  app = FastAPI()\napi_router = APIRouter()\n@api_router.get(\"/\")\ndef root() ->\
  \ dict:\nreturn {\"msg\": \"Hello, World!\"}\napp.include_router(api_router)\n```\n\
  \n\n\n核心概念\nFastAPI 基于 AGSI 标准和 Starlette 构建。FastAPI 利用\nAGSI 服务器来实现其异步能力。AGSI 代表\n\
  异步服务器网关接口。AGSI 是一个\n相对较新的 Web 标准，用于服务器与客户端进行异步通信。\nFastAPI 支持 Hypercorn 和 Uvicorn\
  \ Web 服务器，因为它们\n与 AGSI 标准兼容。\n另一方面，Starlette 是\n一个 AGSI 标准框架，有助于实现 FastAPI 的核心功能。\n\
  Starlette 提供了核心的路由基础设施，处理\n请求和响应、数据库集成以及许多其他\n被 FastAPI 利用的功能。在 Starlette 和 AGSI\
  \ 标准之上，\nFastAPI 原生提供了数据验证、文档生成\n等功能，因此工程师可以专注于事物的业务逻辑。\n\n路径参数和查询参数\n\n如你所知，路径\n\
  参数是端点（endpoint）的组成部分，而查询参数是\n可选的类似过滤器的参数。让我们看一个例子；这是一个\nURL：\n\n```\nhttps://www.amazon.com/Sweetcrispy-Ergonomic-Computer-Comfortable-Armrests/dp/B0C61DLQNH/ref=mp_s_a_1_5?crid=1CE83JNY3DEDI&keywords=chair&qid=1703648878&refinements=p_36%3A1253524011&rnid=386465011&s=home-garden&sprefix=cha%2Caps%2C478&sr=1-5\n\
  ```\n\n基础 URL 是\n[`https://www.amazon.com/`](https://www.amazon.com/)\n\n路径\n参数是\n\
  \n```\n/Sweetcrispy-Ergonomic-Computer-Comfortable-Armrests\n/dp\n/B0C61DLQNH\n\
  /ref=mp_s_a_1_5\n```\n\n查询\n参数是\n\n```\n?\ncrid=1CE83JNY3DEDI &\nkeywords=chair\
  \ &\nqid=1703648878 &\nrefinements=p_36%3A1253524011 &\nrnid=386465011 &\ns=home-garden\
  \ &\nsprefix=cha%2Caps%2C478 &\nsr=1-5\n```\n\n当你编写一个函数时，你可以将变量传递给该\n函数，这些变量可以被调用。如下所示：\n\
  \n```\nfrom fastapi import FastAPI, APIRouter\n```\n\n让我们创建一个示例学生和课程数据的列表：\n\n```\n\
  Students = [\n{\n\"Student_id\": 1,\n\"Student_name\": \"StudentPerson1\",\n\"Course\"\
  \ : \"BIO 101\",\n\"Department\" : \"Biology\"\n},\n{\n\"Student_id\": 2,\n\"Student_name\"\
  : \"StudentPersonTwo\",\n\"Course\" : \"CHEM 201\",\n\"Department\" : \"Chemistry\"\
  \n},\n{\n\"Student_id\": 3,\n\"Student_name\": \"StudentPerson3\",\n\"Course\" :\
  \ \"MATH 102\",\n\"Department\" : \"Mathematics\"\n},\n]\n```\n\n让我们实例化 FastAPI（使用合适的标题）和\
  \ APIRouter 对象：\n\n```\napp = FastAPI(title=\"Student/Course Data\")\napi_router\
  \ = APIRouter()\n```\n\n之前定义的主函数在结构上没有太大变化。\n让我们添加一个名为“get_student”的新函数来检索学生\n记录。注意使用了包含变量的装饰器。该\n\
  变量或参数的值将在运行时传递：\n\n```\n@api_router.get(\"/\")\ndef hello() -> dict:\nreturn {\"\
  msg\": \"Welcome to the root page\"}\n@api_router.get(\"/student/{Student_id}\"\
  )\ndef get_student(Student_id: int) -> dict:\nfor s in Students:\nif s[\"Student_id\"\
  ] == Student_id:\nresult = s\nreturn result\napp.include_router(api_router)\n```\n\
  \n让我们实时运行这段代码。这是我们运行这段代码的方式：\n\n```\nuvicorn main3:app —reload\n```\n\n将返回以下堆栈跟踪：\n\
  \n![](img/615530_1_En_10_Fig1_HTML.jpg)\n\n一张命令提示符的截图，正在运行 uvicorn 命令以\n启动一个 FastAPI\
  \ Web 应用程序。重新加载器进程启动，\n随后是服务器进程。应用程序启动成功完成，\n服务器已准备好处理请求。\n\n图 10-1\n执行一个简单的 FastAPI\
  \ 应用\n\n现在，让我们打开浏览器并输入\n地址 `http://127.0.0.1:8000/student/3:`\n\n![](img/615530_1_En_10_Fig2_HTML.jpg)\n\
