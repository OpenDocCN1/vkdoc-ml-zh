  ## 组合多个 Polars 对象


  Polars 支持广泛的数据转换和连接操作，类似于 Pandas。让我们详细了解一下。


  ### 左连接


  左连接返回左表中的所有行，扫描右表中的行，识别匹配项，并将其附加到左表中。让我们看一个例子。


  这里我们初始化两个数据框：


  ```

  import polars as pl

  df1 = pl.DataFrame({

  ''ID'': [1, 2, 3, 4, 5],

  ''Name'': [''Alice'', ''Bob'', ''Charlie'', ''David'', ''John''],

  ''DeptID'': [101, 102, 103, 104, 103]

  })

  df2 = pl.DataFrame({

  ''DeptID'': [101, 102, 103],

  ''DeptName'': [''HR'', ''IT'', ''Marketing'']

  })

  ```


  现在，我们通过部门 ID 执行左连接：


  ```

  leftjoin = df1.join(

  df2,

  on = "DeptID",

  how = "left",

  coalesce=True

  )

  print(leftjoin)

  ```


  如果你指定 `coalesce = True`，则执行连接操作的列不会出现在最终结果中。这会得到


  ```

  shape: (5, 4)

  ┌────┬───────┬──────┬────────┐

  │ ID  ┆ Name    ┆ DeptID ┆ DeptName  │

  │ --- ┆ ---     ┆ ---    ┆ ---       │

  │ i64 ┆ str     ┆ i64    ┆ str       │

  ╞════╪═══════╪══════╪═════════╡

  │ 1   ┆ Alice   ┆ 101    ┆ HR        │

  │ 2   ┆ Bob     ┆ 102    ┆ IT        │

  │ 3   ┆ Charlie ┆ 103    ┆ Marketing │

  │ 4   ┆ David   ┆ 104    ┆ null      │

  │ 5   ┆ John    ┆ 103    ┆ Marketing │

  └────┴───────┴──────┴────────┘

  ```


  如果 `coalesce` 设置为 `false`，我们的数据集会变成这样：


  ```

  leftjoin = df1.join(

  df2,

  on = "DeptID",

  how = "left",

  coalesce=False

  )

  print(leftjoin)

  ```


  会得到


  ```

  shape: (5, 5)

  ┌────┬───────┬──────┬──────────┬────────┐

  │ ID  ┆ Name    ┆ DeptID ┆ DeptID_right ┆ DeptName  │

  │ --- ┆ ---     ┆ ---    ┆ ---          ┆ ---       │

  │ i64 ┆ str     ┆ i64    ┆ i64          ┆ str       │

  ╞════╪═══════╪══════╪══════════╪════════╡

  │ 1   ┆ Alice   ┆ 101    ┆ 101          ┆ HR        │

  │ 2   ┆ Bob     ┆ 102    ┆ 102          ┆ IT        │

  │ 3   ┆ Charlie ┆ 103    ┆ 103          ┆ Marketing │

  │ 4   ┆ David   ┆ 104    ┆ null         ┆ null      │

  │ 5   ┆ John    ┆ 103    ┆ 103          ┆ Marketing │

  └────┴───────┴──────┴──────────┴────────┘

  ```


  ### 外连接


  外连接是指，当在两个给定表之间找到匹配时，它会检索所有匹配的行：


  ```

  outerjoin = df1.join(

  df2,

  on = "DeptID",

  how = "full",

  coalesce=True

  )

  print(outerjoin)

  ```


  会得到


  ```

  shape: (5, 4)

  ┌────┬───────┬──────┬────────┐

  │ ID  ┆ Name    ┆ DeptID ┆ DeptName  │

  │ --- ┆ ---     ┆ ---    ┆ ---       │

  │ i64 ┆ str     ┆ i64    ┆ str       │

  ╞════╪═══════╪══════╪════════╡

  │ 1   ┆ Alice   ┆ 101    ┆ HR        │

  │ 2   ┆ Bob     ┆ 102    ┆ IT        │

  │ 3   ┆ Charlie ┆ 103    ┆ Marketing │

  │ 4   ┆ David   ┆ 104    ┆ null      │

  │ 5   ┆ John    ┆ 103    ┆ Marketing │

  └────┴───────┴──────┴────────┘

  ```


  ### 内连接


  内连接是外连接的反向操作，仅返回两个表中具有匹配值的行：


  ```

  innerjoin = df1.join(

  df2,

  on = "DeptID",

  how = "inner",

  coalesce=True)

  print(innerjoin)

  ```


  会得到


  ```

  shape: (4, 4)

  ┌────┬───────┬──────┬────────┐

  │ ID  ┆ Name    ┆ DeptID ┆ DeptName  │

  │ --- ┆ ---     ┆ ---    ┆ ---       │

  │ i64 ┆ str     ┆ i64    ┆ str       │

  ╞════╪═══════╪══════╪════════╡

  │ 1   ┆ Alice   ┆ 101    ┆ HR        │

  │ 2   ┆ Bob     ┆ 102    ┆ IT        │

  │ 3   ┆ Charlie ┆ 103    ┆ Marketing │

  │ 5   ┆ John    ┆ 103    ┆ Marketing │

  └────┴───────┴──────┴────────┘

  ```




  ### 半连接


  半连接会筛选出在右侧表中有匹配项的行：


  ```

  semijoin = df1.join(

  df2,

  on = "DeptID",

  how = "semi",

  coalesce=True)

  print(semijoin)

  ```


  将得到


  ```

  shape: (4, 3)

  ┌────┬───────┬──────┐

  │ ID  ┆ Name    ┆ DeptID │

  │ --- ┆ ---     ┆ ---    │

  │ i64 ┆ str     ┆ i64    │

  ╞════╪═══════╪══════╡

  │ 1   ┆ Alice   ┆ 101    │

  │ 2   ┆ Bob     ┆ 102    │

  │ 3   ┆ Charlie ┆ 103    │

  │ 5   ┆ John    ┆ 103    │

  └────┴───────┴──────┘

  ```


  ### 反连接


  反连接会筛选出在右侧表中没有匹配项的行：


  ```

  antijoin = df1.join(

  df2,

  on = "DeptID",

  how = "anti",

  coalesce=True)

  print(antijoin)

  ```


  将得到


  ```

  shape: (1, 3)

  ┌────┬─────┬──────┐

  │ ID  ┆ Name  ┆ DeptID │

  │ --- ┆ ---   ┆ ---    │

  │ i64 ┆ str   ┆ i64    │

  ╞════╪═════╪══════╡

  │ 4   ┆ David ┆ 104    │

  └────┴─────┴──────┘

  ```


  ### 交叉连接


  交叉连接会对给定的两个表执行笛卡尔积。


  示例如下。我们先初始化两个数据框：


  ```

  df_one = pl.DataFrame(

  {

  ''ID'': [1, 2],

  ''Name'': [''John'', ''Doe'']

  }

  )

  df_two = pl.DataFrame(

  {

  ''ItemID'': [101, 102],

  ''Item'': [''Laptop'', ''Cable'']

  }

  )

  ```


  现在让我们对这两个数据框执行笛卡尔积：


  ```

  crossjoin = df_one.join(

  df_two,

  how = "cross",

  coalesce=True

  )

  print(crossjoin)

  ```


  将得到


  ```

  shape: (4, 4)

  ┌────┬─────┬──────┬──────┐

  │ ID  ┆ Name ┆ ItemID ┆ Item   │

  │ --- ┆ ---  ┆ ---    ┆ ---    │

  │ i64 ┆ str  ┆ i64    ┆ str    │

  ╞════╪═════╪══════╪══════╡

  │ 1   ┆ John ┆ 101    ┆ Laptop │

  │ 1   ┆ John ┆ 102    ┆ Cable  │

  │ 2   ┆ Doe  ┆ 101    ┆ Laptop │

  │ 2   ┆ Doe  ┆ 102    ┆ Cable  │

  └────┴─────┴──────┴──────┘

  ```


