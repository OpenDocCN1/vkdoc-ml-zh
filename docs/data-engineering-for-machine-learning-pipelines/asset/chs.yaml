  \n图 15-26\nAWS Athena — Jupyter Notebook 工作区\n\nAmazon Glue\nAmazon Glue 是一项无服务器数据集成工具。您可以使用\
  \ Glue 发现数据源、集成数据，并为数据分析、机器学习和应用程序开发准备数据集。Amazon Glue 拥有 Glue Studio，它允许您以可视化方式准备数据集成作业，您可以将组件拖放到工作区中。设计好作业后，您可以直接从\
