  FastAPI 上的 GET 请求示例\n\nFastAPI 中的依赖注入\n当你编写数据处理管道时，可能会遇到一个或一组功能，它们本质上是相同的代码，但应用于多个数据管道。最简单、最快速的例子是连接到特定的数据库。可能存在\
  \ \"n\" 个数据管道都需要连接到某个特定数据库的情况。显然，所述数据管道依赖于与这个特定数据库的连接。为你的代码提供这种数据库连接依赖关系的过程称为依赖注入。\n\
  \n注意\n\n注入本质上就是在这里提供功能。不是将功能的代码写在数据处理管道内部，而是将代码写在外部，然后注入到数据处理管道中。\n\nFastAPI 有一个简单直观的依赖注入系统。\"\
  Depends\" 方法为 FastAPI 提供了依赖注入功能。让我们看下面的例子：\n\n\n\n```\nfrom fastapi import FastAPI,\
  \ Depends\nfrom databases import Database\nimport sqlalchemy\napp = FastAPI()\n\
  database = Database(\"Your database credentials here\")\ndef dbConnect():\nreturn\
  \ database\n@app.get(\"/users\")\ndef get_users(db=Depends(dbConnect)):\nconn =\
  \ db\nusers = conn.fetch_all(\"SELECT * from users\")\nreturn {\"users\": users}\n\
  ```\n\n在上述示例中，我们设计了一个简单的 API，其中包含一个 GET 请求，该请求在被调用时会检索“users”。为了让 GET 方法能够检索并返回该信息，它需要与数据库建立连接。你可能已经注意到，数据库连接被定义为一个独立的函数。然后，该数据库连接通过\
  \ FastAPI 的“Depends”方法作为参数传递给 `get_users` 函数。这样，“get_users”函数就会调用 `dbConnect()`\
  \ 函数，该函数会建立与数据库的连接。\n\nFastAPI 与数据库的集成\n\nFastAPI 可以与任何关系型数据库集成。与数据库交互的方式有多种。让我们先来看一种简单直接的关系型数据库交互方式。为了进行说明，我们将以在\
