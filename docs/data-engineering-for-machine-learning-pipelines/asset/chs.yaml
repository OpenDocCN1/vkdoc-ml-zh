  \ 是一项数据湖服务。数据湖是结构化和非结构化数据可以共存、查询和分析的地方。它简化了数据湖的构建和管理。与需要多年的项目不同，AWS Lake Formation\
  \ 可以让您更快地投入生产。AWS Lake Formation 提供了一个数据编目工具，用于捕获各种数据集的元数据，以便您可以有效地搜索和检索给定的数据集。\n\
