  \n*   最后一个参数 `--gpu_memory_fraction` 用于告知算法每个并行进程应使用 GPU 内存的多少比例。\n\n上一个脚本中裁剪后的图像尺寸为\
  \ 182×182 像素。Inception-ResNet-v1 的输入仅为 160×160。这为随机裁剪提供了额外的边距。使用额外的 44 像素边距是为了向模型添加任何上下文信息。这个额外的\
