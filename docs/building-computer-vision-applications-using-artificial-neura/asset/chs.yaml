  \ (x, y)，只保留那些超过阈值的坐标。\n\n在第 19 行，我们复制了原始图像并将其存储在一个名为 `clone` 的变量中。这个克隆图像将作为绘制矩形的图像，确保原始图像保持不变。\n\
  \n第 21 到 25 行包含一个 `for` 循环，该循环遍历所有坐标，在图像中匹配到的目标周围绘制矩形区域。\n\n\n\n第 26 行显示了图像，展示了识别出的对象周围的边界框（参见图\
  \ 3-89）。可以观察到同一对象周围存在多个重叠的边界框。为了解决这个问题，我们需要实现一种称为*非极大值抑制（NMS）*的技术，以便每个匹配的对象只绘制一个边界框。NMS\
  \ 常用于计算机视觉和目标检测算法中，以消除重叠或冗余的边界框。\n\n在第 35 行，对检测到的边界框应用了非极大值抑制，以移除同一对象的重复或重叠检测。这确保了每个对象仅由一个边界框表示，从而消除冗余并提高检测结果的准确性。\n\
  \n非极大值抑制函数的实现见代码清单 3-26。\n\n```\nFilename: Listing_3_26.py\n1    # NMS 函数\n2   \
  \ def non_max_suppression(boxes, scores, overlap_threshold):\n3        # 如果没有边界框，则返回空列表\n\
  4        if len(boxes) == 0:\n5            return []\n6        # 初始化已选索引列表\n7  \
  \      pick = []\n8        # 获取边界框的坐标\n9        x1 = boxes[:, 0]\n10       y1 =\
  \ boxes[:, 1]\n11       x2 = boxes[:, 2]\n12       y2 = boxes[:, 3]\n13       #\
  \ 计算边界框的面积\n14       area = (x2 - x1 + 1) * (y2 - y1 + 1)\n15       # 按分数降序排列边界框\n\
  16       idxs = np.argsort(scores)\n17       # 当存在待处理索引时持续循环\n18       while len(idxs)\
  \ > 0:\n19           # 获取排序列表中的最后一个索引，并将其添加到已选索引列表\n20           last = len(idxs)\
  \ - 1\n21           i = idxs[last]\n22           pick.append(i)\n23           #\
  \ 找到边界框起点的最大 (x, y) 坐标\n24           # 和边界框终点的最小 (x, y) 坐标\n25           xx1 = np.maximum(x1[i],\
  \ x1[idxs[:last]])\n26           yy1 = np.maximum(y1[i], y1[idxs[:last]])\n27  \
  \         xx2 = np.minimum(x2[i], x2[idxs[:last]])\n28           yy2 = np.minimum(y2[i],\
  \ y2[idxs[:last]])\n29           # 计算边界框的宽度和高度\n30           w = np.maximum(0, xx2\
  \ - xx1 + 1)\n31           h = np.maximum(0, yy2 - yy1 + 1)\n32           # 计算重叠比例\n\
  33           overlap = (w * h) / area[idxs[:last]]\n34           # 从索引列表中删除所有重叠比例大于指定阈值的索引\n\
  35           idxs = np.delete(idxs, np.concatenate(([last], np.where(overlap > overlap_threshold)[0])))\n\
  36       # 仅返回被选中的边界框\n37       return boxes[pick]\n代码清单 3-26\n非极大值抑制函数\n```\n\n\
