  \ 15.3% 的前五错误率（比亚军低 10.8 个百分点以上）时，它变得流行起来。AlexNet 是一个深度网络，尽管计算成本高昂，但由于使用了 GPU，它变得可行。\n\
  \nAlexNet 的特点如下：\n\n*   它是一个包含八层的深度 CNN。\n\n*   输入尺寸为 224×224×3 的彩色图像。\n\n*   前五层是卷积层和最大池化层的组合，配置如下：\n\
