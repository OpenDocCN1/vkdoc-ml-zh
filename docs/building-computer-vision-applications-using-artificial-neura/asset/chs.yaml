  \n在本练习中，我们将在个人电脑/笔记本电脑上开发一个人脸检测模型。在第 10 章中，我们将探讨如何使用云端 GPU 构建大规模计算机视觉模型。我们将在个人电脑/笔记本电脑上开发人脸检测器。在训练分类器之前，需要克隆\
