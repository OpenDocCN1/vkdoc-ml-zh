  \ 44 \\\n--random_order \\\n--gpu_memory_fraction 0.10 \\\n& done\n清单 8-4\n使用 MTCNN\
  \ 进行人脸检测、裁剪和对齐的代码\n```\n\n在清单 8-4 中，第 1 行激活了 shell。\n\n第 2 行和第 3 行将 `PYTHONPATH`\
  \ 环境变量设置为 `facenet` 和 `facenet/src` 目录。如果您使用的是虚拟机或物理机，并且可以直接访问操作系统，则应考虑在 `~/.bash_profile`\
  \ 文件中设置该环境变量。\n\n为了加快人脸检测和对齐过程，我们创建了十个并行进程（第 4 行），并且每个进程使用 10% 的 GPU 内存（第 5 行）。如果您的数据集较小，并且希望以单个进程处理\
  \ MTCNN，请将 N 的值设置为 1。\n\n第 5 行调用文件 `align_dataset_mtcnn.py` 并传递以下参数：\n\n*   第一个参数\
  \ `/content/drive/MyDrive/chapter8/train` 是训练图像所在的目录路径。\n\n*   第二个参数 `/content/drive/MyDrive/chapter8/train_aligned`\
  \ 是存储对齐后图像的目录路径。\n\n*   第三个参数 `--image_size` 是裁剪后图像的尺寸。我们将其设置为 182×182 像素。\n\n*\
