  \ \"images/cat1.png\"\n6    image2Path = \"images/cat2.png\"\n\n8    image1 = cv2.imread(image1Path)\n\
  9    image2 = cv2.imread(image2Path)\n\n11   # 调整两幅图像的尺寸，使其具有相同的维度。这是进行图像减法的必要条件\n\
  12   resizedImage1 = cv2.resize(image1,(int(500*image1.shape[1]/image1.shape[0]),\
  \ 500),interpolation=cv2.INTER_AREA)\n13   resizedImage2 = cv2.resize(image2,(int(500*image2.shape[1]/image2.shape[0]),\
  \ 500),interpolation=cv2.INTER_AREA)\n\n15   cv2.imshow(\"猫 1\", resizedImage1)\n\
  16   cv2.imshow(\"猫 2\", resizedImage2)\n\n18   # 从图像 2 中减去图像 1\n19   cv2.imshow(\"\
  猫 1 与猫 2 的差异\",cv2.subtract(resizedImage2, resizedImage1))\n20   cv2.waitKey(0)\n\
  \n23   # 从图像 1 中减去图像 2\n24   subtractedImage = cv2.subtract(resizedImage1, resizedImage2)\n\
