  42      return model\n\n清单 6-14\n从目录加载模型\n```\n\n#### 运行预测并以可用形式构建输出\n\n我们编写了一个名为\
  \ `run_inference_for_single_image()` 的函数，它接受两个参数：`模型对象` 和图像 NumPy 数组。该函数返回一个 Python\
  \ 字典。输出字典包含以下键值对：\n\n`detection_boxes`，这是一个二维数组，包含边界框的四个角点。\n\n`detection_scores`，这是一个一维数组，包含与每个边界框关联的分数。\n\
  \n`detection_classes`，这是一个一维数组，包含与每个边界框关联的目标类别索引的整数表示。\n\n`num_detections`，这是一个标量，表示预测的目标类别数量。\n\
  \n清单 6-15 展示了函数 `run_inference_for_single_image()` 的实现。\n\n让我们逐行分析代码清单。\n\nTensorFlow\
  \ `模型对象` 接收一批图像张量来预测目标类别及其周围的边界框。第 48 行将图像 NumPy 数组转换为张量。由于我们一次处理一张图像，而 `模型对象` 接收的是批次，因此我们需要将输入图像张量转换为一批图像。第\
  \ 50 行完成了这一操作。`tf.newaxis` 表达式用于在现有数组的维度上增加一维（使用一次则增加一维）。因此，一维数组将变成二维数组，二维数组将变成三维数组，以此类推。\n\
  \n```\n44   # 预测目标和边界框并格式化结果\n45   def run_inference_for_single_image(model, image):\n\
