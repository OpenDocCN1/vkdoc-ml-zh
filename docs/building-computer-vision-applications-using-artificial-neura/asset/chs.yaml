  \n## 模板匹配\n\n*模板匹配*是一种用于在较大图像中定位和识别模板图像位置的技术。模板匹配算法将模板图像与目标图像在不同位置和尺度下进行比较，以确定最佳匹配。其工作原理是将模板图像在目标图像上滑动，并计算每个位置上模板与目标之间的相似度。\n\
  \nOpenCV 实现了多种模板比较算法。它返回一张灰度图像，其中每个像素代表该像素邻域与模板图像之间的相似度。\n\n如果输入图像的尺寸为 (WxH)，模板图像的尺寸为\
  \ (wxh)，则输出图像的尺寸将为 (W-w+1, H-h+1)。获得结果后，我们可以利用 `cv2.minMaxLoc()` 函数来定位最大值/最小值的位置。该位置可被视为矩形的左上角，矩形的宽度和高度为\
  \ (w, h)。因此，识别出的矩形就代表了模板在较大图像中的区域。\n\n代码清单 3-24 演示了使用所有六种支持方法的模板匹配过程。\n\n```\nFilename:\
  \ Listing_3_24.py\n1    import cv2\n\n3    target = cv2.imread('images/obama_with_people.jpg',\
  \ cv2.IMREAD_GRAYSCALE)\n\n5    template = cv2.imread('images/obama_face.jpg', cv2.IMREAD_GRAYSCALE)\n\
  6    # 调整模板大小，使其尺寸小于目标图像\n7    template = cv2.resize(template, None, fx=0.2, fy=0.2)\n\
  \n9    w, h = template.shape[::-1]\n10   # 所有 6 种支持的比较方法\n11   methods = ['cv2.TM_CCOEFF',\
  \ 'cv2.TM_CCOEFF_NORMED', 'cv2.TM_CCORR',\n12               'cv2.TM_CCORR_NORMED',\
  \ 'cv2.TM_SQDIFF', 'cv2.TM_SQDIFF_NORMED']\n13   for m in methods:\n14       img\
  \ = target.copy()\n15       method = eval(m)\n16       # 应用模板匹配\n17       result\
  \ = cv2.matchTemplate(img, template, method)\n18       min_val, max_val, min_loc,\
  \ max_loc = cv2.minMaxLoc(result)\n19       # 如果方法是 TM_SQDIFF 或 TM_SQDIFF_NORMED，取最小值，否则取最大值\n\
  20       if method in [cv2.TM_SQDIFF, cv2.TM_SQDIFF_NORMED]:\n21           top_left\
  \ = min_loc\n22       else:\n23           top_left = max_loc\n24       bottom_right\
  \ = (top_left[0] + w, top_left[1] + h)\n25       cv2.rectangle(img,top_left, bottom_right,\
  \ 255, 2)\n26       cv2.imshow(m, img)\n27       cv2.waitKey(0)\n\n29   cv2.destroyAllWindows()\n\
