  \n\n\n### 黑帽运算\n\n*黑帽运算*是一种形态学操作，用于计算图像闭运算结果与原始图像本身的差异。它被用来提取和突出图像中较大尺度的结构或区域。\n\
  \n黑帽运算揭示了图像中存在但可能被周围背景掩盖或隐藏的较大尺度结构或区域。它常用于图像分析、目标检测和文本提取等应用中，这些应用的重点是识别和提取那些比背景或噪声水平更显著的结构或特征。\n\
