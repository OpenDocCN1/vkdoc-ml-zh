  \ `.DS_Store` 的隐藏文件。请确保从所有包含输入图片的子目录中删除该文件。同时，确保子目录中仅包含图片，没有其他文件。\n\n执行清单 8-8 中的脚本，以裁剪并对齐人脸。图\
