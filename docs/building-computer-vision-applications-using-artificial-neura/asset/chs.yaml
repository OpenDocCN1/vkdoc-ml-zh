  \ 3-19 的第 11 行到第 14 行类似。不同之处在于 `ksize` 的值为 `-1`，这指示 OpenCV 在内部调用核大小为 3×3 的 Scharr\
  \ 函数。你会注意到，与 Sobel 函数相比，边缘的锐利度要好得多。图 3-64 和图 3-65 是对图 3-61 所示图像应用 Scharr 滤波器的结果。\n\
  \n![](img/493065_2_En_3_Fig65_HTML.jpg)\n\n一张截图，显示了一组排列在深色背景上的个位数字。数字以较浅的色调勾勒出轮廓。标题为“Sobel\
  \ Y”。底部标注了以下数值：X = 169。Y = 238。L, 228。\n\n图 3-65\nY 方向的 Scharr 边缘检测\n\n![](img/493065_2_En_3_Fig64_HTML.jpg)\n\
  \n一张截图，显示了一组排列在深色背景上的个位数字。数字以较浅的色调勾勒出轮廓。标题为“Scharr X”。底部标注了以下数值：X = 313。Y = 185。L,\
  \ 32。\n\n图 3-64\nX 方向的 Scharr 边缘检测\n\nSobel 和 Scharr 计算沿 X 和 Y 方向的梯度幅值，使我们能够确定水平和垂直方向上的边缘。\n\
  \n\n\n#### 拉普拉斯导数（cv2.Laplacian( ) 函数）\n\n拉普拉斯算子计算像素强度函数的二阶导数，以确定图像中的边缘。拉普拉斯算子基于以下方程计算梯度：\n\
  \n![$$ \\mathrm{Laplace}\\left(\\mathrm{f}\\right)=\\frac{\\partial²\\mathrm{f}}{\\\
  partial {x}²}+\\frac{\\partial²\\mathrm{f}}{\\partial {y}²} $$](img/493065_2_En_3_Chapter_TeX_Equb.png)\n\
  \nOpenCV 提供了一个函数 `Laplacian()`，用于计算边缘检测的梯度。该函数接受以下参数：\n\n*   需要检测边缘的图像\n*   数据类型，通常为\
  \ `cv2.CV_64F`，用于保存浮点数值\n\n清单 3-20 展示了使用 OpenCV 的拉普拉斯函数进行边缘检测的完整示例。\n\n```\nFilename:\
  \ Listing_3_20.py\n1    import cv2\n2    import numpy as np\n\n4    # 加载图像\n5  \
  \  image = cv2.imread(\"images/sudoku.jpg\")\n6    image = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)\n\
  \n8    image = cv2.bilateralFilter(image, 5, 50, 50)\n9    cv2.imshow(\"模糊图像\",\
  \ image)\n\n11   # 用于边缘检测的拉普拉斯函数\n12   laplace = cv2.Laplacian(image,cv2.CV_64F)\n\
  13   laplace = np.uint8(np.absolute(laplace))\n\n15   cv2.imshow(\"拉普拉斯边缘\", laplace)\n\
  \n17   cv2.waitKey(0)\n清单 3-20\n使用拉普拉斯导数进行边缘检测\n```\n\n与往常一样，第 5 行加载图像，第 6 行将图像转换为灰度图，第\
  \ 8 行使用双边滤波对图像进行模糊处理。\n\n第 12 行调用了 `Laplacian()` 函数，用于计算梯度以检测图像中的边缘。同样，我们传递了 `CV_64F`\
  \ 数据类型，以保存当像素从白到黑过渡时可能出现的负梯度值。\n\n第 13 行将 64 位浮点数转换为 8 位无符号整数。\n\n图 3-66 展示了 `Laplacian()`\
  \ 函数的示例输出。\n\n![](img/493065_2_En_3_Fig66_HTML.jpg)\n\n截图显示了一个表格，其中包含一组排列在深色背景上的个位数数字。数字以较浅的色调勾勒出轮廓。标题为“拉普拉斯边缘”。底部标注了以下数值：X\
  \ = 305。Y = 265。L, 3。\n\n图 3-66\n\n使用拉普拉斯导数进行边缘检测\n\n### Canny 边缘检测\n\n*Canny 边缘检测*是图像处理中最流行的边缘检测方法之一。它涉及一个多步骤过程，包含几个关键操作：\n\
  \n1.  对图像进行模糊处理以减少噪声。\n2.  在 X 和 Y 两个方向上计算 Sobel 梯度，以捕捉边缘强度变化。\n3.  应用非极大值抑制来抑制非必要边缘。非极大值抑制通过仅保留边缘图中局部最大梯度值，帮助细化检测到的边缘。\n\
  4.  采用滞后阈值技术来确定一个像素是否符合“边缘像素”的条件。\n\nOpenCV 通过将所有步骤封装到一个名为 `Canny()` 的单一函数中，简化了\
  \ Canny 边缘检测的实现。该函数简化了流程，使其便捷高效。清单 3-21 提供了使用 `Canny()` 函数进行边缘检测的示例。\n\n```\nFilename:\
  \ Listing_3_21.py\n1    import cv2\n2    import numpy as np\n\n4    # 加载图像\n5  \
  \  image = cv2.imread(\"images/sudoku.jpg\")\n6    image = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)\n\
  7    cv2.imshow(\"模糊图像\", image)\n\n9    # 用于边缘检测的 Canny 函数\n10   canny = cv2.Canny(image,\
  \ 50, 170)\n11   cv2.imshow(\"Canny 边缘\", canny)\n\n13   cv2.waitKey(0)\n清单 3-21\n\
  Canny 边缘检测\n```\n\n清单 3-21 中关键的一行是第 10 行，我们在此调用了 `Canny()` 函数，并向需要检测边缘的图像传递了最小和最大阈值参数。任何大于最大阈值的梯度值都被视为边缘。任何低于最小阈值的值都不被视为边缘。介于两者之间的梯度值则根据其强度变化被考虑为边缘。\n\
  \n图 3-67 展示了 Canny 边缘检测器的示例输出。请注意，此例中的边缘非常清晰。\n\n![](img/493065_2_En_3_Fig67_HTML.jpg)\n\
  \n截图显示了一个表格，其中包含一组排列在深色背景上的个位数数字。数字以较浅的色调勾勒出轮廓。标题为“Canny 边缘”。\n\n图 3-67\n\nCanny\
  \ 边缘检测\n\n\n\n## 轮廓\n\n*轮廓*是连接相同强度连续点的曲线。识别和分析轮廓的能力对于物体识别、人脸检测和识别等任务至关重要。\n\n要在图像中检测轮廓，我们遵循以下步骤：\n\
  \n1.  将图像转换为灰度图以简化处理。\n\n2.  使用任意可用的阈值方法对图像进行二值化。\n\n3.  应用 Canny 边缘检测方法来突出图像中的边缘。\n\
  \n4.  使用 `findContours()` 方法定位并提取图像中存在的所有轮廓。\n\n5.  可选地，使用 `drawContours()` 函数在图像上可视化并绘制轮廓。\n\
  \n为了让您实际理解如何有效实现此技术，清单 3-22 中的示例及随后的讨论将探索轮廓检测和绘制的实际过程。\n\n```\nFilename: Listing_3_22.py\n\
  1    import cv2\n2    import numpy as np\n\n4    # 加载图像\n5    image = cv2.imread(\"\
  images/sudoku.jpg\")\n6    image = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)\n7  \
  \  cv2.imshow(\"模糊图像\", image)\n\n9    # 对图像进行二值化\n10   (T,binarized) = cv2.threshold(image,\
  \ 0, 255, cv2.THRESH_BINARY_INV+cv2.THRESH_OTSU)\n11   cv2.imshow(\"二值化图像\", binarized)\n\
  \n13   # 用于边缘检测的 Canny 函数\n14   canny = cv2.Canny(binarized, 0, 255)\n15   cv2.imshow(\"\
  Canny 边缘\", canny)\n\n17   (contours, hierarchy) = cv2.findContours(canny,cv2.RETR_EXTERNAL,\
  \ cv2.CHAIN_APPROX_SIMPLE)\n18   print(\"确定的轮廓数量为 \", format(len(contours)))\n\n\
  20   copiedImage = image.copy()\n21   cv2.drawContours(copiedImage, contours, -1,\
  \ (0,255,0), 2)\n22   cv2.imshow(\"轮廓\", copiedImage)\n23   cv2.waitKey(0)\n清单 3-22\n\
  轮廓检测与绘制\n```\n\n以下是清单 3-22 的逐行解释。\n\n第 5 行加载图像。第 6 行将图像转换为灰度图，第 10 行使用 Otsu 方法对图像进行二值化。第\
  \ 14 行使用 Canny 函数计算梯度以进行边缘检测。\n\n第 17 行调用 OpenCV 的 `findContours()` 函数来确定轮廓。该函数的参数如下：\n\
  \n*   第一个参数是我们想要使用 Canny 函数检测边缘的图像。\n\n*   第二个参数 `cv2.RET_EXTERNAL` 决定了我们感兴趣的轮廓类型。`cv2.RET_EXTERNAL`\
  \ 仅检索最外层的轮廓。我们也可以使用 `cv2.RET_LIST` 来检索所有轮廓，使用 `cv2.RET_COMP` 和 `cv2.RET_TREE` 来包含层次轮廓。\n\
  \n*   第三个参数 `cv2.CHAIN_APPROAX_SIMPLE` 移除冗余点并压缩轮廓，从而节省内存。`cv2.CHAIN_APPROAX_NONE`\
  \ 存储轮廓的所有点（这需要更多内存来存储它们）。\n\n`findContours()` 函数的输出是一个元组，其中包含以下项目：\n\n*   第一项是图像中所有轮廓的\
  \ Python 列表。每个单独的轮廓是一个 NumPy 数组，包含物体边界点的 (x,y) 坐标。\n\n*   第二项是轮廓层次结构。\n\n第 18 行是我们打印识别出的轮廓数量的地方。\n\
  \n我们在清单 3-22 的第 21 行使用 `drawContours()` 函数绘制轮廓。以下是该函数的参数：\n\n*   第一个参数是要在其上绘制轮廓的图像。\n\
  \n*   第二个参数是所有轮廓点的列表。\n\n*   第三个参数是要绘制的轮廓的索引。要绘制第一个轮廓，传递 0。类似地，传递 1 绘制第二个轮廓，依此类推。如果要绘制所有轮廓，则向此参数传递\
  \ -1。\n\n*   第四个参数是轮廓的颜色。\n\n*   最后一个参数是轮廓的粗细。\n\n图 3-68 到 3-70 展示了清单 3-22 的一些示例输出。\n\
  \n![](img/493065_2_En_3_Fig70_HTML.jpg)\n\n一张屏幕截图，显示了一个包含一组个位数字的表格。数字在亮色背景上呈深色。标题为“轮廓”。底部标注了以下值：X\
  \ = 318。Y = 264。L, 199。\n\n图 3-70\n\n绘制在原始图像上的轮廓\n\n![](img/493065_2_En_3_Fig69_HTML.jpg)\n\
  \n一张屏幕截图，显示了一个表格，其中一组个位数字排列在深色背景上。数字以较浅的色调勾勒出轮廓。标题为“Canny 边缘”。底部标注了以下值：X = 39。Y\
  \ = 293。L, 0。\n\n图 3-69\n\n使用 Canny 函数得到的轮廓\n\n![](img/493065_2_En_3_Fig68_HTML.jpg)\n\
  \n一张屏幕截图，显示了一个表格，其中一组个位数字排列在深色背景上。数字呈较浅的色调。标题为“二值化图像”。底部标注了以下值：X = 211。Y = 311。L,\
  \ 255。\n\n图 3-68\n\n模糊图像\n\n## 形态学变换\n\n*形态学变换*是图像处理中的一项基本技术，涉及对图像中物体的几何结构进行操作和修改。它主要用于噪声去除、物体提取和形状分析等任务。\n\
  \n形态学变换基于一组预定义的操作，称为*形态学算子*。最常用的两个形态学算子是膨胀和腐蚀。形态学变换有几种变体形式，可以补充基本的膨胀和腐蚀操作。这些包括开运算、闭运算、梯度等。在接下来的章节中，我们将以图\
  \ 3-71 所示的图像为例，详细探讨每种变换，以说明其效果。\n\n![](img/493065_2_En_3_Fig71_HTML.jpg)\n\n一张屏幕截图，显示了一个包含一组个位数字的表格。数字在亮色背景上呈深色。标题为“原始图像”。\n\
  \n图 3-71\n\n原始图像\n\nOpenCV 提供了专门用于执行形态学操作的函数，这些操作主要针对二值图像。这些操作依赖于两个输入：原始图像和一个结构元素（也称为核），它决定了要执行操作的具体特性。\n\
  \n### 膨胀\n\n*膨胀*是一个扩展图像中物体边界的过程。它通过将图像与一个结构元素（一个小型二值矩阵）进行卷积来实现。膨胀导致物体增长并合并在一起，使它们更加突出和清晰。在膨胀过程中，如果核下方至少有一个像素的值为\
  \ 1，则该像素元素被赋值为 1。结果，图像中的白色区域扩大，导致前景物体尺寸增加。\n\nOpenCV 提供了一个函数 `dilate()`，它接受原始图像（作为\
  \ NumPy 数组）、结构元素或核以及迭代次数作为参数。有关此函数的使用示例，请参考清单 3-23 的第 14 行，其输出示例见图 3-72。\n\n![](img/493065_2_En_3_Fig72_HTML.jpg)\n\
  \n一张屏幕截图，显示了一个包含一组个位数字的表格。数字以粗体和深色格式书写。标题为“腐蚀”。\n\n图 3-73\n\n腐蚀\n\n\n\n### 腐蚀\n\n\
  *腐蚀*是一种侵蚀或缩小图像中物体边界的过程。它涉及使用结构元素对图像进行卷积。腐蚀可以消除微小细节并断开连通区域，从而去除噪声和精细结构。在腐蚀过程中，内核以类似于二维卷积的方式在图像上移动。如果原始图像中内核下方的所有像素都为\
  \ 1，则输出中对应的像素保持为 1。然而，如果内核下方的任何像素为 0，则该像素被腐蚀并设置为 0。\n\n因此，物体边界附近的像素会根据内核的大小逐渐被消除。这会导致前景物体的厚度或尺寸减小，从而使图像中的白色区域减少。\n\
  \nOpenCV 提供了一个函数 `erode()`，它接受原始图像（作为 NumPy 数组）、结构元素或内核以及迭代次数作为参数。有关此函数的使用示例，请参阅清单\
  \ 3-23 的第 11 行，其输出示例见图 3-73。\n\n![](img/493065_2_En_3_Fig73_HTML.jpg)\n\n一张屏幕截图显示了一个包含一组个位数字的表格。这些数字在明亮背景上带有细的深色轮廓。标题显示为“膨胀”。\n\
  \n图 3-72\n\n膨胀\n\n### 开运算\n\n*开运算*先进行腐蚀，再进行膨胀，对于去除噪声和小物体非常有用。通过先腐蚀图像，可以去除小的噪声区域和精细细节。然后膨胀有助于恢复剩余的物体，同时保留其整体形状和结构。\n\
  \n为了执行开运算，OpenCV 提供了一个函数 `morphologyEx()`，它接受以下参数：\n\n*   一个作为 NumPy 数组的图像\n*  \
  \ `cv2.MORPH_OPEN`，表示正在执行的操作是开运算\n*   一个定义结构元素或卷积矩阵的内核\n\n有关此函数的使用示例，请参阅清单 3-23\
  \ 的第 17 行，其输出示例见图 3-74。\n\n![](img/493065_2_En_3_Fig74_HTML.jpg)\n\n一张屏幕截图显示了一个包含一组个位数字的表格。这些数字带有粗的深色轮廓。标题显示为“开运算”。\n\
  \n图 3-74\n\n开运算\n\n### 闭运算\n\n*闭运算*先进行膨胀，再进行腐蚀，对于闭合小间隙和填充物体中的孔洞非常有效。通过先执行膨胀，该操作有助于扩展物体的边界并闭合它们之间的小间隙。然后腐蚀有助于细化物体边界，并消除由膨胀引起的任何过度扩展。\n\
  \n为了执行闭运算，我们可以使用与开运算相同的 OpenCV 函数 `morphologyEx()`，并传递以下参数：\n\n*   一个作为 NumPy 数组的图像\n\
  *   `cv2.MORPH_CLOSE`，表示正在执行的操作是闭运算\n*   一个定义结构元素或卷积矩阵的内核\n\n有关此函数的使用示例，请参阅清单 3-23\
  \ 的第 20 行，其输出示例见图 3-75。\n\n![](img/493065_2_En_3_Fig75_HTML.jpg)\n\n一张屏幕截图显示了一个包含一组个位数字的表格。这些数字带有粗的深色轮廓，并且在某些地方模糊。背景是明亮的。标题显示为“闭运算”。\n\
  \n图 3-75\n\n闭运算\n\n### 形态学梯度\n\n*形态学梯度*是一个过程，它使用特定的结构元素或内核计算图像膨胀与腐蚀之间的差异。它突出显示了图像中物体的边界或边缘。\n\
  \n形态学梯度对于边缘检测非常有用，因为它强调了不同强度或结构区域之间的过渡。它提供了图像内强度或形状局部变化的表示，允许进行进一步的分析或处理，例如物体分割或轮廓提取。\n\
  \n清单 3-23 的第 23 行展示了形态学梯度的使用示例，图 3-76 展示了此操作的输出示例。\n\n![](img/493065_2_En_3_Fig76_HTML.jpg)\n\
