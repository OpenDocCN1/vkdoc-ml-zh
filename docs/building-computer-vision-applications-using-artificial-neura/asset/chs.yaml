  \n## 在 AWS 上进行分布式训练\n\nAmazon Web Services (AWS) 是亚马逊的子公司，按计量即用即付的方式向个人、公司和政府提供按需云计算平台和\
  \ API。在本节中，我们将探讨如何在 AWS 上训练分布式模型。\n\n清单 10-3 的分布式训练也适用于 AWS。我们只需要创建虚拟机，并遵循我们在 GCP\
  \ 上训练模型时所采取的步骤。\n\n类似地，我们可以在具有多个 GPU 的 AWS 虚拟机上训练基于 `MirroredStrategy` 的模型。除了创建基于多\
  \ GPU 的虚拟机的方法不同之外，所有在 Azure 上进行训练的说明同样适用于 AWS。\n\n在这里，我们将探讨另一种在云上训练可扩展模型的技术。我们将使用\
  \ Horovod 在 AWS 上分发训练。让我们首先了解 Horovod 框架是什么以及如何在分布式模型训练中使用它。\n\n\n\n### Horovod\n\
  \n官方文档将 Horovod 描述为一个用于 TensorFlow、Keras、PyTorch 和 Apache MXNet 的分布式深度学习训练框架。Horovod\
  \ 旨在使分布式深度学习变得快速且易于使用。Horovod 由 Uber 开发，并由 Linux 基金会 AI 托管。\n\n包含文档的源代码托管在 GitHub\
  \ 仓库 [`https://github.com/horovod/horovod`](https://github.com/horovod/horovod)\
  \ 中。官方文档位于 [`https://horovod.readthedocs.io/en/latest/summary_include.html`](https://horovod.readthedocs.io/en/latest/summary_include.html)。\n\
  \n要使用 Horovod，我们需要对用于模型训练的 TensorFlow 代码进行一些小的修改。我们将使用清单 5-2 中的相同示例代码，并对其进行修改以使其与\
  \ Horovod 兼容。\n\n### 如何使用 Horovod\n\n当我们定义神经网络时，我们会指定优化算法，例如 AdaGrad，我们希望网络使用该算法来优化梯度。在分布式学习中，梯度在多个节点上计算，使用\
  \ all-reduce 或 all-gather 算法进行平均，然后使用优化算法进一步优化。Horovod 提供了一个包装函数，用于将优化分发到所有参与节点，并将梯度优化任务委托给我们包装在\
  \ Horovod 中的原始优化算法。\n\n我们将使用 Horovod 与 TensorFlow 一起，将模型训练分发到多个节点，每个节点拥有一个或多个 GPU。我们将使用清单\
  \ 5-2 中的相同代码示例，对其进行一些小的修改以使其与 Horovod 兼容，并在 AWS 上执行训练。要使用 Horovod，我们需要对清单 5-2 中的代码进行以下修改：\n\
  \n1.  导入 `horovod.tensorflow` 为 `hvd`。\n\n2.  使用 `hvd.init()` 初始化 Horovod。\n\n3.\
  \  使用以下代码固定将处理梯度的 GPU（每个进程一个 GPU）：\n\n```\n    config = tf.ConfigProto()\n    config.gpu_options.visible_device_list\
  \ = str(hvd.local_rank())\n    ```\n\n4.  像在 TensorFlow 中通常所做的那样构建模型。定义损失函数。\n\n\
  5.  定义 TensorFlow 优化函数，如下所示：\n\n```\n    opt = tf.train.AdagradOptimizer(0.01 *\
  \ hvd.size())\n    ```\n\n6.  调用 Horovod 分布式优化函数，并传入步骤 5 中的原始 TensorFlow 优化器。这是\
  \ Horovod 的核心。\n\n```\n    opt = hvd.DistributedOptimizer(opt)\n    ```\n\n7.  创建一个\
  \ Horovod 钩子，将训练变量广播到所有处理器：\n\n```\n    hooks = [hvd.BroadcastGlobalVariablesHook(0)]\n\
  \    ```\n\n0 表示从所有等级为零的处理器（例如，第一个 GPU）到所有处理器。\n\n8.  最后，使用以下代码训练模型：\n\n```\n  \
  \  train_op = opt.minimize(loss)\n    ```\n\n让我们将所有这些步骤整合在一起，并将清单 5-2 中的代码转换为与 Horovod\
  \ 兼容的代码，该代码可以跨多个具有多个 GPU 的节点进行分发。清单 10-18 显示了完整的代码，我们可以在以 TensorFlow 作为执行引擎的 Horovod\
  \ 集群上执行该代码。取自 Horovod 官方源代码 `examples` 目录的代码托管在 [`https://github.com/horovod/horovod.git`](https://github.com/horovod/horovod.git)。\n\
  \n```\nFile name: horovod_tensorflow_mnist.py\n1    import tensorflow as tf\n2 \
  \   import horovod.tensorflow.keras as hvd\n\n4    # Horovod: 初始化 Horovod。\n5  \
  \  hvd.init()\n\n7    # Horovod: 固定 GPU 以处理本地等级（每个进程一个 GPU）\n8    gpus = tf.config.experimental.list_physical_devices('GPU')\n\
  9    for gpu in gpus:\n10       tf.config.experimental.set_memory_growth(gpu, True)\n\
  11   if gpus:\n12       tf.config.experimental.set_visible_devices(gpus[hvd.local_rank()],\
  \ 'GPU')\n\n14   # 使用内置数据集下载函数加载 MNIST 数据\n15   mnist = tf.keras.datasets.mnist\n\
  16   (x_train, y_train), (x_test, y_test) = mnist.load_data()\n\n18   # 通过将每个像素除以\
  \ 255 来归一化像素值\n19   x_train, x_test = x_train / 255.0, x_test / 255.0\n\n21   BUFFER_SIZE\
  \ = len(x_train)\n22   BATCH_SIZE_PER_REPLICA = 16\n23   GLOBAL_BATCH_SIZE = BATCH_SIZE_PER_REPLICA\
  \ * 2\n24   EPOCHS = 100\n25   STEPS_PER_EPOCH = int(BUFFER_SIZE/EPOCHS)\n\n27 \
  \  train_dataset = tf.data.Dataset.from_tensor_slices((x_train, y_train)).repeat().shuffle(BUFFER_SIZE).batch(GLOBAL_BATCH_SIZE,drop_remainder=True)\n\
  28   test_dataset = tf.data.Dataset.from_tensor_slices((x_test, y_test)).batch(GLOBAL_BATCH_SIZE)\n\
  \n31   mnist_model = tf.keras.Sequential([\n32       tf.keras.layers.Conv2D(32,\
  \ [3, 3], activation='relu'),\n33       tf.keras.layers.Conv2D(64, [3, 3], activation='relu'),\n\
  34       tf.keras.layers.MaxPooling2D(pool_size=(2, 2)),\n35       tf.keras.layers.Dropout(0.25),\n\
  36       tf.keras.layers.Flatten(),\n37       tf.keras.layers.Dense(128, activation='relu'),\n\
  38       tf.keras.layers.Dropout(0.5),\n39       tf.keras.layers.Dense(10, activation='softmax')\n\
  40   ])\n\n42   # Horovod: 根据 GPU 数量调整学习率。\n43   opt = tf.optimizers.Adam(0.001\
  \ * hvd.size())\n\n45   # Horovod: 添加 Horovod DistributedOptimizer。\n46   opt =\
  \ hvd.DistributedOptimizer(opt)\n\n48   # Horovod: 指定 `experimental_run_tf_function=False`\
  \ 以确保 TensorFlow\n49   # 使用 hvd.DistributedOptimizer() 计算梯度。\n50   mnist_model.compile(loss=tf.losses.SparseCategoricalCrossentropy(),\n\
  51                       optimizer=opt,\n52                       metrics=['accuracy'],\n\
  53                       experimental_run_tf_function=False)\n\n55   callbacks =\
  \ [\n56       # Horovod: 将初始变量状态从等级 0 广播到所有其他进程。\n57       # 这对于确保当训练以随机权重开始或从检查点恢复时所有工作线程的初始化一致是必要的。\n\
  58       hvd.callbacks.BroadcastGlobalVariablesCallback(0),\n\n61       # Horovod:\
  \ 在每个 epoch 结束时平均工作线程之间的指标。\n62       #\n63       # 注意：此回调必须位于 ReduceLROnPlateau、\n\
  64       # TensorBoard 或其他基于指标的回调之前的列表中。\n65       hvd.callbacks.MetricAverageCallback(),\n\
  \n67       # Horovod: 从一开始就使用 `lr = 1.0 * hvd.size()` 会导致最终准确率更差。\n68       # 在前三个\
  \ epoch 期间将学习率从 `lr = 1.0` 缩放为 `lr = 1.0 * hvd.size()`。\n69       # 详情请参见 https://arxiv.org/abs/1706.02677。\n\
  70       hvd.callbacks.LearningRateWarmupCallback(warmup_epochs=3, verbose=1),\n\
  71   ]\n\n73   # Horovod: 仅在工作线程 0 上保存检查点，以防止其他工作线程损坏它们。\n74   if hvd.rank() ==\
  \ 0:\n75       callbacks.append(tf.keras.callbacks.ModelCheckpoint('./checkpoint-{epoch}.h5'))\n\
  \n77   # Horovod: 在工作线程 0 上写入日志。\n78   verbose = 1 if hvd.rank() == 0 else 0\n\n\
  80   # 训练模型。\n81   # Horovod: 根据 GPU 数量调整步数。\n82   mnist_model.fit(train_dataset,\
  \ steps_per_epoch=500 // hvd.size(), callbacks=callbacks, epochs=24, verbose=verbose)\n\
  清单 10-18\n使用 Horovod 进行分布式训练\n```\n\n使用 Horovod API 的代码部分在注释中标记为 `Horovod:`。代码已适当注释，以帮助您理解如何使用\
  \ Horovod。所有其他代码行已在第 5 章中解释过。\n\n\n\n### 在 AWS 上创建 Horovod 集群\n\n您必须拥有一个 AWS 账户，并且能够登录到\
