  \ 行是我们合并通道的地方。我们只需将各个通道作为参数传递给 `merge()` 函数。注意，通道是按 BGR 顺序排列的。执行程序并观察输出。你得到原始图像了吗？\n\
  \n分割与合并是图像处理中非常有用的技术，可用于为机器学习进行特征工程。我们将在后续章节中应用其中的一些概念。\n\n## 使用平滑与模糊进行降噪\n\n*平滑*和*模糊*是重要的图像处理技术，用于减少图像中存在的噪声。平滑和模糊都涉及减少图像中的高频分量或尖锐细节，从而使图像外观更加均匀。平滑是一个通用术语，用于描述减少图像中噪声或尖锐过渡的过程。模糊是平滑技术的一种特定类型。在图像处理中，我们通常会遇到以下几种类型的噪声：\n\
  \n*   *椒盐噪声*：随机出现的黑白像素\n*   *脉冲噪声*：随机出现的白色像素\n*   *高斯噪声*：遵循高斯正态分布的强度变化\n\n在本节中，我们将深入探讨各种能够有效减少图像噪声的模糊与平滑技术。\n\
  \n\n\n### 均值滤波或平均滤波\n\n在*平均*技术中，我们取图像的一小部分，例如 *k*×*k* 像素。图像的这一小部分被称为*滑动窗口*。我们将这个滑动窗口从左到右、从上到下移动。这个\
  \ *k*×*k* 矩阵中心像素的值会被其周围所有像素的平均值所取代。这个 *k*×*k* 矩阵也被称为*卷积核*，或简称为*核*。通常，这个核的尺寸取奇数，以便能够计算出明确的中心点。核的尺寸越大，图像就会变得越模糊。例如，与\
  \ 3×3 的核相比，5×5 的核会产生更模糊的图像。\n\nOpenCV 提供了一个便捷的函数来模糊图像。`blur()` 函数用于通过均值滤波或平均技术来模糊图像。该函数接受两个参数。\n\
  \n*   需要被模糊的原始图像的 NumPy 表示\n*   *k*×*k* 的核矩阵\n\n清单 3-12 展示了使用不同核大小对图像进行模糊处理的效果。\n\
  \n```\nFilename: Listing_3_12.py\n1    import cv2\n2    import numpy as np\n\n4\
  \    # 加载图像\n5    park = cv2.imread(\"images/nature.jpg\")\n6    cv2.imshow(\"原始公园图像\"\
  , park)\n\n8    # 定义核\n9    kernel = (3,3)\n10   blurred3x3 = cv2.blur(park,kernel)\n\
  11   cv2.imshow(\"3x3 模糊图像\", blurred3x3)\n\n13   blurred5x5 = cv2.blur(park,(5,5))\n\
  14   cv2.imshow(\"5x5 模糊图像\", blurred5x5)\n\n16   blurred7x7 = cv2.blur(park, (7,7))\n\
  17   cv2.imshow(\"7x7 模糊图像\", blurred7x7)\n18   cv2.waitKey(0)\n清单 3-12\n通过均值滤波或平均滤波进行平滑/模糊处理\n\
  ```\n\n像往常一样，我们首先加载图像并将其赋值给一个数组变量（清单 3-12 中第 5 行的 `park` 变量）。\n\n第 9 行定义了一个 3×3\
  \ 的核。\n\n在第 10 行，我们使用了 `blur()` 函数，并将 `park` 图像和 `kernel` 作为参数传递。这将使用 3×3 的核生成一幅模糊图像。\n\
  \n为了比较核大小的影响，第 13 行和第 16 行分别使用了 5×5 和 7×7 的核。请注意，在图 3-38 到图 3-41 中，随着核大小的增加，模糊程度也在增加。\n\
  \n![](img/493065_2_En_3_Fig41_HTML.jpg)\n\n一张截图，展示了一幅模糊的风景照片，其中有雪覆盖的山丘、一片水域、植被和顶部晴朗的天空。标题显示为“7\
  \ 乘 7 模糊图像”。底部提供了以下数值：x = 616。y = 127。R, 0。G, 50。B, 96。\n\n图 3-41\n使用 7×7 核进行模糊处理\n\
  \n![](img/493065_2_En_3_Fig40_HTML.jpg)\n\n一张截图，展示了一幅模糊的风景照片，其中有雪覆盖的山丘、一片水域、植被和顶部晴朗的天空。标题显示为“5\
  \ 乘 5 模糊图像”。底部提供了以下数值：x = 488。y = 359。R, 36。G, 53。B, 78。\n\n图 3-40\n使用 5×5 核进行模糊处理\n\
  \n![](img/493065_2_En_3_Fig39_HTML.jpg)\n\n一张截图，展示了一幅模糊的风景照片，其中有雪覆盖的山丘、一片水域、植被和顶部晴朗的天空。标题显示为“3\
  \ 乘 3 模糊图像”。底部提供了以下数值：x = 340。y = 357。R, 10。G, 87。B, 150。\n\n图 3-39\n使用 3×3 核进行模糊处理\n\
  \n![](img/493065_2_En_3_Fig38_HTML.jpg)\n\n一张截图，展示了一幅风景照片，其中有雪覆盖的山丘、一片水域、植被和顶部晴朗的天空。标题显示为“原始公园图像”。底部提供了以下数值：x\
  \ = 262。y = 4。R, 1。G, 66。B, 132。\n\n图 3-38\n原始图像\n\n### 高斯滤波\n\n*高斯滤波*是图像处理中最有效的模糊技术之一。它用于减少高斯噪声。与平均技术相比，这种模糊技术能产生更自然的平滑效果。在这种滤波中，我们提供的是高斯核，而不是固定的盒状核。\n\
  \n高斯核由高度、宽度以及 X 和 Y 方向的标准差组成。\n\nOpenCV 提供了一个便捷的函数 `GaussianBlur()` 来执行高斯滤波。`GaussianBlur()`\
  \ 接受以下参数：\n\n*   由 NumPy 数组表示的图像\n*   作为核高度和宽度的 *k*×*k* 矩阵\n*   `sigmaX` 和 `sigmaY`\
  \ 是 X 和 Y 方向的标准差\n\n关于标准差的一些说明：\n\n*   如果只指定了 `sigmaX`，则 `sigmaY` 取与 `sigmaX` 相同的值。\n\
  *   如果两者都取零，则标准差会根据核大小自动计算。\n*   OpenCV 提供了一个函数 `getGaussianKernel()` 来自动计算标准差。\n\
  \n对于那些对高斯滤波中使用的公式感兴趣的人，以下是高斯方程：\n\n![$$ {G}_0\\left(x,y\\right)={Ae}^{\\frac{-{\\\
  left(x-{\\mu}_x\\right)}²}{2{\\sigma}_x²}+\\frac{-{\\left(y-{\\mu}_y\\right)}²}{2{\\\
  sigma}_y²}} $$](img/493065_2_En_3_Chapter_TeX_Equa.png)\n\n其中 *μ* 是均值（峰值），*σ*² 是方差（分别针对变量\
  \ `x` 和 `y`）。\n\n清单 3-13 是一个演示高斯模糊的工作示例。\n\n```\nFilename: Listing_3_13.py\n1  \
  \  import cv2\n2    import numpy as np\n\n4    # 加载公园图像\n5    parkImage = cv2.imread(\"\
  images/park.jpg\")\n6    cv2.imshow(\"原始图像\", parkImage)\n\n8    # 使用 3x3 核高度和 0\
  \ 标准差（让 OpenCV 根据核大小计算）进行高斯模糊\n9    GaussianFiltered = cv2.GaussianBlur(parkImage,\
  \ (5,5), 0)\n10   cv2.imshow(\"高斯模糊图像\", GaussianFiltered)\n\n12   cv2.waitKey(0)\n\
  清单 3-13\n使用高斯技术进行平滑处理\n```\n\n这里我们再次从加载我们的 `park` 图像开始（清单 3-13 的第 5 行）。第 9 行展示了\
  \ OpenCV 的 `GaussianBlur()` 函数的使用。我们提供了一个 5×5 的核和一个 0，以告知 OpenCV 根据核大小计算标准差。\n\n\
  图 3-42 显示了原始图像，图 3-43 显示了高斯模糊的效果。\n\n![](img/493065_2_En_3_Fig43_HTML.jpg)\n\n一张截图，展示了一幅模糊的风景照片，其中有雪覆盖的山丘、一片水域、植被和顶部晴朗的天空。标题显示为“高斯模糊图像”。底部提供了以下数值：x\
  \ = 452。y = 248。R, 19。G, 40。B, 66。\n\n图 3-43\n使用 5×5 核的高斯模糊图像\n\n![](img/493065_2_En_3_Fig42_HTML.jpg)\n\
  \n一张截图，展示了一幅风景照片，其中有雪覆盖的山丘、一片水域、植被和顶部晴朗的天空。标题显示为“原始图像”。底部提供了以下数值：x = 108。y = 363。R,\
  \ 67。G, 86。B, 116。\n\n图 3-42\n原始图像\n\n\n\n### 中值模糊\n\n*中值模糊*是一种有效降低椒盐噪声的技术。中值模糊与均值模糊类似，区别在于核的中心值被周围像素的中值所取代。我们使用\
  \ OpenCV 的 `medianBlur()` 函数来降低椒盐噪声（参见代码清单 3-14）。该函数接受以下两个参数：\n\n*   需要进行模糊处理的原始图像\n\
  *   核大小 *k*（类似于均值模糊中的 *k*×*k* 矩阵）\n\n```\nFilename: Listing_3_14.py\n1    import\
  \ cv2\n\n3    # 加载一张带噪声的图像\n4    saltpepperImage = cv2.imread(\"images/salt-pepper.jpg\"\
  )\n5    cv2.imshow(\"原始带噪声图像\", saltpepperImage)\n\n7    # 中值滤波降噪\n8    blurredImage3\
  \ = cv2.medianBlur(saltpepperImage, 3)\n9    cv2.imshow(\"模糊图像 3\", blurredImage3)\n\
  \n11   # 中值滤波降噪\n12   blurredImage5 = cv2.medianBlur(saltpepperImage, 5)\n13   cv2.imshow(\"\
  模糊图像 5\", blurredImage5)\n14   cv2.waitKey(0)\n代码清单 3-14\n使用中值模糊降低椒盐噪声\n```\n\n\
  代码清单 3-14 展示了 `medianBlur()` 函数的用法。第 8 行和第 12 行基于第 4 行加载的原始图像创建了模糊图像。请注意，该函数的 `kernel`\
  \ 参数是一个标量，而不是元组或矩阵。\n\n图 3-44 展示了带有椒盐噪声的图像。请注意，当我们应用不同核大小时，降噪效果的不同程度。图 3-45 展示了应用核大小为\
  \ 3 时的输出图像。请注意，图 3-45 中仍有一些噪声。图 3-46 展示了应用核大小为 5 的中值模糊后，几乎无噪声的更干净输出。\n\n![](img/493065_2_En_3_Fig46_HTML.jpg)\n\
  \n一张屏幕截图，显示的是无噪声的脑部 MRI 扫描图。标题为“模糊图像 5”。底部标注了以下数值：X = 232。Y = 536。R, 255。G, 255。B,\
  \ 255。\n\n图 3-46\n核大小为 5 的中值模糊（噪声几乎被去除）\n\n![](img/493065_2_En_3_Fig45_HTML.jpg)\n\
  \n一张屏幕截图，显示的是散布着较少随机点的脑部 MRI 扫描图。标题为“模糊图像 3”。底部标注了以下数值：X = 448。Y = 536。R、G、B 值均设为\
  \ 255。\n\n图 3-45\n核大小为 3 的中值模糊（仍有一些噪声）\n\n![](img/493065_2_En_3_Fig44_HTML.jpg)\n\
  \n一张屏幕截图，显示的是散布着大量随机点的脑部 MRI 扫描图。标题为“原始带噪声图像”。底部标注了以下数值：X = 127。Y = 531。R, 255。G,\
  \ 255。B, 255。\n\n图 3-44\n一张椒盐噪声图像\n\n图 3-44 展示了一张带有椒盐噪声的图像。你会注意到中值模糊在降噪方面表现相当不错。图\
  \ 3-45 展示了使用核大小为 3 的模糊图像。如图 3-46 所示，核大小为 5 时取得了良好的效果。\n\n### 双边模糊\n\n前面三种模糊技术会产生模糊图像，其副作用是丢失了图像中的边缘。为了在模糊图像的同时保留边缘，我们使用*双边模糊*，它是对高斯模糊的改进。双边模糊使用两个高斯分布来进行计算。\n\
  \n第一个高斯函数考虑空间邻域（在 x 和 y 空间上接近的像素）。第二个高斯函数考虑相邻像素的像素强度。这确保了只有那些与中心像素强度相似的像素才会被用于模糊处理，从而保持边缘完整，因为边缘的强度往往高于其他像素。\n\
  \n尽管这是一种更高级的模糊技术，但与其他技术相比，它的速度较慢。\n\n我们使用 `bilateralFilter()` 来执行这种模糊。该函数的参数如下：\n\
  \n*   需要进行模糊处理的图像。\n*   像素邻域的直径。\n*   颜色值。颜色值越大，意味着在计算模糊时会考虑更多邻域像素的颜色。\n*   空间或距离。空间值越大，意味着会考虑距离中心像素更远的像素。\n\
  \n让我们研究一下代码清单 3-15 来理解双边滤波。\n\n```\nFilename: Listing_3_15.py\n1    import cv2\n\
  \n3    # 加载一张带噪声的图像\n4    noisyImage = cv2.imread(\"images/nature.jpg\")\n5    cv2.imshow(\"\
  原始图像\", noisyImage)\n\n7    # 核大小为 5 的双边滤波\n8    fileteredImag5 = cv2.bilateralFilter(noisyImage,\
  \ 5, 150,50)\n9    cv2.imshow(\"模糊图像 5\", fileteredImag5)\n\n11   # 核大小为 7 的双边模糊\n\
  12   fileteredImag7 = cv2.bilateralFilter(noisyImage, 7, 160,60)\n13   cv2.imshow(\"\
  模糊图像 7\", fileteredImag7)\n\n15   cv2.waitKey(0)\n代码清单 3-15\n双边模糊示例\n```\n\n如代码清单\
  \ 3-15 所示，第 8 行和第 12 行用于使用 `bilateralFilter()` 对输入图像进行模糊处理。第一组参数（第 8 行）包括 NumPy\
  \ 表示的图像像素、核或直径、颜色阈值以及距中心的距离。\n\n图 3-47 至 3-49 展示了代码清单 3-15 的输出结果。\n\n![](img/493065_2_En_3_Fig49_HTML.jpg)\n\
