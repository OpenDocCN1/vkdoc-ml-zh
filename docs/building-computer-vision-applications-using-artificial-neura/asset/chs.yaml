  \ 中那样调用了 `fit()` 函数。`fit()` 函数会自动检测输入是否来自 `ImageDataGenerator` 类的生成器，该类以小批量加载图像。`fit()`\
  \ 函数接受一个名为 `steps_per_epoch` 的重要参数，它表示每个 epoch 将完成的批次数。以下是官方定义：\n\n`steps_per_epoch`：在声明一个\
  \ epoch 结束并开始下一个 epoch 之前，从 `generator`（数据加载器）中产生的总步数（样本批次）。它通常应等于数据集样本数除以批量大小。例如，如果你的训练集中有\
