  \n我们将基于图 10-4 所示的架构，在云上部署一个 TensorFlow 集群，并执行以下步骤来完成训练：\n\n1.  *创建 TensorFlow 集群。*\n\
  \    1.  *参数服务器、主节点和工作节点*：所有三大云提供商——AWS、GCP、Azure——都提供基于浏览器的 Shell 和图形用户界面 (GUI)\
  \ 来创建和管理虚拟机。我们可以根据数据大小和神经网络的复杂度，创建基于 GPU 或基于 CPU 的虚拟机。\n\n2.  *在所有虚拟机上安装 TensorFlow\
  \ 和所有必需的库*：请参阅第 1 章了解安装先决条件的说明。为了运行清单 10-3 中的代码，我们只需安装 TensorFlow。\n\n3.  *创建云存储目录（也称为存储桶）*：根据云提供商的不同，我们将创建以下之一：\n\
  \    *   AWS S3 存储桶\n    *   Google Cloud Storage (GCS) 存储桶\n    *   Azure 容器\n\n\
  4.  *上传 Python 代码并在每台机器上执行训练*：使用 Cloud Shell 或任何其他 SSH 客户端，登录到每个节点并执行以下操作：\n   \
  \ 1.  将包含依赖项和模型训练代码（来自清单 10-3）的 Python 包上传到每个节点。通过 `scp` 或任何其他文件传输协议上传代码。由于我们的代码已提交到\
  \ GitHub，我们可以克隆仓库并在所有节点上下载代码。\n\n        在每台机器上，克隆 GitHub 仓库，如清单 10-4 所示。\n\n  \
  \      ```\n        git clone https://github.com/ansarisam/dist-tf-modeling.git\n\
  \        清单 10-4\n        克隆 GitHub 仓库\n        ```\n\n    2.  在每台机器上设置特定于机器角色的\
  \ `TF_CONFIG` 环境变量，并执行用于分布式训练的 Python 代码，如清单 10-5 所示。\n\n```\nexport TF_CONFIG=$CONFIG;python\
  \ distributed_training_ps.py --input_path gs://cv_training_data --output_path gs://cv_distributed_model/output\n\
  清单 10-5\n执行分布式训练\n```\n\n在每个节点上手动执行清单 10-5 中的命令效率不高，尤其是在工作节点数量众多的情况下。我们可以编写脚本来自动化在大型集群上启动分布式训练。清单\
  \ 10-4 中显示的 GitHub 仓库包含一个可用于自动化的 Python 脚本。为了理解其工作原理，我们将遵循手动步骤，逐一在每个虚拟机上启动训练。\n\n\
  ## 在 Google Cloud 上进行分布式训练\n\nGoogle Cloud Platform (GCP) 是一套云计算服务，运行在 Google 内部用于其终端用户产品（如\
  \ Google 搜索和 YouTube）的同一基础设施上。\n\n我们将使用两项 GCP 服务来运行分布式训练。这两项服务是：用于保存检查点和训练模型的 Google\
  \ Cloud Storage (GCS)，以及用于虚拟机的 Compute Engine。\n\n让我们开始吧！\n\n### 注册 GCP 访问权限\n\n\
  如果您已有 GCP 账户，请跳过本节。如果没有，请在 [`https://cloud.google.com`](https://cloud.google.com)\
  \ 创建一个 GCP 账户。Google 为教育和学习提供 300 美元的赠金。我们将在本节练习中使用这个免费账户。对于商业和生产部署，您必须启用结算功能。\n\
  \n创建账户后，登录 Google Cloud Console，网址为 [`https://console.cloud.google.com`](https://console.cloud.google.com)。成功登录后，您将进入\
  \ GCP 控制台首页，如图 10-5 所示。\n\n![](img/493065_2_En_10_Fig5_HTML.jpg)\n\nGoogle Cloud\
  \ Platform 计算机视觉页面的截图，选中了控制台首页选项，显示了项目信息、资源、Compute Engine 图表、Google Cloud Platform\
  \ 状态、结算和错误报告等详细信息。\n\n图 10-5\n\nGoogle Cloud Platform 控制台首页\n\n### 创建 Google Cloud\
