  Ran 24 tests in 37.431s\nOK (skipped=1)\n```\n\n\n\n#### 下载 Oxford-IIIT 宠物数据集\n\n\
  让我们在笔记本中再插入一个代码单元。我们将从官方网站下载带注释和标签的宠物数据集，并将其保存到 Colab 工作区的一个目录中。清单 6-4 包含了下载宠物数据集及其注释的代码。\n\
  \n```\nFileName: Listing_6_4\n1    %%shell\n2    mkdir -p computer_vision/petdata\n\
  3    cd computer_vision/petdata\n4    wget http://www.robots.ox.ac.uk/~vgg/data/pets/data/images.tar.gz\n\
  5    wget http://www.robots.ox.ac.uk/~vgg/data/pets/data/annotations.tar.gz\n6 \
  \   tar -xvf annotations.tar.gz\n7    tar -xvf images.tar.gz\nListing 6-4\n下载并解压宠物数据集的图像和注释\n\
  ```\n\n第 1 行调用了 shell。如果我们想使用任何 shell 命令，都需要在每个代码块中执行此操作。\n\n第 2 行在 `computer_vision`\
  \ 目录下创建了一个新的子目录 `petdata`。\n\n第 3 行切换到 `petdata` 子目录。我们将在 `petdata` 目录中下载宠物数据集。\n\
  \n第 4 行下载宠物图像，第 5 行下载注释。\n\n第 6 行和第 7 行解压下载的图像和注释文件。\n\n当你执行此代码块时，你会看到图像和注释被下载到\
  \ `petdata` 目录中。图像将存储在 `images` 子目录中，注释将存储在 `petdata` 目录下的 `annotations` 子目录中。\n\
  \n#### 生成 TensorFlow TFRecord 文件\n\nTFRecord 是一种用于存储二进制记录序列的简单格式。TFRecord 中的数据经过序列化并以较小的块（例如\
  \ 100MB 到 200MB）存储，这使得它在网络传输和串行读取时更加高效。你将在第 9 章中了解更多关于 TFRecord、其格式以及如何将图像和相关注释转换为\
  \ TFRecord 文件格式的内容。现在，我们将使用从 GitHub 下载的 TensorFlow 源代码中 `research` 目录下提供的一个 Python\
  \ 脚本。该脚本位于路径 `research/object_detection/dataset_tools/create_pet_tf_record.py`。\n\
  \n目标检测算法将 TFRecord 文件作为神经网络的输入。TensorFlow 提供了一个 Python 脚本，用于将 Oxford 宠物图像注释文件转换为一组\
  \ TFRecord 文件。清单 6-5 完成了训练集和测试集到 TFRecord 的转换。\n\n```\nFileName: Listing_6_5\n1\
  \    %%shell\n2    mkdir -p /content/computer_vision/petdata/tfrecords\n3    cd\
  \ /content/models/research\n4    python object_detection/dataset_tools/create_pet_tf_record.py\
  \ \\\n5    --label_map_path=object_detection/data/pet_label_map.pbtxt \\\n6    --data_dir=/content/computer_vision/petdata\
  \ \\\n7    --output_dir=/content/computer_vision/petdata/tfrecords\nListing 6-5\n\
  将图像注释文件转换为 TFRecord 文件\n```\n\n第 1 行调用了魔法 shell。\n\n第 2 行在 `petdata` 目录下创建了一个新的子目录\
  \ `tfrecords`。\n\n第 3 行将工作目录更改为 `research` 目录。\n\n第 4 行到第 7 行运行 Python 脚本 `create_pet_tf_record.py`，该脚本接受以下参数：\n\
  \n*   `label_map_path`：此文件包含 ID（从 1 开始）与对应类名的映射。对于宠物数据集，映射文件位于 `object_detection/data/pet_label_map.pbtxt`\
  \ 文件中。我们将在第 9 章中探讨如何生成此映射文件。但现在，我们直接使用已有的文件。这是一个 JSON 格式的文件，包含两个键：`id` 和 `name`。以下是映射文件的一些示例条目：\n\
  \n    ```\n    item {\n    id: 1\n    name: 'Abyssinian'\n    }\n    item {\n  \
  \  id: 2\n    name: 'american_bulldog'\n    }\n    ...\n    ```\n\n*   `data_dir`：这是\
  \ `images` 和 `annotations` 子目录的父目录。\n\n*   `output_dir`：这是存储 TFRecord 文件的目标目录。你可以提供任何现有的目录名称。图像和注释转换完成后，TFRecord\
  \ 文件将保存在此目录中。\n\n此代码块执行后，它会在 `output_directory` 中创建一组 `*.record` 文件。脚本 `create_pet_tf_record.py`\
  \ 会同时创建训练集和验证集。\n\n*   *训练集*：输出目录 `output_dir` 现在应包含十个训练文件和十个验证 TFRecord 文件。`*.record`\
  \ 文件的数量可能因输入大小而异。训练集的 `*.record` 文件命名为 `pet_faces_train.record-?????-of-00010`。正则表达式\
  \ `?????` 从 `00001` 到 `00010` 依次取值。\n\n*   *验证集*：评估数据集命名为 `pet_faces_val.record-?????-of-00010`。\n\
  \n\n\n#### 下载用于迁移学习的预训练模型\n\n计算机视觉中的*迁移学习*是一种机器学习技术，它将在大规模数据集上预训练的模型作为新任务或数据集的起点。迁移学习无需从头训练模型，而是允许我们将预训练模型学到的知识迁移到新的问题领域。\n\
  \n使用 TensorFlow 进行目标检测的迁移学习涉及利用预训练模型（例如 TensorFlow 模型库中的模型）来加速并改进目标检测任务的训练过程。TensorFlow\
  \ 提供了多个预训练的目标检测模型，例如单次多框检测器（SSD）和 Faster R-CNN，这些模型在 COCO（Common Objects in Context）或\
  \ Open Images 等大规模数据集上进行了训练。\n\n基于 COCO 2017 数据集预训练的 SSD 系列模型集合可在 [`https://github.com/tensorflow/models/blob/master/research/object_detection/g3doc/tf2_detection_zoo.md`](https://github.com/tensorflow/models/blob/master/research/object_detection/g3doc/tf2_detection_zoo.md)\
  \ 获取。表 6-3 总结了模型库网站上提供的各种预训练目标检测模型。\n\n表 6-3\n\n预训练目标检测模型及其性能指标\n\n| 模型名称 | 速度（毫秒）\
