  \n图 9-4 展示了针对不同缺陷类别的预测输出样本。\n\n### 实时缺陷检测器\n\n按照第 7 章提供的说明，部署一个能够从摄像头读取视频图像并实时检测表面缺陷的检测系统。如果你的同一设备连接了多个摄像头，请在函数\
  \ `cv2.VideoCapture(x)` 中为参数 `x` 使用适当的值。默认情况下，`x=0` 从计算机的内置摄像头读取视频。`x=1`、`x=2` 等值将读取连接到计算机端口的视频。对于基于\
  \ IP 的摄像头，`x` 的值应为 IP 地址。\n\n## 图像标注\n\n在之前的所有示例中，我们使用的都是已经过注释和标注的图像。在本节中，我们将探讨如何为物体检测或人脸识别标注图像。\n\
  \n有几种开源和商业工具可用于图像标注。我们将探讨微软视觉对象标记工具 (VoTT)，这是一个用于图像和视频资产的开源注释和标注工具。VoTT 的源代码可在 [`https://github.com/microsoft/VoTT`](https://github.com/microsoft/VoTT)\
  \ 获取。\n\n### 安装 VoTT\n\nVoTT 需要 NodeJS 和 NPM。\n\n要安装 NodeJS，请从官方网站 [`https://nodejs.org/en/download/`](https://nodejs.org/en/download/)\
  \ 下载适用于你操作系统的可执行二进制文件。例如，下载并安装 Windows 安装程序 (`.msi`) 以在 Windows 操作系统上安装 NodeJS，下载并安装\
  \ macOS 安装程序 (`.pkg`) 以在 Mac 上安装，或选择适用于 Linux 的 Linux 二进制文件 (x64)。\n\nNPM 随 NodeJS\
  \ 一起安装。要检查你的计算机上是否已安装 NodeJS 和 NPM，请在终端窗口中执行以下命令：\n\n```\nnode -v\nnpm -v\n```\n\
  \n适用于不同操作系统的 VoTT 安装程序托管在 GitHub ([`https://github.com/Microsoft/VoTT/releases`](https://github.com/Microsoft/VoTT/releases))\
  \ 上。下载适用于你操作系统的安装程序。在撰写本书时，最新的 VoTT 是 2.1.1 版本，可以从以下位置下载：\n\n*   Windows：[`https://github.com/microsoft/VoTT/releases/download/v2.1.0/vott-2.1.0-win32.exe`](https://github.com/microsoft/VoTT/releases/download/v2.1.0/vott-2.1.0-win32.exe)\n\
  \n*   Mac：[`https://github.com/microsoft/VoTT/releases/download/v2.1.0/vott-2.1.0-darwin.dmg`](https://github.com/microsoft/VoTT/releases/download/v2.1.0/vott-2.1.0-darwin.dmg)\n\
  \n*   Linux：[`https://github.com/microsoft/VoTT/releases/download/v2.1.0/vott-2.1.0-linux.snap`](https://github.com/microsoft/VoTT/releases/download/v2.1.0/vott-2.1.0-linux.snap)\n\
  \n通过运行下载的可执行文件在你的计算机上安装 VoTT。\n\n要从源代码运行 VoTT，请在终端上执行以下命令：\n\n```\ngit clone https://github.com/Microsoft/VoTT.git\n\
  cd VoTT\nnpm ci\nnpm start\n```\n\n使用 `npm start` 命令运行 VoTT 将同时启动 electron 版本和浏览器版本。这两个版本的主要区别在于浏览器版本无法访问本地文件系统，而\
  \ electron 版本可以。由于我们的图像位于本地文件系统上，因此我们将探讨 VoTT 的 electron 版本。\n\n当你启动 VoTT 用户界面时，你将看到主屏幕，你可以在其中创建新项目、打开本地项目或打开云项目。\n\
  \n要标注图像，我们将按照后续章节中的步骤进行操作。\n\n### 创建连接\n\n我们将创建两个连接：一个用于输入，另一个用于输出。输入连接指向存储未标注图像的目录。输出连接指向存储注释的目录。\n\
