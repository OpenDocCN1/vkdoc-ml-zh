  \ Colab 会话终止后不会被删除。\n\n## 训练 YOLOv7 模型\n\n如图 6-37 所示，`yolov7` 目录（包含克隆的源代码）包含 `cfg`\
  \ 和 `data` 子目录。`cfg` 目录中的 `training` 子目录包含一些示例 `.yaml` 文件。这些 `.yaml` 文件包含 YOLOv7\
