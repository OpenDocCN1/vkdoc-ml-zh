  \n图 9-7\n\n创建类别标签\n\n\n\n### 标注图像\n\n从左侧面板中选择一个图像缩略图，该图像将在主标注区域中打开。在图像的缺陷区域周围绘制矩形或多边形，并选择相应的标签进行标注。参见图\
