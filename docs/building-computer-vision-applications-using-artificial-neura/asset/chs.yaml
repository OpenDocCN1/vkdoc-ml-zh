  5    --classfier_model ~/presidents_aligned/face_classifier.pkl\n代码清单 8-11\n调用实时人脸识别\
  \ API 的脚本\n```\n\n在代码清单 8-11 中，第 1 行调用了 `real_time_face_recognition.py` 并传递了以下参数：\n\
  \n*   第 2 行设置了参数 `--source` 的值，此处为 `youtube`。如果跳过此参数，它将默认为计算机的内置摄像头。你可以显式传递参数 `webcam`\
  \ 来从内置摄像头读取帧。\n*   第 3 行用于传递 YouTube 视频 URL。当视频源为摄像头时，不需要此参数。\n*   第 4 行提供了预训练 FaceNet\
  \ 模型的路径。你可以提供检查点目录或冻结的 `*.pb` 模型的路径。\n*   第 5 行提供了我们在上一节中训练的分类器模型的文件路径，例如用于识别三位美国总统面部的分类器模型。\n\
  \n当你执行代码清单 8-11 时，它将读取 YouTube 视频帧，并用边界框显示识别出的人脸。图 8-8 展示了一个识别示例。\n\n![](img/493065_2_En_8_Fig8_HTML.jpg)\n\
  \n两张美国总统照片的截图。它们分别是来自 news dot com 的唐纳德·特朗普和奥巴马坐在一起的照片，以及来自《华尔街日报》的乔治·W·布什的照片。面部被高亮显示，帧率分别显示在顶部为\
  \ 9 和 10 fps。\n\n图 8-8\n\n从视频中截取的样本截图，其中人脸已被识别（视频输入源为 YouTube）\n\n## 总结\n\n人脸检测是一个有趣的计算机视觉问题，涉及检测和分类面部嵌入，以识别图像中的人物身份。在本章中，我们探讨了\
  \ FaceNet，这是一种基于 ResNet 的流行人脸识别算法。我们分析了使用 MTCNN 算法裁剪图像中面部区域的技术。我们还训练了自己的分类器，并通过一个示例对三位美国总统的面部进行了分类。最后，我们引入了来自\
  \ YouTube 的视频流，并实现了一个实时人脸识别系统。\n\n"
- "# 9. 工业应用：工业制造中的实时缺陷检测\n\n计算机视觉在工业制造中有众多应用，其中之一是在自动化视觉检测中发挥作用，以确保质量控制与保证，这正是本章的重点。\n\
  \n大多数制造公司会培训员工进行人工视觉检测。这种方法不仅涉及一个主观的评估过程，其准确性可能因检验员的经验和判断而异，而且劳动强度大。\n\n当出现机器校准问题、不利环境条件或设备故障等问题时，如果未能立即检测到，它们可能导致整个生产批次出现缺陷。人工检测更可能导致延迟检测，这可能导致整个批次（可能成百上千件）被丢弃，造成巨大的潜在费用（除了更换成本之外）。至少，该批次将受到怀疑，需要人工后期生产检测，并产生相关成本。\n\
  \n总之，人工检测过程既缓慢又不精确，导致高成本。相比之下，基于计算机视觉的视觉检测系统能够通过分析连续的视频帧流，立即识别表面缺陷。该系统在检测到任何缺陷或一系列缺陷时，可以及时发出实时警报，从而允许立即停止生产以防止潜在损失。\n\
  \n在本章中，我们将开发一个基于深度学习的计算机视觉系统，用于检测表面缺陷，例如斑块、划痕、麻点和裂纹。我们将使用一个包含热轧钢带标注图像的数据集。我们将首先转换数据集，训练一个\
  \ SSD 模型，并利用该模型构建一个缺陷检测器。我们还将介绍如何为任何目标检测任务标注自己的图像。\n\n## 实时表面缺陷检测系统\n\n在本节中，我们将首先检查用于训练和测试表面缺陷检测模型的数据集。我们将把图像和标注转换为\
  \ TFRecord 文件，并在 Google Colab 上训练一个 SSD 模型。我们将应用第 6 章中介绍的目标检测概念。\n\n\n\n### 数据集\n\
  \n我们将使用由东北大学（NEU）的 K. Song 和 Y. Yan 提供的数据集。该数据集包含热轧钢带表面的六种缺陷类型。这些缺陷的标签如下：\n\n* \
  \  **轧制氧化皮 (RS)**，通常发生在轧制过程中，轧制氧化皮被压入金属内部时。\n*   **斑块 (Pa)**，可能是不规则的表面斑块。\n*   **网状裂纹\
  \ (Cr)**，是表面上的裂纹网络。\n*   **麻点 (PS)**，由许多细小的浅坑组成。\n*   **夹杂物 (In)**，是嵌入钢材内部的化合物。\n\
  *   **划痕 (Sc)**\n\n图 9-1 展示了带有这六种缺陷的钢表面标注图像。\n\n![](img/493065_2_En_9_Fig1_HTML.jpg)\n\
  \n从 a 到 f 的六张显微照片描绘了热轧钢带表面的不同类型缺陷，例如网状裂纹、夹杂物、斑块、麻点、轧制氧化皮和划痕，这些缺陷都用边界框进行了标记和标注。\n\
  \n图 9-1\n\n具有六种不同类型缺陷的表面标注图像样本（来源：[`​faculty.​neu.​edu.​cn/​yunhyan/​NEU_​surface_​defect_​database.​html`](http://faculty.neu.edu.cn/yunhyan/NEU_surface_defect_database.html)）\n\
  \n该数据集包含 1,800 张灰度图像，每个缺陷类别有 300 个样本。\n\n该数据集可免费下载，用于教育和研究目的，下载地址为：[`https://drive.google.com/file/d/1qrdZlaDi272eA79b0uCwwqPrm2Q_WI3k/view`](https://drive.google.com/file/d/1qrdZlaDi272eA79b0uCwwqPrm2Q_WI3k/view)。请从此链接下载数据集并解压缩。解压后的数据集按图\
  \ 9-2 所示的目录结构组织。图像位于子目录 `IMAGES` 中。`ANNOTATIONS` 子目录包含以 PASCAL VOC 注释格式存储的边界框和缺陷类别的\
  \ XML 注释文件。\n\n![](img/493065_2_En_9_Fig2_HTML.jpg)\n\n屏幕截图显示了 N E U-D E T 数据集的结构，该数据集由图像和注释文件夹组成。这些文件夹包含\
  \ j p g 格式的图像和 x m l 格式的注释。\n\n图 9-2\n\nNEU-DET 数据集目录结构\n\n### Google Colab 笔记本\n\
  \n首先，在 Google Colab 上创建一个新笔记本，并为其命名，例如 Surface Defect Detection v1.0。\n\n由于 NEU\
