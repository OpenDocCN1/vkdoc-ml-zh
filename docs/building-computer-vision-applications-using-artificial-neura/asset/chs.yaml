  \ 相关库的命令\n```\n\n我们为此练习克隆的 FaceNet 仓库在 `contributed` 模块中提供了源代码 `real_time_face_recognition.py`，用于识别视频中的人脸。代码清单\
  \ 8-11 展示了如何使用 Python API 从视频中检测和识别人脸。\n\n```\n1    python real_time_face_recognition.py\
  \ \\\n2    --source youtube \\\n3    --url https://www.youtube.com/watch?v=ZYkxVbYxy-c\
