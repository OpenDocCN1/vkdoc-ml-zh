  \n## 总结\n\n在本节中，我们创建了一个专门用于识别表面缺陷的系统。我们使用一个包含热轧带钢标注图像的现有数据集（涵盖六种不同的缺陷类别）训练了一个 SSD\
  \ 模型。然后，我们使用这个训练好的模型来预测图像和视频中发现的表面缺陷。此外，我们还深入探讨了如何使用名为 VoTT 的图像标注工具，该工具有助于标注图像，并随后将标签导出为\
  \ TFRecord 格式。\n\n# 10. 云端计算机视觉建模\n\n训练最先进的卷积神经网络可能需要大量的计算资源。根据训练样本数量、网络配置和可用硬件资源的不同，训练一个计算机视觉模型可能需要数小时甚至数天。单个\
  \ GPU 可能无法胜任训练包含大量训练图像的复杂网络。模型需要在多个 GPU 上进行训练。一台机器上只能安装有限数量的 GPU。对于大量图像的训练，一台配备多个\
  \ GPU 的机器可能也不够用。如果在多台机器（每台机器配备多个 GPU）上进行训练，速度会更快。\n\n很难预估在特定时间范围内训练一个模型需要多少 GPU\
  \ 和机器。在大多数实际情况下，事先并不知道建模需要多少台机器，以及训练会运行多长时间。此外，建模工作并非频繁进行。一个预测准确度很高的模型可能不需要在几天、几周、几个月内重新训练，甚至只要它能给出准确结果，就无需重新训练。因此，为建模采购的任何硬件在模型重新训练之前可能一直处于闲置状态。\n\
  \n在云端建模是一种将训练扩展到多台机器和多个 GPU 的好方法。大多数云提供商都提供按需付费模式的虚拟机、计算资源和存储。这意味着你只需为模型学习期间所使用的云资源付费。模型成功训练后，你可以将其导出到应用服务器，并在那里用于预测。此时，你可以删除所有不再需要的云资源，从而降低成本。\n\
  \nTensorFlow 提供了用于在单台或多台机器上的多个 CPU 和 GPU 上训练机器学习模型的 API。\n\n在本章中，我们将探索分布式建模，并在云端大规模训练计算机视觉模型。\n\
  \n本章的学习目标如下：\n\n*   探索用于分布式训练的 TensorFlow API\n\n*   在三大主流云提供商（Amazon Web Services\
  \ (AWS)、Google Cloud Platform (GCP) 和 Microsoft Azure）上，设置涉及多台虚拟机和多个 GPU 的分布式 TensorFlow\
  \ 集群\n\n*   在云端的分布式集群上训练计算机视觉模型\n\n## TensorFlow 分布式训练\n\n本节讨论 TensorFlow 提供的分布式训练的核心概念。\n\
  \n### 什么是分布式训练？\n\n用于计算机视觉的最先进神经网络需要从大量图像中计算数百万个参数。如果所有计算都在单个 CPU 或 GPU 上执行，训练将非常耗时。此外，整个训练数据集需要加载到内存中，这可能超出单台机器的内存容量。\n\
  \n在分布式训练中，计算在多个 CPU 或 GPU 上同时执行，然后将结果合并以创建最终模型。理想情况下，计算量应随 GPU 或 CPU 的数量线性扩展。换句话说，如果在一个\
  \ GPU 上训练一个模型需要 *H* 小时，那么在 *N* 个 GPU 上训练该模型应该只需要 *H/N* 小时。\n\n在分布式训练中，有两种常用的方法来实现并行化：数据并行和模型并行。TensorFlow\
  \ 提供了通过将模型拆分到多个设备（CPU、GPU 或计算机）上来进行分布式训练的 API。\n\n\n\n#### 数据并行\n\n大型训练数据集可被划分为更小的迷你批次，随后可将其分发到集群架构中的多台计算机上。随机梯度下降（SGD）能够独立且并行地在处理小批量数据的单台计算机上计算权重。各台计算机的计算结果可汇总到一台中央计算机，从而获得最终优化后的权重。\n\
  \nSGD 还可以通过利用单台计算机上的多个 CPU 或 GPU 进行并行处理来优化权重。使用 SGD 算法计算优化权重的分布式和并行操作有助于其更快收敛。\n\
  \n图 10-1 展示了数据并行的示意图。\n\n![](img/493065_2_En_10_Fig1_HTML.png)\n\n一个树状图，展示了使用 GPU\
  \ 0 到 GPU 127，每个 GPU 处理来自包含大量图像的数据集中的 64 张图像。下方计算如下：批次大小等于 64 乘以 128，即 8192 张图像。\n\
  \n图 10-1\n数据并行与批次大小计算\n\n数据并行可以通过以下两种方式实现：\n\n![](img/493065_2_En_10_Fig2_HTML.png)\n\
  \n一个流程图。GPU 0 到 GPU 127 将梯度提交给模型更新器，模型更新器更新模型并将其发送回 GPU，GPU 获取新模型并使用新批次进行计算。\n\n\
  图 10-2\n同步数据并行\n\n*   **同步**：在此情况下，所有节点在不同的输入数据块上进行训练，并在每一步聚合梯度。梯度的同步通过全归约方法完成，如图\
  \ 10-2 所示。\n\n![](img/493065_2_En_10_Fig3_HTML.png)\n\n一个流程图。GPU 0 到 GPU 127 模块将梯度提交给参数服务器，参数服务器更新模型并将其发送回\
  \ GPU 的数据，GPU 立即下载新模型并为下一个批次进行计算。\n\n图 10-3\n使用参数服务器的异步数据并行\n\n*   **异步**：在此情况下，所有节点独立地在输入数据上进行训练，并通过一个名为*参数服务器*的专用服务器异步更新变量，如图\
  \ 10-3 所示。\n\n#### 模型并行\n\n深度神经网络（如 Darknet）需要计算数十亿个参数。即使批次大小很小，将整个网络加载到单个 CPU 或\
  \ GPU 的内存中也是一项挑战。*模型并行*是一种将模型拆分为不同部分的方法，每个部分在物理计算机硬件的不同 CPU、GPU 或节点上对同一组数据执行操作。相同的数据批次被复制到集群中的所有节点，但节点获取模型的不同部分。这些模型部分在不同的节点上并发地对其输入数据集进行操作。\n\
  \n当模型的各部分并行运行时，它们共享的参数需要同步。这种并行方法在单台机器上拥有多个 CPU 或 GPU 时效果最佳，因为这些设备通过高速总线连接。\n\n\
  现在，我们将探讨 TensorFlow 如何将训练分布到多个 GPU 或机器上。\n\n### TensorFlow 分布策略\n\nTensorFlow 提供了一个高级\
  \ API，用于将训练分布到多个 GPU 或多个节点。该 API 通过 `tf.distribute.Strategy` 类暴露。只需添加几行代码并进行少量代码修改，我们就可以分布我们在之前所有示例中探索过的神经网络。\n\
  \n我们可以将 `tf.distribute.Strategy` 与 Keras 结合使用，以分布使用 Keras API 构建的网络。我们也可以使用它来分布自定义训练循环。通常，TensorFlow\
  \ 中的任何计算都可以使用此 API 进行分布。\n\nTensorFlow 支持以下类型的分布策略。\n\n#### MirroredStrategy\n\n\
  `MirroredStrategy` 支持在一台机器的多个 GPU 上进行同步分布式训练。模型的所有变量都在所有 GPU 上进行镜像。这些变量统称为 `MirroredVariables`。训练的计算在每个\
  \ GPU 上并行执行。通过应用相同的更新，变量彼此同步。\n\n`MirroredVariables` 通过使用全归约算法在所有设备上进行更新。*全归约算法*通过将所有设备上的张量相加并使其在每个设备上可用，来聚合这些张量。图\
  \ 10-2 展示了一个全归约算法的示例。这些算法效率很高，并且同步的通信开销不大。\n\n有几种全归约算法。TensorFlow 在 `MirroredStrategy`\
  \ 中使用 NVIDIA NCCL 作为默认的全归约算法。\n\n我们将探讨如何使用 `MirroredStrategy` 来分布深度神经网络的训练。为了简单易懂，让我们修改清单\
  \ 5-2 中的代码，使其分布式化。请参考清单 5-2 的第 11、19 和 24 行。这些代码行如下所示：\n\n第 11 行，清单 5-2：`model =\
  \ tf.keras.models.Sequential([...])`\n\n第 19 行，清单 5-2：`model.compile(...)`\n\n第\
  \ 24 行，清单 5-2：`history = model.fit(...)`\n\n以下是并行化清单 5-2 训练的步骤：\n\n1.  创建一个 `MirroredStrategy`\
  \ 实例。\n2.  将模型的创建和编译（清单 5-2 的第 11 和 19 行）移动到 `MirroredStrategy` 对象的 `scope()` 方法内部。\n\
  3.  拟合模型（第 24 行，无需任何更改）。\n\n清单 5-2 的所有其他行保持不变。\n\n清单 10-1 展示了这一概念。\n\n```\n1   \
  \   strategy = tf.distribute.MirroredStrategy()\n2       with strategy.scope():\n\
  3          model = tf.keras.Sequential([...])\n4          model.compile(...)\n5\
  \      model.fit(...)\n清单 10-1\n使用 MirroredStrategy 进行同步分布式训练\n```\n\n因此，只需添加两行代码并进行少量调整，我们就可以将训练分布到单台机器的多个\
  \ GPU 上。\n\n如清单 10-1 所示，在 `MirroredStrategy` 对象的 `scope()` 方法内，我们创建了希望以分布式和并行方式运行的计算。`MirroredStrategy`\
  \ 对象负责在可用的 GPU 上复制模型的训练、聚合梯度等。\n\n输入的每个批次在副本之间平均分配。例如，如果输入批次大小为 16，并且我们使用带有两个 GPU\
  \ 的 `MirroredStrategy`，那么每个 GPU 在每一步将获得 8 个输入样本。我们应该适当调整批次大小，以有效利用 GPU 的计算能力。\n\n\
  `tf.distribute.MirroredStrategy()` 方法创建默认对象，该对象使用 TensorFlow 可见的所有可用 GPU。如果您只想使用机器上的部分\
  \ GPU，只需执行以下操作：\n\n```\nstrategy = tf.distribute.MirroredStrategy(devices=[\"/gpu:0\"\
  , \"/gpu:1\"])\n```\n\n这里有一个练习供您完成：修改清单 5-4 中所示的代码示例，并使用 `MirroredStrategy` 以分布式模式训练数字识别模型。\n\
  \n\n\n#### CentralStorageStrategy\n\n`CentralStorageStrategy` 将模型变量放置在 CPU 上，并在单台机器的所有本地\
  \ GPU 上复制计算。除了将变量放置在 CPU 上而非在 GPU 上复制之外，`CentralStorageStrategy` 与 `MirroredStrategy`\
  \ 类似。\n\n在撰写本书时，`CentralStorageStrategy` 仍处于实验阶段，未来可能会发生变化。要在 `CentralStorageStrategy`\
  \ 下进行分布式训练，只需将清单 10-1 的第 1 行替换为以下内容：\n\n```\nstrategy = tf.distribute.experimental.CentralStorageStrategy()\n\
  ```\n\n#### MultiWorkerMirroredStrategy\n\n`MultiWorkerMirroredStrategy` 与 `MirroredStrategy`\
  \ 类似。它将训练分布到多台机器上，每台机器拥有一个或多个 GPU。它会在所有机器的每个设备上复制模型中的所有变量。执行计算的这些机器被称为*工作节点*。\n\n\
  为了在所有工作节点之间保持变量同步，`MultiWorkerMirroredStrategy` 使用 `CollectiveOps` 作为全规约通信方法。*集体操作*是\
  \ TensorFlow 图中的单个操作。它可以根据硬件、网络拓扑和张量大小，在 TensorFlow 运行时自动选择全规约算法。\n\n要在 `MultiWorkerMirroredStrategy`\
  \ 下跨多个工作节点进行分布式训练，只需将清单 10-1 的第 1 行替换为以下内容：\n\n```\nstrategy = tf.distribute.experimental.MultiWorkerMirroredStrategy()\n\
  ```\n\n这将创建默认的 `MultiWorkerMirroredStrategy`，其中 `CollectiveCommunication.AUTO` 作为\
  \ `CollectiveOps` 的默认值。你可以选择以下两种 `CollectiveOps` 实现之一：\n\n*   `CollectiveCommunication.RING`\
  \ 使用 gRPC 作为通信层实现基于环的集体通信。gRPC 是 Google 开发的远程过程调用的开源实现。要使用此实现，请按如下方式调用之前的实例化：\n\n\
  \    ```\n    strategy = tf.distribute.experimental.MultiWorkerMirroredStrategy(tf.distribute.experimental.CollectiveCommunication.RING)\n\
  \    ```\n\n*   `CollectiveCommunication.NCCL` 使用 NVIDIA NCCL 实现集体通信。以下是使用示例：\n\n\
  \    ```\n    strategy = tf.distribute.experimental.MultiWorkerMirroredStrategy(tf.distribute.experimental.CollectiveCommunication.NCCL)\n\
  \    ```\n\n##### 集群配置\n\nTensorFlow 使得跨多个工作节点进行分布式训练变得简单。但它如何知道集群配置呢？在运行使用 `MultiWorkerMirroredStrategy`\
  \ 进行分布式训练的代码之前，我们必须设置所有将参与模型训练的工作节点上的 `TF_CONFIG` 环境变量。`TF_CONFIG` 将在本节后面介绍。\n\n\
  ##### 数据集分片\n\n数据如何提供给工作节点？当我们使用 `model.fit(x=train_datasets, epochs=3, steps_per_epoch=5)`\
  \ 时，我们将训练集直接传递给 `fit()` 函数。在多工作节点训练中，数据集由 TensorFlow 自动分片。\n\n##### 容错性\n\n如果任何一个工作节点发生故障，整个集群将失败。TensorFlow\
  \ 中没有内置的故障恢复机制。然而，`tf.distribute.Strategy` 与 Keras 结合使用，通过保存训练检查点提供了一种容错机制。如果任何工作节点发生故障，所有其他工作节点将等待故障工作节点重启。由于检查点已保存，一旦故障工作节点恢复，训练将从停止的地方重新开始。\n\
  \n要使分布式集群具有容错性，你必须保存训练检查点（回顾第 5 章，了解如何使用回调保存检查点）。\n\n#### TPUStrategy\n\n*张量处理单元\
  \ (TPU)* 是 Google 设计的专用集成电路 (ASIC)，用于显著加速机器学习工作负载。TPU 可在 Cloud TPU 和 Google Colab\
  \ 上使用。\n\n在实现方面，`TPUStrategy` 与 `MirroredStrategy` 相同，只是模型变量被镜像到 TPU 上。清单 10-2 展示了如何实例化\
  \ `TPUStrategy`。\n\n```\n1    cluster_resolver = tf.distribute.cluster_resolver.TPUClusterResolver(\n\
  tpu=tpu_address)\n2    tf.config.experimental_connect_to_cluster(cluster_resolver)\n\
  3    tf.tpu.experimental.initialize_tpu_system(cluster_resolver)\n4    tpu_strategy\
  \ = tf.distribute.experimental.TPUStrategy(cluster_resolver)\n清单 10-2\nTPUStrategy\
  \ 的实例化\n```\n\n在第 1 行中，通过将 TPU 地址传递给参数 `tpu=tpu_address` 来指定它。\n\n#### ParameterServerStrategy\n\
  \n在 `ParameterServerStrategy` 中，模型变量被放置在一台专用机器上，称为*参数服务器*。在这种情况下，一些机器被指定为工作节点，另一些被指定为参数服务器。计算在所有工作节点的所有\
  \ GPU 上复制，而变量则在参数服务器中更新。\n\n`ParameterServerStrategy` 的实现与 `MultiWorkerMirroredStrategy`\
  \ 相同。我们必须设置每台参与机器上的 `TF_CONFIG` 环境变量。`TF_CONFIG` 将在接下来解释。\n\n要在 `ParameterServerStrategy`\
  \ 下进行分布式训练，只需将清单 10-1 的第 1 行替换为以下内容：\n\n```\nstrategy = tf.distribute.experimental.ParameterServerStrategy()\n\
  ```\n\n#### OneDeviceStrategy\n\n有时，我们希望在将分布式代码迁移到涉及多个设备的完全分布式系统之前，先在单个设备（GPU）上进行测试。`OneDeviceStrategy`\
  \ 就是为此目的而设计的。当我们使用此策略时，模型变量被放置在指定的设备上。\n\n要使用此策略，只需将清单 10-1 的第 1 行替换为以下内容：\n\n```\n\
  strategy = tf.distribute.OneDeviceStrategy(device=\"/gpu:0\")\n```\n\n此策略仅用于测试代码。在完全分布式环境中训练模型之前，请切换到其他策略。\n\
  \n需要注意的是，除了 `MirroredStrategy` 之外，上述所有用于分布式训练的策略目前都处于实验阶段。\n\n\n\n### TF_CONFIG：TensorFlow\
  \ 集群配置\n\n用于分布式训练的 TensorFlow 集群由一台或多台机器组成，这些机器被称为*工作节点*。模型训练的计算在每个工作节点中执行。有一个专门的工作节点，称为*主节点*或*首席工作节点*，除了作为普通工作节点外，它还承担额外的职责。首席工作节点的额外职责包括保存检查点以及为\
  \ TensorBoard 写入摘要文件。\n\nTensorFlow 集群还可能包含用于参数服务器的专用机器。在使用 `ParameterServerStrategy`\
  \ 时，参数服务器是必需的。\n\nTensorFlow 集群配置由 `TF_CONFIG` 环境变量指定。我们必须在集群中的所有机器上设置此环境变量。\n\n\
  `TF_CONFIG` 的格式是一个 JSON 文件，包含两个部分：`cluster` 和 `task`。\n\n`cluster` 部分提供参与模型训练的工作节点和参数服务器的信息。这是一个字典列表，包含工作节点的主机名和通信端口（例如，`localhost:1234`）。\n\
  \n`task` 部分指定当前任务的工作节点角色。通常，将工作节点列表中索引为 0 的第一个工作节点指定为主节点或首席工作节点。\n\n表 10-1 描述了 `TF_CONFIG`\
  \ 的键值对。\n\n表 10-1\n\n`TF_CONFIG` 格式说明\n\n| 键 | 描述 | 示例 |\n| --- | --- | --- |\n\
  | `cluster` | 一个字典，包含键 `worker`、`chief` 和 `ps`。每个键都是一个列表，包含所有参与训练的机器的主机名:端口。 | `cluster:\
  \ {``worker:[\"host1:12345\",\"host2:2345\"]``}` |\n| `task` | 指定特定机器将要执行的任务。它包含以下键：`type`：指定工作节点类型，取值为字符串\
  \ `worker`、`chief` 或 `ps`。`index`：任务的从零开始的索引。大多数分布式训练任务有一个主任务、一个或多个参数服务器以及一个或多个工作节点。`trial`：在执行超参数调优时使用。此值设置训练的试验次数。这有助于识别当前正在运行的是哪次试验。它接受一个包含试验编号的字符串值，从\
  \ 1 开始。 | `task: { type: chief, index:0}`这表示 `host1:1234` 是首席节点。 |\n| `job` | 启动任务时使用的任务参数。这是可选的，在大多数情况下可以忽略。\
  \ |   |\n\n#### TF_CONFIG 示例\n\n假设我们有一个由三台机器组成的集群，用于分布式训练。这些机器的主机名分别是 `host1.local`、`host2.local`\
  \ 和 `host3.local`。假设它们都通过端口 8900 进行通信。\n\n此外，假设每台机器的角色如下：\n\n```\nworker: host1.local\
  \ (首席工作节点)\nworker: host2.local (普通工作节点)\nps: host3.local (参数服务器)\n```\n\n需要在所有三台机器上设置的\
  \ `TF_CONFIG` 环境变量如表 10-2 所示。\n\n表 10-2\n\n在具有两个工作节点和一个参数服务器的三节点集群中，`TF_CONFIG`\
  \ 环境变量示例\n\n| 主节点 | 工作节点 | 参数服务器 |\n| --- | --- | --- |\n| `'cluster': {``'worker':\
  \ [\"host1.local:8900\", \"host2.local:8900\"], \"ps\":[\"host3.local:8900\"]``},``'task':\
  \ {'type': worker, 'index': 0}``}` | `'cluster': {``'worker': [\"host1.local:8900\"\
  , \"host2.local:8900\"], \"ps\":[\"host3.local:8900\"]``},``'task': {'type': worker,\
  \ 'index': 1}``}` | `'cluster': {``'worker': [\"host1.local:8900\", \"host2.local:8900\"\
  ], \"ps\":[\"host3.local:8900\"]``},``'task': {'type': ps, 'index': 0}``}` |\n\n\
