  ## 总结


  本章从计算机视觉模型分布式训练的简介开始。我们探讨了 TensorFlow 支持的各种分布式策略，并分析了如何为分布式训练编写代码。


  我们在 GCP、Azure 和 AWS 云基础设施上基于 MNIST 数据集训练了我们的手写识别模型。我们探讨了在三个云平台（GCP、AWS 和 Azure）上训练模型的三种不同技术。我们的示例训练基于
  TensorFlow 支持的分布式策略：`ParameterServerStrategy` 和 `MirroredStrategy`。您还学习了如何使用 Horovod
  进行计算机视觉模型的大规模训练。




