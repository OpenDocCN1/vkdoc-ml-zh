- "# 1.  **前提条件与软件安装**\n\n本书是一本实用指南，探讨了使用 Python 编程语言构建计算机视觉应用的过程。通过本书，你将全面了解如何利用\
  \ OpenCV 进行图像处理，以及如何利用 TensorFlow 构建机器学习模型。\n\nOpenCV 最初由英特尔开发，使用 C++编写，是一个开源的计算机视觉和机器学习库，包含超过\
  \ 2500 个用于处理图像和视频的优化算法。TensorFlow 是一个用于高性能数值计算和大规模机器学习的开源框架。它使用 C++编写，并原生支持 CPU\
  \ 和 GPU。Python 是开发机器学习应用最广泛使用的编程语言。TensorFlow 和 OpenCV 都提供了 Python 接口来访问其底层功能。虽然\
  \ TensorFlow 和 OpenCV 也为 Java、C++和 MATLAB 等其他编程语言提供了接口，但本书将重点介绍 Python 的使用。Python\
  \ 庞大的社区支持和直观的语法使其成为学习者和从业者都能轻松掌握的语言。\n\n本书的前提条件是具备 Python 的实践知识，并熟悉 NumPy 和 pandas。本书假设你熟悉\
  \ Python 中的内置数据容器，例如字典、列表、集合和元组。如果你需要复习这些前提知识，以下资源可能会有所帮助：\n\n*   Python: [`https://www.w3schools.com/python/`](https://www.w3schools.com/python/)\n\
  \n*   pandas: [`https://pandas.pydata.org/docs/getting_started/index.html`](https://pandas.pydata.org/docs/getting_started/index.html)\n\
  \n*   NumPy: [`https://numpy.org/devdocs/user/quickstart.html`](https://numpy.org/devdocs/user/quickstart.html)\n\
  \n首要任务是为你准备本书中所有练习所需的工作环境。你将首先下载并安装必要的软件库和包。\n\n## Python 和 PIP\n\n如前所述，Python 是本书中使用的主要编程语言。对于\
  \ Python 包的安装和管理，我们将依赖 PIP，它是 Python 生态系统中广泛接受的包安装器和标准工具。\n\n要设置你的工作环境，你首先需要在你的计算机上安装\
  \ Python 和 PIP。安装步骤取决于你使用的操作系统（OS）。以下各节按顺序提供了 Ubuntu、macOS、Red Hat Enterprise Linux\
  \ 和 Windows 的安装步骤。请确保按照你的操作系统说明进行操作。如果你已经安装了 Python 和 PIP，请确保你使用的是 Python 3.8 或更高版本以及\
  \ PIP 19 或更高版本。要检查 Python 的版本号，请在终端上执行以下命令：\n\n```\n$ python3 --version\n```\n\n\
  此命令的输出应类似于：Python 3.8.10。\n\n要检查 PIP 的版本号，请在终端上执行以下命令：\n\n```\n$ pip3 --version\n\
  ```\n\n此命令应显示 PIP 3 的版本号，例如，PIP 20.0.2。\n\n### 在 Ubuntu 上安装 Python 和 PIP\n\n在你的\
  \ Ubuntu 终端中运行以下命令：\n\n```\nsudo apt update\nsudo apt install python3 python3-dev\
  \ python3-pip\n```\n\n### 在 macOS 上安装 Python 和 PIP\n\n在 macOS 上运行以下命令：\n\n```\n\
  brew update\nbrew install python\n```\n\n这将同时安装 Python 和 PIP。\n\n### 在 Red Hat Linux\
  \ 上安装 Python 和 PIP\n\n在 Red Hat Linux 上运行以下命令：\n\n```\nsudo yum update\nsudo yum\
  \ install python3\nsudo yum groupinstall 'Development Tools'\n```\n\n### 在 Windows\
  \ 上安装 Python 和 PIP\n\n安装 Microsoft Visual C++ 2017 Redistributable Update 3。这随 Visual\
  \ Studio 2017 一起提供，但也可以通过以下步骤单独安装：\n\n1.  访问 Visual Studio 下载页面：[`https://visualstudio.microsoft.com/vs/older-downloads/`](https://visualstudio.microsoft.com/vs/older-downloads/)。\n\
  \n2.  选择“其他工具、框架和可再发行组件”。\n\n3.  下载并安装 Microsoft Visual C++ 2017 Redistributable\
  \ Update 3。\n\n确保在 Windows 上启用了长路径。以下是操作说明：[`https://www.thewindowsclub.com/how-toenable-or-disable-win32-long-paths-in-windows-11-10`](https://www.thewindowsclub.com/how-toenable-or-disable-win32-long-paths-in-windows-11-10)。\n\
  \n从[`https://www.python.org/downloads/windows/`](https://www.python.org/downloads/windows/)安装适用于\
  \ Windows 的 64 位 Python 3 版本（选择 PIP 作为可选功能）。\n\n如果这些安装说明在你的情况下不起作用，请参考[`https://www.python.org/`](https://www.python.org/)上的官方\
  \ Python 文档。\n\n## virtualenv\n\nvirtualenv 是一个旨在创建隔离 Python 环境的工具。当你使用 virtualenv\
  \ 时，它会生成一个目录，其中包含使用 Python 项目所需包的所有必要可执行文件。virtualenv 具有以下优点：\n\n*   它允许同一库的两个版本共存，从而使运行不同版本库的两个程序都能正常工作。例如，如果你有一个程序依赖于\
  \ Python 库的版本 1，而另一个程序依赖于同一库的版本 2，virtualenv 允许你同时运行这两个程序。\n\n*   它为你的开发工作建立了一个自包含且独立的环境，可以在生产环境中使用，而无需单独安装依赖项。\n\
  \n接下来，我们将安装 virtualenv 并设置包含所有必要软件的虚拟环境。本书的其余部分假设我们参考程序的依赖项将包含在此 virtualenv 中。\n\
  \n\n\n### 安装并激活 virtualenv\n\n要在系统范围内安装 virtualenv，请执行以下 PIP 命令，该命令在所有操作系统上均适用：\n\
  \n```\n$ sudo pip3 install -U virtualenv\n```\n\n安装完成后，在你打算设置 virtualenv 的位置创建一个你选择的目录。为了遵循本书中的示例，请将此目录命名为\
  \ `cv`（“computer vision”的缩写）：\n\n```\n$ mkdir cv\n```\n\n然后在此 `cv` 目录中创建 virtualenv：\n\
  \n```\n$ virtualenv --system-site-packages -p python3 ./cv\n```\n\n以下是运行此命令（在我的\
  \ MacBook 上）的示例输出：\n\n```\nRunning virtualenv with interpreter /anaconda3/bin/python3\n\
  Already using interpreter /anaconda3/bin/python3\nUsing base prefix '/anaconda3'\n\
  New python executable in /Users/sansari/cv/bin/python3\nAlso creating executable\
  \ in /Users/sansari/cv/bin/python\nInstalling setuptools, pip, wheel...\ndone.\n\
  ```\n\n使用特定于 shell 的命令激活虚拟环境：\n\n```\n$ source ./cv/bin/activate  # 适用于 sh, bash,\
  \ ksh, 或 zsh\n```\n\n当 virtualenv 激活时，你的 shell 提示符会以 `(cv)` 为前缀。示例如下：\n\n```\n(cv)\
  \ Shamshads-MacBook-Air:~ sansari$\n```\n\n在虚拟环境中安装包不会影响主机系统设置。首先按如下方式升级 PIP。请注意，在虚拟环境内，你不应以\
  \ root 或 sudo 身份执行任何命令。\n\n```\n$ pip install --upgrade pip\n$ pip list  # 显示虚拟环境中安装的包\n\
  ```\n\n当你完成编程活动并想要退出 virtualenv 时，运行以下命令：\n\n```\n$ deactivate\n```\n\n## TensorFlow\n\
  \nTensorFlow 是一个广泛使用的开源库，用于数值计算和大规模机器学习。在接下来的章节中，你将更深入地了解 TensorFlow 并探索其功能。然而，在继续之前，让我们先安装\
  \ TensorFlow 并为我们的深度学习练习做好准备。如果你的计算机有 GPU 并且你想将其用于深度学习任务，通常不需要同时安装 TensorFlow 的\
  \ CPU 和 GPU 版本。你可以安装 GPU 版本，它同时支持 GPU 和 CPU 计算。当 GPU 资源不可用或操作不适合 GPU 加速时，支持 GPU\
  \ 的 TensorFlow 会自动回退到 CPU 执行。因此，安装支持 GPU 的 TensorFlow（tensorflow-gpu）就足够了。它可以在 GPU\
  \ 和 CPU 上工作，使其成为大多数深度学习任务的多功能选择。\n\n### 在配备 M1 芯片的 Mac 上安装 TensorFlow\n\n在 M1 芯片上安装\
  \ TensorFlow 的步骤如下：\n\n1.  从以下链接下载 Conda 环境：[`https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-arm64.sh`](https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-arm64.sh)。\n\
  \n2.  假设下载的文件 `Miniconda3-latest-MacOSX-arm64.sh` 位于 Downloads 文件夹中，执行以下命令安装 Miniconda3：\n\
  \n    **$ sh Downloads/Miniconda3-latest-MacOSX-arm64.sh**\n\n3.  按照屏幕上的说明在你的计算机上完成\
  \ Miniconda3 的安装。如果你选择默认选项，Miniconda3 将安装在你的主目录中。例如，如果你的主目录是 `/Users/username`，安装后\
  \ Miniconda3 的路径将是 `/Users/username/miniconda3`。\n\n4.  安装完成后，重启终端。\n\n5.  通过运行以下命令，使用\
  \ Miniconda3 创建一个虚拟环境：\n\n    **$ conda create --name cv python=3.8**\n\n6.  要激活或停用此虚拟环境，请使用以下命令：\n\
  \n    **$ conda activate cv**\n\n    **$ conda deactivate**\n\n7.  通过运行命令 `conda\
  \ activate cv` 激活虚拟环境，然后通过执行以下命令安装 TensorFlow：\n\n    **$ conda install -c apple\
  \ tensorflow-deps**\n\n    **$ pip install tensorflow-macos**\n\n    **$ pip install\
  \ tensorflow-metal**\n\n    **$ conda install tensorflow**\n\n8.  通过运行以下命令测试 TensorFlow\
  \ 安装：\n\n    **$ python -c \"import tensorflow as tf\"**\n\n9.  如果此命令执行无误，则表示 TensorFlow\
  \ 已成功安装到你的 M1 芯片上。\n\n10. 如果遇到任何错误，请通过例如升级 Mac OS 等方式解决不兼容问题。\n\n### 为 CPU 安装 TensorFlow\n\
  \n要从 PyPI ([`https://pypi.org/project/tensorflow/`](https://pypi.org/project/tensorflow/))\
  \ 安装最新版本的 TensorFlow，特别是针对 CPU，请确保你在虚拟环境中并执行以下命令：\n\n```\n(cv) $ pip install --upgrade\
  \ tensorflow\n```\n\n通过运行此命令测试你的 TensorFlow 安装：\n\n```\n(cv) $ python -c \"import\
  \ tensorflow as tf\"\n```\n\n如果 TensorFlow 安装成功，输出不应显示任何错误。\n\n### 为 GPU 安装 TensorFlow\n\
  \n要为 GPU 安装 TensorFlow，你需要遵循略有不同的安装过程。步骤如下：\n\n1.  确保你的系统上安装了合适的 NVIDIA GPU 和驱动程序。你可以查看\
  \ TensorFlow 文档以了解具体的 GPU 要求和兼容的驱动程序版本。\n\n2.  激活我们之前创建的虚拟环境。\n\n3.  安装必要的 GPU 驱动程序和依赖项。请根据你的操作系统参考\
  \ TensorFlow 文档中的具体说明。\n\n4.  使用以下命令安装 TensorFlow 的 GPU 版本：\n\n    **(cv) $ pip\
  \ install --upgrade tensorflow-gpu**\n\n    此命令安装支持 GPU 加速的最新版 TensorFlow。\n\n5.\
  \  安装完成后，你可以通过运行以下命令测试你的 TensorFlow-GPU 设置：\n\n    **(cv) $ python -c \"import tensorflow\
  \ as tf; tf.config.list_physical_devices('GPU')\"**\n\n如果 TensorFlow-GPU 安装正确且启用了\
