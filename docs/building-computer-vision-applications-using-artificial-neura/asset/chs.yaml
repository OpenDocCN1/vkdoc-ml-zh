  | Faster R-CNN ResNet101 V1 1024x1024 | 72 | 37.1 | 边界框 |\n| Faster R-CNN ResNet101\
  \ V1 800x1333 | 77 | 36.6 | 边界框 |\n| Faster R-CNN ResNet152 V1 640x640 | 64 | 32.4\
  \ | 边界框 |\n| Faster R-CNN ResNet152 V1 1024x1024 | 85 | 37.6 | 边界框 |\n| Faster R-CNN\
  \ ResNet152 V1 800x1333 | 101 | 37.4 | 边界框 |\n| Faster R-CNN Inception ResNet V2\
  \ 640x640 | 206 | 37.7 | 边界框 |\n| Faster R-CNN Inception ResNet V2 1024x1024 | 236\
  \ | 38.7 | 边界框 |\n| Mask R-CNN Inception ResNet V2 1024x1024 | 301 | 39.0/34.6 |\
  \ 边界框/掩码 |\n\n为了演示我们的训练方法，我们将利用来自以下 URL 的 SSD ResNet50 V1 FPN 640x640 (RetinaNet50)\
  \ 模型进行迁移学习：\n\n[`http://download.tensorflow.org/models/object_detection/tf2/20200711/ssd_resnet50_v1_fpn_640x640_coco17_tpu-8.tar.gz`](http://download.tensorflow.org/models/object_detection/tf2/20200711/ssd_resnet50_v1_fpn_640x640_coco17_tpu-8.tar.gz)\n\
  \n请随意下载表 6-3 中列出的、最符合您速度和 mAP 偏好的任何模型。\n\n清单 6-6 中的命令集用于下载 SSD RetinaNet50 模型。\n\
  \n```\nFileName: Listing_6_6\n1    %%shell\n2    cd computer_vision\n3    mkdir\
  \ pre-trained-model\n4    cd pre-trained-model\n5    wget http://download.tensorflow.org/models/object_detection/tf2/20200711/ssd_resnet50_v1_fpn_640x640_coco17_tpu-8.tar.gz\n\
  6    tar -xvf ssd_resnet50_v1_fpn_640x640_coco17_tpu-8.tar.gz\n清单 6-6\n下载预训练的 SSD\
  \ RetinaNet50 目标检测模型\n```\n\n在清单 6-6 中，第 1 行激活了魔法 shell。\n\n第 2 行将工作目录更改为 `computer_vision`。\n\
  \n第 3 行在父目录 `computer_vision` 下创建了一个子目录 `pre-trained-model`。\n\n第 5 行使用 `wget` 命令从模型库网站下载\
  \ RetinaNet50 预训练模型。\n\n第 6 行使用 `tar` 命令将 RetinaNet50 模型文件解压到名为 `/content/pre-trained-model/ssd_resnet50_v1_fpn_640x640_coco17_tpu-8`\
  \ 的目录中。\n\n在 Google Colab 窗口中，展开左侧面板并检查“文件”选项卡。您应该会看到类似于图 6-27 所示的目录结构。\n\n![](img/493065_2_En_6_Fig27_HTML.jpg)\n\
  \n一张截图，显示了一个包含文件、编辑、查看、插入、运行时、工具和帮助选项的菜单栏。菜单栏下方是一个文件和文件夹列表，包括 pre-trained-model、ssd_resnet50_v1_fpn_640x640_coco17_tpu-8\
  \ 以及其中的各种文件和目录。\n\n图 6-27\n\n预训练模型目录结构\n\n\n\n#### 配置目标检测流水线\n\n*训练流水线*是一个配置文件，用于指定训练目标检测模型的各种设置和超参数。它包含模型架构、数据集路径、批次大小、学习率、数据增强、评估设置等信息。该文件通常采用\
  \ Protocol Buffers 格式（`.config` 文件）。\n\n训练流水线的模式定义位于 TensorFlow `models` 项目下 `research`\
  \ 目录中的 `object_detection/protos/pipeline.proto` 文件内。\n\nJSON 格式的训练流水线大致分为五个部分，如下所示。训练流水线的各部分说明如下：\n\
  \n*   `model`：此部分定义了目标检测模型的架构和配置。\n    *   `ssd` 或 `faster_rcnn`：模型类型（单次多框检测器或 Faster\
  \ R-CNN）\n\n*   `train_config`：此部分包含与训练过程相关的各种设置。\n    *   `batch_size`：每个训练批次中使用的图像数量\n\
  \n*   `fine_tune_checkpoint`：预训练模型检查点的路径，用于在训练前初始化模型\n\n*   `num_steps`：训练过程中要执行的训练步数\n\
  \n*   `data_augmentation_options`：训练期间的数据增强选项（例如，随机亮度、旋转等）\n\n*   `train_input_reader`：此部分包含训练数据输入的配置。\n\
  \    *   `tf_record_input_reader`：训练 TFRecord 文件（`train.tfrecord`）的路径\n\n*   `label_map_path`：`label_map.pbtxt`\
  \ 文件的路径\n\n*   `eval_config`：此部分包含评估过程的设置。\n    *   `num_examples`：用于评估的样本数量\n\n\
  *   `max_evals`：要执行的最大评估次数\n\n*   `eval_input_reader`：此部分包含评估数据输入的配置。\n    *   `tf_record_input_reader`：评估\
  \ TFRecord 文件（`eval.tfrecord`）的路径\n\n*   `label_map_path`：`label_map.pbtxt` 文件的路径\n\
  \n```\nmodel: {\n(... 在此处添加模型配置 ...)\n}\ntrain_config : {\n(... 在此处添加训练配置 ...)\n\
  }\ntrain_input_reader: {\n(... 在此处添加训练输入配置 ...)\n}\neval_config: {\n(... 在此处添加评估配置\
  \ ...)\n}\neval_input_reader: {\n(... 在此处添加评估输入配置 ...)\n}\n```\n\n训练流水线的各部分说明如下：\n\
  \n在图 6-27 中，请注意预训练模型目录 `ssd_resnet50_v1_fpn_640x640_coco17_tpu-8` 中的 `pipeline.config`\
  \ 文件。我们需要编辑 `pipeline.config` 文件以相应地调整训练设置。从 Colab 下载 `pipeline.config` 文件（右键单击并下载），将其保存到本地计算机驱动器，然后编辑它以配置模型的训练流水线。\n\
  \n让我们检查一下需要对 `pipeline.config` 文件进行的修改，这些修改已用粗体标出。需要编辑的行旁边的注释提供了关于根据给定情况配置特定值的进一步指导。\n\
  \n```\nmodel {\nssd {\nnum_classes: 37 # 将此设置为不同标签类别的数量\nimage_resizer {\nfixed_shape_resizer\
  \ {\nheight: 640\nwidth: 640\n}\n}\nfeature_extractor {\ntype: \"ssd_resnet50_v1_fpn_keras\"\
  \ndepth_multiplier: 1.0\nmin_depth: 16\nconv_hyperparams {\nregularizer {\nl2_regularizer\
  \ {\nweight: 0.00039999998989515007\n}\n}\ninitializer {\ntruncated_normal_initializer\
  \ {\nmean: 0.0\nstddev: 0.029999999329447746\n}\n}\nactivation: RELU_6\nbatch_norm\
  \ {\ndecay: 0.996999979019165\nscale: true\nepsilon: 0.0010000000474974513\n}\n\
  }\noverride_base_feature_extractor_hyperparams: true\nfpn {\nmin_level: 3\nmax_level:\
  \ 7\n}\n}\nbox_coder {\nfaster_rcnn_box_coder {\ny_scale: 10.0\nx_scale: 10.0\n\
  height_scale: 5.0\nwidth_scale: 5.0\n}\n}\nmatcher {\nargmax_matcher {\nmatched_threshold:\
  \ 0.5 # 增加此值以获得更好的匹配。\nunmatched_threshold: 0.5 # 匹配阈值与未匹配阈值之和必须等于 1。\nignore_thresholds:\
  \ false\nnegatives_lower_than_unmatched: true\nforce_match_for_each_row: true\n\
  use_matmul_gather: true\n}\n}\nsimilarity_calculator {\niou_similarity {\n}\n}\n\
  box_predictor {\nweight_shared_convolutional_box_predictor {\nconv_hyperparams {\n\
  regularizer {\nl2_regularizer {\nweight: 0.00039999998989515007\n}\n}\ninitializer\
  \ {\nrandom_normal_initializer {\nmean: 0.0\nstddev: 0.009999999776482582\n}\n}\n\
  activation: RELU_6\nbatch_norm {\ndecay: 0.996999979019165\nscale: true\nepsilon:\
  \ 0.0010000000474974513\n}\n}\ndepth: 256\nnum_layers_before_predictor: 4\nkernel_size:\
  \ 3\nclass_prediction_bias_init: -4.599999904632568\n}\n}\nanchor_generator {\n\
  multiscale_anchor_generator {\nmin_level: 3\nmax_level: 7\nanchor_scale: 4.0\naspect_ratios:\
  \ 1.0\naspect_ratios: 2.0\naspect_ratios: 0.5\nscales_per_octave: 2\n}\n}\npost_processing\
  \ {\nbatch_non_max_suppression {\nscore_threshold: 9.99999993922529e-09\niou_threshold:\
  \ 0.6000000238418579\nmax_detections_per_class: 100\nmax_total_detections: 100\n\
  use_static_shapes: false\n}\nscore_converter: SIGMOID\n}\nnormalize_loss_by_num_matches:\
  \ true\nloss {\nlocalization_loss {\nweighted_smooth_l1 {\n}\n}\nclassification_loss\
  \ {\nweighted_sigmoid_focal {\ngamma: 2.0\nalpha: 0.25\n}\n}\nclassification_weight:\
  \ 1.0\nlocalization_weight: 1.0\n}\nencode_background_as_zeros: true\nnormalize_loc_loss_by_codesize:\
  \ true\ninplace_batchnorm_update: true\nfreeze_batchnorm: false\n}\n}\ntrain_config\
  \ {\nbatch_size: 64 # 根据可用内存增加/减少此值（值越大所需内存越多，反之亦然）\ndata_augmentation_options {\n\
  random_horizontal_flip {\n}\n}\ndata_augmentation_options {\nrandom_crop_image {\n\
  min_object_covered: 0.0\nmin_aspect_ratio: 0.75\nmax_aspect_ratio: 3.0\nmin_area:\
  \ 0.75\nmax_area: 1.0\noverlap_thresh: 0.0\n}\n}\nsync_replicas: true\noptimizer\
  \ {\nmomentum_optimizer {\nlearning_rate {\ncosine_decay_learning_rate {\nlearning_rate_base:\
  \ 0.03999999910593033\ntotal_steps: 25000\nwarmup_learning_rate: 0.013333000242710114\n\
  warmup_steps: 2000\n}\n}\nmomentum_optimizer_value: 0.8999999761581421\n}\nuse_moving_average:\
  \ false\n}\nfine_tune_checkpoint: \"/content/pre-trained-model/ssd_resnet50_v1_fpn_640x640_coco17_tpu-8/checkpoint/ckpt-0\"\
  \ # 预训练模型检查点的路径\nnum_steps: 25000\nstartup_delay_steps: 0.0\nreplicas_to_aggregate:\
  \ 8\nmax_number_of_boxes: 100\nunpad_groundtruth_tensors: false\nfine_tune_checkpoint_type:\
  \ \"detection\" # 将此设置为\"detection\"，因为我们希望训练完整的检测模型\nuse_bfloat16: false # 如果不在\
  \ TPU 上训练，请将此设置为 false\nfine_tune_checkpoint_version: V2\n}\ntrain_input_reader\
  \ {\nlabel_map_path: \"PATH_TO_BE_CONFIGURED\"  # 标签映射文件的路径\ntf_record_input_reader\
  \ {\ninput_path: \"PATH_TO_BE_CONFIGURED\"  # 训练 TFRecord 文件的路径\n}\n}\neval_config\
  \ {\nmetrics_set: \"coco_detection_metrics\"\nuse_moving_averages: false\n}\neval_input_reader\
  \ {\nlabel_map_path: \"PATH_TO_BE_CONFIGURED\" # 标签映射文件的路径\nshuffle: false\nnum_epochs:\
  \ 1\ntf_record_input_reader {\ninput_path: \"PATH_TO_BE_CONFIGURED\"  # 测试 TFRecord\
  \ 文件的路径\n}\n}\n```\n\n\n\n由于我们在为迁移学习下载的预训练模型训练过程中保留了 `pipeline.config` 文件，因此我们将保持其大部分内容不变，仅对特定高亮部分进行修改。根据你的\
  \ Colab 环境设置，需要调整的参数如下：\n\n*   `num_classes: 37:` 代表我们数据集中宠物的 37 个类别。\n\n*   `fine_tune_checkpoint:\
  \ \"/content/pre-trained-model/ssd_resnet50_v1_fpn_640x640_coco17_tpu-8/checkpoint/ckpt-0\"\
  `：这是我们存储预训练模型检查点的路径。请注意，在图 6-27 中，模型检查点的文件名是 `model.ckpt.data-00000-of-00001`，但在\
  \ `fine_tune_checkpoint` 配置中，我们只提供到 `model.ckpt`（你**不能**包含检查点文件的完整名称）。要获取此检查点文件的路径，请在\
  \ Colab 文件浏览器中，右键单击文件名并点击“复制路径”。\n\n*   `num_steps: 25000`：这是算法应执行的步数。你可能需要调整此数值以获得理想的准确度水平。\n\
  \n*   `fine_tune_checkpoint_type: \"detection\"`：默认情况下，此项设置为 `\"classification\"\
  `，但为了进行目标检测训练，需要将其更改为 `\"detection\"`。\n\n*   `use_bfloat16: false`：在基于 TPU 的硬件上训练模型时，此项默认设置为\
  \ `true`。\n\n*   `train_input_reader` → `label_map_path: /content/computer_vision/models/research/object_detection/data/pet_label_map.pbtxt`：这是包含\
  \ ID 和类别名称映射关系的文件路径。对于宠物数据集，该文件位于 `research` 目录中。\n\n*   `train_input_reader` →\
  \ `input_path: /content/computer_vision/petdata/pet_faces_train.record-?????-of-00010`：这是训练数据集的\
  \ TFRecord 文件路径。请注意，我们在训练集路径中使用了正则表达式 (`?????`)。这对于包含所有训练 TFRecord 文件至关重要。\n\n*\
  \   `eval_input_reader` → `label_map_path: /content/computer_vision/models/research/object_detection/data/pet_label_map.pbtxt`：这与训练标签映射相同。\n\
  \n*   `eval_input_reader` → `input_path: /content/computer_vision/petdata/pet_faces_eval.record-?????-of-00010`：这是评估数据集的\
  \ TFRecord 文件路径。请注意，我们在评估集路径中使用了正则表达式 (`?????`)。这对于包含所有评估 TFRecord 文件至关重要。\n\n需要注意的是，`pipeline.config`\
  \ 中的参数 `override_base_feature_extractor_hyperparams` 设置为 `true`；**不要**更改此设置，否则模型将无法运行。\n\
  \n编辑完 `pipeline.config` 文件后，我们需要将其上传到 Colab。我们可以将其上传到任何目录位置，但在此示例中，我们将其上传到下载时的原始位置。我们将首先删除旧的\
  \ `pipeline.config` 文件，然后上传更新后的文件。\n\n要从 Colab 目录位置删除旧的 `pipeline.config` 文件，请右键单击它，然后单击“删除”。要从本地计算机上传更新后的\
  \ `pipeline.config` 文件，请右键单击 Colab 目录（`ssd_resnet50_v1_fpn_640x640_coco17_tpu-8`），单击“上传”，然后浏览并从本地计算机上传编辑后的\
  \ `pipeline.config` 文件。\n\n#### 执行模型训练\n\n我们已准备好开始训练过程。要启动训练，只需执行代码清单 6-7。\n\n```\n\
  1    %%shell\n2    export PYTHONPATH=$PYTHONPATH:/content/models/research\n3   \
  \ export PYTHONPATH=$PYTHONPATH:/content/models/research/slim\n4    cd /content/models/research\n\
  5    PIPELINE_CONFIG_PATH=/content/computer_vision/pre-trained-model/ssd_resnet50_v1_fpn_640x640_coco17_tpu-8/pipeline.config\n\
  6    MODEL_DIR=/content/computer_vision/pet_detection_model/\n7    NUM_TRAIN_STEPS=100\n\
  8    SAMPLE_1_OF_N_EVAL_EXAMPLES=1\n9    python object_detection/model_main_tf2.py\
  \ \\\n--pipeline_config_path=${PIPELINE_CONFIG_PATH} \\\n--model_dir=${MODEL_DIR}\
  \ \\\n--num_train_steps=${NUM_TRAIN_STEPS} \\\n--sample_1_of_n_eval_examples=${SAMPLE_1_OF_N_EVAL_EXAMPLES}\
  \ \\\n--alsologtostderr\n代码清单 6-7\n执行模型训练\n```\n\nTensorFlow 提供了一个 Python 脚本 `model_main_tf2.py`\
  \ 来触发模型训练。该脚本位于目录 `models/research/object_detection` 中。该脚本接受以下参数：\n\n*   `pipeline_config_path`：这是\
  \ `pipeline.config` 文件的路径。\n\n*   `model_dir`：这是训练后模型将保存到的目录。\n\n*   `num_train_steps`：这是我们希望网络训练的步数。这将覆盖\
  \ `pipeline.config` 文件中的 `num_steps` 参数。\n\n*   `sample_1_of_n_eval_examples`：这决定了模型应使用多少个样本中的一个进行评估。\n\
  \n在 Colab 中执行此代码块，并等待模型完成对训练图像集的学习。在模型学习过程中，你将在 Colab 控制台中看到打印出的迭代损失。如果一切顺利，你将得到一个训练好的目标检测模型，并保存在\
  \ `model_dir` 目录中（在我们的示例中为 `/content/computer_vision/pet_detection_model/`）。\n\n\
  \n\n#### 评估模型\n\n回顾一下，在清单 6-2 中，我们通过第 6 至第 9 行从 `cocoapi` 安装了 `pycocotools`。`pycocotools`\
  \ 是一个 Python 库，提供了用于处理 COCO（上下文中的常见对象）数据集的工具和实用程序。COCO 数据集是对象检测、分割和描述任务中广泛使用的基准。它包含大量具有复杂场景的图像和丰富的注释集，包括对象实例、关键点和描述。\n\
  \n`pycocotools` 使研究人员和开发人员能够与 COCO 数据集进行交互，并使用 AP 和 mAP 等标准评估指标来评估对象检测和分割模型的性能。\n\
  \n让我们先简要解释一下评估过程。在训练过程进行时，它会定期在 `model_dir` 目录内创建检查点文件。这些检查点代表了模型在特定训练步骤时的快照。当生成一组新的检查点文件时，评估过程就会启动。它利用这些检查点文件来评估模型在验证数据集上检测对象的性能。然后通过各种指标汇总评估结果，从而深入了解模型随时间的进展。\n\
  \n以下是执行评估过程的步骤：\n\n1.  确保 `pycocotools` 已正确安装。\n\n2.  在 `pipeline.config` 文件中，为\
  \ `eval_config` 块下的 `metrics_set` 键设置 `\"coco_detection_metrics\"`：\n\n    ```\n\
  \    eval_config {\n    metrics_set: \"coco_detection_metrics\"\n    use_moving_averages:\
  \ false\n    }\n    ```\n\n3.  执行清单 6-8 中所示的评估命令。\n\n```\n1    %%shell\n2    python\
  \ /content/models/research/object_detection/model_main_tf2.py \\\n3    --model_dir=/content/computer_vision/pet_detection_model\
  \ \\\n4    --pipeline_config_path=/content/computer_vision/pre-trained-model/ssd_resnet50_v1_fpn_640x640_coco17_tpu-8/pipeline.config\
  \ \\\n5    --checkpoint_dir=/content/computer_vision/pet_detection_model\n清单 6-8\n\
  执行模型评估\n```\n\n执行清单 6-8 将花费几分钟时间，具体时长取决于数据集中验证图像的数量。在评估过程中，它会定期执行检查（默认每 300 秒一次），并利用\
  \ `model_dir` 中最新的检查点文件来评估模型的性能。评估结果以 TensorFlow 事件文件（`events.out.tfevents.*`）的形式存储在\
  \ `model_dir/eval_0` 目录中。这些文件用于可视化模型性能，如下一节所述。\n\n#### 在 TensorBoard 中可视化训练结果\n\n\
  如第 5 章所述，TensorBoard 是 TensorFlow 提供的一个基于 Web 的可视化工具，旨在帮助用户理解、调试和优化他们的机器学习模型。它允许您在训练和评估期间监控和可视化模型性能的各个方面，从而更容易获得洞察并提高模型的有效性。\n\
  \n要查看训练统计数据和模型结果，请在 Colab 中使用清单 6-9 中的代码启动 TensorBoard 仪表板。`--logdir` 是我们保存模型检查点的目录。\n\
  \n```\n1    %load_ext tensorboard\n2    %tensorboard --logdir /content/computer_vision/pet_detection_model\n\
  清单 6-9\n启动 TensorBoard 仪表板以查看训练结果\n```\n\n第 1 行加载了 TensorBoard 笔记本扩展。此扩展会在 Colab\
  \ 屏幕内嵌入显示 TensorBoard 仪表板。\n\n点击 TensorBoard 仪表板的“图像”选项卡以显示评估结果，如图 6-28 所示。\n\n\
  ![](img/493065_2_En_6_Fig28_HTML.jpg)\n\n一张截图展示了 TensorBoard 的多种功能，包括标量、图像、图表、INAC\
  \ 部分、标签过滤、亮度和对比度控制、步骤信息以及运行详情。它描绘了六种不同类型的猫检测数据，分别标记为左地面真值右 0、1、2、3、4 和 5。\n\n图 6-28\n\
  TensorBoard 仪表板中的模型训练结果\n\n或者，如果您想在本地计算机上离线评估模型，而不是在 Colab 上，您可以下载我们保存模型检查点的整个 `pet_detection_model`\
  \ 目录。我们导出训练后模型的 `final_model` 目录不包含完整的模型统计数据和训练结果。因此，您必须下载整个 `pet_detection_model`\
  \ 目录。\n\n在您的计算机终端（或命令提示符）中，通过传递 `pet_detection_model` 目录的路径来启动 TensorBoard。确保您处于虚拟环境中（如第\
