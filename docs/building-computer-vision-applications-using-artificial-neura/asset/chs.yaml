  \ V2 FPNLite 320x320 | 22 | 22.2 | 边界框 |\n| SSD MobileNet V2 FPNLite 640x640 | 39\
  \ | 28.2 | 边界框 |\n| SSD ResNet50 V1 FPN 640x640 (RetinaNet50) | 46 | 34.3 | 边界框\
  \ |\n| SSD ResNet50 V1 FPN 1024x1024 (RetinaNet50) | 87 | 38.3 | 边界框 |\n| SSD ResNet101\
  \ V1 FPN 640x640 (RetinaNet101) | 57 | 35.6 | 边界框 |\n| SSD ResNet101 V1 FPN 1024x1024\
  \ (RetinaNet101) | 104 | 39.5 | 边界框 |\n| SSD ResNet152 V1 FPN 640x640 (RetinaNet152)\
  \ | 80 | 35.4 | 边界框 |\n| SSD ResNet152 V1 FPN 1024x1024 (RetinaNet152) | 111 | 39.6\
  \ | 边界框 |\n| Faster R-CNN ResNet50 V1 640x640 | 53 | 29.3 | 边界框 |\n| Faster R-CNN\
