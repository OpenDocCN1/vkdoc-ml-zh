  \n一张截图显示了编程代码行，正在复制授权密钥文件的内容。\n\n图 10-32\n\n将 `id_rsa.pub` 的内容粘贴到 `authorized_keys`\
  \ 文件的末尾\n\n![](img/493065_2_En_10_Fig31_HTML.jpg)\n\n一张截图显示了输出的编程代码行，正在复制从 `ssh-rsa`\
  \ 开始的全部文本。\n\n图 10-31\n\n`cat ~/.ssh/id_ras.pub` 的输出；复制从 `ssh-rsa` 开始的全部文本\n\n![](img/493065_2_En_10_Fig30_HTML.jpg)\n\
  \n一张截图显示了 `ssh-keygen` 命令输出的编程代码行。\n\n图 10-30\n\n`ssh-keygen` 的输出\n\n1.  实例成功启动后，我们需要创建免密码\
  \ SSH，以使每个节点能够相互通信。我们在一台机器上创建一个 RSA 密钥，并将 `rsa_id.pub` 文件中的公钥复制到所有节点的 `authorized_keys`\
  \ 文件中。步骤如下：\n    1.  SSH 登录到机器 1，在其主目录下执行命令 `ssh-keygen`。在每个提示符处按回车键，直到屏幕上打印出指纹。终端输出应类似于图\
  \ 10-30。\n\n2.  将 `~/.ssh/id_rsa.pub` 的内容复制到 `~/.ssh/authorized_keys`，如图 10-31 和图\
  \ 10-32 所示。\n\n3.  将一台机器的 `id_rsa.pub` 内容复制到所有节点的 `authorized_keys` 文件的末尾。\n\n4.\
  \  在其余机器上重复创建 `ssh-keygen` 的过程，并将 `id_rsa.pub` 的内容复制到每个节点的 `authorized_keys` 文件的末尾。\n\
  \n5.  您应该通过从一台机器 SSH 登录到另一台机器来验证。它应该允许您无需任何密码即可登录。如果 SSH 提示输入密码，则意味着您没有在一台机器和另一台机器之间建立免密码通信。要使\
  \ Horovod 正常工作，所有机器必须能够无需密码地与其他机器通信。\n\n#### 运行分布式训练\n\n我们在此示例中使用的 AMI 包含用于以分布式模式启动训练的脚本。在\
  \ `/home/ec2-user/examples/horovod/tensorflow` 目录下有一个 `train_synthetic.sh` shell\
  \ 脚本。您可以修改此脚本以指向您的代码并启动训练。\n\n此示例脚本在我们刚刚创建的 Horovod 集群上启动基于 RestNet 的训练。只需按如下方式执行它：\n\
  \n```\nsh /home/ec2-user/examples/horovod/tensorflow/train_synthetic.sh 2\n```\n\
  \n参数 2 表示集群中的 GPU 数量。\n\n如果一切顺利，您将得到一个训练好的模型，您可以将其下载到将要托管使用此模型预测结果的应用程序的机器上。\n\n\
  我们使用的 AMI 已经安装了 Horovod。如果您想使用没有安装 Horovod 的虚拟机，请按照下一节的安装说明进行操作。\n\n### 安装 Horovod\n\
  \nHorovod 的运行依赖于 OpenMPI。首先，我们需要使用清单 10-19 中所示的命令安装 OpenMPI。\n\n```\n"
- '# 下载 Open MPI

  $ wget https://download.open-mpi.org/release/open-mpi/v4.0/openmpi-4.0.2.tar.gz

  '
- '# 解压缩

  $ gunzip -c openmpi-4.0.2.tar.gz | tar xf -

  $ cd openmpi-4.0.2

  $ ./configure --prefix=/usr/local

  $ make all install

  清单 10-19

  安装 OpenMPI

  ```


  安装 OpenMPI 需要几分钟时间。


  成功安装 OpenMPI 后，使用 `pip` 命令安装 Horovod，如清单 10-20 所示。


  ```

  $ pip install horovod

  清单 10-20

  安装 Horovod

  ```


  清单 10-19 和 10-20 必须在集群的所有机器上执行。


  ### 运行 Horovod 执行分布式训练


  要在具有四个 GPU 的机器上运行，请使用以下命令：


  ```

  $ horovodrun -np 4 -H localhost:4 python horovod_tensorflow_mnist.py

  ```


  要在四台各具有四个 GPU 的机器上运行，请执行以下命令：


  ```

  $ horovodrun -np 16 -H host1:4,host2:4,host3:4,host4:4 python horovod_tensorflow_mnist.py

  ```


  您也可以在一个主机文件中指定主机节点。示例如下：


  ```

  $ cat horovod_cluster.conf

  host1 slots=2

  host2 slots=2

  host3 slots=2

  ```


  此示例列出了主机名（`host1`、`host2` 和 `host3`）以及每个主机有多少个“槽位”。槽位表示训练可能在一个节点上执行的 GPU 数量。


  要在一个名为 `horovod_cluster.conf` 的文件中指定的主机上运行，请执行以下命令：


  ```

  $ horovodrun -np 6 -hostfile horovod_cluster.conf python horovod_tensorflow_mnist.py

  ```


  带有 GPU 的虚拟机成本高昂。因此，建议在不再使用时终止这些虚拟机。图 10-33 显示了如何终止您的实例。


