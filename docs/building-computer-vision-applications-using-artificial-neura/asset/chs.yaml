  \ 对象的 `flow_from_directory()` 函数。此函数以批处理模式（例如，`batch_size = 32`）从目录 `training_img_directory`\
  \ 加载图像，并将图像大小调整为 `target_size`（例如，1024×1024px）指定的尺寸。这是一个高度可扩展的函数，能够加载数百万张图像而无需将它们全部加载到内存中。它一次加载的图像数量由\
  \ `batch_size` 参数指定。对于大多数机器学习练习来说，将所有图像调整为标准尺寸非常重要。请注意，此函数的默认调整大小值为 256。如果您省略调整大小参数，所有输入图像都将被调整为\
  \ 256×256。\n\n第 17 行与第 16 行功能相同，只是它从 `test` 目录加载图像。虽然我们的目录中有验证数据（从 Kaggle 网站下载的数据集包含验证图像），但数量很少，因此我们使用测试数据集进行验证。\n\
  \n函数 `flow_from_directory()` 返回一个迭代器。如果您遍历此迭代器，您将得到一个包含两个 NumPy 数组的元组：图像像素值数组和标签数组。\n\
  \n请注意，标签是根据读取图像的子目录来解释的。例如，来自 `NORMAL` 目录的所有图像将获得标签 `NORMAL`，同样，属于 `PNEUMONIA` 子目录的图像将获得标签\
  \ `PNEUMONIA`。但是等等！这些标签不应该是数字吗？这些目录名称按其名称排序并索引，从 0 开始。在我们的例子中，`NORMAL` 将被索引为 0，`PNEUMONIA`\
  \ 将被索引为 1。但是，事情并没有到此为止。函数 `flow_from_directory()` 接受一个名为 `class_mode` 的额外参数。默认情况下，`class_mode`\
  \ 的值为 `categorical`。您也可以为其传递 `binary` 或 `sparse` 值。这三者之间的区别如下：\n    *   `categorical`\
  \ 将返回二维独热编码标签。\n\n*   `binary` 将返回一维二进制标签。\n\n*   `sparse` 将返回一维整数标签。\n\n第 22 至\
  \ 24 行是可选的，并非训练模型所必需。我提供它们是为了向您展示如何探索从 `flow_from_directory()` 函数返回的迭代器中的值。\n\n\
