  \n### 按位运算\n\n计算机视觉中一些最有用的运算包括按位运算 AND、OR、NOT 和 XOR。正如你可能从布尔代数中回忆起的，这些运算是二进制运算，作用于像素的两种状态：开和关。在灰度图像中，像素的值范围可以从\
  \ 0 到 255。那么，在这种情况下，我们如何定义“开”和“关”呢？在图像处理中，对于灰度二值图像，像素值为 0 表示关，像素值大于 0 表示开。利用像素要么开要么关这一概念，我们将探讨以下按位运算。\n\
  \n\n\n#### 与运算（AND）\n\n对两个操作数“a”和“b”执行按位与运算，只有当“a”和“b”都为 1 时，结果才为 1；否则结果为 0。\n\n\
  在图像处理领域，对两个图像数组执行按位与运算，会计算逐元素的逻辑与。要成功执行按位与运算，必须确保两个数组具有相同的维度。此外，也可以对数组和标量值执行按位与运算。\n\
  \n为了方便执行按位与运算，OpenCV 提供了一个便捷的函数 `bitwise_and(imageArray1, imageArray2)`。该函数将两个图像数组作为参数，并执行按位与运算。\n\
  \n要探究按位与运算的实现，请参考清单 3-8，该清单位于对或运算、非运算和异或运算的讨论之后。\n\n```\nFilename: Listing_3_8.py\n\
  1    import cv2\n2    import numpy as np\n\n4    # 创建一个圆形\n5    circle = cv2.circle(np.zeros((200,\
  \ 200, 3), dtype = \"uint8\"), (100,100), 90, (255,255,255), -1)\n6    cv2.imshow(\"\
  白色圆形\", circle)\n7    cv2.waitKey(0)\n\n9    # 创建一个正方形\n10   square = cv2.rectangle(np.zeros((200,200,3),\
  \ dtype= \"uint8\"), (30,30), (170,170),(255,255,255), -1)\n11   cv2.imshow(\"白色正方形\"\
  , square)\n12   cv2.waitKey(0)\n\n14   # 按位与运算\n15   bitwiseAnd = cv2.bitwise_and(square,\
  \ circle)\n16   cv2.imshow(\"与运算\", bitwiseAnd)\n17   cv2.waitKey(0)\n\n19   # 按位或运算\n\
  20   bitwiseOr = cv2.bitwise_or(square, circle)\n21   cv2.imshow(\"或运算\", bitwiseOr)\n\
  22   cv2.waitKey(0)\n\n24   # 按位异或运算\n25   bitwiseXor = cv2.bitwise_xor(square,\
  \ circle)\n26   cv2.imshow(\"异或运算\", bitwiseXor)\n27   cv2.waitKey(0)\n\n29   #\
  \ 按位非运算\n30   bitwiseNot = cv2.bitwise_not(square)\n31   cv2.imshow(\"非运算\", bitwiseNot)\n\
  32   cv2.waitKey(0)\n清单 3-8\n按位运算\n```\n\n#### 或运算（OR）\n\n对两个操作数“a”和“b”执行按位或运算，如果“a”或“b”中有一个或两个为\
  \ 1，则结果为 1；否则结果为 0。按位或运算计算两个数组或一个数组与一个标量值的逐元素逻辑或。在 OpenCV 中，函数 `bitwise_or(imageArray1,\
  \ imageArray2)` 计算两个输入数组的按位或。清单 3-8 展示了一个或运算的工作示例。\n\n#### 非运算（NOT）\n\n按位非运算将其操作数的位值取反。OpenCV\
  \ 的 `bitwise_not(imageArray)` 函数仅接受一个图像数组作为参数，对该图像执行按位非运算。示例请参见清单 3-8。\n\n#### 异或运算（XOR）\n\
  \n对两个操作数“a”和“b”执行按位异或运算，如果“a”或“b”中恰好有一个（但*不是*两个）为 1，则结果为 1；否则结果为 0。OpenCV 提供了一个便捷的函数\
  \ `bitwise_xor(imageArray1, imageArray2)` 来执行按位异或运算。同样，两个图像数组必须具有相同的维度。清单 3-8 展示了一个按位异或运算的工作示例。\n\
  \n下表总结了图像处理中常用的按位运算，包括掩码操作及其他相关任务：\n\n| 运算符 | 用法 | 描述 |\n| --- | --- | --- |\n|\
  \ 按位与 | a AND b | 在每个位的位置上，如果两个操作数的对应位都为 1，则返回 1 |\n| 按位或 | a OR b | 在每个位的位置上，如果两个操作数中任意一个或两个的对应位为\
  \ 1，则返回 1 |\n| 按位异或 | a XOR b | 在每个位的位置上，如果两个操作数中恰好有一个的对应位为 1，则返回 1 |\n| 按位非 | NOT\
  \ a | 将其操作数的位取反 |\n\n为了更好地理解这些按位运算，让我们分析一下清单 3-8 中的程序。该程序首先创建了两个图像，一个圆形和一个正方形，然后对图像应用了各种按位运算。接下来，我们将在后续的图中观察这些运算的效果。\n\
