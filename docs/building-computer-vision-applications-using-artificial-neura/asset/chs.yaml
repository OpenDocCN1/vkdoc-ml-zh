  16   # 显示红色图像\n17   cv2.imshow(\"红色图像\", r)\n18   cv2.waitKey(0)\n代码清单 3-10\n将通道分割为颜色分量\n\
  ```\n\n在代码清单 3-10 中，第 5 行加载图像。第 8 行将图像分割成三个分量，并将它们存储在独立的 NumPy 变量（`b`、`g`、`r`）中。回顾一下，NumPy\
