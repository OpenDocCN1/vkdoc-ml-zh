  \ `final_model` 目录。\n\n## 使用训练好的模型检测目标\n\n如前所述，训练模型并非日常任务。一旦我们获得了足够强大且具有高精度或高 mAP（平均精度均值）的模型，只要模型在预测中保持其精度，可能就无需重新训练。然而，需要注意的是，模型训练是资源密集型的，即使使用\
  \ GPU，也需要数小时或数天才能开发出高质量的模型。在某些情况下，利用 GPU 的强大算力在云端进行计算机视觉模型的训练是有优势且成本效益高的。随后，一旦模型准备就绪，就可以下载到本地计算机或应用服务器上使用。这种模型的本地化部署允许以经济高效的方式识别图像中的目标。\n\
  \n本节将解释在个人计算机上创建目标检测预测器的过程。这需要使用之前在 Google Colab 上训练好的模型。与之前的章节一样，我们将使用 PyCharm\
  \ 作为 IDE。虽然使用 Colab 编写目标检测预测器当然也是可行的，但从生产部署的角度来看，这种方法并非最优。\n\n以下是创建目标检测程序的一般步骤，将在接下来的两节中深入介绍：\n\
  \n1.  从 GitHub 仓库下载并安装 TensorFlow `models` 项目。\n\n2.  编写 Python 代码，利用导出的 TensorFlow\
  \ 图（导出的模型）来预测未包含在训练集或测试集中的新图像中的目标。\n\n\n\n### 安装 TensorFlow 的 models 项目\n\nTensorFlow\
