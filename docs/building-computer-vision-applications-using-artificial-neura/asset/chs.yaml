  \ `http://localhost:5019`。\n\n## 总结\n\n在本章中，我们通过利用一个预训练的 SSD 模型，开发了一个功能完备的视频跟踪系统。此外，我们深入了解了差异哈希（dHash）算法，并利用汉明距离来衡量图像相似度。我们的实现被集成到了\
  \ Flask 微网络框架中，使我们能够直接在网络浏览器中呈现实时视频跟踪。\n\n"
- "# 8. 实践示例：人脸识别\n\n人脸识别是一个计算机视觉问题，旨在检测和识别图像或视频中的人脸。人脸识别的第一步是检测并定位输入图像中人脸的位置。这是我们在前几章中探讨过的典型目标检测任务。检测到人脸后，会从人脸上的各个关键点创建一个特征集，也称为*面部足迹*或*人脸嵌入*。一张人脸有\
  \ 80 个节点或显著特征点，用于创建该特征集（美国专利号 US7634662B2，[`https://patents.google.com/patent/US7634662B2/`](https://patents.google.com/patent/US7634662B2/)）。然后将人脸嵌入与数据库进行比较，以确定人脸的身份。\n\
  \n人脸识别在现实世界中有许多应用，例如：\n\n*   作为高安全区域访问控制的密码\n\n*   在机场海关和边境保护中\n\n*   在识别遗传性疾病中\n\
  \n*   作为预测个人年龄和性别的一种方式（例如，用于控制基于年龄的访问，如购买酒精饮料）\n\n*   在执法中（例如，警方通过扫描数百万张照片来寻找潜在的犯罪嫌疑人和目击者）\n\
  \n*   在整理数码相册中（例如，社交媒体上的照片）\n\n在本章中，我们将探讨 FaceNet，这是一种由谷歌工程师开发的流行人脸识别算法。我们将研究如何训练一个基于\
  \ FaceNet 的神经网络来开发人脸识别模型。最后，我们将编写代码来开发一个功能完备的人脸识别系统，该系统能够从视频流中实时检测人脸。\n\n## FaceNet\n\
  \nFaceNet 由三位谷歌工程师 Florian Schroff、Dmitry Kalenichenko 和 James Philbin 发明。他们于 2015\
  \ 年在一篇题为“FaceNet: A Unified Embedding for Face Recognition and Clustering”（[`https://arxiv.org/pdf/1503.03832.pdf`](https://arxiv.org/pdf/1503.03832.pdf)）的论文中发表了他们的工作。\n\
  \nFaceNet 是一个统一的系统，提供以下功能：\n\n*   人脸验证（是同一个人吗？）\n\n*   识别（这个人是谁？）\n\n*   聚类（有相似的人脸吗？）\n\
  \nFaceNet 是一个深度神经网络，它执行以下操作：\n\n*   从输入图像计算一个 128 维的紧凑特征向量，称为*人脸嵌入*。回顾第 4 章，特征向量包含描述对象重要特征的信息。128\
  \ 维特征向量是一个包含 128 个实数值的列表，代表试图量化人脸的输出。\n\n*   通过优化三元组损失函数（本章后面会描述）进行学习。\n\n### FaceNet\
  \ 神经网络架构\n\n图 8-1 展示了 FaceNet 的架构。\n\n![](img/493065_2_En_8_Fig1_HTML.png)\n\n一个神经网络架构的流程图。一个带有\
  \ 6 条交替颜色带的矩形图像由深度 CNN 训练，随后进行 L2 归一化、嵌入和三元组损失计算。\n\n图 8-1\n\nFaceNet 神经网络架构\n\n\
  FaceNet 网络的组成部分将在以下章节中描述。\n\n#### 输入图像\n\n训练集由从图像中裁剪出的人脸缩略图组成。除了平移和缩放之外，不需要对人脸裁剪图像进行其他对齐操作。\n\
  \n\n\n#### 深度卷积神经网络\n\nFaceNet 使用深度卷积神经网络进行训练，采用了带动量的随机梯度下降（SGD）和 AdaGrad 优化器。初始学习率设为\
  \ 0.05，并随着迭代次数逐渐降低以完成模型训练。训练过程在基于 CPU 的集群上进行了 1000 到 2000 小时。\n\nFaceNet 论文描述了两种具有不同权衡的深度卷积神经网络架构。第一种架构受\
  \ Zeiler 和 Fergus 的启发，第二种则是谷歌的 Inception 架构。这两种架构主要在两个方面有所不同：参数数量和每秒浮点运算次数（FLOPS）。FLOPS\
  \ 是衡量需要浮点运算的计算机性能的标准指标。\n\nZeiler 和 Fergus 的 CNN 架构包含 22 层，在每张图像上以 16 亿 FLOPS 训练\
  \ 1.4 亿个参数。这种 CNN 架构被称为 NN1，其输入尺寸为 220×220。\n\n表 8-1 展示了 FaceNet 中使用的基于 Zeiler 和\
  \ Fergus 的网络配置。\n\n**表 8-1**\n\n基于 Zeiler 和 Fergus 网络架构的深度 CNN（来源：Schroff 等人，[`https://arxiv.org/pdf/1503.03832.pdf`](https://arxiv.org/pdf/1503.03832.pdf)）\n\
  \n| ![](img/493065_2_En_8_Figa_HTML.jpg) 一张 CNN 网络架构表。包含 6 列：层、输入尺寸、输出尺寸、卷积核、参数和\
  \ FLOPS。多行给出了卷积层和池化层组件。总参数为 1.4 亿，总 FLOPS 为 16 亿。 |\n\n第二种网络是基于 GoogLeNet 的 Inception\
  \ 模型。该模型的参数数量减少了 20 倍（约 660 万到 750 万），FLOPS 减少了 5 倍（约 5 亿到 16 亿）。\n\n基于输入尺寸的不同，Inception\
  \ 模型有几种变体。这里简要描述如下：\n\n*   ***NN2***：这是一个 Inception 模型，输入图像尺寸为 224×224，在每张图像上以 16\
  \ 亿 FLOPS 训练 750 万个参数。\n\n表 8-2 展示了 FaceNet 中使用的 NN2 Inception 模型。\n\n**表 8-2**\n\
  \n基于 GoogLeNet 的 Inception 模型架构（来源：Schroff 等人，[`https://arxiv.org/pdf/1503.03832.pdf`](https://arxiv.org/pdf/1503.03832.pdf)）\n\
  \n| ![](img/493065_2_En_8_Figb_HTML.jpg) 一张 Inception 模型架构表。包含类型、输出尺寸、深度、1x1、3x3\
  \ 降维、3x3、5x5 降维、5x5、池化投影、参数和 FLOPS 列。行包括卷积层和平均池化层，以及从 3a 到 5b 的 Inception 层。总参数为\
  \ 750 万，总 FLOPS 为 16 亿。 |\n\n*   ***NN3***：该架构与 NN2 相同，只是输入尺寸为 160×160，导致网络规模更小。\n\
  \n*   ***NN4***：该网络的输入尺寸为 96×96，导致参数大幅减少，每张图像仅需 2.85 亿 FLOPS（相比之下，NN1 和 NN2 需要 16\
  \ 亿 FLOPS）。由于尺寸减小且 FLOPS 降低，所需的 CPU 时间更少，因此 NN4 适用于移动设备。\n\n*   ***NNS1***：由于其尺寸较小，也被称为“迷你”Inception。其输入尺寸为\
  \ 165×165，拥有 2600 万个参数，每张图像仅需 2.2 亿 FLOPS。\n\n*   ***NNS2***：这被称为“微型”Inception。其输入尺寸为\
  \ 140×116，拥有 430 万个参数，需要 2000 万 FLOPS。\n\nNN4、NNS1 和 NNS2 由于参数数量较少，每张图像所需的 CPU FLOPS\
  \ 较低，因此适用于移动设备。\n\n需要指出的是，FLOPS 越高，模型精度通常也越高。一般来说，FLOPS 较低的网络运行速度更快，内存消耗更少，但精度也较低。\n\
  \n图 8-2 展示了不同 CNN 架构的 FLOPS 与精度的关系图。\n\n![](img/493065_2_En_8_Fig2_HTML.jpg)\n\n\
  一张散点图，显示了在 FAR 为 10 的负 3 次方时，VAL 从 20% 到 80% 与乘法加法 FLOPS 的关系。这些点呈现正相关的上升趋势。图中标记了\
  \ NNS2、NNS1 以及 NN1 到 NN4 的点。\n\n**图 8-2**\n\nFLOPS 与精度对比图（来源：FaceNet，[`​arxiv.​org/​pdf/​1503.​03832.​pdf`](https://arxiv.org/pdf/1503.03832.pdf)）\n\
  \n#### 人脸嵌入\n\n尺寸为 1×1×128 的人脸嵌入是从深度 CNN 的 L2 归一化层生成的（如图 8-1 以及表 8-1 和 8-2 所示）。\n\
  \n计算出嵌入向量后，通过计算嵌入向量之间的欧几里得距离来执行人脸验证（或查找相似人脸），并根据以下规则查找相似人脸：\n\n*   同一个人的脸距离较小。\n\
  *   不同人的脸距离较大。\n\n人脸识别通过标准的 K 近邻（K-NN）分类来执行。\n\n聚类则使用 K-means 或凝聚聚类等技术完成。\n\n####\
  \ 三元组损失函数\n\nFaceNet 中使用的损失函数被称为*三元组损失函数*。\n\n同一人脸的嵌入向量被称为*正样本*，不同人脸的嵌入向量被称为*负样本*。正在分析的人脸被称为*锚点*。为了计算损失，会形成一个由锚点、正样本和负样本嵌入组成的三元组，并分析它们之间的欧几里得距离。FaceNet\
  \ 的学习目标是**最小化**锚点与正样本之间的距离，并**最大化**锚点与负样本之间的距离。\n\n图 8-3 说明了三元组损失函数和学习过程。\n\n![](img/493065_2_En_8_Fig3_HTML.jpg)\n\
  \n一张三元组损失函数和学习过程的流程图。它描绘了一个锚点、一个负样本和一个正样本点。它分别最小化和最大化锚点与正样本、锚点与负样本之间的距离。\n\n**图\
  \ 8-3**\n\n三元组损失最小化锚点与正样本（两者身份相同）之间的距离，并最大化锚点与负样本（身份不同）之间的距离（来源：FaceNet，[`​arxiv.​org/​pdf/​1503.​03832.​pdf`](https://arxiv.org/pdf/1503.03832.pdf)）。\n\
  \n每张人脸图像都是一个特征向量，表示一个 d 维的欧几里得超球面，并由函数 ||*f(x)||*[*2*] *= 1* 表示。\n\n假设人脸图像 ![$$\
  \ {x}_i^a $$](img/493065_2_En_8_Chapter_TeX_IEq1.png)（锚点）比不同人的 ![$$ {x}_i^n $$](img/493065_2_En_8_Chapter_TeX_IEq3.png)（困难负样本）人脸更接近同一个人的\
  \ ![$$ {x}_i^p $$](img/493065_2_En_8_Chapter_TeX_IEq2.png)（困难正样本）人脸。此外，假设训练集中有 N\
  \ 个三元组。三元组损失函数由以下公式表示：\n\n*   ![$$ {\\sum}_i^N\\left[\\kern0.5em {\\left\\Vert \\\
  kern0.5em f\\left({x}_i^a\\right)-f\\left({x}_i^p\\right)\\kern0.5em \\right\\Vert}_2²-{\\\
  left\\Vert f\\left({x}_i^a\\right)-f\\left({x}_i^n\\right)\\kern0.5em \\right\\\
  Vert}_2²+\\alpha \\kern0.5em \\right] $$](images/493065_2_En_8_Chapter/493065_2_En_8_Chapter_TeX_IEq4.png)\n\
  \n其中 *α* 是正样本和负样本嵌入之间的距离边界。\n\n如果我们考虑所有可能的三元组组合，数量会非常庞大，上述函数可能需要很长时间才能收敛。此外，并非每个三元组都有助于模型学习。因此，我们需要一种方法来选择合适的三元组，以便我们的模型训练高效且精度达到最优。\n\
  \n\n\n#### 三元组选择\n\n理想情况下，我们应选择这样的三元组：使得 ![$$ {\\left\\Vert f\\left({x}_i^a\\right)-f\\\
  left({x}_i^p\\right)\\kern0.5em \\right\\Vert}_2² $$](img/493065_2_En_8_Chapter_TeX_IEq5.png)\
  \ 最小，且 ![$$ {\\left\\Vert f\\left({x}_i^a\\right)-f\\left({x}_i^n\\right)\\kern0.5em\
  \ \\right\\Vert}_2² $$](img/493065_2_En_8_Chapter_TeX_IEq6.png) 最大。但在整个数据集中计算这个最小值和最大值可能不可行。因此，我们需要一种方法来高效地计算距离的最小值和最大值。这可以通过离线方式完成，然后将结果输入算法，或者使用某些算法在线确定。\n\
  \n在在线方法中，我们将嵌入向量划分为小批量。每个小批量包含一小部分正样本和一些随机选择的负样本。FaceNet 的发明者使用了包含 40 个正样本和随机选择的负样本嵌入向量的小批量。为每个小批量计算最小和最大距离，以创建三元组。\n\
  \n在接下来的章节中，我们将基于 FaceNet 训练我们自己的模型，并构建一个实时人脸识别系统。\n\n## 训练人脸识别模型\n\nDavid Sandberg\
  \ 提供了最流行的 FaceNet TensorFlow 实现之一。这是一个开源版本，在 MIT 许可下可免费从 GitHub 获取，地址为 [`https://github.com/davidsandberg/facenet`](https://github.com/davidsandberg/facenet)。我已将原始\
  \ GitHub 仓库分叉，并将一个稍作修改的版本提交到我的 GitHub 仓库，地址为 [`https://github.com/ansarisam/facenet`](https://github.com/ansarisam/facenet)。我没有修改核心神经网络和三元组损失函数的实现。我从\
  \ David Sandberg 的仓库分叉而来的 FaceNet 修改版，使用 OpenCV 读取和处理图像。我还升级了 TensorFlow 的一些库函数。\n\
  \n在以下示例中，我们将使用 Google Colab 来训练我们的人脸检测模型。需要注意的是，人脸检测模型是计算密集型的，即使在 GPU 上也可能需要数天时间进行学习。因此，Colab\
  \ 并非训练长时间运行模型的理想平台，因为 Colab 会话过期后，您将丢失所有数据和设置。您应考虑使用基于云的 GPU 环境来训练生产质量的人脸识别模型。第\
