  ```\n\n第 79 行定义了函数 `infer_object()`，它接受两个参数：`model object` 和输入图像的路径。\n\n第 82 行简单地获取图像的文件名，该文件名在第\
  \ 113 行中使用，并将结果图像以相同名称存储到输出目录。\n\n第 84 行使用 OpenCV 读取图像并将其转换为 NumPy 数组。\n\n第 86 行通过将\
  \ `model object` 和图像 NumPy 数组传递给它来调用函数 `run_inference_for_single_image()`。回想一下，函数\
  \ `run_inference_for_single_image()` 返回一个包含检测到的对象和边界框的字典。\n\n输出字典可能包含多个对象和边界框。我们需要循环遍历，并为那些得分超过阈值的对象绘制边界框。第\
  \ 89 至 111 行循环遍历每个检测到的对象类别。输出字典中的得分按降序排列。因此，当得分低于阈值时，循环退出。\n\n第 91 至 93 行简单地提取三个重要的输出数组——边界框坐标、此边界框内检测到的对象类别以及相关的预测得分——并将它们分配给相应的变量。\n\
  \n在第 91 行中，变量 `box` 是一个包含边界框四个角的数组，如下所述：\n\n*   `box[0]` 是矩形边界框左上角的 y 坐标，`box[1]`\
  \ 是 x 坐标。\n*   `box[2]` 和 `box[3]` 是边界框右下角的 y 和 x 坐标。\n\n第 95 行检查得分是否大于阈值。在此示例中，我们使用了阈值\
  \ 0.5，但您可以使用适合特定应用的值。仅当得分大于阈值时，才会在图像上绘制边界框；否则，将退出 `for` 循环。\n\n回想一下，在将图像输入模型进行训练之前，会调整其大小。图像根据我们用于训练的\
  \ `pipeline.config` 文件中的高度和宽度设置进行调整。因此，预测的边界框也会根据调整大小后的图像进行缩放。因此，我们需要根据用于检测的输入图像的原始大小重新缩放边界框。将边界框坐标与图像高度和宽度相乘，即可将坐标缩放到图像尺寸。\n\
  \n第 101 行使用 OpenCV 的 `rectangle()` 函数绘制矩形边界框（有关 `rectangle()` 函数的详细信息，请参阅第 2 章）。请注意，我们使用了\
  \ `colortable` 来动态地为不同类别获取不同颜色。\n\n第 105 行在边界框正上方写入预测的类别名称和相应的得分。如果您愿意，可以在第 104\
  \ 行更改字体样式。在我们的示例中，文本的字体颜色和边界框的边框颜色相同。您可以通过使用不同值调用 `colortable` 函数来使用不同的颜色。例如，向类别索引添加一个常量，然后调用颜色表来获取文本颜色。\n\
  \n如前所述，得分按降序排列，最高得分位于数组顶部。阈值之后的第一个得分情况将中断循环，以避免不必要的处理。\n\n第 113 行将带有检测到的对象周围边界框的结果图像保存到输出目录。\n\
  \n现在我们已经定义了所有正确的设置和函数，需要调用它们来触发检测过程。清单 6-17 展示了如何触发检测。\n\n```\n116  # 获取模型对象\n117\
  \  detection_model = load_model(model_path)\n\n119  # 对每张图像调用预测\n120  for image_path\
