  \ 的值均设为 255。\n\n图 3-23\n白色圆形\n\n\n\n## 掩膜\n\n*掩膜*是计算机视觉中最强大的技术之一。掩膜指的是对图像的“隐藏”或“过滤”。\n\
  \n当我们对图像进行掩膜处理时，我们会用其他图像隐藏图像的一部分。换句话说，我们通过对图像的其余部分应用掩膜，将注意力集中在图像的某一部分上。例如，图 3-29\
  \ 中包含数字 1、2 和 3，而图 3-30 是一张带有白色镂空部分的黑色图像。当我们混合这两张图像时，数字 1 和 3 将被隐藏，唯一可见的数字是数字 2。掩膜的结果如图\
  \ 3-31 所示。\n\n掩膜技术应用于图像的平滑或模糊处理，以及检测图像中的边缘和轮廓。掩膜技术也用于目标检测，我们将在第 6 章中探讨。\n\n清单 3-9\
  \ 展示了如何使用 OpenCV 执行掩膜操作。\n\n![](img/493065_2_En_3_Fig31_HTML.png)\n\n一个矩形框内标有数字\
