  \ 8-7 中的命令启动 TensorBoard 仪表板。\n\n```\n1    %tensorflow_version 2.x\n2    %load_ext\
  \ tensorboard\n3    %tensorboard --logdir /content/logs/facenet\n代码清单 8-7\n通过指向日志目录启动\
  \ TensorBoard\n```\n\n## 开发实时人脸识别系统\n\n一个人脸识别系统需要三个重要组件：\n\n*   一个人脸检测模型\n\n*  \
  \ 一个分类模型\n\n*   一个图像或视频源\n\n\n\n### 人脸检测模型\n\n在上一节中，我们探讨了如何训练一个人脸检测模型。我们可以使用自己构建的模型，也可以使用符合需求的现有预训练模型。表\
