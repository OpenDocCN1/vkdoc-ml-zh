  \ VGGFace2 模型。\n\n### 人脸识别分类器\n\n我们将构建一个模型来识别人脸（即识别此人是谁）。我们将训练该模型识别乔治·W·布什、巴拉克·奥巴马和唐纳德·特朗普——这三位是乔·拜登之前的最近三任美国总统。\n\
  \n为简化操作，我们将为这三位前总统各下载几张图片，并按子目录组织，如图 8-6 所示。\n\n![](img/493065_2_En_8_Fig6_HTML.jpg)\n\
