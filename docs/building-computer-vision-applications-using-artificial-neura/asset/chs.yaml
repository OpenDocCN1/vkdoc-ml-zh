  \ dHash）是计算图像唯一哈希最常用的算法之一。dHash 提供了若干优势，使其成为识别和比较图像的合适选择。以下是使用 dHash 的一些显著优点：\n\n\
  *   如果宽高比发生变化，图像哈希不会改变。\n*   亮度或对比度的变化要么不会改变图像哈希，要么只会使其发生微小变化。这意味着不同对比度的哈希值之间仍然保持接近。\n\
  *   dHash 的计算速度极快。\n\n我们不使用加密哈希，例如 MD-5 或 SHA-1。原因在于，对于这些哈希算法，如果图像发生细微变化，加密哈希将完全不同。即使是一个像素的变化也会导致完全不同的哈希值。因此，如果两幅图像在感知上相似，它们的加密哈希值也会完全不同。这使得它不适用于需要比较两幅图像的应用场景。\n\
  \ndHash 算法很简单。以下是计算 dHash 的步骤：\n\n1.  将图像或图像片段转换为灰度图。这会使计算速度更快，并且如果颜色有细微变化，dHash\
  \ 也不会有太大改变。在物体检测中，我们使用边界框裁剪检测到的物体，并将裁剪后的图像转换为灰度图。\n\n2.  调整灰度图像的大小。为了计算 64 位哈希，图像会被调整为\
  \ 9×8 像素，忽略其宽高比。忽略宽高比是为了确保生成的图像哈希能够匹配相似的图像，无论它们初始的空间尺寸如何。\n\n    为什么是 9×8 像素？在 dHash\
  \ 中，算法计算相邻像素的梯度差异。九行与相邻行进行差异计算，结果中只会产生八行，因此最终输出为 8×8 像素，这将为我们提供一个 64 位的哈希值。\n\n\
  3.  通过应用“大于”公式，将每个像素转换为 0 或 1 来构建哈希，如下所示：\n\n    如果 P[x=1] > P[x]，则为 1，否则为 0。\n\n\
  \    然后将这些二进制值转换为整数哈希。\n\n代码清单 7-4 展示了 dHash 的 Python 和 OpenCV 实现。\n\n```\n32  \
  \    def getCropped(self, image_np, xmin, ymin, xmax, ymax):\n33          return\
  \ image_np[ymin:ymax, xmin:xmax]\n\n35      def resize(self, cropped_image, size=8):\n\
  36          resized = cv2.resize(cropped_image, (size+1, size))\n37          return\
  \ resized\n\n39      def getHash(self, resized_image):\n40          diff = resized_image[:,\
  \ 1:] > resized_image[:, :-1]\n41          # 将差异图像转换为哈希值\n42          dhash = sum([2\
  \ ** i for (i, v) in enumerate(diff.flatten()) if v])\n43          return int(np.array(dhash,\
  \ dtype=\"float64\"))\n代码清单 7-4\n从图像计算 dHash\n```\n\n第 32 行和第 33 行实现了裁剪函数。我们传入完整图像帧的\
