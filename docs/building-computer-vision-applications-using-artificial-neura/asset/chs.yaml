  \ [256], [0,255])\n\n27   # 绘制直方图\n28   #plot.figure()\n29   plot.title(\"均衡化图像的灰度直方图\"\
  )\n30   plot.xlabel(\"区间\")\n31   plot.ylabel(\"像素数量\")\n32   plot.plot(histEqualized)\n\
