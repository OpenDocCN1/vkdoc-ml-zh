  清单 8-3\n解压缩文件的命令\n```\n\n### 数据准备\n\nFaceNet 的训练集应仅包含人脸部分的图像。因此，我们需要裁剪图像以提取人脸，对齐它们，并在需要时调整大小。我们将使用一种称为*多任务级联卷积网络\
  \ (MTCNN)* 的算法，该算法已被证明在保持实时性能的同时，优于许多人脸检测基准。\n\n我们从 GitHub 仓库克隆的 FaceNet 源码中包含一个基于\
  \ TensorFlow 的 MTCNN 实现。该模型的实现超出了本书的范围。我们将使用 `align` 模块中提供的 Python 程序 `align_dataset_mtcnn.py`\
  \ 来获取训练集和测试集中检测到的所有人脸的边界框。该程序将保留目录结构，并将裁剪后的图像保存在相同的目录层次结构中，如图 8-4 所示。\n\n清单 8-4\
