  \n第 37 行是 MLP 的隐藏层，这在本章开头的 ANN 部分已经解释过。\n\n第 38 行是最后一层，即输出层。如前所述，我们使用 softmax 激活函数，因为我们正在解决一个涉及两个类别（正常和肺炎）的分类问题。\n\
  \n第 42 行简单地调用了 `build_cnn()` 函数并创建了一个 `model object`。\n\n第 44 行编译模型，正如我们之前在 ANN\
  \ 中看到的那样。注意第 44 行与清单 5-6 中第 31 行在损失函数上的区别。这里我们使用的是损失函数 `categorical_crossentropy`，而不是我们在清单\
