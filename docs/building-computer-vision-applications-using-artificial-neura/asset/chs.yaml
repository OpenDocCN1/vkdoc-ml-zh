  \n#### LeNet-5\n\nLeNet-5 CNN 架构由 LeCun 等人在其 1998 年的论文《基于梯度的学习应用于文档识别》中提出，主要用于识别文档中的手写和机器生成字符（光学字符识别\
  \ [OCR]）。该架构简单直接，因此被广泛用于教学。以下是 LeNet-5 架构的显著特点：\n\n*   它是一个由七层组成的 CNN。\n\n*   在这七层中，有三个卷积层（C1、C3\
  \ 和 C5）。\n\n*   有两个子采样层（S2 和 S4）。\n\n*   有一个全连接层（F6）和一个输出层。\n\n*   卷积层使用 5×5 的卷积核，步长为\
  \ 1。\n\n*   子采样层是 2×2 的平均池化层。\n\n*   整个网络使用 TanH 激活函数，输出层除外，输出层使用 softmax。\n\n图\
  \ 5-38 展示了 LeNet-5 网络。\n\n![](img/493065_2_En_5_Fig38_HTML.jpg)\n\nLe Net 5 的神经网络架构图。输入图像之后依次是\
  \ C 1、S 2、C 3 和 S 4 特征图（分别进行卷积和子采样）、全连接层 C 5 和 F 6、高斯连接以及输出。\n\n图 5-38\n\nLeNet-5（图片来源：[`​yann.​lecun.​com/​exdb/​publis/​pdf/​lecun-01a.​pdf`](https://yann.lecun.com/exdb/publis/pdf/lecun-01a.pdf)）\n\
