  \ = 106。Y = 451。R、G、B 值设置为 247。\n\n图 3-11\n\n原始图像\n\n## 图像算术与位运算\n\n在开发计算机视觉应用时，通常需要增强输入图像的属性。这涉及执行各种算术运算，例如加法、减法，以及位运算，例如\
  \ OR、AND、NOT 和 XOR。\n\n在图像处理的上下文中，图像中的每个像素可以具有从 0 到 255 的整数值（如第 2 章所述）。然而，当我们向一个像素添加一个常数，导致其值大于\
  \ 255，或者从中减去一个常数，导致其值小于 0 时，会发生什么？\n\n例如，考虑一个场景，图像中某个像素的值为 230，我们向其添加 30。显然，结果像素值不能是\
  \ 260。那么，在这种情况下我们应该怎么做？我们应该截断该值以保持像素的最大值为 255，还是应该将其回绕使其变为 4（这意味着在达到 255 后，该值回绕到\
  \ 0，然后加上任何余数）？\n\n有两种方法可以处理像素值超出 `[0,255]` 范围的情况：\n\n*   *饱和运算（或修剪）*：在此运算中，230 +\
  \ 30 ⇒ 255。\n\n*   *模运算*：这里执行模运算，如下所示：(230+30) % 256 ⇒ 4。\n\n你可以通过使用 OpenCV 和 NumPy\
  \ 的内置函数来执行算术运算。但是，它们处理运算的方式不同。\n\nOpenCV 的加法是饱和运算。另一方面，NumPy 执行模运算。\n\n请注意 NumPy\
  \ 和 OpenCV 之间的区别，因为这两种技术会产生不同的结果，因此你在何处使用哪一种取决于你的具体情况和需求。\n\n### 加法\n\nOpenCV 提供了两种便捷的方法来相加两幅图像：\n\
  \n*   `add()`：将两幅尺寸相同的图像作为参数，并相加它们的像素值以产生结果。\n\n*   `addWeighted()`：通常用于混合两幅图像。稍后将提供有关此函数的更多详细信息。\n\
  \n请注意，要相加两幅图像，它们必须具有相同的深度和类型。\n\n为了更好地理解这两种图像相加方法之间的差异，清单 3-6 展示了这两种方法。\n\n```\n\
  Filename: Listing_3_6.py\n1    # 演示两种图像相加方法的示例程序\n2    import cv2\n3    import numpy\
  \ as np\n\n5    image1Path = \"images/zebra.png\"\n6    image2Path = \"images/nature.jpg\"\
  \n\n8    image1 = cv2.imread(image1Path)\n9    image2 = cv2.imread(image2Path)\n\
  \n11   # 调整两幅图像的大小，使它们具有相同的尺寸。这是相加两幅图像的必要条件\n12   resizedImage1 = cv2.resize(image1,(300,300),interpolation=cv2.INTER_AREA)\n\
  13   resizedImage2 = cv2.resize(image2,(300,300),interpolation=cv2.INTER_AREA)\n\
  \n15   # 这是两幅图像的简单加法\n16   resultant = cv2.add(resizedImage1, resizedImage2)\n\n\
  18   # 显示这些图像以查看差异\n19   cv2.imshow(\"调整大小后的图像 1\", resizedImage1)\n20   cv2.waitKey(0)\n\
  \n22   cv2.imshow(\"调整大小后的图像 2\", resizedImage2)\n23   cv2.waitKey(0)\n\n25   cv2.imshow(\"\
  结果图像\", resultant)\n26   cv2.waitKey(0)\n\n28   # 这是两幅图像的加权加法\n29   weightedImage\
  \ = cv2.addWeighted(resizedImage1,0.7, resizedImage2, 0.3, 0)\n30   cv2.imshow(\"\
  加权图像\", weightedImage)\n31   cv2.waitKey(0)\n\n33   imageEnhanced = 255*resizedImage1\n\
  34   cv2.imshow(\"增强图像\", imageEnhanced)\n35   cv2.waitKey(0)\n\n37   arrayImage\
  \ = resizedImage1+resizedImage2\n38   cv2.imshow(\"数组图像\", arrayImage)\n39   cv2.waitKey(0)\n\
  清单 3-6\n两幅图像的加法\n```\n\n第 8 行和第 9 行从磁盘加载两幅不同的图像。如前所述，要将两幅图像相加，它们必须具有相同的大小和深度。你可能已经猜到了第\
  \ 12 行和第 13 行的目的。在代码中，图像被调整为 300×300 像素的尺寸。\n\n第 16 行是这两幅图像相加的地方，使用了 OpenCV 的简单加法函数\
