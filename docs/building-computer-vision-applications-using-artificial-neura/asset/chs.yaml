  \ 标签编辑器图标（该图标是一个内部带有对角箭头的正方形），将标注导出为 TensorFlow Records 文件。\n\n检查本地文件系统的输出文件夹。你会注意到，在输出目录中已创建了一个名称包含\
  \ `TFRecords-export` 的目录。\n\n导出为 TFRecord 格式还会生成一个 `tf_label_map.pbtxt` 文件，其中包含类别和索引的映射关系。\n\
