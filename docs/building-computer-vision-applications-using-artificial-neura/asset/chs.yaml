  克隆 GitHub 仓库的命令\n```\n\n如果 `git` 命令无法运行，请使用命令 `sudo apt-get install git` 安装 `git`。\n\
  \n### 安装先决条件与 TensorFlow\n\n“Deep Learning on Linux” 镜像已预装所有先决条件和 TensorFlow。但若想自行配置环境，请执行代码清单\
  \ 10-9 中的所有命令（详细说明请参阅第 1 章）。\n\n```\nsudo apt-get update\nsudo apt-get -y upgrade\
  \ && sudo apt-get install -y python-pip python-dev\nsudo apt-get install python3-dev\
  \ python3-pip\nsudo pip3 install -U virtualenv\nmkdir cv\nvirtualenv --system-site-packages\
  \ -p python3 ./cv\nsource ./cv/bin/activate\npip install tensorflow==1.15\n代码清单\
  \ 10-9\n安装包括 TensorFlow 在内的先决条件\n```\n\n### 运行分布式训练\n\n请确保已在所有机器上克隆了 GitHub 仓库（如代码清单\
  \ 10-8 所示）。同时，确保已通过 SSH（使用 Cloud Shell）登录到每台虚拟机。在每台虚拟机上执行以下命令以启动分布式训练。\n\n以下是参数服务器的命令：\n\
  \n```\ncd dist_tf_modeling\nexport TF_CONFIG='{\"task\": {\"index\": 0, \"type\"\
  : \"ps\"}, \"cluster\": {\"chief\":[\"chief:8900\"],\"worker\": [\"worker-0:8900\"\
  , \"worker-1:8900\"],  \"ps\":[\"parameter-server:8900\"]}}';python distributed_training_ps.py\
  \ --output_path gs://cv_model_v1\n```\n\n以下是主节点的命令：\n\n```\ncd dist_tf_modeling\n\
  export TF_CONFIG='{\"task\": {\"index\": 0, \"type\": \"chief\"}, \"cluster\": {\"\
  chief\":[\"chief:8900\"],\"worker\": [\"worker-0:8900\", \"worker-1:8900\"],  \"\
  ps\":[\"parameter-server:8900\"]}}';python distributed_training_ps.py --output_path\
  \ gs://cv_model_v1\n```\n\n以下是 worker-0 节点的命令：\n\n```\ncd dist_tf_modeling\nexport\
  \ TF_CONFIG='{\"task\": {\"index\": 0, \"type\": \"worker\"}, \"cluster\": {\"chief\"\
  :[\"chief:8900\"],\"worker\": [\"worker-0:8900\", \"worker-1:8900\"],  \"ps\":[\"\
  parameter-server:8900\"]}}';python distributed_training_ps.py --output_path gs://cv_model_v1\n\
  ```\n\n以下是 worker-1 节点的命令：\n\n```\ncd dist_tf_modeling\nexport TF_CONFIG='{\"task\"\
  : {\"index\": 1, \"type\": \"worker\"}, \"cluster\": {\"chief\":[\"chief:8900\"\
  ],\"worker\": [\"worker-0:8900\", \"worker-1:8900\"],  \"ps\":[\"parameter-server:8900\"\
  ]}}';python distributed_training_ps.py --output_path gs://cv_model_v1\n```\n\n请注意，所有参与节点必须能够通过\
  \ `TF_CONFIG` 中配置的端口与参数服务器通信。此外，节点必须具有对 GCS 存储桶的必要读写权限。\n\n模型检查点保存在 GCS 的 `gs://cv_model_v1`\
  \ 路径下。训练好的模型以 `model.h5` 形式保存在 `gs://cv_model_v1` 中。\n\n配备 GPU 的 GCP 实例价格昂贵。为避免产生费用，如果不再使用，应将其终止。\n\
  \n## 在 Azure 上进行分布式训练\n\nMicrosoft Azure 是一种云计算服务，用于通过 Microsoft 管理的数据中心构建、测试、部署和管理应用程序与服务。\n\
  \n代码清单 10-3 中使用 `ParameterServerStrategy` 的分布式训练在 Azure 上的工作方式与在 GCP 上几乎相同。GCP 与\
  \ Azure 的区别在于创建虚拟机节点的方式。我们不会重复在 Azure 集群上分发基于参数服务器的训练过程，而是探索一种不同的分布式训练策略。\n\n我们将使用\
  \ `MirroredStrategy` 在单个多 GPU 节点上进行分布式训练。在本节中，您将学习以下内容：\n\n*   如何使用 Web 界面在 Azure\
  \ 上创建基于多 GPU 的虚拟机\n\n*   如何设置 TensorFlow 以在 GPU 上运行\n\n*   需要做哪些更改才能使代码清单 10-3 中的代码在多个\
  \ GPU 上运行\n\n*   如何执行训练并对其进行监控\n\n请注意，TensorFlow 的 GPU 支持适用于搭载 CUDA 兼容显卡的 Ubuntu\
  \ 和 Windows 系统。在本练习中，我们将创建一个配备两个 GPU 的 Ubuntu 20.4 虚拟机。\n\n\n\n### 在 Azure 上创建多\
  \ GPU 虚拟机\n\n首先，您需要在 [`https://azure.microsoft.com/`](https://azure.microsoft.com/)\
  \ 注册以创建一个免费账户。然后前往 [`https://portal.azure.com/`](https://portal.azure.com/) 并登录您的账户。免费账户仅允许您创建单\
  \ GPU 的虚拟机。要创建多 GPU 的虚拟机，您必须激活计费功能。请按照以下说明进行激活：\n\n1.  点击主导航（展开位于左上角的汉堡图标）。\n\n\
  2.  选择“成本管理 + 计费”，然后点击“Azure 订阅”。\n\n3.  点击“添加”。\n\n4.  按照屏幕上的指示操作。\n\n要创建虚拟机，请执行以下操作：\n\
