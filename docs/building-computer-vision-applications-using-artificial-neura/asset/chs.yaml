  \ 选择性搜索 | SGD | 铰链损失（分类），边界框回归 | 是 |\n| Fast R-CNN | 选择性搜索 | SGD | 分类对数损失 + 边界框回归\
  \ | 是 |\n| Faster R-CNN | RPN | SGD | 分类对数损失 + 边界框回归 | 是 |\n| Mask R-CNN | RPN |\
  \ SGD | 分类对数损失 + 边界框回归 + 语义 Sigmoid 损失 | 是 |\n| SSD | 无 | SGD | 分类均方误差损失 + 边界框回归\
