  ### 顶帽\n\n*顶帽*是一种形态学操作，它计算输入图像与其开运算之间的差异。它有助于增强和提取图像中的小尺度细节，例如小物体或精细结构。\n\n顶帽操作有效地从原始图像中移除较大尺度的结构或背景，留下较小尺度的细节。它在图像增强、物体检测以及提取可能被整体图像结构或背景掩盖的细微特征等应用中特别有用。\n\
  \n顶帽操作在清单 3-23 的第 26 行中进行了说明，其输出示例见图 3-77。\n\n![](img/493065_2_En_3_Fig77_HTML.jpg)\n\
