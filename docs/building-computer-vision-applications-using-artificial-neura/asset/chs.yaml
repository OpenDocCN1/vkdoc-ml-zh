  \ 1.5 倍。\n\n\n\n## 总结\n\n在本章中，我们深入探讨了图像处理的基础知识。首先介绍了像素及其在不同色彩方案（包括灰度与彩色）中的表示方式。我们研究了坐标系如何帮助我们定位特定像素并修改其数值。此外，还探索了在图像上绘制基本形状（如线条、矩形和圆形）的过程。尽管这些概念看似简单，但它们构成了各种图像处理任务的基石。\n\
  \n在下一章中，我们将深入探讨图像处理技术与算法，涵盖图像滤波、边缘检测、图像增强等主题。通过在本章所学概念的基础上进一步拓展，你将提升在图像处理领域的理解深度与实践能力。\n\
  \n"
- "# 3. 图像处理技术\n\n在计算机视觉应用中，图像通常从其来源（如摄像头、存储在计算机磁盘上的文件或其他应用程序的流）中获取。在大多数情况下，这些输入图像需要从一种形式转换为另一种形式。例如，可能需要调整大小或旋转，或者改变其颜色。在某些情况下，可能需要移除背景像素，或者将两幅图像合并。此外，在图像中查找特定对象的边界也是一项必要任务。\n\
  \n本章深入探讨了不同的图像变换技术，并提供了使用 Python 和 OpenCV 实现的示例。本章的学习目标如下：\n\n*   探索图像处理中常用的变换技术\n\
  *   学习图像处理中使用的算术运算\n*   学习合并两幅或多幅图像以及拆分通道的技术\n*   理解图像清理技术，例如降噪\n*   掌握在图像中检测并绘制对象轮廓（边界）的技能\n\
  *   探索形态学变换和模板匹配的概念\n\n## 变换\n\n在处理任何计算机视觉问题时，你通常需要将图像变换为不同的形式。以下各节将通过一组 Python\
  \ 示例，演示可用于变换图像的不同技术。\n\n### 调整大小\n\n让我们从第一个变换——调整大小开始。调整图像大小时，我们需要增加或减少图像的高度和宽度。调整图像大小时需要记住的一个重要概念是*宽高比*，即宽度与高度的比例，通过宽度除以高度计算得出。计算宽高比的公式如下：\n\
  \n*   *宽高比 = 宽度 / 高度*\n\n正方形图像的宽高比为 1:1，而宽高比为 3:1 意味着宽度是高度的三倍。如果图像的高度为 300 像素，宽度为\
  \ 600 像素，则其宽高比为 2:1。\n\n调整图像大小时，保持原始宽高比可以确保调整后的图像不会显得拉伸或压缩。\n\n清单 3-1 展示了两种不同的图像调整大小技术：\n\
  \n*   将图像调整为所需的像素尺寸，同时保持宽高比。换句话说，如果你知道图像的期望高度，就可以利用原始图像的宽高比计算出相应的宽度。\n*   按比例调整图像大小。例如，将图像宽度放大\
  \ 1.5 倍，或高度放大 2.5 倍。\n\nOpenCV 提供了一个单一函数 `resize()` 来执行这两种调整大小技术。\n\n```\n文件名: Listing_3_1.py\n\
  1    # 使用 resize() 函数进行图像变换\n2    import cv2\n3    import numpy as np\n\n5    #\
  \ 加载图像\n6    imagePath = \"images/zebra.png\"\n7    image = cv2.imread(imagePath)\n\
  \n9    # 获取图像形状，返回高度、宽度和通道数（元组）。计算宽高比\n10   (h, w) = image.shape[:2]\n11   aspect\
  \ = w / h\n\n13   # 将图像高度缩小为原始高度的一半。\n14   # 记住，像素值必须是整数。\n15   height = int(0.5\
  \ * h)\n16   width =  int(height * aspect)\n\n18   # 新的图像尺寸（元组）\n19   dimension\
  \ = (height, width)\n20   resizedImage = cv2.resize(image, dimension, interpolation=cv2.INTER_AREA)\n\
  21   cv2.imshow(\"调整大小后的图像\", resizedImage)\n\n23   # 使用 x 和 y 因子调整大小\n24   resizedWithFactors\
  \ = cv2.resize(image, None, fx=1.2, fy=1.2, interpolation=cv2.INTER_LANCZOS4)\n\
  25   cv2.imshow(\"按因子调整大小\", resizedWithFactors)\n26   cv2.waitKey(0)\n清单 3-1\n\
  计算宽高比并调整图像大小的代码\n```\n\n清单 3-1 展示了如何使用 OpenCV 的 `resize()` 函数调整图像大小，该函数接受以下参数：\n\
  \n*   第一个参数是原始图像，以 NumPy 数组表示。\n*   第二个参数是目标调整尺寸。这是一个整数元组，表示调整后图像的高度和宽度。如果希望使用水平或垂直因子调整大小（稍后说明），则将此参数传递为\
  \ `None`。\n*   第三和第四个参数 `fx` 和 `fy` 分别是水平方向（宽度方向）和垂直方向（高度方向）的缩放因子。这两个参数是可选的。\n*\
  \   最后一个参数是插值方法。这是 OpenCV 内部用于调整图像大小的算法名称。*插值*是在调整图像大小时计算像素值的过程。OpenCV 支持以下五种插值算法：\n\
  \    *   `INTER_LINEAR`：这是一种双线性插值，确定四个最近邻像素（2×2 = 4），并计算它们的加权平均值以确定下一个像素的值。\n  \
  \  *   `INTER_NEAREST`：使用最近邻插值方法，在给定某个空间内某函数在邻近点值的情况下，近似该函数在非给定点的值。换句话说，为了计算一个像素的值，会考虑其最近邻像素来近似插值函数。\n\
  \n\n\n*   `INTER_CUBIC:` 该算法使用双三次插值算法计算像素值。与双线性插值类似，它利用 4×4 = 16 个最近邻像素来确定下一个像素的值。在不考虑速度的情况下，双三次插值生成的缩放图像质量优于双线性插值。\n\
  \n*   `INTER_LANCZOS4:` 该算法使用 8×8 最近邻插值。\n\n*   `INTER_AREA:` 该算法通过像素区域关系（如 OpenCV\
  \ 官方文档所述）计算像素值。使用此算法可生成无摩尔纹的缩放图像。当图像尺寸放大时，`INTER_AREA` 的效果类似于 `INTER_NEAREST` 方法。\n\
  \n让我们检查清单 3-1 中的代码。\n\n第 2 行和第 3 行是库的导入。\n\n第 6 行指定图像路径，第 7 行将图像读取为 NumPy 数组并赋值给名为\
  \ `image` 的变量。\n\nNumPy 的 `shape` 函数返回数组内对象的维度。对图像调用 `shape` 函数会返回一个包含高度、宽度和通道数的元组。第\
  \ 10 行通过指定索引长度为 2（`image.shape[,:2]`）仅获取高度和宽度。高度和宽度分别存储在变量 `h` 和 `w` 中。\n\n如果我们不指定索引长度，它将返回包含高度、宽度和通道数的元组，如下所示：\n\
  \n```\n(h, w, c) = image.shape[:]\n```\n\n在此示例中，我们希望将图像尺寸缩小 50%，同时保持原始宽高比。我们可以简单地将原始高度和宽度乘以\
  \ 0.5 来获得所需的高度和宽度。如果我们只知道所需的高度，则可以通过将原始新高度乘以宽高比来计算所需的宽度。这在第 16 行和第 17 行中进行了演示。\n\
  \n第 20 行将所需的高度和宽度设置为一个元组。\n\n第 21 行调用 OpenCV 的 `resize()` 函数，并将原始图像 NumPy 数组、所需尺寸以及插值算法（本例中为\
  \ `INTER_AREA`）作为参数传递给 `resize()` 函数。\n\n第 24 行演示了当我们知道图像高度或宽度（或两者）需要增加或减少的倍数时，使用第二种方法进行缩放操作。在此示例中，高度和宽度均放大了\
