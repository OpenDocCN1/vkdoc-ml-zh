  \ 模型\n```\n\n### 数据转换\n\n我们将把 NEU 数据集转换为 TFRecord 格式（回顾第 6 章的 SSD 模型训练部分）。代码清单 9-2\
  \ 是基于 TensorFlow 的代码，用于将图像和注释转换为 TFRecord。\n\n```\n文件名：generic_xml_to_tf_record.py\n\
  1    import hashlib\n2    import io\n3    import logging\n4    import os\n\n6  \
