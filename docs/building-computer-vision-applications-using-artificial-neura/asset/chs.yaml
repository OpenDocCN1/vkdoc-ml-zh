  *图像* *减法*是指将一幅图像的像素值减去另一幅图像对应位置的像素值。我们也可以从图像像素中减去一个常数。当对两幅图像进行减法时，务必注意这两幅图像必须具有相同的尺寸和深度。\n\
  \n当我们对一幅图像自身进行减法时会发生什么？结果图像的所有像素值都将为零，从而生成一幅全黑的图像。这一特性在检测图像中的任何变化/改动时非常有用。如果没有变化，两幅图像相减的结果将是一幅全黑的图像。\n\
  \n图像减法的另一个原因是平衡图像中任何不均匀的区域或阴影。\n\n我们将通过清单 3-7 中的代码示例，看到图像减法的一些有趣结果。\n\n```\n文件名:\
