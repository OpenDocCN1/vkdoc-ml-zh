  \n\n\n## 分割与合并通道\n\n回顾第 2 章，彩色图像由多个通道（R,G,B）组成。你已经学会了如何访问这些通道并将其表示为 NumPy 数组。在本节中，你将学习如何分割这些通道并将它们存储为单独的图像。OpenCV\
  \ 提供了一个便捷的函数 `split()` 来实现这一功能。使用这个 `split()` 函数，我们可以将图像分割成各自的颜色分量。代码清单 3-10 是一个演示此功能的工作示例。在这个示例中，我们将再次使用“自然”图像（如前文图\
  \ 3-32 所示），并将其分割成各个颜色分量。\n\n```\n文件名: Listing_3_10.py\n1    import cv2\n2    import\
  \ numpy as np\n\n4    # 加载图像\n5    natureImage = cv2.imread(\"images/nature.jpg\"\
  )\n\n7    # 将图像分割成颜色分量\n8    (b,g,r) = cv2.split(natureImage)\n\n10   # 显示蓝色图像\n\
