  \ GCS 存储桶。\n\n\n\n#### 通过 Web 界面创建 GCS 存储桶\n\n要通过 Web 界面创建存储桶，请按照以下步骤操作：\n\n![](img/493065_2_En_10_Fig6_HTML.jpg)\n\
