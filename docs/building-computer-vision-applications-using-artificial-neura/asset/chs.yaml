  \n如果身份验证成功，您将登录到虚拟机。\n\n\n\n### 安装 GPU 驱动和库\n\n要在基于 GPU 的机器上运行 TensorFlow，我们需要安装\
  \ GPU 驱动和一些库。请执行以下步骤：\n\n1.  在终端上执行清单 10-10 中的所有命令（确保您已通过 SSH 登录）。\n\n    ```\n\
  \    # 添加 NVIDIA 软件包仓库\n    $ wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu1804/x86_64/cuda-repo-ubuntu1804_10.1.243-1_amd64.deb\n\
  \    $ sudo dpkg -i cuda-repo-ubuntu1804_10.1.243-1_amd64.deb\n    sudo apt-key\
  \ adv --fetch-keys $ https://developer.download.nvidia.com/compute/cuda/repos/ubuntu1804/x86_64/7fa2af80.pub\n\
  \    $ sudo apt-get update\n    $ wget http://developer.download.nvidia.com/compute/machine-learning/repos/ubuntu1804/x86_64/nvidia-machine-learning-repo-ubuntu1804_1.0.0-1_amd64.deb\n\
  \    $ sudo apt install ./nvidia-machine-learning-repo-ubuntu1804_1.0.0-1_amd64.deb\n\
  \    sudo apt-get update\n    清单 10-10\n    添加 NVIDIA 软件包仓库的命令\n    ```\n\n2.  如果\
  \ NVIDIA 软件包仓库添加成功，则使用清单 10-11 中的命令安装 NVIDIA 驱动。\n\n    ```\n    $ sudo apt-get\
  \ install --no-install-recommends nvidia-driver-418\n    清单 10-11\n    安装 NVIDIA\
  \ 驱动\n    ```\n\n3.  您需要重启虚拟机以使之前的安装生效。在 SSH 终端 shell 中，执行命令 `sudo reboot`。\n\n\
  4.  再次通过 SSH 连接到虚拟机。\n\n5.  要测试 NVIDIA 驱动是否成功安装，请执行以下命令：\n\n    ```\n    $ nvidia-smi\n\
