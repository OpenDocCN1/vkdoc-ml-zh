  \n*   *加载图像* *(第 9 至 24 行)*：如前所述，我们的训练和测试图像存储在目录中。为了加载这些图像用于训练和验证，我们使用了 Keras 提供的一个强大类\
  \ `ImageDataGenerator`。以下是关于我们如何使用这个类的逐行解释：\n\n第 9 行和第 10 行是包含训练和测试图像子目录的目录。\n\n\
  第 14 行初始化了 `ImageDataGenerator` 类。我们传递了参数 `rescale = 1/255`，因为我们希望将像素值归一化到 0 到 1\
