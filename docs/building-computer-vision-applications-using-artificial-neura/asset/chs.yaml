  \ `video_tracking` 被选中。\n\n图 7-2\n\n在 PyCharm 中将目录标记为源目录\n\n\n\n## 读取视频流\n\nOpenCV\
  \ 提供了便捷的方法来连接视频源并从视频帧中读取图像。这些帧中的图像会被 OpenCV 内部转换为 NumPy 数组。这些 NumPy 数组会经过进一步处理，以检测和跟踪其中的物体。检测过程计算量很大，可能无法跟上读取帧的速度。因此，在主线程中读取帧并执行检测操作会表现出较慢的性能，尤其是在处理高清（HD）视频时。在代码清单\
  \ 7-1 中，我们将实现用于捕获帧的多线程处理。我们将其称为视频帧的*异步读取*。\n\n```\n1    # file: videoasync.py\n\
  2    import threading\n3    import cv2\n\n5    class VideoCaptureAsync:\n6     \
  \   def __init__(self, src=0):\n7            self.src = src\n8            self.cap\
  \ = cv2.VideoCapture(self.src)\n9            self.grabbed, self.frame = self.cap.read()\n\
  10           self.started = False\n11           self.read_lock = threading.Lock()\n\
  \n13       def set(self, key, value):\n14           self.cap.set(key, value)\n\n\
  16       def start(self):\n17           if self.started:\n18               print('[Warning]\
  \ Asynchronous video capturing is already started.')\n19               return None\n\
  20           self.started = True\n21           self.thread = threading.Thread(target=self.update,\
  \ args=())\n22           self.thread.start()\n23           return self\n\n25   \
  \    def update(self):\n26           while self.started:\n27               grabbed,\
  \ frame = self.cap.read()\n28               with self.read_lock:\n29           \
  \        self.grabbed = grabbed\n30                   self.frame = frame\n\n32 \
  \      def read(self):\n33           with self.read_lock:\n34               frame\
  \ = self.frame.copy()\n35               grabbed = self.grabbed\n36           return\
  \ grabbed, frame\n\n38       def stop(self):\n39           self.started = False\n\
  40           # self.cap.release()\n41           # cv2.destroyAllWindows()\n42  \
  \         self.thread.join()\n\n44       def __exit__(self, exec_type, exc_value,\
  \ traceback):\n45           self.cap.release()\n代码清单 7-1\n视频帧异步读取的实现\n```\n\n文件\
  \ `videoasync.py` 实现了 `VideoCaptureAsync` 类（第 5 行），该类包含一个构造函数以及用于启动线程、读取帧和停止线程的函数。\n\
  \n第 6 行定义了一个构造函数，该函数将视频源作为参数。此源的默认值 `src=0`（也称为*设备索引*）表示来自笔记本电脑/计算机内置摄像头的输入。如果你有\
  \ USB 摄像头，请相应地设置此 `src` 的值。如果你的计算机端口连接了多个摄像头，没有标准的方法来查找设备索引。一种方法是从起始索引 0 开始循环，直到连接到设备。你可以打印设备属性来识别要连接的设备。对于基于\
  \ IP 的摄像头，请传入 IP 地址或 URL。\n\n如果你的视频源是文件，请传入视频文件的路径。\n\n第 8 行使用 OpenCV 的 `VideoCapture()`\
  \ 函数，并传入源 ID 以连接到视频源。分配给 `self.cap` 变量的 `VideoCapture` 对象用于读取帧。\n\n第 9 行读取第一帧并占用与摄像头的连接。\n\
  \n第 10 行是用于管理锁的标志。第 11 行实际获取线程锁。\n\n第 13 和 14 行实现了一个函数，用于设置 `VideoCapture` 对象的属性，例如帧高度、宽度和每秒帧数（FPS）。\n\
  \n第 16 到 23 行实现了 `start()` 函数，用于启动线程以进行异步读取帧。\n\n第 25 到 30 行实现了 `update()` 函数，用于读取帧并更新类级别的帧变量。`update()`\
  \ 函数在第 21 行的 `start()` 函数内部使用，以异步读取视频帧。\n\n第 32 到 36 行实现了 `read()` 函数，该函数仅返回在 `update()`\
  \ 函数块中更新的帧。此函数还返回一个布尔值，指示帧是否已成功读取。\n\n第 38 到 40 行实现了 `stop()` 函数，用于停止线程并将控制权返回给主线程。`join()`\
  \ 函数会阻止主线程关闭，直到子线程完成其执行。\n\n退出时，视频源被释放（第 45 行）。\n\n现在，我们将编写代码来利用异步视频读取模块。在同一个目录\
  \ `video_tracking` 中，我们将创建一个名为 `object_tracker.py` 的 Python 文件，该文件实现以下功能。\n\n##\
  \ 加载物体检测模型\n\n我们将使用与第 6 章中用于检测图像中物体相同的预训练 SSD 模型。如果你基于自己的图像训练了模型，则可以使用该模型；只需提供模型目录的路径即可。代码清单\
  \ 7-2 展示了如何从磁盘加载训练好的模型。回想一下，这与我们在第 6 章的代码清单 6-11 中使用的函数相同。我们将只加载模型一次，并将其用于检测所有帧中的物体。\n\
  \n```\n43   # # Model preparation\n44   def load_model(model_path):\n45      model_dir\
  \ = pathlib.Path(model_path) / \"saved_model\"\n46      model = tf.saved_model.load(str(model_dir))\n\
  47      model = model.signatures['serving_default']\n48      return model\n\n50\
