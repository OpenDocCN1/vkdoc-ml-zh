  \ 仓库。\n\n```\n1    %%shell\n2    export PYTHONPATH=$PYTHONPATH:/content/facenet\n\
  3    export PYTHONPATH=$PYTHONPATH:/content/facenet/src\n4    for N in {1..10};\
