  \n## 创建 data.yaml 文件\n\n`data.yaml` 文件由训练函数用于定位与训练集、测试集和验证集对应的图像和标签。`data.yaml`\
  \ 文件已存在于数据集目录 `/content/safety-Helmet-Reflective-Jacket` 中。编辑此文件以匹配图 6-36 中显示的条目。\n\
