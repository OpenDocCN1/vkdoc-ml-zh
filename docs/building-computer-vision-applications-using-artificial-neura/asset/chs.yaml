  \ | 0.058 | 17 | 是 |\n\n\n\n## 使用 TensorFlow 训练目标检测模型\n\n我们现在准备编写代码来构建和训练我们自己的目标检测模型。我们将使用\
  \ TensorFlow API 并用 Python 编写代码。目标检测模型对计算资源要求很高，需要大量内存和强大的处理器。大多数通用笔记本电脑或计算机可能无法处理构建和训练目标检测模型所需的计算。例如，一台配备\
  \ 32GB 内存和八核 CPU 的 MacBook Air 无法训练涉及约 7000 张图像的检测模型。幸运的是，谷歌免费提供有限的基于 GPU 的计算资源。事实证明，这些模型在\
  \ GPU 上的运行速度比在 CPU 上快很多倍。因此，学习如何在 GPU 上训练模型非常重要。出于演示和学习的目的，我们将使用谷歌 GPU 的免费版本。让我们首先明确我们的学习目标以及我们想要如何实现它。\n\
  \n*   *目标*：学习如何使用 Keras 和 TensorFlow 训练目标检测模型。\n\n*   *数据集*：Oxford-IIIT Pet 数据集，可免费从\
  \ [`https://robots.ox.ac.uk/~vgg/data/pets/`](https://robots.ox.ac.uk/~vgg/data/pets/)\
  \ 获取。该数据集包含 37 个类别的宠物，每个类别大约有 200 张图像。这些图像在尺度、姿态和光照方面差异很大。它们已经用边界框进行了标注和标记。\n\n\
