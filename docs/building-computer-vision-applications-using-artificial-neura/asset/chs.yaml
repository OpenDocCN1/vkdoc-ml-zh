  \ 实现 VGG-16 网络。\n\n### 本章小结\n\n本章提供了对人工神经网络和卷积神经网络的基础理解。我们实现了基于 TensorFlow 的代码来训练我们的\
  \ ANN 和 CNN 模型，评估了模型性能，并将保存的模型应用于图像分类任务。此外，我们探索了超参数调优的过程，并利用 TensorBoard 中的 HParams\
  \ 仪表板来可视化和分析模型性能。最后，我们概述了三种流行的 CNN 架构——LeNet-5、AlexNet 和 VGG-16，以理解它们各自的特点和应用。\n\
  \n贯穿本章，主要焦点是解决分类问题，即训练我们的模型将输入图像分类到不同的类别中。\n\n在此基础之上，第 6 章将介绍并探讨对图像中物体进行检测的关键技术和方法。我们将探索物体检测任务中使用的基本原理、算法和架构，为理解计算机视觉这一重要方面提供基础框架。\n\
  \n"
- "# 6. 深度学习在物体检测中的应用\n\n第 5 章介绍了如何使用标准多层感知器（MLP）和卷积神经网络（CNN）对图像进行分类。在分类任务中，我们的重点是预测整个图像的类别，而不考虑其中存在的特定物体。在本章中，我们将探讨如何检测物体并确定它们在图像中的位置。\n\
  \n本章的学习目标如下：\n\n*   探索物体检测中使用的流行深度学习算法\n\n*   使用 TensorFlow 在 GPU 上训练自定义物体检测模型\n\
  \n*   使用训练好的模型预测图像中的物体\n\n本章介绍的概念将在后续三章中应用，以开发实际场景中的实用计算机视觉应用。\n\n## 物体检测\n\n*物体检测*\
  \ 涉及两组不同的活动：定位物体和分类物体。在图像中定位物体称为*物体定位*，通常通过在物体周围绘制边界框来执行。在深度学习算法流行之前，物体定位是通过标记图像中包含物体的每个像素来执行的。例如，物体检测是使用诸如边缘检测和绘制轮廓（这两种技术在第\
  \ 3 章中均有介绍）以及 HOG（在第 4 章中介绍）等技术来执行的。使用这些技术进行物体定位计算量大、速度慢，并且通常缺乏准确性。\n\n如第 5 章所述，*物体分类*\
  \ 指的是为图像中的物体分配特定的标签或类别。\n\n基于深度学习的物体检测技术相比不使用深度学习的算法，展现出了卓越的速度和准确性。尽管在基于深度学习的物体检测中，学习过程计算量很大，但实际的检测过程快速且非常适合实时物体检测。利用基于深度学习的物体检测的应用示例包括：\n\
  \n*   自动驾驶汽车\n\n*   机场安检系统\n\n*   视频监控系统\n\n*   工业生产过程中的缺陷检测\n\n*   工业质量保证系统\n\n\
  *   人脸识别技术\n\n用于物体检测的深度学习算法随着时间的推移而不断发展。在本章中，我们将探讨用于物体检测的两种不同的卷积神经网络变体：两步卷积和单步卷积。*基于区域的卷积神经网络（R-CNN）*\
  \ 是一种两步算法。*你只看一次（YOLO）* 和*单次多框检测（SSD）* 是用于物体检测的单步算法示例。\n\n在我们深入探讨物体检测算法之前，有必要确立物体检测器中广泛使用的一个基本指标的定义。\n\
  \n\n\n## 交并比\n\n*交并比（IoU）*，也称为*杰卡德指数*，是目标检测算法中最常用的评估指标之一。它用于衡量任意两个形状的相似度。\n\n在目标检测中，我们通过围绕物体绘制边界框来创建训练集并进行标注。训练集中的这些边界框也被称为*真实标注*。在模型学习过程中，目标检测算法会预测边界框，并将其与真实标注进行比较。IoU\
  \ 用于评估预测边界框与真实标注的重叠程度。\n\n预测边界框 A 与真实标注框 B 之间的 IoU 通过图 6-1 所示的公式计算。\n\n![](img/493065_2_En_6_Fig1_HTML.png)\n\
  \n图示展示了交并比公式，该公式通过将 A 和 B 两个物体的交集面积除以它们的并集面积来衡量两者之间的重叠程度。\n\n图 6-1\n\nIoU\n\n当我们标注一张图像时，通常会在图像中的物体周围绘制矩形框。这个围绕物体的矩形区域就是真实标注。在图\
  \ 6-2 中，真实标注由绿色矩形框表示。\n\n当算法学习时，它会预测围绕物体的边界框。在图 6-2 中，红色矩形区域是预测边界框。\n\n![](img/493065_2_En_6_Fig2_HTML.jpg)\n\
  \n交并比示意图，展示了预测边界框与真实标注边界框之间的关系，并附有用于评估汽车照片匹配质量的相应 IoU 阈值。\n\n图 6-2\n\nIoU，预测边界框与真实标注相交\n\
  \n学习算法计算真实标注与预测边界框之间的 IoU。如果它们之间的 IoU 低于 50%，则认为预测与真实标注的匹配度较差。如果 IoU 在 50% 到 95%\
  \ 之间，则认为匹配良好。IoU 大于 95% 则被认为是极佳的匹配。\n\n目标检测算法的学习目标是优化 IoU。这个优化过程涉及微调算法参数，并在标注数据集上训练模型，以获得更高的\
  \ IoU 值，这表明目标检测性能得到了提升。\n\n现在，让我们探索目标检测中使用的各种深度学习算法。我们还将回顾它们的优缺点以及它们之间的比较。\n\n##\
  \ 基于区域的卷积神经网络\n\nR-CNN 是第一个成功使用大型卷积神经网络检测图像中物体的模型。该检测方法由 Ross Girshick 等人在其 2014\
  \ 年的论文《用于精确目标检测和语义分割的丰富特征层次结构》（[`https://arxiv.org/pdf/1311.2524.pdf`](https://arxiv.org/pdf/1311.2524.pdf)）中描述。图\
  \ 6-3 展示了 R-CNN 方法。\n\nR-CNN 包含以下三个模块：\n\n*   *区域提议*：R-CNN 算法首先在图像中寻找可能包含物体的区域。这些区域被称为*区域提议*。它们被称为*提议*，是因为这些区域可能包含也可能不包含物体，而学习函数的目标是排除那些不包含物体的区域。这些区域提议就是围绕物体的边界框（如图\
  \ 6-3 中的图 2 所示）。\n\n    Girshick 等人提出的 R-CNN 系统与寻找区域提议的算法无关。这意味着你可以使用任何算法，例如 HOG，来寻找区域。他们使用了一种称为*选择性搜索*的算法，该算法通过不同大小的网格来观察图像。对于每种网格大小，算法尝试通过比较纹理、颜色或像素值来将相邻像素分组，从而识别物体。该算法使用这种方法来创建区域提议。总之，该算法会创建一组潜在目标物体的边界框。\n\
  \n*   *特征提取*：将区域提议从图像中裁剪出来并调整大小。然后将这些裁剪后的图像输入到标准的 CNN 中以提取特征（见图 6-3 中的图 3）。根据原始论文，使用了\
  \ AlexNet 深度学习 CNN 进行特征提取。从每个区域中提取出 4,096 维的特征向量。\n\n*   *分类器*：使用标准的分类算法（例如线性 SVM\
  \ 模型）对提取的特征进行分类（图 6-3 中的图 4）。\n\n    ![](img/493065_2_En_6_Fig3_HTML.jpg)\n\n  \
  \  一个框图概述了分析和分类图像内区域的过程，涉及提取区域提议、扭曲区域、使用卷积神经网络计算特征，以及分类物体（如人），同时排除其他物体（如飞机或电视显示器）。\n\
  \n    图 6-3\n\n    R-CNN 模型（来源：Girshick 等人，[`​arxiv.​org/​pdf/​1311.​2524.​pdf`](https://arxiv.org/pdf/1311.2524.pdf)）\n\
  \n尽管 R-CNN 是第一个成功的基于深度学习的目标检测系统，但它在性能方面存在严重问题。其时间性能问题源于以下几点：\n\n*   每个区域提议都被传递给\
  \ CNN 进行特征提取。每张图像可能需要大约 2,000 次这样的传递。\n*   需要训练三个不同的模型：用于特征提取的 CNN、用于预测图像类别的分类器模型，以及用于收紧边界框的回归模型。训练过程计算量大，增加了计算时间。\n\
  *   每个区域提议都需要进行预测。由于区域数量众多，CNN 的预测速度很慢。\n\n\n\n## Fast R-CNN\n\n为了克服 R-CNN 的局限性，微软的\
  \ Ross Girshick 在 2015 年发表了一篇题为“Fast R-CNN”的论文，提出了一种能够直接学习并输出区域和分类的单一模型（[`https://arxiv.org/pdf/1504.08083.pdf`](https://arxiv.org/pdf/1504.08083.pdf)）。\n\
  \nFast R-CNN 也使用一种算法（例如边缘框）来生成区域提议。与 R-CNN 对区域提议进行裁剪和调整大小不同，Fast R-CNN 处理的是整个图像。Fast\
  \ R-CNN 并非对每个区域进行分类，而是汇集与每个区域提议相对应的 CNN 特征。\n\n图 6-4 展示了 Fast R-CNN 的架构。它以整个图像作为输入，并生成一组区域提议。深度\
  \ CNN 的最后一层有一个特殊的层，称为*感兴趣区域（ROI）*池化层。ROI 池化层从特征图中提取一个固定长度的特征向量，该特征向量特定于给定的输入候选区域。\n\
  \n![](img/493065_2_En_6_Fig4_HTML.jpg)\n\n一张照片展示了与深度学习和目标检测相关的组件，包括 softmax、边界框、回归器、卷积神经网络、感兴趣区域池化、全连接层、特征图以及用于每个感兴趣区域的特征向量。\n\
  \n图 6-4\n\nFast R-CNN 架构（来源：Ross Girshick，[`​arxiv.​org/​pdf/​1504.​08083.​pdf`](https://arxiv.org/pdf/1504.08083.pdf)）\n\
  \n来自 ROI 池化的每个 ROI 特征向量被输入到一个全连接的 MLP 中，该 MLP 生成两组输出——一组用于对象类别，另一组用于边界框。softmax\
  \ 激活函数预测对象类别，而线性回归器则生成与预测类别相对应的边界框。此过程对来自 ROI 池化的每个感兴趣区域重复进行。\n\n正如原始论文所述，Ross Girshick\
  \ 将 Fast R-CNN 与 VGG16 应用于 Microsoft COCO 数据集，以建立一个初步基准。COCO 数据集（[`https://cocodataset.org/`](https://cocodataset.org/)）是一个大规模的目标检测、分割和描述数据集，可免费在公共领域获取。Fast\
  \ R-CNN 的训练集包含 80,000 张图像，训练迭代了 240,000 个周期。模型质量评估如下：\n\n*   在 PASCAL 目标数据集上的平均精度均值（mAP）：35.9%\n\
  *   在 COCO 数据集上的平均精度（AP）：19.7%\n\n与 R-CNN 相比，Fast R-CNN 在训练和预测方面快得多。然而，它仍然需要为每张输入图像提供一组候选区域提议，并由一个单独的模型来预测这些区域。\n\
  \n## Faster R-CNN\n\n微软研究院的任少卿等人在 2016 年发表了一篇题为“Faster R-CNN: Towards Real-Time\
  \ Object Detection with Region Proposal Networks”的论文（[`https://arxiv.org/pdf/1506.01497.pdf`](https://arxiv.org/pdf/1506.01497.pdf)）。该论文从训练速度和检测精度的角度描述了\
  \ Fast R-CNN 的改进版本。除了区域提议方法外，Faster R-CNN 在架构上与 Fast R-CNN 相似。\n\nFaster R-CNN 架构包含一个*区域提议网络（RPN）*，该网络与检测网络共享全图的卷积特征，从而实现了近乎零成本的区域提议。RPN\
  \ 是一个全卷积网络。它同时预测图像中每个位置的对象边界和对象性得分。RPN 经过端到端训练，以生成高质量的区域提议。这些区域提议被 Fast R-CNN 用于检测。如图\
  \ 6-5 所示。\n\n![](img/493065_2_En_6_Fig5_HTML.jpg)\n\n一张示意图展示了区域提议网络如何从图像生成区域提议。这些提议随后通过卷积层和\
  \ ROI 池化进行处理，以提取特征图。\n\n图 6-5\n\n带有 RPN 的 Faster R-CNN，一个用于更快目标检测的统一网络（来源：任少卿等人，[`​arxiv.​org/​pdf/​1506.​01497.​pdf`](https://arxiv.org/pdf/1506.01497.pdf)）\n\
  \nFaster R-CNN 由两部分组成：RPN 和 Fast R-CNN。\n\n### 区域提议网络\n\nRPN 是一个深度 CNN，它以图像作为输入，并生成一组矩形对象提议作为输出。每个矩形提议都有一个对象性得分。\n\
  \n图 6-6 展示了 RPN 如何生成区域提议。我们取最后一个共享卷积层生成的卷积特征图，并在其上滑动一个小型网络。这个小网络将输入卷积特征图的一个 *n*×*n*\
  \ 空间窗口作为输入。每个滑动窗口都被映射到一个低维特征，例如对于 AlexNet 是 256 维特征，对于 VGG-16 是 5,126 维特征。\n\n![](img/493065_2_En_6_Fig6_HTML.jpg)\n\
  \n一张示意图和照片展示了目标检测的结果，分类器生成了 2k 个得分和 4k 个坐标。列出了各种对象及其相关得分，并使用锚框作为参考。中间层和卷积特征图在此过程中发挥作用。\n\
  \n图 6-6\n\n使用滑动窗口和锚点进行区域检测（来源：任少卿等人，[`https://arxiv.org/pdf/1506.01497.pdf`](https://arxiv.org/pdf/1506.01497.pdf)）\n\
  \n该特征被输入到两个并列的全连接层——一个用于预测边界框的框回归层，以及一个用于预测对象类别的框分类层。\n\n在每个滑动窗口位置预测多个区域提议。假设每个窗口位置的最大提议数为\
  \ k，则边界框坐标的总数为 4k，对象类别的数量为 2k（一个用于作为对象的概率，另一个用于不作为对象的概率）。每个窗口处的这些区域框被称为*锚点*。\n\n\
  ### Fast R-CNN\n\nFaster R-CNN 的第二部分是检测网络。这部分与 Fast R-CNN（如前所述）完全相同。Fast R-CNN 接收来自\
  \ RPN 的输入，以检测图像中的对象。\n\n\n\n## Mask R-CNN\n\nMask R-CNN 是对 Faster R-CNN 的扩展。Faster\
  \ R-CNN 因其检测速度快而被广泛用于目标检测任务。我们已经知道，对于给定的图像，Faster R-CNN 会预测图像中每个对象的类别标签和边界框坐标。Mask\
  \ R-CNN 增加了一个额外的分支，用于在预测对象类别和边界框坐标的同时，预测对象掩码（请回顾第 3 章中关于掩码的概念）。\n\n以下是 Mask R-CNN\
  \ 与其前身 Faster R-CNN 的不同之处：\n\n*   Faster R-CNN 有两个输出：类别标签和边界框坐标。\n*   Mask R-CNN\
  \ 有三个输出：类别标签、边界框坐标和对象掩码。\n\nRoss Girshick 等人在其 2017 年的论文《Mask R-CNN》（[`https://arxiv.org/pdf/1703.06870.pdf`](https://arxiv.org/pdf/1703.06870.pdf)）中阐述了\
  \ Mask R-CNN。在 Mask R-CNN 中，每个像素被分类到一组固定的类别中，而不区分对象实例。它引入了一个称为*像素到像素对齐*的概念，用于神经网络的输出层和输入层之间。每个像素的类别决定了\
  \ ROI 中的掩码。\n\n图 6-7 展示了 Mask R-CNN 的网络架构。\n\n![](img/493065_2_En_6_Fig7_HTML.png)\n\
  \n一个框图展示了 Faster R-CNN 模型的架构。它从输入图像开始，通过 ResNet-50 骨干网络处理，并将其馈送到区域提议网络。Faster R-CNN\
  \ 分为类别、边界框和掩码。\n\n图 6-7\n\n在 Faster R-CNN 中增加了额外掩码预测分支的 Mask R-CNN\n\n如图 6-7 所示，该网络由三个模块组成：骨干网络、RPN\
  \ 和输出头。\n\n### 骨干网络\n\n骨干网络是标准的深度神经网络。原始的 Mask R-CNN 论文描述了使用 ResNet-50 和 ResNet-101。骨干网络的主要作用是特征提取。\n\
  \n除了 ResNet，还使用了*特征金字塔网络（FPN）*来提取图像更精细的特征细节。FPN 由一系列尺寸递减的 CNN 层组成，其中每个前向层的神经元数量更少。如图\
  \ 6-8 所示，每个较高层将特征传递给较低层，并在每一层进行预测。较高层的尺寸较小，这意味着特征尺寸将小于前几层。这种方法在不同尺度上捕获图像的特征，从而能够检测图像中较小的对象。\n\
  \n![](img/493065_2_En_6_Fig8_HTML.jpg)\n\n一幅插图展示了最初的四层，与三个标记为“预测”的层相连。\n\n图 6-8\n\
  \nFPN（来源：Tsung-Yi Lin 等人）\n\nFPN 是骨干网络的附加组件，通常独立于 ResNet 或其他骨干网络执行。FPN 不仅可以添加到 Mask\
  \ R-CNN，还可以添加到 Fast R-CNN，以便能够检测不同大小的对象。\n\n### RPN\n\n如前所述，RPN 模块用于生成区域提议。在 Mask\
  \ R-CNN 中，RPN 架构与 Faster R-CNN 中的相同。\n\n### 输出头\n\n如图 6-8 所示，最后一个模块由一个带有额外输出分支的\
  \ Faster R-CNN 组成。因此，该模块总共生成三个输出。其中两个输出——对象类别和边界框坐标——与 Faster R-CNN 的情况相同。第三个输出是对象掩码，它是一个定义对象轮廓的像素列表。\n\
  \n### 掩码的意义是什么？\n\nMask R-CNN（类似于 Faster R-CNN）生成对象类别和边界框。这两者的结合帮助我们定位图像中的对象。网络输出的掩码用于对象分割。这种对象分割广泛用于光学字符识别（OCR），以从文档中提取文本。Mask\
  \ R-CNN 的另一个应用示例是在机场安检中，旅客的行李被扫描并通过掩码进行可视化。图 6-9 展示了 Mask R-CNN 的典型显示效果。\n\n![](img/493065_2_En_6_Fig9_HTML.jpg)\n\
  \n8 张照片展示了不同场景中的人物和物体，它们被不同深浅的颜色所掩码。\n\n图 6-9\n\n带有边界框和掩码的图像显示（来源：Ross Girshick\
  \ 等人）\n\n### Mask R-CNN 在人体姿态估计中的应用\n\nMask R-CNN 的一个有趣用途是估计人体姿态。该网络可以扩展，将关键点的位置建模为独热掩码。关键点定义为图像上的兴趣点。对于人体，这些关键点代表主要关节，如肘部、肩部或膝盖。关键点的选择应使其不随旋转、移动、缩放、平移和扭曲而改变。Mask\
  \ R-CNN 被训练来预测 *K* 个掩码，每个掩码对应 *K* 种关键点类型之一（例如，左肩、右肘）。见图 6-10。\n\n![](img/493065_2_En_6_Fig10_HTML.jpg)\n\
  \n12 张照片展示了不同场景中不同姿态的人物，它们被不同深浅的颜色所掩码。\n\n图 6-10\n\n使用关键点预测进行人体姿态估计的显示（来源：Ross Girshick\
  \ 等人）\n\n为了训练一个网络来估计人体姿态，训练图像会标记有实例对象的 *K* 个关键点。对于每个关键点，训练目标是一个独热的 *m*×*m* 二值掩码，其中只有一个像素被标记为前景。\n\
  \n根据原始论文，作者使用了一种 ResNet-FPN 架构的变体作为特征提取骨干网络。头部架构（或输出模块）类似于常规的 Mask R-CNN。关键点头部由八个\
  \ 3×3 512 维卷积层堆叠而成，随后是一个反卷积层和 2 倍双线性上采样。这产生了 56×56 的输出分辨率。据估计，关键点级别的定位精度需要相对较高分辨率（与掩码相比）的输出。\n\
  \n## 单次多框检测\n\nR-CNN 及其变体是两阶段检测器。它们有两个专用的网络：一个网络生成区域提议以预测边界框，另一个网络预测对象类别。这些两阶段检测器相当准确，但计算成本很高。这意味着这些检测器不适合实时检测流视频中的对象。\n\
  \n单次目标检测器在网络的单次前向传播中同时预测边界框和对象类别。\n\n单次多框检测（SSD）由 Wei Liu 等人在 2016 年的论文《SSD: Single\
  \ Shot MultiBox Detector》（[`https://arxiv.org/pdf/1512.02325.pdf`](https://arxiv.org/pdf/1512.02325.pdf)）中阐述。首先，我们将回顾\
  \ SSD 的工作原理，然后在后续章节中，我们将使用 TensorFlow 训练一个自定义的 SSD 模型。\n\n### SSD 网络架构\n\nSSD 神经网络由两个组件组成：基础网络和预测/检测网络。\n\
  \n*   *基础网络*：基础网络是一个深度卷积网络，在任何分类层之前被截断。例如，移除 ResNet 或 VGG 的全连接层来创建 SSD 的基础网络。基础网络用于从输入图像中提取特征。\n\
  \n*   *检测网络*：在基础网络上附加一些额外的卷积层，这些层将实际执行边界框和对象类别的预测。检测网络具有以下特征：多尺度特征图以及默认框和宽高比。\n\n\
  \n\n#### 用于检测的多尺度特征图\n\n附加在基础网络末端的卷积层被设计为逐层递减尺寸。这使得网络能够在多个尺度上预测目标。如图 6-11 所示。\n\n\
  ![](img/493065_2_En_6_Fig11_HTML.png)\n\n一个框图，描绘了网络结构中的类别、边界框、锚框以及多尺度特征的目标检测与识别。\n\
  \n图 6-11\n\n尺寸递减的卷积层，用于在不同尺度上预测目标类别和边界框\n\n如图 6-11 所示，每个检测层以及可选的基础网络最后一层，都会预测边界框的四个坐标偏移量和目标类别。边界框和目标是通过*锚框*来预测的，下文将对此进行描述。\n\
  \n##### 用于检测的锚框与卷积预测器\n\n锚点是特征图每个卷积点上设置的一个或多个矩形形状。在图 6-12 中，一个点（蓝色所示）上设置了五个矩形锚框（红色轮廓所示）。\n\
  \n在 SSD 中，通常在每个点上选择五个锚框。每个锚框都充当一个检测器。这意味着特征图的每个位置通常有五个检测器，每个检测器检测五个不同的目标（或没有目标）。这些检测器尺寸的变化使它们能够检测不同大小的目标。较小的检测器会检测较小的目标，而较大的检测器能够检测较大的目标。\n\
  \n![](img/493065_2_En_6_Fig12_HTML.png)\n\n一幅插图，描绘了多个相互重叠的方形框。框的中心有一个中心方块。\n\n图\
  \ 6-12\n\n锚框\n\n在特征图的每个卷积点上（图 6-12 中蓝色所示），算法会预测边界框相对于锚框的偏移量。同时，它还会预测类别分数，以指示每个框中是否存在某个类别的实例。\n\
  \n#### 默认框与宽高比\n\n需要注意的是，这些锚框是预先选定的常量。在 SSD 中，每个卷积点上会映射一组固定的“默认锚框”。\n\n假设每个位置有 *K*\
  \ 个框；我们计算 *C* 个类别分数和相对于默认框的四个偏移坐标。这将导致每个卷积点周围总共有 (*C*+4)×*K* 个滤波器。假设特征图大小为 *m*×*n*，则输出张量大小为\
  \ (*C*+4)×*K*×*m*×*n*。\n\n这些默认锚框应用于每个检测卷积层（如图 6-11 所示）。这些卷积层的尺寸逐层递减，使得这些层能够生成多个不同分辨率的特征图。\n\
  \n图 6-13 展示了整体网络架构。\n\n![](img/493065_2_En_6_Fig13_HTML.jpg)\n\n一个框图，展示了深度卷积神经网络架构\
  \ VGG 16，包含各种卷积层和全连接层，可能用于目标检测或图像分类。图中包含了层类型、维度和关键特征的详细信息。\n\n图 6-13\n\n截断的 VGG\
  \ 主干网络，附加用于检测的卷积层（来源：Liu 等人，[`​arxiv.​org/​pdf/​1512.​02325.​pdf`](https://arxiv.org/pdf/1512.02325.pdf)）\n\
  \n### 训练\n\n用于目标检测的 SSD 模型的训练过程涉及在图像的多个尺度上同时预测目标类别分数和边界框坐标。下面描述了用于优化边界框检测损失函数的训练过程以及目标匹配策略：\n\
  \n#### 匹配策略\n\n在网络训练期间，算法会确定哪些默认框与真实标注框相对应，然后相应地训练网络。为了将默认框与真实标注框匹配，算法使用 IoU 来确定重叠程度。这种基于\
  \ IoU 的重叠也称为 Jaccard 重叠。IoU 阈值设为 0.5，用于判断默认框是否与任何真实标注框重叠。这种使用 IoU 的重叠计算在每个层上执行，使网络能够在不同尺度上学习。SSD\
  \ 的学习过程以默认框作为初始预测，并尝试回归到更接近真实标注边界框的位置。图 6-14 说明了默认框重叠和选择的概念。\n\n![](img/493065_2_En_6_Fig14_HTML.png)\n\
  \n一张标记了交并比值的照片，突出了绿色框（真实标注）与红色框（预测）之间的关系。它指定了不同匹配质量评估的 IoU 阈值，包括 IoU 大于 95%、IoU\
  \ 小于 50% 和 IoU 大于 50%。\n\n图 6-14\n\n默认框与真实标注框的匹配\n\n#### 训练目标\n\nSSD 的学习目标是优化一个损失函数，该函数是所有匹配的默认框上定位损失（loc）和置信度损失（conf）的加权和。\n\
  \n#### 为默认框选择尺度和宽高比\n\nSSD 网络检测层尺寸的递减使其能够学习不同尺度的目标。随着训练的进行，特征图的尺寸会减小。算法如何确定每一层默认框的尺寸呢？\n\
  \n对于每一层，算法使用以下公式计算尺度：\n\n*   *S*[*k*] *= S*[*min*] *+ {(S*[*max*] *− S*[*min*]*)/(\
  \ m − 1)} (k − 1)，其中 k ∈ [1, m]*\n\n其中 *m* 是特征图的尺寸，最低层的 *S*[*min*] = 0.2，最高层的 *S*[*max*]\
  \ = 0.9。中间的所有其他层均匀分布。回想一下，SSD 中使用了五个默认框。这些默认框针对不同的宽高比设置：*a*[*r*] ∈ {1, 2, 3, ½,\
  \ ![](img/493065_2_En_6_Figa_HTML.gif) 给定值为 1 比 3。}。每个默认框的宽度和高度使用以下公式计算：\n\n*  \
  \ 宽度 = ***S***[***k***] ![$$ \\sqrt{{\\boldsymbol{a}}_{\\mathbf{r}}} $$](img/493065_2_En_6_Chapter_TeX_IEq1.png)\n\
  \n*   高度 = ***S***[***k***] ***/*** ![$$ \\sqrt{{\\boldsymbol{a}}_{\\mathbf{r}}}\
  \ $$](img/493065_2_En_6_Chapter_TeX_IEq2.png)\n\n对于宽高比为 1 的情况，会计算另一个尺度为 ***S’***[***k***]=\
  \ ![$$ \\sqrt{\\left({S}_k{S}_{k+1}\\right)} $$](img/493065_2_En_6_Chapter_TeX_IEq3.png)\
  \ 的框。这意味着每个特征图确定了六个默认框。默认框的中心使用以下公式设置：*( (i+0.5)/ |fk| , (j+0.5)/ |fk| )*，其中 *|fk|*\
  \ 是第 k 个方形特征图的尺寸，i, j **∈** [0, |fk|)。\n\n通过结合来自多个特征图所有位置、具有不同尺度和宽高比的所有默认框的预测，可以生成多样化的预测集。这涵盖了各种输入目标的大小和形状。\n\
  \n我们将在接下来的“YOLO”部分看到，YOLO 使用 K-means 聚类来动态选择锚框。此外，在 YOLO 中，这些锚框被称为*先验框*或*边界框先验*。\n\
  \n\n\n#### 难例负样本挖掘\n\n在每一层和每个特征图上，都会生成大量默认边界框。在与真实标注框（IoU ≥ 0.5）匹配后，这些默认边界框中的大部分不会与真实标注框重叠。这些不重叠的默认边界框（IoU\
  \ < 0.5）被称为*负样本框*，而与真实标注框匹配的则称为正样本框。在大多数情况下，负样本的数量远高于正样本的数量。这会导致类别不平衡，从而使预测结果产生偏差。为了平衡类别，负样本框会被排序，选取概率最高的负样本框，并丢弃其余部分，以使负样本与正样本的比例最多为\
  \ 3:1。研究发现，这个比例能实现更快的优化。\n\n#### 数据增强\n\nSSD 对各种输入物体的大小和形状具有鲁棒性。为了实现这种鲁棒性，每个训练图像都会通过以下选项之一进行采样：\n\
  \n*   使用整个原始图像。\n*   采样一个图像块，使得最小 IoU 为 0.1、0.3、0.5、0.7 或 0.9。\n*   随机采样一个图像块。\n\
  \n每个样本的特征如下：\n\n*   每个采样图像块的大小是原始图像大小的 [0.1, 1]。\n*   宽高比在 1/2 到 2 之间。\n*   如果真实标注框的中心位于采样的图像块内，则保留该真实标注框的重叠部分。\n\
  \n完成这些采样步骤后，每个采样的图像块会被调整到固定大小，并以 0.5 的概率进行水平翻转，此外还会应用一些光度失真。\n\n#### 非极大值抑制\n\n\
  在推理时，SSD 学习过程的前向传播期间会生成大量边界框。处理所有这些边界框将耗费大量计算和时间。因此，丢弃那些包含物体的置信度低且 IoU 低的边界框非常重要。只选择具有最大\
  \ IoU 和置信度的前 *N* 个边界框，并丢弃或抑制非极大值框。这消除了重复项，并确保网络只保留最可能的预测结果。\n\n### SSD 结果\n\nSSD\
  \ 是一个快速、鲁棒且准确的模型。采用 VGG-16 基础架构时，SSD 在准确性和速度方面均优于其最先进的目标检测同类模型。在 PASCAL VOC 和 COCO\
  \ 数据集上，SSD-512 模型（使用 512×512 输入图像的最高分辨率网络）比当时最先进的 Faster R-CNN 快至少三倍，且更准确。SSD-300\
  \ 模型能够以每秒 59 帧的速度在流式视频中更准确地进行实时目标检测，这比第一版 YOLO 更快。在第 7 章中，我们将探讨如何使用 SSD 检测视频中的物体。\n\
  \n## YOLO\n\nYOLO 是一种快速、实时、多目标检测算法。YOLO 由一个单一的卷积神经网络组成，该网络同时预测边界框及其内部物体的类别概率。YOLO\
  \ 在完整图像上进行训练，网络被设置为解决回归问题以检测物体。因此，YOLO 不需要复杂的处理流程，这使得它非常快速。\n\n一个基础网络在 Nvidia Titan\
  \ X GPU 上每秒可运行 45 帧。使用更快的 GPU 版本，速度可以更高，最高可达 150 FPS。这使得 YOLO 适用于实时检测流式视频中的物体，延迟低于\
  \ 25 毫秒。此外，YOLO 的 mAP 是其他实时系统的两倍以上。\n\nYOLO 由 Joseph Redmon、Santosh Divvala、Ross\
  \ Girshick 和 Ali Farhadi 于 2016 年在其论文《You Only Look Once: Unified, Real-Time Object\
  \ Detection》（[`https://arxiv.org/pdf/1506.02640.pdf`](https://arxiv.org/pdf/1506.02640.pdf)）中提出。\n\
  \n如图 6-15 所示并在原始论文中描述的检测过程如下：\n\n1.  输入图像被划分为 S×S 的网格。\n2.  如果物体的中心落在一个网格内，则该网格负责检测该物体。\n\
  3.  每个网格单元预测 *B* 个边界框以及这些边界框的置信度分数。\n4.  置信度分数使用以下公式计算：\n    置信度分数 = 物体存在概率 × 预测框与真实标注框之间的\
  \ IoU\n    如果边界框不包含任何物体，则置信度分数为零。\n5.  对于每个边界框，网络会进行五个预测：x、y、w、h 和置信度，其中：\n    *\
  \   (x, y) 坐标表示边界框中心相对于网格单元边界的位置。\n    *   w 和 h 是相对于整个图像的宽度和高度。\n    *   置信度预测表示预测框与任何真实标注框之间的\
  \ IoU。\n6.  同时，网络为每个网格单元预测一个类别条件概率 *C*，该概率以网格单元包含物体为条件。无论预测了多少个边界框 B，每个网格单元只预测一个条件概率。\n\
  7.  为了获得每个框的特定类别置信度分数，应用以下公式：\n    类别置信度分数 = Pr(类别 i|物体) × Pr(物体) × 预测与真实标注之间的 IoU\n\
  \    其中 Pr(类别 i|物体) 表示在网格单元内存在物体的条件下，属于某个类别的概率。\n8.  这些预测被编码为一个 S × S × (B × 5 +\
  \ C) 的张量。\n\nYOLO 的发明者使用以下设置进行评估：\n*   数据集：PASCAL Visual Object Classes，[`http://host.robots.ox.ac.uk/pascal/VOC/`](http://host.robots.ox.ac.uk/pascal/VOC/)\
  \ (PASCAL VOC)\n*   S = 7\n*   B = 2\n*   C = 20，因为 PASCAL VOC 有 20 个物体类别\n\n最终的预测产生一个\
  \ 7 × 7 × (2 × 5 + 20) = 7 × 7 × 30 的张量。\n\n![](img/493065_2_En_6_Fig15_HTML.jpg)\n\
  \n一张示意图，展示了输入图像被划分为 S×S 网格、边界框加置信度、类别概率图，并检测出狗、自行车和汽车。\n\n图 6-15\nYOLO 目标检测示意图（来源：Joseph\
  \ Redmon 等人）\n\n### YOLO 网络设计\n\nYOLO 网络架构的灵感来源于用于图像分类的 GoogLeNet。为 YOLO 稍作修改的 GoogLeNet\
  \ 由 24 个卷积层（含最大池化）后接两个全连接层组成。注意，图 6-16 所示的完整网络中，最后一层生成了输出张量，维度为 7×7×30。\n\n![](img/493065_2_En_6_Fig16_HTML.jpg)\n\
  \n一个框图，展示了包含多个层（包括用于特征提取和分类的卷积层、最大池化层和全连接层）的卷积神经网络架构。\n\n图 6-16\nYOLO 神经网络架构（来源：Joseph\
  \ Redmon 等人）\n\n### YOLO 的局限性\n\n尽管 YOLO 是最快的目标检测算法之一，但它也有一些局限性：\n\n*   难以处理成群出现的小物体，例如鸟群。\n\
  *   在一个网格单元内只能预测一个物体类别。\n*   如果物体具有训练集中未出现过的异常宽高比，则预测效果不佳。\n*   其准确性低于某些最先进的算法，例如\
  \ Faster R-CNN。\n\n\n\n### YOLO9000 或 YOLOv2\n\nYOLOv2 是 YOLO 的改进版本。与 YOLO 相比，它提高了检测精度和速度。该模型经过训练可检测超过\
  \ 9000 个物体类别；因此，它被命名为 YOLO9000。这项改进及其检测算法在 Joseph Redmon 和 Ali Farhadi 于 2016 年\
  \ 12 月发表的论文《YOLO9000：更好、更快、更强》中进行了描述（[`https://arxiv.org/pdf/1612.08242.pdf`](https://arxiv.org/pdf/1612.08242.pdf)）。\n\
  \nYOLOv2 旨在克服 YOLO 的一些局限性，特别是精度和召回率水平。此外，它还能够检测具有未见过的宽高比的物体。\n\n以下是 YOLOv2 为实现更好、更快、更强的结果所做的改进列表：\n\
  \n![](img/493065_2_En_6_Fig17_HTML.jpg)\n\n一张表格概述了卷积神经网络的配置，详细说明了滤波器、输出维度、层类型、大小和步长。该网络架构由卷积层、最大池化层和全连接层组成，每层都有特定的维度和参数。\n\
  \n图 6-17\n\nDarknet-19（来源：Joseph Redmon 等人，[`​arxiv.​org/​pdf/​1612.​08242.​pdf`](https://arxiv.org/pdf/1612.08242.pdf)）\n\
  \n*   **批量归一化**：YOLOv2 在 YOLO 的所有卷积层上添加了批量归一化。回顾一下，批量归一化有助于正则化模型。通过使用批量归一化，YOLOv2\
  \ 的 mAP 提升了超过 2%。\n\n*   **高分辨率分类器**：YOLOv2 经过微调，可以从更高分辨率的输入图像中学习。在 448×448 分辨率下，网络输出提升了\
  \ 4% 的 mAP。\n\n*   **带锚点框的卷积**：YOLOv2 移除了全连接层，并使用全卷积层。它还引入了锚点框来预测边界框。尽管精度略有下降，但通过使用锚点框，YOLOv2\
  \ 每张图像能够检测超过 1000 个物体，而 YOLO 只能检测 98 个。\n\n*   **维度聚类**：锚点框的大小是通过对 VOC 2017 训练集进行\
  \ K-means 聚类确定的。k=5 的值在平均 IOU 与模型复杂度之间提供了最佳权衡。平均 IOU 为 61.0%。\n\n*   **细粒度特征**：YOLOv2\
  \ 使用一个直通层，通过将相邻特征堆叠到不同通道而非空间位置来连接更高分辨率的特征。这种方法带来了约 1% 的性能提升。\n\n*   **多尺度训练**：YOLOv2\
  \ 能够检测不同尺寸图像中的物体。YOLOv2 不固定输入图像尺寸，而是每隔几次迭代动态更改网络。例如，每十个批次，网络会随机选择一个新的图像维度。这意味着同一个网络可以在不同分辨率下预测检测结果。在低分辨率下，YOLOv2\
  \ 作为一个廉价且相当准确的检测器运行。\n\n288×288 的 YOLOv2 网络以超过 90 FPS 的速度运行，其 mAP 几乎与 Fast R-CNN\
  \ 相当。这使得它非常适合较小的 GPU、高帧率视频或多个视频流。在高分辨率下，YOLOv2 是一个最先进的检测器，在 VOC 2007 上达到 78.6 mAP，同时仍以超实时速度运行。\n\
  \n*   **使用 DarkNet 替代 GoogLeNet**：YOLOv2 使用一个名为 DarkNet-19 的 CNN。该网络有 19 个卷积层和 5\
  \ 个最大池化层。Darknet-19 处理一张图像仅需 55.8 亿次运算，而 VGG 需要 306.7 亿次，YOLO 需要 85.2 亿次。然而，它在 ImageNet\
  \ 上实现了 72.9% 的 top-1 准确率和 91.2% 的 top-5 准确率。图 6-17 展示了 Darknet-19 的网络架构。\n\n*  \
  \ **联合分类与检测**：YOLOv2 可以从包含分类和检测标签的数据集中学习。在训练过程中，当网络看到标记为检测的图像时，它会执行完整的 YOLOv2 损失函数优化。而当它看到用于分类的图像时，它会使用网络的分类部分反向传播损失。YOLOv2\
  \ 的数据集是通过合并 COCO 和 ImageNet 的数据集创建的。该网络能够从分类和检测数据集中学习，与普通的 YOLO 相比，构建了一个更强的模型。\n\
  \n下表总结了 YOLOv2 的改进及其对精度和速度的影响（与普通 YOLO 相比）：\n\n|   | 改进 | 效果 |\n| --- | --- | ---\
  \ |\n| 更好 | 批量归一化 | mAP 提升 2% |\n|   | 高分辨率分类器 | mAP 提升 4% |\n|   | 带锚点框的卷积 | 每张图像能够检测超过\
  \ 1000 个物体 |\n|   | 维度聚类 | mAP 提升 4.8% |\n|   | 细粒度特征 | mAP 提升 1% |\n|   | 多尺度训练\
  \ | mAP 提升 1.1% |\n| 更快 | Darknet-19 | 计算量减少 33%，mAP 提升 0.4% |\n|   | 卷积预测层 | mAP\
  \ 提升 0.3% |\n| 更强 | 联合分类与检测 | 能够检测超过 9000 个物体 |\n\n\n\n### YOLOv3\n\nYOLO 的另一个改进版本是\
  \ YOLOv3，它在 YOLOv2 的基础上进行了一些改进。YOLOv3 在 2018 年 4 月由 Joseph Redmon 和 Ali Farhadi\
  \ 发表的论文《YOLOv3: An Incremental Improvement》中进行了描述（[`https://arxiv.org/pdf/1804.02767.pdf`](https://arxiv.org/pdf/1804.02767.pdf)）。\n\
  \nYOLOv3 的特性和改进如下所述：\n\n![](img/493065_2_En_6_Fig18_HTML.jpg)\n\n一张表格概述了 CNN 架构，指定了层类型、滤波器数量、大小和输出维度，包括残差块，最终以一个用于分类的\
  \ 1000 类 softmax 层结束。\n\n图 6-18\n\nYOLOv3 中使用的 Darknet-53（来源：[`​arxiv.​org/​pdf/​1804.​02767.​pdf`](https://arxiv.org/pdf/1804.02767.pdf)）\n\
  \n*   *边界框预测*：在检测边界框方面，YOLOv3 与 YOLOv2 相比没有变化。YOLOv3 在训练过程中使用平方误差和损失。它还使用逻辑回归为每个边界框预测一个物体性分数。如果某个边界框先验与真实物体的重叠程度超过任何其他边界框先验，则该物体性分数记为\
  \ 1。每个真实物体只分配一个边界框先验。如果边界框先验不是最佳的，但与真实物体的重叠程度超过某个阈值，则忽略该预测。YOLOv3 的发明者使用的阈值为 0.5。系统为每个真实物体只分配一个边界框先验。\n\
  \n*   *物体类别预测*：网络预测边界框内物体的多个类别。softmax 激活函数不适用于预测多标签类别。因此，YOLOv3 使用回归分类器代替 softmax。\n\
  \n*   *跨尺度预测*：YOLOv3 在三种不同的尺度上预测边界框。它仍然使用 K-means 聚类来确定边界框先验。它有九个聚类和任意选择的三个尺度，然后将聚类均匀地分配到各个尺度上。\n\
  \n    例如，在 COCO 数据集上，九个聚类如下：(10×13), (16×30), (33×23), (30×61), (62×45), (59×119),\
  \ (116×90), (156×198), (373×326)。\n\n*   *特征提取器*：作为特征提取的主干网络，YOLOv3 使用了 Darknet-19\
  \ 的改进版本。该网络被命名为 Darknet-53。它有 53 个卷积层。图 6-18 展示了 Darknet-53 的网络架构。\n\n*   *训练*：YOLOv3\
  \ 的训练方法与 YOLOv2 相比没有变化。训练是在完整图像上进行的，使用了多尺度数据、批量归一化以及混合的分类和检测标签。\n\n以下是 YOLOv3 的结果：\n\
  \n*   就整体 mAP 而言，由于网络更宽（53 层，而 YOLOv2 为 19 层），YOLOv3 的性能显著下降。\n\n*   采用 608×608\
  \ 分辨率图像的 YOLOv3 在 51ms 推理时间内达到了 33.0%的 mAP，而 RetinaNet-101–50–500 在 73ms 推理时间内仅达到\
  \ 32.5%的 mAP。\n\n*   YOLOv3 的准确率与 SSD 变体相当，但检测速度快了 3 倍。\n\n## YOLOv4\n\nYOLOv4 是\
  \ YOLO 的改进版本，建立在 YOLOv3 的成功和经验教训之上。Alex 等人关于 YOLOv4 的原始论文位于[`https://arxiv.org/pdf/2004.10934.pdf`](https://arxiv.org/pdf/2004.10934.pdf)。\n\
  \nYOLOv4 在 YOLOv3 的基础上引入了多项重大改进：\n\n*   *主干网络架构*：YOLOv4 采用了更先进的主干网络，称为 CSPDarknet53，它基于\
  \ Darknet 架构。它集成了跨阶段局部网络（CSPNet）模块，实现了更高效、更准确的特征提取。\n\n*   *颈部架构*：YOLOv4 引入了一种称为空间金字塔池化（SPP）和路径聚合网络（PANet）的颈部架构。SPP\
  \ 允许模型在不同尺度上捕获上下文信息，而 PANet 则聚合来自多个层次的特征以提高检测精度。\n\n*   *改进的锚点生成*：YOLOv4 采用了一种称为\
  \ Anchor-Free YOLO（YOLOv4-csp）的无锚点方法，消除了对锚点框的需求。这种方法简化了边界框预测过程，并提高了对小物体的检测精度。\n\n\
  *   *先进技术的使用*：YOLOv4 融合了多种先进技术，如 Mish 激活函数、完全交并比（CIOU）损失函数和自对抗训练。这些技术有助于改善梯度流、增强定位精度并提升整体性能。\n\
  \n*   *训练策略*：YOLOv4 采用了不同的训练策略，如随机形状训练、马赛克数据增强和改进的数据增强策略。这些策略增强了模型在不同场景下的泛化能力和性能表现。\n\
  \n## YOLOv7\n\nYOLO 目标检测算法经历了多次迭代，每一次都建立在前代版本优势的基础上。最新版本代表了相较于早期版本的重大进步。YOLOv4 是官方\
  \ Darknet 项目系列迭代中的最终成就。\n\n然而，基于 YOLO 的模型格局已扩展到官方谱系之外。YOLOv5，以及 YOLOR 和 YOLOX 等其他几个迭代版本，成为了值得注意的例子。这些模型虽然在原始\
  \ Darknet 项目的背景下是非官方的，但对 YOLO 方法的推进做出了重大贡献。\n\nYOLOv7 树立了新的标杆，在速度和精度上超越了所有现有的目标检测器，其运行范围从\
  \ 5 FPS 到 160 FPS。值得注意的是，它拥有无与伦比的精度，平均精度（AP）达到 56.8%，使其成为在 GPU V100 平台上以 30 FPS\
  \ 或更高速度运行的实时目标检测器中的领跑者。\n\n官方 YOLOv7 论文《YOLOv7: Trainable bag-of-freebies sets new\
  \ state-of-the-art for real-time object detectors》（[`https://arxiv.org/pdf/2207.02696.pdf`](https://arxiv.org/pdf/2207.02696.pdf)）于\
  \ 2022 年 7 月由 Chien-Yao Wang、Alexey Bochkovskiy 和 Hong-Yuan Mark Liao 发布。源代码根据 GPL-3.0\
  \ 许可证（一种自由的 copyleft 许可证）作为开源发布，可在官方 YOLOv7 GitHub 仓库中找到：[`https://github.com/WongKinYiu/yolov7`](https://github.com/WongKinYiu/yolov7)。\n\
  \nYOLOv7 在保持高效推理的同时，在实时目标检测精度方面引入了重大进步。在基准测试比较中，YOLOv7 通过在最先进的实时目标检测系统中减少约 40%的参数和\
  \ 50%的计算量，超越了其他已建立的目标检测器。这带来了更快的推理速度和更高的检测精度。\n\n本质上，YOLOv7 提出了一种更快、更稳健的网络架构，该架构采用了更高效的特征集成方法。这进而带来了更高的目标检测精度、更强的损失函数，以及更高效的标签分配和模型训练。因此，与其他深度学习模型相比，YOLOv7\
  \ 对计算硬件的要求显著降低。此外，它可以在较小的数据集上快速训练，无需预训练权重。\n\n### YOLOv7 架构特性\n\nYOLOv7 论文引入了以下主要变化：\n\
  \n*   YOLOv7 架构\n    *   扩展的高效层聚合网络（E-ELAN）\n\n    *   针对基于拼接模型的模型缩放\n\n*   可训练的免费赠品包\n\
  \    *   计划重参数化卷积\n\n    *   用于辅助损失的粗粒度和用于主导损失的细粒度\n\n\n\n#### E-ELAN\n\nE-ELAN\
  \ 是 YOLOv7 主干网络中的计算模块。其设计基于对以下影响速度和准确率因素的分析：\n\n*   内存访问成本\n*   输入/输出通道比率\n*   逐元素操作\n\
  *   激活函数\n*   梯度路径\n\nE-ELAN 架构使框架能够更好地学习。它基于 ELAN 计算模块。E-ELAN 使用扩展、混洗、合并基数的方法，在不破坏原始梯度路径的前提下，持续增强网络的学习能力。ELAN\
  \ 和 E-ELAN 的参考架构见图 6-19。\n\n![](img/493065_2_En_6_Fig19_HTML.jpg)\n\n这些插图展示了不同 CNN\
  \ 设计中使用的架构模块，包括卷积层、跨阶段连接、堆叠和混洗模块，以及不同基数，以增强网络性能。\n\n图 6-19\nVoVNet、CSPVoVNet、ELAN\
  \ 和 E-ELAN 架构（来源：[`​arxiv.​org/​pdf/​2207.​02696.​pdf`](https://arxiv.org/pdf/2207.02696.pdf)）\n\
  \n#### 基于拼接模型的模型缩放\n\n*模型缩放* 主要旨在修改模型的特定属性，从而创建不同尺度的模型。这种调整能够满足不同需求下对推理速度的要求。例如，EfficientNet\
  \ 的缩放过程涉及调整宽度、深度和分辨率。相反，在 scaled-YOLOv4 中，缩放模型主要围绕修改阶段数量进行。\n\n在采用基于拼接架构（如 ResNet\
  \ 或 PlainNet）的传统方法中，必须综合而非孤立地考虑缩放因子。换句话说，当增加模型深度时，这种调整可能会引发过渡层中输入与输出通道比率的比例变化。因此，这种改变可能导致模型硬件利用率的降低。\n\
  \n这就是 YOLOv7 在基于拼接的模型框架中引入复合模型缩放的原因。复合缩放方法保留了模型在初始设计时所具备的固有特性，从而确保最优结构得以保持。\n\n\
  以下是复合模型缩放的工作原理：举例来说，调整计算模块的深度因子需要相应修改该模块的输出通道。随后，对过渡层应用等效调整来执行宽度因子缩放。图 6-20 和图 6-21\
  \ 展示了这一概念。\n\n![](img/493065_2_En_6_Fig21_HTML.jpg)\n\n一个说明复合缩放的框图，该缩放结合了增加的深度和宽度，使基于拼接的模型能够适应并提升性能。\n\
  \n图 6-21\n复合放大的基于拼接模型的示意图（来源：[`​arxiv.​org/​pdf/​2207.​02696.​pdf`](https://arxiv.org/pdf/2207.02696.pdf)）\n\
  \n![](img/493065_2_En_6_Fig20_HTML.jpg)\n\n两个框图。a. 具有卷积层和拼接操作的基于拼接模型，用于调整深度和宽度。b.\
  \ 一个放大的基于拼接模型，增加了层以获得更多灵活性。\n\n图 6-20\n基于拼接模型和放大的基于拼接模型的示意图（来源：[`​arxiv.​org/​pdf/​2207.​02696.​pdf`](https://arxiv.org/pdf/2207.02696.pdf)）\n\
  \n#### 计划重参数化卷积\n\n*重参数化* 是一种旨在提升模型性能的训练后技术。虽然它会延长训练时间，但能带来更好的推理结果。用于模型优化的重参数化分为两类：\n\
  \n![](img/493065_2_En_6_Fig22_HTML.jpg)\n\n一个说明 8 种网络架构的框图，包括 Plain Net、Rep Plain\
  \ Net、Res Net、Rep Res Net 以及各种 P-Rep Res Net 模型，每种模型都有不同的配置以提升性能。\n\n图 6-22\n计划重参数化模型（来源：[`​arxiv.​org/​pdf/​2207.​02696.​pdf`](https://arxiv.org/pdf/2207.02696.pdf)）\n\
  \n*   *模型级重参数化*：可以通过以下两种方法实现：\n    *   使用不同的训练数据训练多个模型，同时保持一致的设置。随后，对其权重进行平均以得到最终模型。\n\
  \    *   计算不同训练周期下模型权重的平均值。\n\n*   *模块级重参数化*：这种方法在研究中获得了广泛关注。模型训练过程被拆分为多个模块。将输出进行集成以获得最终模型。YOLOv7\
  \ 论文的作者展示了执行模块级集成的最佳方法。见图 6-22。\n\n如图 6-22 所示，E-ELAN 计算模块的 3×3 卷积层被替换为 RepConv 层。通过切换或替换\
  \ RepConv、3×3 卷积和恒等连接的位置进行了实验。图中所示的残差旁路箭头是一个恒等连接，它是一个 1×1 卷积层。该实验有助于确定哪些配置有效，哪些无效。\n\
  \nRepConv 实际上将 3×3 卷积、1×1 卷积和恒等连接组合在一个卷积层中。在分析了 RepConv 与不同架构的组合及相应性能后，YOLOv7 的作者发现，RepConv\
  \ 中的恒等连接破坏了 ResNet 中的残差结构和 DenseNet 中的拼接结构，而后者为不同的特征图提供了更多样化的梯度。因此，他们使用不含恒等连接的 RepConv（RepConvN）来设计计划重参数化卷积的架构。他们认为，当带有残差或拼接结构的卷积层被重参数化卷积替换时，不应包含恒等连接。\n\
  \n\n\n#### 辅助头粗粒度与主导头细粒度损失\n\n如前所述，YOLO 架构包含主干网络、颈部网络和头部网络。头部网络包含预测输出。YOLOv7 采用了多头架构。\n\
  \n在 YOLOv7 中，负责最终输出的头部被称为*主导头*，而用于辅助中间层训练的头部被称为*辅助头*。\n\n借助辅助损失，辅助头的权重得以更新。\n\n\
  *标签分配器*是一种机制，它将网络的预测结果与真实标注相结合，随后分配软标签。需要强调的是，这个过程会产生软化的、泛化的标签。\n\n与传统的标签分配技术（通过直接引用真实标注并应用预定义规则来生成刚性标签）不同，创建可靠软标签的方法涉及使用计算和优化方法。这些方法在结合真实标注的同时，考虑了预测输出的质量和分布。以下两种方法用于创建作为训练目标的软标签：\n\
  \n![](img/493065_2_En_6_Fig23_HTML.jpg)\n\n标记为 a 到 e 的框图代表了具有不同检测级别的不同网络模型和配置，包括普通模型、带辅助头的模型、独立分配器、主导头引导分配器以及用于提升性能和目标检测的由粗到精主导头引导分配器。\n\
  \n图 6-23\n\n普通模型 (a)、带辅助头的模型 (b)、独立分配器 (c)、主导头引导分配器 (d) 和由粗到精主导头引导分配器 (e) 的示例（来源：[`​arxiv.​org/​pdf/​2207.​02696.​pdf`](https://arxiv.org/pdf/2207.02696.pdf)）\n\
  \n*   *主导头引导标签分配器*：主要依赖主导头的预测结果和真实标注来计算其值。然后，这些值通过优化过程用于生成软标签。这组软标签作为模型中辅助头和主导头的训练目标。\n\
  \n*   *由粗到精主导头引导标签分配器*：同样利用主导头的预测结果和真实标注来生成软标签。然而，这种方法会生成两组不同的软标签：粗标签和细标签。细标签与主导头引导标签分配器生成的软标签一致。另一方面，粗标签是通过放宽正样本分配过程的约束条件生成的，从而有效地将更多的网格单元指定为正目标。图\
  \ 6-23 描绘了主导头引导分配器和由粗到精主导头引导分配器。\n\n在本章中，我们将探讨如何训练自定义的 YOLOv7 模型，并在图像和视频中执行目标检测。\n\
  \n## 目标检测算法对比\n\n到目前为止，在本章中，我们探讨了三种不同的目标检测算法类别：R-CNN 及其变体、SSD 和 YOLO。这些算法在两个流行的数据集（VOC\
  \ 和 COCO）上进行了训练，并对其速度和准确性进行了基准测试。本节提供的对比可作为指南，用于判断在构建目标检测系统时，一种算法相对于另一种算法的适用性和应用性。性能指标和基准测试结果主要取自赵中求、郑鹏、徐守涛和吴信东于\
  \ 2019 年 4 月发表的论文《基于深度学习的目标检测：综述》（[`https://arxiv.org/pdf/1807.05511.pdf`](https://arxiv.org/pdf/1807.05511.pdf)）。\n\
  \n### 架构对比\n\n表 6-1 从目标检测算法所使用的神经网络架构方面进行了对比。\n\n表 6-1\n\n目标检测器神经网络架构对比\n\n| 目标检测器\
