  \n一张标有“百事可乐”的软饮料瓶截图。顶部的标题写着“模板图像”。\n\n图 3-87\n\n模板图像\n\n应用 NMS 后的输出如图 3-90 所示。请注意应用\
  \ NMS 前后输出的差异。在应用 NMS 之前（图 3-89），输出包含同一对象的多个边界框或检测结果，这些框相互重叠。然而，应用 NMS 后，冗余或重叠的检测结果被抑制，从而得到更精简的输出，边界框数量减少。NMS\
  \ 通过考虑检测结果的置信度分数和空间重叠程度，帮助选择最可靠、最准确的检测结果。这带来了更清晰、更准确的检测对象表示。\n\n## 总结\n\n在本章中，我们涵盖了广泛的图像处理技术，这些技术对于构建计算机视觉应用至关重要。我们首先探索了图像变换的方法，包括调整大小、旋转、翻转和裁剪，使我们能够根据需要操作图像。接着，我们研究了如何对图像执行算术运算和位运算，扩展了图像处理的能力。\n\
  \n此外，我们深入探讨了强大的图像处理功能，如掩码、降噪、二值化、边缘检测、轮廓检测和形态学变换。这些技术为提升图像质量、分割对象以及提取重要的视觉特征提供了宝贵的工具。\n\
  \n值得注意的是，你在本章学到的技术将在后续章节中被广泛使用，尤其是在我们深入探讨机器学习任务的特征提取和特征工程时。理解和应用这些图像处理技术，对于在各种应用和领域中充分发挥计算机视觉的潜力至关重要。\n\
  \n"
- "# 4. 构建基于机器学习的计算机视觉系统\n\n第 3 章介绍并探讨了多种图像处理方法。在第 5 章中，我们将深入探讨如何使用机器学习构建计算机视觉系统。在本章中，我们将探索从图像中提取特征的基本技术以及特征选择的艺术。我们将揭开机器如何从这些特征中学习的神秘面纱。本章作为第\
  \ 5 章的引介，届时你将深入了解不同的深度学习算法，并学习如何使用 TensorFlow 在 Python 中实现它们。\n\n\n\n## 图像处理流水线\n\
  \n*计算机视觉（CV）* 指的是计算机捕捉、分析图像并从中得出解释和结论的能力。例如，CV 可应用于图像检测与识别任务，以及识别图像中的模式或物体。当人工智能（AI）系统遇到图像时，会经历一系列处理过程：图像摄取、处理、特征提取和解释。这涉及图像在不同系统组件之间的转换，使机器能够识别其中的模式并检测物体。\n\
  \n*图像处理流水线*，也称为*计算机视觉流水线*，包含一系列组件，这些组件通过各种变换处理图像，最终产生输出结果。图 4-1 提供了该处理流水线的高级概览。\n\
  \n![](img/493065_2_En_4_Fig1_HTML.png)\n\n一个带有示例照片的图像处理流水线。它描绘了代表真实世界物体的骑马者、代表传感设备的相机以及代表图像处理设备的计算机。\n\
  \n图 4-1\n\n图像流水线\n\n如图 4-1 所示，真实世界物体由传感设备（如相机）捕捉，并转换为数字图像。这些数字图像随后由计算机系统处理，产生最终输出。输出结果可能与图像本身相关，例如图像分类，或识别图像中的模式和物体。例如，在医疗保健领域，从\
  \ MRI 或 X 光仪器获取的图像可被输入图像处理流水线，以检测是否存在肿瘤。\n\n本书深入探讨了计算机处理单元的内部工作原理，并探索了生成输出的过程。计算机系统内用于图像处理的数据流流水线如图\
  \ 4-2 所示。\n\n![](img/493065_2_En_4_Fig2_HTML.jpg)\n\n一个包含 5 个步骤的图像处理流水线流程图。它从输入图像开始，接着是变换和特征提取，最后以输出图像结束。\n\
  \n图 4-2\n\n计算机视觉中的图像处理流水线\n\n以下是计算机视觉流水线的简要描述：\n\n1.  **图像摄取**：图像被捕捉、转换为数字格式，并存储在计算机磁盘上。对于视频，数字帧被摄取并存储，可以从磁盘或直接从相机获取。\n\
  \n2.  **图像变换**：摄取后，图像会经历各种预处理变换以使其标准化。这些变换包括调整大小、颜色处理、平移、旋转和裁剪，以及二值化、阈值处理、梯度检测和边缘检测等高级技术。这些变换确保了图像在大小、形状和颜色模式上的一致性。有关这些技术的回顾，请参见第\
  \ 3 章。\n\n3.  **特征提取**：特征提取是视觉流水线中的关键步骤，涉及从图像中识别和提取相关特征。一个好的特征集对于准确的机器学习结果至关重要。关于特征提取的更多细节将在下一节“特征提取”中介绍。\n\
  \n4.  **机器学习算法**：该流水线分两个阶段使用机器学习算法。在第一阶段，使用大型数据集训练算法，生成训练好的模型。在第二阶段，将新数据集输入训练好的模型以预测结果或类别。此阶段称为*预测阶段*。第\
  \ 5 章将探讨用于计算机视觉的流行且有效的机器学习模型。它将介绍 Keras 和 TensorFlow，并提供用于模型训练和预测的代码示例。\n\n5.  **输出生成**：视觉流水线的最后一个组件是期望的输出，它代表了视觉系统的最终目标。\n\
  \n## 特征提取\n\n在机器学习中，*特征*是被观察对象或事件的可测量属性。在计算机视觉中，特征提供了关于图像的独特信息。特征提取在机器学习中具有重要意义，因为整个过程都围绕这些特征展开。识别和提取相关且独立的特征以实现可靠的机器学习结果，是成功的关键。\n\
  \n例如，让我们考察仅凭车轮来区分汽车和摩托车的场景。仅凭车轮本身并不是一个区分性特征。还需要其他特征，例如是否有车门、车顶以及其他特性。此外，仅依赖从单个摩托车或汽车中提取的特征，对于实际的机器学习应用可能是不够的。通过观察事件或特征的重复出现来建立模式至关重要，因为现实世界中的物体并不总是以与特征完全相同的方式呈现。因此，可重复性是良好特征的关键特性。\n\
  \n在车轮的例子中，我们只有一个特征，但在实际场景中，需要考虑的特征可能非常多。这些特征可能包括颜色、轮廓、边缘、角点、角度、光强度等等。提取更多数量的独特特征可以提升模型的质量和有效性。\n\
  \n机器学习模型的性能在很大程度上依赖于用于训练的特征的质量。挑战在于提取一组稳健的特征。虽然没有适用于所有场景的通用解决方案，但以下列表提供了一些实用的方法（以及其他方法），可帮助您进行特征提取工作：\n\
  \n*   *区分性*：特征应具备区分性特征，使其能够区分不同的类别或分类。\n\n*   *非重叠性*：特征不应具有可能导致分类或识别混淆或模糊的重叠属性。\n\
  \n*   *出现频率*：特征应基于以足够频率出现的属性或事件，避免因罕见出现而阻碍可靠的模式识别。\n\n*   *鲁棒性*：特征应在各种条件下（例如不同的光照条件、视角或环境因素）表现出一致性。\n\
  \n*   *可识别性*：特征应易于直接识别，或借助适当的处理技术提取相关信息。\n\n*   *充足样本*：收集大量样本对于建立可靠模式并确保特征提取过程的泛化能力至关重要。\n\
  \n通过遵循这些原则，我们可以提高所提取特征的质量和有效性，从而获得更好的机器学习结果以及更准确的分类或识别结果。\n\n\n\n### 如何表示特征\n\n\
  从图像中提取的特征通常以*特征向量*的形式表示。举个简单的例子，考虑一张灰度图像，其特征对应于图像的像素值。像素被组织成一个二维矩阵，其中每个像素的值范围从 0\
  \ 到 255。\n\n为了将这些像素值表示为特征，我们将其转换为一维（1D）行矩阵，这可以看作是一个向量或一维数组。图 4-3 直观地展示了这种表示方式。\n\
  \n![](img/493065_2_En_4_Fig3_HTML.png)\n\n一个包含 8 行 8 列向量 x 和 y 的矩阵。这些向量表示特征，其单元格中的像素值范围为\
  \ 0 到 255。\n\n图 4-3\n\n特征的向量表示\n\n对于大多数机器学习算法来说，需要从图像中提取特征并将其输入算法进行模型训练。然而，某些深度学习算法，例如卷积神经网络（CNN），能够在模型训练过程中自动提取特征。（第\
  \ 5 章提供了关于深度学习算法以及训练计算机视觉模型所需技术的全面信息。）\n\n以下各节将探讨从图像中提取特征的不同方法，并提供特征提取的实际示例。使用 OpenCV\
  \ 库的 Python 代码将演示这些概念及其实现。\n\n### 颜色直方图\n\n*直方图*表示图像中像素强度的频率分布。直方图通常以图形或图表的形式显示，其中\
  \ x 轴表示像素值或值范围，y 轴表示与每个值或范围相关联的像素频率或计数。图形上的最高点表示图像中出现频率最高的颜色。\n\n由于像素值的范围可以从 0 到\
  \ 255，直方图的 x 轴由 256 个值组成，代表了所有可能的像素强度范围。然而，如此大量的值在实际应用中可能会显得过于庞大。为了解决这个问题，我们通常将像素值划分为更小的组，称为*区间*。例如，我们可以将\
  \ x 轴划分为 8 个区间，每个区间覆盖 32 个像素颜色的范围。通过这样做，我们可以通过累加落在每个区间内的像素数量来计算 y 轴的值。\n\n直方图提供了关于图像中颜色、对比度和亮度分布的信息。由于\
  \ RGB 色彩空间中的彩色图像由三个通道组成（灰度图像只有一个通道），因此在为彩色图像生成直方图时，常见的做法是绘制三个独立的直方图，每个通道一个，以便全面了解每个颜色通道的强度分布。这些直方图可以作为机器学习算法中的特征使用。\n\
  \n直方图的另一个有趣用途是图像增强。为此目的采用的一种技术是直方图均衡化，它利用直方图来提高图像质量。你将在本章后面了解有关直方图均衡化的更多细节。\n\n\
  #### 如何计算直方图\n\n为了演示如何计算直方图，我们将使用 Python 和 OpenCV。为了可视化直方图图形，我们将使用 Matplotlib 包中的\
  \ `pyplot` 模块。如果你在第 1 章中没有安装和配置 Matplotlib，请现在进行安装。\n\nOpenCV 通过提供一个名为 `calcHist()`\
  \ 的用户友好函数，简化了计算直方图的过程：\n\n```\ncalcHist(images, channels, mask, histSize, ranges,\
  \ accumulate)\n```\n\n该函数接受以下参数：\n\n*   `images`：这是一个图像像素的 NumPy 数组。如果你只有一张图像，只需将\
  \ NumPy 变量放在一对方括号内，例如 `[image]`。\n\n*   `channels`：这是一个索引数组，表示我们要为其计算直方图的通道。对于灰度图像，这将是\
  \ `[0]`；对于 RGB 彩色图像，这将是 `[0,1,2]`。\n\n*   `mask`：这是一个可选参数。如果你不提供掩码，直方图将针对图像中所有像素进行计算。如果你提供了掩码，则仅针对被掩码覆盖的像素计算直方图。还记得第\
  \ 3 章中的掩码吗？\n\n*   `histSize`：这是区间的数量。如果我们将此值传递为 `[64,64,64]`，这意味着每个通道将有 64 个区间。不同通道的区间大小可以不同。\n\
  \n*   `ranges`：这是像素值的范围，对于灰度图像和 RGB 彩色图像，通常为 `[0,255]`。在其他色彩空间中，此值可能不同，但现在我们只关注\
  \ RGB。\n\n*   `accumulate`：这是累加标志。如果设置了此标志，则在分配直方图时不会在开始时清除它。此功能允许你从多组数组中计算单个直方图，或随时间更新直方图。默认值为\
  \ `None`。\n\n通过使用带有适当参数的 `calcHist()` 函数，我们可以高效地计算图像的直方图。\n\n\n\n#### 灰度直方图\n\n\
  为了实际理解如何计算和可视化灰度图像的直方图，请参阅代码清单 4-1 及其后的讨论。这段代码从 Matplotlib 包中导入了 `pyplot`。我们将使用这个库来绘制代表直方图的图形。\n\
  \n```\nFilename: Listing_4_1.py\n1    import cv2\n2    import numpy as np\n3   \
  \ from matplotlib import pyplot as plot\n\n5    # 读取图像并转换为灰度图\n6    image = cv2.imread(\"\
  images/nature.jpg\")\n7    image = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)\n8  \
  \  cv2.imshow(\"Original Image\", image)\n\n10   # 计算直方图\n11   hist = cv2.calcHist([image],\
  \ [0], None, [256], [0,255])\n\n13   # 绘制直方图\n14   plot.figure()\n15   plot.title(\"\
  Grayscale Histogram\")\n16   plot.xlabel(\"Bins\")\n17   plot.ylabel(\"Number of\
  \ Pixels\")\n18   plot.plot(hist)\n19   plot.show()\n20   cv2.waitKey(0)\nListing\
  \ 4-1\nHistogram of a Grayscale Image\n```\n\n代码清单 4-1 的第 11 行计算了灰度图像的直方图。请注意，`image`\
  \ 变量被包裹在一对方括号中，因为 `cv2.calcHist()` 函数接受一个 NumPy 数组的数组作为参数。即使我们只有一张图像，我们仍然需要将其包裹在数组中。\n\
  \n第二个参数 `[0]` 表示我们要计算第零个颜色通道的直方图。由于我们只有一个通道，我们只在数组中传递一个索引值：`[0]`。\n\n第三个参数 `None`\
  \ 表示我们不想提供任何掩码。换句话说，我们计算所有像素的直方图。\n\n第四个参数 `[256]` 是区间信息。它指定我们需要 256 个区间，意味着每个像素值对应一个区间。除非我们想对图像像素分布进行精细分析，否则这可能没什么用。在大多数实际应用中，我们希望传递更小的区间大小，例如\
  \ `[32]` 或 `[64]`。\n\n最后一个参数 `[0,255]` 告诉函数像素值的范围在 0 到 255 之间。\n\n`hist` 变量保存了计算结果。如果你打印这个变量，你会看到一堆可能不易解读的数字。为了便于解读，我们以图形形式绘制直方图。\n\
  \n第 14 行配置了一个空白绘图。第 15 行为我们的绘图指定了标题。第 16 行和第 17 行分别设置了 x 轴和 y 轴的标签。第 18 行实际绘制了图形。最后，第\
  \ 19 行在屏幕上显示绘图。图 4-4 显示了原始图像，图 4-5 显示了直方图输出。\n\n![](img/493065_2_En_4_Fig5_HTML.jpg)\n\
  \n一幅标题为“灰度直方图”的图形。它描绘了像素数量（从 0 到 3500）与区间数量（从 0 到 250）的关系。该图形在约 25 个区间处出现一个峰值。\n\
  \n图 4-5\n图 4-4 中灰度图像的直方图\n\n![](img/493065_2_En_4_Fig4_HTML.jpg)\n\n一幅标题为“原始图像”的照片截图。它描绘了天空中云朵和下方地面的灰度图像。\n\
  \n图 4-4\n原始灰度图像\n\n在这个直方图中，频率最高的颜色值是 20，接近黑色，对应最多 3450 个像素。此外，大多数像素落在 100 到 150\
  \ 的颜色范围内。\n\n这里还有一个练习供你尝试：为一张图像绘制具有 32 个区间的直方图，并解读生成的图形。\n\n#### RGB 颜色直方图\n\n如前所述，彩色图像在\
  \ RGB 方案中有三个通道。代码清单 4-2 中的程序演示了如何绘制基于 RGB 的彩色图像所有三个通道的直方图。有必要重申，OpenCV 以 BGR 顺序而非\
  \ RGB 顺序存储颜色信息。\n\n```\nFilename: Listing_4_2.py\n1    import cv2\n2    import numpy\
  \ as np\n3    from matplotlib import pyplot as plot\n\n5    # 读取彩色图像\n6    image\
  \ = cv2.imread(\"images/nature.jpg\")\n\n8    cv2.imshow(\"Original Color Image\"\
  , image)\n9    # 记住 OpenCV 以 BGR 顺序而非 RGB 顺序存储颜色\n10   colors = (\"blue\", \"green\"\
  , \"red\")\n11   # 计算直方图\n12   for i, color in enumerate(colors):\n13       hist\
  \ = cv2.calcHist([image], [i], None, [32], [0,256])\n14       # 绘制直方图\n15      \
  \ plot.plot(hist, color=color)\n\n17   plot.title(\"RGB Color Histogram\")\n18 \
  \  plot.xlabel(\"Bins\")\n19   plot.ylabel(\"Number of Pixels\")\n20   plot.show()\n\
  21   cv2.waitKey(0)\nListing 4-2\nHistogram of Three Channels of RGB Color Image\n\
  ```\n\n在代码清单 4-2 中，第 6 行从磁盘读取一张彩色图像并将其赋值给一个变量。第 10 行创建了一个按 BGR 顺序排列的颜色元组，用于保存所有通道的颜色。\n\
  \n为什么第 12 行有一个 `for` 循环？`calcHist()` 函数的第二个参数接受一个值为 0、1 或 2 的数组。如果我们传递值 `[0]`，就是指示\
  \ `calcHist()` 函数计算第零个索引的颜色通道（即蓝色通道）的直方图。类似地，值 `[1]` 指示 `calcHist()` 函数计算红色通道的直方图，值\
  \ `[2]` 表示计算绿色通道的直方图。`for` 循环的第一次迭代用于计算和绘制蓝色的直方图，第二次迭代用于绿色，最后一次迭代用于红色通道。\n\n再次注意，我们向\
  \ `calcHist()` 函数传递了 `[32]` 作为第四个参数。这是为了让函数知道我们想要为每个通道计算具有 32 个区间的直方图。最后一个参数 `[0,256]`\
  \ 给出了颜色范围。\n\n在第 15 行的 `for` 循环内，`plot()` 函数将直方图作为第一个参数，将可选的颜色作为第二个参数。\n\n图 4-6\
  \ 和图 4-7 显示了代码清单 4-2 的输出。\n\n![](img/493065_2_En_4_Fig7_HTML.jpg)\n\n一幅标题为“RGB 颜色直方图”的图形。它描绘了像素数量（从\
  \ 0 到 40000）与区间数量（从 0 到 30）的关系。图形显示了三条 RGB 线条，呈现下降趋势。\n\n图 4-7\n图 4-6 中图像三个颜色通道的直方图\n\
  \n![](img/493065_2_En_4_Fig6_HTML.jpg)\n\n一幅标题为“原始彩色图像”的照片截图。它描绘了天空中云朵和下方地面的 RGB\
