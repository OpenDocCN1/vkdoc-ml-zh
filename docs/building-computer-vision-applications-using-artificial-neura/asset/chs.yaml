  \ Python 3.6 选项，并点击了对话框底部的“确定”按钮。\n\n图 1-1\n\n选择解释器\n\n## OpenCV\n\nOpenCV 是最流行且广泛使用的图像处理库之一。本书中的所有代码示例均基于\
