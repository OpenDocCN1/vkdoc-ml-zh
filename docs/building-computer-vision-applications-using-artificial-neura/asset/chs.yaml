  \n图 9-8\n\n在缺陷区域周围绘制矩形并选择类别标签以标注图像\n\n同样地，逐一标注所有图像。\n\n### 导出标签\n\nVoTT 支持以下导出格式：\n\
  \n*   Azure Custom Vision Service\n\n*   Microsoft Cognitive Toolkit (CNTK)\n\n\
  *   TensorFlow（Pascal VOC 和 TFRecords）\n\n*   VoTT（通用 JSON 模式）\n\n*   逗号分隔值 (CSV)\n\
