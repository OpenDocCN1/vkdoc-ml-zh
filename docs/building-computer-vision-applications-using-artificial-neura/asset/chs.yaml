  \ = 302。Y = 214。L, 44。\n\n图 3-53\n原始图像\n\n\n\n### 大津二值化\n\n简单阈值处理涉及选择一个单一的全局阈值，并将其应用于整个图像。然而，确定合适的阈值可能具有挑战性，因为无法预先确切知道理想值。找到正确的阈值通常需要反复试验。此外，即使为某张图像找到了最佳阈值，该值也可能无法为其他具有不同像素强度特征的图像带来令人满意的结果。因此，简单阈值处理中阈值的选择是主观的，可能需要针对不同的图像或场景进行调整。\n\
  \n*大津法*是一种通过分析图像直方图来计算最佳全局阈值的方法。我们将在下一章详细探讨直方图，目前只需将直方图理解为图像像素值频率分布的视觉表示。大津法利用这种直方图信息来自动确定阈值，该阈值能最大化前景与背景像素之间的分离度。通过有效利用像素值分布，大津法有助于实现更准确、更可靠的阈值处理结果。\n\
  \n要执行大津二值化，我们在 `threshold()` 函数中传入 `cv2.THRESH_OTSU` 作为额外标志。例如，我们在 `threshold()`\
  \ 函数中传入 `cv2.THRESH_BINARY+cv2.THRESH_OTSU` 以指示使用大津法。`threshold()` 方法需要一个阈值。使用大津法时，我们传入一个任意值（可以是\
  \ 0），算法会自动计算阈值，并将该阈值作为输出之一返回。\n\n清单 3-18 展示了一个演示大津二值化方法使用的代码示例。\n\n```\nFilename:\
  \ Listing_3_18.py\n1    import cv2\n2    import numpy as np\n\n4    # 加载图像\n5  \
  \  image = cv2.imread(\"images/scanned_doc.png\")\n6    # 将图像转换为灰度图\n7    image\
  \ = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)\n8    cv2.imshow(\"原始灰度收据\", image)\n\
  \n10   # 使用阈值处理对图像进行二值化\n11   (T, binarizedImage) = cv2.threshold(image, 0, 255,\
  \ cv2.THRESH_BINARY+cv2.THRESH_OTSU)\n12   print(\"大津二值化的阈值\", T)\n13   cv2.imshow(\"\
  二值化收据\", binarizedImage)\n\n15   # 使用逆阈值处理进行二值化\n16   (Ti, inverseBinarizedImage)\
  \ = cv2.threshold(image, 0, 255, cv2.THRESH_BINARY_INV+cv2.THRESH_OTSU)\n17   cv2.imshow(\"\
  逆二值化收据\", inverseBinarizedImage)\n18   print(\"大津逆二值化的阈值\", Ti)\n19   cv2.waitKey(0)\n\
  清单 3-18\n大津二值化\n```\n\n清单 3-18 中的代码示例与清单 3-16 中的代码示例非常相似，区别如下：\n\n*   第 11 行在 `cv2.THRESH_BINARY`\
  \ 之外还使用了一个额外的标志 `cv2.THRESH_OTSU`，并且阈值被传入为 0。\n*   第 16 行在 `cv2.THRESH_BINARY_INV`\
  \ 之外使用了标志 `cv2.THRESH_OTSU`，同样阈值被设置为 0。\n*   我们在第 12 行和第 18 行有 `print` 语句，用于打印计算出的阈值。图\
  \ 3-56 展示了这些 `print` 语句的示例输出。\n\n图 3-57 至 3-59 展示了大津法的输出样本。\n\n![](img/493065_2_En_3_Fig59_HTML.jpg)\n\
