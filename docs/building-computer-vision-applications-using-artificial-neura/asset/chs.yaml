  \n\n\n## 检测视频帧中的物体\n\n物体检测的代码与我们在第 6 章中用于相同目的的代码几乎一致。区别在于，这里我们创建了一个无限循环，在循环中每次读取一帧图像，并调用\
  \ `track_object()` 函数来追踪该帧中的物体。`track_object()` 函数内部调用了我们在第 6 章代码清单 6-15 中实现的同一个\
  \ `run_inference_for_single_image()` 函数。\n\n`run_inference_for_single_image()` 函数的输出是一个字典，包含\
  \ `detection_classes`、`detection_boxes` 和 `detection_scores`。我们将利用这些值来计算每个物体的唯一标识并追踪其位置。\n\
  \n代码清单 7-3 展示了 `streamVideo()` 函数，该函数实现了无限循环，用于从视频源读取流式帧。\n\n在代码清单 7-3 中，第 115 行开始\
  \ `streamVideo()` 函数的代码块。第 116 行使用 `global` 关键字声明了线程锁。\n\n第 117 行开始无限 `while` 循环。在此循环内，第一行（第\
  \ 118 行）通过调用 `VideoCaptureAsync` 类的 `read()` 函数读取当前视频帧（图像）。`read()` 函数返回一个元组，包含一个表示帧是否成功读取的布尔值，以及一个图像帧的\
  \ NumPy 数组。\n\n如果帧成功获取（第 119 行），则获取锁（第 120 行），以确保在当前线程的图像仍在进行物体检测时，其他线程不会修改该帧的 NumPy\
  \ 数组。\n\n第 121 行通过传递模型对象和帧的 NumPy 数组来调用 `track_object()` 函数。我们将在后面的代码清单 7-13 中了解\
