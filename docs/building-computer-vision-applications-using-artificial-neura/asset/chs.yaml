  \n## 基于阈值处理的二值化\n\n*图像二值化*是将灰度或彩色图像转换为二值图像的过程，其中每个像素仅由两个可能值之一表示：黑色或白色。二值化通常通过对图像中的像素应用阈值来实现。强度低于阈值的像素被赋值为黑色（0），而强度高于阈值的像素被赋值为白色（255）。结果是一个二值图像，它通过强调物体边缘并消除强度上的细节和变化来简化图像。二值化广泛应用于各种图像处理应用，如物体检测、分割和字符识别。\n\
  \nOpenCV 支持三种类型的阈值处理技术：简单阈值处理、自适应阈值处理和 Otsu 二值化。\n\n\n\n### 简单阈值处理\n\n在简单阈值处理中，我们手动选择一个阈值\
  \ *T*。所有大于该 *T* 值的像素被设置为 255，所有小于或等于 *T* 的像素被设置为 0。\n\n有时，进行二值化反转会很有用，在这种情况下，大于阈值的像素被设置为\
  \ 0，而小于阈值的像素被设置为 255。\n\n让我们看一个使用 OpenCV 的 `threshold()` 函数对图像进行二值化的示例。该函数接受以下参数：\n\
  \n*   需要二值化的原始灰度图像\n*   阈值 *T*\n*   当像素值大于阈值时将被设置的最大值\n*   一种阈值处理方法，例如 `THRESH_BINARY`\
  \ 或 `THRESH_BINARY_INV`\n\n`threshold()` 函数返回一个包含阈值和二值化图像的元组。\n\n清单 3-16 将灰度图像转换为二值图像。\n\
  \n```\nFilename: Listing_3_16.py\n1    import cv2\n2    import numpy as np\n\n4\
  \    # 加载图像\n5    image = cv2.imread(\"images/scanned_doc.png\")\n6    # 将图像转换为灰度图\n\
  7    image = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)\n8    cv2.imshow(\"原始灰度收据\"\
  , image)\n\n10   # 使用阈值处理对图像进行二值化\n11   (T, binarizedImage) = cv2.threshold(image,\
  \ 60, 255, cv2.THRESH_BINARY)\n12   cv2.imshow(\"二值化收据\", binarizedImage)\n\n14\
  \   # 使用反转阈值处理进行二值化\n15   (Ti, inverseBinarizedImage) = cv2.threshold(image, 60,\
  \ 255, cv2.THRESH_BINARY_INV)\n16   cv2.imshow(\"反转二值化收据\", inverseBinarizedImage)\n\
  17   cv2.waitKey(0)\n清单 3-16\n使用简单阈值处理进行二值化\n```\n\n清单 3-16 展示了两种二值化方法：简单二值化和反转二值化。第\
  \ 5 行加载图像，第 8 行将图像转换为灰度图像，因为阈值函数的输入应为灰度图像。\n\n第 11 行调用 OpenCV 的 `threshold()` 函数，并传入灰度图像、阈值、最大像素值和阈值处理方法\
  \ `THRESH_BINARY` 作为参数。`threshold()` 函数返回一个元组，其中包含我们在参数中提供的相同阈值以及二值化图像。由于我们使用 `THRESH_BINARY`\
  \ 作为阈值处理方法，所有值大于 60 的像素将被设置为最大值 255，而值小于或等于 60 的像素将被设置为 0。\n\n第 15 行与第 11 行类似，不同之处在于\
  \ `threshold()` 函数的最后一个参数是 `THRESH_BINARY_INV` 作为阈值处理函数。通过传入 `THRESH_BINARY_INV`，我们指示\
  \ `threshold()` 方法执行与 `THRESH_BINARY` 方法相反的操作：如果像素强度小于 60，则将像素值设置为 255；否则，将其设置为\
  \ 0。\n\n两种阈值处理方法的示例输出以及原始图像如图 3-50 至 3-52 所示。\n\n![](img/493065_2_En_3_Fig52_HTML.jpg)\n\
  \n一张截图显示了一组写在深色背景上的文本。标题为“反转二值化收据”。底部提供了以下值：X = 195。Y = 199。L, 0。\n\n图 3-52\n使用简单反转阈值处理得到的二值化图像\n\
  \n![](img/493065_2_En_3_Fig51_HTML.jpg)\n\n一张截图显示了一组写在明亮纯色背景上的文本。标题为“二值化收据”。底部提供了以下值：X\
  \ = 290。Y = 198。L, 255。\n\n图 3-51\n使用简单阈值处理得到的二值化图像\n\n![](img/493065_2_En_3_Fig50_HTML.jpg)\n\
  \n一张截图显示了一组写在深色背景上的文本。标题为“原始灰度收据”。底部提供了以下值：X = 175。Y = 152。L, 157。\n\n图 3-50\n带有深色背景污渍/斑点的原始灰度图像\n\
  \n为了演示这个示例，我拍摄了一张严重污损文档的扫描图像（图 3-50），并使用简单阈值处理对其进行了二值化。`THRESH_BINARY` 方法生成了输出，其中包含白色背景上的黑色文本。`THRESH_BINARY_INV`\
  \ 方法创建了黑色背景上的白色文本图像。\n\n在简单阈值处理中，一个全局阈值应用于图像中的所有像素，并且我们需要预先知道阈值。如果我们正在处理大量图像，并希望根据图像类型和强度变化来调整阈值，那么简单阈值处理可能不是理想的方法。在这种情况下，可以应用其他阈值处理方法，例如自适应阈值处理或\
  \ Otsu 二值化，来解决这一挑战。\n\n\n\n### 自适应阈值处理\n\n*自适应阈值处理*是一种根据每个像素的局部邻域动态调整其阈值的技术。这能更好地处理图像中光照条件变化和强度变化的情况。\n\
  \n在自适应阈值处理中，算法会根据像素周围的一个小区域来确定该像素的阈值。因此，同一图像中的不同区域可以拥有不同的阈值。\n\n清单 3-17 展示了使用自适应阈值处理对灰度图像进行二值化的方法。\n\
  \n```\nFilename: Listing_3_17.py\n1    import cv2\n2    import numpy as np\n\n4\
  \    # 加载图像\n5    image = cv2.imread(\"images/boat.jpg\")\n6    # 将图像转换为灰度图\n7 \
  \   image = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)\n\n9    cv2.imshow(\"原始灰度图像\"\
  , image)\n\n11   # 使用自适应阈值处理和简单均值进行二值化\n12   binarized = cv2.adaptiveThreshold(image,\
  \ 255, cv2.ADAPTIVE_THRESH_MEAN_C, cv2.THRESH_BINARY, 7, 3)\n13   cv2.imshow(\"\
  使用简单均值二值化的图像\", binarized)\n\n15   # 使用自适应阈值处理和高斯均值进行二值化\n16   binarized = cv2.adaptiveThreshold(image,\
  \ 255, cv2.ADAPTIVE_THRESH_GAUSSIAN_C, cv2.THRESH_BINARY_INV, 11, 3)\n17   cv2.imshow(\"\
  使用高斯均值二值化的图像\", binarized)\n\n19   cv2.waitKey(0)\n清单 3-17\n使用自适应阈值处理进行二值化\n```\n\
  \n在清单 3-17 中，我们对一张包含不同程度阴影和颜色强度的示例图像应用了自适应阈值处理。目标是使用此技术将图像转换为二值图像。让我们探讨一下这个清单中发生了什么。\n\
  \n第 5 行，像往常一样，加载图像。第 7 行将图像转换为灰度图像，因为阈值函数的输入是灰度图像。\n\n第 12 行使用 OpenCV 的 `adaptiveThreshold()`\
  \ 函数执行实际的二值化。该函数接受以下参数：\n\n*   需要二值化的灰度图像\n*   最大值\n*   计算阈值的方法（稍后详细介绍）\n*   二值化方法，例如\
  \ `cv2.THRESH_BINARY` 或 `cv2.THRESH_BINARY_INV`\n*   用于计算阈值的邻域大小\n*   一个常数 *C*，将从计算出的阈值中减去\n\
  \n在此示例中，第 12 行我们使用了 `cv2.ADAPTIVE_THRESH_MEAN_C` 来表示我们希望通过计算像素周围邻域像素的均值来确定该像素的阈值。本例中的邻域大小为\
  \ 7×7。第 12 行的最后一个参数 3 是从计算出的阈值中减去的常数。\n\n第 16 行与第 12 行类似，不同之处在于我们使用了 `cv2.ADAPTIVE_GAUSSIAN_C`\
  \ 来表示我们希望通过计算像素周围所有像素的加权均值来确定该像素的阈值。\n\n图 3-53 至 3-55 展示了清单 3-17 的示例输出。\n\n![](img/493065_2_En_3_Fig55_HTML.jpg)\n\
  \n一张截图显示了一个人借助船桨驾驶小船的画面。主体在深色背景上以较浅的色调勾勒出来。标题为“使用高斯均值二值化的图像”。底部标注了以下数值：X = 162。Y\
  \ = 246。L, 0。\n\n图 3-55\n使用高斯均值的自适应阈值处理得到的二值化图像\n\n![](img/493065_2_En_3_Fig54_HTML.jpg)\n\
  \n一张截图显示了一个人借助船桨驾驶小船的画面。标题为“使用简单均值二值化的图像”。底部标注了以下数值：X = 379。Y = 51。L, 255。\n\n图\
