  \n\n### 直方图均衡化\n\n现在你已经更清楚地理解了直方图所代表的内容，我们可以利用这一概念来提升图像质量。*直方图均衡化*是一种用于调整图像对比度的图像处理技术。它通过重新分布像素强度，使得像素数量较少的强度与像素数量较多的强度达到均衡，如图\
  \ 4-8 所示。\n\n![](img/493065_2_En_4_Fig8_HTML.png)\n\n直方图均衡化的示意图。X 轴和 Y 轴上绘制了两个直方图，它们之间有一个标记为\
  \ T 的弯曲箭头。\n\n图 4-8\n\n直方图均衡化（来源：维基百科，[*https://wikipedia.org/wiki/Histogram_equalization*](https://wikipedia.org/wiki/Histogram_equalization)）\n\
  \n清单 4-3 提供了一个观察直方图均衡化实际效果的示例。尽管清单 4-3 包含大量代码，但你可以通过首先关注第 1 到 19 行来快速简化它，并注意到这些代码与清单\
  \ 4-1 中用于计算和绘制灰度图像直方图的代码完全相同。\n\n在第 21 行，我们使用了 OpenCV 的`equalizeHist()`函数，该函数将原始图像作为输入，并调整其像素强度以增强对比度。第\
  \ 22 到 33 行计算并显示了增强后（均衡化后）图像的直方图。\n\n图 4-9 到 4-12 展示了清单 4-3 的输出结果，以及原始图像和均衡化后图像的直方图对比。\n\
