  \n\n### 灰度共生矩阵（GLCM）\n\n*灰度共生矩阵（GLCM）* 捕捉了在指定像素偏移内同时出现的像素值的统计分布。*偏移* 表示相邻像素的相对位置和方向。顾名思义，GLCM\
  \ 是专门为灰度图像设计的。\n\nGLCM 计算像素值 *i* 与像素值 *j* 在水平、垂直或对角线方向上共现的次数。\n\n对于 GLCM 计算，我们指定一个偏移距离\
  \ *d* 和一个角度 ϴ（theta）。角度 ϴ（theta）可以是 0°（水平）、90°（垂直）、45°（右上方对角线）或 135°（左上方对角线），如图\
  \ 4-13 所示。\n\n![](img/493065_2_En_4_Fig13_HTML.png)\n\n一个 8x8 网格上的像素位置矩阵。像素位于底部一个变暗像素的\
  \ 135、90、45 和 0 度方向。\n\n图 4-13\n\n相邻像素位置（距离和角度）示意图\n\nGLCM 的重要性在于它提供了图像上空间关系的信息。这与直方图不同，因为直方图不提供任何关于图像大小、像素位置或其关系的信息。\n\
  \n尽管 GLCM 是一个如此重要的矩阵，但我们并不直接将其用作机器学习的特征向量。我们使用 GLCM 计算关于图像的某些关键统计数据，这些统计数据被用作任何机器学习训练的特征。您将在本节中了解这些统计数据以及如何计算它们。\n\
  \n虽然 OpenCV 在内部使用 GLCM，但它没有直接提供任何函数来计算它。为了计算 GLCM，我们将使用另一个 Python 库：skimage 的 `feature`\
  \ 包。\n\n以下是我们将用于计算 GLCM 的函数的描述：\n\n```\ngraycomatrix(image, distances, angles, levels,\
  \ symmetric,normed)\n```\n\n`graycomatrix()` 函数接受以下参数：\n\n*   `image`：这是灰度图像的 NumPy\
  \ 表示。请记住，图像必须是灰度图像。\n*   `distances`：这是一个像素对距离偏移的列表。\n*   `angles`：这是一个像素对之间角度的列表。确保角度是弧度而不是度数。\n\
  *   `levels`：这是一个可选参数，适用于具有 16 位像素值的图像。在大多数情况下，我们使用 8 位图像像素，其值范围可以从 0 到 255。对于 8\
  \ 位图像，此参数的最大值为 256。\n*   `symmetric`：这是一个可选参数，接受一个布尔值。值 `True` 表示输出矩阵将是对称的。默认值为\
  \ `False`。\n*   `normed`：这也是一个可选参数，接受一个布尔值。布尔值 `True` 表示每个输出矩阵都通过除以给定偏移的累积共现总数来进行归一化。默认值为\
  \ `False`。\n\n`graycomatrix()` 函数返回一个 4D ndarray。这是灰度共生直方图。输出值 `P[i,j,d,theta]`\
  \ 表示灰度级 *j* 在距离 *d* 和角度 *theta* 处从灰度级 *i* 出现的次数。如果参数 normed 为 `False`（这是默认值），则输出类型为\
  \ `uint32`（32 位无符号整数）；否则，为 `float64`（64 位浮点数）。\n\n清单 4-4 展示了如何使用 `skimage` 库计算 GLCM\
  \ 以计算特征统计信息。\n\n```\nFilename: Listing_4_4.py\n1    import cv2\n2    import skimage.feature\
  \ as sk\n3    import numpy as np\n\n5    #从磁盘读取图像并将其转换为灰度图\n6    image = cv2.imread(\"\
  images/nature.jpg\")\n7    image = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)\n\n9\
  \    #计算灰度图像的 GLCM\n10   glcm = sk.graycomatrix(image,[2],[0, np.pi/2])\n11   print(glcm)\n\
  清单 4-4\n使用 graycomatrix() 函数计算 GLCM\n```\n\n第 10 行通过传递图像 NumPy 变量和距离 `[2]` 来使用 `graycomatrix()`\
  \ 计算 GLCM。第三个参数是弧度。`np.pi/2` 是 90 度角的弧度。最后一行，第 11 行，简单地打印了 4D ndarray。\n\n如前所述，GLCM\
  \ 不直接用作特征，但我们使用它来计算一些有用的统计数据，这让我们了解图像的纹理。下表列出了我们可以推导出的统计数据：\n\n| 统计量 | 描述 |\n| ---\
  \ | --- |\n| 对比度（Contrast） | 测量 GLCM 中的局部变化。 |\n| 相关性（Correlation） | 测量指定像素对的联合概率出现。\
  \ |\n| 能量（Energy） | 提供 GLCM 中平方元素的总和。也称为均匀性或角二阶矩。 |\n| 同质性（Homogeneity） | 测量 GLCM\
  \ 中元素分布与 GLCM 对角线的接近程度。 |\n\n以下一组高级公式用于计算上述统计数据。对这些公式进行详细的数学分析超出了本书的范围，但鼓励您深入研究这些统计计算背后的数学基础。\n\
  \n*   对比度 = ![$$ \\sum \\limits_{i,j=0}^{levels-1}{P}_{i,j}{\\left(i-j\\right)}²\
  \ $$](img/493065_2_En_4_Chapter_TeX_IEq1.png)\n\n*   不相似性（Dissimilarity）= ![$$ \\\
  sum \\limits_{i,j=0}^{levels-1}{P}_{i,j}\\left|i-j\\right| $$](img/493065_2_En_4_Chapter_TeX_IEq2.png)\n\
  \n*   同质性 = ![$$ \\sum \\limits_{i,j=0}^{levels-1}\\frac{P_{i,j}}{1+{\\left(i-j\\\
  right)}²} $$](img/493065_2_En_4_Chapter_TeX_IEq3.png)\n\n*   ASM = ![$$ \\sum \\\
  limits_{i,j=0}^{levels-1}{P}_{i,j}² $$](img/493065_2_En_4_Chapter_TeX_IEq4.png)\n\
  \n*   能量 = ![$$ \\sqrt{ASM} $$](img/493065_2_En_4_Chapter_TeX_IEq5.png)\n\n*   相关性\
  \ = ![$$ \\sum \\limits_{i,j=0}^{levels-1}{P}_{i,j}\\left[\\frac{\\left(i-{\\mu}_i\\\
  right)\\kern0.5em \\left(j-{\\mu}_j\\right)}{\\sqrt{\\left({\\sigma}_i²\\right)\\\
  kern0.5em \\left({\\sigma}_j²\\right)}}\\right] $$](images/493065_2_En_4_Chapter/493065_2_En_4_Chapter_TeX_IEq6.png)\n\
  \n在这些公式中，*P* 是要为其计算指定属性的 GLCM 直方图。值 *P*[*i*,*j*,*d*,*theta*] 是灰度级 *j* 在距离 *d* 和角度\
  \ *theta* 处从灰度级 *i* 出现的次数。\n\n我们将使用 `skimage` 包中的 `graycoprops()` 从 GLCM 计算这些统计数据。以下是此函数的定义：\n\
  \n```\ngraycoprops(P, prop='contrast')\n```\n\n第一个参数是 GLCM 直方图（参见清单 4-4，第 10 行）。\n\
  \n第二个参数是我们要计算的属性。我们可以为此参数传递以下任何属性：`contrast`、`dissimilarity`、`homogeneity`、`energy`、`correlation`\
  \ 和 `ASM`。如果您不传递第二个参数，它将默认为 `contrast`。\n\n清单 4-5 展示了如何计算这些统计数据。\n\n```\nFilename:\
  \ Listing_4_5.py\n1    import cv2\n2    import skimage.feature as sk\n3    import\
  \ numpy as np\n\n5    #从磁盘读取图像并将其转换为灰度图\n6    image = cv2.imread(\"images/nature.jpg\"\
  )\n7    image = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)\n\n9    #计算灰度图像的 GLCM\n\
  10   glcm = sk.graycomatrix(image,[2],[0, np.pi/2])\n\n12   #计算对比度\n13   contrast\
  \ = sk.graycoprops(glcm)\n14   print(\"对比度:\",contrast)\n\n16   #计算 '不相似性'\n17 \
  \  dissimilarity = sk.graycoprops(glcm, prop='dissimilarity')\n18   print(\"不相似性:\
  \ \", dissimilarity)\n\n20   #计算 '同质性'\n21   homogeneity = sk.graycoprops(glcm,\
  \ prop='homogeneity')\n22   print(\"同质性: \", homogeneity)\n\n24   #计算 'ASM'\n25\
  \   ASM = sk.graycoprops(glcm, prop='ASM')\n26   print(\"ASM: \", ASM)\n\n28   #计算\
  \ '能量'\n29   energy = sk.graycoprops(glcm, prop='energy')\n30   print(\"能量: \",\
  \ energy)\n\n\n\n32   #计算'相关性'\n33   correlation = sk.graycoprops(glcm, prop='correlation')\n\
  34   print(\"相关性: \", correlation)\n列表 4-5\n从 GLCM 计算图像统计量\n```\n\n列表 4-5 展示了如何使用\
  \ `graycoprops()` 函数，并通过向 `prop` 传递不同参数来计算相应的统计量。图 4-14 展示了列表 4-5 的输出结果。\n\n![](img/493065_2_En_4_Fig14_HTML.png)\n\
  \n一段包含 6 行文字的文本，表示不同统计量的输出结果。它列出了对比度、相异性、同质性、ASM、能量和相关性的值。\n\n图 4-14\n\n基于 GLCM\
  \ 的各种统计量输出\n\n### HOG\n\n*方向梯度直方图（HOG）* 是计算机视觉和机器学习中用于目标检测的重要特征描述子。HOG 描述了图像中物体的结构形状和外观。HOG\
  \ 算法计算图像局部区域中梯度方向的出现频率。\n\nHOG 算法按以下五个阶段工作：\n\n*   *阶段 1：全局图像归一化*：这是一个可选阶段，仅用于减少光照效应的影响。在此阶段，图像通过以下方法之一进行全局归一化：\n\
  \    *   *伽马（幂律）压缩*：每个像素值 *p* 通过应用 log(p) 进行变换。这种方法对像素的压缩过于强烈，不推荐使用。\n\n*   *平方根归一化*：每个像素值\
  \ *p* 被变换为 [?][?][?]*p*（像素值的平方根）。与伽马压缩相比，这种方法对像素的压缩程度较小，被认为是一种首选的归一化技术。\n\n*   *方差归一化*：对于大多数机器学习工作，与其他两种方法相比，该技术能提供更好的结果。在此方法中，我们首先计算像素值的均值（\U0001D707\
  ）和标准差（***σ***）。然后，根据以下公式对每个像素值 *p* 进行归一化：\n\n*Tp* = (*p* − *μ*)/***σ***\n\n*   *阶段\
  \ 2：计算 x 和 y 方向的梯度图像*：第二阶段计算一阶图像梯度，以捕获轮廓、外形和部分纹理信息。如果需要捕获类似条形的特征（例如人体的四肢），还需要包含二阶图像导数。列表\
  \ 3-19 和 3-20（在第 3 章中）展示了如何计算 X 和 Y 方向的梯度。如需复习，请参考第 3 章的“梯度与边缘检测”部分。假设 X 方向的梯度为\
  \ G[x]，Y 方向的梯度为 G[y]，则梯度幅值使用以下公式计算：\n\n![$$ \\left|\\mathrm{G}\\right|=\\sqrt{G_x²+{G}_y²}\
  \ $$](img/493065_2_En_4_Chapter_TeX_Equa.png)\n\n最后，使用以下公式计算梯度方向：\n\n![$$ \\Theta\
  \ =\\arctan \\kern0.5em \\left({\\mathrm{G}}_{\\mathrm{y}}/{\\mathrm{G}}_{\\mathrm{x}}\\\
  right) $$](img/493065_2_En_4_Chapter_TeX_Equb.png)\n\n一旦计算出梯度和方向的值，就会计算直方图。\n\n\
  ![](img/493065_2_En_4_Fig15_HTML.png)\n\n9 个像素矩阵和像素块。每个块由矩阵中不同位置的 9 个单元组成，从左上角到右下角。\n\
  \n图 4-15\n\n通过分组单元形成块（3×3 单元的块）\n\n*   *阶段 3：计算梯度直方图*：图像被划分为称为*单元*的小空间区域。利用之前的 |G|\
  \ 和 Θ 公式 ![](img/493065_2_En_4_Figa_HTML.gif) 一个指向右上方箭头的图标。，我们在每个单元的所有像素上累积一个关于梯度或边缘方向的局部一维直方图。每个方向直方图将梯度角度范围划分为固定数量的预定区间。单元中像素的梯度幅值用于向方向直方图投票。投票的权重就是给定像素处的梯度幅值\
  \ |G|。\n\n\n\n*   *第 4 阶段：跨块归一化*：少量单元格被组合成一个方形块。现在整个图像被划分为多个块（每个块由一组单元格组成）。块的形成通常通过在多个块之间共享单元格来实现。因此，同一个单元格会以不同的归一化方式多次出现在最终的输出向量中。然后对这些局部块进行归一化处理。这是通过在局部块内累积局部直方图“能量”的度量来完成的。这些归一化后的块描述符就是\
  \ HOG。图 4-15 展示了块的形成过程。\n\n*   *第 5 阶段：展平为特征向量*：在所有块归一化之后，我们获取生成的直方图并将它们连接起来，以构建最终的特征向量。\n\
  \n如果对 HOG 算法的这个解释让你感到不知所措，请不要担心。你不需要从头开始编写代码来实现 HOG。有许多现成的库提供了预构建的函数，可以轻松计算 HOG。\n\
  \n我们将使用`scikit-image`库来计算图像的 HOG。`scikit-image`库中`skimage`包内的子包`feature`提供了一种便捷的方法来计算\
  \ HOG。以下是函数签名：\n\n```\nout, hog_image = hog(image, orientations=9, pixels_per_cell=(8,\
  \ 8), cells_per_block=(3, 3), block_norm='L2-Hys', visualize=False,\ntransform_sqrt=False,\
  \ feature_vector=True, multichannel=None)\n```\n\n参数说明如下：\n\n*   `image`：这是输入图像的\
  \ NumPy 表示。\n\n*   `orientation`：方向区间的数量，默认为 9。\n\n*   `pixels_per_cell`：每个单元格中的像素数，以元组形式表示；对于\
  \ 8×8 的单元格大小，默认为(8,8)。\n\n*   `cells_per_block`：每个块中的单元格数，以元组形式表示；默认为(3,3)，表示 3×3\
  \ 个单元格，而非像素。\n\n*   `block_norm`：块归一化方法，是一个字符串，其值可以是以下之一：L1、L1-sqrt、L2、L2-Hys。这些归一化字符串的解释如下：\n\
  \    *   L1：使用 L1 范数进行归一化，公式如下：\n\nL1 范数 = ![$$ \\sum \\limits_{r=1}^n\\left|{X}_r\\\
  right| $$](img/493065_2_En_4_Chapter_TeX_IEq7.png)\n\n*   L1-sqrt：L1 归一化值的平方根。它使用以下公式：\n\
  \nL1-sqrt = ![$$ \\sqrt{\\sum \\limits_{r=1}^n\\left|{X}_r\\right|} $$](img/493065_2_En_4_Chapter_TeX_IEq8.png)\n\
  \n*   L2：使用 L2 范数进行归一化，公式如下：\n\nL2 范数 = ![$$ \\sqrt{\\sum \\limits_{r=1}^n{\\left|{X}_r\\\
  right|}²} $$](img/493065_2_En_4_Chapter_TeX_IEq9.png)\n\n*   L2-Hys：这是参数`block_norm`的默认归一化方法。L2-Hys\
  \ 的计算方法是：首先进行 L2 归一化，将结果限制在最大 0.2，然后重新计算 L2 归一化。\n\n*   `visualize`：如果设置为`True`，该函数还会返回\
  \ HOG 的图像。其默认值设置为`False`。\n\n*   `Transform_sqrt`：如果设置为`True`，该函数将在处理前应用幂律压缩来归一化图像。\n\
  \n*   `feature_vector`：此参数的默认值设置为`True`，指示函数将输出数据作为特征向量返回。\n\n*   `multichannel`：将此参数的值设置为`True`，表示输入图像包含多通道。图像的维度通常表示为高度\
  \ × 宽度 × 通道。如果此参数的值为`True`，则最后一个维度（通道）被解释为颜色通道，否则被解释为空间维度。\n\n这个`hog()`函数返回什么？\n\
  \n*   `out`：该函数返回一个包含`(n_blocks_row, n_blocks_col, n_cells_row, n_cells_col, n_orient)`的\
  \ ndarray。这是图像的 HOG 描述符。如果参数`feature_vector`为`True`，则返回一个一维（展平）数组。\n\n*   `hog_image`：如果参数`visualize`设置为`True`，该函数还会返回\
  \ HOG 图像的可视化结果。\n\n清单 4-6 展示了如何使用`skimage`包计算 HOG。\n\n```\nFilename: Listing_4_6.py\n\
  1    import cv2\n2    import numpy as np\n3    from skimage import feature as sk\n\
  \n5    #从磁盘加载图像\n6    image = cv2.imread(\"images/obama.jpg\")\n7    #调整图像大小。\n\
  8    image = cv2.resize(image,(int(image.shape[0]/5),int(image.shape[1]/5)))\n\n\
  10   # HOG 计算\n11   (HOG, hogImage) = sk.hog(image, orientations=9, pixels_per_cell=(8,\
  \ 8),\n12       cells_per_block=(2, 2), visualize=True, transform_sqrt=True, block_norm=\"\
  L2-Hys\", feature_vector=True)\n\n14   print(\"图像维度\",image.shape)\n15   print(\"\
  特征向量维度:\", HOG.shape)\n\n17   #显示原始图像和 HOG 图像\n18   cv2.imshow(\"原始图像\", image)\n\
  19   cv2.imshow(\"HOG 图像\", hogImage)\n20   cv2.waitKey(0)\n清单 4-6\nHOG 计算\n```\n\
  \n理解 HOG 的概念很重要，因为我们将在第 6、7 和 8 章中利用它来进行实际实现。虽然我们花了数页篇幅来理解这个概念，但计算 HOG 却非常简洁，只需要一行代码（清单\
  \ 4-6 的第 11 行）。\n\n我们使用`skimage`包中`feature`子包的`hog()`函数。传递给`hog()`函数的参数已在前面解释过。\n\
  \n我们如何知道在`hog()`函数中传递了正确的参数值呢？实际上，并没有既定的规则。根据经验法则，我们应该从所有默认参数开始，然后在分析结果时进行调整。\n\n\
  值得一提的是，`hog()`函数会生成一个维度非常高的直方图。一个 32×32 的图像，如果`pixel_per_cell=(4,4)`且`cells_per_block=(2,2)`，将生成\
  \ 1764 维的结果。同样，一个 128×128 像素的图像将生成 34596 维的输出。因此，密切关注参数，并适当调整图像大小以减少输出维度，这一点极其重要。这将对内存、存储需求和网络传输时间产生巨大影响。\n\
