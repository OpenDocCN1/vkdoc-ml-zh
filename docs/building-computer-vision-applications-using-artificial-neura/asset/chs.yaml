- "# 2. 图像与视频处理的核心概念\n\n本章介绍图像的基本构成单元，并描述操作它们的各种方法。本章的学习目标如下：\n\n*   理解图像的最小单元（像素）以及颜色是如何表示的\n\
  \n*   学习像素在图像中是如何组织的，以及如何访问和操作它们\n\n*   使用 Python 编写代码，并利用 OpenCV 通过示例来访问和操作图像\n\
  \n*   在图像上绘制不同的形状，例如线条、矩形和圆形\n\n## 图像处理\n\n*图像处理*是一种用于操作数字图像以获得改进图像或从中提取有价值信息的方法。它涉及将图像作为输入，并输出另一幅图像或与该图像相关的特定特征和属性。视频由一系列图像或帧组成，因此也可以使用图像处理技术进行处理。在本章中，我们将深入探讨数字图像处理的基本概念。此外，你将获得处理图像和编写代码来操作图像的基本技能。\n\
  \n\n\n## 图像基础\n\n*数字图像*是物体/场景或扫描文档的电子表示。图像的数字化意味着将其转换为一系列数字，并将这些数字存储在计算机存储系统中。理解这些数字如何排列以及如何操作它们，是本章的主要目标。本章将解释构成图像的基本组件，并指导你使用\
  \ OpenCV 和 Python 操作图像的过程。\n\n### 像素\n\n图像可以可视化为按行和列排列的点的集合，其中每个点代表一个具有特定颜色的像素。这些像素被赋予数值，这些数值决定了它们各自的颜色。你可以将图像想象成一个由方形单元格组成的网格，其中每个单元格对应一个具有特定颜色的像素。例如，如果我们有一张\
  \ 300×400 像素的图像，这意味着该图像被构造成一个具有 300 行和 400 列的网格，总共产生 120,000 个像素。\n\n#### 像素颜色\n\
  \n像素可以用两种不同的方式表示：灰度图和彩色图。\n\n##### 灰度图\n\n在灰度图像中，每个像素取 0 到 255 之间的值。值 0 代表黑色，255\
  \ 代表白色。介于两者之间的值是不同深浅的灰色。接近 0 的值是较暗的灰色，而接近 255 的值是较亮的灰色。\n\n##### 彩色图\n\nRGB（代表红、蓝、绿）颜色模型是像素最流行的颜色表示之一。还有其他颜色模型可用，但本书主要关注\
  \ RGB 颜色模型。\n\n在 RGB 模型中，每个像素表示为一个由三个值组成的元组，通常表示如下：（红色分量值，绿色分量值，蓝色分量值）。这三种颜色中的每一种都由\
  \ 0 到 255 之间的整数表示。以下是一些示例：\n\n*   (0,0,0) 是黑色。\n*   (255,0,0) 是纯红色。\n*   (0,255,0)\
  \ 是纯绿色。\n\nW3Schools 网站是尝试 RGB 元组不同组合以探索更多模式的好地方（[`https://www.w3schools.com/colors/colors_rgb.asp`](https://www.w3schools.com/colors/colors_rgb.asp)）。使用\
  \ RGB 计算器探索以下每个元组代表什么颜色：\n\n*   (0,0,255)\n*   (255,255,255)\n*   (0,0,128)\n* \
  \  (128,0,128)\n*   (128,128,0)\n\n现在尝试制作黄色。这里有一个提示：红色和绿色混合成黄色。这意味着纯红色 (255)、纯绿色\
  \ (255) 和没有蓝色 (0) 将产生黄色。因此，黄色的 RGB 元组是 (255,255,0)。\n\n现在你已经对像素及其颜色有了很好的理解，让我们探索像素在图像中是如何排列的，以及如何访问它们。下一节将讨论图像处理中的坐标系概念。\n\
  \n## 坐标系\n\n如前所述，图像中的像素以网格形式排列，该网格由行和列组成。想象一个八行八列的方形网格。这形成了一张 8×8 或 64 像素的图像。将其视为一个二维坐标系，其中原点\
  \ (0,0) 位于左上角。图 2-1 展示了我们示例中的 8×8 像素图像。\n\n![](img/493065_2_En_2_Fig1_HTML.png)\n\
  \n一个 8×8 方形网格图案的示意图，四个角的坐标分别为 (0, 0)、(0, 7)、(7, 7) 和 (0, 7)。网格中的一个像素被高亮显示，其坐标标记为\
  \ (4, 3)。\n\n图 2-1\n像素坐标系\n\n以左上角作为图像坐标系的原点，右上角的像素表示为 (0,7)，左下角的像素为 (7,0)，右下角的像素为\
  \ (7,7)。这可以概括为 (x,y)，其中 x 是单元格距图像左边缘的位置，y 是距图像顶部边缘向下的垂直位置。在图 2-1 中，红色像素位于从左数第五个位置，从上数第四个位置。由于坐标系从\
  \ 0 开始，图 2-1 中所示红色像素的坐标为 (4,3)。\n\n为了更清楚地说明这个概念，请考虑图 2-2，这是一张 8×8 像素的图像，上面写着字母 *H*。另外，为简单起见，假设这是一张灰度图像，字母\
  \ *H* 用黑色书写，图像的其余区域为白色。\n\n![](img/493065_2_En_2_Fig2_HTML.png)\n\n一个示意图展示了 8×8\
  \ 方形网格图案，四个角的坐标已标记。字母 H 在网格上从 (1, 0) 到 (7, 1)、(6, 0) 到 (6, 7) 以及穿过中心第 4 行和第 5 行的位置被着色。\n\
  \n图 2-2\n像素坐标系示例\n\n请记住，在灰度模型中，黑色像素用 0 表示，白色像素用 255 表示。图 2-3 显示了 8×8 网格内每个像素的值。\n\
  \n![](img/493065_2_En_2_Fig3_HTML.jpg)\n\n一个介于 y 轴和 x 轴之间的 8×8 矩阵。像素的值为 255 或 0。零值位于第\
  \ 2 列和第 7 列，以及第 4 行和第 5 行。\n\n图 2-3\n像素矩阵及其值\n\n那么，位置 (1,4) 处的像素值是多少？位置 (2,2) 处的像素值呢？\n\
  \n现在，你应该清楚地理解图像是如何表示为排列在网格中的数字的。这些数值被序列化并存储在计算机的存储系统中。当图像显示在屏幕上时，这些数字被解释并渲染为实际图像。\n\
  \n至此，你已经学会了如何使用坐标系访问单个像素，这使你能够精确定位图像网格中的特定位置。此外，你还学会了如何通过操作像素的数值来为这些像素分配颜色。通过掌握这些概念，你现在理解了图像是如何构建的，以及如何以编程方式与它们交互。\n\
  \n有了坚实的图像表示基础和理解，你现在已经准备好通过 Python 和 OpenCV 编码获得实践经验。在下一节中，我将逐步指导你编写代码，这些代码将从计算机磁盘加载图像、访问单个像素、执行操作，并将修改后的图像保存回磁盘。\n\
  \n让我们深入图像处理的精彩世界，开始我们的动手实践之旅吧！\n\n\n\n## 使用 Python 和 OpenCV 代码操作图像\n\n在 OpenCV 中，图像的像素值使用\
  \ NumPy 数组表示。（不熟悉 NumPy？你可以在 [`https://numpy.org/devdocs/user/quickstart.html`](https://numpy.org/devdocs/user/quickstart.html)\
  \ 找到一份“入门”教程。）这个 NumPy 数组作为图像网格及其颜色通道的多维表示。它使我们能够高效地存储、访问和操作图像的像素值。通过利用 NumPy 数组的能力，OpenCV\
  \ 为图像处理和分析任务提供了一个强大的框架。换句话说，当你读取图像时，OpenCV 会创建一个 NumPy 数组。只需提供 (x,y) 坐标，就可以从 NumPy\
  \ 中获取像素值。\n\n当你提供 (x,y) 坐标时，NumPy 会返回该坐标处像素的颜色值，如下所示：\n\n*   *对于灰度图像*，NumPy 返回的值将是介于\
  \ 0 和 255 之间的单个值。\n\n*   *对于彩色图像*，NumPy 返回的值将是一个包含红色、绿色和蓝色的元组。请注意，OpenCV 以相反的顺序维护\
  \ RGB 序列。换句话说，OpenCV 以 BGR 序列存储颜色，*而不是* RGB 序列。请记住 OpenCV 的这个重要特性，以避免在使用 OpenCV\
  \ 时产生任何混淆。\n\n在我们编写任何代码之前，让我们确保始终使用我们的虚拟环境，该环境位于 `~/cv` 目录中，我们已经在第 1 章中使用 PyCharm\
  \ 设置好了。\n\n启动你的 PyCharm IDE 并创建一个新项目（我将我的项目命名为 cviz，是“computer vision”的缩写）。参考图 2-4，确保你已选择“Existing\
  \ Interpreter”并选中了我们的 virtualenv Python 3.8 (cv)。\n\n![](img/493065_2_En_2_Fig4_HTML.jpg)\n\
  \n一张屏幕截图显示了 PyCharm 页面，其中呈现了一个标题为“Create Project”的对话框。该对话框显示了项目解释器名称、正在使用的新环境以及选为现有解释器的\
  \ python 3.6 cv 等详细信息。底部的“Create”按钮被选中。\n\n图 2-4\n\nPyCharm IDE，展示了使用 virtualenv\
  \ 设置项目的过程\n\n### 程序：加载、探索和显示图像\n\n在本节中，我们将编写代码从文件读取图像并探索其属性。我们将利用 OpenCV 库，它提供了用于图像处理和分析的强大工具。通过将图像加载到程序中，我们将能够访问其尺寸、大小和通道信息等信息。此外，我们将在屏幕上显示图像，并等待按键以继续执行。这次探索将使我们更好地理解图像，并为后续的图像处理任务奠定基础。让我们深入研究代码并开始探索图像！\n\
  \n清单 2-1 展示了用于加载、探索和显示图像的 Python 代码。\n\n```\nFilename: Listing_2_1.py\n1    import\
  \ cv2\n\n3    # image path\n4    image_path = \"images/marsrover.png\"\n\n6    #\
  \ Read or load image from its path\n7    image = cv2.imread(image_path)\n\n9   \
  \ # image is a NumPy array\n10    print(\"Dimensions of the image: \", image.ndim)\n\
  11    print(\"Image height: \", format(image.shape[0]))\n12    print(\"Image width:\
  \ \", format(image.shape[1]))\n13    print(\"Image channels: \", format(image.shape[2]))\n\
  14    print(\"Size of the image array: \", image.size)\n\n16    # Display the image\
  \ and wait until a key is pressed\n17    cv2.imshow(\"My Image\", image)\n18   \
  \ cv2.waitKey(0)\n清单 2-1\n用于加载、探索和显示图像的 Python 代码\n```\n\n清单 2-1 中的代码解释如下：\n\n*\
  \   第 1 行：我们导入 OpenCV 库，使我们能够使用其函数和功能。\n\n*   第 4 行：我们将要从磁盘加载的图像的路径赋值给一个变量。如果你的输入路径在不同的目录中，你应该提供图像路径的完整路径或相对路径。\n\
  \n*   第 7 行：使用 OpenCV 的 `imread()` 函数，我们将图像读入一个 NumPy 数组，并将其赋值给一个名为 `image` 的变量（你可以随意命名这个变量）。\n\
  \n*   第 10 到 14 行：使用 NumPy 特性，我们打印图像数组的维度、高度、宽度、通道数以及数组的大小（即像素数）。\n\n*   第 17 行：这一行使用\
  \ OpenCV 的 `imshow()` 函数按原样显示图像，该函数接受两个参数：图像窗口的名称和表示图像的 NumPy 数组。\n\n*   第 18 行：`waitKey()`\
  \ 函数使程序不会立即终止，而是等待用户按下任意键。当你看到将在第 17 行显示的图像窗口时，按任意键终止程序，否则程序将阻塞。\n\n注意\n\n`waitKey()`\
  \ 函数无限期地等待一个按键事件，或者等待特定的延迟时间（以毫秒为单位）。由于操作系统在线程切换之间存在最小时间间隔，因此在按下按键后，`waitKey()`\
  \ 函数不会精确等待作为参数传递给 `waitKey()` 函数的延迟时间。实际等待时间取决于在按下按键并调用 `waitKey()` 函数时，你的计算机可能正在运行的其他程序。\n\
  \n图 2-5 展示了清单 2-1 的输出。\n\n![](img/493065_2_En_2_Fig5_HTML.jpg)\n\n一张屏幕截图显示了输出细节。图像维度\
