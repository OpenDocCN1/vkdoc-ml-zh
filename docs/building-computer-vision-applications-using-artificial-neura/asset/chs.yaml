  \  对于训练集中的每张图像，使用函数 `dict_to_tf_example()` 创建一个 TFRecord。该 TFRecord 包含图像的字节、边界框、标注的类别名称以及关于图像的其他若干元数据。TFRecord\
  \ 被序列化并写入一个文件。会创建多个 TFRecord 文件，文件数量取决于图像总数以及每个 TFRecord 文件中要包含的图像数量。\n\n4.  类似地，为验证集中的每张图像创建\
  \ TFRecord 并将其序列化到文件中。\n\n5.  将训练集和验证集保存到 `output` 目录下的两个独立子目录——`train` 和 `val`\
  \ 中。\n\n我们需要一个将类别索引与类别名称映射起来的映射文件。该文件包含 JSON 内容，通常扩展名为 `.pbtxt`。我们有六个缺陷类别，可以手动编写标签映射文件，如下所示：\n\
  \n```\n文件名: steel_label_map.pbtxt\nitem {\nid: 1\nname: 'rolled-in_scale'\n}\nitem\
  \ {\nid: 2\nname: 'patches'\n}\nitem {\nid: 3\nname: 'crazing'\n}\nitem {\nid: 4\n\
  name: 'pitted_surface'\n}\nitem {\nid: 5\nname: 'inclusion'\n}\nitem {\nid: 6\n\
  name: 'scratches'\n}\n```\n\n将 `steel_label_map.pbtxt` 文件上传到您的 Colab 环境中的 `/content`\
  \ 目录（或您想要的任何其他目录，但请确保在列表 9-3 中提供正确的路径）。\n\n```\n1    %%shell\n2    python /content/generic_xml_to_tf_record.py\
  \ \\\n--label_map_path=/content/steel_label_map.pbtxt \\\n--data_dir=/content/NEU-DET\
  \ \\\n--output_path=/content/NEU-DET/out \\\n--annotations_dir=ANNOTATIONS \\\n\
  --image_dir=IMAGES\n列表 9-3\n执行创建 TFRecord 文件的 generic_xml_to_tf_record.py\n```\n\
  \n列表 9-3 中的脚本通过提供以下参数来执行 `generic_xml_to_tf_record.py`：\n\n*   `--label_map_path`：`steel_label_map.pbtxt`\
  \ 的路径。\n\n*   `--data_dir`：图像和标注目录所在的根目录。\n\n*   `--output_path`：您想要保存生成的 TFRecord\
  \ 文件的路径。请确保此目录存在。如果不存在，请在执行此脚本之前创建此目录。\n\n*   `--annotations_dir`：标注 XML 文件所在的子目录名称。\n\
  \n*   `--image_dir`：图像所在的子目录名称。\n\n运行列表 9-3 中的脚本，在输出目录中创建 TFRecord 文件。您将看到两个子目录——`train`\
  \ 和 `val`，其中保存了用于训练和验证的 TFRecord。\n\n再次强调，在您执行列表 9-3 中的代码之前，输出目录必须存在。\n\n\n\n###\
