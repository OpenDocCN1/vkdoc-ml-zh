  \ ...]\n\n52      # 从模型运行预测\n53      output_dict = model(input_tensor)\n\n55   \
  \   # 模型输入是张量，因此输出也是张量\n56      # 转换为 numpy 数组，并取索引 [0] 以移除批次维度。\n57      # 我们只对前\
  \ num_detections 个结果感兴趣。\n58      num_detections = int(output_dict.pop('num_detections'))\n\
  59      output_dict = {key: value[0, :num_detections].numpy()\n60              \
  \       for key, value in output_dict.items()}\n61      output_dict['num_detections']\
  \ = num_detections\n\n63      # detection_classes 应为整数类型。\n64      output_dict['detection_classes']\
  \ = output_dict['detection_classes'].astype(np.int64)\n\n66      # 处理带有掩码的模型：\n\
  67      if 'detection_masks' in output_dict:\n68          # 将边界框掩码重新映射到图像尺寸。\n69\
  \          detection_masks_reframed = utils_ops.reframe_box_masks_to_image_masks(\n\
  70              output_dict['detection_masks'], output_dict['detection_boxes'],\n\
  71              image.shape[0], image.shape[1])\n72          detection_masks_reframed\
  \ = tf.cast(detection_masks_reframed > 0.5,\n73                                \
  \             tf.uint8)\n74          output_dict['detection_masks_reframed'] = detection_masks_reframed.numpy()\n\
  \n76      return output_dict\n清单 6-15\n预测目标与边界框并组织输出\n```\n\n第 53 行是执行实际目标检测的代码。函数\
  \ `model(input_tensor)` 预测目标类别、边界框以及相关的分数。`model(input_tensor)` 函数返回一个字典，我们将对其进行格式化，使其仅包含与输入图像对应的输出，以便于使用。\n\
  \n由于模型接收一批图像，该函数会返回针对整个批次的输出。因为我们一次只有一张输入图像，所以我们只对这个输出字典中的第一个结果感兴趣（通过第 0 个索引访问）。第\
  \ 59 行提取了第一个输出并重新赋值给 `output_dict` 变量。\n\n第 61 行将检测数量存储在字典中，以便在处理结果时方便使用这个数字。\n\n\
  \n\n第 66 至 74 行仅适用于需要预测掩码的 Mask R-CNN。对于所有其他预测器，这些行可以省略。\n\n第 76 行返回输出字典，其中包含检测到的边界框坐标、对象类别、得分以及检测数量。如果是\
  \ Mask R-CNN，它还会包含对象掩码。\n\n接下来，我们将研究如何使用 `output_dict` 在图像中检测到的对象周围绘制边界框。\n\n####\
  \ 编写代码以推断输出，在检测到的对象周围绘制边界框，并存储结果\n\n清单 6-16 中的函数 `infer_object()` 用于推断由函数 `run_inference_for_single_image()`\
  \ 返回的 `output_dict`。函数 `infer_object()` 在图像中每个检测到的对象周围绘制边界框。它还会用类别名称和得分标记对象，最后将结果保存到输出目录位置。清单\
  \ 6-16 是实现此函数的代码段。\n\n```\n79   def infer_object(model, image_path):\n80      #\
  \ 使用 OpenCV 读取图像并创建图像 numpy 数组\n81      # 最终输出图像，包含边界框和标签。\n82      imagename =\
  \ os.path.basename(image_path)\n\n84      image_np = cv2.imread(os.path.abspath(image_path))\n\
  85      # 实际检测。\n86      output_dict = run_inference_for_single_image(model, image_np)\n\
  \n88      # 检测结果的可视化。\n89      for i in range(output_dict['detection_classes'].size):\n\
