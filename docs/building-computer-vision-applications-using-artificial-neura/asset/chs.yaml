  \n## 保存与恢复模型\n\n保存和加载训练好的模型至关重要，可以避免每次使用时都需要重新训练。模型训练可能非常耗时，根据数据大小、硬件能力和网络配置等因素，可能需要数小时甚至数天。因此，在训练期间和训练后保存模型是必不可少的。这样做，你可以从中断的地方恢复训练，从而节省宝贵的时间。\n\
  \n在接下来的章节中，我们将深入探讨训练神经网络的过程，包括在训练期间保存模型检查点、保存最终模型以供将来使用、加载保存的模型，以及在各种应用中有效利用它。这使我们能够利用训练好的模型的好处，而无需重复整个训练过程。\n\
  \n### 在训练期间保存模型检查点\n\n代码清单 5-6 包含了我们初始模型训练代码（代码清单 5-2）中的大部分代码行。然而，在保存训练权重方面存在一些显著差异。让我们找出这些不同的代码行，并理解它们在训练期间保存权重的上下文中的重要性。\n\
  \n```\n文件名: Listing_5_6.py\n1    import tensorflow as tf\n2    import matplotlib.pyplot\
  \ as plt\n3    import os\n\n5    # 检查点将保存到的文件路径。\n6    checkpoint_path = \"cv_checkpoint_dir/mnist_model.ckpt\"\
  \n7    checkpoint_dir = os.path.dirname(checkpoint_path)\n\n9    # 创建一个保存模型权重的回调函数。\n\
  10   cp_callback = tf.keras.callbacks.ModelCheckpoint(filepath=checkpoint_path,\n\
  11   save_weights_only=True,\n12   verbose=1)\n\n14   # 使用内置数据集下载功能加载 MNIST 数据。\n\
  15   mnist = tf.keras.datasets.mnist\n16   (x_train, y_train), (x_test, y_test)\
  \ = mnist.load_data()\n\n18   # 通过将每个像素值除以 255 来归一化像素值。\n19   x_train, x_test =\
  \ x_train / 255.0, x_test / 255.0\n\n21   # 构建一个 4 层 ANN。\n22   model = tf.keras.models.Sequential([\n\
  23     tf.keras.layers.Flatten(input_shape=(28, 28)),\n24     tf.keras.layers.Dense(128,\
  \ activation='relu'),\n25     tf.keras.layers.Dense(60, activation='relu'),\n26\
  \     tf.keras.layers.Dense(10, activation='softmax')\n27   ])\n\n29   # 编译模型并设置优化器、损失函数和指标\n\
  30   model.compile(optimizer='adam',\n31                 loss='sparse_categorical_crossentropy',\n\
  32                 metrics=['accuracy'])\n\n34   # 最后，训练或拟合模型，传递回调函数以保存模型权重。\n35\
  \   trained_model = model.fit(x_train, y_train, validation_split=0.3, epochs=10,\
  \ callbacks=[cp_callback])\n\n37   # 可视化损失和准确率历史\n38   plt.plot(trained_model.history['loss'],\
  \ 'r--')\n39   plt.plot(trained_model.history['accuracy'], 'b-')\n40   plt.legend(['训练损失',\
  \ '训练准确率'])\n41   plt.xlabel('周期')\n42   plt.ylabel('百分比')\n43   plt.show();\n\n\
  45   # 使用测试集评估结果。\n46   evalResult = model.evaluate(x_test,  y_test, verbose=1)\n\
  47   print(\"评估结果: \", evalResult)\n代码清单 5-6\n在训练期间保存模型权重\n```\n\n通过比较代码清单 5-6 和代码清单\
  \ 5-2，我们可以识别出以下不同的代码行。\n\n第 3 行导入了 `os` 包，它提供了与文件系统相关的函数，用于将模型保存到文件路径。\n\n第 6 行是存储我们模型权重的文件名。\n\
  \n第 7 行创建了特定于操作系统的文件路径对象。\n\n第 10 行通过传递以下参数初始化了一个名为 `ModelCheckpoint` 的 TensorFlow\
  \ 回调类：\n\n*   `filepath`：这是我们在第 7 行创建的文件路径对象。\n\n*   `save_weights_only`：在训练期间，我们只应保存权重，而不是整个模型。默认情况下，此参数设置为\
  \ `False`，这意味着保存整个模型。通过将其设置为 `True`，我们告知神经网络我们只想保存权重。\n\n*   `verbose = 1`：在控制台上打印日志并运行状态。否则，默认值\
  \ 0 表示静默。\n\n以下是我们可能根据意图传递的其他参数：\n\n*   `save_best_only`：默认值为 `False`。如果设置为 `True`，算法将根据我们传递的指标评估并保存最佳权重。\n\
  \n*   `save_frequency`：默认值为 `epoch`，这意味着我们希望在每个周期结束时保存检查点。你也可以传递一个整数来指示保存检查点的频率。例如，如果你设置\
  \ `save_frequency = 5`，则每五个周期保存一次检查点。\n\n你会注意到，在代码清单 5-6 中，除了第 35 行（拟合模型）之外，几乎所有代码行都与代码清单\
  \ 5-2 相同。第 35 行在 `fit()` 函数中增加了一个参数 `callbacks = [cp_callback]`，用于在模型训练期间保存检查点。\n\
  \n请注意，我们在代码清单 5-6 的第 35 行将 `epochs=10` 作为参数传递给 `fit()` 函数。图 5-25 和图 5-26 显示了该模型损失和准确率的示例输出。该模型在测试数据上的准确率为\
  \ 0.9775，损失为 0.084755。\n\n![](img/493065_2_En_5_Fig26_HTML.jpg)\n\n周期 2 的输出行，内容为：评估结果：[0.08475547107886305,\
  \ 0.9775]。\n\n**图 5-26**\n\n使用 `epoch=10` 的模型评估\n\n![](img/493065_2_En_5_Fig25_HTML.jpg)\n\
  \n标题为“图 1”的窗口截图，显示百分比与周期的关系图。训练准确率从 (0, 0.9) 急剧上升，然后在 (1, 0.95) 和 (8.6, 1.0) 之间逐渐上升。训练损失从\
  \ (0, 0.3) 急剧下降，然后在 (1, 0.15) 和 (8.6, 0.0) 之间逐渐下降。数值为估计值。\n\n**图 5-25**\n\n训练损失和准确率\n\
  \n\n\n### 手动保存权重\n\n如果你希望手动保存权重，而不是在每个训练周期或定期保存检查点，只需添加以下函数：\n\n```\n# 保存模型权重\n\
  checkpoint_path = \"cv_checkpoint_dir/mnist_model.ckpt\"\nmodel.save_weights(checkpoint_path)\n\
  ```\n\n### 加载已保存的权重并重新训练模型\n\n如果你想加载已保存的权重，无论是为了在中断后恢复训练，还是因为获得了更多数据（或出于其他任何原因），只需在创建/配置神经网络后添加以下代码行：\n\
  \n```\n# 加载已保存的权重\nmodel.load_weights(checkpoint_path)\n```\n\n请确保你已经像清单 5-6 中第\
  \ 22 行和第 30 行那样初始化了神经网络。需要注意的是，网络架构必须与存储检查点的网络架构保持一致。\n\n### 保存整个模型\n\n调用 `model.save()`\
  \ 函数来保存整个模型，包括模型架构、权重和训练配置。请确保在调用 `fit()` 方法之后调用 `model.save()` 函数。也就是说，在清单 5-6\
  \ 的第 35 行之后调用 `save()` 函数。以下是保存整个模型的代码片段：\n\n```\n# 将整个模型保存到目录路径 \"path/to/save/model\"\
  。\n# 你也可以使用绝对路径来保存模型。\ntf.saved_model.save(model, \"path/to/save/model\")\n```\n\
  \n`tf.saved_model.save()` 函数以 `SavedModel` 格式保存模型，这是一种序列化表示形式，包含了模型架构、权重和训练配置。\n\
  \n运行此代码后，你将在指定目录中找到保存的模型。该目录将包含多个文件和子目录，分别代表已保存模型的资产、变量和 TensorFlow 元数据。\n\n请注意，你也可以使用不同的函数（如\
  \ `model.save()` 或 `model.save_weights()`）来保存模型的特定部分，例如仅保存模型架构或仅保存模型权重。不过，建议使用 `tf.saved_model.save()`\
  \ 以 `SavedModel` 格式保存整个模型，因为它便于部署，并能与不同 TensorFlow 平台和版本兼容。\n\n### 重新训练现有模型\n\n\
  如果你想用额外数据或相同数据但不同超参数来重新训练现有模型，可以使用以下代码片段：\n\n```\n# 加载并创建现有模型，包括其权重和优化器\nmodel =\
  \ tf.saved_model.load(' path/to/save/model')\n# 显示模型架构\nmodel.summary()\n# 重新训练模型\n\
  retrained_model = model.fit(x_train, y_train, validation_split=0.3, epochs=10)\n\
  ```\n\n重新训练模型后，请务必按照上一节所述，使用 `tf.saved_model.save()` 函数保存新模型。\n\n### 在应用中使用训练好的模型\n\
  \n如果你在文件系统中保存了一个训练好的模型，可以轻松加载它并使用 `predict()` 函数进行预测。示例如下：\n\n```\n# 加载已保存的模型，包括其权重和优化器\n\
  model = tf.saved_models.load(' path/to/save/model')\n# 从加载的模型预测输入图像的类别\npredicted\
  \ = model.predict(x_pixel_data)\nprint(\"Predicted\", predicted)\n```\n\n在我们的探索过程中，我们涵盖了训练神经网络用于计算机视觉任务的几个关键方面。我们首先演示了一个使用\
  \ MNIST 图像数据集训练神经网络预测数字的示例。接着，我们深入探讨了保存训练好的模型、使用额外数据或不同超参数重新训练模型，以及基于重新训练的模型进行预测。\n\
  \n此外，我们还讨论了监控模型性能的重要性，并介绍了 TensorBoard 作为可视化各种模型指标和超参数的强大工具。通过利用 TensorBoard，我们深入了解了训练过程，识别了需要改进的领域，并做出了优化模型的明智决策。\n\
  \n通过应用这些技术，我们可以为广泛的应用构建稳健且有效的计算机视觉模型。\n\n在下一节中，我们将探讨卷积神经网络（CNN），这是一种强大的架构，它将传统神经网络与一个负责自动特征提取的附加网络相结合。我们将分析\
  \ CNN 用于从输入图像中提取和选择特征的技术。在此过程中，我们将熟悉与 CNN 相关的常用术语。此外，我们将逐步讲解一个 TensorFlow 代码实现，以训练我们自己的\
  \ CNN 模型进行图像分类。随着我们的推进，我将详细解释每一行代码，以确保全面理解。\n\n为了展示 CNN 的实际应用，我们将处理一个具体示例：对胸部 X\
  \ 光图像进行分类以检测肺炎病例。通过利用 CNN 的强大功能，我们的目标是训练一个能够自动分析和准确分类这些医学图像的模型。\n\n## 卷积神经网络\n\n\
  *卷积神经网络（CNN）* 是一种特殊类型的人工神经网络，它与传统人工神经网络（ANN）的主要区别在于其*自动特征工程*能力。ANN 通常需要手动进行特征工程，而\
  \ CNN 则擅长从输入数据中自动提取和选择相关特征。这一特性使得 CNN 特别适合处理网格状结构的数据，例如图像。\n\n通过引入称为*卷积层*的特殊层，CNN\
  \ 对输入数据的小区域应用局部操作。通过这一过程，网络学会从输入数据中识别和提取基本特征，如边缘、纹理或形状。CNN 的分层架构使其能够通过组合这些学习到的特征，逐步构建更高层次的表示。\n\
  \nCNN 的这种自动特征工程特性显著减少了对手动特征提取和选择的需求，使网络能够学习并适应数据中的各种模式和复杂性。因此，CNN 已成为计算机视觉任务（如图像分类、目标检测和图像分割）中的基础工具。\n\
  \n\n\n### CNN 的架构\n\n传统的 ANN 或 MLP 由输入层、一个或多个隐藏层以及输出层组成。CNN 由一个常规的 MLP（包含输入层、隐藏层和输出层）堆叠在另一个称为卷积网络的网络之上构成，该卷积网络负责从输入图像中自动提取特征。输入图像被传递到卷积网络的第一层，如图\
  \ 5-27 所示。\n\n卷积层在对输入图像执行特征工程方面起着至关重要的作用。它对输入数据的小区域应用一组可学习的滤波器或卷积核，将其与图像进行卷积以生成特征图（如下文各节所述）。每个滤波器捕获输入图像中存在的特定模式或特征，例如边缘或纹理。\n\
  \n卷积层的输出（由这些特征图组成）随后被输入到全连接 MLP 的“输入”层。MLP 实现传统的深度学习算法，如前向传播，以基于提取的特征对图像进行分类。\n\n\
  ![](img/493065_2_En_5_Fig27_HTML.png)\n\nCNN 的神经网络示意图。输入图像被发送到卷积层，然后是包含输入层、隐藏层 1、隐藏层\
  \ 2、输出层和输出的全连接 MLP。\n\n图 5-27\n\nCNN 架构\n\n通过将多层的自动特征工程能力与全连接 MLP 层的分类能力相结合，CNN\
  \ 可以有效地学习并对图像中的复杂模式和结构进行分类。\n\n卷积网络有两种类型的层：\n\n*   *卷积层*：该层从图像中提取特征（特征提取）。\n*  \
  \ *子采样层*：该层从提取的特征中进行选择（特征选择）。\n\n图 5-28 描绘了一个完整的 CNN。\n\n![](img/493065_2_En_5_Fig28_HTML.jpg)\n\
  \nCNN 的神经网络架构示意图。输入图像通过卷积生成特征图，特征图再通过子采样传递到另一层特征图，接着是另外两层特征图、一个全连接层和输出。\n\n图 5-28\n\
  \n包含卷积、子采样和全连接 MLP 层的 CNN\n\n### CNN 的工作原理\n\n我们在第 2 章中看到，计算机将单通道的黑白图像视为一个由像素值组成的二维矩阵（如图\
  \ 5-29 所示）。具有 RGB 通道（三个通道）的彩色图像则显示为这些二维矩阵的堆叠。这些矩阵堆叠形成一个三维张量（还记得张量吗？）。图 5-30 展示了一个三维图像张量的可视化表示。\n\
  \n![](img/493065_2_En_5_Fig30_HTML.jpg)\n\n张量表示示意图。一个形状为字母 H 的网格具有 R、G、B 三种色调。图中标明了三个分别具有\
  \ R、G、B 色调的矩形块之间的高度、宽度和通道数。\n\n图 5-30\n\n三通道彩色图像作为二维矩阵堆叠的张量表示\n\n![](img/493065_2_En_5_Fig29_HTML.jpg)\n\
  \n一张照片和一个矩阵。a. 一个输入图像，具有深色阴影的字母 H 和浅色阴影的背景，被划分为一个 8x8 的网格，其中标有各种单元格。b. 一个 8x8 的矩阵。构成字母\
  \ H 的单元格值为 0，周围单元格的值为 255。\n\n图 5-29\n\n计算机将黑白图像（左）视为一个二维矩阵（右）\n\n有了图像如何表示为张量的背景知识，让我们来研究卷积过程。\n\
  \n#### 卷积\n\n想象一下，我们有一张图像，用放大镜扫视它，并记下我们观察到的重要模式。这是一个很好的类比，可以说明卷积的工作原理。\n\n以下是使用卷积从图像中提取重要特征的步骤：\n\
  \n1.  将图像划分为大小为 *k*×*k* 像素的网格。这被称为*卷积核*，表示为一个 *k*×*k* 矩阵。\n2.  定义一个或多个与卷积核维度相同的滤波器。\n\
  3.  取其中一个通道的第一个卷积核（从二维矩阵的左上角开始），与第一个滤波器进行逐元素乘法，并将乘法结果相加。对其他通道执行相同操作，并将所有三个通道的结果求和，以获得新创建特征图的像素值。\n\
  \n    这在图 5-31 中进行了演示。在此示例中，我们采用一个 7×7×3 的图像，卷积核大小为 3×3。我们有两组滤波器：W0 和 W1（以红色显示）。滤波器\
  \ W0 的偏置为 1，滤波器 W1 没有任何偏置。输出特征图显示在绿色网格中（最右侧）。\n\n    ![](img/493065_2_En_5_Fig31_HTML.jpg)\n\
  \n    卷积示意图。来自三个 7x7 输入矩阵（带有体积和填充 1）的 3x3 片段 x 被发送到滤波器 W0。偏置 b0 有一个单元格。滤波器 W1 有三个矩阵，其中包含负值\
  \ 1。输出体积 o 有两个 3x3 矩阵，单元格中带有值。\n\n    图 5-31\n\n    卷积（图片由 Andrej Karpathy 提供）\n\
  \n    输出计算如下所示：\n\n    `通道 1 输出 = 0x(-1) + 0x(-1) + 0x1 + 0x1 + 2x1 + 1x0 + 0x0\
  \ + 0x(-1) + 1x(-1) = 2`\n\n    `通道 2 输出 = 0x0 + 0x0 + 0x(-1) + 0x1 + 2x1 + 0x0\
  \ + 0x(-1) + 2x(-1) + 0x1 = 0`\n\n    `通道 3 输出 = 0x0 + 0x0 + 0x1 + 0x0 + 0x0 + 2x0\
  \ + 0x0 + 2x0 + 2x1 = 1`\n\n    `特征值 = 通道 1 输出 + 通道 2 输出 + 通道 3 输出 + 偏置`\n\n   \
  \ `特征值 = 2 + 0 + 1 + 1 = 4`\n\n    同样，值 4 在图 5-31（最右侧）顶部绿色网格的左上角以高亮显示。\n\n4.  现在将卷积核向右移动，并如前所述计算特征值。当卷积核一直移动到最右侧时，它会向下移动到下一行，从该行的最左侧像素开始。卷积核为扫描整个图像而向水平和垂直方向移动的步数称为*步长*。步长表示为\
  \ *s*（例如，2 或 3 等）。步长为 2 意味着卷积核将向右移动两步，当到达图像右边缘时，它向下移动 2 个像素。\n5.  当整个图像被扫描完毕后，会创建一个特征矩阵。在我们的示例中，特征矩阵的维度是\
  \ 3×3（对于 7×7×3 像素的图像、3×3 的卷积核和 2×2 的步长）。这个特征矩阵，也称为*特征图*，如图 5-31 顶部 3×3 的绿色网格（右侧）所示。\n\
  6.  使用下一组滤波器重复相同的卷积过程，并创建一个特征图。图 5-31 底部的绿色网格显示了来自第二个滤波器的特征图。\n7.  对所有滤波器重复此过程，并从每个滤波器生成特征图。\n\
  \n#### 池化/子采样/降采样\n\n卷积从图像中提取特征。这些特征表示为 *n* × *n* 矩阵，并被馈送到另一层，称为*池化层*，该层执行“降采样”，很像特征选择。最大池化和平均池化是两种常用的对特征进行降采样的方法。\n\
  \n\n\n##### 最大池化\n\n在池化层中，与卷积阶段非常相似，特征矩阵被划分为大小为 *k*×*k*（例如，图 5-32 中的 2×2 像素）且步长为\
  \ *s*（例如，示例中步长为 1）的核网格。在最大池化层中，取每个核区域内的最大像素值，并生成一个降采样矩阵。此过程对上一层每个滤波器的输出重复进行。\n\n\
  ![](img/493065_2_En_5_Fig32_HTML.jpg)\n\n最大池化示意图。一个四乘四矩阵的四个象限各有不同深浅，代表单个深度切片。使用二乘二滤波器和步长\
  \ 2 进行最大池化，得到一个二乘二矩阵，其中四个单元格分别填入每个象限的最大值。\n\n图 5-32\n\n用于特征降采样的最大池化（图片由 Andrej Karpathy\
  \ 提供）\n\n##### 平均池化\n\n平均池化的工作方式与最大池化相同，区别在于平均池化取核像素的平均值（而非最大值）来生成降采样矩阵。\n\n一个 CNN\
  \ 通常由交替的卷积层和池化层以及一个多层感知机组成（如图 5-33 所示）。\n\n![](img/493065_2_En_5_Fig33_HTML.png)\n\
  \nCNN 层的框图。图像输入依次经过多对卷积层和池化层，最后是 MLP。\n\n图 5-33\n\nCNN 层，交替的卷积层和池化层，末端为 MLP\n\n\
  ### CNN 概念总结\n\n以下是我们目前探讨过的 CNN 概念：\n\n*   CNN 由交替的卷积层和池化层组成，末端为 MLP。并非每个卷积层都必须紧跟一个池化层。\n\
  \n*   卷积是卷积层中的特征提取过程。\n\n*   定义一个维度为 *k*×*k* 的核，用于将输入图像划分为网格。\n\n*   与核维度相同的滤波器与核内的像素相乘，然后将每个像素和每个图像通道的结果求和。结果中会添加一个可选的偏置，以生成特征矩阵。\n\
  \n*   池化层实现降采样算法（最大池化或平均池化）来对特征进行降采样。\n\n*   此过程对每一对卷积-池化层重复进行，其中一个池化层的输出作为下一个卷积层的输入。\n\
  \n*   最后一个卷积/池化层将特征矩阵馈送到 MLP 的输入层。\n\n*   网络的 MLP 部分像传统的 MLP 网络一样进行学习。\n\n### 训练\
  \ CNN 模型：从胸部 X 光片中检测肺炎\n\n*TensorFlow with Keras* 使得训练 CNN 模型变得简单。只需几行代码，您就可以实现并训练一个\
  \ CNN 模型。\n\n在本节中，我们将深入探讨一个代码示例，该示例演示了如何使用胸部 X 光片训练一个用于肺炎检测的模型。\n\n注意\n\n此处介绍的模型是一个基础的\
  \ CNN，仅用于学术和学习目的。它不应用于诊断任何医疗状况。\n\n#### 胸部 X 光数据集\n\n我们从 Kaggle 托管的公开网站 [`https://www.kaggle.com/paultimothymooney/chest-xray-pneumonia`](https://www.kaggle.com/paultimothymooney/chest-xray-pneumonia)\
  \ 获取了胸部 X 光图像。需要注意的是，此图像数据集根据 [`https://creativecommons.org/licenses/by/4.0/`](https://creativecommons.org/licenses/by/4.0/)\
  \ 描述的 Creative Commons 许可证发布，并受其条款约束。\n\n该数据集包含两组图像，一组包含健康肺部的胸部 X 光片（正常），另一组包含感染肺炎的肺部的\
  \ X 光片。这两组图像存储在不同的目录中；所有正常图像存储在 `NORMAL` 目录中，所有肺炎图像存储在 `PNEUMONIA` 目录中。此外，该数据集被划分为训练集、测试集和验证集。\n\
  \n从 Kaggle 网站下载图像后，将其保存在本地磁盘中。图 5-34 显示了一个示例目录结构。\n\n![](img/493065_2_En_5_Fig34_HTML.jpg)\n\
  \n一个下拉文件目录的截图，以 images 为根文件夹。images 文件夹包含 chest_xray 文件夹，该文件夹又包含 test、train 和 val\
  \ 子文件夹，每个子文件夹中都有 normal 和 pneumonia 文件夹。\n\n图 5-34\n\n胸部 X 光图像的目录结构\n\n图 5-34 展示了父目录\
  \ `chest_xray` 的目录结构，其中包含名为 `test`、`train` 和 `val` 的子目录。这些子目录中的每一个都进一步包含两个子目录：`NORMAL`\
  \ 和 `PNEUMONIA`。`NORMAL` 目录存储代表正常胸部 X 光片的图像，而 `PNEUMONIA` 目录存储描绘患有肺炎的 X 光片图像。这种目录组织方式是一种用各自类别标记图像的方法。\n\
  \n#### 代码结构\n\n在组织代码以追求简洁和易于理解的同时，需要注意的是，存在更有效的方式来构建代码，使其更具可重用性并遵循面向对象原则。在生产级工作中，强烈建议对代码进行参数化以提高灵活性和可维护性，避免任何硬编码值。然而，出于学习目的，我使用了一些硬编码值以使代码易于理解。\n\
  \n\n\n#### CNN 模型训练\n\n清单 5-7 展示了用于训练 CNN 模型以从胸部 X 光片预测肺炎的代码示例。\n\n```\nFileName:\
