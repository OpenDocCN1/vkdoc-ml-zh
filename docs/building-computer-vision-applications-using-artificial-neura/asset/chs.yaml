  \n屏幕截图显示了包含 4 行代码的 yolov7.yaml。\n\n图 6-38\n\n`yolov7.yaml` 文件的一部分，显示 `nc: 2` 以指示两个物体\n\
  \n训练自定义 YOLOv7 模型有多种选项。在本节中，我们将探讨一些常用的选项。\n\n\n\n### 启动 YOLOv7 模型训练\n\n在接下来的章节中，我们将探讨如何在配备单\
  \ GPU 或多 GPU 的机器上触发 YOLO 模型训练。两种场景下的流程相同，唯一的区别在于配置“device”参数以匹配硬件设置。\n\n#### 在单\
  \ GPU 上训练\n\n清单 6-21 展示了如何在单 GPU 上从头开始训练 YOLOv7 模型。\n\n```\n1    %%shell\n2    cd\
  \ /content/drive/MyDrive/PPE/yolov7\n3    python train.py \\\n--epochs 10  \\\n\
  --workers 8 \\\n--device 0 \\\n--batch-size 16 \\\n--data /content/safety-Helmet-Reflective-Jacket/data.yaml\
  \ \\\n--img 640 640 \\\n--cfg cfg/training/yolov7.yaml \\\n--weights '' \\\n--name\
  \ yolov7-ppe \\\n--hyp data/hyp.scratch.p5.yaml\n清单 6-21\n在单 GPU 上从头训练 YOLOv7 模型\n\
  ```\n\n清单 6-21 的第 2 行将工作目录更改为我们从仓库克隆 YOLOv7 源码时创建的 yolov7 目录。该目录包含一个用于训练模型的 Python\
  \ 脚本“train.py”。\n\n第 3 行使用以下参数调用 `train.py` 脚本：\n\n*   `--epochs 10`：表示训练应运行 10\
  \ 个周期。\n*   `--workers 8`：将数据加载工作进程数设置为 8。这些进程有助于高效加载和预处理训练数据。\n*   `--device 0`：此标志指定用于训练的\
  \ GPU。本例中选择单个 GPU 0。\n*   `--batch-size 16`：将批量大小设置为每次迭代 16 张图像。\n*   `--data /content/safety-Helmet-Reflective-Jacket/data.yaml`：此标志指向包含数据集配置详细信息的\
  \ YAML 文件。\n*   `--img 640 640`：将输入图像尺寸定义为 640×640 像素。\n*   `--cfg cfg/training/yolov7.yaml`：指定\
  \ YOLOv7 架构的模型配置文件（YAML）。\n*   `--weights ''`：表示模型不使用预训练权重。训练将从零开始。如果 `weights`\
  \ 参数留空（如本例所示），则表示从头开始训练。提供现有权重的文件路径则表示迁移学习。\n*   `--name yolov7-ppe`：为训练会话提供一个名称，可用于保存检查点和日志。默认情况下，模型存储在项目目录（本例中为\
  \ `yolov7`）的 `runs/train` 子目录中。在我们的示例中，模型将存储在 `/content/drive/MyDrive/PPE/yolov7/runs/train/yolov7-ppe`\
  \ 目录中。如果第二次运行训练，模型将在 `/content/drive/MyDrive/PPE/yolov7/runs/train/yolov7-ppe2`\
  \ 目录中创建，依此类推。\n*   `--hyp data/hyp.scratch.p5.yaml`：指向 YAML 格式的超参数文件。\n\n#### 在多\
  \ GPU 上训练\n\n训练目标检测模型需要大量的计算资源。当处理包含高分辨率图像的大型训练数据集时，可能需要利用多个 GPU 来加速学习过程。\n\n通过向清单\
  \ 6-21 传递几个额外参数，我们可以增强训练过程以利用多个 GPU。清单 6-22 以粗体突出显示了这些补充参数，以便清晰识别。\n\n```\n1   \
  \ %%shell\n2    cd /content/drive/MyDrive/PPE/yolov7\n3    python \\\n-m torch.distributed.launch\
  \ \\\n--nproc_per_node 4 \\\n--master_port 9527 \\\ntrain.py \\\n--epochs 100  \\\
  \n--workers 8 \\\n--device 0,1,2,3 \\\n--sync-bn \\\n--batch-size 16 \\\n--data\
  \ /content/safety-Helmet-Reflective-Jacket/data.yaml \\\n--img 640 640 \\\n--cfg\
  \ cfg/training/yolov7.yaml \\\n--weights '' \\\n--name yolov7-ppe \\\n--hyp data/hyp.scratch.p5.yaml\n\
  清单 6-22\n在单 GPU 上从头训练 YOLOv7 模型\n```\n\n训练命令的参数和实参说明如下：\n\n*   `python -m torch.distributed.launch`：命令的这一部分调用带有\
  \ `torch.distributed.launch` 模块的 Python 解释器，该模块有助于跨多个节点或 GPU 进行分布式训练。\n*   `--nproc_per_node\
  \ 4`：指定每个节点用于训练的进程（GPU）数量。本例中设置为四个 GPU。\n*   `--master_port 9527`：此参数定义主进程在分布式训练期间用于同步的通信端口。\n\
  *   `train.py`：这是负责启动训练过程的 Python 脚本名称。\n*   `--workers 8`：将数据加载工作进程数设置为 8。这些进程有助于高效加载和预处理训练数据。\n\
  *   `--device 0,1,2,3`：此标志指定用于训练的 GPU。本例中选择 GPU 0、1、2 和 3。\n*   `--sync-bn`：表示使用同步批归一化，这可以改善分布式训练期间的收敛性。\n\
  *   `--batch-size 16`：将批量大小设置为每次迭代 16 张图像。\n*   `--data /content/safety-Helmet-Reflective-Jacket/data.yaml`：此标志指向包含数据集配置详细信息的\
  \ YAML 文件。\n*   `--img 640 640`：将输入图像尺寸定义为 640×640 像素。\n*   `--cfg cfg/training/yolov7.yaml`：指定\
  \ YOLOv7 架构的模型配置文件（YAML）。\n*   `--weights ''`：表示模型不使用预训练权重。训练将从零开始。\n*   `--name\
  \ yolov7-ppe`：为训练会话提供一个名称，可用于保存检查点和日志。\n*   `--hyp data/hyp.scratch.p5.yaml`：指向\
  \ YAML 格式的超参数文件。\n\n\n\n### 监控训练进度\n\n模型训练时，Colab 控制台会显示训练日志输出，其中包含每个训练周期的各项损失值。例如，图\
