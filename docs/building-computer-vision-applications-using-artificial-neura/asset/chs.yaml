- "# 7. 实践示例：视频中的目标跟踪\n\n本章的重点是计算机视觉的两项关键能力：目标检测与目标跟踪。通常，在一组图像的上下文中，目标检测能够识别图像中的一个或多个目标，而目标跟踪则能在一组图像中跟踪已检测到的目标。在前几章中，我们探讨了训练深度学习模型以检测目标的技术细节。在本章中，我们将深入探讨如何将目标检测知识实际应用于视频领域。\n\
  \n视频中的目标跟踪，或简称为*视频跟踪*，涉及检测、定位目标并随时间对其进行跟踪。视频跟踪不仅用于在不同帧中检测目标，还用于跨帧跟踪目标。当首次检测到目标时，会提取其唯一标识，并在后续帧中进行跟踪。\n\
  \n目标跟踪在现实世界中有许多应用，例如：\n\n*   自动驾驶汽车\n*   安防与监控\n*   交通管制\n*   增强现实（AR）\n*   犯罪侦查与罪犯追踪\n\
  *   医学影像等\n\n在本章中，我们将探讨如何实现视频跟踪，并通过代码示例进行实践。学完本章后，你应该能拥有一个功能完整的视频跟踪系统。\n\n我们的高级实现计划如下：\n\
  \n1.  *视频源*：我们将使用 OpenCV 从网络摄像头或笔记本电脑内置摄像头读取实时视频流。你也可以从文件或 IP 摄像头读取视频。\n2.  *目标检测模型*：我们将使用在\
  \ COCO 数据集上预训练的 SSD 模型。你可以针对自己的特定用例训练自己的模型（关于训练目标检测模型的信息，请回顾第 6 章）。或者，你也可以改用 YOLO\
  \ 模型。\n3.  *预测*：我们将预测视频每一帧中的目标类别（检测）及其边界框（定位）（关于在图像中检测目标的信息，请回顾第 6 章）。\n4.  *唯一标识*：我们将使用哈希算法为每个目标创建唯一标识。本章后面将提供有关哈希算法的更多细节。\n\
  5.  *跟踪*：我们将使用汉明距离算法（本章后面会详细介绍）来跟踪先前检测到的目标。\n6.  *显示*：我们将输出视频流，以便在网页浏览器中显示。为此，我们将使用\
  \ Flask，一个轻量级的 Web 应用微框架。\n\n## 准备工作环境\n\n让我们建立一个目录结构，以便于理解代码并完成练习。我们将分析刚才描述的六个步骤中每个步骤的代码片段。最后，我们将把所有内容整合在一起，使目标跟踪系统完整且可运行。\n\
  \n我们有一个名为 `video_tracking` 的目录。在该目录下，有一个名为 `templates` 的子目录，其中包含一个名为 `index.html`\
  \ 的 HTML 文件。`templates` 子目录是 Flask 查找 HTML 页面的标准位置。在 `video_tracking` 目录中，我们有四个\
  \ Python 文件：`videoasync.py`、`object_tracker.py`、`tracker.py` 和 `video_server.py`。图\
  \ 7-1 展示了这个目录结构。\n\n![](img/493065_2_En_7_Fig1_HTML.jpg)\n\n一个包含文件夹和文件的文件目录截图。包括\
  \ chapter 7, model, s s d inception v 2 coco 2018 01 28, m s coco label map dot\
  \ p b t x t, video tracking, templates, index dot h t m l 以及其他 .py 文件。\n\n图 7-1\n\
  \n代码目录结构\n\n我们将在 `object_tracker.py` 中将 `videoasync` 作为模块导入。因此，`video_tracking`\
  \ 目录必须在 PyCharm 中被识别为源目录。要将其设为 PyCharm 中的源目录，请点击屏幕左上角的 PyCharm 菜单选项，然后点击 Preferences，展开左侧面板中的\
  \ Project，点击 Project Structure，选择 `video_tracking` 目录，并在 Mark As 选项（位于屏幕顶部）中点击 Sources，如图\
