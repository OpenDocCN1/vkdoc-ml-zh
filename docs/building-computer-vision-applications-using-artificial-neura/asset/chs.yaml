  \ notebook 是一个基于 Web 的开源应用程序，用于编写和执行 Python 程序。要了解更多关于如何使用 Jupyter notebook 的信息，请访问\
  \ [`https://jupyter.org`](https://jupyter.org)。文档可在 [`https://jupyter-notebook.readthedocs.io/en/stable/`](https://jupyter-notebook.readthedocs.io/en/stable/)\
  \ 获取。我们将在编写代码的过程中学习 Colab notebook 环境。\n\n我们将使用 TensorFlow 2.12.0 在 Google Colab\
  \ 上训练检测模型，模型训练完成后，我们将下载它并在我们笔记本电脑的本地环境中使用。\n\n### 在 Google Colab 上使用 GPU 运行 TensorFlow\n\
  \nGoogle Colab 为机器学习教育和培训提供了一个免费的 Jupyter notebook 环境。它提供大约 13GB 内存、80GB 磁盘空间和一个\
  \ Nvidia GPU 等资源，允许连续使用长达 12 小时。如果你的会话过期或达到 12 小时限制，你可以选择重新创建 Colab 运行时。\n\n当你在\
  \ Colab 中执行代码时，它运行在一个专门为你的个人账户创建的虚拟机上。会话过期后，虚拟机将被终止，虚拟磁盘中保存的任何数据都将丢失。但是，Colab 提供了一种便捷的方法，可以将\
  \ Google Drive 目录挂载到 Colab 虚拟磁盘，使你能够将数据存储在永久的 Google Drive 上。这样，每当你创建新的 Google Colab\
  \ 会话时，都可以检索到这些数据。\n\n让我们开始使用 Google Colab 并配置其设置。\n\n#### 访问 Google Colab\n\n要访问\
  \ Google Colab，你需要一个 Google（或 Gmail）账户。如果你还没有，可以在 [`https://accounts.google.com`](https://accounts.google.com)\
  \ 注册一个账户。\n\n要开始使用 Google Colab，请打开你的网络浏览器并导航到 [`https://colab.research.google.com`](https://colab.research.google.com)。如果你已经登录到你的\
  \ Google 账户，你将可以立即访问 Colab。如果你尚未登录，请使用你的 Google 账户凭据登录以获取 Google Colab 的访问权限。\n\n\
  #### 连接到托管运行时\n\n点击屏幕右上角、用户和设置图标下方的“连接”按钮，然后点击“连接到托管运行时”（见图 6-24）。此时，将创建一个 Colab\
  \ 会话。\n\n![](img/493065_2_En_6_Fig24_HTML.jpg)\n\n一张截图展示了代码运行时环境中的选项和控件，允许用户管理连接、资源、已执行代码历史记录以及最后运行的单元格，以实现高效的编码和调试。\n\
  \n图 6-24\n\n连接到托管运行时\n\n#### 选择 GPU 硬件加速器\n\n点击“编辑”，然后点击“笔记本设置”（见图 6-25）以打开一个模态窗口。选择\
  \ GPU 作为硬件加速器。确保为运行时类型选择了 Python 3。点击“保存”按钮（见图 6-26）。\n\n![](img/493065_2_En_6_Fig26_HTML.jpg)\n\
  \n一张代码环境中笔记本设置的截图，显示了配置运行时类型、硬件加速器 GPU 类型以及自动运行代码单元格和保存笔记本输出的偏好选项。\n\n图 6-26\n\n\
  选择 GPU 作为加速器\n\n![](img/493065_2_En_6_Fig25_HTML.jpg)\n\n一张 Colaboratory 界面的截图，这是一个基于云的编码环境，显示了包含文件管理、编辑、查看和运行代码等各种选项的菜单栏。已选中“笔记本设置”。\n\
  \n图 6-25\n\n访问笔记本设置\n\n#### 创建 Colab 项目\n\n点击“文件”，然后点击“新建笔记本”。新笔记本将在新的浏览器标签页中打开。给这个笔记本起一个有意义的名称，例如“目标检测模型训练”。默认情况下，此笔记本会保存到你的\
  \ Google Drive 中。\n\n#### 为 TensorFlow 和模型训练设置运行时环境\n\n点击“+代码”以在笔记本中插入一个代码单元格。注意笔记本主区域中有一个带有空单元格的代码块。你可以在此单元格中编写\
  \ Python 代码，并通过点击执行图标来执行它。\n\nGoogle Colab 是一个交互式编程环境，不提供对底层操作系统的直接访问。你可以使用 `%%shell`\
  \ 来调用 shell，该 shell 在调用它的单个代码单元格块内保持活动状态。你可以根据需要从任意多个代码块中调用 shell。\n\n为了训练目标检测模型，我们将执行以下任务：\n\
  \n1.  安装并设置必要的库。\n\n2.  下载并安装 TensorFlow `models` 项目。\n\n3.  下载宠物数据集并将文件转换为 TFRecord\
  \ 格式。\n\n4.  下载用于迁移学习的预训练目标检测模型。\n\n5.  配置训练流程。\n\n6.  训练并监控 SSD 模型。\n\n7.  最终确定并导出模型。\n\
  \n8.  使用 TensorBoard 可视化模型指标和评估结果。\n\n\n\n##### 安装与设置库\n\n在 Colab 中，你可以通过在命令前添加感叹号\
  \ (!) 来执行 shell 命令。此功能使你能够直接在 Colab 笔记本环境中运行终端命令。清单 6-1 列出了目标检测训练所需的一系列库。\n\n```\n\
  文件名: Listing_6_1\n1    !pip install numpy==1.23\n2    !pip install pillow==9.5\n\
  3    !apt install -y protobuf-compiler\n清单 6-1\n安装必要的库和包\n```\n\n在撰写本文时，TensorFlow\
  \ 2.12.0 版本要求 NumPy 版本为 1.23。然而，Google Colab 默认安装了更高版本的 NumPy。为了确保与 TensorFlow 的兼容性，必须显式安装\
  \ NumPy 1.23 版本，如第 1 行所示。\n\n此外，为了与当前版本的 TensorFlow 无缝集成，我们正在安装用于图像处理任务的 Pillow\
  \ 库的 9.5 版本（第 2 行）。\n\n请注意，这些 NumPy 和 Pillow 的版本要求未来可能会发生变化，你可能需要相应地更新或删除清单 6-1\
  \ 中的第 1 行和第 2 行。\n\n在第 3 行，我们正在安装 protobuf-compiler。Protocol Buffers 编译器，通常被称为“protoc”或“protobuf-compiler”，是一个随\
  \ Protocol Buffers 库提供的命令行工具。它用于将 `.proto` 文件编译成特定语言的代码，例如 Python、C++、Java、Go 等。\n\
  \n##### 安装 TensorFlow 的 models 项目\n\nTensorFlow `models` 项目是由 Google 和 TensorFlow\
  \ 社区维护的一个官方 GitHub 仓库。它包含了一系列与 TensorFlow 库相关的预训练机器学习模型和工具。这些模型涵盖了广泛的任务，包括图像分类、目标检测、自然语言处理和生成模型。该仓库对于从事机器学习和人工智能领域的研究人员和开发者来说是一个宝贵的资源。然而，由于\
  \ TensorFlow 生态系统发展迅速，最好参考 GitHub 上的官方仓库以获取最新信息。\n\n清单 6-2 展示了如何克隆和安装 `models` 项目。\n\
  \n```\n文件名: Listing_6_2\n1    %%shell\n2    git clone --depth 1 https://github.com/tensorflow/models.git\n\
  3    cd models/research/\n4    protoc object_detection/protos/*.proto --python_out=.\n\
  5    cd /content\n6    git clone https://github.com/cocodataset/cocoapi.git\n7 \
  \   cd cocoapi/PythonAPI\n8    make\n9    cp -r pycocotools /content/models/research\n\
  10   cd\n11   cd /content/models/research/\n12   cp object_detection/packages/tf2/setup.py\
  \ .\n13   python -m pip install .\n清单 6-2\n下载并安装 TensorFlow models 项目\n```\n\n在清单\
  \ 6-2 的第 1 行，我们使用了 `%%shell`，这被称为魔法命令，因为在代码单元格的开头使用 `%%shell` 会导致整个单元格的内容被解释为 shell\
  \ 命令，而不是 Python 代码。这意味着我们可以直接在单元格中执行底层操作系统支持的任何 shell 命令。\n\n在第 2 行，我们从 GitHub 克隆\
  \ TensorFlow 的 Models 仓库。`clone` 命令的 `--depth 1` 选项指定只检索最新的提交及其直接父提交。换句话说，它执行“浅克隆”，只获取最近的提交历史，而不是整个仓库历史。克隆的内容存储在\
  \ `models` 目录中，该目录在工作目录（通常是 `/content`）下创建。\n\n第 3 行将当前工作目录更改为 `/models/research`\
  \ 目录。\n\n在第 4 行，我们执行 `protoc` 命令，该命令将 `object_detection/protos` 目录中的所有 `.proto`\
  \ 文件转换为 Python 文件。\n\n第 5 行将工作目录切换到主目录，在 Colab 中为 `/content`。\n\n在第 6 行，我们将 `cocoapi`\
  \ 下载到主目录 `/content`。然后第 8 行执行 `make` 操作，第 9 行将 `pycocotools` 子文件夹复制到 `/content/models/research`\
  \ 目录。接下来，我们将 `setup.py` 从 `object_detection/packages/tf2/` 复制到 `research` 目录（第 12\
  \ 行）。\n\n最后，在第 13 行，我们运行 `pip install` 命令来安装目标检测 API。\n\n如果一切顺利，目标检测 API 应该已成功安装。要测试安装，请执行清单\
  \ 6-3 中所示的代码。\n\n```\n文件名: Listing_6_3\n1    %%shell\n2    cd models/research/\n\
  3    python object_detection/builders/model_builder_tf2_test.py\n清单 6-3\n测试目标检测\
  \ API 安装\n```\n\n第 1 行以魔法命令开头，第 2 行将目录更改为 `research` 目录。第 3 行通过运行 Python 脚本 `model_builder_tf2_test.py`\
