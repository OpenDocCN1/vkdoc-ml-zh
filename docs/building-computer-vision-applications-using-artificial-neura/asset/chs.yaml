  \ 116.0。\n\n图 3-56\n大津法计算出的阈值样本输出\n\n二值化是一种宝贵的图像处理技术，它允许我们从图像中提取显著特征。在本节中，我们探讨了各种二值化技术及其应用，考虑了像素强度和强度变化等因素。\n\
  \n在下一节中，我们将深入探讨另一种强大的图像处理技术——边缘检测，它使我们能够识别并突出显示图像中物体的边界和边缘，有助于执行物体识别和图像分割等任务。\n\n\
  ## 梯度与边缘检测\n\n*边缘检测*包含一系列技术，用于识别图像中像素亮度发生显著变化的点。在本节中，我们将探讨两种检测图像边缘的方法：基于梯度的边缘检测和\
  \ Canny 边缘检测。\n\n### 基于梯度的边缘检测\n\n基于梯度的边缘检测涉及计算像素强度的梯度，以定位快速变化的区域。它提供了一种识别图像边缘的直接方法。\n\
  \nOpenCV 提供了两种寻找梯度的方法：Sobel 导数和 Laplacian 导数。\n\n\n\n#### Sobel 导数（Sobel( ) 函数）\n\
  \nSobel 方法是高斯平滑与 Sobel 微分的结合，用于计算图像强度函数梯度的近似值。由于采用了高斯平滑，该方法对噪声具有鲁棒性。\n\n我们可以通过分别传递参数\
  \ `xorder` 和 `yorder`，在水平方向或垂直方向上进行导数计算。`Sobel()` 函数还接受一个参数 `ksize`，用于定义核大小。如果将\
  \ `ksize` 设置为 -1，OpenCV 将在内部应用一个 3×3 的 Scharr 滤波器，其结果通常优于 3×3 的 Sobel 滤波器。\n\n清单\
  \ 3-19 展示了 Sobel 函数的实际应用。\n\n```\nFilename: Listing_3_19.py\n1    import cv2\n2\
  \    import numpy as np\n3    # 加载图像\n4    image = cv2.imread(\"images/sudoku.jpg\"\
  )\n5    cv2.imshow(\"原始图像\", image)\n6    image = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)\n\
  7    image = cv2.bilateralFilter(image, 5, 50, 50)\n8    cv2.imshow(\"模糊图像\", image)\n\
  \n10   # Sobel 梯度检测\n11   sobelx = cv2.Sobel(image,cv2.CV_64F,1,0,ksize=3)\n12 \
  \  sobelx = np.uint8(np.absolute(sobelx))\n13   sobely = cv2.Sobel(image,cv2.CV_64F,0,1,ksize=3)\n\
  14   sobely = np.uint8(np.absolute(sobely))\n\n16   cv2.imshow(\"Sobel X\", sobelx)\n\
  17   cv2.imshow(\"Sobel Y\", sobely)\n\n19   # 通过向 Sobel 函数传递 ksize = -1 进行 Scharr\
  \ 梯度检测\n20   scharx = cv2.Sobel(image,cv2.CV_64F,1,0,ksize=-1)\n21   scharx = np.uint8(np.absolute(scharx))\n\
  22   schary = cv2.Sobel(image,cv2.CV_64F,0,1,ksize=-1)\n23   schary = np.uint8(np.absolute(schary))\n\
  24   cv2.imshow(\"Scharr X\", scharx)\n25   cv2.imshow(\"Scharr Y\", schary)\n\n\
  27   cv2.waitKey(0)\n清单 3-19\nSobel 和 Scharr 梯度检测\n```\n\n这里涉及很多内容，让我们逐一分析此清单中的相关行，以帮助阐明梯度的概念。\n\
  \n第 4 行只是从磁盘加载图像。我们在第 7 行应用了双边滤波器来减少噪声。图 3-60 显示了原始输入图像，图 3-61 显示了用作 Sobel 和 Scharr\
  \ 梯度检测函数输入的模糊图像。\n\n![](img/493065_2_En_3_Fig61_HTML.jpg)\n\n一张截图，显示了一个包含一组个位数字的表格，其中一些单元格是空白的。标题为“模糊图像”。底部标注了以下数值：X\
  \ = 317。Y = 221。L, 206。\n\n图 3-61\n模糊图像\n\n![](img/493065_2_En_3_Fig60_HTML.jpg)\n\
  \n一张截图，显示了一个包含一组个位数字的表格，其中一些单元格是空白的。标题为“原始图像”。底部标注了以下数值：X = 212。Y = 308。R、G、B 值均设为\
  \ 94。\n\n图 3-60\n原始图像\n\n梯度检测从第 11 行开始。我们使用 OpenCV 的 `Sobel()` 函数，它接受以下参数：\n\n*\
  \   我们要在其中检测梯度的模糊图像。\n*   数据类型 `cv2.CV_64F`，这是一个 64 位浮点数。为什么？从黑到白的过渡被视为正斜率，而从白到黑的过渡则是负斜率。8\
  \ 位无符号整数无法表示负数。因此，我们需要使用 64 位浮点数；否则，当发生从白到黑的过渡时，我们会丢失梯度信息。\n*   第三个参数指示我们是否要计算 X\
  \ 方向的梯度。值为 1 表示我们要计算 X 方向的梯度。\n*   类似地，第四个参数指示是否要计算 Y 方向的梯度。1 表示是，0 表示否。\n*   第五个参数\
  \ `ksize` 定义了核大小。`ksize=5` 表示核大小为 5×5。\n\n由于我们想要在第 11 行确定 X 方向的梯度，我们将 `Sobel()`\
  \ 函数中的第三个参数设置为 1，第四个参数设置为 0。\n\n第 12 行简单地取梯度的绝对值，并将其转换回 8 位无符号整数。请记住，图像被表示为 8 位无符号整数的\
  \ NumPy 数组。\n\n第 13 行与第 11 行类似，只是第三个参数设置为 0，第四个参数设置为 1，以指示在 Y 方向进行梯度计算。\n\n第 14\
  \ 行将 64 位浮点数转换为 8 位无符号整数，如前所述。\n\n图 3-62 和图 3-63 展示了第 16 行和第 17 行的示例输出。你会注意到，X 和\
  \ Y 方向的边缘检测都不太锐利。让我们尝试一个简单的改进，看看对边缘锐利度的影响。\n\n![](img/493065_2_En_3_Fig63_HTML.jpg)\n\
  \n一张截图，显示了一组排列在深色背景上的个位数字。数字以较浅的色调勾勒出轮廓。标题为“Sobel Y”。底部标注了以下数值：X = 255。Y = 287。L,\
