  \n*   线条：`line()`\n\n*   矩形：`rectangle()`\n\n*   圆形：`circle()`\n\n这些方法使我们能够轻松地将这些形状添加到图像中，增强了我们注释和可视化数据的能力。\n\
  \n### 在图像上绘制线条\n\n要使用 OpenCV 在图像上绘制线条，请遵循以下步骤：\n\n1.  将图像加载到 NumPy 数组中。\n\n2.  确定线条起始位置的坐标。\n\
