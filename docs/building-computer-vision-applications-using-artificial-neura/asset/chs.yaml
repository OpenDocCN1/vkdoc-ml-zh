  *   `python facenet/src/classifier.py TRAIN`：启动 `classifier.py` 脚本的执行，并指定脚本处于 TRAIN\
  \ 模式，表明目的是训练一个分类器。\n\n*   `~/presidents_aligned`：指定包含待识别个体对齐人脸图片的目录。该目录包含多个子目录，每个子目录对应一个不同的个体，并包含其人脸图片。\n\
  \n*   `~/20180402-114759/20180402-114759.pb`：指定预训练 FaceNet 模型的路径，该模型采用 TensorFlow\
  \ 的 Protocol Buffer（protobuf）格式（`.pb` 文件）。此模型将用于从输入人脸图片中提取面部特征嵌入。\n\n*   `~/presidents_aligned/face_classifier.pkl`：指定训练好的人脸分类器将保存为序列化\
  \ Python 对象（pickle 文件）的路径。该分类器将使用 FaceNet 模型生成的特征嵌入来区分不同的个体。\n\n*   `--batch_size\
  \ 1000`：设置训练的批次大小。训练图片将按每批 1000 张进行处理。\n\n*   `--min_nrof_images_per_class 40`：指定训练数据中每个类别（个体）所需的最少图片数量。图片数量少于该值的类别将从训练中排除。\n\
  \n*   `--nrof_train_images_per_class 35`：设置每个类别（个体）用于训练的图片数量。该值限制了每个类别用于训练的图片数量，可能用于创建平衡的数据集。\n\
  \n*   `--use_split_dataset`：指示将训练数据拆分为训练集和验证集。验证集用于监控训练进度并防止过拟合。\n\n分类器模型成功执行后，训练好的分类器将存储在文件\
  \ `~/presidents_aligned/face_classifier.pkl` 中。\n\n\n\n#### 视频流中的人脸识别\n\n在代码清单 7-1\
  \ 中，我们使用了 OpenCV 的便捷函数 `cv2.VideoCapture()` 来从计算机内置摄像头、USB 摄像头或 IP 摄像头读取视频帧。`VideoCapture()`\
