- '# 3. 平滑方法


  平滑是一种统计方法，我们可以用它来创建一个近似函数，以消除数据中的不规则性并尝试捕捉重要的模式。Robert Goodell Brown 是指数平滑之父，他于
  1956 年发表了《用于预测需求的指数平滑》（[`https://industrydocuments.library.ucsf.edu/tobacco/docs/#id=jzlc0130`](https://industrydocuments.library.ucsf.edu/tobacco/docs/%2523id%253Djzlc0130)）。1957
  年，Charles C. Holt 教授在卡内基梅隆大学从事预测研究，并发表了一篇题为《通过指数加权移动平均预测季节性和趋势》的论文，其中讨论了双指数平滑。三年后的
  1960 年，Holt 的学生 Peter R. Winters 通过结合季节性开发了一种算法，并发表了《通过指数加权移动平均预测销售额》（[`https://pubsonline.informs.org/doi/abs/10.1287/mnsc.6.3.324`](https://pubsonline.informs.org/doi/abs/10.1287/mnsc.6.3.324)）。


  平滑技术是一类时间序列预测算法，它利用先前观测值的加权平均值来预测或预报新值。该技术的主要思想是对时间序列中的近期值赋予更高的权重。它用于短期预测模型。当时间序列数据随时间缓慢变化时，该技术更为有效。它将误差、趋势和季节性成分协调到计算平滑参数中。这些成分以加法或乘法方式合并。


  本章介绍简单、双倍和三重指数平滑背后的数学原理，以及如何有效地利用它们来解决时间序列问题。


  ## 简单指数平滑简介


  简单指数平滑是指数平滑算法中最简单的模型之一。此类技术用于没有明显趋势或季节性模式的单变量观测数据。它涉及一个称为 *alpha* 的参数，即平滑参数。其核心思想是采用加权移动平均，包括指数递减的权重，该权重将更高的权重分配给最近的观测值。SES
  背后的概念是通过使用序列中所有先前值的加权平均值来预测未来值。此方法可用于预测没有趋势或季节性的序列。


  在本节中，让我们看看简单指数平滑背后较高层次的数学原理。


  假设一个序列具有以下特征：


  *   水平 (L[t])


  *   无趋势


  *   无季节性


  *   噪声（大致恒定）


  SES 是在最近时间点上的预测估计水平。


  F[t+k] = L[t]


  让我们估计并更新水平 (L[t])。


  以下是水平更新方程：


  L[t =] αY[t] + (1-α) L[t-1]


  我们取时间 L[t] 处的水平，并通过整合来自最近数据点 Y[t] 的信息来更新先前的水平 L[t-1]。我们可以看到这是一个加权平均值，其中 α 和 1-α
  是权重。


  平滑常数等于 α。


  α 值介于 0 和 1 之间，即 0≤α≤1。


  该算法从它看到的新数据中学习新的水平。初始化整个系统的一种可能方法是将 L1 设置为序列中的第一个记录。


  F[1] = L[1] = Y[1]


  为什么它被称为指数平滑？


  以下是水平更新方程：


  L[t =] αY[t] + (1-α) L[t-1]


  用其公式替换 L[t]，如下所示：


  L[t =] αY[t] + (1-α) [(αY[t-1] +(1-α)L[t-2]] =


  = αY[t]+ α(1-α) Y[t-1]+(1-α)² L[t-2 = …]


  = αY[t]+ α(1-α) Y[t-1]+ α (1-α)² Y[t-2] + […]


  我们可以看到，我们最终得到的是序列中所有值的平均值，但这些值的权重随着时间回溯呈指数衰减。因此，这被称为 *指数平滑*。当 α = 1 时，过去的值不会影响预测。当
  α = 0 时，过去的值在平均值中具有相等的权重，这被称为 *欠平滑*。在这种情况下，我们不会对近期信息赋予更多权重，这被称为 *过平滑*。


  以下是 alpha 的影响：


  | **α** | **α (1- α)** | **α (1- α)**^(**2**) | **α (1- α)**^(**3**) |

  | --- | --- | --- | --- |

  | 0.9 | 0.089 | 0.0089 | 0.00089 |

  | 0.5 | 0.25 | 0.125 | 0.0625 |

  | 0.1 | 0.09 | 0.081 | 0.0729 |


  在所有情况下，随着我们回溯过去，alpha 较大时衰减很快，而 alpha 较小时衰减较慢。




