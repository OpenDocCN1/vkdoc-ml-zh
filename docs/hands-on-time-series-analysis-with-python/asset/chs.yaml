  dataX, dataY, TRAIN_SPLIT, None, hist_window, horizon)

  ```


  使用 `tf.data` 函数准备训练和验证时间序列数据，这是一种向模型提供数据的更快、更高效的方式。


  ```

  BATCH_SIZE = 256

