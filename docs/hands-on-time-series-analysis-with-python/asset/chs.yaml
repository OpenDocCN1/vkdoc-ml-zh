  本书通过完整的示例，解释了从传统到前沿的时间序列概念和技术。


  本书首先介绍时间序列的基础知识及其特征、时间序列数据的结构与组成部分、预处理，以及通过数据整理构建特征的方法。接着，本书涵盖了传统的时间序列技术，例如平滑方法
  ARMA、ARIMA、SARIMA、SARIMAX、VAR 和 VARMA，并使用 [Statsmodels](https://www.statsmodels.org/)
  和 Pmdarima 等流行框架进行讲解。


  此外，本书进一步介绍了如何利用基于深度学习的高级技术（如 ANN、CNN、RNN、LSTM、GRU 和 Autoencoder）来解决时间序列问题，并使用 Tensorflow
  实现。最后，本书解释了如何使用流行框架 fbprophet 对时间序列分析进行建模。


  完成本书后，读者将掌握解决时间序列问题的概念和技术的全面知识。本书中提供的所有代码均可在 Jupyter Notebooks 中找到；这使得读者能够进行动手实验，并以令人兴奋的方式对其进行改进。


