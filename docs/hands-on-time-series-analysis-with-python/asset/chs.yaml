  \ y_pred)}')\nprint(f'R2 is : {metrics.r2_score(y_true, y_pred)}',end='\\n\\n')\n\
  ```\n\n以下是用于检查数据平稳性的 ADF 检验函数：\n\n```\ndef Augmented_Dickey_Fuller_Test_func(series\
  \ , column_name):\nprint (f'Results of Dickey-Fuller Test for column: {column_name}')\n\
  dftest = adfuller(series, autolag='AIC')\ndfoutput = pd.Series(dftest[0:4], index=['Test\
  \ Statistic','p-value','No Lags Used','Number of Observations Used'])\nfor key,value\
  \ in dftest[4].items():\ndfoutput['Critical Value (%s)'%key] = value\nprint (dfoutput)\n\
  if dftest[1] \")\nprint(\"Reject the null hypothesis\")\nprint(\"Data is stationary\"\
  )\nelse:\nprint(\"Conclusion:====>\")\nprint(\"Fail to reject the null hypothesis\"\
  )\nprint(\"Data is non-stationary\")\n```\n\n我们可以看到 Close 列是非平稳的，auto-arima 会在内部处理这个问题。\n\
  \n```\nAugmented_Dickey_Fuller_Test_func(df['Close' ],'Close')\n```\n\n![../images/492113_1_En_4_Chapter/492113_1_En_4_Figi_HTML.jpg](img/492113_1_En_4_Figi_HTML.jpg)\n\
