  \n*协整检验* 衡量的是底层变量在长期内的共同运动趋势。这种长期估计特性使其区别于相关性。两个或多个变量当且仅当它们共享共同趋势时才是协整的。\n\n*相关性*\
  \ 仅仅是衡量两个或多个变量之间相互关联程度的一种度量。\n\n我们可以看到，检验结果表明特征之间存在长期关系。\n\n\n\n```\nfrom statsmodels.tsa.vector_ar.vecm\
  \ import coint_johansen\ndef cointegration_test(df):\nres = coint_johansen(df,-1,5)\n\
  d = {'0.90':0, '0.95':1, '0.99':2}\ntraces = res.lr1\ncvts = res.cvt[:, d[str(1-0.05)]]\n\
  def adjust(val, length= 6):\nreturn str(val).ljust(length)\nprint('列名   >  检验统计量\
  \ > C(95%)    =>   显著性  \\n', '--'*20)\nfor col, trace, cvt in zip(df.columns, traces,\
  \ cvts):\nprint(adjust(col), '> ', adjust(round(trace,2), 9), \">\", adjust(cvt,\
  \ 8), ' =>  ' , trace > cvt)\ncointegration_test(train_diff[['Open', 'High', 'Low',\
  \ 'Close']])\n```\n\n![../images/492113_1_En_4_Chapter/492113_1_En_4_Figby_HTML.jpg](img/492113_1_En_4_Figby_HTML.jpg)\n\
  \n对 AR 项在 1 到 9 之间拟合 VAR 模型，并选择最佳的 AR 分量，如下所示：\n\n```\nfor i in [1,2,3,4,5,6,7,8,9]:\n\
  model = VAR(train_diff)\nresults = model.fit(i)\nprint(f'阶数 : {i}, AIC:  {results.aic},\
  \ BIC: { results.bic}')\n```\n\n![../images/492113_1_En_4_Chapter/492113_1_En_4_Figbz_HTML.jpg](img/492113_1_En_4_Figbz_HTML.jpg)\n\
  \n为了使数据平稳，我们在预测结果后使用了 Pandas 差分。我们需要将结果逆变换回原始尺度。由于我们没有现成的 Pandas 函数来实现这一点，让我们定义一个自定义函数来逆变换\
  \ Pandas 差分。\n\n```\ndef inverse_diff(actual_df, pred_df):\ndf_res = pred_df.copy()\n\
  columns = actual_df.columns\nfor col in columns:\ndf_res[str(col)+'_1st_inv_diff']\
  \ = actual_df[col].iloc[-1] + df_res[str(col)].cumsum()\nreturn df_res\n```\n\n\
