  \n协整检验用于检查两个或多个变量之间是否存在长期关系。然而，相关性并不一定意味着“长期”。\n\n我们可以看到检验结果表明特征之间存在长期关系。\n\n```\n\
  from statsmodels.tsa.vector_ar.vecm import coint_johansen\ndef cointegration_test(df):\n\
  res = coint_johansen(df,-1,5)\nd = {'0.90':0, '0.95':1, '0.99':2}\ntraces = res.lr1\n\
  cvts = res.cvt[:, d[str(1-0.05)]]\ndef adjust(val, length= 6):\nreturn str(val).ljust(length)\n\
  print('Column Name   >  Test Stat > C(95%)    =>   Signif  \\n', '--'*20)\nfor col,\
  \ trace, cvt in zip(df.columns, traces, cvts):\nprint(adjust(col), '> ', adjust(round(trace,2),\
  \ 9), \">\", adjust(cvt, 8), ' =>  ' , trace > cvt)\ncointegration_test(train_diff[['Open',\
  \ 'High', 'Low', 'Close']])\n```\n\n![../images/492113_1_En_4_Chapter/492113_1_En_4_Figco_HTML.jpg](img/492113_1_En_4_Figco_HTML.jpg)\n\
  \n定义逆差分函数。\n\n```\ndef inverse_diff(actual_df, pred_df):\ndf_res = pred_df.copy()\n\
  columns = actual_df.columns\nfor col in columns:\ndf_res[str(col)+'_1st_inv_diff']\
  \ = actual_df[col].iloc[-1] + df_res[str(col)].cumsum()\nreturn df_res\n```\n\n\
  让我们定义一个参数网格，用于选择 p、q 和趋势。\n\n```\nfrom sklearn.model_selection import ParameterGrid\n\
  param_grid = {'p': [1,2,3], 'q':[1,2,3], 'tr': ['n','c','t','ct']}\npg = list(ParameterGrid(param_grid))\n\
  print(pg)\n```\n\n![../images/492113_1_En_4_Chapter/492113_1_En_4_Figcp_HTML.jpg](img/492113_1_En_4_Figcp_HTML.jpg)\n\
  \n以下逻辑评估了 p、q 和趋势的所有可能组合，并将结果存储在 `df_results_moni` DataFrame 中，以供进一步参考。网格搜索通常需要花费时间。\n\
  \n```\ndf_results_moni = pd.DataFrame(columns=['p', 'q', 'tr','RMSE open','RMSE\
  \ high','RMSE low','RMSE close'])\nprint('starting grid search')\nstart = timer()\n\
  for a,b in enumerate(pg):\np = b.get('p')\nq = b.get('q')\ntr = b.get('tr')\nmodel\
  \ = VARMAX(train_diff, order=(p,q), trend=tr).fit()\nz = model.forecast(y=train_diff[['Open',\
  \ 'High', 'Low', 'Close']].values, steps=30)\ndf_pred = pd.DataFrame(z, columns=[\
  \ 'Open', 'High', 'Low', 'Close'])\nres = inverse_diff(df[['Open', 'High', 'Low',\
  \ 'Close']],df_pred)\nopenrmse = np.sqrt(metrics.mean_squared_error(test.Open, res.Open_1st_inv_diff))\n\
  highrmse = np.sqrt(metrics.mean_squared_error(test.High, res.High_1st_inv_diff))\n\
  lowrmse = np.sqrt(metrics.mean_squared_error(test.Low, res.Low_1st_inv_diff))\n\
  closermse = np.sqrt(metrics.mean_squared_error(test.Close, res.Close_1st_inv_diff))\n\
  df_results_moni = df_results_moni.append({'p': p, 'q': q, 'tr': tr,'RMSE open':\
  \ openrmse,'RMSE high':highrmse,'RMSE low':lowrmse,'RMSE close':closermse }, ignore_index=True)\n\
  end = timer()\nprint(f' Total time taken to complete grid search in seconds: {(end\
  \ - start)}')\n按每个特征 RMSE 的排序顺序打印 DataFrame 值。\ndf_results_moni.sort_values(by =\
  \ ['RMSE open','RMSE high','RMSE low','RMSE close'] )\n```\n\n![../images/492113_1_En_4_Chapter/492113_1_En_4_Figcq_HTML.jpg](img/492113_1_En_4_Figcq_HTML.jpg)\n\
  \n从前面的例子中，我们可以看到 p=1, q=2, tr=n 给出了最小的 RMSE。\n\n让我们进行拟合和预测，如下所示：\n\n```\nmodel =\
  \ VARMAX(train_diff[[ 'Open', 'High', 'Low', 'Close' ]], order=(1,2),trends = 'n').fit(\
  \ disp=False)\nresult = model.forecast(steps = 30)\n```\n\n现在让我们对预测结果进行逆差分，如下所示：\n\
