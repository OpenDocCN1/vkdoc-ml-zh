  \n\n\n## 季节性 ARIMA 简介\n\n季节性 ARIMA（SARIMA）是 ARIMA 的一种技术，它能够在单变量时间序列数据中处理季节性成分。它引入了三个新的超参数，用于定义时间序列季节性成分的\
  \ AR(P)、I(D) 和 MA(Q)。SARIMA 允许序列中出现季节性。\n\n季节性 ARIMA 模型将非季节性成分和季节性成分结合在一个乘法模型中。其表示法可定义如下：\n\
  \n**ARIMA (p, d, q) X (P, D, Q)**[**m**]\n\nm 是每年的观测值数量。\n\n需要配置三个趋势元素。它们与 ARIMA\
  \ 模型相同，如下所示：\n\n(p, d, q) 是非季节性成分，如下所示：\n\n*   **p**：趋势自回归阶数\n\n*   **d**：趋势差分阶数\n\
  \n*   **q**：趋势移动平均阶数\n\n(P, Q, D) 是季节性成分。\n\n有四个不属于 ARIMA 模型的季节性成分是必须配置的。\n\n* \
  \  **P**：季节性自回归阶数\n\n*   **D**：季节性差分阶数\n\n*   **Q**：季节性移动平均阶数\n\n*   **m**：单季节阶数的时间戳\n\
  \n在不进行差分运算的情况下，该模型可以写成如下形式。\n\n模型的季节性部分包含的项类似于模型的非季节性成分，但涉及季节性周期的后移。示例如下：\n\n**ARIMA\
  \ (1,1,1) X (1,1,1)** [**m**]\n\n**(1−ϕ**[**1**]**B) (1−Φ**[**1**]**B**^(**m**)**)\
  \ (1−B) (1−B**^(**m**)**) y**[**t**] **= (1+θ**[**1**]**B) (1+Θ**[**1**]**B**^(**m**)**)\
  \ ε**[**t**].\n\n表 4-6 说明了 AR 和 MA 的非季节性和季节性成分。\n\n表 4-6\n\n解读非季节性和季节性成分\n\n| 非季节性成分\
  \ | 季节性成分 |\n| --- | --- |\n| AR: Φ(B) = 1- Φ[1]B^P | AR: Φ(B) = 1- Φ[1]B^(pm) |\n\
  | MA: θ(B) = 1 + θ[1]B^q | MA: Θ(B) = 1 + Θ[1]B^(qm) |\n\n额外的项只是与非季节性项相乘。\n\n例如，ARIMA\
  \ (0,0,1) X (0,0,1)[12]。\n\n*   非季节性 MA (1)：*θ*(B) = 1 + *θ*[1]B\n\n*   季节性 MA (1)：Θ(B)\
  \ = 1 + *θ*[1]B¹²\n\n以下是最终模型：Θ(B) x *θ*(B) = (1 + *θ*[1]B¹²) (1 + *θ*[1]B)。\n\n\
  ![../images/492113_1_En_4_Chapter/492113_1_En_4_Fign_HTML.jpg](img/492113_1_En_4_Fign_HTML.jpg)\n\
  \n### SARIMA 实战\n\n在上一节中，您了解了 SARIMA 背后的高级数学原理，可以对季节性成分进行数据建模。现在，让我们在一个时间序列数据集上实现它。\n\
  \n```\nimport warnings\nimport matplotlib.pyplot as plt\nimport numpy as np\nimport\
  \ pandas as pd\nimport statsmodels.api as sm\nfrom pmdarima import auto_arima\n\
  from sklearn import metrics\nfrom statsmodels.tsa.seasonal import seasonal_decompose\n\
  from statsmodels.tsa.stattools import adfuller\nwarnings.filterwarnings(\"ignore\"\
  )\ndf = pd.read_csv(r'\\Data\\FB.csv')\n```\n\n让我们快速浏览一下数据。\n\n```\ndf.head(10)\n\
  ```\n\n![../images/492113_1_En_4_Chapter/492113_1_En_4_Figo_HTML.jpg](img/492113_1_En_4_Figo_HTML.jpg)\n\
  \n定义时间序列评估函数，如下所示：\n\n```\ndef timeseries_evaluation_metrics_func(y_true, y_pred):\n\
  def mean_absolute_percentage_error(y_true, y_pred):\ny_true, y_pred = np.array(y_true),\
  \ np.array(y_pred)\nreturn np.mean(np.abs((y_true - y_pred) / y_true)) * 100\nprint('Evaluation\
  \ metric results:-')\nprint(f'MSE is : {metrics.mean_squared_error(y_true, y_pred)}')\n\
