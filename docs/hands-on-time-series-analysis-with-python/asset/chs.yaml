- "# 1. 时间序列特征\n\n*时间序列*是一组按时间存储的数据点。对这种数据进行的数学和统计分析，以发现隐藏模式和有意义的信息，被称为*时间序列分析*。时间序列建模技术用于理解数据中的过去模式，并尝试预测未来趋势。这些技术和方法已经发展了几十年。\n\
  \n具有连续时间戳和目标变量的观测值有时会被分解为分钟、小时、天、周、月、年等，并被视为简单的回归问题，但这并不是处理此类数据的正确方法，因为获得的结果很差。在本章中，你将学习处理时间序列数据的正确方法。\n\
  \n数据有不同的类型，例如结构化、半结构化和非结构化，每种类型都应以自己的方式处理，以获得最大的信息量。在本书中，我们将研究结构化的时间序列数据，例如来自股票市场、天气、出生率、交通、共享单车应用等的数据。\n\
  \n本章是对时间序列数据类型、其组成部分以及分解方法的简要介绍。\n\n## 数据类型\n\n*时间序列分析*是一种测量一组连续数据点的统计技术。这是一种以时间为标准度量的方法，分为三种类型，如图\
  \ 1-1 所示。\n\n![../images/492113_1_En_1_Chapter/492113_1_En_1_Fig1_HTML.png](img/492113_1_En_1_Fig1_HTML.png)\n\
  \n图 1-1\n\n数据类型\n\n### 时间序列数据\n\n时间序列包含在一段时间内按时间顺序增加、减少或以其他方式变化的数据点。仅包含单个特征或变量记录的时间序列称为*单变量*时间序列。如果记录包含多个特征或变量，则该序列称为*多变量*时间序列。此外，时间序列可以以两种方式指定：连续或离散。\n\
  \n在*连续*时间序列中，数据观测在整个时间段内连续进行，例如地震仪震级数据、语音数据等。图 1-2 展示了从 1975 年到 2015 年连续测量的地震数据。\n\
  \n![../images/492113_1_En_1_Chapter/492113_1_En_1_Fig2_HTML.png](img/492113_1_En_1_Fig2_HTML.png)\n\
  \n图 1-2\n\n四十年地震仪震级数据\n\n图 1-3 展示了印度一个世纪以来的温度变化情况，并清楚地表明温度正在单调上升。\n\n![../images/492113_1_En_1_Chapter/492113_1_En_1_Fig3_HTML.png](img/492113_1_En_1_Fig3_HTML.png)\n\
  \n图 1-3\n\n印度 1901 年至 2017 年的温度数据\n\n在*离散*时间序列中，数据观测在特定时间或等间隔进行，例如温度的升高或降低、货币汇率、气压数据等。图\
  \ 1-2 展示了印度 1901 年至 2017 年的平均温度分析，该温度随时间升高或降低。这种数据行为是离散的。\n\n### 横截面数据\n\n*横截面数据*是在特定时间点针对多个主体收集的数据，例如特定日期特定股票组合的收盘价、选举的民意调查、人口中的肥胖水平等。横截面研究用于许多研究领域，例如医学、经济学、心理学等。例如，根据世界卫生组织\
  \ 2017 年的报告，高血压是印度死亡的重要原因之一。世界卫生组织对几个风险因素（考虑了各种主体）进行了研究，这反映了横截面调查数据。图 1-4 展示了横截面数据。\n\
  \n![../images/492113_1_En_1_Chapter/492113_1_En_1_Fig4_HTML.png](img/492113_1_En_1_Fig4_HTML.png)\n\
  \n图 1-4\n\n印度按风险因素划分的死亡人数\n\n\n\n### 面板数据/纵向数据\n\n*面板数据/纵向数据*包含对同一对象在不同时间段内多次观测的结果。这类数据是根据横截面数据单元（如个人、公司或政府机构）中的观测数量定期确定的。表\
  \ 1-1 提供了在几年内对多人收集的数据示例，其中收集的数据包括收入、年龄和性别。\n\n表 1-1\n\n面板数据示例\n\n| 面板数据 A |  | \
  \ |  |  |\n| --- | --- | --- | --- | --- |\n| **姓名** | **年份** | **收入** | **年龄**\
  \ | **性别** |\n| **艾伦** | 2016 | 42145 | 24 | 女 |\n| **艾伦** | 2017 | 47797 | 21 |\
  \ 女 |\n| **艾伦** | 2018 | 41391 | 23 | 女 |\n| **玛丽莎** | 2016 | 41100 | 22 | 男 |\n\
  | **玛丽莎** | 2017 | 25800 | 23 | 男 |\n| **玛丽莎** | 2018 | 34508 | 22 | 男 |\n| **面板数据\
  \ B** |  |  |  |  |\n| **姓名** | **年份** | **收入** | **年龄** | **性别** |\n| **玛丽莎** |\
  \ 2016 | 42688 | 27 | 女 |\n| **玛丽莎** | 2017 | 21219 | 25 | 女 |\n| **艾伦** | 2016\
  \ | 46340 | 26 | 男 |\n| **艾伦** | 2017 | 22715 | 22 | 男 |\n| **艾伦** | 2018 | 34653\
  \ | 21 | 男 |\n| **艾丽西亚** | 2017 | 31553 | 29 | 女 |\n\n在表 1-1 中，数据集 A 和 B（包含收入、年龄和性别属性）是针对不同人群多年收集的。数据集\
  \ A 描述了对艾伦和玛丽莎两人在三年（2016、2017、2018）内的观测情况；这被称为*平衡面板数据*。数据集 B 被称为*非平衡面板数据*，因为并非每个个体在每一年都有数据。\n\
  \n## 趋势\n\n*趋势*是在一段时间内观察到的模式，表示相对于时间的平均变化率。趋势通常显示数据在长期内是增加（上升趋势）还是减少（下降趋势）。在给定的时间段内，增加或减少的方向并不一定始终相同。趋势线也可以使用蜡烛图绘制。\n\
  \n例如，您可能听说过黄金、白银、股票价格、汽油、柴油等不同市场商品的涨跌，或者银行利率或住房贷款利率的升降。这些都是商品市场状况，它们会随时间增加或减少，从而在数据中显示出趋势。\n\
  \n### 使用 Hodrick-Prescott 滤波器检测趋势\n\nHodrick-Prescott (HP) 滤波器已成为消除数据中趋势运动的基准方法。该方法广泛应用于应用宏观经济学研究中的计量经济学方法。该技术是非参数化的，用于将时间序列分解为趋势成分；它是一个不受经济理论或先验趋势规范影响的周期成分。与所有非参数方法一样，HP\
  \ 滤波器在很大程度上依赖于一个控制平滑程度的调谐参数。该方法广泛应用于中央银行、国际经济机构、行业和政府中的应用宏观经济学中。\n\n通过以下示例代码，您可以了解\
  \ EXINUS 股票在一段时间内的变化情况：\n\n```\nimport pandas as pd\nfrom statsmodels.tsa.filters.hp_filter\
  \ import hpfilter\ndf = pd.read_excel(r'\\Data\\India_Exchange_Rate_Dataset.xls',\\\
  \nindex_col=0,parse_dates=True)\nEXINUS_cycle,EXINUS_trend = hpfilter(df['EXINUS'],\
  \ lamb=1600)\nEXINUS_trend.plot(figsize=(15,6)).autoscale(axis='x',tight=True)\n\
  ```\n\n图 1-5 显示了该时期内的上升趋势。\n\n![../images/492113_1_En_1_Chapter/492113_1_En_1_Fig5_HTML.jpg](img/492113_1_En_1_Fig5_HTML.jpg)\n\
  \n图 1-5\n\nEXINUS 股票显示上升趋势\n\n### 时间序列去趋势\n\n*去趋势*是从时间序列数据中移除趋势的过程，或者指随时间变化的均值。它在时间跨度内持续增加或减少。识别、建模甚至从时间序列数据集中移除趋势数据可能是有益的。以下是去趋势时间序列数据的方法：\n\
  \n*   Pandas 差分法\n\n*   SciPy 信号法\n\n*   HP 滤波器法\n\n#### 使用 Pandas 差分法去趋势\n\nPandas\
  \ 库有一个内置函数用于计算数据集的差值。这个 `diff()` 函数既可用于序列，也可用于 DataFrame。它可以提供一个周期值来进行移位以形成差值。以下代码是\
  \ Pandas 差分法的示例。\n\n*   `Warning` 是 Python 的一个内置模块，用于处理警告消息。\n\n*   `Pyplot` 是 Matplotlib\
  \ 的一个子模块，用于设计数据的图形表示。\n\n```\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\
  import warnings\nwarnings.filterwarnings(\"ignore\")\ndf = pd.read_excel(r'\\Data\\\
  India_Exchange_Rate_Dataset.xls',\\\nindex_col=0,parse_dates=True)\ndiff = df.EXINUS.diff()\n\
  plt.figure(figsize=(15,6))\nplt.plot(diff)\nplt.title('Detrending using Differencing',\
  \ fontsize=16)\nplt.xlabel('Year')\nplt.ylabel('EXINUS exchange rate')\nplt.show()\n\
  ```\n\n图 1-6 显示了使用 Pandas 差分法去除趋势后的数据。\n\n![../images/492113_1_En_1_Chapter/492113_1_En_1_Fig6_HTML.jpg](img/492113_1_En_1_Fig6_HTML.jpg)\n\
  \n图 1-6\n\n使用差分法去除趋势\n\n#### 使用 SciPy 信号法去趋势\n\n信号是时间序列数据的另一种形式。每个信号都会以不同的顺序增加或减少。使用\
  \ SciPy 库，可以从信号数据中移除线性趋势。以下代码展示了 SciPy 去趋势的示例。\n\n*   `Signal.detrend` 是 SciPy 的一个子模块，用于从数据中移除沿某个轴的线性趋势。\n\
  \n```\nimport pandas as pd\nimport matplotlib.pyplot as plt\nfrom scipy import signal\n\
  import warnings\nwarnings.filterwarnings(\"ignore\")\ndf = pd.read_excel(r'\\Data\\\
  India_Exchange_Rate_Dataset.xls',\\\nindex_col=0,parse_dates=True)\ndetrended =\
  \ signal.detrend(df.EXINUS.values)\nplt.figure(figsize=(15,6))\nplt.plot(detrended)\n\
  plt.xlabel('EXINUS')\nplt.ylabel('Frequency')\nplt.title('Detrending using Scipy\
  \ Signal', fontsize=16)\nplt.show()\n```\n\n图 1-7 显示了使用 SciPy 去趋势后的数据。\n\n![../images/492113_1_En_1_Chapter/492113_1_En_1_Fig7_HTML.jpg](img/492113_1_En_1_Fig7_HTML.jpg)\n\
  \n图 1-7\n\n使用 SciPy 移除信号中的线性趋势\n\n#### 使用 HP 滤波器去趋势\n\nHP 滤波器也用于对时间序列进行去趋势处理并平滑数据。它用于移除短期波动。以下代码展示了\
  \ HP 滤波器去趋势的示例。\n\n*   `Hpfilter` 是 Statmodels 的一个子模块，用于移除平滑趋势。\n\n```\nimport pandas\
  \ as pd\nimport matplotlib.pyplot as plt\nfrom statsmodels.tsa.filters.hp_filter\
  \ import hpfilter\nimport warnings\nwarnings.filterwarnings(\"ignore\")\ndf = pd.read_excel(r'\\\
  Data\\India_Exchange_Rate_Dataset.xls',\\\nindex_col=0,parse_dates=True)\nEXINUS_cycle,EXINUS_trend\
  \ = hpfilter(df['EXINUS'], lamb=1600)\ndf['trend'] = EXINUS_trend\n.\ndetrended\
  \ = df.EXINUS - df['trend']\nplt.figure(figsize=(15,6))\nplt.plot(detrended)\nplt.title('Detrending\
  \ using HP Filter', fontsize=16)\nplt.xlabel('Year')\nplt.ylabel('EXINUS exchange\
  \ rate')\nplt.show()\n```\n\n图 1-8 显示了移除平滑趋势后的数据。\n\n![../images/492113_1_En_1_Chapter/492113_1_En_1_Fig8_HTML.jpg](img/492113_1_En_1_Fig8_HTML.jpg)\n\
  \n图 1-8\n\n使用 HP 滤波器去除趋势\n\n\n\n## 季节性\n\n季节性是一种周期性波动，指相同模式在固定的时间间隔内重复出现。它是经济、天气和股票市场时间序列数据的一个特征；在科学数据中则较为少见。在其他行业中，许多现象都表现为周期性重复的季节效应。例如，零售额往往在圣诞节期间增加，之后减少。\n\
  \n以下方法可用于检测季节性：\n\n*   多个[箱线图](https://www.itl.nist.gov/div898/handbook/eda/section3/boxplot.htm)\n\
  \n*   自相关图\n\n### 多个[箱线图](https://www.itl.nist.gov/div898/handbook/eda/section3/boxplot.htm)\n\
  \n*箱线图*是一种用于描绘数据在某个范围内分布情况的基本图表。它是展示最小值、第一四分位数、中位数、第三四分位数和最大值的标准方法。以下代码展示了借助多个箱线图检测季节性的示例。见图\
  \ 1-9。\n\n*   Seaborn 是一个类似于 Matplotlib 的图形表示包。\n\n    ```\n    import pandas as\
  \ pd\n    import seaborn as sns\n    import matplotlib.pyplot as plt\n    import\
  \ warnings\n    warnings.filterwarnings(\"ignore\")\n    df=pd.read_excel(r'\\Data\\\
  India_Exchange_Rate_Dataset.xls',\\\n    parse_dates=True)\n    df['month'] = df['observation_date'].dt.strftime('%b')\n\
  \    df['year'] = [d.year for d in df.observation_date]\n    df['month'] = [d.strftime('%b')\
  \ for d in df.observation_date]\n    years = df['year'].unique()\n    plt.figure(figsize=(15,6))\n\
  \    sns.boxplot(x='month', y='EXINUS', data=df).set_title(\"Multi Month-wise Box\
  \ Plot\")\n    plt.show()\n    ```\n\n![../images/492113_1_En_1_Chapter/492113_1_En_1_Fig9_HTML.jpg](img/492113_1_En_1_Fig9_HTML.jpg)\n\
  \n图 1-9\n\n用于识别季节性的多箱线图\n\n### 自相关图\n\n*自相关*用于检查数据中的随机性。它有助于识别周期未知的数据类型。例如，对于月度数据，如果存在规律性的季节效应，我们期望看到每\
  \ 12 个月后出现显著的峰值滞后。图 1-10 演示了借助自相关图检测季节性的示例。\n\n![../images/492113_1_En_1_Chapter/492113_1_En_1_Fig10_HTML.jpg](img/492113_1_En_1_Fig10_HTML.jpg)\n\
  \n图 1-10\n\n用于识别季节性的自相关图\n\n```\nfrom pandas.plotting import autocorrelation_plot\n\
  import pandas as pd\nimport matplotlib.pyplot as plt\ndf = pd.read_excel(r'\\Data\\\
  India_Exchange_Rate_Dataset.xls',\\\nindex_col=0,parse_dates=True)\nplt.rcParams.update({'figure.figsize':(15,6),\
  \ 'figure.dpi':220})\nautocorrelation_plot(df.EXINUS.tolist())\n```\n\n注意\n\n有时识别季节性并不容易；在这种情况下，我们需要评估其他图表，例如序列图或季节性子序列图。\n\
  \n### 时间序列数据的去季节化\n\n*去季节化*是指从时间序列数据中移除季节性。它剥离了季节效应的模式，以消除季节性影响。时间序列数据包含四个主要组成部分。\n\
  \n*   **水平**指时间序列数据的平均值。\n\n*   **趋势**指时间序列数据中增加或减少的值。\n\n*   **季节性**指时间序列数据中重复出现的周期模式。\n\
  \n*   **噪声**指时间序列数据中的随机方差。\n\n注意\n\n*加法模型*是指时间序列数据将这四个组成部分线性组合以体现线性趋势和季节性；*乘法模型*是指将这些组成部分相乘，以体现非线性趋势和季节性。\n\
  \n### 季节性分解\n\n*分解*是理解时间序列预测中泛化问题和相关问题的过程。我们可以利用季节性分解从数据中移除季节性，并仅检查包含趋势、周期性和不规则变化的数据。图\
  \ 1-11 展示了去除季节性后的数据。\n\n![../images/492113_1_En_1_Chapter/492113_1_En_1_Fig11_HTML.jpg](img/492113_1_En_1_Fig11_HTML.jpg)\n\
  \n图 1-11\n\n使用 Statsmodels 的 seasonal_decompose 进行去季节化\n\n```\nimport pandas as\
  \ pd\nimport matplotlib.pyplot as plt\nfrom statsmodels.tsa.seasonal import seasonal_decompose\n\
  import warnings\nwarnings.filterwarnings(\"ignore\")\ndf = pd.read_excel(r'\\Data\\\
  India_Exchange_Rate_Dataset.xls',\nindex_col=0,parse_dates=True)\nresult_mul = seasonal_decompose(df['EXINUS'],\
  \ model='multiplicative', extrapolate_trend='freq')\ndeseason = df['EXINUS'] - result_mul.seasonal\n\
  plt.figure(figsize=(15,6))\nplt.plot(deseason)\nplt.title('Deseasoning using seasonal_decompose',\
  \ fontsize=16)\nplt.xlabel('Year')\nplt.ylabel('EXINUS exchange rate')\nplt.show()\n\
  ```\n\n## 周期性变化\n\n周期性成分是围绕长期趋势的波动，每隔几个时间单位出现一次；这种行为的频率低于季节性。它是时间序列中的一个循环过程。在商业/经济领域，以下是三种不同类型的周期性变化示例：\n\
  \n*   **繁荣**：众所周知，当组织繁荣时，物价上涨，但收益也会增加。另一方面，繁荣也会导致过度发展、交通挑战、工资率上涨、劳动力不足、高回报率、市场现金短缺和价格让步等，最终导致萧条。\n\
  \n*   **萧条**：众所周知，当交易和企业出现悲观情绪时，工厂倒闭，组织崩溃，失业蔓延，工资和成本都很低。\n\n*   **复苏**：这表现为货币的适宜性、低利率下现金的可获得性、对商品或货币需求的增加（在低利率下）、流行商品和服务的增加，其特点是复苏的情况，最终导致繁荣或景气。\n\
  \n### 检测周期性变化\n\n以下代码展示了如何分解时间序列数据并仅可视化周期模式：\n\n```\nfrom statsmodels.tsa.filters.hp_filter\
  \ import hpfilter\nimport pandas as pd\nimport matplotlib.pyplot as plt\nimport\
  \ warnings\nwarnings.filterwarnings(\"ignore\")\n%matplotlib inline\ndf = pd.read_excel(r'\\\
  Data\\India_Exchange_Rate_Dataset.xls',\nindex_col=0,parse_dates=True)\nEXINUS_cycle,EXINUS_trend\
  \ = hpfilter(df['EXINUS'], lamb=1600)\ndf['cycle'] =EXINUS_cycle\ndf['trend'] =EXINUS_trend\n\
  df[['cycle']].plot(figsize=(15,6)).autoscale(axis='x',tight=True)\nplt.title('Extracting\
  \ Cyclic Variations', fontsize=16)\nplt.xlabel('Year')\nplt.ylabel('EXINUS exchange\
  \ rate')\nplt.show()\n```\n\n图 1-12 展示了从其他数据中分离出的周期行为。\n\n![../images/492113_1_En_1_Chapter/492113_1_En_1_Fig12_HTML.jpg](img/492113_1_En_1_Fig12_HTML.jpg)\n\
  \n图 1-12\n\n使用 HP 滤波器提取周期性变化\n\n## 误差、意外变化和残差\n\n当从时间序列数据中移除趋势和周期性变化后，留下的无法解释的模式称为误差、意外变化或残差。有多种方法可用于检查不规则变化，例如概率论、移动平均法和自回归时间序列方法。如果我们能在数据中发现任何周期性变化，它将被视为残差的一部分。这些因意外情况而发生的变化被称为意外变化或不可预测的误差。\n\
  \n\n\n## 将时间序列分解为各组成部分\n\n*分解*是一种用于将时间序列数据分离为不同元素的方法，例如趋势、季节性、周期变化和残差。我们可以利用统计模型中的季节性分解，将数据分解为其组成部分，并将序列视为加法或乘法模型。\n\
  \n*   **趋势（T(t)）** 表示时间序列数据值的增加或减少。\n\n*   **季节性（S[t]）** 表示时间序列数据中重复出现的短期周期。\n\n\
  *   **周期变化（c[t]）** 表示时间序列数据长期趋势中的波动。\n\n*   **残差（e[t]）** 表示时间序列数据的不规则变化。\n\n加法模型适用于时间序列数据的线性趋势，例如随时间恒定变化的数据。加法模型公式如下：\n\
  \n*Y[t] = T[t] + S[t] + c[t] + e[t]*\n\n乘法模型适用于非线性类型的数据，例如二次型或指数型。乘法模型公式如下：\n\n\
  Y[t] = T[t] * S[t] * c[t] * e[t]\n\n以下示例展示了加法模型和乘法模型：\n\n```\nfrom statsmodels.tsa.seasonal\
  \ import seasonal_decompose\nimport pandas as pd\ndf = pd.read_excel(r'Data\\India_Exchange_Rate_Dataset.xls',\n\
  index_col=0,parse_dates=True)\nresult = seasonal_decompose(df['EXINUS'], model='add')\n\
  result.plot()\nresult = seasonal_decompose(df['EXINUS'], model='mul')\nresult.plot()\n\
  ```\n\n图 1-13 和图 1-14 展示了时间序列分解的两种方法。\n\n![../images/492113_1_En_1_Chapter/492113_1_En_1_Fig14_HTML.jpg](img/492113_1_En_1_Fig14_HTML.jpg)\n\
  \n图 1-14\n\n使用乘法模型分解时间序列数据\n\n![../images/492113_1_En_1_Chapter/492113_1_En_1_Fig13_HTML.jpg](img/492113_1_En_1_Fig13_HTML.jpg)\n\
  \n图 1-13\n\n使用加法模型分解时间序列数据\n\n## 总结\n\n在本章中，我们讨论了什么是时间序列数据，并简要介绍了使用多种技术分离时间序列组成部分（如趋势、季节性、周期变化和误差）的各种方法。在下一章中，你将学习如何对时间序列数据进行数据整理。\n\
  \n"
- '# 2. 时间序列的数据整理与准备


  在数据科学领域，“垃圾进，垃圾出”这句话绝对适用。


  *数据整理*是一门艺术，它借助预处理策略，将原始数据转换并映射为有价值的信息。其目标是提供丰富的数据，以便能够从中获取最大洞察。它包含诸如加载、插补、应用转换、处理异常值、清洗、集成、处理不一致性、降维以及特征工程等操作。数据整理是机器学习建模中不可或缺且主要的部分。现实世界的数据无疑是混乱的，不进行任何整理就直接将数据用于建模是不合理的。


  本章介绍如何借助 Pandas 读取多种数据文件格式。内容涵盖如何进行数据选择、转换和清洗，以及如何借助 Pandas 和 Pandasql 推导基本统计量。


  注意


  本章介绍的函数和方法具有比此处涵盖的更多功能。你可以在 Pandas 和 Pandasql 的官方网站上更详细地探索它们。


  ## 将数据加载到 Pandas 中


  Pandas 是用于数据整理的最著名的框架。它包含旨在使数据分析快速便捷的数据操作和分析工具。在现实世界中，数据通过各种工具和设备生成；因此，它有不同的格式，例如
  CSV、Excel 和 JSON。此外，有时需要从 URL 读取数据。所有数据都包含若干记录和变量。在本节中，你将学习如何使用 Pandas 处理各种数据格式。


  ### 使用 CSV 加载数据


  该数据集描绘了随时间变化的女性出生人数。Pandas 有一个内置函数用于读取 CSV 文件。以下代码导入数据集：


  ```

  import pandas as pd

  df = pd.read_csv(r''\Data\daily-total-female-births-CA.csv'')

  df.head(5)

  ```


  以下是 CSV 文件中的前五条记录：


  ![../images/492113_1_En_2_Chapter/492113_1_En_2_Figa_HTML.jpg](img/492113_1_En_2_Figa_HTML.jpg)


  如果文件有不同的分隔符，请使用 `sep = ‘ ’` 并填入分隔符，例如 `(;, |,\t,‘ ’)`。


  ### 使用 Excel 加载数据


  伊斯坦布尔证券交易所数据集包含伊斯坦布尔证券交易所的收益率，以及从 2009 年 6 月 5 日到 2011 年 2 月 22 日期间其他七个国际指数（SP、DAX、FTSE、NIKKEI、BOVESPA、MSCE_EU、MSCI_EM）的收益率。数据按工作日组织。该数据以
  Excel 格式提供，Pandas 有一个内置函数用于读取 Excel 文件。以下代码导入数据集：


  ```

  import pandas as pd

  dfExcel = pd.read_excel(r''\Data\istambul_stock_exchange.xlsx'', sheet_name = ''Data'')

  dfExcel.head(5)

  ```


  以下是 Excel 文件中的前五条记录：


  ![../images/492113_1_En_2_Chapter/492113_1_En_2_Figb_HTML.jpg](img/492113_1_En_2_Figb_HTML.jpg)


  ### 使用 JSON 加载数据


  此示例数据集为 JSON 格式。以下代码导入数据集：


  ```

  import pandas as pd

  dfJson = pd.read_json(r''\Data\test.json'')

  dfJson.head(5)

  ```


  以下是 JSON 中的记录：


