  ## 窗口函数


  *窗口函数*用于计算多种操作，例如滚动计数、滚动求和、滚动均值、滚动中位数、滚动方差、滚动标准差、滚动最小值、滚动最大值、滚动相关性、滚动协方差、滚动偏度、滚动峰度、滚动分位数等。此外，我们还可以执行其他一些操作，例如扩展窗口和指数加权移动窗口。以下示例展示了
  Pandas 中窗口操作的结果：


  ```

  import pandas as pd

