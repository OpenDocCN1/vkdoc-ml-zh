  ## DataFrame 摘要


  *描述性统计*是一种以有意义的方式描述数据的方法，可用于表示整个总体或样本。它包含两个部分：*集中趋势度量*，用于衡量样本和总体的摘要（例如均值、中位数和众数）；以及*变异性度量*，用于衡量数据集中的离散程度（例如极差、四分位距、方差和标准差）。在
  Pandas 中，它提供了一个名为 `describe()` 的内置函数。以下示例展示了 Pandas 中的详细结果。


  在 Pandas 中，`describe()` 函数会返回多个描述性统计值（例如均值、标准差、最小值、中位数、最大值、第一四分位数、第三四分位数）。


