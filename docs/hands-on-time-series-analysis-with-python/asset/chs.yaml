  \n我们可以看到，外生变量 `open` 有助于提高模型精度，同时我们注意到 `m` 对预测没有任何影响。\n\n## 向量自回归简介\n\n*向量自回归*（VAR）是一种随机过程模型，用于捕捉时间序列数据中多个变量之间的线性关系。换句话说，它是一种当两个或多个时间序列变量彼此之间存在强内在关系时使用的多元预测方法。VAR\
  \ 是一个双向模型，而其他模型是单向模型。在单向模型中，预测变量影响目标变量，但反之则不成立。在双向模型中，变量之间相互影响。\n\n普通的 AR(p) 模型方程如下所示：\n\
  \n**Ŷt = μ + ϕ**[**1**]**Y**[**t-1**] **+ ϕ**[**2**]**Y**[**t-2 … +**] **ϕ**[**p**]**Y**[**t-p**]\
  \ **+ ɛ**[**t**]\n\n其中 μ 是截距项，ϕ[1,] ϕ[2….] ϕ[n] 是 Y 的滞后项的系数。在 VAR 模型中，每个变量都被建模为其自身过去值以及时间序列中其他变量过去值的线性组合。如果你有多个相互决定的时间序列，那么每个方程将设计一个变量。例如，假设我们有一个时间序列的两个变量\
  \ Y[1,] Y[2]。我们想要预测它们在时间 (t) 的值。\n\n以下是包含两个时间序列（Y[1] 和 Y[2]）的 VAR (1) 模型：\n\n**Ŷ**[**1,t**]\
  \ **= μ**[**1**] **+ ϕ**[**11**]**Y**[**1,****t-1**] **+ ϕ**[**12**]**Y**[**1,****t-2**]\
  \ **+ ɛ**[**1,****t**]\n\n**Ŷ**[**2,t**] **= μ**[**2**] **+ ϕ**[**21**]**Y**[**2,****t-1**]\
  \ **+ ϕ**[**22**]**Y**[**2,****t-2**] **+ ɛ**[**2,****t**]\n\n其中 y[1,t-1,] y[2,t-1]\
  \ 是时间序列 Y[1] 和 Y[2] 的一阶滞后项。\n\nVAR 模型在设计模型时遵循与单变量时间序列相同的规则。它使用相应的评估矩阵，如 AIC、BIC、FPE\
  \ 和 HQIC。\n\n\n\n### VAR 实战\n\n在前一节中，你了解了 VAR 背后高层次的数学原理。现在，让我们在一个时间序列数据集上实现它。\n\
