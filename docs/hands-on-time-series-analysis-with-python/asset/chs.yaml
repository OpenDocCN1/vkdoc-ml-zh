  ## 重采样


  *重采样*是一种将基于时间的观测数据转换为不同时间间隔的方法。换句话说，它用于将一种时间频率转换为另一种时间频率格式。例如，假设我们想将月度数据转换为年度格式，或者将周数据上采样为小时数据。我们可以执行上采样或下采样操作。为此，每个数据对象必须具有类似
  DateTime 的 `index（Datetimeindex、PeriodIndex、TimedeltaIndex）`。以下示例展示了 Pandas 中重采样操作的结果：


  ```

  import pandas as pd

  df = pd.read_csv(r''\Data\daily-total-female-births-CA.csv'',index_col =0,

  parse_dates=[''date''])

  df.head(5)

  ```


