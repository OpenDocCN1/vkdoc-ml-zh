- "# 4. 时间序列数据的回归扩展技术\n\n在本章中，你将学习如何利用回归技术高效地解决时间序列问题。*回归*是机器学习中的一种监督学习技术，你尝试使用一个或多个回归变量来估计目标变量。在本章中，你将了解时间序列数据中*平稳性*的含义，以及如何使数据平稳、如何解读\
  \ p 值、如何检验序列是否平稳。最后，我们将探讨 AR、MA、ARIMA、SARIMA、SARIMAX、VAR 和 VARMA 技术，并使用真实世界的数据集解决一些问题。\n\
  \n## 时间序列中平稳行为的类型\n\n*平稳*数据意味着特定过程的统计属性不随时间变化。平稳时间序列数据有五种形式。\n\n1.  **严格或强平稳**：一个随机过程是一个无条件联合概率分布，当在时间上平移时，该分布不会改变。这意味着该分布随时间保持不变。\n\
  \n2.  **一阶平稳**：该序列具有不随时间变化的恒定均值。其他统计属性（如方差）可能会发生变化。\n\n3.  **弱（二阶）平稳**：在弱平稳数据中，均值、方差和协方差在整个时间序列中保持恒定。它也被称为协方差/均值平稳性。\n\
  \n4.  **趋势平稳**：该序列围绕趋势变化（统计属性均值发生变化）。这些趋势可能是线性的或二次的。\n\n5.  **差分平稳**：当数据为时间序列时，这种类型的序列具有一个或多个差分。\n\
  \n因此，如果数据表现出恒定均值、方差和自相关的行为，则称其为*平稳*的。为了训练时间序列预测模型，必须将数据转换为平稳格式。因此，你需要知道如何检查时间序列是否平稳。图\
  \ 4-1 和图 4-2 展示了一些数据在使其平稳前后的情况。\n\n![../images/492113_1_En_4_Chapter/492113_1_En_4_Fig2_HTML.jpg](img/492113_1_En_4_Fig2_HTML.jpg)\n\
  \n图 4-2\n\n平稳化操作后\n\n![../images/492113_1_En_4_Chapter/492113_1_En_4_Fig1_HTML.jpg](img/492113_1_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1\n\n平稳化操作前\n\n## 使数据平稳\n\n当时间序列数据非平稳时，意味着它包含应被移除的趋势和季节性模式。通过使数据平稳，我们的数据将具有恒定的均值和方差，并且大多数统计概念都可以应用。为了检查时间序列是否平稳，我们可以使用三种方法。\n\
  \n*   图表\n\n*   汇总统计\n\n*   统计检验\n\n### 使用图表\n\n前面的图表以可视化形式展示了时间序列数据。这有助于我们理解时间序列是否随时间线性增加或减少，这被称为*非平稳*时间序列。不增加或减少且随时间呈现恒定增长的图被称为*平稳*时间序列。\n\
  \n### 使用汇总统计\n\n汇总统计确定了所有基本要素，如均值、标准差、方差、最小值、最大值和四分位距，这些要素有助于区分数据的行为。它帮助我们评估数据中的季节性或随机模式，以便我们检查是否存在显著差异。无论时间序列是否平稳，我们都可以将时间序列中的数据分成不同的组，在这些组中我们可以比较均值、方差和标准差等差异因素。如果观察到的因素发生变化且在统计上显著，我们就说该时间序列是*非平稳*的。在许多领域，如销售、金融、零售、医疗保健等，我们会发现由于季节性和增长趋势，均值和方差持续变化的不规则行为模式。\n\
  \n\n\n### 使用统计单位根检验\n\n统计检验会对数据做出一个强有力的假设。同样，我们也可以对时间序列数据做出一些假设。为此，我们必须检查时间序列的原假设是否被拒绝。因此，我们可以阐明结果，以使特定问题具有意义。统计单位根检验包含以下五种方法，每种方法都包含一个单位根平稳性检验：\n\
  \n*   **迪基-富勒检验**：该方法基于线性回归。序列相关性是该方法的一个大问题。\n\n*   **增广迪基-富勒检验**：该方法解决了迪基-富勒检验的序列相关问题，并能处理庞大而复杂的模型。该方法被广泛使用。\n\
  \n*   **施密特-菲利普斯检验**：该方法包含了原假设和备择假设中确定性变量的系数。该方法的替代方法是 ro 检验和 tau 检验。\n\n*   **菲利普斯-佩龙检验**：该检验是对迪基-富勒检验的改进，它优化了对误差项中自相关和异方差性的检验。\n\
  \n*   **KPSS 检验**：这是 ADF 检验的逆过程，其原假设是趋势平稳过程，备择假设是存在单位根。\n\n单位根平稳性检验背后的概念是，给定时间序列的统计特性并非随时间恒定不变。在这种情况下，我们使用此统计检验来检查时间序列是平稳的还是非平稳的。\n\
  \n这里我们将解释单位根的数学方程。\n\n*   从数学上讲，该方程表示如下：\n\n**Y**[**t**] **= a * Y**[**t-1**] **+\
  \ €**[**t**]\n\n**Y**[**t-1**] **= a * y**[**t-2**] **+ €**[**t-1**]\n\n其中 Y[t]\
  \ 是时间 t 的实例，€[t] 是误差项。要计算 Y[t]，我们必须先计算 Y[t-1]。\n\n*   对于所有观测值，以下公式适用：\n\n**Y**[**t**]\
  \ **= a**^(**n**) *** y**[**t-n**] **+ €**[**t-1**] *** a**^(**i**)\n\n*   如果在前面的公式中\
  \ a 的值包含 1，那么预测值将是 Yt-n，并且它是从 t-n 到 t 的所有误差之和（这表明方差随时间增加）。这在时间序列领域被称为*单位根*。\n\n\
  *   对于平稳时间序列，方差不能是时间的函数部分。因此，单位根检验通过监测 a = 1 的值来检查时间序列中是否存在单位根。\n\n接下来你将学习如何解读 p\
  \ 值。\n\n## 解读 P 值\n\n在单位根平稳性检验中，我们需要处理原假设（H0），即时间序列非平稳，以及备择假设（H1），即时间序列平稳。当我们执行此单位根平稳性检验时，结果将以\
  \ p 值形式呈现。因此，理解如何解读 p 值至关重要。p 值有助于确定结果的显著性。\n\n如果 p 值低于阈值，则我们拒绝原假设，这意味着时间序列是平稳的。如果\
  \ p 值超过阈值，并且我们无法拒绝原假设，则意味着时间序列是非平稳的。ADF 检验会查看检验统计量、p 值以及在 1%、2.5%、5% 和 10% 置信区间下找到的临界值。\n\
  \n下图显示，如果显著性水平设置为 0.05，则相应的置信水平为 95%：\n\n![../images/492113_1_En_4_Chapter/492113_1_En_4_Figa_HTML.gif](img/492113_1_En_4_Figa_HTML.gif)\n\
  \n## 增广迪基-富勒检验\n\n增广迪基-富勒检验是一种用于平稳性检验的显著且合理的统计检验。它可用于判断序列中是否存在单位根，此外，它还有助于我们理解时间序列是否平稳。ADF\
  \ 检验包含原假设（H0），即时间序列中存在单位根。备择假设用于时间序列的平稳版本。它是迪基-富勒检验的增广版本，最适合用于大型且更复杂的时间序列数据集。\n\n\
  该检验使用一个负数。该数字的负值越大，在某个置信水平下拒绝存在单位根假设的可能性就越高。\n\n![../images/492113_1_En_4_Chapter/492113_1_En_4_Figb_HTML.png](img/492113_1_En_4_Figb_HTML.png)\n\
  \n## 克瓦特科夫斯基-菲利普斯-施密特-辛检验\n\n克瓦特科夫斯基-菲利普斯-施密特-辛检验用于检验原假设，即时间序列围绕一个确定性趋势是平稳的（即趋势平稳），而备择假设是存在单位根。存在单位根不是原假设，而是备择假设，这与\
  \ ADF 检验的形式相反。此外，在 KPSS 检验中，不存在单位根并非平稳性的证据，而是（根据设计）趋势平稳性的证据。这主要用于趋势平稳性检验。*趋势平稳*数据是指没有单位根但呈现趋势的序列。\n\
  \n![../images/492113_1_En_4_Chapter/492113_1_En_4_Figc_HTML.png](img/492113_1_En_4_Figc_HTML.png)\n\
  \n以下是 KPSS 检验的解读：\n\n检验统计量、p 值和临界值是在 1%、2.5%、5% 和 10% 的置信区间下找到的。\n\n![../images/492113_1_En_4_Chapter/492113_1_En_4_Figd_HTML.png](img/492113_1_En_4_Figd_HTML.png)\n\
  \n## 使用平稳数据技术\n\n在上一节中，你学习了如何借助 ADF 检验和 KPSS 检验来解读 p 值；在本节中，让我们看看使数据平稳的各种方法。\n\n\
  ### 差分法\n\n*差分法*（滞后差分）是转换时间序列以稳定均值的过程。我们有几种方法可以识别时间序列，例如折线图，它表示序列随时间的变化。在这些趋势中，可以观察到季节性和随机游走，这是随时间推移而发生的变化，这种行为被认为是非平稳时间序列。明确的规则指出，需要从训练时间序列预测模型的数据中移除趋势和季节性。\n\
  \n以下是进行差分的原因：\n\n*   将非平稳数据转换为平稳时间序列\n\n*   移除季节性趋势\n    *   对季度数据取四阶差分\n\n    *\
  \   对月度数据取 12 阶差分\n\n### 随机游走\n\n随机游走是时间序列呈现不规则增长时的行为。当增长不随时间恒定不变时，预测从一个时期（Y[t]）到下一个时期（Y[t-1]）发生的变化会更好。在不同的时间戳中，从左向右移动，独立于变量的移动会随机地向上或向下迈出一步。所谓的随机游走表明，时间序列的未来步骤或方向可能以随机方式变化（图\
  \ 4-3）。\n\n![../images/492113_1_En_4_Chapter/492113_1_En_4_Fig3_HTML.jpg](img/492113_1_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3\n\n随机游走的一维表示\n\n以下是随机游走的步骤：\n\n1.  从 ***t***[***0***] 开始随机游走。\n\n2.  随机选择下一步移动，***t***[***n-1***]。\n\
  \n3.  重复步骤 2。\n\n\n\n### 一阶差分（趋势差分）\n\n因此，时间序列中两个连续观测值之间的变化可以写成如下形式：\n\n**Y’**[**t**]\
  \ **= Y**[**t**] **- Y**[**t-1**]\n\n当差分后的序列包含白噪声（εt）时，公式可以写成：\n\n**Y**[**t**] **-\
  \ Y**[**t-1**] **=** εt\n\n**Y**[**t**] **= Y**[**t-1**] **+** εt\n\n其中 εt = 白噪声。这被称为*标准随机游走*。\n\
  \n随机游走表示时间序列是非平稳的。这在金融、经济和微观经济学数据中最为常见。随机游走通常具有长期上涨和下跌的趋势，以及不确定和不可预测的变化。图 4-4 展示了股票价格的随机游走行为。\n\
  \n![../images/492113_1_En_4_Chapter/492113_1_En_4_Fig4_HTML.jpg](img/492113_1_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4\n\nInfosys 有限公司股票价格的随机游走行为（来源：Money Control）\n\n例如，我们可以看到 Infosys 有限公司的股票价格在过去六个月中经历了上涨和下跌。这就是随机游走行为。由于随机的涨跌，任何未来的时刻都是不可预测的。\n\
  \n因此，这里很明显，随机时间序列具有非零均值。在这种情况下，最终的公式被称为*带漂移的随机游走*，如下所示：\n\n**Y**[**t**] **= c +\
  \ Y**[**t-1**] **+ ε**[**t**]\n\n其中 c 是两个观测值之间变化的平均值。\n\n*   如果 c 为正，则 *Y*[*t*]\
  \ 的平均变化将上升，并且 Y[t] 将向上移动。\n*   如果 c 为负，则 *Y*[*t*] 的值将向下移动。\n\n**注意：**\n\n*   时间序列中的一阶差分将消除线性趋势（即，差分数=1）。\n\
  *   二阶差分将消除二次趋势（即，差分数=2）。\n*   此外，在时间序列中，以周期为滞后期进行的一阶差分将消除季节性趋势。\n\n### 二阶差分（趋势差分）\n\
  \n当一阶差分未能使数据平稳时，二阶差分是一种用于使一阶差分数据平稳的技术。因此，有必要应用二阶差分来获得平稳序列。\n\n**Y”**[**t**] **=\
  \ Y’**[**t**] **– Y’**[**t-1**]\n\n**= (Y**[**t**] **- Y**[**t-1**]**) – (Y**[**t-1**]\
  \ **- Y**[**t-2**]**)**\n\n**= Y**[**t**] **- 2Y**[**t-1**] **+ Y**[**t-2**]\n\n\
  这就是二阶差分 Y”，它有 t-2 个值。这被称为原始序列中的*双重变化*。\n\n### 季节性差分\n\n*季节性差分*是一个观测值与上一年相应观测值之间的差值。\n\
  \n#### 季节性数据的一阶差分\n\n季节性差分与一阶差分类似，都是计算同一季节的当前观测值与先前观测值之间的差异。它可以写成如下形式：\n\n**Y’**[**t**]\
  \ **= Y**[**t**] **- Y**[**t-s**]\n\n其中 s 是季节数，这被称为*滞后-s* 差分。我们可以在 s 个滞后周期后对观测值进行差分。\n\
  \n如果我们在季节性差分中观察到白噪声，那么模型可以写成：\n\n**Y**[**t**] **= Y**[**t-s**] **+** εt\n\n当我们尝试用这种方法预测值时，它等于该季节的最后一个观测值。该模型给出了季节性朴素预测的结果。\n\
  \n#### 季节性数据的二阶差分\n\n为了将季节性差分与常规差分区分开来，我们有时将平均差分称为*一阶差分*，它表示滞后 1 处的差分。在现实世界中，这通常发生在应用一阶差分之后。时间序列可能无法达到平稳序列的状态，因此在这种情况下，使用二阶差分至关重要，其差分指定为滞后\
  \ 2。它看起来像这样：\n\n**Y”**[**t**] **= Y’**[**t**] **– Y’**[**t-s**]\n\n**= (Y**[**t**]\
  \ **- Y**[**t-s**]**) – (Y**[**t-1**] **- Y**[**t-s-1**]**)**\n\n**= Y**[**t**]\
  \ **- Y**[**t-1**] **- Y**[**t-s**] **+ Y**[**t-s-1**]\n\n当应用常规差分和一阶差分时，与先进行二阶差分没有区别。结果将与一阶差分相同。\n\
  \n## 自回归模型\n\n自回归模型（AR）根据其过去的数据预测未来的行为。它是指数据与时间序列的连续序列以及序列前后的值相关的情况。*自回归模型*仅使用过去的行为数据来预测值。\n\
  \nAR 模型使用过去的值进行预测，如下所示：\n\n**Ŷt = μ + ϕ**[**1**]**Y**[**t-1 +**] **ϕ**[**2**]**Y**[**t-2\
  \ ... +**] **ϕ**[**p**]**Y**[**t-p**] **+ ɛ**[**t**]\n\n其中 ɛ[t] 是白噪声。该模型被称为 AR(p)\
  \ 模型，其中 p 是自回归模型的阶数。AR 模型易于使用，可以处理各种时间序列模型。图 4-5 展示了 AR (1) 和 AR (2) 的行为。\n\n![../images/492113_1_En_4_Chapter/492113_1_En_4_Fig5_HTML.jpg](img/492113_1_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5\n\n自回归 1 和 2 后的图\n\n表 4-1 展示了 AR (1) 模型。\n\n表 4-1\n\nϕ 和 u 值对数据的影响\n\n|\
  \ ϕ 值 | u 值 | 结果 |\n| --- | --- | --- |\n| 0 | - | 白噪声 |\n| 1 | 0 | 等同于随机游走 |\n\
  | 1 | 非 0 | 类似于带漂移的随机游走 |\n| < 0 | - | 围绕均值振荡 |\n\n自回归模型仅限于平稳数据，并且需要一些参数，如下定义：\n\
  \n*   **AR (1) 模型：** -1 < ϕ[1] < 1\n*   **AR (2) 模型：** -1 < ϕ[1] < 1, ϕ[1] + ϕ[2]\
  \ < 1, ϕ[1] - ϕ[2] < 1\n\n## 移动平均\n\n*移动平均*（MA）是一种获取时间序列中所有趋势的方法。它是任何子类别数字的平均值。它用于长期趋势预测。基本上，移动平均通过使用多个过去数据点的平均值来预测未来点。\n\
  \n移动平均模型使用过去的预测误差：\n\nŶt = μ[0]+ εt – ω[1] ε[t-2] - ω[1] ε[t-2 …] ω[q] ε[t-q]\n\n\
  其中 ɛ[t] 是白噪声。该模型被称为 MA(q) 模型，其中 q 是移动平均模型的阶数。MA 模型易于使用，可以处理各种时间序列模型。图 4-6 展示了 MA\
  \ (1) 和 MA (2) 的行为。\n\n![../images/492113_1_En_4_Chapter/492113_1_En_4_Fig6_HTML.jpg](img/492113_1_En_4_Fig6_HTML.jpg)\n\
  \n图 4-6\n\n移动平均 1 和 2 后的图\n\n权重值对时间序列的行为有影响。表 4-2 提供了权重的不同变化及其对模型的影响。\n\n表 4-2\n\
  \nω 值对数据的影响\n\n| ω 值 | 结果 |\n| --- | --- |\n| &#124; ω &#124; > 1 | 权重随着滞后的增加而增加。数据距离越远，对当前误差的影响越大。\
  \ |\n| &#124; ω &#124; = 1 | 权重大小保持不变，远期数据与近期数据具有相同的影响。 |\n| &#124; ω &#124; < 1\
  \ | 最近的数据比更久远的数据具有更高的权重。 |\n| < 0 | 围绕均值振荡。 |\n\n*   以下是 MA (1) 模型： -1 < ω[1] <\
  \ 1\n*   以下是 MA (2) 模型： -1 < ω [1] < 1, ω [1] + ω [2] < 1, ω [1] - ω [2] < 1\n\n\
  \    **注意** 以下是一些你应该理解的定义：\n\n    **ACF：** 变量与其滞后值的相关性。\n\n    **PAC：** 变量与其滞后值的相关性，但去除了中间时间滞后的影响。\n\
  \n    **相关图：** ACF 和 PACF 相对于滞后长度的图。这可以让你了解变量之间自相关的关系。\n\n\n\n## 自相关函数与偏自相关函数\n\n\
  *自相关函数*（ACF）是一种用于确定时间 t 与 t-1 之间线性关系的方法。检查 ACF 后，有助于判断是否需要进行差分。\n\n在回归模型中，数据是独立的，但当数据随时间收集时，这种独立性便不复存在，回归算法也无法捕捉到任何时间趋势。在这种情况下，随机误差与时间呈正相关。因此，每个随机误差都更倾向于与上一个随机误差相似。这种现象被称为*自相关*（或*序列相关*）。\n\
  \n如果我们使用自回归模型 AR(k)，那么我们必须确定 Y[t] 和 Y[t-1] 之间的唯一相关性，并检查时间序列中随机变量之间是否存在直接（线性）影响，这需要对时间序列进行差分和变换。变换时间序列后，我们计算相关性，这被称为*偏自相关函数*（PACF）。图\
  \ 4-7 展示了每个函数的图形。\n\n![../images/492113_1_En_4_Chapter/492113_1_En_4_Fig7_HTML.jpg](img/492113_1_En_4_Fig7_HTML.jpg)\n\
  \n图 4-7\n\nACF 和 PACF 图表示\n\n假设我们有一个时间序列 Y[t]，它表示随时间 t 变化的 Y 度量。自回归模型是指时间序列数据的值对前一个值进行回归。例如，以下是\
  \ Y[t] 对 Y[t-1] 的方程：\n\nY[t] = μ + ϕ[1]Y[t-1] + ɛ\n\n时间序列数据中两个值之间的相关系数称为 ACF。例如，给定时间序列\
  \ Y[t] 的 ACF 如下：\n\n**Corr(Y**[**t,**]**Y**[**t-1**]**), k = 1,2,…**\n\nk 的值是考虑滞后的时间间隔。滞后\
  \ 1 (k=1) 的自相关是彼此相隔一个时间周期的值之间的相关性。\n\n## ARMA 简介\n\nARMA 利用从变量本身获取的信息来预测其趋势，并且该变量对其自身的过去值进行回归（表\
  \ 4-3）。\n\n表 4-3\n\nARMA 估计这些模式\n\n| 模型 | ACF 模式 | PACF 模式 |\n| --- | --- | ---\
  \ |\n| AR(p) | 指数衰减或阻尼正弦波模式或两者兼有 | 在第一个滞后处有显著尖峰 |\n| MA(q) | 在第一个滞后处有显著尖峰 | 指数衰减\
  \ |\n| ARMA (1,1) | 从滞后 1 开始指数衰减 | 从滞后 1 开始指数衰减 |\n| ARMA (p,q) | 指数衰减 | 指数衰减 |\n\
  \n以下是识别数据是否显示 AR 或 MA 特征的步骤：\n\n1.  绘制图表或使用 ADF 检验来检查序列是否平稳。\n\n2.  如果时间序列没有平稳的差分，则检查平稳性。\n\
  \n3.  绘制 ACF 和 PACF 图，并使用表 4-3 确定模型的 p 和 q。\n\nARIMA 包含三个组成部分：自回归部分 (AR)、积分部分 (I)\
  \ 和移动平均部分 (MA)。\n\n### 自回归模型\n\n自回归模型是一个滞后因变量，它包含一个自回归项，该项可能基于习惯解决的基础进行修正。AR 是时间序列\
  \ Y[t] 的一部分，其值取决于先前值的某个线性组合，该组合定义了最大滞后阶数（用 p 表示）。它还包含一个任意误差项 εt，如下所示：\n\n一阶 AR：                           **Ŷ**[**t**]\
  \ **= α + b**[**1**]**Y**[**t-1**]\n\n二阶 AR：              **Ŷ**[**t**]**= α + b**[**1**]**Y**[**t-1**]\
  \ **+ b**[**2**]**Y**[**t-2**]\n\n三阶 AR：            **Ŷ**[**t**]**= α + b**[**1**]**Y**[**t-1**]\
  \ **+ b**[**2**]**Y**[**t-2**] **+ b**[**3**]**Y**[**t-3**]\n\n**y**[**t**] **=\
  \ φ**[**1**]**y**[**t-1**] **+ φ**[**2**]**y**[**t-2**] **+ …… + φ**[**p**]**y**[**t-p**]\
  \ **+ ε**[**t**]\n\n其中参数 φ[t] 是常数。\n\n### 移动平均\n\n时间序列 Y[t] 的 MA 部分，是一个观测值，表示为随机误差和先前任意误差项的某个线性组合，直到一个描述的最大滞后阶数（用\
  \ q 表示）。\n\n一阶 MA(1)：                        **Ŷ**[**t**] **= γ+ d**[**0**]**u**[**t**]\
  \ **+ d**[**1**]**u**[**t-1**]\n\n二阶 MA(2)：             **Ŷ**[**t**] **= γ+ d**[**0**]**u**[**t**]\
  \ **+ d**[**1**]**u**[**t-1**] **+ d**[**2**]**u**[**t-2**]\n\n三阶 MA(3)：            **Ŷ**[**t**]\
  \ **= γ+ d**[**0**]**u**[**t**] **+ d**[**1**]**u**[**t-1**] **+ d**[**2**]**u**[**t-2**]**+\
  \ d**[**3**]**u**[**t-3**]\n\n**y**[**t**] **= Z**[**t**] **+ θ**[**1**]**Z**[**t-1**]\
  \ **+ θ**[**2**]**Z**[**t-2**] **+ …… + θ**[**q**]**Z**[**t-q**]\n\n其中参数 θ[t] 是常数。\n\
  \n**让我们结合 AR 和 MA**\n\n**ARMA (1,1)：               Ŷt = μ + ϕ**[**1**]**Y**[**t-1**]**+\
  \ d**[**0**]**u**[**t**]**+ d**[**1**]**u**[**t-1**]\n\n## 自回归积分移动平均模型简介\n\n自回归积分移动平均模型——也称为\
  \ ARIMA(p,d,q)——是一个预测方程，它可以在需要时通过差分和对数技术使时间序列变得平稳。需要进行差分才能平稳的时间序列是积分 (d) (I) 序列。平稳序列的滞后项被归类为自回归\
  \ (p)，用 (AR) 项表示。预测误差的滞后项被归类为移动平均 (q)，用 (MA) 项表示。\n\n![../images/492113_1_En_4_Chapter/492113_1_En_4_Fige_HTML.jpg](img/492113_1_En_4_Fige_HTML.jpg)\n\
  \n一个非季节性 ARIMA 模型被称为 ARIMA(p,d,q) 模型，其中：\n\n*   **p** 是自回归项的个数。\n\n*   **d** 是为实现平稳性所需的非季节性差分次数。\n\
  \n*   **q** 是预测方程中滞后预测误差的个数。\n\n表 4-4 展示了不同 ARIMA 模型在 p、d 和 q 下的行为。\n\n表 4-4\n\n\
  p、d、q 及其相关方法的表示\n\n|   | p | d | q | 差分 | 方法 |\n| --- | --- | --- | --- | --- |\
  \ --- |\n| ARIMA (0, 0, 0) | 0 | 0 | 0 | y[t] = Y[t] | 白噪声 |\n| ARIMA (0, 1, 0)\
  \ | 0 | 1 | 0 | y[t] = Y[t] - Y[t-1] | 随机游走 |\n| ARIMA (0, 2, 0) | 0 | 2 | 0 | y[t]\
  \ = Yt - 2Yt-1 + Yt-2 | 常数 |\n| ARIMA (1, 0, 0) | 1 | 0 | 0 | Yˆt = μ + ϕ[1]Y[t-1]\
  \ + ɛ | AR(1)：一阶回归模型 |\n| ARIMA (2, 0, 0) | 2 | 0 | 0 | Yˆt = ϕ[0] + ϕ[1]Y[t-1]\
  \ + ϕ[2]Y[t-2] + ɛ | AR(2)：二阶回归模型 |\n| ARIMA (1, 1, 0) | 1 | 1 | 0 | Yˆt = μ + Yt-1\
  \ + ϕ1 (Yt-1 - Yt-2) | 差分一阶自回归模型 |\n| ARIMA (0, 1, 1) | 0 | 1 | 1 | Yˆt = Yt-1 -\
  \ ϕ1et-1 | 简单指数平滑 |\n| ARIMA (0, 0, 1) | 0 | 0 | 1 | Yˆt = μ[0]+ ɛt – ω[1] ɛ[t-1]\
  \ | MA(1)：一阶回归模型 |\n| ARIMA (0, 0, 2) | 0 | 0 | 2 | Yˆt = μ[0]+ ɛt – ω[1] ɛ[t-1]\
  \ – ω[2] ɛ[t-2] | MA(2)：二阶回归模型 |\n| ARIMA (1, 0, 1) | 1 | 0 | 1 | Yˆt = ϕ[0] + ϕ[1]Y[t-1]+\
  \ ɛt – ω[1] ɛ[t-1] | ARMA 模型 |\n| ARIMA (1, 1, 1) | 1 | 1 | 1 | ΔY[t] = ϕ[1]Y[t-1]\
  \ + ɛt - ω[1] ɛ[t-1] | ARIMA 模型 |\n| ARIMA (1, 1, 2) | 1 | 1 | 2 | Yˆ[t] = Y[t-1]\
  \ + ϕ[1] (Y[t-1] - Y[t-2] ) - θ[1]e[t-1] - θ[1]e[t-1] | 阻尼趋势线性指数平滑 |\n| ARIMA (0,\
  \ 2, 1) 或 (0,2,2) | 0 | 2 | 1 或 2 | Yˆ[t] = 2 Y[t-1] - Y[t-2] - θ[1]e[t-1] - θ[2]e[t-2]\
  \ | 线性指数平滑 |\n\nARIMA 是用于预测单变量变量的几种方法之一，它利用从变量本身获取的信息来预测其趋势。变量对其自身的过去值进行回归。\n\n\
  AR(p) 中 p 等于自相关的阶数（表示过去观测值的加权移动平均）z I(d)，其中 d 是积分（差分）的阶数，表示线性趋势或多项式趋势 z。\n\nMA(q)\
  \ 中 q 等于移动平均的阶数（表示过去误差的加权移动平均）。\n\nARIMA 由两个模型组成：AR 和 MA。\n\n\n\n### 整合（I）\n\n时间序列数据通常是非平稳的，为了使时间序列平稳，需要对序列进行差分。这个过程被称为*整合*部分（I），差分的阶数用\
  \ d 表示。差分会消除随时间变化的信号，这些信号包含趋势和季节性，因此该序列只包含噪声和不规则成分，这些成分将被单独建模。\n\n表 4-5 展示了如何用代数方式表示\
  \ d(I)。\n\n表 4-5\n\nd(I) 值的解释\n\n| 积分 d 值 | 公式(y[t]) |\n| --- | --- |\n| d = 0 |\
  \ **Y**[**t**] |\n| d = 1 | **Y**[**t**] **- Y**[**t-1**] |\n| d = 2 | **Y**[**t**]\
  \ **- 2Y**[**t-1**] **+ Y**[**t-2**] |\n\n### ARIMA 实战\n\n在上一节中，你了解了 AR 和 MA，以及\
  \ AR、I 和 MA 的解释。现在让我们在一个时间序列数据集上实现它。\n\n导入所需的库并加载 CSV 数据，这是 2014 年至 2019 年的 Facebook\
