  在上一章中，你学习了如何执行单变量时间序列预测。在本章中，你将了解单步和水平式时间序列预测的数据准备，并解决一些多变量时间序列问题。多变量时间序列是一种多个变量都依赖于时间的方法，我们利用这些变量来尝试估计一个目标变量。




