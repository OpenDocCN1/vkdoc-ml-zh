  \n## VARMA 简介\n\nVARMA 模型是 ARMA 模型在多元时间序列模型上的另一个扩展，它包含向量自回归（VAR）分量和向量移动平均（VMA）分量。VARMA\
  \ 是 ARMA 针对多个并行时间序列的归纳版本。该模型的 ARMA 表示法包含各自阶数的 AR(p)和 MA(q)模型，这些模型是 VARMA 模型的参数。例如，VARMA(p,\
  \ q)就是一个例子。VARMA 模型能够发展出 VAR 或 VMA 模型。该方法适用于去除趋势和季节分量后的多元时间序列数据。\n\n以下是包含两个时间序列数据集（Y[1]和\
  \ Y[2]）的 VAR(1)和 VMA(1)模型：\n\n**Ŷ**[**1,t**] **= μ**[**1**] **+ ϕ**[**11**]**Y**[**1,****t-1**]**+\
  \ d**[**1,****0**]**u**[**1,****t**]**+ d**[**11**]**u**[**1,t-1**]\n\n**Ŷ**[**2,t**]\
  \ **= μ**[**2**] **+ ϕ**[**21**]**Y**[**2,****t-1**]**+ d**[**2,****0**]**u**[**1,****t**]**+\
  \ d**[**22**]**u**[**2,t-1**]\n\n其中，y[1,t-1,] y[2,t-1] 是时间序列 Y[1]和 Y[2]的一阶滞后项。\n\
  \nVARMA 模型在设计模型时遵循与单变量时间序列相同的规则。它使用相应的评估矩阵，如 AIC、BIC、FPE 和 HQIC。\n\n\n\n### VARMA\
  \ 实战\n\n在上一节中，你了解了 VARMA 背后的高级数学原理。现在，让我们在一个时间序列数据集上实现它。\n\n```\nimport pandas as\
  \ pd\nimport matplotlib.pyplot as plt\nfrom statsmodels.tsa.statespace.varmax import\
  \ VARMAX\nimport numpy as np\nfrom statsmodels.tsa.stattools import adfuller\nfrom\
  \ sklearn import metrics\nfrom timeit import default_timer as timer\nimport warnings\n\
  warnings.filterwarnings(\"ignore\")\ndf = pd.read_csv(r'Data\\Dow_Jones_Industrial_Average.csv',\
  \ parse_dates= True)\ndf = df[(df['Date'] > '2016-01-14') & (df['Date'] <= '2017-01-30')]\n\
  ```\n\n让我们先快速浏览一下数据。\n\n```\ndf.head(10)\n```\n\n![../images/492113_1_En_4_Chapter/492113_1_En_4_Figcf_HTML.jpg](img/492113_1_En_4_Figcf_HTML.jpg)\n\
  \n定义一个时间序列评估函数，如下所示：\n\n```\ndef timeseries_evaluation_metrics_func(y_true, y_pred):\n\
  def mean_absolute_percentage_error(y_true, y_pred):\ny_true, y_pred = np.array(y_true),\
  \ np.array(y_pred)\nreturn np.mean(np.abs((y_true - y_pred) / y_true)) * 100\nprint('Evaluation\
  \ metric results:-')\nprint(f'MSE is : {metrics.mean_squared_error(y_true, y_pred)}')\n\
  print(f'MAE is : {metrics.mean_absolute_error(y_true, y_pred)}')\nprint(f'RMSE is\
  \ : {np.sqrt(metrics.mean_squared_error(y_true, y_pred))}')\nprint(f'MAPE is : {mean_absolute_percentage_error(y_true,\
  \ y_pred)}')\nprint(f'R2 is : {metrics.r2_score(y_true, y_pred)}',end='\\n\\n')\n\
  ```\n\n以下是用于检查数据平稳性的 ADF 检验函数，如下所示：\n\n```\ndef Augmented_Dickey_Fuller_Test_func(series\
  \ , column_name):\nprint (f'Results of Dickey-Fuller Test for column: {column_name}')\n\
  dftest = adfuller(series, autolag='AIC')\ndfoutput = pd.Series(dftest[0:4], index=['Test\
  \ Statistic','p-value','No Lags Used','Number of Observations Used'])\nfor key,value\
  \ in dftest[4].items():\ndfoutput['Critical Value (%s)'%key] = value\nprint (dfoutput)\n\
  if dftest[1] \")\nprint(\"Reject the null hypothesis\")\nprint(\"Data is stationary\"\
  )\nelse:\nprint(\"Conclusion:====>\")\nprint(\"Fail to reject the null hypothesis\"\
  )\nprint(\"Data is non-stationary\")\n```\n\n检查变量是否平稳，如下所示：\n\n```\nfor name, column\
  \ in df[['Open', 'High', 'Low', 'Close']].iteritems():\nAugmented_Dickey_Fuller_Test_func(df[name],name)\n\
  print('\\n')\n```\n\n![../images/492113_1_En_4_Chapter/492113_1_En_4_Figcg_HTML.jpg](img/492113_1_En_4_Figcg_HTML.jpg)\n\
