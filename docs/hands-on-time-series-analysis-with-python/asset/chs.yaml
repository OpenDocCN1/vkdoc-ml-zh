  ## 连接（合并）


  在 Pandas、Python 以及 SQL 和 R 等其他语言中，术语 *join* 和 *merge* 含义相同。实际上，它们的基本操作是等效的，但执行操作的方式不同。Pandas
  中的 *join* 利用索引来合并两个数据源，而 *merge* 则寻找重叠的列进行合并。在 Pandas 中，使用 `merge()` 和 `join()`
  函数。在 SQL 中，`MERGE` 和 `JOIN` 运算符执行与 Pandas 中相同的操作。此示例说明了 Pandas 和 Pandasql 中的聚合操作。


  我们创建了示例员工表和部门表来说明连接示例。


