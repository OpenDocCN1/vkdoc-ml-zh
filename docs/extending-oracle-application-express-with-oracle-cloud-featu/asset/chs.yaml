  \ 并将函数名放在引号 \"\" 中：\n\n%python\n\nimport oml\n\noml.script.drop(\"nn_predict\")\n\
  \n如果您想查看数据库中的 UDF，可以使用 SQL 查询数据库视图 `ALL_PYQ_SCRIPTS`。\n\n**从 APEX 使用 OML REST 服务**\n\
  \n在 APEX 中，您可以通过其 PL/SQL 包使用 OML4SQL，并通过 OML4Py 嵌入式 Python 执行 (EPE) SQL API 使用 OML4Py。要从\
  \ SQL 调用 Python UDF，您可以在 SQL 查询中包含 OML4Py EPE 函数。这些函数包括\n\n\n\n与嵌入式 Python REST\
  \ API 功能相似的函数包括：`pyqEval`、`pyqTableEval`、`pyqRowEval`、\n`pyqGroupEval` 和 `pyqIndexEval`。\n\
  \n您也可以使用 REST API。即使 APEX 与机器学习对象位于不同的数据库中，此方法也同样适用。\n\n第一步是进行身份验证以获取授权令牌。OML REST\n\
  服务使用 OAuth 2.0 密码授权流程，而 APEX 仅支持客户端凭证流程。\n密码授权流程意味着访问令牌会与用户名和密码一同提供，并附加到用户的权限上。为\
  \ OML REST API 创建一个专用用户可能很有用，该用户仅拥有使用该服务所需的有限权限。\n而客户端凭证流程则使用服务器到服务器的身份验证。\n\nWeb\
  \ 凭证是在 APEX 中处理凭证的最佳方式。由于 APEX Web\n凭证仅允许客户端凭证 OAuth 2.0 令牌，而不允许密码令牌，因此您无法直接创建用于获取令牌的\
  \ Web 凭证。对此有几种技术解决方案。让我们来看一种可能的方案。\n\n在此方案中，我们为令牌创建一个 Web 凭证，但使用 REST 数据\n服务来获取该令牌。首先，为令牌创建\
  \ Web 凭证。转到 App Builder，选择 Workspace Utilities，然后选择 Web Credentials。此 Web 凭证\n不会调用服务并获取令牌；它仅存储令牌，而令牌是通过稍后解释的另一种机制获取后存入的。所需的简单\
  \ Web 凭证如图 6-1 所示。只需为凭证命名，并选择 HTTP Header 作为 Authentication Type。\n\n***图 6-1.**\
  \ 创建 Web 凭证*\n\n然后，我们创建一个用于获取 OAuth2 令牌的数据源。选择应用程序，然后选择 *Shared Components*。导航到左下角并点击\
  \ *REST*\n*Data Sources*。点击 *Create*。选择 *From scratch*，然后点击 *Next*。选择 *Simple HTTP*\
  \ 作为 REST Data Source Type，定义一个 *名称*，并将 *<oml-cloud-service-location-url>/omluser/*\
  \ 作为 *URL Endpoint* 插入。点击 *Next*。现在，您已经定义了远程服务器 214\n\n![](img/index-226_1.jpg)\n\
  \n第 6 章 Oracle 机器学习 REST 服务\n\n包括远程服务器、基础 URL 和服务 URL 路径。点击 *Next*。对于分页类型，保留默认值：*No\
  \ Pagination*，然后点击 *Next*。**不要**启用 *Authentication Required*。点击 *Advanced*。添加所有必需的参数，如图\
  \ 6-2 所示。\n\n首先，为请求消息添加 HTTP 标头参数：Content-Type\n= application/json，以及 Accept = application/json。然后，选择\
  \ POST 作为 HTTP\n方法。在请求体中，插入密码流程所需的信息。\n\n{\n  \"grant_type\" : \"password\",\n \
  \ \"username\" : \" **您的用户名**\",\n  \"password\" : \" **您的密码**\"\n}\n\n将您的用户名和密码分别插入到\
  \ YourUsername 和 YourPassword 处。然后，\n通过选择页面中 Response Sample 字段的 Choose File 并插入文件来定义响应消息。您可以在\
  \ Oracle 文档的 REST\nAPI 端点部分找到该文件。\n\n***图 6-2.** REST 数据服务的参数*\n\n![](img/index-227_1.jpg)\n\
  \n第 6 章 Oracle 机器学习 REST 服务\n\n然后点击 *Discover*。如果成功获取到令牌，如图 6-3 所示，点击 *Create REST\
  \ Data Source*。\n\n***图 6-3.** REST 数据服务返回一个令牌*\n\n现在，我们已经构建了一个用于获取令牌的 REST 数据源和一个用于保存令牌的\
  \ Web 凭证。\n\n然后，我们需要一个过程（`set_omldb_amst_token_to_header`）来从数据源获取令牌并将其存入 Web 凭证，同时将该令牌设置为给定\
  \ Web 凭证的会话令牌。该令牌仅对调用它的 APEX\n会话有效。该过程会获取令牌，并且令牌会附带其过期时间。\n\n-- set_omldb_amst_token_to_header\
  \ 使用 apex_exec 和\n-- 在 APEX 中定义的 REST 数据源，例如 OMLDB_AMST_TOKEN\n\n\n\nprocedure set_omldb_amst_token_to_header(\n\
  \np_token_source in varchar2,\n\np_credential in varchar2,\n\np_token_expiry_epoch\
  \ out number) is\n\n--\n\nl_columns apex_exec.t_columns;\n\nl_context apex_exec.t_context;\n\
  \n第 6 章 Oracle 机器学习 REST 服务\n\ntype t_column_position is table of pls_integer index\
  \ by\n\nvarchar2(32767);\n\nl_column_position t_column_position;\n\nbegin\n\n--\n\
  \n-- 指定要从 Web 源模块中选择的列\n\napex_exec.add_column(p_columns => l_columns, p_column_name\
  \ =>\n\n'ACCESSTOKEN');\n\napex_exec.add_column(p_columns => l_columns, p_column_name\
  \ =>\n\n'EXPIRESIN');\n\napex_exec.add_column(p_columns => l_columns, p_column_name\
  \ =>\n\n'TOKENTYPE');\n\n--\n\n-- 调用 Web 源模块并选择数据\n\nl_context := apex_exec.open_rest_source_query(\n\
  \np_static_id => p_token_source,\n\np_columns => l_columns );\n\n--\n\n-- 现在获取所选列的结果集位置\n\
  \nl_column_position('ACCESSTOKEN') := apex_exec.get_column_position\n\n(l_context,\
  \ 'ACCESSTOKEN');\n\nl_column_position('EXPIRESIN') := apex_exec.get_column_position\n\
  \n(l_context, 'EXPIRESIN');\n\nl_column_position('TOKENTYPE') := apex_exec.get_column_position\n\
  \n(l_context, 'TOKENTYPE');\n\n--\n\n-- 遍历结果集（本例中仅有一行），将令牌设置为会话凭据，并将令牌过期时间设置为纪元时间\n\
  \nwhile apex_exec.next_row( l_context ) loop\n\napex_credential.set_session_credentials\
  \ (\n\np_credential_static_id => p_credential,\n\np_key => 'Authorization',\n\n\
  p_value => 'Bearer ' ||apex_exec.get_varchar2\n\n(l_context, l_column_position\n\
  \n('ACCESSTOKEN')));\n\n第 6 章 Oracle 机器学习 REST 服务\n\np_token_expiry_epoch := convert_to_epoch(sysdate)\
  \ + apex_exec.get_\n\nnumber( l_context, l_column_position('EXPIRESIN'));\n\nend\
  \ loop;\n\n--\n\n-- 最后：释放所有资源\n\napex_exec.close( l_context );\n\nexception\n\n\
  when others then\n\n-- 重要：当发生异常时，也要释放所有资源！\n\napex_exec.close( l_context );\n\n\
  raise;\n\nend set_omldb_amst_token_to_header;\n\n函数 `convert_to_epoch` 将给定的日期转换为纪元时间。纪元时间用于处理令牌过期。令牌的有效期为一小时。\n\
  \n-- convert_to_epoch 将给定的日期转换为纪元时间，即从 1970 年 1 月 1 日开始的秒数\n\nfunction convert_to_epoch(p_date\
  \ in date) return number is\n\nl_epoch number(38);\n\nbegin\n\nselect (p_date -\
  \ to_date('1-1-1970 00:00:00','MM-DD-YYYY\n\nHH24:Mi:SS'))*24*3600 into l_epoch\
  \ from dual;\n\nreturn l_epoch;\n\nend convert_to_epoch;\n\n对于过期时间，我们需要一个应用程序项。在\
