  **网络安全组**


  OCI 现在为管理员提供了两种添加安全规则来管理对网络资源访问的方法。所有子网都应该已经定义并关联了一个安全列表。创建安全列表时，它将是空的，因此，无论来源如何，到每个组件的所有流量都将被阻止。


  第 1 章 为 APEX 构建安全基础设施


  有两种类型的安全规则，一种用于管理入站流量，另一种用于管理出站流量。两者都需要类似类型的信息。


  • **源/目标类型**: 这可以是 CIDR、服务或


  网络服务组。大多数规则依赖于 CIDR。


  • **源/目标 CIDR**: 源或目标的 IPv4 地址。


  • **IP 协议**: OCI 控制台提供支持的协议列表


  (All、TCP、UDP 和 ICMP) 和预定义的服务。


  • **源端口范围**: 输入要过滤的入站端口号。在


  大多数情况下，此字段留空，因此规则将接受来自任何端口的流量。


  • **目标端口范围**: 允许流量流向目标的端口号。与源端口范围一样，如果留空，则允许所有流量。或者，指定单个端口号、范围或用逗号分隔的多个端口。图 1-4
  中的示例显示了一个入站规则，允许传入流量到标准 HTTP/HTTPS 端口。


