  选择*生成 API 密钥* *对*。点击*下载私钥*。您刚刚下载的文件是 .pem 类型，内容类似于：\n\n-----BEGIN PRIVATE KEY-----\n\
  \nMIIEvAIBADANBgkqhkiG9w0BAQEFAASCBKYwggSiAgEAAoIBAQCv2FWr73tHBsrA\n\nVhqKE/WfOrzE6WzaYDzgAycr2SGOa3bQrkXx31uo0O9Rk2GHy71Zl+SzwF0Qz3Bh\n\
