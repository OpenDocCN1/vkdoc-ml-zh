  **资源主体**


  如本章前面所述，通过 REST API 访问 OCI 资源需要开发人员生成必要的 API 密钥对，配置环境，然后对所有 HTTP 请求进行签名。OCI SDK
  简化了 HTTP 请求签名。在演示代码中，您可能已经观察到了这个函数调用：


  const authenticationProvider =


  common.ConfigFileAuthenticationDetailsProvider(


  ''~/.oci/config'',


  PROFILE_NAME


  );


  这将创建一个身份验证提供程序，随后用于创建基于资源的客户端以执行所需的操作。ConfigFileAuthenticationDetailsProvider 是一个基于文件的身份验证提供程序，它使用本地机器上的
  API 密钥对和配置。要使用此身份验证提供程序，必须创建一个自定义 Docker 镜像，其中嵌入了所需的 API 密钥对和配置文件。这并不理想。


  幸运的是，OCI 有替代的身份验证方法，这些方法依赖于 *动态组* 和 IAM 策略。开发人员可以使用 *实例主体身份验证* 或 *资源主体身份验证*，具体取决于代码运行的环境。对于无服务器，我们将使用后者。


