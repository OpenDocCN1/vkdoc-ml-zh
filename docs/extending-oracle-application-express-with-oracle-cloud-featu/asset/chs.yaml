  \n**总结**\n\n人工智能和机器学习的目标是创建能够模仿人类行为的计算机系统和机器人。人类大脑作为我们决策过程的核心，高度依赖于包括视觉在内的五种感官。数字捕获设备的普及、更便宜高效的数据存储以及更强大的计算机处理能力，推动了计算机视觉技术的进步。如今，OCI\
  \ 通过其 AI 服务产品（包括视觉）提供“AI 即服务”。这使得 APEX 开发者能够更轻松地集成涉及图像/物体识别、文本提取和文档分类功能的解决方案。本章介绍的示例应用程序只是\
  \ AI 可以应用的一个领域，希望它能激发您创建更智能的 Web 应用程序。\n\n**第 11 章**\n\n**电子邮件投递服务**\n\n*电子邮件*可以说是互联网上最古老、使用最广泛的应用程序之一，也是不可或缺的通信工具。它最初由计算机程序员雷·汤姆林森在\
  \ 20 世纪 70 年代为高级研究计划局网络（ARPANET）实现。电子邮件依赖于客户端应用程序和一组服务器网络，这些服务器使用简单邮件传输协议（SMTP）来接受、转发、投递和存储消息。\n\
  \n虽然电子邮件旨在提供人与人之间的多方对话，但软件应用程序也常使用它来发送通知、信息等。编程语言和框架实现了与电子邮件服务器通信的 API，代表应用程序使用\
  \ SMTP。在*Oracle Application Express*（APEX）应用程序中，*APEX_MAIL* 是一个 *PL/SQL* API，它封装了*Oracle\
  \ 数据库*中的 *UTL_SMTP* 包。然而，应用程序依赖于对电子邮件服务器或服务的访问来中继消息。\n\n要从应用程序发送电子邮件，我们可以使用托管服务或配置自管理的\
  \ SMTP 服务器。如今，公司依赖\n\n\n\n在第三方云服务（如 *Microsoft 365*）上处理电子邮件。*Oracle Cloud Infrastructure*\
  \ (OCI) 也提供了一项名为 *Email Delivery* 的托管服务。该服务不包含在 *Oracle Cloud Free Tier* 免费套餐中，用户需要升级到付费账户才能使用。\n\
  \n在本章中，我们将逐步介绍为使用 Email Delivery 服务准备 OCI 租户所需的步骤。完成这些资源的配置后，我们将配置一个 APEX 实例，使其能够使用\
  \ OCI 的 SMTP 端点，通过 `APEX_MAIL` 包发送电子邮件。我们还将探讨可能影响电子邮件送达率的各种问题、可以采取哪些措施来确保邮件成功发送，以及在遇到困难时可以使用哪些工具。\n\
  \n© Adrian Png 和 Heli Helskyaho 2022\n\nA. Png 和 H. Helskyaho，《使用 Oracle Cloud 功能扩展\
  \ Oracle Application Express》，\n\n[`doi.org/10.1007/978-1-4842-8170-3_11`](https://doi.org/10.1007/978-1-4842-8170-3_11#DOI)\n\
  \n第 11 章 电子邮件递送服务\n\n**设置 OCI 资源**\n\nEmail Delivery 服务在大多数（如果不是全部）OCI 区域都提供了一个\
  \ SMTP 服务器，用于发送电子邮件。虽然该服务需要用户身份验证才能访问，但对客户端连接没有网络限制。不过，还有额外的保护层以防止滥用。创建并配置所需的 OCI\
  \ 资源，这些资源共同有助于保护服务安全并提高电子邮件的送达率。\n\n**身份与访问管理**\n\n安全是所有 OCI 操作的核心，因此，与所有其他 OCI\
  \ 服务一样，Email Delivery 要求创建并配置必要的 *Identity and Access Management* (IAM) 资源和策略。建议为应用程序创建一个单独的\
  \ IAM 用户，以便*通过*该服务发送电子邮件。首先创建一个 IAM 组，IAM 策略将使用该组来分配必要的权限。\n\n1.  通过点击导航菜单，然后点击\
  \ *Identity & Security*，接着点击 *Groups*，导航到“组”概览页面。\n2.  点击 *Create Group*。\n3.  输入一个合适的名称，例如\
  \ *EmailDeliveryAgents*，并提供其用途的简短描述（图 11-1）。\n4.  点击 *Create* 创建所需的组。\n\n![](img/index-379_1.jpg)\n\
  \n第 11 章 电子邮件递送服务\n\n***图 11-1.** 创建一个 IAM 组*\n\n下一个任务是创建一个 IAM 策略，并为该组添加使用 Email\
  \ Delivery 服务资源所需的语句。\n\n1.  通过点击导航菜单，然后点击 *Identity & Security*，接着点击 *Policies*，导航到“策略”概览页面。或者，如果您在“组”概览页面上，只需点击页面左侧菜单中的\
  \ *Policies* 链接即可。\n2.  进入“策略”概览页面后，选择要创建此策略的 compartment。我们将在租户中创建它，因此请选择页面左侧 *List\
  \ Scope* 部分下的根 compartment。\n3.  点击 *Create Policy*。\n\n![](img/index-380_1.jpg)\n\
  \n第 11 章 电子邮件递送服务\n\n4.  输入所需的策略名称和描述。确保该策略是在租户中创建的，然后切换 *Policy Builder* 以显示手动编辑器（图\
  \ 11-2）。\n\n***图 11-2.** 创建策略并使用手动编辑器添加所需语句*\n\n**注意**：策略构建器只有用于创建语句的模板，以允许一个组管理相关的\
  \ OCI 资源（图 11-3），而对于仅通过该服务发送电子邮件来说，通常不需要这些模板。\n\n![](img/index-381_1.jpg)\n\n第 11\
  \ 章 电子邮件递送服务\n\n使用以下语法输入策略语句：\n\nAllow group <组名> to use email-family in compartment\
  \ <compartment 名称>\n\n例如：\n\nAllow group EmailDeliveryAgents to use email-family\
  \ in compartment adrian\n\n***图 11-3.** 用于生成管理相关 OCI 资源语句的策略模板*\n\n\n\n接下来，我们将创建\
  \ IAM 用户 *emailagent*，然后将其分配到组\n\n*EmailDeliveryAgents*，从而授予其使用该服务所需的权限：1\\. 通过点击导航菜单导航至策略概览页面，然后依次点击\
  \ *身份与安全* 和 *用户*。\n\n或者，如果你仍在组或策略概览页面，只需点击页面左侧菜单中的 *用户* 链接。\n\n2\\. 点击\n\n*创建用户*。\n\
  \n![](img/index-382_1.jpg)\n\n第 11 章 电子邮件投递服务\n\n3\\. 选择用户类型 *IAM 用户*。\n\n4\\. 输入合适的用户名和描述，但将电子邮件字段留空，因为该用户不需要这些信息（图\
  \ 11-4）。\n\n5\\. 点击\n\n*创建* 以创建用户。\n\n***图 11-4.** 使用所需信息创建 IAM 用户*\n\n用户创建完成后，你将返回用户的详细信息页面。在那里，你可以找到多个可对该用户执行的管理操作。根据最小权限原则，我们应限制此\
  \ IAM 用户在 OCI 租户中的操作范围。\n\n1\\. 点击\n\n*编辑用户能力*。\n\n2\\. 默认情况下，新创建的用户会启用所有能力。通过取消选中所有其他选项，将其限制为仅\
  \ *SMTP 凭证*（图 11-5）。\n\n3\\. 点击\n\n*保存更改*。\n\n![](img/index-383_1.jpg)\n\n第 11 章\
  \ 电子邮件投递服务\n\n***图 11-5.** 遵循最小权限原则，移除使用电子邮件投递服务所不需要的用户能力*\n\n此时，IAM 用户只能创建 *SMTP\
  \ 凭证*。但是，由于该用户没有 *本地密码* 能力，你无法以该用户身份登录 OCI 控制台来生成用户名和密码对。请改用你的管理用户来执行此操作。\n\n1\\\
  . 在用户的详细信息页面上，向下滚动，在 *资源* 下，点击\n\n链接 *SMTP 凭证*。\n\n2\\. 点击\n\n*生成 SMTP 凭证*。\n\n\
  3\\. 输入一个有助于你回忆凭证用途和/或使用位置的描述（图 11-6）。\n\n4\\. 点击 *生成 SMTP 凭证* 以生成凭证。\n\n![](img/index-384_1.jpg)\n\
  \n第 11 章 电子邮件投递服务\n\n***图 11-6.** 生成 SMTP 凭证并提供有用的描述*\n\n**注意** 创建 SMTP 凭证后，会弹出一个模态框，显示用户名和密码（图\
  \ 11-7）。这些是你将用于连接 OCI 电子邮件投递服务 SMTP 服务器的凭据。密码**仅显示一次**，请立即安全保存。如果丢失密码，请生成一组新的凭证。\n\
  \n![](img/index-385_1.jpg)\n\n第 11 章 电子邮件投递服务\n\n***图 11-7.** SMTP 凭证的密码仅显示一次。请安全存储！*\n\
  \n最后一步是将用户分配到相关组（图 11-8）：1\\. 在用户的详细信息页面上，向下滚动，在 *资源* 下，点击\n\n链接 *组*。\n\n2\\. 点击\n\
  \n*将用户添加到组*。\n\n3\\. 选择 IAM 组 *EmailDeliveryAgents*。\n\n4\\. 点击\n\n*添加* 以将用户分配到该组。\n\
  \n![](img/index-386_1.jpg)\n\n第 11 章 电子邮件投递服务\n\n***图 11-8.** 将 IAM 用户分配到适当的组*\n\
  \n至此，为使用电子邮件投递服务而进行的 IAM 资源配置已完成。\n\n**区域、可用性和服务器信息**\n\n虽然 OCI IAM 资源是全局性的，但与电子邮件投递服务相关的资源则不是。这些资源包括：\n\
  \n• SMTP 服务器\n\n• 电子邮件域\n\n• 已批准的发送者\n\n• 抑制列表\n\n在选择托管 OCI 资源的区域时，请务必验证该区域是否拥有所有必需的服务。使用此网站上的矩阵（[www.oracle.com/cloud/data-regions/](http://www.oracle.com/cloud/data-regions/)）来指导你的区域选择。在撰写本文时，所有\
  \ OCI 数据区域似乎都支持电子邮件投递服务。\n\n\n\n![](img/index-387_1.png)\n\n"
- '# 第 11 章 电子邮件投递服务


  要获取 SMTP 服务器信息，首先选择所需区域。然后，打开导航菜单并点击**开发者服务**。在**应用程序集成**下，点击**电子邮件投递**。您应被重定向到配置页面；如果没有，请点击页面左侧**电子邮件投递**部分下同名的链接。


  例如，美国凤凰城区域的信息如图 11-9 所示。


  ***图 11-9.** 美国凤凰城区域的 SMTP 服务器信息*


  通常，这些服务器的*完全限定域名*（FQDN）遵循以下格式：


  smtp.email.<区域标识符>.oci.oraclecloud.com


  区域标识符可从以下列表获取：[`bit.ly/oci-docs-regions`](https://bit.ly/oci-docs-regions)。


  **电子邮件域**


  电子邮件域是该服务在 2021 年下半年引入的一项较新功能。其功能之一允许租户创建*域名密钥识别邮件*（DKIM）签名，这是一种电子邮件安全标准，允许接收客户端验证电子邮件是否来自特定域并已获得其所有者授权。DKIM
  在确保电子邮件可投递性方面发挥作用，我们将在本章后面讨论。


  在此功能发布之前，OCI 租户必须提交 Oracle 支持*技术服务请求*（SR），才能为域生成 DKIM 签名。


  在生成 DKIM 签名之前，必须先创建一个电子邮件域（图 11-10）：


  ![](img/index-388_1.jpg)


  '
- '# 第 11 章 电子邮件投递服务


  1.  打开 OCI 控制台左上角的导航菜单，然后点击**开发者服务**。

  2.  在**应用程序集成**下，点击**电子邮件投递**进入概览/配置页面。

  3.  在页面左侧的**电子邮件投递**下，点击**电子邮件域**。

  4.  点击**创建电子邮件域**。

  5.  输入您希望添加的域名，并选择资源所在的所需区间。


  ***图 11-10.** 将您喜欢的域添加到电子邮件投递服务*


  创建电子邮件域后，您将立即被重定向到该域的详细信息页面（图 11-11）。请注意，*DKIM 签名*和*SPF 已配置*属性旁边都有一个警告图标。在本节结束时，这些图标将变为绿色对勾。


  ![](img/index-389_1.png)


  '
- '# 第 11 章 电子邮件投递服务


  ***图 11-11.** 电子邮件域详细信息页面*


  要生成 DKIM 签名：


  1.  点击**添加 DKIM**。

  2.  输入 DKIM 选择器（图 11-12）。这可以是任何值，但与域连接后，必须在全局范围内唯一。其长度不得超过 63 个字符，可以是任何小写字母数字字符或短划线。Oracle
  建议使用以下格式：<前缀>-<区域键>-<日期>。其中，前缀可以是类似“email”的任意内容，区域键是创建域所在区域的三字母缩写（参见 [`bit.ly/oci-docs-regions`](https://bit.ly/oci-docs-regions)），日期则采用合适的格式，例如
  202201。


  ![](img/index-390_1.jpg)


  '
- '# 第 11 章 电子邮件投递服务


  ***图 11-12.** 输入有效的 DKIM 选择器*


  3.  点击**生成 DKIM 记录**。

  4.  这将生成两个值：*CNAME 记录*和*CNAME 值*（图 11-13）。这些值将用于创建所需的 DNS 记录。

  5.  点击**创建 DKIM** 以完成该过程。


