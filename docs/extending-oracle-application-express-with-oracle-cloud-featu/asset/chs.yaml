  *Oracle Application Express* (APEX) 是一个出色的软件开发堆栈，允许开发人员专注于实现关键业务逻辑，并简单地使用预制组件来实现核心应用程序功能，例如身份验证和与数据库交互。就像
  *Lego*® *Technic*™ ([`lego.com/themes/technic`](http://lego.com/themes/technic))
  产品系列（我是其忠实粉丝）一样，这些构建套件包含各种功能部件，例如齿轮、电机和/或气动泵。这些允许初出茅庐的工程师快速构建有用的车辆或机器。但是，有时可能会出现一个功能需求，但没有可用的标准模块来满足它，例如，创建一个水果分拣传送带系统，该系统需要一个摄像头和一个能够识别水果并将其引导到特定篮子的嵌入式微控制器。今天，我们可以很容易地找到像
  *Espressif Systems* ([www.espressif.com/](http://www.espressif.com/)) 开发的 *ESP32*
  这样的嵌入式微控制器，它们集成了一个小型摄像头，并具有多个 GPIO（通用输入/输出）引脚，然后可以控制兼容 Lego® 的电机。GPIO 引脚是在积木生态系统内集成外部系统的关键。


  *Oracle 云基础设施* (OCI) 提供了许多有趣的 *云原生* 服务，可以进一步扩展 APEX 应用程序，超越仅使用 PL/SQL 所能实现的功能。这些服务提供专门的功能，可按需通过网络使用，并且通常很少或不需要管理底层基础设施。此类服务的示例包括
  *Functions*、*Event Service* 和 *API Management*。


  *OCI 对象存储* 是另一个有用的功能，可用于补充 APEX 应用程序，用于存储开发人员原本会作为 BLOB 列存储在 Oracle 数据库中的大文件。在本章中，我们将逐步介绍这些概念，并学习如何扩展使用
  OCI 提供的这些组件的 APEX 应用程序，以解决更复杂的需求。


