  **故障排除和日志记录**


  如果您没有看到缩略图图像出现在目标桶中，该怎么办？首先，请记住，如果这是第一次调用无服务器函数，服务可能需要一段时间来创建和启动新容器，因此请稍等片刻。如果仍然没有出现，那么让我们看看如何排除故障和调试问题。


  每个开发人员的工具箱中都应包含一个工具，用于记录代码执行时发生的情况。OCI 为其资源（包括 Oracle Functions）提供了广泛的日志记录支持。要启用日志记录，请返回应用程序的详细信息页面。在页面左侧，单击
  *Logs* 链接，然后切换开关以启用 *Function Invocation Logs*。将弹出一个模态框（图 3-16），其中包含默认设置。


