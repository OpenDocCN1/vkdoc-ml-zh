  \n![](img/index-312_1.jpg)\n\n第 8 章 异常检测\n\n单击*下一步*。现在，我们将使用所选的数据资产创建并训练一个模型。选择区间，并为模型定义名称和描述，如图\
  \ 8-33 所示。然后，为*目标误报概率*和*训练分数比率*选择值。这些是用户需要定义的唯一参数。它们的默认值分别为：目标误报概率为 0.01，训练分数比率为\
  \ 0.7。\n\n***图 8-33.** 定义模型创建的参数*\n\n*误报概率 (FAP)* 定义了被标记为异常的时间戳百分比。如果已知实际业务场景中的异常百分比水平，则可以将\
  \ FAP 设置为与该水平相同。默认值（0.01 或 1%）被认为对许多场景相对合适。如果您将 FAP 定义得较高，则意味着误报的可能性较高。同时请注意，FAP\
  \ 定义得越低，模型训练所需的时间就越长，并且存在永远无法达到目标 FAP 的风险。FAP 在每个信号级别进行计算，然后对所有信号取平均值，作为模型最终达到的\
  \ FAP。FAB 的计算方法是：将所有信号中的异常数相加，然后除以数据点总数（信号数量乘以时间戳数量）。FAP = 每个信号中的异常数之和 /（信号数量 *\
  \ 时间戳数量）。该公式如公式 8-1 所示。\n\n*信号数量*\n\n∑\n\n*异常数量*\n\n*i*=1\n\n∗\n\n*信号数量 时间戳数量*\n\
  \n*公式 8-1.*\n\n从公式中可以看出，允许模型学习的误报数量越多（每个信号的异常数量越高），FAP 就越高。\n\n*训练分数比率 (TFR)* 指定用于训练模型的数据集的比例。例如，如果您将\
  \ TFR 设置为 0.7，则该数据集中 70% 的数据用于训练模型，30% 用于评估模型。这 30% 的数据也用于报告模型性能（例如 FAP）。定义训练分数比率是强制性的。该值必须在\
  \ 0.5 到 0.8 范围内：至少 50% 的数据必须用于训练，但不得超过 80%。\n\n\n好的，作为一名高级文档工程师和翻译员，我将遵循您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n\n插入所有参数后，点击*下一步*。查看图 8-34 中的*训练数据* *信息*和*模型信息*。如果一切正确，点击*创建*来创建并训练模型。如果需要修改某些内容，请点击*上一步*。\n\
  \n***图 8-34.** 创建模型前需审查的模型信息*\n\n![](img/index-314_1.jpg)\n\n第 8 章 异常检测\n\n创建和训练模型需要一些时间。在此过程中，您会看到模型处于*创建中*状态。当过程完成时，状态会更新为*活动*。其他可能的状态包括*删除中*、*已删除*和*失败*。\n\
  \n失败最常见的原因是没有遵循本章前面所述的一个或多个数据集要求。\n\n要调查模型，可以从模型列表中点击模型名称选择它，或者选择右侧的三点菜单并选择*查看详细信息*。在*模型详细信息*页面，您可以查看为模型定义的常规信息、模型信息和标签。*常规信息*（图\
  \ 8-35）包括与 OCI 相关的信息。您可以通过点击*编辑*按钮更改名称和描述，并通过*移动资源*按钮将模型移动到另一个 compartment。您可以使用*删除*按钮删除模型。\n\
  \n***图 8-35.** 模型详细信息页面*\n\n*模型信息*（图 Model3）包括关于模型创建的信息。它显示了创建模型时使用的*目标误报概率*和*训练分数比率*的值，以及模型的*模型误报概率*和*多变量误报概率*。如果您想调查模型详细信息，请点击*模型详细信息*旁边的*下载*链接，将模型详细信息下载到一个\
  \ JSON 文件中。此文件名为 details_result.json。您可以在图 8-36 中看到文件内容的摘录。\n\n![](img/index-315_1.png)\n\
  \n第 8 章 异常检测\n\n***图 8-36.** details_result.json 文件摘录*\n\n要调查标签，请选择*标签*选项卡（图 8-37）。模型创建会自动添加两个标签：CreatedBy\
  \ 和 CreatedOn。您可以通过点击*添加标签*按钮来添加更多标签。\n\n![](img/index-316_1.jpg)\n\n![](img/index-316_2.jpg)\n\
  \n第 8 章 异常检测\n\n***图 8-37.** 模型详细信息页面上的模型信息。模型详细信息页面还包含常规信息和标签选项卡*\n\n现在模型已成功创建并训练，它可以用于新的数据集来检测其中的异常。为此，请点击*检测异常*。然后，通过将文件拖放到框中，或点击*选择文件*并从本地文件夹中找到正确的文件（图\
  \ 8-38），来选择要检查可能异常的文件。文件格式可以是 JSON 或 CSV。然后点击*检测*。\n\n***图 8-38.** 使用 JSON 文件检测异常*\n\
  \n**注意** 用于异常检测的数据，其标题中的数据标签必须与训练数据完全相同。换句话说，列名和列数必须与原始训练数据匹配，但文件可以是另一种文件类型。\n\n\
  ![](img/index-317_1.jpg)\n\n第 8 章 异常检测\n\n可能的异常会以图表形式显示。在图表中，水平轴代表时间戳或索引，垂直轴代表信号值、度量值。每个信号或度量值都显示在各自的子图中。在每个子图中，橙色线表示信号的实际输入值，紫色线表示机器学习模型预测的估计值。红色线突出显示在该时间戳检测到的异常。如果实际值与预测值之间的差异足够大，则检测到异常并用红色标记。\n\
  \n在图 8-39 中，您可以看到 Measure_1 在一个时间戳上可能存在的异常。将鼠标移到图表上，可以看到图表右上角显示特定时间戳的实际值和估计值。如果模型检测到异常，并不一定意味着存在异常。可能是训练数据集没有涵盖流程的所有正常情况，因此将此情况视为异常。如果是这种情况，请创建一个也包含此情况的新训练数据集，并使用新数据集训练模型。\n\
  \n***图 8-39.** 检测到的异常图表*\n\n在图 8-40 中，您可以看到一个估计值远高于实际值的示例。因此，该时间戳上可能存在异常。\n\n![](img/index-318_1.jpg)\n\
  \n![](img/index-318_2.jpg)\n\n第 8 章 异常检测\n\n***图 8-40.** 估计值远高于实际值的可能异常*\n\n在图 8-41\
  \ 中，您可以看到一个实际值远高于估计值的示例，因此，该数据点上可能存在异常。\n\n***图 8-41.** 估计值远低于实际值的可能异常*\n\n默认情况下，所有变量都显示为图表，每个变量在其自己的图表上。但是，通过选择*选择用于可视化的列标签（带异常）*（图\
  \ 8-42）并选择一个或多个变量，您可以限制图表仅显示那些可能存在异常的变量。\n\n![](img/index-319_1.jpg)\n\n![](img/index-319_2.jpg)\n\
  \n第 8 章 异常检测\n\n***图 8-42.** 过滤用于异常可视化的列标签或将检测到的异常下载到 JSON 文件*\n\n图表集中的最后两个子图是*聚合异常分数*和*每个信号的异常分数*。您可以在图\
  \ 8-43 中看到这些图表的示例。聚合异常分数通过综合考虑所有信号的异常，指示给定时间戳上异常的显著程度。分数越高，显著性越大。每个信号的异常分数指示单个信号在给定时间戳上的显著性及其分数。如果多个信号在同一时间戳出现异常，它们都会显示其分数。当然，并非所有信号都会同时标记异常。\n\
  \n***图 8-43.** 聚合异常分数和每个信号的异常分数图表*\n\n您还可以从*选择可视化信号模型*中选择可视化的模型。选项包括全部、单变量和多变量。默认值为全部。如果像图\
  \ 8-44 中那样选择*单变量*，则会显示使用单变量模型发现的异常；如果选择*多变量*，则会显示使用多变量模型发现的异常。\n\n![](img/index-320_1.jpg)\n\
  \n第 8 章 异常检测\n\n***图 8-44.** 为图表选择的单变量信号模式*\n\n异常不会永久保存，并且一次只能看到一个异常分析。创建异常分析非常快，因此如果需要，您可以随时重新创建。如果要将异常数据保存到文件中，请点击图\
  \ 8-42 中所示的*下载 JSON* 按钮，将结果下载到 JSON 文件中。该文件名为 anomalies.json。您可以在图 8-45 中看到此 JSON\
  \ 文件的摘录。如您所见，JSON 文件包含一个按时间戳分组的异常数组。每个时间戳可以包含由单个信号或多个信号生成的异常。由一个信号生成的异常包含信号名称、实际值、估计值和异常分数的元组。异常分数指示异常的显著性。此分数\n\
  \n\n\n其值范围在 0 到 1 之间。每个时间戳还包含一个归一化分数，该分数结合了该时间戳内单个或多个告警信号的重要性评分。\n\n这些信息对于利用异常分数自动化执行业务工作流以立即采取行动非常有价值。例如，每个识别出的异常的估计值使得评估异常发生的严重程度成为可能。或者，特定信号的异常分数能够评估不同信号间异常的相对严重性。此外，随时间累积的异常聚合分数可以判断异常是否随时间推移而变得更加严重。\n\
  \n![](img/index-321_1.png)\n\n![](img/index-321_2.jpg)\n\n第 8 章 异常检测\n\n***图 8-45.**\
  \ 该 JSON 文件 anomalies.json 的摘录*\n\n**指标**\n\n您可以在*项目详情*页面的*资源*下找到*指标*，如图 8-24 所示。您也可以在*模型详情*页面的*资源*下找到*指标*，如图\
  \ 8-46 所示。这两种指标的区别在于：在项目详情中，您可以看到模型训练的指标；而在模型详情页面中，您可以看到检测的指标。\n\n***图 8-46.** 查看项目和模型的指标*\n\
  \n![](img/index-322_1.jpg)\n\n第 8 章 异常检测\n\n您可以定义*开始时间*和*结束时间*。通过*快速选择*列表，您可以轻松选择，例如*最近\
  \ 7 天*。然后开始时间会自动更改为七天前。\n\n指标显示模型的五个指标：*失败*、*成功*、*成功率*、*延迟*和*总计*。在这五个指标窗格中，每个窗格都有一个“i”符号，用于获取有关特定指标的更多信息。\n\
  \n此外，在每个窗格中，您可以定义*时间间隔*和使用的*统计*方法。时间间隔可以是自动、一分钟、五分钟、一小时或一天。统计方法可以是比率、总和、平均值、最小值、最大值、计数、P50、P90、P95、P99\
  \ 或 P99.9。您可以将光标悬停在屏幕上方，以查看某个时间点所有指标的情况。在图 8-47 中，您可以看到其中四个指标的示例。\n\n***图 8-47.**\
  \ 模型训练的四个指标示例*\n\n如果您单击其中一个指标窗格，它会展开，您可以更详细地查看。您可以在图 8-48 中看到此操作的示例。您可以更改时间间隔或统计方法，或者使用*调整\
  \ X 轴*滑块来调整时间线上的指标。用鼠标抓住滑块的末端并移动滑块；X 轴会随之调整。从*选项*列表中，您可以选择*在指标资源管理器中查看查询*、*复制图表\
  \ URL*、*复制查询 (MQL)*、*为此查询创建告警*或*表格视图*。\n\n![](img/index-323_1.jpg)\n\n![](img/index-323_2.jpg)\n\
  \n第 8 章 异常检测\n\n***图 8-48.** 一个指标，调整 X 轴并查看选项*\n\n如果您选择*在指标资源管理器中查看查询*，则会打开指标资源管理器（如图\
  \ 8-49 所示）。您可以详细探索指标，例如调整 X 轴和 Y 轴。或者，您可以使用*查询编辑器*编辑查询。基于编辑内容，您可以更新图表或创建*告警*。您还可以使用*OCI\
  \ 仪表盘*可视化查询。\n\n***图 8-49.** 指标资源管理器*\n\n如果您选择*复制图表 URL*，图表的 URL 将被复制到内存中，您可以将其粘贴到任何需要的地方。*复制查询\
  \ (MQL)* 会复制查询，以便您可以将其粘贴到需要的地方。\n\n第 8 章 异常检测\n\n*为此查询创建告警*会将您带到*创建告警*页面，您可以在其中为该指标创建告警。*表格视图*显示相同的查询结果，但以表格数据形式呈现。要切换回图表，请从*选项*中选择*图表视图*。\n\
