  **Oracle 机器学习**


  *OML4SQL* 是在 Oracle 数据库中实现的一组用于机器学习的 PL/SQL 包。OML4SQL 由三个 PL/SQL 包组成：


  • DBMS_PREDICTIVE_ANALYTICS，包含使用预测分析执行半自动化机器学习的例程


  • DBMS_DATA_MINING_TRANSFORMING，包含用于为 OML4SQL 算法转换数据的例程


  • DBMS_DATA_MINING，包含例如创建和管理机器学习模型以及评估它们的例程


  它们都有几个子程序。


  用于 Python 的 Oracle 机器学习 (*OML4Py*) 使您能够运行 Python 命令，对存储在 Oracle 数据库中或可通过 Oracle
  数据库访问的数据进行数据转换、统计、机器学习和图形分析，使用 Python API。OML4Py 包含在 Oracle 自治数据库中。它是一个 Python 模块，使用户能够使用
  Python 语法操作数据库表和视图中的数据，而无需将数据移出数据库。OML4Py 函数和方法透明地将选定的 Python 函数集转换为 SQL，以便在数据库内执行。OML4Py
  包含典型的 Python 机器学习库。但是，OMP4Py 的特殊之处在于它还包括 Oracle 特定的库。AutoML 功能构建在 Python 之上。要在笔记本中使用
  AutoML 功能，您需要导入库 oml，并从 oml 导入 automl。如果您想在本地数据库上使用 OML4Py，则必须在数据库中安装 Python、所需的
  Python 库和 OML4Py 服务器组件，并且必须安装 OML4Py 客户端。


  *OML4R* 是 Oracle 数据库内部的一组 R 库。OML4R 在云中尚不可用，但在本地可用。*OML4Spark* 是 Oracle Big Data
  Connectors 软件套件的一个组件，用于本地大数据解决方案，并包含在 Oracle Big Data Service 中。


