  \ Python 脚本存储库加载该 UDF。然后，使用执行 Python 代码的函数之一来调用它。在此示例中，使用 `do_eval`：\n\n%python\n\
  \nimport oml\n\nnn_predict =**oml.script.load**(name=\"nn_predict\")\n\n**oml.do_eval**(nn_predict)\n\
