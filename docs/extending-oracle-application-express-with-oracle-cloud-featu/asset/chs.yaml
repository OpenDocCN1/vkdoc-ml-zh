  仍在积极开发中，但它已经支持许多 OCI 服务，足以创建我们之前描述的网络拓扑。


  ***图 1-10.** 定义本章所述所需网络拓扑的 OKIT*


  OKIT 是一个在 Docker 容器内运行的 Web 应用程序工具。如果您有兴趣使用该工具，请安装 Docker 或任何其他 *Open Container
  Initiative* 运行时，然后按照 GitHub 仓库上的说明 ([https://](https://github.com/oracle/oci-designer-toolkit)


  [github.com/oracle/oci- designer- toolkit](https://github.com/oracle/oci-designer-toolkit))
  构建并运行容器。


  在配置工作站和容器以支持 OCI REST API 访问后，OKIT 可以无缝地与租户一起工作。架构师可以将设计导出为 Terraform 配置文件，甚至可以从工具内部将它们作为堆栈部署到资源管理器上。


  第 1 章 为 APEX 构建安全基础设施


  **将 APEX 部署到数据库系统**


  将 APEX 部署到 OCI DB 系统时，管理员全权负责安装 APEX。他们还负责数据库性能调优、安全修补以及规划数据库备份和恢复的所有方面。


  类似地，ORDS 是一个 Java Web 应用程序，运行在 Java EE 应用服务器内部。ORDS 可以作为独立服务器（由嵌入式 Jetty Web 容器提供支持）运行，也可以部署到受支持的容器，例如
  Apache Tomcat 或 Oracle WebLogic。管理员全权负责使用一个或多个 OCI 计算实例配置服务器，安装和配置服务器软件，强化操作系统，并确保应用所有安全更新。


  **Oracle Autonomous Linux**


  使操作系统保持最新的安全补丁可能是一项艰巨的任务，尤其是在处理大量服务器时。将服务器与互联网访问隔离只是可以采取的降低网络攻击风险的众多步骤之一。确保为服务器提供动力的软件保持更新也非常重要。


  2019 年，Oracle 宣布推出 *Oracle Autonomous Linux* [(www.](http://www.oracle.com/linux/autonomous-linux/)


  [oracle.com/linux/autonomous- linux/) 操作](http://www.oracle.com/linux/autonomous-linux/)系统，可用于在
  OCI 上部署计算实例。这种特殊版本的 *Oracle Enterprise Linux* 提供自动修补、零停机规划、自我调整和已知漏洞利用检测。管理员使用通知服务，还可以设置在操作系统修补时收到通知。这些功能使
  Oracle Autonomous Linux 成为托管 ORDS 的绝佳操作系统。


  **注意** 当部署在 OCI 计算实例上时，ORDS 可通过 Oracle Enterprise Linux 软件包仓库安装。当通过仓库安装 ORDS 时，它作为独立服务器运行。在
  Oracle Autonomous Linux 中，ORDS 软件会自动更新，但管理员需要确保 ords.conf 配置文件正确，配置目录位置设置在 ords.war
  文件中，并执行安装过程以确保应用任何 ORDS 模式更改。在重新启动 ORDS *systemd* 服务之前，请执行这三个步骤。


  第 1 章 为 APEX 构建安全基础设施


  **负载均衡器**


  理想情况下，数据库和应用服务器都应部署在私有子网中。在提议的架构中（图 1-1），在堆栈中扮演不同角色的服务器被进一步隔离在不同的网络中。这允许管理员定义细粒度的安全和访问控制策略。由于这些服务器深埋在私有网络中，我们如何安全地在互联网上公开
  APEX 应用程序？


  OCI 提供负载均衡器作为托管服务，它们是 Java 应用服务器的绝佳伴侣。作为一种高度专业化的资源，负载均衡器代理浏览器或 REST 客户端与应用服务器之间的
  Web 流量，以交付 Web 内容，而不会向公共网络暴露任何额外的攻击面。Oracle 管理、监控和更新负责交付服务的硬件和软件。在拥有多个*可用性域* (AD)
  的 OCI *区域*中，负载均衡器服务还在 AD 发生故障时提供自动故障转移。


  **在自治数据库上使用 APEX**


  Oracle 自治数据库为运行 APEX 提供了一个完整的堆栈。与之前的部署策略不同，APEX 运行时随数据库预装。无需安装任何软件或创建额外的计算实例。ADB
  服务包括一个托管且有弹性的环境，用于托管 ORDS。


  在下一节中，我们将提出一个架构（图 1-11），该架构将 ADB 隔离在私有网络中，但允许从外部网络访问 APEX 应用程序。


  ![](img/index-36_1.jpg)


  第 1 章 为 APEX 构建安全基础设施


  ***图 1-11.** 由自治数据库提供支持的安全 APEX 堆栈*


  ADB 将配置为仅提供私有网络访问的端点。放置在公共子网中的负载均衡器不仅配置为使 ADB 工具套件在互联网上可用，而且还支持*自定义 URL*，这些 URL
  更用户友好，并且更能代表拥有应用程序的组织。


  **私有端点**


  付费的 ADB 实例，无论工作负载类型如何，都将允许管理员选择以下任何网络访问类型：


  1\. 从任何地方安全访问


  2\. 仅允许来自允许的 IP 和 VCN 的安全访问


  3\. 仅私有端点访问


  ![](img/index-37_1.jpg)


  第 1 章 为 APEX 构建安全基础设施


  您可以在创建实例时选择访问类型，也可以在创建 ADB 后更改它。图 1-12 说明了通过私有端点限制访问的选择，管理员必须分配目标 VCN、子网和 NSG。


  ***图 1-12.** 创建 ADB 时选择网络访问类型*


  默认情况下，ADB 创建为可从任何地方访问。用户可以从互联网访问 ADB 的所有功能，包括 APEX、Database Actions、Graph Studio，以及使用
  SQL*Net 和可下载的数据库钱包连接到数据库。在 VCN 中定义的任何安全列表规则都不适用，因为端点存在于租户及其 VCN 之外。如果需要限制访问，则必须在切换到第二种网络访问类型后通过访问控制列表指定。


  另一种选择是通过私有端点（选项 3）限制对 ADB 的访问。顺便提一下，此配置是 ADB 支持自定义 URL 而不需要托管客户管理的 ORDS 实例的要求。


  具有私有端点的 ADB 只能通过 VCN 以及通过站点到站点 VPN 或 *FastConnect* 链接的任何本地网络进行访问。与任何其他与 VCN 关联的
  OCI 资源一样，访问受


  第 1 章 为 APEX 构建安全基础设施


  安全列表或 NSG 中定义的规则约束。管理员还可以禁用相互 TLS 身份验证，从而允许无需数据库钱包即可通过 SQL*Net 访问数据库。


  **重要** APEX 服务不支持 SQL*Net 访问。


  **自定义 URL**


  Oracle 自治数据库创建时带有一个伪随机 URL，供用户访问 APEX、ORDS 和 Database Actions。完全限定域名 (FQDN) 通常使用以下模式：


  <RANDOM_STRING>.adb.<REGION_ID>.oraclecloudapps.com


  对于大多数组织来说，这些 URL 可能难以让大多数用户记住。特别是在提供公共服务的情况下，使用组织注册域名的子域可能很重要。这些类型的 URL 通常称为自定义
  URL。


  以前，自定义 URL 只能通过配置连接到 ADB 的客户管理 ORDS 来实现，该 ORDS 使用特殊的数据库帐户。这种方法需要一个单独的计算实例，并且客户需要使托管的
  ORDS 版本与 ADB 中安装的版本保持同步。值得庆幸的是，自 2021 年以来，直接支持自定义 URL 已成为可能。


  支持自定义 URL 需要以下条件：


  • ADB 的私有端点


  • 使用安全列表或 NSG 定义的安全规则


  • 由证书颁发机构 (CA) 签名的 SSL/TLS 证书


  • 公共子网上的负载均衡器


  如果您尚未这样做，请将 ADB 配置为具有分配在私有子网中的私有端点，如前所述。接下来，使用本章前面创建的 NSG，将 *NsgPrivateDatabaseAccess*
  和 *NsgPrivateWebAccess* 分配给 ADB。第一个 NSG 定义了允许访问数据库端口的 IP 范围。后者用于负载均衡器将 Web 流量中继到
  ADB。


  第 1 章 为 APEX 构建安全基础设施


  负载均衡器设置需要 SSL/TLS 证书用于两个目的。支持自定义 URL 的负载均衡器有一个需要证书的 HTTPS 侦听器。证书的第二个用途是让侦听器与 ADB
  的 Web 端点通信，该端点仅支持 HTTPS。此通道需要证书链，因此不能使用自签名证书。


  最后，在公共子网上创建负载均衡器。定义一个后端集，其中包含一个由分配给 ADB 的私有 IP 地址定位的后端服务器。您可以在 ADB 的详细信息页面上找到 IP
  地址。


  **Web 应用防火墙**


  Web 应用防火墙是您可以放置在公共网络和 APEX 基础设施堆栈之间的额外保护层。它负责检查传入流量，并记录、警告，并在必要时阻止任何恶意活动。这些可以包括
  *OWASP* 十大 Web 应用程序安全风险 ([`owasp.org/www- project- top- ten/`](https://owasp.org/www-project-top-ten/))、*分布式拒绝服务*
  (DDoS)，或简单地应用访问控制规则，例如用户可以从哪些地理位置访问 Web 应用程序。


  OCI *Web 应用防火墙* (WAF) 作为区域服务提供，无需管理任何软件或硬件。它涉及相当多的配置，例如


  1\. 设置 WAF 策略，包括源端点、访问控制规则、保护规则、速率限制、操作等。


  2\. 配置应用于负载均衡器的安全规则，以仅限制对 WAF 端点的访问。


  3\. 创建和分配 SSL/TLS 证书。


  对 WAF 策略的任何更改都必须应用，并允许在所有全局边缘服务器之间传播。


  在 2021 年底，Oracle 极大地简化了 WAF 的部署方式。如今，WAF 可以附加到具有灵活形状的 OCI 负载均衡器上。接下来，我们将介绍创建 WAF
  策略然后在负载均衡器上实施它的步骤。


  1\. 单击导航菜单，单击 *Identity & Security*，然后单击


  *Policies* 下的 *web application firewall*。


  2\. 单击


  *Create WAF Policy*。


  ![](img/index-40_1.jpg)


  第 1 章 为 APEX 构建安全基础设施


  3\. 为策略提供一个名称，并选择放置策略的区间。默认情况下，会为您预定义三个操作。您可以使用它们，也可以立即添加自定义操作。单击 *Next* 继续。


  4\. 接下来的几个步骤要求您启用 WAF 功能。它们是 *Access Control*、*Rate Limiting* 和 *Protections*。这些是可选的，并且像操作一样，可以在创建策略后定义。单击
  *Next* 以通过向导前进。


  5\. 完成所有功能后，选择将实施策略的负载均衡器（图 1-13）。同样，此步骤是可选的，可以稍后执行。单击 *Next*。


  6\. 最后，查看您定义的策略的详细信息，然后单击 *Create WAF Policy*。


  ***图 1-13.** 创建 WAF 策略并在选定的负载均衡器上实施它*


  为了演示 WAF 的实际应用，尝试创建一个简单的访问控制规则，该规则检查客户端的**地理位置**，并且仅当源发地位于加拿大时才允许访问：


  ![](img/index-41_1.jpg)


  第 1 章 为 APEX 构建安全基础设施


  1\. 转到 WAF 策略的详细信息页面。


