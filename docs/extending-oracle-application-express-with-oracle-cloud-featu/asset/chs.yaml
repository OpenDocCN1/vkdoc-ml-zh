  **第 1 章**


  **为 APEX 构建安全**


  **基础设施**


  *Oracle Application Express* (APEX) 在 Oracle 庞大的技术产品组合中的作用在过去几年中显著增长。它已从其作为随所有 Oracle
  数据库版本提供的免费、快速应用程序开发环境的卑微起点，转变为核心组件


  Oracle 的旗舰产品 *自治数据库* (ADB)。


  ADB 是一种完全托管的数据库服务，由最先进的


  机器学习功能提供支持。该服务的订阅者


  无需管理支持数据库的底层硬件、操作系统 (OS) 和软件。


  Oracle 负责确保数据库配置为具有可用性和可扩展性。这些


  数据库还会自动修补以增强安全性和功能。基于 ML 的算法允许数据库自动创建表索引和调整执行计划，以确保数据库查询和代码的最佳性能。


  ADB 提供四种工作负载类型：


  • 自治事务处理


  • 自治数据仓库


  • 自治 JSON 数据库


  • APEX 服务


  所有工作负载类型都预装并配置了 APEX，包括一个完全托管的 *Java 企业版* (EE) 应用服务器，用于托管 *Oracle REST*


  *数据服务* (ORDS)。除 APEX 服务外，ADB 还附带 *Oracle*


  *机器学习笔记本* (OML 笔记本) 和 *Oracle Graph Studio*。


  © Adrian Png 和 Heli Helskyaho 2022


  A. Png 和 H. Helskyaho，《*使用 Oracle 云功能扩展 Oracle Application Express*》，


  [`doi.org/10.1007/978-1-4842-8170-3_1`](https://doi.org/10.1007/978-1-4842-8170-3_1#DOI)


  第 1 章 为 APEX 构建安全基础设施


  **注意** APEX 服务还缺少对 *Oracle Net Services* 的支持


  (SQL*Net)。这将开发活动限制在 *APEX App Builder* 和 *Database*


  *Actions*。


  但是，由于 APEX 可以安装在任何数据库版本上，因此可以在没有 ADB 的情况下部署实例。在 Oracle 云基础设施 (OCI) 提供的多种数据管理产品中，有可以在虚拟机或裸金属服务器上部署的
  Oracle 数据库 (DB) 系统。作为 DB 系统配置的数据库附带使用最佳实践预装和配置的必要软件。分配的虚拟 CPU、内存和存储量可以轻松使用 OCI 控制台进行管理。备份和补丁也可以通过控制台进行管理和应用。但与
  ADB 不同，APEX 和 ORDS 默认情况下不会安装。


  **注意** 从 Oracle Database 19c 开始，标准版现在允许您创建最多三个可插拔数据库 (PDB)，而无需购买额外的许可证。这为创建多个 APEX
  环境（用于非生产目的，例如开发和测试）提供了机会。


  在本章中，我们将探讨配置 APEX 实例的两种方法，以及如何准备和保护该实例以用于生产环境。


  **网络组件**


  APEX 本质上是一个 Web 应用程序，因此，它依赖互联网或内联网来提供对开发人员可以创建的漂亮功能的访问。如今，托管 APEX 实例的位置有很多选择。以下是一些示例：


  • 在本地托管服务器


  • 在共享数据中心托管服务器


  • 通过基础设施即服务 (IaaS) 供应商托管虚拟计算资源


  • 将 APEX 作为平台即服务 (PaaS) 订阅


  第 1 章 为 APEX 构建安全基础设施


  当然，每种方法都有其优缺点。在本地托管服务器需要对数据中心的物理空间进行大量投资，提供不间断电源和冷却，监控物理服务器访问等等。但是，它确实提供了对硬件和软件的绝对控制，更重要的是，保证了数据主权得以维护。


  订阅 PaaS 服务可能是在互联网上托管 APEX 应用程序最直接的方法。只需获取一个工作区和专用的数据库模式，然后部署您的应用程序。但是，PaaS 提供商会决定
  APEX 环境的所有其他方面。例如，供应商将决定安装的 Oracle 数据库版本、启用的版本和功能以及软件补丁级别。他们还负责并决定基础设施问题，例如系统架构和网络安全。


  一个很好的折衷方案是将 APEX 实例托管在由第三方供应商托管的服务器上。在互联网早期，服务器托管使独立软件提供商 (ISP) 能够托管服务器、安装必要的软件和部署
  Web 应用程序。但是，这些成本很高，因为托管提供商承担了托管任何数据中心的全部责任和成本。


  随着服务器虚拟化和软件定义网络的出现，IaaS 供应商能够以更低的价格提供计算和网络资源。这些允许 ISP 拥有“两全其美”的优势，即以更可接受的价格管理自己的基础设施。


  但是，正如谚语所说，“能力越大，责任越大。”在 OCI 上托管 APEX 时，云架构师需要考虑使用哪些 OCI 资源，它们如何交互，以及更重要的是，如何维护一个对应用程序和数据都健壮且安全的环境。


  **虚拟云网络**


  OCI 提供广泛的网络组件，而 *虚拟云网络* (VCN) 是构建 APEX 虚拟基础设施的核心。VCN 由几个子组件组成，例如


  • 子网


  • 路由


  • 安全列表


  第 1 章 为 APEX 构建安全基础设施


  • DHCP 选项


  • 互联网、网络地址转换 (NAT) 和服务网关


  设计和构建 VCN 有许多考虑因素和方法。例如，VCN 可以包含一个或多个子网，那么创建的理想数量是多少？像往常一样，答案是：“视情况而定！”幸运的是，Oracle
  通过其 *Oracle 架构中心* 网站 ([`docs.oracle.com/solutions/`](https://docs.oracle.com/solutions/))
  提供了一些指导，您可以在其中找到多个参考架构、解决方案手册和客户发布的解决方案。在 *GitHub* 上，Oracle 列出了多个仓库 ([`github.`](https://github.com/oracle-quickstart)


  [com/oracle- quickstart](https://github.com/oracle-quickstart))，其中包含用于构建不同类型环境的
  *Terraform* [(https://terraform.io/) 脚本](https://terraform.io/)，您可以使用这些脚本通过 *Resource
  Manager* 进行部署。


  在本章中，我们将设计并部署一个简单的 VCN（参见图 1-1），位于区间 *ch01* 中。它将包含三个子网。一个子网将是公共的。此子网中的 OCI 资源可以分配可公开访问的
  IP 地址。互联网网关提供资源与互联网客户端之间的双向通信。两个子网将是私有的，尽管 OCI 组件可以通过 NAT 网关访问基于互联网的资源，但它们被隔离，无法在
  VCN 外部寻址。这种网络拓扑有助于最大限度地减少数据库和应用服务器等关键资产暴露于互联网上的外部威胁，否则用户无法直接访问这些资产。


