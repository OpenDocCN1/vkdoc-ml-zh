  **堡垒机**


  如今，网络攻击的风险极高。无论您的组织的 Web 应用程序规模有多小，限制攻击面并保护对数据和代码的访问都是至关重要的。在提议的架构中，所有应用程序和数据库服务器都放置在无法通过互联网访问的私有子网中。负载均衡器是
  OCI 管理的服务，具有非常特定的功能，并且不保留任何代码或数据。它们可以放置在公共子网中，有时也称为非军事区 (DMZ)。


  对于大多数组织来说，这些私有子网是通过 VCN 和本地网络之间的站点到站点虚拟专用网络 (VPN) 访问的。远程工作的员工然后可以使用单独的 VPN 连接到公司网络，然后通过安全的
  IPsec 隧道，再连接到服务器。


  Oracle 提供了一种替代解决方案，即 *Bastion* 服务，用于安全地隧道进入 VCN 并连接到私有子网上的服务器。与负载均衡器一样，这是 OCI 提供的托管服务。堡垒机可以分配给公共子网，其访问可以通过
  *身份和访问管理* (IAM) 组和策略进行管理。


  ![](img/index-26_1.jpg)


  第 1 章 为 APEX 构建安全基础设施


  使用以下步骤创建堡垒机：


  1\. 打开导航菜单，单击 *Identity & Security*，然后单击


  *Bastion*（您可能需要向下滚动页面一点）。


  2\. 单击


  *Create bastion*。


  3\. 输入一个名称（图 1-5）。指定目标 VCN 和子网


  （一个公共子网，因为我们的目标是通过互联网访问服务器），如有必要，更新所选的区间。如果您需要将连接限制到预定义的 IP 地址范围，则将它们添加到 *CIDR block
  allowlist* 字段中。


  4\. 单击


  *Create bastion*。


  ***图 1-5.** 创建堡垒机并将其放置在公共子网上*


  第 1 章 为 APEX 构建安全基础设施


  通过堡垒机可以使用两种类型的会话，具体取决于您希望连接到私有子网上的什么。如果计算实例是使用 Oracle 提供的 Linux 镜像之一创建的，用户可以创建 *managed
  SSH sessions* 来使用 SSH 连接到服务器。此外，这些主机需要安装并运行 OpenSSH，必须安装 Oracle Cloud Agent，并且启用
  Bastion 插件（图 1-6）。主机所在的 VCN 还必须有一个服务网关和一个规则，允许所有 OCI 服务通过它进行路由。


  **注意** SSH 是一种用于与运行基于 Unix 的操作系统的服务器进行通信的安全协议，通常通过传输控制协议 (TCP) 端口号 22。客户端与服务器通信的最常见应用程序是
  OpenSSH。该软件可用于安装当前版本的 Microsoft Windows、Mac 和 Linux。用户需要一个操作系统用户帐户，并且可以使用各种方法进行身份验证，例如密码或
  SSH 密钥对。要执行后者，OpenSSH 提供了管理这些密钥的工具，这些密钥默认存储在用户主目录下的 .ssh 子目录中。要生成密钥对，请运行命令：


  ssh-keygen -t rsa


  密码短语是可选的，因此将其留空以使用不带密码短语的密钥。生成私钥和公钥后，您将分别在文件 ~/.ssh/id_rsa 和 ~/.ssh/id_rsa.pub 中找到它们。确保私钥安全，但将公钥的内容提供给需要访问的系统。公钥被添加到用户主目录中的文件
  (~/.ssh/authorized_keys) 中，然后用于身份验证。


