  **注意事项**


  与任何将文件存储在数据库外部的方法一样，开发人员必须管理数据完整性和一致性。在传统方法中，文件作为表列存储，我们可以利用数据库事务，以便仅在数据库记录成功写入时才保存文件。当使用外部存储系统时，设计
  PL/SQL 过程，以便在文件操作发生错误时发生数据库事务回滚。


  决定如何在外部存储系统中命名文件并将其链接到关联的数据库记录也很重要。将 LOB 存储在列中时，命名冲突的风险很小或没有。使用外部存储系统时，存在意外覆盖或删除与其他数据库记录关联的文件的风险。


  第 2 章 使用对象存储存储大对象


  **总结**


  在本章中，我们演示了如何将对象存储用作照片、文档等大文件的替代存储介质。为了管理对象，我们使用了 OCI REST API，这些 API 使用非对称加密和数字签名进行保护。幸运的是，APEX
  封装了使用 OCI Web 凭证执行身份验证过程的复杂性，使得使用 OCI 资源来构建或补充我们原本难以在纯 APEX 和 PL/SQL 中实现的功能变得容易。


  **第 3 章**


  **使用 Oracle 云函数**


  在上一章中，我们创建了一个相册，它使用 OCI 对象存储来存储原始图像。这些是大文件，我们不一定希望在用户明确请求查看之前以全分辨率呈现。我们可以通过图像和/或数据处理进一步增强我们的应用程序，以创建更小的预览图像用于呈现，从而提高页面加载性能。


  在 PL/SQL 中创建缩略图或预览尺寸图像的一种方法是使用 *Oracle Multimedia* (OMM)。不幸的是，这些包在 Oracle 数据库 19c
  版本中已被弃用和取消支持。曾经使用 OMM 进行图像处理任务（例如缩略图生成）的开发人员现在被迫寻找替代方案。使用 Functions，我们可以将此类计算密集型任务卸载到无服务器平台，并按需执行。


  在本章中，我们将了解 *Oracle 云函数* (Functions)，这是一种无服务器计算技术，以及如何使用它来执行图像处理任务。


  **重要** Oracle Function 不包含在 Oracle Cloud *Free Tier* 产品中。使用成本将在本章后面讨论。


  **图像处理**


  OMM 是一个免费的 Oracle 数据库功能，用于在数据库中存储、访问和管理图像、音频、视频和 *医学数字成像和通信* (DICOM) 文件。它提供了 PL/SQL
  对象类型和包，允许开发人员执行基本的操作任务，例如调整图像大小、添加水印以及检索音频和视频文件的属性/元数据。


  © Adrian Png 和 Heli Helskyaho 2022


  A. Png 和 H. Helskyaho，《*使用 Oracle 云功能扩展 Oracle Application Express*》，


  [`doi.org/10.1007/978-1-4842-8170-3_3`](https://doi.org/10.1007/978-1-4842-8170-3_3#DOI)


  第 3 章 使用 Oracle 云函数


  例如，要为上传到我们相册的照片创建缩略图，您可以创建一个简单的过程，该过程检索存储为 PHOTO 表中 BLOB 的图像，执行转换，然后将输出存储在单独的表列中：


  create or replace package body pkg_image_util as


  procedure p_generate_thumbnail(


  p_photo_id photo.photo_id%type


  , p_size number


  ) as


  l_image blob;


  l_thumbnail blob;


  begin


  -- 1\. 为缩略图创建一个临时 BLOB。


  dbms_lob.createtemporary(


  lob_loc => l_thumbnail


  , cache => true


  );


  -- 2\. 从表中检索图像。


  select blob_content


  into l_image


  from photo


  where photo_id = p_photo_id;


  -- 3\. 生成缩略图。


  ordsys.ordimage.processcopy(


  command => ''maxScale='' || to_char(p_size)


  || '' '' || to_char(p_size)


  , imageblob => l_image


  , dest => l_thumbnail


  );


  -- 4\. 用生成的图像更新表。


  update photo


  set blob_thumbnail = l_thumbnail


  where photo_id = p_photo_id;


  第 3 章 使用 Oracle 云函数


  -- 5\. 清理。


  dbms_lob.freetemporary(l_thumbnail);


  end p_generate_thumbnail;


  end pkg_image_util;


  /


  不幸的是，对我们来说，OMM 在 Oracle 数据库 18c 版本中被弃用，并在 19c 版本中被取消支持。Oracle Multimedia 也不支持任何
  Oracle 自治数据库。那么，我们如何在 APEX 应用程序中继续提供此类图像处理功能呢？


  有许多方法我们可以考虑，在深入探讨如何使用无服务器技术快速创建 Oracle 函数来处理此任务之前，我们将快速检查每种方法。这些是


  1\. 使用 JavaScript 库在浏览器中执行图像处理任务。


  2\. 使用其他编程语言（例如 *JavaScript*、*Java™* 或 *Python*）的第三方库创建和部署服务器端 REST API。


  3\. 集成执行图像处理任务的基于云的 REST API。


  4\. 创建和部署应用程序，并使用 Oracle Functions 托管应用程序，而无需担心管理底层基础设施。图像处理任务可以使用 Oracle Event
  触发，或使用 *Oracle API gateway* 包装为 REST API。


  5\. 如果您的数据库支持 *多语言引擎* (MLE) 功能，则可以使用所选的支持语言创建图像处理任务。但是，在撰写本文时，MLE 仅在 Oracle 数据库
  21c 版本中可用且受 APEX 支持。


  第 3 章 使用 Oracle 云函数


  **在客户端浏览器上处理图像**


  不乏可用于在 Web 浏览器上操作和转换图像的 JavaScript 库，例如 p5.js (https://p5js.org/) 和 Fabric.js [(http://](http://fabricjs.com/)


  [fabricjs.com/](http://fabricjs.com/))。


  在客户端执行操作并不难，特别是对于通常精通 JavaScript 的 APEX 开发人员。但是，存在一些问题，例如浏览器兼容性和性能。


  **自定义图像处理 REST API**


  值得庆幸的是，自 4.0 版本以来，APEX 通过包 APEX_WEB_SERVICE 提供了对使用 RESTful 服务的支持。这为 APEX 应用程序提供了访问和执行
  Oracle 数据库范围之外的专门任务的能力。


  在服务器端处理图像的一种选择是使用众所周知的应用程序和编程库，例如 *ImageMagick®* ([`imagemagick.org/`](https://imagemagick.org/))、用于
  Python 的 Pillow ([`python- pillow.org/`](https://python-pillow.org/)) 和用于 Node.js/JavaScript
  的 sharp ([`sharp.pixelplumbing.`](https://sharp.pixelplumbing.com/)


  [com/](https://sharp.pixelplumbing.com/))。ImageMagick 是一个流行的跨平台数字图像处理库，支持许多图像格式和转换算法。由于其流行性，许多编程语言都有旨在与其交互的库。


  今天，我们可能无法在数据库内部访问这些强大的二进制文件，因此最好的替代方法是使用诸如 Express ([`expressjs.com/`](https://expressjs.com/))
  和 Django ([www.djangoproject.com/](http://www.djangoproject.com/)) 之类的框架将它们包装为 REST
  API，具体取决于您选择的编程语言。


  这种方法的缺点是需要创建和管理支持这些 Web 服务的基础设施。开发人员必须处理性能、安全性和可用性等问题。


  **使用第三方 REST API**


  有一些服务，如 *Filestack* [(www.filestack.com/)](http://www.filestack.com/)，提供 100% 基于云的
  API，以及 *APEX Media Extension* [(www.apexmediaextension.com/)](http://www.apexmediaextension.com/)，提供自托管选项。但是，虽然这些服务提供有限的免费服务，但它们通常是收费的，并且根据使用频率可能会很昂贵。


  第 3 章 使用 Oracle 云函数


  另一个考虑因素是安全性和数据隐私。源图像被发送到服务提供商的服务器，并且根据其服务条款，可能会保留一段预定义的时间。


  如果这些问题对您的组织非常重要，或者您需要对图像处理进行更细粒度的控制，那么请考虑实施涉及 Oracle Functions 的解决方案。


  **Oracle 云函数**


  Oracle 云函数是一种云原生、无服务器产品，构建在 *Fn Project* [(https://fnproject.io/](https://fnproject.io/))
  之上。无服务器技术允许开发人员编写代码来执行专门的任务，然后将其部署并托管在基于云的提供商上，而无需担心管理托管应用程序代码的基础设施。其他无服务器技术包括 Amazon
  的 AWS Lambda 和 Microsoft 的 Azure Functions。大多数（如果不是全部）提供商仅在调用和执行函数时收费，从而降低了基础设施成本。


  Functions 支持多种编程语言。目前支持以下语言：


  • Go


  • Java


  • Node.js


  • Python


  • Ruby


  • C#


  在本章中，我们将重点介绍使用 *Node.js*，因为 JavaScript 是大多数 APEX 开发人员都会熟悉的语言。


  与其他竞争的无服务器平台不同，Functions 将代码封装在 Docker [(https://docker.io)](https://docker.io)
  镜像中，并作为容器部署在 OCI 上。这为开发人员提供了完全自定义和部署具有任何所需依赖项（例如 ImageMagick）的容器的机会。


  以下是 Functions 的开发过程概述：


  第 3 章 使用 Oracle 云函数


  1\. 选择编程语言运行时，并使用 Fn Project CLI 初始化项目。


  2\. 使用所选语言编写代码。


  3\. 使用 Fn Project CLI 将函数部署到 OCI。


  4\. 调用函数。


  我们稍后将更详细地检查每个步骤，但首先，让我们安装所需的软件和工具，并设置支持 Functions 的 OCI 环境、用户和策略。


  **所需软件和工具**


