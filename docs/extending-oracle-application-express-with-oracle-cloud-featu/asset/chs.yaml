  \ 3198 1 1 1\n\n您可以使用 `oml.ds.delete` 从 OML4Py 数据存储中删除对象。\n\nOML4Py 数据存储有两个数据库视图：`ALL_PYQ_DATASTORES`\
  \ 和 `ALL_PYQ_DATASTORE_CONTENTS`。您可以使用 SQL 查询这些视图，以获取有关\n\n现有 OML4Py 数据存储的信息。\n\n\
  让我们创建一个名为 `nn_predict` 的 UDF。该 UDF 将使用存储在 OML4Py 数据存储 `ds_pymodel` 中的 `nn_mod` 模型，基于名为\
  \ `STUDENTTRAIN` 的表中的数据，为 `ENROLLED` 字段创建预测。结果中还包含 `STUDENTID`，以便在构建 APEX 应用程序时，我们能够将这些数据与数据库中的数据进行连接。在\
  \ UDF 中，我们导入所需的库，将表的内容获取到数据框中，从 OML4Py 数据存储加载模型，使用模型进行预测，最后以 JSON 格式返回结果。\n\nnn_predict\
  \ = \"\"\"def nn_predict():\n\nimport pandas as pd\n\nimport oml\n\nimport json\n\
