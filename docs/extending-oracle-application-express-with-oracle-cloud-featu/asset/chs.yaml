  \ ,supplemental_cols = data\n\n[:, ['STUDENTID']]).pull()\n\njson_result = mod_predict.to_json(orient='records')\n\
  \nreturn(json_result)\"\"\"\n\n第 6 章 Oracle 机器学习 REST 服务\n\n然后，将 UDF 存储在 Python\
