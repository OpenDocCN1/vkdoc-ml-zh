  \ API 的 APEX 应用程序*\n\n**总结**\n\n通过 REST API，使用 Oracle 数据库中的机器学习功能（包括 Oracle 机器学习和嵌入式\
  \ Python 执行）又多了一种选择。REST API 的流程是首先获取令牌，然后使用 OAuth 2.0 身份验证令牌通过 HTTP 消息请求 REST API\
  \ 端点。在 APEX 中调用 REST API 服务时，Web 凭据和 REST 数据源是所使用的工具。\n\n**第 7 章**\n\n**数据标注**\n\
  \n监督学习是机器学习的一个子类别，其过程由标注数据监督。模型使用已知的输入和输出进行训练和测试。\n\n\n\n已知输出数据。对于已知输出数据，意味着数据必须被标记。数据\n\
  \n标记将监督学习无法使用的数据集转变为监督学习可用的数据集。\n\n数据标记服务提供了一种流程，用于识别复杂对象（如文档、文本和图像）的特征，并根据这些特征对其进行注释或标记。数据标记过程包括创建数据记录数据集，并对这些记录应用标签。数据集可以导出为行分隔的\
  \ JSON (JSONL) 格式，以便在监督机器学习过程中进一步使用。\n\n使用此服务，您可以标记 PDF、TIF 和 TIFF 格式的文档，TXT 格式的文本文件，以及\
  \ JPG、JPEG 和 PNG 格式的图像。\n\n**设置服务**\n\n要开始使用数据标记服务，您需要一个具有服务管理员角色权限的 Oracle Cloud\
  \ Infrastructure (OCI) 账户，或者一个可以设置服务并授予您所需权限的人员。您还需要一个受支持的浏览器。请从 OCI 文档中查看受支持的浏览器。\n\
  \n首先，为数据标记资源创建一个区间。这不是强制步骤，但建议这样做，以提高安全性并更轻松地管理权限。从导航菜单中选择*身份与安全*，然后选择*区间*。\n\n\
  选择您想要在其中创建子区间的区间，然后点击*创建区间*，如图 7-1 所示。\n\n© Adrian Png 和 Heli Helskyaho 2022\n\n\
  A. Png 和 H. Helskyaho，《使用 Oracle 云功能扩展 Oracle Application Express》，\n\n[`doi.org/10.1007/978-1-4842-8170-3_7`](https://doi.org/10.1007/978-1-4842-8170-3_7#DOI)\n\
  \n![](img/index-245_1.png)\n\n第 7 章 数据标记\n\n***图 7-1.** 区间页面的子区间部分*\n\n输入所需数据，如图\
  \ 7-2 所示：名称、描述以及可能的标签。然后，点击*创建区间*。\n\n![](img/index-246_1.jpg)\n\n第 7 章 数据标记\n\n\
  ***图 7-2.** 创建区间*\n\n然后，创建用于存储数据的*存储桶*。即使您使用本地计算机的数据，也需要一个对象存储和一个存储桶来存储数据标记过程创建的数据集和记录。要创建存储桶，请从导航菜单中选择*存储*。然后，选择*存储桶*。从列表中选择正确的区间，然后点击*创建存储桶*（图\
  \ 7-3）。\n\n![](img/index-247_1.jpg)\n\n![](img/index-247_2.jpg)\n\n第 7 章 数据标记\n\n\
  ***图 7-3.** 现有存储桶列表和创建新存储桶的按钮*\n\n定义*存储桶名称*，并选择*默认存储层*和*加密*方式，如图 7-4 所示。点击*创建*。\n\
  \n***图 7-4.** 创建新存储桶*\n\n![](img/index-248_1.jpg)\n\n第 7 章 数据标记\n\n对数据标记服务的访问权限以及用户拥有的访问类型，由*策略*控制。默认情况下，只有管理员组中的用户才能访问所有数据标记资源。所有其他用户组的权限必须通过策略进行管理。\n\
  \n可以为单个用户定义策略，但最佳实践是创建一个用户组，为该组定义策略，然后将用户添加到该组中。使用此方法可以更轻松地维护权限。\n\n首先，为数据标记用户创建一个用户组。然后，将用户添加到此组。在此示例中，我们将创建一个\
  \ IAM 用户组和一个 IAM 用户。\n\n**注意** 如果您使用的是身份云服务提供商（iDCS 提供商），例如 Oracle 身份云服务 (OiCS)，请在*联合*下创建组并分配用户。\n\
  \n通过从导航菜单中选择*身份与安全*来为数据标记创建一个用户组。然后，选择*组*以查看组页面，如图 7-5 所示。\n\n***图 7-5.** 用户组列表和创建新组的按钮*\n\
  \n![](img/index-249_1.jpg)\n\n第 7 章 数据标记\n\n\n\n点击*创建组*。定义*名称*和*描述*（图 7-6）。然后，点击*创建*。\n\
  \n***图 7-6.** 创建新用户组*\n\n下一步是创建一个新用户，或将现有用户添加到此 DataLabelingGroup。要创建新用户，请从导航菜单中选择*身份与安全*。然后，选择*用户*。在用户页面中点击*创建用户*来添加新用户（图\
  \ 7-7）。\n\n![](img/index-250_1.jpg)\n\n![](img/index-250_2.jpg)\n\n第 7 章 数据标注\n\n\
  ***图 7-7.** 用户列表及添加新用户的按钮*\n\n为用户输入*名称*和*描述*（图 7-8）。您还可以添加*电子邮件地址*。点击*创建*。\n\n**注意**：如果您正在创建\
  \ Oracle 身份云服务用户，则可以在创建用户时将其添加到用户组。\n\n***图 7-8.** 创建新用户*\n\n![](img/index-251_1.jpg)\n\
  \n![](img/index-251_2.jpg)\n\n第 7 章 数据标注\n\n要将用户添加到用户组，请从导航菜单中选择*身份与安全*。然后选择*组*。导航到正确的组（DataLabelingGroup），如图\
  \ 7-9 所示。\n\n***图 7-9.** 组成员列表及添加新成员的按钮*\n\n*到组中*\n\n点击*将用户添加到组*。从用户列表中选择用户，然后点击*添加*（图\
  \ 7-10）。\n\n***图 7-10.** 将用户添加到用户组*\n\n*资源主体*用于授予对 Oracle 云基础设施资源的访问权限。*Datalabelingdataset*\
  \ 是数据标注服务所需的唯一资源主体。\n\n使用该资源主体规则创建一个*动态组*。要创建动态组，请从导航菜单中选择*身份与安全*，然后选择*动态组*。\n\n\
  动态组页面如图 7-11 所示。\n\n![](img/index-252_1.jpg)\n\n![](img/index-252_2.jpg)\n\n第 7\
  \ 章 数据标注\n\n***图 7-11.** 动态组列表及创建新动态组的按钮*\n\n点击*创建动态组*。为动态组输入*名称*和*描述*。对于规则，定义 ALL\
  \ {resource.type = 'datalabelingdataset'}，如图 7-12 所示。\n\n***图 7-12.** 使用已定义规则创建新动态组*\n\
  \n下一步是在父区间中创建两个*策略*。从导航菜单中选择*身份与安全*，然后选择*策略*。导航到父区间（在我们的示例中为 Heli 区间）。我们为演示创建的策略是\
  \ DataLabeling-non-tech-user-policy 和 DataLabeling-dynamic-group-policy，如图 7-13\
  \ 所示。\n\n![](img/index-253_1.jpg)\n\n第 7 章 数据标注\n\n***图 7-13.** 策略列表及创建新策略的按钮*\n\
  \n要创建策略，请点击*创建策略*。\n\n首先，为用户组（非管理员用户）创建策略，如下所示：\n\nallow group DataLabelingGroup\
  \ to read buckets in compartment DataLabeling\n\nallow group DataLabelingGroup to\
  \ manage objects in compartment DataLabeling\n\nallow group DataLabelingGroup to\
  \ read objectstorage-namespaces in compartment DataLabeling\n\nallow group DataLabelingGroup\
  \ to manage data-labeling-family in compartment DataLabeling\n\n然后，为动态组创建策略，如下所示：\n\
  \nallow dynamic-group DataLabelingDynamicGroup to read buckets in compartment DataLabeling\n\
  \nallow dynamic-group DataLabelingDynamicGroup to read objects in compartment DataLabeling\n\
  \nallow dynamic-group DataLabelingDynamicGroup to manage objects in compartment\
  \ DataLabeling where any {request.permission='OBJECT_CREATE'}\n\n请记住在策略构建器中点击*显示手动编辑器*，以便能够添加这些策略。\n\
  \n![](img/index-254_1.jpg)\n\n第 7 章 数据标注\n\n在我们的示例中，我们创建了一个名为 DataLabeling 的区间、一个名为\
  \ DataLabelingGroup 的用户组以及一个名为 DataLabelingDynamicGroup 的动态用户组。然后我们创建了两个策略集：DataLabeling-non-tech-user-policy\
  \ 和 DataLabeling-dynamic-group-policy。\n\n\n\n要了解有关最佳实践、设置 OCI 环境以及策略的更多信息，请参阅 Oracle\
  \ 手册。例如，要了解更多关于策略的信息，请访问\n[`docs.oracle.com/en-us/iaas/Content/Identity/Concepts/policies.htm`](https://docs.oracle.com/en-us/iaas/Content/Identity/Concepts/policies.htm)。\n\
  \n要开始使用数据标注服务，请点击导航菜单上的 *分析与 AI*。\n\n在机器学习下选择 *数据标注*（图 7-14）。\n\n***图 7-14.** OCI\
  \ 控制台中的数据标注*\n\n**数据集、记录和标注**\n\n数据标注过程会对数据集中的记录进行标注。该过程的第一步是创建数据集。一个数据集由一个或多个数据记录组成。选择包含待标注数据的文件。创建数据集的过程会将这些文件转换为记录。\n\
  \n然后，您手动标注数据集中的记录。标注意味着您为数据集中的每条记录赋予一个标签或注释。\n\n![](img/index-255_1.jpg)\n\n![](img/index-255_2.jpg)\n\
  \n第 7 章 数据标注\n\n**创建数据集和记录**\n\n在数据标注中（图 7-15），选择 *数据集*。选择正确的区间。这是您设置策略的区间。点击 *创建数据集*\
  \ 按钮。\n\n***图 7-15.** 数据集列表和用于创建新数据集的按钮*\n\n为数据集定义一个 *名称*，并可选择定义一个 *描述*。然后，选择数据类型，即\
  \ *数据集格式*：图像、文本或文档。在图 7-16 中，已选择了图像选项。\n\n***图 7-16.** 为新数据集添加详细信息*\n\n![](img/index-256_1.jpg)\n\
  \n第 7 章 数据标注\n\n*注释类* 选项取决于所选的数据集格式。对于 *图像*，注释类选项为单标签、多标签或对象检测。对于 *文本*，选项为单标签、多标签或实体提取。对于\
  \ *文档*，选项为单标签或多标签。选择首选的注释类。在图 7-17 中，您可以看到图像数据的注释类选项。如果需要，您还可以为数据集添加 *标签*。准备就绪后，点击\
  \ *下一步*。\n\n***图 7-17.** 图像可用的注释类*\n\n添加用于创建数据集的文件有两种选项\n（图 7-18）：*上传本地文件* 或 *从对象存储中选择*。根据您要标注的数据选择相应选项。\n\
  \n**注意** 如果您想一次从本地文件夹加载超过 100 个文件，请在创建数据集之前将它们加载到对象存储桶中，或者使用\nCLI 或 SDK。\n\n![](img/index-257_1.jpg)\n\
  \n![](img/index-257_2.jpg)\n\n第 7 章 数据标注\n\n***图 7-18.** 为数据集选择数据源*\n\n然后，选择正确的\
  \ *区间*，如图 7-19 所示。选择 *存储桶*。如果您选择了 *上传本地文件*，则该存储桶是您要存储数据集的桶；如果您选择了 *从对象存储中选择*，则该存储桶是数据所在的桶。如果需要，您可以添加一个\
  \ *前缀*。如果您选择上传本地文件，此前缀将添加到上传到对象存储桶的每个文件的文件名中。如果您选择从对象存储中选择，此前缀将用作创建数据集所用文件的过滤器，并且仅从满足过滤器条件的文件创建数据集。\n\
  \n***图 7-19.** 为数据集定义对象存储详细信息*\n\n然后，选择将添加到数据集的文件。如果您选择上传本地\n文件作为数据源（图 7-18），您将从本地计算机选择文件（图\
  \ 7-20）。如果您选择从对象存储中选择，则会显示来自该对象存储的文件以供选择。\n\n![](img/index-258_1.jpg)\n\n![](img/index-258_2.jpg)\n\
  \n第 7 章 数据标注\n\n***图 7-20.** 为数据集选择文件*\n\n最后一步是添加在标注数据集中的记录时将使用的标签\n（图 7-21）。您必须至少添加一个标签，但最好添加所有需要的标签。如果您后来发现缺少标签，可以稍后添加更多标签。点击\
  \ *下一步*。\n\n***图 7-21.** 为数据集定义标签*\n\n现在在 *审核页面*（图 7-22）上，检查一切是否符合您的要求。如果您发现任何问题，请点击\
  \ *编辑数据集详细信息* 或 *编辑文件和标签* 来纠正错误。如果一切正常，请点击 *创建*。数据集创建过程开始，并可在数据集详细信息页面上看到状态显示为 *正在创建*（图\
  \ 7-23）。\n\n![](img/index-259_1.png)\n\n![](img/index-259_2.jpg)\n\n第 7 章 数据标注\n\
  \n***图 7-22.** 创建数据集前检查详细信息的审核页面*\n\n***图 7-23.** 正在创建的数据集的数据集详细信息页面*\n\n为数据集选择的每个文件都将转换为数据集中的一条记录。\n\
  \n当数据集成功创建后，您可以在所选数据集的 *数据集详细信息* 页面中看到记录，其状态显示为 *活动*。如图 7-24 所示。当数据集首次创建时，所有记录都被标记为未标注。\n\
  \n![](img/index-260_1.jpg)\n\n第 7 章 数据标注\n\n***图 7-24.** 数据集详细信息*\n\n您可以在数据标注主页上的\
  \ *工作请求*\n（图 7-26）选项卡中跟踪数据集创建过程的进度。您可以通过选择 *日志消息*（图 7-29）来详细了解工作请求的进展情况。如果在数据集创建过程中出现任何错误，您可以在\
  \ *错误消息* 选项卡（图 7-30）中找到相关信息。\n\n**标注数据集中的记录**\n\n下一步是标注记录。如果您在创建数据集时没有添加所有需要的标签，您可以点击数据集详细信息页面上的\
  \ *添加标签* 按钮（图 7-24）来添加更多标签。标签的最大数量为 255。您可以在图 7-24 所示的标签选项卡下找到数据集的标签列表。\n\n要标注一条记录，您可以点击列表中该记录的名称，或者选择\n\
  三点菜单并选择 *标注*。从标签列表中选择正确的标签/标签。\n然后，如果您不想标注更多记录，请点击 *保存*；如果您想标注下一条记录，请点击 *保存并下一步*。如果您不想标注该记录，请点击\
  \ *跳过*，下一条记录将被打开。在图 7-25 中，有一个对象检测的示例。标签用于标记图片中人物的鼻子、嘴巴和眼睛。要标注，请选择 *边界框*、所需的 *标签*，然后在图片中\
  \ *标记该标签的区域*。您可以使用 *移除框* 来移除任何绘制在错误位置的框。工具栏提供了在画布中移动图片、放大和缩小、\n重置缩放以及调整图像的工具。\n\n\
  ![](img/index-261_1.jpg)\n\n第 7 章 数据标注\n\n***图 7-25.** 标注记录*\n\n在数据集详细信息页面上，您可以通过标注状态过滤记录，以仅查看已标注记录或未标注记录。您还可以选择以\
  \ *数据记录* 或 *图库视图* 的形式查看记录。图库视图显示记录的内容，而不仅仅是名称。在图库视图中，您可以通过标签搜索记录，以列出具有所需标签的记录。在数据记录视图中，您可以通过点击表头按记录名称或创建时间对记录进行排序。\n\
  \n\n\n如果您想编辑数据集信息，可以点击*编辑*（图 7-24）。您可以编辑数据集的名称及其描述，但不允许更改对象存储信息。\n\n如果您想从本地驱动器添加更多文件，可以通过相同的“编辑数据集”表单进行添加。只需拖放文件，或使用文件选择功能进行选择即可。文件的记录会自动生成。\n\
  \n如果在数据集详细信息页面（图 7-24）中选择*更多操作*，您可以执行移动资源、添加标签、查看工作请求或删除数据集等操作。*移动资源*允许您将数据集从一个区间移动到另一个区间。*添加标签*允许您向数据集添加新标签。创建数据集时，系统会自动生成两个标签：CreatedBy\
  \ 和 CreatedOn。*查看工作请求*会显示该区间上的所有工作请求，如图 7-26 所示。如果遇到无法自行解决的工作请求问题，三点菜单允许您打开一个支持请求。*删除*则会删除数据集。\n\
  \n![](img/index-262_1.jpg)\n\n![](img/index-262_2.jpg)\n\n第 7 章 数据标注\n\n***图 7-26.**\
  \ 工作请求*\n\n数据集创建完成后，可以在数据集列表中找到它（如图 7-27 所示）。如果数据集创建成功，其状态为*活动*。数据集的其他可能状态包括*创建中*、*更新中*、*删除中*、*已删除*、*失败*和*需要注意*。\n\
  \n“失败”和“需要注意”都表示创建未成功。随着列表变长，您可能会发现数据集列表左侧的*筛选器*非常有用。使用筛选器，您可以按*数据集状态*或*标注类别*进行筛选。\n\
  \n***图 7-27.** 数据集列表*\n\n要查看数据集详细信息，请通过单击其名称或从三点菜单（即右侧标有三个点的菜单）中选择“详细信息”来选择数据集（图\
  \ 7-27）。\n\n为了能够在任何机器学习过程中使用已标注的数据，请使用数据集详细信息页面（图 7-24）中的*导出*按钮将其导出。此导出的结果将存储在 JSONL（JSON\
  \ Lines 格式）文件中。您可以选择文件存储的存储桶，并可选地为它们定义前缀。默认情况下，文件中仅包含已标注的记录，但如果您也想包含未标注的记录，请选择*包含未标注的记录以导出*。导出会创建两个\
  \ JSONL 文件：一个包含元数据，另一个包含每条记录的数据。主文件（即元数据文件）包含数据集 ID、区间 ID、显示名称、标签集的值、标注格式、数据集来源和格式的详细信息，以及包含数据集记录的其他文件的信息。另一个文件包含每条记录的信息，以及其标注方式、时间和人员。\n\
  \n**向数据集添加新记录**\n\n在许多情况下，标注数据量不足、缺乏足够的多样性，或者由于某些原因，您无法充分训练模型，需要更多/更好的数据来训练模型。在您创建了数据集及其记录之后，可以向数据集添加新记录。\n\
  \n如本章前面所述，如果您想从本地目录向数据集添加新记录，可以通过在数据集详细信息页面（图 7-24）选择*编辑*，然后拖放文件或使用文件选择功能进行选择。\n\
  \n如果您想将对象存储中的文件包含到数据集中，只需单击数据集详细信息页面上的*生成记录*按钮。位于所选存储桶中且满足数据集条件的文件将自动作为记录添加到数据集中。之前存在的记录保持不变，包括它们的标签，新记录则被添加到数据集中。您可以像本章前面标注记录一样对它们进行标注。\n\
  \n然后，您可以导出新的数据集用于模型构建，以查看其效果是否更好。\n\n**数据标注错误**\n\n当您开始创建数据集时，会创建一个*工作请求*。您可以在“数据标注”和“工作请求”下找到所有工作请求，如图\
  \ 7-28 所示。\n\n![](img/index-264_1.jpg)\n\n![](img/index-264_2.jpg)\n\n第 7 章 数据标注\n\
  \n***图 7-28.** 工作请求列表*\n\n如果您从列表中选择一个工作请求，您可以在*日志消息*页面（如图 7-29 所示）中查看该工作请求期间执行的所有操作。\n\
  \n***图 7-29.** 工作请求的日志消息*\n\n如果工作请求因某种原因失败，并且数据集处于“需要注意”状态，您可以在*错误消息*页面（如图 7-30\
  \ 所示）中查看详细信息。如果您选择“消息”字段右侧的三点菜单，可以选择*查看完整消息*以查看完整的错误消息。\n\n![](img/index-265_1.jpg)\n\
  \n第 7 章 数据标注\n\n***图 7-30.** 工作请求的错误消息*\n\n有时此消息很有用，您能够解决问题。但有时您只需要向 Oracle 支持部门提交支持工单。\n\
  \n一个非常典型的问题是您选择了错误的区间，或者您根本没有足够的权限访问所有必需的资源。或者，可能是存储桶缺失，或者您没有使用它的权限。\n\n也可能是您遇到了某个*限制*。支持的文档文件格式为\
  \ PDF、TIF 和 TIFF，文本支持的格式为 TXT。对于图像，支持的格式为 JPEG、JPG 和 PNG。另外，请注意，创建数据集时，大小超过 6 MB\
  \ 的图像不会被保存。您也可能已经耗尽了资源或配额限制。在图 7-31 中，您可以看到数据标注服务的*限制、配额和使用情况*。如果您为任何限制选择三点菜单，您可以选择*创建配额策略存根*以获取更改配额策略的存根，或者您可以打开一个支持请求。\n\
  \n![](img/index-266_1.jpg)\n\n第 7 章 数据标注\n\n***图 7-31.** 限制、配额和使用情况*\n\n**使用 OCI\
  \ API 通过 APEX 进行数据标注**\n\n如果您更喜欢从 APEX 使用数据标注服务，可以通过 OCI 数据标注 API 来实现。\n\n**数据标注\
  \ API**\n\n数据标注有两个 API：数据标注 API 和数据标注管理 API。*数据标注 API* 用于在图像、文本或文档上创建标注（标签）并生成快照。*数据标注管理\
  \ API* 可用于创建、列出、编辑和删除数据集。在编写本书时，这些 API 的版本是 /20211001。数据标注 API 的文档可以在 [`docs.oracle.com/en-us/iaas/api/#/en/datalabeling-dp/20211001/`](https://docs.oracle.com/en-us/iaas/api/#/en/datalabeling-dp/20211001/)\
  \ 找到，数据标注管理 API 的文档可以在 [`docs.oracle.com/en-us/iaas/api/#/en/datalabeling/20211001/`](https://docs.oracle.com/en-us/iaas/api/#/en/datalabeling/20211001/)\
  \ 找到。\n\n**为数据标注 API 设置 APEX**\n\n首先，如果您还没有创建 IAM 用户，请在 OCI 控制台中创建一个，并将该用户添加到数据标注组（在我们的示例中为\
  \ DataLabelingGroup）。然后，返回\n\n\n\n进入用户的详细信息页面，确保用户已选择 API 密钥。从导航菜单中选择*身份与* *安全*。然后，选择*用户*。从用户列表中选择该用户，进入用户详细信息页面（图\
  \ 7-32）。\n\n![](img/index-267_1.jpg)\n\n第 7 章 数据标注\n\n***图 7-32.** 用户详细信息页面*\n\n\
  点击*编辑用户功能*，并检查*API 密钥*是否已选中（图 7-33）。要限制用户仅能使用 API 密钥与 OCI 资源交互，请取消选中所有其他选项。\n\n\
  **注意** 如果您希望用户能够使用其他方法，请不要限制对 API 密钥的访问。\n\n![](img/index-268_1.png)\n\n![](img/index-268_2.jpg)\n\
  \n第 7 章 数据标注\n\n***图 7-33.** 定义用户功能*\n\n要使用 OCI REST API，需要一对 API 密钥。要获取 API 密钥对，请从用户详细信息页面的左侧选择*API\
