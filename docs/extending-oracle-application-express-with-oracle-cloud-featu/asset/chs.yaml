  \n**数据库内机器学习与 APEX**\n\n由于数据库内机器学习就在数据库中，因此从 APEX 使用 OML 非常容易。例如，你可以根据机器学习模型的预测创建一个新表（或视图），并在\
  \ APEX 中使用它。例如，我们的客户分为家庭客户和公司客户。我们为家庭客户（Household_model）和公司客户（Company_model）分别构建一个模型，以预测他们购买我们产品\
  \ 1 的可能性。然后，我们创建一个表（Household_contacts），其中包含家庭客户的数据、对购买产品 1 的预测（0=不购买，1=购买）以及该预测的概率。在此示例中，我们只选取那些尚未购买产品\
  \ 1（product1 = 0）的客户。我们使用一个模型（Household_model）来提供预测数据。\n\n第 5 章 自治数据库中的 Oracle 机器学习\n\
  \n```sql\nCreate table Household_contacts as\nselect cust_id, PREDICTION (Household_model\
  \ using *) prediction,\nPREDICTION_PROBABILITY(Household_model using *) pred_probability\n\
  from household_customers where product1 = 0;\n```\n\n如果 OML 和 APEX 位于同一个数据库中，你能做的事情将无可限量。如果它们位于不同的数据库中，你可以将模型导出/导入到包含\
  \ APEX 的同一个数据库中，或者使用 Oracle 机器学习 REST 服务。\n\n**总结**\n\nOracle 机器学习可以与三种语言一起使用：SQL、Python\
  \ 和 R。要在 Oracle 数据库中使用这些语言，你需要调用它们的 OML API：OML4SQL、OML4Py 和 OML4R。OML4SQL 包含用于机器学习的数据库包。OML4Py\
  \ 可用于使用 Python 语法和库进行机器学习过程、使用用户自定义函数进行嵌入式 Python 执行，或使用 AutoML 功能。你可以将 Python 对象和数据存储到\
  \ Python 数据存储中，并将用户自定义函数存储到 Python 脚本仓库中。在 OML4Py 数据存储和 Python 脚本仓库中，你可以对它们进行管理和使用。OML4R\
  \ 在 Oracle 自治数据库中尚不可用。\n\nOracle 自治数据库中的 Oracle 机器学习控制台提供了笔记本和 AutoML 等功能。\n\n**第\
  \ 6 章**\n\n**Oracle 机器学习**\n\n**REST 服务**\n\nREST API 提供了另一种在 Oracle 数据库中使用机器学习功能（包括\
  \ Oracle 机器学习和嵌入式 Python 执行）的选项。\n\n**REST API 简介**\n\n\n\n*API* 源自“应用程序编程接口”（Application\
  \ Programming Interface）一词。API 是一组规则，定义了应用程序或设备如何相互连接和通信。\n\n*REST* 是“表述性状态转移”（REpresentational\
  \ State Transfer）的缩写。REST 是一组架构约束，由 Roy Fielding 在其 2000 年的论文中首次提出：[www.ics.uci.](http://www.ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm)\n\
  \n[edu/~fielding/pubs/dissertation/rest_arch_style.htm](http://www.ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm)\n\
  \nREST 既不是一种协议，也不是一种标准。它是一种用于架构和设计 Web 应用程序的风格。开发者可以通过多种方式实现 REST。REST API 通常通过超文本传输协议（*HTTP*）提供服务。换句话说，在\
  \ REST API 的上下文中，HTTP 是一种*契约*、一种通信协议，而 REST 则是一种*概念*。\n\nHTTP 是一种应用层协议。它是一种无状态协议，遵循客户端-服务器模型：客户端和服务器通过交换消息进行通信。客户端打开一个连接以发出*请求*，并等待直到从服务器收到*响应*。\n\
  \n这些请求和响应被称为*HTTP 消息*。\n\n一个请求由*请求行*、可选的*首部行*（后跟 CRLF，即回车和换行）、一个表示首部字段结束的*空行*（后跟\
  \ CRLF），以及可选的*消息体*组成。请求行包含请求的基本信息：HTTP 请求方法、要获取资源的路径（请求 URI），以及所使用的 HTTP 协议版本。例如：\n\
  \nGET /<oml-cloud-service-location-url>/omlmod/v1/api/ HTTP/1.1\n\n© Adrian Png\
  \ 和 Heli Helskyaho 2022\n\nA. Png 和 H. Helskyaho，《使用 Oracle 云功能扩展 Oracle Application\
  \ Express》，\n\n[`doi.org/10.1007/978-1-4842-8170-3_6`](https://doi.org/10.1007/978-1-4842-8170-3_6#DOI)\n\
  \n第 6 章 Oracle 机器学习 REST 服务\n\n有九种 HTTP 请求方法可用于 REST API 调用：GET、HEAD、POST、PUT、DELETE、CONNECT、OPTIONS、TRACE\
  \ 和 PATCH。请求 URI（统一资源标识符）标识了要应用该请求的资源。\n\nHTTP 首部表示与 API 请求或响应相关的元数据。一个*HTTP 首部*由名称-值对组成，名称和值之间用冒号（:）分隔。例如：\n\
  \nAccept-Language: en-us\nAccept-Encoding: gzip, deflate\nContent-Type: application/json\n\
  Accept: application/json\n\n值之前的空格会被忽略。\n\n媒体类型（多用途互联网邮件扩展或 MIME 类型）用于首部中，是互联网上文件格式的两部分标识符。这两部分（类型和子类型）由斜杠（/）分隔。例如：\n\
  \napplication/json\naudio/mpeg\nimage/png\n\n多部分类型表示复合文档：即属于同一事务的多个独立文件。有两种多部分类型：message\
  \ 和 multipart。*Message* 封装其他消息，而 *multipart* 由多个组件组成，每个组件可能具有不同的媒体类型。例如：\n\nmessage/rfc822\n\
  multipart/form-data\n\n你可以在 [www.iana.org/assignments/media- types/](http://www.iana.org/assignments/media-types/media-types.xhtml)\
  \ 查看所有已定义的媒体类型。\n\n[media- types.xhtml](http://www.iana.org/assignments/media-types/media-types.xhtml)。\n\
  \nCookie 数据也在 HTTP 首部内传输。HTTP 协议是无状态的，但 *HTTP cookies* 通过允许在每个 HTTP 请求上创建会话以共享相同的上下文或状态，使得使用有状态会话成为可能。\n\
  \n一个空行表示首部部分结束，可选的消消息体开始。消息体承载了你想要获取的实际 HTTP 请求数据。消息数据的内容取决于将要被调用的服务。例如，如果服务需要客户\
  \ ID 作为参数才能返回响应，那么客户 ID 就在请求消息的消息体部分中给出。\n\n\n\n第六章 Oracle 机器学习 REST 服务\n\n一个响应包含\
  \ HTTP 协议版本、状态码、状态消息、HTTP 标头，以及可选地包含所获取资源的正文。\n\n*HTTP 响应状态码* 用于指示特定 HTTP 请求是否已成功完成，或者是否出现错误。响应分为五类：\n\
  \n• 信息响应 (100–199)\n• 成功响应 (200–299)\n• 重定向消息 (300–399)\n• 客户端错误响应 (400–499)\n•\
  \ 服务器错误响应 (500–599)\n\n你可以从 [`developer.mozilla.org/zh-CN/`](https://developer.mozilla.org/en-US/docs/Web/HTTP/Resources_and_specifications)\
  \ [docs/Web/HTTP/Resources_and_specifications](https://developer.mozilla.org/en-US/docs/Web/HTTP/Resources_and_specifications)\
  \ 了解更多关于 HTTP 的信息。\n\nREST API 请求可能需要在服务器端验证对资源的授权。一种选择是使用 *OAuth 2.0*。OAuth 2.0\
  \ 是一种开放标准的授权协议，使用访问令牌进行授权。令牌的理念是，你可以在不提供凭证的情况下获得对服务的访问权限。你首先进行身份验证以获取令牌，然后使用该令牌调用服务。访问令牌可以是持有者令牌或发送者约束令牌。*持有者令牌*\
  \ 意味着任何持有该令牌的人都可以使用它。如果你丢失了它，任何人都可以使用它。*发送者约束令牌* 只能由*有权*使用它的人使用。它就像一张航空登机牌：允许从 A\
  \ 地到 B 地的航班，但仅限对其有效的人使用。登机牌上的姓名必须与护照上的姓名匹配，护照上的照片必须与客户的面部匹配。在 OAuth 2.0 中，这通常通过加密密钥解决方案来实现。\n\
  \n要获取令牌，你必须首先进行身份验证。有几种用于身份验证的 OAuth *授权类型*。例如：\n\n• authorization_code（授权码授权）\n\
  • client_credentials（客户端凭证授权）\n• password（资源所有者密码授权）\n• urn:ietf:params:oauth:grant-type:device_code（设备授权）\n\
  \n第六章 Oracle 机器学习 REST 服务\n\n授权类型指的是身份验证方法。例如，客户端凭证授权使用客户端 ID 和客户端密钥在用户上下文之外接收令牌。密码授权将用户的凭证（用户名、密码）交换为访问令牌，以便使用该用户的凭证访问资源。密码授权已被弃用，但在\
  \ OML REST API 中仍在使用。\n\n使用其中一种授权类型进行身份验证后，你将获得授权令牌，并准备好使用该服务。授权通常有一个过期时间，过期后你需要获取一个新令牌。\n\
  \n**OML REST 服务简介**\n\nOracle 机器学习服务的 REST API 提供了托管在 Oracle 自治数据库上的 REST API 端点，用于使用\
  \ Oracle 机器学习功能，例如，创建和存储机器学习模型以及为模型创建评分端点。OML 服务的 REST API 支持 OML 模型和开放神经网络交换（ONNX）格式模型。ONNX\
  \ 是用于机器学习互操作性的开放标准。嵌入式 Python 执行的 REST API 使你能够执行存储在 Python 脚本仓库的自治数据库中的用户自定义 Python\
  \ 函数，或使用存储在 OML4Py 数据存储中的 Python 对象。\n\n要能够使用 REST 服务，你需要一个身份验证令牌。你从自治数据库的 `/omlusers`\
  \ 端点检索令牌，然后使用此用户令牌和 REST API 端点中的操作，调用 Oracle 数据库中的机器学习功能。\n\n**Oracle 机器学习服务的 REST\
  \ API**\n\nOracle 机器学习服务的 REST API 通过托管在 Oracle 上的 `/omlmod/` REST API 端点提供对数据库内机器学习的访问。\n\
  \n\n\n自治数据库。Oracle 机器学习服务的 REST API 支持\n\nOracle 机器学习模型和开放神经网络交换（ONNX）格式\n\n模型。ONNX\
  \ 是用于机器学习互操作性的开放标准。您可以\n\n从 [`onnx.ai/`](https://onnx.ai/) 了解更多信息。\n\n第 6 章 Oracle\
  \ 机器学习 REST 服务\n\nOracle 机器学习支持的机器学习模型类型（机器学习函数）例如有分类、回归、聚类和特征\n\n提取。对于 ONNX 格式模型，支持的机器学习模型函数\n\
  \n是分类、回归和聚类。ONNX 分类还包括\n\n图像模型。\n\nOML 的主要优势（除了增强的安全性和更多功能之外）在于所有\n\n与数据相关的繁重工作都在数据库内部完成，并且所有数据库功能都可用于此。Oracle\
  \ 机器学习甚至支持分区模型。您可以以最有用的方式拆分数据，并为数据集的不同数据拆分构建不同的模型。\n\n*OML REST 服务* 由四种类型的 API 组成：通用、存储库、\n\
  \n部署和认知文本。*通用* 端点返回关于 OML 服务 API 所有可用版本的元数据、OML 服务的 Open API 规范（JSON\n\n格式）以及 OML\
  \ 服务 API 版本 1 的元数据。*存储库* 端点处理与机器学习模型相关的数据。例如，您可以使用这些端点\n\n获取模型详细信息或删除模型。*部署* 端点允许您例如创建或删除模型端点、获取模型端点的详细信息或使用端点对模型进行评分。*认知文本*\
  \ 端点包括诸如从文本中查找最相关的关键词、主题或情感分析等功能。\n\n使用 Oracle 机器学习服务 REST API，您可以对 Oracle 机器学习和\
  \ ONNX 格式模型执行多项\n\n功能。您可以\n\n• 获取关于 OML 服务 API 所有可用版本的元数据\n\n• 获取 OML 服务的 Open API\
  \ 规范（JSON 格式）\n\n• 获取 OML 服务 API 版本 1 的元数据\n\n• 存储、删除和列出已部署的模型\n\n• 检索模型的元数据、信息或内容\n\
  \n• 在命名空间下组织模型\n\n• 创建、删除和列出模型端点\n\n• 获取端点的详细信息，或使用模型端点进行评分\n\n• 获取模型端点的 Open API\
  \ 3.0 (Swagger) 文档\n\n第 6 章 Oracle 机器学习 REST 服务\n\n• 获取 OML 服务提供的所有认知文本端点\n\n• 获取最相关的关键词或主题\n\
  \n• 获取提供的文本字符串列表的数值特征、语义相似度、情感或\n\n摘要\n\n您可以在此处找到所有这些 REST 端点：[`docs.oracle.com/en/`](https://docs.oracle.com/en/database/oracle/machine-learning/omlss/omlss/rest-endpoints.html)\n\
  \n[database/oracle/machine- learning/omlss/omlss/rest- endpoints.html](https://docs.oracle.com/en/database/oracle/machine-learning/omlss/omlss/rest-endpoints.html)。\n\
  \n支持的请求方法是 GET、POST 和 DELETE，HTTP 请求行的 URL 结构\n\n形式为\n\nhttps://<oml-cloud-service-location-url>.oraclecloudapps.com\n\
  \n其中 oml-cloud-service-location-url 由租户 ID、数据库名称\n\n和区域组成。\n\nOML 服务 REST API 支持在\
  \ HTTP 请求或响应的标头部分传递以下标头：\n\n• Authorization\n\n• Location\n\n• Content-Type。\n\n\
  在 REST API 中，媒体类型是请求或响应消息体数据的格式。\n\nOML 服务 REST API 支持的媒体类型是\n\n• application/json\n\
  \n• multipart/form-data\n\n• application/octet-stream。\n\n**用于嵌入式 Python 执行的 REST\
  \ API**\n\n用于嵌入式 Python 执行的 REST API 可用于使用 REST 客户端在\n\nOracle 自治数据库中执行 Python 代码。它调用存储在\
  \ Python 脚本存储库中的命名脚本中的用户定义函数 (UDF) 或存储在 Oracle 自治数据库的 OML4Py 数据存储中的 Python 对象。您可以找到所有\n\
  \n\n\n端点信息请参考[此处：https://docs.oracle.com/en/database/oracle/machine-](https://docs.oracle.com/en/database/oracle/machine-learning/oml4py/1/mlepe/rest-endpoints.html)\n\
  \n[learning/oml4py/1/mlepe/rest- endpoints.html.](https://docs.oracle.com/en/database/oracle/machine-learning/oml4py/1/mlepe/rest-endpoints.html)\n\
  \n第 6 章 Oracle Machine Learning REST 服务\n\n要开始使用，您需要先通过 .../omlusers/ 获取一个令牌，然后使用该令牌调用\
  \ .../api/py-scripts/ 上的 REST API。这些 REST API 位于自治数据库中，并使用令牌来验证 Oracle Machine Learning\
  \ *用户*的身份。令牌通过提供用户的用户名和密码来获取，且仅在有限时间内有效。\n\n在执行 REST API 嵌入式 Python 执行功能时，您可以通过可选的\
  \ service 参数指定要使用的自治数据库服务级别。不同的服务名称可为 Oracle 自治数据库提供不同级别的性能和并发能力。可用的服务名称包括 LOW、MEDIUM\
  \ 和 HIGH。\n\n对嵌入式 Python 执行端点的 REST API 执行操作时，会使用标准的 HTTP 方法请求。支持的 HTTP 方法请求包括 GET、HEAD\
  \ 和 POST。嵌入式 Python 执行的 REST API 支持 application/json 媒体类型，以及可在 HTTP 请求或响应的标头部分传递的以下标头：\n\
  \n• Accept-Encoding\n• Content-Encoding\n• Content-Type\n\n响应消息始终包含一个状态码，用于表示请求是否成功。响应消息返回的状态码包括：\n\
  \n• 200 OK\n• 201 Created\n• 202 Accepted\n• 302 Found\n• 400 Bad Request\n• 401\
  \ Unauthorized\n• 500 Internal Server\n\n嵌入式 Python 执行功能端点的 REST API 调用默认模式为同步模式，但您也可以利用这些状态码以异步方式使用它。将\
  \ async Flag 参数设置为 true 来调用脚本执行函数。然后，使用该函数返回的作业 ID 获取作业的状态码。状态码 202 表示作业正在等待处理，302\
  \ 表示作业已完成。当作业完成时，返回信息中还包含一个 Content-Location 标头。请使用该标头获取脚本的结果。\n\nREST API 包含三种类型的任务：*获取版本元数据*、*列出脚本*和*执行脚本*。获取版本元数据\
  \ REST 端点返回有关 API 版本的元数据。列出脚本 REST 端点返回 Python 脚本存储库中可用的脚本列表。执行脚本 REST 端点以类似于本章“OML4Py\
  \ 部分中的 OCI 内数据库 Oracle Machine Learning”中所述的方式，执行 Python 脚本存储库中的脚本。/api/py-scripts/v1/\
  \ 端点具有多个用于执行用户定义函数的操作：\n\n• do-eval，用于执行一个 Python 函数；您可以选择指定脚本的所有者。\n• table-apply，用于对指定数据执行一个\
  \ Python 函数；您可以选择指定脚本的所有者。\n• group-apply，用于对分组数据执行一个 Python 函数；您可以选择指定脚本的所有者。\n\
  • index-apply，用于多次执行一个函数；您可以选择指定脚本的所有者。\n• row-apply，用于对数据行块执行一个 Python 函数；您可以选择指定脚本的所有者。\n\
  • jobs，用于检索异步作业的状态或结果。\n\n**使用 OML REST 服务**\n\n要能够使用 OML REST 服务，您需要一个 REST 客户端、一个令牌以及用于发送请求的端点。\n\
  \n**安装和设置 REST 客户端 (cURL)**\n\n您需要一个 REST 客户端来使用 REST API。可以使用任何 REST 客户端，但在本例中，我们将使用\
  \ cURL。要安全地连接到服务器，您必须拥有支持 SSL 的 cURL 版本，并提供 SSL 证书颁发机构 (CA) 证书文件或捆绑包，以针对 Verisign\
  \ CA 证书进行身份验证。\n\n\n\n第 6 章 Oracle 机器学习 REST 服务\n\n如果你尚未安装，请按照以下步骤操作：\n\n1.  使用浏览器导航到\
  \ cURL 主页[`curl.haxx.se`](http://curl.haxx.se)，然后点击页面顶部菜单中的“下载”。\n\n2.  选择正确的 cURL\
  \ 版本。\n\n3.  点击链接下载 ZIP 文件，并安装该软件。\n\n4.  导航到 cURL CA 证书页面[`curl.haxx.se/docs/caextract.html`](http://curl.haxx.se/docs/caextract.html)。\n\
  \n5.  下载`ca-bundle.crt` SSL CA 证书包（*cacert.pem*）。\n\n6.  将其保存在你安装 cURL 的同一文件夹中。\n\
  \n7.  打开一个命令窗口（命令提示符）。\n\n8.  导航到你安装 cURL 的目录。\n\n9.  将 cURL 环境变量`CURL_CA_BUNDLE`设置为\
  \ SSL 证书颁发机构（CA）证书包的位置。例如：\n\n    `C:\\Curl> set CURL_CA_BUNDLE=ca-bundle.crt`\n\
  \n**创建访问令牌**\n\n要使用 REST API 访问 OML 服务，你必须提供一个访问*令牌*。获取 REST 身份验证令牌的 URL，如图[5-12](https://doi.org/10.1007/978-1-4842-8170-3_5#Fig12)所示。要完成身份验证并获取访问令牌，请使用\
  \ cURL。\n\n`-d`选项用于传递用户名和密码。用户名是本章前面创建的自治数据库 OML 用户的用户名。\n\n令牌是使用 OML REST URL（我们称之为：“使用此\
  \ URL 获取 OML 提供的 REST API 的 REST 身份验证令牌”）并附加`api/oauth2/v1/token`来获取的。\n\n第 6 章\
  \ Oracle 机器学习 REST 服务\n\n语法如下所示：\n\n`curl -X POST --header \"Content-Type: application/json\"\
  \ --header \"Accept: application/json\" -d \"{\"grant_type\":\"password\", \"username\"\
  :\"' **MyUser**'\", \"password\":\"' **MyPassword**'\"}\" \" **<oml-cloud-service-location-url>**\
  \ /omluser/api/oauth2/v1/token\"`\n\n编辑脚本中的用户名、密码和 URL。转到命令提示符，并导航到你安装 cURL 的文件夹。执行该脚本。复制令牌并将其保存在安全的地方。请注意，令牌仅在规定时间内有效。响应消息中包含过期时间。\n\
  \n然后，使用该令牌发送请求。例如，要获取已部署的现有模型，请编辑`<oml-cloud-service-location-url>`，将令牌复制/粘贴到`addTokenHere`，然后运行以下代码：\n\
  \n`curl --location --request GET \"https://**<oml-cloud-service-location-url>**/omlmod/v1/models\"\
  \ --header \"Authorization: Bearer **addTokenHere**\"`\n\n或者，你可以请求某个端点的 Open API\
  \ 规范（Swagger）文档：\n\n`curl --location --request GET \"https://**<oml-cloud-service-location-url>**/omlmod/v1/api\"\
  \ --header \"Authorization: Bearer **addTokenHere**\"`\n\n你可以通过向路径添加部署和 uri，并编辑\
  \ uri 的值来调用任何端点：`/omlmod/v1/deployment/{uri}/api`。这将返回该端点的 Open API 规范（Swagger 文档）。\n\
  \n要从数据库中查询已注册的现有 Python 脚本：\n\n`curl -i -X GET --header \"Authorization: Bearer\
  \ eyJhbGciOiJSUz...=\" --header \"Accept: application/json\" https://**<oml-cloud-service-location-url>**/oml/api/py-scripts/v1/scripts`\n\
