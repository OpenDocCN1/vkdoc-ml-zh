  **从 APEX 调用 API 网关**


  部署后，API 网关端点只是一个 REST 端点，APEX 开发人员可以使用包 APEX_WEB_SERVICE 在 PL/SQL 中调用它。API 网关使 APEX
  无需实现代码来验证和调用 Oracle Functions 端点。前面介绍的 IAM 策略授权 API 网关代表 REST 客户端调用函数。


  我们部署的 Oracle Functions 函数期望以下内容：


  • 一个请求负载，包含一个 JSON 对象，该对象具有一个属性 text，其值包含要翻译的英文文本


  • 一个 HTTP 头变量 X_TO-LANG，其值为两个字母，定义 LibreTranslate 将文本翻译成的目标语言


  第 4 章 使用 API 网关暴露功能


  API 网关中继 APEX 发送的负载，并注入函数所需的任何 HTTP 头变量和查询参数。然后，默认的 Oracle Functions 函数处理程序通过 input
  和 ctx 参数使其可用。


  async function functionHandler(input, ctx) {


  ...


  }


  尽管文档 ([`github.com/fnproject/docs/tree/master/`](https://github.com/fnproject/docs/tree/master/fdks/fdk-node)


  [fdks/fdk- node](https://github.com/fnproject/docs/tree/master/fdks/fdk-node)) 说明可以通过使用代码
  ctx.protocol.header(key) 访问 HTTP 头变量，但 API 网关似乎以不同的方式填充 ctx 对象。通过为函数启用 OCI 日志记录和一些调试代码，可以识别注入的
  HTTP 头变量的位置。在这里，我们发现可以通过访问 ctx._headers 数组并使用键 Fn-Http-H-X-To_Lang 来引用 X-TO_LANG。


  if (ctx._headers["Fn-Http-H-X-To-Lang"]) {


  toLanguage = ctx._headers["Fn-Http-H-X-To-Lang"].toString();


  }


  了解了 API 网关和 Oracle Functions 如何协同工作后，我们现在准备创建 APEX 应用程序和组件来使用其服务：


  1\. 创建一个页面（图 4-14）并添加三个页面项：


  • **P1_TEXT**: 一个文本字段，用于输入需要翻译的英文文本。


  • **P1_TO_LANG**: 一个单选按钮组，用于设置目标语言，当选择日语和西班牙语时，分别设置为值“ja”和“es”。


