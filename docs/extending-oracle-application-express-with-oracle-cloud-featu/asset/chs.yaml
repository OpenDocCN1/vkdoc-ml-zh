  **用于语言翻译的 Oracle 函数**


  设置语言翻译系统的下一步是部署一个无服务器函数，该函数将处理 HTTP 请求负载并返回翻译后的文本。HTTP 请求和响应负载都将是 JSON 格式。


  示例请求体：


  { "text": "Good morning" }


  示例响应体：


  { "translatedText": "おはようございます" }


  有关为 Oracle Functions 设置 OCI 租户的详细信息已在第 [4](https://doi.org/10.1007/978-1-4842-8170-3_4)
  章中讨论。在继续部署 *translate* 函数之前，请确保您的租户和开发人员的工作站已正确配置。以下是一个快速检查清单：


  • 在 OCI 租户上：


  • 已创建或定义所需的 *身份和访问管理* (IAM) 用户、组和策略


  • 已创建 VCN 和目标子网


  • 在开发人员的工作站上：


  • 已安装 Docker、OCI CLI 和 Fn Project CLI


  • 已生成 API 密钥并在 OCI 上注册


  • 已配置 OCI 配置文件和 Fn 上下文


  无服务器函数将使用以下文件部署：


  translate


  ├── func.js


  ├── func.yaml


  ├── package.json


  └── package-lock.json


  回顾一下，func.js 文件包含实现 *Function Development Kit* (FDK) 处理程序代码的 Node.js 代码，该代码在每次调用函数时执行。


  第 4 章 使用 API 网关暴露功能


  func.yaml 文件包含有关函数的元数据，而 package.json 文件包含 Node.js 应用程序的元数据，包括其依赖项。


  使用您可以通过 OCI 控制台获取的目标子网的 OCID 设置环境变量 SUBNET_OCID。然后，使用 Fn Project CLI 命令创建 Oracle
  Functions 应用程序：


  fn create app ch05 --annotation \


  oracle.com/oci/subnetIds=[\"$SUBNET_OCID\"]


  从项目的根目录部署函数：


  fn deploy -v --app ch05


  Fn Project CLI 将构建 Docker 镜像，将其部署到 OCI *容器注册表* (OCIR)，然后注册函数。完成后，运行以下命令以设置 LIBRE_SERVER_URL
  参数。将占位符 COMPUTE_INSTANCE_ID 替换为已部署 LibreTranslate 的计算实例的 IP 地址。


  fn config function ch05 translate \


  LIBRE_SERVER_URL http://<COMPUTE_INSTANCE_IP>:8080/translate


  **用于语言翻译的 API 网关**


  要创建和配置的最后一个 OCI 资源是 API 网关。回顾一下，API 网关需要分配一个 VCN 子网。如果资源要通过互联网访问，则必须将其附加到公共子网。这必须在创建之前决定，之后无法更改。


  在创建资源之前，还需要执行一些与安全相关的任务，接下来将讨论这些任务。


  **IAM 策略**


  为了使 API 网关能够调用 Oracle Functions，必须使用 IAM 策略语句授予服务必要的权限。创建新策略或将所需的语句添加到现有策略。


  第 4 章 使用 API 网关暴露功能


  需要以下语句：


  Allow any-user to use functions-family in compartment <COMPARTMENT_NAME>


  where all {request.principal.type= ''ApiGateway'', request.resource.


  compartment.id = ''<COMPARTMENT_OCID>''}


  将占位符 COMPARTMENT_NAME 替换为 Oracle Functions 已部署到的区间的名称。对于 COMPARTMENT_OCID，将其替换为
  API 网关所在区间的 OCID。


  **网络安全组**


  API 网关始终与 VCN 子网关联，该子网可以是私有的或公共的。无论如何，资源将需要允许端口 443（用于安全 Web 流量的标准端口）上的 TCP 流量的网络安全规则。


  创建一个具有以下规则的 NSG：


  1\. 规则 1：


  a.


  **方向**: 入站


  b.


  **源类型**: CIDR


  c.


  **源 CIDR**: 0.0.0.0/0


  d.


  **IP 协议**: TCP


  e.


  **源端口范围**: *空白*


  f.


  **目标端口范围**: 443


  2\. 规则 2：


  a.


  **方向**: 出站


  b.


  **源类型**: CIDR


  c.


  **源 CIDR**: 0.0.0.0/0


  d.


  **IP 协议**: All Protocols


