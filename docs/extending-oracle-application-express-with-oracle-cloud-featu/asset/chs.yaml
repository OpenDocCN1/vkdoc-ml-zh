  **重要** 如果您的工作站上安装了 Node.js，您可以使用 npm 命令搜索、安装依赖项并将其保存在 package.json 中。例如，要安装 oci-sdk
  模块，请运行命令 npm install --save oci-sdk。这将创建 node_modules 目录，其中包含从已安装包下载的代码。如果在项目目录中找不到该目录，Oracle
  Functions 会在构建过程中运行 npm install 命令。如果存在，它将被复制到部署的 Docker 镜像中。需要注意的是，这可能包含依赖于操作系统
  (OS) 的二进制文件，这些二进制文件可能与无服务器函数将运行的目标操作系统不兼容。我建议在部署之前删除整个 node_modules 目录。


  Oracle Functions 由一个应用程序组成，该应用程序由一组 Functions 组成。两者都可以使用 OCI 控制台或 Fn Project CLI
