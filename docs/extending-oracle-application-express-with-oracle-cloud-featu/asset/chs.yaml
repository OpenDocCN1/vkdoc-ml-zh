  \n**保险库、密钥和机密**\n\n如果您想使用自治数据库中的表作为机器学习模型创建的数据源，您还应该设置好保险库、密钥和机密。如果您仅使用对象存储桶和本地文件作为数据源，则可以跳过此步骤。要完成所有这些操作，您需要拥有管理保险库和密钥的权限，或者应请管理员为您执行此操作。\n\
  \n*保险库*是一个存储所有类型机密信息的地方，这些信息涉及访问 OCI 中任何资源的身份验证详细信息。您无需在配置文件或代码中显示任何身份验证详细信息，只需安全地从保险库中使用即可。保险库是\
  \ OCI 中的一项托管云服务。它为*机密*提供了一个安全存储。您可以将密码、钱包、证书、SSH 密钥或身份验证令牌（您在配置文件中使用这些信息）作为机密存储在\
  \ OCI 保险库中。当您需要访问资源或其他服务时，可以从保险库中检索这些机密。*主加密密钥*用于加密机密信息。\n\n**创建*保险库***\n\n1. 从\
  \ OCI 控制台导航菜单中选择*身份与安全*，然后选择*保险库*。\n\n第 8 章 异常检测\n\n2. 选择所需的区间，然后单击*创建保险库*。\n\n\
  3. 检查区间是否正确，并为保险库输入*名称*。\n\n4. 单击*创建保险库*。\n\n然后，您需要创建一个*密钥*。为此：\n\n1. 选择您刚刚创建的保险库以进入*保险库详细信息*页面。\n\
  \n2. 在*资源*中导航到*主加密密钥*。\n\n3. 在主加密密钥中，单击*创建密钥*。\n\n4. 定义*保护模式*：HSM 或软件。选择 HSM。\n\n\
  5. 定义*密钥名称*。\n\n6. 选择*密钥形状：算法*。这是密钥加密、解密、签名或验证数据的数学机制。不同的算法用于不同的目的。支持的算法包括高级加密标准\
  \ (AES)、Rivest–Shamir–Adleman (RSA) 和椭圆曲线加密数字签名算法 (ECDSA)。AES 是默认算法。选择它。\n\n7. 选择*密钥形状：长度*的值。默认值为\
  \ 256 位。选择它。\n\n8. 单击*创建密钥*。\n\n然后，我们需要创建所有必需的机密。要创建机密：\n\n1. 在*保险库详细信息*页面中，导航到*资源*中的*机密*。\n\
  \n2. 单击*创建机密*。\n\n3. 提供如图 8-12 所示的以下详细信息：\n\na. *区间*：检查所选的区间是否正确。机密不必与保险库位于同一区间。\n\
  \nb. *名称*：机密的唯一名称。\n\nc. *描述*：机密的描述。\n\n![](img/index-293_1.jpg)\n\n第 8 章 异常检测\n\
  \nd. *加密密钥*：从列表中选择您刚刚创建的加密密钥。此密钥将用于加密机密。如果找不到，请检查区间是否正确。如果不正确，请单击*更改区间*并从列表中选择正确的区间。\n\
  \ne. *机密类型模板*：纯文本或 Base64。选择纯文本。\n\nf. *机密内容*：输入异常检测用户的密码。\n\ng. 单击*创建机密*。\n\n***图\
  \ 8-12.** 创建机密*\n\n现在，异常检测用户的密码已存储在 OCI 保险库中，并可在需要时从中使用。\n\n要连接到自治数据库，仅有用户名和密码是不够的；您还需要定义*连接详细信息*。连接信息也可以作为机密存储在保险库中。\n\
  \n首先，您需要获取*钱包*。在 OCI 控制台中，选择 Oracle 数据库，自治数据库。然后从自治数据库列表中选择您的数据库。在自治数据库详细信息页面（图\
  \ 8-13）中，单击*数据库连接*。\n\n![![](img/index-294_2.png)\n\n第 8 章 异常检测\n\n***图 8-13.**\
  \ 自治数据库详细信息页面*\n\n然后，如图 8-14 所示，选择*实例钱包*作为钱包类型，并单击*下载钱包*。\n\n***图 8-14.** 下载钱包*\n\
  \n![](img/index-295_1.png)\n\n第 8 章 异常检测\n\n钱包需要一个密码。如图[8-15 所示定义密码，并单击*下载*。将 ZIP\
  \ 文件保存到安全位置。单击*关闭*。\n\n***图 8-15.** 为钱包定义密码*\n\n由于钱包由多个文件组成，我们将对所有文件进行 base64 编码。将\
  \ wallet.zip 文件解压到本地计算机上的一个文件夹中。您可以使用任何 Base64 编码器，例如[www.base64encode.org/](http://www.base64encode.org/)。每次将一个文件（README.txt\
  \ 除外）拖放到编码器中，单击 ENCODE，并将编码后的文件保存到安全位置。例如，将文件 cwallet.sso 拖放到编码器，单击 ENCODE，下载编码后的文件，并将其保存为例如\
  \ encoded_cwallet_sso.txt。当您对 wallet.zip 文件中的所有文件都执行此操作后，您的本地文件夹应类似于图 8-16。\n\n\
  ![](img/index-296_1.png)\n\n第 8 章 异常检测\n\n***图 8-16.** 钱包文件及其编码版本*\n\n然后，为每个文件创建一个*机密*，如图\
  \ 8-17 所示：1. 在*保险库详细信息*页面中，导航到*资源*中的*机密*。\n\n2. 单击*创建机密*。\n\n3. 提供所需信息：区间、名称、描述和加密密钥。\n\
  \n4. 选择*Base64*作为*机密类型*。\n\n5. 将编码文件的内容粘贴到*机密内容*字段。\n\n6. 单击*创建机密*。\n\n![](img/index-297_1.jpg)\n\
  \n第 8 章 异常检测\n\n***图 8-17.** 为钱包文件创建机密的示例*\n\n按照相同的过程为您本地计算机上钱包文件夹中的所有文件创建机密。\n\n\
  当我们创建钱包时，我们为其定义了一个*密码*。此密码也应作为机密存储。按照本章前面为 AnomalyDetectionUser 密码执行的相同过程，创建一个机密。\n\
  \n现在，您的机密列表应类似于图 8-18。等待所有机密处于活动状态，以便可供使用。\n\n![](img/index-298_1.jpg)\n\n![](img/index-298_2.jpg)\n\
  \n第 8 章 异常检测\n\n***图 8-18.** 机密列表*\n\n一个机密可以有多个*版本*。例如，如果密码更改，您也需要更新机密。这可以通过创建机密的新版本来完成。从机密列表中选择该机密。在*机密详细信息*页面中，从*表范围*中选择*版本*，如图\
  \ 8-19 所示。单击*创建机密版本*。更新数据（例如密码），然后单击*创建机密版本*。\n\n***图 8-19.** 显示机密版本的机密详细信息页面*\n\
  \n您还可以为机密定义规则。有两种规则类型：\n\n1. *机密重用规则*：防止在机密的不同版本之间重用机密内容。有两个配置选项：*对已删除的机密版本强制执行*和*不对已删除的机密版本强制执行*。\n\
  \n2. *机密过期*：定义版本的过期时间间隔，以及内容检索是否在过期时被阻止。\n\n![](img/index-299_1.jpg)\n\n第 8 章 异常检测\n\
  \n\n\n要定义规则，请在“**机密详细信息**”页面上选择“*规则*”作为“*表范围*”。单击“*编辑规则*”。然后从列表中选择规则类型，如图 8-20 所示，并定义规则的配置。\n\
  \n***图 8-20.** 编辑机密的规则*\n\n同时确保用户有权访问已创建的 Vault 及其内容。策略\n\n可能如下所示：\n\n允许动态组 AnomalyDetectionDynamicGroup\
  \ 读取 compartment Heli 中的 secret-family\n\n如果您的 Autonomous Database 配置了*私有端点*，则需要为异常检测服务配置私有端点。导航至异常检测中的私有端点\n\
  \n，如图 8-21 所示，单击*创建私有端点*，填写所需信息，然后单击*创建*。\n\n![](img/index-300_1.jpg)\n\n第 8 章 异常检测\n\
  \n***图 8-21.** 私有端点列表及创建新私有端点的按钮*\n\n在向 OCI 创建不同类型的对象时，您通常需要选择\n\n“正确”的 compartment。此决策很重要，因为它会影响例如\n\
  \n云租户的架构、安全性和可维护性。在此示例中，\n\n我们为常规围墙信息创建了机密到 Compartment Heli，并将\n\n特定于异常检测的机密创建到\
  \ AnomalyDetection Compartment。您最终可能会\n\n得到不同的解决方案。\n\n**异常检测服务**\n\n异常检测服务由*项目*、*模型*、*数据资产*和*检测*组成。\n\
  \n*项目*是用于组织数据资产、模型和检测的工作空间。*数据资产*是一种抽象的数据格式，包含用于模型训练的实际数据集的元数据。数据资产可以从位于 Oracle\
  \ Object Storage、Oracle Autonomous Transaction Processing 或 InfluxDB 中的数据创建。*模型*是一个机器学习模型，它已使用数据资产进行训练，以检测时间序列数据中的异常。大多数参数由服务调整；只有少数参数留给用户定义。当模型成功训练后，它会自动部署到云环境中。然后，该模型可用于从新数据集中*检测*异常。一个项目可以有多个数据资产和多个模型。\n\
  \n**数据要求**\n\n使用异常检测服务时，对数据集有严格的要求，\n\n因为它是一个自动化的异常检测过程。这些要求使得\n\n模型能够学习什么是“正常”，这是一种识别异常数据的能力。数据集的内容必须非常好：\n\
  \n第 8 章 异常检测\n\n• 训练数据集不应包含异常。\n\n• 所有不同的典型业务场景都应包含在\n\n训练数据集中。\n\n异常检测服务使用两种类型的机器学习内核：*多变量*\n\
  \n和*单变量*内核。前者用于多变量相关信号，后者用于单变量独立信号。单变量异常检测在每个单独的指标中查找异常，而多变量异常检测为系统中的所有指标构建单个模型。单变量内核一次只处理一个信号，因此无法处理多个信号之间的集体异常。\n\
  \n异常检测服务的核心算法使用多变量状态\n\n估计技术 (MSET) 和一种称为 MSET2 的多变量异常检测算法。此算法由 Oracle Labs 创建。使用\
  \ MSET2 算法时，对数据集的要求是信号之间的相关性\n\n应相对较高。多变量内核会排除相关性较低的信号，并\n\n切换到单变量内核以构建所有单变量模型。单变量内核\n\
  \n使用基于窗口的特征工程方法；因此，为了学习模式\n\n或推断异常，它需要在实际数据之前额外有一个窗口大小的数据。\n\n\n\n训练或检测数据。默认情况下，窗口大小为\
  \ 20 个时间戳。时间戳的\n\n最小总数为 80。单变量模型不会检测\n\n小于窗口大小的数据片段中的异常，因此当数据集大小是窗口大小的倍数时，可获得最佳结果。单变量核无法在\n\
  \n异常检测服务中单独调用。它仅由多变量核自动调用。\n\n异常检测服务支持包含*时间序列*数据的 *CSV* 和 *JSON* 文件格式：时间戳和数值属性。该服务还支持来自自治事务处理数据库和\
  \ InfluxDB 的数据。这些数据源\n\n在数据集内容方面有类似的要求。数据集中的每一行\n\n代表在给定时间戳对属性的一个*观测值*。通常，第一列包含时间戳，其后是其他数值属性。这些其他属性通常是传感器或信号数据。\n\
  \n**注意**：属性（时间戳除外）只能包含*数值*。所使用的算法无法理解其他数据类型。如果数据集中需要布尔标志值，\n\n则必须将其转换为数值。\n\n第 8\
  \ 章 异常检测\n\n时间戳属性是可选的。但是，如果为某一行提供了时间戳，\n\n则必须为所有行提供时间戳。时间戳属性必须命名为 *timestamp*（全小写，无空格），并且必须是数据集的第一个属性。\n\
  \n数据集中的时间戳必须按递增顺序排序，并且不允许重复。\n\n时间戳可以有不同的频率。例如，1 小时内 100 000\n\n个观测值，下一小时 10 个观测值。时间戳必须遵循\n\
  \nISO 8601 格式。最佳实践是使用精确到秒或\n\n毫秒的时间。\n\n数据集中的属性还有其他一些要求。属性\n\n名称必须*唯一*。属性数量上限为 300。属性的值可以缺失，但在这种情况下，必须表示为\
  \ null。整行不能所有值都缺失；至少有一个属性必须有值。\n\n任何属性都不能命名为 MSET。同样重要的是，为数据集选择的属性\n\n必须恰当：它们应涵盖业务场景，\n\
  \n且所有属性都具有完整的值范围。\n\n*CSV 格式数据*必须由逗号分隔的行组成，第一行为标题，其他行为数据。每列代表一个属性数据；每行\n\n代表特定时间戳的一个观测值。如果数据中指定了时间戳，则第一列必须命名为\n\
  \n*timestamp*。允许使用 null 表示缺失值，仅允许数值数据类型值，并且数据按时间戳排序。最后\n\n一行不能是空行；它必须是一个观测值。\n\n\
  类似地，*JSON 格式数据*也必须仅包含时间戳和数值\n\n属性。请使用以下键：\n\n{ \"requestType\": \"INLINE\",\n\n\"\
  signalNames\": [\"sensor1\", \"sensor2\", \"sensor3\", \"sensor4\", \"sensor5\"\
  ,\n\n\"sensor6\", \"sensor7\", \"sensor8\", \"sensor9\", \"sensor10\"],\n\n\"data\"\
  : [\n\n{ \"timestamp\" : \"2021-01-01T08:01:01.000Z\", \"values\" : [1, 5.2, 6,\
  \ 1, 2.3, 4, 2, 3.2, null, 7] },\n\n{ \"timestamp\" : \"2021-01-02T08:01:02.000Z\"\
  , \"values\" : [1, 2.2, 7, 1, 3.2, 3, 1, 2.3, 5, null] }\n\n]\n\n}\n\n第 8 章 异常检测\n\
  \n**注意**：在 JSON 文件中，缺失值应添加为不带引号的 *null*。\n\n在模型创建和训练阶段，训练数据中的观测值/行数\n\n必须至少为 8 ×\
  \ 属性数或 80（取两者中的较大值）。例如，对于 100 个属性，所需的最小行数为 Max (8 × 100, 80) = 800\n\n行。对于 5 个属性，所需的最小行数为\
  \ Max (8 × 5, 80) = 80 行。\n\n如果向数据集中添加了新属性或属性名称发生了更改，\n\n\n\n那么，必须重新构建模型以纳入新属性，以便在检测时考虑该属性。如果在训练过程中检测到某个属性是另一个属性的重复项，该属性会被自动丢弃。在为数据集选择属性时，请仅选择彼此*相关*且属于同一*系统或流程*的属性。确保这些属性在某种程度上相互关联至关重要。如果存在多个系统或流程，请使用描述该流程的数据集为每个流程构建单独的模型。\n\
  \n仔细选择数据集的属性还有另一个原因。如前所述，异常检测使用多变量方法，每增加一个属性都会引入该属性与所有其他属性之间的交互作用。因此，随着属性数量的增加，计算成本会迅速上升。\n\
  \n当从新数据集中检测异常时，检测负载的最大大小为 300 个属性或最多 30,000 个数据点。数据点的计算方式为属性数量 × 行数。此限制可能会发生变化，但请记住，负载可能存在限制。\n\
  \n对于异常检测，数据质量良好至关重要，并且在允许的最大数据限制范围内，数据越多越好。\n\n大多数情况下，如果模型创建或检测失败，原因在于未满足一个或多个要求。例如，如果数据集缺少标题行，您会收到错误消息：“缺少由信号标签组成的标题行。标题行应包含‘时间戳’（如果存在）以及每个信号的标签。”\
  \ 如果用于测试的数据集与训练数据集的标题不同，您会收到错误消息：“由于[检测数据不包含训练期间使用的所有信号，请提供以下信号：[temperature_1,\
  \ temperature_2, temperature_3, temperature_4, temperature_5, pressure_1, pressure_2,\
  \ pressure_3, pressure_4, pressure_5]]，渲染异常可视化时发生错误，请联系支持人员。” 如果标题缺失或与训练数据集中的标题不同，模型将找不到任何异常。“未检测到所选模型类型和检测数据的异常。”\
  \ 或者，如果数据集没有足够的行，您会收到错误消息：“[训练数据的行数不足！]”。如果数据集包含过多数据点，您将收到的错误是：“由于[数据中的总数据点数超过最大数量限制！请确保检测数据中的总数据点数不超过\
  \ 30000。信号名称的数量与信号数量不匹配。请为每个信号提供一个名称！]，渲染异常可视化时发生错误，请联系支持人员。” 创建和训练模型需要相当长的时间，因此在开始创建模型之前，检查数据并确保数据集符合要求可能是值得的。\n\
  \n用户无需理解内核或流程本身；该服务会自动优化结果：一个训练好的模型。但用户*必须*向流程提供满足要求的数据集。\n\n**创建机器学习模型并检测异常**\n\
  \n要开始使用异常检测，请从 OCI 控制台导航菜单中选择 *AI 与分析*，然后在 *AI 服务*下选择 *异常检测*。此时将打开*项目*页面。\n\n创建模型首先要创建一个项目或选择一个现有项目。如果您无法创建项目，而是收到错误消息“！加载数据时出错”，则有两种可能的解释：\n\
  \n• 您选择了错误的区间。请选择正确的区间。\n• 您没有异常检测资源的权限。请按照本章前面所述，请求管理员授予您权限。\n\n\n要创建新项目，请选择正确的区间，然后点击*创建项目*，如图\
  \ 8-22 所示。如果要在现有项目下创建模型，请从项目列表中选择项目名称。\n\n![](img/index-305_1.jpg)\n\n![](img/index-305_2.jpg)\n\
