  \ 7-36），以获取 APEX 中 Web 凭据所需的其他详细信息。\n\n![](img/index-270_1.png)\n\n第 7 章 数据标注\n\n\
  ***图 7-36.** 配置文件预览*\n\n我们稍后创建 Web 凭据和 REST 数据源所需的信息如下：\n\n• 用户 OCID\n\n• 指纹\n\n\
  • OCI 私钥\n\n• 租户 OCID\n\n• 区间 OCID\n\n• 租户区域\n\n• 命名空间\n\n![](img/index-271_1.jpg)\n\
  \n第 7 章 数据标注\n\n您始终可以通过选择*查看* *配置文件*（如图 7-37 所示）从用户页面找到这些信息。如果您没有所有必需的信息，请联系您的管理员获取。\n\
  \n***图 7-37.** 从 OCI 控制台查找查看配置文件*\n\n然后，以您希望其有权访问数据标注 API 的用户身份登录 APEX。创建一个新的 *Web\
  \ 凭据*。转到*工作区实用程序*，并选择*Web 凭据*。点击*创建*。为 Web 凭据指定一个*名称*，并选择 OCI 作为*身份验证类型*。然后，将 OCI\
  \ 用户 ID（用户 OCID）、OCI 私钥、OCI 租户 ID（租户 OCID）和 OCI 公钥指纹粘贴到相应的字段中，如图 7-38 所示。点击*创建*。\n\
  \n**注意** 如果您没有所有信息，可以返回 OCI 控制台，从“身份与安全”中查看。选择“用户”，然后从用户列表中选择正确的 APEX 用户。在“用户详细信息”中，选择“查看配置文件”。\n\
  \n![](img/index-272_1.jpg)\n\n第 7 章 数据标注\n\n***图 7-38.** 创建 Web 凭据*\n\n**在 APEX\
  \ 中使用数据标注 API**\n\n创建 Web 凭据后，您就可以使用 OCI API 服务了。对于数据标注，有两个 API：数据标注 API 和数据标注管理\
  \ API。OCI API 参考和端点可以在 Oracle 文档中找到：\n\n[`docs.oracle.com/en-us/iaas/api/#/`](https://docs.oracle.com/en-us/iaas/api/#/)\n\
  \n要查看 API 请求的请求详情，请导航至该 API 参考。要能够使用特定的 API 请求，您需要创建一个 *REST 数据源*。\n\n\n\n为此，在 APEX\
  \ *应用程序生成器*中，选择您想要创建此 REST 数据源的应用程序。选择*共享组件*。导航至*数据源*并选择*REST 数据源*。点击*创建*。选择*从头开始*，然后点击*下一步*。\n\
  \n![](img/index-273_1.jpg)\n\n第 7 章 数据标注\n\n将 *REST 数据源类型* 选择为 OCI，如图 7-39 所示。为数据源命名。在我们的示例中，此数据源将列出来自\
  \ DataLabeling  compartment 的所有现有数据集。ListDatasets 是 Data Labeling Management API\
  \ 的一部分\n\n(GET /20211001/datasets)，因此我们将 URL 端点设置为 Data Labeling Management\n\n\
  API 端点。您可以从 Oracle API 文档中找到该端点。\n\n在我们的示例中，Data Labeling API 的 API 端点是\n\nhttps://datalabeling-dp.us-phoenix-1.oci.oraclecloud.com\n\
  \n而 Data Labeling Management API 的端点是\n\nhttps://datalabeling-cp.us-phoenix-1.oci.oraclecloud.com\n\
  \n然后点击*下一步*。\n\n***图 7-39.** 为 Data Labeling Management API 服务定义 OCI REST 数据源*\n\
  \n![](img/index-274_1.jpg)\n\n第 7 章 数据标注\n\n下一步是指定要使用的*请求*。在我们的示例中，它是 Datasets。\n\
  \n在服务 URL 路径字段中插入信息，如图 7-40 所示。您可以从 Oracle 手册的 API 文档中找到服务 URL 路径。然后\n\n点击*下一步*。\n\
