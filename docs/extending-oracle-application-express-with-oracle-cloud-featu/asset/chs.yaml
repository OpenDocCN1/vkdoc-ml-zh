- "# 第 11 章 电子邮件投递服务\n\n***图 11-13.** 为 DKIM DNS 记录生成所需的值*\n\n要激活 DKIM 签名，您必须使用提供的值创建相应的\
  \ DNS 记录。这通过您组织域名的 DNS 服务完成。DNS 服务提供商可能有不同的用户界面和添加方法。\n\n\n\nDNS 记录。以下步骤基于 *Cloudflare*（[www.cloudflare.com/](http://www.cloudflare.com/)）提供的服务（图\
  \ 11-14, b），但通常流程包括：\n\n1. 添加一条类型为 *CNAME* 的新 DNS 记录。\n2. 输入 OCI 控制台提供的 *名称* 和 *目标*\
  \ 值。\n3. 设置合适的生存时间（TTL）值。\n\n![](img/index-392_1.png)\n\n第 11 章 电子邮件投递服务\n\n***图\
  \ 11-14.** 在 Cloudflare 中添加 DKIM 所需的 DNS 记录*\n\n等待几分钟，然后返回 OCI 控制台，点击 *刷新* *DKIM\
  \ 状态*，直到 *DKIM 签名* 状态显示为 *活动*（图 11-15）。\n\n![](img/index-393_1.png)\n\n第 11 章 电子邮件投递服务\n\
  \n***图 11-15.** 添加所需的 DNS 记录后，DKIM 签名状态将指示其为活动状态*\n\n电子邮件身份验证中涉及的另一个（或许更为人熟知的）DNS\
  \ 记录是 *发件人策略框架*（SPF），定义于 RFC 7208（参见 [`tools.ietf.org/html/rfc7208）。I`](https://tools.ietf.org/html/rfc7208)t\
  \ 涉及一条单一的 DNS *TXT* 记录，该记录列出了允许代表某个域发送电子邮件的邮件服务器。它与域名相关联，并且是一个始终以 v=spf1 开头、以“all”机制及其修饰符结尾的文本字符串。中间是一系列列出授权服务器的机制。这些机制可以是以下任意组合：\n\
  \n• **include**：搜索指定域的 SPF 记录以寻找匹配项。通常由电子邮件服务提供商（如 OCI 电子邮件投递服务）使用。\n• **a**：一条\
  \ DNS *A* 记录\n• **mx**：域 *MX* 记录的所有 A 记录。\n• **ptr**：使用 PTR 查询查找客户端的 IP。\n• **ip4**：单个\
  \ IPv4 地址或一个 IPv4 网络范围。\n• **ip6**：单个 IPv6 地址或一个 IPv6 网络范围。\n• **exists**：使用提供的域执行\
  \ A 记录查找。如果查找产生结果，则视为匹配。\n\n**注意** 每个域只允许一条 SPF TXT 记录，且内容的最大长度为 255 个字符。\n\nOracle\
  \ 提供了您需要包含在文档中的 SPF 机制，文档地址在[此：https://bit.ly/oci- email- spf- config](https://bit.ly/oci-email-spf-config)。根据发送电子邮件的区域包含相应的机制。图\
  \ 11-16 显示了如何将条目添加到由 Cloudflare 管理的 DNS 中。\n\n***图 11-16.** 使用 Cloudflare 的 DNS\
  \ 管理网站添加 SPF TXT 记录*\n\nDNS 更改在全球范围内传播需要一些时间。您可以使用 Kitterman Technical Services,\
  \ Inc. 提供的工具来验证 SPF 记录是否存在（图 11-17）。You 可以通过链接访问该网站[: www.kitterman.com/spf/](http://www.kitterman.com/spf/validate.html)\
  \ [validate.html](http://www.kitterman.com/spf/validate.html)。\n\n![](img/index-395_1.png)\n\
  \n![](img/index-395_2.png)\n\n第 11 章 电子邮件投递服务\n\n***图 11-17.** SPF 记录测试工具*\n\n在第一个表单中输入您的域，然后点击\
  \ *获取 SPF 记录（如果有）*。如果找到该记录，您将看到如图 11-18 所示的结果。\n\n***图 11-18.** SPF 记录查找结果*\n\n\
  ![](img/index-396_1.png)\n\n第 11 章 电子邮件投递服务\n\n返回“电子邮件域详细信息”页面，*SPF 已配置* 状态应变为绿色并显示值\
  \ *是*（图 11-19）。如果没有，请等待几分钟后尝试刷新页面。\n\n***图 11-19.** 一个完全配置的电子邮件域*\n\n**提示** 一旦您添加了\
  \ DKIM 和 SPF 记录，还建议添加一条 *DMARC* 记录。此记录帮助电子邮件接收者决定如何处理不合规的电子邮件。\n\n**已批准的发送者**\n\n\
  OCI 电子邮件投递服务器仅接受并发送“发件人”字段\n\n\n\n地址已被添加为已批准的发送者。这些地址无需先创建电子邮件域即可添加。所有在“发件人”标头中的电子邮件地址都必须是已批准的发送者。\n\
  \n第 11 章 电子邮件投递服务\n\n已批准的发送者与 OCI compartment 关联，并且必须添加到目标 SMTP 端点所在的每个区域。例如，如果端点是\
  \ *smtp.email.ca-toronto-1.oci.oraclecloud.com*，则在多伦多数据区域创建已批准的发送者。将其添加到任何其他区域（例如蒙特利尔）将导致电子邮件被拒绝。此外，只添加您拥有和/或管理的电子邮件地址，因为您至少需要添加一条\
  \ SPF 记录，以避免电子邮件被归类为垃圾邮件。请勿添加或使用公共邮箱服务提供商（例如 Gmail、Hotmail 或 Yahoo）提供的电子邮件地址发送邮件。这些服务具有严格的\
  \ DNS 规则，禁止任何非其管理的服务器代其发送电子邮件。\n\n可以通过 OCI 控制台和 REST API 添加已批准的发送者。管理已批准的发送者的用户必须拥有执行这些任务所需的权限。如果该用户不在\
  \ OCI 管理员组中，请确保该用户所属的组（例如 *EmailManagers*）已应用以下策略：\n\n允许组 EmailManagers 管理租户中的 email-family\n\
  \n或\n\n允许组 EmailManagers 管理 compartment adrian 中的 approved-senders\n\n允许组 EmailManagers\
  \ 检查 compartment adrian 中的 compartments\n\n要创建已批准的发送者，请执行以下步骤：\n\n1. 打开 OCI 控制台左上角的导航菜单，然后单击\
  \ *开发者服务*。\n2. 在 *应用程序集成* 下，单击 *电子邮件投递* 进入概览/配置页面。\n3. 在页面左侧的 *电子邮件投递* 下，单击 *已批准的发送者*。\n\
  4. 确保为新的已批准的发送者选择所需的区域和 compartment。\n5. 单击 *创建已批准的发送者*。\n6. 输入要批准的电子邮件地址（图 11-20），然后单击\
  \ *创建已批准的发送者*。\n\n![](img/index-398_1.jpg)\n\n第 11 章 电子邮件投递服务\n\n***图 11-20.** 创建已批准的发送者*\n\
  \n**抑制列表**\n\n*抑制列表* 的作用与已批准的发送者有些相反。电子邮件投递服务不会向添加到该列表中的任何地址投递电子邮件。这些电子邮件地址在租户级别分配，而不是像已批准的发送者那样在\
  \ compartment 内分配。当服务收到表示电子邮件投递永久失败或存在投诉的退信代码时，服务会自动添加这些地址。拒绝电子邮件的示例原因包括硬退信、过多软退信或收到取消订阅请求。\n\
  \n要手动管理抑制列表，首先确保用户拥有管理相关 OCI 资源的适当权限。例如：\n\n允许组 EmailManagers 管理租户中的 suppressions\n\
  \n![](img/index-399_1.jpg)\n\n第 11 章 电子邮件投递服务\n\n与已批准的发送者类似，可以使用 OCI 控制台或 REST API\
  \ 管理条目。要使用 OCI 控制台进行管理，请执行以下步骤：\n\n1. 打开 OCI 控制台左上角的导航菜单，然后单击 *开发者服务*。\n2. 在 *应用程序集成*\
  \ 下，单击 *电子邮件投递* 进入概览/配置页面。\n3. 在页面左侧的 *电子邮件投递* 下，单击 *抑制列表*。\n4. 确保选择根 compartment（租户）。\n\
  5. 单击 *添加抑制*。\n6. 输入要添加到列表的电子邮件地址（图 11-21），然后单击 *添加*。\n\n***图 11-21.** 手动向抑制列表添加电子邮件地址*\n\
  \n**为 OCI 电子邮件投递服务配置 APEX 实例**\n\n\n\nAPEX 是一个*快速应用开发*（RAD）平台，它使开发者无需实现诸如发送电子邮件之类的“基础设施型”功能。一旦\n\
  \n实例配置完成，开发者只需使用 APEX_MAIL PL/SQL API 即可发送电子邮件。\n\n第 11 章 电子邮件投递服务\n\n通常，数据库和/或实例管理员将执行\n\
  \n以下任务：\n\n• 添加适当的网络*访问控制列表*（ACL），使\n\n数据库能够成功与远程网络资源\n\n通信。以下是一个示例，允许连接到\n\n美国凤凰城区域的\
  \ OCI 电子邮件投递 SMTP 端点。\n\ndeclare\n\nc_smtp_host_address constant varchar2(4000)\
  \ :=\n\n'smtp.email.us-phoenix-1.oci.oraclecloud.com';\n\nc_smtp_host_port constant\
  \ number := 587;\n\nbegin\n\nfor s in (\n\nselect schema from sys.dba_registry where\
  \ comp_id = 'APEX'\n\n) loop\n\nsys.dbms_network_acl_admin.append_host_ace(\n\n\
  host => c_smtp_host_address\n\n, lower_port => c_smtp_host_port\n\n, upper_port\
  \ => c_smtp_host_port\n\n, ace => xs$ace_type(\n\nprivilege_list => xs$name_list('connect')\n\
  \n, principal_name => s.schema\n\n, principal_type => xs_acl.ptype_db)\n\n);\n\n\
  commit;\n\nend loop;\n\nend;\n\n/\n\n• 创建或添加到现有的 Oracle 钱包中，将端点的根\n\n*证书颁发机构*（CA）证书作为受信任的证书。\n\
  \n或者，如果您有权使用 *orapki*（Oracle 用于管理钱包的命令行\n\n工具），您可以使用一个脚本（[`gist.`](https://gist.github.com/fuzziebrain/202f902d8fc6d8de586da5097a501047)\n\
  \n[github.com/fuzziebrain/202f902d8fc6d8de586da5097a501047)](https://gist.github.com/fuzziebrain/202f902d8fc6d8de586da5097a501047)\n\
  \n第 11 章 电子邮件投递服务\n\n来生成一个包含所有当前有效根 CA\n\n证书的 Oracle 钱包。有关此操作与 APEX 和\n\nOracle\
  \ 钱包配合使用的更多详细信息，请参考以下博客文章：\n\n• [`fuzziebrain.com/content/id/1720/`](https://fuzziebrain.com/content/id/1720/)\n\
  \n• [`fuzziebrain.com/content/id/1725/`](https://fuzziebrain.com/content/id/1725/)\n\
  \n**重要提示**：无论使用的端口是 25 还是 587，OCI 电子邮件投递服务仅允许通过*传输层安全性*（TLS）进行连接和\n\n通信。因此，**必须**设置\
  \ Oracle 钱包！\n\n• 配置实例的 Oracle 钱包配置。需要设置的参数\n\n包括：\n\n  • 钱包路径\n\n  • 钱包密码\n\n**注意**：如果\
  \ APEX 实例托管在*Oracle 自治数据库*（ADB）上，则在\n\n数据库配置时，网络 ACL 和 Oracle 钱包已添加并配置完成。\n\n• 配置实例的\
  \ SMTP 设置。需要设置的参数\n\n包括：\n\n  • 主机地址\n\n  • 主机端口\n\n  • TLS 模式（可选）\n\n  • 用户名（可选）\n\
  \n  • 密码（可选）\n\nAPEX 的 SMTP 设置可以使用实例管理\n\n应用程序（图 11-22）或使用 APEX_INSTANCE_ADMIN API\
  \ 进行配置。\n\n![](img/index-402_1.jpg)\n\n第 11 章 电子邮件投递服务\n\n***图 11-22.** 使用实例管理应用程序在\
  \ Oracle 自治数据库上配置 SMTP 设置*\n\n以下是一个如何使用 PL/SQL API 配置 APEX 实例的示例：\n\ndeclare\n\n\
  c_smtp_host_address constant varchar2(4000) :=\n\n'smtp.email.us-phoenix-1.oci.oraclecloud.com';\n\
  \nc_smtp_host_port constant number := 587;\n\nc_oci_smtp_credentials_username constant\
  \ varchar2(4000) :=\n\n'ocid1.user.oc1..aaaaaaaab...truncated...43q.xx.com';\n\n\
  c_oci_smtp_credentials_password constant varcahr2(4000) :=\n\n'somerandomalphanumericcharacters';\n\
  \nbegin\n\napex_instance_admin.set_parameter(\n\np_parameter => 'SMTP_HOST_ADDRESS'\n\
  \n, p_value => c_smtp_host_address);\n\napex_instance_admin.set_parameter(\n\n'SMTP_HOST_PORT',\
  \ c_smtp_host_port);\n\n第 11 章 电子邮件投递服务\n\napex_instance_admin.set_parameter('SMTP_TLS_MODE',\
  \ 'STARTTLS');\n\napex_instance_admin.set_parameter(\n\n'SMTP_USERNAME', c_oci_smtp_credentials_username);\n\
  \napex_instance_admin.set_parameter(\n\n'SMTP_PASSWORD', c_oci_smtp_credentials_password);\n\
  \ncommit;\n\nend;\n\n/\n\n\n\n要验证值是否已正确设置，请使用以下查询来查询实例参数：\n\nselect name, value\n\
  \nfrom apex_instance_parameters\n\nwhere name like 'SMTP_%'\n\norder by name;\n\n\
  **电子邮件送达能力**\n\n搭建基础设施并创建应用程序来发送电子邮件并不困难。同时，发现一个可通过互联网访问的不安全 SMTP 服务器也并不罕见。因此，接收垃圾邮件即便不是每分钟都在发生，也至少是每天都会遇到的事情。为了打击未经请求的电子邮件，组织通常会结合使用多种工具来降低这些垃圾邮件进入用户收件箱的可能性。这些工具可能包括：\n\
  \n• 基于服务器的软件，用于在邮件到达邮件服务器之前筛选并标记所有传入邮件，例如 Zerospam 和 Apache SpamAssassin\n\n• 常见网页或桌面电子邮件应用程序的客户端插件或内置功能\n\
  \n如果您的出站电子邮件发送环境配置不正确，那么合法电子邮件被标记为垃圾邮件的可能性会很高。更严重的后果是，您的发送域名可能会被添加到垃圾邮件过滤器常用的公共垃圾邮件数据库中。将您的域名从该数据库中移除通常是一个颇具挑战性的过程。\n\
  \n![](img/index-404_1.jpg)\n\n第 11 章 电子邮件发送服务\n\n**测试送达能力**\n\n在开始广泛使用 OCI 电子邮件发送服务之前，我建议先使用已批准的发送者地址测试电子邮件的送达能力。有几个基于网页的工具可以执行此分析。其中一个网站是\
  \ *mail-tester* ([https://](https://mail-tester.com)[mail-tester.com](https://mail-tester.com))。它易于使用且信息量丰富。\n\
  \n每当加载该网站时，都会生成一个唯一的电子邮件地址（图 11-23）。向提供的地址发送一封电子邮件，然后点击 *Then check your score*。\n\
  \n***图 11-23.** mail-tester 会生成一个唯一的电子邮件地址，用于发送测试邮件以供评估*\n\n接下来，编写一个简单的 PL/SQL 匿名过程，使用\
  \ APEX_MAIL API 发送电子邮件。在 p_from 参数中指定已批准的发送者电子邮件地址，在 p_to 中指定 mail-tester 生成的地址。示例如下：\n\
  \ndeclare\n\nc_from varchar2(200) := 'no-reply@apeks.app';\n\nc_to varchar2(200)\
  \ := 'test-tkipdkwzd@srv1.mail-tester.com';\n\nbegin\n\napex_mail.send(\n\np_to\
  \ => c_to\n\n, p_from => c_from\n\n, p_body => 'Hello! Message delivered by OCI\
  \ Email Delivery services.'\n\n);\n\n![](img/index-405_1.jpg)\n\n第 11 章 电子邮件发送服务\n\
  \napex_mail.push_queue;\n\nend;\n\n/\n\n等待几分钟，然后使用提供的 URL 在 mail-tester 上检查结果。将显示评分以及影响评分的详细信息（图\
  \ 11-24）。\n\n***图 11-24.** mail-tester 对发送的测试邮件进行分析的结果*\n\n如果 DNS 记录添加正确，那么获得的评分应接近满分\
  \ 10 分。Mail-tester 还会提供扣分项的详细信息，以帮助用户解决问题并提高电子邮件的送达能力。\n\n![](img/index-406_1.jpg)\n\
  \n第 11 章 电子邮件发送服务\n\n**送达能力故障排除**\n\n配置良好的电子邮件发送基础设施并不能保证电子邮件一定能成功发送或接收。当电子邮件未能如期送达时，开发人员通常想知道原因。除了送达能力之外，APEX\
  \ 和 OCI 还提供了可观测性工具。这些工具包括 APEX 中的 APEX_MAIL_QUEUE 和 APEX_MAIL_LOG 视图，以及用于电子邮件发送服务的\
  \ OCI *日志记录*。\n\n大多数 APEX 开发人员应该都熟悉与 APEX_MAIL 相关的这两个视图。可以通过 APEX 实例管理应用程序访问它们，或者使用\
  \ SQL 作为与工作区关联的模式来查询这些视图。这通常能提供关于电子邮件为何未被接收的第一条线索。常见问题包括 APEX 实例中 SMTP 设置配置错误、电子邮件\n\
  \n\n\n不在已批准发件人列表中的地址（图 11-25）、位于抑制列表中的“收件人”电子邮件地址，或超出服务限制的电子邮件负载。\n\n***图 11-25.**\
  \ 使用 APEX_MAIL_QUEUE 识别出站电子邮件的问题*\n\n*第 11 章 电子邮件投递服务*\n\n有时，APEX 成功发送了电子邮件，并可通过\
  \ APEX_MAIL_LOG 进行验证。要调查实例外部是否存在问题，最佳方法是为某个电子邮件域启用日志记录。\n\n要为电子邮件域启用日志，请执行以下步骤：\n\
  \n1. 打开 OCI 控制台左上角的导航菜单，然后点击*开发者服务*。\n\n2. 在*应用程序集成*下，点击*电子邮件投递*进入概览/配置页面。\n\n3.\
  \ 在页面左侧的*电子邮件投递*下，点击*电子邮件域*。\n\n4. 确保选中电子邮件域所在的区间。\n\n5. 点击要配置的电子邮件域。\n\n6. 在电子邮件域的详细信息页面上，在*电子邮件域*下，点击*日志*。\n\
  \n7. 在日志表中，点击切换开关以启用所需的事件日志。将打开一个模态框，提供完成该过程的更多详细信息（图 11-26）。\n\n8. 点击*启用日志*以完成该过程。\n\
  \n![](img/index-408_1.jpg)\n\n*第 11 章 电子邮件投递服务*\n\n***图 11-26.** 为电子邮件域启用 OCI 日志记录所需的详细信息*\
  \ 每个电子邮件域可以启用两个事件：*出站已接受*和*出站已中继*。对于故障排除，我建议同时启用两者。前者记录入站请求，用于验证请求是否成功。后者在服务中继电子邮件时记录成功和失败。\n\
  \n可以通过 OCI 控制台查看日志，也可以通过不同的路径和用户界面访问。OCI 日志记录位于控制台的*可观测性与管理*子菜单下。可以查看单个日志，或利用*搜索*功能同时查看多个日志。后者对于故障排除非常有用，因为可以按时间顺序集中查看事件。\n\
  \n1. 打开 OCI 控制台左上角的导航菜单，然后点击*可观测性与管理*。\n\n2. 在*日志记录*下，点击*搜索*。\n\n3. 在搜索页面上，点击*选择要搜索的日志*字段。这将打开一个模态框。\n\
  \n![](img/index-409_1.jpg)\n\n*第 11 章 电子邮件投递服务*\n\n4. 进行操作以选择所有要搜索的日志（图 11-27）。\n\
  \n***图 11-27.** 选择要搜索的日志*\n\n5. 点击*继续*。\n\n6. 根据需要更改时间筛选条件。日志条目表（图 11-28）应自动刷新；如果没有，请点击*搜索*。\n\
  \n![](img/index-410_1.jpg)\n\n*第 11 章 电子邮件投递服务*\n\n***图 11-28.** 显示电子邮件被接受、中继或抑制的事件和详细信息的日志*\n\
  \n**注意** 与所有 OCI 资源一样，用户需要通过 IAM 策略获得适当的权限。如果您没有所需的访问权限，请联系您的 OCI 管理员。\n\n**其他要点**\n\
  \n到目前为止，我们已经深入了解了使用 APEX 设置和使用 OCI 电子邮件投递服务发送电子邮件所需的条件。接下来我们可能需要考虑的重要问题是成本和是否存在任何限制。\n\
  \n*第 11 章 电子邮件投递服务*\n\n目前，电子邮件投递服务的定价为每个日历月每发送 1,000 封电子邮件 0.085 美元。正如本章前面所述，此服务不包含在\
  \ Oracle 云免费套餐中，因此必须将租户升级为付费账户后才能使用。另外，请注意，如果“收件人”地址包含多个电子邮件地址，则每个地址都会发送一封电子邮件，并计入使用量和成本。\n\
  \n对于大多数租户，关键服务限制的默认值为：\n\n• 每天最多 200 封电子邮件或 2 MB 数据块。\n• 最大发送速率为每分钟十封电子邮件。\n\n\n\
  \n• 最大消息大小为 2 MB。这包括电子邮件负载中包含的任何必需标头。\n\n• 最多 2,000 个已批准的发送者。\n\nOCI 客户可以提交请求以增加其中一些服务限制，例如，允许电子邮件负载大于\
  \ 2 MB 但不超过 60 MB。但是，Oracle 支持通常要求客户提供有关组织如何使用该服务以及发送实践以符合反垃圾邮件法律的详细信息。您可能还需要设置电子邮件身份验证方法，例如发布\
  \ SPF 记录和 DKIM 签名。\n\n**总结**\n\nOCI 提供了一项托管服务，APEX 应用程序可以使用该服务发送电子邮件。它是一个安全的平台，实施了最佳实践，并提供了确保电子邮件可送达性的功能。在本章中，我们学习了执行以下操作所需的任务：\n\
  \n1.  为电子邮件投递服务准备租户。\n2.  访问 SMTP 端点。\n3.  配置域的 DNS 以实现最大可送达性。\n4.  配置 APEX 实例以使用该服务。\n\
  5.  测试电子邮件可送达性。\n6.  配置 OCI 以排查电子邮件可送达性问题。\n\n最后，我们检查了使用该服务时的成本和服务限制。\n\n**索引**\n\
