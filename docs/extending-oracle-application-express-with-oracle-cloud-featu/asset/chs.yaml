  **使用 OCI API 通过 APEX 进行异常检测**\n\n**异常检测 API**\n\n在编写本书时，异常检测 API 的版本为 /20210101。异常检测\
  \ API 的文档可在此处找到：\n\nhttps://docs.oracle.com/en-us/iaas/api/#/en/anomalydetection/20210101/\n\
  \n该文档包含 API 参考和所有可用的 API 端点。API 参考涵盖了 DataAsset、DataAssetCollection、Model、Project、WorkRequest、WorkRequestError、WorkRequestLogEntry\
  \ 和 Data Types。这是一个相当新的服务，因此 API 也在不断演进。\n\n**为异常检测 API 设置 APEX**\n\n首先，如果您尚未在 OCI\
  \ 控制台中创建 IAM *用户*，请先创建。将该用户添加到用于异常检测的*组*中，在我们的示例中为 AnomalyDetectionGroup。\n\n然后，返回用户的详细信息页面，确保该用户已选择\
  \ *API 密钥*。为此，请单击*编辑用户功能*，并确保选中 API 密钥。为了限制用户仅使用 API 密钥与 OCI 资源交互，请取消选中所有其他选项。\n\
  \n要使用 OCI REST API，需要一对 API 密钥。获取 API 密钥对的步骤如下：\n\n1. 在用户详细信息页面的左侧选择 *API 密钥*。\n\
  2. 单击*添加 API 密钥*。\n3. 选择*生成 API 密钥对*。\n4. 单击*下载私钥*。\n5. 单击*添加*。\n\n您刚刚下载的文件是 pem\
  \ 类型，内容类似于：\n\n-----BEGIN PRIVATE KEY-----\nMIIEvAIBADANBgkqhkiG9w0BAQEFAASCBKYwggSiAgEAAoIBAQCv2FWr73tHBsrA\n\
  VhqKE/WfOrzE6WzaYDzgAycr2SGOa3bQrkXx31uo0O9Rk2GHy71Zl+SzwF0Qz3Bh\n+HTDlaSC1FZSHZ/9DAUMidAjSpvMBnPAcIKGmmECgYASx9EM7tdWvhD3kpN9uBuc\n\
  r7ZBCU/O1mxeIm7eNlbCbLCfGsVhP4Q8v1HKQZz54y9YMRZW8eO3YEHtwwRJVegz\n8n+yYWYa/IMLLq1i8ZRqhg==\n\
  -----END PRIVATE KEY-----\n\n删除第一行（-----BEGIN PRIVATE KEY-----）和最后一行（-----END PRIVATE\
  \ KEY-----），然后将内容复制到安全的地方。这就是您将用于 Web 凭据的*私钥*。查看*配置预览*以获取在 APEX 中创建 Web 凭据所需的其他详细信息。您需要的信息包括：\n\
  \n• 用户 OCID\n• 指纹\n• OCI 私钥\n• 租户 OCID\n• 区间 OCID\n• 租户的区域\n• 命名空间\n\n然后，以您希望其有权访问异常检测\
  \ API 的用户身份登录 APEX。创建一个新的 Web 凭据。\n\n1. 转到*工作区实用程序*。\n2. 选择*Web 凭据*。\n3. 单击*创建*。\n\
  4. 为 Web 凭据指定一个*名称*，并选择 *Oracle Cloud Infrastructure (OCI)* 作为*身份验证类型*。\n5. 将 OCI\
  \ 用户 ID（用户 OCID）、OCI 私钥、OCI 租户 ID（租户 OCID）和 OCI 公钥指纹粘贴到正确的字段中。\n6. 单击*创建*。\n\n**注意**\
  \ 如果您没有所有信息，可以随时返回 OCI 控制台查看“身份与安全”部分，或者询问管理员。\n\n**使用 APEX 调用异常检测 API**\n\n创建好\
  \ *Web 凭据*后，您就可以使用 OCI API 服务了。例如，您可以创建一个 *REST 数据源*来使用它们。我们将创建一个数据源，用于查看区间内所有可用的模型。\n\
  \n1. 在 *APEX 应用程序生成器*中，选择您要创建此 REST 数据源的应用程序。\n2. 选择*共享组件*。\n3. 导航到*数据源*并选择 *REST\
  \ 数据源*。\n4. 单击*创建*。\n5. 选择*从头开始*，然后单击*下一步*。\n6. 将 *REST 数据源类型*选择为 *Oracle Cloud\
  \ Infrastructure (OCI)*。\n\n\n\n7. 为 REST 数据源指定一个*名称*。\n\n第 8 章 异常检测\n\n8. 定义 URL\
  \ 端点（请查阅 Oracle 文档以找到正确的端点）。在我们的示例中，端点为 [`anomalydetection.aiservice.us-phoenix-1.oci.`](https://anomalydetection.aiservice.us-phoenix-1.oci.oraclecloud.com)\
  \ [oraclecloud.com.](https://anomalydetection.aiservice.us-phoenix-1.oci.oraclecloud.com)\n\
  \n9. 点击 *下一步*。\n\n10. 选择*新建*作为*远程服务器*（如果您已使用过异常检测服务，请从列表中选择该服务器）。\n\n11. *基础 URL*\
  \ 应指向上一屏幕中选择的端点。\n\n12. 为*服务 URL 路径*选择所需的 API 服务。在我们的示例中：/20210101/models/。\n\n\
  13. 点击 *下一步*。\n\n14. 启用*需要身份验证*。\n\n15. 从列表中选择*Web 凭证*。\n\n16. 点击 *高级*。\n\n17. 选择*查询字符串*变量作为*参数类型*，输入\
  \ CompartmentId 作为*参数名称*，并将 compartment 的 OCID 粘贴到*值*字段中。启用*静态*。\n\n18. 点击 *发现*。\n\
  \n19. 如果一切设置正确，列表将显示该 compartment 中的所有模型。\n\n20. 点击 *创建 REST 数据源*。\n\n现在，您可以使用该\
  \ REST 数据源创建一个页面，列出此 compartment 中异常检测服务的所有模型。例如，您可以选择一个模型的 OCID，并创建一个 APEX 应用程序，使用该模型从您的数据集中检测异常。\n\
  \n在图 8-50 中，您可以看到一个非常简单的 APEX 应用程序示例，该应用程序将 compartment、项目和模型的 OCID 以及包含数据的文件作为输入。点击“检测”即可调用\
  \ API 检测异常。\n\n![](img/index-328_1.jpg)\n\n第 8 章 异常检测\n\n***图 8-50.** 一个调用异常检测服务\
  \ API 检测异常的简单 APEX 应用程序示例*\n\n**总结**\n\n异常检测是一种机器学习方法，用于识别与常态显著不同的意外事件、观测值或项目。通常，机器学习和数据科学被视为非常专业的领域，许多开发者对于开始学习数学、统计学、算法等感到不适应。异常检测服务使得无需数据科学专业知识即可使用异常检测。Oracle\
  \ 云基础设施 (OCI) 异常检测服务是一种托管式 AI 服务，使用户能够轻松构建特定于业务的异常检测机器学习模型，以标记关键事件，然后使用这些模型识别其业务数据中的异常。事件检测得越早，就能越早得到修复。异常检测服务还提供专门的\
  \ API，以便在 OCI 控制台之外使用这些服务。有限的资源通常是机器学习的瓶颈，尤其是在训练模型时。在 OCI 中，您可以按需扩展。\n\n**第 9 章**\n\
  \n**语言**\n\n语言是一种 AI 服务，用于使用预训练的机器学习模型执行不同类型的文本分析。该服务使机器学习的应用变得简单易行。\n\n您可以使用语言服务进行：\n\
  \n• 语言检测\n• 文本分类\n• 关键短语提取\n• 命名实体识别\n• 情感分析\n\n这些预训练模型由 Oracle 定期重新训练和监控。\n\n您可以通过\
  \ OCI 控制台、REST API、SDK 或 CLI 访问 OCI 语言服务。目前，语言服务并非在所有区域都托管，因此要使用它，请务必检查它是否托管在您计划使用的区域中。目前，它仅在商业区域可用。语言检测模型支持超过一百种语言；其他模型主要支持英语，但每天都在学习其他语言。\n\
  \n该服务不检查或修正语法或拼写错误。语法或拼写错误可能导致模型性能不佳或预训练模型产生意外结果。\n\n**语言服务的不同用例**\n\n\n\n自然语言处理（NLP）是人工智能和语言学的一个子领域。它使计算机能够理解、解释和操控人类语言。NLP\
  \ 有多种应用，包括 OCI 语言服务所提供的那些。OCI 语言服务仅针对书面文本使用 NLP。\n\n© Adrian Png 和 Heli Helskyaho，2022\
  \ 年\n\nA. Png 和 H. Helskyaho，《使用 Oracle 云功能扩展 Oracle Application Express》，\n\n[`doi.org/10.1007/978-1-4842-8170-3_9`](https://doi.org/10.1007/978-1-4842-8170-3_9#DOI)\n\
  \n第 9 章 语言\n\n语言服务中提供了五种预训练的机器学习模型*：语言检测、文本分类、关键短语提取、命名实体识别和情感分析*。\n\n在 OCI 控制台上，它们会同时被自动调用，你可以看到所有模型的结果。但是，在使用\
  \ API 接口时，你可以决定调用哪些服务以及调用的顺序。你可以只调用一个，也可以按顺序调用多个。例如，当从 API 调用文本分类服务时，你需要提供语言代码。这意味着你可以先调用语言检测服务来找出文本的语言，然后利用该信息再调用文本分类。\n\
  \n**语言检测**\n\n*语言检测*用于检测输入文本的语言，并给出检测的置信度分数。置信度分数的范围是 0 到 1；越接近 1，置信度越高。语言检测在许多业务场景中都非常有用。它可以用于自动化许多业务流程，例如客户反馈流程。处理反馈的第一步是检测语言，然后基于该语言进行情感分析，或使用该语言的关键短语提取来检测反馈中的关键词。甚至可以用正确的语言自动或手动回复客户。由于有了语言检测步骤，我们现在知道负责回复客户的客户满意度员工需要具备哪种语言技能。\n\
  \n另一个例子是客户支持互动。在客户支持互动中，能够自动检测客户使用的语言，然后基于该信息引导客户服务流程，这非常有价值。能够用客户自己的语言帮助客户可以提高客户满意度，并使客户支持流程更高效。聊天机器人可以自动切换到正确的语言，用户手册会自动以客户所说的语言提供，或者会自动选择会说所需语言的客服人员来服务客户。其他一些可能的用例包括根据语言自动对文档进行分类，或者将来电或客户支持工单路由到本地化团队。\n\
  \n![](img/index-331_1.png)\n\n第 9 章 语言\n\n**文本分类**\n\n*文本分类*用于识别文档的类别和子类别。它可以识别超过\
  \ 600 个类别，并且每天都在学习识别更多类别。文本分类可用于自动化业务流程等场景。它可以用于将一组数据划分为发票或食谱等类别。或者用于自动化处理各种金融文档。图\
  \ 9-1 中有一个文本分类的示例。该文本是 Heli Helskyaho、Jean Yu 和 Kai Yu 所著书籍《面向 Oracle 数据库专业人员的机器学习：部署模型驱动应用与自动化流水线》描述的一部分。文本分类将其归类为*计算机与电子/编程*，置信度为\
  \ 1.0000。\n\n***图 9-1.** 语言检测和文本分类示例*\n\n\n\n**关键短语提取**\n\n*关键短语提取*可从文本中提取最相关的关键词或短语。它可用于总结文本内容或识别文本的主要主题。\n\
  \n关键短语由文本中的主语和宾语组成。与这些主语或宾语相关的任何修饰语（形容词）也会被纳入候选关键短语中。初始化候选短语后，每个候选短语的重要性会通过统计方法进行衡量。\n\
  \n![](img/index-332_1.png)\n\n第 9 章 语言\n\n非必要的候选短语会从选定的关键短语中移除。每个关键短语的置信度分数表示该过程对其准确性的把握程度。置信度分数的取值范围为\
  \ 0 到 1。\n\n在图 9-2 中，你可以看到一个关键短语提取的示例。所使用的文本摘自由 Heli Helskyaho、Jean Yu 和 Kai Yu\
  \ 合著的《Oracle 数据库专业人员的机器学习：部署模型驱动的应用与自动化流水线》一书的描述部分。\n\n关键短语提取从文本中找到了多个关键词或短语，并且对所有这些结果几乎都达到了\
  \ 100%的置信度。\n\n***图 9-2.** 关键短语提取示例*\n\n**命名实体识别**\n\n*命名实体识别*（NER）可检测文本中的命名实体，并将其分类为预定义的类别，例如人物、产品、日期、语言、地点、货币、组织等。\n\
  \n例如，让我们选取 Adrian Png 和 Luc Demanche 合著的《Oracle 云免费套餐入门：使用始终免费资源创建现代 Web 应用》一书描述中的一小段，看看\
  \ NER 能从中发现什么。\n\n在图 9-3 中，你可以看到它从文本中找到了多个产品、组织以及一个数量/数字元素。它用颜色标记找到的实体，例如，产品类别的实体用红色标记，并显示实体类别名称。同时，它还显示了判断的置信度。例如，在文本的一部分中，“Oracle”被定义为产品，置信度为\
  \ 0.5991；而在另一部分中，它被定义为公司，置信度为 1.0000。这意味着该服务并非仅仅使用一个单词列表并根据列表来定义类别；相反，它使用更复杂的算法来理解单词的上下文，并进行更精细的分类。NER\
  \ 并非易事，错误也时常发生。例如，语法错误或拼写错误都可能导致问题与误分类。\n\n![](img/index-333_1.jpg)\n\n第 9 章 语言\n\
  \n***图 9-3.** 命名实体识别示例*\n\n**情感分析**\n\n*情感分析*包括*基于方面的情感分析*（ABSA）和*句子级情感分析*。ABSA\
  \ 从给定文本中识别出各个方面，并将每个方面分类为积极、消极、混合或中性倾向。它还为每个分类定义一个置信度分数。每个类别的置信度分数范围在 0 到 1 之间。所有四个类别的分数总和为\
  \ 1。句子级情感分析则分析整个句子，并为文本中的每个句子给出置信度分数。\n\n在图 9-4 中，你可以看到一位读者对《真实世界的 SQL 与 PL/SQL：专家建议》一书（作者为\
  \ Nanda、Tierney、Helskyaho、Widlake 和 Nuijten）评论的情感分析。基于方面的情感分析从文本中提取各个方面，并为每个方面定义一个情感类别，同时为每个判断定义置信度。然后，利用这些分析，它定义文档情感及其置信度。在我们的示例中，这条评论被定义为*混合*，置信度为\
  \ 0.5680。情感分析部分的下方区域将文本中的完整句子分类到各个类别中。例如，第一个句子被归类为*中性*，置信度为 0.6251；最后一个句子被归类为*消极*，置信度为\
  \ 0.7913。\n\n![](img/index-334_1.png)\n\n\n\n第 9 章 语言\n\n***图 9-4.** 情感分析示例*\n\n\
  情感分析在许多业务场景中非常有用。例如，你可以利用情感分析来追踪社交媒体，检测人们关于你的产品或品牌的评论是正面还是负面。或者，你可以自动监控客户反馈。然后，根据情感倾向，将其连同所需的优先级一起分派给公司内相应的团队。\n\
  \n**设置服务**\n\n要开始使用语言服务，你需要一个拥有服务管理员角色权限的 Oracle 云基础设施（OCI）账户，或者由能够设置服务并授予你所需权限的人来操作。你还需要一个受支持的浏览器。请查阅\
  \ OCI 文档中关于受支持浏览器的信息。\n\n如果你尚未创建，请创建一个 OCI 用户。该用户可以是联合用户或 IAM 用户。联合用户意味着用户认证由*身份提供商*完成。在本示例中，我们将创建一个\
  \ IAM 用户。\n\n从 OCI 控制台导航菜单中选择*身份与安全*，然后选择*用户*。点击*创建用户*，并填写如图 9-5 所示所需数据。点击*创建*。\n\
  \n在本示例中，我们创建一个名为 LanguageUser 的 IAM 用户。\n\n![](img/index-335_1.jpg)\n\n第 9 章 语言\n\
  \n***图 9-5.** 创建用户*\n\n默认情况下，只有管理员组中的用户才能访问服务资源。这也适用于语言服务资源。因此，你需要为新创建的用户授予访问所需资源的权限（策略）。可以直接向用户添加所有策略，但最佳实践是创建一个用户组，将策略分配给该组，然后将用户添加到用户组中。\n\
  \n遵循这一实践，创建一个*用户组*。从*身份与安全*中选择*组*，然后点击*创建组*。输入组名称（例如，LanguageGroup）和描述，如图 9-6 所示。点击*创建*。\n\
  \n![](img/index-336_1.jpg)\n\n![](img/index-336_2.jpg)\n\n第 9 章 语言\n\n***图 9-6.**\
  \ 创建用户组*\n\n**注意** 如果你使用的是身份云服务提供商（IDCS 提供商），例如 Oracle 身份云服务（OICS），请在联合认证下创建组并分配用户。\n\
  \n然后，将用户添加到用户组。从组列表中选择 Language 用户组。在*组详细信息*页面，导航到*组成员*部分，点击*将用户添加到组*。从*用户*列表中选择该用户（图\
  \ 9-7），然后点击*添加*。\n\n***图 9-7.** 将用户添加到用户组*\n\n第 9 章 语言\n\n下一步是添加所需的策略。有两种资源类型：*聚合*和*单个*。这意味着你可以使用聚合资源类型一次性授予所有类型语言服务的权限，或者使用单个资源类型将权限限制为一种或多种语言服务类型。要使用聚合类型授予权限，请使用资源类型\
  \ *ai-service-language-family*。单个资源类型包括：\n\n• ai-service-language-entities\n• ai-service-dominant-language\n\
  • ai-service-language-sentiments\n• ai-service-language-keyphrases\n• ai-service-language-text-classification\n\
  \n如果你更倾向于仅授予所需权限，而非聚合权限，则需要仔细选择应使用的单个资源类型。在表[9-1 中，你可以看到每个 API 操作以及调用该操作所需的、具有*USE*权限的资源类型。\n\
  \n***表 9-1.** API 操作及执行操作所需的资源类型*\n\n**API 操作**\n\n**资源类型**\n\nBatchDetectDominantLanguage\n\
  \nai-service-dominant-language\n\nBatchDetectLanguageentities\n\nai-service-language-entities\n\
  \nBatchDetectLanguageKeyphrases\n\nai-service-language-keyphrases\n\nBatchDetectLanguageSentiments\n\
  \n\n\nai-service-language-sentiments\n\nBatchDetectLanguagetextClassification\n\n\
  ai-service-language-text-classification\n\nDetectDominantLanguage\n\nai-service-dominant-language\n\
  \nDetectLanguageentities\n\nai-service-language-entities\n\nDetectLanguageKeyphrases\n\
  \nai-service-language-keyphrases\n\nDetectLanguageSentiments\n\nai-service-language-sentiments\n\
  \nDetectLanguagetextClassification\n\nai-service-language-text-classification\n\n\
  第 9 章 语言\n\n单个策略的语法如下：\n\n*allow group <group-name> to use <resource type> in tenancy*\n\
  \n例如：\n\n*allow group LanguageGroup to use ai-service-language-*\n\n*keyphrases\
  \ in tenancy*\n\n聚合策略的语法如下：\n\n*allow group <group-name> to use ai-service-language-family\
  \ in tenancy*\n\n在我们的示例中，我们将创建一个策略，如图 9-8 所示：\n\nallow group LanguageGroup to use\
  \ ai-service-language-family in tenancy\n\n**注意** 由于语言服务不使用特定区间中的资源，因此您需要在**租户**级别创建策略。\n\
  \n![](img/index-339_1.jpg)\n\n第 9 章 语言\n\n***图 9-8.** 创建用于使用语言服务的策略*\n\n现在，用户已准备好使用语言服务。\n\
  \n**使用 OCI 控制台分析文本**\n\n要开始使用语言服务，请从 OCI 控制台导航菜单中选择*分析与 AI*。然后，在*AI 服务*下选择*语言*。进入语言服务后，您可以看到两个选项：*概览*和*文本分析*（图\
  \ 9-9）。概览页面包含大量指向手册、博客和其他资源的链接，以及关于该服务的通用信息。这是深入了解该服务的好地方。通过选择文本分析可以找到该服务。\n\n![](img/index-340_1.jpg)\n\
  \n![](img/index-340_2.jpg)\n\n第 9 章 语言\n\n***图 9-9.** OCI 控制台中的语言服务*\n\n使用该服务非常简单：在*输入要分析的文本*框中输入文本，然后点击*分析*。*结果*部分将展开（图\
  \ 9-10），您可以看到对刚输入的文本进行的所有不同分析。\n\n***图 9-10.** 分析结果*\n\n在我们的示例中（图 9-10），语言检测功能检测到语言为英语，置信度为\
  \ 0.9987，并高置信度（1.0000）地将其分类为“计算机与电子/企业软件”。命名实体识别服务从文本中检测到多个实体（图 9-11），而关键短语提取则从文本中提取了多个关键词。每个实体或关键词识别都附有置信度。\n\
  \n![](img/index-341_1.jpg)\n\n![](img/index-341_2.png)\n\n第 9 章 语言\n\n***图 9-11.**\
  \ 使用 OCI 控制台进行命名实体识别和关键短语提取的示例*\n\n情感分析（图 9-12）首先判断文本总体上是正面、负面、混合还是中性。然后，它基于方面和每个句子分析情感。有趣的是，在我们的示例中，基于方面的情感分析发现“异常检测服务”是负面的。\n\
  \n***图 9-12.** 使用 OCI 控制台进行情感分析的示例，包括基于方面和句子级别的情感分析*\n\n这个示例对该服务来说可能太简单了，所以让我们用芬兰语（芬兰使用的一种语言）的文本测试一下。在图\
  \ 9-13 中，我们有一段芬兰语文本，该服务在识别语言时非常自信。文本内容大致如下：\n\n“这段文本是另一种语言，因为我想知道这个服务是否能理解\n\n![](img/index-342_1.jpg)\n\
  \n![](img/index-342_2.png)\n\n第 9 章 语言\n\n其他语言。我现在所在的国家被雪覆盖，因为现在是冬天。天气寒冷且相当阴暗。幸运的是，春天很快就要来了，然后是夏天。夏天是我最喜欢的季节。”\n\
  \n***图 9-13.** 芬兰语的语言检测*\n\n\n\n文本分类服务（图 9-14）尝试对文本进行分类。它对自己的判断并不自信，而且这种不自信是正确的，因为分析结果并不准确。关键词提取似乎能够以高置信度找到关键词。\n\
  \n***图 9-14.** 对芬兰语文本数据进行文本分类、命名实体识别和关键词提取*\n\n![](img/index-343_1.png)\n\n![](img/index-343_2.jpg)\n\
  \n第 9 章 语言\n\n情感分析（图 9-15）判定该文本为中性。它没有找到任何情感倾向，这可以理解，因为它的芬兰语能力仍然有限。该语言服务相当新，并且正在不断改进。\n\
  \n***图 9-15.** 对芬兰语文本进行情感分析*\n\n您还可以通过点击*结果*部分中的*显示 JSON* 来以 JSON 格式显示结果。\n\n您可以通过点击*下载*链接下载\
  \ JSON 文件，或者通过点击*复制*链接复制 JSON 文本（图 9-16）。\n\n***图 9-16.** 以 JSON 格式查看语言服务结果。复制或下载内容到\
  \ JSON 文件*\n\n第 9 章 语言\n\n**使用 OCI 语言 API 和 APEX 分析文本**\n\n您可以使用 OCI 语言 API 或 OCI\
  \ 命令行界面 (CLI) 来分析输入文本。在本节中，我们将讨论 OCI 语言 API 以及如何从 APEX 中使用它。\n\n**语言 API**\n\n当前版本的\
  \ OCI 语言 API 参考和端点可以在此处找到：[`docs.oracle.com/en-us/iaas/api/#/en/language/20210101/`](https://docs.oracle.com/en-us/iaas/api/#/en/language/20210101/)\n\
  \n在撰写本书时，OCI 语言服务 API 包含以下用于批量处理的 POST 请求：\n\n• `BatchDetectDominantLanguage`\n\
  • `BatchDetectLanguageEntities`\n• `BatchDetectLanguageKeyPhrases`\n• `BatchDetectLanguageSentiments`\n\
  • `BatchDetectLanguageTextClassification`\n\n以及以下用于单个文档处理的 POST 请求：\n\n• `DetectDominantLanguage`\n\
  • `DetectLanguageEntities`\n• `DetectLanguageKeyPhrases`\n• `DetectLanguageSentiments`\n\
  • `DetectLanguageTextClassification`\n\n文档对这些 API 进行了详细描述，并且在 *OCI 语言 API 参考和端点*文档的*数据类型*部分，您可以找到每个\
  \ API 调用的参考信息。在数据类型部分，包含了属性的信息以及请求 JSON 文件的示例。\n\n服务使用存在一些限制。大多数限制可以通过联系 Oracle\
  \ 来避免。在撰写本书时，每个请求的字符数限制为 1000，每个租户的并发请求数限制为 5。超出这些限制将导致 400 API 请求错误。\n\n![](img/index-345_1.png)\n\
  \n![](img/index-345_2.png)\n\n第 9 章 语言\n\n**为语言 API 设置 APEX**\n\n首先，请确保您已完成*设置服务*部分中说明的所有预备任务。\n\
  \n需要使用 API 密钥对才能使用 OCI REST API。首先，请验证语言服务的 OCI 用户是否已选择 API 密钥。转到*用户详细信息*页面（图 9-17），然后点击*编辑用户功能*。验证*API\
  \ 密钥*是否已勾选，如图 9-18 所示。\n\n***图 9-17.** OCI 控制台中的用户详细信息页面*\n\n***图 9-18.** 编辑用户功能*\n\
  \n![](img/index-346_1.jpg)\n\n![](img/index-346_2.png)\n\n第 9 章 语言\n\n下一步是获取 API\
  \ 密钥对：\n\n1. 在用户详细信息页面的*资源*部分中，导航到*API 密钥*（图 9-19）。\n\n***图 9-19.** 用户详细信息页面中的 API\
