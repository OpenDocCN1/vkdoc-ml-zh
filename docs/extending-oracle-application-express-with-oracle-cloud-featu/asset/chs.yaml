  **基础设施即代码**


  在本章前面，我们使用向导创建了基础 VCN，该向导创建了必要的网络子组件和配置。这大大减少了创建基础环境所需的手动步骤数量。但是，模板并不总是满足我们的操作要求。配置
  VCN 后，我们必须重命名资源并添加一些新资源。


  第 1 章 为 APEX 构建安全基础设施


  与任何类型的手动干预相关的常见风险或缺点是**可重复性**。如果由于某些故障或新需求而需要恢复相同的 VCN 配置，则很难保证能够准确地重复设置。有没有办法用代码记录基础设施？


  **Terraform 和资源管理器**


  是的，这个非常常见的挑战的答案是 Terraform。Terraform 允许架构师使用配置文件定义基础设施，然后在云供应商的 Terraform 提供程序的帮助下部署配置更改。OCI
  的提供程序由 Oracle 创建和维护。Terraform 脚本可以作为堆栈部署在名为 *Resource Manager* 的 OCI 服务上。该服务可以通过
  OCI 控制台在导航菜单项 *Developer Services* ➤ *Resource Manager* 下访问。


  使用资源管理器时的第一个任务是创建一个堆栈。这是一组 Terraform 配置文件，可以上传、管理、测试和部署。Terraform 配置是用平台特定的语言编写的，可以使用任何文本编辑器进行编辑。我在处理
  Terraform 配置文件时首选的工具是 Microsoft Visual Studio Code ([`code.visualstudio.com/`](https://code.visualstudio.com/))。有一个官方扩展
  ([`marketplace.visualstudio.com/`](https://marketplace.visualstudio.com/items?itemName=HashiCorp.terraform)


  [items?itemName=HashiCorp.terraform) 可](https://marketplace.visualstudio.com/items?itemName=HashiCorp.terraform)以使编写这些文件变得轻而易举。


  资源管理器还支持使用源代码控制系统，例如 GitLa[b (https://gitlab.com/)。](https://gitlab.com/)


  架构师无需从头开始 Terraform 配置项目。Oracle 根据其发布的参考架构提供配置文件，您可以通过资源管理器访问这些文件，或从其 GitHub 仓库下载捆绑包。或者，您可以通过从现有区间提取信息来生成配置文件。


  Terraform 配置通常依赖于仅在需要部署时才可用的信息。这些信息作为变量公开，控制台提供了一个用户界面，允许架构师设置和/或修改它们。


  堆栈准备就绪后，架构师应使用 *Plan* 操作验证配置文件，然后在仔细检查结果后，使用 *Apply* 操作部署堆栈。与堆栈部署关联的所有资源也可以通过执行
  *Destroy* 操作来删除。


