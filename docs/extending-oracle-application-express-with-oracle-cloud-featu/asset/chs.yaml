  **安全性和日志记录**


  与许多其他 OCI 资源一样，API 网关服务也支持日志记录。日志记录从部署的详细信息页面启用。有两类日志记录，用于访问和执行，并且可以使用 OCI 控制台轻松启用。


  还可以为每个部署设置执行日志级别。执行此操作的选项可以在部署向导的第一页上找到（图 4-17）。日志记录级别可以设置为以下三个值之一：


  • Information


  • Warning


  • Error


  ![](img/index-149_1.jpg)


  第 4 章 使用 API 网关暴露功能


  ***图 4-17.** 从部署向导设置执行日志级别*


  在同一页面上，有以下设置安全功能的选项：


  • **Mutual-TLS (mTLS)**: 启用后，REST 客户端必须出示 API 网关将验证的 SSL/TLS 证书。部署可以选择将访问限制到特定的
  *主题备用名称* (SAN) 或 *通用名称* (CN)。启用后，必须将包含签署客户端证书的 CA 证书的自定义证书颁发机构 (CA) 捆绑包添加到 API 网关。


  • **身份验证**: API 网关服务支持使用单独的 Oracle Functions 函数或 JSON Web 令牌 (JWT) 来管理对端点的访问。


  • **CORS**: 跨源资源共享策略通常用于防止来自不同来源的代码发出请求。部署可以指定允许的来源、方法和头。


  第 4 章 使用 API 网关暴露功能


  • **速率限制**: 此功能允许部署指定每秒的最大请求数，基于唯一的客户端 IP 地址或作为聚合。实施速率限制有助于保护端点免受意外请求激增的影响，例如在分布式拒绝服务
  (DDoS) 攻击期间，这可能导致服务中断。


  **总结**


  Oracle Functions 为 APEX 开发人员提供了实现以其他方式难以在 PL/SQL 中实现的功能的能力。这些无服务器函数可以通过多种方法调用，在第
  [3](https://doi.org/10.1007/978-1-4842-8170-3_3) 章中，我们使用 Oracle Events 来触发函数，对上传到
  OCI 对象存储的文件执行图像转换。


  但是，并非所有用例都涉及使用 OCI Events 来调用无服务器函数。API 网关是一种托管服务，它包装这些函数并将其暴露为 REST 端点。它还提供各种安全功能来保护这些服务免受恶意攻击。


  **第 5 章**


  **自治数据库中的 Oracle 机器学习**


  Oracle 机器学习 (OML) 利用数据库的强大功能来处理机器学习过程的数据，而无需将数据移出数据库，也不会危及数据安全。OML 支持三种编程语言：SQL
  (OML4SQL)、R (OML4R) 和 Python (OML4Py)。SQL 和 Python 通过其 API 在 Oracle 自治数据库中自动可用。很快，R
  也很有可能可用。目前 R 仅在 Oracle 数据库上可用，在自治数据库上不可用。


  要在 OCI 中使用 Oracle 机器学习，您需要一个 Oracle 云基础设施 (OCI) 帐户和一个 Oracle 自治数据库。您还需要一个具有 Oracle
  机器学习权限的用户。


  **设置 Oracle 机器学习环境**


  为了能够使用 OML，您需要一个 *OCI 帐户*、一个 *自治数据库* 和一个 *OCI 用户*。OML 不需要单独的许可证，因此 Oracle Cloud
  Free Tier 帐户足以测试该服务。如果您没有 OCI 帐户，请访问 [www.oracle.](http://www.oracle.com/cloud/free/)


  [com/cloud/free/](http://www.oracle.com/cloud/free/) 并按照说明创建一个 Free Tier 帐户。登录该帐户。


