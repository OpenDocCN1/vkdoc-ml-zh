  **总结**


  Oracle 云基础设施提供了多种托管资源，例如对象存储、事件、函数，以及最近的 *AI 服务*，这些资源可以通过 OCI REST API 轻松地与 APEX
  应用程序集成。出于安全考虑，Oracle 要求对这些 API 请求进行数字签名。幸运的是，APEX 封装了使用 OCI Web 凭证执行身份验证过程的复杂性，使得使用
  OCI 资源来构建我们原本难以在纯 APEX 和 PL/SQL 中实现的功能变得容易。


  **第 4 章**


  **使用 API 网关暴露功能**


  在上一章中，我们了解了 *Oracle Functions*，这是 Oracle 在 *Oracle 云基础设施* (OCI) 上提供的无服务器计算产品，以及如何扩展
  *Oracle Application Express* (APEX) 应用程序在 Oracle 数据库之外的功能。使用 Oracle Functions，开发人员可以选择多种编程语言来实现函数，而无需管理支持和托管应用程序的基础设施。


  **注意** 将来，Oracle 数据库将通过其 *多语言引擎* (MLE) 功能支持其他脚本语言，例如 *JavaScript*。


  回顾一下，Oracle Functions 可以通过以下方式调用：


  • Fn Project CLI


  • OCI SDK 和 REST API


  • 对函数调用端点的签名 HTTP 请求


  • Oracle 云服务，例如 Events 和 API gateway


  在第 [3](https://doi.org/10.1007/978-1-4842-8170-3_3) 章中，我们重点介绍了由 OCI *Events* 服务在文件从
  OCI *对象存储* 创建、更新或删除时触发的事件。但是，并非每个用例都涉及文件和对象存储引发的事件。在 APEX 应用程序中集成外部服务时，使用 CLI 调用函数并不实用。虽然
  Oracle 提供了一个 PL/SQL SDK 来使用 OCI REST API，但它并非在所有数据库安装中都立即可用。在撰写本文时，使用 Web 服务的包仅适用于
  Oracle 自治数据库。


  © Adrian Png 和 Heli Helskyaho 2022


  A. Png 和 H. Helskyaho，《*使用 Oracle 云功能扩展 Oracle Application Express*》，


  [`doi.org/10.1007/978-1-4842-8170-3_4`](https://doi.org/10.1007/978-1-4842-8170-3_4#DOI)


  第 4 章 使用 API 网关暴露功能


  APEX 开发人员的一个可能选项是使用 APEX_WEB_SERVICE 包直接调用 OCI REST API 或函数的调用端点。但是，后者涉及对 HTTP 请求进行签名，同样，由于对这些请求进行签名所需的公钥加密算法，这可能无法在所有数据库版本中实现。


  幸运的是，有一种方法可以使调用 Oracle Functions 相对容易，这涉及一个中间 OCI 服务。使用 *API gateway* 服务，开发人员可以屏蔽
  Web 服务消费者免受后端实现的影响，例如使用 Oracle Functions 或在 *Oracle Kubernetes Engine* (OKE) 集群上运行
  *Node.js®* 应用程序。如果实现发生变化，对客户端应用程序的影响将很小或没有。


  API 网关是一种虚拟网络设备，部署在 *虚拟云网络* (VCN) 子网内，该子网可以是公共的或私有的。作为一种区域服务，它在可用性域和容错域之间具有容错能力。因此，API
  网关只能部署在区域子网上。


  API 网关有一个端点，用于接收 HTTP 请求，并根据路径和 HTTP 方法将它们路由到分配的后端。后端可以是 HTTP 服务、Oracle Functions
  或静态响应。请求路径和后端之间的这种映射在 *Deployment* 内定义为路由。每个 API 网关包含一个或多个部署，每个部署可能有一个或多个路由。


  部署还允许开发人员定义处理请求和响应的策略，例如速率限制、跨源资源共享 (CORS) 支持、安全性以及操作 HTTP 头和查询参数。


  **用例定义**


  在本章中，我们将创建一个简单的 APEX 应用程序来执行从英语到日语或西班牙语的语言翻译（参见图 4-1）。此应用程序将演示如何将 API 网关与 Oracle
  Functions 一起使用，以向 APEX 应用程序添加功能。


  ![](img/index-125_1.jpg)


  第 4 章 使用 API 网关暴露功能


  ***图 4-1.** 用于语言翻译的 APEX 应用程序*


  创建执行语言翻译的应用程序可能具有挑战性。它通常涉及创建/收集一个相当大的字典，该字典映射不同语言对的词汇，以及大量用这些语言编写的文本语料库，用于训练执行 *自然语言处理*
  (NLP) 的机器学习模型。


  目前有几种现成的解决方案可用，许多是通过 RESTful API 访问的。有些是免费的，但大多数是收费的。几家主要的云供应商也将这些服务作为其服务组合的一部分提供。这些服务提供商的示例列在表
  4-1 中。


