  **关于作者**


  **Adrian Png** 是一位经验丰富的解决方案架构师，拥有超过


  20 年的客户合作经验，致力于设计和实施最先进的基础设施和应用程序。


  他拥有新加坡国立大学的技术硕士（知识工程）学位，并且


  始终渴望应用他在机器学习方面的知识和技能。Adrian 还接受过多项 Oracle 技术的培训和认证，包括 Oracle 云基础设施、


  Oracle 自治数据库、Oracle 云原生


  服务、Oracle 数据库和 Oracle Application Express。


  他是 Oracle ACE，也是 Oracle 社区公认的贡献者。最近，


  他合著了 Apress 出版的《*Oracle Cloud Free Tier 入门*》一书。


  在业余时间，Adrian 喜欢摆弄电子项目和 3D 打印。


  **Heli Helskyaho** 是 Miracle Finland Oy 的首席执行官。她拥有


  赫尔辛基大学的计算机科学硕士学位，专攻数据库。目前，


  她正在赫尔辛基大学攻读博士学位。


  Heli 自 1990 年以来一直从事 IT 工作。她担任过


  多个职位，但每个角色都涉及数据库和


  数据。她相信，理解你的数据会使使用


  数据变得容易得多。她是 Oracle ACE Director，并且是


  许多会议的常客演讲者。她是


  多本书的作者，并在 2015 年至 2021 年期间每年都被列为芬兰 ICT 行业


  前 100 名有影响力的人物之一。


  xi


  ![](img/index-12_1.jpg)


  **关于技术审阅者**


  **Karen Cannell** 是 TH Technology 的总裁，这是一家提供 Oracle 技术服务的咨询公司。作为一名机械工程师，她在过去 30
  多年里分析、设计、开发、转换、


  升级、增强并以其他方式实施了数据库


  应用程序，专注于 Oracle 技术。她从 Oracle APEX 诞生之初就开始使用它，并继续利用 Oracle 工具在政府、医疗保健和工程


  行业构建解决方案。Karen 是 ODTUG 副总裁、Oracle ACE


  Director、*ODTUG 技术期刊*荣誉编辑、


  Oracle 开发者选择奖决赛入围者、ODTUG 年度志愿者，以及《*Expert Oracle Application Express*》、《*Agile Oracle
  Application Express*》和《*Beginning Oracle Application Express 4.2*》的合著者。她是 ODTUG
  以及其他本地和区域用户组的活跃成员。可以通过 kcannell@thtechnology.com 和


  @thtechnology 联系她。


