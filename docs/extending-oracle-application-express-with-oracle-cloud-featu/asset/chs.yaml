  Microsoft 的 *Windows Subsystem for Linux* (WSL) 版本 2。


  **OCI CLI**


  OCI CLI 是一个工具，OCI 管理员和开发人员可以使用它来管理 OCI 组件、自动化任务等，而无需担心调用 OCI REST API 所需的复杂步骤。在底层，它使用
  OCI Python SDK，因此需要兼容版本的 Python。在撰写本文时，支持任何 3.6 或更高版本。您还需要在您工作的环境中拥有管理访问权限。


  要安装 OCI CLI，只需运行以下 Bash 命令：


  bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/


  scripts/install/install.sh)"


  在安装过程中，系统会提示您指定软件工件将安装到的目录。在 Linux 环境中，这通常是用户主目录下的 lib/oracle-cli 子目录。安装脚本还需要知道将二进制文件放在哪里。默认情况下，这是用户主目录下的
  bin 和 bin/oci-cli- scripts 子目录。


