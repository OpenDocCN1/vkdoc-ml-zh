  \n\n\n## 物联网技术栈\n\n要提出通用的物联网技术栈非常困难，因为不同行业有其自身需求，需要不同的应用、产品和服务来满足。不过，本节将提供一个通用概览，介绍跨行业实施物联网技术的主要组成部分，并提供物联网技术栈的技术细节。可根据个人/用户/企业的具体需求进行进一步定制，但技术栈的基本结构保持不变。物联网带来了巨大的可能性，并预示着光明的未来；它必将长期存在。\n\
  \n基于传感器的设备和装置数量正以惊人的速度增长，该领域的发展也极为迅猛。因此，现有的商业模式需要与这项快速变化的技术相适应。为此，商界需要对其员工进行相关培训，这包括但不限于项目、产品和技术经理。他们负责收集信息，为更高管理层提供输入。基于中层管理人员（项目/产品和技术经理）提供的数据和洞察，组织的高层（CTO/CFO/COO）才能做出决策。\n\
  \n中层管理人员是组织整体生态系统中不可或缺的一部分，他们确保基于物联网系统的产品/应用或服务的成功。在这个变革的时代，显然，具备技术能力的经理人将为其组织提供更好的方向指引。因此，经理人的角色和职责也发生了变化。成功需要更强的技术协同能力和创新思维。经理人的技术之旅始于理解技术栈。因此，只有那些理解技术栈的人才能评估需求和项目的复杂性。由于本书的目标读者是经理人，让我们从物联网技术栈开始这项知识收集工作。\n\
  \n物联网技术栈分为以下几层：\n\n*   设备与传感器层\n*   通信、协议与传输层\n*   数据处理层\n*   表示层与应用层\n\n*层级（Tiers）*\
  \ 表示设计中的表示、业务、服务和数据功能在物理上分布于不同的计算机和系统。*层（Layers）* 是构成应用程序的软件或硬件组件的逻辑分组。它们以逻辑方式对组件执行的各种任务进行划分。这使得创建支持现有组件可重用性的健壮可靠的设计变得更加容易。此外，每个逻辑层可以包含多个独立的组件类型。这些组件类型被分组到子层中，每个子层执行特定类型的任务以实现特定功能。\n\
  \n## 物联网、你与你的组织\n\n构建一个完整的物联网系统或解决方案是一项成本高昂且关乎业务成败的决策。它需要现代技术技能、专业知识、时间和资金。在实施之前需要进行妥善规划。如果资源没有得到合理利用，解决方案可能会经历漫长的\
  \ IT 项目周期，最终投资回报率低下。因此，确定一个有效的物联网平台是必须的。一个配备了合适技术栈的有效物联网平台将简化物联网解决方案的开发。因此，可扩展性、健壮性和性能等因素对于优秀平台至关重要。在需要时，平台应能轻松适应持续的增长和变化。\n\
  \n这些必备特性使企业能够（在平台之上）开发系统和解决方案，帮助行业/组织/企业构建强大的物联网解决方案，这些方案能够轻松连接各种设备和传感器。它们可以受益于系统与运营资产之间的无缝信息流，并通过物联网/万物互联/工业物联网为客户提供切实的商业价值。如今的客户对技术、其未来以及用例都了解甚深。因此，拥有一个好的平台能让用户对其需求的满足充满信心。\n\
  \n## 设备与传感器层\n\n这是物联网系统的起点。从这里，“物”开始了它们的（技术）旅程。设备与传感器层始于一个设备，并传递到多个其他连接的“物”或更大的网络（或网络之网络）。此外，该层负责与物理世界进行交互。以下列表从技术角度解释了该层的一些重要要点。本节属于物联网范畴，具体涉及设备、物和网关。\n\
  \n随着时代变迁，边缘计算变得非常重要，这是一种将计算服务物理迁移到更靠近用户或数据源的做法。这些计算服务可在所谓的*边缘设备*上获得，这些计算机能够实现实时原始数据收集和处理，以进行更快、更准确的分析。得益于边缘机器学习，物联网和其他边缘设备现在可以在本地执行机器学习模型。\n\
  \n本节简要介绍了物联网设备和传感器的技术格局、技术框架及其他细节。\n\n*   物体或“物”通常体积小、容量有限。因此，这些物体和“物”使用微控制器进行编程，因为它们轻量级且资源消耗少。微控制器专用于执行特定的技术任务集。\n\
  *   运行在物联网设备上的软件通常包含一个非常轻量级的操作系统；这是一个软件层，使物体能够访问硬件（MCU）的功能。\n*   设备或物体支持有线或无线协议，例如蓝牙、Z-Wave、Thread、CANBus、CoAP\
  \ 和 MQTT。这些通常用于连接设备。\n*   物联网设备通常具有远程管理能力。当需要远程管理“物”时，此功能非常有用。示例包括软件升级和远程修复小问题。\n\
  \n\n\n### 为您呈现的事实\n\n谷歌的物联网操作系统名为 Android Things。它专为互联设备构建，并用于物联网领域。它经过优化，能够充分利用英特尔创新的架构。在\
  \ Android Things 上进行物联网应用开发既快速又稳健。\n\nWindows 10 IoT Core 是 Windows 10 的精简版本。Windows\
  \ 10 IoT Core 针对小型设备进行了优化。它可以在树莓派 2 和 3、Arrow DragonBoard 410c 以及 MinnowBoard MAX\
  \ 等设备上运行。Windows 10 IoT Core 可以通过使用其 API 来扩展通用 Windows 平台 (UWP) 的功能，以构建下一代解决方案。Windows\
  \ 10 IoT Core 还支持 Arduino Wiring API，该 API 用于 Arduino 草图和库，以实现对硬件的直接访问。Windows 10\
  \ IoT 应用程序是使用 Visual Studio Community Edition 开发的。Visual Studio Community Edition\
  \ 提供了高质量的开发工具，包括通用应用模板、代码编辑器、强大的调试器和丰富的语言支持。借助 Connect-the-Dots 等框架，针对 Windows 10\
  \ IoT Core 的设备可以与微软 Azure 云平台集成。微软 Azure 允许您利用先进的基于云的分析服务。\n\n在选择技术栈时，您需要一个专注、基于思考的实用战略方向，主要涉及需要收集何种数据以及所需的硬件类型。显然，需要为这个技术栈规划出业务模型和需求。此外，支持模型和执行计划也必须提前定义并得到充分验证。\n\
  \n这种规划在创建、修改、维护和淘汰技术栈的整个生命周期中都很有帮助。这种方法能够使物联网技术栈与任何解决方案的创建保持同步。如果考虑到这些因素，技术栈就能处理任何类型的实际需求。无论是通过单个智能传感器进行简单的数据收集，还是处理更复杂的场景，例如从托管众多传感器、强大处理器、先进存储系统和网关系统的工业计算机和处理系统中收集数据。\n\
  \n传感器测量数值并发送原始数据，同时功耗极低。传感器可以嵌入到任何设备或物体中。这包括智能手机、手表、腕带、咖啡机、汽车、卫星、牙刷、隐形眼镜、织物等等。它们可以佩戴在身上或植入皮肤内。例如，诺基亚最近为一种嵌入皮肤内的磁性纹身系统申请了专利。当有来电或收到消息时，这种纹身会振动。其方法描述称，该专利技术将一种铁磁材料喷涂到用户的皮肤上。完成后，纹身可以与任何移动设备配对进行通信。\n\
  \n另一个例子是 Fitbit 的新型高级睡眠追踪设备，它使用传感器来测量用户在夜间处于不安、深度睡眠或清醒状态的时间。它内置了心率监测器，可以将数据分解并分析成临床定义的阶段。（更多信息，请访问\
  \ [`www.fitbit.com/global/in/technology/sleep`](http://www.fitbit.com/global/in/technology/sleep)。）\n\
  \n印度理工学院孟买分校的团队开发了一款可穿戴婴儿健康监测器的原型。它帮助父母借助多个传感器追踪孩子的临床和总体健康状况。该团队创建了一个物联网设备，可以轻松嵌入或附着在尿布上。这是一种监测婴儿活动（包括体温、血压等）的创新方法。\n\
  \n微软与华盛顿大学合作，推出了一款创新的隐形眼镜，用于分析并提供人体内生化不稳定性状态的实时更新。随着微机电系统（通常称为 MEMS）的进步，这些传感器的尺寸和成本已显著下降。因此，基于\
  \ MEMS 的设备正成为主流。MEMS 在微小的电子层面工作。它们结合了电子学、物理学、化学和机械工程学的综合力量来集成传感器和执行器。传统上，传感信息以及通过网络共享和传输该信息是由设备中的独立组件处理的。然而，最近的技术进步使得将传感、联网和电源集成到一个单元中成为可能。因此，它们可以轻松地在多种环境中使用，因为它们作为一个单一单元工作。\n\
  \n巨大的电源需求和网络能力不再是限制因素。例如，市场上许多配备全球定位功能的设备和传感器都具有出色的联网能力。它们可以追踪个人的位置，并帮助他们实时找到丢失的宠物、他们的汽车、附近的医院、购物中心或停车位。\n\
  \n在所有设备中，传感器的性质和类型以及基本的通信技术几乎相同。它们通过无线网状网络协议相互通信。设备的这种能力推动了一些公司非常雄心勃勃的计划。例如，惠普的一个名为“地球中枢神经系统\
  \ (CeNSE)”的项目结合了材料科学、纳米技术和 MEMS 的进步，以开发一个覆盖全球的传感网络。他们使用大量廉价的传感器，通过整合物理世界和数字世界来获得对世界的整体视图。这些“硅基神经”基本上绘制了整个地球的地图。反过来，这张地图被用来监测桥梁、高速公路、河流、森林以及人们呼吸的空气的状况。\n\
  \n物联网设备使用计算处理单元，但它们不是通用计算机。这些设备的主要目的是充当目标物联网系统的“眼睛”和“耳朵”。低功耗、移动性、易用性、在恶劣条件下工作、善于使用低吞吐量通信信道以及通过无线电接口与网络通信，是这些物联网设备的一些显著特点。传感器和网关及其相互作用创造了一些非常有用的用例。\n\
  \n以下部分将讨论物联网中使用的一些主要技术。\n\n\n\n## 通信、协议与传输层\n\n通信层与传输层共享传感器信息（集成于设备、事物或物体中）。通俗来说，这指的是信息/数据交换的各种不同方式。在技术领域，它大致意味着通过设备“交换”信息。然而，在物联网术语中，它指的是通过“事物”与世界其他部分交换信息。这种信息交换通过网络进行，包括物理网络和虚拟网络，并使用不同类型的协议。\n\
  \n通信机制由设备或事物（包括硬件和软件）的相互作用构成。因此，在构思和考虑构建物联网协议栈时，选择正确的通信机制（包含所有类型的传输和协议需求）非常重要。这一层表明并决定了如何与底层基础设施进行交互。这反过来又为以下问题提供了答案：哪种平台最适合你的解决方案，是第三方平台、本地部署还是云基础设施？如果你打算采用基于云的解决方案，这一层负责数据管理。例如，如何将数据放入云基础设施以及从中取出？它借助广域网、局域网、WiFi\
  \ 及其他相关技术来实现这一点。\n\n网关是物联网环境中的一个关键组成部分。物联网网关是一种“中间”设备，它连接传感器、设备、系统和应用程序。它提供了巨大的价值，因为它过滤并传递从传感器和设备收集的数据。网关使物联网生态系统能够高效地收集数据，并将数据从设备和装备安全地传输到目标系统或基础设施。网关并非单一组件。它可以被设计成一个网关网络/组合，能够连接所有远程设备，并具备随增长而扩展的能力。网关与物联网传感器和设备相结合，在物联网生态系统中扮演着重要角色，因为它们提供了实现、保护、管理和维护整个系统的能力。网关可用于多种用途，但其中几个非常重要：\n\
  \n*   用于将有意义的数据迁移到云端，并通过过滤掉垃圾数据来减少在传输到云端过程中的可用数据量。\n*   用作数据处理器。\n\n以下是通信、协议和传输层的一些要点：\n\
  \n*   物联网网关是传感器的集成点。\n*   充当执行器，将事物或设备相互连接或连接到外部网络。\n*   物联网网关可以是集成了、构建于或附加到设备上的物理硬件或功能。\n\
  *   物联网网关用于从传感器收集数据。\n*   网关的一些重要协议包括：\n    *   CoAP\n    *   MQTT\n    *   HTTP\n\
  \    *   XMPP\n*   物联网网关能够在边缘处理数据，并可能具备存储能力以应对网络延迟。\n\n现在是时候了解一些流行的通信和网络术语了。正确理解这些术语有助于理解物联网技术。其中一些术语目前正在使用，而另一些则正在快速涌现（见表\
  \ 4-2）。\n\n表 4-2\n\n无线网络选项\n\n| 网络类型 | 描述 |\n| --- | --- |\n| 蜂窝移动网络 | 有多种变体，包括\
  \ 2G、3G、4G 和 5G（最新版本），其中“G”代表“代”。 |\n| 蓝牙与低功耗蓝牙 | 无线个人区域网。一种短距离传输数据的标准。 |\n| ZigBee\
  \ | 一种无线网状网络协议。非常适合低数据速率和长电池寿命的场景。 |\n| Z-Wave | 用于家庭自动化的无线协议。 |\n| 城域网 | 城域网类似于局域网，但其覆盖范围可延伸至一个城市、大型园区或多个园区。通常为城市或城镇设计。\
  \ |\n| 个人区域网 | 个人区域网是围绕个人组织起来的网络。它可能使可穿戴计算机设备能够与附近的其他计算机或智能设备通信并进行数字数据交换。 |\n| 广域网\
  \ | 广域网跨越广阔的地理区域。它可能连接较小的网络，包括局域网或城域网。 |\n| 6LoWPAN | 基于 IPv6 的低功耗无线个人区域网。 |\n|\
  \ WiFi | 用于局域网的无线技术。它是目前大多数可用设备（包括手机、平板电脑和个人电脑）不可或缺的一部分。然而，它并不仅限于设备，其覆盖范围也延伸到了电子产品（冰箱、洗衣机等）。\
  \ |\n\n\n\n## 数据处理层\n\n云平台是现代物联网解决方案的支柱，也是数据科学和机器学习蓬勃发展的最大推动力之一。根据数据处理原则，理论上只要技术基础设施到位，数据可以在任何地方进行处理。然而，出于显而易见的原因，企业更倾向于在云端处理数据。以下是与此相关的一些关键方面：\n\
  \n*   *数据收集与管理*：借助现代数据流技术，智能设备可以轻松地将数据（包括杂乱和含噪的数据）传输到云端。数据可能来自多种来源，其内部结构、格式和组织方式也各不相同。此外，可能需要对数据进行预处理，以处理或发现丢失及不需要的数据。同时，在将数据定向并存储到数据存储库之前，需要将来自不同来源的不同数据集进行整合，以形成统一的表示。因此，在定义基于物联网的技术栈需求时，充分了解数据的类型和数量至关重要。清晰掌握每日、每月和每年的数据需求，是设计和构建一个稳健、高效且有效的技术栈的重要步骤之一。提前正确定义可扩展性参数，有助于架构师、数据科学家和数据管理员确定合适的数据管理解决方案及相关生态系统。\n\
  \n*   *分析*：分析是任何物联网解决方案的关键组成部分之一。在物联网的背景下，分析指的是以有意义的方式处理数据、发现隐藏模式并生成洞察的能力。为了执行关键的业务预测，机器学习和大数据分析的技术协同作用便应运而生。同时，它也使整个生态系统具备从可用数据中提取认知洞察（即理解人类如何以自动化方式解读数据）的能力。此阶段还包括不断回溯和检查对已归档数据执行的操作和存储的记录，以理解过去的数据并预测未来的动向，或发现数据中可能提示需要进一步检查或采取行动的异常情况。请记住，原始数据本身无法提供业务解决方案。正是基于分析的洞察力，借助现代数据驱动技术和机器学习，才能点石成金。因此，物联网技术栈必须能够集成分析能力，并促进构建高效且有效的解决方案。\n\
  \n*   *云 API*：物联网的核心在于将多个设备或对象相互连接，连接到网络，或连接到网络的网络。创建这个设备网络的目的，是为了满足企业及个人在业务和个人需求方面的不同数据共享需求。在物联网解决方案内部及其周围，数据无处不在。数据从物/对象/设备传输到云基础设施，从云端传输到后端系统，从多个处理者或用户传输到他们的对象或设备。这一过程的核心是\
  \ API，它实现了设备间的所有通信与协作。多个对象、事物、设备和网络之间的这种无缝通信，通常是通过在云端或设备层面调用公开的 API 来实现的。这些 API\
  \ 由供应商和服务提供商作为云服务的基本要素之一提供。API 允许用户与设备交互或交换数据。请记住，向目标受众开放 API 不是一个技术决策，而是一个业务决策。恰当的\
  \ API 管理能够确保数据安全地流动，从而有助于保护敏感数据。\n\n## 表示层与应用层\n\n该层提供了与应用程序用户交互的方式。安装在设备/对象上的软件充当通信的接口。该层还包含最终用户用来进行通信的应用程序和交互式产品。该层位于技术栈的顶层，大部分技术复杂性都隐藏在底层。因此，几乎每个人都能轻松理解这一层。对于接触过一点技术的人，甚至是对外行人来说，这就是“使用层”，因为它包含了他们使用的应用程序和产品，而无需了解背后隐藏的复杂性。\n\
  \n企业的大部分收入来自这一层。技术和产品经理很容易理解这一层。位于此层的应用程序、产品和服务通常是基于 Web 的。然而，这并非强制性标准，具体取决于用户的需求。这些\
  \ APS（应用程序、产品和服务）旨在面向桌面、移动设备和可穿戴设备。此外，许多应用程序或应用都是为了满足客户的需求而提供的。在日新月异的时代，客户更倾向于使用支持云计算的应用程序或产品，因为它们提供了“随时随地”从智能物联网设备访问信息的灵活性。这种“随时随地”的访问方式，与物联网为用户提供自由和敏捷性的最终目标是一致的。\n\
  \n特定行业的应用程序也位于这一层。消费者使用这一层来满足家庭、生活方式和健康相关的需求。企业和行业则将其用于专业需求。\n\n### 物联网解决方案的可用性\n\
  \n微软是基于物联网的技术、产品和解决方案的端到端提供商之一（还有其他多家，包括 IBM）。物联网需求旺盛。许多公司正在这一领域帮助他们的客户和利益相关者。他们不断创新，并在市场上推出突破性产品。在当今世界，仅仅进行研究和创新是不够的。产品的正确定位、品牌建设、市场营销，以及将研究、创新和相关产品恰当地传达给合适的人，这些都同等重要。这些因素有助于客户针对特定目的，做出能够满足其需求的产品和应用的明智决策。\n\
  \n为了更好地理解，可以看看 Azure IoT 生态系统，它将帮助你更好地解读这一层。\n\n物联网（IoT）连接了各种设备，并使跨业务的数据驱动决策成为可能，从而改变了人们与技术互动的方式。随着企业利用物联网来改善运营和推动创新，开发复杂的物联网应用需要强大的开发工具。作为对这些需求的全面回应，微软的\
  \ Azure IoT 软件开发工具包（SDK）使开发人员能够在 Azure 平台上构建尖端的物联网应用。本节将深入探讨 Azure IoT SDK 的领域，分析其关键组件，并解释其在物联网开发中的重要性。\n\
  \n\n\n### 现实场景\n\n**纳米传感器**\n\n*纳米技术*是一门在纳米尺度（极小的尺度）下研究粒子的学科。它已被广泛应用于医学领域，用于在疾病早期阶段进行治疗。当纳米技术与物联网、大数据分析和机器学习相结合时，其效果变得非常显著。\n\
  \n1.  向患者注射纳米颗粒，使其释放到血液中。纳米颗粒能够识别生物或化学变化。这一过程通过监测患者体内的化学和物理变化，从而在疾病早期阶段进行检测。其基本原理是：体内生物、化学和生理机制出现意外变化可能是疾病的征兆。\n\
  \n2.  纳米颗粒与可穿戴设备交互，以指示外来颗粒干扰体内正常流动所引起的变化。可穿戴设备持续从纳米颗粒接收数据。\n\n3.  可穿戴设备利用这些数据进行疾病诊断，进而使用预测性和规范性分析。\n\
  \n4.  机器学习结合认知建模和计算算法，学习体内机制的变化过程和行为，并有效、主动地诊断任何疾病。\n\n整个过程提高了疾病诊断的有效性和效率。因此，它有助于减少住院时间和成本。同时，它还能生成直观且有效的报告。\n\
  \n**监控**\n\n机器学习将监控提升到了认知智能的水平。机器学习为物联网系统提供了以下优势：\n\n*   可穿戴设备全天候提供健康警报和通知。但它们在追踪这些警报和通知的操作并正确记录方面通常效果不佳。\n\
  \n*   机器学习在神经网络的支持下，能够根据人类行为追踪活动并记录响应。\n\n*   记录的数据将被转发给医生。\n\n以下是一个有趣的未来应用场景的步骤：\n\
  \n1.  患者起床，地板和床上的传感器记录这一事件。\n\n2.  配备传感器的马桶检查患者的粪便和尿液，然后将详细信息上传到云端。配备传感器的牙刷检查患者的口腔健康。\n\
  \n3.  重要的健康指标，如脉搏、血糖水平和血压，被记录并上传到云端。\n\n4.  墙壁和地板中的传感器根据患者的动作评估跌倒风险。\n\n5.  利尿药物中含有微型发射器，可向可穿戴设备发送信号，表明患者已服药。\n\
  \n让我们再看几个医疗保健应用案例。这些案例也凸显了技术和应用程序的重要性。\n\n*   *改变患者行为。* 许多常见疾病是可以控制甚至预防的。例如，改善生活方式有助于预防\
  \ 2 型糖尿病、肥胖症和心脏病等疾病。然而，改变生活方式需要改变行为，这需要持续的提醒。为此，机器学习算法可以编译来自患者使用的互联健康设备和传感器的数据，以洞察他们的行为，并在这一转变过程中为他们提供指导。\n\
  \n*   *使用 SmokeBeat 改变吸烟习惯。* 一款名为 SmokeBeat 的创新软件能在用户不知情的情况下收集其吸烟习惯信息。该程序利用腕表或智能手环上的加速度计检测手到口的动作。SmokeBeat\
  \ 处理这些数据，并提供实时的认知行为疗法激励。为了提高效果，用户对此类激励的反应会被持续监控和记录。SmokeBeat 还会将用户的吸烟数据与其首选同伴群体的数据进行对比，从而建立一种鼓励性的社交网络。\n\
  \n*   *虚拟护理。* 在当今繁忙的医院环境中，护士可能会不堪重负，难以给予每位患者足够的个性化护理。医疗机构利用虚拟护士来解决这个问题。计算机生成的虚拟护士像真正的护士一样与患者交谈。她们友善、亲切且富有教育意义。\n\
  \n在医疗预约的间隙，虚拟护士比真实护士更频繁地与患者互动并提供信息。她们全天候随时可用，并能提供快速响应（比等待真实护士更快）。\n\n## 大数据分析技术栈\n\
  \n构建大数据技术栈取决于业务的需求和特定要求。此外，在决定大数据技术栈时，必须考虑三个 V（速度、多样性和容量；更多细节请参考第 1 章）以及分析基础设施的可用性。大数据技术栈能够创造价值。然而，数据的清洁度也受到需求、规则、业务逻辑和分析能力的指导。\n\
  \n通常，大数据技术被划分为多个层，以分离关注点和逻辑（见图 4-1）。以分层形式对复杂性进行逻辑细分，构成了大数据技术套件的构建模块。各层之间存在一些冗余，因为孤立的层无法实现此目的。\n\
  \n![](img/429391_2_En_4_Fig1_HTML.jpg)\n\n大数据分析的软件架构图。数据收集与集成之后是数据采集与存储层、分析层、预测与预报、算法优化、自然语言处理、表示与应用层以及用户。\n\
  \n图 4-1\n大数据分析栈\n\n注意\n\n数据处理和分析是“洞察”生成过程中的重要步骤，并且与机器学习紧密相关。机器学习和数据分析可以被视为一个层。然而，为了清晰分离，最好将它们分开（至少在逻辑上）。机器学习，包括其工作原理及与各项技术的关系，将在“机器学习”部分进行更详细的讨论。图\
  \ 4-1 展示了机器学习与大数据分析紧密绑定的一种方式。\n\n表 4-3 简要展示了大数据分析技术和流程套件。下一节将解释一些与大数据技术套件密切相关的重要软件、框架和库。\n\
  \n表 4-3\n大数据的主要技术\n\n\n\n| 技术名称 | 描述 |\n| --- | --- |\n| Hadoop | MapReduce 的一种实现。可与多种数据源协同工作。也被称为企业数据操作系统（详情请参阅“Hadoop”章节）。\
  \ |\n| Hive | 允许传统数据驱动型应用（如商业智能）对 Hadoop 集群执行查询。同时，它也被视为一种数据仓库服务，提供读取、写入和管理大型数据集的设施。它是\
  \ MapReduce 之上的一个抽象层（隐藏了技术内部的复杂性）（详情请参阅“MapReduce”章节）。 |\n| Hive QL | 一种类似 SQL 的语言，用于提交\
  \ MapReduce 任务。 |\n| Pig | 允许应用在 Hadoop 集群上执行查询。然而，它是一种类似 Pearl 的语言，而非类似 SQL 的语言（Hive）。详情请参阅“Pig”章节。\
  \ |\n| HDFS | 一种分布式文件系统技术。通常用于存储非结构化数据（详情请参阅“HDFS”章节）。 |\n| MapReduce | 一种分布式计算框架。然而，与新兴的计算框架相比，其计算速度较慢（详情请参阅“MapReduce”章节）。\
  \ |\n| HBase | 基于列存储的服务，以表格格式存储数据。 |\n| ZooKeeper | 分布式协调服务。 |\n| Yarn | Yarn 代表另一种资源导航器。在大数据分析系统中，其作用是充当中央操作系统，为技术栈提供和管理资源及应用生命周期。\
  \ |\n| Ambari | 用于配置、管理和监控 Hadoop 集群。 |\n| Avro | 一种数据序列化系统。其 .NET 版本也存在于微软的一个产品中，名为\
  \ HDInsight，这是 Hortonworks 提供的一个 Hadoop 发行版。它也被视为运行在 Microsoft Azure（微软提供的云平台即服务）上的\
  \ Apache Hadoop。 |\n| HCatalog | 提供 Hadoop 集群上数据的关系视图。像 Pig 和 Hive 这样的工具运行在 HCatalog\
  \ 之上，它充当了一个抽象层。 |\n| Oozle | 用于协调 Hadoop 作业工作流的应用。 |\n| Tez | 一个用于高性能批处理和交互式数据处理的应用框架。它使\
  \ Hadoop 作业更快，并保持了 MapReduce 的可扩展性和鲁棒性。它通常处理 PB 级的数据。 |\n| Azure Data Factory |\
  \ Azure 中最突出的 ETL 服务是 Azure Data Factory。它定义传入数据（就其格式和模式而言），根据业务规则和过滤器转换数据，扩展现有数据，然后将数据传输到易于其他下游服务访问的目标存储。它可以在\
  \ Azure 上执行 SQL Server Integration Services 包、自定义基础设施和管道（包含 ETL 逻辑）。 |\n| Azure\
  \ Data Lake Storage Gen 2 | 企业级大数据存储，开箱即用，具有弹性、高可用性和安全性。它可以扩展到 PB 级数据存储，并且与 Hadoop\
  \ 兼容。因为它构建在 Azure 存储帐户之上，所以直接受益于其所有功能。在整合了 Data Lake Storage Gen1 和 Azure Storage\
  \ 的功能后，创建了最新版本，即 Gen2。 |\n| Databricks | Databricks 的基础是 Apache Spark。用户可以通过此平台即服务访问托管的\
  \ Spark 集群。它提供了大量额外功能，包括用于管理 Spark 集群及其节点的全面网关，以及对笔记本创建、作业调度和执行、安全性和多用户支持等方面的协助。\
  \ |\n\n## 数据采集、集成与存储层\n\n这是大数据技术栈的底层或最低层。该层负责收集所有类型的数据（结构化/非结构化和半结构化）并进行存储。数据来自多个来源，包括物联网设备、社交媒体和\
  \ RSS 订阅源。由于在此层接收到的数据具有海量、高速和多样性的特点，一些公司使用数据湖作为其大数据存储库的来源。*数据湖*是一种数据采集和存储方法。它以其自然的状态、形式和格式存储并容纳原始数据。其主要目的是存储数据，而不是对其应用任何类型的智能和复杂操作。例如，数据如何/为何/在何处存储并不是数据湖关注的重点。其技术也不关心数据的治理和安全方面。\n\
  \n提供大数据技术的解决方案是一个巨大、开放且不断发展的市场。许多公司都在这个领域提供自己的解决方案。主要参与者包括 Apache、Hortonworks、IBM、Amazon\
  \ 和 Microsoft。Hortonworks 等公司提供了一套全面的大数据、大数据分析和机器学习工具与技术。有关更多详细信息，请参阅以下链接：\n\n*\
  \   Apache 提供的技术（来源：[`https://hortonworks.com/products/data-center/hdp/`](https://hortonworks.com/products/data-center/hdp/)）\n\
  \n*   Apache 的技术创新（来源：[`https://hortonworks.com/products/data-center/hdp/`](https://hortonworks.com/products/data-center/hdp/)）\n\
  \n一旦从多个来源收集到数据，就会将其集成为一个来源。过去十年中，数据的生成和可用性急剧增加，导致数据集成量激增。数据几乎无处不在，其数量、种类和速度都大幅增长。\n\
  \n每个组织都使用各种各样的程序，许多程序以独特的专有格式生成数据。数据也经常在公开市场上购买。\n\n即使在组织合并期间，也必须移动和合并数据。将来自多个来源的数据组合起来，以创建具有更重要性的新输出的实践被称为*数据集成*。\n\
  \n许多公司在这个领域提供了多种技术产品。简要了解主要技术将使您对数据采集、集成和存储有很好的理解。\n\n### Hadoop 分布式文件系统 (HDFS)\n\
  \n分布式文件系统是允许通过计算机网络从多个共享主机访问文件的任何文件系统。分布式文件系统可能包括透明复制、处理大型数据集的能力、一次写入多次读取以及容错等功能。它用于在廉价的商用硬件上存储大量数据。Hadoop\
  \ 分布式文件系统被 Hadoop 应用套件/生态系统用作主要的数据存储系统。\n\nHDFS 是一个可扩展、鲁棒、容错的基于 Java 的分布式文件系统。HDFS\
  \ 创建数据块的多个副本，并将它们分布在整个集群的计算节点上，以实现可靠、极速的计算。HDFS 分别存储系统元数据和应用程序数据。它将元数据存储在一个名为 *NameNode*\
  \ 的专用服务器上，并将应用程序数据存储在其他名为 *DataNodes* 的服务器上。HDFS 中的所有服务器都是完全连接的，它们使用基于 TCP 的协议相互通信。HDFS\
  \ 中的文件内容会复制到多个 DataNode 上以确保可靠性，并且其优势在于数据传输带宽成倍增加，因此有更多机会在所需数据附近定位计算。\n\n\n####\
  \ 核心 Hadoop 架构\n\nHadoop 集群基于主从架构（见图 4-2）。然而，其术语与传统主从架构有所不同。在 Hadoop 术语中，NameNode\
  \ 是 Hadoop 集群的主节点，负责文件系统命名空间和客户端的访问控制。JobTracker 将作业分发给等待中的节点。NameNode 和 JobTracker\
  \ 是 Hadoop 架构中的主节点。从节点包含 TaskTracker，负责管理作业执行。它承担全部责任，从启动、监控到捕获作业输出，并通知主节点作业完成情况。DataNode\
  \ 是 Hadoop 集群中的存储节点，代表分布式文件系统。TaskTracker 和 DataNode 在 Hadoop 集群中作为从节点工作。\n\n![](img/429391_2_En_4_Fig2_HTML.jpg)\n\
  \nHadoop 集群的树状图。带有作业跟踪器的名称节点连接到 3 个数据节点，每个数据节点都包含任务跟踪器、映射器、中间文件和归约器。\n\n图 4-2\n\
  Hadoop 集群的组成元素\n\nHadoop 拥有灵活、高效且稳健的架构。因此，它在支持单节点集群（所有对象都存在于单个节点上）和多节点集群方面同样有效。这样，JobTracker\
  \ 和 NameNode 可以分布在数千个节点上。\n\n#### HDFS 的显著特性\n\n以下是 HDFS 最有趣的特性：\n\n*   *可靠性和容错性*：它被设计为可靠地存储非常大的数据集（容错性），这得益于集群内或多个集群间的数据复制。通常，一组数据被可靠地存放在机器集群上。因此，如果一台机器宕机，数据仍可在其他机器上获取。它还能以高带宽将数据集流式传输到用户应用程序，以实现高性能。\n\
  \n*   *高可用性*：即使某些机器或硬件无法工作或已崩溃，数据仍可通过其他路径访问。\n\n*   *分布式存储*：HDFS 在分布式存储环境中表现出色，并能跨多个异构服务器执行计算。即使资源随需求增长（可扩展性），其有效性也保持不变。此外，它在任何规模下都保持经济性。\n\
  \n*   *开源*：它是一个开源项目，因此可以根据需要修改和定制代码。\n\n*   *可扩展性*：它具有高度可扩展性，这意味着添加新硬件很容易。可以轻松地将硬件添加到节点。它可以水平扩展，从而能够在不宕机的情况下动态添加新节点。\n\
  \n*   *灵活性*：Hadoop 能够轻松访问新的数据源，并利用不同类型的数据，包括结构化、半结构化和非结构化数据，从而从这些数据中产生价值。\n\n* \
  \  *快速*：Hadoop 独特的存储技术基于分布式文件系统，该文件系统从根本上将数据映射到其在集群中的任何位置。\n\n*   *经济性*：Hadoop 为大数据集提供了经济高效的存储解决方案。基于\
  \ Hadoop 的解决方案价格低廉，因为它运行在安装在商用硬件上的集群上。它不需要专用机器。因此，Hadoop 提供了巨大的价格节省。\n\n### Amazon\
  \ Simple Storage Service (S3)\n\nS3 是一个基于云的、可扩展、稳健且容错的文件系统。它是亚马逊提供的一个分布式文件系统。它可以作为大数据和基于分析的应用程序中的数据层来构建架构。然而，它可能需要额外的组件。Amazon\
  \ S3 提供了一个简单的基于 Web 服务的接口。它可以用于随时随地在网络上存储和检索任意数量的数据。它还提供了一个高度可扩展、可靠、快速且廉价的数据存储基础设施。亚马逊自身也使用\
  \ Amazon S3 来运行其全球网站网络。\n\n## 分析层\n\n该层通常为分析而组织和准备数据。它借助不同的流程、技术和算法，处理从数据采集层获取的海量且多样化的数据集。这里有多种分析工具、框架、技术和稳健的算法，它们具有不同的能力。根据需求和市场需求，会使用其中一种或多种技术的组合。该层将原始数据转化为可操作的见解。这一层处理多种类型的分析，包括描述性分析、诊断性分析、预测性分析和规范性分析。从技术上讲，许多作者将机器学习视为该层的组成部分之一。然而，本章将在机器学习部分讨论这些概念，因为机器学习库、框架和工具位于分析层之上。\n\
  \nApache 无疑是提供基于 Hadoop 的大数据解决方案的领导者。图 4-3 展示了 Hadoop 技术栈，其中显示了 HDFS 和 MapReduce\
  \ 在整个技术栈中的位置。\n\n![](img/429391_2_En_4_Fig3_HTML.jpg)\n\nApache Hadoop 生态系统的架构图。HDFS\
  \ 之后是 MapReduce、Pig、Mahout 和 Hive，左侧有 Zookeeper 和 Oozie，右侧有 HBase、Scoop、REST 和 ODBC。顶部是用于管理和监控的\
  \ Ambari。\n\n图 4-3\nHDFS 和 MapReduce 在整个 Hadoop 技术栈中的位置（覆盖了大数据分析的所有层）\n\n多家供应商正在大数据领域提供他们的解决方案，从数据收集到数据呈现，包括\
  \ Apache、IBM 和微软的产品。然而，很难涵盖所有这些供应商的所有产品。因此，本章将讨论范围限定在基于 Apache/Hadoop 的产品，并在少数地方提及其他供应商的产品。让我们从名为\
  \ MapReduce 的革命性技术开始。\n\n### Hadoop MapReduce\n\nHadoop MapReduce 是一个出色的软件框架，用于在分布式计算环境中处理大型数据集。MapReduce\
  \ 是 Hadoop 框架的核心和灵魂。它是一种编程模型，支持在 Hadoop 集群中数百或数千台服务器上实现大规模扩展。它运行在商用硬件的计算集群上。组织、企业和公司使用该框架来调度任务，以及监控和重新执行任何失败的任务。由于它是\
  \ HDFS 的子项目，其工作方式继承了 HDFS 的基本理念。\n\n术语 *MapReduce* 指的是典型 Hadoop 程序执行的两个独立且不同的操作。一个\
  \ MapReduce 作业通常将输入数据集分割成独立的数据组，这些数据组由映射任务并行处理。“映射”作业从可用的数据存储中获取一块数据，并将其转换为另一组数据，其中单个元素被分解为键/值对。该框架对映射的结果进行分类，这些结果成为归约任务的输入。\n\
  \n然后，“归约”作业将映射步骤的输出作为输入，并将这些数据键/值对组合成更小的 *元组* 集合（键/值对的常用同义词）。正如 MapReduce 这个名称所暗示的，归约作业总是在映射作业之后执行。通常，作业的输入和输出存储在分布式文件系统中。（图\
  \ 4-4 展示了 MapReduce 的整体架构。）\n\n![](img/429391_2_En_4_Fig4_HTML.jpg)\n\nMapReduce\
  \ 的流程图。数据源 1 到 N 通向一个数据层，随后是数据集 1 到 N，这些数据集经过处理并单独输出，然后合并成一个单一结果。\n\n图 4-4\nMapReduce\
  \ 架构\n\n\n\n#### MapReduce 单词计数示例\n\n*挑战*：统计给定文档中不同单词的数量。\n\nMap() 和 Reduce() 函数在\
  \ Hadoop 集群机器上并行运行，以并行方式解决这一挑战。这些函数的输入和输出均为键/值对。涉及以下步骤：\n\n1.  映射\n\n2.  归约\n\n\
  3.  整体计算\n\n![](img/429391_2_En_4_Fig5_HTML.jpg)\n\n一个表格，分别包含输入文件 1 和 2，内容为 machine\
  \ learning 和 machine learning now，随后依次是映射、混洗、归约和输出。该算法包括一个映射器、输入、解析文件并提取部分、归约器，以及为相同键添加值并显示。\n\
  \n图 4-5\n\n机器学习\n\n#### MapReduce 快速入门\n\nMapReduce 是改变大数据处理方式的主要算法。\n\n谷歌是 MapReduce\
  \ 的先驱。两篇主要论文是：\n\n*   第一篇论文是 Sanjay Ghemawat 等人于 2003 年发表的《谷歌文件系统》。它描述了文件如何在谷歌集群上以分布式方式进行处理。\n\
  \n*   2004 年，Jeff Dean 等人在其论文《MapReduce：大型集群上的简化数据处理》中详细讨论了 MapReduce。该论文描述了谷歌集群上使用的编程模型。\n\
  \nMapReduce 是谷歌内部用于索引万维网以支持谷歌搜索的框架。\n\n### Pig\n\nPig 位于 Hadoop 框架之上，用户无需编写基于 Java\
  \ 的 MapReduce 代码即可处理大型数据集。Pig 是一个用于创建与 Hadoop 配合使用的 MapReduce 程序的高级平台。Apache Pig\
  \ 允许 Hadoop 用户通过使用 Pig 脚本（一种简单、易于理解的脚本语言）来编写复杂的 MapReduce 代码。Pig 将 Pig Latin 脚本转换为\
  \ MapReduce，以便在数据上执行。\n\n存在多种编码方法和技术来解决大数据问题。Apache Pig 可以被视为 Hadoop MapReduce 的选项之一。每种编码方法和编程语言都有其优缺点。Pig\
  \ 也不例外。由开发人员评估并选择哪种编码方法或编程语言最能满足他们的需求和要求。\n\n然而，根据一般指导原则，不熟悉 Hadoop MapReduce 技术细节的程序员会发现\
  \ Pig 很容易上手。它易于入门且不那么混乱。Pig 可以通过遵循 UDF（用户自定义函数）进行潜在扩展。UDF 使用户能够使用他们选择的语言（包括 Java、Python、JavaScript\
  \ 和 Ruby）编写代码或程序。这些函数可以直接从编程语言中调用。\n\n### Apache Hive\n\nHadoop 的开发目的是组织和存储海量的、各种类型和格式的数据。数据分析师、企业和公司使用\
  \ Hive 来查询、汇总、探索和分析数据，这些数据有可能转化为可执行的商业洞察。表 4-4 展示了 Hive 的特性。\n\n表 4-4\n\nHive 的特性\n\
  \n| Hive 的优势与特性 | 详情 |\n| --- | --- |\n| 类似 SQL 的脚本 | 通过 SQL 脚本提供查询灵活性。用户可以使用：*子查询，如\
  \ IN/NOT IN*永久用户自定义函数*从 Flume 流式传输数据。Apache Flume 是一种分布式服务，用于收集、整合和将海量流数据移动到 HDFS\
  \ 中。*WHERE 子句中的 JOIN 关键字 |\n| 速度 | 提供：*更快的查询规划功能和基于成本的优化*通过 Hive 进行交互式查询 |\n| 集成\
  \ | 轻松与传统的数据库和 ETL（提取、转换、加载）工具集成 |\n| 支持可扩展和可伸缩的架构 | 易于扩展和伸缩。当数据量在异构环境中增长时，此功能非常有用\
  \ |\n\nHive 的一个重要扩展是 HiveMall，它是一个开源的、可扩展的机器学习库，提供了一系列机器学习算法作为 Hive UDF。UDF 允许您修改\
  \ Hive 评估数据和操作查询的方式。HiveMall 通过提供带有 SQL 抽象的交互式且稳定的 API，使机器学习对开发人员变得简单。它支持回归、分类、推荐、异常检测、k-近邻和特征工程算法。此外，HiveMall\
  \ 运行在 Hive 之上，无需编程即可执行基于机器学习的开发活动。它基于 Hive，因此 Hive 用户易于学习。\n\n表 4-5 对 MapReduce、Pig\
  \ 和 Hive 进行了比较研究。\n\n表 4-5\n\nMapReduce、Pig 和 Hive 技术总结\n\n| Pig | Hive | MapReduce\
  \ |\n| --- | --- | --- |\n| 脚本语言 | 类似 SQL 的查询语言 | 编译语言 |\n| 更高层次的抽象 | 更高层次的抽象 |\
  \ 低层次抽象 |\n| 与 MapReduce 相比代码行数更少 | 与 Pig 相比代码行数最少 | 与 Pig 和 Hive 相比代码行数更多代码行数：MapReduce\
  \ ➤ Pig ➤ Hive |\n| 与 MapReduce 相比开发工作量更少 | 与 Pig 和 MapReduce 相比开发工作量最少 | 开发工作量：MapReduce\
  \ ➤ Pig ➤ Hive |\n| 更少暴露于错误 | 错误数量最少 | 更容易出现错误 |\n| 处理非结构化数据（如图像、视频、音频、边界模糊的文本以及日志数据）效率较低\
  \ | 高效处理非结构化数据，如图像、视频、音频和文本 | 有效处理非结构化数据，如图像、视频、音频和文本 |\n| 代码效率 | 代码效率 | 与 Pig 和\
  \ Hive 相比代码效率更高 |\n\n\n\n### HBase\n\nHBase 是一种运行在 Hadoop 分布式文件系统之上的非关系型 NoSQL 数据库。NoSQL\
  \ 数据库技术旨在支持基于云的应用程序不断变化的需求，这些应用程序包含并处理海量的非结构化数据。HBase 正是为满足这些需求而设计的。它能够克服传统数据库存在的问题，例如扩展性差、性能缓慢、数据模型低效以及海量数据的数据分布问题。\n\
  \n前面提到的参数和瓶颈是关系型数据库的典型限制。HBase 为大数据集提供实时的读写访问。如果需要，HBase 可以线性扩展以处理海量数据集。它能高效地处理大量的行和列。当需要整合来自多种不同结构、格式、类型和模式的数据源时，HBase\
  \ 非常方便。HBase 原生支持将多种数据格式与 Hadoop 框架及技术生态系统集成。\n\n它通过 YARN（通常被称为大数据系统的操作系统）与其他数据访问引擎无缝协作。YARN\
  \ 和 HDFS 是 Hortonworks 数据平台（HDP）的基础组件。HDFS 为大数据存储提供可扩展、容错且经济高效的存储，而 YARN 则旨在提供集中式、灵活、健壮且可扩展的架构。它使用户和自动化应用程序能够同时处理多个作业。YARN\
  \ 还负责资源管理活动。YARN 的即插即用架构设计促进了多种数据访问方法。表 4-6 列出了关于 NoSQL 和关系型数据库的有趣信息。简要对比一下 NoSQL\
  \ 和 RDBMS 是很有益的。\n\n表 4-6\n\nNoSQL 数据库、RDBMS 和 MangoDB 的多个方面\n\n| RDBMS 与 NoSQL\
  \ 对比 |\n| --- |\n| **优势** |   |\n| **RDBMS** | **NoSQL** |\n| 结构化且支持事务。能高效处理高性能工作负载。\
