  ## 机器学习的最新进展


  到目前为止，在本章中，我讨论了在过去几十年中机器学习领域取得的突破。我还描述了大数据流如何影响高速互联网和云计算等技术。然而，在与机器学习密切相关的领域，如深度学习，正在发生大量创新。深度学习将机器学习作为其核心，但其影响范围更广。它涵盖了推荐系统（Netflix
  和 Amazon）、人脸识别技术（Facebook）、电子邮件垃圾邮件过滤器（Google 和 Microsoft）以及语音识别系统（Apple 的 Siri）。


  进步的深度通常不为普通用户所知，直到它公之于众。但基于进步的速度，我们可以非常肯定地说，过去五年发生的发展与未来五年我们将看到的相比，几乎微不足道。基于机器学习技术发展和吸引力的当前状态，以下部分讨论了一些可能取得卓越进展的领域。




  ### 基于图像的识别


  借助深度学习，当前基于图像的识别技术将实现质的飞跃，因为该领域正在进行大量研究。例如，基于机器学习的系统/应用将能够高精度地识别图像，并辨认出图片中的人物及其行为。其最大优势在于，应用仅凭图像本身就能完成这一任务，对外部数据的依赖更少。现代的深度学习算法和模型不仅能识别新图片，还能从整个人类历史图片和视频片段中获取洞察。这将彻底改变这些资产的整理、定位、查看和分享方式。例如，YouTube
  可能很快就能智能地找到与你观看并喜欢的视频片段或镜头内容相关的素材。这一切将仅基于视频的视觉内容来完成。


  ### 案例研究：人脸识别


  #### 挑战


  为跨多个领域的应用设计一个人脸检测与识别算法。


  #### 方法


  创建了一个人脸数据库，并使用 Haar 级联算法进行人脸检测。将捕获的人脸图像与现有的人脸图像数据库进行匹配。采用基于主成分分析的人脸识别算法。


  #### 结果


  人脸识别准确率达到近 60%，人脸检测准确率达到 70%。这可用于加强组织内的安全措施，或在零售店中识别并优惠老顾客。


  来源：*BlueOcean AI 网站*


  ### 医疗保健


  机器学习分析和存储海量数据的能力（结合大数据技术）将为医生和患者提供实时且急需的第二诊疗意见。这将使他们能够按需诊断和治疗疾病。这些支持物联网的智能可穿戴计算设备和个人健康监测系统可以实时检测各种健康和健身状况，并向患者发送通知，从而降低患病风险。该领域的最新进展将使这些技术在未来五年内得到广泛应用。佩戴这些设备可能会像今天拥有手机一样普遍。机器学习正通过推动突破性进展，在医疗保健领域引领一场静默的革命。


  ### 旅行与通讯


  实时翻译技术是许多行业和企业押注的领域。在不久的将来，我们将在手机上看到能够将语音和文本（所有类型的对话）即时翻译成听者母语的应用。这些应用将做到天衣无缝，让听者感觉不到差异。在全球化的世界形成之后，语言界限已变得模糊。企业/公司不断追求全球市场。谷歌和微软等科技巨头敏锐地察觉到了市场需求，并开始采取必要措施来构建此类工具。它们早期的一些产品包括谷歌个人助理和微软小娜。然而，这仅仅是个开始。基于当前的研究状况，请准备好迎接未来即将涌现的大量此类应用/产品和服务。


  ### 广告


  机器学习的最新进展使广告公司能够将增强现实技术与品牌推广相结合。这将使广告商能够通过适当识别产品和服务的深度、相对和可量化的大小、光照和阴影，将产品和服务信息无缝地植入现有内容中。而且，这不仅限于新内容；它可以扩展到任何内容。因此，这将使广告公司能够将任何历史视频资产与新技术相结合。计算机视觉技术公司
  Mirriad 已经尝试了这一点。这项技术的进步将彻底改变广告公司的能力。


  ### 术语解析


  *虚拟现实* 用于创建逼真的模拟和再现。它营造出一种沉浸式环境，让用户感觉仿佛在现实生活中与数字环境进行交互。


  *增强现实* 通过刺激感官，提供数字增强功能来补充现有的现实生活情境。虚拟现实的基本元素是通过用户佩戴的头显或其他 VR 设备实现的。通常，这些虚拟现实设备会显示或投射现实生活环境的模拟。这些设备提供的环境是沉浸式、交互式的，并给人以真实生活环境的感觉。由于虚拟现实设备有多种价位和款式，公司和用户很容易使用这项技术。例如，房地产行业可以利用这些技术，让潜在客户真实感受待售房产。增强现实是一种强大、精密、便携且经济高效的技术。它使消费者能够与公司或品牌进行互动、丰富且有意义的体验。


  由于这个创新驱动的市场，基于机器学习的产品、应用和服务正在以非常快的速度商业化。这些领域只是众多领域中的一小部分。经济的几乎所有部门（垂直和水平领域）都深受这个机器学习新时代的效率和效果的影响。我们已经看到消费者对预测性应用和产品的需求在增长，而这些本质上都需要机器学习。目前，我们只是触及了可能性的表面。如果事情按照我们预期的轨迹发展，机器学习的黄金时代很可能使未来五年的技术成为迄今为止最激动人心的时期。


  ## 更多案例研究


  本节包含两个最终的案例研究。


  ### 案例研究：机器学习文本分析


  #### 挑战


  客户正在从多个来源（技术论坛、呼叫中心客服记录、电子邮件和聊天）捕获消费者对话。他们目前正在基于最小化的样本量手动对客户体验（文本数据）进行分类，这无法提供客户体验洞察的整体视图。


  目标是实现对整个数据集的文本分类自动化，这将使他们能够收集关于客户体验的详细洞察。


  #### 方法


  他们收到的数据主题广泛，每一行都有六个级别的分类。第 5 级拥有最多的不同节点，共 4277 个，其次是第 3 级，有 616 个节点。


  他们对论坛、客服记录、聊天和电子邮件数据进行了合并和清理，创建了 130,000 行训练数据。工作的最初重点是简化复杂的层级结构，以确保根据业务需求进行适当的分类。


  他们设计了一套全面的基于自然语言处理的规则集，并开发了一种机器学习算法来构建一个自动编码引擎，以确保能够捕获大多数类别。他们创建了业务规则，并与同义词集结合来构建模型。


  #### 结果


  准确率达到近 70%。


  来源：*BlueOcean AI 网站*


  ### 案例研究：自动化将解决时间缩短 50%




  #### 挑战


  在七个月的时间里，一家游戏行业领军企业收到了近 50 万个支持案例和超过 90 万封电子邮件，亟需提升其客户支持流程的效率。支持团队严重依赖回复模板，但可用的模板数量超过
  8500 个。此外，缺乏有效的自动回复机制或模板选择流程来帮助客服代表快速选出最佳模板。尽管他们的支持软件记录了每个回复模板的使用频率，但并未提供哪个模板用于哪个案例的信息，导致技术支持人员每次处理新工单时都得从头开始。


  #### 方法


  Wise.io 与这家公司紧密合作，帮助其模板库变得更加实用和高效。通过应用先进的自然语言处理（NLP）技术，Wise.io 能够识别出可从库中删除的重复模板。随后，Wise.io
  开发了一个应用程序，该程序能根据过去对类似案例的回复，推荐最合适的模板。推荐的回复会直接显示在客服代理的视图中，这样客服代表无需学习新的工作流程就能利用这些建议模板。


  #### 结果


  通过这种自动识别方法，这家游戏公司成功将其模板库减少了 90%以上，使得代理培训和使用管理变得更加容易。此外，通过向客服代表展示推荐的回复，中位解决时间减少了超过
  50%，这意味着代理在相同时间内可以解决两倍数量的工单，或者能够更深入地处理那些真正需要更多关注的客户问题。


  来源：*Wise.io 网站*


