- '# 2. 机器学习的实用概念


  帕坦加利·卡什亚普博士^(a*)


  ^a 印度卡纳塔克邦班加罗尔


  本章至关重要，因为它讨论了机器学习的基本且实用的概念。我并非采用学术方法来解释这些概念。我将我的思考和精力集中在为你提供在实践决策中有用的概念上。因此，在解释概念、术语和技术细节时，我会使用有助于从本章中提取相关见解的示例和案例研究。


  本章从机器学习的演变和历史开始，并探讨了不同思想流派与哲学之间的联系。它带你穿越过去几十年的进步，进入人工智能的世界。之后，它展望了机器学习未来的应用前景。本章还包含一节关于机器学习正在创造的商业机遇的内容。这将为你提供对机器学习赋能领域中正在涌现或已经存在的商业机遇的洞察。同样，对于此类工具，会广泛使用相关的示例和案例研究。


  应用领域和商业机遇之间只有一线之隔。一项技术的应用领域也可能成为机遇领域。例如，机器学习被广泛应用于零售行业，进行不同类型的预测和推荐。同时，利用机器学习技术增强现有产品和服务、创造新市场，也存在着巨大的商业机遇。他们可以通过基于习惯/行为分析得出的推荐来吸引客户，从而实现这一点。因此，对应用领域和商业机遇的并行讨论，将提供该主题最前沿和最具未来感的视角。


  我还讨论了一些机器学习中涉及的重要模型、算法、工具、框架和编程语言。有一节关于机器学习架构的内容，为你提供了机器学习“通用”架构的整体和综合视图。简而言之，本章将为你提供对所讨论技术的全面洞察。


  ## 连接历史、演变、机器学习与人工智能


  人工智能领域建立在自动化人类思维及其认知能力的可能性之上。广义上讲，人工智能技术试图模拟和再现人类的思维和行为。这些思维和行为可以进一步分类为思考、说话、感觉和推理。设计程序使计算机更智能的科学，其目标包括“让计算机做人类更擅长的事情”。


  历史上，希腊、印度和中国的学者们坚信“思维机器”的概念。他们认为“思维机器”是可能的，并且是可以建造出来的。他们的哲学家、心理学家和数学家通过他们的思想、发明和发现致力于此。然而，他们大多在各自封闭的地理范围内孤立地工作。由于他们没有像我们现在这样能够随时保持联系的“奢侈条件”，因此从未产生过一种能被所有人接受的统一思想。


  例如，在 17 世纪，戈特弗里德·莱布尼茨、托马斯·霍布斯和勒内·笛卡尔探索了仅用数学符号解释思想的可能性。但他们的想法并未相互关联，而是孤立存在的。用符号和逻辑步骤来解释思想是算法研究的一部分。算法开发是数学的一个分支。算法在人工智能和机器学习的演变中发挥了关键作用。因此，不讨论算法，就不可能讨论人工智能和机器学习的演变与发展。


  将复杂问题的事实和数据表示、解释并分解为符号和理性/逻辑步骤，是算法的核心主题。算法因其在解释问题时的简洁性和有效性，而成为解决问题的首要工具。算法的发展和运用可以追溯到巴比伦人，他们因在公元前
  1600 年发明了首个分解和平方根方法（可通过逻辑步骤实现）而受到赞誉。然而，欧几里得在公元前 300 年发现最大公约数，以及阿耶波多发现零，是人类历史上算法发展和影响的一些最早例证。


  阿达·洛芙莱斯在 1843 年推导出第一个旨在由机器执行的算法，这将被视为算法发展的一个里程碑。阿达的工作奠定了基础，但她从未谈论或撰写过任何接近人工智能的内容。正式地，人工智能诞生于艾伦·图灵的论文《计算机器与智能》。这篇有趣的研究论文发表于
  1950 年。在论文中，图灵发明、解释并从理论上试图确立机器能否思考这一观点。该论文解释并传达了一些非常重要的概念，但也存在局限性。不利的一面是，这篇论文不够通用，主要局限于概念层面。


  图灵的论文借助基于游戏的假设解释了人工智能的概念。这些游戏涉及三个玩家。玩家 A 是一台计算机，玩家 B 是一个人。每个玩家都必须向玩家 C（一个看不见玩家 A
  或玩家 B 的人）证明自己是人还是计算机。如果玩家 C 无法持续地判断谁是人谁不是，那么计算机就赢了。我们可能同意或不同意这个假设，但它无疑为人工智能奠定了基础。




  术语*人工智能*最早由约翰·麦卡锡于 1955 年提出。他将其解释为“智能机器的科学与工程学科”，并强调计算机具备“无需显式编程”的知识处理能力。这一理念在当时颇具新意。他在阐释人工智能时，对“显式编程”的概念进行了说明。


  人工智能因其跨学科特性以及解决人类重大问题的期望而极其复杂。在 20 世纪 50 至 60 年代人工智能诞生与发展的初期，人们对其抱有极大乐观态度。最初，人们相信借助人工智能的潜力与力量，世界将在短短
  20 年内制造出智能机器。


  如前所述，人工智能包含并受到许多其他学科的影响。浅层学习与深度学习的概念便是一个例证，它们最初源于心理学。这种影响背后的主要原因在于人工智能自身的目标。它主要被构想、记录、解释并想象为一种能够处理“思维过程模拟”的机器。因此，人们期望具备人工智能的系统能够模仿人类的物理和认知行为。同样，人类的思维过程也受到社会学、心理学和生物学等多重因素的影响。因此，人工智能在发展过程中自然会将人类活动的多个领域纳入其范畴。


  在过去几十年里，机器学习已发展成一门独立的科学。追溯历史，我们可以在计算机科学和统计学中找到机器学习的基因。早期，机器学习从计算机辅助教学系统中汲取灵感。多年来，机器学习反过来又促进了该领域的发展，催生了基于人工智能技术的智能教学系统。然而，机器学习实际上起源于模式识别和神经网络，这些都是人工智能的子领域。计算机无需编程即可执行特定任务集便能学习——这一理论所支撑的观念，正是机器学习发展的主要动因。


  如今看待和处理机器学习的方式已与其原始形态不同。早期，机器学习被视为一项对计算、处理和存储能力要求极高的任务，而现在它被看作一种数据驱动技术。这种思维转变迫使企业和研究人员开展实验，验证计算机从数据（或大数据）中学习的能力。在此过程中，机器学习的迭代特性变得至关重要，因为当模型接触到新的数据集时，它们能够独立地从数据湖中适应模式（参见“术语解析”部分）。它们通过从之前的计算或迭代中学习，来产生可靠、高效且有效的决策、结果和行动。


  ## 术语解析


  *   *机器智能*：与人工智能相关的能力，如机器学习、深度学习、认知分析、机器人流程自动化（RPA）和机器人，共同构成了机器智能。能够增强员工绩效、自动化日益复杂的工作负载，并开发模拟人类思维与互动的“认知代理”（一个用于基于机器学习的智能个人助理的术语）的算法能力，均属于机器智能范畴。


  *   *机器人流程自动化（RPA）*：这是一种软件机器人，通常也称为“机器人”。它通过模仿人们与软件应用程序交互的方式，用于完成单调的业务流程。


  *   *数据湖*：一个巨大但易于访问的集中式数据源，包含海量的结构化、半结构化和非结构化数据。典型的数据湖被认为是一个能够存储大数据中一切内容的数据存储库。数据湖主要是大数据的“存储”站点，并不对所存储的数据进行任何显著的分类或隔离。因此，与数据仓库相比，数据湖的结构化程度较低。数据湖作为多个智能系统的数据源。一旦这些系统获得经过处理、分析和优化的数据，便会将其用于不同目的。任何类型的分析或机器学习活动通常都在数据湖的“已评估”数据上进行。


  *   *数据孤岛*：驻留在 PDA（个人数字助理）或其他计算设备上的数据存储库，这些设备没有或仅有有限的外部连接能力。因此，这限制了用户与其他设备同步或复制数据的能力。因此，当新数据添加到系统时，将“新添加的数据”移动到其他地方变得困难或不可能。从数据库的角度来看，数据孤岛就像一组相关的表。例如，一个数据库有
  15 个表，其中 10 个属于一个名为 group1 的组，5 个属于 group2。条件表明 group1 和 group2 彼此没有关联。在这种情况下，您的数据库或模型就存在两个数据孤岛——group1
  和 group2——它们孤立地工作。


  参考文献：


  *   [`http://labs.sogeti.com/wp-content/uploads/2015/01/machineintell-en.pdf`](http://labs.sogeti.com/wp-content/uploads/2015/01/machineintell-en.pdf)


  *   [`https://www2.deloitte.com/content/dam/Deloitte/global/Documents/Technology/gx-tech-trends-the-kinetic-enterprise.pdf`](https://www2.deloitte.com/content/dam/Deloitte/global/Documents/Technology/gx-tech-trends-the-kinetic-enterprise.pdf)


  IBM 的亚瑟·塞缪尔是第一个使用“机器学习”这一术语的人，当时他正在开发第一个名为跳棋游戏的自学习计算机程序。在塞缪尔的工作之前，没有人正式提出计算机可以自我编程的想法。普遍的思维和假设是，要让计算机执行任何任务，都需要“预先编程”。


  机器学习的更正式定义出现在 90 年代末，由汤姆·米切尔（1998 年）提出。他指出：“如果一个计算机程序在某一类任务（T）上的性能（P）随着经验（E）的增加而提高，那么可以说该程序从经验（E）中学习。”简而言之，如果一个计算机程序在数据集上运行时，能够以迭代的方式随着时间的推移以越来越高的准确性预测出确定的结果，那么它就被认为是自学习的。


  ## 机器学习、人工智能、大脑与智能商业


  根据约翰·冯·诺依曼（计算机科学先驱，提出了计算机的第一个正式结构）的观点，神经元可以根据其输入从“模式”中学习。神经科学家现在称之为*神经递质浓度*。然而，冯·诺依曼当时并不了解神经学习是如何运作的。直到最近神经科学的进展才告诉我们，学习是通过大脑中现有神经元之间连接的生成/创建和破坏来进行的。




  ## 术语解析


  *   *神经元*：人脑包含约 1000 亿个神经细胞，也称为*神经元*。神经元拥有收集和传递电化学信号的非凡能力。计算机中的门电路和导线可被视为神经元。神经元与其他细胞具有相同的特征和相似的结构。然而，其内在的电化学特性使它们能够远距离传输信号。它们拥有相互连接并在彼此之间传递信息的卓越能力。


  冯·诺依曼指出，神经处理的速度极其缓慢，大约每秒进行一百次计算，但大脑通过大规模并行处理弥补了这一不足。神经元以“并行”计算的方式相互连接并创建新的通路和回路。同样，现代计算机也通过并行处理来执行/学习任务。如前所述，类脑人工智能并非新概念。能够模仿大脑基本结构的神经网络概念，在
  20 世纪 80 年代的科学界极为流行。但在当时，人工智能领域缺乏计算能力以及海量高质量的训练数据。计算能力和数据对于由算法驱动的模型真正发挥作用都是必不可少的。


  近年来计算机硬件的进步使得处理能力（在速度和内存方面）的成本降低。因此，科学界和工业界的一部分人正努力通过计算机实现人类智能。这一努力的成果以多种机器人和大型设备走出实验室的形式呈现。实现“人类智能”的目标之一，是为了在商业上获得超越竞争对手的优势。IBM
  Watson 就是其中一个例子。科学界和工业界（主要是包括初创企业在内的商业界）正试图通过多种“快速”产品和服务，从近年来的技术进步中获利。他们利用已有的平台、服务和框架，创建聊天机器人（自动回复用户查询的机器/软件）这类产品/服务。深度学习、自然语言处理等技术为这些平台提供了支持。


  新一代企业家正采用“我优先”的方法，接触“目标明确且专注”的客户。这意味着，他们将自己描绘成真正的创新者，以及突破性机器学习产品、应用和服务的提供者。他们“首次”出现在市场上，并有可能颠覆市场/行业格局。为了证明自己的观点，他们快速创建原型，并以敏捷的方式将其转化为产品。他们避免从头开始进行广泛的研究。


  然而，两者现在都押注于“数据”，这些领域的大部分成就都是由数据本身驱动的。


  机器学习的实际学习能力是通过学习算法实现的，这些算法代表了人脑中的神经网络（因为它最终试图模拟大脑的行为）。机器学习算法的基本“意图”是寻找类似于大脑的模式。人工神经网络的模拟模型帮助系统收集和处理关于给定数据集的信息。然后，凭借其自学能力，它推断数据以预测未来的事件和发生情况。这一整体过程的最终结果，表现为机器和人类共同做出的逻辑决策。


  人类通过试错法以及持续不断的逐次逼近过程来学习和理解。人类针对特定任务构建一个理论，并根据第一次尝试或逼近的结果来调整该理论。这个过程迭代进行，直到达到最优结果。机器学习算法的工作方式与此类似。随着机器学习系统收集和处理越来越多的数据，其结果会越来越好。这是因为这赋予了它们优化输出的能力，并帮助它们以越来越高的精度预测现有变量之间的关系。为了更好地理解这一点，想象一下，当一个孩子出生时，他们的大脑是一张白纸。他们通过不同的方式开始学习，包括各种数据来源，如观察、书本学习、声音等等……这同样适用于机器。它从不同数据源和算法接收的数据中学习。




  ## 机器学习通用架构


  图 2-1 展示了机器学习系统的通用架构。通常，它包含六个部分。不过，可以根据项目需求、待创建的系统以及具体要求进行定制。


  ![](img/429391_2_En_2_Fig1_HTML.jpg)


  一张框图展示了机器学习的通用技术架构。


  图 2-1


  机器学习通用技术架构框图


  以下列表包含每个部分的描述：


  *   *数据采集*（收集和整理数据集）：要创建一个机器学习系统，你需要两个重要的东西——数据和模型。在采集/收集数据时，你必须拥有足够高质量的数据。根据经验法则，数据越多，预测准确的可能性就越大。因此，你必须非常谨慎地选择数据来源（步骤
  1）。


  *   *数据准备*（连接、过滤、清洗数据集）：一旦你为机器学习系统准备好了数据，就需要对其进行处理。通过提供适当格式的数据，你使机器学习系统能够进行后续处理。学习系统接收特定格式的数据，而不是原始和临时的格式。此外，需要对数据集执行多种转换操作，包括过滤、处理、采样和缩放。成功完成这些步骤后，数据会被缩减（转换）为所需格式。例如，在准备数据集时，你需要清理缺失值，以特定格式编辑列，并将数据集拆分为训练集和验证集。这使你能够将数据输入到选定的训练模型中（步骤
  2）。


  *   数据分析的初始阶段称为*数据探索*，它涉及查看和可视化数据，以立即发现洞察，或指出需要进一步调查的区域或趋势。用户可以通过使用交互式仪表板和点击式数据探索快速获得洞察，从而更好地理解全局。*数据粒度*是你的数据所能描述的信息量。因此，粒度越高，它能传达的细节就越多。人们可以通过数据可视化快速有效地分析数据，尤其是海量数据。它通过提供清晰的数据可视化表示，使员工能够更准确地基于数据做出决策。


  *   所有这些细粒度数据都可以通过数据可视化转化为有价值、美观且易于理解的业务信息。


  *   *训练模型*（使用机器学习进行泛化）：在为你工作创建准确的机器学习模型的过程中，你需要发现哪种类型的分析能帮助你实现目标。相应地，你需要训练你的模型。


  一个使用从未见过的数据集来检测模式或做出决策的程序被称为机器学习模型。机器学习模型也是一种算法的表示，它通过搜索大量数据来寻找模式或预测未来结果。机器学习模型是人工智能的数学引擎，由数据驱动。你也可以将模型视为一个经验丰富的算法。例如，机器学习算法可以分析并准确识别自然语言处理中从未听过的词语或词组组合背后的意图。模型可以通过两步过程摄取数据。这可以进一步用于多种目的，包括训练模型。


  *   数据收集涉及从各种来源获取信息，包括数据库、API、传感器和外部数据集。


  *   在摄取之前，必须发现并修复数据中的错误、不一致和缺失值。


  它可以是分类分析（一个典型例子是在系统中识别垃圾邮件与非垃圾邮件）、聚类分析（是否需要自动分类？）或回归分析（我的模型是否要进行预测和预报？）。完成此步骤后，你需要比较多个可用模型的结果。这项工作能让你知道哪个模型对你的数据集最有效（步骤
  3）。


  让我们以更系统的方式来看待这个问题：


  *   *评估/测试模型*（模拟和交叉验证）：在深入细节之前，我先定义一下交叉验证。基本上，交叉验证是一种机器学习方法，常用于评估数据集的变异性，以及基于该数据集开发的任何模型的可靠性。一个带标签的数据集作为输入提供给交叉验证模型组件。此外，交叉验证可用于测试多个机器学习模型，方法是在输入数据的不同子集上训练它们，然后比较结果。交叉验证可用于发现过拟合，即模式无法泛化的情况。


  机器学习模型的性能是一个非常重要的阶段。它让你了解一个训练好的模型对数据集的预测有多成功。同时，评估和交叉验证是衡量所考虑模型性能的既定标准方法。两者都为你提供评估指标，使你能够评估和判断另一个模型的优劣，从而做出最佳选择（步骤
  4）。


  *   *部署*（在评分中运行；跟踪概念漂移）：假设前面的步骤都成功完成，并且你对模型的结果（基本上是数值）感到满意，这有力地表明你的评估是成功的，模型已准备好进入下一步。由于你在评估过程中尝试了多个模型，你必须清理所有内容，并确保只留下一个性能最优的模型。你评估机器学习模型以确保它们按预期运行，并且足以胜任其设计目的。模型训练阶段完成后，即进入评估阶段。评估有助于分析模型的主要缺陷。机器学习算法寻找各种模式和趋势。并非所有数据集或用例都适用于同一种算法。你必须运行多个测试，评估机器学习算法，并微调其超参数，才能找到最佳答案。*超参数*是其值影响学习过程并定义学习算法最终学习到的模型参数值的变量。


  *   *最后，发布/部署你的模型*（在 Azure ML 中，你需要定义输入和输出，然后运行并将其发布为 Web 服务）：更多详情请参考步骤 5。


  *   *诊断问题并优化系统*：在（通常的）情况下，如果系统第一次未达到成功标准，你需要诊断问题并优化系统。如果当时没有采取纠正措施，将导致预测精度下降。可视化是识别和展示数据、模型或算法问题的强大工具。然而，也可以使用从模型中采样的合成数据来诊断问题（步骤
  6）。*合成数据*是故意创建而非实际事件产生的信息。它通过算法生成，用于训练机器学习模型，并作为生产或运营数据测试数据集的替代品。


  注意




  完善系统意味着对数据、模型、可视化、推理和评估进行净化。这是一项持续的活动，旨在使模型趋于完美。诊断问题并完善系统必须反复进行，直到系统达到预期应用所需的性能水平。基于模型的机器学习可以大大加快这一反复完善的过程。完善建议需要立即应用于模型。这允许对多个模型进行快速探索。


  ## 机器学习：你与你的数据


  机器学习是一门古老的科学，但由于异构来源以快速生成海量数据，它正获得发展势头。虽然许多机器学习算法已经存在了很长时间，并继承了统计学的传统，但借助复杂的分析技术，能够自动、反复、越来越快地对大数据应用复杂的数学计算和逻辑，是近期才有的发展。


  ## 与机器学习相关的技术


  本节介绍一些常见的机器学习及相关技术及其关系。它将帮助你理解一些重要概念。


  *   *数据科学*：从更广泛的层面来看，数据科学是数学科学、统计学和编程的综合学科。然而，它不应局限于这些研究领域，还应扩展到人工智能、统计行为科学、数据库技术、心理学、社会学、认知科学和神经科学。


  *   *数据分析*：一项调查活动。在数据分析中，分析师在扫描可用数据集后，会获得隐藏在数据集中的见解。


  *   *数据解析*：当你对可用数据集应用数学、统计学和算法，以发现其中的见解和有意义的关联时，这个过程称为数据解析。解析是分析的结果。而分析是可用于分析数据的方法或一组方法。


  *   *预测性解析*：构思并生成一个定量模型，该模型允许基于大量历史数据/信息预测结果或结论，这可能是一项复杂且技术密集的任务。输入数据包含众多变量，需要同时考虑它们。其中一些变量是相关的，而另一些在确定结果时可能不那么重要。预测模型决定了可以从数据中提取哪些见解，并用于在给定场景中做出准确且相关的预测。一个好的模型允许并乐于接受变化，以便能够适应变量的变化。有时需要改变以提高可预测性。正确的改变可能会增加期望结果的可能性。


  *   *数据挖掘*：在可用数据集中发现模式。这个术语在 90 年代末和 21 世纪初变得流行，当时组织意识到了整合数据及其用途的力量。通过使用这项技术，来自异构来源的数据被汇集在一起，以发现以前未知的趋势、异常和关联。数据挖掘允许在没有确切目标的情况下搜索海量数据。它通过使用暴力分析和神经网络等技术，帮助识别可用数据集中的关联。


  注意


  数据挖掘可以被视为从可用数据中提取见解的许多方法和技术的超集。该技术可能涉及传统的统计方法或技术，或机器学习等高级概念。数据挖掘涵盖的一些技术包括统计算法、机器学习、文本解析、时间序列分析以及其他解析领域。数据挖掘还包括数据存储和数据操作的研究与实践。


  *   *深度学习*：正在使用技术和算法来识别图像中的特定对象并执行自然语言处理。借助计算资源、大量数据和特殊类型神经网络的综合能力，深度学习可以识别大型数据集中的复杂模式。研究人员、机构和企业现在正寻求将深度学习的模式识别能力应用于更复杂的任务。例如，它被应用于自动语言翻译、医学分析以及其他重要的社会和商业问题领域。


  *   *浅层学习*：浅层学习和深度学习的概念最初源于心理学。广义上讲，浅层学习指的是对主题“不了解深层概念”的表面理解。例如，你死记硬背阅读内容，而不试图理解其潜在含义或意义。而深度学习则涉及更详细地探索主题/阅读内容。它包含你理解基本原理的意愿。此外，它还关乎你提出自己论点的能力。简而言之，浅层学习是关于记忆事实，而深度学习是关于构建逻辑和深层次的论点。


  人工智能领域将深度学习算法与包含两层或更多层神经元的神经网络联系起来。这些算法主要用于与模式识别相关的任务。然而，它们也用于图像、视频和语音识别活动。广义上讲，未被归类为深度学习的机器学习算法被称为浅层机器学习算法。对于涉及大量训练数据和更大计算能力的任务，深度机器学习算法是一个不错的选择。此外，对于没有明确特征的数据集，深度学习始终是更好的选择。因此，在图像和语音识别等领域，它被广泛使用。如果数据已经具有强大的特征，那么浅层机器学习算法是一个不错的选择，因为它们有效且效率更高。


  机器学习诞生于人工智能，因此它们的关系非常密切。在更广泛的层面上，深度学习、模式识别和浅层学习都是相关的。机器学习是一组算法和一套技术，用于设计能够从数据中学习的响应式自动化系统。机器学习算法通常具有强大的数学和统计基础。它们与领域知识和数据预处理没有紧密耦合。因此，机器学习也可以定义为计算机科学的一个领域，它使用统计方法来创建能够随时间改进并在人类不太可能手动发现的海量数据中检测模式的程序。与人工智能一样，机器学习试图用参数的自动检测来取代显式编程。然而，机器学习处理的是包含离散样本（包括正例和反例）的非聚合数据。例如，如果有人想在金融数据集中查找/检测欺诈行为，他们需要显示特定于欺诈的有效交易示例的单个交易记录。




  ## 机器学习的必要性


  我们大多数人有时会认为世界混乱无序，这种不确定性引发了许多问题。然而，有些人将这种“问题”视为商机。他们开始寻找解决方案，利用数据和技术将这种不确定性或不可预测性转化为可预测性。他们开始为新兴企业提供围绕预测的解决方案。老牌成熟企业则磨练自身技能，推出产品和服务，或从供应商处购买这些服务，以维持和加速市场发展。


  IBM Watson、微软认知服务以及众多其他产品创造了一系列新的服务。成功案例，例如 Netflix 采用机器学习技术来预测客户行为并提供“个性化”服务，最终提升了其收入和客户满意度，这为企业和客户都带来了新的启示。同时，它也展示了基于推荐的服务、应用和产品的潜力。我们可以看到，软件/应用/机器正在准确预测客户行为，而这在历史上曾以其不可预测性而闻名。


  挖掘、编译和使用充足的数据，并全面评估所有涉及的变量，可能无法准确预测即将发生的事件。但它们无疑会让你更接近那个目标。机器学习提供了能够衡量众多变量的算法。例如，一个群体或个人在特定气候条件下表现如何？当一名超级球星被球队开除时，某支体育队能得分/获得多少分？在特定条件下，球队的最佳阵容是什么？


  借助数学（更准确地说是统计学），受过训练的人可以调整和运用数学变量来获得期望的结果。但他们无法同时处理成千上万个变量。从神经学角度看，人类大脑在处理如此大量信息方面是薄弱的。这是神经科学和神经可塑性领域众多研究证明的事实。但机器借助高效且有效的算法可以轻松做到这一点。欢迎来到奇妙的机器学习世界——它将助你解决问题，满足你的需求。


  预测涉及有效且高效地识别可用数据中的模式，并以恰当的方式使用合适的可用变量。一旦软件识别出这些模式，就会利用它们来预测未来事件。除此之外，这些程序还能更有效地完成许多其他事情，例如帮助你做出决策并提供一系列行动项。预测、自动化决策和行动规划是当下的迫切需求，也是未来的现实。


  当谈到赚钱和盈利时，“足够”是一个陌生的词。企业和商业机构必须不断寻找新市场，开发创新产品。他们必须了解新的市场趋势和新的竞争对手，并根据时代和市场不断变化的需求调整思路。在当前的商业世界中，机器学习应运而生，在这方面提供帮助。几乎所有行业都受到了机器学习的影响，且大多是积极的影响。


  ## 机器学习商业机遇


  这些技术——机器学习、大数据分析、云和认知计算——正在改变全球几乎所有行业的商业模式。旧的商业模式正在迅速改变。各个垂直和水平市场的企业都在寻找运营和业务创新的新方法。这为数字和实体企业创造了新的商业机会和途径。创业精神日益高涨；创新思维正在围绕新一代技术创造新的商业模式。这种发展势头的结果体现在优化运营、降低成本、改善服务和/或推出新产品上。许多公司正在利用机器学习获取经济利益并取得了巨大成果：


  *   AOL 使用机器学习提供购物推荐。

  *   Booz Allen Hamilton 为其业务目的使用机器学习（Mahout 的聚类算法）。

  *   Cull.tv 使用机器学习进行其内容推荐系统。

  *   DataMine Lab 使用机器学习聚类分类算法来改善其客户的广告定向。

  *   Drupal 押注于机器学习算法，以提供其开源内容推荐解决方案和系统。

  *   Evolv 使用基于机器学习的平台来预测其与劳动力相关的活动。

  *   Foursquare 和 Idealo 使用 Mahout（一个机器学习框架）用于其推荐引擎。

  *   Google 使用机器学习为其 AdSense 和其他广告网络计算点击概率。

  *   机器学习算法和模型被用于自动化算法交易（AAT）。货币市场公司设置并训练模型，用于在纳秒内进行交易。当今很大比例的交易是由计算机完成的，许多大型金融科技公司都参与其中。

  *   零售商使用机器学习来优化和推荐其库存、营销活动、产品布局、定价和目标定位。例如沃尔玛、苹果和 Flipchart。

  *   像 Rose Pharmaceuticals 这样的制药公司使用机器学习进行数据挖掘相关活动。

  *   印度拥有全球第三大人工智能初创企业集群。这些初创企业致力于开发机器人、识别工具和基于机器学习的虚拟助手（来源：毕马威）。

  *   印度在核心业务流程中实施机器人自动化的排名也位列第三。金融专业人士已准备好采用基于机器学习的自动化来节省时间并在决策过程中获得帮助（来源：毕马威）。

  *   像微软、IBM、谷歌和亚马逊这样的公司正在提供“现成”的平台。初创企业正在使用这些平台来寻找自己的解决方案。同时，这些巨头近年来还推出了多款机器学习产品和应用，以解决和增强多个行业特定的挑战。


  由于机器学习无处不在，几乎所有领域的商业机会都极其巨大。新一代机器学习拥有多项创新功能，这些功能是商业机会的催化剂。除了技术领域，机器学习还在以下职能领域创造着新的机会：


  *   研发

  *   生产与运营

  *   销售与营销

  *   客户支持

  *   财务、人力资源和行政职能

  *   农业、医疗保健、公用事业以及石油和天然气

  *   零售

  *   采矿、建筑、可穿戴设备、批发、艺术、娱乐和休闲以及房地产

  *   教育服务、住宿和餐饮服务、仓储和制造业




  除此之外，行业特定的机遇也在不断涌现。近年来，随着机器学习的发展，一些新领域应运而生，其中包括基于情感的产品与服务、直觉学习、智能无人机与机器人、聊天机器人等等。如今的消费者希望应用、产品和服务更加直观。由于广泛接触手机和智能手表等个人辅助设备，消费者比以往任何时候都更贴近应用。他们对应用和产品的期望是能够“理解”自己的工作方式和行为。


  这开辟了“可转型”商业机遇的新视野。同时，决策者的思维方式也发生了转变，从创造“数据”转向打造“以洞察为导向且直观”的产品和服务，从而产生巨大的商业前景。这种思维过程是行业和企业所特有的。然而，这种“思维过程”受市场动态和竞争引导，则是另一回事。基于机器学习的数字化正在推动多种类型的创新。数字世界正以出人意料的速度增长，并创造了大量机遇。


  现在值得一看“智慧”金字塔（或数据层次结构），因为下一节将重点介绍其各个组成部分。金字塔的底层指的是由非结构化（包括物联网设备）、半结构化和结构化数据源产生的大量数据（见图
  2-2）。这些设备产生的数据量可达 PB 级甚至更多。数据层之上是“信息”层，它从数据中提供经过过滤、结构化且机器可理解的信息。同时，它作为一个抽象层，对可用数据进行总结。然而，人类和高级复杂应用需要的是服务，而非信息。


  ![](img/429391_2_En_2_Fig2_HTML.jpg)


  智慧金字塔层次结构。从顶部开始，依次包括智慧、知识、信息和数据。


  图 2-2


  智慧金字塔


  信息层之上是看不见的知识层（第三层），它提供了对数据和信息的更好理解。它还将信息以机器可理解的格式呈现，机器可利用这种格式在分析“精炼”信息后生成洞察。知识层进一步精炼到更高层次，即*智慧*层。它通过从隐藏的“知识海洋”中寻找智慧，对知识层进行精炼。借助隐藏的知识，机器可以得出所谓的*智慧*，用于预测（本质上是预测未来会发生什么），然后提供洞察和行动步骤。这种智慧可用于开发端到端的直观、智能产品和服务。这种从杂乱无章的事实数据逐步精炼到智慧的组织方式，可以通过多种方式可视化。例如，如果从技术角度考虑这些层次，它们可以按以下方式关联：


  *   数据层与物联网相关，简而言之，包括结构化、非结构化和半结构化数据或大数据。

  *   信息层和知识层与大数据分析相关。

  *   智慧层与机器学习和认知计算相关。


  对于企业而言，商业和商务机遇无处不在，且与机器学习息息相关。领导者必须抓住这些机遇。然而，为了利用机器学习生态系统的巨大潜力，商业领袖和决策者必须投资于技术。同时，他们还必须致力于组织转型。因此，思维方式变得至关重要。以下是一些有助于创造和利用突破性机遇的想法：


  *   领导者必须致力于机器、软件、流程和数据的整合方法。

  *   采用非常快速的实验、测试、学习和规模化方法。

  *   在需要时迅速重新构想、重塑和创新商业模式。

  *   采用数字化并构建能力。这不同于土地、劳动力和机器的商业模式。

  *   在整个组织内采用并实施技术特定且官僚作风较少的流程。

  *   采用鼓励投资于流程、人员和技术的政策和框架。


  商业机遇是一个通用术语，用于多个领域。机器学习有助于创造就业机会，开辟盈利渠道，并优化劳动力市场。机器人流程自动化、机器人技术、人工智能、深度学习和机器学习的进步带来了突破、创新和机遇。连接这些不断发展的技术将解决复杂的业务问题，并为公司带来益处。从感知新的商业途径到创建、维护和转型现有商业生态系统，有无数种方法可以利用这些领域的机遇。


  例如，机器学习使企业能够提高绩效、效率和效果。这可以通过减少错误、提高质量和加快运营速度来实现。企业正从被动应对运营方式转向主动应对。例如，以前企业必须等待机器故障，然后才呼叫或要求维护，但现在他们可以确定特定设备的状况，以预测何时进行维护。这得益于机器学习技术和算法执行方面的非凡进步。


  机器学习的应用几乎遍及人类活动的所有领域。以下领域列出了用例和应用。详细的应用领域以应用、产品和服务（APS）的形式进行描述。接下来的部分将以产品、服务和应用的形式介绍
  APS 用例。


  所有领域都蕴含着巨大的商业机遇。以下是 APS 的五个领域：


  *   客户体验提升

  *   自主与直觉系统预测

  *   数字辅助与推荐 APS

  *   特定领域 APS

  *   科学与技术


  ## 客户体验提升


  在此类别中，应用、产品和服务（APS）能够在最少人工干预的情况下自行做出决策。它们是自给自足的，能够自动从系统中提取洞察。由于本书的范围所限，我将讨论局限于客户领域。然而，其边界几乎是无限的，维度也是无穷的。该领域存在巨大的商业机遇。以下部分将解释此类
  APS 的更广泛分类。




  ### 基于自动机器学习的客户支持系统


  像 Wise.io 这样的公司利用机器学习来提供“明智且智能”的客户支持。例如，它们能更快地响应客服工单。这样一来，其客户的客服人员就能专注于解决更关键的客户问题，而不是处理日常事务。


  以下是这对企业有何帮助：


  *   机器学习使支持引擎能够根据客服代表的技能组合，预测哪个团队或个人应接收新的客户工单。之后，引擎会自动将工单放入正确的队列。


  *   机器学习使支持界面（引擎）能够根据工单的内容和历史记录，向客服代表显示最佳回复模板。


  *   如果启用机器学习的系统在知识库中找到了客户提交的工单/问题的解决方案，系统会自动选取解决方案、修复问题并回复工单。Wipro 的一个基于机器学习和人工智能的系统正遵循着同样的理念。Wipro
  正使用这种方法来实现客户满意并提高客服代表的生产力。


  ### 客户支持与自动化之故事


  自动化是指利用技术使流程无需人工干预即可完美运行。这一想法与“业务自动化将取代人力资源和知识工作者”的假设相反。自动化通过让知识工作者得以专注于更直观的任务来为他们提供便利。它使他们免于承担行政性和重复性工作的责任。它仅在必要时才允许人工干预。自动化几乎无处不在，但在那些资源及其知识非常宝贵的组织中，它发挥着更大的作用。以下是客户支持团队可以从自动化中获益的四种方式：


  *   *无重复性工作*：支持团队通常会被重复性的请求淹没。大多数时候，他们被迫一遍又一遍地回答相同的问题。有时，这会变得令人沮丧和失去动力。自动化在这些情况下为支持团队提供了帮助。自动化系统以多种方式处理此类情况。例如，根据工单的严重性或优先级，系统会将工单路由给具备解决特定问题所需技能和专长的合适支持主管。例如，假设支持团队收到一个包含特定问题类别的工单。根据工单的分类，系统可以访问现有的知识库，找到解决方案并修复问题。一旦问题修复，系统可以关闭工单并通知请求者问题已解决。


  *   *一致性*：自动化允许知识的归集或集中化，并实现其妥善的存储和记录。一旦知识捕获过程实现自动化，就很容易在任何组织中进行优化和参考。这有助于“集中化”知识，因为团队（支持和开发）通常孤立地工作，有时沟通差距会造成损害。此外，团队倾向于为其工作创建支持文档，但不会共享这些信息。


  *   *稳健的扩展*：许多支持团队起步时规模很小。他们使用关键工件（如文档），与同事和主题专家交谈以解决遇到的问题，教育客户，并向组织其他部门通报最新进展。只要客户群规模小且收到的工单数量也少，这一切都容易实现。但是，一旦客户群开始增长，工单开始堆积，工单队列就会开始变长，真正的问题就出现了。由于耗时的手动流程无法产生完美的结果，自动化对企业来说变得至关重要。他们必须利用和保护来之不易的知识。随着任何公司的发展，员工流失变得至关重要。在这种情况下，自动化也能防止知识流失。


  *   *更高的工作满意度*：客服代表和客户服务代表的工作单调且要求高。他们必须在工作时间内处理相同的一系列活动。为客服代表提供自动知识库和个性化问题解决指导，可以提高他们的满意度。根据特定的技能组合、个性特征和绩效指标自动将工单分配给客服代表，表明你重视他们的个性，并且你拥有适当的数据源来确保他们的成功。简而言之，客户支持自动化认可了个性，并赋予团队主动而非被动的资源。


  ### 机器学习客户留存系统


  产品和营销团队经常面临留住客户的持续挑战。通常，客户行为是不可预测的。例如，企业通常不知道客户为何取消他们之前下的订单。现在，借助由创新机器学习算法驱动的基于机器学习的留存应用程序，公司可以分析客户互动的各种接触点。这使他们能够采取纠正措施来留住客户。这从多个方面帮助企业。这里列举了其中几点：


  *   在互动初期预测客户行为偏差，以便采取行动


  *   针对每个客户显示其行为偏差的原因


  *   推荐和提出最合适的营销策略


  *   个性化和定制化的内容以提高客户留存率


  *   帮助确保每个面向客户的团队在每次互动中都能了解客户的“专业”健康状况


  通过采用更直观、创新和数据驱动的方法来实现客户成功和留存，组织可以更高效、更有效地确定优先级。他们可以在服务最关键客户的同时，持续提升整个客户群的满意度。


  ### 业务成功、客户参与和机器学习


  客户成功始于为企业找到并定位合适的客户。选择客户必须基于产品组合和可用服务。这使企业能够为目标客户提供适当的服务和产品。如果企业无法为其产品找到并选择合适的客户，其利润将受到影响。此外，选择错误的客户会导致客户流失并损害品牌声誉。理想的客户实际上能帮助企业从营销支出中获得最大回报，并实现更高的投资回报率。为了找到“合适的”客户，企业必须了解并理解一些重要事项：


  *   客户是谁


  *   业务团队将如何根据他们的需求和愿望来接触并获取他们


  *   如何定位或呈现产品或服务以提供最大价值


  *   如何预测特定客户在未来几天或几个月内可能购买什么


  *   哪些客户将成为最大的消费群体


  *   哪些营销内容最适合目标客户


  *   哪些销售代表最适合处理特定类型的客户


  机器学习技术在寻找这些问题的答案方面非常有帮助。通过对与客户相关的历史、结构化和半结构化数据适当应用分析技术，企业可以深入了解客户的行为。此外，基于这些洞察，企业可以制定能带来多重好处的策略。接下来将描述其中一些好处。




  #### 合适的客户获取


  基于机器学习的应用和产品能够帮助销售团队聚焦于能转化为合适客户的潜在客户。这些产品还能帮助营销团队根据客户的个性和购买模式呈现最佳内容。合适客户获取的其他优势包括：


  *   更高的销售额和赢单率


  *   更好的推广和营销转化率


  *   营销和推广支出的更高投资回报率


  *   通过个性化实现更精准的营销活动


  #### 更好的客户支持


  基于机器学习的应用、产品和服务能帮助企业为客户提供更好的支持。例如，产品支持通常通过基于工单的系统（记录问题的系统）来实现。如果使用基于机器学习的工单工具或系统来提供客户支持，它能够自动将工单分配给最合适的客服人员，或通过智能利用现有知识库生成自动回复消息。基于机器学习的客户支持优势包括：


  *   将服务或客户工单快速引导至合适的客服人员或主管


  *   由于系统自动化且所需人工干预较少，支持服务更加可靠


  *   客户服务代表效率更高，因为单调的工作由系统处理，他们可以承担更有价值的任务


  *   高效的客户自助服务


  #### 客户群扩展


  基于机器学习的系统、应用和产品能帮助企业识别、跟踪和分析客户的使用模式与信息。这有助于他们找到潜在的“合适”客户，从而拓展业务。为商业生态系统增加更多客户意味着额外的收入。此外，如果客户与企业保持互动，这将在多方面带来益处，包括口碑宣传。机器学习驱动的客户扩展的其他优势包括：


  *   更高的产品分配率


  *   通过交叉销售获得更多收入和成本效益


  *   增加向上销售的机会


  #### 客户留存


  基于机器学习的应用能够识别有流失风险的客户及其表现出的信号，同时预测哪些内容或方法最有可能重新吸引他们。这种由机器学习驱动的策略有助于企业留住客户。客户留存对企业至关重要，因为留住一个客户比获取一个新客户成本更低、所需资源更少。客户留存的一些优势包括：


  *   降低客户流失率


  *   为客户经理提供更可靠的方法


  *   客户经理效率更高


  ### 客户细分应用与产品


  在竞争激烈的商业环境中获取新客户十分困难，需要投入大量的辛勤工作与努力。而且，获取新客户只是成功的一半。通过持续提供价值和满意度来留住客户才是成功的关键。企业如何持续为每位客户提供价值，从而让客户更深入地参与其中，这是一个挑战。但一旦企业做到这一点，就可以向客户销售更多的产品和服务。通过向客户提供明智且智能的、基于机器学习的收入增长与金融（FinTech）应用，客户能够认识到其资金的价值。新一代的机器学习应用产品与服务能够增强来自客户的经济、金融和收入流。同时，组织也能从中受益，因为这使他们能够实现有效且高效的客户细分。


  它可能在多方面为企业提供帮助：


  *   将合适的产品或服务与合适的客户相匹配


  *   推荐或建议最佳价格以确定向上销售机会


  *   向个人客户提供个性化的营销信息


  将客户数据与过往结果相结合，可以呈现一个全面的预测路线图，用于为客户提供额外价值并扩大收入。


  ### 智能客户优先级划分与分类产品、应用与服务


  企业常常试图从海量的现有客户数据库中寻找自己的客户。机器学习帮助企业分类、排序并优先选择最合适的客户。这不仅使团队能够瞄准理想客户，还能快速为他们提供所需的产品或服务。


  以下是这对企业的帮助方式：


  *   提高销售渠道的成交率


  *   提升营销支出的回报率


  *   充分发挥销售团队的优势


  通过数据驱动的方法来揭示目标市场的模式，销售团队可以制定高效的优先级排序流程，并专注于最佳机会。以下是预测性应用产品与服务的技术与流程运作概览：


  1.  机器学习技术分析历史数据（例如，已关闭的工单），并识别其中的模式和相关性。基于此分析，它确定工单是如何被分类、分配和解决的。


  2.  当新事件发生时（新支持工单到达），基于机器学习的引擎立即验证内容，预测属性，并推荐适当的响应。


  3.  根据预测结果，触发器可以路由规则或响应宏来自动化处理流程。


  4.  一旦找到解决方案，系统会学习并调整其预测，使其始终适应当前的需求和流程。


  ### 自主与直觉式系统


  属于这一类的应用、产品和服务通常具备像人类一样“思考”的能力。这是一个不断发展的领域。基本上，这些应用产品与服务试图模仿人脑。它们创建人工神经回路和通路，其方式与人脑生成生物神经元完全相同。它们能够根据情况做出决策，并能在动态变化的环境中进行调整。这个领域蕴藏着巨大的商业机会，并存在多种类型的应用和服务。以下部分描述了这类应用产品与服务的更广泛分类。


  #### 自主系统


  机器学习在直觉式应用、产品和服务的开发中扮演着关键角色。数据是应用产品与服务的构建模块。这些数据可以帮助统计程序通过数据挖掘在海量数据中识别直觉模式。机器学习过程、算法和方法使用人工神经网络来生成预测。这进而导致了自动化决策和行动规划。例如，西门子借助神经网络创建了一个软件仿真环境（SENN），可用于回答各种问题。西门子正在使用
  SENN 来预测原材料价格。


  自主系统是直觉式产品和服务的最佳范例。一个全新的市场正围绕它们兴起，并且很快就会成为一项有趣的业务。除西门子外，其他公司也在推出自主系统产品。这些公司提供个性化和定制化的产品。随着市场势头增强，成本也变得越来越有竞争力。从工业和服务机器人到汽车和无人机，所有案例的共同点是执行通用任务的能力。它们还能基于在动态变化环境中感知和处理信息的能力，做出“小”决策（就目前而言）。





  #### 最新趋势


  无人类参与的面试（技术驱动型）正逐渐兴起。HireVue 是视频面试软件领域的先驱，与约 600 家组织/企业合作，客户名单包括德勤、摩根大通、安德玛以及美国几家主要航空公司。2016
  年，HireVue 计划为其客户进行 250 万次面试，这一数量较五年前的 1.3 万次实现了显著增长。HireVue 进行的面试中，绝大多数（90%）为按需面试。在这种场景下，另一端没有任何人存在。


  无人类参与的视频面试对招聘经理而言效率很高。同时，企业也能更深入地了解面试对象。在视频面试过程中，仅在审阅面试者提供的回答时才需要人工参与（未来，随着机器学习和认知计算的更高级应用，这一环节也将实现自动化）。人类可以在自己方便的时候进行审阅。例如，他们可以协调自己的日程、任务和空闲时间，在休息时间抽空审阅。此外，他们无需前往面试地点。通过使用
  HireVue，许多企业都看到了切实的效益。例如，希尔顿酒店将其招聘周期缩短至 4.5 天，比之前的招聘周期缩短了近 20 天。信诺保险则将其招聘人员的差旅费用从每年
  100 万美元降至每年不到 10 万美元。


  求职者也从基于机器人的招聘中受益，主要体现在便利性上。求职者/面试者可以在自己方便的时候进行按需面试。这些基于机器人的面试不会完全取代人际互动（至少在短期内不会）。大多数公司将其用于第一轮筛选面试，之后再进行传统的一对一面试。


  #### 自学习机器产品、应用与服务


  像 AlphaGo 这类新型机器学习系统正在发展，以满足对超级智能系统的需求。像谷歌这样的企业在自学习机器的创造和发展方面达到了一个里程碑。


  2016 年 3 月，AlphaGo 击败了世界顶尖围棋选手李世石。李世石是排名第二的职业围棋高手。围棋是一种亚洲棋类游戏，对计算机而言，理解和解读它被认为非常复杂。因为该游戏几乎拥有无限多的可能落子位置，棋手必须依靠直觉，而不仅仅局限于计算走法。


  AlphaGo 由谷歌的 DeepMind 开发，该公司专注于解决复杂任务。AlphaGo 使用了强化学习算法（一种机器学习算法）。在强化算法中，系统学会使用一个价值函数，通过分析数百万个过往棋局（数据集）并自我对弈来评估棋局位置。


  AlphaGo 本质上是一个将树算法与深度神经网络相结合的计算机程序。这些神经网络将围棋棋盘细节作为输入，并通过由数百万个类似神经元的网络组成的多个网络层进行处理。其中一个神经网络，“策略网络”，负责选择下一步棋。另一个神经网络，“价值网络”，负责预测棋局的胜者。谷歌的
  Alphabet 公司让 AlphaGo 学习了大量业余棋局，以理解合理的人类下法。随着时间的推移，AlphaGo 在学习和决策方面变得更好。


  西门子也使用了同类型的算法来优化其风力涡轮机和燃气轮机，这同样是自学习机器成功应用的例子。能够从各种类型数据中学习并得出自身结论的计算机系统，其工作基础是机器学习。例如，西门子正在致力于让风力涡轮机能够根据风力和天气等不断变化的环境条件自动调节自身，这将提高其发电量。自优化风力涡轮机的基本逻辑在于，能够基于运行数据从涡轮机中推导出风的特性。相关的参数由传感器和外部风力发电设施测量，包括风向和风力、空气温度、电流和电压，以及发电机和转子叶片等大型部件的振动。


  爱立信展示了一个 6G 应用场景，其中数千个传感器被集成到一件 T 恤中，可以帮助追踪血压和血氧水平等关键生命体征。事实上，甚至可以将芯片组植入衣物中而不可见，因为它非常小，只能在显微镜下观察到。其非凡之处在于，它没有电池，但仍能传输数据，因为它能从无线电频率中获取能量。


  随着 5G 服务的推出，人们可以坐在家里远程驾驶汽车。这在某种程度上与无人驾驶汽车类似，因为你可以远程控制并驾驶车辆。令人惊讶的是，如果车辆失去连接，它会停下来，从而降低发生事故的几率。


  ChatGPT 是 OpenAI 开发的一种人工智能模型，能够对文本输入产生类似人类的回答。它使用创新的机器学习方式来理解和掌握自然语言，使其能够与人进行交流。它因其类似人类的回答和易用性而广受欢迎。其应用场景遍布多个领域。例如，印度的两大顶级
  IT 企业——塔塔咨询服务公司和印孚瑟斯，以及埃森哲等全球技术咨询公司——正依靠针对初学者的 ChatGPT 及其他机器学习/人工智能技术的培训和技能提升模块。




  像 ChatGPT 这样的生成式 AI 模型可能会颠覆印度 IT 企业。塔塔咨询服务公司（TCS）将为专业人员发展开设生成式 AI 主题课程。ChatGPT 在整合多源信息与内容以精准回答特定问题等操作中非常有用。对于将要从事写作的人来说，ChatGPT
  可能成为必需品，这将是写作领域的“阶梯式变革”。


  ChatGPT 完成的部分任务包括：


  *   ChatGPT 在美国医疗执照考试中得分超过 50 分

  *   它在沃顿商学院 MBA 项目运营管理期末测试中顺利通过

  *   它在一个周末协助完成了一部小说，随后被发布到网上


  还有更多……


  随着 AI 技术的进步，开发 AI 前沿技术（尤其是在生成式 AI 领域）的竞赛已经加速，这既带来了希望也引发了担忧。因此，让我们来看看它的一些创新特性，例如基于人类反馈的强化学习（RLHF）技术。


  这些技术有潜力改变我们的世界，但也伴随着风险。RLHF 技术有助于确保 AI 模型与人类价值观保持一致，并提供有益、真实且无害的答案。鉴于对生成式 AI 发展速度和范围的担忧，纳入持续有效的人类反馈循环比以往任何时候都更加重要。


  RLHF 结合了强化学习和人类输入来训练 AI 模型。通过被称为强化学习的试错训练，AI 模型在学习新技能时，会因做出明智决策而获得奖励，因做出错误决策而受到惩罚。


  然而，强化学习确实存在某些限制。例如，由于很难定义一个涵盖人类偏好和价值观所有方面的奖励函数，因此可能难以验证模型是否遵循人类价值观。RLHF 通过将人类反馈纳入训练过程，克服了这一困难，并提高了模型与人类价值观对齐的有效性。人类可以通过对模型输出提供反馈，帮助模型更快速、更准确地学习，并降低出错的可能性。例如，当人们看到模型以不恰当、有偏见或有害的方式做出回应时，可以提供纠正性输入，帮助模型学习。


  此外，RLHF 还可以解决强化学习中的样本效率低下问题。当使用强化学习来学习一项任务时，会出现样本效率低下的情况，使得该过程耗时且成本高昂。然而，通过纳入人类反馈，模型可以更有效地学习，并且需要更少的迭代次数就能掌握一项任务。


  ## 像 ChatGPT 这样的大型语言模型是如何使用 RLHF 的？


  大型语言模型（LLM）在语言建模、机器翻译和问答等多种语言任务中表现出色，已成为自然语言处理（NLP）中的关键工具。尽管功能强大，LLM 也存在缺点，例如倾向于生成质量低下、不相关甚至令人反感的内容。


  获取高质量的训练数据是最大的挑战之一，因为 LLM 需要大量数据才能良好运行。此外，监督学习需要人工标注员对数据进行分类，这是一项耗时且昂贵的操作。


  为了解决这些问题，RLHF 被提出作为一个能够为训练数据生成更优标签的框架。在该框架中，LLM 首先使用无监督学习进行预训练，然后使用 RLHF 进行微调，以生成高质量、相关且连贯的文本。


  借助 RLHF，LLM 可以从用户偏好中学习，并生成更符合用户目标和意图的输出，这可以对各种 NLP 应用产生重大影响。通过结合强化学习和人类反馈，RLHF 可以用更少的标注数据有效训练
  LLM，并在特定任务上取得更好的性能。因此，RLHF 是提升 LLM 能力、增强其理解和生成自然语言能力的有效框架。


  在 RLHF 中，LLM 使用大量文本数据语料库进行预训练。为了生成连贯且可理解的输出，模型需要学习语言的底层模式和结构。预训练完成后，可以使用 RLHF 对
  LLM 进行微调，预训练虽然计算成本高昂，但为后续工作提供了坚实基础。


  第二阶段是开发一个奖励模型，这是一个评估 LLM 生成文本质量的机器学习模型。奖励模型以 LLM 的输出作为输入，生成一个标量数值来表示输出质量。奖励模型可以是另一个经过修改、输出单个标量值而非一系列文本令牌的
  LLM。


  为了训练奖励模型，需要由人工评估员对 LLM 生成的文本数据集进行质量标注。当给定一个提示时，LLM 会生成多个输出，由人工评估员从优到劣进行评分。然后，奖励模型预测
  LLM 生成文本的质量。通过从 LLM 的输出和人工评估员给出的排名分数中学习，奖励模型形成了对人类偏好的数学描述。


  在最后阶段，LLM 成为强化学习智能体，建立一个强化学习循环。在每个训练回合中，LLM 使用训练数据集中的多个提示生成文本。然后，其输出被送入奖励模型，并根据其与人类偏好的匹配程度获得一个分数。


  随后，LLM 会被更新，以生成在奖励模型上得分更高的输出。


  ## 基于深度学习和模拟神经元的应用解决方案


  与机器学习相结合的深度学习技术正在创造大量商业机会，例如，使新应用能够使用自动图像识别。围绕这些技术的应用解决方案使用模拟神经元技术，基于可用数据将多个层级的结果关联起来，以给出期望的结果。它们实际上是根据图像中一个像素与另一个像素的关联像素来识别图像。我们大多数人已经在不知不觉中携带了支持人工神经网络的设备或应用。例如，安卓智能手机中的语音命令系统使用人工神经网络技术来接收用户的语音命令。


  ## 基于情感和情绪分析的应用解决方案


  情感是人类活动的重要组成部分，它影响着认知、感知以及其他日常活动，如学习、自我管理以及与他人和自我的沟通。此外，情感还有助于理性决策。传统上，技术人员在很大程度上忽视了工作场所中的情感。此外，在这个领域，只有少数服务与产品能够将纵向、横向及其他业务领域与情感相结合。在大数据分析和机器学习技术蓬勃发展之后，涉及零售、医疗、营销、银行和金融服务的企业已经开始采用“基于情感的应用解决方案”。因为企业意识到，人类是情感动物，情感是其决策过程中不可或缺的一部分。当有人想要购买产品时，他们的情感会在这一决策过程中发挥作用。因此，将情感融入应用解决方案将为商业探索提供新的机遇。该领域的一些先驱包括
  Emotient、RealEyes 和 Affectiva。它们都主要（似乎）出于营销目的，利用面部表情来推断情感。像 CogitoCorp 和 BeyondVerbal
  这样的公司则专注于理解语音中的情感线索，以进行市场研究并提供更好的客户体验。




  ## 其他直观的应用、产品与服务


  其他应用包括个性化和定制化的护理与教育。处理冲突解决与谈判的系统可提供定制化培训。还有一类独立的游戏，能够监控并学习你的习惯，为你定制游戏，称为自适应游戏。这一领域蕴藏着巨大的商业机遇。


  ## 预测、数字助手与推荐型 APS


  预测与预报类 APS 属于此范畴。机器学习与认知计算相结合，有望提供大量仅在几年前还只存在于想象中的智能产品与服务。这类 APS 此前仅限于科幻书籍、电影和研究实验室。例如，你的手机甚至能在你想到要做某件事之前，就为你提供建议和推荐，或者建议你添置一套符合你职业形象和性格类型的新衣橱。


  如前所述，“智能”系统能够进行预测、提供建议并给予数字协助。例如，假设你正计划为某个喜庆场合举办一场派对。由机器学习算法驱动的认知计算系统，可以根据你近期互动、沟通和协作过的人员生成一份宾客名单。它还会根据你与这些人的关系亲密度来筛选名单。对此类
  APS 的需求与日俱增，因此该领域存在巨大的商业机遇。以下章节将描述此类 APS 的更广泛分类。


  ### 基于推荐的应用、产品与服务


  智能 APS 广泛应用于推荐领域，其用途多种多样。例如，当你访问电商网站（如亚马逊）、在手机上搜索冰淇淋店，或在 Netflix 或 YouTube 上观看影片时，你很可能会看到基于你个人喜好的推荐。实际上，嵌入这些
  APS 中的机器学习算法会根据你的访问历史和其他参数（模型用于分组模式或决策的因素）为你挑选“合适的”推荐。


  ### 虚拟数字助手


  这类应用为个人提供智能化的数字协助。例如，你早上 9:30 有一个紧急会议，或者你的航班在午夜，而你是个健忘的人，常常错过这类安排。别担心，你的数字助手（如谷歌的
  Allo/Now 或苹果的 Siri）可以帮忙。它能读取你的电子邮件和短信，计算出到达办公室或机场所需的时间，然后与到达办公室或登机的理想时间进行比较。之后，它会向你发送通知，告知你何时该出发去办公室或机场。


  ## 广告


  机器学习算法也扮演着技术娴熟的虚拟销售员和广告商的角色。例如，一位在网上购买孕妇装的女士会收到批量购买尿布的折扣。机器学习算法在整个购买过程的幕后运行；它们收集并处理客户的购买行为，并推送相关内容的广告。


  ## 照片标记


  社交媒体巨头 Facebook/Meta 会分析并利用面部特征进行营销、建议和推荐。它通过测量眼睛和鼻子之间的距离来识别人脸。它还利用你的个人资料照片以及你标记过的照片来缩小范围，锁定可识别的面孔。所有这些领域都充满了商业机遇。创建
  APS 的前景正以思维的速度增长。


