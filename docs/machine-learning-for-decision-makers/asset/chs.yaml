  \nNoSQL 数据库的类型、供应商和用途\n\n| NoSQL 数据库 | 特性 | 用途 | 示例和供应商 |\n| --- | --- | --- | ---\
  \ |\n| 基于图 | • 突出数据元素之间的连接。• 将数据存储在相关节点中。 | • 空间数据存储• 推荐引擎 | • Infinite graph• NodeJS\
  \ |\n| 基于列 | • 处理大量列。• 适用于基于互联网的搜索。• 适用于大型的、基于 Web 的应用程序。 | • 读写扩展• 有效存储大数据• 在分布式环境中高效\
  \ | • HBase• SampleDB• Hypertable• Cassandra |\n| 基于键值 | • 使用键值概念存储数据。• 通常将一个键与一个值关联。• 非常适合点击流类型的应用程序。\
  \ | • 在小型读写操作中高效且有效• 适用于高可用性系统• 适用于大型数据库需求 | • Riak• Oracle BDB• RADIS |\n| 基于文档\
  \ | • 以类似文档的结构存储数据。• 通常使用 JSON 格式。• 适用于内容管理。• 非常适合基于 Web 的应用程序。 | • 用于一致性数据• 高效且有效地存储非结构化数据\
  \ | • Couchbase• MangoDB |\n\n图数据库是 NoSQL 数据库的一种类型。从根本上说，它是一个专门用于构建和修改图的专用单用途平台。图数据库利用图的节点、边和属性来表示和存储数据，这是关系型数据库无法做到的。\n\
  \n图论是图数据库概念的基础。它于 2000 年发布。由于使用节点、关系和属性来存储数据，而非传统数据库，因此它们也被称为 NoSQL 数据库。图数据库对于高度关联的数据尤其有用。Hadoop\
  \ 和 Neo4j 的主要类别分别是“数据库”和“图数据库”。图中的弧（箭头）显示了节点之间的关系。作为一棵树，XML 文档是一种特殊类型的有向图。\n\n鉴于人工智能的快速应用以及围绕大型语言模型发生的创新，收集海量数据、将其情境化、分析并使其具有可搜索意义的能力至关重要。\n\
  \n能够访问*向量嵌入*（一种数据类型，提供人工智能所需的语义，使其具有类似长期记忆的处理能力），是生成式 AI 流程和正在构建以原生集成生成式 AI 功能的应用程序的先决条件。\n\
  \n在做出复杂判断时，AI 模型（例如大型语言模型）会构建并使用向量嵌入作为其数据表示。\n\n复杂性、深度、模式和关联都需要作为底层结构的一部分进行存储和表示，就像人脑中的记忆一样，这使得管理这一切充满挑战。\n\
  \n在 NoSQL 的背景下，另一个重要的数据库是向量数据库。它是一个为 AI 工作负载专门构建的数据库（或大脑），专为高度可扩展的访问而创建，特别用于存储和访问这些向量嵌入。特别是对于嵌入，像\
  \ DataStax Astra DB（基于 Apache Cassandra）这样的向量数据库旨在提供优化的存储和数据访问能力。\n\n向量数据库是一种专门为存储和查询高维向量而设计的数据库类型。在一个多维空间中，每个维度代表一个不同的特征，这些向量是对象或数据点的数学表示。\n\
  \n\n\n向量数据库的优势和力量最终体现在这一领域。向量搜索——即人工智能流程通过将数据的数学嵌入或编码与搜索参数进行比较，以提供数据相关性，并返回与查询具有相同轨迹和路径的结果——其根本在于能够以向量的形式在多维空间中存储和检索大量数据。与标准关键词搜索相比，这能产生范围更广的结果，并且在添加新数据时能够处理更多的数据。\n\
  \n大多数人可能都熟悉推荐引擎，它会分析用户的搜索并推荐其他可能感兴趣的项目。例如，考虑一位观众正在其偏好的流媒体提供商上狂看一部科幻西部题材的剧集。无需为每部媒体内容打上主题标签，Netflix\
  \ 就能通过对整个媒体库进行向量搜索，快速轻松地推荐最邻近的其他剧集或电影。此外，这位观众可能还会收到其他主题的最邻近结果，这些主题可能并非他们明确查询的，但根据他们感兴趣的节目，这些结果与其观看模式相关。\n\
  \n提供基于 NoSQL 的解决方案是一项大业务。因此，除了 Apache 之外，多家供应商也提供这方面的产品。例如，Cassandra 是一个开源分布式 NoSQL\
  \ 数据库，具有高度可扩展性、容错性，用于管理海量数据。它基于亚马逊的 Dynamo。决定使用关系型数据库系统还是 NoSQL 系统，取决于多种因素和需求。表\
  \ 4-8 展示了在该决策过程中起关键作用的一些条件。\n\n表 4-8\n\nRDBMS 和 NoSQL 系统的特定业务用途\n\n| 当您需要/拥有以下情况时，使用\
  \ RDBMS | 当您需要/拥有以下情况时，使用 NoSQL |\n| --- | --- |\n| 集中式应用程序（例如，ERP） | 去中心化应用程序（例如，Web、移动和物联网）\
  \ |\n| 合理到高可用性 | 持续可用性；无停机时间 |\n| 合理速度的数据 | 高速数据（设备、传感器等） |\n| 数据来自一个或少数几个位置 | 数据来自多个位置\
  \ |\n| 数据主要以结构化形式提供时 | 数据是结构化或半/非结构化时 |\n| 复杂/嵌套事务 | 简单事务 |\n| 主要关注的是扩展读取 | 关注的是扩展写入和读取\
  \ |\n| 纵向扩展以应对更多用户/数据的理念 | 横向扩展以应对更多用户/数据的理念 |\n| 维护中等数据量并具备清除能力 | 维护高数据量；永久保留 |\n\
  \n### MangoDB\n\n另一个流行的 NoSQL 数据库是 MangoDB。它本质上是一个分布式数据库。然而，MongoDB 也因其出色的可扩展性和灵活性等特性而被用作文档数据库。它还提供查询和索引功能。以下是\
  \ MangoDB 的一些有趣特性：\n\n*   非常适合通用用途\n*   作为文档数据库表现出色\n*   一个开源产品\n\nMangoDB 非常适合处理时间序列数据（在不同时间戳检测到的值集合），包括传感器数据。这一特性使\
  \ MangoDB 成为针对以下应用的主要选择之一：\n\n*   金融市场价格\n*   传感器（温度、压力和接近度）\n*   工业车队（位置、速度和操作）\n\
  *   社交网络\n*   移动设备\n\n在云计算时代，MangoDB 公司推出了其“特定云产品”，称为 MongoDB Atlas。它是一种面向云并托管的数据库即服务产品。该软件包采用按需付费模式，主要允许用户在亚马逊网络服务（AWS）上部署其应用程序。它还支持微软\
  \ Azure 和谷歌云平台。最近，MongoDB 推出了一个用于 Spark 的连接器，为用户提供了一个分析处理引擎，使他们能够查询实时的 MongoDB 数据。\n\
  \n## Apache Storm\n\nStorm 是一个分布式实时计算系统，用于处理大量高速数据。Storm 是一个免费且开源的分布式计算系统。它具有容错性，并且在实时环境中非常有效。其实时能力使其易于处理无界数据流。它不同于传统的批处理系统。传统系统以存储再处理的方式工作，而\
  \ Storm 使用无界的元组序列（数据的核心单元）。Storm 使得可靠地处理无界数据流变得容易，它在实时处理方面的作用就像 Hadoop 在批处理方面所做的那样。\n\
  \n在 Storm 中，应用程序通过拓扑来定义和标识。拓扑将其逻辑解释为操作符和数据流的有向无环图（DAG）。在 Storm 的术语/语境中，图是由边连接的节点的集合。节点表示可执行任务，边是任务依赖关系。在最简单的形式中，DAG\
  \ 可以可视化为一个流程图，告诉系统要执行哪些任务以及以何种顺序执行。让我们看看 Storm 的两个最重要的组件——Spout 和 Bolt。\n\n*   *Spout*：数据流的来源。它们的作用是从外部源（例如，Twitter\
  \ 或 Facebook API）或从物理/虚拟磁盘读取数据，并将数据发射或传递到拓扑中。\n*   *Bolt*：处理输入流并（最终）产生输出流。它们代表应用程序逻辑。\n\
  \n### Apache Solr\n\nApache Solr 是基于 Java 搜索服务器的开源企业搜索平台。它用于与搜索相关的多种目的和应用程序。通常，它用于搜索存储在\
  \ Hadoop 集群的 HDFS 中的数据。这是 Solr 在企业中的主要应用之一。Solr 之所以受欢迎，是因为它灵活且易于集成到机器学习和大数据技术中。它是一个可扩展、容错、成熟且可靠的开源企业搜索平台。Solr\
  \ 构建于 Apache Lucene 之上，后者是一个信息检索软件库。\n\nSolr 广泛用于企业内容管理系统，为大型互联网站点提供全文和近实时索引。例如，Alfresco\
  \ 和 Drupal 使用 Apache Solr 来整合搜索功能并为最终用户提供便利。它非常擅长查找存储在 Hadoop 中的表格、文本、地理位置或传感器数据，并针对处理高流量网络流量进行了优化。\n\
  \n## Apache Spark\n\nApache Spark 是一个基于开源集群计算的处理框架，用于大规模数据处理。它构建在内存计算引擎之上。Spark\
  \ 在内存中的运行速度比 Hadoop MapReduce 等旧技术快 100 倍。此外，它在磁盘上的程序执行速度也可以快 10 倍。\n\nSpark 提供内存计算（处理发生在本地内存中），这意味着与\
  \ MapReduce 相比，它实现了更高的速度和数据处理能力。Spark 支持对大数据进行高性能查询。它利用并行数据处理框架，将数据持久化在内存中，并在需要时持久化到磁盘。它运行在现有的\
  \ Hadoop 集群之上，可以访问 HDFS，并且还能处理来自 Hive 的结构化数据。它从 HDFS、Flume、Kafka、Twitter 和其他来源（Flume\
  \ 和 Kafka 将在本章后面解释）中提取数据。Spark 主要受到大数据供应商和开源社区的支持。然而，微软 Azure 上的 Spark 实现既简单又经济高效。在微软\
  \ Azure 上部署 Spark 及基于 Spark 的解决方案的一个主要原因在于，由于其基于云的特性，无需采购任何硬件，也无需配置任何软件。Azure 还促进了\
  \ Spark 与商业智能工具的第三方集成。\n\n\n\n### Azure HDInsight\n\n微软和 Hortonworks 正在合作，通过 HDInsight\
  \ 帮助企业实现大数据分析的优势。HDInsight 是一个 Apache Hadoop 发行版，它充分利用了云计算的巨大潜力和高效性。它能根据动态需求进行水平和垂直扩展。这一能力使\
  \ HDInsight 能够处理任何数据量。它还原生集成了 Azure Data Lake Store。Azure HDInsight 旨在通过更低的管理成本，让\
  \ Hadoop 和 Spark 变得简单易用。它为开发基于大数据的解决方案提供了更高的开发效率。它为客户降低了 63% 的总拥有成本。实际上，HDInsight\
  \ 以 Hadoop 即服务的形式提供，因此无需额外的硬件。\n\nAzure HDInsight 使用 Hortonworks 数据平台，并能轻松集成本地和云解决方案。它还使得在本地和云之间进行混合部署变得简单。通过用一个通用平台来应对这两种环境，微软正在引导用户走上一条既能享受公有云优势，又能兼顾当今本地大型数据项目复杂性的道路。\n\
  \n当客户想要将代码或项目从本地迁移到云端时，只需点击几下，几分钟内即可完成，无需购买硬件或聘请通常与大数据基础设施相关的专业运维团队。它是一种托管式 Hadoop\
  \ 服务，并且拥有云中最多的 Apache 项目。它受益于核心 Hadoop 产品，如 HDFS、YARN、MapReduce、Hive、Tez、Pig、Sqoop、Oozie、Mahout\
  \ 和 Zookeeper，以及高级工作负载，包括 Spark、Storm、HBase 和 R Server。\n\n将来自多个来源的数据组合起来，以创建更具意义和实用性的新输出的实践，被称为数据集成。在以下情况下，数据集成无疑是必需的：\n\
  \n*   将数据从一个或多个源移动到目标位置。这是为了以各种格式让不同的利益相关者和消费者能够访问数据所必需的。\n*   从数据中获取知识。组织寻求从现已唾手可得的数据中获取洞察。他们需要将来自不同来源的数据进行合并、清理、丰富并存储在数据仓库中，以便开发能够提供洞察的解决方案。\n\
  *   实时生成报告和仪表板。\n*   开发基于分析的解决方案。\n\nMicrosoft Azure HDInsight 是 Cortana 智能套件的一个组成部分，该套件是一个微软机器学习解决方案，提供从信息管理到机器学习、仪表板和认知服务的端到端解决方案。Azure\
  \ HDInsight 基于支持冗余的架构，这为其提供了高可用性。其可用性达到 99.9%，并为企业提供 7x24 小时的支持。\n\n## 表示层与应用层\n\
  \n这一层是集成性的，意味着它结合了多个层。然而，分层仍然是可能的。我在这里分别讨论表示层和应用层。\n\n*   *应用层*：该层为使用大数据应用程序提供用户界面。来自不同领域的应用程序——如交通、零售、医疗、制造供应链和政府——都位于此层。\n\
  *   *表示层*：该层将借助机器学习和数据分析层生成的洞察与智能，呈现给目标受众，包括用户和决策者。通过该层，可以提供清晰、简洁、可视化、易于理解的演示。此外，向决策者的关键沟通也通过该层进行。没有恰当的呈现和阐述，数据和事实便毫无意义，尤其是对于那些没有统计学背景的人来说。沟通和演示通过交互式报告、图表、图形、关键建议和推荐来完成。\n\
  \n以下列表描述了与该层相关的主要技术。除此之外，您还可以根据特定需求考虑其他多种产品。\n\n*   *SQL Server Reporting Services\
  \ (SSRS)*：该工具是微软的一款产品。SSRS 提供了一个创建和交付报告的平台，这些报告可以以多种电子文档格式查看，包括 Excel、Word、PDF、图像和\
  \ XML。它还可以通过 HDInsight 集成到 Hive 表，以获取和显示数据。\n*   *Excel/Excel BI/Power BI*：事实和数据可以通过多种方式呈现给用户、经理和决策者。Microsoft\
  \ Excel、Excel BI 和 Power BI 提供了许多功能，包括：\n    *   条形图\n    *   折线图\n    *   饼图（多种选项）\n\
  \    *   散点图\n*   *Oracle Business Intelligence Enterprise Edition (OBIEE)*：Oracle\
  \ 的一款优秀产品。它可以轻松集成到像 Hive 这样的大数据存储中，以获取和展示数据。OBIEE 也能与传统数据存储无缝协作。因此，它可以作为结构化和非结构化两种数据类型的数据可视化工具。它还为没有编程知识的用户提供了\
  \ Hadoop 访问权限。它擅长在 Hadoop 和 Oracle 之间进行联合查询，以避免频繁的数据移动。如果需要，它可以与 SQL Server 等其他数据存储分层结合使用。\n\
  *   *IBM Cognos*：IBM 在 Hadoop 架构之上创建了一组大数据和分析工具，他们称之为 BigInsights。它包含用于扩展和管理大数据及机器学习平台的工具。Cognos\
  \ 是该套件的一部分，它使用 Hadoop 作为数据源。Cognos 通过 Hive 连接到 Hadoop。\n*   *新型数据可视化工具*：如果数据呈现没有意义，那么再好的展示也是不够的。因此，以有意义的方式呈现数据同样重要。随着大数据的发展，出现了多种可用于此目的的新型数据可视化工具。唯一的标准是它们能够有效地展示地图、文本、数据连接、行为和情感。\n\
  \n\n\n谷歌地图、谷歌地球和谷歌地点是用于以多种方式呈现地图的几个选项。D3.js 是一个 JavaScript 库，可用于以多种格式和类型显示数据，包括箱线图、气泡图、子弹图、非连续面积图、弦图、等高线图、事件调度、样条插值和树状图。像\
  \ Crazy Egg 这样的工具可用于多种目的，以捕获和呈现用户的行为和情绪，例如跟踪访问者在网站上的点击。它还能生成热力图，指示网站/页面的哪个部分获得了最多的关注。有多种工具及其在线版本可用于显示连接，包括微软知识图谱和\
  \ Ayadsi。连接工具通常有助于建立不同可用数据集之间的关系，从而形成整体洞察。\n\n*   *信息图*：信息图是呈现大数据的新方式之一。顾名思义，它是信息与图形的结合。在信息图中，事实以图表、文本或图形的形式呈现，为用户提供事实的快照。通常，这是一页纸的内容，旨在为用户提供即时信息。\n\
  \n数据分散在多个地方并以多种形式存在。例如，它存在于 Excel 表格、多份报告、电子邮件、图表和数据库中。忙碌的管理者和决策者无法逐一查看以获取洞察。信息图在此处就派上了用场，因为它们在一页上提供了所需的信息。因此，一个好的信息图必须在视觉上具有吸引力，并包含有用的内容。\n\
  \n*   *仪表盘上的众多其他工具*：这是一种向管理层直观呈现信息的方式。借助仪表盘，管理层的战略决策变得容易，因为所有所需信息都以整合的格式提供给用户/决策者。仪表盘不必与战略相关联。它们可以扩展到运营层面或呈现运营信息。关键绩效指标（KPI）可以集成到其中，为用户提供快照。\n\
  \n这一层非常有用，因为它提供了以图形格式快速查看和分析整体情况的自由、灵活性和机会。因此，它能够实现快速决策。所有这些只有在针对正确的受众时才是有用的。\n\n\
  ### 大数据领域供应商的产品\n\n在讨论大数据和大数据分析技术时，Apache 的产品是焦点。除了 Apache，还有其他公司提供端到端的解决方案。这包括\
  \ IBM、谷歌等公司。由于篇幅限制，这里无法讨论所有供应商的产品和解决方案。但是，你将快速了解几个重要的产品。这将有助于你做出决策。\n\n在 [`https://biz-excellence.com/2016/09/13/machine-learning-dt/`](https://biz-excellence.com/2016/09/13/machine-learning-dt/)\
  \ 上有一个优秀的决策树，它提供了与大数据实施相关的决策概览。该图描绘了各种情况，并从微软的角度提供了建议。\n\n### 现实场景\n\n大数据在许多领域都发挥着作用。这里提供几个用例：\n\
  \n*   *反洗钱与大数据*：反洗钱是金融机构的重要领域之一。通过使用有效的交易监控，反洗钱解决方案和系统得到增强，并与大数据分析解决方案良好配合。它们通过利用结构化和半结构化数据中的额外交易数据，用于开发复杂的检测模型。这种类型的开发模型可以有效处理以不一致格式存在的数据。结合机器学习技术，这些模型会根据需求进行调整。应用无监督机器学习来发现未知的新属性，这些属性可能与反洗钱相关风险有关。此外，由于大数据分析，可以创建行为模型，这最终有助于发现异常行为。这进一步扩展到基于异常情况的通知和警报。\n\
  \n*   *为决策者提供智能报告*：决策者需要智能且有洞察力的报告，因为原始数据毫无用处。此外，为了解释公司业绩并提供预测，他们需要良好的报告。机器学习与大数据一起，为报告带来了质的飞跃。通过以端到端的方式连接多个流程，并使用正确的数字技术和分析，组织可以开始更快地交付更具洞察力的成果。这导致市场信心的增强。在基层，他们通过使用直观和智能的报告，以自信的方式呈现公司业绩的预测。基于机器学习分析的报告解决方案为数据组织、认证和理解提供了一种新风格。这是因为使用了尖端的数字技术和分析来自动化注释和报告生成。\n\
  \n大数据和机器学习的集成使得基于云的报告解决方案成为从内部和外部数据源提取和整合结构化、非结构化的财务和非财务数据的绝佳选择。它还使用创新的以流程为中心的技术（如自然语言处理、机器学习以及认知和预测分析）来自动化报告。机器学习报告解决方案借助以下技术栈的关键组件，向决策者呈现有影响力的洞察：\n\
  \n*   *数据源*：该解决方案从相关的内部来源识别和提取数据。\n\n*   *数据准备*：使用机器学习准备数据以供分析。这允许通过个性化的报告视图自动创建报告。\n\
  \n*   *数据分析*：在此层，定义业务规则并进行分析。此外，数百种“假设”情景和趋势分析功能也集成于此。\n\n*   *评论生成*：使用自然语言处理和生成，该解决方案以有条理、有组织的方式自动进行差异分析和评论脚本编写。\n\
  \n通过重新构想报告结果并将智能报告解决方案植入财务和其他支持职能，机器学习能够实现更高质量的预测和预报。利用大数据和机器学习使报告企业能够影响：\n\n* \
  \  *投资者信心*：了解企业拥有更多信息有助于增加利益相关者的信任。\n\n*   *敏捷性与动态性*：支持职能可以通过更快地报告数据来生成可操作的洞察，从而实现实时决策。自动化还帮助决策者快速适应不断变化的业务需求和需求，这将显著提高决策的敏捷性。\n\
  \n*   *熟练度*：企业，尤其是决策者，通过多种方式利用高效、实时的报告，包括快速响应市场情绪，并相应地调整其业务职能和决策。\n\n\n\n## 机器学习技术栈\n\
  \n构建机器学习解决方案的主要原料是数据。数据的来源显然是物联网设备、社交媒体等。从传感器收集的数据存储在云端、本地或两者混合的环境中。通常，这些系统被设计为能够扩展并处理海量的各类数据。随后，能够从数据中学习的机器学习特定算法和模型会对新数据做出推断。之后，通过代码，使用数学和机器学习库、框架以及诸如\
  \ R、Python 和 C# 等编程语言来实现需求。构建有效的机器学习解决方案涉及众多技术、框架、流程和技能，本章将对此进行详细讨论。不过，首先从技术角度审视机器学习的整体流程是一个好主意。\n\
  \n机器学习项目、应用和产品的成功基于多个方面。因此，选择最佳的技术栈（包括硬件和软件）变得至关重要。好的选择能带来非凡的成果，而糟糕的选择则可能导致灾难性的局面。例如，从技术角度来看，机器学习项目需要强大的计算能力来实时处理和分析数据，这能缩短系统训练所需的时间，并使整体响应速度更快。对海量非结构化数据（如视频流和实时传感器数据馈送）进行并行处理，使机器学习系统能够提供及时可靠的结果。\n\
  \n速度、敏捷性以及底层硬件的利用是构建优秀机器学习平台的重要标准。因此，在考虑为机器学习系统构建技术栈时，你需要考虑配备多集成核心处理器和更快内存子系统的开发系统（硬件和软件）。它们必须拥有能够并行化处理并具备出色并发多线程能力的优秀架构。该平台必须具有内置的灵活性，以支持可扩展的集群（如果需要构建复杂解决方案），你将使用这些集群来训练复杂的机器学习模型。\n\
  \n选择专用硬件至关重要。押注于像 Intel® Xeon Phi™ 这样的产品是一个绝佳选择，因为它是第一款专为高度并行工作负载设计的可启动主机处理器。它也是同类产品中首款集成内存和结构技术的产品。在\
  \ Caffe 和 Theano 等框架上开发的机器学习应用是不错的选择。然后，选择与底层硬件协调一致的软件框架也很重要。\n\n软件、库、框架和硬件的选择必须基于需求、易用性和具体要求。例如，选择提供良好拖放界面以使数据科学家和程序员能够创建高性能机器学习应用的工具，是机器学习项目成功的一个主要因素。Microsoft\
  \ Azure ML 易于使用且速度快。如果需求、基础设施和成本允许，Azure ML 是一个不错的选择。最后，但同样重要的是，人是成功的关键因素。归根结底，人是实现企业愿景并为利益相关者服务的真正资源。因此，需要将他们的福祉视为产品愿景不可或缺的一部分并加以考虑。\n\
  \n如第 1 章所述，机器学习层从大数据分析层获取输入。这个概念可以通过多种方式可视化。例如，机器学习技术可能是数据分析层的一部分，或者它们可以被整合到专门用于机器学习的独立层中。然而，关注点的分离或划分具有多重好处，因为它使企业能够调整技术架构以同步其需求和需要。这实现了呈现一个解耦且可扩展的架构的总体目标。\n\
  \n从平台角度来看，机器学习技术栈可以分为多个层。每一层又负责执行和协调一些任务。这里描述了主要的层和相关技术：\n\n*   连接层\n*   存储层\n*\
  \   处理层\n*   模型与运行时层\n*   展示与应用层\n\n### 连接层\n\n该层从云中或本地系统中的应用程序和其他数据源收集数据。这打开了从企业系统（包括\
  \ ERP、CRM、HR、营销自动化、商业智能、采购和财务系统）或物联网设备获取数据的大门。例如，假设一个企业使用多个来源从供应商提供的系统（包括 Salesforce、Oracle、NetSuite、Workday、Birst、Concur\
  \ 和 Coupa）收集和处理数据。这些数据将通过该层被拉取并传递到后续层。这里会使用诸如 Informatica 的 BigML 或 Kafka、MQTT 甚至\
  \ REST 等工具（其中一些在大数据部分讨论过）。该领域有众多供应商提供了大量产品，它们各有利弊。很难在一章中总结该领域所有可用的技术。不过，下一节将描述一些重要的技术。让我们从该领域的新秀——微软的\
  \ Logic Apps 开始。\n\n#### Logic Apps\n\nLogic Apps 是微软 Azure 云平台中托管的集成逻辑片段。它像其他在线/离线方式为任何\
  \ Web 应用所做的那样，在 Azure 上进行托管。它还提供了通过创建触发器然后执行一系列类似于创建工作流的操作来构建逻辑的功能。Logic Apps 的优势在于微软提供了许多连接器，使应用程序/产品能够通过各种协议快速连接。它也使得应用程序能够连接到广泛的应用程序。Logic\
  \ Apps 在云端运行，因此托管、可扩展性、可用性和管理都不是瓶颈。\n\n#### Apache Flume\n\nApache Flume 用于高效且有效地收集、聚合和移动大量流数据。这些数据可能包含应用日志，或\
  \ Hadoop 分布式文件系统上的传感器和机器生成的数据。它以分布式方式工作。Flume 拥有基于流数据流的健壮且灵活的架构。它具有出色的容错、故障转移和数据恢复能力。\n\
  \n#### MQTT\n\nMQTT 是一种二进制消息传输协议。它遵循 OASIS 标准，并使用客户端-服务器特定的发布和订阅模型。它是一种开放、简单且易于实现的消息传输协议。MQTT\
  \ 最大的优点是其轻量级特性。因此，它成为基于物联网设备的完美选择。对于物联网设备来说，HTTP 协议过于庞大。MQTT 设计时具有最小的协议开销。因此，它已成为机器对机器（M2M）和基于物联网的应用/设备/对象的完美选择。MQTT\
  \ 还擅长利用低网络带宽，并继承了 TCP 传输的大部分特性。对于 MQTT 来说，TCP 协议栈是最低要求。\n\n\n\n#### Apache Kafka\n\
  \nKafka 是一个高吞吐量的分布式消息系统。它是一个出色的容错工具，能够存储和处理实时产生的记录流。通常用于构建需要对数据进行转换或快速响应的实时流式应用程序。它作为集群运行在服务器上，这些服务器可以是一台或多台服务器的组合。\n\
  \nKafka 的“组织”将记录划分为多个类别，称为主题。每条记录由一个键/值对和一个时间戳组成。Kafka 中的消费者是订阅主题并处理已发布消息馈送流的进程。Kafka\
  \ 作为一个由一个或多个服务器组成的集群运行，每个服务器被称为一个代理。\n\nKafka 通过四个主要 API 完成其工作：\n\n*   *生产者*：允许应用程序将流记录发布到一个或多个\
  \ Kafka 主题。\n\n*   *消费者*：允许应用程序订阅一个或多个主题，并处理由这些主题产生的记录流。\n\n*   *流处理*：使应用程序作为流处理器工作。它通过从一个或多个主题（取决于设计和架构）吸收输入数据或记录流，进而产生一个或多个输出主题的输出流来实现这一点。基本上，它将输入流转换为输出流。\n\
  \n*   *连接器*：通常用于为其他用途构建和运行可复用的生产者和消费者。Kafka 基本上为已经使用应用程序或数据系统/源的生产者和消费者提供了连接到主题的能力。例如，如果一个连接器在关系数据库上工作，它必须收集并捕获对表发生的更改。\n\
  \n#### Apache Sqoop\n\nApache Sqoop 用于在非结构化数据源和关系数据库系统之间传输数据。它也可以用于将数据传输到大型机系统。它使用诸如\
  \ Hadoop MapReduce 之类的技术来转换数据。此外，它还提供了将数据导出回 RDBMS 的功能。\n\n### 存储层\n\n与该层相关的大部分细节和技术已在物联网和大数据技术栈部分讨论过。然而，如果您想了解这些技术，可以参考那些部分中的具体细节。\n\
  \n### 处理层\n\n与该层相关的大部分细节和技术已在物联网和大数据技术栈部分讨论过。然而，如果您想了解这些技术，可以参考那些部分中的具体细节。许多技术在大数据分析部分也有讨论。除此之外，还有其他可用的数据处理和分析工具与技术。不可能涵盖所有内容，但下面会进行简要讨论。\n\
  \n### 模型与运行时层\n\n该层包含、促进并使用管理机器学习模型整个生命周期的框架、工具和运行时系统。机器学习模型在部署到生产环境之前必须经过训练、验证和监控。这需要许多步骤来实现模型生命周期的可操作化。以系统化的方式管理机器学习模型是一项具有挑战性的任务。它涉及很多复杂性，并依赖于监控、重新训练和重新部署等因素。\n\
  \n接下来的部分将讨论该层中的一些相关技术。\n\n#### Apache Mahout\n\nMahout 是 Apache 的一个可扩展的机器学习库。它使用\
  \ MapReduce 范式。当与其他 Hadoop 技术结合使用时，它可以作为解决机器学习问题的低成本解决方案。它是在 Apache Hadoop 之上实现的。Mahout\
  \ 是一个出色的工具，可以通过在底层数据集上运行来发现有意义的模式。一旦大数据存储在 HDFS 上，Mahout 就会自动在其上运行，并从多样化的数据集中提取有意义的模式。Apache\
  \ Mahout 以更快、更高效的方式将大数据转化为信息，进而转化为知识。Mahout 执行所有重要的机器学习核心活动，包括以下内容：\n\n*   *协同过滤*：用于通过挖掘用户行为来提供产品推荐。从技术上讲，协同过滤是一种利用用户信息（如评分、点击和购买）为网站用户提供特定推荐的技术。协同过滤的用途多种多样，包括根据设计推荐消费类商品（如音乐和电影），以及针对特定业务的目标受众。\n\
  \n*   *聚类与分类*：执行聚类活动。例如，它从特定组中获取项目（网页、报纸文章、电子邮件和电话），并将它们组织成相似的集合（相同类型的网页、相似类型的电子邮件等）。此外，它还可以组织和重新组织特定类别的事物，并将它们分类为自然形成的组。将项目组织成属于同一聚类的组（彼此相似）非常有帮助。聚类和分类技术对于从现有组中获取知识非常有用。\n\
  \n*   *项集挖掘*：此活动涉及分析一个组中的项目（例如，购物车中的项目或查询会话中的术语），然后识别哪些项目通常一起出现。\n\nMahout 支持多种算法。这里列出其中一些：\n\
  \n*   聚类：K-means 和 Fuzzy K-means\n\n*   分类：SVM 和随机森林\n\n*   推荐器\n\n*   模式挖掘\n\n\
  *   回归分析\n\n#### Amazon 的深度可扩展稀疏张量网络引擎 (DSSTNE)\n\n这是一个用于训练和部署推荐模型的开源软件库。DSSTNE\
  \ 已在 Amazon 用于为客户生成定制化和个性化的产品推荐。它旨在用于需要强调速度和规模而非实验灵活性的真实世界应用的生产部署。它还能够将深度学习扩展到语音、语言理解和物体识别之外。它将深度学习应用于搜索和推荐等领域。\n\
  \n#### Google TensorFlow\n\nGoogle 最初开发 TensorFlow 是为了创建自己的机器学习系统。后来，他们将该框架发布用于通用和商业用途。它是一个开源软件。Google\
  \ 希望在其现有和即将开展的项目中使用 TensorFlow，例如下一代 Gmail、视频智能以及图像和语音识别应用。目前，它通过 Python 或 C++ 接口进行访问。因此，为了使用\
  \ TensorFlow，需要了解如何使用 Python 或 C++ 进行编码。\n\n#### Microsoft 认知工具包\n\n该工具允许用户制作以聚焦图形式呈现的神经网络。虽然最初是为语音识别技术而设计，但现在它被用作一个通用的机器学习和认知工具包，支持图像、文本和\
  \ RNN 训练。它还允许用户通过深度学习从海量数据集中推断智能，而不会在扩展性、速度和准确性上妥协，并具有商业级的价值和兼容性。它借助用户已经使用或熟悉的编程语言和算法来完成所有这些工作。\n\
  \n它采用复杂的算法构建，能够与海量数据集一致地工作。Skype、Cortana、Bing、Xbox 以及行业领先的数据科学家现在都在使用 Microsoft\
  \ 认知工具包来创建高质量的人工智能应用和产品。Microsoft 认知工具包还提供了最具沟通性、易于使用的架构。它允许使用熟悉的语言和网络。例如，用户可以使用\
  \ C++ 和 Python 等语言来使用 MCT（Microsoft 认知工具包）。它还允许用户修改任何内置的训练算法，或使用他们自己的定制版本。\n\n\n\
  \n#### Microsoft M.NET\n\n无需离开 .NET 生态系统，ML.NET 即可让你使用 C# 或 F# 构建独特的机器学习模型。借助 ML.NET，你可以将机器学习轻松集成到\
  \ Web、移动、桌面、游戏和物联网产品中，因为它允许你复用作为 .NET 开发者已掌握的所有知识、技能、代码和库。为了让创建自定义机器学习模型变得极其简单，ML.NET\
  \ 提供了模型构建器（一个直观的 UI 工具）和 ML.NET CLI。这些工具使用了自动化机器学习（AutoML），这是一项先进的创新技术，能够简化针对你的机器学习场景创建性能最佳模型的过程。\n\
  \n你只需加载数据即可开始开发模型，其余工作由 AutoML 处理。ML.NET 可与 TensorFlow、ONNX、Infer.NET 以及其他知名机器学习框架配合使用，从而访问更多机器学习场景，包括图像分类、物体识别等。ML.NET\
  \ 曾使用 9GB 的亚马逊评论数据集成功训练出一个情感分析模型，准确率达到 95%。由于内存问题，其他知名机器学习框架无法处理该数据集。为了让所有框架完成训练，仅使用了数据集的\
  \ 10% 进行训练，而 ML.NET 展现了最高的速度和准确率。在性能评估中，其他机器学习场景（如点击率预测）也发现了类似的结果。\n\n除这些产品外，还有多种其他解决方案，其中一些将在第\
  \ 3 章中介绍。\n\n#### 其他解决方案\n\n许多供应商和公司都提供机器学习解决方案。例如，Spark 提供了 MLLib 机器学习库，微软提供了 Azure\
  \ ML。一些产品相互重叠或借鉴彼此的技术，以便为更广泛的受众提供良好的解决方案。例如，Mahout 和 MLLib 共享一个共同的执行引擎。然而，Mahout\
  \ 专注于机器学习并拥有丰富的算法集，而 MLLib 仅采用了一些成熟且必要的算法。谷歌的 TensorFlow、Nervana Systems 的 Neon、IBM\
  \ 的深度学习平台、Caffe、Torch 和 Theano 是供应商在机器学习方面现有的一些技术产品。然而，这个列表远不止于此，并且每天都在增加。\n\n许多初创公司和成熟的软件公司一直在开发自己的机器学习框架和应用。例如，微软推出了[分布式机器学习工具包](http://www.dmtk.io/)，英特尔提供了[可信分析平台](http://trustedanalytics.org/)。Netflix、Pandora、Spotify\
  \ 和 Snapchat 也提供以机器学习为核心的产品。一些不太知名的初创公司——包括 Teradeep、Enlitic、Ersatz Labs、Clarifai、MetaMind\
  \ 和 Skymind——在其基于机器学习的产品中提供了许多创新功能。下一节将讨论一些以机器学习为中心的框架的比较研究。\n\n### 表示层与应用层\n\n\
  关于这一层的详细信息已在上一节中介绍。请参考相应章节以获取更多细节。\n\n## 实际应用场景\n\n**视频分析**\n\n该技术用于分析从摄像头接收的实时视频流。它可以实时分析人员、物体和事物的活动。它有助于实时识别边界内外的活动或变化。智能视频分析能够跨摄像头和传感器编目警报、通知和其他操作。因此，可以索引涵盖每个事件的完整特征集。使用该技术的主要原因之一是情感识别领域，视频分析在此用于实时分析情绪。它还在最热门的自动驾驶汽车领域找到了应用。\n\
  \n**数字采纳与客户互动**\n\n如前所述，银行可以使用机器学习分析来建立更牢固的客户关系。尤其是在需要关联客户关系与交易历史分析的不同数据点时。该解决方案还将满足个性化客户产品的需求，并提供客户的全局视图。本案例研究重点介绍了在客户互动应用的每个层级使用的特定技术。该应用的技术栈同时处理多个用例，例如客户行为映射与分析、定向广告推荐等。\n\
  \n**基于自动化智能机器学习的邮件与聊天管理系统**\n\n机器学习应用能够解读和理解收到的电子邮件和聊天内容，以了解客户并提供相关回复。这可以帮助客服人员提供快速、有效且高效的客户服务。这个提供深思熟虑结果的整体过程建立在坚实的技术和情感分析基础之上。机器学习解决方案会自动分离和分类收到的电子邮件和聊天内容。以下是基本步骤：\n\
  \n1.  自动分离和分类收到的电子邮件和聊天内容。\n2.  基于上下文分析电子邮件和聊天内容，以理解其中蕴含的意图和情感。\n3.  分析后，提供见解并给出建议。\n\
  4.  收集反馈并利用其进一步改进系统。\n\n针对邮件和聊天管理的智能机器学习自动化，有助于客服人员处理与客户的反复沟通，并为他们腾出更多时间处理其他事务。\n\
  \n**其他用例**\n\n*   基于机器学习的预测系统能够实时预测电力需求，尤其是峰值和谷值。它们会相应调整系统，以最大化利用现有电网。同样的技术可用于最大化利用间歇性可再生能源。\n\
  *   软件中集成的面部识别技术，结合机器学习、自然语言处理和深度学习，使虚拟代理和实体代理能够提供基于上下文的信息。根据你的情绪、情境、文化和地理条件，虚拟代理可以调整问候方式。它们可以“预判”订单并提供个性化的指引和指导。\n\
  *   计算机视觉以及深度学习和机器学习能够识别零售店中顾客带来的商品。根据上下文，它们可以添加通过传感器获得的更多相关数据。之后，在基于机器学习的系统上进行分析，从而实现不间断结账和自动付款。\n\
  *   配备计算机视觉和机器学习技术的交互式屏幕和家用设备能够识别/确认商品，并推荐符合客户生活方式的互补产品。\n\n\n\n## 云计算在机器学习技术栈中的作用\n\
  \n近年来，云计算对商业产生了巨大影响。企业 IT 中几乎所有功能都受到云计算范式的影响。从开发测试到弹性备份，云计算的 IT 生态系统无处不在。它已确立为构建和管理应用程序的新范式。云计算不仅影响\
  \ IT 部门的每个人，也影响整个企业。话虽如此，现实情况是并非所有内容都已迁移到云端。本地系统和基础设施仍将存在。在未来，云与本地基础设施的混合搭配将成为现实。机器学习或大数据分析解决方案将在这些混合模型上进行开发、测试和验证。像谷歌、IBM\
  \ 和微软这样的供应商在云计算领域提供了出色的产品和服务。他们提供端到端的解决方案，几乎可以在云上实现任何目标，从小型零售应用到高性能机器学习和认知计算解决方案。\n\
  \n全球各地的公司已经或正在开始实施和使用基于云环境中的分布式技术平台（如 Hadoop 和 Mahout），以满足机器学习特定需求。他们这样做是为了在更大的数据集上运行日益先进的实验和业务逻辑。技术团队受到本地可用资源（例如计算、磁盘、内存和网络）明确最大数量的限制。这种情况是动态变化的数据集和需求的副产品。因此，如果他们使用本地基础设施，就会受到计算机组件或集群可用资源的限制。\n\
  \n这些限制以多种方式影响项目团队的生产力，包括生产力损失、准确性降低、资源浪费以及容量规划的限制。数据是云和机器学习产品的原始可量化资源。数据量每五年增长十倍。利用这股滚滚洪流来获得适度优势，正在推动大数据分析和机器学习技术的发展。\n\
  \n云和机器学习分析（大数据分析和机器学习）是近年来几乎融合的两个主题。云允许企业将业务应用程序的维护和托管外包。同时，他们也对其 IT 基础设施进行同样的操作。这节省了大量资金，因为他们按“使用”付费，而不是投资于采购、维护和扩展基础设施。这导致了价格大幅下降、易于扩展以及更高的就绪性或可用性。然而，为了获得云的优势和稳健性，公司必须将其数据迁移到云服务提供商的数据中心。在云计算的初期，存在数据安全问题。但系统和整个云生态系统已经足够成熟，这已不再是问题。成本效益和易用性促使公司在云上配置机器学习和大数据技术栈。借助基于云的配置技术栈，他们可以存储和分析海量数据。这使他们能够对数据产生更深入的洞察（包括认知和预期性认知洞察）。机器学习技术栈可以私有化托管，也可以作为混合云、预生产环境或公有云托管。\n\
  \n## 认知计算技术栈\n\n认知计算系统借助自然语言处理（NLP）技术，以自然的方式收集和处理结构化和非结构化数据。它们从支持分析和机器学习的应用程序接口（APS）获取输入，然后进行推理、学习，并生成上下文模式和关联。认知计算的这种能力使人类能够更快、更智能地连接各个点，做出更明智的决策，并取得更好的成果。\n\
  \n借助 Semantic Kernel、TypeChat 和 LangChain 等工具，围绕 Azure OpenAI 等生成式 AI 技术开发应用程序是可行的。这是因为它们允许你对底层大型语言模型（LLM）施加限制，将其用作创建和使用自然语言界面的工具。\n\
  \n在 LLM（一种探索语义空间的工具）中，深度神经网络会预测初始查询之后一系列标记中的下一个音节。当提示是开放式的时，LLM 可能会超出其输入范围，生成看似合乎逻辑但实际上完全是胡言乱语的内容。\n\
  \n由于 LLM 的结果只是众所周知技术的一个方面，你往往也会比搜索引擎结果更相信它们。当大型语言模型在来自维基百科、Stack Overflow 和 Reddit\
  \ 等网站的可信数据上进行训练时，所获得的仅仅是生成遵循这些来源内容相同模式的文本的能力。结果有时可能是准确的，但也可能是错误的。\n\n如何确保你的消费者在收到问题的逻辑且准确的答案的同时，又能防止你的大型语言模型产生错误和荒谬的输出？\n\
  \n必须限制 LLM，使其能够从更小的数据集中生成文本。微软新的基于 LLM 的开发栈满足了这一需求。它提供了所需的工具来控制模型并防止其犯错。\n\n可以通过使用\
  \ TypeChat 等程序强制规定特定的输出格式，或使用 Semantic Kernel 等编排管道来处理其他可靠数据源，从而限制 LLM，有效地将模型“锚定”在已知的语义空间中。在这里，LLM\
  \ 可以发挥其最佳功能——总结构建的提示并根据该提示生成文本——而不会出现越界（或者至少大大降低了这种可能性）。\n\n这最后一种策略的基础是微软所谓的“语义记忆”。为了从\
  \ LLM 提供事实性输出，语义记忆执行向量搜索以生成提示。向量搜索定位与初始用户问题匹配的已存储内容，向量数据库控制初始提示的上下文，然后 LLM 根据该数据生成文本。微软的\
  \ Bing Chat 采用了这种策略，它利用 Bing 的搜索数据库和原生向量搜索功能来构建回复。\n\n借助语义记忆，向量数据库和向量搜索成为创建实用、可靠的基于\
  \ LLM 的应用程序的工具。有越来越多的开源向量数据库可供选择，或者你也可以将向量索引添加到流行的 SQL 和 NoSQL 数据库中。一个脱颖而出且非常有用的新竞争者通过为你的数据提供向量索引以及用于搜索该索引的额外\
  \ API，增强了 Azure 认知搜索。\n\n\n\n## 认知计算 vs 机器学习\n\n认知计算应用系统与典型的机器学习应用系统在以下方面存在差异：\n\
  \n*   认知计算基于**情境驱动的动态算法**。通常，它非常擅长自动发现模式并匹配理解知识。例如，波士顿大学的研究人员开发了一种基于认知计算的算法，使机器人在试图获取最佳可用物体时，如果感到困惑，能够提出智能问题。它们可以量化用户的“需求”。当对“需求”的确定性较高时，它们会提供所需物体；而如果确定性不高，机器人则会根据最佳猜测判断用户想要什么，并提出相关问题，例如“是这个吗？”以进行确认。\n\
  \n*   认知计算应用系统能够基于数据以动态方式进行推理和即时学习。简而言之，它们通常擅长理解事物。例如，罗格斯大学的科学家为智能手机开发了一个系统，用于判断用户是希望被打扰还是独处。该手机通过收集、分析和处理用户的个性特征，可以预测用户对手机打扰的可接近性。\n\
  \n*   认知系统能够进行推断、假设、适应，并随着时间的推移和数据的积累不断改进，而无需显式编程。\n\n*   它们能够使用自然语言（如英语）与人类进行交互。\n\
  \n机器学习是关于创建智能应用系统和机器的。然而，行业正逐渐从仅仅开发智能设备和应用系统转向。他们正在寻找并思考那些更像人类的直觉型应用系统和机器。各行各业的科技公司、研究人员以及研究实验室，正在开发基于数据和其他自然输入类型为用户做决策的决策型应用系统和设备。认知计算能够实现这一点。这是企业创新并开发类似人脑解决方案的巨大动力。\n\
  \n认知计算技术栈有多种定义方式（大多数层级已在前面章节讨论过）。认知计算系统的基本特征是：它必须能够理解海量数据、应用推理、提供基于情境的洞察，并在与人、机器或其他系统交互时持续学习。基于这些特征，它可以大致分为三个层级：\n\
  \n*   **数据处理层**：在此层级，处理海量数据集以支持智能人类辅助并实现明智的商业决策。在此层级，涉及超大规模计算、高性能搜索和自然语言处理等相关技术。\n\
  \n*   **推理与机器学习层**：在此层级，机器以自动化方式模拟人类思维过程。在此，涉及神经网络、统计建模以及机器学习和深度学习等技术。\n\n*   **感知层**：此层级启用并模拟通常与生物体（通常是人类）相关的感官感受。模拟触觉、视觉、味觉和嗅觉等感觉。此外，情感模拟也在此发生。\n\
  \n如果你想概括上述讨论并可视化这些层级，你需要考虑另一种解释版本，如下所述。\n\n*   **数据收集层**：此层级从所有可用来源收集数据，例如结构化、非结构化和半结构化数据。涉及的技术包括\
  \ AppLogic。\n\n*   **数据准备、提取与转换层**：在此，通过从数据存储中提取原始数据并将其转换为所需格式，将原始数据准备成可用格式。该技术包括基于\
  \ ETL 的系统，如 Informatica。\n\n*   **数据处理层**：在此处理转换后的数据。涉及的技术包括 Hive、Spark 及其他处理技术。\n\
  \n*   **分析、机器学习与认知层**：通过应用多种分析和机器学习技术生成洞察。涉及的技术包括 Apache Mahout、Microsoft Azure\
  \ 等。此外，此处还执行多种类型的分析，包括描述性、预测性、规范性及认知分析。\n\n*   **呈现与应用层**：此层级以可用的方式将洞察呈现给决策者，以便他们做出关键业务决策。此层级还包含使用基于情境信息的应用程序。IBM\
  \ Watson 的用户界面和 Microsoft Cortana 就是例子。所有图表和商业智能工具都属于这个“逻辑”层级。\n\n在认知计算技术栈中，数据按以下顺序流动：数据收集层\
  \ ➤ 数据准备、提取与转换层 ➤ 数据处理层 ➤ 分析、机器学习与认知层 ➤ 呈现与应用层。\n\n数据在认知计算技术栈中从数据收集层以原始格式开始其旅程，当它到达呈现与应用层时，已变成“黄金”。决策者通过多种商业智能工具利用这些信息来做出关键业务决策。此外，存在于这个“逻辑”层级中的应用程序对决策者和个人都很有用。\n\
  \n\n\n## 应用场景\n\n**智能辅助**\n\n借助认知计算，智能数字助手和知识管理活动能够带来巨大收益。例如，通过分析实现的内容分离与动态内容编排，企业可利用仪表盘和综合报告来识别未知用户访问，从而产生销售线索。这是通过监控细分研究报告、情境化监管报告与评级来实现的，最终提升员工效率。\n\
  \n**创新变现**\n\n基于云的认知解决方案，结合智能企业联合关键词搜索与智能学习管理系统，能够管理图像和视频，对获取商业优势大有裨益。例如，它能使企业创建一个集前瞻性图像处理与文档组织能力于一体的单一管理控制台。此外，它还能提供批量上传和下载功能，以更好地利用交叉销售/追加销售机会。\n\
  \n**预期计算案例**\n\n预期、机器学习与人工智能是紧密相关的概念。预期性认知计算指的是这样一个领域：它不仅基于历史数据，还基于行为、特定手势、身体动作、行走模式、步态及其他生物特征数据，在自动做出决策之前预测未来。它解读数据，并根据从所有可用来源收到的反馈来修正数据。\n\
  \n预期性认知计算与预测分析的结合是未来的趋势。用户不仅想知道最佳行动方案是什么，还想知道下一步该做什么。预期性认知计算能同时回答这两个问题。预期基于系统的预测模型。想象一下板球比赛中的场景：三柱门后的守门员。当快速投球手投球时，守门员会通过预判球是“飞向三柱门”还是“靠近三柱门”来移动方向，以便接住球。这是一种反应性动作。现在想象在\
  \ T20 板球比赛的“超级回合”中同样的场景。守门员会通过预判投球手和击球手的脚步移动、眼神以及该特定球员的历史数据，朝一个方向扑去接球。这就是一个关于预期的实际例子。\n\
  \n认知系统本质上并非高度反应性，而是具有预期性和预测性，并带有行为特征。例如，如果一个机器人被赋予了预期能力，从技术上讲，它就能针对一些基本问题读取、理解和领会一个人的面部表情和手势，然后提出建议和推荐。值得探讨一下预期性认知计算的几个重要方面。\n\
  \n认知预期的关键阶段如下：\n\n*   阶段 1：手势捕捉\n*   阶段 2：情绪识别\n*   阶段 3：人脸识别\n*   阶段 4：社交网络数据分析\n\
  *   阶段 5：借助大数据分析和机器学习技术，对前一阶段进行实时整合与分析\n*   阶段 6：行为预测\n\n预期性认知计算是以下领域的融合：心理学 + 神经科学\
  \ + 语言学 + 人工智能 + 社会科学。\n\n认知预期按以下顺序演进：\n\n1.  描述性计算\n2.  预测性计算\n3.  感知计算\n4.  认知计算\n\
  5.  预期计算\n\n## 云计算技术栈\n\n云计算技术栈在第 1 章中有详细讨论。但为完整起见，我从机器学习的角度提供一个简要概述。云计算是机器学习领域革命的最大推动力，因为它能够解决两大主要障碍——随时获取低成本计算资源以及访问海量数据。所有机器学习系统都需要这两点才能运行。以下是云计算的主要层次。\n\
  \n*   *基础设施即服务层*：提供包含硬件、网络和存储解决方案的基础设施。\n*   *平台即服务层*：在云基础设施中提供平台。操作系统、数据库和中间件等平台属于此服务范畴。\n\
  *   *机器学习即服务*：在此层，基于机器学习的技术以按需付费模式提供。因此，任何人（包括个人和企业）都能轻松使用并利用其优势。大数据分析、语音识别、计算机视觉和自然语言处理等技术均可在此获得。\n\
  *   *软件即服务*：最后，在此层，软件作为服务提供，它使用了所有下层堆栈的技术。企业资源计划（ERP）、客户关系管理（CRM）、手机游戏、视频和金融科技（FinTech）等软件存在于这一领域。\n\
  \n## 音频与视频链接\n\n*   Microsoft 认知服务：[(3392) 如何使用 Microsoft Azure 认知服务构建应用 - YouTube](https://www.youtube.com/watch%253Fv%253DrvKrtHt4YhA)\n\
