  \n## 本章小结\n\n本章讨论了一些重要的算法及其用途，并提供了有效且高效使用算法和机器学习模型的指导方针。在探讨算法重要方面的同时，本章还介绍了与特定算法/模型/技术相关的成功案例。本章末尾包含了一些基于机器学习的重要趋势及其对商业的影响。\n\
  \n## 思维导图\n\n![](img/429391_2_En_3_Figa_HTML.jpg)思维导图展示了本章小结，内容包括机器学习开发、机器学习算法的主要分类以及具体算法。\n\
  \n"
- "# 4. 机器学习及相关技术的技术栈\n\n帕坦加利·卡什亚普博士^(a*)\n\n^a 印度，卡纳塔克邦，班加罗尔\n\n机器学习是一个庞大且不断发展的领域，它充满潜力，拥有巨大的开发空间。前几章探讨了机器学习一些重要且相关的方面。\n\
  \n在各个层面，技术都扮演着至关重要的角色，因为没有技术，（几乎）一切都不可能实现。商业策略在会议室中制定，但落实到具体实现时，技术是赋能者。技术有助于打造产品或应用，并助力其营销，包括实体或虚拟供应链。在产品或应用的整个生命周期中，在开发、维护和支持阶段，技术都占据了主导份额。\n\
  \n由于机器学习生态系统所涉及的技术（如物联网、大数据分析、云计算和认知计算）的特性，技术和技术讨论之间存在自然的交叉。例如，如果有人想讨论数据分析，这个话题在所有相关技术的讨论中都适用。物联网技术栈和大数据分析都是其中的一部分。\n\
  \n在采用或开发基于物联网和机器学习的产品、平台或服务之前，企业必须评估、创建或重新审视其公司战略。规划和战略必须是重中之重。这是有原因的，因为它几乎关系到从产品概念化、设计到采购和生产（制造）的方方面面。在实施有效的销售和服务时，这一点也至关重要。企业必须微调其实体和虚拟物流及供应链管理系统，以便能够安全地收集来自客户和供应商的数据并做出响应。我们正处于一个产品本身就能自动收集数据并将其传输到所需之处的时代。\n\
  \n从传统战略转向数据优先战略最初很困难，但这是在市场中保持竞争力所必需的。同时，这也需要开发先进的分析能力。Netflix 是这方面最常被引用的例子。为了捕捉、探索和利用物联网、大数据和机器学习领域中存在的巨大经济机遇，需要新的技术基础设施和思维方式。它们能让公司加快将智能互联产品和运营推向市场的速度。物联网提供了一系列能力和组件，使企业能够实现以下目标：\n\
  \n*   部署用于监控、管理和控制互联设备的应用程序。\n*   在业务背景下收集、处理（通过大数据分析）和分析（通过机器学习技术）机器和传感器数据。\n*\
  \   确保设备与实时数据流之间的安全连接。\n*   提供有效的设备/传感器管理，并支持远程设备更新。\n*   创建一个支持快速、持续、迭代的基于物联网的解决方案创建的应用环境。\n\
  *   高效地与第三方系统集成。\n*   在动态工业环境中，使用增强现实（AR）进行下一代营销、销售、服务和培训。\n\n让我们接受这个事实：技术栈是关键。\n\
  \n## 软件栈\n\n任何软件应用程序都可以通过使用技术栈来开发，因为它是任何工程工作的基础。在为构建应用程序/产品选择技术栈时，需要谨慎行事，因为修改技术栈通常很困难。本章讨论了可用于机器学习及其相关领域的多种技术栈，并提供了机器学习技术栈的全面视图。由于本书和本章的范围所限，本章仅局限于信息技术相关的具体细节。\n\
  \n本章还讨论了多家供应商（包括 Apache、IBM、微软等）在相关领域提供的技术。此外，还描述了不同层与技术之间的映射关系。技术栈通常与特定概念及其相关生态系统相关联。例如，物联网与一种技术套件相关联，而机器学习和大数据则与另一种相关联。然而，出于实际原因，如技术重叠（同一套技术可用于在底层实现多个概念）、业务需求、实施、财务依赖和客户需求，现实情况大多不同。因此，本章提供了技术栈的整体性和综合性视图。话虽如此，在可能的情况下，本章也提供了特定技术的信息。同时，还描述了一些通用的技术概念。例如，本章详细描述了\
  \ MapReduce。\n\n\n\n## 章节地图\n\n第 1 章讨论的综合模型包含多个层级，每个层级在输入和输出方面都不同程度地依赖于其他层级。因此，整体而言，该模型是一个层级嵌套的模型。每个层级或子层级都涉及特定的技术。然而，大多数情况下，不同技术之间存在重叠。在本章中，我将对该模型进行扩展，并提供其详细视图。我将深入到“技术映射”层面，描述每个层级的技术细节。例如，物联网主要涉及从多个设备和传感器获取数据，并将其传输到云端或本地基础设施以供进一步利用和处理。之后，大数据技术接管控制权，并借助特定的技术栈，应对存储、管理、处理和理解这些数据的挑战。如有需要，它们会以适当的方式将处理后的数据呈现给更广泛的受众。此外，大数据分析技术栈会将其输入传递给机器学习框架，以便从处理后的数据中获取智能。然而，你也可以将大数据技术与特定物联网栈的一部分关联起来。机器学习、大数据分析和认知计算也是如此。\n\
  \n关于本章结构和内容的一些要点。\n\n*   **技术讨论**：技术讨论存在重叠。然而，这仅在必要时才会发生。例如，在解释大数据和物联网技术栈时，会讨论数据收集和网络技术。处理技术则在大数据技术栈下讨论。为了完整性，这些概念会在机器学习的连接器层再次提及。机器学习的数据处理器和存储层下的处理/存储技术也是如此。\n\
  \n*   **经验法则**：如果某个概念在前面已经详细讨论过，本章将不再赘述其细节。回顾一下，第 2 章提供了一些重要机器学习框架、库和工具的简要描述。如果你有兴趣了解这些技术，可以在阅读机器学习技术栈时，回头查阅大数据部分。\n\
  \n*   **讨论目的与内容结构**：本章讨论的技术栈可以通过两种方式进行可视化。\n    *   **特定层级的独立视图**：讨论特定层级的技术。例如，大数据分析被视为一个层级。与该层级相关的技术会在该部分提及。因此，如果你只想了解大数据技术栈，可以仅参考该部分，遵循数据采集\
  \ ➤ 分析 ➤ 机器学习 ➤ 表示层的层级结构。类似地，如果你想了解机器学习技术栈，则遵循连接器 ➤ 存储 ➤ 数据处理 ➤ 模型与运行时 ➤ 表示层的层级结构。\n\
  \n*   **复合连接视图**：这提供了一个连接视图。它不深入子层级的细节，而是将各层级视为综合模型的组成部分。\n\n在深入探讨技术栈的细节之前，让我们先看一下表\
  \ 4-1 中展示的概念和技术映射图。这是一个表格形式的表示，说明了哪些概念出现在本章的哪些位置。\n\n表 4-1\n\n概念与技术映射图\n\n| 技术栈\
