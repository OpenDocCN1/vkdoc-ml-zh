  \ Home 与亚马逊的 Alexa 不同，因为它实际上就像一个握在手中的 Google。 |\n\n## 基于算法的商业主题与趋势\n\n变化是现实。社会、技术、流程、商业，乃至生活，都在飞速变化。新思想被接受，旧思想被推翻。例如，就在几年前，还没人认为无人驾驶汽车和智能服装能成为现实。与之相关的故事只存在于科幻电影和小说中。然而，无人驾驶汽车已成为现实，并即将上路。这些突破性技术的真实案例正迅速从实验室走向现实世界。同时，商业领袖和消费者也准备好快速适应这些快速变化。以下部分提供了一些现实的见解以及可能在未来几年影响我们商业和生活方式的企业主题与趋势。\n\
  \n### 可穿戴设备经济\n\n对智能物联网（IoT）可穿戴设备的偏好始于智能手表和腕带。如今，它们已发展到成为人们生活中不可或缺的一部分。现在我们有了智能眼镜、智能服装、夹式设备和头盔。服装品牌和电子公司正在推出更直观的智能服装，这些服装可连接蜂窝网络，以访问或传输人类产生的海量数据。IDC\
  \ 报告称，全球可穿戴设备市场在 2016 年底将达到 1.019 亿台，到 2020 年将达到约 2.14 亿台。物联网、大数据分析和机器学习算法为与消费品相关的各个行业的企业创造并持续带来巨大机遇。\n\
  \n\n\n### 基于共享经济的新型商业模式\n\n企业不再需要拥有资产（例如，优步没有一辆出租车）。爱彼迎没有一家自营酒店，但它们却以前所未有的方式改变了市场经济学。来福车，一家在美国超过\
  \ 200 个城市提供基于应用的拼车服务的公司，其运营模式将改变人们对汽车所有权的观念。它们提供拼车服务，并鼓励人们使用这些服务而非拥有汽车。这正成为一股主要的交通趋势。\n\
  \n在来福车联合创始人约翰·齐默撰写的一篇发人深省的文章中，他预测到 2025 年，美国主要大都市区的私家车所有权将终结。这些趋势并不仅限于美国。在世界各地，企业、个人和企业家都在采纳这些理念。例如，在印度，人们通过\
  \ Oyo（一个基于互联网的酒店和物业预订平台）向度假者开放自己的房屋。他们提供将你的房产转变为度假目的地的服务。这一策略正迫使旅馆和私人招待所重新调整其商业策略。\n\
  \n### 基于连接的经济\n\n全球范围内设备、机器和其他资源之间动态且随时随地的连接，是当今企业的支柱。在未来，越来越多的设备将智能地相互连接。并且，这将在设备之间创建一个智能网络进行通信。这个智能网络是最近才发展起来的。现在，围绕它形成了一种新经济，因为在世界任何地方做生意都和在自家附近一样简单。例如，总部位于印度班加罗尔的\
  \ Practo 公司，如今被誉为全球最大的预约平台。它每年处理超过 4000 万次预约。\n\n### 永续在线经济时代的管理新方式\n\n技术驱动的服务在我们的生活中演进和普及得如此之快，以至于我们实际上已将其视为理所当然。例如，排队购买火车票或从银行取款曾是过去不久的现实。事物变化如此迅速，以至于人们开始相信“网上银行”和“在线预订”一直是我们生活的一部分。\n\
  \n网上银行、ATM 取款、手机银行和数字钱包已经改变了传统的货币交易方式。推动这一数字经济的驱动力是交易成本、速度、易用性、节省时间和安全性。像 Paytm、Apple\
  \ Pay、Android Pay 以及专有的多零售商支付解决方案等应用内支付方式正以光速渗透我们的经济。零售商提供与强大后台流程集成的创新解决方案，以允许客户进行安全无缝的交易。\n\
  \n### 宏观层面的变化与受冲击的经济\n\n在过去几年中，我们看到企业及其政策受到了地缘政治环境变化的影响，例如英国脱欧和中东危机及其对世界的影响（例如，燃料价格）。监管变化也影响着企业。例子包括关于《萨班斯-奥克斯利法案》、《偿付能力\
  \ II》的变化、印度的废钞令，以及德里拟议的柴油出租车禁令。自然灾害和疾病，如海啸、地震、埃博拉在非洲的蔓延或寨卡在南美的爆发，同样影响着企业。\n\n这些宏观层面的偏差超出了任何人的控制，并扰乱了世界和商业。企业、公司、组织和政府正在制定多种策略来缓解这些问题并提供有效的解决方案。由于其中大部分都需要以有效的方式处理数据，机器学习发挥着核心作用。机器学习（基于算法）与大数据分析技术一起，是这些宏观层面解决方案的核心，能够修复受冲击的经济。\n\
  \n### 物联网、大数据分析、机器学习与工业安全的结合\n\n物联网与机器学习和认知计算的结合正在演进，并且值得关注。这对组合（物联网和机器学习）已经开始推动各行各业的创新。机器学习、物联网和大数据的融合正逐渐成为\
  \ IT 基础设施和创新的一个组成部分。\n\n企业以及普通用户正在广泛采用基于智能算法的连接设备。这是推动协作和生产力提升的最大驱动力之一。这种跨层级的超智能连接可能会暴露企业中所有连接到互联网的事物，因此安全性变得非常重要。同时，这也迫使企业采用严格的安全协议。他们明白，如果不遵循必要的安全措施，灾难将会接踵而至。诸如\
  \ Dyn DDoS 攻击等事件已向世界，进而向企业展示，不安全的物联网可以被操纵和入侵。\n\n汽车行业也承诺将成为制造商、用户和开发者之间的安全战场。随着越来越多的智能部件与车辆关联，它们很容易被操纵和入侵。此外，随着无人驾驶汽车也即将上路，这种情况下的安全漏洞最终可能导致物理损害。随着自动驾驶汽车成为近在咫尺的现实，汽车黑客攻击也成为了市场热议的话题。例子包括汽车被勒索赎金，这可以通过获取汽车位置进行劫持来实现。这也可能导致软件供应商和汽车制造商之间的责任问题，这将对联网汽车的未来产生长期影响。说了这么多，这方面的未来绝对值得关注。在当今全球化的世界中，任何地方的企业都可能受到影响，需要时刻关注市场变化并相应调整其模式。\n\
  \n\n\n### 创业案例研究：Belong\n\n传统上，大多数招聘都是通过招聘门户网站进行的。候选人筛选过程如下：候选人需要在招聘门户网站上保持活跃，然后招聘人员从那里获取他们的简历，并根据自己对候选人资料的理解，将其提供给合适的公司。他们会为候选人安排与感兴趣公司的面试。最后，根据面试结果，候选人被选中或淘汰。这是一个耗时的过程，并且无法保证候选人的可信度。它无法提供任何关于候选人行为特征的洞察。公司和招聘人员想知道候选人是否如实陈述了自己的履历。但大多数情况下，他们对此一无所知。当前的流程无法回答这些问题/疑虑。如今，机器学习正在改变一切。\n\
  \n由于竞争激烈的人才市场中可用人才有限，公司在从市场上挑选合适的候选人时也面临着诸多挑战。招聘成本和招聘时间也是一个重大问题。因此，招聘公司面临着越来越大的压力来克服这些障碍。因此，他们正在寻找一套新的技术、流程和能力来应对这些挑战，并确立自己作为市场领导者的地位。\n\
  \n总部位于班加罗尔的初创公司 Belong 选择利用机器学习和**大数据**技术来改变这一领域。他们使用机器学习的创新方式正在帮助公司实现他们的目标。他们将雇主与潜在雇员联系起来。他们正在将这种联系推进到下一步，即超越技能和经验。他们试图协调雇员和雇主的价值观与文化。\n\
  \n为了实现这一目标，Belong 通过大数据和机器学习技术，分析候选人在 Facebook、Twitter、Quora、GitHub、博客等平台上可获取的行为和反应。为了分析候选人的喜好，他们利用这些信息进行就业匹配，使其融入相应的文化。这有助于创建更全面的候选人档案，然后通过机器学习算法将其与相关的公司和职位进行匹配。Belong\
  \ 专有的预测分析平台能够识别每个候选人档案的“DNA”——最合适的候选人会出现在结果的第一页，类似于排名。该公司的算法确保没有两家公司会为同一个职位看到相同的候选人档案集。\n\
  \n完整故事，请参见 Subramanian Senthamarai Kannan / 2016 年 12 月 3 日，发表于 LinkedIn。\n\n##\
  \ 工业 4.0：物联网与机器学习算法\n\n维基百科将工业 4.0 定义为当前制造技术中自动化与数据交换的趋势。它包括信息物理系统、物联网和云计算。工业 4.0\
  \ 的核心在于将所有事物集中连接，并通过算法以更好的方式加以利用。这包括公司可能自身不提供或外包的服务、产品和事务。在工业 4.0 中，计算机以及一般的智能处理与自动化将以一种全新的方式被整合。远程连接到由机器学习算法驱动的信息系统的系统（包括机器人技术）将能够在极少人工操作员输入的情况下学习和控制自动化系统。\n\
  \n本节从技术角度探讨工业 4.0 的更大生态系统，其中包括但不限于机器学习技术、分析学和物联网。这些技术相辅相成。例如，基于物联网的技术用于与第三方和连接系统共享简单信息。而通过基于云的门户网站，最终用户可以访问所有协作方和系统的数据。分析学和机器学习则用于理解这些数据。最终，通过使用物联网、分析学和机器智能，许多以前不可避免的生产流程（曾经的必经阶段）现在可以被跳过。这为公司创造了空间，使其能够审视现有的商业模式，并对其进行调整，以便以大众化产品的价格提供客户服务。\n\
  \n实施工业 4.0 系统需要一个强大的信息技术系统，该系统必须有能力处理和分析海量数据。此外，还需要技术基础设施和流程来全天候记录数据传输和信息交换。工业 4.0\
  \ 模式在危险的工作环境中非常有用，因为在这些环境中，人类工人的健康和安全面临风险——使用该模式将极大地改善他们的生活质量。\n\n借助基于工业 4.0 模式的技术和流程，制造公司可以更有效地控制其供应链，因为数据是通过自动化连接系统在每一个层级进行收集、分析和处理的。这将增强制造和交付流程。计算机控制可以产生更可靠、更一致的生产力和产出。正确实施工业\
  \ 4.0 技术生态系统有助于企业增加收入、市场份额和利润。从农业到零售，工业 4.0 模式和物联网正在改变许多行业公司的运营方式。以下是工业 4.0 模式已展现其潜力的领域：\n\
  \n*   *农业*：在农业中实施工业 4.0 模式的影响之一是在农业产品（拖拉机和耕作机械）中安装自动化和基于物联网的设备。通过自动化系统，农民可以实时收集有关其作物的数据。借助云、分析学和机器学习技术，这些信息被转化为洞察。其结果以多种方式用于优化产量。\n\
  \n*   *医疗保健*：通过自动化系统连接医疗保健行业不仅意味着更高效的业务，也意味着为患者提供更好的服务。例如，通过将核磁共振成像机连接到互联网和信息系统，医院员工在需要帮助时会收到通知。\n\
  \n*   *制造业*：这是受工业 4.0 影响最大的行业。全球制造商在物联网和工业 4.0 解决方案上的投资约为 700 亿美元。这不仅使工厂工人能够看到设备部件何时需要维修或改造，还能提供如何使整个系统更高效运行的洞察。\n\
  \n*   *能源*：工业 4.0、物联网和机器学习技术的结合正在改变能源公司的运营方式。世界各地的能源和公用事业公司，例如 PG&E，都开始使用智能技术。由于通过设备进行的智能有效通信，能源和公用事业公司可以更好地预测需求、发现故障并安排维修。\n\
  \n*   *交通运输*：从供应链物流到公共交通，工业 4.0 和物联网解决方案的结合正被用于以多种方式增强交通运输。例如，通过将运输车辆与监测温度的传感器连接起来，企业可以帮助安全地交付货物，尤其是食品。传感器和基于机器学习的软件可用于以自动化方式收集数据，这可以帮助驾驶员以节省燃油的方式操控车辆。未来，互联、高效、有效且智能的基础设施还将与其他连接系统协同工作，以帮助减少交通拥堵、预防事故和其他有害事件。\n\
  \n\n\n## 综述：生成式 AI——机器学习技术引领的奇迹\n\nOpenAI 拥有 ChatGPT，这款基于生成式人工智能的聊天机器人已风靡全球。然而，ChatGPT\
  \ 只是生成式 AI 被用于提升成果与生产力的一个例子。ChatGPT 能以类似人类的对话语言，对查询提供精准回复。此外，其技术与应用场景都在飞速发展。简单来说，生成式\
  \ AI 利用算法处理数据并生成全新结果。多家科技公司已开始将生成式 AI 融入其内部运作或客户产品中。从根本上讲，生成式 AI 提供了一种与人工智能交互的全新方式。它基于预训练的大型语言模型，使用户能够根据文本提示生成原创文字、图像及其他内容。\n\
  \n使用 ChatGPT 的常见方式之一，是将其集成到聊天机器人中。因此，该领域涌现了大量创新。这些创新型聊天机器人目前正被用于内部咨询和客户支持，将产品手册或人力资源政策手册提炼成清晰简短的回复。例如，Salesforce\
  \ 开发的 Einstein GPT 使客户能够在整个 Salesforce 生态系统中创建定制化内容。它可以生成个性化电子邮件、针对营销人员的定向内容、定制化的客户服务回复，甚至为开发者自动生成代码。再如，德国商业软件公司\
  \ SAP 已开始与印度客户就跨行业使用生成式 AI 进行终端用户交互展开高层讨论。\n\n全球生成式 AI 市场规模价值 79 亿美元。根据 Acumen Research\
  \ and Consulting 的一项调查，预计该市场将以年均超过三分之一的速度增长，到 2030 年达到 1108 亿美元。据 Gartner 研究，生成式\
  \ AI 预计到 2025 年将生成 10% 的所有数据，以及 20% 面向消费者的测试数据。\n\n### 企业中的 ChatGPT\n\n2019 年，微软向\
  \ OpenAI 投资 10 亿美元，成为其最早的投资方之一。在 ChatGPT 推出后，微软又追加了更为重要的 100 亿美元投资。由于生成式 AI 的特性，该技术将在从保险评估、金融分析到药物研发和时装设计等各行各业找到应用。基本上，生成式\
  \ AI 几乎在每一个能想到的行业中都开始产生生产力并催生更多应用案例。例如，在混合工作模式下，集成生成式 AI 的生产力工具（如 Teams）可以帮助总结、转录和跟踪会议成果。或者，AI\
  \ 可以利用你自己的数据在文档上创建摘要和文章。\n\n更广泛的技术和开发者社区认为生成式 AI 潜力巨大。为了掌握与生成式 AI 配合使用的语法算法，需要在内容审核、安全、开发、编码和上下文知识等领域培养新的能力和技能。对话式聊天机器人提供商\
  \ Gupshup 最近发布了一款造船工具，该工具集成了 GPT-3（生成式预训练 Transformer 模型的第三版）来创建复杂的企业级聊天机器人。这些聊天机器人要强大得多。其运作方式略有不同且更简单，因为查询必须以特定方式措辞，机器人才能理解和回应。此外，回复更加清晰，且用词规范，几乎就像在与真人交谈。这不仅改善了客户体验，也有助于建立信任。\n\
  \nChatGPT 技术的采用速度极快。最近，Pegasystems 也通过其 Pega Infinity 低代码平台引入了生成式 AI 功能。Pega 正在创建这些功能，以便用户能够使用简单的自然语言提示来执行操作，例如“生成报告”、“优化此报价文案”或“构建应用程序”，同时结合组织治理使用生成式\
  \ AI。提升平台工程的速度、智能性和易用性将提高用户生产力。\n\n### ChatGPT 的风险\n\n企业需要确保其生成式 AI 模型值得信赖且透明，并遵守或挑战法律约束。由于这些模型必须在应用层面进行监管，企业还必须投资建设必要的基础设施，并雇佣训练有素的人员来支持其开发和维护。大量数据（包括需要保护的潜在敏感个人和企业数据）是生成式\
  \ AI 的关键组成部分。企业还必须确保这些模型能够与其现有系统和解决方案无缝集成。企业可以通过三种方式从这项技术中获益：自动化、增强和加速。然而，它也带来了一系列独特的挑战。\n\
  \n对于需要精确计算的应用场景，生成式 AI 模型可能没有足够的容错空间。在受版权保护的数据集上训练这些模型可能会带来一系列问题，包括向外部人员泄露私人信息。此外，企业级应用场景要求对生成式\
  \ AI 进行治理，以包含不断更新和变化的企业特定信息。此外，还存在可能生成冒犯性或仇恨内容的问题。\n\n针对这些问题，一个可能的应对措施是在部署过程中实施“人在回路中”的生成式\
  \ AI。例如，在呼叫中心，人工客服可以使用 AI 生成的输出，而不是由最终消费者直接使用。另一个有趣的应用是利用 AI 生成的代码建议，这采用了“生成式 AI\
  \ 担任导航员的结对编程模式”。\n\n### 值得信赖的 AI\n\n输入系统的数据质量对于确保生成式 AI 产生正确类型的结果至关重要。对于生成式 AI 而言，关键决策可能取决于其生成的内容，这使得行业内关于可信\
  \ AI 和负责任 AI 的讨论变得更加重要。当然，数据是最重要的因素。数据集在算法方面并不欠缺什么。换句话说，如果没有必要的数据集，即使是最出色的算法也无法工作。\n\
  \n事实上，保护企业数据的需求促使谷歌推出了一款生成式 AI 应用构建器，该构建器将允许企业和政府进行搜索。\n\n## 音频与视频链接\n\n1.  Pedro\
