  \n## 最新研究\n\n*   新款 iPhone 配备了增强现实功能。拥有 3D 摄像头使得设备能够测量物体与它的距离。这是将计算机图形无缝融入现实世界的基本且必要的步骤之一。\n\
  *   佐治亚理工学院的研究人员提出了控制智能手机的创新方法。他们在实验中使用了 LG 和索尼的智能手表。研究表明，通过滑动表带、触摸皮肤和呼吸动作可以“控制”智能手机。利用麦克风和机器学习系统的组合，一种名为“whoosh”的新技术能够独立识别和区分吹气、呼气、嘘声、啜饮和喷气等动作。如果用户在智能手表上发出“嘘”声来静音来电，意味着他们不想接听电话。如果他们需要接听电话，则对着手机吹两下来接听。\n\
  *   Snapchat 开发了一款名为 Spectacles 的智能眼镜，目前正处于研究的最后阶段。这款眼镜的镜框上装有摄像头，用户可以拍摄视频并上传到 Snapchat。Spectacles\
  \ 可录制 10 秒的 115 度圆形视频，内置 115 度镜头。拍摄的视频会自动传输到本地机器以及云端。\n*   名为 Hinge 的约会应用配备了一个个人助理，它会向用户发送最合适的约会对象信息。这个虚拟助理名叫\
  \ Audrey。\n\n## 总结\n\n本章详细阐述了物联网、大数据分析、机器学习和认知计算可用的技术栈。它简要介绍了这些技术栈所涉及的所有主要技术，并讨论了这些技术在当前商业场景中的应用。\n\
