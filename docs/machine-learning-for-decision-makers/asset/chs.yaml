  ## 机器学习模型


  机器学习模型是在训练过程中创建的。训练过程包含以下步骤：


  1.  提供输入的训练数据源。


  2.  提供包含待预测目标的数据属性名称。


  3.  提供所需的数据转换指令。


  4.  提供训练参数（模型用于对模式进行分组或做出决策的因素）以控制机器学习算法。


  ### 训练机器学习模型


  训练机器学习模型的过程包括向机器学习算法（即学习算法）提供训练数据。训练数据应包含正确答案。这通常被称为*目标属性*，或简称为*目标*。机器学习算法在可用的训练数据集中寻找模式。之后，它将输入数据属性映射到目标（你想要预测的答案或结果），并输出一个汇集了这些模式的机器学习模型。


  此时，有必要清楚理解机器学习算法与模型之间的区别。学习算法将模型作为其输出。考虑一个例子来更好地理解这一点。线性回归是一种将点拟合到直线上的技术：y = mx+b。一旦拟合完成，你就会得到结果——例如，在这种情况下，y
  = 12x + 6。


  ### 基于算法的不同类型机器学习模型


  你的模型将迭代运行并给出结果。因此，从技术上讲，你可以基于这些算法创建多个模型。接下来讨论几个著名的模型。这些部分将深入介绍这些模型如何基于算法工作。其余模型及其算法关联将在下一章详细讨论。


  #### 二分类模型


  二分类模型预测二元结果。亚马逊机器学习使用行业标准的学习算法——逻辑回归——来训练二分类模型。接下来的部分列出了一些二分类问题的示例。


  该模型使系统能够回答以下问题：


  *   这封电子邮件是垃圾邮件吗？


  *   股价会上涨吗？


  *   这份文件评论是客户写的还是机器人写的？


  #### 多分类模型


  该模型允许你对多个类别进行预测（它可以从两个以上的结果中预测出一个）。为了训练多分类模型，组织通常使用诸如多项逻辑回归之类的学习算法。多分类问题使系统能够回答以下问题：


  *   这个产品是汽车、自行车还是一袋薯片？


  *   这本书是动作片、惊悚片还是爱情故事？


  #### 回归模型


  这些模型通常用于预测数值。为了训练回归模型，企业使用称为线性回归的学习算法。该模型的基本假设是，输出变量可以表示为输入变量组的线性组合（加权和）。以下是回归问题的示例：


  *   明天德里的气温是多少？


  *   对于这家公司的这只股票，应该卖出多少单位？


  如前所述，除了这些之外，确实还存在多个重要模型，它们将在下一章中介绍。


  ## 机器学习工具


  谷歌、微软、IBM、亚马逊以及许多其他创新公司正在通过各自的云平台提供机器学习 API 和工具。这使得工作更加轻松，并且应用程序、产品和服务（APS）能够快速构建。工具是机器学习生态系统中最重要的部分之一。选择合适的工具取决于多种因素，包括需求。与机器学习相关的工具使你能够顺利交付结果。在当前截止日期严格且紧迫的情况下，正确选择工具是一项不可或缺的武器。此外，它们也是架构决策和策略的重要组成部分。在项目层面，选择合适的工具起着非常重要的作用。




  ### 术语解析


  *   *API（应用程序编程接口）*：一份指令列表及其设置，一个应用程序可通过它向另一个应用程序发送指令。同时，它也是对一个软件应用/组件如何与其他软件应用/组件进行交互或通信的描述。它的使用方式使得单个程序能够直接与另一个程序互联，并以定义明确的方式使用彼此的功能。


  *   *平台*：针对广泛问题提供的一站式完整解决方案。例如，Microsoft .NET 和 Windows 平台为多种问题提供了解决方案。多家供应商提供基于云的平台，通常称为平台即服务（PaaS）解决方案。一个平台可能包含许多工具和组件。反过来，这些工具和组件可能有助于解决更广泛的问题，例如持久化、安全性、并发性等。通常，一个好的平台能够满足你的所有需求。平台附带一组预先选定的技术、工具、组件和库，你需要从中选择哪些用于你的系统（你将要开发/修改的系统）。平台是一个基础实体；可以把它看作一个服务提供者。平台提供运行/安装工具和框架的服务；一旦完成，程序就在其上运行。


  *   *框架*：利用底层平台提供的特性和功能来完成工作。例如，框架可以作为开发人员访问逻辑各个部分和环节的工具。框架为底层平台的多个部分提供了一层抽象。你可以在一个平台上运行多个框架。例如，根据你的项目需求，你可以在不同的平台上运行同一个框架。例如，你可以在
  Windows 和 Linux（平台）上运行 .NET Core 框架，而 .NET Framework 4.5 则只能在 Windows 平台上运行。


  *   *工具*：在编码或执行专门任务时，用于在软件程序中执行特定功能的装置。它具有预定义的输入，并产生预定义的输出。工具包类似于软件开发工具包——它是一个工具的集合，包含代码库和组件，并且通常能节省编码工作量，因为它包含了经过编译和组织的工具和库。


  *   *库*：你可以从程序中调用的一段代码，用于更快、更轻松地执行任务。例如，一个输入输出（I/O）库将提供加载和操作输入、输出以及文件（以预编码和编译好的代码块形式）的功能。这使你能够更快地完成任务并节省时间，因为你无需自己编写所有代码/程序。


  工具可以帮助自动化机器学习过程中的任务和步骤，从而在整个过程中减少人工干预。同时，这也加快了开发速度。通过使用工具节省的时间可以投入到更具生产力的任务中。无论哪种情况，无论你选择使用工具还是自己完成任务——你都需要进行研究并投入时间。


  在选择机器学习工具之前，最好根据经过测试的参数对其进行评估。这些参数几乎适用于任何工具的选择，并不仅限于机器学习工具。


  *   *直观且智能的界面*：机器学习涉及许多复杂的活动。例如，将子任务映射到主任务、创建和执行模型、将训练数据集与选定的模型和算法关联，以及监控进度。因此，直观且智能的界面非常重要。所以，在选择工具时，请牢记这一点。


  *   *符合最佳实践和标准*：工具必须符合最佳实践、标准、策略以及当前的模式和惯例。没有这些，工具生成的输出将不具备标准价值。


  *   *由社区更新和支持*：在为机器学习项目选择工具时，确保其得到社区的良好支持、包含完善的文档，并且由供应商/开源社区频繁更新，这一点很重要。所有这些都是一个好工具的最低要求。由于机器学习本身是一项不断发展和动态变化的技术，选择一个频繁更新的工具至关重要。


  一个机器学习工具通常提供以下功能：


  *   *应用程序编程接口（API）*：基于机器学习的工具通常提供一个应用程序编程接口，这让你可以灵活地决定使用哪些元素，以及如何在你的程序/代码/软件中精确地使用它们。


  *   *图形用户界面（GUI）*：机器学习工具通常提供一个图形用户界面，它通过允许你与窗口交互、接收及时的警报、可视化地查看数据、关联、集成和映射、以可视化形式提供信息和事实等，来简化你所执行的任务。


  *   *命令行界面*：除了图形用户界面之外，在某些场景下，你需要一个更轻量级的生产力工具来快速执行任务。因此，一个好的机器学习工具通常提供一个交互式命令行界面。你可以通过命令行执行程序和命令，并启用命令行参数化。




  ## 机器学习框架


  创建、运行和执行基于机器学习的系统需要大量的数据和计算能力。云是开发和托管机器学习应用的理想环境。多家公司已经在提供这些应用和服务。例如，微软正通过其 Azure
  ML 框架以按需付费模式提供此类服务。要在云环境中执行任务，除了技术层面的库、API 和 SDK，以及商业层面的良好工作模式与策略等重要要素外，你还需要优秀的框架和工具集。


  拥有一个良好且可运行的框架，是开展机器学习相关工作的“基本”要求之一。机器学习框架允许你创建和训练模型。一旦模型创建并训练完成，它就能提供将框架转化为 API
  的功能，供其他服务使用或调用。新一代的机器学习框架提供了丰富的功能，可将算法转化为模型。


  以下列表简要介绍了机器学习工具、库、框架和 API。


  *   *Caffe*：这是一个深度学习和机器学习框架。其开发注重表达性、速度和模块化。使用该框架的公司包括：Flicker、Yahoo 和 Adobe。


  *   *Google TensorFlow*：实现数据流图，其中批量数据（“张量”）可通过由图表描述的一系列算法进行处理。使用该框架的公司包括：Arm、Google、Uber
  和 Airbus。


  *   *MatLab*：一种高级技术计算语言和交互式环境。常用于算法开发、数据可视化、数据与数值分析。使用该框架的公司包括：Shell、Netflix。


  *   *Microsoft Azure ML Studio*：允许用户实时创建和训练模型。它还使用户能够将模型转化为 API，以便其他服务使用。使用该框架的公司包括：ESSAR
  GROUP、CloudMunch 和 ICICI Lombard General Insurance Company Ltd.。


  *   *Spark*：一个用于大规模数据处理和分析的快速通用引擎。Spark 通过 Java、Scala、Python 和 R 语言暴露其 API。Spark
  还提供批处理和流处理 API。使用该框架的公司包括：IBM、Google。


  *   *H 2 O*：一个开源的数学库。它用 Java 编写，并为 R、Python、Excel 和 Tableau REST API 提供原生 Java API
  驱动程序支持。使用该框架的公司包括：IBM、Google。


  *   *Sprinkling Water*：一个通常用于集成 Spark 和 H2O 的框架。它提供了透明地使用 H2O 数据结构和算法与 Spark API
  互操作的灵活性，反之亦然。使用该框架的公司包括：Netflix、IBM。


  *   PyTorch：深度学习模型（一种常用于图像识别和语言处理等应用的机器学习）可以使用 PyTorch 构建，这是一个功能完备的框架。大多数机器学习工程师发现它相当易于理解和使用，因为它是用
  Python 编写的。这个基于 Torch 的开源机器学习工具包旨在提升深度神经网络的安装速度和灵活性。在学术界和工业界，PyTorch 目前是 AI 研究人员和从业者使用最广泛的库。


  ## 分布式机器学习


  现代机器学习算法可以处理任何类型的数据。但当数据量很大时，处理和预测会花费大量时间。不过，有一些技术可以让算法运行得更快。


  *   降低算法的复杂度


  *   实施优化技术


  *   尽可能减少数据量


  *   编写分布式算法，使其运行在不同的机器上，并将数据和计算负载“分布”到多台机器上


  *   使用高效工具来减少需要处理的数据块


  在所有技术中，应用分布式算法最为实用，因为你无需在其它方面做出妥协。此外，随着硬件的商品化，硬件价格会下降，因此成本将降至最低。事实上，这种处理方式能让你最有效、最高效地利用资源。这种处理范式被称为*分布式机器学习*。以下是分布式机器学习的一些特点：


  *   以数据为中心，因为它使你能够在大型数据集上训练模型，并将数据拆分到分布式环境中的多台机器上。


  *   以模型为中心，因为大量模型参与数据压缩和训练。


  *   将模型分布到多台机器上。然而，单次训练迭代会跨越多个机器。


  *   以图为中心，因为（不同机器的）映射是以图形方式完成的。




  ## 大规模机器学习


  随着机器学习模型日益复杂，训练数据集的规模也在不断增长。语言模型通过学习数百万乃至数十亿个短语来训练，而嵌入模型则利用网络规模的文本和图数据集进行学习。可以合理认为，在过去几年中，跨大规模数据集训练机器学习模型极大地促进了下游任务的发展，但同时也被证明计算成本高昂。鉴于大数据规模的巨大增长，我们需要一个强大的机器学习系统，其模型能够高效且有效地处理数百万到数十亿个参数。该系统必须能够处理极其庞大的数据量，并提供精确的预测分析。传统的机器学习系统无法处理海量数据，因为它们采用标准的迭代式机器学习算法，以商业或学术方式顺序处理数据。因此，大规模机器学习系统的需求日益增长是合乎逻辑的，因为这些系统能够满足如此大规模下机器学习算法的处理需求。它们通过从拥有数百万到数十亿参数的复杂模型中学习来实现这一点。该系统需要由数十到数千台机器组成的分布式集群才能运行。


  由于涉及海量数据，大规模机器学习与典型的机器学习有很大不同。它需要处理大量的训练/测试样本、特征或类别。例如，Facebook、Instagram 和 Flickr
  都使用了此类机器学习算法，这些平台在任何时刻都有数百亿张照片可供使用。大规模机器学习数据集中都包含以下内容：


  *   超过 1000 亿个训练样本

  *   超过 1000 亿个特征

  *   每个训练样本约 100 个特征（稀疏数据）


  企业和学术界正高度关注大规模机器学习系统的开发，这些系统将提供可扩展、高效、容错的并行系统，用于在海量数据上执行学习任务。对于依赖数据做出决策的公司和组织而言，大规模机器学习是一个至关重要的工具。快速处理海量数据可以产生有洞察力的信息，并改进决策过程。


  预测分析、客户细分、风险管理和欺诈检测是大规模机器学习的一些应用场景。大规模机器学习能够识别出在没有海量数据集的情况下难以发现的关联、趋势和联系。因此，企业或许能够变得更智能，并制定出更有效的计划。


  从根本上说，大规模机器学习过程利用算法来发现数据中的模式。这些算法通常在一个数据集上进行训练，然后用于预测或定位趋势。一种方法是训练机器学习算法来发现客户数据中的趋势，进而预测客户行为。


  机器学习的变体，例如自然语言处理，也使用大规模机器学习。自然语言处理算法用于分析以自然语言编写的材料，并发现文本模式。这可用于解读文本含义、确定主题并形成预测。


  大规模机器学习对于公司和组织来说是一个有用的工具。它有助于快速处理海量数据并发现具有洞察力的信息。通过利用大规模机器学习，组织可以制定出更成功的策略。


  ## 机器学习编程语言


  选择一种编程语言来编写“关键任务”是一个困难且明智的决定。它取决于多种因素，这些因素基于特定业务场景的需求和相关性。当与机器学习和认知计算相关联时，这变得更具挑战性，因为编程过程涉及将智能嵌入到原始程序中，并需要大量的数据处理和计算能力。然而，以下列表描述的因素有助于做出这些决定，因为它们为选择合适语言提供了见解和指导。简要讨论了诸如速度、可编程性、库支持、语言内置功能、开源支持和可扩展性等参数。


  *   **程序开发速度**：无论是个人开发还是团队开发，速度都非常重要。在紧迫的截止日期下，编写代码所需的时间等因素变得至关重要。然而，其他相关因素，例如找到问题解决方案所需的时间以及快速发现错误的能力，也同样重要。


  *   **编程、学习和理解的难易程度**：编程语言越容易学习和理解，开发人员就能越快提高生产力。例如，Java 比 C++ 更容易学习，而 C 可能甚至更容易（然而，这具有主观性，取决于程序员对特定编程语言的熟悉程度），因为几乎所有程序都是编写一次，阅读多次。因此，能够解释和理解程序的本质以及正在发生的事情非常重要。另一个重要因素是编程语言的语法，这通常被忽视，但它对语言使用的难易程度会产生巨大影响。


  *   **库支持**：对于机器学习编程语言来说，良好的软件库支持非常重要。这必须包括对数据结构、与操作系统接口、统计和数据处理能力的支持。Perl 编程语言拥有大量的第三方库，这使其成为开发机器学习系统的合适选择。


  *   **内置功能语言在原语方面有所不同**：在选择一种编程语言来执行任务时，确定其支持该任务的内置功能非常重要。例如，为了满足机器学习相关的需求，该语言必须支持统计、预测分析和图形。良好的内置能力是必需的。


  *   **可扩展性**：这通常是高级语言真正受到考验的地方。在选择编码语言时，要留意语言的可扩展性方面。


  除了这些参数之外，可移植性、性能和适用性是在做出选择之前需要考虑的一些额外因素。以下各节简要介绍了机器学习中使用的主要编程语言，涵盖了其优势和显著特点。以下各节可作为决策的便捷工具包。




  ### R


  R 是一个用于统计计算、图形绘制、数据挖掘以及基于机器学习的计算的免费软件开发环境。它能在多种可用平台上编译和运行，包括 UNIX、Linux、Windows
  和 macOS。R 是最受欢迎的软件包和编程语言之一。它在统计学家和研究人员中很受欢迎，因为它提供了出色且优雅的统计编码/编程功能。R 提供了超过 4000 个专用软件包，这些软件包主要旨在利用统计功能。简而言之：


  *   R 是一个数据分析软件包。

  *   R 也被用作一种编程语言。

  *   R 是一个用于统计分析和数据处理的環境。

  *   R 是一个开源软件项目。

  *   R 在全球统计学家、数据分析师和数据科学家的社区中很受欢迎。


  为什么使用 R？


  *   *数据处理能力*：R 允许数据科学家通过划分大型多变量数据集，将数据集形成一种易于检索和分析的格式。

  *   *数据分析功能*：R 提供了种类繁多的统计数据分析功能。R 是一个开源开发工具/环境/编程语言。它得到了由统计学家、程序员、爱好者和计算机科学家组成的大型社区的支持。它受欢迎的原因之一是它提供了多种用于假设检验、统计模型创建和拟合的高效函数。它还提供了几种稳健的聚类技术，用于高效且有效地实现机器学习算法。

  *   *数据可视化*：R 被确立为数据表示、分析和可视化的“首选统计包”。作为一种编程语言，R 提供了许多现成的函数，用于以图形和图表的形式可视化数据。R 允许开发人员为任何数据集实现任何可视化想法。R
  的数据表示不仅限于数据的静态表示；它还提供了实现动画和其他创新交互式可视化技术的能力。

  *   *出色的易用性*：R 程序具有明确的能力来记录分析中涉及的步骤。因此，它使得模仿和/或更新分析变得容易。此功能使开发人员能够快速测试多个想法，并在需要时立即纠正问题。

  *   *集成能力*：R 提供了与其他流行语言（如 C/C++、Java 和 Python）出色的集成特性。它原生支持 ODBC，这使其能够与多种数据源通信，例如
  Excel、Access 和其他符合 ODBC 标准的数据库（Oracle、SQL Server 并行数据库）。它也能很好地与统计软件包集成（例如 SAS、Stata、SPSS
  和 Minitab）。


  R 不仅是免费的，而且是开源的。这实际上意味着任何人都可以检查可用的源代码，以查看执行某项任务实现了哪些代码，并从中获得见解。


  ### Scala


  Scala 编程语言是函数式编程语言和面向对象编程语言的结合。它运行在 Java 虚拟机（JVM）上。它的 .NET 版本也可用，这使其也能在 .NET 环境中运行。Scala
  基于这样一个理念：函数式编程语言和面向对象编程语言之间有很多共同点。作为一种函数式编程语言，Scala 提供了模式匹配能力（这对机器学习相关的编程很有用）。而作为一种面向对象编程语言，它采用了类似面向对象的功能，如使用类和继承。Scala
  从 Java 继承了许多特性，同时也包含了许多 Java 中没有的特性。简而言之：


  *   它使用了革命性和创新性的框架（例如，AKKA 和 Finagle）。这些框架是用 Scala 开发的，允许开发人员开发响应式系统。

  *   Scala 提供了出色的模式匹配能力，这在基于机器学习的编程中非常有用。

  *   Scala 将函数视为一等公民。

  *   Scala 对高阶函数有很好的支持。这意味着在 Scala 中开发高阶函数很容易。

  *   Scala 运行在 Java 虚拟机之上。因此，它提供了 Scala 代码与用 Java 编写的代码的无缝集成。

  *   Scala 可以轻松地与 .NET 框架集成。用 Scala 编写的代码可以编译成 CLR 字节码。


  为什么使用 Scala？


  *   *函数式语言*：大多数函数式语言为开发人员、程序员和数据科学家提供了一套工具集，用于实现迭代计算和进行预测性程序开发。Scala 也不例外；它也为开发者社区提供了丰富的功能集和能力。Scala
  是用于分布式计算的 MapReduce 编程模型的扩展。Scala 能非常高效地处理大量数据。Scala 提供了机器学习编程所需的大部分关键元素、组件、API
  和工具。它也是进行统计分析的一个不错选择。

  *   *通用编程语言*：Scala 旨在以简洁、复杂且类型安全的方式快速开发常见的编程模式。Scala 毫不费力地集成了面向对象编程（OOP）和函数式语言的特性。因此，它使开发人员能够充分发挥生产力。由于它与
  Java 完全兼容，因此它毫不费力地保留了与 Java 的完全互操作性，并受益于现代多核硬件特性。Scala 从根本上避免了共享状态，因此计算和运算可以随时分布在多核服务器的核心之间，以及数据中心内的服务器之间。这使得
  Scala 非常适合当代基于多核的 CPU。此外，它对分布式计算架构有出色的支持，因此最适合云计算工作负载。云计算工作负载需要并发性和并行性，这些通过 Scala
  很容易实现。

  *   *简洁*：Scala 的类型推断以及其他简洁和及时的特性使其成为一种简洁优雅的语言。例如，与 Java 相比，它通常能使开发人员将源代码的大小减少两到三倍。Scala
  附带了一套丰富的开发和生产力增强工具。因此，与 Ruby 和 Python 等语言的开发者相比（如果他们正确使用这些功能），开发者的生产力要高得多。




  *   **可扩展性**：无论是大型开发团队、庞大的代码库，还是大量的 CPU 核心，Scala 的可扩展性都从未妥协。此外，对于多核和分布式计算模型，Scala
  与 Light Bend 等响应式平台相结合，能够开发出工业级的实现方案。一种名为 Akka 的并发模型与 Scala 结合，为处理大规模基于机器学习的项目实现提供了特殊能力。


  *   **与 Java 的互操作性**：由于 Scala 是一种面向 JVM 的语言，所有现有的 Java 库和工具都可以与其无缝使用。这确保了先前在人力、资金和智力上的投入得到充分保护。


  *   **可编程性**：Scala 程序直接编译为 Java 字节码。反过来，字节码在 JVM 上运行。JVM 非常成熟和稳定。Scala 利用了 JVM 的卓越特性，如即时编译、自动垃圾回收功能和出色的部署技术。这些特性使其成为一种非常高效的编程语言。Scala
  对开发者的学习曲线并不陡峭，因为开发者可以使用熟悉的工具，并毫不费力地并行学习。Scala 使开发者能够编写更简洁、更快速、更具可扩展性，甚至更有趣的代码。


  此外，使用 Scala 时，你还会用到一种叫做 Apache Spark 的东西。这不是一种语言，但经常与 Scala 和 Python 一起使用。


  随着关联组织产生出更集中、更多样化的数据产品和服务，对机器素养的需求日益增长，它可以用于开发个性化、推荐和预测性洞察。Apache Spark 机器学习库（称为
  MLlib）允许数据科学家专注于他们的数据问题和模型，而不是处理围绕分布式数据的复杂问题（例如结构、配置等）。Spark 允许数据科学家除了解决机器学习问题外，还能处理多个数据问题。


  此外，Spark 生态系统支持流处理（实时计算）、通过 Spark SQL 和数据框进行的实时交互式查询处理，以及图计算（通过 GraphX）。Spark 是用
  Java 编写的，而 Scala 则利用了 JVM。


  Spark 支持多种编程语言，包括 Scala、Hive 和 Pig。对于 Spark 操作，Scala 是最著名的编程语言之一。Apache Spark 内置了用于流处理、SQL、机器学习和图处理的模块，被誉为用于大数据处理的快速、易用、通用工具。可以利用
  Spark 框架和 Apache Spark 附带的 MLlib 库来执行机器学习活动。


  你可以在 PySpark 中使用 Spark ML 模块，因为 PySpark 是 Apache Spark 的 Python API。MLlib 提供了众多算法和机器学习服务。Apache
  Spark 是一个超快速的开源数据处理设备，用于涉及机器学习和 AI 的操作，并得到了大数据领域最强大开源社区的支持。Spark 擅长迭代计算，这使得 MLlib
  运行迅速。同时，我们监控算法的性能。MLlib 中的高质量算法可以复制并产生优于 MapReduce 中使用的零星单次近似结果。


  Apache Spark 提供了改进 ETL 的框架。通过自动化，数据管道使组织能够形成更快速的数据驱动决策。它们是有效 ETL 流程中不可或缺的一部分，因为它们允许从多个来源有效且准确地聚合数据。


  ### Python


  Python 是一种解释型、交互式、面向对象的高级编程语言。它被称为一种强大的通用编程语言。Python 非常强调代码的可靠性和简洁性，以便程序员能够快速开发应用程序。它是一种多范式编程语言，允许用户以多种不同的编程风格编写代码。简而言之：


  *   Python 支持跨平台开发，并通过开源方式提供。

  *   Python 可以轻松地与 C/C++、.Net 和 Java 集成。

  *   大多数 Python 程序实现相同功能所需的代码要少得多，这需要更少的精力和代码行数。


  为什么使用 Python？


  *   **可读性**：Python 具有良好的代码可读性，适合快速软件开发。高水平的可读性是 Python 语言的核心。Python 使用一套完整的代码风格指南和“Pythonic”习语。这提高了用
  Python 编写的代码的可读性。

  *   **更少的编码工作**：Python 使用更少的代码，提供更高的生产力。

  *   **对数学和统计的良好支持**：Python 的应用跨越多个领域，包括 Web、GUI、操作系统、科学和统计。

  *   **快速增长**：它是开源社区中增长最快的编程语言之一。

  *   **灵活性**：Python 极其灵活。

  *   **良好的数值和符号特性**：它提供数值和符号计算功能。

  *   **良好的绘图特性**：在 Python 中轻松实现 2D/3D 绘图。

  *   **机器学习兼容性**：Python 对科学和机器学习相关任务非常有用。

  *   **用户界面支持**：它对用户界面有很好的支持。

  *   **支持高级计算**：它支持并行和分布式计算。

  *   **优秀的预构建库**：它拥有用于机器学习和图像处理的特殊库。

  *   **对开发者友好**：它包含游戏和 Web 开发功能，吸引了各种类型的开发者。

  *   **经久不衰**：Python 不会很快消失。

  *   **简单**：Python 易于设置和使用。


