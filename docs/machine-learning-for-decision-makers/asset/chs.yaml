  ### 机器学习在法律活动中的应用


  法律文件通常过于复杂，难以理解。大型组织有自己的律师团队来检查任何问题或交易的法律合规性。然而，新兴和发展中的企业则没有这种条件。机器学习在这两种场景中都能发挥作用。它可以帮助组织在有无协助的情况下解读法律文件。机器学习系统使用深度学习算法。例如，Legal
  Robot 构建了一个法律语言模型，将“法律语言”翻译成一长串数字，进而再翻译成通俗语言。这使得决策者能够快速理解法律要点。Legal Robot 还帮助客户确定合同或工作说明书中缺失的内容。同时，它还能帮助判断文档中是否缺少要素/信息。例如，系统可以判断保密协议中是否包含版税条款。如果没有，它会建议采取哪些行动步骤来应对这种情况。


  ### 机器学习预防洗钱


  对于政府组织、银行和其他金融机构而言，洗钱是一个大问题。传统手段通常无法有效预防。然而，通过深度学习和机器学习的结合力量，公司能够成功区分合法与欺诈性的买卖双方。归根结底，这都关乎异常检测。PayPal
  正在使用深度学习来防范欺诈和洗钱。该领域存在巨大机遇。


  ### 提升网络安全


  对于组织而言，安全是一个非常重要的关注领域。机器学习系统能有效处理这一问题。基于机器学习的系统监控并测量来自工作站和服务器之间以及相互交换的流量。如果识别出任何异常行为，它会自动向利益相关者发送通知，并尝试根据其知识库消除异常。例如，以色列通信服务提供商
  Orange 正在使用机器学习应用程序来保护其业务和客户数据。最近，该系统检测到一名员工下载的视频文件中存在恶意代码。安全团队立即通知了该员工。




  ## 科学与技术


  本节涵盖科学领域的商业机遇，从人类心理学到太空科学与宇宙学。


  由于科学几乎影响一切，技术、科学与社会研究的融合自然催生了新的商业途径。科学是一个宽泛的概念，同时它也让我们得以一窥人类当下的成功、挣扎与失败。


  科学本身也是一门大生意。几十年前，像太空旅行和登月这样的故事还仅限于科学界以及 NASA、ISRO 等政府机构。但现在，像 SpaceX 这样的公司正试图让普通人也能实现这一目标。让人类能够移居其他星球的愿景在几年前还显得遥不可及。随着新一代企业家和公司的涌现，这正在成为现实。


  同样，医学和医疗科学如今也是一门巨大的产业。新一代制药公司在研发或改良药物时，会整合多门科学的输入。他们正试图提出整体性的个性化治疗策略，以帮助患者对抗疾病。这是传统医学运作方式的一种范式转变。例如，对抗疗法曾以治疗疾病患者而闻名。现在，医生们将其称为现代医学科学，因为它涵盖了更广泛的思维过程，并融合了心理学、物理学和化学等多门科学。同样，治疗癌症也不再仅仅是对抗疗法的范畴。治疗方案结合了核物理（放疗/化疗）以及后续的康复治疗（心理学）。


  机器学习对科学领域具有巨大的商业和商业影响，理想情况下它本身就可以写成一本书。在一个章节的短短一节中不可能涵盖所有机遇。


  ### 医学科学


  机器学习有潜力成为外科手术中卓越而强大的工具。这能使外科医生和内科医生利用复杂的临床数据（借助分析技术）做出关键决策。例如，机器学习和大数据分析可能对整形与重建外科的进步做出重大贡献。机器学习从根本上可以分析历史数据，并开发出能够通过知识获取为医生提供洞察的算法/模型。这并非新闻，因为机器学习已被成功应用于处理医学和外科领域中大量复杂的数据。IBM
  Watson 是将机器学习与医学科学相结合的一个绝佳范例；它能够提供实时诊断并建议治疗方案。


  以下是整形外科中已探索出商业机遇，且机器学习已发挥作用的领域：


  *   **烧伤外科**：已开发出一种机器学习方法来分析和预测烧伤的治疗时间。它可以根据烧伤深度提供精确的愈合时间。

  *   **显微外科**：监测和预测设备通过智能手机照片并利用深度学习算法，监测组织瓣的血流灌注。基于患者病史提供个性化手术建议是另一个存在大量机遇的领域。

  *   **颅面外科**：未来的算法可能有助于识别导致唇腭裂的已知和未知基因。

  *   **放射学**：当应用于传统放射摄影、CT、MRI 和 PET 扫描等放射学数据以及放射学报告时，机器学习能自动识别复杂模式，并帮助医生做出明智判断。根据发表在《放射学》上的一项研究，在临床环境中，AI
  工具能够可靠地区分正常和病理性的胸部 X 光片。深度学习可用于自动化放射科医生执行的许多耗时操作，例如病灶识别、分割、分类、监测和治疗反应预测，这些操作通常在没有软件的情况下是无法完成的。AI
  驱动的图像分析还可能用于追踪流经心脏及其伴随动脉的血流变化，或检测特定肌肉成分的增厚。癌性病变也可以通过 AI 来发现。


  机器学习不仅有助于决策过程，还能帮助发现通过分析较小数据集或经验性案例可能无法发现的模式和相关性。机器学习甚至可能帮助在疾病症状出现之前就将其阻止。


  ### 太空科学


  像 SpaceX 这样的公司和 NASA 这样的组织每秒都在分析数 TB 的星系和恒星数据。例如，为了对银河系中的恒星进行编目并确定其位置，NASA 使用不断发展的机器学习技术来加速这一整体过程。为了使分析更加完美，该组织一直使用机器学习来“教”计算机如何根据数据识别新恒星和星系中的模式。太空公司出于多种目的使用机器学习，包括以下方面：


  *   他们正在开发机器学习算法和模型，以实现手动密集型流程和任务的自动化。

  *   他们正在开发新的工具、框架、能力和自动化基础设施，以改进基于推进的数据处理、分析和审查。


  ### 物理学


  物理学有时会处理复杂的问题和大量的数据。例如，在欧洲核子研究中心（CERN）的大型强子对撞机（LHC）实验中，机器学习在理解碰撞影响方面变得非常有用。它分析了每一次碰撞，并为科学家提供了有用的见解。机器学习算法在回归或分类相关任务上的表现比物理学家高出
  25% 到 30%。


  *   机器学习算法和模型用于处理卫星数据。同样在大气物理学中，机器学习被用于天气预报和预测。

  *   机器学习在天体物理学中常被用于对大量数据进行分类和组织。例如，聚类算法被用于开普勒数据，以排序、定位和识别那些拥有稳定环境、可能适合居住的恒星系统。


  ### 生物学


  像马尔可夫模型、支持向量机、神经网络和图模型这样的机器学习算法和模型，被频繁用于处理和管理数据的随机性和不确定性。这些是分析人类基因组的关键技术。它们特别用于预测基因组的编码区或非编码区；其他用途包括
  RNA 预测。在这个领域有许多新兴和成熟的公司。


  例如，杜邦工业生物科学公司在酶的蛋白质工程和微生物的代谢工程方面做了大量工作，以保护我们的环境。他们正在分析蛋白质和酶，并借助机器学习算法和模型提取洞察。其他一些存在商业机遇的领域包括：


  *   **基因发现算法**：通过使用马尔可夫模型、隐马尔可夫模型（HMM）、维特比算法和参数估计，公司可以提供个性化和个体化的遗传信息。

  *   **寻找 miRNA 位点**：像 Rose Pharmaceutical 这样的公司使用隐马尔可夫模型来支持丙型肝炎研究等领域的研究。

  *   **分类与预测**：这涉及整合各种生物数据，并选择最佳模型进行数据分类和预测。


  商业机遇不仅存在于这些领域，还跨越了其他学科，包括天体生物学、环境科学、社会生物学、心理学等等。这里的重点是突出机器学习在科学领域的广泛机遇。




  ## 机器学习类型


  数据科学领域存在多种机器学习算法。本章主要集中讨论三种类型的算法——监督学习、无监督学习和强化学习。第 1 章涵盖了监督学习和无监督学习的基本概念与运作方式。在此，我将对强化学习进行更详细的阐述。


  ### 强化学习


  强化学习是机器学习的一个类别，它通过奖励和惩罚来训练系统。换句话说，它训练系统的方式就像人类训练宠物一样。例如，如果你的狗服从并按照你的指令行动，你会通过给予奖励来鼓励它，并在它不听话时可能惩罚它。类似地，如果系统表现良好，训练者会给予它正向奖励（正分）。当系统表现不佳时，训练者会惩罚它（负分）。接收到负分的学习系统必须像狗一样自我改进。


  这是一个试错机制/过程。强化学习算法会选择性地保留那些在一段时间内利用了已确认奖励的输出结果。广义上讲，强化学习算法试图模仿人类大脑在惩罚和奖励方面的运作方式。它们会选择能带来最大奖励的行动。强化学习也用于从一组可用行动中选择最佳可能选项。它们基于自身的理解选择最佳选项，并在每次行动后以迭代方式获得反馈。这种反馈机制使强化学习能够识别该行动是好的、中性的，还是一个巨大的错误。


  通常，强化学习算法最适合自动化系统。它们通过自我学习程序，无需人类指导就能做出小型决策。自动扶梯、自动人行道、供暖系统、冷却设备和照明系统都是实施强化学习算法的绝佳候选对象。强化学习算法最初是为了控制机器人（自动化系统）而开发的。任何无需人工干预就能自主移动的物体，从自动无人机到吸尘器，很可能都运行在强化学习算法之上。基于强化学习算法的程序和系统总能回答“应该采取什么行动”这个问题，尽管行动通常由机器执行。


  强化系统通常回答如下问题：


  *   网页中哪些位置适合放置特定广告，使其最有可能被用户注意到？

  *   我应该根据当前环境条件调高空调温度还是调低它？

  *   现在是购买股票的正确时机吗？如果是，我现在应该购买多少股 ABC 公司的股票？

  *   面对这个交通信号灯，我应该保持当前车速、刹车还是加速通过？


  与其他类型的算法相比，强化学习算法通常需要付出更多努力才能使其发挥作用。其原因是它们与系统的整体逻辑紧密集成和绑定。强化学习算法的优点在于它们可以在没有任何数据的情况下开始工作。它们会在运行过程中积累数据。图
  2-3 解释了强化学习的一般工作方式。在这种学习算法中，学习器通过与环境的交互来收集信息。这与监督学习不同，监督学习中存在预定义的带标签数据集。


  ![](img/429391_2_En_2_Fig3_HTML.jpg)


  一张图表说明了强化学习。智能体执行动作，然后环境奖励智能体。


  图 2-3


  强化学习


  在强化学习中，奖励与任务及其相关目标有关。智能体的目标是最大化其奖励。因此，它自然会确定最佳行动方案或策略以获得最大奖励（这与老鼠/猴子/人类的工作方式相同）。智能体从环境接收到的信息是即时奖励（与刚刚采取的行动相关）。环境不提供任何未来或长期的奖励反馈。


  强化学习有两个重要场景：


  *   智能体了解环境模型的情况。在这种情况下，目标是最大化所获得的奖励。

  *   在另一种情况下，智能体不了解环境模型，环境对其是未知的。显然，在这种情况下，它们面临着一个学习问题。


  在第二种情况下，智能体必须从状态中学习并优化收集到的信息。这可用于获取关于环境的信息并确定最佳行动。马尔可夫决策过程（MDPs）模型及其与环境的交互在强化学习中被广泛采用。为完整起见，让我们快速了解一下监督学习、无监督学习和半监督学习（我简要介绍它们，因为第
  1 章已详细涵盖）。


  ### 监督学习


  在监督学习中，输入被称为训练数据，并具有已知的标签和已知的结果/输出。模型是通过训练数据在两步过程（模型和预测）中生成或创建的。该模型用于进行预测，并在预测不正确时进行修正。（模型的）训练过程会持续进行，直到模型在训练数据上达到所需的准确度水平（以迭代方式）。


  ### 无监督学习


  在无监督学习中，输入数据没有标签，并且在这种类型的学习算法中，目标数据是未知的。在无监督学习中，将通过推断输入数据中存在的结构和模式来准备模型。这可以通过系统地减少冗余的数学过程、通过规则或通过按相似性组织数据来完成。


  ### 半监督学习：快速了解


  我在这本书中没有涵盖这种类型的学习算法。然而，了解它对你会有帮助。在半监督学习中，输入数据是标记数据和未标记数据的组合。在这里，模型基于组织数据的结构进行学习，并且必须能够进行预测。在半监督学习中，少数数据集被标记，但大多数以未标记格式存在。监督和无监督建模以及其他技术的组合被使用。


  所有学习算法都有子类型。我在此不解释这些子类型，因为它们是第 3 章的主题。然而，了解一下每种学习算法中可用的不同子类型是值得的（见表 2-1）。


