  trans: "\n### 创建自定义视觉对象\n\nPower BI Desktop 中的一些主要 Power BI 标准视觉对象被广泛使用。然而，如前一节所述，可以通过自定义视觉对象来扩展这些功能。要访问自定义视觉对象，您必须在\
    \ Power BI Desktop 中单击“市场”。有两种方法可以使用 Java 脚本或 R 代码创建自定义视觉对象。\n\n我将简要解释使用 R 代码创建自定义视觉对象的过程。\n\
    \n1.  第一步是从 [`https://nodejs.org/`](https://nodejs.org/) 安装 NodeJS。\n\n2.  接下来，使用命令提示符安装\
    \ Power BI 视觉对象工具（图 4-26）：\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig26_HTML.jpg](img/463840_1_En_4_Fig26_HTML.jpg)\n\
    \n图 4-26\n\n通过命令提示符安装 Power BI 自定义视觉对象\n\n```\nnpm install -g powerbi-visuals-tools\n\
    ```\n\n1.  安装 Power BI 自定义视觉对象后，为确保它们已正确安装，我们必须运行 `pbiviz` 命令。运行此命令后，Power BI\
    \ 自定义视觉对象工具的相关信息将显示在命令提示符控制台中（图 4-27）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig27_HTML.jpg](img/463840_1_En_4_Fig27_HTML.jpg)\n\
    \n图 4-27\n\n确认 Power BI 自定义视觉对象\n\n2.  接下来，我们必须创建一个 `rhtml` 模板。要创建模板文件夹，我们首先必须在\
    \ C 盘中创建一个空文件夹。在 C 盘中创建一个名为 `CustomVisual` 的新文件夹后，然后，使用命令提示符，我们必须将目录更改为 `C:\\\
    \ CustomVisual`。在命令提示符中，我们运行以下代码：\n\n```\npbiviz new sampleRHTMLVisual -t rhtml\n\
    ```\n\n通过运行该代码，将在 `CustomVisual` 文件夹中创建一个名为 `sampleRHTMLVisual` 的文件夹。在此文件夹中，有一个名为\
    \ `script.r` 的 R 文件（图 4-28）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig28_HTML.jpg](img/463840_1_En_4_Fig28_HTML.jpg)\n\
    \n图 4-28\n\n自定义视觉对象的示例文件夹\n\n这是一个提供模板的文件夹，用于创建其他 R 自定义视觉对象。检查文件夹内的 `script. R`\
    \ 文件（图 4-29）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig29_HTML.jpg](img/463840_1_En_4_Fig29_HTML.jpg)\n\
    \n图 4-29\n\n脚本文件中的 R 代码\n\n现在，如图 4-29 中的代码所示，我们需要两个库，Plotly 和 ggplot2，以便使用 Plotly\
    \ 绘制一个简单的 ggplot2 图表。\n\n这里，数据集已硬编码为 `iris`，这是 R 中的一个开源数据集。该图从 `iris` 数据集中获取数据，并显示花瓣、长度和花的种类。然后我们使用\
    \ `ggplotly` 函数来显示数据。\n\n因此，我们有了一个 R 脚本。现在我将首先从中创建一个包，然后编写我的代码来创建不同的图表。因此，我返回命令提示符，并在该文件夹中键入\
    \ `pbiviz package`（图 4-30）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig30_HTML.jpg](img/463840_1_En_4_Fig30_HTML.jpg)\n\
    \n图 4-30\n\n在命令提示符中创建自定义视觉对象\n\n1.  在 Power BI 文件中打开自定义视觉对象。为此，我们必须选择“可视化”标准面板中的“从文件导入”选项（图\
    \ 4-31）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig31_HTML.jpg](img/463840_1_En_4_Fig31_HTML.jpg)\n\
    \n图 4-31\n\n将自定义视觉对象导入 Power BI\n\n2.  选择“从文件导入”选项后，我们必须浏览 `sampleRHTMLVisual`\
    \ 文件夹并查找 `dist` 文件夹。在此文件夹中，有一个以文件夹名称命名的 `pbiviz` 文件。我们必须将此文件导入 Power BI 可视化面板（图\
    \ 4-32）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig32_HTML.jpg](img/463840_1_En_4_Fig32_HTML.jpg)\n\
    \n图 4-32\n\n已导入的自定义视觉对象\n\n3.  最后一步是将自定义视觉对象拖放到 Power BI 报表区域（图 4-33）。该视觉对象与特定数据无关。\n\
    \n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig33_HTML.jpg](img/463840_1_En_4_Fig33_HTML.jpg)\n\
