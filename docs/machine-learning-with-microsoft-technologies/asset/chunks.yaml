  trans: '

    ## Power Query 中的自动化机器学习


    在上一节中，我解释了如何使用决策树进行预测分析。现在，我们将在 Power Query 中使用它，无需特定图表即可进行预测。


    首先，我们必须点击页面顶部的 Power Query 编辑器，导航到 Power Query 环境。在 Power Query 中，你必须先从 [`www.kaggle.com/c/titanic`](http://www.kaggle.com/c/titanic)
    [4] 下载*泰坦尼克号*数据集。然后，点击新建源，选择文本/CSV 选项导入数据集，并点击确定（图 7-18）。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig18_HTML.jpg](img/463840_1_En_7_Fig18_HTML.jpg)


    图 7-18


    将泰坦尼克号数据集导入 Power Query


    将数据集导入 Power Query 后，我们必须导航到“转换”选项卡，然后点击“运行 R 脚本”。在 R 编辑器中，我们将能够编写 R 代码。代码的第一行引用了一个名为
    `rpart` 的库。`rpart` 包必须首先安装在你的 RStudio 中。安装前，请先使用以下命令确认你尚未安装它：


    ```

    Library("rpart")

    ```


    否则，在 RStudio 中，使用以下代码查看你的机器上已安装了哪些库。


    ```

    packagematrix <- installed.packages();

    NameOnly <- packagematrix[,1];

    OutputDataSet <- as.data.frame(NameOnly);

    OutputDataSet

    ```


    首先，我们必须确保 `rpart` 已安装到我们的机器上。然后，我们在 R 编辑器中编写以下代码（就像本章前面为神经网络所做的那样）。现在，我们必须引用 `rpart`
    库，并将数据分为训练集和测试集。


    ```

    library(rpart)

    numrows<-nrow(dataset)

    sampledata<-sample(numrows,0.8∗numrows)

    train<-dataset[sampledata,]

    test<-dataset[-sampledata,]

    ```


    创建模型是下一步。这涉及到我们想要预测的属性，并基于训练数据集为其创建模型。此外，我们必须有一个 `Survived ~` 的公式。这表明我们想要根据年龄、性别和乘客等级来预测幸存列。`predict`
    函数将用于预测分析中的生存情况。


    ```

    DT<-rpart(Survived~ Age+Pclass+Sex,data=train,method= ="class")

    prediction<-predict (DT,test)

    rpartresult<-data.frame(prediction,test)

    ```


    因此，预测结果将以名称 `rpartresult` 显示在 Power Query 中。结果将包含两个不同的附加列。“X0”代表乘客未幸存的概率，“x1”代表乘客幸存的概率。现在想象一下，我们想要使用
    `rpart` 算法对另一个数据集进行分类，例如第 6 章讨论的与癌症相关的数据。可以对 R 代码进行参数化，以便将所需的数据集、预测列等传递给 R 代码。为此，我们必须复制该数据集（图
    7-19）。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig19_HTML.jpg](img/463840_1_En_7_Fig19_HTML.jpg)


    图 7-19


    复制泰坦尼克号数据集


    现在只需右键单击新数据集，从中创建一个函数。需要从新复制的数据集中创建一个函数（图 7-20）。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig20_HTML.jpg](img/463840_1_En_7_Fig20_HTML.jpg)


    图 7-20


    在 Power Query 中创建函数


    创建函数后，我们必须通过传递参数来自定义它。为此，我们必须导航到高级编辑器（图 7-21）。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig21_HTML.jpg](img/463840_1_En_7_Fig21_HTML.jpg)


    图 7-21


    Power Query 中的高级编辑器

    '
- fmt: '在`Advanced Editor`中，可以看到之前应用于`Titanic`数据集的`M`语言步骤。如图[7-22](#463840_1_En_7_Chapter.xhtml#Fig22)所示，数据集的来源已从本地计算机中识别出来。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig22_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig22_HTML.jpg)


    图7-22 用于编写`M`语言的`Advanced Editor`


    前三行应替换为以下内容：


    ```

    (#"Source Table" as table) as table=>

    let

    Source = #"Source Table",

    ```


    在第一行中，我们定义了一个名为`Source Table`的变量，在第三行中，将其赋值给`Source`变量。下一步，我们将删除一些以`Promoted Headers`和`Changed
    Type`开头的行。这些行仅用于特定数据集（`titanic`）的转换。现在我们有了以下行，仍需进行一些转换：


    ```

    (#"Source Table" as table) as table=>

    let

    Source = #"Source Table",

    #"Run R Script" = R.Execute("# ''dataset'' holds the input data for this script#(lf)library(rpart)
    #(lf)numrows<-nrow(dataset)#(lf)sampledata<-sample(numrows,0.8∗numrows)#(lf)train<-dataset[sampledata,]#(lf)test<-dataset[-sampledata,]#(lf)DT<-rpart(Survived~
    Age+Pclass+Sex,data=train,method=""class"")#(lf)prediction<-predict (DT,test)#(lf)rpartresult<-data.frame(prediction,test)",[dataset=#"Changed
    Type"]),

    rpartresult = #"Run R Script"{[Name="rpartresult"]}[Value]

    in

    rpartresult

    in

    Source

    ```


    如上述代码所示，我们有一个标题行`#"Run R Script" =`，其中包含一个函数`R.Execute`。此函数包含我们编写的所有`R`代码。在`M`语言中，一个函数的输出将传递给下一个函数。前一个函数是用于更改类型`Changed
    Type`，我们已将其删除。现在我们必须修改`Run R Script`中的代码，如下所示：


    ```

    #"Run R Script" = R.Execute("# ''dataset'' holds the input data for this script#(lf)library(rpart)
    #(lf)numrows<-nrow(dataset)#(lf)sampledata<-sample(numrows,0.8∗numrows)#(lf)train<-dataset[sampledata,]#(lf)test<-dataset[-sampledata,]#(lf)DT<-rpart(Survived~
    Age+Pclass+Sex,data=train,method=""class"")#(lf)prediction<-predict (DT,test)#(lf)rpartresult<-data.frame(prediction,test)",[dataset=#"Changed
    Type"]),

    ```


    `Changed Type`应替换为`Source`，如下列代码所示：


    ```

    let

    Source = #"Source Table",

    #"Run R Script" = R.Execute("# ''dataset'' holds the input data for this script#(lf)library(rpart)
    #(lf)numrows<-nrow(dataset)#(lf)sampledata<-sample(numrows,0.8∗numrows)#(lf)train<-dataset[sampledata,]#(lf)test<-dataset[-sampledata,]#(lf)DT<-rpart(Survived~
    Age+Pclass+Sex,data=train,method=""class"")#(lf)prediction<-predict (DT,test)#(lf)rpartresult<-data.frame(prediction,test)",[dataset=Source]),

    rpartresult = #"Run R Script"{[Name="rpartresult"]}[Value]

    in

    rpartresult

    in

    Source

    ```


    我们仍需进行一些额外的更改。这些更改将应用于我们想要预测的`Name`列。目前是`Survived~ Age+Pclass+Sex`，但我们希望将`Survived`列替换为用户提供的参数。此外，我们不想使用另一列作为输入，而是考虑所有列。因此，我们必须更改代码，如下所示：


    ```

    (#"Source Table" as table, #"Prediction Column"as text) as table=>

    let

    Source = #"Source Table",

    #"Run R Script" = R.Execute("# ''dataset'' holds the input data for this script#(lf)library(rpart)
    #(lf)numrows<-nrow(dataset)#(lf)sampledata<-sample(numrows,0.8∗numrows)#(lf)train<-dataset[sampledata,]#(lf)test<-dataset[-sampledata,]#(lf)DT<-rpart(
    "&#"Prediction Column"&"~ .,data=train,method=""class"")#(lf)prediction<-predict
    (DT,test)#(lf)rpartresult<-data.frame(prediction,test)",[dataset=Source]),

    rpartresult = #"Run R Script"{[Name="rpartresult"]}[Value]

    in

    rpartresult

    in

    Source

    ```


    我们必须对代码进行一些优化，删除最后一行`in Source`。因此，最终代码将是：


    ```

    (#"Source Table" as table,#"Prediction Column"as text) as table=>

    let

    Source = #"Source Table",

    #"Run R Script" = R.Execute("# ''dataset'' holds the input data for this script#(lf)library(rpart)
    #(lf)numrows<-nrow(dataset)#(lf)sampledata<-sample(numrows,0.8∗numrows)#(lf)train<-dataset[sampledata,]#(lf)test<-dataset[-sampledata,]#(lf)DT<-rpart(
    "&#"Prediction Column"&"~ .,data=train,method=""class"")#(lf)prediction<-predict
    (DT,test)#(lf)rpartresult<-data.frame(prediction,test)",[dataset=Source]),

    rpartresult = #"Run R Script"{[Name="rpartresult"]}[Value]

    in

    rpartresult

    ```


    运行代码后，我们将得到一个带有输入变量的函数（图[7-23](#463840_1_En_7_Chapter.xhtml#Fig23)）。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig23_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig23_HTML.jpg)


    图7-23 创建具有两个输入的分类函数


    要测试该函数，我们必须创建一个数据集传递给函数。导入新的`Titanic`数据集，然后按住`Ctrl`键并单击四个主要列：`Survived`、`Pclass`、`Age`和`Sex`。接下来，右键单击并选择`Remove
    Columns`选项（图[7-24](#463840_1_En_7_Chapter.xhtml#Fig24)）。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig24_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig24_HTML.jpg)


    图7-24 选择列


    最后，得到一个包含四列的数据集，可以传递给函数。在函数中，对于第一个参数，我们必须选择`Titanic`数据集，对于第二个参数，选择名为`Survived`的`Prediction
    Column`（图[7-25](#463840_1_En_7_Chapter.xhtml#Fig25)）。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig25_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig25_HTML.jpg)


    图7-25 调用函数


    接下来，我们可能会收到一条关于`Edit Permission`的消息，该消息涉及提供在查询上运行外部脚本的权限（图[7-26](#463840_1_En_7_Chapter.xhtml#Fig26)）。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig26_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig26_HTML.jpg)


    图7-26 权限请求


    接受权限后，我们现在可以看到结果，如图[7-27](#463840_1_En_7_Chapter.xhtml#Fig27)所示。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig27_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig27_HTML.jpg)


    图7-27 `Titanic`数据集的函数结果


    为了测试该函数，我导入了另一个数据集[[5](#463840_1_En_7_Chapter.xhtml#Par71)]，该数据集在第[6](#463840_1_En_6_Chapter.xhtml)章中介绍过。这是一个与乳腺癌患者相关的数据集。我想预测患者的诊断结果：患者的癌症是恶性（`M`）还是良性（`B`）。对于这个新数据集，我们遵循与之前相同的过程。首先，导入它，然后将数据集的名称和列传递给函数（图[7-28](#463840_1_En_7_Chapter.xhtml#Fig28)）。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig28_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig28_HTML.jpg)


    图7-28 为癌症数据集调用分类函数


    调用函数后，预测结果将作为一个新查询出现（图[7-29](#463840_1_En_7_Chapter.xhtml#Fig29)）。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig29_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig29_HTML.jpg)


    图7-29 癌症诊断数据集的预测结果


    ## 总结


    本章的主要目的是展示如何使用`R`代码在`Power Query Editor`中执行机器学习。介绍了两种不同的算法：神经网络和决策树。我讨论了如何设置参数以使机器学习更加灵活。在下一章中，我将讨论使用`Power
    BI`进行描述性分析。'
