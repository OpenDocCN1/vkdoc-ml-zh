    ## 在 SQL Server Reporting Services 中创建 R 可视化图表


    可以在 SQL Server 中生成 R 图表，并在 SQL Server Reporting Services (SSRS) 中显示该图表。第一步是将所需的包安装到机器学习服务中。为此，我们可以在外部脚本存储过程中使用
    `install.packages()` 命令，如下所示：


    ```

    EXECUTE sp_execute_external_script @language=N''R''

    ,@script = N'' install.packages("ggplot2");''

    ,@input_data_1 = N''SELECT 1 as col''

    WITH RESULT SETS ((PackageName nvarchar(250) ))

    ```


    上述代码可能有效，但有时由于管理员权限问题，它可能无法工作。你可能会在 `install.packages("arules")` 中收到类似以下警告的消息：


    ```

    ''lib = "C:/Program Files/Microsoft SQL Server/MSSQL14.ML2017/R_SERVICES/library"''
    is not writable

    Error in install.packages("ggplot2") : unable to install packages

    Calls: source -> withVisible -> eval -> eval -> install.packages

    ```


    要解决此问题，我们必须以管理员身份运行 `Rugi.exe` 来安装包。此外，我们必须指定包的安装位置。因此，需要 SQL Server 中 R 的机器学习服务的路径。R
    中有一个函数 `.libPaths()`，它可以显示已安装包的位置。所以，我们必须在 SQL Server 2017 中运行此代码，以找出 R 库路径。


    ```

    EXECUTE sp_execute_external_script  @language = N''R''

    , @script = N''OutputDataSet <- data.frame(.libPaths());''

    WITH RESULT SETS (([DefaultLibraryName] VARCHAR(MAX) NOT NULL));

    GO

    ```


    运行代码后，机器学习服务库路径将显示在 SQL Server 输出窗口中（图 9-11）。


    ![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig11_HTML.jpg](img/463840_1_En_9_Fig11_HTML.jpg)


    图 9-11


    机器学习服务的库路径


    安装 ggplot2 时，可能会收到另一条消息，要求安装其他包。安装 ggplot2 库后，我们可以编写 R 代码来创建图表并将其存储在 SQL Server
    中。我将使用以下 SQL 代码绘制图表：


    ```

    exec sp_execute_external_script @language =N''R'', @script=N''library("ggplot2")
    fields<-inputDataSet fields<-na.omit(fields) image_file = tempfile(); jpeg(filename
    = image_file, width=1000, height=1000); print(ggplot(fields,aes(x=fields$TaxAmt,y=fields$TaxAmt))+geom_boxplot()+facet_grid(fields$Color~.)
    ) dev.off(); OutputDataset <- data.frame(data=readBin(file(image_file,"rb"),what=raw(),n=1e6))
    '',@input_data_1 =N''select Color,Size,class,TaxAmt,SalesAmount from [dbo].[FactInternetSales]
    FIS inner join [dbo].[DimProduct] DP on FIS.ProductKey=dp.ProductKey'' ,@input_data_1_name
    = N''inputDataSet'' ,@output_data_1_name = N''OutputDataset'' WITH RESULT SETS
    ((plot varbinary(max)));

    ```


    ### R 代码部分


    ```

    library("ggplot2")

    fields<-inputDataSet

    fields<-na.omit(fields)

    image_file = tempfile();

    jpeg(filename = image_file, width=1000, height=1000);

    print(ggplot(fields,aes(x=fields$TaxAmt,y=fields$TaxAmt))+geom_boxplot()+facet_grid(fields$Color~.)

    )

    dev.off();

    OutputDataset <- data.frame(data=readBin(file(image_file,"rb"),what=raw(),n=1e6

    ```


    以下是对上述代码的简要说明：


    `library("ggplot2")`：引用该包。


    `fields<-inputDataSet:`：获取数据。


    ```

    image_file = tempfile();

    ```


    `jpeg(filename = image_file, width=500, height=500);`：从 ggplot2 包创建图像文件。


    `ggplot(fields,aes(x=fields$TaxAmt,y=fields$TaxAmt))+geom_boxplot()+facet_grid(fields$Color~.)`：指代之前文章中已解释过的代码。


    ```

    dev.off();

    OutputDataset <- data.frame(data=readBin(file(image_file,"rb"),what=raw(),n=1e6

    ```


    此代码创建一个 Var 二进制变量，用于将绘图转换为二进制类型的变量。上述代码创建了一个带有箱线图的表格图表。


    下一步是从 SQL Server 获取数据。


    ### 输入数据


    ```

    @input_data_1 =N''select Color,Size,class,TaxAmt,SalesAmount from [dbo].[FactInternetSales]
    FIS inner join [dbo].[DimProduct] DP on FIS.ProductKey=dp.ProductKey'' ,@input_data_1_name
    = N''inputDataSet'' ,@output_data_1_name = N''OutputDataset''

    ```


    相关的数据集 AdventureWorks* 可以从 [`www.microsoft.com/en-us/download/details.aspx?id=49502`](http://www.microsoft.com/en-us/download/details.aspx%253Fid%253D49502)
    [4] 下载。


    ### 返回数据


    ```

    WITH RESULT SETS ((plot varbinary(max)));

    ```


    最后，我们必须以二进制变量的形式返回绘图。


    运行代码后，我们可能会得到如图 9-12 所示的结果。


    ![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig12_HTML.jpg](img/463840_1_En_9_Fig12_HTML.jpg)


    图 9-12


    为图表创建二进制值


    现在我们必须将数据存储在表中。首先，我们使用以下代码在 SQL Server 中创建一个名为 ggplot 的表：


    ```

    IF NOT EXISTS (SELECT 1 FROM sys.objects WHERE object_id = OBJECT_ID(N''[dbo].[ggplot]'')
    AND [type] IN (N''U'')) BEGIN alter TABLE [dbo].ggplot NULL ); END

    ```


    然后，通过插入以下命令将绘图输入到表中：


    ```

    insert into [dbo].[ggplot] exec sp_execute_external_script @language =N''R'',
    @script=N''library("ggplot2") fields<-inputDataSet fields<-na.omit(fields) image_file
    = tempfile(); jpeg(filename = image_file, width=1000, height=1000); print(ggplot(fields,aes(x=fields$TaxAmt,y=fields$TaxAmt))+geom_boxplot()+facet_grid(fields$Color~.)
    ) dev.off(); OutputDataset <- data.frame(data=readBin(file(image_file,"rb"),what=raw(),n=1e6))
    '', @input_data_1 =N''select Color,Size,class,TaxAmt,SalesAmount from [dbo].[FactInternetSales]
    FIS inner join [dbo].[DimProduct] DP on FIS.ProductKey=dp.ProductKey'' ,@input_data_1_name
    = N''inputDataSet'' ,@output_data_1_name = N''OutputDataset''

    ```


    现在，我们已经在数据库中创建并存储了一个图表。


    ### 在 SSRS 中显示图表


    要在 SQL Server 数据工具中显示图表，我们必须创建一个新的 SSRS 项目（图 9-13）。


    ![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig13_HTML.jpg](img/463840_1_En_9_Fig13_HTML.jpg)


    图 9-13


    在 SQL Server 数据工具中创建 SSRS 项目


    接下来，我们按照创建 SSRS 报表所需的步骤进行操作（图 9-14）。


    ![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig14_HTML.jpg](img/463840_1_En_9_Fig14_HTML.jpg)


    图 9-14


    使用数据工具创建 SSRS 项目


    然后必须创建一个查询，从 ggplot 表中获取绘图（图 9-15）。


    ![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig15_HTML.jpg](img/463840_1_En_9_Fig15_HTML.jpg)


    图 9-15


    在 SSRS 中从 SQL Server 表获取数据


    接下来，我们必须将图像插入到报表区域，并查看预览选项卡（图 9-16）以检查图表。


    ![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig16_HTML.jpg](img/463840_1_En_9_Fig16_HTML.jpg)


    图 9-16


    SSRS 中的箱线图


    ## 总结


    本章简要说明了如何在 SQL Server 2016 和 2017 中运行 R 脚本。它概述了如何通过外部脚本和存储过程运行必要的代码。此外，还讨论了如何使用
    RevoScaleR 和 Azure ML 等包来访问额外的机器学习和 R 服务。此外，通过一个示例解释了如何进行预测分析的过程。下一章将概述如何在 Azure
    Databricks 中进行机器学习。

    '
- fmt: '# 10. Azure Databricks


    `Databricks` is an analytics service based on the Apache Spark open source project.
    Apache Spark is a batch processing and real time processing environment. Apache
    Spark is quite popular among data scientists because of its ability to analyze
    huge amounts of data, its streaming capabilities, graph computation, machine learning,
    and interactive queries engine. Spark provides in-memory cluster computing. One
    of the popular tools for big data analytics on Spark is `Databricks`. `Databricks`
    has been used for ingesting a significant amount of data, cleaning data, applying
    machine learning, and so forth. In February 2018, there was an integration between
    Microsoft Azure and `Databricks` that provides a better collaboration between
    data engineers, data scientists, and data analytics. This integration provides
    data science and data engineering teams with a fast, easy, and collaborative Spark-based
    platform in Azure [[1](#463840_1_En_10_Chapter.xhtml#Par31)]. Azure `Databricks`
    is a new platform for big data analytics and machine learning. The notebook in
    Azure `Databricks` enables data engineers, data scientists, and business analysts
    to collaborate using a single tool. This chapter gives an overview of what Azure
    `Databricks` is, the environment it inhabits, and its use in data science.


    ## Databricks Environment


    To create Azure `Databricks` in an Azure environment, log in to one of your Azure
    accounts. From there, create an Azure `Databricks` module (Figure [10-1](#463840_1_En_10_Chapter.xhtml#Fig1)).


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig1_HTML.jpg](images/463840_1_En_10_Chapter/463840_1_En_10_Fig1_HTML.jpg)


    Figure 10-1


    Azure `Databricks` environment


    After creating the Azure `Databricks` module, Azure will navigate to a new page.
    To access Azure `Databricks`, click `Launch Workspace` (Figure [10-2](#463840_1_En_10_Chapter.xhtml#Fig2)).


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig2_HTML.jpg](images/463840_1_En_10_Chapter/463840_1_En_10_Fig2_HTML.jpg)


    Figure 10-2


    `Launch Workspace`


    As you can see in Figure [10-3](#463840_1_En_10_Chapter.xhtml#Fig3), the Azure
    `Databricks` environment has different components. The main components are `Workspace`
    and `Clusters`. The first step after launch is to create a cluster. Clusters in
    `Databricks` provide a unified platform for ETL (extract, transform, and load),
    stream analytics, and machine learning. Clusters are of two types: interactive
    and job. Notebook clusters are used to analyze data collaboratively. However,
    job clusters are used to run fast and robustly automated workloads, using APIs.
    Cluster pages may contain both cluster types. Each cluster can have different
    nodes. To start, you must create a cluster. Click the `Create Cluster` option
    (Figure [10-3](#463840_1_En_10_Chapter.xhtml#Fig3)).


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig3_HTML.jpg](images/463840_1_En_10_Chapter/463840_1_En_10_Fig3_HTML.jpg)


    Figure 10-3


    Creating clusters in `Databricks`


    On the `Create Cluster` page (Figure [10-4](#463840_1_En_10_Chapter.xhtml#Fig4)),
    enter the relevant information, such as cluster name, version (default), Python
    version, minimum and maximum workers, and so forth.


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig4_HTML.jpg](images/463840_1_En_10_Chapter/463840_1_En_10_Fig4_HTML.jpg)


    Figure 10-4


    `Create Cluster` page in Azure `Databricks`


    As you can see in Figure [10-4](#463840_1_En_10_Chapter.xhtml#Fig4), we have a
    driver node and a worker node. The worker node is for distributing your workload.
    The driver node is responsible for maintaining the `SparkContext`. It is possible
    to resize automatically and autoscale the size of the cluster. By enabling autoscale,
    the minimum and maximum number of workers can be limited during a cluster’s lifetime.


    To use Clusters, you should wait till `State` changes to `Running` (Figure [10-5](#463840_1_En_10_Chapter.xhtml#Fig5)).
    By creating an interactive cluster, you can create a notebook in which to write
    codes and from which to get results quickly.


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig5_HTML.jpg](images/463840_1_En_10_Chapter/463840_1_En_10_Fig5_HTML.jpg)


    Figure 10-5


    Running Clusters


    To create a notebook, click the `Workspace` option and create a new notebook (Figure
    [10-6](#463840_1_En_10_Chapter.xhtml#Fig6)).


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig6_HTML.jpg](images/463840_1_En_10_Chapter/463840_1_En_10_Fig6_HTML.jpg)


    Figure 10-6


    Creating a notebook in `Databricks`


    By creating a new notebook, you can specify which notebook belongs to which cluster
    and what the main language for the Notebook (Python, Scala, R, and SQL) is. In
    this example, the R language has been selected as the default. However, you can
    still write in the notebook in other languages, by writing: `%scala`, `%python`,
    `%sql`, or `%r` before the scripts (Figure [10-7](#463840_1_En_10_Chapter.xhtml#Fig7)).


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig7_HTML.jpg](images/463840_1_En_10_Chapter/463840_1_En_10_Fig7_HTML.jpg)


    Figure 10-7


    Creating an R notebook in `Databricks`'
