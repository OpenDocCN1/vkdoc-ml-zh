    # 8. 在 Power Query 中使用 R 进行描述性分析


    本章重点介绍 Power BI 中的描述性分析。首先简要说明如何利用描述性分析辅助决策。接着简要介绍聚类分析、如何在 Power BI 报表中执行聚类，以及如何在
    Power Query 编辑器中进行聚类。最后，我将介绍如何在 Power BI 中进行购物篮分析。


    ## K-Means 聚类


    聚类分析是将相似对象归入同一组或同一簇的任务。聚类后的对象彼此之间的相似度高于其他对象。例如，我们可能希望根据客户的购买行为或人口统计信息对客户进行分组 [1]。或者，举一个科学领域的例子，我们可能希望将过去十年新西兰发生的地震次数和震级进行聚类。出于医疗目的，我们可能希望根据实验室结果对癌症患者进行分类。


    在机器学习中，有许多不同的算法可以帮助我们进行聚类。其中一些算法是基于质心的，例如 k-means、GMM、模糊 c-means 等。其他算法则基于连通性
    [2]，例如层次聚类。还有一些算法是基于密度、概率、降维以及神经网络/深度学习的。


    在本章中，我将向您展示如何使用 k-means 算法对数据进行分类。有一个家庭用电数据集，可以从 UCI 机器学习库免费获取 [3]。该数据集记录了某个家庭在近四年时间内的电力消耗情况。该数据集包含日期、时间、全局有功功率、无功功率、平均电压、平均电流强度以及厨房、洗碗机、烤箱、热水器等设备的瓦时数等属性。您将看到如何使用
    Power BI 中的两种不同方法自然地对这些数据进行分类。


    ## 聚类自定义视觉对象


    第一种也是简单的聚类数据方法是使用 Power BI 商店中的自定义视觉对象：聚类。要访问它，您首先必须登录 Power BI 帐户。在“可视化”面板中，单击三个点，然后选择“从商店获取”选项。在“高级分析”下，您将找到用于自定义视觉对象的“聚类”选项（图
    8-1）。


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig1_HTML.jpg](img/463840_1_En_8_Fig1_HTML.jpg)


    图 8-1


    聚类自定义视觉对象


    将自定义视觉对象添加到 Power BI 环境。如果这是您第一次添加 Power BI 自定义视觉对象，则会安装一些包，例如 Plotly、XML 等。接下来，您必须从字段区域中选择四个不同的列。如图
    8-2 所示，已选择了一些列，例如电压、全局强度（家庭全局分钟平均电流强度）、子计量 3 和 1（厨房、洗碗机、热水器等设备的瓦时活动能量）。


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig2_HTML.jpg](img/463840_1_En_8_Fig2_HTML.jpg)


    图 8-2


    选择用于聚类的列


    选择参数后，您必须对其进行设置。单击格式图标，然后缩放数据以进行归一化。如果您想指定簇的数量，可以应用 PCA，或者保留默认设置（将自动选择簇）。


    如图 8-3 所示，聚类结果显示在聚类图中。K-means 聚类发现了大约四个主要簇。如图所示，簇 4 包含更多项目，而簇 1 包含的项目比其他簇少。然而，此可视化的局限性在于我们无法看到具体数字，也无法根据其属性比较每个簇。


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig3_HTML.jpg](img/463840_1_En_8_Fig3_HTML.jpg)


    图 8-3


    聚类参数和结果


    在下一节中，将展示在 Power Query 内部执行聚类分析的过程，以及如何使用 Power BI 可视化来展示结果。

    '
- fmt: '# Clustering in Power Query


    As explained in previous chapters, it is possible to do machine learning inside
    Power Query, using R code. In this section, the process of clustering data using
    R code inside Power Query will be explained, and you will see how we can use a
    Power BI visualization to better describe the data grouped by the relevant clusters.


    First, we must go to the Query Editor, then we have to duplicate the data set
    that we have, by right-clicking the data set and choosing the Duplicate option
    (shown in Figure [8-4](#463840_1_En_8_Chapter.xhtml#Fig4)).


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig4_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig4_HTML.jpg)


    Figure 8-4


    Duplicating the household power consumption data set


    After duplicating the data set, you will have a copy of the power consumption
    for household data that you must transform before applying the R code.


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig5_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig5_HTML.jpg)


    Figure 8-5


    Data cleaning


    1. Remove the date and time columns. Click each column, then right-click and select
    Remove.

    2. Remove errors. You may have some errors, so you will have to set a rule for
    dealing with them, e.g., click the Remove rows and choose Remove Errors or Remove
    Blank Rows or Remove Missing Values (Figure [8-5](#463840_1_En_8_Chapter.xhtml#Fig5)).


    After data cleaning, you can run R scripts by clicking the Transform tab and selecting
    the Run R Script option. In R editor, first we must bring data in the same scale,
    using the normalization function in R, as follows:


    ```

    normalize <- function(x) {

    return ((x - min(x)) / (max(x) - min(x))) }

    NormalizedData <- as.data.frame(lapply(dataset, normalize))

    ```


    The function `kmeans` clusters data using k-means clustering algorithms. This
    algorithm requires a data set and the number of clusters.


    ```

    ClusterData<-kmeans(NormalizedData ,4)

    ```


    After clustering the data, we must create an output data set. For this, we leverage
    the `data.frame` function, to create a data frame data set from the original data
    set and the number of clusters.


    ```

    PowerConsumption<-data.frame(dataset,ClusterData$cluster)

    ```


    After running the code, the data set now has original data, plus a new column
    that shows the cluster number. Moreover, we must add an index column to the current
    data set, to have a primary key for further analysis. To add a new column, click
    the Add Column tab in the top menu, then click Index Column, which starts from
    0 by default, but you can change it to 1, by choosing another option.


    As you can see in Figure [8-6](#463840_1_En_8_Chapter.xhtml#Fig6), our data has
    now been prepared for visualization and further analysis. You now simply close
    and apply the changes.


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig6_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig6_HTML.jpg)


    Figure 8-6


    Clustering data in Power Query


    In the Visualizations panel, we are going to use some simple visualization to
    compare the clusters (Figure [8-7](#463840_1_En_8_Chapter.xhtml#Fig7)). The first
    chart shows the number of items in each cluster. We can see how many items each
    cluster has.


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig7_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig7_HTML.jpg)


    Figure 8-7


    Number of items in each cluster


    Also, you can use the Funnel chart option, to show the average of an attribute
    for a cluster (Figure [8-8](#463840_1_En_8_Chapter.xhtml#Fig8)).


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig8_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig8_HTML.jpg)


    Figure 8-8


    Cluster comparison data


    It is also possible to do a what-if analysis. For example, if the voltage changes
    from 244 to 254, we can check what clusters mainly have that range and which other
    attributes have that subset in common. As you can see in Figure [8-9](#463840_1_En_8_Chapter.xhtml#Fig9),
    clusters 2 and 3 mainly cover the 244 to 254 voltage range.


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig9_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig9_HTML.jpg)


    Figure 8-9


    What-if analysis of clustering results


    ## Market Basket Analysis (Association Rules)


    Another approach for descriptive analysis and data mining is market basket analysis,
    or association rules. Market Basket (association rules) analysis is used to find
    customer purchasing behavior by stores, to determine the related items that have
    been purchased together. This approach is not only used for optimizing product
    placement and marketing investments but also for determining rules in health care,
    government policies, events management, and so forth [[5](#463840_1_En_8_Chapter.xhtml#Par50)].


    In this section, I will explain how market basket analysis can be used, how to
    write it in R, and how to come up with good rules.'
