  trans: '

    下一步是清洗数据。如图 12-7 所示，对于*泰坦尼克号*上乘客的年龄数据，有 177 行存在缺失值。创建模型前的主要工作之一就是移除或替换这些缺失值。有一个名为“清理缺失数据”的模块可以完成此操作。搜索该模块，将其拖放到实验区域。如图
    12-8 所示，该模块有一个输入端口和两个输出端口。将泰坦尼克号数据集的输出连接到缺失值模块的输入。然后，通过点击缺失值模块，指定您希望如何解决缺失值问题。该模块有一个属性页面，您可以在其中选择要移除缺失值的列。接着指定清理模式，例如用平均值、中位数或自定义值进行替换。也可以选择移除整个缺失数据行，或使用
    PCA 算法[2]进行替换。如图 12-8 所示，已选择了“年龄”列，清理模式设置为“移除整行”。


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig8_HTML.jpg](img/463840_1_En_12_Fig8_HTML.jpg)


    图 12-8


    *从数据中移除缺失值*


    另一个我们应该执行的数据转换是移除对“幸存”列没有影响的列，例如乘客 ID、姓名等。我们运行机器学习所需的列只有年龄、性别、船舱等级和幸存。数据集中还有另一个名为“选择列”的模块。将此模块拖放到实验中，然后将“清理缺失数据”的第一个输出连接到“选择列”的输入。接着，在属性面板中，选择所需的列（图
    12-9）。至此，该数据集的主要数据清洗和整理工作已完成。下一步是选择相关算法。


    此处机器学习的主要目的是预测一位新乘客是否幸存。根据第 4 章的讨论，我们预测的是一个类别，而非连续值。使用分类方法进行预测分析可以解决这个问题。在 Azure
    ML 中，大约有 25 种主要算法，被分为四大场景：异常检测、分类、聚类和回归*。* 针对我们的场景，必须使用分类算法。展开分类算法列表，可以看到根据要预测的类别数量进行了进一步分组。如果是二分类问题，则必须使用带有“二类”标识的算法。该问题正是预测人员幸存与否的情况。


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig9_HTML.jpg](img/463840_1_En_12_Fig9_HTML.jpg)


    图 12-9


    在数据集中选择列


    如图 12-10 所示，在“分类”下，我们有九种不同的算法可用于预测幸存或未幸存者。每种算法都可用于不同的场景和不同的数据类型。微软提供了一份用于选择最佳算法的速查表[3]。对于*泰坦尼克号*问题，我们的列数不超过
    100 列，数据是非线性的，并且需要高精度和快速训练。因此，我选择了“二类提升决策树”算法。不过，最佳实践是选择不同的算法，然后比较它们的准确率。


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig10_HTML.jpg](img/463840_1_En_12_Fig10_HTML.jpg)


    图 12-10


    Azure ML 中的机器学习算法


    按照第 4 章介绍的机器学习生命周期，我们必须拆分数据，一部分用于训练，其余部分用于测试。在 Azure ML 中，有三个不同的模块用于拆分数据、训练模型和测试模型：拆分数据、训练模型和评分模型。首先，我拖放“拆分数据”模块（图
    12-11）。“拆分数据”允许我们指定多少数据用于训练，多少用于测试。如图 12-11 所示，“拆分数据”已连接到“选择列”模块的输出。拆分比例设置为 0.7（30%用于测试，70%用于训练）。其中一个输出节点用于训练，另一个用于测试。


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig11_HTML.jpg](img/463840_1_En_12_Fig11_HTML.jpg)


    图 12-11


    用于机器学习目的的拆分数据


    我们必须将用于训练和测试的相关模块拖放到实验中。如图 12-12 所示，拆分模块的右侧输出已连接到“训练模型”，而“拆分数据”的另一个输出已连接到“评分模型”。此外，在“训练模型”属性下，已选择了“幸存”列。


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig12_HTML.jpg](img/463840_1_En_12_Fig12_HTML.jpg)


    图 12-12


    将训练模型和评分模型拖放到实验中


    现在我们可以运行代码，查看评分模型输出的预测结果。要运行它，请点击页面底部的“运行”按钮。运行实验后，我们将能够在评分模型模块的输出中看到测试数据预测的结果。右键单击输出并可视化数据（图
    12-13）。


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig13_HTML.jpg](img/463840_1_En_12_Fig13_HTML.jpg)


    图 12-13


    *泰坦尼克号*示例的预测结果


    可以使用“评估模型”来评估模型，以检查所创建模型的准确率。下一节将解释创建应用程序编程接口（API）的过程。

    '
- fmt: '# Creating a Web Service


    The next step after evaluating the model is optionally to create an API so everyone
    is able to use the model by providing the data. To create the web service, you
    must run the experiment first, then click `Setup Web Service` (`Predictive Web
    Service` recommended). An input and output link for web services has been created,
    as you can see in Figure [12-14](#463840_1_En_12_Chapter.xhtml#Fig14).


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig14_HTML.png](images/463840_1_En_12_Chapter/463840_1_En_12_Fig14_HTML.png)


    Figure 12-14


    Creating a web service from a machine learning model


    Run the experiment again, then click `Deploy Web Service` at the bottom of the
    page. By deploying the web service, a new page will be shown. On this page, you
    can see details of the API, both for single processing and batch processing of
    data.


    As you can see in Figure [12-15](#463840_1_En_12_Chapter.xhtml#Fig15), there is
    an API key that you can share to allow others to use the ML model. Moreover, for
    API URLs, there are two main ways to use the API: a request and response approach
    and batch processing.


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig15_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig15_HTML.jpg)


    Figure 12-15


    Creating a web service for the Titanic problem


    Click the `Batch Execution` option and navigate to the new page that contains
    the API information (Figure [12-16](#463840_1_En_12_Chapter.xhtml#Fig16)). As
    you can see in the figure, the web service URL is shown for request information.


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig16_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig16_HTML.jpg)


    Figure 12-16


    Web service information page


    In addition, it is possible to embed the created model in other applications,
    such as web applications, reports, and so forth, leveraging any language, such
    as `C#`, `Python`, and `R`. On the web service information page, go to the `Sample
    Code` section. As you can see in Figure [12-17](#463840_1_En_12_Chapter.xhtml#Fig17),
    there are sample codes in `C#`, `Python`, and `R` that enable users to embed the
    code into applications. However, you must change the input and output of the web
    service, so end users are able to provide proper information and get the related
    prediction. For example, in the web service created in Figure [12-15](#463840_1_En_12_Chapter.xhtml#Fig15),
    the input for the service also gets the passenger ID, name, and other irrelevant
    data from users that we must refine in order to receive such information as age,
    gender, and passenger class. In another example, regarding output, a user may
    only be interested in obtaining the prediction and the probability, not all the
    other input columns.


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig17_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig17_HTML.jpg)


    Figure 12-17


    Web service sample code


    In the next step, I am going to refine the web service input and output, by adding
    `Select Columns in Dataset` modules for output, and change the select column for
    web service input (Figure [12-18](#463840_1_En_12_Chapter.xhtml#Fig18)).


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig18_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig18_HTML.jpg)


    Figure 12-18


    Change input and output for web service


    As you can see in Figure [12-18](#463840_1_En_12_Chapter.xhtml#Fig18), for the
    web service input, we disconnect the link and connect it to the input of the `Score
    Model`, and in the `Select Column in Dataset` module (Figure [12-18](#463840_1_En_12_Chapter.xhtml#Fig18),
    3), only age, gender, and passenger class have been selected. Similarly, for the
    web service output, the `Select Columns in Dataset` module has been dragged and
    dropped to select only the `Scored Label` and `Scored Probability`. Next, we connect
    the web service output to the `Select Columns in Dataset` modules. Finally, we
    run the experiment and deploy it again. There is a message about overwriting the
    web service, which we must confirm. After deploying again, on the web service
    page, click the `Test` button (Figure [12-19](#463840_1_En_12_Chapter.xhtml#Fig19),
    1). After, we can test the API.


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig19_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig19_HTML.jpg)


    Figure 12-19


    Testing the web service


    As you can see in Figure [12-19](#463840_1_En_12_Chapter.xhtml#Fig19), by entering
    three inputs, Age, Gender (Sex), and Passenger Class (Pclass), into API, the result
    of the machine learning will be shown for this specific row at the bottom of the
    page (Figure [12-20](#463840_1_En_12_Chapter.xhtml#Fig20), 1).


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig20_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig20_HTML.jpg)


    Figure 12-20


    Result of the API and call to Excel


    The next step allows us to analyze the API in Excel. We just have to navigate
    to `Apps` (Figure [12-20](#463840_1_En_12_Chapter.xhtml#Fig20)) and click `Excel
    2013 or Later` (Figure [12-20](#463840_1_En_12_Chapter.xhtml#Fig20), 2). After
    clicking the Excel icon, a message to `Download the Sample Data` appears. Save
    the Excel file and open it, then enable the Excel (Figure [12-21](#463840_1_En_12_Chapter.xhtml#Fig21)).


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig21_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig21_HTML.jpg)


    Figure 12-21


    Enabling the Azure ML API in Excel


    Next, a new window will appear. Use the sample data (Figure [12-22](#463840_1_En_12_Chapter.xhtml#Fig22),
    1), then, under the `Input` field, choose the input data range (Figure [12-22](#463840_1_En_12_Chapter.xhtml#Fig22),
    2). Then, under the `Output` field, write the output cell number (Figure [12-22](#463840_1_En_12_Chapter.xhtml#Fig22),
    3). Then click the `Predict` option.


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig22_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig22_HTML.jpg)


    Figure 12-22


    Enabling the Azure ML API in Excel


    By running the code and choosing the `Auto Predict` option, the result of the
    prediction will be shown in output cells (Figure [12-23](#463840_1_En_12_Chapter.xhtml#Fig23)).


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig23_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig23_HTML.jpg)


    Figure 12-23


    API call in Excel


    It is possible to add more input rows for more predictions.'
  raw: '## Creating a Web Service


    The next step after evaluating the model is optionally to create an API so everyone
    is able to use the model by providing the data. To create the web service, you
    must run the experiment first, then click Setup Web Service (Predictive Web Service
    recommended). An input and output link for web services has been created, as you
    can see in Figure [12-14](#463840_1_En_12_Chapter.xhtml#Fig14).


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig14_HTML.png](images/463840_1_En_12_Chapter/463840_1_En_12_Fig14_HTML.png)


    Figure 12-14


    Creating a web service from a machine learning model


    Run the experiment again, then click Deploy Web Service at the bottom of the page*.*
    By deploying the web service, a new page will be shown. On this page, you can
    see details of the API, both for single processing and batch processing of data.


    As you can see in Figure [12-15](#463840_1_En_12_Chapter.xhtml#Fig15), there is
    an API key that you can share to allow others to use the ML model. Moreover, for
    API URLs, there are two main ways to use the API: a request and response approach
    and batch processing.


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig15_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig15_HTML.jpg)


    Figure 12-15


    *Creating a web service for the* Titanic *problem*


    Click the Batch Execution option and navigate to the new page that contains the
    API information (Figure [12-16](#463840_1_En_12_Chapter.xhtml#Fig16)). As you
    can see in the figure, the web service URL is shown for request information.


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig16_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig16_HTML.jpg)


    Figure 12-16


    Web service information page


    In addition, it is possible to embed the created model in other applications,
    such as web applications, reports, and so forth, leveraging any language, such
    as C#, Python, and R. On the web service information page, go to the Sample Code
    section. As you can see in Figure [12-17](#463840_1_En_12_Chapter.xhtml#Fig17),
    there are sample codes in C#, Python, and R that enable users to embed the code
    into applications. However, you must change the input and output of the web service,
    so end users are able to provide proper information and get the related prediction.
    For example, in the web service created in Figure [12-15](#463840_1_En_12_Chapter.xhtml#Fig15),
    the input for the service also gets the passenger ID, name, and other irrelevant
    data from users that we must refine in order to receive such information as age,
    gender, and passenger class. In another example, regarding output, a user may
    only be interested in obtaining the prediction and the probability, not all the
    other input columns.


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig17_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig17_HTML.jpg)


    Figure 12-17


    Web service sample code


    In the next step, I am going to refine the web service input and output, by adding
    Select Columns in Dataset modules for output, and change the select column for
    web service input (Figure [12-18](#463840_1_En_12_Chapter.xhtml#Fig18)).


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig18_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig18_HTML.jpg)


    Figure 12-18


    Change input and output for web service


    As you can see in Figure [12-18](#463840_1_En_12_Chapter.xhtml#Fig18), for the
    web service input, we disconnect the link and connect it to the input of the Score
    Model, and in the Select Column in Dataset module (Figure [12-18](#463840_1_En_12_Chapter.xhtml#Fig18),
    3), only age, gender, and passenger class have been selected. Similarly, for the
    web service output, the Select Columns in Dataset module has been dragged and
    dropped to select only the Scored Label and Scored Probability. Next, we connect
    the web service output to the Select Columns in Dataset modules. Finally, we run
    the experiment and deploy it again. There is a message about overwriting the web
    service, which we must confirm. After deploying again, on the web service page,
    click the Test button (Figure [12-19](#463840_1_En_12_Chapter.xhtml#Fig19), 1).
    After, we can test the API.


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig19_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig19_HTML.jpg)


    Figure 12-19


    Testing the web service


    As you can see in Figure [12-19](#463840_1_En_12_Chapter.xhtml#Fig19), by entering
    three inputs, Age, Gender(Sex), and Passenger Class (Pclass), into API, the result
    of the machine learning will be shown for this specific row at the bottom of the
    page (Figure [12-20](#463840_1_En_12_Chapter.xhtml#Fig20), 1)*.*


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig20_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig20_HTML.jpg)


    Figure 12-20


    Result of the API and call to Excel


    The next step allows us to analyze the API in Excel. We just have to navigate
    to Apps (Figure [12-20](#463840_1_En_12_Chapter.xhtml#Fig20)) and click Excel
    2013 or Later (Figure [12-20](#463840_1_En_12_Chapter.xhtml#Fig20), 2)*.* After
    clicking the Excel icon, a message to Download the Sample Data appears*.* Save
    the Excel file and open it, then enable the Excel (Figure [12-21](#463840_1_En_12_Chapter.xhtml#Fig21)).


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig21_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig21_HTML.jpg)


    Figure 12-21


    Enabling the Azure ML API in Excel


    Next, a new window will appear. Use the sample data (Figure [12-22](#463840_1_En_12_Chapter.xhtml#Fig22),
    1), then, under the Input field, choose the input data range (Figure [12-22](#463840_1_En_12_Chapter.xhtml#Fig22),
    2). Then, under the Output field, write the output cell number (Figure [12-22](#463840_1_En_12_Chapter.xhtml#Fig22),
    3). Then click the Predict option.


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig22_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig22_HTML.jpg)


    Figure 12-22


    Enabling the Azure ML API in Excel


    By running the code and choosing the Auto Predict option, the result of the prediction
    will be shown in output cells (Figure [12-23](#463840_1_En_12_Chapter.xhtml#Fig23)).


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig23_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig23_HTML.jpg)


    Figure 12-23


    API call in Excel


    It is possible to add more input rows for more predictions.'
  trans: '

    ## 创建 Web 服务


    评估模型后的下一步是可选的：创建一个 API，以便每个人都能通过提供数据来使用该模型。要创建 Web 服务，您必须先运行实验，然后点击“设置 Web 服务”（建议使用预测
    Web 服务）。如图 12-14 所示，已为 Web 服务创建了输入和输出链接。


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig14_HTML.png](img/463840_1_En_12_Fig14_HTML.png)


    图 12-14


    从机器学习模型创建 Web 服务


    再次运行实验，然后点击页面底部的“部署 Web 服务”*。*部署 Web 服务后，将显示一个新页面。在此页面上，您可以查看 API 的详细信息，包括用于单次处理和批量处理数据的
    API。


    如图 12-15 所示，有一个 API 密钥，您可以共享该密钥以允许其他人使用 ML 模型。此外，对于 API URL，主要有两种使用 API 的方式：请求-响应方法和批量处理方法。


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig15_HTML.jpg](img/463840_1_En_12_Fig15_HTML.jpg)


    图 12-15


    *为*泰坦尼克号*问题创建 Web 服务*


    点击“批量执行”选项，导航至包含 API 信息的新页面（图 12-16）。如图所示，页面显示了用于请求信息的 Web 服务 URL。


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig16_HTML.jpg](img/463840_1_En_12_Fig16_HTML.jpg)


    图 12-16


    Web 服务信息页面


    此外，还可以将创建的模型嵌入到其他应用程序中，例如 Web 应用程序、报表等，并利用任何语言（如 C#、Python 和 R）。在 Web 服务信息页面上，转到“示例代码”部分。如图
    12-17 所示，其中有 C#、Python 和 R 的示例代码，使用户能够将代码嵌入到应用程序中。但是，您必须更改 Web 服务的输入和输出，以便最终用户能够提供正确的信息并获得相关的预测。例如，在图
    12-15 创建的 Web 服务中，服务的输入也获取了用户的乘客 ID、姓名和其他无关数据，我们必须对这些数据进行精炼，以便只接收诸如年龄、性别和乘客等级等信息。再举一个关于输出的例子，用户可能只对获取预测结果和概率感兴趣，而不需要所有其他输入列。


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig17_HTML.jpg](img/463840_1_En_12_Fig17_HTML.jpg)


    图 12-17


    Web 服务示例代码


    下一步，我将通过为输出添加“数据集中的选择列”模块，并更改 Web 服务输入的选定列，来精炼 Web 服务的输入和输出（图 12-18）。


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig18_HTML.jpg](img/463840_1_En_12_Fig18_HTML.jpg)


    图 12-18


    更改 Web 服务的输入和输出


    如图 12-18 所示，对于 Web 服务输入，我们断开链接并将其连接到“评分模型”的输入，并且在“数据集中的选择列”模块中（图 12-18，3），仅选择了年龄、性别和乘客等级。类似地，对于
    Web 服务输出，拖放“数据集中的选择列”模块以仅选择“评分标签”和“评分概率”。接下来，我们将 Web 服务输出连接到“数据集中的选择列”模块。最后，我们运行实验并再次部署。会出现一条关于覆盖
    Web 服务的消息，我们需要确认。再次部署后，在 Web 服务页面上，点击“测试”按钮（图 12-19，1）。之后，我们就可以测试 API 了。


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig19_HTML.jpg](img/463840_1_En_12_Fig19_HTML.jpg)


    图 12-19


    测试 Web 服务


    如图 12-19 所示，通过向 API 输入三个参数：年龄、性别和乘客等级，该特定行的机器学习结果将显示在页面底部（图 12-20，1）*。*


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig20_HTML.jpg](img/463840_1_En_12_Fig20_HTML.jpg)


    图 12-20


    API 结果及对 Excel 的调用


    下一步允许我们在 Excel 中分析 API。我们只需导航到“应用”（图 12-20）并点击“Excel 2013 或更高版本”（图 12-20，2）*。*点击
    Excel 图标后，会出现一条“下载示例数据”的消息*。*保存 Excel 文件并打开它，然后启用 Excel（图 12-21）。


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig21_HTML.jpg](img/463840_1_En_12_Fig21_HTML.jpg)


    图 12-21


    在 Excel 中启用 Azure ML API


    接下来，将出现一个新窗口。使用示例数据（图 12-22，1），然后在“输入”字段下，选择输入数据范围（图 12-22，2）。然后，在“输出”字段下，写入输出单元格编号（图
    12-22，3）。然后点击“预测”选项。


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig22_HTML.jpg](img/463840_1_En_12_Fig22_HTML.jpg)


    图 12-22


    在 Excel 中启用 Azure ML API


    通过运行代码并选择“自动预测”选项，预测结果将显示在输出单元格中（图 12-23）。


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig23_HTML.jpg](img/463840_1_En_12_Fig23_HTML.jpg)


    图 12-23


    在 Excel 中调用 API


    可以添加更多输入行以进行更多预测。

