    # 第一部分 入门


    # 1. 机器学习简介


    机器学习使决策者能够从其数据中获得更深入的洞察。如今，机器学习的应用已不再局限于研究和特定行业。在大多数领域，都存在利用机器学习从现有数据中获取更简洁、更深入信息的宝贵机会。因此，大多数大型软件公司都为其用户提供了通过易用软件访问机器学习的机会。例如，作为商业软件开发先驱的微软，在开发必应搜索引擎、Xbox、Kinect
    等产品时都利用了机器学习。机器学习在微软的应用并不仅限于新软件的开发。在微软的许多软件开发工具中，例如 Microsoft SQL Server、Power
    BI 和 .NET，都有机会利用机器学习来创建更智能的应用程序和报告。


    在本章中，你将学习机器学习的核心概念和方法，回顾机器学习的类型，并逐步了解机器学习的生命周期。此外，你还将了解微软产品中可用的、非常有用的机器学习工具。


    ## 机器学习概念


    机器学习是人工智能的一个子集。Ian Goodfellow 及其同事 [1] 介绍了一个图表，展示了人工智能的不同方法。如图 1-1 所示，机器学习是人工智能的几种方法之一。


    ![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig1_HTML.jpg](img/463840_1_En_1_Fig1_HTML.jpg)


    图 1-1


    展示人工智能类别及子类别的维恩图 [1]


    学者和作者们对机器学习提出了不同的定义。例如，Sebastian Raschka 将机器学习定义为使用算法理解数据的工具 [2]。他提到，我们会遇到大量的结构化数据（数字）和非结构化数据（图像、语音文本等）。从这些数据中获取洞察会影响决策过程，并帮助管理者更好地理解发生了什么、为什么发生、未来会发生什么以及如何使其发生。


    机器学习的概念基于从当前数据集中发现共同模式。历史上，我们创建报告和软件来理解过去发生的事情。分析近期事件和数据总是有助于我们进行进一步的分析，例如寻找关键绩效指标等。调查过去发生的事情相对直接，并能为我们提供一些价值（图
    1-2）。下一步，我们希望变得更加敏捷以应对变化，因此分析实时数据至关重要。分析近期数据显然比分析历史数据能提供更多洞察。这个过程比之前的方法稍微困难一些，但能为组织带来更多价值。


    ![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig2_HTML.png](img/463840_1_En_1_Fig2_HTML.png)


    图 1-2


    从过去到未来，各种分析的价值与难度


    第三步是根本原因分析，这是一种侧重于因果关系的调查研究。例如，分析某个特定分支销售额下降的主要原因，可以为业务所有者提供大量价值。


    从数据中获取更好价值的进一步步骤是分析未来会发生什么，即*预测分析*。了解未来会发生什么，或洞察数据模式，将帮助决策者实施更明智的公司政策。“将会发生什么”的分析比之前的步骤需要更多的努力和时间。然而，这是企业获取更有价值、更具可操作信息的机遇。


    最后一步是“如何使其发生”。这种*规范性分析*在预测未来后推荐应采取的措施。这个过程为任何组织带来了更多洞察，但与其他阶段相比，实施起来更具挑战性。


    ## 机器学习方法


    机器学习主要有两种方法：


    *   监督学习


    *   无监督学习


    以下段落将对每种方法进行简要说明。在第 5 章中，我将更详细地介绍这些方法，并提供两者的示例。


    '
- fmt: "# Supervised Learning\n\nThe primary goal of supervised learning is to learn\
    \ how to predict a group or value from past data. By another definition, supervised\
    \ learning is the machine learning task of inferring a function from labeled training\
    \ data [[2](#463840_1_En_1_Chapter.xhtml#Par48)].\n\nThere are different approaches\
    \ to supervised learning. One is to predict a value, for example, predicting the\
    \ number of subscribers to a video channel, which could range from one to millions\
    \ of individuals. Supervised learning makes it possibile to predict how many people\
    \ will subscribe to this channel. Another example is predicting sales for a forthcoming\
    \ year that could range from $1,000 to $200,000. By this approach, an algorithm\
    \ predicts the number of sales for the company. We call this method a *regression\
    \ approach*, in which the outcome is a continuous value.\n\nThe other approach\
    \ to supervised learning involves predicting a group, for example, predicting\
    \ whether a customer will stay with a company or leave it. In this example, the\
    \ goal is to predict whether a current customer will remain with a group. Another\
    \ case could consider a company that provides different tiers of customers, such\
    \ as gold, silver, and bronze. In this case, the supervised learning approach\
    \ might predict whether a new customer will belong to the gold, silver, or bronze\
    \ group. In this type of supervised learning, the prediction column should be\
    \ a *discrete class label*.\n\n# Unsupervised Learning\n\nIn supervised learning,\
    \ we already have an idea of the answer before creating and training the model.\
    \ In unsupervised learning, we do not predict a column, and we do not attach any\
    \ label to the data. The main goal of unsupervised learning is to find the natural\
    \ data pattern, to explore the data and extract its meaningful information.\n\n\
    # Machine Learning Life Cycle\n\nThe machine learning life cycle consists of four\
    \ main steps:\n\n1. Business understanding\n2. Data acquisition and understanding\n\
    \   1. Data collection\n   2. Feature selection\n   3. Data wrangling\n3. Modeling\n\
    \   1. Model selection\n   2. Split data set\n   3. Train model\n4. Deployment\n\
    \   1. Evaluating the model\n   2. Monitoring model\n\nMicrosoft has proposed\
    \ a Team Data Science Process (TDSP) that illustrates these phases (Figure [1-3](#463840_1_En_1_Chapter.xhtml#Fig3)).\n\
    \n![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig3_HTML.jpg](images/463840_1_En_1_Chapter/463840_1_En_1_Fig3_HTML.jpg)\n\
    \nFigure 1-3\n\nThe Team Data Science Process life cycle proposed by Microsoft\
    \ [[3](#463840_1_En_1_Chapter.xhtml#Par49)]\n\nStep 1 is to understand the business\
    \ problem. People who know their business are the best resources for identifying\
    \ the company needs and issues that machine learning is able to solve. However,\
    \ not all issues can be addressed by machine learning! In addition, use cases\
    \ for machine learning should be prioritized in collaboration with business stakeholders\
    \ and data scientists and engineers, so that you start with solutions that are\
    \ valuable, affordable, and have a high probability of being successful.\n\nStep\
    \ 2 is to ingest data, which involves collecting required data from different\
    \ resources and exploring and cleaning it. Finding relevant data columns to a\
    \ problem, mainly for supervised learning, helps to create more accurate algorithms.\
    \ Furthermore, for each algorithm, specific data transformation must be complete\
    \ before the modeling stage.\n\nStep 3 is modeling, which consists of model selection.\
    \ This is done by analyzing the nature of a problem and data. Most data should\
    \ be allocated for model creation (training), with a small percentage left for\
    \ testing and evaluating the model. As you can see in Figure [1-3](#463840_1_En_1_Chapter.xhtml#Fig3),\
    \ the machine learning process is iterative. For example, after creating a model,\
    \ there is a possibility that it might not be accurate. In this case, we would\
    \ have to recheck the previous steps, such as business understanding or data acquisition.\n\
    \n# Machine Learning Languages and Platforms\n\nIn order to create a machine learning\
    \ model, you must be familiar with at least one language that facilitates machine\
    \ learning. However, there are some tools, such as Microsoft Azure Machine Learning,\
    \ that provide a drag-and-drop environment.\n\nThere are many different languages\
    \ for doing machine learning, including `Python`, `Java`, `R`, `C++`, `C`, `JavaScript`,\
    \ and so forth. However, among all these languages, `Python` and `R` are the most\
    \ widely used, with a focus on creating models and the machine learning process.\n\
    \nThere are also many different tools for doing machine learning. In this book,\
    \ we will look specifically at the Microsoft tools that can help us perform machine\
    \ learning, as well as how to use different Microsoft technologies to implement\
    \ certain machine learning processes.\n\nMicrosoft has integrated machine learning\
    \ in some of its tools, such as `Bing` search or `Xbox`, for many years now. In\
    \ 2004, it embedded the data-mining tools in `SQL Server`. These tools helped\
    \ `SQL` and business intelligence (BI) developers to leverage machine learning,\
    \ to create more insightful reports.\n\n`SQL Server` allows users to quickly produce\
    \ mining models, using the current data in cubes. The main advantage of using\
    \ data mining tools in `SQL Server` is that they are easy to deploy, have a great\
    \ interface, and are user-friendly. However, there are some disadvantages. For\
    \ example, there is no way to create custom code using `R` or `Python`, and only\
    \ a limited number of algorithms are available.\n\nSubsequently, Microsoft announced\
    \ a cloud-based machine learning platform, `Azure Machine Learning` (AML), in\
    \ 2014. This platform provides a smooth drag-and-drop environment and does not\
    \ require any software to make it work. `Azure Machine Learning` supports `R`\
    \ and `Python` and offers more than 25 algorithms specific to machine learning\
    \ (Figure [1-4](#463840_1_En_1_Chapter.xhtml#Fig4)). You’ll learn more about those\
    \ in Chapter [12](#463840_1_En_12_Chapter.xhtml).\n\n![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig4_HTML.jpg](images/463840_1_En_1_Chapter/463840_1_En_1_Fig4_HTML.jpg)\n\
    \nFigure 1-4\n\nThe Azure Machine Learning environment is easy to use and flexible\n\
    \nIn addition to `Azure Machine Learning`, Microsoft provides the ability to embed\
    \ the `R` or `Python` code in some of its other tools, such as `Power BI`, a self-service\
    \ BI tool that is widely used for BI practices. In 2015, Microsoft began to offer\
    \ new possibilities for machine learning in `Power BI`, for example, a custom\
    \ visual in the reporting section that helps developers to write `R` code with\
    \ the goals of visualization and machine learning. You will learn more about it\
    \ in Chapter [4](#463840_1_En_4_Chapter.xhtml).\n\nAnother critical component\
    \ of Microsoft `Power BI` is `Power Query`. `Power Query` helps developers to\
    \ source data from different resources and offers many features for cleaning data.\
    \ In 2016, Microsoft introduced the option of writing `R` code inside `Power Query`\
    \ for machine learning. There is a difference between writing code in `Power BI`\
    \ reporting and `Power Query`. In the former, you can create visuals (Figure [1-5](#463840_1_En_1_Chapter.xhtml#Fig5)),\
    \ but not in the latter. Moreover, the code in the `R` visual runs every time\
    \ the filter context changes or page opens, whereas the `R` scripts in `Power\
    \ Query` Editor run only on refresh, unless there is a direct query connection.\
    \ You will learn how to perform machine learning inside `Power Query` with `R`\
    \ in Chapters [6](#463840_1_En_6_Chapter.xhtml), [7](#463840_1_En_7_Chapter.xhtml),\
    \ and [8](#463840_1_En_8_Chapter.xhtml).\n\n![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig5_HTML.jpg](images/463840_1_En_1_Chapter/463840_1_En_1_Fig5_HTML.jpg)\n\
    \nFigure 1-5\n\nR visual for machine learning in Power BI report"
  raw: "### Supervised Learning\n\nThe primary goal of supervised learning is to learn\
    \ how to predict a group or value from past data. By another definition, supervised\
    \ learning is the machine learning task of inferring a function from labeled training\
    \ data [[2](#463840_1_En_1_Chapter.xhtml#Par48)].\n\nThere are different approaches\
    \ to supervised learning. One is to predict a value, for example, predicting the\
    \ number of subscribers to a video channel, which could range from one to millions\
    \ of individuals. Supervised learning makes it possibile to predict how many people\
    \ will subscribe to this channel. Another example is predicting sales for a forthcoming\
    \ year that could range from $1,000 to $200,000\\. By this approach, an algorithm\
    \ predicts the number of sales for the company. We call this method a *regression\
    \ approach* , in which the outcome is a continuous value.\n\nThe other approach\
    \ to supervised learning involves predicting a group, for example, predicting\
    \ whether a customer will stay with a company or leave it. In this example, the\
    \ goal is to predict whether a current customer will remain with a group. Another\
    \ case could consider a company that provides different tiers of customers, such\
    \ as gold, silver, and bronze. In this case, the supervised learning approach\
    \ might predict whether a new customer will belong to the gold, silver, or bronze\
    \ group. In this type of supervised learning, the prediction column should be\
    \ a *discrete class label* .\n\n### Unsupervised Learning\n\nIn supervised learning,\
    \ we already have an idea of the answer before creating and training the model.\
    \ In unsupervised learning, we do not predict a column, and we do not attach any\
    \ label to the data. The main goal of unsupervised learning is to find the natural\
    \ data pattern, to explore the data and extract its meaningful information.\n\n\
    ## Machine Learning Life Cycle\n\nThe machine learning life cycle consists of\
    \ four main steps:\n\n1.  Business understanding\n\n2.  Data acquisition and understanding\n\
    \    1.  Data collection\n\n    2.  Feature selection\n\n    3.  Data wrangling\n\
    \n3.  Modeling\n    1.  Model selection\n\n    2.  Split data set\n\n    3.  Train\
    \ model\n\n4.  Deployment\n    1.  Evaluating the model\n\n    2.  Monitoring\
    \ model\n\nMicrosoft has proposed a Team Data Science Process (TDSP) that illustrates\
    \ these phases (Figure [1-3](#463840_1_En_1_Chapter.xhtml#Fig3)).\n\n![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig3_HTML.jpg](images/463840_1_En_1_Chapter/463840_1_En_1_Fig3_HTML.jpg)\n\
    \nFigure 1-3\n\nThe Team Data Science Process life cycle proposed by Microsoft\
    \ [[3](#463840_1_En_1_Chapter.xhtml#Par49)]\n\nStep 1 is to understand the business\
    \ problem. People who know their business are the best resources for identifying\
    \ the company needs and issues that machine learning is able to solve. However,\
    \ not all issues can be addressed by machine learning! In addition, use cases\
    \ for machine learning should be prioritized in collaboration with business stakeholders\
    \ and data scientists and engineers, so that you start with solutions that are\
    \ valuable, affordable, and have a high probability of being successful.\n\nStep\
    \ 2 is to ingest data, which involves collecting required data from different\
    \ resources and exploring and cleaning it. Finding relevant data columns to a\
    \ problem, mainly for supervised learning, helps to create more accurate algorithms.\
    \ Furthermore, for each algorithm, specific data transformation must be complete\
    \ before the modeling stage.\n\nStep 3 is modeling, which consists of model selection.\
    \ This is done by analyzing the nature of a problem and data. Most data should\
    \ be allocated for model creation (training), with a small percentage left for\
    \ testing and evaluating the model. As you can see in Figure [1-3](#463840_1_En_1_Chapter.xhtml#Fig3),\
    \ the machine learning process is iterative. For example, after creating a model,\
    \ there is a possibility that it might not be accurate. In this case, we would\
    \ have to recheck the previous steps, such as business understanding or data acquisition.\n\
    \n## Machine Learning Languages and Platforms\n\nIn order to create a machine\
    \ learning model, you must be familiar with at least one language that facilitates\
    \ machine learning. However, there are some tools, such as Microsoft Azure Machine\
    \ Learning, that provide a drag-and-drop environment.\n\nThere are many different\
    \ languages for doing machine learning, including Python, Java, R, C++, C, JavaScript,\
    \ and so forth. However, among all these languages, Python and R are the most\
    \ widely used, with a focus on creating models and the machine learning process.\n\
    \nThere are also many different tools for doing machine learning. In this book,\
    \ we will look specifically at the Microsoft tools that can help us perform machine\
    \ learning, as well as how to use different Microsoft technologies to implement\
    \ certain machine learning processes.\n\nMicrosoft has integrated machine learning\
    \ in some of its tools, such as Bing search or Xbox, for many years now. In 2004,\
    \ it embedded the data-mining tools in SQL Server. These tools helped SQL and\
    \ business intelligence (BI) developers to leverage machine learning, to create\
    \ more insightful reports.\n\nSQL Server allows users to quickly produce mining\
    \ models, using the current data in cubes. The main advantage of using data mining\
    \ tools in SQL Server is that they are easy to deploy, have a great interface,\
    \ and are user-friendly. However, there are some disadvantages. For example, there\
    \ is no way to create custom code using R or Python, and only a limited number\
    \ of algorithms are available.\n\nSubsequently, Microsoft announced a cloud-based\
    \ machine learning platform, Azure Machine Learning (AML), in 2014. This platform\
    \ provides a smooth drag-and-drop environment and does not require any software\
    \ to make it work. Azure Machine Learning supports R and Python and offers more\
    \ than 25 algorithms specific to machine learning (Figure [1-4](#463840_1_En_1_Chapter.xhtml#Fig4)).\
    \ You’ll learn more about those in Chapter [12](#463840_1_En_12_Chapter.xhtml).\n\
    \n![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig4_HTML.jpg](images/463840_1_En_1_Chapter/463840_1_En_1_Fig4_HTML.jpg)\n\
    \nFigure 1-4\n\nThe Azure Machine Learning environment is easy to use and flexible\n\
    \nIn addition to Azure Machine Learning, Microsoft provides the ability to embed\
    \ the R or Python code in some of its other tools, such as Power BI, a self-service\
    \ BI tool that is widely used for BI practices. In 2015, Microsoft began to offer\
    \ new possibilities for machine learning in Power BI, for example, a custom visual\
    \ in the reporting section that helps developers to write R code with the goals\
    \ of visualization and machine learning. You will learn more about it in Chapter\
    \ [4](#463840_1_En_4_Chapter.xhtml).\n\nAnother critical component of Microsoft\
    \ Power BI is Power Query. Power Query helps developers to source data from different\
    \ resources and offers many features for cleaning data. In 2016, Microsoft introduced\
    \ the option of writing R code inside Power Query for machine learning. There\
    \ is a difference between writing code in Power BI reporting and Power Query.\
    \ In the former, you can create visuals (Figure [1-5](#463840_1_En_1_Chapter.xhtml#Fig5)),\
    \ but not in the latter. Moreover, the code in the R visual runs every time the\
    \ filter context changes or page opens, whereas the R scripts in Power Query Editor\
    \ run only on refresh, unless there is a direct query connection. You will learn\
    \ how to perform machine learning inside Power Query with R in Chapters [6](#463840_1_En_6_Chapter.xhtml),\
    \ [7](#463840_1_En_7_Chapter.xhtml), and [8](#463840_1_En_8_Chapter.xhtml).\n\n\
    ![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig5_HTML.jpg](images/463840_1_En_1_Chapter/463840_1_En_1_Fig5_HTML.jpg)\n\
    \nFigure 1-5\n\nR visual for machine learning in Power BI report"
  trans: "\n### 监督学习\n\n监督学习的主要目标是学习如何根据历史数据预测一个类别或数值。另一种定义是，监督学习是从带标签的训练数据中推断出函数关系的机器学习任务\
    \ [2]。\n\n监督学习有不同的方法。一种是预测数值，例如预测某个视频频道的订阅人数，其范围可能从一人到数百万人不等。监督学习使得预测该频道将有多少人订阅成为可能。另一个例子是预测来年的销售额，其范围可能从\
    \ 1,000 美元到 200,000 美元。通过这种方法，算法可以预测公司的销售数量。我们将这种方法称为*回归方法*，其输出结果是一个连续值。\n\n监督学习的另一种方法涉及预测类别，例如预测客户是会留在公司还是离开。在这个例子中，目标是预测现有客户是否会留在某个群体中。另一个案例可能考虑一家提供不同客户等级的公司，例如金卡、银卡和铜卡客户。在这种情况下，监督学习方法可能会预测新客户属于金卡、银卡还是铜卡群体。在这种类型的监督学习中，预测列应该是一个*离散的类别标签*。\n\
    \n### 无监督学习\n\n在监督学习中，我们在创建和训练模型之前就已经对答案有了概念。而在无监督学习中，我们不预测任何列，也不给数据附加任何标签。无监督学习的主要目标是发现数据的自然模式，探索数据并提取其中有意义的信息。\n\
    \n## 机器学习生命周期\n\n机器学习生命周期包含四个主要步骤：\n\n1.  业务理解\n\n2.  数据获取与理解\n    1.  数据收集\n\n\
    \    2.  特征选择\n\n    3.  数据整理\n\n3.  建模\n    1.  模型选择\n\n    2.  拆分数据集\n\n   \
    \ 3.  训练模型\n\n4.  部署\n    1.  评估模型\n\n    2.  监控模型\n\n微软提出了一个团队数据科学过程（TDSP）来说明这些阶段（图\
    \ 1-3）。\n\n![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig3_HTML.jpg](img/463840_1_En_1_Fig3_HTML.jpg)\n\
    \n图 1-3\n\n微软提出的团队数据科学过程生命周期 [3]\n\n第一步是理解业务问题。了解业务的人员是识别公司需求和机器学习能够解决的问题的最佳资源。然而，并非所有问题都能通过机器学习解决！此外，机器学习用例应与业务利益相关者、数据科学家和工程师协作确定优先级，以便从有价值、负担得起且成功概率高的解决方案开始。\n\
    \n第二步是数据摄取，涉及从不同来源收集所需数据，并进行探索和清洗。找到与问题相关的数据列（主要针对监督学习）有助于创建更准确的算法。此外，对于每个算法，在建模阶段之前必须完成特定的数据转换。\n\
    \n第三步是建模，包括模型选择。这是通过分析问题和数据的性质来完成的。大部分数据应分配给模型创建（训练），留一小部分用于测试和评估模型。如图 1-3 所示，机器学习过程是迭代的。例如，创建模型后，有可能其准确性不高。在这种情况下，我们必须重新检查之前的步骤，例如业务理解或数据获取。\n\
    \n## 机器学习语言与平台\n\n为了创建机器学习模型，你必须至少熟悉一种便于进行机器学习的语言。不过，也有一些工具，例如 Microsoft Azure\
    \ 机器学习，提供了拖放式环境。\n\n有许多不同的语言可用于进行机器学习，包括 Python、Java、R、C++、C、JavaScript 等。然而，在所有这些语言中，Python\
    \ 和 R 是使用最广泛的，它们专注于模型创建和机器学习过程。\n\n还有许多不同的工具可用于进行机器学习。在本书中，我们将特别关注那些可以帮助我们执行机器学习的微软工具，以及如何使用不同的微软技术来实现特定的机器学习过程。\n\
    \n微软多年来已在其部分工具（如必应搜索或 Xbox）中集成了机器学习。2004 年，它将数据挖掘工具嵌入到 SQL Server 中。这些工具帮助 SQL\
    \ 和商业智能（BI）开发人员利用机器学习来创建更具洞察力的报告。\n\nSQL Server 允许用户利用多维数据集中的现有数据快速生成挖掘模型。在 SQL\
    \ Server 中使用数据挖掘工具的主要优点是它们易于部署、界面出色且用户友好。然而，也存在一些缺点。例如，无法使用 R 或 Python 创建自定义代码，并且可用的算法数量有限。\n\
    \n随后，微软于 2014 年宣布推出基于云的机器学习平台 Azure 机器学习（AML）。该平台提供了流畅的拖放式环境，并且无需任何软件即可运行。Azure\
    \ 机器学习支持 R 和 Python，并提供超过 25 种专用于机器学习的算法（图 1-4）。你将在第 12 章中了解更多相关信息。\n\n![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig4_HTML.jpg](img/463840_1_En_1_Fig4_HTML.jpg)\n\
    \n图 1-4\n\nAzure 机器学习环境易于使用且灵活\n\n除了 Azure 机器学习之外，微软还提供了在其部分其他工具中嵌入 R 或 Python\
    \ 代码的能力，例如 Power BI，这是一种广泛用于 BI 实践的自助式 BI 工具。2015 年，微软开始在 Power BI 中提供机器学习的新可能性，例如在报表部分提供自定义视觉对象，帮助开发人员编写\
    \ R 代码以实现可视化和机器学习。你将在第 4 章中了解更多相关信息。\n\nMicrosoft Power BI 的另一个关键组件是 Power Query。Power\
    \ Query 帮助开发人员从不同来源获取数据，并提供许多用于清洗数据的功能。2016 年，微软引入了在 Power Query 内部编写 R 代码以进行机器学习的选项。在\
    \ Power BI 报表和 Power Query 中编写代码是有区别的。在前者中，你可以创建视觉对象（图 1-5），但在后者中则不能。此外，R 视觉对象中的代码会在筛选上下文更改或页面打开时每次运行，而\
    \ Power Query 编辑器中的 R 脚本仅在刷新时运行，除非存在直接查询连接。你将在第 6、7 和 8 章中学习如何在 Power Query 中使用\
    \ R 执行机器学习。\n\n![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig5_HTML.jpg](img/463840_1_En_1_Fig5_HTML.jpg)\n\
    \n图 1-5\n\nPower BI 报表中用于机器学习的 R 视觉对象\n"
- fmt: 'Another Microsoft platform with embedded machine learning is Microsoft Azure,
    a cloud platform that includes various components for getting, storing, visualization,
    and output of data. Various parts of Microsoft Azure have the capability for machine
    learning. As you can see in Figure [1-6](#463840_1_En_1_Chapter.xhtml#Fig6), it
    is possible to write `R` or `Python` code in Microsoft Power BI, Microsoft SQL
    Server 2016 and 2017 (Chapters [9](#463840_1_En_9_Chapter.xhtml) and [10](#463840_1_En_10_Chapter.xhtml)),
    Azure Data Lake (Chapter [11](#463840_1_En_11_Chapter.xhtml)), Azure Stream Analytics
    (Chapter [13](#463840_1_En_13_Chapter.xhtml)), Azure Machine Learning Studio (Chapter
    [12](#463840_1_En_12_Chapter.xhtml)), and Azure Machine Learning Workbench (Chapter
    [14](#463840_1_En_14_Chapter.xhtml)). Also some introduction on Azure HDInsight
    (Chapter [15](#463840_1_En_15_Chapter.xhtml)) will be provided. Next in Chapter
    [16](#463840_1_En_16_Chapter.xhtml) an overview on Data Science Virtual Machine
    will be presented. In chapter [17](#463840_1_En_17_Chapter.xhtml) reader get familiar
    with CNTK concepts. Moreover, some services, such as cognitive services, provide
    different APIs for doing machine learning in natural language processing, text
    analysis, image and voice processing, and more. I will go into detail about these
    in Chapters [18](#463840_1_En_18_Chapter.xhtml) and [19](#463840_1_En_19_Chapter.xhtml).
    Figure [1-6](#463840_1_En_1_Chapter.xhtml#Fig6) shows how all the Azure components
    interact with other Azure tools, to expedite the process of machine learning development.


    ![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig6_HTML.jpg](images/463840_1_En_1_Chapter/463840_1_En_1_Fig6_HTML.jpg)


    Figure 1-6


    Microsoft Azure components offering different possibilities for performing machine
    learning


    There is also an option to create a Data Science Virtual Machine (DSVM) in the
    Azure portal (Figure [1-7](#463840_1_En_1_Chapter.xhtml#Fig7)). DSVM supports
    a variety of languages (e.g., `R`, `Python`, `C#`), machine learning models (Azure
    Machine Learning Workbench, H2O), data ingestion tools, data exploration, and
    development. I will cover how to work with these components in depth in Part V.


    ![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig7_HTML.jpg](images/463840_1_En_1_Chapter/463840_1_En_1_Fig7_HTML.jpg)


    Figure 1-7


    Microsoft Data Science Virtual Machine (DSVM) components [[4](#463840_1_En_1_Chapter.xhtml#Par50)]


    ## Summary


    This chapter offered an introduction to Microsoft machine learning products, providing
    a brief explanation of what machine learning is, the machine learning process,
    and the machine learning life cycle. In addition, some of the main machine learning
    approaches, such as descriptive, predictive, and prescriptive analysis were described.
    An overview of how we are able to leverage these tools for creating predictive,
    descriptive, and prescriptive analysis was provided. In the rest of the book,
    greater insight into most of the AI tools in the Microsoft stack will be introduced,
    and how to leverage them with the aim of machine learning will be explained.


    # 2. Introduction to R


    `R` is undoubtedly one of the most popular languages for machine learning. It
    is a programming language and free software environment used mainly for statistical
    computing and data visualization. `R` has been used by academics, data scientists,
    and statisticians for a long time. It is a statistical language, which is excellent
    for machine learning, statistics, and use as a visualization tool. There is an
    integration between Microsoft technologies and `R` language that enhances the
    capability of machine learning in Microsoft applications and reports. `R` is an
    open source and proprietary language that is available for the Windows and Mac
    operating systems. It can be extended via packages [[1](#463840_1_En_2_Chapter.xhtml#Par46)].
    This chapter provides an overview on installing RStudio, and how to extend the
    `R` capability via installing packages, `R` data structures, machine learning,
    and statistical analysis and visualization with `R` will be explained.


    ## Installing RStudio


    To write and use `R` for machine learning and statistical analysis, you must install
    one version of `R` on your machine. There are different versions of `R` and different
    tools to write the `R` codes, but for this book, we are going to write `R` scripts
    in RStudio, which is an integrated development environment (IDE) for `R` with
    the possibility of using a syntax-highlighting editor. To install RStudio, you
    must go to the web site located at [`www.rstudio.com/products/RStudio/`](http://www.rstudio.com/products/RStudio/).
    It is also possible to run `R` scripts on your desktop and via a server. In this
    book, RStudio for desktop has been used. Moreover, the free version of RStudio
    for desktop has been installed and used. To start, install the RStudio desktop
    on your machine and open it. The RStudio environment has four main parts, as shown
    in Figure [2-1](#463840_1_En_2_Chapter.xhtml#Fig1).


    ![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig1_HTML.jpg](images/463840_1_En_2_Chapter/463840_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    RStudio environment


    You can write your `R` code in the R editor. The editor is more user-friendly
    compared to other `R` IDEs. The output or console area shows the result of running
    the codes. The plot area is where the visualization charts, help sections, etc.,
    are shown. The last section, environment and run history, shows the variables
    and logs.


    Let’s start with a simple expression in `R`. We want to assign value 10 to variable
    name `X`. The simple statement is


    ```

    X<-10

    ```


    In `R`, the `<-` symbol is used to assign a value to a variable. To run the code,
    you just have to press Ctrl+Enter or click the run button in the editor window.


    As you can see in Figure [2-2](#463840_1_En_2_Chapter.xhtml#Fig2), I have run
    the statement `x<-1`, and the result is shown in the console editor. Now I am
    going to determine the type of the `X` variable. To do this, there is a function
    named `typeof` that gets a variable and identifies its type. RStudio also provides
    “intellisense” for each function.


    ![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig2_HTML.jpg](images/463840_1_En_2_Chapter/463840_1_En_2_Fig2_HTML.jpg)


    Figure 2-2


    Running a simple statement in `R` code


    After running the `typeof` function (Figure [2-3](#463840_1_En_2_Chapter.xhtml#Fig3)),
    you will see the output in the console window. The type of variable `X` is double.
    There are different data types and structures in `R`, discussed later in this
    chapter.


    ![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig3_HTML.jpg](images/463840_1_En_2_Chapter/463840_1_En_2_Fig3_HTML.jpg)


    Figure 2-3


    Running the `typeof` function in RStudio to identify the type of variable


    ## Installing Packages


    To extend the capability of `R`, additional packages can be installed. Each package
    has different functions that provide more functionality in working with `R`.


    The main command for installing packages is `install.packages()`. When you install
    `R`, a library folder will be created on your machine that contains some of the
    basic packages for working with `R`, such as “Base” packages. However, in Chapter
    [4](#463840_1_En_4_Chapter.xhtml), you will see how to use this command to add
    some packages for assisting with machine learning.


    ## R Data Structure


    Every programming language has a specific data structure. `R` has some predefined
    data structures that each serves a specific purpose. For performing machine learning
    in `R`, we normally use a data structure, such as a vector, list, data frame,
    factor, array, and matrix. Following, I will explain some of these briefly.'
