  trans: '

    只需点击已创建的 Azure Data Lake Analytics。Data Lake Analytics 可用于开发和运行大规模并行数据，以及使用 U-SQL、R、Python
    和 .NET 转换和处理数据。首先，我们将导入一些示例数据和代码。在页面顶部，点击 **Sample scripts** 选项（图 11-8）。


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig8_HTML.jpg](img/463840_1_En_11_Fig8_HTML.jpg)


    **图 11-8**


    Data Lake Analytics 示例脚本


    在 **Sample scripts** 页面中，有两个主要的示例数据：**Sample data missing** 和 **U-SQL Advanced
    Analytic…**。我们需要后者来访问示例数据和代码。示例数据将存储在 Data Lake Store 中（图 11-9）。


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig9_HTML.jpg](img/463840_1_En_11_Fig9_HTML.jpg)


    **图 11-9**


    Data Lake Analytics 中的示例数据


    要编写 U-SQL 并导入一些示例数据和代码，请点击 **U-SQL Advanced Analytics** 选项。随后，大约 2.5GB 的数据将被下载到
    Azure Data Lake Store 中。下载开始后，您将在 **Install U-SQL Extensions** 页面上看到启用 U-SQL 和导入数据的过程。安装过程以管道形式显示，可能需要大约两分钟才能运行完成（图
    11-10）。


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig10_HTML.jpg](img/463840_1_En_11_Fig10_HTML.jpg)


    **图 11-10**


    安装 U-SQL 扩展的过程


    接下来，关闭页面，点击 **adlsbook**，然后点击页面顶部的 **Data explorer**（图 11-11）。


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig11_HTML.jpg](img/463840_1_En_11_Fig11_HTML.jpg)


    **图 11-11**


    Azure Data Lake Store 中已导入的数据


    您可以浏览 Data Lake Store 文件夹。在 **adlsbook** 下列出的文件夹中，有两个分别名为 **R** 和 **Python**。点击
    **R** 文件夹，可以看到合并的数据、U-SQL 文件、zip 文件等（图 11-12）。


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig12_HTML.jpg](img/463840_1_En_11_Fig12_HTML.jpg)


    **图 11-12**


    Data Explorer — R 和 Python 示例文件


    点击 **R** 文件夹中的一个 U-SQL 文件，例如 `ExtR_PredictUsingLinearModel_RScript.usql`*。* 点击文件后，您可以在单独的页面中看到相关的
    U-SQL 文件内容，如图 11-13 所示。如图所示，U-SQL 脚本与 SQL 语言类似。您可以检查文件格式、下载代码、重命名文件、通过 **Access**
    撤销或授予文件访问权限等。在下一节中，我将解释 U-SQL 语言以及如何在其中编写 R 代码或 Python 代码。


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig13_HTML.jpg](img/463840_1_En_11_Fig13_HTML.jpg)


    **图 11-13**


    R 脚本中用于预测模型的 U-SQL 文件


    ## 在 U-SQL 中运行 R 脚本


    要了解 U-SQL 语言的工作原理，请点击 **R** 文件夹中的一个代码示例。然后点击 `ExtR_rxDTree.usql`。在此示例中，我们将根据鸢尾花的花萼长度预测其种类。首先，我们必须从某个资源获取数据。在代码中，数据已从
    `/usqlext/samples/R/iris.csv` 中提取。该数据集位于 Azure Data Lake Store 中 **usqlext** 文件夹下的
    **samples** 子文件夹中，位于 R 代码目录下。复制整个代码，返回 Azure Data Lake Analytics 主页面，然后点击页面顶部的
    **New job**（图 11-14）。


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig14_HTML.jpg](img/463840_1_En_11_Fig14_HTML.jpg)


    **图 11-14**


    复制代码并点击 **New job**


    在 **New job** 页面中，有一个编辑器允许您将代码放入其中（图 11-15）。


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig15_HTML.jpg](img/463840_1_En_11_Fig15_HTML.jpg)


    **图 11-15**


    在 Azure Data Analytics 中从 **New job** 页面传递 U-SQL 代码


    将代码插入编辑器后，在页面顶部的 **Job name** 框中可以输入“MSBook”。


    我们可以提交代码来运行它，但我们将修改代码。在接下来的段落中，我将解释这段代码。


    这段代码是一个简单的预测分析。有一个名为 **iris** 的免费数据集，它包含花卉的规格信息。该数据集有五列：种类类型以及花萼和花瓣的长度与宽度。我们的分析将根据花萼长度预测花卉的种类。第一步是确定如何访问输入数据（iris
    数据集）。该数据集已导入到 Data Lake Store 的 **R** 文件夹下。要在 U-SQL 脚本中使用数据，我们必须将其存储在一个变量中。


    ```

    DECLARE @IrisData string =  @"/usqlext/samples/R/iris.csv";

    ```


    此外，我们想将预测结果写回到另一个位置。因此，在路径中，我们定义一个新路径，并将输出链接存储在一个单独的变量中，如下所示：


    ```

    DECLARE @OutputFileModelSummary string = @"/usqlext/MSBook/RXTreeIris.txt";

    ```


    下一部分是关于 R 脚本定义的，使用以下代码：


    ```

    DECLARE @myRScript = @"

    require(RevoScaleR),

    rxDTree(Species ~ SepalLength, data=inputFromUSQL)

    ";

    ```


    `@myRScript` 变量将存储我们下一步要运行的 R 代码。上述代码使用了 R 中的 `RevoScaleR` 包。该包包含一个 `rxDTree`
    函数，这是一个决策树算法，用于根据花萼长度预测花卉的种类。


    现在我们可以使用一些 U-SQL 语言，通过以下代码将输入链接中的数据提取到一个名为 `@InputData` 的变量中：


    ```

    @InputData =

    EXTRACT SepalLength double,

    SepalWidth double,

    PetalLength double,

    PetalWidth double,

    Species  string

    FROM @IrisData

    USING Extractors.Csv();

    @ExtendedData =

    SELECT 0 AS Par,

    ∗

    FROM @InputData;

    ```


    U-SQL 代码使用 `Extractors.Csv()` 函数从 CSV 文件中获取数据。下一步，我们将使用 `Extension.R.Reducer()`
    函数来运行代码。


    ```

    @RScriptOutput = REDUCE @ExtendedData ON Par

    PRODUCE Par, RowId int, ROutput string

    READONLY Par

    USING new Extension.R.Reducer(command:@myRScript, rReturnType:"charactermatrix",
    stringsAsFactors:true);

    OUTPUT @RScriptOutput TO @OutputFileModelSummary USING Outputters.Tsv();

    ```


    现在您可以使用 **Submit** 按钮提交代码。提交代码后，MSBook 作业将开始运行（图 11-16）。


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig16_HTML.jpg](img/463840_1_En_11_Fig16_HTML.jpg)


    **图 11-16**


    运行 MSBook 作业的过程


    运行代码后，您必须检查输出文件夹，以确认模型是否以文本文件形式存储在那里（图 11-17）。


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig17_HTML.jpg](img/463840_1_En_11_Fig17_HTML.jpg)


    **图 11-17**


    保存决策树模型的输出文件夹


    我们在第 9 章中为机器学习执行的相同过程，也可以在这里应用。我们可以创建一个模型，并将其作为文本文件存储在 Azure Data Lake Store 中。然后，我们可以在另一个作业中使用该模型来评估模型，或使用它来预测一系列新数据。上一阶段创建的模型可以在另一个作业中使用。

    '
- fmt: '# Managing Folders via RStudio


    It is possible to load the data from Azure Data Lake Store (ADLS) into RStudio
    for the purpose of machine learning. Moreover, we can manage ADLS from the RStudio
    environment, using R scripts. So, without accessing ADLS, we are able to manage
    the portal, bring data from ADLS to RStudio to practice machine learning. However,
    after we ensure that our codes are good enough, we can use U-SQL inside ADLS,
    to embed R codes in the ADLS environment (as mentioned in the preceding section).
    In this section, the process of accessing files from the RStudio environment will
    be explained.


    From the last section, we have already created an ADLS. However, we must create
    a connection from Azure to an external application (in this case, RStudio). For
    this purpose, we must create an Azure Active Directory for service-to-service
    authentication.


    Click Azure Active Directory, on the left side of the Azure portal page (Figure
    [11-18](#463840_1_En_11_Chapter.xhtml#Fig18)).


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig18_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig18_HTML.jpg)


    Figure 11-18


    Azure Active Application in Azure


    Next click App registrations and then New application registration (Figure [11-19](#463840_1_En_11_Chapter.xhtml#Fig19)).


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig19_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig19_HTML.jpg)


    Figure 11-19


    Application Registration in Azure Active Directory


    Now you need only provide some general information, such as name, application
    type, and sign-on URL.


    The sign-on URL can be changed later, so for now, I have entered a random URL
    (the web site address [`http://radacad.com`](http://radacad.com)) (Figure [11-20](#463840_1_En_11_Chapter.xhtml#Fig20)).


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig20_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig20_HTML.jpg)


    Figure 11-20


    Application registration in Azure Active Directory


    After creation, the create application is not shown on the page, so you must click
    View all applications (Figure [11-21](#463840_1_En_11_Chapter.xhtml#Fig21)). This
    will refresh the page and show you the application registration list.


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig21_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig21_HTML.jpg)


    Figure 11-21


    Application registration


    Now you are able to see the application registration list on the page (Figure
    [11-22](#463840_1_En_11_Chapter.xhtml#Fig22)).


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig22_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig22_HTML.jpg)


    Figure 11-22


    Application ID from application registration


    To access the ADLS, we require three different identifications, such as application
    ID (Client ID), Tenant ID, and Client Secret ID.


    Client ID, which is the application ID, can be retrieved from App registrations
    (Figure [11-22](#463840_1_En_11_Chapter.xhtml#Fig22)). For a Tenant ID, you must
    return to Active Directory and click Properties, then copy the Directory ID as
    Tenant ID (Figure [11-23](#463840_1_En_11_Chapter.xhtml#Fig23)).


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig23_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig23_HTML.jpg)


    Figure 11-23


    Directory ID (Tenant ID)


    The last token that we need to get from Azure is the Client Secret ID. To get
    the Secret ID, you must go to Azure Active Directory, then to App registrations,
    and choose the app you created. Now just click the created app (Figure [11-24](#463840_1_En_11_Chapter.xhtml#Fig24)).


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig24_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig24_HTML.jpg)


    Figure 11-24


    Getting Client Secret ID from Azure Active Directory—Part 1


    Now you must click RADLSBook, to go to the main page. In RADLSBook click Settings
    (Figure [11-25](#463840_1_En_11_Chapter.xhtml#Fig25)).


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig25_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig25_HTML.jpg)


    Figure 11-25


    Getting Client Secret ID from Azure Active Directory—Part 2


    On the Settings page, click the Key option. On the Key page, you will be able
    to create a password. We must create a new password. Click Key description and
    enter a name (Figure [11-26](#463840_1_En_11_Chapter.xhtml#Fig26)).


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig26_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig26_HTML.jpg)


    Figure 11-26


    Getting Client Secret ID from Azure Active Directory—Part 3


    Next, you must specify the duration of the password. Finally, save the key, to
    be able to see the code. After you have saved the code, you will receive a message
    indicating that you have to copy the code, and if you leave the page, the code
    will become hidden. So, as soon as you create the code, you will have to copy
    it (Figure [11-27](#463840_1_En_11_Chapter.xhtml#Fig27)).


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig27_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig27_HTML.jpg)


    Figure 11-27


    Getting Client Secret ID from Azure Active Directory—Part 4


    Now you have the authentication tokens. The next step is to open RStudio, to write
    some R scripts to get the data from Azure Data Lake, upload data into Azure Data
    Lake, list the folder, and so forth. This can help to debug our R code easily
    first, then use the codes in U-SQL.


    Open RStudio in your machine, then open an empty R script. To work with the data
    in Azure, we must install some library, as listed following:


    ```

    install.packages("httr")

    install.packages("jsonlite")

    install.packages("curl")

    ```


    After installing the libraries, to make sure they are already installed and check
    the package dependencies, write the following code:


    ```

    library(httr)

    library(jsonlite)

    library(curl)

    ```


    Now we must create some connection to Azure Active Directory via the following
    code:


    ```

    h <- ",

    "client_secret"=""

    )

    ```


    Then, to get the list folder you have in Azure Data Lake Store, use the following
    codes. You must use the Tenant ID (Figure [11-22](#463840_1_En_11_Chapter.xhtml#Fig22))
    and your Azure Data Lake Store name (e.g., `adlsbook`).


    ```

    req <- "/oauth2/token", handle = h)

    res <- ".azuredatalakestore.net/webhdfs/v1/?op=LISTSTATUS",

    add_headers(Authorization = paste(res$token_type, res$access_token)))

    ```


    Now we can browse the folders in the main Azure Data Lake Store, using the following
    code:


    ```

    nlite::toJSON(jsonlite::fromJSON(content(r,"text")), pretty = TRUE)

    ```


    Just make sure you do not have any typos and that you properly copied and pasted
    the codes. As shown in Figure [11-28](#463840_1_En_11_Chapter.xhtml#Fig28), there
    are already three folders in `adlsbook`: `catalog`, `system`, and `usqlext`. The
    folders are shown in the R output console.


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig28_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig28_HTML.jpg)


    Figure 11-28


    Folders listed in Azure Data Lake Store (`adlsbook`)


    Figure [11-28](#463840_1_En_11_Chapter.xhtml#Fig28) shows the list of folders,
    the directory type, the access time, created time, owner, and so forth.


    To access the data, we must provide the path of the file that we want to access.
    For example, we want to get the data in `adlsbook`, from `usqlext`, `samples`,
    `R`, and `iris.csv` (Figure [11-29](#463840_1_En_11_Chapter.xhtml#Fig29)).


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig29_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig29_HTML.jpg)


    Figure 11-29


    The iris data in `adlsbook`


    The path will be as follows: `https://adlsbook.azuredatalakestore.net/webhdfs/v1/usqlext/samples/R/iris.csv?op=OPEN&read=true`


    Note: The connection may get lost, so you must run the codes we used for creating
    a connection.'
  raw: '## Managing Folders via RStudio


