    # 第二部分 使用 R 和 Power BI 进行机器学习


    使用 R 和 Power BI 进行机器学习


    如今，各行各业对机器学习的应用兴趣浓厚。将 Power BI 视为一个协作式自助服务工具，它支持描述性分析（数据摄取、转换、建模和可视化）的整个价值链。除了这些功能外，Power
    BI 还提供了用于执行高级分析和机器学习的出色工具。第 5 章至第 8 章主要关注 Power BI 内部的主要机器学习周期。在第 5 章中，将讨论与我们将通过机器学习解决哪些业务问题相关的概念。第
    6 章重点介绍在 Power BI 内部进行数据整理（数据清洗）的可能性。第 7 章和第 8 章重点介绍用于预测性和描述性分析的机器学习算法。


    # 5. 业务理解


    业务理解是在任何平台或语言中开展机器学习的主要且首要的步骤。并非所有业务问题都能通过机器学习方法解决。机器学习分为几个基本类别，包括监督学习和无监督学习。


    监督学习是指输入和输出变量都已确定的情况。无监督学习是指只有输入数据，而没有相应输出变量的情况。


    另一种机器学习分类由三大类组成：


    *   描述性分析

    *   预测性分析

    *   规范性分析


    描述性分析主要使用无监督学习方法进行总结、分类和提取规则，以回答已经发生的事情。预测性分析是关于基于过去数据进行预测的机器学习方法。最后，规范性分析使用优化和推荐算法来最大化预期结果。


    然而，还有其他分析类型，例如诊断分析，也有助于更好地理解业务。根据 Gartner [1] 的说法，这四种分析方法有助于组织中的决策者做出更好的决策。


    这些方法中的每一种（图 5-1）都能为公司提供一些价值，并且实施它们需要一定程度的技能。描述性分析是最简单的方法。它不需要高水平的技能，并且可以使用不同的工具完成。诊断和发现分析能提供对数据更深入的洞察，并且需要更高的技能。


    ![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig1_HTML.jpg](img/463840_1_En_5_Fig1_HTML.jpg)


    图 5-1


    分析与信息 [1]


    如图 5-2 所示，接下来的两种分析，即预测性分析和规范性分析，能提供对数据更深入的洞察，更好地理解未来可能发生的事情，此外还能提供一些规范性建议。这些分析为公司带来的价值比其他三种分析更大，并且它们需要更高的技能水平。


    ![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig2_HTML.png](img/463840_1_En_5_Fig2_HTML.png)


    图 5-2


    高级分析 [1]


    在本章中，我将解释每种分析类型的主要概念，以及我们可以针对每种分析采取的不同方法。


    ## 描述性分析


    描述性分析是理解数据和现有模式的主要方法。描述性分析可用于理解数据的结构、现有规则或数据中的模式等。描述性分析可分为三大类。


    *   运营报告

    *   统计分析

    *   数据挖掘方法


    运营报告主要是侧重于分析过去数据的传统报告。这些报告主要用于判断公司的绩效。图 5-3 展示了这样一份报告，说明了不同行业和收入群体的平均总小时工资率。


    ![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig3_HTML.jpg](img/463840_1_En_5_Fig3_HTML.jpg)


    图 5-3


    使用 Power BI 生成的每小时平均总工资报告


    这份报告简要描述了不同行业工人的小时工资率。其他类型的报告则涉及数据的统计事实。


    统计分析是进行描述性分析的另一种方式，它使我们能够更好地理解数据的统计行为。统计分析有多种类型，例如单变量分析，其中每一列数据被单独考虑，例如数据摘要和数据分布（图
    5-4）。从上图可以看出，员工的平均小时工资率以直方图的形式呈现，以显示其分布。此外，我们还可以看到最小值、最大值和平均分布。这些数据的中位数以箱线图或表格形式绘制。箱线图显示数据在中位数（中点）处分布平滑，这与数据平均值相同。


    ![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig4_HTML.jpg](img/463840_1_En_5_Fig4_HTML.jpg)


    图 5-4


    统计分析——单变量分析


    其他形式的统计分析涉及两个不同数据列之间的双变量相关性和回归。


    另一种形式是关于寻找规则、数据的自然聚类和现有模式，这可以通过数据挖掘方法（在第 8 章中简要说明）来完成。在第 8 章中，我将解释一些旨在进行描述性分析的算法（如聚类、购物篮分析和决策树）的代码和概念。

