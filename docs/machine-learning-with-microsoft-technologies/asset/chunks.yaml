    \ via a browser or desktop version.\n\n*   **Microsoft Visual Studio** is another\
    \ IDE for writing Python. It is possible to edit Python code in Azure Machine\
    \ Learning Workbench inside Microsoft Visual Studio. A detailed explanation of\
    \ how to work with Azure Machine Learning and Visual Studio is provided in the\
    \ following section.\n\n## Install Packages\n\nTo write Python codes inside Visual\
    \ Studio, we must first install Visual Studio 2017 ( [`https://docs.microsoft.com/en-us/visualstudio/install/install-visual-studio`](https://docs.microsoft.com/en-us/visualstudio/install/install-visual-studio)\
    \ ). From File, choose the New project option. Then select Python ➤ Python Application\
    \ ➤ Put Location and click the OK button (Figure [3-3](#463840_1_En_3_Chapter.xhtml#Fig3)).\n\
    \n![../images/463840_1_En_3_Chapter/463840_1_En_3_Fig3_HTML.jpg](images/463840_1_En_3_Chapter/463840_1_En_3_Fig3_HTML.jpg)\n\
    \nFigure 3-3\n\nCreating a Python application in Visual Studio 2017\n\nTo extend\
    \ the capability of Python programming, you must install some additional packages.\
    \ Each package has different functions that offer us more functionality in working\
    \ with Python. To install packages in Visual Studio, we must click View ➤ Other\
    \ Windows ➤ Python Environment (Figure [3-4](#463840_1_En_3_Chapter.xhtml#Fig4)).\n\
    \n![../images/463840_1_En_3_Chapter/463840_1_En_3_Fig4_HTML.jpg](images/463840_1_En_3_Chapter/463840_1_En_3_Fig4_HTML.jpg)\n\
    \nFigure 3-4\n\nPython environment in Visual Studio 2017\n\nIn Python Environments,\
    \ select Python version 3.6\\. In another tab, select Packages. In the search\
    \ area, type the package name (Figure [3-5](#463840_1_En_3_Chapter.xhtml#Fig5)).\
    \ For example, to install Pandas, click pip install pandas from PyPi.\n\n![../images/463840_1_En_3_Chapter/463840_1_En_3_Fig5_HTML.jpg](images/463840_1_En_3_Chapter/463840_1_En_3_Fig5_HTML.jpg)\n\
    \nFigure 3-5\n\nInstalling packages in Python\n\nAfter installing the package,\
    \ you will see a message in the output. Figure [3-6](#463840_1_En_3_Chapter.xhtml#Fig6)\
    \ shows that the Panda package has been installed successfully.\n\n![../images/463840_1_En_3_Chapter/463840_1_En_3_Fig6_HTML.jpg](images/463840_1_En_3_Chapter/463840_1_En_3_Fig6_HTML.jpg)\n\
    \nFigure 3-6\n\nInstalling packages output result\n\nAfter installing the package,\
    \ you will be able to check that it has been installed. In the interactive Python\
    \ version 3.6, write the following codes, to check whether Pandas packages have\
    \ been installed.\n\n```\nimport pandas\nprint('pandas: {}'.format(pandas.__version__))\n\
    ```\n\nNow we must test the environment, to make sure that the packages have been\
    \ installed successfully. You can run the code in a different environment. As\
    \ you can see from Figure [3-7](#463840_1_En_3_Chapter.xhtml#Fig7), it is possible\
    \ to run the code in Anaconda 5.0.1, Python 3.6, and ProjectApplication 1.\n\n\
    ![../images/463840_1_En_3_Chapter/463840_1_En_3_Fig7_HTML.jpg](images/463840_1_En_3_Chapter/463840_1_En_3_Fig7_HTML.jpg)\n\
    \nFigure 3-7\n\nRunning Python code inside Visual Studio in different environments\n\
    \n## Python for Statistical Summary\n\nThe first step in doing any machine learning\
    \ or statistical analysis is to summarize the data set. We are going to look at\
    \ the data set with regard to dimensions, statistical summary of columns, and\
    \ peek at the data. We can access a data resource about cars from the following\
    \ link: [`https://archive.ics.uci.edu/ml/machine-learning-databases/auto-mpg/auto-mpg.data`](https://archive.ics.uci.edu/ml/machine-learning-databases/auto-mpg/auto-mpg.data)\
    \ .\n\nWe are going to load data directly from the web site, then assign a name\
    \ to each column. Assigning a name to each column will help us to explore the\
    \ data better. Then we will use the Panda package to load and read the data.\n\
    \n```\nURL = \"https://archive.ics.uci.edu/ml/machine-learning-databases/auto-mpg/auto-mpg.data\"\
    \nnames = ['MPG', 'Cyl', 'Disp', 'HorsePower', 'Weight','Acceleration','Model\
    \ Year','Origin','Car Name']\ndataset = pandas.read_csv(URL, names=names)\n```"
