- fmt: '# R and Azure ML Studio


    In Azure ML Studio, there are 25 algorithms. However, in some cases, users may
    want to use their own algorithms. It is possible to write R or Python code inside
    the Azure ML Studio. In this section, you will see how we can visualize the charts
    and see the output of the data there.


    Create a new experiment in Azure ML Studio. Use the same data set (Titanic). Drag
    and drop “Titanic” into the Experiments area. Then, in the Search area, type “Execute
    R Scripts.” Drag and drop the module into the Experiments area (Figure [12-24](#463840_1_En_12_Chapter.xhtml#Fig24)).


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig24_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig24_HTML.jpg)


    Figure 12-24


    Executing R scripts in Azure ML


    As you can see in Figure [12-24](#463840_1_En_12_Chapter.xhtml#Fig24), there is
    an editor for writing R scripts. The Execute R Scripts module has three input
    nodes. The first two at the left are for data sets, and the last one is for zip
    files. By clicking this module, we can write the codes. As you can see in Figure
    [12-24](#463840_1_En_12_Chapter.xhtml#Fig24), the input data from node 1 has been
    retrieved with the following code and stored in `dataset1`.


    ```

    dataset1 <- maml.mapInputPort(1) # class: data.frame

    ```


    In this example, the input node contains the Titanic data set (Figure [12-24](#463840_1_En_12_Chapter.xhtml#Fig24)).
    So, I will change the code, as follows:


    ```

    Titanic<- maml.mapInputPort(1) # class: data.frame

    ```


    In next step, we are going to create a box plot from the age of the *Titanic*
    passengers, using the following code:


    ```

    boxplot(titanic$Age)

    ```


    Next, we create a statistical summary of the data.


    ```

    output<-data.frame(titanic$Age,titanic$Pclass,titanic$Sex)

    summary(output)

    ```


    Finally, we want to show only age, sex, and passenger class in the output node.
    The final code would look as in Figure [12-25](#463840_1_En_12_Chapter.xhtml#Fig25).


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig25_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig25_HTML.jpg)


    Figure 12-25


    R scripts in Azure ML Studio


    Now we have to run the experiment. There are two output nodes for Execute R Script.
    The output node on the left side holds the output variable that has three main
    columns (Figure [12-26](#463840_1_En_12_Chapter.xhtml#Fig26)).


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig26_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig26_HTML.jpg)


    Figure 12-26


    First output of Execute R Scripts in Azure ML Studio


    The other output contains some information about the R chart and the statistical
    summary of it. To view the output, right-click the right output node and visualize
    the node (Figure [12-27](#463840_1_En_12_Chapter.xhtml#Fig27)).


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig27_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig27_HTML.jpg)


    Figure 12-27


    Second output of Execute R Scripts


    It is possible to explore the Azure ML data sets and experiments from RStudio.
    Moreover, R users can write a function in RStudio and then create an API from
    it.


    For this, first, you must install the Azure ML package in RStudio, using the following
    command:


    ```

    install.package("AzureML")

    ```


    The second step is to get some identifications keys from Azure ML Studio. Navigate
    to `studio.azureml.net`, in your Azure ML environment, click Settings, copy the
    Workspace ID (Figure [12-28](#463840_1_En_12_Chapter.xhtml#Fig28)), and store
    it in a variable in RStudio, as follows:


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig28_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig28_HTML.jpg)


    Figure 12-28


    Workspace ID from Azure ML environment


    ```

    id<- "your workspace ID"

    ```


    Navigate to another tab in the Settings menu and choose Authentication tokens.
    Copy the primary authentication token and allocate it to a variable in RStudio.


    ```

    auth<-"your authorization token"

    ```


    There is a `workspace` function in the Azure ML package that creates a reference
    to an Azure ML Studio workspace, by getting the authentication token and Workspace
    ID.


    ```

    ws <- workspace( id , auth  )

    ```


    It is possible to receive an error for missing R tools software. Therefore, you
    must install the latest version of R tools from [[4](#463840_1_En_12_Chapter.xhtml#Par58)]
    and store it in the same root of the RStudio.


    Finally, for exploring all the experiments in Azure ML, there is an `experiments`
    function that gets the `ws` object as input to connect to the Azure ML environment.


    ```

    experiments(ws, filter = "all")

    ```


    Using the `experiments` function allows you to filter which experiment from Azure
    ML you want to check the details of. You can set the filter values to `all`, `samples`,
    and `my datasets`. In this example, I set the filter to `all`. By applying the
    name function in RStudio to check the detail information, you can see the columns,
    such as the experiment’s name, versions, owner, and so forth (Figure [12-29](#463840_1_En_12_Chapter.xhtml#Fig29)).


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig29_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig29_HTML.jpg)


    Figure 12-29


    Exploring the attributes we are able to see from Azure ML Experiments


    It is possible to upload a data set from RStudio into Azure ML with the `upload.dataset`
    command.


    There is a data set in the `ggplot2` package that I am going to upload to the
    Azure ML Studio.


    ```

    library(ggplot2)

    upload.dataset(mpg,ws,"mpg")

    ```


    You must to provide the data set, workstation objects (`ws`), and a name with
    which you want to save the data set in the Azure ML environment. Now, if you explore
    the data sets in Azure ML, you will be able to see the newly uploaded data set
    there.


    ## Summary


    This chapter presented a brief introduction to Azure ML Studio. First, a simple
    machine learning model for predicting the survival of *Titanic* passengers was
    implemented. The next step was to create an API from the model, analyze it, and
    show the result in Excel. In addition, how to write R codes inside Azure ML using
    the Execute R Scripts module was explained. The chapter’s final section explained
    how to explore Azure ML Studio via R code and upload data sets from RStudio into
    Azure ML datasets.


    # Machine Learning in Azure Stream Analytics


    Azure Stream Analytics is an event-processing engine that allows users to analyze
    high volumes of data streaming from devices, sensors, and applications. Azure
    Stream Analytics can be used for Internet of Things (IoT) real-time analytics,
    remote monitoring and data inventory controls. However, Azure Stream Analytics
    is another component in Azure on which we could run machine learning. It is possible
    to use a machine learning model API created in Azure ML Studio inside Azure Stream
    Analytics for applying machine learning to streaming data from sensors, applications,
    and live databases. In this chapter, I will explain how to use machine learning
    inside Azure Stream Analytics. First, a general introduction to Azure Stream Analytics
    is given, then, a simple example of an Azure ML Studio API that is going to be
    applied to the stream data is presented.'
