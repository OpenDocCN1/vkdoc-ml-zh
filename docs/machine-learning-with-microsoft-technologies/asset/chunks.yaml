- fmt: "# 9. Using R with SQL Server 2016 and 2017\n\nIn 2016, Microsoft announced\
    \ the possibility of writing R codes inside SQL Server Management Studio. To be\
    \ able to write R code in SQL Server 2016, we must install R Services first. In\
    \ 2017, the ability to write Python codes inside SQL Server 2017 was provided.\
    \ A developer can write the R and Python codes inside SQL Server Management Studio,\
    \ using Machine Learning Server and accessing the different R or Python packages.\
    \ In 2017, instead of R services, we have machine learning services, which allow\
    \ us to embed R or Python codes in SQL scripts. In this chapter, the process of\
    \ how we can set up SQL Server Management Studio to write R or Python scripts\
    \ is explained. A brief explanation of some essential packages is also provided.\
    \ In addition, best practices for how we can create a model and reuse it for another\
    \ data set are explained.\n\n## SQL Server 2016 and 2017\n\nThe first step in\
    \ using R in SQL Server 2016 is to install SQL Server 2016. You can choose one\
    \ of SQL Server’s editions, such as free Enterprise, Standard, or Express editions.\
    \ To install, you must have an Admin account.\n\n1. To start the setup wizard\
    \ for SQL Server 2016, from the Installation tab, select New SQL Server stand-alone\
    \ installation or add features to an existing installation (Figure 9-1).\n\n \
    \  ![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig1_HTML.jpg](images/463840_1_En_9_Chapter/463840_1_En_9_Fig1_HTML.jpg)\n\
    \n   Figure 9-1 SQL Server installation\n\n2. On the feature selection page, select\
    \ R-Services (In-Database). As you can see in Figure 9-2, SQL Server Replication\
    \ and R Services (In-Database) have been installed.\n\n   ![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig2_HTML.jpg](images/463840_1_En_9_Chapter/463840_1_En_9_Fig2_HTML.jpg)\n\
    \n   Figure 9-2 SQL Server Feature Selection\n\n3. The final step is to consent\
    \ to install Microsoft R Open. After installation is complete, you must restart\
    \ your computer and run the SQL Server as Admin. For more information about the\
    \ installation process, follow the Microsoft link on how to install R services\
    \ in SQL Server 2016.\n\nThe process of setting up the machine learning services\
    \ in SQL Server 2017 is the same as for the 2016 version. The only difference\
    \ is that in feature selection, we have access to both R and Python languages.\
    \ Moreover, we have to consent to install Microsoft R services and Python (Figure\
    \ 9-3).\n\n![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig3_HTML.jpg](images/463840_1_En_9_Chapter/463840_1_En_9_Fig3_HTML.jpg)\n\
    \nFigure 9-3 Installing Machine Learning Services for SQL Server 2017\n\nMachine\
    \ Learning Services in SQL Server 2017 runs on-premises and in the cloud. This\
    \ service includes a rich set of algorithms, such as `RevoScaleR`, `Revoscalepy`,\
    \ and `MicrosoftML`. Moreover, it supports a variety of Microsoft custom R and\
    \ Python packages. In this chapter, I will explain how we can facilitate writing\
    \ R scripts in SQL Server 2016 and 2017 (they are the same). In addition, how\
    \ to use R for doing machine learning, what `RevoScaleR` is, and how specific\
    \ algorithms are going to be supported are also explained. Some features, such\
    \ as how to use pre-trained models for visual analysis and sentiment analysis\
    \ and how to deploy the solution as a web service will be covered as well.\n\n\
    ## Running R Scripts\n\nAfter installing the R services in SQL Server (2016 or\
    \ 2017), you must enable writing an external script inside SQL Server Management\
    \ Studio via a specific stored procedure. First, make sure you have already downloaded\
    \ and installed SQL Server Management Studio.\n\nRun Management Studio as Run\
    \ as Admin and click New Query, to open a query window and run the following code:\n\
    \n```\nsp_configure\n```\n\nBy running the preceding code, you will get a list\
    \ of stored procedures for configuration options (Figure 9-4).\n\n![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig4_HTML.jpg](images/463840_1_En_9_Chapter/463840_1_En_9_Fig4_HTML.jpg)\n\
    \nFigure 9-4 Configuration options available in SQL Server\n\nIn line 9, there\
    \ is a stored configuration procedure named `external scripts enabled`, with four\
    \ columns. This stored procedure enables us to write R codes. It has two main\
    \ attributes: `config_value` and `run_value`. When you run the following code:\n\
    \n```\nsp_configure 'external scripts enabled'\n```\n\nthe initial value for `config`\
    \ and `run` is zero (Figure 9-5).\n\n![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig5_HTML.jpg](images/463840_1_En_9_Chapter/463840_1_En_9_Fig5_HTML.jpg)\n\
    \nFigure 9-5 Running the external scripts store procedure\n\nTo run R code in\
    \ SQL Server 2017/2016, we must change the `run_value` to 1.\n\n```\nExec sp_configure\
    \ 'external scripts enabled' ,1 Reconfigure with override\n```\n\nNow, if we run\
    \ the code in Figure 9-5, we will get another result (Figure 9-6).\n\n![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig6_HTML.jpg](images/463840_1_En_9_Chapter/463840_1_En_9_Fig6_HTML.jpg)\n\
    \nFigure 9-6 Enabling the running of R scripts in SQL Server\n\nIt is possible\
    \ that the `run_value` has not changed to 1, so you must restart SQL Server Management\
    \ Studio.\n\nAfter the `run_value` changes to 1, it is possible to check if R\
    \ script has been enabled. We execute a stored procedure that has three main inputs:\n\
    \n* `@language` gets the name of scripting language.\n* `@script` stores the related\
    \ R scripts. In the following example, we assign the input variable to output\
    \ one `OutputDataSet<-InputDataSet`.\n* `@input_data_1` stores the related data\
    \ for consumption of R scripts. In the following example, it is a very simple\
    \ SQL Code: `select 1 as hello`.\n\n```\nexec sp_execute_external_script  @language\
    \ =N'R',\n@script=N'OutputDataSet<-InputDataSet',\n@input_data_1 =N'select 1 as\
    \ hello'\nwith result sets (([hello] int not null));\ngo\n```\n\nIf you run the\
    \ preceding code, you will see that the output is `hello` and the value is `1`\
    \ (Figure 9-7). The output of a stored procedure can be identified by `with result\
    \ sets`. The column name to be shown in the output is `hello`, and the output\
    \ value is an integer number (1), and it should not be null. As a result, we have\
    \ `[hello] int not null`.\n\n![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig7_HTML.jpg](images/463840_1_En_9_Chapter/463840_1_En_9_Fig7_HTML.jpg)\n\
    \nFigure 9-7 Enabling R scripts"
