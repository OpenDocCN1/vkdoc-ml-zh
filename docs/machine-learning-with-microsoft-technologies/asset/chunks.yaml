- fmt: 'Just click the created `Azure Data Lake Analytics`. `Data Lake Analytics`
    can be useful for developing and running massive parallel data and transforming
    and processing data in `U-SQL`, `R`, `Python`, and `.NET`. To start, we are going
    to import some sample data and codes. At the top of the page, click on the `Sample
    scripts` option (Figure [11-8](#463840_1_En_11_Chapter.xhtml#Fig8)).


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig8_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig8_HTML.jpg)


    Figure 11-8

    Data Lake Analytics Sample scripts


    In the `Sample scripts` page, there are two main sample data: `Sample data missing`
    and `U-SQL Advanced Analytic…`. We need the latter, to access the sample data
    and codes. The sample data will be stored in `Data Lake Store` (Figure [11-9](#463840_1_En_11_Chapter.xhtml#Fig9)).


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig9_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig9_HTML.jpg)


    Figure 11-9

    Sample data in Data Lake Analytics


    To write the `U-SQL` and import some sample data and codes, click the `U-SQL Advanced
    Analytics` option. Following, about 2.5GB will be downloaded into `Azure Data
    Lake Store`. After the download starts, you will see the process of enabling `U-SQL`
    and importing data on the `Install U-SQL Extensions` page. The installation process
    is shown as a pipeline, which may take about two minutes to run (Figure [11-10](#463840_1_En_11_Chapter.xhtml#Fig10)).


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig10_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig10_HTML.jpg)


    Figure 11-10

    The process of installing the U-SQL extensions


    Next, close the page and click `adlsbook` and then `Data explorer`, at the top
    of the page (Figure [11-11](#463840_1_En_11_Chapter.xhtml#Fig11)).


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig11_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig11_HTML.jpg)


    Figure 11-11

    Imported data in Azure Data Lake Store


    You can browse the `Data Lake Store` folders. Under `adlsbook`, among the folders
    listed, there are two named `R` and `Python`. Click the `R` folder, to see the
    combined data, `U-SQL` files, zip files, and so forth (Figure [11-12](#463840_1_En_11_Chapter.xhtml#Fig12)).


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig12_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig12_HTML.jpg)


    Figure 11-12

    Data Explorer—R and Python sample files


    Click one of the `U-SQL` files in the `R` folder, such as `ExtR_PredictUsingLinearModel_RScript.usql`.
    By clicking the files, you can see the related `U-SQL` files content in a separate
    page, as shown in Figure [11-13](#463840_1_En_11_Chapter.xhtml#Fig13). As you
    can see in the figure, the `U-SQL` scripts are similar to the `SQL` language.
    It is possible to check the file format, download the codes, rename the files,
    revoke or grant access to files via `Access`, and so forth. In the next section,
    I will explain `U-SQL` language and how to write `R` codes or `Python` in it.


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig13_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig13_HTML.jpg)


    Figure 11-13

    U-SQL files for predictive models in R scripts


    ## Running R Scripts in U-SQL


    To see how the `U-SQL` language works, click one of the code samples in the `R`
    folder. Then click `ExtR_rxDTree.usql`. In this example, we are going to predict
    a flower species, based on its sepal length. First, we must obtain the data from
    some resource. In the code, the data has been extracted from `/usqlext/samples/R/iris.csv`.
    The data set location is in `Azure Data Lake Store` in folder `usqlext`, `samples`,
    under the `R` codes. Copy the entire code and return to the `Azure Data Lake Analytics`
    main page and click `New job`, at the top of the page (Figure [11-14](#463840_1_En_11_Chapter.xhtml#Fig14)).


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig14_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig14_HTML.jpg)


    Figure 11-14

    Copy the code and click New job


    In the `New job` page, there is an editor that allows you to put the code there
    (Figure [11-15](#463840_1_En_11_Chapter.xhtml#Fig15)).


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig15_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig15_HTML.jpg)


    Figure 11-15

    Passing the U-SQL code from New job page in Azure Data Analytics


    After inserting the code in the editor, at the top of the page, you can insert
    `MSBook` in the `Job name` box.


    We can submit the code to run it, but we are going to change the code. In the
    following paragraphs, I will explain the code.


    This code is a simple predictive analysis. There is a free data set named `iris`
    that is about the flower’s specification. This data set has five columns: the
    species type and the sepal and petal length and width. Our analysis is going to
    predict the species of a flower based on its sepal length. The first step is to
    identify how to access the input data (`iris` data set). This data set has already
    been imported to the `Data Lake Store` under the `R` folder. To consume data in
    `U-SQL` scripts, we must store it in a variable.


    ```

    DECLARE @IrisData string =  @"/usqlext/samples/R/iris.csv";

    ```


    In addition, we want to write back the result of the prediction in another location.
    So, in the path, we define a new path and store the output link in a separate
    variable, as follows:


    ```

    DECLARE @OutputFileModelSummary string = @"/usqlext/MSBook/RXTreeIris.txt";

    ```


    The next part, about the `R` scripts definition, uses the following code:


    ```

    DECLARE @myRScript = @"

    require(RevoScaleR),

    rxDTree(Species ~ SepalLength, data=inputFromUSQL)

    ";

    ```


    The `@myRScript` variable will store the related `R` code that we are going to
    run in the next step. The preceding code uses the `RevoScaleR` package in `R`.
    This package contains an `rxDTree` function that is a decision tree algorithm
    to predict the flower’s species, based on the sepal length.


    Now we are able to employ some `U-SQL` language, to extract the data from the
    input link into a variable named `@InputData`, using the following code:


    ```

    @InputData =

    EXTRACT SepalLength double,

    SepalWidth double,

    PetalLength double,

    PetalWidth double,

    Species  string

    FROM @IrisData

    USING Extractors.Csv();

    @ExtendedData =

    SELECT 0 AS Par,

    ∗

    FROM @InputData;

    ```


    The `U-SQL` code uses the `Extractors.Csv()` function to get the data from a CSV
    file. In the next step, we are going to run the code, using the `Extension.R.Reducer()`
    function.


    ```

    @RScriptOutput = REDUCE @ExtendedData ON Par

    PRODUCE Par, RowId int, ROutput string

    READONLY Par

    USING new Extension.R.Reducer(command:@myRScript, rReturnType:"charactermatrix",
    stringsAsFactors:true);

    OUTPUT @RScriptOutput TO @OutputFileModelSummary USING Outputters.Tsv();

    ```


    Now you can submit the code, using the `Submit` button. After submitting the code,
    the `MSBook` job will run (Figure [11-16](#463840_1_En_11_Chapter.xhtml#Fig16)).


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig16_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig16_HTML.jpg)


    Figure 11-16

    Process of running the MSBook job


    After running the code, you must check the output folder, to see if the model
    is stored there as a text file (Figure [11-17](#463840_1_En_11_Chapter.xhtml#Fig17)).


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig17_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig17_HTML.jpg)


    Figure 11-17

    The output folder holding the decision tree model


    The same process that we followed in Chapter [9](#463840_1_En_9_Chapter.xhtml)
    for machine learning, we can apply here. We can create a model and store it in
    `Azure Data Lake Store` as a text file. Then we can consume the model for another
    job to evaluate the model or use it to predict a new series of data. The created
    model in last phase can be consumed in another job.'
