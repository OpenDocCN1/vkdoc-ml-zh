    Figure 19-2


    Bot Framework for questions and answers


    After completing the bot application, the resulting services have three main categories:
    Bot Management, App Service Setting, and Support and Troubleshooting. First, check
    the output of the created bot. Go to Bot Management ➤ Test in Web Chat.


    To see the default result of Bot Framework, click Test in Web Chat and write Hi.
    The result will be shown as “Welcome to the simple sandwich order bot!” Then list
    the sandwich option (Figure [19-3](#463840_1_En_19_Chapter.xhtml#Fig3)).


    ![../images/463840_1_En_19_Chapter/463840_1_En_19_Fig3_HTML.jpg](images/463840_1_En_19_Chapter/463840_1_En_19_Fig3_HTML.jpg)


