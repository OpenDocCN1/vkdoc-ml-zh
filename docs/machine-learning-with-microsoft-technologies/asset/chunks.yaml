    # 16. Data Science Virtual Machine and AI Frameworks


    Data Science Virtual Machine (DSVM) is a virtual machine on the Azure cloud that
    is customized for doing data science. DSVM has some pre-configured and preinstallation
    tools that help users build artificial intelligence (AI) applications. DSVM assists
    data science teams to access a consistent setup. In this chapter, a brief introduction
    to DSVM and how to install it is provided, in addition to an overview of the tools
    installed.


    ## Data Science Virtual Machine Overview


    Data Science Virtual Machine is a preinstalled and pre-configured tool capable
    of promoting collaboration among data science teams. Installing a set of required
    tools in the cloud reduces the need for maintaining the software and the cost
    and time required.


    DSVM can help trainers and educators to teach data science with a consistent setup.
    Having a pre-built setup environment is good for short-term training. DSVM can
    be useful for learning and comparing different machine learning tools, such as
    Microsoft ML Server, SQL Server, Visual Studio, Jupyter, deep learning tools,
    and so forth. DSVM has many different data science and deep learning tools, including
    the following:


    *   Microsoft R Open with popular packages preinstalled


    *   Microsoft ML Server (R, Python) Developer


    *   Microsoft Office Pro-Plus


    *   Anaconda Python 2.7, 3.5


    *   Relational Database


    *   Database Tools


    *   Jupyter Notebook Server with R, Python, Julia, PySpark, Sparkmagic, and SparkR


    *   Development tools, such as Visual Studio 2017, RStudio Desktop and Server,
    PyCharm Community, and so forth.


    *   Power BI Desktop


    *   Data Movement and Management tools, such as Azure Storage Explorer and Microsoft
    Data Management Gateway


    *   Machine Learning tools, such as Azure Machine Learning, Weka, Rattle, and
    H2O


