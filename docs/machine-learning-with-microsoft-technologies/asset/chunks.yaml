    # 14. Azure 机器学习 (ML) Workbench


    Azure ML Workbench 是微软在 2017 年推出的另一个工具。Azure 机器学习服务（预览版）将端到端数据科学与高级分析工具集成在一起。它们帮助专业数据科学家准备数据、开发实验并在云规模上部署模型
    [1]。在本章中，首先简要介绍 Azure ML Workbench，然后对 Azure ML Studio 和 Azure ML Workbench 进行比较。接下来将介绍安装
    Azure ML Workbench 的过程。之后，将讨论数据的加载、准备和可视化。


    ## Azure ML Workbench


    Azure ML Workbench 是一个集成的、端到端的数据科学和高级分析解决方案。它是一个用于准备数据、开发模型和实验，并最终在云规模上进行部署的工具。Azure
    ML Workbench 是 Azure ML 的一个新版本，与 Azure ML Studio 有一些不同之处。在表 14-1 中，我总结了 Azure
    ML Workbench 和 Azure ML Studio 之间的主要区别。


    表 14-1


    Azure ML Workbench 与 Azure ML Studio 对比


    |  | Azure ML Workbench | Azure ML Studio |

    | --- | --- | --- |

    | 用户视角 | 适合专业数据科学家。 | 对于非机器学习专家用户来说，这是一个很好的工具。 |

    | 部署 | 可以在云端部署模型、管理模型并跟踪其部署。 | 在 Azure ML Studio 中，模型通过创建 API 进行部署。 |

    | 开发语言 | 唯一的开发语言是 Python。 | 除了使用一些现有模型和转换组件外，还可以使用 R 或 Python 代码开发模型。 |

    | 可访问性 | 本地平台 | 基于云的平台 |


    Azure 机器学习的五个主要组件是：


    *   Azure 机器学习 Workbench

    *   Azure 机器学习实验服务

    *   Azure 机器学习模型管理服务

    *   用于 Apache Spark 的 Microsoft 机器学习库（MMLSpark 库）

    *   用于 AI 的 Visual Studio Code 工具


    Azure ML Workbench 是一个桌面应用程序，也是一个命令行工具。它支持 Windows 和 MacOS。使用它，可以管理机器学习解决方案。


    ### Azure ML Workbench 安装


