  trans: "\n## 预测分析\n\n另一种与机器学习相关的分析类型是预测分析。预测分析属于监督学习，意味着我们希望从过去的数据中学习，以预测未来的趋势。预测分析基于某种概率来预测未来。没有任何方法能以\
    \ 100%的概率预测未来。预测分析主要基于统计学的概率。我们可以将预测分析分为两种主要方法：\n\n*   回归\n\n*   分类\n\n回归方法预测一个数值，例如，未来三个月的销售额，或未来三年网站关注者的数量。\n\
    \n分类分析则关注对群体进行预测。分类预测某个人或事物属于哪个或哪些类别。例如，在分析客户流失问题时，分类分析可以预测一个新客户属于可能离开还是留下的群体。\n\
    \n对于回归和分类这两种方法，都有许多相关的算法可以帮助我们。在第 7 章中，我们将探讨其中一些算法。\n\n对于回归分析，有几种相关的算法，例如线性回归、逻辑回归、多项式回归、逐步回归、岭回归、套索回归和弹性网络回归。此外，还有一些其他技术，如神经网络、决策树等（图\
    \ 5-5）。\n\n![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig5_HTML.jpg](img/463840_1_En_5_Fig5_HTML.jpg)\n\
    \n图 5-5\n\n回归分析 [2]\n\n对于分类分析，也有许多相关算法，包括支持向量机（SVM）、决策树和 K 近邻（KNN）（参见第 7 章）。第\
    \ 7 章将介绍一个使用 Power BI 进行分类分析的示例。\n\n时间序列预测是预测分析的一个子领域，与回归算法有一些相似之处。时间序列分析预测的值是基于时间的。时间序列数据可能与趋势和/或季节性相关（图\
    \ 5-6）。\n\n![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig6_HTML.jpg](img/463840_1_En_5_Fig6_HTML.jpg)\n\
    \n图 5-6\n\n牛奶产量的时间序列预测\n\n## 规范分析\n\n规范分析是关于推荐系统的。推荐系统预测用户对某个项目的评分或偏好。推荐系统可以分为两大类：\n\
    \n![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig8_HTML.jpg](img/463840_1_En_5_Fig8_HTML.jpg)\n\
    \n图 5-8\n\n协同过滤 [4]\n\n*   *基于内容的系统*：这些系统寻找项目之间的相似性。基于内容的推荐系统分析项目描述，并推荐与用户兴趣相似度更高的项目\
    \ [3]。例如，如果我们想向客户推荐新电影，基于内容的过滤会检查新提供的电影与客户已看过的电影之间的相似性（图 5-7）。\n\n    ![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig7_HTML.jpg](img/463840_1_En_5_Fig7_HTML.jpg)\n\
    \n    图 5-7\n\n    基于内容的过滤\n\n*   *协同过滤*：这种方法用于根据相似用户对项目的喜好来推荐项目（图 5-8）。\n\n##\
    \ 业务理解\n\n如前所述，业务理解是关于确定我们可以将业务问题归入哪个类别。重要的是，要确定我们的问题适合特定的类别，例如预测分析、描述性分析或规范分析。业务理解需要与业务专家和业务利益相关者进行互动。此外，我们要解决的业务问题会影响算法选择过程、数据收集和数据清洗。第\
    \ 6 章至第 8 章提供了一些针对不同业务问题的机器学习示例。\n\n## 总结\n\n本章简要介绍了不同的数据分析和机器学习方法，包括描述性分析、预测分析和规范分析。Power\
    \ BI 是一个全面的数据驱动分析工具，为进行任何高级分析提供了基础设施。在下一章中，我将讨论如何在 Power BI 中使用 R 进行数据整理。\n\n\
    # 6. 预测分析的数据整理\n\n在机器学习过程中，业务理解之后，下一步是收集正确的数据、特征选择和数据整理。数据整理包括数据清洗、连接不同数据源、质量控制、数据集成、数据转换和数据缩减过程（图\
    \ 6-1）。\n\n![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig1_HTML.png](img/463840_1_En_6_Fig1_HTML.png)\n\
    \n图 6-1\n\n机器学习过程\n\n在本章中，我将向您展示如何在 Power BI Desktop 查询编辑器内执行数据清洗。将简要介绍 Power\
    \ Query 编辑器，包括如何从不同资源导入数据，如何使用 Power Query 编辑器进行数据清洗，以及如何在其中编写 R 脚本。\n\n## Power\
    \ Query 编辑器\n\nPower Query 编辑器是 Power BI 的数据转换工具。它是一个用于获取数据、数据清洗、数据建模以及编写 M、R\
    \ 或 Python 脚本的综合工具。要访问 Power BI 中的 Power Query 编辑器，您必须单击“编辑查询”图标（图 6-2）。\n\n![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig2_HTML.jpg](img/463840_1_En_6_Fig2_HTML.jpg)\n\
    \n图 6-2\n\n访问 Power Query 编辑器\n\nPower Query 编辑器提供不同的数据转换选项。您可以从各种不同的资源获取数据，例如\
    \ Excel、CSV、XML、JSON、文件夹、SharePoint、SQL Server、SAP、MySQL、Oracle、Azure、Azure Blob、Azure\
    \ SQL、Azure HDInsight、Google Analytics、Dynamics、Facebook、MailChimp 等（图 6-3）。\n\
    \n![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig3_HTML.jpg](img/463840_1_En_6_Fig3_HTML.jpg)\n\
    \n图 6-3\n\nPower Query 编辑器中可用的数据资源\n\nPower Query 编辑器有不同的组件。“主页”选项卡包含用于从不同资源获取数据、执行一些简单数据转换的组件，以及用于编写\
    \ M 语言的高级编辑器。使用 Power Query，我们可以在一个小窗口中查看应用于数据转换的步骤（图 6-4）。\n\n![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig4_HTML.jpg](img/463840_1_En_6_Fig4_HTML.jpg)\n\
    \n图 6-4\n\nPower Query 中的“主页”选项卡\n\nPower Query 中的另一个组件是“转换”选项卡。它提供了一些数据转换所需的工具，例如更改日期和时间列、统计转换等（图\
    \ 6-5）。\n\n![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig5_HTML.jpg](img/463840_1_En_6_Fig5_HTML.jpg)\n\
    \n图 6-5\n\nPower Query 转换\n\n此外，还有一个名为“运行 R 脚本”的组件，允许用户在 Power Query 内部编写相关的 R\
    \ 代码。在下一节中，我将向您展示如何使用 Power Query 进行一些旨在进行机器学习和数据分析的数据转换。\n"
- fmt: '# Data Wrangling in Power Query


    Before doing machine learning, we must go through two main processes: data preparation
    and data wrangling. Data preparation involves collecting data from resources,
    integrating it, and loading it into one resource, similar to the ETL (extract,
    transform, and load) process.


    Data wrangling is loading the data and applying the data cleaning, formatting,
    and integration in the application layer.


    The Python language includes some popular data wrangling processes, such as reshaping
    data, selecting data, and merging data.


    ## Reshaping Data


    One of the main approaches for reshaping data is pivoting. This involves converting
    column data to the column name, as illustrated in Figure [6-6](#463840_1_En_6_Chapter.xhtml#Fig6).


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig6_HTML.png](images/463840_1_En_6_Chapter/463840_1_En_6_Fig6_HTML.png)


    Figure 6-6


    Pivoting data


    The related code to create data in Python (Figure [6-7](#463840_1_En_6_Chapter.xhtml#Fig7))
    is


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig7_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig7_HTML.jpg)


    Figure 6-7


    Pivoting using Python code


    ```

    data=[["2nd March 2018","A",12.36],   ["3rd March 2018","A",23.69],  ["2nd March
    2018","B",25.36],     ["2nd March 2018","C",17.28],    ["3rd March 2018","B",19.2]]

    using package pandas

    import pandas as pd

    df=pd.DataFrame(data)

    pivot table

    df=pd.pivot_table(df,index=[df[0]],columns=df[1])

    ```


    In R, we can do this via the following code:


    ```

    install.packages("tidyr")

    date=c("2nd March 2018","2nd March 2018","2nd March 2018","2nd March 2018","2nd
    March 2018")

    Type=c("A","A","B","C","B")

    index=c(0,1,2,3,4)

    Value=c(12.36,23.69,25.36,17.28,19.2)

    df=data.frame(index,date,Type,Value)

    library("tidyr")

    spread(df,Type,Value)

    and the result is the same (a bit different out put)

    ```


    Now we are going to see how we can launch this process in Power Query without
    writing any code. To pivot data using Power Query, we must enter data, by using
    the Enter Data option (Figure [6-8](#463840_1_En_6_Chapter.xhtml#Fig8)).


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig8_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig8_HTML.jpg)


    Figure 6-8


    Entering data manually


    By clicking Enter Data, we are able to put data in Power Query manually (Figure
    [6-9](#463840_1_En_6_Chapter.xhtml#Fig9)).


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig9_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig9_HTML.jpg)


    Figure 6-9


    Creating a data table


    We have the same data as we have in Python (Figure [6-10](#463840_1_En_6_Chapter.xhtml#Fig10)).


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig10_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig10_HTML.jpg)


    Figure 6-10


    Data set in Power BI


    Now we just click the Type column (Figure [6-11](#463840_1_En_6_Chapter.xhtml#Fig11)).
    Then we click Pivot Column under the Transform tab.


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig11_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig11_HTML.jpg)


    Figure 6-11


    Click the Type column and pivot option


    Next, we specify which column we are going to put a value and type to (Figure
    [6-12](#463840_1_En_6_Chapter.xhtml#Fig12)).


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig12_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig12_HTML.jpg)


    Figure 6-12


    Specifying type and values


    The result of pivoting is shown in Figure [6-13](#463840_1_En_6_Chapter.xhtml#Fig13).


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig13_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig13_HTML.jpg)


    Figure 6-13


    Pivot table


    There are other examples of reshaping, such as unpivoting, melting, and iteration,
    that all can be done in Power Query. In addition, the process of selecting and
    putting a condition to check data can be done quite easily in Power Query.


    ## Selecting Data


    For selecting a value with a condition in Python, we use the `where` function,
    as follows:


    ```

    df.where(df[2]>17)

    ```


    In the `df` data set, we are going to select values that are greater than 17 (Figure
    [6-14](#463840_1_En_6_Chapter.xhtml#Fig14)).


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig14_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig14_HTML.jpg)


    Figure 6-14


    Selecting values using Python


    In Power Query, you must click the column you are going to filter, then choose
    the filter option, number of filters, and Greater Than Or Equal To option (Figure
    [6-15](#463840_1_En_6_Chapter.xhtml#Fig15)).


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig15_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig15_HTML.jpg)


    Figure 6-15


    Power Query select values


    Then, in Power Query, simply filter the column to 17 (Figure [6-16](#463840_1_En_6_Chapter.xhtml#Fig16)).


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig16_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig16_HTML.jpg)


    Figure 6-16


    Power Query filter value


    ## Merging Data


    Another popular form of data preparation is merging data, for example, joining
    two tables, possibly from different data sources. In Python, if we want to do
    this, there is a `merge` function that we can use to connect two different data
    sets. For example, consider the following data set:


    ```

    data1=[["a",11],["b",1],["c",99]]

    data2=[["a",20],["b",0],["d",21]]

    data1=pd.DataFrame(data1)

    data1.columns=["Type","Value"]

    data2.columns=["Type","Value"]

    data2=pd.DataFrame(data2)

    merg=pd.merge(data1,data2,how=''left'',on="Type")

    ```


    As you can see in the preceding code, we can specify the join type and join column.
    We can change the `how` attribute to `left`, `right`, `inner`, and `outer` (Figure
    [6-17](#463840_1_En_6_Chapter.xhtml#Fig17)).


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig17_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig17_HTML.jpg)


    Figure 6-17


    Using Python to merge data


    The same process can be performed in Power Query. I have created two different
    data sets, `Data1` and `Data2`, in Power Query (Figure [6-18](#463840_1_En_6_Chapter.xhtml#Fig18)).


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig18_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig18_HTML.jpg)


    Figure 6-18


    Creating a data set in Power Query


    After creating a data set, you must click the Merge column, to merge `Data1` with
    `Data2` (Figure [6-18](#463840_1_En_6_Chapter.xhtml#Fig18)).


    In the Merge window, we can specify which column we are going to merge, based
    on and what type of merge we are interested in (Figure [6-19](#463840_1_En_6_Chapter.xhtml#Fig19)).


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig19_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig19_HTML.jpg)


    Figure 6-19


    Merging data based on the Type column and Left Outer join


    After merging, we must specify what columns we want to show to users (Figure [6-20](#463840_1_En_6_Chapter.xhtml#Fig20)).


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig20_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig20_HTML.jpg)


    Figure 6-20


    Column selection


    Then the output will be there, and we will be able to see the results (Figure
    [6-21](#463840_1_En_6_Chapter.xhtml#Fig21)).


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig21_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig21_HTML.jpg)


    Figure 6-21


    Result of merging Data1 and Data2


    These are some basic data transformations that you can do in Power Query. There
    are more complex processes that you can do using the Power Query menu or M or
    R languages.'
