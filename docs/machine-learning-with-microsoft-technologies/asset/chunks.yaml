    前面的示例是关于在 Power BI 中使用认知服务。在下一节中，我将展示如何在 Windows 应用程序中使用人脸（即面部识别）服务。


    ## 智能应用：面部识别服务


    认知服务的另一个功能是人脸（面部识别）API。该 API 除了能检测情绪以及找出两张图片中人脸的相似面部特征外，还能从图像中执行人脸检测。


    在应用程序中使用人脸 API 之前，可以先试用一下。要查看演示，请导航至认知服务网站，然后进入视觉类别（图 18-16）。在视觉类别下，点击“图像中的情绪识别”演示。要测试该
    API，请浏览并选择一张图片，然后提交。上传图片后，点击“提交”按钮。


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig16_HTML.jpg](img/463840_1_En_18_Fig16_HTML.jpg)


    图 18-16


    认知服务面部识别


    如图 18-17 所示，上传图片后，API 会显示情绪，例如愤怒、轻蔑、厌恶、恐惧、快乐、中性、悲伤和惊讶，并用 0 到 1 之间的数字表示。如图 18-17
    所示，唯一数值较高的度量是快乐，而图片中的人物正在微笑。


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig17_HTML.jpg](img/463840_1_En_18_Fig17_HTML.jpg)


    图 18-17


    图像情绪检测演示


