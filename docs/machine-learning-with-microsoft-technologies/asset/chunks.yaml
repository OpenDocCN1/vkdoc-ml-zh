    A question-and-answer (QnA) chatbot can be used for any web site, to guide users.
    The procedure for creating a chatbot is the same as that followed in the previous
    section. First, we create a `Web App Bot` service and choose the `Question and
    Answer bot template` (Figure [19-10](#463840_1_En_19_Chapter.xhtml#Fig10)).


