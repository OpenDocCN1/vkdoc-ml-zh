    Advanced Editor for writing in M language


    The first three lines should be substituted with the followning one:


    ```

    (#"Source Table" as table) as table=>

    let

    Source = #"Source Table",

    ```


    In the first line, we define a variable named `Source Table`, and in the third
    line, we assign it to the `Source` variable. In the next step, we will remove
    some of the lines starting with `Promoted Headers` and `Changed Type`. These lines
    are solely for the specific data set (`titanic`) transformation. Now we have the
    following lines, for which we must still make some transformation:


    ```

    (#"Source Table" as table) as table=>

    let

    Source = #"Source Table",

    #"Run R Script" = R.Execute("# ''dataset'' holds the input data for this script#(lf)library(rpart)
    #(lf)numrows<-nrow(dataset)#(lf)sampledata<-sample(numrows,0.8∗numrows)#(lf)train<-dataset[sampledata,]#(lf)test<-dataset[-sampledata,]#(lf)DT<-rpart(Survived~
    Age+Pclass+Sex,data=train,method=""class"")#(lf)prediction<-predict (DT,test)#(lf)rpartresult<-data.frame(prediction,test)",[dataset=#"Changed
    Type"]),

    rpartresult = #"Run R Script"{[Name="rpartresult"]}[Value]

    in

    rpartresult

    in

    Source

    ```


    As you can see in preceding code, we have a header line `#"Run R Script" =` that
    contains a function `R.Execute`. This function contains all the R codes that we
    wrote. In M language, the output of one function will be passed to the next one.
    The previous function is for changing type `Changed Type`, which we already deleted.
    Now we must change the code in `Run R Script` , as follows:


    ```

    #"Run R Script" = R.Execute("# ''dataset'' holds the input data for this script#(lf)library(rpart)
    #(lf)numrows<-nrow(dataset)#(lf)sampledata<-sample(numrows,0.8∗numrows)#(lf)train<-dataset[sampledata,]#(lf)test<-dataset[-sampledata,]#(lf)DT<-rpart(Survived~
    Age+Pclass+Sex,data=train,method=""class"")#(lf)prediction<-predict (DT,test)#(lf)rpartresult<-data.frame(prediction,test)",[dataset=#"Changed
    Type"]),

    ```


    The `Changed Type` should be substituted with `Source`, as shown in the following
    code:


    ```

    let

    Source = #"Source Table",

    #"Run R Script" = R.Execute("# ''dataset'' holds the input data for this script#(lf)library(rpart)
    #(lf)numrows<-nrow(dataset)#(lf)sampledata<-sample(numrows,0.8∗numrows)#(lf)train<-dataset[sampledata,]#(lf)test<-dataset[-sampledata,]#(lf)DT<-rpart(Survived~
    Age+Pclass+Sex,data=train,method=""class"")#(lf)prediction<-predict (DT,test)#(lf)rpartresult<-data.frame(prediction,test)",[dataset=Source]),

    rpartresult = #"Run R Script"{[Name="rpartresult"]}[Value]

    in

    rpartresult

    in

    Source

    ```


    We still must make some additional changes. These are to be applied to the Name
    column that we want to predict. Currently, it is “Survived~ Age+Pclass+Sex,” but
    we want to substitute the Survived column with a parameter that the user provided.
    Also, rather than another column for input, we want to consider all the columns.
    As a result, we must change the code, as follows:


    ```

    (#"Source Table" as table, #"Prediction Column"as text) as table=>

