    # Part II Machine Learning with R and Power BI


    Machine Learning with R and Power BI


    Today, there is huge interest in using machine learning in various industries.
    Consider Power BI as a collaborative, self-service tool that supports the entire
    value chain for descriptive analytics (data ingestion, transformation, modeling,
    and visualization). In addition to these functionalities, Power BI provides really
    good tools for performing advanced analytics and machine learning. Chapters [5](#463840_1_En_5_Chapter.xhtml)–[8](#463840_1_En_8_Chapter.xhtml)
    focus mainly on the principal machine learning cycle inside Power BI. In Chapter
    [5](#463840_1_En_5_Chapter.xhtml), concepts related to what business problem we
    are going to solve by leveraging machine learning will be discussed. Chapter [6](#463840_1_En_6_Chapter.xhtml)
    focuses on the possibility of data wrangling (data cleaning) inside Power BI.
    Chapters [7](#463840_1_En_7_Chapter.xhtml) and [8](#463840_1_En_8_Chapter.xhtml)
    focus on the machine learning algorithm for predictive and descriptive analysis.


    # 5. Business Understanding


    Business understanding is the main and first step in undertaking machine learning
    in any platform or language. Not all business problems can be addressed by machine
    learning approaches. There are some basic categories into which machine learning
    falls, including supervised learning and unsupervised learning.


    Supervised learning is when both the input and output variables are identified.
    Unsupervised learning is when there is only input data, without corresponding
    variables.


    Another machine learning classification is made up of three major groups:


    - Descriptive analysis

    - Predictive analysis

    - Prescriptive analysis


    Descriptive analysis uses mainly unsupervised learning approaches for summarizing,
    classifying, and extracting rules to answer something that has happened. Predictive
    analysis is about machine learning approaches for forecasting based on past data.
    Finally, prescriptive analysis uses optimization and recommendation algorithms
    to maximize expected outcomes.


    However, there are other analytics, such as diagnosis analytics, that also help
    to provide a better understanding of a business. According to Gartner [[1](#463840_1_En_5_Chapter.xhtml#Par37)],
    these four analytics approaches help decision makers in an organization to make
    better decisions.


    Each of these approaches (Figure [5-1](#463840_1_En_5_Chapter.xhtml#Fig1)) provides
    some values for a company, and implementing them requires some level of skills.
    Descriptive analysis is the simplest approach. It does not demand a high level
    of skill and can be done with different tools. Diagnosis and discovery analysis
    provides more insight into data and requires more skill.


    ![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig1_HTML.jpg](images/463840_1_En_5_Chapter/463840_1_En_5_Fig1_HTML.jpg)


    **Figure 5-1** Analysis and information [[1](#463840_1_En_5_Chapter.xhtml#Par37)]


    As you can see in Figure [5-2](#463840_1_En_5_Chapter.xhtml#Fig2), the next two
    analyses, predictive and prescriptive, provide more insight into data and a better
    understanding of what may happen in the future, in addition to offering some prescriptive
    advice. These analyses bring more value for a company than the other three, and
    they require a greater degree of skill.


    ![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig2_HTML.png](images/463840_1_En_5_Chapter/463840_1_En_5_Fig2_HTML.png)


    **Figure 5-2** Advanced analytics [[1](#463840_1_En_5_Chapter.xhtml#Par37)]


    In this chapter, I will explain the main concepts of each type of analysis and
    what different approaches we can take with each.


    ## Descriptive Analysis


    Descriptive analysis is the main approach with which to understand data and existing
    patterns. Descriptive analysis can be used to understand the structure of data,
    existing rules, or patterns in data, and so forth. Descriptive analysis can be
    grouped into three main categories.


    - Operational reports

    - Statistical analysis

    - Data mining approaches


    Operation reports are mainly traditional reports focused on analysis of past data.
    These reports are used principally to judge the performance of companies. Figure
    [5-3](#463840_1_En_5_Chapter.xhtml#Fig3) shows such a report, illustrating the
    average total hourly rate of labor in different industries and income groups.


    ![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig3_HTML.jpg](images/463840_1_En_5_Chapter/463840_1_En_5_Fig3_HTML.jpg)


    **Figure 5-3** Average total hourly report using Power BI


    This report provides a brief description of the hourly rate of workers in different
    industries. Other types of reports relate statistical facts about data.


    Statistical analysis is another way of doing descriptive analysis, which gives
    us a better understanding of the statistical behavior of data. There are various
    kinds of statistical analysis, such as univariate analysis, in which each column
    of data is considered separately, such as a summary of data and data distribution
    (Figure [5-4](#463840_1_En_5_Chapter.xhtml#Fig4)). As you can see from the preceding
    figure, the average hourly rate of an employee is presented as a histogram, to
    show the distribution. In addition, we can see the minimum, maximum, and average
    distribution. The median of this data is plotted in a box or a table format. The
    box-plot chart shows that the data has been distributed smoothly at the median
    (the middle point), which is the same as the data average.


    ![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig4_HTML.jpg](images/463840_1_En_5_Chapter/463840_1_En_5_Fig4_HTML.jpg)


    **Figure 5-4** Statistical analysis—univariate analysis


    Other forms of statistical analysis are concerned with the bivariate correlation
    and regression between two different data columns.


    The other one is about finding the rules, natural cluster of data, and existing
    pattern, which can be done by data mining approaches (explained briefly in Chapter
    [8](#463840_1_En_8_Chapter.xhtml)). In Chapter [8](#463840_1_En_8_Chapter.xhtml),
    I explain the code and concept of some algorithms aimed at descriptive analysis,
    such as clustering, market basket analysis, and decision trees.'
