- fmt: '# 11. R in Azure Data Lake


    Azure Data Lake Store is one of the components in Microsoft Cloud that helps developers,
    data scientists, and analysts to store data of any size and shape. Azure Data
    Lake is optimized for processing large amounts of data. It provides parallel processing
    with optimum performance. In Azure Data Lake, we can create a hierarchical data
    folder structure. Because of these capabilities, Azure Data Lake makes it easy
    for data scientists to apply advanced analytics and machine learning modeling
    with high scalability cost-effectiveness. Azure Data Lake Analytics includes U-SQL,
    which is a language like SQL that enables you to process unstructured data [[1](#463840_1_En_11_Chapter.xhtml#Par60)].
    It is possible to perform machine learning inside Azure Data Lake and explore
    the Azure Data Lake from RStudio to create models inside the RStudio environment.
    Moreover, it is possible to get data from Azure Data Lake with Hive query and
    to use that data inside Azure Machine Learning. In this chapter, you will see
    how we can write and work with data, using U-SQL language with R in Azure Data
    Lake, and how we can import data from Azure Data Lake to RStudio or import data
    from RStudio into Azure Data Lake.


    ## Azure Data Lake Environment


    Azure Data Lake is one of the components of Microsoft Cloud with the aim of storing
    data. As you can see in Figure [11-1](#463840_1_En_11_Chapter.xhtml#Fig1), the
    second component in Azure Portal is about storing data. Azure Data Lake Store
    can store data of any size or format (structured and unstructured). It is also
    used for doing analytics (third component). Azure Data Lake Analytics can be used
    for data analytics (using U-SQL) and machine learning.


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig1_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig1_HTML.jpg)


    Figure 11-1


    Microsoft Cloud components


    To access the Azure Data Lake Store and Data Lake Analytics, you must have an
    Azure account. You can create one, by accessing the following link: [`https://tsmatz.wordpress.com/2017/06/08/azure-data-lake-r-extension/`](https://tsmatz.wordpress.com/2017/06/08/azure-data-lake-r-extension/).
    Sign in `Portal.Azure.com`, then, click the Create a resource icon on the left
    side of the portal (Figure [11-2](#463840_1_En_11_Chapter.xhtml#Fig2)). By typing
    `data lake`, two different components for Azure Data Lake will appear. To begin,
    we first are going to create Azure Data Lake Store.


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig2_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig2_HTML.jpg)


    Figure 11-2


    Creating Azure Data Lake Store and Data Lake Analytics


    By clicking the Create option, first you will have to provide some information,
    such as the name of the service, subscription, resource group, and the server
    location (Figure [11-3](#463840_1_En_11_Chapter.xhtml#Fig3)).


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig3_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig3_HTML.jpg)


    Figure 11-3


    Creating Azure Data Lake Store


    It takes a while to create components. As you can see in Figure [11-4](#463840_1_En_11_Chapter.xhtml#Fig4),
    Azure Data Lake Store has been created. After the creation of Azure Data Lake
    store, we can upload new data there.


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig4_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig4_HTML.jpg)


    Figure 11-4


    Creating Azure Data Lake Store


    By clicking the Data Explorer option, you can view the data and structure. From
    here, as you can see in Figure [11-5](#463840_1_En_11_Chapter.xhtml#Fig5), it
    is possible to upload data, create folders, define the access level, and so forth.


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig5_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig5_HTML.jpg)


    Figure 11-5


    Data Explorer in Azure Data Lake Store


    Currently, there is no data in Azure Data Lake Store. It is possible to import
    data from other Azure components to Data Lake Store. In this session, with the
    aim of machine learning, first we are going to create a sample of data via Azure
    Data Lake Analytics.


    For this, we must create a Data Lake Analytics resource (Figure [11-6](#463840_1_En_11_Chapter.xhtml#Fig6)).
    We follow the same process as we did for Data Lake Store. However, we must specify
    what Data Lake Store we are going to use. Please note: You must always create
    Data Lake Store first, then Data Lake Analytics.


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig6_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig6_HTML.jpg)


    Figure 11-6


    Creating the Azure Data Lake Analytics resource


    After specifying the name, location, related Data Lake Store, subscriptions, and
    so forth, you must wait until the component is created and shown on the Azure
    Dashboard (Figure [11-7](#463840_1_En_11_Chapter.xhtml#Fig7)).


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig7_HTML.jpg](images/463840_1_En_11_Chapter/463840_1_En_11_Fig7_HTML.jpg)


    Figure 11-7


    Created Data Lake Store on Azure Dashboard'
