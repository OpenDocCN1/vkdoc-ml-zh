  trans: '

    # 17. 使用认知工具包 (CNTK) 的深度学习工具


    微软认知工具包 (CNTK) 是一个开源的深度学习工具 [1]。本章将首先介绍神经网络和深度学习的基本概念。接着，介绍什么是 CNTK，以及如何获取和安装它。最后，将详细阐述一个使用
    CNTK 解决简单问题的基本案例研究。


    ## 神经网络概念


    我们对计算机的期望是，根据我们的输入，得到符合我们需求的输出。科学家们试图通过智能机器来模仿人脑。当然，机器的推理方式与人类不同。人脑的主要元素是神经元。人脑由
    7500 万个神经元组成。每个神经元通过突触与其他神经元相连（图 17-1）。神经网络由相互连接的节点组成。在人体中，如果一个神经元被某些外部触发（如高温）激活，它将通过突触将信息从接收节点传递到其他节点
    [2]。


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig1_HTML.jpg](img/463840_1_En_17_Fig1_HTML.jpg)


    图 17-1


    神经网络突触 [2]


    神经网络模仿了与人脑相同的概念。一个节点接收来自用户的输入，然后神经网络模型创建输出，产生类似于计算机系统的结果。一个神经网络具有：


    *   一组输入节点

    *   一组输出节点

    *   两者之间的一些处理过程，以获得良好结果

    *   信息流

    *   节点之间的连接


    为了更好地理解这个过程，想象我们正站在山顶上，想要下山。天气有雾。在这种情况下，我们只能看到前方一米。因此，我们决定只走下可见的这一米。我们根据当前位置迈出第一步，然后决定下一步的方向。我们重复这个过程，直到到达无法继续前进的点。如果那个点就是目的地，过程就完成了；如果不是，我们必须返回并尝试其他方向。因此，对于每一步，我们都会评估路径并选择最佳路线，直到我们下山。


    在神经网络中，我们经历相同的过程。我们有输入节点、一些隐藏节点（到达输出的途径）和输出节点。每个隐藏节点都有一个激活函数，用于处理输入或其他隐藏节点的输出结果（图
    17-2）。


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig2_HTML.png](img/463840_1_En_17_Fig2_HTML.png)


    图 17-2


    一个简单的神经网络


    为了更好地理解这个概念及其工作原理，让我们想象一下，我们想根据客户是否会将其支持转向另一家公司来对其进行分类。该问题如图 17-3 所示。如图所示，有两组人（客户）。一组用蓝点表示，另一组用绿点表示。主要目标是根据其中一种颜色对人进行分组。


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig3_HTML.png](img/463840_1_En_17_Fig3_HTML.png)


    图 17-3


    使用 2*x* + *y* = 2 进行分类


    如图所示，我们可以用一条线部分地隔离（分类）蓝点和绿点。


    所使用的相关方程是 ![$$ \frac{1}{3}x+y=2 $$](img/463840_1_En_17_Chapter_TeX_IEq1.png)。这个方程不能完全对这些点进行分类，所以我们必须尝试另一个方程。下一个方程是
    *x* = 4。如图 17-4 所示，新方程仍然不能产生完整或准确的分类。


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig4_HTML.png](img/463840_1_En_17_Fig4_HTML.png)


    图 17-4


    尝试使用 *x* = 4 进行分类


    这两个公式都不擅长对数据进行分类。然而，如果我们先应用第一个函数，再应用第二个函数，我们可以相对较好地对这些点进行分类。


    如图 17-5 所示，我们取得了比以前更好的结果。


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig5_HTML.png](img/463840_1_En_17_Fig5_HTML.png)


    图 17-5


    对数据进行分类


    因此，如果我们想将这个流程说明为神经网络结构，我们将得到类似于图 17-6 所示的结构。


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig6_HTML.png](img/463840_1_En_17_Fig6_HTML.png)


    图 17-6


    数据科学虚拟机 (DSVM) 环境


    隐藏层（绿色节点）可以有不同的函数来帮助对数据进行分类（图 17-7）。这些被称为激活函数。


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig7_HTML.png](img/463840_1_En_17_Fig7_HTML.png)


    图 17-7


    激活函数


    神经网络有不同的拓扑结构，例如单输出（图 17-8）或多输出。


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig8_HTML.png](img/463840_1_En_17_Fig8_HTML.png)


    图 17-8


    单输出神经网络


    神经网络也可以有多个层和多个输出（图 17-9）。具有多个层的神经网络反映了所谓的*深度学习* [2]。


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig9_HTML.png](img/463840_1_En_17_Fig9_HTML.png)


    图 17-9


    具有多个输出和多个隐藏层的神经网络


    神经网络有不同的类型，例如前馈深度神经网络 (DNN) 和卷积神经网络 (CNN) 等。


    ## 微软认知服务工具包


    CNTK 是一个易于使用的工具包，可以轻松解决问题。该工具包可以处理大量数据，并且易于扩展。CNTK 是一个完全开源的产品。它允许在多个 GPU（图形处理单元）上进行处理。该工具包已用于许多微软产品，例如认知服务、Cortana、必应搜索、Skype、Skype
    Translator 等。根据许多用户的经验，CNTK 速度很快，并且使用相关的 Python 语言 API 非常直观。

    '
- fmt: '### CNTK Setup


    There are different ways to install CNTK [[3](#463840_1_En_17_Chapter.xhtml#Par55)].
    CNTK supports 64-bit Windows and Linux operating systems. To install CNTK for
    Python on Windows, you first must open the command prompt and run as an administrator.
    In the command prompt, insert the following code:


    ```

    pip install cntk

    ```


    After installing the CNTK, the required packages will be installed, and the CNTK
    version will appear (Figure [17-10](#463840_1_En_17_Chapter.xhtml#Fig10)).


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig10_HTML.jpg](images/463840_1_En_17_Chapter/463840_1_En_17_Fig10_HTML.jpg)


    Figure 17-10 Installing the CNTK


    After installation, you can check the CNTK version via the following code:


    ```

    python -c "import cntk; print(cntk.__version__)"

    ```


    You can access a few examples and tutorials by installing some samples. First,
    you must go to the `C` folder and run the following code:


    ```

    python -m cntk.sample_installer

    ```


    Then check the following folder for some samples and tutorials (Figure [17-11](#463840_1_En_17_Chapter.xhtml#Fig11)):


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig11_HTML.jpg](images/463840_1_En_17_Chapter/463840_1_En_17_Fig11_HTML.jpg)


    Figure 17-11 CNTK samples


    ```

    C:\Windows\System32\CNTK-Samples-2-6

    ```


    Under the `Sample` folder, you will find `Examples`, `Manual`, and so forth.


    After installing the CNTK, in the Python environment, you will be able to access
    the CNTK library by using the following code in the Python environment:


    ```

    import cntk

    ```


    Another way of using CNTK is through the Azure environment. Likewise, CNTK is
    preinstalled in DSVM, so you can use it directly. In the next section, I will
    provide an example from [`www.cntk.ai/pythondocs/CNTK_101_LogisticRegression.html`](http://www.cntk.ai/pythondocs/CNTK_101_LogisticRegression.html)
    [[4](#463840_1_En_17_Chapter.xhtml#Par56)] on how to work with CNTK for classification.


    ## Case Study


    To proceed with our case study, first you must set up the DSVM, as explained in
    Chapter [16](#463840_1_En_16_Chapter.xhtml), then start the virtual machine (Figure
    [17-12](#463840_1_En_17_Chapter.xhtml#Fig12)).


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig12_HTML.jpg](images/463840_1_En_17_Chapter/463840_1_En_17_Fig12_HTML.jpg)


    Figure 17-12 Starting the DSVM


    Next, open the DSVM by downloading the RDF file (Figure [17-13](#463840_1_En_17_Chapter.xhtml#Fig13)),
    and open the virtual machine.


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig13_HTML.jpg](images/463840_1_En_17_Chapter/463840_1_En_17_Fig13_HTML.jpg)


    Figure 17-13 DSVM file and activation


    After opening the DSVM, open Jupyter Notebook in the taskbar, which will navigate
    to a web-based Jupyter Notebook website (Figure [17-14](#463840_1_En_17_Chapter.xhtml#Fig14)).


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig14_HTML.jpg](images/463840_1_En_17_Chapter/463840_1_En_17_Fig14_HTML.jpg)


    Figure 17-14 Jupyter Notebook in DSVM


    In the Jupyter Notebook environment, choose Python [conda env:Anaconda] (Figure
    [17-15](#463840_1_En_17_Chapter.xhtml#Fig15)).


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig15_HTML.jpg](images/463840_1_En_17_Chapter/463840_1_En_17_Fig15_HTML.jpg)


    Figure 17-15 Jupyter Notebook


    In the next step, we are going to run an example from [`www.cntk.ai/pythondocs/CNTK_101_LogisticRegression.html`](http://www.cntk.ai/pythondocs/CNTK_101_LogisticRegression.html)
    [[4](#463840_1_En_17_Chapter.xhtml#Par56)]. In this example, the aim is to predict
    whether a cancer patient is likely to have a benign (blue) or malignant (red)
    tumor, based on the age of the patient and the cancer cell size. As a result,
    we have two inputs and two outputs for our neural network (Figure [17-16](#463840_1_En_17_Chapter.xhtml#Fig16)).


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig16_HTML.png](images/463840_1_En_17_Chapter/463840_1_En_17_Fig16_HTML.png)


    Figure 17-16 Neural Network Structure


    The first step is to import an appropriate library for showing the result (`print_function`),
    array computation (`numpy`), and CNTK (`cntk`), and for the file name and file
    paths and directories (`sys` and `os`).


    ```

    from __future__ import print_function

    import numpy as np

    import sys

    import os

    import cntk as C

    import cntk.tests.test_utils

    cntk.tests.test_utils.set_device_from_pytest_env() # (only needed for our build
    system)

    C.cntk_py.set_fixed_random_seed(1) # fix the random seed so that LR examples are
    repeatable [4]

    ```


    Now we must get the data. First, we have to identify the number of inputs and
    outputs, using the following code:


    ```

    input_dim = 2

    num_output_classes = 2

    ```


    Then we create a function to generate some random data. The function gets the
    sample size and the number of inputs and outputs (see the following codes related
    to [`www.cntk.ai/pythondocs/CNTK_101_LogisticRegression.html`](http://www.cntk.ai/pythondocs/CNTK_101_LogisticRegression.html)
    [[4](#463840_1_En_17_Chapter.xhtml#Par56)]).


    ```

    np.random.seed(0)

    # Helper function to generate a random data sample

    def generate_random_data_sample(sample_size, feature_dim, num_classes):

    # Create synthetic data using NumPy.

    Y = np.random.randint(size=(sample_size, 1), low=0, high=num_classes)

    # Make sure that the data is separable

    X = (np.random.randn(sample_size, feature_dim)+3) ∗ (Y+1)

    # Specify the data type to match the input variable used later in the tutorial

    # (default type is double)

    X = X.astype(np.float32)

    # convert class 0 into the vector "1 0 0",

    # class 1 into the vector "0 1 0", ...

    class_ind = [Y==class_number for class_number in range(num_classes)]

    Y = np.asarray(np.hstack(class_ind), dtype=np.float32)

    return X, Y

    ```


    Then we call the function, using the following code:


    ```

    mysamplesize = 32

    features, labels = generate_random_data_sample(mysamplesize, input_dim, num_output_classes)

    ```


    You can plot the input data, using the `matplotlib` library in Python.'
