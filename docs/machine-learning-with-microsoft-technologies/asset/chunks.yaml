  trans: '

    ## 决策树


    决策树是一种常见的机器学习方法。该工具可用于预测、描述性分析和特征选择。决策树遵循我们做出决策的方式。想象一位求职者需要在多个不同的工作中做出选择。他或她为选择设定了一些标准，例如：工作职责是什么？年薪或时薪是多少？最后，每年需要出差多少次？我们可以模拟求职者的决策过程，如图
    7-8 所示。树的根节点是主要的决策点，即对工作说“是”或“否”。然后，最重要的标准是职位名称是否与求职者的专业领域匹配。第二重要的标准是薪资。最后，如果还没有到达叶节点，第三个标准是检查每年所需的出差天数。决策树使用信息增益理论来确定树分支的主要标准。关于其工作原理的详细信息，请访问
    [`http://radacad.com/decision-tree-conceps-part-1`](http://radacad.com/decision-tree-conceps-part-1)
    [3]。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig8_HTML.jpg](img/463840_1_En_7_Fig8_HTML.jpg)


    图 7-8


    求职决策树


    在 Power BI 中使用决策树有多种方法。其中一种方法是使用 Power BI 自定义可视化。


    要访问此功能，首先必须登录 Power BI 账户（图 7-9）。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig9_HTML.jpg](img/463840_1_En_7_Fig9_HTML.jpg)


    图 7-9


    Power BI 账户


    我们必须通过单击“可视化”面板中的三个点，然后选择“从商店导入”选项来检索可视化效果（图 7-10）。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig10_HTML.jpg](img/463840_1_En_7_Fig10_HTML.jpg)


    图 7-10


    从商店导入可视化效果


    在 Power BI 自定义可视化页面上，有不同类别的可视化效果，包括筛选器、KPI、地图、高级分析等（图 7-11）。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig11_HTML.jpg](img/463840_1_En_7_Fig11_HTML.jpg)


    图 7-11


    Power BI 自定义可视化效果


    您只需单击“高级分析”选项，然后选择“决策树图”（图 7-12）。单击“添加”按钮将该图表添加到 Power BI 可视化效果中。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig12_HTML.jpg](img/463840_1_En_7_Fig12_HTML.jpg)


    图 7-12


    Power BI 商店中的决策树自定义可视化效果


    ### 注意


    首次添加此图表时，必须确保您的机器上已安装 RStudio 或任何 R 版本。Power BI 将开始安装一些必需的包，例如将 `rpart` 安装到您本地的
    R 版本中。只需允许 Power BI 安装所有包即可。下一步，一个新的自定义可视化效果将出现在 Power BI 的“可视化”面板中（图 7-13）。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig13_HTML.jpg](img/463840_1_En_7_Fig13_HTML.jpg)


    图 7-13


    “可视化”面板中的决策树自定义可视化效果


    为了测试自定义可视化效果，我们必须将一些数据导入 Power BI Desktop 以进行预测性分析。该数据是关于*泰坦尼克号*灾难的免费数据集 [4]。我们必须选择用于决策的字段。主要目标（目标变量）是预测人们是否幸存。为此，首先我们必须选择几个可能影响乘客生存的列，例如年龄、性别和乘客等级。然后，将“幸存”列作为目标变量放入相关的数据字段中（图
    7-14）。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig14_HTML.jpg](img/463840_1_En_7_Fig14_HTML.jpg)


    图 7-14


    Power Query 筛选值


    下一步是从年龄列中移除缺失值（“空白”）。最后，相关的决策树图会出现在 Power BI 报表中（图 7-14）。


    在树的根节点处，有四个带编号的标签。0 代表无法幸存的乘客。此外，这些人由绿色标签标识。“100%”表示所有数据都在根节点。“0.52”和“0.48”表示大约
    0.52 是男性，0.48 是女性。换句话说，决策树决定分析的第一个属性（基于熵理论）是乘客的性别（图 7-15）。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig15_HTML.jpg](img/463840_1_En_7_Fig15_HTML.jpg)


    图 7-15


    决策树中的根节点


    在下一层，左侧的标签是绿色的，并且已经分支以代表男性乘客。基于该分支，我们可以总结出大多数男性乘客未能幸存（0）。然而，如图 7-16 所示，对于女性（右侧的分支），将要分析的属性是乘客等级。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig16_HTML.jpg](img/463840_1_En_7_Fig16_HTML.jpg)


    图 7-16


    树分析的第二层


    对于年龄超过七岁（第二个节点）的男性（根节点），他们有 58% 的可能性无法幸存（绿色标签和 0）（图 7-17）。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig17_HTML.jpg](img/463840_1_En_7_Fig17_HTML.jpg)


    图 7-17


    针对男性的决策树分析


    年龄超过七岁（第二个节点）的男性（根节点）将无法幸存（绿色标签和 0），可能性为 53%。此外，年龄小于七岁的男性将幸存。


    Power Query 内部的决策树可用于执行机器学习，并在 Power BI 报表中显示结果（与“神经网络”部分中解释的过程相同）。


    在下一节中，我将为 Power Query 内部的决策树编写 R 代码，并展示如何向其传递参数。

    '
- fmt: '# Automated Machine Learning Inside Power Query


    In the previous section, I explained how decision trees can be used for prediction
    analysis. Now we are going to use it inside Power Query, for predictions without
    a specific chart.


    First, we must click the Power Query Editor at the top of the page, to navigate
    to the Power Query environment. In Power Query, you must first download the data
    set for the *Titanic* from [`www.kaggle.com/c/titanic`](http://www.kaggle.com/c/titanic)
    [[4](#463840_1_En_7_Chapter.xhtml#Par70)]. Then, click New Source, select the
    Text/CSV option to import the data set, and click OK (Figure [7-18](#463840_1_En_7_Chapter.xhtml#Fig18)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig18_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig18_HTML.jpg)


    Figure 7-18


    Importing the Titanic data set into Power Query


    After importing the data set into Power Query, we must navigate to the Transform
    tab, then to Run R scripts. In the R editor, we will be able to write R codes.
    The first line of the code refers to a library named `rpart`. The `rpart` package
    first must be installed in your RStudio. Before installation, first make sure
    that you do not have it, by using the following command:


    ```

    Library("rpart")

    ```


    Otherwise, in RStudio, use the following code, to see what library is already
    installed on your machine.


    ```

    packagematrix <- installed.packages();

    NameOnly <- packagematrix[,1];

    OutputDataSet <- as.data.frame(NameOnly);

    OutputDataSet

    ```


    First, we must ensure that `rpart` has been installed on our machine. Then we
    write the following code in the R editor (just as what we did earlier in this
    chapter for neural networks). We must now refer to the `rpart` library and divide
    the data either for training or testing.


    ```

    library(rpart)

    numrows<-nrow(dataset)

    sampledata<-sample(numrows,0.8∗numrows)

    train<-dataset[sampledata,]

    test<-dataset[-sampledata,]

    ```


    Creating model is the next step. This pertains to the attributes we want to predict
    and create a model for, based on the training data set. In addition, we must have
    a formula for `Survived ~`. This indicates that we want to predict the survive
    column according to age, sex, and passenger class. The `predict` function will
    be used to predict the survival of the prediction analysis.


    ```

    DT<-rpart(Survived~ Age+Pclass+Sex,data=train,method= ="class")

    prediction<-predict (DT,test)

    rpartresult<-data.frame(prediction,test)

    ```


    So, the result of the prediction will be shown in Power Query, with the name `rpartresult`.
    The result will consist of two different additional columns. `X0` stands for the
    probability of passengers not surviving, and `x1` is the probability of passengers
    surviving. Now imagine that we want to use the `rpart` algorithm for classifying
    another data set, such as the cancer-related data discussed in Chapter [6](#463840_1_En_6_Chapter.xhtml).
    It is possible to parameterize the R code for passing the desired data set, prediction
    column, and so forth, to the R codes. To do this, we must duplicate the data set
    (Figure [7-19](#463840_1_En_7_Chapter.xhtml#Fig19)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig19_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig19_HTML.jpg)


    Figure 7-19


    Duplicating the Titanic data set


    Now just right-click the new data set, to create a function out of it. There is
    a need to create a function from the new duplicated data set (Figure [7-20](#463840_1_En_7_Chapter.xhtml#Fig20)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig20_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig20_HTML.jpg)


    Figure 7-20


    Creating a function in Power Query


    After creating a function, we must customize it, by passing parameters. To do
    this, we must navigate to Advanced Editor (Figure [7-21](#463840_1_En_7_Chapter.xhtml#Fig21)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig21_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig21_HTML.jpg)


    Figure 7-21


    Advanced Editor in Power Query'
  raw: '## Automated Machine Learning Inside Power Query


    In the previous section, I explained how decision trees can be used for prediction
    analysis. Now we are going to use it inside Power Query, for predictions without
    a specific chart.


    First, we must click the Power Query Editor at the top of the page, to navigate
    to the Power Query environment. In Power Query, you must first download the data
    set for the *Titanic* from [`www.kaggle.com/c/titanic`](http://www.kaggle.com/c/titanic)
    [[4](#463840_1_En_7_Chapter.xhtml#Par70)]. Then, click New Source, select the
    Text/CSV option to import the data set, and click OK (Figure [7-18](#463840_1_En_7_Chapter.xhtml#Fig18)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig18_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig18_HTML.jpg)


    Figure 7-18


    Importing the Titanic data set into Power Query


    After importing the data set into Power Query, we must navigate to the Transform
    tab, then to Run R scripts. In the R editor, we will be able to write R codes.
    The first line of the code refers to a library named `rpart`. The `rpart` package
    first must be installed in your RStudio. Before installation, first make sure
    that you do not have it, by using the following command:


    ```

    Library("rpart")

    ```


    Otherwise, in RStudio, use the following code, to see what library is already
    installed on your machine.


    ```

    packagematrix <- installed.packages();

    NameOnly <- packagematrix[,1];

    OutputDataSet <- as.data.frame(NameOnly);

    OutputDataSet

    ```


    First, we must ensure that `rpart` has been installed on our machine. Then we
    write the following code in the R editor (just as what we did earlier in this
    chapter for neural networks). We must now refer to the `rpart` library and divide
    the data either for training or testing.


    ```

    library(rpart)

    numrows<-nrow(dataset)

    sampledata<-sample(numrows,0.8∗numrows)

    train<-dataset[sampledata,]

    test<-dataset[-sampledata,]

    ```


    Creating model is the next step. This pertains to the attributes we want to predict
    and create a model for, based on the training data set. In addition, we must have
    a formula for `Survived ~`. This indicates that we want to predict the survive
    column according to age, sex, and passenger class. The `predict` function will
    be used to predict the survival of the prediction analysis.


    ```

    DT<-rpart(Survived~ Age+Pclass+Sex,data=train,method= ="class")

    prediction<-predict (DT,test)

    rpartresult<-data.frame(prediction,test)

    ```


    So, the result of the prediction will be shown in Power Query, with the name `rpartresult`.
    The result will consist of two different additional columns. “X0” stands for the
    probability of passengers not surviving, and “x1” is the probability of passengers
    surviving. Now imagine that we want to use the `rpart` algorithm for classifying
    another data set, such as the cancer-related data discussed in Chapter [6](#463840_1_En_6_Chapter.xhtml).
    It is possible to parameterize the R code for passing the desired data set, prediction
    column, and so forth, to the R codes. To do this, we must duplicate the data set
    (Figure [7-19](#463840_1_En_7_Chapter.xhtml#Fig19)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig19_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig19_HTML.jpg)


    Figure 7-19


    Duplicating the Titanic data set


    Now just right-click the new data set, to create a function out of it. There is
    a need to create a function from the new duplicated data set (Figure [7-20](#463840_1_En_7_Chapter.xhtml#Fig20)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig20_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig20_HTML.jpg)


