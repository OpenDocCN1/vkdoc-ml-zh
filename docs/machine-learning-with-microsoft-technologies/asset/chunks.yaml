- fmt: '# 8. Descriptive Analysis in Power Query with R


    This chapter focuses on descriptive analysis in Power BI. A brief introduction
    explains how we can use descriptive analysis to help decision making. Next comes
    a brief introduction to clustering, how clustering is performed in Power BI Report,
    and how we can do clustering in Power Query Editor. Finally, I will cover how
    to do market basket analysis in Power BI.


    ## K-Means Clustering


    Cluster analysis is the task of grouping similar objects in a same group or cluster.
    The clustered objects have more similarity to each other than other objects. For
    example, we may be interested in grouping our customers, based on their purchase
    behavior or demographic information [[1](#463840_1_En_8_Chapter.xhtml#Par46)].
    Or, to cite an example in science, we may want to cluster the number and severity
    of earthquakes that occurred in New Zealand over the past ten years. For a medical
    purpose, we may want to classify patients with cancer, based on their laboratory
    results.


    In machine learning, there are many different algorithms to help us do clustering.
    Some of these algorithms are centroid-based, such as k-means, GMM, Fuzzy c-means,
    and so forth. The others are based on connectivity [[2](#463840_1_En_8_Chapter.xhtml#Par47)],
    such as hierarchical clustering. There are some algorithms that are density-based
    or based on probability, dimensionality reduction, and neural networks/deep learning.


    In this chapter, I am going to show you how we use k-means algorithms for classifying
    data. There is a data set for household power consumption that is available for
    free from the UCI Machine Learning Repository [[3](#463840_1_En_8_Chapter.xhtml#Par48)].
    The data set is about the consumption of electric power in one household over
    a period of almost four years. This data set has such attributes as date, time,
    global active minute active, and reactive power, average voltage, average current
    intensity, and watt hours for kitchen, dishwasher, oven, water heater, and so
    forth. You are going to see how we can naturally classify these data, using two
    different approaches in Power BI.


    ## Clustering Custom Visuals


    The first and easy way to cluster data is to use one of the custom visuals in
    the Power BI store: Clustering. To access it, you first must log in to a Power
    BI account. In the Visualizations panel, click the three dots, then choose the
    From Store option. Under Advanced Analytics, you will find the Clustering option
    for custom visuals (Figure [8-1](#463840_1_En_8_Chapter.xhtml#Fig1)).


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig1_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig1_HTML.jpg)


    Figure 8-1


    Clustering custom visuals


    Add the custom visual to the Power BI environment. If it is your first time adding
    a Power BI custom visual, some of packages, such as Plotly, XML, and such will
    be installed. Next, you must choose four different columns from the filed area.
    As you can see in Figure [8-2](#463840_1_En_8_Chapter.xhtml#Fig2), some columns,
    such as Voltage, Global intensity (household global minute-averaged current intensity),
    Submetering 3 and 1 (watt-hour activity energy for kitchen, dishwasher, water
    heater, and so forth) have been selected.


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig2_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig2_HTML.jpg)


    Figure 8-2


    Choosing columns for clustering


    After choosing the parameters, you must set them up. Click the format icon, then
    scale data to normalize it. Apply PCA, if you want to choose the number of clusters
    you can specify, or leave it as the default (clusters will be chosen automatically).


    As you can see in Figure [8-3](#463840_1_En_8_Chapter.xhtml#Fig3), the result
    of the clustering is shown in a clustering diagram. K-means clustering found out
    about four main clusters. As you can see in the picture cluster 4 has more items,
    while cluster 1 has fewer items than other clusters. However, the limitation of
    this visualization is that we cannot see the numbers and are not able to compare
    each cluster according to its attributes.


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig3_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig3_HTML.jpg)


    Figure 8-3


    Clustring parameters and results


    In the next section, the process of performing clustering analysis inside Power
    Query will be shown, as well as how we can use Power BI visual to demonstrate
    the result.'
