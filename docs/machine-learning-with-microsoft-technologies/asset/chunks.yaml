- fmt: '# Setting Up the Data Science Virtual Machine


    To set up the DSVM, first you must log in to the Azure portal. Choose the AI—Machine
    Learning, then click Data Science Virtual Machine—Windows 2016 (Figure [16-1](#463840_1_En_16_Chapter.xhtml#Fig1)).


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig1_HTML.jpg](images/463840_1_En_16_Chapter/463840_1_En_16_Fig1_HTML.jpg)


    Figure 16-1


    Data Science Virtual Machine setup


    The next step is to set the size and choose the proper setup. For the purpose
    of data science, the virtual machine CPU should have more than four cores and
    14GB or more of RAM [[2](#463840_1_En_16_Chapter.xhtml#Par40)] (Figure [16-2](#463840_1_En_16_Chapter.xhtml#Fig2)).
    There is a star beside the required service (as shown in Figure [16-2](#463840_1_En_16_Chapter.xhtml#Fig2)).


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig2_HTML.jpg](images/463840_1_En_16_Chapter/463840_1_En_16_Fig2_HTML.jpg)


    Figure 16-2


    Choosing the Data Science Virtual Machine size


    The next step is to configure the setting, to identify locations and names. Finally,
    in the last step, the summary of the DSVM will be shown. Deploying the DSVM will
    take about five minutes to create the service (Figure [16-3](#463840_1_En_16_Chapter.xhtml#Fig3)).
    After creating the resource, click Go to Resource.


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig3_HTML.jpg](images/463840_1_En_16_Chapter/463840_1_En_16_Fig3_HTML.jpg)


    Figure 16-3


    DSVM creation


    An overview of the DSVM will be shown to the end user (Figure [16-4](#463840_1_En_16_Chapter.xhtml#Fig4)).
    As you can see in the figure, there is an overview of the location of the DSVM,
    the size of the virtual machine, and so forth.


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig4_HTML.jpg](images/463840_1_En_16_Chapter/463840_1_En_16_Fig4_HTML.jpg)


    Figure 16-4


    DSVM overview


    To connect to the DSVM, click the Connect option at the top of the window. The
    related Remote Desktop Protocol (RDP) will be downloaded from Azure (Figure [16-5](#463840_1_En_16_Chapter.xhtml#Fig5)).


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig5_HTML.jpg](images/463840_1_En_16_Chapter/463840_1_En_16_Fig5_HTML.jpg)


    Figure 16-5


    Downloading the RDP


    After downloading the RDP file, open the virtual machine and check the environment
    (Figure [16-6](#463840_1_En_16_Chapter.xhtml#Fig6)).


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig6_HTML.jpg](images/463840_1_En_16_Chapter/463840_1_En_16_Fig6_HTML.jpg)


    Figure 16-6


    DSVM environment


    In the DSVM, Visual Studio with R and Python tools has been preinstalled (RTVS
    and PTVS). As you can see in Figure [16-7](#463840_1_En_16_Chapter.xhtml#Fig7),
    you can check for recent updates via Visual Studio [[2](#463840_1_En_16_Chapter.xhtml#Par40)].


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig7_HTML.jpg](images/463840_1_En_16_Chapter/463840_1_En_16_Fig7_HTML.jpg)


    Figure 16-7


    R and Python tools in Visual Studio 2017


    RStudio has been installed in DSVM. You must install all required packages in
    RStudio, and all users are able to access these packages (Figure [16-8](#463840_1_En_16_Chapter.xhtml#Fig8)).


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig8_HTML.jpg](images/463840_1_En_16_Chapter/463840_1_En_16_Fig8_HTML.jpg)


    Figure 16-8


    RStudio in DSVM


    ## Case Study


    You can run different machine learning scenarios. In this session, a machine learning
    scenario on Jupyter Notebook in DSVM will be explained. To access Jupyter Notebook,
    click the shortcut in the DSVM desktop. Then, in the Jupyter, write the code and
    run it (Figure [16-9](#463840_1_En_16_Chapter.xhtml#Fig9)). In the example, I’ve
    run the code as follows:


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig9_HTML.jpg](images/463840_1_En_16_Chapter/463840_1_En_16_Fig9_HTML.jpg)


    Figure 16-9


    Running R code in Jupyter Notebook


    ```

    library(data.table)

    ad <- fread("http://www-bcf.usc.edu/~gareth/ISL/Advertising.csv")

    ```


    The data set is about the cost of advertising on television and radio and in newspapers
    and how much sales are generated.


    In the next step, we are going to predict sales based on variables such as number
    of people impacted by television, radio, and newspapers. Create a model for predicting
    the number of sales based on the number of advertisements on television, radio,
    and in newspapers, using linear regression. Use the following code to create a
    model (Figure [16-10](#463840_1_En_16_Chapter.xhtml#Fig10)):


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig10_HTML.jpg](images/463840_1_En_16_Chapter/463840_1_En_16_Fig10_HTML.jpg)


    Figure 16-10


    Creating a model in Jupyter Notebook


    ```

    linearReg<-lm(sales~TV+radio+newspaper,data=ad)

    linearReg

    summary(linearReg)

    ```


    Next, we must create a function that gets the new data from the user and applies
    the linear regression to it. First, we must create a function for that.


    ```

    newdata<-adv[1:5,]

    library(AzureML)

    predictfunction <-function(newdata)

    {predict(linearReg,newdata)} [2]

    ```


    This function predicts the amount of sales, based on the amount of advertisements
    on television and radio and in newspapers. The preceding function predicts the
    new set of data, based on the created model in the preceding codes. Now, for the
    next step, we must get some identification from WorkSpace and AuthenticationID
    from the Azure ML Studio environment. To fetch the data, log in to Azure ML Studio,
    then click Setting, to get information, such as Workspace ID (Figure [16-11](#463840_1_En_16_Chapter.xhtml#Fig11)).


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig11_HTML.jpg](images/463840_1_En_16_Chapter/463840_1_En_16_Fig11_HTML.jpg)


    Figure 16-11


    Fetching Workspace ID from Azure ML Studio


    The other information that we need is the Authentication Token, from Primary Authorization
    Token (Figure [16-12](#463840_1_En_16_Chapter.xhtml#Fig12)).


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig12_HTML.jpg](images/463840_1_En_16_Chapter/463840_1_En_16_Fig12_HTML.jpg)


    Figure 16-12


    Fetch Authentication Key from Azure ML Studio


    Copy these keys and put the identification in the following codes. The `Workspace`
    function is an Azure ML function that creates a connection between the R language
    and Azure ML Studio.


    ```

    workspace_id<-"Workspace ID"

    Authenticationid<-"Authentication Token"

    ws<-workspace(workspace_id,Authenticationid)

    newdata<-adv[2:5,]

    ```


    The next step is to call another function, `publishWebservice`, to generate a
    web service in Azure ML from the created function.


    ```

    data.frame(actual=newdata$sales,prediction=predictfunction(newdata))

    ep<-publishWebService(ws=ws,fun=predictfunction,name="SalesPredictionAdvertisement",inputSchema=newdata)

    ```


    Run the whole code in the Jupyter environment (Figure [16-13](#463840_1_En_16_Chapter.xhtml#Fig13)).


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig13_HTML.jpg](images/463840_1_En_16_Chapter/463840_1_En_16_Fig13_HTML.jpg)


    Figure 16-13


    Publish the R ML Code into Azure ML Webservice


    After running the code, check the web service in Azure ML Studio, to see the API
    created in Azure ML Studio (Figure [16-14](#463840_1_En_16_Chapter.xhtml#Fig14)).


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig14_HTML.jpg](images/463840_1_En_16_Chapter/463840_1_En_16_Fig14_HTML.jpg)


    Figure 16-14


    Web service created in Azure ML


    Test the API by clicking the Test button (Figure [16-15](#463840_1_En_16_Chapter.xhtml#Fig15)).


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig15_HTML.jpg](images/463840_1_En_16_Chapter/463840_1_En_16_Fig15_HTML.jpg)


    Figure 16-15


    Testing the web service in Azure ML Studio


    ## Summary


    In this chapter, a brief introduction to DSVM was presented. The process of how
    to set up DSVM and how to set the related parameters was explained. In addition,
    a brief introduction to what applications have been preinstalled was provided.
    Finally, a scenario for machine learning in Jupyter Notebook and then deployed
    to Azure ML Studio was presented.'
