    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig29_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig29_HTML.jpg)


    Figure 12-29


    Exploring the attributes we are able to see from Azure ML Experiments


    It is possible to upload a data set from RStudio into Azure ML with the `upload.dataset`
    command.


    There is a data set in the `ggplot2` package that I am going to upload to the
    Azure ML Studio.


    ```

    library(ggplot2)

    upload.dataset(mpg,ws,"mpg")

    ```


    You must to provide the data set, workstation objects (`ws`), and a name with
    which you want to save the data set in the Azure ML environment. Now, if you explore
    the data sets in Azure ML, you will be able to see the newly uploaded data set
    there.


    ## Summary


    This chapter presented a brief introduction to Azure ML Studio. First, a simple
    machine learning model for predicting the survival of *Titanic* passengers was
    implemented. The next step was to create an API from the model, analyze it, and
    show the result in Excel. In addition, how to write R codes inside Azure ML using
    the Execute R Scripts module was explained. The chapter’s final section explained
    how to explore Azure ML Studio via R code and upload data sets from RStudio into
    Azure ML datasets.


    # 13. Machine Learning in Azure Stream Analytics


    Azure Stream Analytics is an event-processing engine that allows users to analyze
    high volumes of data streaming from devices, sensors, and applications. Azure
    Stream Analytics can be used for Internet of Things (IoT) real-time analytics,
    remote monitoring and data inventory controls. However, Azure Stream Analytics
    is another component in Azure on which we could run machine learning. It is possible
    to use a machine learning model API created in Azure ML Studio inside Azure Stream
    Analytics for applying machine learning to streaming data from sensors, applications,
    and live databases. In this chapter, I will explain how to use machine learning
    inside Azure Stream Analytics. First, a general introduction to Azure Stream Analytics
    is given, then, a simple example of an Azure ML Studio API that is going to be
    applied to the stream data is presented.'
  trans: '

    ## R 与 Azure ML Studio


    Azure ML Studio 内置了 25 种算法。然而，在某些情况下，用户可能希望使用自己的算法。在 Azure ML Studio 中编写 R 或 Python
    代码是可行的。在本节中，你将看到如何可视化图表并查看数据输出。


    在 Azure ML Studio 中创建一个新实验。使用相同的数据集（泰坦尼克号）。将“Titanic”拖放到实验区域。然后，在搜索区域中，输入“Execute
    R Scripts”。将该模块拖放到实验区域（图 12-24）。


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig24_HTML.jpg](img/463840_1_En_12_Fig24_HTML.jpg)


    图 12-24


    在 Azure ML 中执行 R 脚本


    如图 12-24 所示，有一个用于编写 R 脚本的编辑器。Execute R Scripts 模块有三个输入节点。左侧的前两个用于数据集，最后一个用于 zip
    文件。点击此模块，我们可以编写代码。如图 12-24 所示，来自节点 1 的输入数据已通过以下代码检索并存储在 `dataset1` 中。


    ```

    dataset1 <- maml.mapInputPort(1) # class: data.frame

    ```


    在此示例中，输入节点包含泰坦尼克号数据集（图 12-24）。因此，我将按如下方式更改代码：


    ```

    Titanic<- maml.mapInputPort(1) # class: data.frame

    ```


    下一步，我们将使用以下代码根据*泰坦尼克号*乘客的年龄创建一个箱线图：


    ```

    boxplot(titanic$Age)

    ```


    接下来，我们创建数据的统计摘要。


    ```

    output<-data.frame(titanic$Age,titanic$Pclass,titanic$Sex)

    summary(output)

    ```


    最后，我们希望在输出节点中仅显示年龄、性别和乘客等级。最终代码将如图 12-25 所示。


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig25_HTML.jpg](img/463840_1_En_12_Fig25_HTML.jpg)


    图 12-25


    Azure ML Studio 中的 R 脚本


    现在我们必须运行实验。Execute R Script 有两个输出节点。左侧的输出节点保存了包含三个主要列的输出变量（图 12-26）。


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig26_HTML.jpg](img/463840_1_En_12_Fig26_HTML.jpg)


    图 12-26


    Azure ML Studio 中 Execute R Scripts 的第一个输出


    另一个输出包含有关 R 图表及其统计摘要的一些信息。要查看输出，请右键单击右侧输出节点并可视化该节点（图 12-27）。


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig27_HTML.jpg](img/463840_1_En_12_Fig27_HTML.jpg)


    图 12-27


    Execute R Scripts 的第二个输出


    可以从 RStudio 探索 Azure ML 数据集和实验。此外，R 用户可以在 RStudio 中编写一个函数，然后从中创建一个 API。


    为此，首先，你必须使用以下命令在 RStudio 中安装 Azure ML 包：


    ```

    install.package("AzureML")

    ```


    第二步是从 Azure ML Studio 获取一些标识密钥。导航到 `studio.azureml.net`，在你的 Azure ML 环境中，单击“设置”，复制工作区
    ID（图 12-28），并将其存储在 RStudio 的一个变量中，如下所示：


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig28_HTML.jpg](img/463840_1_En_12_Fig28_HTML.jpg)


    图 12-28


    来自 Azure ML 环境的工作区 ID


    ```

    id<- "your workspace ID"

    ```


    导航到“设置”菜单中的另一个选项卡，然后选择“身份验证令牌”。复制主身份验证令牌并将其分配给 RStudio 中的一个变量。


    ```

    auth<-"your authorization token"

    ```


    Azure ML 包中有一个 `workspace` 函数，它通过获取身份验证令牌和工作区 ID 来创建对 Azure ML Studio 工作区的引用。


    ```

    ws <- workspace( id , auth  )

    ```


    可能会收到缺少 R 工具软件的错误。因此，你必须从 [4] 安装最新版本的 R 工具，并将其存储在 RStudio 的同一根目录下。


    最后，为了探索 Azure ML 中的所有实验，有一个 `experiments` 函数，它接收 `ws` 对象作为输入以连接到 Azure ML 环境。


    ```

    experiments(ws, filter = "all")

    ```


    使用 `experiments` 函数可以让你筛选要查看详细信息的 Azure ML 实验。你可以将筛选值设置为 `all`、`samples` 和 `my
    datasets`。在此示例中，我将筛选器设置为 `all`。通过在 RStudio 中应用名称函数来检查详细信息，你可以看到列，例如实验名称、版本、所有者等（图
    12-29）。


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig29_HTML.jpg](img/463840_1_En_12_Fig29_HTML.jpg)


    图 12-29


    探索我们能够从 Azure ML 实验中看到的属性


    可以使用 `upload.dataset` 命令将数据集从 RStudio 上传到 Azure ML。


    `ggplot2` 包中有一个数据集，我将把它上传到 Azure ML Studio。


    ```

    library(ggplot2)

    upload.dataset(mpg,ws,"mpg")

    ```


    你必须提供数据集、工作区对象（`ws`）以及要在 Azure ML 环境中保存数据集的名称。现在，如果你在 Azure ML 中探索数据集，你将能够看到新上传的数据集。


    ## 总结


    本章简要介绍了 Azure ML Studio。首先，实现了一个用于预测*泰坦尼克号*乘客生存情况的简单机器学习模型。下一步是从该模型创建一个 API，对其进行分析，并在
    Excel 中显示结果。此外，还解释了如何使用 Execute R Scripts 模块在 Azure ML 内部编写 R 代码。本章的最后部分解释了如何通过
    R 代码探索 Azure ML Studio，以及如何将数据集从 RStudio 上传到 Azure ML 数据集。


    # 13. Azure Stream Analytics 中的机器学习


    Azure Stream Analytics 是一个事件处理引擎，允许用户分析来自设备、传感器和应用程序的高容量流数据。Azure Stream Analytics
    可用于物联网 (IoT) 实时分析、远程监控和数据库存控制。然而，Azure Stream Analytics 是 Azure 中另一个我们可以运行机器学习的组件。可以在
    Azure Stream Analytics 内部使用在 Azure ML Studio 中创建的机器学习模型 API，以便将机器学习应用于来自传感器、应用程序和实时数据库的流数据。在本章中，我将解释如何在
    Azure Stream Analytics 内部使用机器学习。首先，对 Azure Stream Analytics 进行一般性介绍，然后，给出一个将应用于流数据的
    Azure ML Studio API 的简单示例。

