  trans: '

    ### Azure ML Workbench 导入数据


    第一步是将数据导入 Azure ML Workbench。点击“数据”选项。其中包含两个主要部分。“数据源”存储原始数据源。“数据准备”选项存储经过准备和清理的数据。要将数据导入
    Azure ML Studio，必须点击页面顶部的加号 (+)，如图 14-9 所示。


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig9_HTML.jpg](img/463840_1_En_14_Fig9_HTML.jpg)


    图 14-9


    导入数据


    点击“添加数据源”，其中有四个主要选项用于导入数据，如图 14-10 所示：


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig10_HTML.jpg](img/463840_1_En_14_Fig10_HTML.jpg)


    图 14-10


    添加数据源选项


    *   文本文件


    *   Parquet


    *   Excel 文件


    *   数据库


    在此示例中，鸢尾花数据（文本文件）将从本地 PC 导入 Azure ML Workbench 环境。选择“文本文件”并将数据导入 Azure ML Workbench（你可以从
    [`www.kaggle.com/uciml/iris`](http://www.kaggle.com/uciml/iris) 下载鸢尾花数据集文件）。


    如图 14-11 所示，鸢尾花数据集已导入。“数据源”部分中的数据集存储原始数据。它还显示了缺失的行数、有效行数等信息。


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig11_HTML.jpg](img/463840_1_En_14_Fig11_HTML.jpg)


    图 14-11


    将数据导入 Azure ML Workbench


    要准备数据，请点击窗口顶部的“准备”选项，并为新数据集指定一个合适的名称。然后，在“数据准备”部分，将显示一个新数据，如图 14-12 所示。


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig12_HTML.jpg](img/463840_1_En_14_Fig12_HTML.jpg)


    图 14-12


    准备数据


    右键单击第一列。有一些用于数据清理的选项，例如“替换 NA 值”、“替换缺失值”等。将列重命名为“花萼长度”、“花萼宽度”、“花瓣长度”和“花瓣宽度”。可以创建图表，以便更好地理解数据。如图
    14-13 所示，在右键菜单的底部，有一些图表选项，例如“列统计信息”、“直方图”、“值计数”等。


    对于我们的示例，我们可以通过选择直方图来查看数据的分布情况。


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig13_HTML.jpg](img/463840_1_En_14_Fig13_HTML.jpg)


    图 14-13


    鸢尾花花萼长度直方图


    此编辑器为数据科学家提供了一种手段，可以更好地分析数据并更深入地了解数据特征，例如分布、异常值等。Azure Machine Learning Workbench
    通过与 Jupyter Notebook 集成，支持交互式数据科学实验。导入并清理数据后，必须运行并训练模型。如图 14-14 所示，有一个用于运行代码和测试模型的笔记本编辑器。点击窗口左侧的“笔记本”选项。那里会出现一个笔记本。（在第
    19 章中，将对 Jupyter Notebook 进行简要介绍。）


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig14_HTML.jpg](img/463840_1_En_14_Fig14_HTML.jpg)


    图 14-14


    Azure ML Workbench 中的 Jupyter Notebook


    窗口左侧有一个名为“运行”的选项。它显示运行模型的历史记录。开始时，没有运行历史记录。


    鸢尾花项目的相关文件已加载到窗口左侧的最后一个选项中。如图 14-15 所示，所有与鸢尾花分类相关的文件都位于此处。


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig15_HTML.jpg](img/463840_1_En_14_Fig15_HTML.jpg)


    图 14-15


    鸢尾花文件


    如图 14-15 所示，列出了与鸢尾花项目相关的所有文件。其中一个文件是 `iris_sklearn.py`。此文件包含用于鸢尾花分类的模型和数据。可以在本地
    Docker 上运行代码，如图 14-16 所示。


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig16_HTML.jpg](img/463840_1_En_14_Fig16_HTML.jpg)


    图 14-16


    运行 Python 代码


    点击“运行”选项并运行模型。运行模型后，点击窗口右侧的“运行”。你将能够看到运行的详细信息，包括状态、运行开始时间、持续时间、准确率等，如图 14-17 所示。


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig17_HTML.jpg](img/463840_1_En_14_Fig17_HTML.jpg)


    图 14-17


    鸢尾花运行详情


    运行 Python 代码的详细信息已显示在图 14-16 中。鸢尾花分类的评估结果显示在图 14-18 中。


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig18_HTML.jpg](img/463840_1_En_14_Fig18_HTML.jpg)


    图 14-18


    鸢尾花分类结果


    ## 总结


    本章简要介绍了 Azure ML Workbench 环境，包括如何安装和访问该环境的说明。在下一章中，你将了解如何从 SQL Server 数据库导入数据，然后将其加载到
    Azure ML Workbench，以及如何在 Docker 上的 Spark 中运行它。


    # 15. HDInsight 上的机器学习


    本章将概述如何使用 HDInsight 进行机器学习。HDInsight 基于 Apache Spark，用于内存集群处理。在内存中处理数据比基于磁盘的计算快得多。Spark
    还支持 Scala 语言，该语言支持分布式数据集。在 Spark 中创建集群非常快，并且它能够使用 Jupyter Notebook，这使得数据处理和可视化更加容易。Spark
    集群还可以与 Azure Event Hub 和 Kafka 集成。此外，还可以设置 Azure 机器学习 (ML) 服务来运行分布式 R 计算。下一节将讨论在
    HDInsight 中设置 Spark 的过程。


    ## HDInsight 概述


    HDInsight 是一种开源分析和基于云的服务。与 Azure HDInsight 集成对于处理海量数据来说简单、快速且经济高效。HDInsight 有许多不同的用例场景，例如
    ETL（提取、转换和加载）、数据仓库、机器学习、物联网 (IoT) 等。


    使用 HDInsight 进行机器学习的主要好处是可以访问基于内存的处理框架。HDInsight 帮助开发人员使用一些优秀的开源框架（例如 Hadoop、Spark、Hive、LLAP、Kafka、Storm
    和 Microsoft Machine Learning Server [1]）来处理和分析大数据并开发解决方案。

    '
- fmt: '# Setting Up Clusters in HDInsight


    The first step is to set up HDInsight in Azure. Log in to your Azure account and
    create an HDInsight component in Azure (Figure [15-1](#463840_1_En_15_Chapter.xhtml#Fig1)).
    As you can see in Figure [15-1](#463840_1_En_15_Chapter.xhtml#Fig1), there are
    different modules for HDInsight, such as HDInsight Spark Monitoring and HDInsight
    InteractiveQuery Monitoring. Among those modules, select the HDInsight Analytics
    option.


    ![../images/463840_1_En_15_Chapter/463840_1_En_15_Fig1_HTML.jpg](images/463840_1_En_15_Chapter/463840_1_En_15_Fig1_HTML.jpg)


    Figure 15-1


    Setting up HDInsight in Azure


    When you create HDInsight, you must follow some steps for setting up the cluster
    and identifying the size. The first step is to set a name for the cluster, set
    the subscription, and choose the cluster type (Figure [15-2](#463840_1_En_15_Chapter.xhtml#Fig2)).
    Different cluster types are available, including Spark, Hadoop, Kafka, ML Services,
    and more.


    ![../images/463840_1_En_15_Chapter/463840_1_En_15_Fig2_HTML.jpg](images/463840_1_En_15_Chapter/463840_1_En_15_Fig2_HTML.jpg)


    Figure 15-2


    Creating HDInsight in Azure


    The next step is to identify the size and check the summary (Figure [15-3](#463840_1_En_15_Chapter.xhtml#Fig3))
    of the cluster.


    ![../images/463840_1_En_15_Chapter/463840_1_En_15_Fig3_HTML.jpg](images/463840_1_En_15_Chapter/463840_1_En_15_Fig3_HTML.jpg)


    Figure 15-3


    Setting up HDInsight


    Creation of HDInsight may take some time. After creating an HDInsight component,
    on the main page, in the Overview section, select Cluster dashboards (Figure [15-4](#463840_1_En_15_Chapter.xhtml#Fig4)).


    ![../images/463840_1_En_15_Chapter/463840_1_En_15_Fig4_HTML.jpg](images/463840_1_En_15_Chapter/463840_1_En_15_Fig4_HTML.jpg)


    Figure 15-4


    HDInsight environment


    Next, select Jupyter Notebook. On the new page, choose the New option (Figure
    [15-5](#463840_1_En_15_Chapter.xhtml#Fig5)).


    ![../images/463840_1_En_15_Chapter/463840_1_En_15_Fig5_HTML.jpg](images/463840_1_En_15_Chapter/463840_1_En_15_Fig5_HTML.jpg)


    Figure 15-5


    Jupyter Notebook environment


    As you can see in Figure [15-5](#463840_1_En_15_Chapter.xhtml#Fig5), there are
    environment options, such as PySpark, PySpark3, and Spark. You can write the Python
    code in all of them.


    After creating the new page for Spark, you must log in with the username and password
    that you provided for creating the HDInsight component. The Jupyter environment
    is like a notebook and, so, like the Azure Databricks environment. As you can
    see in Figure [15-6](#463840_1_En_15_Chapter.xhtml#Fig6), it is possible to write
    the code there and run the whole cell to see the result.


    ![../images/463840_1_En_15_Chapter/463840_1_En_15_Fig6_HTML.jpg](images/463840_1_En_15_Chapter/463840_1_En_15_Fig6_HTML.jpg)


    Figure 15-6


    Jupyter Notebook environment


    It is also possible to fetch the data from other Azure components, such as Azure
    Data Lake Store Gen1 (Figure [15-7](#463840_1_En_15_Chapter.xhtml#Fig7)). To do
    this, you must run the following code (in Databricks, you run the same code).


    ![../images/463840_1_En_15_Chapter/463840_1_En_15_Fig7_HTML.jpg](images/463840_1_En_15_Chapter/463840_1_En_15_Fig7_HTML.jpg)


    Figure 15-7


    Getting the data from Azure Data Lake Store Gen1


    ```

    spark.conf.set("dfs.adls.oauth2.access.token.provider.type", "ClientCredential")

    spark.conf.set("dfs.adls.oauth2.client.id", "a1824181-e20c-4952-894f-6f53670672dd")

    spark.conf.set("dfs.adls.oauth2.credential", "iRzOkcyahiomc5AKobyVxFdDVF/mEbS3mqN1moehG0w=")

    spark.conf.set("dfs.adls.oauth2.refresh.url", "https://login.microsoftonline.com/0b414bdb-2159-4b16-ad13-b2d54a1781da/oauth2/token")

    val df=spark.read.option("header", "true").csv("adl://adlsbook.azuredatalakestore.net/titanic.csv")

    val specificColumnsDf = df.select("Survived", "Pclass", "Sex", "Age")

    val renamedColumnsDF = specificColumnsDf.withColumnRenamed("Sex", "Gender")

    renamedColumnsDF.createOrReplaceTempView("some_name")

    renamedColumnsDF.show()

    ```


    It is also possible to perform machine learning in Jupyter Notebook with Spark.
    For an example, follow the tutorial available at [`https://docs.microsoft.com/en-us/azure/hdinsight/spark/apache-spark-ipython-notebook-machine-learning`](https://docs.microsoft.com/en-us/azure/hdinsight/spark/apache-spark-ipython-notebook-machine-learning).


    ## Summary


    This chapter presented an overview of HDInsight and how to set it up. How to use
    HDInsight for different purposes was explained briefly, as well as how to set
    up HDInsight inside the Azure environment and how to access Jupyter Notebook for
    the purpose of writing codes in a PySpark, Spark, or PySpark3 environment. An
    example of how to connect to Azure Data Lake Store Gen1 to fetch the data was
    shown.


    ## Reference


    1.  Microsoft Azure, “Azure HDInsight Documentation,” [`https://docs.microsoft.com/en-us/azure/hdinsight/`](https://docs.microsoft.com/en-us/azure/hdinsight/),
    2019.


    # 16. Data Science Virtual Machine and AI Frameworks


    Data Science Virtual Machine (DSVM) is a virtual machine on the Azure cloud that
    is customized for doing data science. DSVM has some pre-configured and preinstallation
    tools that help users build artificial intelligence (AI) applications. DSVM assists
    data science teams to access a consistent setup. In this chapter, a brief introduction
    to DSVM and how to install it is provided, in addition to an overview of the tools
    installed.


    ## Data Science Virtual Machine Overview


    Data Science Virtual Machine is a preinstalled and pre-configured tool capable
    of promoting collaboration among data science teams. Installing a set of required
    tools in the cloud reduces the need for maintaining the software and the cost
    and time required.


    DSVM can help trainers and educators to teach data science with a consistent setup.
    Having a pre-built setup environment is good for short-term training. DSVM can
    be useful for learning and comparing different machine learning tools, such as
    Microsoft ML Server, SQL Server, Visual Studio, Jupyter, deep learning tools,
    and so forth. DSVM has many different data science and deep learning tools, including
    the following:


    *   Microsoft R Open with popular packages preinstalled

    *   Microsoft ML Server (R, Python) Developer

    *   Microsoft Office Pro-Plus

    *   Anaconda Python 2.7, 3.5

    *   Relational Database

    *   Database Tools

    *   Jupyter Notebook Server with R, Python, Julia, PySpark, Sparkmagic, and SparkR

    *   Development tools, such as Visual Studio 2017, RStudio Desktop and Server,
    PyCharm Community, and so forth.

    *   Power BI Desktop

    *   Data Movement and Management tools, such as Azure Storage Explorer and Microsoft
    Data Management Gateway

    *   Machine Learning tools, such as Azure Machine Learning, Weka, Rattle, and
    H2O

    *   Deep learning tools, such as Microsoft Cognitive Toolkit, TensorFlow, and
    Keras

    *   Big data platforms, such as Spark and Hadoop [[1](#463840_1_En_16_Chapter.xhtml#Par39)]'
