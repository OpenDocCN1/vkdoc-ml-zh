- fmt: "# R for Visualization\n\nR can be used for visualization. `Ggplot2` packages\
    \ are a popular package that helps us to draw different charts. With R visual,\
    \ you can draw static, dynamic, and 3D charts. In Chapter [6](#463840_1_En_6_Chapter.xhtml),\
    \ I will discuss some of the ways to draw charts using R codes inside Power BI.\n\
    \nWe want to implement visualization for the following principal purposes:\n\n\
    - Comparison\n- Composition\n- Distribution\n- Relationship [[3](#463840_1_En_2_Chapter.xhtml#Par48)]\n\
    \nThe chart in Figure [2-10](#463840_1_En_2_Chapter.xhtml#Fig10) shows the main\
    \ goals of visualization.\n\n![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig10_HTML.jpg](images/463840_1_En_2_Chapter/463840_1_En_2_Fig10_HTML.jpg)\n\
    \nFigure 2-10\n\nSelecting the right chart for the purpose\n\nFigure [2-10](#463840_1_En_2_Chapter.xhtml#Fig10)\
    \ illustrates that the main purposes of visualization can be categorized by four\
    \ main aspects: the relationship, distribution, comparison, and composition. This\
    \ chart is a map to find the best matches for visualization. Most of the available\
    \ visualization tools are able to follow this chart. However, using R scripts\
    \ extends these capabilities, to draw all different chart types we want.\n\n##\
    \ Summary\n\nThis chapter provided an overview of what R is and how to install\
    \ it. It also offered a brief introduction to available packages and different\
    \ data structures in the R language. Finally, a brief discussion on how we can\
    \ use R for visualization and machine learning was presented. The rest of this\
    \ book presents a more in-depth explanation on how to draw charts with the help\
    \ R scripts.\n\n# Introduction to Python\n\nPython is one of the main languages\
    \ used for performing machine learning. It is a multi-purpose language that has\
    \ been leveraged for device programming, object-oriented programming, machine\
    \ learning, and so forth. In this chapter, you will learn\n\n- Python IDE\n- Install\
    \ packages\n- Python data structure\n- Statistical analysis with Python\n- Python\
    \ for visualization\n- Python for machine learning\n\nHowever, the main aim of\
    \ this chapter is to introduce R briefly.\n\n## Python IDE\n\nAccording to the\
    \ DataCamp web site ( [`www.datacamp.com/community/tutorials/data-science-python-ide`](http://www.datacamp.com/community/tutorials/data-science-python-ide)\
    \ ), there are five top integrated development environments (IDEs) in which to\
    \ write code. A brief description of each follows.\n\n- **Spyder** is an environment\
    \ (Figure [3-1](#463840_1_En_3_Chapter.xhtml#Fig1)) very similar to RStudio, so\
    \ if you are switching from R to Python, it is a really good choice. It is supported\
    \ in Windows and MacOS. Spyder can be downloaded from the Anaconda web site (\
    \ [`www.anaconda.com/distribution/`](http://www.anaconda.com/distribution/) )\
    \ as well.\n\n    ![../images/463840_1_En_3_Chapter/463840_1_En_3_Fig1_HTML.jpg](images/463840_1_En_3_Chapter/463840_1_En_3_Fig1_HTML.jpg)\n\
    \n    Figure 3-1\n\n    Spyder environment\n\n- **Rodeo** is another Python IDE\
    \ that is similar to RStudio. You can download it from ( [`https://rodeo.yhat.com/`](https://rodeo.yhat.com/)\
    \ ). Rodeo has four main environments (Figure [3-2](#463840_1_En_3_Chapter.xhtml#Fig2)).\
    \ There is one for writing code, a console for showing results, an area for installing\
    \ packages, and another for showing plots.\n\n    ![../images/463840_1_En_3_Chapter/463840_1_En_3_Fig2_HTML.jpg](images/463840_1_En_3_Chapter/463840_1_En_3_Fig2_HTML.jpg)\n\
    \n    Figure 3-2\n\n    Rodeo environment\n\n- **PyCharm** is another IDE for\
    \ writing Python codes. Current versions of Azure Machine Learning Workbench support\
    \ this IDE ( [`www.jetbrains.com/pycharm/`](http://www.jetbrains.com/pycharm/)\
    \ ).\n\n- **Jupyter** is another IDE for writing Python code and can be accessed\
    \ via a browser or desktop version.\n\n- **Microsoft Visual Studio** is another\
    \ IDE for writing Python. It is possible to edit Python code in Azure Machine\
    \ Learning Workbench inside Microsoft Visual Studio. A detailed explanation of\
    \ how to work with Azure Machine Learning and Visual Studio is provided in the\
    \ following section.\n\n## Install Packages\n\nTo write Python codes inside Visual\
    \ Studio, we must first install Visual Studio 2017 ( [`https://docs.microsoft.com/en-us/visualstudio/install/install-visual-studio`](https://docs.microsoft.com/en-us/visualstudio/install/install-visual-studio)\
    \ ). From File, choose the New project option. Then select Python ➤ Python Application\
    \ ➤ Put Location and click the OK button (Figure [3-3](#463840_1_En_3_Chapter.xhtml#Fig3)).\n\
    \n![../images/463840_1_En_3_Chapter/463840_1_En_3_Fig3_HTML.jpg](images/463840_1_En_3_Chapter/463840_1_En_3_Fig3_HTML.jpg)\n\
    \nFigure 3-3\n\nCreating a Python application in Visual Studio 2017\n\nTo extend\
    \ the capability of Python programming, you must install some additional packages.\
    \ Each package has different functions that offer us more functionality in working\
    \ with Python. To install packages in Visual Studio, we must click View ➤ Other\
    \ Windows ➤ Python Environment (Figure [3-4](#463840_1_En_3_Chapter.xhtml#Fig4)).\n\
    \n![../images/463840_1_En_3_Chapter/463840_1_En_3_Fig4_HTML.jpg](images/463840_1_En_3_Chapter/463840_1_En_3_Fig4_HTML.jpg)\n\
    \nFigure 3-4\n\nPython environment in Visual Studio 2017\n\nIn Python Environments,\
    \ select Python version 3.6. In another tab, select Packages. In the search area,\
    \ type the package name (Figure [3-5](#463840_1_En_3_Chapter.xhtml#Fig5)). For\
    \ example, to install Pandas, click `pip install pandas` from PyPi.\n\n![../images/463840_1_En_3_Chapter/463840_1_En_3_Fig5_HTML.jpg](images/463840_1_En_3_Chapter/463840_1_En_3_Fig5_HTML.jpg)\n\
    \nFigure 3-5\n\nInstalling packages in Python\n\nAfter installing the package,\
    \ you will see a message in the output. Figure [3-6](#463840_1_En_3_Chapter.xhtml#Fig6)\
    \ shows that the Panda package has been installed successfully.\n\n![../images/463840_1_En_3_Chapter/463840_1_En_3_Fig6_HTML.jpg](images/463840_1_En_3_Chapter/463840_1_En_3_Fig6_HTML.jpg)\n\
    \nFigure 3-6\n\nInstalling packages output result\n\nAfter installing the package,\
    \ you will be able to check that it has been installed. In the interactive Python\
    \ version 3.6, write the following codes, to check whether Pandas packages have\
    \ been installed.\n\n```\nimport pandas\nprint('pandas: {}'.format(pandas.__version__))\n\
    ```\n\nNow we must test the environment, to make sure that the packages have been\
    \ installed successfully. You can run the code in a different environment. As\
    \ you can see from Figure [3-7](#463840_1_En_3_Chapter.xhtml#Fig7), it is possible\
    \ to run the code in Anaconda 5.0.1, Python 3.6, and ProjectApplication 1.\n\n\
    ![../images/463840_1_En_3_Chapter/463840_1_En_3_Fig7_HTML.jpg](images/463840_1_En_3_Chapter/463840_1_En_3_Fig7_HTML.jpg)\n\
    \nFigure 3-7\n\nRunning Python code inside Visual Studio in different environments\n\
    \n## Python for Statistical Summary\n\nThe first step in doing any machine learning\
    \ or statistical analysis is to summarize the data set. We are going to look at\
    \ the data set with regard to dimensions, statistical summary of columns, and\
    \ peek at the data. We can access a data resource about cars from the following\
    \ link: [`https://archive.ics.uci.edu/ml/machine-learning-databases/auto-mpg/auto-mpg.data`](https://archive.ics.uci.edu/ml/machine-learning-databases/auto-mpg/auto-mpg.data).\n\
    \nWe are going to load data directly from the web site, then assign a name to\
    \ each column. Assigning a name to each column will help us to explore the data\
    \ better. Then we will use the Panda package to load and read the data.\n\n```\n\
    URL = \"https://archive.ics.uci.edu/ml/machine-learning-databases/auto-mpg/auto-mpg.data\"\
    \nnames = ['MPG', 'Cyl', 'Disp', 'HorsePower', 'Weight','Acceleration','Model\
    \ Year','Origin','Car Name']\ndataset = pandas.read_csv(URL, names=names)\n```"
