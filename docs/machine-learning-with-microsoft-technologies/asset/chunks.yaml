    \ override\n```\n\n现在，如果我们再次运行图 9-5 中的代码，我们将得到另一个结果（图 9-6）。\n\n![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig6_HTML.jpg](img/463840_1_En_9_Fig6_HTML.jpg)\n\
