    ### Python for Visualization


    Python allows users to create charts. It offers a variety of options for visualizing
    data. `Matplotlib` is the main package for visualization in Python. It is very
    powerful and can be used for complex charts. `Matplot` was the first visualization
    library, and other tools, such as `Seaborn`, `ggplot`, `Bokeh`, and so forth,
    have been built on top of it (see [`https://blog.modeanalytics.com/python-data-visualization-libraries/`](https://blog.modeanalytics.com/python-data-visualization-libraries/)
    ).


    The `ggplot2` package is also available in Python. `ggplot2` is based on R’s plotting
    system. It works based on layers.


    `Bokeh` is another library similar to `ggplot2`, but it is native to Python. It
    helps developers to draw interactive and web-based charts.


    `Plotly` is an online data visualization tool that is useful for creating interactive
    charts. `Plotly` can be used both in R and Python.


    ### Python for Machine Learning


    Python is a simple, elegant, and consistent language. It is more readable compared
    to R, for example.


    Python is especially popular in applied data science. It has different packages
    for machine learning, such as `NumPy`, `Pandas`, `Keras`, `TensorFlow`, and so
    forth. However, it is a general-purpose language that can be used for data engineering,
    web site scraping, web application building, and so forth.


    ## Summary


    This chapter provided an overview of Python and related software and discussed
    how we can use it to perform machine learning.


    # 4. R Visualization in Power BI


    Power BI is a self-service business intelligence (BI) software. This tool can
    be used for data visualization, data cleaning, modeling, analysis, and collaboration
    at enterprise scale. Many books and blogs have been published about how to use
    Power BI. In this chapter, I am going to show how we can leverage R to create
    better visualizations and get additional value from Power BI. In this chapter,
    I will explain how to set up R within Power BI, how to draw charts in Power BI
    using R scripts, how to set up the Power BI report environment, how to set up
    Power BI to write R code, and how to draw R charts in Power BI.


    ## Power BI


    The Power BI report environment helps us to visualize data. According to Dr. Abela
    [[1](#463840_1_En_4_Chapter.xhtml#Par84)], there are four main purposes of data
    visualization, as follows and represented graphically in Figure [4-1](#463840_1_En_4_Chapter.xhtml#Fig1):


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig1_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig1_HTML.jpg)


    Figure 4-1


    Data visualization diagram [[1](#463840_1_En_4_Chapter.xhtml#Par84)]


    1. Data comparison

    2. Data relationship

    3. Data composition

    4. Data distribution


    Power BI Desktop is a free application that you can download from [`https://powerbi.microsoft.com/en-us/desktop/`](https://powerbi.microsoft.com/en-us/desktop/)
    . The Power BI Visualizations panel supports most of the charts suggested in Figure
    [4-1](#463840_1_En_4_Chapter.xhtml#Fig1). It is possible to extend the visualization
    capabilities, by importing custom visuals from the marketplace or other sources.


    Power BI Desktop helps users to get data from different sources with the Get Data
    options (Figure [4-2](#463840_1_En_4_Chapter.xhtml#Fig2)). To learn more about
    Power BI, go to [`http://radacad.com/online-book-power-bi-from-rookie-to-rockstar`](http://radacad.com/online-book-power-bi-from-rookie-to-rockstar)
    .


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig2_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    Power BI Visualizations environment


    ### Setting Up R in Power BI


    To draw an R chart in Power BI, the first step is to install at least one R version
    or Microsoft R Open. Now we must specify what R version we are going to use. To
    do this, we click the File menu, then click Options and Settings, then Options.
    Under the Global option, click R Scripting, to specify the R version (Figure [4-3](#463840_1_En_4_Chapter.xhtml#Fig3)).


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig3_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig3_HTML.jpg)


    Figure 4-3


    Setting up the R environment in Power BI


    As mentioned in Chapter [3](#463840_1_En_3_Chapter.xhtml), R is based on packages.
    Whenever you use a specific package, you must install it on your machine first.
    (If you are using Power BI Desktop, most of the packages are already installed
    in the service.) You can install packages using an R IDE, e.g., R Studio. Then,
    in the Power BI R editor, you must refer to that package. Moreover, you ensure
    that you are using the right version of the R package that you already installed
    (Figure [4-4](#463840_1_En_4_Chapter.xhtml#Fig4)).


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig4_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig4_HTML.jpg)


    Figure 4-4


    Specifying an R version and environment in Power BI'
