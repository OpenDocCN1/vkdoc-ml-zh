    **Figure 18-15** Sentiment analysis result in Power BI Desktop


    The process of using the other features, such as language detection and key phrase
    extraction, is the same. Only the URL end point will change slightly. For language
    detection, the end point URL will change as follows:


    ```

    endpoint    = "https://.api.cognitive.microsoft.com/text/analytics/v2.0/languages",

    ```


    For key phrase extraction, the end point URL would be:


    ```

    endpoint    = "https://.api.cognitive.microsoft.com/text/analytics/v2.0/keyPhrases"

    ```


    In addition, the last line of code will change to show a different variable. For
    language detection, this would be as follows:


    ```

    language    = jsonresp[documents]{0}[detectedLanguages]{0}[name]

    in  language

    ```


    For the key phrase, it would be as follows:


    ```

    keyphrases  = Text.Lower(Text.Combine(jsonresp[documents]{0}[keyPhrases], ", "))

    in  keyphrases

    ```


    The preceding example was about using Cognitive Services in Power BI. In the next
    section, I will show you how to use the Face (that is, face recognition) service
    in a Windows application.


    ## Intelligence Application, Face Recognition Services


    Another feature in Cognitive Services is the Face (facial recognition) API. This
    API performs face detection from an image, in addition to emotion detection and
    finding similar facial features of faces from two images.


    It is possible to try the Face API before using it in an application. To see a
    demo, navigate to the Cognitive Services web site, then to the Vision category
    (Figure [18-16](#463840_1_En_18_Chapter.xhtml#Fig16)). Under the Vision category,
    click the Emotion recognition in images demo. To test the API, browse to a picture
    and then submit it. After uploading the image, click the Submit button.


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig16_HTML.jpg](images/463840_1_En_18_Chapter/463840_1_En_18_Fig16_HTML.jpg)


    **Figure 18-16** Cognitive Service Face Recognition


    As you can see in Figure [18-17](#463840_1_En_18_Chapter.xhtml#Fig17), after uploading
    the image, the API shows the emotion, such as anger, contempt, disgust, fear,
    happiness, neutral, sadness, and surprise, indicated by a number between 0 to
    1. As you can see in Figure [18-17](#463840_1_En_18_Chapter.xhtml#Fig17), the
    only measure that has a higher number is for happiness, and the person in the
    picture is smiling.


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig17_HTML.jpg](images/463840_1_En_18_Chapter/463840_1_En_18_Fig17_HTML.jpg)


    **Figure 18-17** Image emotion detection demo


    We are going to create a Windows application that is able to detect the image
    using the Face API in Cognitive Services.


    The process of creating the Face API is like that for Text Analytics. First, we
    must log in to the Azure portal, then search for the Face API under *AI + Machine
    Learning* (Figure [18-18](#463840_1_En_18_Chapter.xhtml#Fig18)).


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig18_HTML.jpg](images/463840_1_En_18_Chapter/463840_1_En_18_Fig18_HTML.jpg)


    **Figure 18-18** Face recognition feature in Azure


    After creating the service, click the Key tab at the left side of the page and
    grab the key (Figure [18-19](#463840_1_En_18_Chapter.xhtml#Fig19)).


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig19_HTML.jpg](images/463840_1_En_18_Chapter/463840_1_En_18_Fig19_HTML.jpg)


    **Figure 18-19** Collecting the Face API key


    We are going to create a Windows application that employs face recognition [[4](#463840_1_En_18_Chapter.xhtml#Par59)].
    To write the code, you must first download one of the free versions of Visual
    Studio 2015 or 2017 [[5](#463840_1_En_18_Chapter.xhtml#Par60)]. Then you must
    create a Windows application (Figure [18-20](#463840_1_En_18_Chapter.xhtml#Fig20)).
    For this case study, I am using Visual Studio 2015.


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig20_HTML.jpg](images/463840_1_En_18_Chapter/463840_1_En_18_Fig20_HTML.jpg)


    **Figure 18-20** Create a Windows Application


    The next step is to install the Microsoft Azure Cognitive Service Face API in
    a Windows application. To install it, we must navigate to the Tools tab, then
    navigate to NuGet Package Manager, and choose the Package Manager Console. Next,
    we must type in the following code in the console editor (Figure [18-21](#463840_1_En_18_Chapter.xhtml#Fig21)).


