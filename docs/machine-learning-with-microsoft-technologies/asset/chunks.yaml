- fmt: 'The next step is to clean the data. As you can see in Figure [12-7](#463840_1_En_12_Chapter.xhtml#Fig7),
    for the age of people on the *Titanic*, 177 rows have a missing value. One of
    main activities before creating models is to remove or substitute the missing
    values. There is a module, `Clean Missing Data`, for this. Search for it and drag
    and drop it into the Experiments area. As you can see in Figure [12-8](#463840_1_En_12_Chapter.xhtml#Fig8),
    this module has one input and two outputs. Connect the output from the Titanic
    data set to the input of the missing value module. Then specify how you want to
    solve the missing value problem, by clicking the `Missing value` module. There
    is a `Properties` page for this module, from which you can choose the column(s)
    you want to remove missing values from. Then specify the cleaning mode, such as
    substitute with a mean, median, or a custom value. It is possible to remove the
    entire missing data row or substitute it using a PCA algorithm [[2](#463840_1_En_12_Chapter.xhtml#Par56)].
    As you can see in Figure [12-8](#463840_1_En_12_Chapter.xhtml#Fig8), `Age` has
    been selected, and the `Cleaning mode` is `Remove entire row`.


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig8_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig8_HTML.jpg)


    **Figure 12-8** *Removing a missing value from data*


    Another data transformation that we should perform is to remove columns that have
    no impact on the `Survived` column, such as `PassengerID`, `Name`, and so forth.
    The only columns that we need to run machine learning on are `Age`, `Sex`, `Pclass`,
    and `Survived`. There is another module, named `Select Columns`, in `Dataset`.
    Drag and drop this module into `Experiments`, then connect the first output of
    `Clean Missing Data` to the input of `Select Columns in Dataset`. Then, in the
    `Properties` panel, choose the desired columns (Figure [12-9](#463840_1_En_12_Chapter.xhtml#Fig9)).
    Now the main data cleaning and wrangling for this data set has been done. The
    next step is to choose the related algorithms.


    The main purpose for machine learning here is to predict whether a new passenger
    will survive. According to the discussion in Chapter [4](#463840_1_En_4_Chapter.xhtml),
    we are predicting a class, not a continuous value. Predictive analytics using
    a classification approach can solve this problem. In Azure ML, there are about
    25 main algorithms that have been grouped into four main scenarios: Anomaly detection,
    Classification, Clustering, and Regression. For our scenario, we must use classification
    algorithms. If you expand the classification algorithm list, there is another
    grouping based on the number of classes you are going to predict. If there is
    a two-class problem, you must use algorithms with `Two-Class`. The problem concerns
    predicting a situation in which people survived or not.


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig9_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig9_HTML.jpg)


    **Figure 12-9** Selecting columns in a data set


    As you can see in Figure [12-10](#463840_1_En_12_Chapter.xhtml#Fig10), under `Classification`,
    we have nine different algorithms for predicting those who survived or did not.
    Each of these algorithms can be used in a different situation, with different
    data types. There is a cheat sheet for choosing the best algorithms provided by
    Microsoft [[3](#463840_1_En_12_Chapter.xhtml#Par57)]. For the *Titanic* problem,
    we don’t have more than 100 columns, the data is not linear, and we need high
    accuracy and fast training. As a result, I am choosing the `Two-Class Boosted
    Decision Tree` algorithm. However, the best practice is to select different algorithms
    and then compare their accuracy.


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig10_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig10_HTML.jpg)


    **Figure 12-10** Machine learning algorithms in Azure ML


    Following the machine learning life cycle introduced in Chapter [4](#463840_1_En_4_Chapter.xhtml),
    we have to split the data, some for the purpose of training and the rest for testing.
    In Azure ML, there are three different modules that are used for splitting data,
    training models, and testing models: `Split Data`, `Train Model`, and `Score Model`.
    First, I drag and drop the `Split Data` (Figure [12-11](#463840_1_En_12_Chapter.xhtml#Fig11)).
    `Split Data` allows us to specify how much data should go into training and how
    much into testing. As you can see in Figure [12-11](#463840_1_En_12_Chapter.xhtml#Fig11),
    the `Split Data` has been connected to the output of the `Select Columns in Dataset`.
    The split percentage has been set to 0.7 (30% for testing and 70% for training).
    One of the output nodes is for training, and the other is for testing.


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig11_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig11_HTML.jpg)


    **Figure 12-11** Split Data for machine learning purposes


    We must drag and drop the relevant module for training and testing into `Experiments`.
    As you can see in Figure [12-12](#463840_1_En_12_Chapter.xhtml#Fig12), the right
    output from the split module has been connected to `Train Model`, and the other
    output from the `Split Data` has been connected to `Score Model`. Moreover, under
    the `Train Model` properties, the `Survived` column has been selected.


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig12_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig12_HTML.jpg)


    **Figure 12-12** Dragging and dropping the `Train Model` and `Score Model` into
    `Experiments`


    Now we are able to run the code, to see the result of the prediction from the
    `Score Model` output. To run it, click the `Run` button at the bottom of the page.
    After running the experiments, we will be able to see the result of the test data
    prediction in the output of the `Score Model` module. Right-click the output and
    visualize the data (Figure [12-13](#463840_1_En_12_Chapter.xhtml#Fig13)).


    ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig13_HTML.jpg](images/463840_1_En_12_Chapter/463840_1_En_12_Fig13_HTML.jpg)


    **Figure 12-13** *The prediction result for* Titanic *example*


    It is possible to evaluate the model using `Evaluate Model`, to check the accuracy
    of the created model. In the next section, the process of creating an application
    programming interface (API) will be explained.'
