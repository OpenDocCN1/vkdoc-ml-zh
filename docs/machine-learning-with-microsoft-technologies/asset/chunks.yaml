    We must refine the code a bit, by removing the last line `in Source`. So, the
    final code will be


    ```

    (#"Source Table" as table,#"Prediction Column"as text) as table=>

    let

    Source = #"Source Table",

    #"Run R Script" = R.Execute("# ''dataset'' holds the input data for this script#(lf)library(rpart)
    #(lf)numrows<-nrow(dataset)#(lf)sampledata<-sample(numrows,0.8∗numrows)#(lf)train<-dataset[sampledata,]#(lf)test<-dataset[-sampledata,]#(lf)DT<-rpart(
    "&#"Prediction Column"&"~ .,data=train,method=""class"")#(lf)prediction<-predict
    (DT,test)#(lf)rpartresult<-data.frame(prediction,test)",[dataset=Source]),

