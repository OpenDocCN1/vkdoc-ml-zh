    Figure [1-6](#463840_1_En_1_Chapter.xhtml#Fig6) shows how all the Azure components
    interact with other Azure tools, to expedite the process of machine learning development.


    ![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig6_HTML.jpg](images/463840_1_En_1_Chapter/463840_1_En_1_Fig6_HTML.jpg)


    Figure 1-6


    Microsoft Azure components offering different possibilities for performing machine
    learning


