    Figure 13-15


    Creating output for Power BI in Stream Analytics


    After creating Stream Analytics input and output and before creating the query,
    we must set up some keys and names in the .NET code. Click the Stream Analytics
    components, then `Shared access policies`. Click `RootManageSharedAccessKey`,
    then copy the Primary Key (Figure [13-16](#463840_1_En_13_Chapter.xhtml#Fig16)).


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig16_HTML.jpg](images/463840_1_En_13_Chapter/463840_1_En_13_Fig16_HTML.jpg)


    Figure 13-16


    Key for shared access


    Copy the data and then paste it in the main code section shown in Figure [13-11](#463840_1_En_13_Chapter.xhtml#Fig11).


    ## Azure ML


    In Azure ML Studio, I have created a simple model for grouping data. The main
    aim of this model is to fetch data from the application, then group it into four
    main groups. Next, I create an API, so that Stream Analytics is able to pass data
    to it and get the group number and the real value. Import the sample data that
    the application is going to generate (Figure [13-17](#463840_1_En_13_Chapter.xhtml#Fig17)).
    The sample data has been included in the book materials for Chapter [13](#463840_1_En_13_Chapter.xhtml).
    Then drag and drop the `Select Columns in Dataset` component to the selected value
    column. Finally, leverage another component named `Group Data into Bins`.


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig17_HTML.jpg](images/463840_1_En_13_Chapter/463840_1_En_13_Fig17_HTML.jpg)


    Figure 13-17


    Azure ML model


    Take the following steps, to generate an API for this model.


    1.  Run the model using the `Run` option at the bottom of the page.

    2.  Click `Setup Page`, to create input and output for the API (Figure [13-18](#463840_1_En_13_Chapter.xhtml#Fig18)).

    3.  Then, run the model again and click `Deploy Web Service`.


    After creating a web service, a new page will be shown. On the new page, in the
    middle of the page, the API key for the web service appears.


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig18_HTML.jpg](images/463840_1_En_13_Chapter/463840_1_En_13_Fig18_HTML.jpg)


    Figure 13-18


    Azure ML web service creation


    To connect from Stream Analytics to the Azure ML API, we must click `APPs` (at
    the bottom of the page), then click `Excel 2010` or an earlier workbook (Figure
    [13-19](#463840_1_En_13_Chapter.xhtml#Fig19)). A new Excel workbook will be downloaded.
    Open the Excel file, then, at the top of the page, you will see the web service
    URL and access key.


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig19_HTML.jpg](images/463840_1_En_13_Chapter/463840_1_En_13_Fig19_HTML.jpg)


    Figure 13-19


    Azure ML web service creation


    Copy the code for the web service URL and the access key (Figure [13-20](#463840_1_En_13_Chapter.xhtml#Fig20)).


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig20_HTML.jpg](images/463840_1_En_13_Chapter/463840_1_En_13_Fig20_HTML.jpg)


    Figure 13-20.


    Access key and URL in Excel file


    Now that we have the keys and URL, we must set up a function in Stream Analytics,
    to access the created model in Azure ML Studio.


    ## Stream Analytics Function


    At this stage, we have created an Event Hub application to generate a random number,
    Stream Analytics, and an Azure ML model and API to group the streamed data.


    In this section, we must create a function inside Stream Analytics to call the
    created API in Azure ML. Click Azure Stream Analytics job, then click `Functions`
    (Figure [13-21](#463840_1_En_13_Chapter.xhtml#Fig21)).


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig21_HTML.jpg](images/463840_1_En_13_Chapter/463840_1_En_13_Fig21_HTML.jpg)


    Figure 13-21


    Creating a function in Azure Stream Analytics


    On the `Functions` page, select the subscription name, the key, and URL extracted
    from the Excel file (Figure [13-22](#463840_1_En_13_Chapter.xhtml#Fig22)).


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig22_HTML.jpg](images/463840_1_En_13_Chapter/463840_1_En_13_Fig22_HTML.jpg)


    Figure 13-22


    Creating a function


    On the Stream Analytics main page, we must add some code in Query Editor, to call
    the function. Click `Edit Query`, then in the editor, paste the following code:


    ```

    WITH MLStreamAnalytics AS (

    SELECT value, MLStreamAnalytics(value) as result

    FROM azureml

    )

    SELECT

    value, result.[value_quantized]

    INTO

    MLoutput

    FROM

    MLStreamAnalytics

    ```


    The first part of the code is for calling the function and getting the result
    from it. As you can see in Figure [13-23](#463840_1_En_13_Chapter.xhtml#Fig23),
    the first part of the code is about creating a temporary table to call the `MLStreamAnalytics(value)`.
    The next step is about getting the data from the Event Hub component (from Azure
    ML).


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig23_HTML.jpg](images/463840_1_En_13_Chapter/463840_1_En_13_Fig23_HTML.jpg)


    Figure 13-23


    Edit Query in Stream Analytics


    The second part of the code gets the data from a function in Azure Stream Analytics
    and passes the data to the Power BI component (`MLoutput`).'
