  trans: '

    ## 使用 R 脚本进行数据转换


    并非所有数据转换都能通过 Power Query 中的现有菜单轻松完成。为了提升数据转换能力，我们可以在 Power Query 内部使用 R 语言。Kaggle
    网站（[`https://www.kaggle.com/lbronchal/breast-cancer-dataset-analysis`](https://www.kaggle.com/lbronchal/breast-cancer-dataset-analysis)）上有一个关于女性乳腺癌的数据集。该数据集包含
    569 行和 32 列。第一列是患者 ID，第二列是诊断结果。其余列与癌细胞的规格相关。


    第 2 列到第 32 列包含一些数值，但这些数值不在同一范围内。例如，“radius_mean”列的值范围是 6.9 到 22，而“compactness_mean”列的值范围是
    0.019 到 0.34。还有另一种数据准备过程，称为归一化，用于将数据统一到同一尺度。这个过程对某些算法（如 lKNN）很有用；但并非总是推荐使用（见图
    6-22）。


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig22_HTML.jpg](img/463840_1_En_6_Fig22_HTML.jpg)


    图 6-22


    与女性乳腺癌相关的数据集


    ### 归一化


    数据归一化意味着将数据调整到特定范围内，例如 0 到 1。我将使用一种遵循“MinMax”方法的公式来归一化名称。在此示例中，我将把癌症数据集中所有列的数据（患者
    ID 和诊断列除外，因为它们包含文本）调整到 0 到 1 的范围内。


    首先，对于每一列，我们必须找到最小值和最大值。对于每个值，我们必须按如下公式进行计算：


    ![$$ Normalize\ value=\left(\frac{\min (x)-x}{\max (x)-\min (x)}\right) $$](img/463840_1_En_6_Chapter_TeX_Equa.png)


    我们可以使用 Power Query 中的 R 语言将此转换应用于数据。


    在 Power Query 中，有一个用于编写 R 代码的选项：运行 R 脚本（图 6-23）。


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig23_HTML.jpg](img/463840_1_En_6_Fig23_HTML.jpg)


    图 6-23


    在 Power Query 中运行 R 脚本


    “运行 R 脚本”编辑器并非十分高级。您想要转换的数据存储在变量名 `dataset` 下。


    因此，我们将使用 `dataset` 变量和归一化数据的公式。


    在 R 中，我将编写一个函数来放置 MinMax 公式。


    ```

    Normalize<- function (x)

    {

    return ((x-min(x))/(max(x)-min(x)))

    }

    ```


    然后，我必须将此函数应用于数据集。为此，我必须使用 R 中的另一个函数，名为 `lapply`。


    `lapply` 函数接收数据集和归一化函数的名称。然后，它将函数应用于数据集。在我的示例中，您不需要对第一列和第二列应用 MinMax 归一化，因此只需使用
    `dataset[3:32]` 而不是 `dataset`。


    ```

    NormalizedData<-as.data.frame(lapply(dataset[3:32],Normalize))

    ```


    如图 6-24 所示，编写代码后，我们需要按下“确定”按钮。Power Query 将对数据应用归一化转换。


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig24_HTML.jpg](img/463840_1_En_6_Fig24_HTML.jpg)


    图 6-24


    R 脚本编辑器


    运行代码后，数据转换的结果如图 6-25 所示。您可以在“运行 R 脚本”中看到已应用的步骤。


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig25_HTML.jpg](img/463840_1_En_6_Fig25_HTML.jpg)


    图 6-25


    归一化后的数据


    ## 其他数据转换


    还有其他使用 Power Query 转换数据的方法。


    ### 更改数据类型


    要更改 Power Query 中的数据类型，请单击“数据类型”选项并选择正确的数据类型。同样，您也可以通过单击每列旁边的图标来更改数据类型（图 6-26）。


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig26_HTML.jpg](img/463840_1_En_6_Fig26_HTML.jpg)


    图 6-26


    更改数据类型


    ### 分组依据


    在 Power Query 中，我们还可以通过特定的聚合选项对数据进行分组。首先，我们必须单击要按其分组数据的列。然后，我们单击菜单中的“分组依据”图标（图
    6-27）。在“分组依据”窗口中，我们在“操作”下选择所需的分组依据选项和聚合类型。接下来，我们选择“求和”作为聚合选项。


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig27_HTML.jpg](img/463840_1_En_6_Fig27_HTML.jpg)


    图 6-27


    使用特定聚合进行分组


    最后，数据将按类型值进行分组（图 6-28）。


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig28_HTML.jpg](img/463840_1_En_6_Fig28_HTML.jpg)


    图 6-28


    聚合后的结果数据


    还有许多其他类型的数据转换，例如基于分隔符拆分列、转置行、更改数据类型、添加日期或时间列、包含一些统计计算、合并列等等。在“添加列”选项卡下，可以添加自定义列、从示例创建列、创建函数、格式化数据列、添加日期、月份、天数、时间等列。此外，还可以使用
    M 语言转换数据，但这超出了本书的范围。


    ## 总结


    本章简要介绍了如何在 Power Query 编辑器中使用 R 语言。它解释了我们如何使用它来重塑数据、选择数据、使用 R 代码编写数学函数并将其应用于数据集等。在
    Power Query 编辑器中，R 或 Python 还有其他用途，例如使用 R 进行正则表达式处理，或使用 R 和 Python 进行机器学习。下一章将介绍更多在
    Power Query 编辑器中使用 R 的示例。


    # 7. 在 Power Query 中使用 R 进行预测分析


    本章将解释如何通过编写 R 代码在 Power BI Query 编辑器中进行机器学习。主要目的是提供一些示例，说明我们如何使用 R 代码进行预测分析（分类和回归）。将提供与某些算法相关的概念和代码。此外，还将讨论通过
    Power BI Query 编辑器中的参数自动化预测的过程。

    '
- fmt: '# Neural Networks


    What we expect from a computer is that we provide some inputs and then receive
    outputs that match our needs. Scientists try to mimic the human brain by creating
    an intelligence machine—a machine that does the same reasoning as humans.


    The most important element of the human brain is neurons. Human brains consist
    of 75 million neurons. Each neuron is connected to others via synapses. So what
    we have in a neural network are some nodes that are connected to one another.
    In the human body, if a neuron is triggered by some external element, it will
    pass the message from the receiver node to other nodes, via synapsis. (Figure
    [7-1](#463840_1_En_7_Chapter.xhtml#Fig1)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig1_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig1_HTML.jpg)


    Figure 7-1


    Neural system


    Neural networks mimic the same concepts as the human brain. One node gets some
    input from the environment, and the neural network model creates outputs that
    produce the result just as a computer system would (Figure [7-2](#463840_1_En_7_Chapter.xhtml#Fig2)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig2_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig2_HTML.jpg)


    Figure 7-2


    Computer system architecture


    In a neural network there is a


    * Set of inputs nodes

    * Set of output nodes

    * Some processing in the middle, to achieve a good result

    * A flow of information

    * A connection between nodes


    Some of the connections are more important than others, meaning that they have
    a greater impact on the results than others. In neural networks, we refer to this
    importance as the connections’ *weights*.


    Another analogy that better expresses the goal of a neural network is the descent
    after climbing a mountain. When we reach the summit and the weather is foggy,
    we are only able to see one meter ahead. We must decide which direction to choose
    with only one meter of visibility. We take a first step based on the location,
    again deciding which direction to follow and taking other steps. So, with each
    step we are evaluating the course and choosing the best way to come down from
    the mountain (Figure [7-3](#463840_1_En_7_Chapter.xhtml#Fig3)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig3_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig3_HTML.jpg)


    Figure 7-3


    Neural network comparison with mountain climbing


    Each decision can be viewed as a node that leads us to a better and faster resolution.
    In a neural network, there are some hidden nodes that perform the main task. They
    find the best value for the output while using a function called an activation
    function.


    In this section, I am going to refer to an example from *Machine Learning with
    R* [[1](#463840_1_En_7_Chapter.xhtml#Par67)]. The example is about predicting
    the strength of concrete. The concrete has been used in many different structures,
    such as a bridge, apartment, roadways, and so on. For safety, the strength of
    the concrete is critical. The concrete’s strength depends on the material used
    to create it, such as cement, slag, ash, water, and so forth. We have a data set
    of the ingredients of the concrete (Figure [7-4](#463840_1_En_7_Chapter.xhtml#Fig4)).
    You can download it from “Machine Learning with R datasets” [[2](#463840_1_En_7_Chapter.xhtml#Par68)].


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig4_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig4_HTML.jpg)


    Figure 7-4


    Concrete data set


    A neural network can be used for predicting a value or class, or it can be used
    for predicting multiple things. In our example, we are going to predict a value,
    that is, the strength of concrete. First, we load the data in Power BI, and in
    Query Editor, we write some R codes. Then we must make some data transformations
    (Figure [7-5](#463840_1_En_7_Chapter.xhtml#Fig5)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig5_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig5_HTML.jpg)


    Figure 7-5


    Pivot using Python codes


    As you can see in Figure [7-5](#463840_1_En_7_Chapter.xhtml#Fig5), in the sections
    labeled 2, 3, and 4 (circled in red), data is not on the same scale. We must impose
    some data normalization before applying any machine learning. The process of data
    normalization is explained in Chapter [6](#463840_1_En_6_Chapter.xhtml). The same
    code is used to normalize the data here.


    ```

    normalize <- function(x) {

    return((x - min(x)) / (max(x) - min(x)))

    }

    concrete_norm <- as.data.frame(lapply(dataset, normalize))

    ```


    After data cleaning and data transformation, we must separate in the data set
    some parts for training and some for testing. This process helps the model to
    learn from data and to mimic the data behavior. Therefore, we must devote more
    than 70% of the data for training and the rest for testing. To avoid bias, we
    must shuffle the data. A sample function in R has been used to create random row
    numbers for the data set. In addition, 80% of the data has been put in the training
    data set and the rest reserved for testing.


    ```

    nrows<-nrow(dataset)

    sampledata<-sample(nrows,0.8∗nrows)

    concrete_train <- concrete_norm[sampledata,]

    concrete_test <- concrete_norm[-sampledata,]

    ```


    There are many packages and algorithms for using neural network algorithms in
    R. One such package is `neuralnet`. This package contains a function for a neural
    network algorithm. To use this package, we must install it in RStudio, using `install.packages()`
    first. After installing the package, we only have to refer to the `vis` package
    `library` command .


    ```

    library("neuralnet")

    ```


    The next step is to create a training model using the training data set and identifying
    which column we are going to predict.


    ```

    concrete_model <- neuralnet(strength ~ cement + slag

    + ash + water + superplastic + coarseagg + fineagg + age,

    data = concrete_train)

    ```


    Now that the model is created, we can test it for accuracy. We are going to run
    the model against the training data set for all eight attributes.


    ```

    model_results <- compute(concrete_model, concrete_test[1:8])

    predicted_strength <- model_results$net.result

    ```


    And we must create an output data set to show to the user.


    ```

    output<-dataset[-sampledata,]

    output$Pred<-predicted_strength∗100

    ```


    The result will be stored in an output variable that is in a data frame structure.
    Another important consideration is that Power Query only recognizes the `data.
    Frame` format. So, other data structures, such as vectors, lists, and matrices
    cannot be shown in the Power Query editor (Figure [7-6](#463840_1_En_7_Chapter.xhtml#Fig6)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig6_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig6_HTML.jpg)


    Figure 7-6


    Prediction result


    It is possible to see the neural network structure in the visualization area,
    to see the hidden node, layer, and so forth. Therefore, we must duplicate the
    data set for concrete in Power BI Report, using the R custom visual, as shown
    in Figure [7-7](#463840_1_En_7_Chapter.xhtml#Fig7). Next, we must write the same
    codes for neural network prediction and add another line for plotting the model.
    Run the code, and you will see the neural network structure that has just appeared
    on the layer, and the error is 3.001.


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig7_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig7_HTML.jpg)


    Figure 7-7


    Neural network model structure in Power BI Report


    ```

    normalize <- function(x) {

    return((x - min(x)) / (max(x) - min(x)))

    }

    concrete_norm <- as.data.frame(lapply(dataset, normalize))

    summary(concrete_norm$strength)

    concrete_train <- concrete_norm[1:773,]

    concrete_test <- concrete_norm[774:1030,]

    library("neuralnet")

    concrete_model <- neuralnet(strength ~ cement + slag

    + ash + water + superplastic + coarseagg + fineagg + age,

    data = concrete_train)

    plot(concrete_model)

    ```


    We can mitigate the error by changing the number of hidden nodes and layers.'
