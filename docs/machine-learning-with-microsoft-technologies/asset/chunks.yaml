  trans: '

    ### 切片与切块


    R 可视化具有交互性，可以对它们进行切片和切块。我们将使用一个切片器来切分分面图。同时，我们还会在报表区域插入一个年份切片器，以筛选 R 可视化对象（图 4-15）。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig15_HTML.jpg](img/463840_1_En_4_Fig15_HTML.jpg)


    图 4-15


    对 R 可视化对象进行切片和切块


    ### 在 RStudio 中编辑 R 代码


    可以在 RStudio 中打开包含数据的代码。此外，还可以选择使用我们已有的数据在 RStudio 中运行 R 代码（图 4-16）。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig16_HTML.jpg](img/463840_1_En_4_Fig16_HTML.jpg)


    图 4-16


    运行 R 代码


    点击“运行”选项后，RStudio 中将打开一个包含汽车相关数据的页面。导入的数据集包含了数据的所有变更（图 4-17）。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig17_HTML.jpg](img/463840_1_En_4_Fig17_HTML.jpg)


    图 4-17


    在 RStudio 中打开 R 代码


    ## 自定义可视化对象


    使用自定义可视化对象是扩展 Power BI 可视化能力的另一种方式。有两种方法可以访问自定义可视化对象：


    1.  使用 Office 商店中已有的自定义可视化对象


    2.  创建自定义可视化对象


    ### Power BI Office 商店中的自定义可视化对象


    Office 商店为 Power BI 用户提供了多种自定义可视化对象。要访问它们，您必须首先登录您的工作账户（图 4-18）。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig18_HTML.jpg](img/463840_1_En_4_Fig18_HTML.jpg)


    图 4-18


    登录 Power BI 账户


    然后，在 Power BI 可视化窗格中，点击三个点，选择“从商店导入”选项（图 4-19）。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig19_HTML.jpg](img/463840_1_En_4_Fig19_HTML.jpg)


    图 4-19


    从 Power BI 商店导入可视化对象


    接下来，您将看到一个标题为“Power BI 自定义可视化对象”的页面。这里列出了许多类别，例如筛选器、KPI、地图、高级分析、时间、仪表、信息图和数据可视化（图
    4-20）。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig20_HTML.jpg](img/463840_1_En_4_Fig20_HTML.jpg)


    图 4-20


    Power BI 自定义可视化对象窗格


    如前所述，Power BI 自定义可视化对象包含一个“高级分析”类别。点击它，您将看到诸如时间序列、关联规则、聚类等高级分析功能。我将使用其中一个自定义可视化对象来预测牛奶产量。


    第一步是将牛奶数据集导入 Power BI Desktop。该数据包含两列：牛奶生产日期和牛奶产量值（图 4-21）。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig21_HTML.jpg](img/463840_1_En_4_Fig21_HTML.jpg)


    图 4-21


    牛奶产量数据


    现在，我们必须从 Power BI 自定义可视化对象中导入自定义可视化对象，以预测牛奶产量（图 4-22）。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig22_HTML.jpg](img/463840_1_En_4_Fig22_HTML.jpg)


    图 4-22


    高级分析时间序列自定义可视化对象


    导入自定义可视化对象后，您会看到它已添加到标准可视化面板中（图 4-23）。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig23_HTML.jpg](img/463840_1_En_4_Fig23_HTML.jpg)


    图 4-23


    预测自定义可视化对象


    导入预测自定义可视化对象后，我们现在必须为数据字段选择日期和值。


    此自定义可视化对象使用指数平滑算法来预测未来十个月的牛奶产量（图 4-24）。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig24_HTML.jpg](img/463840_1_En_4_Fig24_HTML.jpg)


    图 4-24


    预测牛奶产量


    预测图表中，黄色部分表示前几个月的实际牛奶产量数据，红色部分表示后十个月的预测数据。


    背后的算法是不可访问的，我们只能更改参数（图 4-25）。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig25_HTML.jpg](img/463840_1_En_4_Fig25_HTML.jpg)


    图 4-25


    预测未来十个月的牛奶产量


    Power BI 中的自定义可视化对象扩展了使用不同图表的可能性。然而，由微软团队创建的自定义可视化对象数量是有限的。为了扩展可视化能力，有一种方法可以通过使用
    R 脚本来创建自定义可视化对象。在下一节中，我将解释创建自定义可视化对象的过程。

    '
- fmt: "### Creating Custom Visuals\n\nSome of the main Power BI standard visuals\
    \ in Power BI Desktop are widely used. However, as mentioned in the previous section,\
    \ it is possible to extend these with custom visuals. To access the custom visuals,\
    \ you must click Market Place in Power BI Desktop. There are two ways to create\
    \ custom visuals using Java scripts or R codes.\n\nI will explain briefly the\
    \ process of creating custom visuals by using R codes.\n\n1. The first step is\
    \ to install NodeJS from [`https://nodejs.org/`](https://nodejs.org/).\n2. Next,\
    \ install Power BI visuals tools using the command prompt (Figure 4-26):\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig26_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig26_HTML.jpg)\n\
    \n**Figure 4-26** Installing Power BI custom visuals via the command prompt\n\n\
    ```\nnpm install -g powerbi-visuals-tools\n```\n\n3. After installing the Power\
    \ BI custom visuals, to ensure that they are properly installed, we must run the\
    \ `pbiviz` command. After running this command, the information about Power BI\
    \ Custom Visual Tool will be shown in the command prompt console (Figure 4-27).\n\
    \n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig27_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig27_HTML.jpg)\n\
    \n**Figure 4-27** Confirming Power BI custom visuals\n\n4. Next, we must create\
    \ an `rhtml` template. To create a template folder, we first must create an empty\
    \ folder in the C drive. After creating a new folder with the name `CustomVisual`\
    \ in the C folder, then, using the command prompt, we must change the directory\
    \ to `C:\\CustomVisual`. From the command prompt, we run the following code:\n\
    \n```\npbiviz new sampleRHTMLVisual -t rhtml\n```\n\nBy running the code, a folder\
    \ with the name `sampleRHTMLVisual` will be created in `CustomVisual` folder.\
    \ In this folder, there is an R file with the name `script.r` (Figure 4-28).\n\
    \n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig28_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig28_HTML.jpg)\n\
    \n**Figure 4-28** A sample folder for custom visuals\n\nThis is a folder that\
    \ provides a template with which to create other R custom visuals. Check the file\
    \ `script.R` inside the folder (Figure 4-29).\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig29_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig29_HTML.jpg)\n\
    \n**Figure 4-29** R codes inside the script file\n\nNow, as you can see in the\
    \ code in Figure 4-29, we require two libraries, Plotly and ggplot2, to draw a\
    \ simple ggplot2 chart with Plotly.\n\nHere, the data set has been hard-coded\
    \ for `iris`, which is an open source data set in R. The plot gets the data from\
    \ the `iris` data set and shows the petal and the length and species of the flower.\
    \ Then we use the `ggplotly` function to show the data.\n\nAs a result, we have\
    \ an R script. Now I first will create a package from this, then I will write\
    \ my codes to create different charts. Hence, I return to the command prompt and\
    \ type `pbiviz package` in the folder (Figure 4-30).\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig30_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig30_HTML.jpg)\n\
    \n**Figure 4-30** Creating a custom visual in the command prompt\n\n5. Open the\
    \ custom visual in the Power BI file. To do this, we must select the Import from\
    \ file option in the Visualizations standard panel (Figure 4-31).\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig31_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig31_HTML.jpg)\n\
    \n**Figure 4-31** Importing a custom visual into Power BI\n\n6. After choosing\
    \ the Import from file option, we must browse the `sampleRHTMLVisual` folder and\
    \ look for the `dist` folder. In this folder, there is a `pbiviz` file with the\
    \ folder name. We must import this file into the Power BI Visualizations panel\
    \ (Figure 4-32).\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig32_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig32_HTML.jpg)\n\
    \n**Figure 4-32** Imported custom visual\n\n7. The last step is to drag and drop\
    \ the custom visual into the Power BI report area (Figure 4-33). The visual is\
    \ not related to the specific data.\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig33_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig33_HTML.jpg)\n\
    \n**Figure 4-33** Custom visual with R code\n\nWe can change the R code and create\
    \ a custom visual with a different name and icon. In another example, I am going\
    \ to create a table chart. (I already explained the R codes for this earlier in\
    \ the chapter.)\n\nFirst, we must return to the `sampleRHTMLVisual` folder we\
    \ have from the sample Power BI package, then copy the folder, to create a new\
    \ custom visual. We change the name of the folder to `TableChart`. There is a\
    \ `pbiviz` file here that contains information about the name of the custom visual,\
    \ the icon, and so forth. We must change the `pbiviz.json` files content.\n\n\
    1. Change the name of the custom visual to `TableChart`.\n2. Create an icon for\
    \ a custom visual with the dimension 20×20 and put it into the `assets` folder.\n\
    3. Change the address of the icon in the JSON file (Figure 4-34).\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig34_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig34_HTML.jpg)\n\
    \n**Figure 4-34** JSON file name must be changed\n\n4. After changing the name\
    \ and creating a new icon for the custom visual, we must save the JSON file and\
    \ put the created icon in the `assets` folder.\n5. Next, we must change the R\
    \ scripts in the `scripts.R` file. In the `actual code` section, replace the existing\
    \ code with the following one.\n\n```\n    if(ncol(Values)==5)\n    {\n    names(Values)[1]<-paste(\"\
    X\")\n    names(Values)[2]<-paste(\"Y\")\n    names(Values)[3]<-paste(\"Z\")\n\
    \    names(Values)[4]<-paste(\"W\")\n    names(Values)[5]<-paste(\"M\")\n    g=ggplot(Values,aes(x=X,y=Y,color=Z))+geom_jitter()+facet_grid(\
    \ M ~  W,scales = \"free\")\n    }\n```\n\n6. Save the file.\n7. We must now return\
    \ to the command prompt environment and change the directory to the `sampleRHTMLVisual`\
    \ folder, by typing `pbiviz package` (Figure 4-35).\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig35_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig35_HTML.jpg)\n\
    \n**Figure 4-35** `pbiviz` command in the command prompt\n\n8. After running the\
    \ code, we should be able to see a new `pbiviz` file with name `TableChart` in\
    \ the `dist` folder (Figure 4-36).\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig36_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig36_HTML.jpg)\n\
    \n**Figure 4-36** Custom visual for a table chart\n\n9. Finally, we must import\
    \ the created custom visual into Power BI Desktop and pass the data fields to\
    \ the visual.\n\nAs mentioned, we must change the code, as follows:\n\n```\nif(ncol(Values)==5)\n\
    {\nnames(Values)[1]<-paste(\"X\")\nnames(Values)[2]<-paste(\"Y\")\nnames(Values)[3]<-paste(\"\
    Z\")\nnames(Values)[4]<-paste(\"W\")\nnames(Values)[5]<-paste(\"M\")\ng=ggplot(Values,aes(x=X,y=Y,color=Z))+geom_jitter()+facet_grid(\
    \ M ~  W,scales = \"free\")\n}\n```\n\nThe main data set is `Values`. The first\
    \ item in the `Values` data set relates to the x axis, the second to the y axis,\
    \ and so forth.\n\nSo, in Power BI Desktop, be careful about the axis you specify\
    \ in the R code."
