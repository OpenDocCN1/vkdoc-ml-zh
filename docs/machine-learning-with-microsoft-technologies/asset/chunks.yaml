    19 章中详细介绍这些内容。图 1-6 展示了所有 Azure 组件如何与其他 Azure 工具交互，以加速机器学习开发的进程。


    ![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig6_HTML.jpg](img/463840_1_En_1_Fig6_HTML.jpg)


    图 1-6


    提供不同机器学习执行可能性的 Microsoft Azure 组件


    此外，还可以在 Azure 门户中创建数据科学虚拟机（DSVM）（图 1-7）。DSVM 支持多种语言（例如 R、Python、C#）、机器学习模型（Azure
    Machine Learning Workbench、H2O）、数据摄取工具、数据探索和开发。我将在第五部分深入介绍如何使用这些组件。


    ![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig7_HTML.jpg](img/463840_1_En_1_Fig7_HTML.jpg)


    图 1-7


    Microsoft 数据科学虚拟机（DSVM）组件 [4]


    ## 总结


    本章介绍了 Microsoft 机器学习产品，简要说明了什么是机器学习、机器学习流程以及机器学习生命周期。此外，还描述了一些主要的机器学习方法，例如描述性分析、预测性分析和规范性分析。概述了如何利用这些工具来创建预测性、描述性和规范性分析。在本书的其余部分，将深入介绍
    Microsoft 技术栈中的大部分 AI 工具，并解释如何利用它们来实现机器学习。


    # 2. R 语言入门


    R 无疑是机器学习中最流行的语言之一。它是一种编程语言和免费软件环境，主要用于统计计算和数据可视化。R 语言长期以来一直被学术界、数据科学家和统计学家使用。它是一种统计语言，非常适合机器学习、统计学，并可作为可视化工具使用。Microsoft
    技术与 R 语言之间存在集成，这增强了 Microsoft 应用程序和报表中的机器学习能力。R 是一种开源且专有的语言，可用于 Windows 和 Mac
    操作系统。它可以通过包进行扩展 [1]。本章概述了如何安装 RStudio，以及如何通过安装包来扩展 R 的功能，并将解释如何使用 R 进行机器学习、统计分析和可视化。


    ## 安装 RStudio


    要编写和使用 R 进行机器学习和统计分析，你必须在机器上安装一个 R 版本。有不同版本的 R 和不同的工具来编写 R 代码，但在本书中，我们将使用 RStudio
    编写 R 脚本，RStudio 是一个用于 R 的集成开发环境（IDE），可以使用语法高亮编辑器。要安装 RStudio，你必须访问网站 [`www.rstudio.com/products/RStudio/`](http://www.rstudio.com/products/RStudio/)。你也可以在桌面上或通过服务器运行
    R 脚本。本书使用了桌面版 RStudio。此外，还安装并使用了免费的桌面版 RStudio。首先，在你的机器上安装 RStudio 桌面版并打开它。RStudio
    环境有四个主要部分，如图 2-1 所示。


    ![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig1_HTML.jpg](img/463840_1_En_2_Fig1_HTML.jpg)


    图 2-1


    RStudio 环境


    你可以在 R 编辑器中编写 R 代码。与其他 R IDE 相比，该编辑器更加用户友好。输出或控制台区域显示代码运行的结果。绘图区域显示可视化图表、帮助部分等。最后一个部分，环境和运行历史，显示变量和日志。


    让我们从 R 中的一个简单表达式开始。我们想将值 10 赋给变量名 `X`。简单的语句是


    ```

    X<-10

    ```


    在 R 中，`<-` 符号用于将值赋给变量。要运行代码，你只需按 Ctrl+Enter 或单击编辑器窗口中的运行按钮。


    如图 2-2 所示，我运行了语句 `x<-1`，结果会显示在控制台编辑器中。现在我将确定 `X` 变量的类型。为此，有一个名为 `typeof` 的函数，它接收一个变量并识别其类型。RStudio
    还为每个函数提供“智能感知”。


    ![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig2_HTML.jpg](img/463840_1_En_2_Fig2_HTML.jpg)


    图 2-2


    在 R 代码中运行一个简单语句


    运行 `typeof` 函数后（图 2-3），你将在控制台窗口中看到输出。变量 `X` 的类型是双精度型。R 中有不同的数据类型和结构，本章稍后将讨论这些内容。


    ![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig3_HTML.jpg](img/463840_1_En_2_Fig3_HTML.jpg)


    图 2-3


    在 RStudio 中运行 `typeof` 函数以识别变量类型


    ## 安装包


    为了扩展 R 的功能，可以安装额外的包。每个包都有不同的函数，为使用 R 提供更多功能。


    安装包的主要命令是 `install.packages()`。当你安装 R 时，你的机器上会创建一个库文件夹，其中包含一些用于使用 R 的基本包，例如“基础”包。但是，在第
    4 章中，你将看到如何使用此命令添加一些有助于机器学习的包。


    ## R 数据结构


    每种编程语言都有特定的数据结构。R 有一些预定义的数据结构，每种结构都有特定的用途。为了在 R 中执行机器学习，我们通常使用数据结构，例如向量、列表、数据框、因子、数组和矩阵。接下来，我将简要解释其中一些。'
- fmt: '### Vector—`c()`


    A vector stores the order set of values. Each value belongs to the same data type.
    A vector can hold data types such as integers (numbers without decimals), doubles
    (numbers with decimals), characters (text data), and logical (`TRUE` or `FALSE`
    values). See Figure [2-4](#463840_1_En_2_Chapter.xhtml#Fig4).


    ![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig4_HTML.jpg](images/463840_1_En_2_Chapter/463840_1_En_2_Fig4_HTML.jpg)


    Figure 2-4


    Simple visualization of a vector


    To create a vector data structure in R, we must use the function `c()`. To create
    a vector to store the name of a company employee, you would write the following
    code:


    ```

    employee_name<-c("Jan","Jack","Mike")

    ```


    The same would be done to store the employee’s age and academic degree.


    ```

    employee_age<-c(23,34,23)

    employee_degree<-c("BS","MS","BS")

    ```


    The resulting records for `employee_name`, `employee_age`, and `employee_degree`
    are as follows (Figure [2-5](#463840_1_En_2_Chapter.xhtml#Fig5)):


    ![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig5_HTML.jpg](images/463840_1_En_2_Chapter/463840_1_En_2_Fig5_HTML.jpg)


    Figure 2-5


    Employee records for name, age, and degree


    ### Factor


    Factors are a second data structure for a specific type of vector: categorical
    or ordinal values. For example, instead of storing the female and male types in
    a vector, a factor stores 1, 2, which takes less storage space. To define a factor,
    first we define a vector; the employee degree is a categorical variable. We use
    the common `Factor()` to convert a vector to a factor type, as follows:


    ```

    employee_degreeFactor<-factor(c("BS","MS","BS"))

    the result of running the employee_degreefactor would be

    employee_degreeFactor

    [1] BS MS BS

    Levels: BS MS

    ```


    As you see in the preceding output, we have beside each employee’s degree another
    parameter, named `Level`.


    ### Lists—`list()`


    List is another data structure that is similar to vector but can have a combination
    of data types (Figure [2-6](#463840_1_En_2_Chapter.xhtml#Fig6)). A vector has
    only one data type.


    ![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig6_HTML.jpg](images/463840_1_En_2_Chapter/463840_1_En_2_Fig6_HTML.jpg)


    Figure 2-6


    A simple visualization of list


    Lists help us to combine data types. For creating a list in R, we use the `list()`
    command, as follows:


    ```

    employee_list<-list(employee_name,employee_age,employee_degree)

    ```


    As you can see in the preceding code, the `list()` function gets a vector data
    structure, to create a list.


    The output of running the variable `employee_list` would be as follows:


    ```

    [[1]]

    [1] "Jan"  "Jack" "Mike"

    [[2]]

    [1] 23 34 23

    [[3]]

    [1] "BS" "MS" "BS"

    ```


    ### Data Frames—`data.frame()`


    The primary data structure that we use for machine learning is the data frame.
    A data frame is very similar to a table structure in SQL Server and Power BI.
    It has columns and rows. The graphical representation of a data frame is shown
    in Figure [2-7](#463840_1_En_2_Chapter.xhtml#Fig7).


    ![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig7_HTML.jpg](images/463840_1_En_2_Chapter/463840_1_En_2_Fig7_HTML.jpg)


    Figure 2-7


    Simple visualization of a data frame structure


    To define a frame, we use the `data.frame` syntax, as follows:


    ```

    employee_DataFrame<-data.frame(employee_name,employee_age,employee_degree)

    ```


    The result of running the variable `employee_Dataframe` is


    ```

    employee_name employee_age employee_degree

    1           Jan           23              BS

    2          Jack           34              MS

    3          Mike           23              BS

    ```


    A data frame is like a table. We can access the cells, rows, and columns separately.
    For example, to retry a specific column in `employee_Dataframe`, such as an employee’s
    age, we would use the following code:


    ```

    employee_DataFrame$employee_age

    ```


    Another way to access a row or column is via index number. The space before the
    comma stands for all rows, while the number after the comma is for column numbers.
    For example, we can extract all the rows of the first column using the following
    code:


    ```

    employee_DataFrame[,1]

    [1] Jan  Jack Mike

    Levels: Jack Jan Mike

    ```


    Similarly, to extract from all columns the data of a specific employee, we can
    leverage the following code:


    ```

    employee_DataFrame[1,]

    employee_name employee_age employee_degree

    1           Jan           23              BS

    ```


    ## R for Statistical Analysis


    R has been used widely for statistical analysis. It can be used for simple statistical
    analysis to complex statistical testing.


    A simple statistical analysis would be to find the center of data. In R, there
    is a simple command for this, `summary()`, that provides a brief description of
    the data set.


    Following is a data set of used cars (Figure [2-8](#463840_1_En_2_Chapter.xhtml#Fig8)):


    ![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig8_HTML.jpg](images/463840_1_En_2_Chapter/463840_1_En_2_Fig8_HTML.jpg)


    Figure 2-8


    Used car data set


    As you can see in Figure [2-8](#463840_1_En_2_Chapter.xhtml#Fig8), we have the
    price and mileage for each car. If we want to see the simple center measure of
    them, we can use the `summary` function.


    ```

    summary(used cars)

    ```


    After running the code in RStudio, we receive the following output (Figure [2-9](#463840_1_En_2_Chapter.xhtml#Fig9)):


    ![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig9_HTML.jpg](images/463840_1_En_2_Chapter/463840_1_En_2_Fig9_HTML.jpg)


    Figure 2-9


    Output of running the `summary` function code in RStudio


    For a numeric variable, such as price or mileage, we have five measures: minimum
    (Min.) and maximum (Max.), mean (average), median, and first and third quarter
    (1st Qu., 3rd Qu.).


    ## R for Machine Learning


    R contains many packages and functions that help data scientists to perform machine
    learning. With the R language, you are able to undertake predictive, descriptive,
    and prescriptive analysis. The following R packages from the KDnuggets web site
    (Table [2-1](#463840_1_En_2_Chapter.xhtml#Tab1)) are especially popular for machine
    learning [[2](#463840_1_En_2_Chapter.xhtml#Par47)].


    Table 2-1


    R Packages for Machine Learning


    | **Ranks** | **Package Name** | **Machine Learning** |

    | --- | --- | --- |

    | 1 | caret | Predictive analysis (classification and regression) |

    | 2 | randomForest | Predictive analysis (classification and regression) |

    | 3 | E1071 | Descriptive analysis |

    | 4 | rpart | Predictive analysis (classification and regression) |

    | 5 | nnet | Predictive analysis (classification and regression) |

    | 6 | arules | Descriptive analysis (data mining) |

    | 7 | kernlab | Predictive analysis (classification and regression) and descriptive
    analysis |


    There are many packages and functions for machine learning. In this book, I will
    show how we can use them inside Power BI.'
