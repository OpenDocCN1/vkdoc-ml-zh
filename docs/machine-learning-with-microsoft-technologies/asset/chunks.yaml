    `N''Select strength,cement,ash,age,water from [dbo].[concrete]`. Finally, the
    output variable `Model` will store the linear model.


    After creating the model, I want to store it, for predicting the new series of
    data. To store the model, the following code is used:


    ```

    IF NOT EXISTS (SELECT 1 FROM sys.objects

    WHERE object_id = OBJECT_ID(N''[dbo].[LinearModel]'')

    AND [type] IN (N''U''))

    BEGIN

    CREATE TABLE [dbo].[LinearModel](

    [Model] [varbinary](MAX) NULL

    );

    END

    ```


    Next, we ,must insert the model into a table. The following code inserts the model
    into a `LinearModel` table.


    ```

    Insert into [dbo].[LinearModel]

    EXECUTE sp_execute_external_script @language=N''R''

    ,@script = N''require("RevoScaleR")

    formula=strength~cement+ash+age+water

    Model_1=rxLinMod(formula,data=inputDataSet)

    Model=data.frame(payload = as.raw(serialize(Model_1, connection=NULL)))''

    ,@input_data_1 = N''Select strength,cement,ash,age,water from [dbo].[concrete];
    ''

    , @output_data_1_name = N''Model''

    ,@input_data_1_name = N''inputDataSet''

    ```


    The model is already stored in the database. Now, in another stored procedure,
    we are going to use the model, to predict the data.


    ```

    declare @rx_model varbinary(max) = (select [Model] from [dbo].[LinearModel] );

    exec sp_execute_external_script

    @language = N''R''

    , @script = N''

    require("RevoScaleR");

    cdr_model<-unserialize(rx_model);

    predictions <- rxPredict(modelObject = cdr_model,

    data = PredictionData)

    prediction <-as.data.frame(predictions);''

    , @input_data_1 = N''Select strength,cement,ash,age,water from [dbo].[concrete]''

    , @input_data_1_name = N''PredictionData''

    , @output_data_1_name=N''prediction''

    , @params = N''@rx_model varbinary(max)''

    , @rx_model = @rx_model

    with result sets (("prediction" float not null ))  ;

    ```


    There is another input for a stored procedure that is not just a data set. It
    contains input for models that we have already stored in a database.


    By running the stored procedure, the following prediction results are shown (Figure
    [9-10](#463840_1_En_9_Chapter.xhtml#Fig10)).


    ![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig10_HTML.jpg](images/463840_1_En_9_Chapter/463840_1_En_9_Fig10_HTML.jpg)


    Figure 9-10


    Linear model for concrete strength prediction


    There are other models for regression analysis. These include `rxLogit`, used
    for logistic regression; `rxGlm`, for generalizing the linear model to data; and
    others. In addition, for other types of analysis, such as group prediction (classification),
    there are such algorithms as `rxDTree`, `rxBTree`, `rxDForest`, and `rxNaiveBayes`
    [[3](#463840_1_En_9_Chapter.xhtml#Par74)].


    ### Azure ML Package


    Azure ML is another package to manage an experiment created in Azure ML Studio
    (see Chapter [12](#463840_1_En_12_Chapter.xhtml)). This package has some popular
    functions and allows users to create a web service from R functions. This package
    also allows R users to explore the Azure ML data set, explore existing data sets,
    and so forth. Details of how to use this package are provided in Chapter [12](#463840_1_En_12_Chapter.xhtml),
    following an explanation of Azure Machine Learning Studio.'
  trans: '

    ## R 语言中的包


    可以检查 R 服务的路径。获取 R 语言库路径的代码如下：


    ```

    OutputDataSet <- data.frame(.libPaths())

    ```


    要运行存储过程，我们将语言参数设置为 R。


    ```

    @language = N''R''

    ```


    输入的 R 脚本是：


    ```

    @script = N''OutputDataSet <- data.frame(.libPaths());''.

    ```


    因此，完整的代码如下：


    ```

    EXECUTE sp_execute_external_script  @language = N''R''

    , @script = N''OutputDataSet <- data.frame(.libPaths());''

    WITH RESULT SETS (([DefaultLibraryName] VARCHAR(MAX) NOT NULL));

    GO

    ```


    运行代码后，R 的库路径将显示在输出窗口中（图 9-8）。


    ![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig8_HTML.jpg](img/463840_1_En_9_Fig8_HTML.jpg)


    图 9-8


    R 库路径


    你可以检查机器学习服务中已安装的包。用于检查已安装包的 R 代码如下：


    ```

    packagematrix <- installed.packages();

    NameOnly <- packagematrix[,1];

    OutputDataSet <- as.data.frame(NameOnly)

    ```


    由于我们没有从用户那里获取任何输入值，因此存储过程没有任何输入（图 9-9）。


    ```

    EXECUTE sp_execute_external_script @language=N''R''

    ,@script = N''str(OutputDataSet); packagematrix <- installed.packages();

    NameOnly <- packagematrix[,1]; OutputDataSet <- as.data.frame(NameOnly);''

    ,@input_data_1 = N''SELECT 1 as col''

    WITH RESULT SETS ((PackageName nvarchar(250) ))

    ```


    运行代码后，你可以看到 SQL Server 中现有的 R 包。


    如图 9-9 所示，显示了 R 包的列表。这里有来自 Microsoft 的各种库，以及其他一些开源或第三方包。在下一节中，我将介绍其中的两个。


    ![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig9_HTML.jpg](img/463840_1_En_9_Fig9_HTML.jpg)


    图 9-9


    SQL Server 机器学习服务中的 R 包


    ### RevoScaleR 包


    RevoScaleR 是由 Revolutionary Analytics（现归 Microsoft 所有）创建的一个包，旨在大规模地导入、转换和分析数据。该包提供了不同类别的函数，涵盖数据存储、导入与另存为、数据转换、绘制图表（如直方图、折线图等）、描述性分析、预测分析、包管理等
    [3]。


    在本节中，我将介绍一些你可能用于机器学习目的的函数。示例将在 SQL Server 2017 中展示。


    ### rxLinMod


    `rxLinMode` 用于对数据拟合线性模型。在下面的示例中，我将向你展示如何使用此函数创建一个模型，用于预测混凝土强度与用水量、水泥用量、粉煤灰用量和龄期等输入变量的关系。`rxLinMode`
    函数基于一个公式和一个训练数据集创建模型。


    正如你在以下代码中看到的，第一行是 `EXECUTE sp_execute_external_script @language=N''R''`，它调用了一个存储过程，允许用户在
    SQL Server 内部编写 R 脚本。该存储过程负责在 SQL Server 代码中使用 R 或 Python 等外部脚本。


    ```

    EXECUTE sp_execute_external_script @language=N''R''

    ,@script = N''require("RevoScaleR")

    formula=strength~cement+ash+age+water

    Model_1=rxLinMod(formula,data=inputDataSet)

    Model=data.frame(payload = as.raw(serialize(Model_1, connection=NULL)))''

    ,@input_data_1 = N''Select strength,cement,ash,age,water from [dbo].[concrete];
    ''

    , @output_data_1_name = N''Model''

    ,@input_data_1_name = N''inputDataSet''

    WITH RESULT SETS (([concreteModel] varbinary(max) NOT NULL  ));

    ```


    代码中的第二行包含了存储在 `"@script"` 参数中的相关 R 代码。该代码通过使用 `require` 函数引用了 RevoScaleR 包。无需安装此包，因为它已存在于机器学习/R
    服务中。第二行 R 代码是关于创建公式的。我们的任务是根据其他一些变量（如用水量、水泥用量等）来预测混凝土强度。允许我们执行此操作的公式是 `strength~cement+ash+age+water`，它将公式存储在一个名为
    `"formula"` 的变量中。第三行包含 `rxLinMod` 函数，该函数根据公式创建一个线性模型。最后，代码的最后一行将公式存储在一个名为 `"Model"`
    的输出变量中。


    `@input_data_1` 使用 SQL 查询 `N''Select strength,cement,ash,age,water from [dbo].[concrete]''`
    存储从 SQL 数据库收集的数据。最后，输出变量 `Model` 将存储线性模型。


    创建模型后，我想将其存储起来，用于预测新的数据系列。要存储模型，请使用以下代码：


    ```

    IF NOT EXISTS (SELECT 1 FROM sys.objects

    WHERE object_id = OBJECT_ID(N''[dbo].[LinearModel]'')

    AND [type] IN (N''U''))

    BEGIN

    CREATE TABLE [dbo].LinearModel NULL

    );

    END

    ```


    接下来，我们必须将模型插入到表中。以下代码将模型插入到 `LinearModel` 表中。


    ```

    Insert into [dbo].[LinearModel]

    EXECUTE sp_execute_external_script @language=N''R''

    ,@script = N''require("RevoScaleR")

    formula=strength~cement+ash+age+water

    Model_1=rxLinMod(formula,data=inputDataSet)

    Model=data.frame(payload = as.raw(serialize(Model_1, connection=NULL)))''

    ,@input_data_1 = N''Select strength,cement,ash,age,water from [dbo].[concrete];
    ''

    , @output_data_1_name = N''Model''

    ,@input_data_1_name = N''inputDataSet''

    ```


    模型已经存储在数据库中。现在，在另一个存储过程中，我们将使用该模型来预测数据。


    ```

    declare @rx_model varbinary(max) = (select [Model] from [dbo].[LinearModel] );

    exec sp_execute_external_script

    @language = N''R''

    , @script = N''

    require("RevoScaleR");

    cdr_model<-unserialize(rx_model);

    predictions <- rxPredict(modelObject = cdr_model,

    data = PredictionData)

    prediction <-as.data.frame(predictions);''

    , @input_data_1 = N''Select strength,cement,ash,age,water from [dbo].[concrete]''

    , @input_data_1_name = N''PredictionData''

    , @output_data_1_name=N''prediction''

    , @params = N''@rx_model varbinary(max)''

    , @rx_model = @rx_model

    with result sets (("prediction" float not null ))  ;

    ```


    存储过程还有另一个输入，它不仅仅是一个数据集。它包含我们已经存储在数据库中的模型的输入。


    通过运行存储过程，将显示以下预测结果（图 9-10）。


    ![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig10_HTML.jpg](img/463840_1_En_9_Fig10_HTML.jpg)


    图 9-10


    混凝土强度预测的线性模型


    还有其他用于回归分析的模型。这些包括用于逻辑回归的 `rxLogit`；用于将线性模型推广到数据的 `rxGlm`；以及其他模型。此外，对于其他类型的分析，例如群体预测（分类），还有诸如
    `rxDTree`、`rxBTree`、`rxDForest` 和 `rxNaiveBayes` 等算法 [3]。


    ### Azure ML 包


    Azure ML 是另一个用于管理在 Azure ML Studio 中创建的实验的包（参见第 12 章）。该包包含一些常用函数，并允许用户从 R 函数创建
    Web 服务。该包还允许 R 用户探索 Azure ML 数据集、浏览现有数据集等。有关如何使用此包的详细信息，请参阅第 12 章，该章在解释 Azure
    机器学习工作室之后提供。

    '
- fmt: '# Creating R Visuals in SQL Server Reporting Services


    It is possible to generate R charts in SQL Server and show the chart in SQL Server
    Reporting Services (SSRS). The first step is to install the required package into
    Machine Learning Services. To do this, we can use the `install.packages()` command
    in an external scripts stored procedure, as follows:


    ```

    EXECUTE sp_execute_external_script @language=N''R''

    ,@script = N'' install.packages("ggplot2");''

    ,@input_data_1 = N''SELECT 1 as col''

    WITH RESULT SETS ((PackageName nvarchar(250) ))

    ```


    The preceding code may work, but sometimes it doesn’t, because of the administrator
    permission. You may receive a message such as the following warning in `install.packages("arules")`:


    ```

    ''lib = "C:/Program Files/Microsoft SQL Server/MSSQL14.ML2017/R_SERVICES/library"''
    is not writable

    Error in install.packages("ggplot2") : unable to install packages

    Calls: source -> withVisible -> eval -> eval -> install.packages

    ```


    To address this problem, we must run `Rugi.exe` as admin, to install the package.
    In addition, we must specify where to install the packages. As a result, the path
    of the Machine Learning Services for R in SQL Server is required. There is a function
    in R, `.libPaths()`, that shows the location of installed packages. So, we must
    run this code in SQL Server 2017, to find out the R library path.


    ```

    EXECUTE sp_execute_external_script  @language = N''R''

    , @script = N''OutputDataSet <- data.frame(.libPaths());''

    WITH RESULT SETS (([DefaultLibraryName] VARCHAR(MAX) NOT NULL));

    GO

    ```


    By running the code, the Machine Learning Services library path will be shown
    in SQL Server output windows (Figure [9-11](#463840_1_En_9_Chapter.xhtml#Fig11)).


    ![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig11_HTML.jpg](images/463840_1_En_9_Chapter/463840_1_En_9_Fig11_HTML.jpg)


    Figure 9-11


    The library path for Machine Learning Services


    By installing `ggplot2`, there may be another message requesting installation
    of other packages. After installing the `ggplot2` library, we can write R code
    to create a chart and store it in SQL Server. I am going to draw a chart using
    the following SQL codes:


    ```

    exec sp_execute_external_script @language =N''R'', @script=N''library("ggplot2")
    fields<-inputDataSet fields<-na.omit(fields) image_file = tempfile(); jpeg(filename
    = image_file, width=1000, height=1000); print(ggplot(fields,aes(x=fields$TaxAmt,y=fields$TaxAmt))+geom_boxplot()+facet_grid(fields$Color~.)
    ) dev.off(); OutputDataset <- data.frame(data=readBin(file(image_file,"rb"),what=raw(),n=1e6))
    '',@input_data_1 =N''select Color,Size,class,TaxAmt,SalesAmount from [dbo].[FactInternetSales]
    FIS inner join [dbo].[DimProduct] DP on FIS.ProductKey=dp.ProductKey'' ,@input_data_1_name
    = N''inputDataSet'' ,@output_data_1_name = N''OutputDataset'' WITH RESULT SETS
    ((plot varbinary(max)));

    ```


    ### R Code Section


    ```

    library("ggplot2")

    fields<-inputDataSet

    fields<-na.omit(fields)

    image_file = tempfile();

    jpeg(filename = image_file, width=1000, height=1000);

    print(ggplot(fields,aes(x=fields$TaxAmt,y=fields$TaxAmt))+geom_boxplot()+facet_grid(fields$Color~.)

    )

    dev.off();

    OutputDataset <- data.frame(data=readBin(file(image_file,"rb"),what=raw(),n=1e6

    ```


    Some brief explanation about the preceding code follows:


    `library("ggplot2")`: refers to the package.


    `fields<-inputDataSet`: gets the data.


    ```

    image_file = tempfile();

    ```


    `jpeg(filename = image_file, width=500, height=500);` creates the image file from
    the `ggplot2` package.


    `ggplot(fields,aes(x=fields$TaxAmt,y=fields$TaxAmt))+geom_boxplot()+facet_grid(fields$Color~.)`
    refers to code that has been explained in previous posts.


    ```

    dev.off();

    OutputDataset <- data.frame(data=readBin(file(image_file,"rb"),what=raw(),n=1e6

    ```


    This code creates a Var binary variable to convert the plot into a variable of
    binary type. The preceding code creates a table chart with a box plot.


    The next step is to get the data from SQL Server.


    ### Input Data


    ```

    @input_data_1 =N''select Color,Size,class,TaxAmt,SalesAmount from [dbo].[FactInternetSales]
    FIS inner join [dbo].[DimProduct] DP on FIS.ProductKey=dp.ProductKey'' ,@input_data_1_name
    = N''inputDataSet'' ,@output_data_1_name = N''OutputDataset''

    ```


    The relevant data set, AdventureWorks*,* can be downloaded from [`www.microsoft.com/en-us/download/details.aspx?id=49502`](http://www.microsoft.com/en-us/download/details.aspx%253Fid%253D49502)
    [[4](#463840_1_En_9_Chapter.xhtml#Par75)].


    ### Return Data


    ```

    WITH RESULT SETS ((plot varbinary(max)));

    ```


    Finally, we must return the plot, in the form of a binary variable.


    By running the code, we may get the result shown in Figure [9-12](#463840_1_En_9_Chapter.xhtml#Fig12).


    ![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig12_HTML.jpg](images/463840_1_En_9_Chapter/463840_1_En_9_Fig12_HTML.jpg)


    Figure 9-12


    Creating a binary value for the chart


    Now we must store the data in a table. First, we create a table with the name
    `ggplot` inside SQL Server, using the following code:


    ```

    IF NOT EXISTS (SELECT 1 FROM sys.objects WHERE object_id = OBJECT_ID(N''[dbo].[ggplot]'')
    AND [type] IN (N''U'')) BEGIN alter TABLE [dbo].[ggplot]( [plot] [varbinary](MAX)
    NULL ); END

    ```


    Then we enter the plot into the table, by inserting the following command:


    ```

    insert into [dbo].[ggplot] exec sp_execute_external_script @language =N''R'',
    @script=N''library("ggplot2") fields<-inputDataSet fields<-na.omit(fields) image_file
    = tempfile(); jpeg(filename = image_file, width=1000, height=1000); print(ggplot(fields,aes(x=fields$TaxAmt,y=fields$TaxAmt))+geom_boxplot()+facet_grid(fields$Color~.)
    ) dev.off(); OutputDataset <- data.frame(data=readBin(file(image_file,"rb"),what=raw(),n=1e6))
    '', @input_data_1 =N''select Color,Size,class,TaxAmt,SalesAmount from [dbo].[FactInternetSales]
    FIS inner join [dbo].[DimProduct] DP on FIS.ProductKey=dp.ProductKey'' ,@input_data_1_name
    = N''inputDataSet'' ,@output_data_1_name = N''OutputDataset''

    ```


    Now we have a chart that has been created and stored in our database.


    ### Showing the Chart in SSRS


    To show the chart in SQL Server data tools, we must create a new SSRS project
    (Figure [9-13](#463840_1_En_9_Chapter.xhtml#Fig13)).


    ![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig13_HTML.jpg](images/463840_1_En_9_Chapter/463840_1_En_9_Fig13_HTML.jpg)


    Figure 9-13


    Create a SSRS project in SQL Server data tools


    Next, we follow the required steps for creating an SSRS report (Figure [9-14](#463840_1_En_9_Chapter.xhtml#Fig14)).


    ![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig14_HTML.jpg](images/463840_1_En_9_Chapter/463840_1_En_9_Fig14_HTML.jpg)


    Figure 9-14


    Creating an SSRS project with data tools


    Then must create a query to get the plot from the `ggplot` table (Figure [9-15](#463840_1_En_9_Chapter.xhtml#Fig15)).


    ![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig15_HTML.jpg](images/463840_1_En_9_Chapter/463840_1_En_9_Fig15_HTML.jpg)


    Figure 9-15


    Getting the data from the SQL Server table in SSRS


    Next, we must insert an image into the report area and view the preview tabs (Figure
    [9-16](#463840_1_En_9_Chapter.xhtml#Fig16)) to check the charts.


    ![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig16_HTML.jpg](images/463840_1_En_9_Chapter/463840_1_En_9_Fig16_HTML.jpg)


    Figure 9-16


    Box plot chart in SSRS


    ## Summary


    This chapter gave a brief explanation of how to run R scripts in SQL Server 2016
    and 2017. It outlined how to run the necessary code via external scripts and stored
    procedures. In addition, it discussed how with packages such as `RevoScaleR` and
    Azure ML, we can access additional machine learning and R services. Furthermore,
    the process of how we can perform predictive analytics was explained via an example.
    The next chapter offers an overview of how to do machine learning in Azure Databricks.'
