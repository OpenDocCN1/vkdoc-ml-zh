    要开始使用 Azure ML Workbench，有一些示例项目可以帮助用户了解更多信息。首先，你必须创建一个空的工作区。要创建新工作区，请单击加号 (+)，然后单击“新建工作区”（图
    14-5）。


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig5_HTML.jpg](img/463840_1_En_14_Fig5_HTML.jpg)


    图 14-5


    创建新的 Azure 工作区


    如图 14-6 所示，要创建新工作区，我们必须提供有关工作区的一些详细信息，例如名称和描述。


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig6_HTML.jpg](img/463840_1_En_14_Fig6_HTML.jpg)


    图 14-6


    提供有关新 Azure 工作区的详细信息


    在新工作区下创建一个新项目。在最后一个文本框“搜索项目模板”下，搜索“鸢尾花分类”（图 14-7）。


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig7_HTML.jpg](img/463840_1_En_14_Fig7_HTML.jpg)


    图 14-7


    鸢尾花分类项目


    创建鸢尾花分类项目。创建项目后，将显示项目环境。有五个主要选项卡（图 14-8）。在下一节中，将解释每个组件。


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig8_HTML.jpg](img/463840_1_En_14_Fig8_HTML.jpg)


    图 14-8


    Azure ML Workbench 中的鸢尾花项目

    '
- fmt: '### Azure ML Workbench Import Data


    The first step is to import the data into Azure ML Workbench. Click the `Data`
    option. There are two main sections there. `Data Sources` stores the original
    data source. The `Data Preparations` option stores the prepared and cleaned data.
    To import Data into Azure ML Studio, you must click the plus sign (`+`) at the
    top of the page (Figure [14-9](#463840_1_En_14_Chapter.xhtml#Fig9)).


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig9_HTML.jpg](images/463840_1_En_14_Chapter/463840_1_En_14_Fig9_HTML.jpg)


    Figure 14-9


    Importing data


    Click `Add Data Source`, which has four main options to import the data (Figure
    [14-10](#463840_1_En_14_Chapter.xhtml#Fig10)):


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig10_HTML.jpg](images/463840_1_En_14_Chapter/463840_1_En_14_Fig10_HTML.jpg)


    Figure 14-10


    Add Data Source option


    - Text Files

    - Parquet

    - Excel Files

    - Database


    In this example, the iris data (text file) will be imported from the local PC
    into the Azure ML Workbench environment. Choose the `Text file` and import the
    data into Azure ML Workbench (you can download the iris data set file from [`www.kaggle.com/uciml/iris`](http://www.kaggle.com/uciml/iris)).


    As you can see in Figure [14-11](#463840_1_En_14_Chapter.xhtml#Fig11), the iris
    data set has been imported. The data set in `Data Source` section stores the raw
    data. It also shows how many rows have been missed, how many are valid, and so
    forth.


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig11_HTML.jpg](images/463840_1_En_14_Chapter/463840_1_En_14_Fig11_HTML.jpg)


    Figure 14-11


    Importing data into Azure ML Workbench


    To prepare the data, click the `Prepare` option at the top of the window and assign
    a proper name to the new data set. Then, in the `Data Preparations` section, a
    new data will be shown (Figure [14-12](#463840_1_En_14_Chapter.xhtml#Fig12)).


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig12_HTML.jpg](images/463840_1_En_14_Chapter/463840_1_En_14_Fig12_HTML.jpg)


    Figure 14-12


    Preparing the data


    Right-click the first column. There are some options for data cleaning, such as
    `Replace NA Values`, `Replace Missing Values`, and so forth. Rename the columns
    to `Sepal Length`, `Sepal Width`, `Petal Length`, and `Petal Width`. It is possible
    to create a chart, to get a better understanding of the data. As you can see in
    Figure [14-13](#463840_1_En_14_Chapter.xhtml#Fig13), at the bottom of the right-click
    menu, there are some chart options, such as `Column Statistics`, `Histogram`,
    `Value Counts`, and so forth.


    For our example, we can see the distribution of data by choosing a histogram chart.


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig13_HTML.jpg](images/463840_1_En_14_Chapter/463840_1_En_14_Fig13_HTML.jpg)


    Figure 14-13


    Histogram chart of iris sepal length


    This editor provides a means for data scientists to better analyze the data and
    gain a better understanding of the data specifications, such as distribution,
    outliers, and so forth. Azure Machine Learning Workbench supports interactive
    data science experimentation through its integration with Jupyter Notebook. After
    importing and cleaning the data, you must run and train the models. As you can
    see in Figure [14-14](#463840_1_En_14_Chapter.xhtml#Fig14), there is a notebook
    editor for running the code and testing the models. Click the `Notebook` option
    at the left side of the window. A notebook will appear there. (In Chapter [19](#463840_1_En_19_Chapter.xhtml),
    a brief introduction to Jupyter Notebooks is presented.)


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig14_HTML.jpg](images/463840_1_En_14_Chapter/463840_1_En_14_Fig14_HTML.jpg)


    Figure 14-14


    Jupyter Notebook in Azure ML Workbench


    There is an option named `Run` at the left side of the window. It shows the history
    of the running model. At the start, there is no run history.


    The related files for the iris project have been loaded in the last option on
    the left side of the window. As you can see in Figure [14-15](#463840_1_En_14_Chapter.xhtml#Fig15),
    all the files related to Iris classification are located there.


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig15_HTML.jpg](images/463840_1_En_14_Chapter/463840_1_En_14_Fig15_HTML.jpg)


    Figure 14-15


    Iris files


    As you can see in Figure [14-15](#463840_1_En_14_Chapter.xhtml#Fig15), all files
    related to the iris project are listed. One of the files is `iris_sklearn.py`.
    This file contains models and data for Iris classification. It is possible to
    run the code locally on Docker (Figure [14-16](#463840_1_En_14_Chapter.xhtml#Fig16)).


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig16_HTML.jpg](images/463840_1_En_14_Chapter/463840_1_En_14_Fig16_HTML.jpg)


    Figure 14-16


    Running the Python code


    Click the `Run` option and run the model. After running the model, click `Run`,
    at the right side of the window. You will be able to see details of the run, including
    status, run start time, duration, accuracy, and so forth (Figure [14-17](#463840_1_En_14_Chapter.xhtml#Fig17)).


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig17_HTML.jpg](images/463840_1_En_14_Chapter/463840_1_En_14_Fig17_HTML.jpg)


    Figure 14-17


    Iris run details


    The details of running the Python code have been shown in Figure [14-16](#463840_1_En_14_Chapter.xhtml#Fig16).
    The evaluation result for Iris classification is shown in Figure [14-18](#463840_1_En_14_Chapter.xhtml#Fig18).


    ![../images/463840_1_En_14_Chapter/463840_1_En_14_Fig18_HTML.jpg](images/463840_1_En_14_Chapter/463840_1_En_14_Fig18_HTML.jpg)


    Figure 14-18


    Iris classification result


    ## Summary


    This chapter presented a brief introduction to the Azure ML Workbench environment,
    including an explanation of how to install it and access the environment. In the
    next chapter, you will see how to import data from an SQL Server database and
    then load it to Azure ML Workbench and how to run it in Spark on Docker.


    # 15. Machine Learning on HDInsight


    In this chapter, an overview of how to use HDInsight for the purpose of machine
    learning will be presented. HDInsight is based on Apache Spark and used for in-memory
    cluster processing. Processing data in-memory is much faster than disk-based computing.
    Spark also supports the Scala language, which supports distributed data sets.
    Creating a cluster in Spark is very fast, and it is able to use Jupyter Notebook,
    which makes data processing and visualization easier. Spark clusters can also
    be integrated with Azure Event Hub and Kafka. Moreover, it is possible to set
    up Azure Machine Learning (ML) services to run distributed R computations. In
    the next section, the process of setting up Spark in HDInsight will be discussed.


    ## HDInsight Overview


    HDInsight is an open source analytics and cloud-based service. Integration with
    Azure HDInsight is easy, fast, and cost-effective for processing massive amounts
    of data. There are many different use-case scenarios for HDInsight, such as ETL
    (extract, transform, and load), data warehousing, machine learning, Internet of
    things (IoT), and so forth.


    The main benefit of using HDInsight for machine learning is access to a memory-based
    processing framework. HDInsight helps developers to process and analyze big data
    and develop solutions, using some great and open source frameworks, such as Hadoop,
    Spark, Hive, LLAP, Kafka, Storm, and Microsoft Machine Learning Server [[1](#463840_1_En_15_Chapter.xhtml#Par16)].'
