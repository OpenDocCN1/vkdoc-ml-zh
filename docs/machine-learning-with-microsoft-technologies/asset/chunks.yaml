- fmt: '# Data Transformation Using R Scripts


    Not all data transformation is possible or easy using existing menus in Power
    Query. To improve our ability to transform data, we can use R inside Power Query.
    There is a data set about breast cancer in women available from the Kaggle web
    site (`https://www.kaggle.com/lbronchal/breast-cancer-dataset-analysis`). This
    data set is made up of 569 rows and 32 columns. The first column is patient ID,
    and the second is the diagnosis. The rest of the columns relate to the cancer
    cell’s specification.


    Columns 2 to 32 have some numeric values that are not within the same range. For
    example, the `radius_mean` column has values from 6.9 to 22, while the `compactness_mean`
    column has values from 0.019 to 0.34. There is another data preparation process,
    named normalization, to bring data into the same scale. This process is good for
    some algorithms, such as lKNN; however, it is not always recommended (see Figure
    6-22).


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig22_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig22_HTML.jpg)


    **Figure 6-22** Data set related to breast cancer in women


    ## Normalization


    Normalizing data means bringing it within a specific range, such as 0 to 1. I
    am going to use a formula for normalizing names, following a “MinMax” approach.
    In this example, I will bring the data from all the columns in the cancer data
    set into the range of 0 to 1, except the patient ID and diagnosis columns (which
    consist of text).


    First, for each column, we must find the minimum and maximum value. For each value,
    we must calculate the formula, as follows:


    ![$$ Normalize\ value=\left(\frac{\min (x)-x}{\max (x)-\min (x)}\right) $$](images/463840_1_En_6_Chapter/463840_1_En_6_Chapter_TeX_Equa.png)


    We can apply this transformation to data, using the R language in Power Query.


    In Power Query, there is an option for writing R code: Run R Script (Figure 6-23).


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig23_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig23_HTML.jpg)


    **Figure 6-23** Running R scripts in Power Query


    The Run R Script editor is not very advanced. The data you want to transform is
    stored under variable name `dataset`.


    Hence, we are going to use the `dataset` variable and the formula for normalizing
    the data.


    In R, I will write a function to put the MinMax formula there.


    ```

    Normalize<- function (x)

    {

    return ((x-min(x))/(max(x)-min(x)))

    }

    ```


    Then I must apply this function to the data set. For this, I must use another
    function in R, named `lapply`.


    The `lapply` function gets the data set and the name of the normalized function.
    It then applies the function of the data set. In my example, you do not have to
    apply MinMax normalization on the first and second column, so you just use `dataset[3:32]`
    instead of `dataset`.


    ```

    NormalizedData<-as.data.frame(lapply(dataset[3:32],Normalize))

    ```


    As you can see in Figure 6-24, after writing the code, we need to press the OK
    button. Power Query will apply the normalization transformation to the data.


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig24_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig24_HTML.jpg)


    **Figure 6-24** R Script editor


    After running the codes, the result of the data transformation is shown in Figure
    6-25. You can see the applied steps in Run R Script.


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig25_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig25_HTML.jpg)


    **Figure 6-25** Normalized data


    ## Other Data Transformation


    There are other ways to transform data with Power Query.


    ### Change Data Type


    To change the data type in Power Query, click the Data Type option and choose
    the right data type. Likewise, you can change the data type by clicking the icon
    beside each column (Figure 6-26).


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig26_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig26_HTML.jpg)


    **Figure 6-26** Changing the data type


    ### Group By


    In Power Query, we can also group data by specific aggregation options. First,
    we must click the column we want to group data by. Then we click the Group By
    icon in the menu (Figure 6-27). In the Group By window, we choose the Group by
    option we want and the aggregation type, under Operation. Next, we choose Sum
    as the aggregation option.


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig27_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig27_HTML.jpg)


    **Figure 6-27** Group by data with specific aggregation


    Finally, the data will be grouped by type value (Figure 6-28).


    ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig28_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig28_HTML.jpg)


    **Figure 6-28** The resulting aggregated data


    Many other kinds of data transformation, such as splitting columns based on the
    delimitator, transposing rows, changing the data type, adding date or time columns,
    including some statistical computation, merging columns, and so forth, are possible.
    Under the Add Column tab, it is possible to add custom columns, create columns
    from examples, create functions, format data columns, add columns for date, month,
    days, time, among other things. In addition, it is possible to transform data
    using the M language, although this is beyond the scope of this book.


    ## Summary


    This chapter offered a brief introduction to how to use R inside Power Query Editor.
    It explained how we can use it to reshape data, select data, write a mathematical
    function using R codes and apply it to a data set, and so forth. There are other
    uses for R or Python inside Power Query Editor, such as using R for regular expressions
    or using R and Python for machine learning. In the next chapter, more examples
    of using R in Power Query Editor will be presented.


    # 7. Predictive Analysis in Power Query with R


    In this chapter, the process of doing machine learning inside Power BI Query Editor
    by writing R code will be explained. The main aim here is to provide some examples
    of how we can use R codes for predictive analysis (classification and regression).
    The concepts and codes related to some of the algorithms will be provided. In
    addition, the process of automating predictions via parameters inside Power BI
    Query Editor also will be discussed.'
