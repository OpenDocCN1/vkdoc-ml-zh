  trans: '

    ## Azure Stream Analytics 环境


    Azure Stream Analytics 是 Azure 环境中的一个事件处理组件。要创建 Azure Stream Analytics，你必须登录 Azure
    账户并创建一个 Stream Analytics 作业（图 13-1）。


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig1_HTML.jpg](img/463840_1_En_13_Fig1_HTML.jpg)


    图 13-1


    在 Azure 环境中创建 Stream Analytics 作业


    在 Azure 中创建 Stream Analytics 作业后，你必须设置一些预定义参数，例如作业名称、订阅、资源组等（图 13-2）。


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig2_HTML.jpg](img/463840_1_En_13_Fig2_HTML.jpg)


    图 13-2


    Stream Analytics 作业初始化


    Stream Analytics 类似于 Azure 内部的服务总线，能够从某些组件获取数据，对接收到的数据进行分析，并将其传递给其他组件。因此，Stream
    Analytics 环境包含三个主要组件：输入、输出和查询。Stream Analytics 只能从三个主要组件获取数据：事件中心、IoT 中心和 Blob
    存储。这三个组件主要用于从外部传感器、应用程序和实时 API 收集数据。Stream Analytics 可以将数据传递给其他 Azure 组件，例如 Blob
    存储、Azure SQL 数据库、Power BI 等（图 13-3）。


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig3_HTML.jpg](img/463840_1_En_13_Fig3_HTML.jpg)


    图 13-3


    Stream Analytics 输出


    最后，另一个重要组件是查询编辑器，它帮助用户在将数据发送到输出之前对接收到的数据进行分析（图 13-4）。


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig4_HTML.jpg](img/463840_1_En_13_Fig4_HTML.jpg)


    图 13-4


    Stream Analytics 主要组件（输入、输出和查询）


