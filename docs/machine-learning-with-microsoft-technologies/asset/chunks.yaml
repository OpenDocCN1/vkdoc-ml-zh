    \n    图 9-1\n\n    SQL Server 安装\n\n2.  在功能选择页面上，选择 **R 服务（数据库内）**。如图 9-2 所示，SQL\
    \ Server 复制和 R 服务（数据库内）已安装。\n\n    ![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig2_HTML.jpg](img/463840_1_En_9_Fig2_HTML.jpg)\n\
    \n    图 9-2\n\n    SQL Server 功能选择\n\n3.  最后一步是同意安装 Microsoft R Open。安装完成后，你必须重新启动计算机并以管理员身份运行\
