    The next step is to create a neural network model. To create the model, first
    we must identify the input variable and assign it to the `feature` variable, specifying
    the data type.


    ```

    feature = C.input_variable(input_dim, np.float32)

    ```


    The next step is to set up the network. We are going to use logistic regression
    as an activation (formula) to classify the data (Figures [17-5](#463840_1_En_17_Chapter.xhtml#Fig5)
    and [17-4](#463840_1_En_17_Chapter.xhtml#Fig4)). To do that, we must define a
    function that identifies the layers of the neural network structure. As was shown
    in Figure [17-4](#463840_1_En_17_Chapter.xhtml#Fig4) and the discussion related
    to it, we require an equation for classifying the data.


    The formal parameters can be as follows:


    ![$$ z=\sum \limits_{i=1}^n\ w\mathrm{i}\ast \mathrm{Xi}+\mathrm{b}=\mathrm{w}.\mathrm{x}+\mathrm{b}
    $$](images/463840_1_En_17_Chapter/463840_1_En_17_Chapter_TeX_Equa.png)


    or


    ```

    Z=W∗X+b

    ```


    The equation used is the same as was illustrated in Figure [17-3](#463840_1_En_17_Chapter.xhtml#Fig3):
    2x+y=2.


    ```

    mydict = {}

    def linear_layer(input_var, output_dim):

    input_dim = input_var.shape[0]

    weight_param = C.parameter(shape=(input_dim, output_dim))

    bias_param = C.parameter(shape=(output_dim))

    mydict[''w''], mydict[''b''] = weight_param, bias_param

    return C.times(input_var, weight_param) + bias_param

    ```


    So, the output would be as follows:


    ```

    output_dim = num_output_classes

    z = linear_layer(feature, output_dim)

    ```


    The next step after creating the network structure is to train the data, based
    on the data behavior and the probabilities, so as to be as close as possible to
    the observed data. There is a concept named *Entropy* [[5](#463840_1_En_17_Chapter.xhtml#Par57)]
    to train the data, an example of which follows:


    ```

    label = C.input_variable(num_output_classes, np.float32)

    loss = C.cross_entropy_with_softmax(z, label)

    ```


    After creating the model, we must evaluate it via the following code:


    ```

    eval_error = C.classification_error(z, label)

    ```


