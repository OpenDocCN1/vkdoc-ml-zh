    ## 在 HDInsight 中设置集群


    第一步是在 Azure 中设置 HDInsight。登录你的 Azure 账户，并在 Azure 中创建一个 HDInsight 组件（图 15-1）。如图
    15-1 所示，HDInsight 有不同的模块，例如 HDInsight Spark 监控和 HDInsight InteractiveQuery 监控。在这些模块中，选择
    **HDInsight 分析** 选项。


    ![../images/463840_1_En_15_Chapter/463840_1_En_15_Fig1_HTML.jpg](img/463840_1_En_15_Fig1_HTML.jpg)


    图 15-1


    在 Azure 中设置 HDInsight


    创建 HDInsight 时，必须遵循一些步骤来设置集群并确定其大小。第一步是为集群设置名称、设置订阅并选择集群类型（图 15-2）。可用的集群类型有多种，包括
    Spark、Hadoop、Kafka、ML Services 等。


    ![../images/463840_1_En_15_Chapter/463840_1_En_15_Fig2_HTML.jpg](img/463840_1_En_15_Fig2_HTML.jpg)


    图 15-2


    在 Azure 中创建 HDInsight


    下一步是确定集群的大小并查看摘要（图 15-3）。


    ![../images/463840_1_En_15_Chapter/463840_1_En_15_Fig3_HTML.jpg](img/463840_1_En_15_Fig3_HTML.jpg)


    图 15-3


    设置 HDInsight


    创建 HDInsight 可能需要一些时间。创建 HDInsight 组件后，在主页的“概述”部分，选择“集群仪表板”（图 15-4）。


    ![../images/463840_1_En_15_Chapter/463840_1_En_15_Fig4_HTML.jpg](img/463840_1_En_15_Fig4_HTML.jpg)


    图 15-4


    HDInsight 环境


    接下来，选择 **Jupyter Notebook**。在新页面上，选择“新建”选项（图 15-5）。


    ![../images/463840_1_En_15_Chapter/463840_1_En_15_Fig5_HTML.jpg](img/463840_1_En_15_Fig5_HTML.jpg)


    图 15-5


    Jupyter Notebook 环境


    如图 15-5 所示，有多个环境选项，例如 PySpark、PySpark3 和 Spark。你可以在所有这些环境中编写 Python 代码。


    为 Spark 创建新页面后，你必须使用创建 HDInsight 组件时提供的用户名和密码登录。Jupyter 环境类似于笔记本，因此也类似于 Azure
    Databricks 环境。如图 15-6 所示，你可以在其中编写代码并运行整个单元格来查看结果。


    ![../images/463840_1_En_15_Chapter/463840_1_En_15_Fig6_HTML.jpg](img/463840_1_En_15_Fig6_HTML.jpg)


    图 15-6


    Jupyter Notebook 环境


    还可以从其他 Azure 组件（例如 Azure Data Lake Store Gen1）获取数据（图 15-7）。为此，你必须运行以下代码（在 Databricks
    中，运行相同的代码）。


    ![../images/463840_1_En_15_Chapter/463840_1_En_15_Fig7_HTML.jpg](img/463840_1_En_15_Fig7_HTML.jpg)


    图 15-7


    从 Azure Data Lake Store Gen1 获取数据


    ```

    spark.conf.set("dfs.adls.oauth2.access.token.provider.type", "ClientCredential")

    spark.conf.set("dfs.adls.oauth2.client.id", "a1824181-e20c-4952-894f-6f53670672dd")

    spark.conf.set("dfs.adls.oauth2.credential", "iRzOkcyahiomc5AKobyVxFdDVF/mEbS3mqN1moehG0w=")

    spark.conf.set("dfs.adls.oauth2.refresh.url", "https://login.microsoftonline.com/0b414bdb-2159-4b16-ad13-b2d54a1781da/oauth2/token")

    val df=spark.read.option("header", "true").csv("adl://adlsbook.azuredatalakestore.net/titanic.csv")

    val specificColumnsDf = df.select("Survived", "Pclass", "Sex", "Age")

    val renamedColumnsDF = specificColumnsDf.withColumnRenamed("Sex", "Gender")

    renamedColumnsDF.createOrReplaceTempView("some_name")

    renamedColumnsDF.show()

    ```


    也可以在 Jupyter Notebook 中使用 Spark 执行机器学习。有关示例，请参阅 [`https://docs.microsoft.com/en-us/azure/hdinsight/spark/apache-spark-ipython-notebook-machine-learning`](https://docs.microsoft.com/en-us/azure/hdinsight/spark/apache-spark-ipython-notebook-machine-learning)
    上的教程。


    ## 总结


    本章概述了 HDInsight 及其设置方法。简要说明了如何将 HDInsight 用于不同目的，以及如何在 Azure 环境中设置 HDInsight，并介绍了如何访问
    Jupyter Notebook 以在 PySpark、Spark 或 PySpark3 环境中编写代码。还展示了一个如何连接到 Azure Data Lake
    Store Gen1 以获取数据的示例。


    ## 参考


    1.  Microsoft Azure，“Azure HDInsight 文档”，[`https://docs.microsoft.com/en-us/azure/hdinsight/`](https://docs.microsoft.com/en-us/azure/hdinsight/)
    ，2019 年。


    # 16. 数据科学虚拟机和 AI 框架


    数据科学虚拟机（DSVM）是 Azure 云上专为进行数据科学而定制的一台虚拟机。DSVM 拥有一些预配置和预安装的工具，可帮助用户构建人工智能（AI）应用程序。DSVM
    有助于数据科学团队获得一致的设置环境。本章将简要介绍 DSVM 及其安装方法，并概述其预安装的工具。


    ## 数据科学虚拟机概述


    数据科学虚拟机是一种预安装和预配置的工具，能够促进数据科学团队之间的协作。在云中安装一组所需的工具，可以减少维护软件的需求以及相关的时间和成本。


    DSVM 可以帮助培训师和教育工作者使用一致的设置环境来教授数据科学。拥有一个预构建的设置环境非常适合短期培训。DSVM 可用于学习和比较不同的机器学习工具，例如
    Microsoft ML Server、SQL Server、Visual Studio、Jupyter、深度学习工具等。DSVM 包含许多不同的数据科学和深度学习工具，包括：


    *   预装了流行包的 Microsoft R Open


    *   Microsoft ML Server（R、Python）开发者版


    *   Microsoft Office 专业增强版


    *   Anaconda Python 2.7、3.5


    *   关系数据库


    *   数据库工具


    *   支持 R、Python、Julia、PySpark、Sparkmagic 和 SparkR 的 Jupyter Notebook Server


    *   开发工具，例如 Visual Studio 2017、RStudio Desktop 和 Server、PyCharm Community 等


    *   Power BI Desktop


    *   数据移动和管理工具，例如 Azure Storage Explorer 和 Microsoft Data Management Gateway


    *   机器学习工具，例如 Azure Machine Learning、Weka、Rattle 和 H2O


    *   深度学习工具，例如 Microsoft Cognitive Toolkit、TensorFlow 和 Keras


    *   大数据平台，例如 Spark 和 Hadoop [1]

