  trans: '

    ### 在 Power BI 中编写 R 代码


    可以在 Power BI 的报表区域编写 R 代码。为此，我们必须先将数据导入 Power BI 报表。


    一个包含汽车规格（如市区和高速公路速度、气缸数等）的数据集，可从 [`https://forge.scilab.org/index.php/p/rdataset/source/tree/master/csv/ggplot2/mpg.csv`](https://forge.scilab.org/index.php/p/rdataset/source/tree/master/csv/ggplot2/mpg.csv)
    下载。该数据集是免费的，名为“mpg.csv”。我将使用这个数据集，在一张图中展示汽车在高速公路和市区的速度、气缸数、生产年份以及驱动类型（前轮、后轮等）。如图
    4-1 所示，要展示不同项目之间的数据对比，我们必须使用表格图。我们将通过“获取数据”选项将数据导入 Power BI Desktop，并导入一个 CSV
    文件（图 4-5）。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig5_HTML.jpg](img/463840_1_En_4_Fig5_HTML.jpg)


    图 4-5


    将 CSV 文件导入 Power BI Desktop


    导入数据后，您应该能在“字段”下看到它。单击 R 并将其拖到空白区域（图 4-6）。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig6_HTML.jpg](img/463840_1_En_4_Fig6_HTML.jpg)


    图 4-6


    将 R 放入空白区域


    展开 mpg 数据集（图 4-7），并选择 cty（市区速度）、hwy（高速公路速度）和 cyl（气缸数）选项。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig7_HTML.jpg](img/463840_1_En_4_Fig7_HTML.jpg)


    图 4-7


    从 mpg 文件中选择相关数据


    R 脚本编辑器将被启用。在 R 脚本编辑器下，您会看到一些 R 代码。井号（#）是在 R 中用于注释的符号，不会作为脚本执行。Power BI 会自动将选定的字段放入一个名为
    `dataset` 的变量中，因此所有字段（cty、hwy 和 cyl）都将存储在一个数据集变量中，相当于使用了 `<-` 语法。此外，Power BI 会自动删除任何重复的行。这在
    R 脚本编辑器区域中有说明（图 4-8）。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig8_HTML.jpg](img/463840_1_En_4_Fig8_HTML.jpg)


    图 4-8


    Visual Studio 2017 中的活动 Python 环境


    接下来，我们将放置用于在 Power BI 中绘制二维图形的 R 代码。在 Power BI 中，要使用任何 R 脚本，都需要使用 `install.package()`
    函数在 R 中安装该包。在我们的例子中，必须安装 ggplot2。我们使用函数 `library(ggplot2)` 来引用这个包。R 编辑器中的第一行代码是
    `library(ggplot2)`。这个包包含一些用于绘制图表的重要函数。


    为了绘制图表，我首先使用 `ggplot` 函数来配置一个二维图表。第一个参数是 `dataset`，它包含我们的三个字段。然后，在 ggplot2 中还有另一个名为
    `aes` 的函数，它用于标识哪个字段应位于 x 轴或 y 轴上。最后，在图表中，我还想指示汽车的气缸数。这可以通过在 `aes` 函数中添加另一个图层来实现：Size。因此，气缸数更多的汽车将显示为更大的点（见图
    4-9）。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig9_HTML.jpg](img/463840_1_En_4_Fig9_HTML.jpg)


    图 4-9


    R 脚本编辑器


    ```

    t←ggplot(dataset, aes(x=cty, y=hwy,size=cyl))

    ```


    然而，上图显示的是没有任何特定图表的图形区域。我们需要一个散点图来在 x 轴和 y 轴上指示市区和高速公路速度。ggplot2 的 `geom_point`
    函数用于绘制散点图。该函数有一个值为 pch=21 的参数，这与图表中点的形状有关。例如，如果我将此值设置为 20，它会变成一个实心圆；值为 23 则变成菱形。要运行代码，请单击运行选项（图
    4-10）。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig10_HTML.jpg](img/463840_1_En_4_Fig10_HTML.jpg)


    图 4-10


    如何运行 R 代码


    单击运行代码选项后，图表将显示在 R 可视化对象中（图 4-11）。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig11_HTML.jpg](img/463840_1_En_4_Fig11_HTML.jpg)


    图 4-11


    使用 `ggplot` 函数绘制图表


    在图 4-11 中，您可以看到我们有三个不同的字段：高速公路速度和市区速度，分别位于 y 轴和 x 轴上。汽车的气缸变量显示为不同的圆点大小。但是，您可能需要更大的圆点，以区分
    8 缸和 4 缸的汽车。我们通过添加另一个图层，即添加一个函数名来满足这一需求，如下所示：


    ```

    scale_size_continuous(range=c(1,5))

    ```


    以下是完整的代码：


    ```

    t<-ggplot(dataset, aes(x=cty, y=hwy,size=cyl)) + geom_point(pch=23)+scale_size_continuous(range=c(1,5))

    in the scale_size_continues(range=c(1,5))

    ```


    指定的最小值和最大值之间的差值为 5。我可以通过将其从 5 改为 10 来增加这个差值。生成的散点图如图 4-12 所示。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig12_HTML.jpg](img/463840_1_En_4_Fig12_HTML.jpg)


    图 4-12


    显示市区和高速公路速度以及气缸数的散点图


    在下一个示例中，我将 `pch` 值更改为 24，并在 `aes` 函数名中添加了另一行代码：`fill=Red`。这意味着图表将显示实心的红色矩形（图 4-13）。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig13_HTML.jpg](img/463840_1_En_4_Fig13_HTML.jpg)


    图 4-13


    最终图表


    ```

    t<-ggplot(dataset, aes(x=cty, y=hwy,size=cyl,fill="Red")) + geom_point(pch=24)+scale_size_continuous(range=c(1,5))

    ```


    通过使用 R 中的 `facet` 命令，可以在一个图表中显示五个不同的变量。这有助于我们在图表中获得更多维度。为此，我们将展示汽车的生产年份及其驱动类型。因此，我们必须更改代码，如下所示：


    ```

    t← ggplot(dataset, aes(x=cty, y=hwy,color = factor(cyl))) + geom_point(size=4)

    ```


    通过更改 `aes` 函数参数，我们用 `color` 参数替换了 `size` 参数。这表明我想区分汽车的气缸值，不仅通过圆点大小，还要通过为它们分配不同的颜色来显示。因此，我按照上面的代码片段更改了
    `aes` 函数。


    我们必须更改代码，如下所示：


    ```

    library(ggplot2)

    t<-ggplot(dataset, aes(x=cty, y=hwy,color = factor(cyl))) + geom_point(size=4)

    t<-t + facet_grid(year ~ drv)

    ```


    现在，您可以在 y 轴和 x 轴上看到汽车在高速公路和市区的速度。此外，我们还将气缸数显示为颜色，将驱动类型和生产年份显示为分面（图 4-14）。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig14_HTML.jpg](img/463840_1_En_4_Fig14_HTML.jpg)


    图 4-14


    绘制显示五个变量的表格图


    ## Power BI 中的 R 功能


    R 脚本编辑器具有一些功能，可帮助我们更好地使用 Power BI Desktop，例如切片和切块以及编辑 R 代码。

    '
- fmt: '### Slice and Dice


    R visuals are interactive. It is possible to slice and dice them. We are going
    to use a slicer to slice the facet chart. We also are going to insert a year slicer
    in the report area, to filter the R visual (Figure [4-15](#463840_1_En_4_Chapter.xhtml#Fig15)).


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig15_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig15_HTML.jpg)


    Figure 4-15: Slicing and dicing the R visual


    ### Edit R Code in RStudio


    It is possible to open the code in RStudio with the data. There is also an option
    to run the R code in RStudio using the data we have (Figure [4-16](#463840_1_En_4_Chapter.xhtml#Fig16)).


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig16_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig16_HTML.jpg)


    Figure 4-16: Running the R code


    After clicking the Run option, a page will be open in RStudio that contains the
    data related to the car. The imported data set contains all changes in data (Figure
    [4-17](#463840_1_En_4_Chapter.xhtml#Fig17)).


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig17_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig17_HTML.jpg)


    Figure 4-17: Opening R code in RStudio


    ## Custom Visuals


    Using custom visuals is another way to extend the capability of visualization
    in Power BI. There are two ways to access custom visuals:


    1. Use existing custom visuals available from the Office store

    2. Create custom visuals


    ### Custom Visuals in the Power BI Office Store


    The Office store provides a variety of custom visuals to the Power BI user. To
    access them, you must first sign in to your work account (Figure [4-18](#463840_1_En_4_Chapter.xhtml#Fig18)).


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig18_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig18_HTML.jpg)


    Figure 4-18: Signing in to a Power BI account


    Then, in the Power BI Visualizations panel, click the three dots and select the
    Import from store option (Figure [4-19](#463840_1_En_4_Chapter.xhtml#Fig19)).


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig19_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig19_HTML.jpg)


    Figure 4-19: Importing visuals from the Power BI store


    Next, you will see a page with the title “Power BI Custom Visuals.” There are
    many categories listed here, such as filters, KPIs, Maps, Advanced Analytics,
    Time, Gauges, Infographics, and Data Visualizations (Figure [4-20](#463840_1_En_4_Chapter.xhtml#Fig20)).


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig20_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig20_HTML.jpg)


    Figure 4-20: Power BI Custom Visuals pane


    As mentioned, Power BI Custom Visuals includes an Advanced Analytics category.
    By clicking it, you will see such advanced analytics as time series, associative
    rules, clustering, and more. I am going to use one of these custom visuals to
    forecast milk production.


    The first step is to import a milk data set into Power BI Desktop. The data has
    two columns: date of milk production and value of the milk (Figure [4-21](#463840_1_En_4_Chapter.xhtml#Fig21)).


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig21_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig21_HTML.jpg)


    Figure 4-21: Milk production data


    We must now import custom visuals from Power BI Custom Visuals, to forecast milk
    production (Figure [4-22](#463840_1_En_4_Chapter.xhtml#Fig22)).


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig22_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig22_HTML.jpg)


    Figure 4-22: Advanced Analytics time series custom visual


    After importing Custom Visuals, you will see that it has been added to the standard
    visual panel (Figure [4-23](#463840_1_En_4_Chapter.xhtml#Fig23)).


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig23_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig23_HTML.jpg)


    Figure 4-23: Forecasting a custom visual


    Having imported the forecasting custom visual, we must now choose the date and
    value for the data field.


    This custom visual uses an Exponential Smoothing algorithm for forecasting milk
    production over the next ten months (Figure [4-24](#463840_1_En_4_Chapter.xhtml#Fig24)).


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig24_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig24_HTML.jpg)


    Figure 4-24: Forecasting milk production


    The forecasting chart shows in yellow the actual data related to the production
    of milk in the previous months, and the forecasting for the later ten months is
    in red.


    The algorithm behind the scenes is not accessible, and we are only able to change
    the parameters (Figure [4-25](#463840_1_En_4_Chapter.xhtml#Fig25)).


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig25_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig25_HTML.jpg)


    Figure 4-25: Forecast milk production for the next ten months


    Custom visuals in Power BI extend the possibility of having different charts.
    However, the number of custom visuals created by the Microsoft team is limited.
    To extend visualization capabilities, there is a way to create custom visuals
    by using R scripts. In the next section, I will explain the process of creating
    custom visuals.'
