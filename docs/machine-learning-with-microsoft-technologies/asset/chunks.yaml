    Figure 18-6


    Pricing tiers for Text Analytics


    After creating the Text Analytics service, we get the API URL and key access from
    the created service. Figure [18-7](#463840_1_En_18_Chapter.xhtml#Fig7) shows how
    to access the URL and the access key in the Text Analytics service.


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig7_HTML.jpg](images/463840_1_En_18_Chapter/463840_1_En_18_Fig7_HTML.jpg)


    Figure 18-7


    Accessing the URL and key


    After creating the service from the Azure portal, we must call it inside the Power
    BI Desktop and apply it on the available data there.


    ### Data Set


    Fabrikam is a mock production company. It has received e-mails from customers
    regarding shipping, tech support, and other concerns. The business intelligence
    (BI) manager wants to perform some analytics on the e-mail the company is receiving
    from customers, to better understand the main points of customers’ e-mails and
    to determine whether they are satisfied with the company’s services. You can download
    the data set from [`https://github.com/Kaiqb/KaiqbRepo0731190208/blob/master/CognitiveServices/TextAnalytics/FabrikamComments.csv`](https://github.com/Kaiqb/KaiqbRepo0731190208/blob/master/CognitiveServices/TextAnalytics/FabrikamComments.csv)
    [[3](#463840_1_En_18_Chapter.xhtml#Par58)].


    The first step is to open Power BI Desktop and load the data set, as a Text/CSV
    file, into Power BI (Figure [18-8](#463840_1_En_18_Chapter.xhtml#Fig8)).


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig8_HTML.jpg](images/463840_1_En_18_Chapter/463840_1_En_18_Fig8_HTML.jpg)


    Figure 18-8


    Getting a CSV file from Power BI


    Then, instead of loading the data, click the Edit option to navigate to the Power
    Query environment for data transformation (Figure [18-9](#463840_1_En_18_Chapter.xhtml#Fig9)).
    As you can see in Figure [18-9](#463840_1_En_18_Chapter.xhtml#Fig9), an overview
    of the data set is shown. There are about 20 rows of data about customer e-mails,
    names and IDs, e-mail subjects, and comments.


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig9_HTML.jpg](images/463840_1_En_18_Chapter/463840_1_En_18_Fig9_HTML.jpg)


    Figure 18-9


    Editing data in Power Query


    First, we are going to combine the Subject and Comment columns in Power Query,
    using Merge Columns under the Add Column tab. The general procedure is shown in
    Figure [18-10](#463840_1_En_18_Chapter.xhtml#Fig10).


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig10_HTML.jpg](images/463840_1_En_18_Chapter/463840_1_En_18_Fig10_HTML.jpg)


    Figure 18-10


    Merging Subject and Comment columns


    After creating a new column, we must rename it to Customer Feedback*.*


    ### Create a Text Analytics Function


    It is possible to create a function in Power Query that applies Text Analytics
    to a specific column in Power Query. To create a function, we must click the whitespace
    in a query, at the left side of the main page, and choose the Blank Query option
    (Figure [18-11](#463840_1_En_18_Chapter.xhtml#Fig11)).


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig11_HTML.jpg](images/463840_1_En_18_Chapter/463840_1_En_18_Fig11_HTML.jpg)


    Figure 18-11


    Creating a blank query


    Rename the created query Sentiment Analytics. The next step is to convert the
    blank query to a function. To do that, we must access the M Query behind the created
    query, by clicking on the Home tab, then Advanced Editor (Figure [18-12](#463840_1_En_18_Chapter.xhtml#Fig12)).
    Here there is an editor that we are going to use to write some M scripts and change
    the query to a function.


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig12_HTML.jpg](images/463840_1_En_18_Chapter/463840_1_En_18_Fig12_HTML.jpg)


    Figure 18-12


    Power BI Query Editor


    The next step is to add the following code:


    ```

    (text) => let

    apikey      = "",

    endpoint    = "https://.api.cognitive.microsoft.com/text/analytics/v2.0/sentiment",

    jsontext    = Text.FromBinary(Json.FromValue(Text.Start(Text.Trim(text), 5000))),

    jsonbody    = "{ documents: [ { language: ""en"", id: ""0"", text: " & jsontext
    & " } ] }",

    bytesbody   = Text.ToBinary(jsonbody),

    headers     = [#"Ocp-Apim-Subscription-Key" = apikey],

    bytesresp   = Web.Contents(endpoint, [Headers=headers, Content=bytesbody]),

    jsonresp    = Json.Document(bytesresp),

    sentiment   = jsonresp[documents]{0}[score]

    in  sentiment

    ```


    As you can see in the preceding code, the first line is about the function input
    which is `text`. In line 2, the API key collected from Azure Service must be pasted
    here. In line 3, the required URL for connecting to the API must be provided.
    As you can see at the end of the URL, the service that we are going to use from
    Cognitive Services is shown. In this example, we are using sentiment analysis.
    Lines 4 to 11 indicate the required code for connecting to Cognitive Services
    and getting the result in JSON format. The last line is the result column that
    shows the sentiment score for each comment.


    Now, replace the preceding code with the previous one and click OK. The blank
    query will change to a function type, and a page with a text box will appear.
    You can test it by writing a sentence, such as “the weather is so nice today,”
    and click the Invoke button, to see the result.


    As you can see in Figure [18-13](#463840_1_En_18_Chapter.xhtml#Fig13), the result
    of sentiment analysis is 0.92.


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig13_HTML.jpg](images/463840_1_En_18_Chapter/463840_1_En_18_Fig13_HTML.jpg)


    Figure 18-13


    Text Analytics function test in Power Query


    The output of the sentiment analysis is a number from 0 to 1\. A number closer
    to 1 means that the comment is positive, one closer to 0 means the feedback is
    negative.


    For a final step, we can apply the function to the customer feedback (Comments)
    column. Click the Fabrikam data set, the Add Column tab, and then Invoke Custom
    Function. On a new page, choose an appropriate name for the new column, then choose
    the function in the drop-down. From the last drop-down item, choose the column
    you want to apply the function to (Figure [18-14](#463840_1_En_18_Chapter.xhtml#Fig14)).


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig14_HTML.jpg](images/463840_1_En_18_Chapter/463840_1_En_18_Fig14_HTML.jpg)


    Figure 18-14


    Invoke a custom function for sentiment analysis


    A new column will be shown at the end of the data set overview that shows the
    numeric result for sentiment analysis. As you can see in Figure [18-15](#463840_1_En_18_Chapter.xhtml#Fig15),
    the number varies from 0 to 1\. You can click the Home tab and Close and Apply
    to see the result in Power BI Desktop.'
