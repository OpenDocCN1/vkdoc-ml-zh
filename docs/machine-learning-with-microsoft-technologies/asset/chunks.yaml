    ## Azure ML Workbench


    Azure ML Workbench is an integrated, end-to-end data science and advanced analytics
    solution. It is a tool for preparing data, developing models and experiments,
    and, finally, deployment at the cloud scale. Azure ML Workbench is a new version
    of Azure ML that has some differences from Azure ML Studio. In Table [14-1](#463840_1_En_14_Chapter.xhtml#Tab1),
    I have summarized the principal differences between Azure ML Workbench and Azure
    ML Studio.


    Table 14-1: Azure ML Workbench vs Azure ML Studio


    | | Azure ML Workbench | Azure ML Studio |

    | --- | --- | --- |

    | Users perspective | It is suitable for professional data scientists. | It is
    a great tool for users who are not experts in machine learning. |

    | Deployment | It is possible to deploy the model in cloud, manage the models,
    and track their deployment. | The deployment of models in Azure ML Studio is via
    API creation. |

    | Development language | The only development language is Python. | Model can
    be developed using R or Python code, in addition to using some existing models
    and transformation components. |

    | Accessibility | On-premises platform | Cloud-based platform |


    The five main components of Azure Machine Learning are:


    - Azure Machine Learning Workbench

    - Azure Machine Learning Experimentation Service

    - Azure Machine Learning Model Management Service

    - Microsoft Machine Learning Libraries for Apache Spark (MMLSpark library)

    - Visual Studio Code Tools for AI


