    #### Copying the embed code in a web page


    Test the code, and you will see the chatbot on the web page (Figure [19-23](#463840_1_En_19_Chapter.xhtml#Fig23)).


    ![../images/463840_1_En_19_Chapter/463840_1_En_19_Fig23_HTML.jpg](images/463840_1_En_19_Chapter/463840_1_En_19_Fig23_HTML.jpg)


    ### Figure 19-23

    #### Chatbot embeded in the web page


    ### Summary

    In this chapter, the general procedures for creating a chatbot were explained.


    ### References


    1.  Kamran Iqbal et al., “About Azure Bot Service,” Microsoft Azure, [`https://docs.microsoft.com/en-us/azure/bot-service/bot-service-overview-introduction?view=azure-bot-service-3.0`](https://docs.microsoft.com/en-us/azure/bot-service/bot-service-overview-introduction%253Fview%253Dazure-bot-service-3.0),
    April 17, 2019.


    2.  Bot Builder, [`https://marketplace.visualstudio.com/items?itemName=SkillBotBuilder.SkillBotBuilder`](https://marketplace.visualstudio.com/items%253FitemName%253DSkillBotBuilder.SkillBotBuilder).


    3.  Tony Anziano, “Bot Framework-Emulator,” GitHub, [`https://github.com/Microsoft/BotFramework-Emulator/releases`](https://github.com/Microsoft/BotFramework-Emulator/releases),
    2019.


    4.  Microsoft Visual Studio, Downloads, [`https://visualstudio.microsoft.com/downloads/`](https://visualstudio.microsoft.com/downloads/),
    2019.


    5.  Microsoft QnA Maker, [`www.qnamaker.ai/`](http://www.qnamaker.ai/), 2019.


    ## 20. Overview of Microsoft Machine Learning Tools


    The last 19 chapters were an overview of how you can undertake machine learning
    with different Microsoft products. First, an introduction to machine learning
    approaches, such as descriptive, predictive, and prescriptive analytics, was provided.
    The R language, as one of the principal languages for machine learning was then
    discussed. Following was a brief explanation of how to do machine learning using
    such tools as Power BI, Azure ML Studio, SQL Server, and others. This chapter
    offers a summary of machine learning technologies and best practices when using
    particular approaches.


    ### Overview of Microsoft Machine Learning Technologies

    Artificial intelligence (AI), and specifically machine learning, can bring lots
    of benefits to businesses. Many have been using Microsoft data platform tools
    for years. Microsoft employed machine learning to create such products such as
    Xbox, Bing Search, and others. However, from 2014, Microsoft began to provide
    a facility for power users and end users to embed machine learning in their reports
    and software.


    Previous chapters categorized the relevant Microsoft tools, based on the way machine
    learning is used. In this chapter, technologies are categorized according to the
    following:


    *   The need to write R or Python code

    *   Cloud or on-premises computing


    The first classification is based on the degree to which these tools are easy
    to use and accurate.


    We can classify the associated products into two main groups:


    *   *Pre-built AI*: Microsoft machine learning tools that do not require that
    you write any R or Python code to generate a machine learning scenario.

    *   *Custom AI*: Microsoft machine learning tools that require you to know how
    to write R or Python code


    The first group is easy to use, and you need only follow the instructions provided.
    The main benefit of using pre-built AI tools is that there is no need to know
    the machine learning concepts, or at least by knowing some, most anyone is able
    to create an AI application. Pre-built AI tools can address general problems and
    issues, but for some business problems, other categories of tools (e.g., for writing
    R or Python code) are more efficient. In this book, the Cognitive Services (Chapter
    [18](#463840_1_En_18_Chapter.xhtml)) and Bot Framework (Chapter [19](#463840_1_En_19_Chapter.xhtml))
    are the tools that you can embed in Power BI, Windows, or other web applications
    without writing any R or Python code. As mentioned in the relevant chapters, there
    is no direct way to access the code behind pre-built custom AI tools, so there
    is no way to alter that code and change the algorithms.


    In contrast, to use Custom AI tools requires knowing how to code and how to write
    code for the purpose of machine learning. However, for some tools, such as Azure
    ML Studio, it is possible to conduct machine learning without writing R or Python
    code, although at least some understanding of how machine learning works is necessary.
    Some Custom AI tools address writing R or Python code inside other Microsoft tools,
    such as R or Python in


    *   Power BI (Chapters [6](#463840_1_En_6_Chapter.xhtml), [7](#463840_1_En_7_Chapter.xhtml),
    and [8](#463840_1_En_8_Chapter.xhtml))

    *   SQL Server 2016 for R Services and SQL Server 2017 for Machine Learning (ML)
    Services (Chapter [9](#463840_1_En_9_Chapter.xhtml))

    *   Azure Data Lake Analytics (Chapter [11](#463840_1_En_11_Chapter.xhtml))

    *   Azure Databricks (Chapter [10](#463840_1_En_10_Chapter.xhtml))

    *   Azure HDInsight (Chapter [15](#463840_1_En_15_Chapter.xhtml))'
