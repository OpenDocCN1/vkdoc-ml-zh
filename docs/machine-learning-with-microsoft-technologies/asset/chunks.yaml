    # 10. Azure Databricks


    Databricks 是一项基于 Apache Spark 开源项目的分析服务。Apache Spark 是一个批处理和实时处理环境。Apache Spark
    因其能够分析海量数据、具备流处理能力、图计算、机器学习以及交互式查询引擎，而在数据科学家中颇受欢迎。Spark 提供内存集群计算。Databricks 是
    Spark 上用于大数据分析的流行工具之一。Databricks 已被用于摄取大量数据、清洗数据、应用机器学习等场景。2018 年 2 月，Microsoft
    Azure 与 Databricks 进行了集成，为数据工程师、数据科学家和数据分析师提供了更好的协作。此次集成为数据科学和数据工程团队在 Azure 中提供了一个快速、简单且基于
    Spark 的协作平台 [1]。Azure Databricks 是一个用于大数据分析和机器学习的新平台。Azure Databricks 中的笔记本使数据工程师、数据科学家和业务分析师能够使用单一工具进行协作。本章概述了
    Azure Databricks 是什么、它所处的环境及其在数据科学中的应用。


    ## Databricks 环境


    要在 Azure 环境中创建 Azure Databricks，请登录你的一个 Azure 账户。然后，创建一个 Azure Databricks 模块（图
    10-1）。


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig1_HTML.jpg](img/463840_1_En_10_Fig1_HTML.jpg)


    图 10-1


    Azure Databricks 环境


    创建 Azure Databricks 模块后，Azure 将导航到一个新页面。要访问 Azure Databricks，请单击“启动工作区”（图 10-2）。


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig2_HTML.jpg](img/463840_1_En_10_Fig2_HTML.jpg)


    图 10-2


    启动工作区


    如图 10-3 所示，Azure Databricks 环境包含不同的组件。主要组件是工作区和集群。启动后的第一步是创建一个集群。Databricks 中的集群为
    ETL（提取、转换、加载）、流分析和机器学习提供了一个统一平台。集群分为两种类型：交互式集群和作业集群。笔记本集群用于协作分析数据。而作业集群则用于使用 API
    快速、稳健地运行自动化工作负载。集群页面可能包含这两种集群类型。每个集群可以有不同的节点。首先，你必须创建一个集群。单击“创建集群”选项（图 10-3）。


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig3_HTML.jpg](img/463840_1_En_10_Fig3_HTML.jpg)


    图 10-3


    在 Databricks 中创建集群


    在“创建集群”页面（图 10-4）上，输入相关信息，例如集群名称、版本（默认）、Python 版本、最小和最大工作节点数等。


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig4_HTML.jpg](img/463840_1_En_10_Fig4_HTML.jpg)


    图 10-4


    Azure Databricks 中的“创建集群”页面


    如图 10-4 所示，我们有一个驱动节点和一个工作节点。工作节点用于分配你的工作负载。驱动节点负责维护 SparkContext。可以自动调整和自动缩放集群的大小。通过启用自动缩放，可以在集群的生命周期内限制最小和最大工作节点数。


    要使用集群，你应该等待状态变为“正在运行”（图 10-5）。通过创建交互式集群，你可以创建一个笔记本，在其中编写代码并快速获取结果。


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig5_HTML.jpg](img/463840_1_En_10_Fig5_HTML.jpg)


    图 10-5


    正在运行的集群


    要创建笔记本，请单击“工作区”选项并创建一个新笔记本（图 10-6）。


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig6_HTML.jpg](img/463840_1_En_10_Fig6_HTML.jpg)


    图 10-6


    在 Databricks 中创建笔记本


    通过创建新笔记本，你可以指定该笔记本属于哪个集群，以及笔记本的主要语言（Python、Scala、R 和 SQL）是什么。在此示例中，R 语言已被选为默认语言。但是，你仍然可以在笔记本中使用其他语言编写，方法是在脚本前写入
    `%scala`、`%python`、`%sql` 或 `%r`（图 10-7）。


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig7_HTML.jpg](img/463840_1_En_10_Fig7_HTML.jpg)


    图 10-7


    在 Databricks 中创建 R 笔记本

