    ## 总结


    本章简要介绍了 Microsoft 认知服务中易于使用的 AI 工具。首先对认知服务及其访问方式进行了简要说明，然后解释了如何在其他 Microsoft 工具（如
    Power BI）中使用认知服务文本分析 API。接着，讨论了在 Windows 应用程序中使用认知 API 的过程，并展示了所有相关代码。下一章将探讨用于创建智能应用程序的另一个工具——Bot
    Framework。


    # 19. Bot Framework


    机器人是一种能够以对话方式与用户交互的应用程序 [1]。它可以是一个非常简单的、支持对话和基本问题的应用程序，也可以是能够理解语言的复杂应用程序。在 Microsoft
    Azure 中，可以使用 C# 或 Node.js 创建机器人。您可以使用 .NET SDK [2] 创建机器人，并通过模拟器 [3] 等工具进行测试。此外，一些机器人组件可帮助您添加更多功能
    [4]。本章将介绍一个使用 Azure 组件的非常简单的机器人。首先，将展示如何在 Azure 中创建机器人服务，然后介绍如何创建一个用于问答的简单机器人，以及一个更复杂的机器人。


    ## 在 Azure 中创建机器人


    登录您的 Azure 帐户并创建一个新服务名称：Web 应用机器人（图 19-1）。


    创建新的机器人服务时，您必须提供一些信息，例如机器人名称、订阅、资源组、位置等。您需要在开始时选择的主要字段之一是机器人模板。默认选项是基本 (C#)。在我们的场景中，我们将把默认选项更改为“表单”，这有助于我们创建一个引导最终用户的机器人应用程序。


