  trans: "\n图 19-15\n常见问题解答\n\n现在，你必须将文件上传到网站并创建知识库（图 19-16）。\n\n![../images/463840_1_En_19_Chapter/463840_1_En_19_Fig16_HTML.jpg](img/463840_1_En_19_Fig16_HTML.jpg)\n\
    \n图 19-16\n创建知识库\n\n创建知识库后，你可以通过点击`添加` `QnA 对`来扩展知识库问题（图 19-17）。此外，还可以添加更多的问题和答案。\n\
    \n![../images/463840_1_En_19_Chapter/463840_1_En_19_Fig17_HTML.jpg](img/463840_1_En_19_Fig17_HTML.jpg)\n\
    \n图 19-17\n添加 QnA 对\n\n上传并添加问题后，你必须“保存并训练”知识库。训练模型后，点击“测试”。输入“Conference”，知识库将返回结果（图\
    \ 19-18）。\n\n![../images/463840_1_En_19_Chapter/463840_1_En_19_Fig18_HTML.jpg](img/463840_1_En_19_Fig18_HTML.jpg)\n\
    \n图 19-18\n测试知识库\n\n测试知识库后，我们必须将其发布。发布知识库后，将构建一个 HTTP 请求。创建的请求包含所有必需的信息，例如知识库\
    \ ID、终结点链接和身份验证密钥（图 19-19）。\n\n![../images/463840_1_En_19_Chapter/463840_1_En_19_Fig19_HTML.jpg](img/463840_1_En_19_Fig19_HTML.jpg)\n\
    \n图 19-19\n创建 HTTP 请求\n\n这些参数可以在图 19-11 中查看。在 webappqnabook（图 19-20）中，点击“应用程序设置”，并使用\
    \ HTTP 请求参数填充这些参数（图 19-20）。\n\n![../images/463840_1_En_19_Chapter/463840_1_En_19_Fig20_HTML.jpg](img/463840_1_En_19_Fig20_HTML.jpg)\n\
    \n图 19-20\n应用程序设置参数\n\n现在，我们必须测试聊天机器人。在 Web Chat 中点击“测试”，然后输入“Conference”。输出将显示在测试窗口中（图\
    \ 19-21）。\n\n![../images/463840_1_En_19_Chapter/463840_1_En_19_Fig21_HTML.jpg](img/463840_1_En_19_Fig21_HTML.jpg)\n\
    \n图 19-21\n测试聊天机器人\n\n你可以将问题和答案嵌入到任何页面和渠道中。在此示例中，该聊天机器人已嵌入到会议网站中，以引导用户。要将聊天机器人嵌入网站，我们必须获取嵌入代码。要获取嵌入代码，请遵循与图\
    \ 19-9 相关的相同步骤。\n\n接下来，复制代码并将其放入网页中（图 19-22）。\n\n![../images/463840_1_En_19_Chapter/463840_1_En_19_Fig22_HTML.jpg](img/463840_1_En_19_Fig22_HTML.jpg)\n\
    \n图 19-22\n在网页中复制嵌入代码\n\n测试代码，你将看到网页上的聊天机器人（图 19-23）。\n\n![../images/463840_1_En_19_Chapter/463840_1_En_19_Fig23_HTML.jpg](img/463840_1_En_19_Fig23_HTML.jpg)\n\
    \n图 19-23\n嵌入网页的聊天机器人\n\n总结\n本章解释了创建聊天机器人的一般步骤。\n\n参考文献\n\n1.  Kamran Iqbal 等，“关于\
    \ Azure 机器人服务”，Microsoft Azure，\n    [`https://docs.microsoft.com/en-us/azure/bot-service/bot-service-overview-introduction?view=azure-bot-service-3.0`](https://docs.microsoft.com/en-us/azure/bot-service/bot-service-overview-introduction%253Fview%253Dazure-bot-service-3.0)，2019\
    \ 年 4 月 17 日。\n\n2.  Bot Builder，[`https://marketplace.visualstudio.com/items?itemName=SkillBotBuilder.SkillBotBuilder`](https://marketplace.visualstudio.com/items%253FitemName%253DSkillBotBuilder.SkillBotBuilder)。\n\
    \n3.  Tony Anziano，“Bot Framework-Emulator”，GitHub，[`https://github.com/Microsoft/BotFramework-Emulator/releases`](https://github.com/Microsoft/BotFramework-Emulator/releases)，2019\
    \ 年。\n\n4.  Microsoft Visual Studio，下载，[`https://visualstudio.microsoft.com/downloads/`](https://visualstudio.microsoft.com/downloads/)，2019\
    \ 年。\n\n5.  Microsoft QnA Maker，[`www.qnamaker.ai/`](http://www.qnamaker.ai/)，2019\
    \ 年。\n\n20. Microsoft 机器学习工具概述\n\n前 19 章概述了如何使用不同的 Microsoft 产品进行机器学习。首先，介绍了机器学习方法，例如描述性分析、预测性分析和规范性分析。然后讨论了作为机器学习主要语言之一的\
    \ R 语言。接着简要说明了如何使用 Power BI、Azure ML Studio、SQL Server 等工具进行机器学习。本章总结了机器学习技术以及使用特定方法时的最佳实践。\n\
    \nMicrosoft 机器学习技术概述\n人工智能（AI），特别是机器学习，可以为企业带来诸多好处。多年来，许多人一直在使用 Microsoft 数据平台工具。Microsoft\
    \ 运用机器学习创建了 Xbox、必应搜索等产品。然而，从 2014 年开始，Microsoft 开始为高级用户和最终用户提供将机器学习嵌入其报告和软件的功能。\n\
    \n前面的章节根据机器学习的使用方式对相关的 Microsoft 工具进行了分类。在本章中，技术根据以下内容进行分类：\n\n*   是否需要编写 R 或\
    \ Python 代码\n*   云计算还是本地计算\n\n第一种分类基于这些工具的易用性和准确性程度。\n\n我们可以将相关产品分为两大类：\n\n* \
    \  *预构建 AI*：无需编写任何 R 或 Python 代码即可生成机器学习场景的 Microsoft 机器学习工具。\n*   *自定义 AI*：需要了解如何编写\
    \ R 或 Python 代码的 Microsoft 机器学习工具。\n\n第一组易于使用，你只需遵循提供的说明即可。使用预构建 AI 工具的主要好处是无需了解机器学习概念，或者至少了解一些概念，大多数人都能够创建\
    \ AI 应用程序。预构建 AI 工具可以解决一般问题，但对于某些业务问题，其他类别的工具（例如，用于编写 R 或 Python 代码的工具）更有效。在本书中，认知服务（第\
    \ 18 章）和机器人框架（第 19 章）是你可以嵌入到 Power BI、Windows 或其他 Web 应用程序中而无需编写任何 R 或 Python\
    \ 代码的工具。正如相关章节所述，没有直接方法可以访问预构建自定义 AI 工具背后的代码，因此无法更改该代码和算法。\n\n相比之下，使用自定义 AI 工具需要了解如何编码以及如何为机器学习目的编写代码。然而，对于某些工具，例如\
    \ Azure ML Studio，可以在不编写 R 或 Python 代码的情况下进行机器学习，尽管至少需要对机器学习的工作原理有一定的了解。一些自定义\
    \ AI 工具涉及在其他 Microsoft 工具内部编写 R 或 Python 代码，例如在以下工具中使用 R 或 Python：\n\n*   Power\
    \ BI（第 6、7 和 8 章）\n*   SQL Server 2016 的 R Services 和 SQL Server 2017 的机器学习（ML）Services（第\
    \ 9 章）\n*   Azure Data Lake Analytics（第 11 章）\n*   Azure Databricks（第 10 章）\n\
    *   Azure HDInsight（第 15 章）\n"
- fmt: '# .NET Applications and AI Tool Classification


    - .NET applications (Chapter [13](#463840_1_En_13_Chapter.xhtml))

    - And others


    For Azure machine learning tools, it is possible to write `R` or `Python` code
    as well. In addition, the drag-and-drop environment is quite easy to use.


    The second classification is about cloud vs. on-premises AI tools. Many companies
    still prefer to keep their tools on-site, while some others prefer to move all
    their business products to the cloud. Between the two, some companies have both
    cloud and on-premises tools.


    If the main strategy of a company is to keep everything on-premises, using `Power
    BI` or `SQL Server` for writing `R` or `Python` can be more suitable. However,
    if the preference is to do machine learning in the cloud, the `Azure ML Studio`
    (Chapter [12](#463840_1_En_12_Chapter.xhtml)), for writing `R` or `Python` on
    `Databricks`, and `Azure Data Analytics` can be most helpful.


    The third categories of tools address solutions to business problems. The nature
    of a problem and the scenario that we want to enrich with AI also matter when
    selecting specific tools, for example:


    - Applying machine learning on Internet of things (IoT) use case scenarios

    - Using Text Analytics, speech, images, and so forth, for analysis

    - Applying machine learning to an ETL (extract, transform, load) project

    - Fast tracking a prototype for a client with Azure Machine Studio


    ## IoT Scenario


    Analyzing real-time data is a need that has been addressed by such Microsoft tools
    as `Event Hub`, `Stream Analytics` (Chapter [13](#463840_1_En_13_Chapter.xhtml)),
    `Databricks` (Chapter [10](#463840_1_En_10_Chapter.xhtml)), and others. With `Power
    BI`, it is possible to create a live stream report based on the real data that
    flows from sensors, applications, and so forth.


    For most of this scenario, there is a need to identify anomalies in the data or
    classify prospective data into different groups. By using `Azure Machine Learning`
    with `Stream Analytics` or `Databricks`, we can apply machine learning to IoT
    scenarios.


    ## Image, Text, and Voice Analytics


    There are different tools for image, text, and voice analytics in the Microsoft
    stack. `Cognitive Services` (Chapter [18](#463840_1_En_18_Chapter.xhtml)) is one
    of the popular tools for text, voice, and image analytics that provides APIs to
    use in other applications.


    However, it is also possible to do image processing and voice recognition using
    the `CNTK` platform, which is covered in Chapter [17](#463840_1_En_17_Chapter.xhtml).
    These Microsoft packages and libraries provide facilities for developers to employ
    for performing machine learning with a deep learning approach.


    ## Machine Learning on ETL


    Another possible requirement is to apply machine learning to data that has been
    loaded and transformed with the aim of visualization and creating reports. There
    is always a need to apply some descriptive or predictive analytics on data before
    showing it to the final users. As a result, those who use `Power BI` self-service
    BI can leverage the machine learning, using `R` and `Python` scripts to make reports
    more insightful.


    Another approach is to use `R` or `Python` in `SQL Server 2016` or `2017`. In
    addition, if the data is on the cloud, it is possible to use `Databricks` for
    ETL and machine learning at the same time.


    ## Machine Learning Prototype


    For companies that want to use machine learning on their data for the first time,
    `Azure Machine Learning Studio` is a great tool that demonstrates the real process
    of machine learning, from collecting data to training and testing models. Moreover,
    managers and stakeholders are able to fast track the machine learning process
    and see how it can be used as an API in other applications or a simple Excel file.


    To sum up, tool selection for machine learning depends on the architecture being
    used, how much effort is willing to be expended on programming, and what scenario
    is to be put in place. Tools related to the first requirement are based on pre-built
    AI and custom AI. Those for the second depend on the current architecture in place,
    whether on-premises or cloud-based. Finally, the last requirement to consider
    relates to appropriate tools for a specific scenario that is to be implemented,
    such as for IoT, ETL, or prototype creation.


