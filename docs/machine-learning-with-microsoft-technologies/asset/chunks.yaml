    现在，我们必须更改订阅密钥和 API 的位置。为了检测并上传图像，我们编写一个函数，如下所示：


    ```

    private async Task> UploadAndDetectFaces(string imageFilePath)

    {

    // 要返回的人脸属性列表。

    IList faceAttributes =

    new FaceAttributeType[]

    {

    FaceAttributeType.Gender, FaceAttributeType.Age,

    FaceAttributeType.Smile, FaceAttributeType.Emotion,

    FaceAttributeType.Glasses, FaceAttributeType.Hair

    };

    // 调用人脸 API。

    try

    {

    using (Stream imageFileStream = File.OpenRead(imageFilePath))

    {

    // 第二个参数指定返回 faceId，

    // 第三个参数指定不返回人脸特征点。

    IList faceList =

    await faceClient.Face.DetectWithStreamAsync(

    imageFileStream, true, false, faceAttributes);

    return faceList;

    }

    }

    // 捕获并显示人脸 API 错误。

    catch (APIErrorException f)

    {

    MessageBox.Show(f.Message);

    return new List();

    }

    // 捕获并显示所有其他错误。

    catch (Exception e)

    {

    MessageBox.Show(e.Message, "Error");

    return new List();

    }

    }

    ```


    我们可以在图片中每个人物的脸部周围绘制一个矩形。在 `BrowseButton` 函数中，编写以下代码：


    ```

    Title = "Detecting...";

    faceList = await UploadAndDetectFaces(filePath);

    Title = String.Format(

    "Detection Finished. {0} face(s) detected", faceList.Count);

    if (faceList.Count > 0)

    {

    // 准备在人脸周围绘制矩形。

    DrawingVisual visual = new DrawingVisual();

    DrawingContext drawingContext = visual.RenderOpen();

    drawingContext.DrawImage(bitmapSource,

    new Rect(0, 0, bitmapSource.Width, bitmapSource.Height));

    double dpi = bitmapSource.DpiX;

    resizeFactor = (dpi > 0) ? 96 / dpi : 1;

    faceDescriptions = new String[faceList.Count];

    for (int i = 0; i < faceList.Count; ++i)

    {

    DetectedFace face = faceList[i];

    // 在人脸上绘制矩形。

    drawingContext.DrawRectangle(

    Brushes.Transparent,

    new Pen(Brushes.Red, 2),

    new Rect(

    face.FaceRectangle.Left ∗ resizeFactor,

    face.FaceRectangle.Top ∗ resizeFactor,

    face.FaceRectangle.Width ∗ resizeFactor,

    face.FaceRectangle.Height ∗ resizeFactor

    )

    );

    // 存储人脸描述。

    faceDescriptions[i] = FaceDescription(face);

    }

    drawingContext.Close();

    // 显示带有脸部矩形的图像。

    RenderTargetBitmap faceWithRectBitmap = new RenderTargetBitmap(

    (int)(bitmapSource.PixelWidth ∗ resizeFactor),

    (int)(bitmapSource.PixelHeight ∗ resizeFactor),

    96,

    96,

    PixelFormats.Pbgra32);

    faceWithRectBitmap.Render(visual);

    FacePhoto.Source = faceWithRectBitmap;

    // 设置状态栏文本。

    faceDescriptionStatusBar.Text =

    "Place the mouse pointer over a face to see the face description.";

    }

