    \ Microsoft R 服务和 Python（图 9-3）。\n\n![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig3_HTML.jpg](img/463840_1_En_9_Fig3_HTML.jpg)\n\
    \n图 9-3\n\n为 SQL Server 2017 安装机器学习服务\n\nSQL Server 2017 中的机器学习服务可在本地和云中运行。该服务包含丰富的算法集，例如\
    \ RevoScaleR、Revoscalepy 和 MicrosoftML。此外，它还支持多种微软自定义的 R 和 Python 包。在本章中，我将解释如何简化在\
    \ SQL Server 2016 和 2017 中编写 R 脚本的过程（两者相同）。此外，还将解释如何使用 R 进行机器学习，什么是 RevoScaleR，以及如何支持特定算法。同时也会涵盖一些功能，例如如何使用预训练模型进行视觉分析和情感分析，以及如何将解决方案部署为\
    \ Web 服务。\n\n## 运行 R 脚本\n\n在 SQL Server（2016 或 2017）中安装 R 服务后，你必须通过特定的存储过程启用 SQL\
