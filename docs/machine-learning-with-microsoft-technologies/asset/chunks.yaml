    \ = C.classification_error(z, label)\n```\n\nFor additional examples, check the\
    \ relevant samples and resources from the Microsoft web site.\n\n## Summary\n\n\
    The aim of this chapter was to introduce neural networks and associated deep learning\
    \ concepts. How to set up CNTK and how to run it in a DSVM was then discussed.\
    \ Some elaboration of concepts related to neural networks, their structure, and\
    \ so forth, was provided. Next, how to set up CNTK in Windows for the Python language\
    \ was covered. Finally, a very brief explanation on how to use the CNTK library\
    \ for prediction was given.\n\n# Part V Data Science Virtual Machine\n\n# 18.\
    \ Cognitive Services Toolkit\n\nMicrosoft Cognitive Services are collections of\
    \ APIs and services that help developers create smarter applications and reports.\
    \ By using Cognitive Services, developers can add such intelligent features as\
    \ face recognition, emotion recognition, text analytics, and so forth, to their\
    \ applications. This chapter first presents an overview of Cognitive Services\
    \ and then explains how to use them for text analytics in Power BI Report. Finally,\
    \ how to use Cognitive Services in a Windows application is explored briefly.\n\
    \n## Overview of Cognitive Services\n\nThere are different Cognitive Services\
    \ that you can use by receiving a web service URL and a key. To check out the\
    \ available services, you must navigate to the Cognitive Services web site [[1](#463840_1_En_18_Chapter.xhtml#Par56)].\
    \ As you can see in Figure [18-1](#463840_1_En_18_Chapter.xhtml#Fig1), there are\
    \ five main categories for solving business problems: Vision, Knowledge, Language,\
    \ Speech, and Search.\n\n![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig1_HTML.jpg](images/463840_1_En_18_Chapter/463840_1_En_18_Fig1_HTML.jpg)\n\
    \n**Figure 18-1** Main Cognitive Services categories\n\nAs you can see in Figure\
    \ [18-2](#463840_1_En_18_Chapter.xhtml#Fig2), there are five different APIs for\
    \ business language problems. Text Analytics is one of the most popular features\
    \ for language detection, identifying main keywords in text, topic extraction,\
    \ and checking how much text is positive or negative in context (sentiment analysis).\n\
    \n![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig2_HTML.jpg](images/463840_1_En_18_Chapter/463840_1_En_18_Fig2_HTML.jpg)\n\
    \n**Figure 18-2** Language category in Cognitive Services\n\nThe other services\
    \ in the Language category are about translating a text, identifying the primary\
    \ intent, and objectives in conversations and texts.\n\nThese features can be\
    \ combined. For example, it is possible to integrate the Language Understanding\
    \ service with the Speech service, for instant speech-to-intent processing, and,\
    \ with a Bot application (Chapter [19](#463840_1_En_19_Chapter.xhtml)), to develop\
    \ a more sophisticated application.\n\nIn this chapter, you will see how you can\
    \ perform text analytics for the purpose of detecting main keywords in customer\
    \ feedback, how much of the feedback is positive, detecting the language in Power\
    \ BI, by using Text Analytics services.\n\nFirst, we must set up the environment\
    \ in which to use Cognitive Services. To use Cognitive Services, you can sign\
    \ up for a free trial. The trial services are free for seven days and do not require\
    \ a credit card. The other way to access Cognitive Services is to use a free Azure\
    \ account for a month, which provides a $280 credit on Azure, and all data and\
    \ customization will be saved. The final approach is to use an existing Azure\
    \ account (Figure [18-3](#463840_1_En_18_Chapter.xhtml#Fig3)).\n\n![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig3_HTML.jpg](images/463840_1_En_18_Chapter/463840_1_En_18_Fig3_HTML.jpg)\n\
    \n**Figure 18-3** Different Cognitive Services accounts\n\nTo set up Cognitive\
    \ Services in Azure, you must log in to your Azure account and search for the\
    \ services you want. After logging in to the Azure portal, you must create a Text\
    \ Analytics service. To create a Text Analytics service, you must create a new\
    \ service in Azure, by clicking the top left of the page. In the New page, the\
