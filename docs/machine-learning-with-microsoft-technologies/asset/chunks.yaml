    # 19. Bot Framework


    A bot is an application that is able to interact with users conversationally [[1](#463840_1_En_19_Chapter.xhtml#Par35)].
    It can be a very simple application that supports dialog and basic questions,
    or it can be sophisticated, capable of understanding language. In Microsoft Azure,
    it is possible to create a bot in C# or Node.js. You can create a bot using .NET
    SDK [[2](#463840_1_En_19_Chapter.xhtml#Par36)] and test it via such tools as Emulator
    [[3](#463840_1_En_19_Chapter.xhtml#Par37)]. In addition, some bot components help
    you to add more features [[4](#463840_1_En_19_Chapter.xhtml#Par38)]. In this chapter,
    a very simple bot using an Azure component will be presented. First, how to create
    a bot service in Azure will be shown, then how to create a simple bot for questions
    and answers will be presented, as well as a more complex one.


    ## Bot Creation in Azure


    Log in to your Azure account and create a new service name: Web App Bot (Figure
    [19-1](#463840_1_En_19_Chapter.xhtml#Fig1)).


    On creating a new Bot service, you must provide some information, such as a bot
    name, subscription, resource group, location, and so forth. One of the main fields
    that you have to choose at the start is Bot template. The default option is Basic
    (C#). In our scenario, we are going to change the default option to Form, which
    helps us to create a bot application to guide end users.


    ![../images/463840_1_En_19_Chapter/463840_1_En_19_Fig1_HTML.jpg](images/463840_1_En_19_Chapter/463840_1_En_19_Fig1_HTML.jpg)


