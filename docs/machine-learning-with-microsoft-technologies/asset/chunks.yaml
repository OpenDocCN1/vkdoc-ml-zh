    ## 文本分析服务


    并非所有收集的数据都是数字和结构化数据。为了更全面地了解客户、产品等，可以收集和分析文本，以提升公司绩效。文本分析是将非结构化文本数据转换为有意义数据的过程，用于理解客户需求和反馈
    [2]。


    本节将介绍一个案例研究，说明如何在 Power BI 中使用文本分析 API，并将其应用于客户反馈。


    第一步是在 Azure 门户中设置文本分析服务（图 18-5）。


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig5_HTML.jpg](img/463840_1_En_18_Fig5_HTML.jpg)


    图 18-5


    在 Azure 门户中设置文本分析


    此服务有不同的定价层。第一个是免费层，允许用户每月对 5K 行数据应用文本分析服务（图 18-6）。


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig6_HTML.jpg](img/463840_1_En_18_Fig6_HTML.jpg)


    图 18-6


    文本分析的定价层


    创建文本分析服务后，我们从创建的服务中获取 API URL 和密钥访问权限。图 18-7 显示了如何在文本分析服务中访问 URL 和访问密钥。


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig7_HTML.jpg](img/463840_1_En_18_Fig7_HTML.jpg)


    图 18-7


    访问 URL 和密钥


    从 Azure 门户创建服务后，我们必须在 Power BI Desktop 中调用它，并将其应用于其中的可用数据。


    ### 数据集


    Fabrikam 是一家模拟生产公司。它收到了客户关于运输、技术支持和其他问题的电子邮件。商业智能（BI）经理希望对公司收到的客户电子邮件进行一些分析，以更好地理解客户邮件的要点，并确定他们是否对公司的服务感到满意。你可以从
    [`https://github.com/Kaiqb/KaiqbRepo0731190208/blob/master/CognitiveServices/TextAnalytics/FabrikamComments.csv`](https://github.com/Kaiqb/KaiqbRepo0731190208/blob/master/CognitiveServices/TextAnalytics/FabrikamComments.csv)
    下载数据集 [3]。


    第一步是打开 Power BI Desktop，并将数据集作为文本/CSV 文件加载到 Power BI 中（图 18-8）。


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig8_HTML.jpg](img/463840_1_En_18_Fig8_HTML.jpg)


    图 18-8


    从 Power BI 获取 CSV 文件


    然后，不要加载数据，而是点击“编辑”选项，导航到 Power Query 环境进行数据转换（图 18-9）。如图 18-9 所示，显示了数据集的概览。大约有
    20 行数据，涉及客户电子邮件、姓名和 ID、电子邮件主题以及评论。


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig9_HTML.jpg](img/463840_1_En_18_Fig9_HTML.jpg)


    图 18-9


    在 Power Query 中编辑数据


    首先，我们将在 Power Query 中，使用“添加列”选项卡下的“合并列”功能，合并“主题”和“评论”列。一般步骤如图 18-10 所示。


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig10_HTML.jpg](img/463840_1_En_18_Fig10_HTML.jpg)


    图 18-10


    合并主题和评论列


    创建新列后，我们必须将其重命名为“客户反馈”。


    ### 创建文本分析函数


    可以在 Power Query 中创建一个函数，将文本分析应用于 Power Query 中的特定列。要创建函数，我们必须点击主页面左侧查询中的空白区域，然后选择“空白查询”选项（图
    18-11）。


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig11_HTML.jpg](img/463840_1_En_18_Fig11_HTML.jpg)


    图 18-11


    创建空白查询


    将创建的查询重命名为“情感分析”。下一步是将空白查询转换为函数。为此，我们必须访问所创建查询背后的 M 查询，方法是点击“主页”选项卡，然后点击“高级编辑器”（图
    18-12）。这里有一个编辑器，我们将使用它来编写一些 M 脚本，并将查询更改为函数。


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig12_HTML.jpg](img/463840_1_En_18_Fig12_HTML.jpg)


    图 18-12


    Power BI 查询编辑器


    下一步是添加以下代码：


    ```

    (text) => let

    apikey      = "",

    endpoint    = "https://.api.cognitive.microsoft.com/text/analytics/v2.0/sentiment",

    jsontext    = Text.FromBinary(Json.FromValue(Text.Start(Text.Trim(text), 5000))),

    jsonbody    = "{ documents: [ { language: ""en"", id: ""0"", text: " & jsontext
    & " } ] }",

    bytesbody   = Text.ToBinary(jsonbody),

    headers     = [#"Ocp-Apim-Subscription-Key" = apikey],

    bytesresp   = Web.Contents(endpoint, [Headers=headers, Content=bytesbody]),

    jsonresp    = Json.Document(bytesresp),

    sentiment   = jsonresp[documents]{0}[score]

    in  sentiment

    ```


    如上述代码所示，第一行是关于函数输入，即 `text`。在第 2 行，必须粘贴从 Azure 服务收集的 API 密钥。在第 3 行，必须提供连接到 API
    所需的 URL。正如你在 URL 末尾所见，显示了我们将要使用的认知服务。在此示例中，我们使用的是情感分析。第 4 到 11 行指示了连接到认知服务并以 JSON
    格式获取结果所需的代码。最后一行是结果列，显示每条评论的情感得分。


    现在，用上述代码替换之前的代码，然后点击“确定”。空白查询将更改为函数类型，并出现一个带有文本框的页面。你可以通过写一个句子（例如“今天天气真好”）来测试它，然后点击“调用”按钮查看结果。


    如图 18-13 所示，情感分析的结果是 0.92。


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig13_HTML.jpg](img/463840_1_En_18_Fig13_HTML.jpg)


    图 18-13


    在 Power Query 中测试文本分析函数


    情感分析的输出是一个从 0 到 1 的数字。数字越接近 1 表示评论是正面的，越接近 0 表示反馈是负面的。


    最后一步，我们可以将函数应用于客户反馈（评论）列。点击 Fabrikam 数据集，选择“添加列”选项卡，然后点击“调用自定义函数”。在新页面上，为新列选择一个合适的名称，然后在下拉菜单中选择该函数。从最后一个下拉项中，选择要应用该函数的列（图
    18-14）。


    ![../images/463840_1_En_18_Chapter/463840_1_En_18_Fig14_HTML.jpg](img/463840_1_En_18_Fig14_HTML.jpg)


    图 18-14


    调用自定义函数进行情感分析


    数据集概览的末尾将显示一个新列，其中包含情感分析的数值结果。如图 18-15 所示，该数字在 0 到 1 之间变化。你可以点击“主页”选项卡，然后点击“关闭并应用”，在
    Power BI Desktop 中查看结果。

