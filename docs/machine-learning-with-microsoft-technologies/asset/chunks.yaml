- fmt: '# Azure Stream Analytics Environment


    Azure Stream Analytics is an event-processing component in the Azure environment.
    To create Azure Stream Analytics, you must log in to an Azure account and create
    a Stream Analytics job (Figure [13-1](#463840_1_En_13_Chapter.xhtml#Fig1)).


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig1_HTML.jpg](images/463840_1_En_13_Chapter/463840_1_En_13_Fig1_HTML.jpg)


    Figure 13-1: Creating an Azure Stream Analytics job in an Azure environment


    After creating a Stream Analytics job in Azure, you must set up some predefined
    parameters, such as the job name, subscription, resource group, and so forth (Figure
    [13-2](#463840_1_En_13_Chapter.xhtml#Fig2)).


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig2_HTML.jpg](images/463840_1_En_13_Chapter/463840_1_En_13_Fig2_HTML.jpg)


    Figure 13-2: Stream Analytics job initialization


    Stream Analytics is like a service bus inside Azure, able to fetch data from some
    components and apply some analytics on received data and pass it to other components.
    As a result, the Stream Analytics environment contains three main components:
    Inputs, Outputs, and Query. Stream Analytics is able to fetch data from just three
    main components: Event Hub, IoT Hub, and Blob storage. These three components
    are used mainly for collecting data from external sensors, applications, and live
    APIs. Stream Analytics can pass data to some other Azure components, such as Blob
    storage, Azure SQL database, Power BI, and so forth (Figure [13-3](#463840_1_En_13_Chapter.xhtml#Fig3)).


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig3_HTML.jpg](images/463840_1_En_13_Chapter/463840_1_En_13_Fig3_HTML.jpg)


    Figure 13-3: Stream Analytics Outputs


    Finally, the last important component is Query Editor, which helps users to apply
    some analytics on received data before sending them to output (Figure [13-4](#463840_1_En_13_Chapter.xhtml#Fig4)).


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig4_HTML.jpg](images/463840_1_En_13_Chapter/463840_1_En_13_Fig4_HTML.jpg)


    Figure 13-4: Stream Analytics main components (Inputs, Outputs, and Query)


    The language used in Stream Analytics is the Stream Analytics Query Language,
    which is very similar to the SQL scripting language.


    ## Case Study


    For our case study, I will show how to get data from an application via Event
    Hub, then pass the collected data into Stream Analytics, apply machine learning
    and then show the live result in Power BI Services.


    The process is explained in Figure [13-5](#463840_1_En_13_Chapter.xhtml#Fig5).
    As you can see in the figure, there is an application that sends live data to
    Event Hub. Stream Analytics receives the live data, applies an Azure ML API model
    on the received data, and then sends it to Power BI. In Power BI Report, the end
    user can see the live data in addition to the result of the machine learning that
    was applied to it.


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig5_HTML.jpg](images/463840_1_En_13_Chapter/463840_1_En_13_Fig5_HTML.jpg)


    Figure 13-5: Case study for fetching data, applying machine learning, and then
    showing the result in Power BI


    ### Event Hub


    The first step is to create an Event Hub service in the cloud. To create an Event
    Hub service, follow the same procedures for creating Stream Analytics. Create
    a new service and provide the relevant information (Figure [13-6](#463840_1_En_13_Chapter.xhtml#Fig6)).


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig6_HTML.jpg](images/463840_1_En_13_Chapter/463840_1_En_13_Fig6_HTML.jpg)


    Figure 13-6: Creating an Event Hub in Azure


    With an Event Hub service, you can add a new Event Hub to your service (Figure
    [13-7](#463840_1_En_13_Chapter.xhtml#Fig7)).


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig7_HTML.jpg](images/463840_1_En_13_Chapter/463840_1_En_13_Fig7_HTML.jpg)


    Figure 13-7: Creating a new Event Hub


    ### Application


    The second step is to create an application that generates some sample data. The
    application is a sample .NET framework application that auto-generates some random
    data. (The application has been included in the book materials for Chapter [13](#463840_1_En_13_Chapter.xhtml).)
    Open the folder containing the application (Figure [13-8](#463840_1_En_13_Chapter.xhtml#Fig8)).


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig8_HTML.jpg](images/463840_1_En_13_Chapter/463840_1_En_13_Fig8_HTML.jpg)


    Figure 13-8: Application creating random live number


    As I mentioned earlier in this chapter, I’ll be using a .NET C# console application
    to pass the data to Event Hub. This application has been created by Reza Rad [[1](#463840_1_En_13_Chapter.xhtml#Par46)].
    In his blog post, in the “Push Data Application” section, Rad explains the process
    of creating this application step by step.


    However, for the application that has been included in the related materials for
    this chapter, you must open it with Visual Studio, then open the Solution Explorer,
    go to References, right-click and select Manage NuGet Packages. Next, click Browse,
    select `WindowsAzure.ServiceBus`, and install it (Figure [13-9](#463840_1_En_13_Chapter.xhtml#Fig9)).


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig9_HTML.jpg](images/463840_1_En_13_Chapter/463840_1_En_13_Fig9_HTML.jpg)


    Figure 13-9: Install Azure Service Bus in Visual Studio


    After installing Azure Service Bus, you must set up the configuration. Click `App.config`,
    then in the code for the key section (Figure [13-10](#463840_1_En_13_Chapter.xhtml#Fig10)),
    change the end point URL name and keys (from the created Stream Analytics in the
    next section).


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig10_HTML.jpg](images/463840_1_En_13_Chapter/463840_1_En_13_Fig10_HTML.jpg)


    Figure 13-10: Setting up the configuration


    Finally, you must enter the name of your Event Hub in the main code section under
    the program (Figure [13-11](#463840_1_En_13_Chapter.xhtml#Fig11)).


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig11_HTML.jpg](images/463840_1_En_13_Chapter/463840_1_En_13_Fig11_HTML.jpg)


    Figure 13-11: Changing the Event Hub name in the code


    Now the code is ready. Before running the code, you must set up the Stream Analytics.'
