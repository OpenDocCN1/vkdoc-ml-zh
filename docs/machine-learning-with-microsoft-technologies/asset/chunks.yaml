    # Part I Getting Started


    # 1. Introduction to Machine Learning


    Machine learning allows decision makers to gain more insight from their data.
    Today, the application of machine learning is no longer limited to research and
    specific industries. In most fields, there is a valuable opportunity to use machine
    learning to obtain more concise and in-depth information from available data.
    As a result, most big software companies provide opportunities to their users
    to access machine learning via easy-to-use software. For example, Microsoft, a
    pioneer in developing business software, leverages machine learning in developing
    products such as the Bing search engine, Xbox, Kinect, and others. The use of
    machine learning in Microsoft is not limited to the production of new software.
    In many of Microsoft’s software development tools, such as Microsoft SQL Server,
    Power BI, and .NET, there is an opportunity to use machine learning to create
    smarter applications and reposts.


    In this chapter, you will learn the central concepts and approaches to machine
    learning, review machine learning types, and discover step-by-step the life cycle
    of machine learning. Also, you will learn about the highly useful machine learning
    tools that are available in Microsoft products.


    ## Machine Learning Concepts


    Machine learning is a subset of artificial intelligence (AI). Ian Goodfellow and
    his colleagues [[1](#463840_1_En_1_Chapter.xhtml#Par47)] introduced a diagram
    that shows the different approaches to AI. As you can see in Figure [1-1](#463840_1_En_1_Chapter.xhtml#Fig1),
    machine learning is one of several methods of AI.


    ![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig1_HTML.jpg](images/463840_1_En_1_Chapter/463840_1_En_1_Fig1_HTML.jpg)


    Figure 1-1


    A Venn diagram showing the AI category and subcategories [[1](#463840_1_En_1_Chapter.xhtml#Par47)]


    Academics and authors have proposed different definitions of machine learning.
    For example, Sebastian Raschka defined machine learning as tools for making sense
    of data, using algorithms [[2](#463840_1_En_1_Chapter.xhtml#Par48)]. He mentioned
    that we encounter a significant amount of structured (numbers) and unstructured
    (image, voice text, and so forth) data. Gaining insight from these data affects
    the decision-making process and helps managers to achieve a better understanding
    of what happened, why it happened, what will happen in future, and how to make
    it happen.


    The concepts of machine learning are based on discovering common patterns from
    current data sets. Historically, we created reports and software to understand
    what happened in the past. Analyzing recent events and data always helps us to
    perform further analysis, such as finding key performance indicators (KPIs), and
    so forth. Investigating what happened in the past is straightforward and provides
    us some value (Figure [1-2](#463840_1_En_1_Chapter.xhtml#Fig2)). For the next
    step, we want to become more agile regarding change, so analyzing live data is
    essential. Analyzing recent data obviously provides more insight than legacy data
    does. The process is a bit more difficult than following prior approaches but
    offers more value to an organization.


    ![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig2_HTML.png](images/463840_1_En_1_Chapter/463840_1_En_1_Fig2_HTML.png)


    Figure 1-2


    Value and difficulty of various analyses, from past to future


    The third step is the root cause analysis, a type of data investigation focused
    on cause and effect. For example, analyzing the primary cause of a sales decrease
    in a specific branch can provide lots of value for a business owner.


    A further step for getting better value out of data is analyzing what will happen
    in the future, or *predictive analysis*. Understanding what will happen in the
    future, or having insight about the data pattern, will help decision makers implement
    better informed company policies. “What will happen” analysis requires more effort
    and is more time-consuming than previous steps. However, it is an opportunity
    for a business to obtain even more valuable and actionable information.


    Finally, the last stage is “how to make it happen.” This *prescriptive analysis*
    recommends steps to take after predicting the future. This process brings more
    insight into any organization, but it is far more challenging to implement, compared
    to the other stages.


    ## Machine Learning Approaches


    There are two main approaches to machine learning:


    *   Supervised Learning


    *   Unsupervised Learning


    In the following paragraphs, a brief explanation of each is provided. In Chapter
    [5](#463840_1_En_5_Chapter.xhtml), I will go into more detail about these and
    offer examples of both.'
