    \ Management Studio。\n\n在 `run_value` 更改为 1 之后，可以检查 R 脚本是否已启用。我们执行一个具有三个主要输入的存储过程：\n\
    \n*   `@language` 获取脚本语言的名称。\n\n*   `@script` 存储相关的 R 脚本。在以下示例中，我们将输入变量分配给输出变量\
    \ `OutputDataSet<-InputDataSet`。\n\n*   `@input_data_1` 存储供 R 脚本使用的相关数据。在以下示例中，它是一个非常简单的\
    \ SQL 代码：`select 1 as hello`。\n\n```\nexec sp_execute_external_script  @language\
    \ =N'R',\n@script=N'OutputDataSet<-InputDataSet',\n@input_data_1 =N'select 1 as\
    \ hello'\nwith result sets (([hello] int not null));\ngo\n```\n\n如果你运行上述代码，你将看到输出是\
    \ `hello`，值为 `1`（图 9-7）。存储过程的输出可以通过“with result sets”来标识。输出中显示的列名是 hello，输出值是一个整数（1），并且不应为空。因此，我们有\
    \ `[hello] int not null`。\n\n![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig7_HTML.jpg](img/463840_1_En_9_Fig7_HTML.jpg)\n\
    \n图 9-7\n\n启用 R 脚本\n"
- fmt: '# Packages in R


    It is possible to check the path for R-services. The code for getting the library
    path for R is


    ```

    OutputDataSet <- data.frame(.libPaths())

    ```


    To run the stored procedure, we set the language parameter to R.


    ```

    @language = N''R''

    ```


    The input R scripts is


    ```

    @script = N''OutputDataSet <- data.frame(.libPaths());''.

    ```


    So, the whole code would be


    ```

    EXECUTE sp_execute_external_script  @language = N''R''

    , @script = N''OutputDataSet <- data.frame(.libPaths());''

    WITH RESULT SETS (([DefaultLibraryName] VARCHAR(MAX) NOT NULL));

    GO

    ```


    After running the code, the library path of R will be shown in the output window
    (Figure [9-8](#463840_1_En_9_Chapter.xhtml#Fig8)).


    ![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig8_HTML.jpg](images/463840_1_En_9_Chapter/463840_1_En_9_Fig8_HTML.jpg)


    Figure 9-8


    R library path


    You can check the installed packages in Machine Learning Services. The R code
    for checking the installed packages is


    ```

    packagematrix <- installed.packages();

    NameOnly <- packagematrix[,1];

    OutputDataSet <- as.data.frame(NameOnly)

    ```


    As we are not getting any input value from the user, we do not have any input
    for the stored procedure (Figure [9-9](#463840_1_En_9_Chapter.xhtml#Fig9)).


    ```

    EXECUTE sp_execute_external_script @language=N''R''

    ,@script = N''str(OutputDataSet); packagematrix <- installed.packages();

    NameOnly <- packagematrix[,1]; OutputDataSet <- as.data.frame(NameOnly);''

    ,@input_data_1 = N''SELECT 1 as col''

    WITH RESULT SETS ((PackageName nvarchar(250) ))

    ```


    After running the code, you can see the existing R packages in SQL Server.


    As you can see in Figure [9-9](#463840_1_En_9_Chapter.xhtml#Fig9), the list of
    R packages is shown. There is a variety of libraries available from Microsoft
    and some other open source or third-party packages. In the next section, I will
    explain two of them.


    ![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig9_HTML.jpg](images/463840_1_En_9_Chapter/463840_1_En_9_Fig9_HTML.jpg)


    Figure 9-9


    R Packages in SQL Server Machine Learning Services


    ## RevoScaleR Package


    `RevoScaleR` is a package created by Revolutionary Analytics (now owned by Microsoft),
    with the aim of importing, transforming, and analyzing data at scale. There are
    different categories of functions available from the data store, imports and save
    as, data transformation, draw some charts such as histogram, line, and so forth,
    descriptive analysis, predictive analysis, package management and so forth [[3](#463840_1_En_9_Chapter.xhtml#Par74)].


    In this section, I will introduce some of the functions that you may use for machine
    learning purpose. The examples will be shown in SQL Server 2017.


    ## rxLinMod


    `rxLinMod` fits a linear model to data. In the following example, I will show
    you how to use this function to create a model for predicting the strength of
    concrete in relation to such input variables as the amount of water, cement, ash,
    and age. The `rxLinMod` function creates a model based on a formula and a training
    data set.


    As you can see in following code, the first line is `EXECUTE sp_execute_external_script
    @language=N''R''`, which calls a stored procedure that allows the user to write
    an R script inside SQL Server. This stored procedure is responsible for using
    external scripts such as R or Python inside SQL Server Code.


    ```

    EXECUTE sp_execute_external_script @language=N''R''

    ,@script = N''require("RevoScaleR")

    formula=strength~cement+ash+age+water

    Model_1=rxLinMod(formula,data=inputDataSet)

    Model=data.frame(payload = as.raw(serialize(Model_1, connection=NULL)))''

    ,@input_data_1 = N''Select strength,cement,ash,age,water from [dbo].[concrete];
    ''

    , @output_data_1_name = N''Model''

    ,@input_data_1_name = N''inputDataSet''

    WITH RESULT SETS (([concreteModel] varbinary(max) NOT NULL  ));

    ```


    The second line in the code, contains the relevant R code stored in the `@script`
    parameter. The code refers to the `RevoScaleR` package by using the function `require`.
    There is no need to install this package, as it already exists in Machine Learning/R
    services. The second R code line is about creating a formula. Our mission is to
    predict the strength of concrete according to some other variables such as amount
    of water, cement and so forth. The formula that allows us to do this is `strength~cement+ash+age+water`,
    which stores the formula in a `formula` variable. The third line contains the
    `rxLinMod` function, which creates a linear model from the formula. Finally, the
    last line of the code stores the formula in an output variable named `Model`.


    `@input_data_1` stores the data collected from the SQL database, using SQL query
    `N''Select strength,cement,ash,age,water from [dbo].[concrete]''`. Finally, the
    output variable `Model` will store the linear model.


    After creating the model, I want to store it, for predicting the new series of
    data. To store the model, the following code is used:


    ```

    IF NOT EXISTS (SELECT 1 FROM sys.objects

    WHERE object_id = OBJECT_ID(N''[dbo].[LinearModel]'')

    AND [type] IN (N''U''))

    BEGIN

    CREATE TABLE [dbo].[LinearModel](

    [Model] [varbinary](MAX) NULL

    );

    END

    ```


    Next, we must insert the model into a table. The following code inserts the model
    into a `LinearModel` table.


    ```

    Insert into [dbo].[LinearModel]

    EXECUTE sp_execute_external_script @language=N''R''

    ,@script = N''require("RevoScaleR")

    formula=strength~cement+ash+age+water

    Model_1=rxLinMod(formula,data=inputDataSet)

    Model=data.frame(payload = as.raw(serialize(Model_1, connection=NULL)))''

    ,@input_data_1 = N''Select strength,cement,ash,age,water from [dbo].[concrete];
    ''

    , @output_data_1_name = N''Model''

    ,@input_data_1_name = N''inputDataSet''

    ```


    The model is already stored in the database. Now, in another stored procedure,
    we are going to use the model, to predict the data.


    ```

    declare @rx_model varbinary(max) = (select [Model] from [dbo].[LinearModel] );

    exec sp_execute_external_script

    @language = N''R''

    , @script = N''

    require("RevoScaleR");

    cdr_model<-unserialize(rx_model);

    predictions <- rxPredict(modelObject = cdr_model,

    data = PredictionData)

    prediction <-as.data.frame(predictions);''

    , @input_data_1 = N''Select strength,cement,ash,age,water from [dbo].[concrete]''

    , @input_data_1_name = N''PredictionData''

    , @output_data_1_name=N''prediction''

    , @params = N''@rx_model varbinary(max)''

    , @rx_model = @rx_model

    with result sets (("prediction" float not null ))  ;

    ```


    There is another input for a stored procedure that is not just a data set. It
    contains input for models that we have already stored in a database.


    By running the stored procedure, the following prediction results are shown (Figure
    [9-10](#463840_1_En_9_Chapter.xhtml#Fig10)).


    ![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig10_HTML.jpg](images/463840_1_En_9_Chapter/463840_1_En_9_Fig10_HTML.jpg)


    Figure 9-10


    Linear model for concrete strength prediction


    There are other models for regression analysis. These include `rxLogit`, used
    for logistic regression; `rxGlm`, for generalizing the linear model to data; and
    others. In addition, for other types of analysis, such as group prediction (classification),
    there are such algorithms as `rxDTree`, `rxBTree`, `rxDForest`, and `rxNaiveBayes`
    [[3](#463840_1_En_9_Chapter.xhtml#Par74)].


    ## Azure ML Package


    `Azure ML` is another package to manage an experiment created in Azure ML Studio
    (see Chapter [12](#463840_1_En_12_Chapter.xhtml)). This package has some popular
    functions and allows users to create a web service from R functions. This package
    also allows R users to explore the Azure ML data set, explore existing data sets,
    and so forth. Details of how to use this package are provided in Chapter [12](#463840_1_En_12_Chapter.xhtml),
    following an explanation of Azure Machine Learning Studio.'
