- fmt: 'By default, in the notebook, there is a place to write code. As you can see
    in Figure [10-8](#463840_1_En_10_Chapter.xhtml#Fig8), there an editor with name
    `Cmd1` as a node in which to write the codes and run them all. In our example,
    there is only one node, and the primary language in which to write the code is
    R. In addition, we use the existing data set in the `gpplot2` package named `mpg`,
    by writing the following code:


    ```

    library(ggplot2)

    display(mpg)

    ```


    The `display` command shows the data set in Databricks. To run the code, click
    the arrow at the right side of the node and select Run Cell (Figure [10-8](#463840_1_En_10_Chapter.xhtml#Fig8)).


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig8_HTML.jpg](images/463840_1_En_10_Chapter/463840_1_En_10_Fig8_HTML.jpg)


    Figure 10-8


    Writing an R notebook in Databricks


    After running the code, the result will appear at the end of the cell in table
    style. As you can see in Figure [10-9](#463840_1_En_10_Chapter.xhtml#Fig9), the
    initial result is shown as a table; however, it is possible to show the result
    in the same format as other charts.


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig9_HTML.jpg](images/463840_1_En_10_Chapter/463840_1_En_10_Fig9_HTML.jpg)


    Figure 10-9


    Running the R


    To show the chart, you must click the chart icon at the bottom of the cell (Figure
    [10-10](#463840_1_En_10_Chapter.xhtml#Fig10)).


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig10_HTML.jpg](images/463840_1_En_10_Chapter/463840_1_En_10_Fig10_HTML.jpg)


    Figure 10-10


    Show the chart in Databricks


    You can change the item that you want to show in the chart, by clicking the Plot
    Options (Figure [10-11](#463840_1_En_10_Chapter.xhtml#Fig11)).


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig11_HTML.jpg](images/463840_1_En_10_Chapter/463840_1_En_10_Fig11_HTML.jpg)


    Figure 10-11


    Chart Option in Databricks


    It is possible to create a new cell to write more codes in R or Scala. For our
    example, we must upload a data set named Titanic into Azure Databricks.


    To import data, click the Data option at the left side of the window (Figure [10-12](#463840_1_En_10_Chapter.xhtml#Fig12)),
    Then click Add Data. This navigates to a new page (Figure [10-12](#463840_1_En_10_Chapter.xhtml#Fig12)).
    Then click Upload File. Just browse and upload the `titanic` file. If you need
    this file, you can access it from [`www.kaggle.com/c/titanic`](http://www.kaggle.com/c/titanic).


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig12_HTML.jpg](images/463840_1_En_10_Chapter/463840_1_En_10_Fig12_HTML.jpg)


    Figure 10-12


    Importing data with the Data option


    As you can see in the Figure [10-13](#463840_1_En_10_Chapter.xhtml#Fig13), we
    must create a table with a user interface (UI) and choose the related cluster
    to be uploaded there.


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig13_HTML.jpg](images/463840_1_En_10_Chapter/463840_1_En_10_Fig13_HTML.jpg)


    Figure 10-13


    Importing data into Azure Databricks


    We now create a new workspace named


    ```

    val titanic = spark.table("titanic")

    display(titanic.select("∗"))

    ```


    To work with the Titanic data set, we only have to select the Survived, Sex, Age,
    and PClass columns (see Figure [10-14](#463840_1_En_10_Chapter.xhtml#Fig14)).


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig14_HTML.jpg](images/463840_1_En_10_Chapter/463840_1_En_10_Fig14_HTML.jpg)


    Figure 10-14


    Running the Scala language to get data from Azure Data Lake Store


    ```

    val specificColumnsDf = titanic.select("Survived", "Pclass", "Sex", "Age")

    val renamedColumnsDF = specificColumnsDf.withColumnRenamed("Sex", "Gender")

    display(renamedColumnsDF)

    ```


    Now, for the purpose of machine learning, we are going to predict if a new passenger
    of a specific age, gender, and passenger class will survive or not. For this,
    we must run the R codes to this data in another cell, to create a model and predict
    whether a passenger of a specific age, gender, and passenger class will survive.
    We must pass the data from Scala to R. To do this, we must create a temporary
    table to give the table to the R code, using the following code:


    ```

    renamedColumnsDF.createOrReplaceTempView("TempTable")

    ```


    We add a new cell by clicking the plus sign under the latest cell. In the new
    cell, we must write R codes. Therefore, we must mention the language by putting
    `%r` at the start of the code. Also, we are using some packages from SparkR, so
    we use the function `SQL`, to fetch data from the last Scala cell. Finally, we
    store the data with a `dataset` variable.


    ```

    %r

    library(SparkR)

    sql("REFRESH TABLE TempTable")

    df <- sql("SELECT ∗ FROM TempTable")

    dataset<-as.data.frame(df)

    display(df)

    ```


    In the same cell or the new one, you can write some code for machine learning.
    In our example, we are looking to check whether a passenger of a specific passenger
    class, age, and gender is going to survive. The `rpart` package can be used to
    create a decision tree. This package helps us to predict the probability of survival.


    ```

    %r

    library(SparkR)

    sql("REFRESH TABLE TempTable")

    df <- sql("SELECT ∗ FROM TempTable")

    dataset<-as.data.frame(df)

    library(rpart)

    DT<-rpart(Survived~.,data=dataset,method="class")

    test<-dataset[,2:4]

    Prediction<-predict(DT,test)

    output<-data.frame(test,Prediction)

    display(output)

    ```


    By running the cell, the output will be displayed (Figure [10-15](#463840_1_En_10_Chapter.xhtml#Fig15)).


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig15_HTML.jpg](images/463840_1_En_10_Chapter/463840_1_En_10_Fig15_HTML.jpg)


    Figure 10-15


    Creating a new cell in Azure Databricks


    It is possible to draw charts using such R packages as `ggplot2` as well. For
    example, if we want to see the Pclass, age, and gender in a scatter chart with
    a specific legend, we can leverage the following code.


    ```

    %r

    display(output)

    library(ggplot2)

    ggplot(output,aes(x=output$Age,y=output$Pclass, color=output$Gender))+geom_jitter()

    ```


    As you can see in Figure [10-16](#463840_1_En_10_Chapter.xhtml#Fig16), a scatter
    chart with the legend `output$Gender` will result.


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig16_HTML.jpg](images/463840_1_En_10_Chapter/463840_1_En_10_Fig16_HTML.jpg)


    Figure 10-16


    Creatiing a new cell in Azure Databricks


    Azure Databricks is not only for machine learning. It can also retrieve data from
    different resources on which to apply changes and then shows the result in some
    visualization tool, such as Power BI. In addition, it is possible to schedule
    the process (Figure [10-17](#463840_1_En_10_Chapter.xhtml#Fig17)).


    ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig17_HTML.jpg](images/463840_1_En_10_Chapter/463840_1_En_10_Fig17_HTML.jpg)


    Figure 10-17


    Scheduling a process using Databricks


    There are different ways to get data from SQL database, including such Azure services
    as Azure Blob, Data Lake Store, Azure Cosmos, among others [[2](#463840_1_En_10_Chapter.xhtml#Par32)].


    ## Summary


    This chapter provided a concise overview of how we can use Azure Databricks for
    machine learning. It discussed how we can use the Databricks environment for writing
    R and Scala scripts and how we can pass data from one cell in a Databricks environment
    to another. Finally, you saw how we are able to apply R codes to train a model
    and use it for predicting. The processes of how to import data and how to do machine
    learning was explained as well. The next chapter will provide an overview of how
    to do machine learning in Azure Data Lake.


