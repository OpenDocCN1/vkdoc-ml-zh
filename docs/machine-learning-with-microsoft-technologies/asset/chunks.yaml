    ### 维度


    要获取数据的维度，例如行数和列数，我们使用 `shape` 属性，如下所示：


    ```

    print(dataset.shape)

    ```


    结果


    ```

    (398, 9)

    ```


    上述结果表明我们有 398 行和 9 列。此外，我们可以使用 `head` 属性查看前 20 行数据，如下所示：


    ```

    print(dataset.head(20))

    ```


    ### 统计分布


    要检查属性的统计摘要，我们可以使用 `describe` 命令，如下所示：


    ```

    print(dataset.describe())

    ```


    ### 用于可视化的 Python


    Python 允许用户创建图表。它提供了多种数据可视化选项。Matplotlib 是 Python 中用于可视化的主要包。它非常强大，可用于创建复杂的图表。Matplot
    是第一个可视化库，其他工具，如 Seaborn、ggplot、Bokeh 等，都是在其基础上构建的（参见 [`https://blog.modeanalytics.com/python-data-visualization-libraries/`](https://blog.modeanalytics.com/python-data-visualization-libraries/)
    ）。


    Python 中也可使用 ggplot2 包。ggplot2 基于 R 的绘图系统。它基于图层工作。


    Bokeh 是另一个类似于 ggplot2 的库，但它是 Python 原生的。它帮助开发者绘制交互式和基于 Web 的图表。


    Plotly 是一个在线数据可视化工具，对于创建交互式图表非常有用。Plotly 既可用于 R 也可用于 Python。


    ### 用于机器学习的 Python


    Python 是一种简单、优雅且一致的语言。例如，与 R 相比，它的可读性更强。


    Python 在应用数据科学领域尤其受欢迎。它拥有不同的机器学习包，例如 NumPy、Pandas、Keras、TensorFlow 等。然而，它是一种通用语言，可用于数据工程、网站抓取、Web
    应用程序构建等。


    ## 总结


    本章概述了 Python 及相关软件，并讨论了如何使用它来执行机器学习。


    # 4. Power BI 中的 R 可视化


    Power BI 是一种自助式商业智能（BI）软件。该工具可用于企业级的数据可视化、数据清洗、建模、分析和协作。关于如何使用 Power BI，已经出版了许多书籍和博客。在本章中，我将展示如何利用
    R 创建更好的可视化效果，并从 Power BI 中获得额外价值。在本章中，我将解释如何在 Power BI 中设置 R，如何使用 R 脚本在 Power
    BI 中绘制图表，如何设置 Power BI 报表环境，如何设置 Power BI 以编写 R 代码，以及如何在 Power BI 中绘制 R 图表。


    ## Power BI


    Power BI 报表环境帮助我们可视化数据。根据 Abela 博士 [1] 的观点，数据可视化有四个主要目的，如下所示，并在图 4-1 中以图形方式呈现：


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig1_HTML.jpg](img/463840_1_En_4_Fig1_HTML.jpg)


    图 4-1


    数据可视化示意图 [1]


    1.  数据比较

    2.  数据关系

    3.  数据构成

    4.  数据分布


    Power BI Desktop 是一款免费应用程序，您可以从 [`https://powerbi.microsoft.com/en-us/desktop/`](https://powerbi.microsoft.com/en-us/desktop/)
    下载。Power BI 可视化面板支持图 4-1 中建议的大部分图表。通过从市场或其他来源导入自定义视觉对象，可以扩展可视化功能。


    Power BI Desktop 通过“获取数据”选项帮助用户从不同来源获取数据（图 4-2）。要了解更多关于 Power BI 的信息，请访问 [`http://radacad.com/online-book-power-bi-from-rookie-to-rockstar`](http://radacad.com/online-book-power-bi-from-rookie-to-rockstar)
    。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig2_HTML.jpg](img/463840_1_En_4_Fig2_HTML.jpg)


    图 4-2


    Power BI 可视化环境


    ### 在 Power BI 中设置 R


    要在 Power BI 中绘制 R 图表，第一步是至少安装一个 R 版本或 Microsoft R Open。现在我们必须指定要使用的 R 版本。为此，我们单击“文件”菜单，然后单击“选项和设置”，再单击“选项”。在“全局”选项下，单击“R
    脚本”，以指定 R 版本（图 4-3）。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig3_HTML.jpg](img/463840_1_En_4_Fig3_HTML.jpg)


    图 4-3


    在 Power BI 中设置 R 环境


    如第 3 章所述，R 基于包。每当您使用特定的包时，必须首先在您的机器上安装它。（如果您使用的是 Power BI Desktop，大多数包已安装在服务中。）您可以使用
    R IDE（例如 R Studio）安装包。然后，在 Power BI R 编辑器中，您必须引用该包。此外，请确保您使用的是已安装的 R 包的正确版本（图
    4-4）。


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig4_HTML.jpg](img/463840_1_En_4_Fig4_HTML.jpg)


    图 4-4


    在 Power BI 中指定 R 版本和环境

    '
- fmt: '### Writing R Code in Power BI


    It is possible to write R code in Power BI’s report area. To do that, we must
    import data into Power BI report.


    A data set that includes car specifications, such as speed in town and along a
    highway, cylinders, and so forth, is available to download at [`https://forge.scilab.org/index.php/p/rdataset/source/tree/master/csv/ggplot2/mpg.csv`](https://forge.scilab.org/index.php/p/rdataset/source/tree/master/csv/ggplot2/mpg.csv).
    This data set is free and titled `mpg.csv`. I am going to use this data set to
    show the speed of the car on the highway and the city, the number of cylinders
    the car has, its year of production, and type of drive (front wheel, rear wheel,
    and so on) in one picture. According to Figure [4-1](#463840_1_En_4_Chapter.xhtml#Fig1),
    to show the comparison of the data among the different items, we must use a table
    chart. We are going to import data into Power BI Desktop via the Get Data option
    and import a CSV file (Figure [4-5](#463840_1_En_4_Chapter.xhtml#Fig5)).


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig5_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig5_HTML.jpg)


    Figure 4-5


    Importing a CSV file into Power BI Desktop


    After importing the data, you should be able to see it under Fields. Click the
    R and drag it into the whitespace area (Figure [4-6](#463840_1_En_4_Chapter.xhtml#Fig6)).


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig6_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig6_HTML.jpg)


    Figure 4-6


    Putting R into a whitespace area


    Expand the `mpg` data set (Figure [4-7](#463840_1_En_4_Chapter.xhtml#Fig7)) and
    choose `cty` (speed in the city), `hwy` (speed on the highway), and `cyl` (cylinder)
    options.


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig7_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig7_HTML.jpg)


    Figure 4-7


    Selecting related data from the `mpg` file


    The R scripts editor will be enabled. Under R script editor, you will see some
    R codes. The crosshatch (`#`) is a symbol for making comments in R and is not
    executed as script. Power BI automatically puts the selected fields in a variable
    named `dataset`, so all fields (`cty`, `hwy`, and `cyl`) will be stored in a data
    set variable equivalent to using the `<-` syntax. Also, Power BI automatically
    removes any duplicated rows. This is explained in the R script editor area (Figure
    [4-8](#463840_1_En_4_Chapter.xhtml#Fig8)).


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig8_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig8_HTML.jpg)


    Figure 4-8


    Active Python environment in Visual Studio 2017


    Next, we are going to put R codes for drawing a two-dimensional graph in Power
    BI. In Power BI, to use any R scripts, install the package in R, using the `install.package()`
    function. In our case, we must install `ggplot2`. We use the function `library(ggplot2)`
    to refer to this package. The first line of code in the R editor is `library(ggplot2)`.
    This package contains some important functions for drawing charts.


    To draw a chart, I first use the `ggplot` function, to configure a two-dimensional
    chart. The first argument is `dataset`, which holds our three fields. Then we
    have another function inside `ggplot2`, named `aes`, which identifies which file
    should be on the x or y axes. Finally, in the chart, I also want to indicate the
    number of the car’s cylinders. This can be done by adding another layer in the
    `aes` function: Size. So, cars with more cylinders will have bigger dots (see
    Figure [4-9](#463840_1_En_4_Chapter.xhtml#Fig9)).


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig9_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig9_HTML.jpg)


    Figure 4-9


    R script editor


    ```

    t←ggplot(dataset, aes(x=cty, y=hwy,size=cyl))

    ```


    However, the preceding figure shows the graph area without any specific charts.
    We need a scatter chart to indicate the city and highway speeds on x and y axes.
    `ggplot2`’s `geom_point` function draws a scatter chart. This function has value
    of `pch=21`, which relates to the shape of the dot in the chart. For example,
    if I set this value as 20, it becomes a filled cycle; a value of 23 becomes a
    diamond shape. To run the code, click the run option (Figure [4-10](#463840_1_En_4_Chapter.xhtml#Fig10)).


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig10_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig10_HTML.jpg)


    Figure 4-10


    How to run the R code


    After clicking the run code option, the charts will be shown in R visual (Figure
    [4-11](#463840_1_En_4_Chapter.xhtml#Fig11)).


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig11_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig11_HTML.jpg)


    Figure 4-11


    Drawing a chart using the `ggplot` function


    In Figure [4-11](#463840_1_En_4_Chapter.xhtml#Fig11), you can see that we have
    three different fields: highway and city speed, along the y and x axes, respectively.
    A car’s cylinder variable is shown as a different cycle size. However, you might
    need a bigger cycle, to differentiate cars with 8 and 4 cylinders. We accommodate
    this need by adding another layer, by adding a function name, as follows:


    ```

    scale_size_continuous(range=c(1,5))

    ```


    Following, is the entire code:


    ```

    t<-ggplot(dataset, aes(x=cty, y=hwy,size=cyl)) + geom_point(pch=23)+scale_size_continuous(range=c(1,5))

    in the scale_size_continues(range=c(1,5))

    ```


    The difference between the lowest and highest value specified is 5. I can increase
    this difference by changing it from 5 to 10. The resulting scatter chart is shown
    in Figure [4-12](#463840_1_En_4_Chapter.xhtml#Fig12).


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig12_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig12_HTML.jpg)


    Figure 4-12


    Scatter chart showing speed in the city and on the highway, plus the number of
    cylinders


    In the next example, I have changed the `pch` value to 24 and added another code
    inside the `aes` function name: `fill=Red`. This means that the chart will show
    solid red rectangles (Figure [4-13](#463840_1_En_4_Chapter.xhtml#Fig13)).


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig13_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig13_HTML.jpg)


    Figure 4-13


    The final chart


    ```

    t<-ggplot(dataset, aes(x=cty, y=hwy,size=cyl,fill="Red")) + geom_point(pch=24)+scale_size_continuous(range=c(1,5))

    ```


    By using the `facet` command in R, it is possible to show five different variables
    in just one chart. This helps us to have more dimension in our chart. For this
    we are going to show the year a car was produced and its type of drive. Therefore,
    we must change the code, as follows:


    ```

    t← ggplot(dataset, aes(x=cty, y=hwy,color = factor(cyl))) + geom_point(size=4)

    ```


    By changing the `aes` function argument, we have replaced `size` argument with
    `color`. This indicates that I want to differentiate a car’s cylinder values not
    just by cycle size, but that I am going to show them by allocating different colors
    to them. Hence, I change the `aes` function as in the preceding code snippet.


    We must change the code, as follows:


    ```

    library(ggplot2)

    t<-ggplot(dataset, aes(x=cty, y=hwy,color = factor(cyl))) + geom_point(size=4)

    t<-t + facet_grid(year ~ drv)

    ```


    Now, you can see the car’s speed on the highway and in the city in y and x axes.
    Also, we have cylinders as a color and drive and year of production as a facet
    (Figure [4-14](#463840_1_En_4_Chapter.xhtml#Fig14)).


    ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig14_HTML.jpg](images/463840_1_En_4_Chapter/463840_1_En_4_Fig14_HTML.jpg)


    Figure 4-14


    Drawing a table chart showing five variables in the same chart


    ## R Features in Power BI


    R script editor has some features that help us to better use Power BI Desktop,
    such as slice and dice and edit R code.'
