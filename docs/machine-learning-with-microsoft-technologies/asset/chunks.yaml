    为了测试该函数，我们必须创建一个数据集传递给函数。导入新的泰坦尼克数据集，然后按住 Ctrl 键并单击四个主要列：Survived、Pclass、Age 和
    Sex。接下来，右键单击并选择“删除列”选项（图 7-24）。


