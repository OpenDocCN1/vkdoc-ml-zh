  trans: '

    # 11. Azure Data Lake 中的 R


    Azure Data Lake Store 是 Microsoft Cloud 的组件之一，可帮助开发人员、数据科学家和分析师存储任意规模和形状的数据。Azure
    Data Lake 针对处理大量数据进行了优化。它提供具有最佳性能的并行处理。在 Azure Data Lake 中，我们可以创建分层的数据文件夹结构。凭借这些能力，Azure
    Data Lake 使数据科学家能够以高可扩展性和成本效益轻松应用高级分析和机器学习建模。Azure Data Lake Analytics 包含 U-SQL，这是一种类似
    SQL 的语言，可让你处理非结构化数据 [1]。可以在 Azure Data Lake 内部执行机器学习，并从 RStudio 探索 Azure Data
    Lake，以在 RStudio 环境中创建模型。此外，还可以通过 Hive 查询从 Azure Data Lake 获取数据，并在 Azure Machine
    Learning 中使用这些数据。在本章中，你将了解如何使用 Azure Data Lake 中的 U-SQL 语言与 R 来写入和处理数据，以及如何将数据从
    Azure Data Lake 导入到 RStudio，或从 RStudio 导入到 Azure Data Lake。


    ## Azure Data Lake 环境


    Azure Data Lake 是 Microsoft Cloud 的组件之一，旨在存储数据。如图 11-1 所示，Azure Portal 中的第二个组件是关于数据存储的。Azure
    Data Lake Store 可以存储任意大小或格式（结构化和非结构化）的数据。它也用于进行分析（第三个组件）。Azure Data Lake Analytics
    可用于数据分析（使用 U-SQL）和机器学习。


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig1_HTML.jpg](img/463840_1_En_11_Fig1_HTML.jpg)


    图 11-1


    Microsoft Cloud 组件


    要访问 Azure Data Lake Store 和 Data Lake Analytics，你必须拥有一个 Azure 帐户。你可以通过访问以下链接创建一个：[`https://tsmatz.wordpress.com/2017/06/08/azure-data-lake-r-extension/`](https://tsmatz.wordpress.com/2017/06/08/azure-data-lake-r-extension/)。登录“Portal.Azure.com”，然后点击门户左侧的“创建资源”图标（图
    11-2）。通过输入“data lake”，将出现两个不同的 Azure Data Lake 组件。首先，我们将创建 Azure Data Lake Store。


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig2_HTML.jpg](img/463840_1_En_11_Fig2_HTML.jpg)


    图 11-2


    创建 Azure Data Lake Store 和 Data Lake Analytics


    点击“创建”选项后，首先需要提供一些信息，例如服务名称、订阅、资源组和服务器位置（图 11-3）。


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig3_HTML.jpg](img/463840_1_En_11_Fig3_HTML.jpg)


    图 11-3


    创建 Azure Data Lake Store


    创建组件需要一些时间。如图 11-4 所示，Azure Data Lake Store 已创建完成。创建 Azure Data Lake Store 后，我们可以将新数据上传到其中。


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig4_HTML.jpg](img/463840_1_En_11_Fig4_HTML.jpg)


    图 11-4


    创建 Azure Data Lake Store


    通过点击“数据资源管理器”选项，可以查看数据和结构。从这里，如图 11-5 所示，可以上传数据、创建文件夹、定义访问级别等。


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig5_HTML.jpg](img/463840_1_En_11_Fig5_HTML.jpg)


    图 11-5


    Azure Data Lake Store 中的数据资源管理器


    目前，Azure Data Lake Store 中没有数据。可以从其他 Azure 组件将数据导入到 Data Lake Store。在本节中，为了机器学习的目的，我们首先将通过
    Azure Data Lake Analytics 创建一个数据样本。


    为此，我们必须创建一个 Data Lake Analytics 资源（图 11-6）。我们遵循与创建 Data Lake Store 相同的过程。但是，我们必须指定要使用哪个
    Data Lake Store。请注意：你必须始终先创建 Data Lake Store，然后再创建 Data Lake Analytics。


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig6_HTML.jpg](img/463840_1_En_11_Fig6_HTML.jpg)


    图 11-6


    创建 Azure Data Lake Analytics 资源


    在指定名称、位置、相关的 Data Lake Store、订阅等信息后，你必须等待组件创建完成并显示在 Azure Dashboard 上（图 11-7）。


    ![../images/463840_1_En_11_Chapter/463840_1_En_11_Fig7_HTML.jpg](img/463840_1_En_11_Fig7_HTML.jpg)


    图 11-7


    在 Azure Dashboard 上创建的 Data Lake Store

