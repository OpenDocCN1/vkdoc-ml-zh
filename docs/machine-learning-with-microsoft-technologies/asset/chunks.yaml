    ```

    WITH MLStreamAnalytics AS (

    SELECT value, MLStreamAnalytics(value) as result

    FROM azureml

    )

    SELECT

    value, result.[value_quantized]

    INTO

    MLoutput

    FROM

    MLStreamAnalytics

    ```


    代码的第一部分用于调用函数并从中获取结果。如图 13-23 所示，代码的第一部分是关于创建一个临时表来调用 `MLStreamAnalytics(value)`。下一步是从事件中心组件（来自
