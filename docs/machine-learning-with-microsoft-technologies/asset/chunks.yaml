  trans: '

    ## 神经网络


    我们对计算机的期望是，输入一些内容，然后得到符合需求的输出。科学家们试图通过创造一种智能机器来模仿人脑——一种能够像人类一样进行推理的机器。


    人脑最重要的组成部分是神经元。人脑由 7500 万个神经元组成。每个神经元通过突触与其他神经元相连。因此，神经网络中的结构就是一些相互连接的节点。在人体中，如果一个神经元被某些外部因素触发，它就会通过突触将信息从接收节点传递到其他节点（图
    7-1）。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig1_HTML.jpg](img/463840_1_En_7_Fig1_HTML.jpg)


    图 7-1


    神经系统


    神经网络模仿了与人脑相同的概念。一个节点从环境中获取一些输入，然后神经网络模型产生输出，就像计算机系统一样产生结果（图 7-2）。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig2_HTML.jpg](img/463840_1_En_7_Fig2_HTML.jpg)


    图 7-2


    计算机系统架构


    在神经网络中，存在：


    *   一组输入节点

    *   一组输出节点

    *   中间的一些处理过程，以获得良好的结果

    *   信息流

    *   节点之间的连接


    某些连接比其他连接更重要，这意味着它们对结果的影响更大。在神经网络中，我们将这种重要性称为连接的*权重*。


    另一个能更好地表达神经网络目标的类比是登山后的下山过程。当我们到达山顶且天气有雾时，我们只能看到前方一米。我们必须在一米能见度下决定选择哪个方向。我们根据当前位置迈出第一步，再次决定跟随哪个方向并迈出下一步。因此，每一步我们都在评估路线，并选择下山的最佳方式（图
    7-3）。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig3_HTML.jpg](img/463840_1_En_7_Fig3_HTML.jpg)


    图 7-3


    神经网络与登山的类比


    每个决策都可以看作是一个节点，它引导我们走向更好、更快的解决方案。在神经网络中，有一些隐藏节点执行主要任务。它们在使用称为激活函数的函数时，为输出找到最佳值。


    在本节中，我将引用一个来自 *Machine Learning with R* [1] 的示例。该示例是关于预测混凝土的强度。混凝土已被用于许多不同的结构，例如桥梁、公寓、道路等。为了安全起见，混凝土的强度至关重要。混凝土的强度取决于用于制造它的材料，例如水泥、矿渣、粉煤灰、水等等。我们有一个混凝土成分的数据集（图
    7-4）。你可以从“Machine Learning with R datasets” [2] 下载它。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig4_HTML.jpg](img/463840_1_En_7_Fig4_HTML.jpg)


    图 7-4


    混凝土数据集


    神经网络可用于预测一个值或类别，也可用于预测多个事物。在我们的示例中，我们将预测一个值，即混凝土的强度。首先，我们将数据加载到 Power BI 中，并在查询编辑器中编写一些
    R 代码。然后我们必须进行一些数据转换（图 7-5）。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig5_HTML.jpg](img/463840_1_En_7_Fig5_HTML.jpg)


    图 7-5


    使用 Python 代码进行数据透视


    如图 7-5 所示，在标记为 2、3 和 4（红色圆圈内）的部分，数据不在同一尺度上。在应用任何机器学习之前，我们必须进行一些数据归一化。数据归一化的过程在第
    6 章中解释。这里使用相同的代码来归一化数据。


    ```

    normalize <- function(x) {

    return((x - min(x)) / (max(x) - min(x)))

    }

    concrete_norm <- as.data.frame(lapply(dataset, normalize))

    ```


    在数据清洗和数据转换之后，我们必须将数据集分成一部分用于训练，一部分用于测试。这个过程帮助模型从数据中学习并模仿数据的行为。因此，我们必须将超过 70% 的数据用于训练，其余用于测试。为了避免偏差，我们必须打乱数据。R
    中的 `sample` 函数已被用于为数据集创建随机行号。此外，80% 的数据被放入训练数据集，其余保留用于测试。


    ```

    nrows<-nrow(dataset)

    sampledata<-sample(nrows,0.8∗nrows)

    concrete_train <- concrete_norm[sampledata,]

    concrete_test <- concrete_norm[-sampledata,]

    ```


    在 R 中有许多用于神经网络算法的包和算法。其中一个包是 `neuralnet`。这个包包含一个用于神经网络算法的函数。要使用这个包，我们必须先在 RStudio
    中使用 `install.packages()` 安装它。安装包后，我们只需引用 `vis` 包的 `library` 命令。


    ```

    library("neuralnet")

    ```


    下一步是使用训练数据集创建一个训练模型，并确定我们要预测哪一列。


    ```

    concrete_model <- neuralnet(strength ~ cement + slag

    + ash + water + superplastic + coarseagg + fineagg + age,

    data = concrete_train)

    ```


    现在模型已创建，我们可以测试其准确性。我们将针对所有八个属性对训练数据集运行该模型。


    ```

    model_results <- compute(concrete_model, concrete_test[1:8])

    predicted_strength <- model_results$net.result

    ```


    并且我们必须创建一个输出数据集来展示给用户。


    ```

    output<-dataset[-sampledata,]

    output$Pred<-predicted_strength∗100

    ```


    结果将存储在一个数据框结构的输出变量中。另一个重要的考虑因素是，Power Query 只识别 `data.frame` 格式。因此，其他数据结构，如向量、列表和矩阵，无法在
    Power Query 编辑器中显示（图 7-6）。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig6_HTML.jpg](img/463840_1_En_7_Fig6_HTML.jpg)


    图 7-6


    预测结果


    可以在可视化区域中查看神经网络结构，以查看隐藏节点、层等。因此，我们必须使用 R 自定义视觉对象，在 Power BI 报表中复制混凝土数据集，如图 7-7
    所示。接下来，我们必须编写相同的神经网络预测代码，并添加另一行代码来绘制模型。运行代码，你将看到刚刚出现在图层上的神经网络结构，误差为 3.001。


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig7_HTML.jpg](img/463840_1_En_7_Fig7_HTML.jpg)


    图 7-7


    Power BI 报表中的神经网络模型结构


    ```

    normalize <- function(x) {

    return((x - min(x)) / (max(x) - min(x)))

    }

    concrete_norm <- as.data.frame(lapply(dataset, normalize))

    summary(concrete_norm$strength)

    concrete_train <- concrete_norm[1:773,]

    concrete_test <- concrete_norm[774:1030,]

    library("neuralnet")

    concrete_model <- neuralnet(strength ~ cement + slag

    + ash + water + superplastic + coarseagg + fineagg + age,

    data = concrete_train)

    plot(concrete_model)

    ```


    我们可以通过改变隐藏节点和层的数量来减小误差。

    '
- fmt: '# Decision Trees


    A decision tree is a common approach for doing machine learning. This tool can
    be used for prediction, descriptive analysis, and feature selection. A decision
    tree follows the way that we reach decisions. Imagine a job seeker who wants to
    decide among a number of different jobs. He or she has established some criteria
    for his/her selection, such as the following: What are the responsibilities? What
    is the annual salary or hourly rate? Finally, how many times a year is travel
    required? We can simulate the job seeker’s decision-making process, as shown in
    Figure [7-8](#463840_1_En_7_Chapter.xhtml#Fig8). The root of the tree is the main
    decision point, that is, saying yes or no to the job. Then the most important
    criterion is whether the job title matches the searcher’s expertise. The second
    most important criterion is salary. Finally, if there is no leaf, the third criterion
    is to check the number of required travel days per year. The decision tree uses
    information gain theory to identify what is the main criteria are for tree branching.
    Details on how this works are available at [`http://radacad.com/decision-tree-conceps-part-1`](http://radacad.com/decision-tree-conceps-part-1)
    [[3](#463840_1_En_7_Chapter.xhtml#Par69)].


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig8_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig8_HTML.jpg)


    Figure 7-8


    Decision tree for job-seeking


    There are different ways of using decision trees in Power BI. One approach involves
    Power BI custom visualization.


    To access this, you first must sign in to a Power BI account (Figure [7-9](#463840_1_En_7_Chapter.xhtml#Fig9)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig9_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig9_HTML.jpg)


    Figure 7-9


    Power BI account


    We must retrieve the visual from the Visualization panel by clicking the three
    dots and then choosing the Import from store option (Figure [7-10](#463840_1_En_7_Chapter.xhtml#Fig10)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig10_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig10_HTML.jpg)


    Figure 7-10


    Importing a Visual from the store


    On the Power BI custom visual page, there are different categories of visuals,
    including Filters, KPIs, Maps, Advanced Analytics, and more (Figure [7-11](#463840_1_En_7_Chapter.xhtml#Fig11)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig11_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig11_HTML.jpg)


    Figure 7-11


    Power BI custom visuals


    You need only click the Advanced Analytics option and then select Decision Tree
    Chart (Figure [7-12](#463840_1_En_7_Chapter.xhtml#Fig12)). Click the Add button
    to add the chart to Power BI visualization.


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig12_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig12_HTML.jpg)


    Figure 7-12


    Decision tree custom visual in the Power BI store


    ### Note


    When you add this chart for the first time, you must be sure that you already
    have RStudio or any R version on your machine. Power BI will start to install
    some of the required packages, such as `rpart` into your local R version. Just
    allow Power BI install all the packages. In the next step, a new custom visual
    will appear in the Power BI Visualizations panel (Figure [7-13](#463840_1_En_7_Chapter.xhtml#Fig13)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig13_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig13_HTML.jpg)


    Figure 7-13


    Decision tree custom visual in the Visualizations panel


    To test the custom visual, we must import some data into Power BI Desktop for
    predictive analysis. The data is a free data set about the *Titanic* disaster
    [[4](#463840_1_En_7_Chapter.xhtml#Par70)]. We must choose the fields for decision
    making. The main aim (target) is to predict whether people survived. To do that,
    first we have to choose a couple of columns that may affect passenger survival,
    such as age, gender, and passenger class. Next, put the Survived column as the
    target variable, in the related data field (Figure [7-14](#463840_1_En_7_Chapter.xhtml#Fig14)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig14_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig14_HTML.jpg)


    Figure 7-14


    Power Query filter value


    The next step is to remove the missing values (“blank”) from the age column. Finally,
    the related decision tree chart appears in Power BI Report (Figure [7-14](#463840_1_En_7_Chapter.xhtml#Fig14)).


    At the root of tree, there are four numbered tags. 0 stands for passengers who
    could not have survived. Also, these people are identified by a green tag. The
    “100%” means that all data is at the root. The “0.52” and “0.48” indicate that
    about 0.52 are men and 0.48 are women. In other words, the first attribute that
    the decision tree decided to analyze (based on entropy theory) is the gender of
    the passengers (Figure [7-15](#463840_1_En_7_Chapter.xhtml#Fig15)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig15_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig15_HTML.jpg)


    Figure 7-15


    The root node in the decision tree


    For the next level, on the left, the tag is in green, and it already branches
    to represent the male passengers. Based on that branch, we can summarize that
    most of the male passengers did not survive (0). However, as you can see in Figure
    [7-16](#463840_1_En_7_Chapter.xhtml#Fig16), for women (the branch at the right
    side), the attribute that is going to be analyzed is passenger class.


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig16_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig16_HTML.jpg)


    Figure 7-16


    The second Level of Tree Analysis


    For men (root) older than seven years of age (second node), there is a 58% possibility
    that they will not survive (green tag and 0) (Figure [7-17](#463840_1_En_7_Chapter.xhtml#Fig17)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig17_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig17_HTML.jpg)


    Figure 7-17


    The decision tree analysis for men


    Men (root) older than seven years old (second node) will not survive (green tag
    and 0), with the possibility of 53%. Also, males younger than seven will survive.


    A decision tree inside Power Query can be used to do machine learning and show
    the result in Power BI Report (the same process that has been explained in the
    “Neural Networks” section).


    In the next section, I am going to write R code for a decision tree inside Power
    Query and show how it is possible to pass parameters to it.'
