  trans: '

    ## Power Query 中的聚类分析


    如前面章节所述，可以在 Power Query 内部使用 R 代码进行机器学习。本节将解释如何在 Power Query 中使用 R 代码进行数据聚类，并展示如何利用
    Power BI 可视化来更好地描述按相关聚类分组的数据。


    首先，我们需要进入查询编辑器，然后右键点击数据集并选择“复制”选项，来复制当前的数据集（如图 8-4 所示）。


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig4_HTML.jpg](img/463840_1_En_8_Fig4_HTML.jpg)


    图 8-4


    复制家庭用电数据集


    复制数据集后，你将获得一份家庭用电数据的副本，在应用 R 代码之前，需要先对其进行转换。


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig5_HTML.jpg](img/463840_1_En_8_Fig5_HTML.jpg)


    图 8-5


    数据清洗


    1.  删除日期和时间列。点击每一列，然后右键选择“删除”。


    2.  删除错误。数据中可能存在一些错误，因此需要设定处理规则，例如，点击“删除行”并选择“删除错误”、“删除空行”或“删除缺失值”（图 8-5）。


    数据清洗完成后，点击“转换”选项卡并选择“运行 R 脚本”选项来执行 R 脚本。在 R 编辑器中，首先需要使用 R 中的归一化函数将数据统一到同一尺度，如下所示：


    ```

    normalize <- function(x) {

    return ((x - min(x)) / (max(x) - min(x))) }

    NormalizedData <- as.data.frame(lapply(dataset, normalize))

    ```


    `kmeans` 函数使用 k-means 聚类算法对数据进行聚类。该算法需要一个数据集和聚类数量。


    ```

    ClusterData<-kmeans(NormalizedData ,4)

    ```


    数据聚类后，我们需要创建一个输出数据集。为此，我们利用 `data.frame` 函数，从原始数据集和聚类编号创建一个数据框数据集。


    ```

    PowerConsumption<-data.frame(dataset,ClusterData$cluster)

    ```


    运行代码后，数据集现在包含原始数据以及一个显示聚类编号的新列。此外，我们需要为当前数据集添加一个索引列，作为后续分析的主键。要添加新列，请点击顶部菜单中的“添加列”选项卡，然后点击“索引列”，默认从
    0 开始，但你可以通过选择其他选项将其改为从 1 开始。


    如图 8-6 所示，我们的数据现在已准备好进行可视化和进一步分析。此时，只需关闭并应用更改即可。


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig6_HTML.jpg](img/463840_1_En_8_Fig6_HTML.jpg)


    图 8-6


    在 Power Query 中对数据进行聚类


    在可视化窗格中，我们将使用一些简单的可视化图表来比较各个聚类（图 8-7）。第一个图表显示每个聚类中的项目数量。我们可以看出每个聚类包含多少个项目。


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig7_HTML.jpg](img/463840_1_En_8_Fig7_HTML.jpg)


    图 8-7


    每个聚类中的项目数量


    此外，你还可以使用漏斗图选项来显示某个聚类中某个属性的平均值（图 8-8）。


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig8_HTML.jpg](img/463840_1_En_8_Fig8_HTML.jpg)


    图 8-8


    聚类比较数据


    还可以进行假设分析。例如，如果电压从 244 变为 254，我们可以检查哪些聚类主要包含该范围，以及哪些其他属性与该子集共同出现。如图 8-9 所示，聚类
    2 和聚类 3 主要覆盖了 244 到 254 的电压范围。


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig9_HTML.jpg](img/463840_1_En_8_Fig9_HTML.jpg)


    图 8-9


    聚类结果的假设分析


    ## 购物篮分析（关联规则）


    另一种描述性分析和数据挖掘的方法是购物篮分析，或称关联规则。购物篮（关联规则）分析用于发现商店中客户的购买行为，以确定哪些相关商品被一起购买。这种方法不仅用于优化产品布局和营销投入，还用于确定医疗保健、政府政策、活动管理等方面的规则
    [5]。


    在本节中，我将解释如何使用购物篮分析，如何用 R 语言编写代码，以及如何得出有效的规则。

    '
- fmt: '### What Is Market Basket Analysis?


    This analysis examines customer purchasing behavior. For example, for a beauty
    supply store, this analysis might reveal some association related to how frequently
    customers purchase shampoo and conditioner together. From a marketing perspective,
    perhaps promoting shampoo will lead customers to buying conditioner as well. From
    a sales perspective, placing shampoo beside conditioner on a store shelf will
    encourage customers to purchase both [[4](#463840_1_En_8_Chapter.xhtml#Par49)].


    As stated, “association rules” is another name for market basket analysis. Association
    rules take the form if X then Y. For example, 60% of those who buy life insurance
    may then buy health insurance. To cite another example, 80% of those who buy books
    online may then also buy music online. Also, 50% of those who have high blood
    pressure and are overweight may then have high cholesterol [[3](#463840_1_En_8_Chapter.xhtml#Par48)].


    Other examples of association rules include searching for interesting and frequently
    occurring patterns of DNA and protein sequences in cancer data, finding patterns
    in purchases or medical claims that occur in combination with fraudulent credit
    card or insurance claims, and identifying combinations of behavior that precede
    customers dropping their cellular phone service or upgrading their cable television
    package. You can see that association rules are not just about shopping but also
    can be applied in health care, insurance, and other industries. The main mathematical
    calculation of this method is explained here: [`http://radacad.com/make-business-decisions-market-basket-analysis-part-1`](http://radacad.com/make-business-decisions-market-basket-analysis-part-1).


    There are three main attributes for market basket analysis.


    - **Support**: The support of an item set or rule measures how frequently it occurs
    in the data.

    - **Confidence**: Confidence is about the probability of a rule. For example,
    if a customer has purchased a flower, what is the probability that they are going
    to purchase a get-well-soon card.

    - **Lifts**: Importance of the rules, that is, how much of the variance it explains.


    The first step in each analysis is to identify the main business problem. In this
    book, I have followed the examples provided in Lantz [[6](#463840_1_En_8_Chapter.xhtml#Par51)],
    which identify the most shopping list items that have been purchased together
    by customers. The second step is to import data into Power BI. You can download
    the data from GitHub [[7](#463840_1_En_8_Chapter.xhtml#Par52)]. This data set
    contains information about more than 9,000 customer transactions. For market basket
    analysis in R, we must install the `arules` package. In addition, we must install
    two other packages in RStudio related to `arules`: `Matrix` and `Methods`. To
    install these packages, you must have one R version in your machine, such as RStudio
    or Microsoft R Open. To install these packages, open R IDE, click New R Scripts,
    and type `Install.packages(<package name>)`.


    We follow the same procedure described in previous chapters for loading data and
    running the R scripts in Power Query (Figure [8-10](#463840_1_En_8_Chapter.xhtml#Fig10)).


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig10_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig10_HTML.jpg)


    **Figure 8-10** Importing a data set into Power BI and Run R Script


    You must then put the following code into the R scripts editor:


    ```

    library(Matrix)

    library(arules)

    library(methods)

    groceries <- read.transactions("[your local address]/groceries.csv", sep = ",")

    Temp<-apriori(groceries, parameter = list(support = 0.006, confidence = 0.25,
    minlen = 2))

    output<-inspect(Temp[1:100])

    ```


    In this code, the `apriori` function from `arules` is used.


    The result of finding association rules in customer behavior is shown in Figure
    [8-11](#463840_1_En_8_Chapter.xhtml#Fig11). The first column (`lhs`) lists the
    main item that people purchased; the third column (`rhs`) lists the items related
    to the `lhs` items. The support, confidence, and lift measures are shown in the
    fourth to sixth columns, respectively. A total 100 rules have been extracted.
    Finally, click Close and Apply at the top left side. Now we can create a visualization
    for showing an item and related items in Power BI.


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig11_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig11_HTML.jpg)


    **Figure 8-11** Result of the market basket analysis


    Now we can create a visualization for showing an item and related items in Power
    BI. We use a specific custom visualization, “Forced-Directed Graph,” from the
    Power BI web site, to show the relationships between items. To get this visual,
    click Market Place at the top of the Visualizations tab, then search for “Forced-Directed
    Graph.”


    After importing the custom visual, the related columns should also be imported
    (Figure [8-12](#463840_1_En_8_Chapter.xhtml#Fig12)). For the source, we put `lhs`.
    For the target, `rhs` should be used. For the weight, we use the `lift` attribute.


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig12_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig12_HTML.jpg)


    **Figure 8-12** Importing the custom visual and related columns


    Some of the visualization parameters, as shown in Figure [8-13](#463840_1_En_8_Chapter.xhtml#Fig13),
    must be changed, to see the visualization better (Figure [8-14](#463840_1_En_8_Chapter.xhtml#Fig14)).


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig14_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig14_HTML.jpg)


    **Figure 8-14** Custom visual parameters setting


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig13_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig13_HTML.jpg)


    **Figure 8-13** Power Query filter value


    We need another custom visual, Chiclet Slicer, from the Power BI store. This custom
    visual is a specific slicer that can be used to slice and dice the charts with
    a specific image. As previously, click Market Place, then search for Chiclet Slicer.
    After importing the visual, choose the value `rhs`, copy the slicer, and set the
    value `lhs` (Figure [8-15](#463840_1_En_8_Chapter.xhtml#Fig15)).


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig15_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig15_HTML.jpg)


    **Figure 8-15** Importing Chiclet Slicer


    You will see a report, as shown in Figure [8-16](#463840_1_En_8_Chapter.xhtml#Fig16).


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig16_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig16_HTML.jpg)


    **Figure 8-16** Market basket analysis report


    By choosing an item, such as sliced cheese, with an `rhs` value in the slicer,
    a graph chart shows us the related items that people purchase most frequently
    with that item, such as sausage and yogurt.


    ## Summary


    This chapter gave a brief introduction to descriptive analytics. First, an explanation
    of the clustering was given. How to use k-mean clustering in Power BI visualization
    was then explained, as was the process of clustering in Power Query Editor. Finally,
    an explanation of market basket analysis was presented.


    # Part III Machine Learning SQL Server'
  raw: '### What Is Market Basket Analysis?


    This analysis examines customer purchasing behavior. For example, for a beauty
    supply store, this analysis might reveal some association related to how frequently
    customers purchase shampoo and conditioner together. From a marketing perspective,
    perhaps promoting shampoo will lead customers to buying conditioner as well. From
    a sales perspective, placing shampoo beside conditioner on a store shelf will
    encourage customers to purchase both [[4](#463840_1_En_8_Chapter.xhtml#Par49)].


    As stated, “association rules” is another name for market basket analysis. Association
    rules take the form if X then Y. For example, 60% of those who buy life insurance
    may then buy health insurance. To cite another example, 80% of those who buy books
    online may then also buy music online. Also, 50% of those who have high blood
    pressure and are overweight may then have high cholesterol [[3](#463840_1_En_8_Chapter.xhtml#Par48)].


    Other examples of association rules include searching for interesting and frequently
    occurring patterns of DNA and protein sequences in cancer data, finding patterns
    in purchases or medical claims that occur in combination with fraudulent credit
    card or insurance claims, and identifying combinations of behavior that precede
    customers dropping their cellular phone service or upgrading their cable television
    package. You can see that association rules are not just about shopping but also
    can be applied in health care, insurance, and other industries. The main mathematical
    calculation of this method is explained here: [`http://radacad.com/make-business-decisions-market-basket-analysis-part-1`](http://radacad.com/make-business-decisions-market-basket-analysis-part-1)
    .


    There are three main attributes for market basket analysis.


    *   *Support*: The support of an item set or rule measures how frequently it occurs
    in the data.


    *   *Confidence*: Confidence is about the probability of a rule. For example,
    if a customer has purchased a flower, what is the probability that they are going
    to purchase a get-well-soon card.


    *   *Lifts*: Importance of the rules, that is, how much of the variance it explains


    The first step in each analysis is to identify the main business problem. In this
    book, I have followed the examples provided in Lantz [[6](#463840_1_En_8_Chapter.xhtml#Par51)],
    which identify the most shopping list items that have been purchased together
    by customers. The second step is to import data into Power BI. You can download
    the data from GitHub [[7](#463840_1_En_8_Chapter.xhtml#Par52)]. This data set
    contains information about more than 9,000 customer transactions. For market basket
    analysis in R, we must install the `arules` package. In addition, we must install
    two other packages in RStudio related to `arules`: `Matrix` and `Methods`. To
    install these packages, you must have one R version in your machine, such as RStudio
    or Microsoft R Open. To install these packages, open R IDE, click New R Scripts,
    and type “Install.packages(<package name="">)</package>*.”*


    We follow the same procedure described in previous chapters for loading data and
    running the R scripts in Power Query (Figure [8-10](#463840_1_En_8_Chapter.xhtml#Fig10)).


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig10_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig10_HTML.jpg)


    Figure 8-10


    Importing a data set into Power BI and Run R Script


    You must then put the following code into the R scripts editor:


    ```

    library(Matrix)

    library(arules)

    library(methods)

    groceries <- read.transactions("[your local address]/groceries.csv", sep = ",")

    Temp<-apriori(groceries, parameter = list(support = 0.006, confidence = 0.25,
    minlen = 2))

    output<-inspect(Temp[1:100])

    ```


    In this code, the `apriori` function from `arules` is used.


    The result of finding association rules in customer behavior is shown in Figure
    [8-11](#463840_1_En_8_Chapter.xhtml#Fig11). The first column (lhs) lists the main
    item that people purchased; the third column (rhs) lists the items related to
    the lhs items. The support, confidence, and lift measures are shown in the fourth
    to sixth columns, respectively. A total 100 rules have been extracted. Finally,
    click Close and Apply at the top left side. Now we can create a visualization
    for showing an item and related items in Power BI.


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig11_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig11_HTML.jpg)


    Figure 8-11


    Result of the market basket analysis


    Now we can create a visualization for showing an item and related items in Power
    BI. We use a specific custom visualization, “Forced-Directed Graph,” from the
    Power BI web site, to show the relationships between items. To get this visual,
    click Market Place at the top of the Visualizations tab, then search for “Forced-Directed
    Graph*.*”


    After importing the custom visual, the related columns should also be imported
    (Figure [8-12](#463840_1_En_8_Chapter.xhtml#Fig12)). For the source, we put `lh`.
    For the target, `rhs` should be used. For the weight, we use the `lift` attribute.


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig12_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig12_HTML.jpg)


    Figure 8-12


    Importing the custom visual and related columns


    Some of the visualization parameters, as shown in Figure [8-13](#463840_1_En_8_Chapter.xhtml#Fig13),
    must be changed, to see the visualization better (Figure [8-14](#463840_1_En_8_Chapter.xhtml#Fig14)).


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig14_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig14_HTML.jpg)


    Figure 8-14


    Custom visual parameters setting


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig13_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig13_HTML.jpg)


    Figure 8-13


    Power Query filter value


    We need another custom visual, Chiclet Slicer, from the Power BI store. This custom
    visual is a specific slicer that can be used to slice and dice the charts with
    a specific image. As previously, click Market Place, then search for Chiclet Slicer.
    After importing the visual, choose the value `rhs`, copy the slicer, and set the
    value `lhs` (Figure [8-15](#463840_1_En_8_Chapter.xhtml#Fig15)).


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig15_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig15_HTML.jpg)


    Figure 8-15


    Importing Chiclet Slicer


    You will see a report, as shown in Figure [8-16](#463840_1_En_8_Chapter.xhtml#Fig16).


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig16_HTML.jpg](images/463840_1_En_8_Chapter/463840_1_En_8_Fig16_HTML.jpg)


    Figure 8-16


    Market basket analysis report


    By choosing an item, such as sliced cheese, with an `rhs` value in the slicer,
    a graph chart shows us the related items that people purchase most frequently
    with that item, such as sausage and yogurt.


    ## Summary


    This chapter gave a brief introduction to descriptive analytics. First, an explanation
    of the clustering was given. How to use k-mean clustering in Power BI visualization
    was then explained, as was the process of clustering in Power Query Editor. Finally,
    an explanation of market basket analysis was presented.


