- fmt: "# Predictive Analysis\n\nAnother type of analysis related to machine learning\
    \ is predictive analysis. Predictive analysis is about supervised learning, meaning\
    \ that we want to learn from past data in order to predict future trends. Predictive\
    \ analysis forecasts the future based on some probability. There is no way to\
    \ predict the future with 100% probability. Predictive analysis is based mainly\
    \ on the probability of the statistics. We can classify predictive analysis into\
    \ two main approaches:\n\n- Regression\n- Classification\n\n`Regression` approaches\
    \ predict a value, for example, sales for the next three months, or the number\
    \ of web site followers over the next three years.\n\n`Classification` analysis\
    \ is concerned with making predictions about a group. Classification predicts\
    \ which person or thing belongs to which category or categories. For example,\
    \ in analyzing a customer churn problem, classification analysis can predict whether\
    \ a new customer belongs to a group that he or she may leave or remain in.\n\n\
    For both regression and classification approaches, there are many associated algorithms\
    \ to help us. In Chapter [7](#463840_1_En_7_Chapter.xhtml), some of these algorithms\
    \ will been explored.\n\nFor regression analysis, there are several related algorithms,\
    \ such as `linear regression`, `logistic regression`, `polynomial regression`,\
    \ `stepwise regression`, `ridge regression`, `lasso regression`, and `elastic\
    \ net regression`. In addition, there are some other techniques, such as `neural\
    \ network`, `decision tree`, and more (Figure [5-5](#463840_1_En_5_Chapter.xhtml#Fig5)).\n\
    \n![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig5_HTML.jpg](images/463840_1_En_5_Chapter/463840_1_En_5_Fig5_HTML.jpg)\n\
    \nFigure 5-5 Regression analysis [[2](#463840_1_En_5_Chapter.xhtml#Par38)]\n\n\
    For classification analysis, there are also many related algorithms, including\
    \ `support-vector machine (SVM)`, `decision tree`, and `k-nearest neighbors (KNN)`\
    \ (see Chapter [7](#463840_1_En_7_Chapter.xhtml)). An example of classification\
    \ analysis using `Power BI` is presented in Chapter [7](#463840_1_En_7_Chapter.xhtml).\n\
    \nTime series forecasting is a subdomain of predictive analysis and has some similarity\
    \ to regression algorithms. Time series analysis forecast values are based on\
    \ time. Time series data may relate to trends and/or seasonality (Figure [5-6](#463840_1_En_5_Chapter.xhtml#Fig6)).\n\
    \n![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig6_HTML.jpg](images/463840_1_En_5_Chapter/463840_1_En_5_Fig6_HTML.jpg)\n\
    \nFigure 5-6 Time series forecasting of milk production\n\n# Prescriptive Analysis\n\
    \nPrescriptive analysis is about the recommendation system. A recommendation system\
    \ predicts the rating or preference users express for an item. Recommendation\
    \ systems can be categorized into two main classes:\n\n![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig8_HTML.jpg](images/463840_1_En_5_Chapter/463840_1_En_5_Fig8_HTML.jpg)\n\
    \nFigure 5-8 Collaborative filtering [[4](#463840_1_En_5_Chapter.xhtml#Par40)]\n\
    \n- **Content-based systems**: These find similarities between items. Content-based\
    \ recommendation systems analyze item descriptions and recommend those having\
    \ greater similarity to a user’s interests [[3](#463840_1_En_5_Chapter.xhtml#Par39)].\
    \ For example, if we want to recommend new movies to a customer, content-based\
    \ filtering checks the similarity of the new movies offered with those the customer\
    \ has already watched (Figure [5-7](#463840_1_En_5_Chapter.xhtml#Fig7)).\n\n \
    \   ![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig7_HTML.jpg](images/463840_1_En_5_Chapter/463840_1_En_5_Fig7_HTML.jpg)\n\
    \n    Figure 5-7 Content-based filtering\n\n- **Collaborative filtering**: This\
    \ is used to recommend items, based on how similar users liked the items (Figure\
    \ [5-8](#463840_1_En_5_Chapter.xhtml#Fig8)).\n\n# Business Understanding\n\nAs\
    \ mentioned, business understanding is about identifying in what categories we\
    \ can fit the business problem. It is important that identifying our problem fit\
    \ into a particular category, such as predictive, descriptive, or prescriptive\
    \ analysis. Business understanding requires interaction with the business experts\
    \ and the business stakeholders. Moreover, the business problem we are going to\
    \ solve can affect the algorithm selection process, data collection, and data\
    \ cleaning. Chapters [6](#463840_1_En_6_Chapter.xhtml)–[8](#463840_1_En_8_Chapter.xhtml)\
    \ provide some examples of machine learning for different business problems.\n\
    \n# Summary\n\nThis chapter provided a brief introduction to the different data\
    \ analytics and machine learning approaches, including descriptive, predictive,\
    \ and prescriptive analytics. `Power BI` is a comprehensive tool for data-driven\
    \ analysis that provides an infrastructure for doing any advanced analytics. In\
    \ the next chapter, I will discuss how to use `R` in `Power BI` for data wrangling.\n\
    \n# 6. Data Wrangling for Predictive Analysis\n\nIn the machine learning process,\
    \ after business understanding, the next step is collecting the right data, feature\
    \ selection, and data wrangling. Data wrangling includes data cleaning, joining\
    \ different data sources, quality control, data integration, data transformation,\
    \ and data reduction processes (Figure [6-1](#463840_1_En_6_Chapter.xhtml#Fig1)).\n\
    \n![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig1_HTML.png](images/463840_1_En_6_Chapter/463840_1_En_6_Fig1_HTML.png)\n\
    \nFigure 6-1 Machine learning process\n\nIn this chapter, I am going to show you\
    \ how to perform data cleaning inside the `Power BI Desktop Query Editor`. A brief\
    \ introduction to `Power Query Editor` will be provided, including how to import\
    \ data from different resources, how to do data cleaning with `Power Query Editor`,\
    \ and how to write `R` scripts inside it.\n\n## Power Query Editor\n\n`Power Query\
    \ Editor` is a data transformation tool for `Power BI`. It is a comprehensive\
    \ tool for getting data, data cleaning, data modeling, and writing `M`, `R`, or\
    \ `Python` scripts. To access the `Power Query Editor` in `Power BI`, you must\
    \ click the `Edit Queries` icon (Figure [6-2](#463840_1_En_6_Chapter.xhtml#Fig2)).\n\
    \n![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig2_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig2_HTML.jpg)\n\
    \nFigure 6-2 Access Power Query Editor\n\n`Power Query Editor` has different options\
    \ for data transformation. You can get data from such different resources as `Excel`,\
    \ `CSV`, `XML`, `JSON`, `Folder`, `SharePoint`, `SQL Server`, `SAP`, `MySQL`,\
    \ `Oracle`, `Azure`, `Azure Blob`, `Azure SQL`, `Azure HDInsight`, `Google Analytics`,\
    \ `Dynamics`, `Facebook`, `MailChimp`, and more (Figure [6-3](#463840_1_En_6_Chapter.xhtml#Fig3)).\n\
    \n![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig3_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig3_HTML.jpg)\n\
    \nFigure 6-3 Data resources available in Power Query Editor\n\n`Power Query Editor`\
    \ has different components. The `Home` tab has a component for getting data from\
    \ different resources, performing some simple data transformation, and an advanced\
    \ editor for writing `M` language. Using `Power Query`, we are able to view in\
    \ a small window the steps applied for data transformation (Figure [6-4](#463840_1_En_6_Chapter.xhtml#Fig4)).\n\
    \n![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig4_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig4_HTML.jpg)\n\
    \nFigure 6-4 Home tab in Power Query\n\nAnother component in `Power Query` is\
    \ the `Transformation` tab. It provides some of the tools required for data transformation,\
    \ such as changing date and time columns, statistic transformations, and so forth\
    \ (Figure [6-5](#463840_1_En_6_Chapter.xhtml#Fig5)).\n\n![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig5_HTML.jpg](images/463840_1_En_6_Chapter/463840_1_En_6_Fig5_HTML.jpg)\n\
    \nFigure 6-5 Power Query Transformation\n\nIn addition, there is a component named\
    \ `Run R scripts` that allows users to write related `R` codes inside `Power Query`.\
    \ In the next section, I am going to show you how we can do some data transformation\
    \ with the aim of machine learning and data analysis, using `Power Query`."
