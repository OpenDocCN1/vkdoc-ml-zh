    ```


    After running the code, we will have a function with an input variable (Figure
    [7-23](#463840_1_En_7_Chapter.xhtml#Fig23)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig23_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig23_HTML.jpg)


    Figure 7-23


    Creating a function for classification with two inputs


    To test the function, we must create a data set to pass to the function. Import
    the new Titanic data set, then Ctrl+Click the four main columns: Survived, Pclass,
    Age, and Sex. Next, right-click and select the Remove Columns option (Figure [7-24](#463840_1_En_7_Chapter.xhtml#Fig24)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig24_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig24_HTML.jpg)


    Figure 7-24


    Selecting the columns


    Finally, there is a data set with four columns now ready to pass to the function.
    In the function, for the first parameter, we must choose the Titanic data set,
    and for the second, the Prediction Column named Survived (Figure [7-25](#463840_1_En_7_Chapter.xhtml#Fig25)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig25_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig25_HTML.jpg)


    Figure 7-25


    Invoking the function


    Next, we may get a message for Edit Permission that is about providing permission
    to run external scripts on the query (Figure [7-26](#463840_1_En_7_Chapter.xhtml#Fig26)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig26_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig26_HTML.jpg)


    Figure 7-26


    Permission request


    After accepting the permission, we can now see the result, as shown in Figure
    [7-27](#463840_1_En_7_Chapter.xhtml#Fig27).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig27_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig27_HTML.jpg)


    Figure 7-27


    Function result for Titanic data set


    To test the function, I imported another data set [[5](#463840_1_En_7_Chapter.xhtml#Par71)]
    that was introduced in Chapter [6](#463840_1_En_6_Chapter.xhtml). It is a data
    set related to breast cancer patients. I want to predict patient diagnosis: will
    a patient’s cancer become malignant “M” or benign “B.” We follow the same process
    as before for this new data set. First, we import it, then we pass the name and
    column of the data set to the function (Figure [7-28](#463840_1_En_7_Chapter.xhtml#Fig28)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig28_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig28_HTML.jpg)


    Figure 7-28


    Call classification function for the cancer data set


    After invoking the function, the prediction result appears as a new query (Figure
    [7-29](#463840_1_En_7_Chapter.xhtml#Fig29)).


    ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig29_HTML.jpg](images/463840_1_En_7_Chapter/463840_1_En_7_Fig29_HTML.jpg)


    Figure 7-29


    Prediction result for cancer diagnosis data set


    ## Summary


    The main aim of this chapter was to show how we can perform machine learning inside
    the Power Query Editor using R codes. Two different algorithms were introduced:
    neural networks and decision trees. I discussed how you can set parameters for
    making machine learning much more flexible. In the next chapter, I will discuss
    descriptive analysis using Power BI.'
