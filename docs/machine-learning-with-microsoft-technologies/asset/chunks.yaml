    *   .NET 应用程序（第 13 章）


    *   以及其他


    对于 Azure 机器学习工具，也可以编写 R 或 Python 代码。此外，拖放式环境也非常易于使用。

    第二种分类是关于云端与本地 AI 工具。许多公司仍然倾向于将工具保留在本地，而另一些公司则更愿意将所有业务产品迁移到云端。介于两者之间，有些公司同时拥有云端和本地工具。

    如果一家公司的主要策略是将所有内容保留在本地，那么使用 Power BI 或 SQL Server 来编写 R 或 Python 可能更合适。然而，如果倾向于在云端进行机器学习，那么
    Azure ML Studio（第 12 章）、用于在 Databricks 上编写 R 或 Python 的工具以及 Azure Data Analytics
    将最有帮助。


    第三类工具旨在解决业务问题。在选择特定工具时，问题的性质以及我们希望用 AI 增强的场景也很重要，例如：


    *   在物联网（IoT）用例场景中应用机器学习

    *   使用文本分析、语音、图像等进行分析

    *   将机器学习应用于 ETL（提取、转换、加载）项目

    *   使用 Azure Machine Studio 为客户快速构建原型


    物联网场景

    分析实时数据的需求已由诸如事件中心、流分析（第 13 章）、Databricks（第 10 章）等 Microsoft 工具解决。借助 Power BI，可以根据来自传感器、应用程序等的真实数据创建实时流报告。

    在此类场景中，大多数情况下需要识别数据中的异常或将预期数据分类到不同的组中。通过将 Azure 机器学习与流分析或 Databricks 结合使用，我们可以将机器学习应用于物联网场景。


    图像、文本和语音分析

    在 Microsoft 技术栈中，有用于图像、文本和语音分析的不同工具。认知服务（第 18 章）是用于文本、语音和图像分析的流行工具之一，它提供了可在其他应用程序中使用的
    API。

    然而，也可以使用 CNTK 平台进行图像处理和语音识别，这将在第 17 章中介绍。这些 Microsoft 包和库为开发人员提供了便利，使他们能够采用深度学习方法执行机器学习。


    ETL 上的机器学习

    另一个可能的需求是将机器学习应用于已加载和转换的数据，以实现可视化和创建报告。在将数据展示给最终用户之前，通常需要对其应用一些描述性或预测性分析。因此，使用
    Power BI 自助式 BI 的用户可以利用机器学习，使用 R 和 Python 脚本使报告更具洞察力。

    另一种方法是在 SQL Server 2016 或 2017 中使用 R 或 Python。此外，如果数据在云端，则可以同时使用 Databricks 进行
    ETL 和机器学习。


    机器学习原型

    对于首次希望在其数据上使用机器学习的公司来说，Azure 机器学习工作室是一个很好的工具，它展示了从收集数据到训练和测试模型的完整机器学习过程。此外，管理人员和利益相关者能够快速跟进机器学习过程，并了解它如何作为
    API 在其他应用程序或简单的 Excel 文件中使用。

    总而言之，机器学习工具的选择取决于所使用的架构、愿意在编程上投入多少精力以及将要实施的具体场景。与第一个需求相关的工具基于预构建 AI 和自定义 AI。与第二个需求相关的工具取决于当前的架构（本地或云端）。最后，需要考虑的最后一个需求是与要实施的特定场景（例如物联网、ETL
    或原型创建）相关的合适工具。


