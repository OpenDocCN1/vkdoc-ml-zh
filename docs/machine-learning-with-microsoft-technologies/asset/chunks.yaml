    BI 服务中展示实时结果。


    该过程在图 13-5 中进行了说明。如图所示，有一个应用程序将实时数据发送到事件中心。Stream Analytics 接收实时数据，对接收到的数据应用 Azure
    ML API 模型，然后将其发送到 Power BI。在 Power BI 报表中，最终用户除了可以看到应用的机器学习结果外，还可以看到实时数据。


