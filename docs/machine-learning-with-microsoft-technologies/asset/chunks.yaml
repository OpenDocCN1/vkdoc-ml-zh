    \ service includes a rich set of algorithms, such as RevoScaleR, Revoscalepy,\
    \ and MicrosoftML. Moreover, it supports a variety of Microsoft custom R and Python\
    \ packages. In this chapter, I will explain how we can facilitate writing R scripts\
    \ in SQL Server 2016 and 2017 (they are the same). In addition, how to use R for\
    \ doing machine learning, what RevoScaleR is, and how specific algorithms are\
    \ going to be supported are also explained. Some features, such as how to use\
    \ pre-trained models for visual analysis and sentiment analysis and how to deploy\
    \ the solution as a web service will be covered as well.\n\n## Running R Scripts\n\
    \nAfter installing the R services in SQL Server (2016 or 2017), you must enable\
    \ writing an external script inside SQL Server Management Studio via a specific\
    \ stored procedure. First, make sure you have already downloaded and installed\
    \ SQL Server Management Studio [[2](#463840_1_En_9_Chapter.xhtml#Par73)].\n\n\
    Run Management Studio as Run as Admin and click New Query, to open a query window\
    \ and run the following code:\n\n```\nsp_configure\n```\n\nBy running the preceding\
    \ code, you will get a list of stored procedures for configuration options (Figure\
    \ [9-4](#463840_1_En_9_Chapter.xhtml#Fig4)).\n\n![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig4_HTML.jpg](images/463840_1_En_9_Chapter/463840_1_En_9_Fig4_HTML.jpg)\n\
    \nFigure 9-4\n\nConfiguration options available in SQL Server\n\nIn line 9, there\
    \ is a stored configuration procedure named external scripts enabled, with four\
    \ columns. This stored procedure enables us to write R codes. It has two main\
    \ attributes: `config_value` and `run_value`. When you run the following code:\n\
    \n```\nsp_configure 'external scripts enabled'.\n```\n\nthe initial value for\
    \ `config` and `run` is zero (Figure [9-5](#463840_1_En_9_Chapter.xhtml#Fig5)).\n\
    \n![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig5_HTML.jpg](images/463840_1_En_9_Chapter/463840_1_En_9_Fig5_HTML.jpg)\n\
    \nFigure 9-5\n\nRunning the external scripts store procedure\n\nTo run R code\
    \ in SQL Server 2017/2016, we must change the `run_value` to 1.\n\n```\nExec sp_configure\
    \ 'external scripts enabled' ,1 Reconfigure with override\n```\n\nNow, if we run\
    \ the code in Figure [9-5](#463840_1_En_9_Chapter.xhtml#Fig5), we will get another\
    \ result (Figure [9-6](#463840_1_En_9_Chapter.xhtml#Fig6)).\n\n![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig6_HTML.jpg](images/463840_1_En_9_Chapter/463840_1_En_9_Fig6_HTML.jpg)\n\
    \nFigure 9-6\n\nEnabling the running of R scripts in SQL Server\n\nIt is possible\
    \ that the `run_value` has not changed to 1, so you must restart SQL Server Management\
    \ Studio.\n\nAfter the `run_value` changes to 1, it is possible to check if R\
    \ script has been enabled. We execute a stored procedure that has three main inputs:\n\
    \n*   `@language` gets the name of scripting language.\n\n*   `@script` stores\
    \ the related R scripts. In the following example, we assign the input variable\
    \ to output one `OutputDataSet<-InputDataSet'`.\n\n*   `@input_data_1` stores\
    \ the related data for consumption of R scripts. In the following example, it\
    \ is a very simple SQL Code: `select 1 as hello`.\n\n```\nexec sp_execute_external_script\
    \  @language =N'R',\n@script=N'OutputDataSet<-InputDataSet',\n@input_data_1 =N'select\
    \ 1 as hello'\nwith result sets (([hello] int not null));\ngo\n```\n\nIf you run\
    \ the preceding code, you will see that the output is `hello` and the value is\
    \ `1` (Figure [9-7](#463840_1_En_9_Chapter.xhtml#Fig7)). The output of a stored\
    \ procedure can be identified by “with result sets.” The column name to be shown\
    \ in the output is hello, and the output value is an integer number (1), and it\
    \ should not be null. As a result, we have `[hello] int not null`.\n\n![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig7_HTML.jpg](images/463840_1_En_9_Chapter/463840_1_En_9_Fig7_HTML.jpg)\n\
    \nFigure 9-7\n\nEnabling R scripts"
  trans: "\n# 9. 在 SQL Server 2016 和 2017 中使用 R\n\n2016 年，微软宣布可以在 SQL Server Management\
    \ Studio 中编写 R 代码。为了能在 SQL Server 2016 中编写 R 代码，我们必须先安装 R 服务。2017 年，微软提供了在 SQL\
    \ Server 2017 中编写 Python 代码的能力。开发者可以使用机器学习服务器，并访问不同的 R 或 Python 包，在 SQL Server\
    \ Management Studio 中编写 R 和 Python 代码。在 2017 版本中，我们不再使用 R 服务，而是使用机器学习服务，它允许我们将\
    \ R 或 Python 代码嵌入到 SQL 脚本中。本章将解释如何设置 SQL Server Management Studio 以编写 R 或 Python\
    \ 脚本的过程。同时也会简要介绍一些必要的包。此外，还会解释如何创建模型并将其复用于其他数据集的最佳实践。\n\n## SQL Server 2016 和\
    \ 2017\n\n在 SQL Server 2016 中使用 R 的第一步是安装 SQL Server 2016 [1]。你可以选择 SQL Server\
