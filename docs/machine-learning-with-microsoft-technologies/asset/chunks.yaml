  trans: '

    ## 设置数据科学虚拟机


    要设置 DSVM，首先必须登录 Azure 门户。选择“AI + 机器学习”，然后点击“数据科学虚拟机 – Windows 2016”（图 16-1）。


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig1_HTML.jpg](img/463840_1_En_16_Fig1_HTML.jpg)


    图 16-1


    数据科学虚拟机设置


    下一步是设置大小并选择合适的配置。出于数据科学的目的，虚拟机 CPU 应具有四个以上内核以及 14GB 或更大的 RAM [2]（图 16-2）。所需服务旁边会有一个星号（如图
    16-2 所示）。


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig2_HTML.jpg](img/463840_1_En_16_Fig2_HTML.jpg)


    图 16-2


    选择数据科学虚拟机大小


    下一步是配置设置，以确定位置和名称。最后一步将显示 DSVM 的摘要。部署 DSVM 大约需要五分钟来创建服务（图 16-3）。创建资源后，点击“转到资源”。


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig3_HTML.jpg](img/463840_1_En_16_Fig3_HTML.jpg)


    图 16-3


    DSVM 创建


    最终用户将看到 DSVM 的概览（图 16-4）。如图所示，其中包含 DSVM 的位置、虚拟机大小等概览信息。


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig4_HTML.jpg](img/463840_1_En_16_Fig4_HTML.jpg)


    图 16-4


    DSVM 概览


    要连接到 DSVM，请点击窗口顶部的“连接”选项。相关的远程桌面协议 (RDP) 文件将从 Azure 下载（图 16-5）。


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig5_HTML.jpg](img/463840_1_En_16_Fig5_HTML.jpg)


    图 16-5


    下载 RDP 文件


    下载 RDP 文件后，打开虚拟机并检查环境（图 16-6）。


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig6_HTML.jpg](img/463840_1_En_16_Fig6_HTML.jpg)


    图 16-6


    DSVM 环境


    在 DSVM 中，已预装带有 R 和 Python 工具的 Visual Studio（RTVS 和 PTVS）。如图 16-7 所示，您可以通过 Visual
    Studio 检查最近的更新 [2]。


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig7_HTML.jpg](img/463840_1_En_16_Fig7_HTML.jpg)


    图 16-7


    Visual Studio 2017 中的 R 和 Python 工具


    RStudio 已安装在 DSVM 中。您必须在 RStudio 中安装所有必需的包，并且所有用户都能访问这些包（图 16-8）。


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig8_HTML.jpg](img/463840_1_En_16_Fig8_HTML.jpg)


    图 16-8


    DSVM 中的 RStudio


    ## 案例研究


    您可以运行不同的机器学习场景。本节将解释在 DSVM 的 Jupyter Notebook 中运行的一个机器学习场景。要访问 Jupyter Notebook，请点击
    DSVM 桌面上的快捷方式。然后，在 Jupyter 中编写代码并运行（图 16-9）。在示例中，我运行了以下代码：


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig9_HTML.jpg](img/463840_1_En_16_Fig9_HTML.jpg)


    图 16-9


    在 Jupyter Notebook 中运行 R 代码


    ```

    library(data.table)

    ad <- fread("http://www-bcf.usc.edu/~gareth/ISL/Advertising.csv")

    ```


    该数据集涉及电视、广播和报纸上的广告成本以及产生的销售额。


    下一步，我们将根据电视、广播和报纸影响的人数等变量来预测销售额。使用线性回归*，创建一个基于电视、广播和报纸广告数量预测销售额的模型。使用以下代码创建模型（图
    16-10）：


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig10_HTML.jpg](img/463840_1_En_16_Fig10_HTML.jpg)


    图 16-10


    在 Jupyter Notebook 中创建模型


    ```

    linearReg<-lm(sales~TV+radio+newspaper,data=ad)

    linearReg

    summary(linearReg)

    ```


    接下来，我们必须创建一个函数，该函数从用户处获取新数据并对其应用线性回归。首先，我们必须为此创建一个函数。


    ```

    newdata<-adv[1:5,]

    library(AzureML)

    predictfunction <-function(newdata)

    {predict(linearReg,newdata)} [2]

    ```


    此函数根据电视、广播和报纸上的广告数量预测销售额。上述函数基于前面代码中创建的模型预测新的数据集。现在，下一步，我们必须从 Azure ML Studio
    环境中获取一些工作区 ID 和身份验证 ID。要获取数据，请登录 Azure ML Studio，然后点击“设置”以获取信息，例如工作区 ID（图 16-11）。


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig11_HTML.jpg](img/463840_1_En_16_Fig11_HTML.jpg)


    图 16-11


    从 Azure ML Studio 获取工作区 ID


    我们需要的另一个信息是身份验证令牌，来自主要授权令牌（图 16-12）。


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig12_HTML.jpg](img/463840_1_En_16_Fig12_HTML.jpg)


    图 16-12


    从 Azure ML Studio 获取身份验证密钥


    复制这些密钥并将标识信息放入以下代码中。`Workspace` 函数是一个 Azure ML 函数，用于在 R 语言和 Azure ML Studio 之间创建连接。


    ```

    workspace_id<-"Workspace ID"

    Authenticationid<-"Authentication Token"

    ws<-workspace(workspace_id,Authenticationid)

    newdata<-adv[2:5,]

    ```


    下一步是调用另一个函数 `publishWebservice`，以根据创建的函数在 Azure ML 中生成一个 Web 服务。


    ```

    data.frame(actual=newdata$sales,prediction=predictfunction(newdata))

    ep<-publishWebService(ws=ws,fun=predictfunction,name="SalesPredictionAdvertisement",inputSchema=newdata)

    ```


    在 Jupyter 环境中运行整个代码（图 16-13）。


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig13_HTML.jpg](img/463840_1_En_16_Fig13_HTML.jpg)


    图 16-13


    将 R ML 代码发布到 Azure ML Web 服务


    运行代码后，检查 Azure ML Studio 中的 Web 服务，以查看在 Azure ML Studio 中创建的 API（图 16-14）。


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig14_HTML.jpg](img/463840_1_En_16_Fig14_HTML.jpg)


    图 16-14


    在 Azure ML 中创建的 Web 服务


    通过点击“测试”按钮测试 API（图 16-15）。


    ![../images/463840_1_En_16_Chapter/463840_1_En_16_Fig15_HTML.jpg](img/463840_1_En_16_Fig15_HTML.jpg)


    图 16-15


    在 Azure ML Studio 中测试 Web 服务


    ## 总结


    本章简要介绍了 DSVM。解释了如何设置 DSVM 以及如何设置相关参数的过程。此外，还简要介绍了哪些应用程序已预装。最后，展示了一个在 Jupyter Notebook
    中进行机器学习，然后部署到 Azure ML Studio 的场景。

    '
- fmt: '# 17. Deep Learning Tools with Cognitive Toolkit (CNTK)


    Microsoft Cognitive Toolkit (`CNTK`) is an open source deep learning tool [[1](#463840_1_En_17_Chapter.xhtml#Par53)].
    In this chapter, an introduction to neural network and deep learning will be provided
    first. Next, an introduction to what `CNTK` is and how it is accessed and installed
    will be provided. Finally, a basic case study using `CNTK` to solve a simple problem
    will be elaborated.


    ## Neural Network Concepts


    What we expect from a computer is to receive outputs that match our needs, based
    on our inputs. Scientists attempt to mimic the human brain through intelligent
    machines. A machine, of course, does reason the same as a human. The principal
    element of the human brain is neurons. Human brains consist of 75 million neurons.
    Each neuron is connected to others via a synapse (Figure [17-1](#463840_1_En_17_Chapter.xhtml#Fig1)).
    The neural network consists of nodes that are connected to one another. In the
    human body, if a neuron is triggered by some external trigger, such as high temperature,
    it will pass the message from the receiver node to other nodes, via synapsis [[2](#463840_1_En_17_Chapter.xhtml#Par54)].


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig1_HTML.jpg](images/463840_1_En_17_Chapter/463840_1_En_17_Fig1_HTML.jpg)


    Figure 17-1 Neural network synapsis[[2](#463840_1_En_17_Chapter.xhtml#Par54)]


    Neural networks mimic the same concepts as those in the human brain. One node
    receives input from the user, then the neural network model creates output that
    produces a result similar to that of a computer system. A neural network has


    * A set of input nodes

    * A set of output nodes

    * Some processing between, to achieve a good result

    * A flow of information

    * A connection between nodes


    To better understand the process, imagine that we are at the summit of a mountain
    and want to descend from it. The weather is foggy. Under this condition, we able
    to see only one meter ahead. As a result, we decide to descend only the one meter
    that is visible. We take a first step based on our current location, then we decide
    which direction to pursue. We repeat the process until we reach the point where
    we cannot go on. If that point is the destination, the process is complete, if
    not, we must go back and try other directions. As a result, for each step, we
    evaluate the way and choose the best course, until we have descended the mountain.


    In a neural network, we undergo the same process. We have input nodes, some hidden
    nodes (the means to reach the output), and output nodes. Each hidden node has
    an activation function that processes the input or the resulting output from other
    hidden nodes (Figure [17-2](#463840_1_En_17_Chapter.xhtml#Fig2)).


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig2_HTML.png](images/463840_1_En_17_Chapter/463840_1_En_17_Fig2_HTML.png)


    Figure 17-2 A simple neural network


    To better understand the concept and how it works, let’s imagine we want to classify
    a customer based on whether he or she will shift his or her support to another
    company. The problem is illustrated in Figure [17-3](#463840_1_En_17_Chapter.xhtml#Fig3).
    As you can see in the figure, there are two groups of people (customers). One
    is represented by blue dots and the other by green ones. The principal aim is
    to group people based on one of the colors.


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig3_HTML.png](images/463840_1_En_17_Chapter/463840_1_En_17_Fig3_HTML.png)


    Figure 17-3 Classification using 2*x* + *y* = 2


    As you can see in the figure, we can partially isolate (classify) blue and green
    dots with a line.


    The relevant equation that has been used is `1/3x + y = 2`. This equation is not
    able to classify the dots completely, so we must try another. The following equation
    is `x = 4`. As you can see in Figure [17-4](#463840_1_En_17_Chapter.xhtml#Fig4),
    the new equation still does not result in a complete or accurate classification.


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig4_HTML.png](images/463840_1_En_17_Chapter/463840_1_En_17_Fig4_HTML.png)


    Figure 17-4 Classification attempted with `x = 4`


    Both formulae are not good at classifying the data. However, if we apply the first
    function, then the second, we can classify the dots relatively well.


    As you can see in Figure [17-5](#463840_1_En_17_Chapter.xhtml#Fig5), we achieved
    a better result than before.


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig5_HTML.png](images/463840_1_En_17_Chapter/463840_1_En_17_Fig5_HTML.png)


    Figure 17-5 Classifying the data


    So, if we want to illustrate this process as a neural network structure, we will
    have something similar to what is shown in Figure [17-6](#463840_1_En_17_Chapter.xhtml#Fig6).


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig6_HTML.png](images/463840_1_En_17_Chapter/463840_1_En_17_Fig6_HTML.png)


    Figure 17-6 Data Science Virtual Machine (DSVM) environment


    The hidden layer (green nodes) can have different functions that help to classify
    the data (Figure [17-7](#463840_1_En_17_Chapter.xhtml#Fig7)). These are called
    activation functions.


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig7_HTML.png](images/463840_1_En_17_Chapter/463840_1_En_17_Fig7_HTML.png)


    Figure 17-7 Activation functions


    There are different topologies for neural networks, such as one output (Figure
    [17-8](#463840_1_En_17_Chapter.xhtml#Fig8)) or many outputs.


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig8_HTML.png](images/463840_1_En_17_Chapter/463840_1_En_17_Fig8_HTML.png)


    Figure 17-8 Neural network with one output


    A neural network can also have multiple layers and multiple outputs (Figure [17-9](#463840_1_En_17_Chapter.xhtml#Fig9)).
    A neural network with multiple layers reflects what is known as *deep learning*
    [[2](#463840_1_En_17_Chapter.xhtml#Par54)].


    ![../images/463840_1_En_17_Chapter/463840_1_En_17_Fig9_HTML.png](images/463840_1_En_17_Chapter/463840_1_En_17_Fig9_HTML.png)


    Figure 17-9 Neural network with multiple outputs and multiple hidden layers


    There are different types of neural networks, such as feed forward deep neural
    networks (DNN) and convolutional neural networks (CNN), among others.


    ## Microsoft Cognitive Service Toolkit


    `CNTK` is an easy-to-use toolkit to solve problems without much anxiety. This
    toolkit can handle a large amount of data and is easily extensible. `CNTK` is
    a fully open source product. It allows processing over multiple GPUs (graphics
    processing units). This toolkit has been used in many Microsoft products, such
    as Cognitive Service, Cortana, Bing search, Skype, Skype Translator, and others.
    According to many users’ experiences, `CTNK` is fast, and using associated Python
    language APIs is very intuitive.'
