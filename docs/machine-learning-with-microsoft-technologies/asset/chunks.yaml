  trans: '

    ### 什么是购物篮分析？


    这种分析用于研究客户的购买行为。例如，对于一家美容用品店，这种分析可能会揭示顾客同时购买洗发水和护发素的频率之间的关联。从营销角度来看，或许推广洗发水会促使顾客也购买护发素。从销售角度来看，将洗发水放在商店货架上护发素的旁边，会鼓励顾客同时购买这两样商品
    [4]。


    如前所述，“关联规则”是购物篮分析的另一种说法。关联规则的形式是“如果 X，那么 Y”。例如，购买人寿保险的人中有 60% 可能会接着购买健康保险。再举一个例子，在线购书的人中有
    80% 可能也会在线购买音乐。此外，患有高血压且超重的人中有 50% 可能胆固醇也高 [3]。


    关联规则的其他例子包括：在癌症数据中搜索 DNA 和蛋白质序列中有趣且频繁出现的模式；在购买记录或医疗索赔中寻找与欺诈性信用卡或保险索赔同时发生的模式；以及识别导致客户取消手机服务或升级有线电视套餐的行为组合。可以看出，关联规则不仅适用于购物，还可以应用于医疗保健、保险和其他行业。该方法的数学计算原理在此处说明：[`http://radacad.com/make-business-decisions-market-basket-analysis-part-1`](http://radacad.com/make-business-decisions-market-basket-analysis-part-1)。


    购物篮分析有三个主要属性。


    *   *支持度*：一个项集或规则的支持度衡量其在数据中出现的频率。


    *   *置信度*：置信度是关于规则的概率。例如，如果一位顾客购买了鲜花，那么他们购买一张早日康复卡片的概率是多少。


    *   *提升度*：规则的重要性，即它能解释多少方差。


    每次分析的第一步是确定主要的业务问题。在本书中，我遵循了 Lantz [6] 提供的示例，这些示例识别了顾客最常一起购买的购物清单项目。第二步是将数据导入
    Power BI。你可以从 GitHub [7] 下载数据。该数据集包含超过 9,000 条客户交易信息。要在 R 中进行购物篮分析，我们必须安装 `arules`
    包。此外，我们还必须在 RStudio 中安装与 `arules` 相关的另外两个包：`Matrix` 和 `Methods`。要安装这些包，你的机器上必须有一个
    R 版本，例如 RStudio 或 Microsoft R Open。要安装这些包，请打开 R IDE，点击“新建 R 脚本”，然后输入“Install.packages(<package
    name="">)</package>*.”*


    我们按照前面章节描述的相同步骤，在 Power Query 中加载数据并运行 R 脚本（图 8-10）。


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig10_HTML.jpg](img/463840_1_En_8_Fig10_HTML.jpg)


    图 8-10


    将数据集导入 Power BI 并运行 R 脚本


    然后，你必须将以下代码放入 R 脚本编辑器中：


    ```

    library(Matrix)

    library(arules)

    library(methods)

    groceries <- read.transactions("[your local address]/groceries.csv", sep = ",")

    Temp<-apriori(groceries, parameter = list(support = 0.006, confidence = 0.25,
    minlen = 2))

    output<-inspect(Temp[1:100])

    ```


    在这段代码中，使用了来自 `arules` 包的 `apriori` 函数。


    在客户行为中发现关联规则的结果如图 8-11 所示。第一列 (lhs) 列出了人们购买的主要商品；第三列 (rhs) 列出了与 lhs 商品相关的商品。支持度、置信度和提升度度量分别显示在第四到第六列。总共提取了
    100 条规则。最后，点击左上角的“关闭并应用”。现在，我们可以在 Power BI 中创建一个可视化来展示一个商品及其相关商品。


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig11_HTML.jpg](img/463840_1_En_8_Fig11_HTML.jpg)


    图 8-11


    购物篮分析的结果


    现在，我们可以在 Power BI 中创建一个可视化来展示一个商品及其相关商品。我们使用来自 Power BI 网站的一个特定自定义可视化“力导向图”来展示商品之间的关系。要获取此可视化，请点击“可视化”选项卡顶部的“市场”，然后搜索“力导向图*.*”


    导入自定义可视化后，还应导入相关列（图 8-12）。对于源，我们放入 `lh`。对于目标，应使用 `rhs`。对于权重，我们使用 `lift` 属性。


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig12_HTML.jpg](img/463840_1_En_8_Fig12_HTML.jpg)


    图 8-12


    导入自定义可视化及相关列


    如图 8-13 所示，必须更改一些可视化参数，以便更好地查看可视化效果（图 8-14）。


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig14_HTML.jpg](img/463840_1_En_8_Fig14_HTML.jpg)


    图 8-14


    自定义可视化参数设置


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig13_HTML.jpg](img/463840_1_En_8_Fig13_HTML.jpg)


    图 8-13


    Power Query 筛选值


    我们需要另一个来自 Power BI 商店的自定义可视化：Chiclet Slicer。这个自定义可视化是一个特定的切片器，可用于使用特定图像对图表进行切片和切块。如前所述，点击“市场”，然后搜索“Chiclet
    Slicer”。导入可视化后，选择值 `rhs`，复制切片器，并设置值 `lhs`（图 8-15）。


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig15_HTML.jpg](img/463840_1_En_8_Fig15_HTML.jpg)


    图 8-15


    导入 Chiclet Slicer


    你将看到一个报告，如图 8-16 所示。


    ![../images/463840_1_En_8_Chapter/463840_1_En_8_Fig16_HTML.jpg](img/463840_1_En_8_Fig16_HTML.jpg)


    图 8-16


    购物篮分析报告


    通过在切片器中选择一个商品（例如切片奶酪）及其 `rhs` 值，图表会向我们展示顾客最常与该商品一起购买的相关商品，例如香肠和酸奶。


    ## 总结


    本章简要介绍了描述性分析。首先，解释了聚类。然后，说明了如何在 Power BI 可视化中使用 K 均值聚类，以及在 Power Query 编辑器中进行聚类的过程。最后，介绍了购物篮分析。


