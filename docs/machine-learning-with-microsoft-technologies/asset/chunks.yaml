    analytics.


    To create input, click the `Inputs` option on the main Stream Analytics page (Figure
    [13-14](#463840_1_En_13_Chapter.xhtml#Fig14)).


    ![../images/463840_1_En_13_Chapter/463840_1_En_13_Fig14_HTML.jpg](images/463840_1_En_13_Chapter/463840_1_En_13_Fig14_HTML.jpg)


