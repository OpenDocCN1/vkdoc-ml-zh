    a cloud platform that includes various components for getting, storing, visualization,
    and output of data. Various parts of Microsoft Azure have the cabability for machine
    learning. As you can see in Figure [1-6](#463840_1_En_1_Chapter.xhtml#Fig6), it
    is possible to write R or Python code in Microsoft Power BI, Microsoft SQL Server
