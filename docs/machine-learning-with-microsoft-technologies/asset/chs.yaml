  如图 12-4 所示，实验处于拖放式环境中。屏幕左侧有一些组件，如已保存数据集、数据转换、机器学习等，可帮助我们创建 ML 模型。


  要创建实验，您必须获取数据。导入数据主要有两种方式：从本地机器导入数据（图 12-5）或使用内置数据组件。在我们的示例中，首先我将从本地机器导入数据。数据集是泰坦尼克号数据集，可从
  [`http://web.stanford.edu/class/archive/cs/cs109/cs109.1166/stuff/titanic.csv`](http://web.stanford.edu/class/archive/cs/cs109/cs109.1166/stuff/titanic.csv)
  获取 [1]。要导入数据，我们必须点击屏幕左侧的“数据集”选项，然后点击“新建”选项。


  ![../images/463840_1_En_12_Chapter/463840_1_En_12_Fig5_HTML.jpg](img/463840_1_En_12_Fig5_HTML.jpg)


  图 12-5


