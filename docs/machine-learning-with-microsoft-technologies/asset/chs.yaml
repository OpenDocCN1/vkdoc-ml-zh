  go\n```\n\n如果你运行上述代码，你将看到输出是 `hello`，值为 `1`（图 9-7）。存储过程的输出可以通过“with result sets”来标识。输出中显示的列名是\
  \ hello，输出值是一个整数（1），并且不应为空。因此，我们有 `[hello] int not null`。\n\n![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig7_HTML.jpg](img/463840_1_En_9_Fig7_HTML.jpg)\n\
