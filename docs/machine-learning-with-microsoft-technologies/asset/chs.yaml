- '# 第一部分 入门


  '
- "# 1. 机器学习简介\n\n机器学习使决策者能够从其数据中获得更深入的洞察。如今，机器学习的应用已不再局限于研究和特定行业。在大多数领域，都存在利用机器学习从现有数据中获取更简洁、更深入信息的宝贵机会。因此，大多数大型软件公司都为其用户提供了通过易用软件访问机器学习的机会。例如，作为商业软件开发先驱的微软，在开发必应搜索引擎、Xbox、Kinect\
  \ 等产品时都利用了机器学习。机器学习在微软的应用并不仅限于新软件的开发。在微软的许多软件开发工具中，例如 Microsoft SQL Server、Power\
  \ BI 和 .NET，都有机会利用机器学习来创建更智能的应用程序和报告。\n\n在本章中，你将学习机器学习的核心概念和方法，回顾机器学习的类型，并逐步了解机器学习的生命周期。此外，你还将了解微软产品中可用的、非常有用的机器学习工具。\n\
  \n## 机器学习概念\n\n机器学习是人工智能的一个子集。Ian Goodfellow 及其同事 [1] 介绍了一个图表，展示了人工智能的不同方法。如图 1-1\
  \ 所示，机器学习是人工智能的几种方法之一。\n\n![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig1_HTML.jpg](img/463840_1_En_1_Fig1_HTML.jpg)\n\
  \n图 1-1\n\n展示人工智能类别及子类别的维恩图 [1]\n\n学者和作者们对机器学习提出了不同的定义。例如，Sebastian Raschka 将机器学习定义为使用算法理解数据的工具\
  \ [2]。他提到，我们会遇到大量的结构化数据（数字）和非结构化数据（图像、语音文本等）。从这些数据中获取洞察会影响决策过程，并帮助管理者更好地理解发生了什么、为什么发生、未来会发生什么以及如何使其发生。\n\
  \n机器学习的概念基于从当前数据集中发现共同模式。历史上，我们创建报告和软件来理解过去发生的事情。分析近期事件和数据总是有助于我们进行进一步的分析，例如寻找关键绩效指标等。调查过去发生的事情相对直接，并能为我们提供一些价值（图\
  \ 1-2）。下一步，我们希望变得更加敏捷以应对变化，因此分析实时数据至关重要。分析近期数据显然比分析历史数据能提供更多洞察。这个过程比之前的方法稍微困难一些，但能为组织带来更多价值。\n\
  \n![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig2_HTML.png](img/463840_1_En_1_Fig2_HTML.png)\n\
  \n图 1-2\n\n从过去到未来，各种分析的价值与难度\n\n第三步是根本原因分析，这是一种侧重于因果关系的调查研究。例如，分析某个特定分支销售额下降的主要原因，可以为业务所有者提供大量价值。\n\
  \n从数据中获取更好价值的进一步步骤是分析未来会发生什么，即*预测分析*。了解未来会发生什么，或洞察数据模式，将帮助决策者实施更明智的公司政策。“将会发生什么”的分析比之前的步骤需要更多的努力和时间。然而，这是企业获取更有价值、更具可操作信息的机遇。\n\
  \n最后一步是“如何使其发生”。这种*规范性分析*在预测未来后推荐应采取的措施。这个过程为任何组织带来了更多洞察，但与其他阶段相比，实施起来更具挑战性。\n\n\
  ## 机器学习方法\n\n机器学习主要有两种方法：\n\n*   监督学习\n\n*   无监督学习\n\n以下段落将对每种方法进行简要说明。在第 5 章中，我将更详细地介绍这些方法，并提供两者的示例。\n\
  \n\n\n\n### 监督学习\n\n监督学习的主要目标是学习如何根据历史数据预测一个类别或数值。另一种定义是，监督学习是从带标签的训练数据中推断出函数关系的机器学习任务\
  \ [2]。\n\n监督学习有不同的方法。一种是预测数值，例如预测某个视频频道的订阅人数，其范围可能从一人到数百万人不等。监督学习使得预测该频道将有多少人订阅成为可能。另一个例子是预测来年的销售额，其范围可能从\
  \ 1,000 美元到 200,000 美元。通过这种方法，算法可以预测公司的销售数量。我们将这种方法称为*回归方法*，其输出结果是一个连续值。\n\n监督学习的另一种方法涉及预测类别，例如预测客户是会留在公司还是离开。在这个例子中，目标是预测现有客户是否会留在某个群体中。另一个案例可能考虑一家提供不同客户等级的公司，例如金卡、银卡和铜卡客户。在这种情况下，监督学习方法可能会预测新客户属于金卡、银卡还是铜卡群体。在这种类型的监督学习中，预测列应该是一个*离散的类别标签*。\n\
  \n### 无监督学习\n\n在监督学习中，我们在创建和训练模型之前就已经对答案有了概念。而在无监督学习中，我们不预测任何列，也不给数据附加任何标签。无监督学习的主要目标是发现数据的自然模式，探索数据并提取其中有意义的信息。\n\
  \n## 机器学习生命周期\n\n机器学习生命周期包含四个主要步骤：\n\n1.  业务理解\n\n2.  数据获取与理解\n    1.  数据收集\n\n\
  \    2.  特征选择\n\n    3.  数据整理\n\n3.  建模\n    1.  模型选择\n\n    2.  拆分数据集\n\n    3.\
  \  训练模型\n\n4.  部署\n    1.  评估模型\n\n    2.  监控模型\n\n微软提出了一个团队数据科学过程（TDSP）来说明这些阶段（图\
  \ 1-3）。\n\n![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig3_HTML.jpg](img/463840_1_En_1_Fig3_HTML.jpg)\n\
  \n图 1-3\n\n微软提出的团队数据科学过程生命周期 [3]\n\n第一步是理解业务问题。了解业务的人员是识别公司需求和机器学习能够解决的问题的最佳资源。然而，并非所有问题都能通过机器学习解决！此外，机器学习用例应与业务利益相关者、数据科学家和工程师协作确定优先级，以便从有价值、负担得起且成功概率高的解决方案开始。\n\
  \n第二步是数据摄取，涉及从不同来源收集所需数据，并进行探索和清洗。找到与问题相关的数据列（主要针对监督学习）有助于创建更准确的算法。此外，对于每个算法，在建模阶段之前必须完成特定的数据转换。\n\
  \n第三步是建模，包括模型选择。这是通过分析问题和数据的性质来完成的。大部分数据应分配给模型创建（训练），留一小部分用于测试和评估模型。如图 1-3 所示，机器学习过程是迭代的。例如，创建模型后，有可能其准确性不高。在这种情况下，我们必须重新检查之前的步骤，例如业务理解或数据获取。\n\
  \n## 机器学习语言与平台\n\n为了创建机器学习模型，你必须至少熟悉一种便于进行机器学习的语言。不过，也有一些工具，例如 Microsoft Azure 机器学习，提供了拖放式环境。\n\
  \n有许多不同的语言可用于进行机器学习，包括 Python、Java、R、C++、C、JavaScript 等。然而，在所有这些语言中，Python 和 R 是使用最广泛的，它们专注于模型创建和机器学习过程。\n\
  \n还有许多不同的工具可用于进行机器学习。在本书中，我们将特别关注那些可以帮助我们执行机器学习的微软工具，以及如何使用不同的微软技术来实现特定的机器学习过程。\n\
  \n微软多年来已在其部分工具（如必应搜索或 Xbox）中集成了机器学习。2004 年，它将数据挖掘工具嵌入到 SQL Server 中。这些工具帮助 SQL 和商业智能（BI）开发人员利用机器学习来创建更具洞察力的报告。\n\
  \nSQL Server 允许用户利用多维数据集中的现有数据快速生成挖掘模型。在 SQL Server 中使用数据挖掘工具的主要优点是它们易于部署、界面出色且用户友好。然而，也存在一些缺点。例如，无法使用\
  \ R 或 Python 创建自定义代码，并且可用的算法数量有限。\n\n随后，微软于 2014 年宣布推出基于云的机器学习平台 Azure 机器学习（AML）。该平台提供了流畅的拖放式环境，并且无需任何软件即可运行。Azure\
  \ 机器学习支持 R 和 Python，并提供超过 25 种专用于机器学习的算法（图 1-4）。你将在第 12 章中了解更多相关信息。\n\n![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig4_HTML.jpg](img/463840_1_En_1_Fig4_HTML.jpg)\n\
  \n图 1-4\n\nAzure 机器学习环境易于使用且灵活\n\n除了 Azure 机器学习之外，微软还提供了在其部分其他工具中嵌入 R 或 Python 代码的能力，例如\
  \ Power BI，这是一种广泛用于 BI 实践的自助式 BI 工具。2015 年，微软开始在 Power BI 中提供机器学习的新可能性，例如在报表部分提供自定义视觉对象，帮助开发人员编写\
  \ R 代码以实现可视化和机器学习。你将在第 4 章中了解更多相关信息。\n\nMicrosoft Power BI 的另一个关键组件是 Power Query。Power\
  \ Query 帮助开发人员从不同来源获取数据，并提供许多用于清洗数据的功能。2016 年，微软引入了在 Power Query 内部编写 R 代码以进行机器学习的选项。在\
  \ Power BI 报表和 Power Query 中编写代码是有区别的。在前者中，你可以创建视觉对象（图 1-5），但在后者中则不能。此外，R 视觉对象中的代码会在筛选上下文更改或页面打开时每次运行，而\
  \ Power Query 编辑器中的 R 脚本仅在刷新时运行，除非存在直接查询连接。你将在第 6、7 和 8 章中学习如何在 Power Query 中使用\
  \ R 执行机器学习。\n\n![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig5_HTML.jpg](img/463840_1_En_1_Fig5_HTML.jpg)\n\
  \n图 1-5\n\nPower BI 报表中用于机器学习的 R 视觉对象\n\n\n\n另一个集成机器学习的微软平台是 Microsoft Azure，这是一个云平台，包含用于数据获取、存储、可视化和输出的各种组件。Microsoft\
  \ Azure 的多个部分都具备机器学习能力。如图 1-6 所示，可以在 Microsoft Power BI、Microsoft SQL Server 2016\
  \ 和 2017（第 9 章和第 10 章）、Azure Data Lake（第 11 章）、Azure Stream Analytics（第 13 章）、Azure\
  \ Machine Learning Studio（第 12 章）以及 Azure Machine Learning Workbench（第 14 章）中编写\
  \ R 或 Python 代码。此外，还将对 Azure HDInsight（第 15 章）进行一些介绍。接下来，在第 16 章中，将概述数据科学虚拟机。在第\
  \ 17 章中，读者将熟悉 CNTK 的概念。此外，一些服务（如认知服务）提供了不同的 API，用于在自然语言处理、文本分析、图像和语音处理等领域进行机器学习。我将在第\
  \ 18 章和第 19 章中详细介绍这些内容。图 1-6 展示了所有 Azure 组件如何与其他 Azure 工具交互，以加速机器学习开发的进程。\n\n![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig6_HTML.jpg](img/463840_1_En_1_Fig6_HTML.jpg)\n\
  \n图 1-6\n\n提供不同机器学习执行可能性的 Microsoft Azure 组件\n\n此外，还可以在 Azure 门户中创建数据科学虚拟机（DSVM）（图\
  \ 1-7）。DSVM 支持多种语言（例如 R、Python、C#）、机器学习模型（Azure Machine Learning Workbench、H2O）、数据摄取工具、数据探索和开发。我将在第五部分深入介绍如何使用这些组件。\n\
  \n![../images/463840_1_En_1_Chapter/463840_1_En_1_Fig7_HTML.jpg](img/463840_1_En_1_Fig7_HTML.jpg)\n\
  \n图 1-7\n\nMicrosoft 数据科学虚拟机（DSVM）组件 [4]\n\n## 总结\n\n本章介绍了 Microsoft 机器学习产品，简要说明了什么是机器学习、机器学习流程以及机器学习生命周期。此外，还描述了一些主要的机器学习方法，例如描述性分析、预测性分析和规范性分析。概述了如何利用这些工具来创建预测性、描述性和规范性分析。在本书的其余部分，将深入介绍\
  \ Microsoft 技术栈中的大部分 AI 工具，并解释如何利用它们来实现机器学习。\n\n"
- '# 2. R 语言入门


  R 无疑是机器学习中最流行的语言之一。它是一种编程语言和免费软件环境，主要用于统计计算和数据可视化。R 语言长期以来一直被学术界、数据科学家和统计学家使用。它是一种统计语言，非常适合机器学习、统计学，并可作为可视化工具使用。Microsoft
  技术与 R 语言之间存在集成，这增强了 Microsoft 应用程序和报表中的机器学习能力。R 是一种开源且专有的语言，可用于 Windows 和 Mac 操作系统。它可以通过包进行扩展
  [1]。本章概述了如何安装 RStudio，以及如何通过安装包来扩展 R 的功能，并将解释如何使用 R 进行机器学习、统计分析和可视化。


  ## 安装 RStudio


  要编写和使用 R 进行机器学习和统计分析，你必须在机器上安装一个 R 版本。有不同版本的 R 和不同的工具来编写 R 代码，但在本书中，我们将使用 RStudio
  编写 R 脚本，RStudio 是一个用于 R 的集成开发环境（IDE），可以使用语法高亮编辑器。要安装 RStudio，你必须访问网站 [`www.rstudio.com/products/RStudio/`](http://www.rstudio.com/products/RStudio/)。你也可以在桌面上或通过服务器运行
  R 脚本。本书使用了桌面版 RStudio。此外，还安装并使用了免费的桌面版 RStudio。首先，在你的机器上安装 RStudio 桌面版并打开它。RStudio
  环境有四个主要部分，如图 2-1 所示。


  ![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig1_HTML.jpg](img/463840_1_En_2_Fig1_HTML.jpg)


  图 2-1


  RStudio 环境


  你可以在 R 编辑器中编写 R 代码。与其他 R IDE 相比，该编辑器更加用户友好。输出或控制台区域显示代码运行的结果。绘图区域显示可视化图表、帮助部分等。最后一个部分，环境和运行历史，显示变量和日志。


  让我们从 R 中的一个简单表达式开始。我们想将值 10 赋给变量名 `X`。简单的语句是


  ```

  X<-10

  ```


  在 R 中，`<-` 符号用于将值赋给变量。要运行代码，你只需按 Ctrl+Enter 或单击编辑器窗口中的运行按钮。


  如图 2-2 所示，我运行了语句 `x<-1`，结果会显示在控制台编辑器中。现在我将确定 `X` 变量的类型。为此，有一个名为 `typeof` 的函数，它接收一个变量并识别其类型。RStudio
  还为每个函数提供“智能感知”。


  ![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig2_HTML.jpg](img/463840_1_En_2_Fig2_HTML.jpg)


  图 2-2


  在 R 代码中运行一个简单语句


  运行 `typeof` 函数后（图 2-3），你将在控制台窗口中看到输出。变量 `X` 的类型是双精度型。R 中有不同的数据类型和结构，本章稍后将讨论这些内容。


  ![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig3_HTML.jpg](img/463840_1_En_2_Fig3_HTML.jpg)


  图 2-3


  在 RStudio 中运行 `typeof` 函数以识别变量类型


  ## 安装包


  为了扩展 R 的功能，可以安装额外的包。每个包都有不同的函数，为使用 R 提供更多功能。


  安装包的主要命令是 `install.packages()`。当你安装 R 时，你的机器上会创建一个库文件夹，其中包含一些用于使用 R 的基本包，例如“基础”包。但是，在第
  4 章中，你将看到如何使用此命令添加一些有助于机器学习的包。


  ## R 数据结构


  每种编程语言都有特定的数据结构。R 有一些预定义的数据结构，每种结构都有特定的用途。为了在 R 中执行机器学习，我们通常使用数据结构，例如向量、列表、数据框、因子、数组和矩阵。接下来，我将简要解释其中一些。



  ### 向量——c( )


  向量存储一组有序的值。每个值都属于相同的数据类型。向量可以保存整数（不含小数的数字）、双精度浮点数（含小数的数字）、字符（文本数据）和逻辑值（`TRUE` 或
  `FALSE`）等数据类型。参见图 2-4。


  ![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig4_HTML.jpg](img/463840_1_En_2_Fig4_HTML.jpg)


  图 2-4


  向量的简单可视化


  要在 R 中创建向量数据结构，必须使用函数 `c()`。若要创建一个存储公司员工姓名的向量，可以编写如下代码：


  ```

  employee_name<-c("Jan","Jack","Mike")

  ```


  存储员工年龄和学历的方法与此相同。


  ```

  employee_age<-c(23,34,23)

  employee_degree<-c("BS","MS","BS")

  ```


  `employee_name`、`employee_age` 和 `employee_degree` 的记录结果如下（图 2-5）：


  ![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig5_HTML.jpg](img/463840_1_En_2_Fig5_HTML.jpg)


  图 2-5


  员工姓名、年龄和学历记录


  ### 因子


  因子是第二种数据结构，用于处理特定类型的向量：分类值或有序值。例如，因子不直接存储“女性”和“男性”类型，而是存储 1 和 2，从而占用更少的存储空间。要定义因子，首先需要定义一个向量；员工学历就是一个分类变量。我们使用常见的
  `Factor()` 函数将向量转换为因子类型，如下所示：


  ```

  employee_degreeFactor<-factor(c("BS","MS","BS"))

  运行 employee_degreefactor 的结果为

  employee_degreeFactor

  [1] BS MS BS

  Levels: BS MS

  ```


  如上述输出所示，在每个员工的学历旁边，还有一个名为 `Level` 的参数。


  ### 列表——list( )


  列表是另一种数据结构，与向量类似，但可以包含多种数据类型的组合（图 2-6）。而向量只能包含一种数据类型。


  ![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig6_HTML.jpg](img/463840_1_En_2_Fig6_HTML.jpg)


  图 2-6


  列表的简单可视化


  列表帮助我们组合不同的数据类型。在 R 中创建列表时，我们使用 `list()` 命令，如下所示：


  ```

  employee_list<-list(employee_name,employee_age,employee_degree)

  ```


  如上述代码所示，`list()` 函数接收一个向量数据结构来创建列表。


  运行变量 `employee_list` 的输出结果如下：


  ```

  [[1]]

  [1] "Jan"  "Jack" "Mike"

  [[2]]

  [1] 23 34 23

  [[3]]

  [1] "BS" "MS" "BS"

  ```


  ### 数据框——data.frame( )


  我们在机器学习中使用的主要数据结构是数据框。数据框与 SQL Server 和 Power BI 中的表结构非常相似。它包含列和行。数据框的图形化表示如图 2-7
  所示。


  ![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig7_HTML.jpg](img/463840_1_En_2_Fig7_HTML.jpg)


  图 2-7


  数据框结构的简单可视化


  要定义数据框，我们使用 `data.frame` 语法，如下所示：


  ```

  employee_DataFrame<-data.frame(employee_name,employee_age,employee_degree)

  ```


  运行变量 `employee_Dataframe` 的结果为：


  ```

  employee_name employee_age employee_degree

  1           Jan           23              BS

  2          Jack           34              MS

  3          Mike           23              BS

  ```


  数据框类似于一个表格。我们可以分别访问其中的单元格、行和列。例如，要提取 `employee_Dataframe` 中的特定列，比如员工年龄，我们可以使用以下代码：


  ```

  employee_DataFrame$employee_age

  ```


  另一种访问行或列的方式是通过索引编号。逗号前的空格代表所有行，逗号后的数字代表列号。例如，我们可以使用以下代码提取第一列的所有行：


  ```

  employee_DataFrame[,1]

  [1] Jan  Jack Mike

  Levels: Jack Jan Mike

  ```


  类似地，要提取所有列中某个特定员工的数据，我们可以利用以下代码：


  ```

  employee_DataFrame[1,]

  employee_name employee_age employee_degree

  1           Jan           23              BS

  ```


  ## R 用于统计分析


  R 已被广泛用于统计分析。它可以用于从简单的统计分析到复杂的统计检验。


  一个简单的统计分析是寻找数据的中心。在 R 中，有一个简单的命令 `summary()` 可以做到这一点，它提供数据集的简要描述。


  以下是一个二手车数据集（图 2-8）：


  ![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig8_HTML.jpg](img/463840_1_En_2_Fig8_HTML.jpg)


  图 2-8


  二手车数据集


  如图 2-8 所示，我们拥有每辆车的价格和里程数。如果我们想查看它们的简单中心度量，可以使用 `summary` 函数。


  ```

  summary(used cars)

  ```


  在 RStudio 中运行代码后，我们得到以下输出（图 2-9）：


  ![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig9_HTML.jpg](img/463840_1_En_2_Fig9_HTML.jpg)


  图 2-9


  在 RStudio 中运行 `summary` 函数代码的输出


  对于数值变量，例如价格或里程数，我们有五个度量值：最小值（Min.）和最大值（Max.）、平均值（mean）、中位数（median），以及第一和第三四分位数（1st
  Qu.、3rd Qu.）。


  ## R 用于机器学习


  R 包含许多帮助数据科学家执行机器学习的包和函数。使用 R 语言，您可以进行预测性、描述性和规范性分析。来自 KDnuggets 网站的以下 R 包（表 2-1）在机器学习领域尤其受欢迎
  [2]。


  表 2-1


  用于机器学习的 R 包


  | **排名** | **包名称** | **机器学习类型** |

  | --- | --- | --- |

  | 1 | caret | 预测性分析（分类和回归） |

  | 2 | randomForest | 预测性分析（分类和回归） |

  | 3 | E1071 | 描述性分析 |

  | 4 | rpart | 预测性分析（分类和回归） |

  | 5 | nnet | 预测性分析（分类和回归） |

  | 6 | arules | 描述性分析（数据挖掘） |

  | 7 | kernlab | 预测性分析（分类和回归）及描述性分析 |


  用于机器学习的包和函数还有很多。在本书中，我将展示如何在 Power BI 中使用它们。




  ## R 语言用于可视化


  R 语言可用于可视化。`Ggplot2` 包是一个流行的包，可帮助我们绘制不同的图表。借助 R 可视化，您可以绘制静态、动态和 3D 图表。在第 6 章中，我将讨论在
  Power BI 中使用 R 代码绘制图表的一些方法。


  我们希望实现可视化的主要目的如下：


  *   比较


  *   构成


  *   分布


  *   关系 [3]


  图 2-10 中的图表展示了可视化的主要目标。


  ![../images/463840_1_En_2_Chapter/463840_1_En_2_Fig10_HTML.jpg](img/463840_1_En_2_Fig10_HTML.jpg)


  图 2-10


  根据目的选择合适的图表


  图 2-10 说明，可视化的主要目的可分为四个方面：关系、分布、比较和构成。此图表是一张用于寻找最佳可视化匹配方案的地图。大多数可用的可视化工具都能遵循此图表。然而，使用
  R 脚本扩展了这些能力，可以绘制我们想要的所有不同类型的图表。


  ## 总结


  本章概述了什么是 R 语言以及如何安装它。它还简要介绍了 R 语言中可用的包和不同的数据结构。最后，简要讨论了如何使用 R 语言进行可视化和机器学习。本书的其余部分将更深入地解释如何借助
  R 脚本绘制图表。


