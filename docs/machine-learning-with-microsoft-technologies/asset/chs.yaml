- '# 12. Azure Machine Learning Studio


  Azure Machine Learning (ML) Studio 是一个云机器学习平台。它提供了一个易于使用的拖放式环境。该平台包含超过 20 种预定义的机器学习算法。借助
  Azure ML Studio，可以从不同资源导入数据，设计机器学习实验，并根据模型创建 Web 服务。此外，还可以在 Azure ML Studio 环境中运行
  R 或 Python 代码。在本章中，我将首先介绍该环境以及如何在其中制定实验，如何创建简单的机器学习模型，如何测试和评估模型，以及如何从本地机器或其他 Azure
  组件导入数据。同时，我还将讨论从模型创建 Web 服务的过程。将探讨如何在 Azure ML Studio 中运行 R 代码。此外，还将详细阐述如何在 R Studio
  中探索 Azure ML 实验。


  ## Azure Machine Learning 环境


  要使用 Azure ML Studio，您必须登录 [`https://studio.azureml.net/`](https://studio.azureml.net/)
  。登录时，您可以使用 Google、Yahoo 或公司账户（图 12-1）。Azure ML 有两种订阅方式：一种是免费的，另一种是标准版。


