  ## Power Query 中的自动化机器学习


  在上一节中，我解释了如何使用决策树进行预测分析。现在，我们将在 Power Query 中使用它，无需特定图表即可进行预测。


  首先，我们必须点击页面顶部的 Power Query 编辑器，导航到 Power Query 环境。在 Power Query 中，你必须先从 [`www.kaggle.com/c/titanic`](http://www.kaggle.com/c/titanic)
  [4] 下载*泰坦尼克号*数据集。然后，点击新建源，选择文本/CSV 选项导入数据集，并点击确定（图 7-18）。


  ![../images/463840_1_En_7_Chapter/463840_1_En_7_Fig18_HTML.jpg](img/463840_1_En_7_Fig18_HTML.jpg)


  图 7-18


  将泰坦尼克号数据集导入 Power Query


  将数据集导入 Power Query 后，我们必须导航到“转换”选项卡，然后点击“运行 R 脚本”。在 R 编辑器中，我们将能够编写 R 代码。代码的第一行引用了一个名为
  `rpart` 的库。`rpart` 包必须首先安装在你的 RStudio 中。安装前，请先使用以下命令确认你尚未安装它：


  ```

  Library("rpart")

  ```


  否则，在 RStudio 中，使用以下代码查看你的机器上已安装了哪些库。


  ```

  packagematrix <- installed.packages();

  NameOnly <- packagematrix[,1];

  OutputDataSet <- as.data.frame(NameOnly);

  OutputDataSet

  ```


  首先，我们必须确保 `rpart` 已安装到我们的机器上。然后，我们在 R 编辑器中编写以下代码（就像本章前面为神经网络所做的那样）。现在，我们必须引用 `rpart`
  库，并将数据分为训练集和测试集。


  ```

  library(rpart)

  numrows<-nrow(dataset)

  sampledata<-sample(numrows,0.8∗numrows)

  train<-dataset[sampledata,]

  test<-dataset[-sampledata,]

  ```


  创建模型是下一步。这涉及到我们想要预测的属性，并基于训练数据集为其创建模型。此外，我们必须有一个 `Survived ~` 的公式。这表明我们想要根据年龄、性别和乘客等级来预测幸存列。`predict`
  函数将用于预测分析中的生存情况。


  ```

  DT<-rpart(Survived~ Age+Pclass+Sex,data=train,method= ="class")

  prediction<-predict (DT,test)

  rpartresult<-data.frame(prediction,test)

  ```


  因此，预测结果将以名称 `rpartresult` 显示在 Power Query 中。结果将包含两个不同的附加列。“X0”代表乘客未幸存的概率，“x1”代表乘客幸存的概率。现在想象一下，我们想要使用
  `rpart` 算法对另一个数据集进行分类，例如第 6 章讨论的与癌症相关的数据。可以对 R 代码进行参数化，以便将所需的数据集、预测列等传递给 R 代码。为此，我们必须复制该数据集（图
  7-19）。


