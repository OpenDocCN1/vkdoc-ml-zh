  ## 总结


  本章的主要目的是展示如何通过 R 代码在 Power Query 编辑器内部执行机器学习。介绍了两种不同的算法：神经网络和决策树。我讨论了如何设置参数以使机器学习更加灵活。在下一章中，我将讨论使用
