  new ApiKeyServiceClientCredentials(subscriptionKey),

  new System.Net.Http.DelegatingHandler[] { });

  IList faceList;   // 检测到的人脸列表。

  String[] faceDescriptions;      // 检测到的人脸描述列表。

  double resizeFactor;            // 显示图像的缩放因子。

  public MainWindow()

  {

