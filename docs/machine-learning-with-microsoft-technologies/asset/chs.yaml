- '# 15. HDInsight 上的机器学习


  本章将概述如何使用 HDInsight 进行机器学习。HDInsight 基于 Apache Spark，用于内存集群处理。在内存中处理数据比基于磁盘的计算快得多。Spark
  还支持 Scala 语言，该语言支持分布式数据集。在 Spark 中创建集群非常快，并且它能够使用 Jupyter Notebook，这使得数据处理和可视化更加容易。Spark
  集群还可以与 Azure Event Hub 和 Kafka 集成。此外，还可以设置 Azure 机器学习 (ML) 服务来运行分布式 R 计算。下一节将讨论在
  HDInsight 中设置 Spark 的过程。


  ## HDInsight 概述


  HDInsight 是一种开源分析和基于云的服务。与 Azure HDInsight 集成对于处理海量数据来说简单、快速且经济高效。HDInsight 有许多不同的用例场景，例如
  ETL（提取、转换和加载）、数据仓库、机器学习、物联网 (IoT) 等。


  使用 HDInsight 进行机器学习的主要好处是可以访问基于内存的处理框架。HDInsight 帮助开发人员使用一些优秀的开源框架（例如 Hadoop、Spark、Hive、LLAP、Kafka、Storm
  和 Microsoft Machine Learning Server [1]）来处理和分析大数据并开发解决方案。




  ## 在 HDInsight 中设置集群


  第一步是在 Azure 中设置 HDInsight。登录你的 Azure 账户，并在 Azure 中创建一个 HDInsight 组件（图 15-1）。如图 15-1
  所示，HDInsight 有不同的模块，例如 HDInsight Spark 监控和 HDInsight InteractiveQuery 监控。在这些模块中，选择
