  导入数据集后，我们能够创建一个实验，目标是预测特定年龄、性别和乘客舱位的乘客是否幸存。要创建新实验，您必须首先点击屏幕左侧的“实验”选项。Azure ML 由不同的模块（节点）组成，每个活动都显示为单独的节点。在搜索区域中，输入“Titanic”。然后将该节点拖放到白色设计图面区域，如图
  12-6 所示。如图 12-6 所示，泰坦尼克号数据集显示为一个只有单个输出的独立节点。要查看数据集，您必须右键单击输出节点，然后点击“可视化”选项。这将允许您查看数据以及一些额外的有用信息，例如
  PassengerID、Survived、Pclass、Name 等列。


