  图 10-15


  在 Azure Databricks 中创建新单元格


  也可以使用诸如 ggplot2 之类的 R 包来绘制图表。例如，如果我们想查看带有特定图例的散点图中的 Pclass、年龄和性别，我们可以利用以下代码。


  ```

  %r

  display(output)

  library(ggplot2)

  ggplot(output,aes(x=output$Age,y=output$Pclass, color=output$Gender))+geom_jitter()

  ```


