  ## Azure Machine Learning 实验


  实验是创建机器学习模型的主要载体。如图 12-3 所示，我们有两个主要的实验区：我的实验和示例。我的实验是创建新机器学习模型和存储所有用户创建实验的地方。示例实验包含微软预定义的示例。


  要创建新实验，请点击屏幕左侧的“实验”，然后点击页面左下角的“新建”选项，再选择“空白实验”（图 12-4）。


