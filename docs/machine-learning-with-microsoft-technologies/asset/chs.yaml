  \n图 3-7\n\n在不同环境中的 Visual Studio 内运行 Python 代码\n\n## Python 用于统计摘要\n\n进行任何机器学习或统计分析的第一步是汇总数据集。我们将从维度、列的统计摘要以及数据预览方面来查看数据集。我们可以从以下链接访问关于汽车的数据资源：\
  \ [`https://archive.ics.uci.edu/ml/machine-learning-databases/auto-mpg/auto-mpg.data`](https://archive.ics.uci.edu/ml/machine-learning-databases/auto-mpg/auto-mpg.data)\
  \ 。\n\n我们将直接从网站加载数据，然后为每一列分配一个名称。为每一列分配名称将有助于我们更好地探索数据。然后我们将使用 Panda 包来加载和读取数据。\n\
  \n```\nURL = \"https://archive.ics.uci.edu/ml/machine-learning-databases/auto-mpg/auto-mpg.data\"\
  \nnames = ['MPG', 'Cyl', 'Disp', 'HorsePower', 'Weight','Acceleration','Model Year','Origin','Car\
  \ Name']\ndataset = pandas.read_csv(URL, names=names)\n```\n\n\n\n### 维度\n\n要获取数据的维度，例如行数和列数，我们使用\
  \ `shape` 属性，如下所示：\n\n```\nprint(dataset.shape)\n```\n\n结果\n\n```\n(398, 9)\n```\n\
  \n上述结果表明我们有 398 行和 9 列。此外，我们可以使用 `head` 属性查看前 20 行数据，如下所示：\n\n```\nprint(dataset.head(20))\n\
  ```\n\n### 统计分布\n\n要检查属性的统计摘要，我们可以使用 `describe` 命令，如下所示：\n\n```\nprint(dataset.describe())\n\
  ```\n\n### 用于可视化的 Python\n\nPython 允许用户创建图表。它提供了多种数据可视化选项。Matplotlib 是 Python 中用于可视化的主要包。它非常强大，可用于创建复杂的图表。Matplot\
  \ 是第一个可视化库，其他工具，如 Seaborn、ggplot、Bokeh 等，都是在其基础上构建的（参见 [`https://blog.modeanalytics.com/python-data-visualization-libraries/`](https://blog.modeanalytics.com/python-data-visualization-libraries/)\
  \ ）。\n\nPython 中也可使用 ggplot2 包。ggplot2 基于 R 的绘图系统。它基于图层工作。\n\nBokeh 是另一个类似于 ggplot2\
  \ 的库，但它是 Python 原生的。它帮助开发者绘制交互式和基于 Web 的图表。\n\nPlotly 是一个在线数据可视化工具，对于创建交互式图表非常有用。Plotly\
  \ 既可用于 R 也可用于 Python。\n\n### 用于机器学习的 Python\n\nPython 是一种简单、优雅且一致的语言。例如，与 R 相比，它的可读性更强。\n\
  \nPython 在应用数据科学领域尤其受欢迎。它拥有不同的机器学习包，例如 NumPy、Pandas、Keras、TensorFlow 等。然而，它是一种通用语言，可用于数据工程、网站抓取、Web\
  \ 应用程序构建等。\n\n## 总结\n\n本章概述了 Python 及相关软件，并讨论了如何使用它来执行机器学习。\n\n"
- "# 4. Power BI 中的 R 可视化\n\nPower BI 是一种自助式商业智能（BI）软件。该工具可用于企业级的数据可视化、数据清洗、建模、分析和协作。关于如何使用\
  \ Power BI，已经出版了许多书籍和博客。在本章中，我将展示如何利用 R 创建更好的可视化效果，并从 Power BI 中获得额外价值。在本章中，我将解释如何在\
  \ Power BI 中设置 R，如何使用 R 脚本在 Power BI 中绘制图表，如何设置 Power BI 报表环境，如何设置 Power BI 以编写\
  \ R 代码，以及如何在 Power BI 中绘制 R 图表。\n\n## Power BI\n\nPower BI 报表环境帮助我们可视化数据。根据 Abela\
  \ 博士 [1] 的观点，数据可视化有四个主要目的，如下所示，并在图 4-1 中以图形方式呈现：\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig1_HTML.jpg](img/463840_1_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1\n\n数据可视化示意图 [1]\n\n1.  数据比较\n2.  数据关系\n3.  数据构成\n4.  数据分布\n\nPower BI Desktop\
  \ 是一款免费应用程序，您可以从 [`https://powerbi.microsoft.com/en-us/desktop/`](https://powerbi.microsoft.com/en-us/desktop/)\
  \ 下载。Power BI 可视化面板支持图 4-1 中建议的大部分图表。通过从市场或其他来源导入自定义视觉对象，可以扩展可视化功能。\n\nPower BI\
  \ Desktop 通过“获取数据”选项帮助用户从不同来源获取数据（图 4-2）。要了解更多关于 Power BI 的信息，请访问 [`http://radacad.com/online-book-power-bi-from-rookie-to-rockstar`](http://radacad.com/online-book-power-bi-from-rookie-to-rockstar)\
  \ 。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig2_HTML.jpg](img/463840_1_En_4_Fig2_HTML.jpg)\n\
  \n图 4-2\n\nPower BI 可视化环境\n\n### 在 Power BI 中设置 R\n\n要在 Power BI 中绘制 R 图表，第一步是至少安装一个\
  \ R 版本或 Microsoft R Open。现在我们必须指定要使用的 R 版本。为此，我们单击“文件”菜单，然后单击“选项和设置”，再单击“选项”。在“全局”选项下，单击“R\
  \ 脚本”，以指定 R 版本（图 4-3）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig3_HTML.jpg](img/463840_1_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3\n\n在 Power BI 中设置 R 环境\n\n如第 3 章所述，R 基于包。每当您使用特定的包时，必须首先在您的机器上安装它。（如果您使用的是\
  \ Power BI Desktop，大多数包已安装在服务中。）您可以使用 R IDE（例如 R Studio）安装包。然后，在 Power BI R 编辑器中，您必须引用该包。此外，请确保您使用的是已安装的\
  \ R 包的正确版本（图 4-4）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig4_HTML.jpg](img/463840_1_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4\n\n在 Power BI 中指定 R 版本和环境\n\n\n\n### 在 Power BI 中编写 R 代码\n\n可以在 Power BI\
  \ 的报表区域编写 R 代码。为此，我们必须先将数据导入 Power BI 报表。\n\n一个包含汽车规格（如市区和高速公路速度、气缸数等）的数据集，可从 [`https://forge.scilab.org/index.php/p/rdataset/source/tree/master/csv/ggplot2/mpg.csv`](https://forge.scilab.org/index.php/p/rdataset/source/tree/master/csv/ggplot2/mpg.csv)\
  \ 下载。该数据集是免费的，名为“mpg.csv”。我将使用这个数据集，在一张图中展示汽车在高速公路和市区的速度、气缸数、生产年份以及驱动类型（前轮、后轮等）。如图\
  \ 4-1 所示，要展示不同项目之间的数据对比，我们必须使用表格图。我们将通过“获取数据”选项将数据导入 Power BI Desktop，并导入一个 CSV\
  \ 文件（图 4-5）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig5_HTML.jpg](img/463840_1_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5\n\n将 CSV 文件导入 Power BI Desktop\n\n导入数据后，您应该能在“字段”下看到它。单击 R 并将其拖到空白区域（图 4-6）。\n\
  \n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig6_HTML.jpg](img/463840_1_En_4_Fig6_HTML.jpg)\n\
  \n图 4-6\n\n将 R 放入空白区域\n\n展开 mpg 数据集（图 4-7），并选择 cty（市区速度）、hwy（高速公路速度）和 cyl（气缸数）选项。\n\
  \n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig7_HTML.jpg](img/463840_1_En_4_Fig7_HTML.jpg)\n\
  \n图 4-7\n\n从 mpg 文件中选择相关数据\n\nR 脚本编辑器将被启用。在 R 脚本编辑器下，您会看到一些 R 代码。井号（#）是在 R 中用于注释的符号，不会作为脚本执行。Power\
  \ BI 会自动将选定的字段放入一个名为 `dataset` 的变量中，因此所有字段（cty、hwy 和 cyl）都将存储在一个数据集变量中，相当于使用了 `<-`\
  \ 语法。此外，Power BI 会自动删除任何重复的行。这在 R 脚本编辑器区域中有说明（图 4-8）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig8_HTML.jpg](img/463840_1_En_4_Fig8_HTML.jpg)\n\
  \n图 4-8\n\nVisual Studio 2017 中的活动 Python 环境\n\n接下来，我们将放置用于在 Power BI 中绘制二维图形的 R\
  \ 代码。在 Power BI 中，要使用任何 R 脚本，都需要使用 `install.package()` 函数在 R 中安装该包。在我们的例子中，必须安装\
  \ ggplot2。我们使用函数 `library(ggplot2)` 来引用这个包。R 编辑器中的第一行代码是 `library(ggplot2)`。这个包包含一些用于绘制图表的重要函数。\n\
  \n为了绘制图表，我首先使用 `ggplot` 函数来配置一个二维图表。第一个参数是 `dataset`，它包含我们的三个字段。然后，在 ggplot2 中还有另一个名为\
  \ `aes` 的函数，它用于标识哪个字段应位于 x 轴或 y 轴上。最后，在图表中，我还想指示汽车的气缸数。这可以通过在 `aes` 函数中添加另一个图层来实现：Size。因此，气缸数更多的汽车将显示为更大的点（见图\
  \ 4-9）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig9_HTML.jpg](img/463840_1_En_4_Fig9_HTML.jpg)\n\
  \n图 4-9\n\nR 脚本编辑器\n\n```\nt←ggplot(dataset, aes(x=cty, y=hwy,size=cyl))\n```\n\n\
  然而，上图显示的是没有任何特定图表的图形区域。我们需要一个散点图来在 x 轴和 y 轴上指示市区和高速公路速度。ggplot2 的 `geom_point` 函数用于绘制散点图。该函数有一个值为\
  \ pch=21 的参数，这与图表中点的形状有关。例如，如果我将此值设置为 20，它会变成一个实心圆；值为 23 则变成菱形。要运行代码，请单击运行选项（图 4-10）。\n\
  \n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig10_HTML.jpg](img/463840_1_En_4_Fig10_HTML.jpg)\n\
  \n图 4-10\n\n如何运行 R 代码\n\n单击运行代码选项后，图表将显示在 R 可视化对象中（图 4-11）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig11_HTML.jpg](img/463840_1_En_4_Fig11_HTML.jpg)\n\
  \n图 4-11\n\n使用 `ggplot` 函数绘制图表\n\n在图 4-11 中，您可以看到我们有三个不同的字段：高速公路速度和市区速度，分别位于 y 轴和\
  \ x 轴上。汽车的气缸变量显示为不同的圆点大小。但是，您可能需要更大的圆点，以区分 8 缸和 4 缸的汽车。我们通过添加另一个图层，即添加一个函数名来满足这一需求，如下所示：\n\
  \n```\nscale_size_continuous(range=c(1,5))\n```\n\n以下是完整的代码：\n\n```\nt<-ggplot(dataset,\
  \ aes(x=cty, y=hwy,size=cyl)) + geom_point(pch=23)+scale_size_continuous(range=c(1,5))\n\
  in the scale_size_continues(range=c(1,5))\n```\n\n指定的最小值和最大值之间的差值为 5。我可以通过将其从 5\
  \ 改为 10 来增加这个差值。生成的散点图如图 4-12 所示。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig12_HTML.jpg](img/463840_1_En_4_Fig12_HTML.jpg)\n\
  \n图 4-12\n\n显示市区和高速公路速度以及气缸数的散点图\n\n在下一个示例中，我将 `pch` 值更改为 24，并在 `aes` 函数名中添加了另一行代码：`fill=Red`。这意味着图表将显示实心的红色矩形（图\
  \ 4-13）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig13_HTML.jpg](img/463840_1_En_4_Fig13_HTML.jpg)\n\
  \n图 4-13\n\n最终图表\n\n```\nt<-ggplot(dataset, aes(x=cty, y=hwy,size=cyl,fill=\"Red\"\
  )) + geom_point(pch=24)+scale_size_continuous(range=c(1,5))\n```\n\n通过使用 R 中的 `facet`\
  \ 命令，可以在一个图表中显示五个不同的变量。这有助于我们在图表中获得更多维度。为此，我们将展示汽车的生产年份及其驱动类型。因此，我们必须更改代码，如下所示：\n\
  \n```\nt← ggplot(dataset, aes(x=cty, y=hwy,color = factor(cyl))) + geom_point(size=4)\n\
  ```\n\n通过更改 `aes` 函数参数，我们用 `color` 参数替换了 `size` 参数。这表明我想区分汽车的气缸值，不仅通过圆点大小，还要通过为它们分配不同的颜色来显示。因此，我按照上面的代码片段更改了\
  \ `aes` 函数。\n\n我们必须更改代码，如下所示：\n\n```\nlibrary(ggplot2)\nt<-ggplot(dataset, aes(x=cty,\
  \ y=hwy,color = factor(cyl))) + geom_point(size=4)\nt<-t + facet_grid(year ~ drv)\n\
  ```\n\n现在，您可以在 y 轴和 x 轴上看到汽车在高速公路和市区的速度。此外，我们还将气缸数显示为颜色，将驱动类型和生产年份显示为分面（图 4-14）。\n\
  \n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig14_HTML.jpg](img/463840_1_En_4_Fig14_HTML.jpg)\n\
  \n图 4-14\n\n绘制显示五个变量的表格图\n\n## Power BI 中的 R 功能\n\nR 脚本编辑器具有一些功能，可帮助我们更好地使用 Power\
  \ BI Desktop，例如切片和切块以及编辑 R 代码。\n\n\n\n### 切片与切块\n\nR 可视化具有交互性，可以对它们进行切片和切块。我们将使用一个切片器来切分分面图。同时，我们还会在报表区域插入一个年份切片器，以筛选\
  \ R 可视化对象（图 4-15）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig15_HTML.jpg](img/463840_1_En_4_Fig15_HTML.jpg)\n\
  \n图 4-15\n\n对 R 可视化对象进行切片和切块\n\n### 在 RStudio 中编辑 R 代码\n\n可以在 RStudio 中打开包含数据的代码。此外，还可以选择使用我们已有的数据在\
  \ RStudio 中运行 R 代码（图 4-16）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig16_HTML.jpg](img/463840_1_En_4_Fig16_HTML.jpg)\n\
  \n图 4-16\n\n运行 R 代码\n\n点击“运行”选项后，RStudio 中将打开一个包含汽车相关数据的页面。导入的数据集包含了数据的所有变更（图 4-17）。\n\
  \n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig17_HTML.jpg](img/463840_1_En_4_Fig17_HTML.jpg)\n\
  \n图 4-17\n\n在 RStudio 中打开 R 代码\n\n## 自定义可视化对象\n\n使用自定义可视化对象是扩展 Power BI 可视化能力的另一种方式。有两种方法可以访问自定义可视化对象：\n\
  \n1.  使用 Office 商店中已有的自定义可视化对象\n\n2.  创建自定义可视化对象\n\n### Power BI Office 商店中的自定义可视化对象\n\
  \nOffice 商店为 Power BI 用户提供了多种自定义可视化对象。要访问它们，您必须首先登录您的工作账户（图 4-18）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig18_HTML.jpg](img/463840_1_En_4_Fig18_HTML.jpg)\n\
  \n图 4-18\n\n登录 Power BI 账户\n\n然后，在 Power BI 可视化窗格中，点击三个点，选择“从商店导入”选项（图 4-19）。\n\n\
  ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig19_HTML.jpg](img/463840_1_En_4_Fig19_HTML.jpg)\n\
  \n图 4-19\n\n从 Power BI 商店导入可视化对象\n\n接下来，您将看到一个标题为“Power BI 自定义可视化对象”的页面。这里列出了许多类别，例如筛选器、KPI、地图、高级分析、时间、仪表、信息图和数据可视化（图\
  \ 4-20）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig20_HTML.jpg](img/463840_1_En_4_Fig20_HTML.jpg)\n\
  \n图 4-20\n\nPower BI 自定义可视化对象窗格\n\n如前所述，Power BI 自定义可视化对象包含一个“高级分析”类别。点击它，您将看到诸如时间序列、关联规则、聚类等高级分析功能。我将使用其中一个自定义可视化对象来预测牛奶产量。\n\
  \n第一步是将牛奶数据集导入 Power BI Desktop。该数据包含两列：牛奶生产日期和牛奶产量值（图 4-21）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig21_HTML.jpg](img/463840_1_En_4_Fig21_HTML.jpg)\n\
  \n图 4-21\n\n牛奶产量数据\n\n现在，我们必须从 Power BI 自定义可视化对象中导入自定义可视化对象，以预测牛奶产量（图 4-22）。\n\n\
  ![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig22_HTML.jpg](img/463840_1_En_4_Fig22_HTML.jpg)\n\
  \n图 4-22\n\n高级分析时间序列自定义可视化对象\n\n导入自定义可视化对象后，您会看到它已添加到标准可视化面板中（图 4-23）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig23_HTML.jpg](img/463840_1_En_4_Fig23_HTML.jpg)\n\
  \n图 4-23\n\n预测自定义可视化对象\n\n导入预测自定义可视化对象后，我们现在必须为数据字段选择日期和值。\n\n此自定义可视化对象使用指数平滑算法来预测未来十个月的牛奶产量（图\
  \ 4-24）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig24_HTML.jpg](img/463840_1_En_4_Fig24_HTML.jpg)\n\
  \n图 4-24\n\n预测牛奶产量\n\n预测图表中，黄色部分表示前几个月的实际牛奶产量数据，红色部分表示后十个月的预测数据。\n\n背后的算法是不可访问的，我们只能更改参数（图\
  \ 4-25）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig25_HTML.jpg](img/463840_1_En_4_Fig25_HTML.jpg)\n\
  \n图 4-25\n\n预测未来十个月的牛奶产量\n\nPower BI 中的自定义可视化对象扩展了使用不同图表的可能性。然而，由微软团队创建的自定义可视化对象数量是有限的。为了扩展可视化能力，有一种方法可以通过使用\
  \ R 脚本来创建自定义可视化对象。在下一节中，我将解释创建自定义可视化对象的过程。\n\n\n\n### 创建自定义视觉对象\n\nPower BI Desktop\
  \ 中的一些主要 Power BI 标准视觉对象被广泛使用。然而，如前一节所述，可以通过自定义视觉对象来扩展这些功能。要访问自定义视觉对象，您必须在 Power\
  \ BI Desktop 中单击“市场”。有两种方法可以使用 Java 脚本或 R 代码创建自定义视觉对象。\n\n我将简要解释使用 R 代码创建自定义视觉对象的过程。\n\
  \n1.  第一步是从 [`https://nodejs.org/`](https://nodejs.org/) 安装 NodeJS。\n\n2.  接下来，使用命令提示符安装\
  \ Power BI 视觉对象工具（图 4-26）：\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig26_HTML.jpg](img/463840_1_En_4_Fig26_HTML.jpg)\n\
  \n图 4-26\n\n通过命令提示符安装 Power BI 自定义视觉对象\n\n```\nnpm install -g powerbi-visuals-tools\n\
  ```\n\n1.  安装 Power BI 自定义视觉对象后，为确保它们已正确安装，我们必须运行 `pbiviz` 命令。运行此命令后，Power BI 自定义视觉对象工具的相关信息将显示在命令提示符控制台中（图\
  \ 4-27）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig27_HTML.jpg](img/463840_1_En_4_Fig27_HTML.jpg)\n\
  \n图 4-27\n\n确认 Power BI 自定义视觉对象\n\n2.  接下来，我们必须创建一个 `rhtml` 模板。要创建模板文件夹，我们首先必须在\
  \ C 盘中创建一个空文件夹。在 C 盘中创建一个名为 `CustomVisual` 的新文件夹后，然后，使用命令提示符，我们必须将目录更改为 `C:\\ CustomVisual`。在命令提示符中，我们运行以下代码：\n\
  \n```\npbiviz new sampleRHTMLVisual -t rhtml\n```\n\n通过运行该代码，将在 `CustomVisual` 文件夹中创建一个名为\
  \ `sampleRHTMLVisual` 的文件夹。在此文件夹中，有一个名为 `script.r` 的 R 文件（图 4-28）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig28_HTML.jpg](img/463840_1_En_4_Fig28_HTML.jpg)\n\
  \n图 4-28\n\n自定义视觉对象的示例文件夹\n\n这是一个提供模板的文件夹，用于创建其他 R 自定义视觉对象。检查文件夹内的 `script. R` 文件（图\
  \ 4-29）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig29_HTML.jpg](img/463840_1_En_4_Fig29_HTML.jpg)\n\
  \n图 4-29\n\n脚本文件中的 R 代码\n\n现在，如图 4-29 中的代码所示，我们需要两个库，Plotly 和 ggplot2，以便使用 Plotly\
  \ 绘制一个简单的 ggplot2 图表。\n\n这里，数据集已硬编码为 `iris`，这是 R 中的一个开源数据集。该图从 `iris` 数据集中获取数据，并显示花瓣、长度和花的种类。然后我们使用\
  \ `ggplotly` 函数来显示数据。\n\n因此，我们有了一个 R 脚本。现在我将首先从中创建一个包，然后编写我的代码来创建不同的图表。因此，我返回命令提示符，并在该文件夹中键入\
  \ `pbiviz package`（图 4-30）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig30_HTML.jpg](img/463840_1_En_4_Fig30_HTML.jpg)\n\
  \n图 4-30\n\n在命令提示符中创建自定义视觉对象\n\n1.  在 Power BI 文件中打开自定义视觉对象。为此，我们必须选择“可视化”标准面板中的“从文件导入”选项（图\
  \ 4-31）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig31_HTML.jpg](img/463840_1_En_4_Fig31_HTML.jpg)\n\
  \n图 4-31\n\n将自定义视觉对象导入 Power BI\n\n2.  选择“从文件导入”选项后，我们必须浏览 `sampleRHTMLVisual` 文件夹并查找\
  \ `dist` 文件夹。在此文件夹中，有一个以文件夹名称命名的 `pbiviz` 文件。我们必须将此文件导入 Power BI 可视化面板（图 4-32）。\n\
  \n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig32_HTML.jpg](img/463840_1_En_4_Fig32_HTML.jpg)\n\
  \n图 4-32\n\n已导入的自定义视觉对象\n\n3.  最后一步是将自定义视觉对象拖放到 Power BI 报表区域（图 4-33）。该视觉对象与特定数据无关。\n\
  \n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig33_HTML.jpg](img/463840_1_En_4_Fig33_HTML.jpg)\n\
  \n图 4-33\n\n带有 R 代码的自定义视觉对象\n\n我们可以更改 R 代码，并使用不同的名称和图标创建自定义视觉对象。在另一个示例中，我将创建一个表格图表。（我已在本章前面解释过相关的\
  \ R 代码。）\n\n首先，我们必须返回到我们从示例 Power BI 包中获得的 `sampleRHTMLVisual` 文件夹，然后复制该文件夹，以创建一个新的自定义视觉对象。我们将文件夹名称更改为\
  \ `TableChart`。这里有一个 `pbiviz` 文件，其中包含自定义视觉对象的名称、图标等信息。我们必须更改 `pbiviz.json` 文件的内容。\n\
  \n1.  将自定义视觉对象的名称更改为“TableChart”。\n\n2.  为自定义视觉对象创建一个尺寸为 20×20 的图标，并将其放入 `assets`\
  \ 文件夹中。\n\n3.  更改 JSON 文件中图标的地址（图 4-34）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig34_HTML.jpg](img/463840_1_En_4_Fig34_HTML.jpg)\n\
  \n图 4-34\n\n必须更改 JSON 文件名\n\n4.  更改名称并为自定义视觉对象创建新图标后，我们必须保存 JSON 文件，并将创建的图标放入 `assets`\
  \ 文件夹中。\n\n5.  接下来，我们必须更改 `scripts. R` 文件中的 R 脚本。在 `actual code` 部分，将现有代码替换为以下代码。\n\
  \n```\n    if(ncol(Values)==5)\n    {\n    names(Values)[1]<-paste(\"X\")\n    names(Values)[2]<-paste(\"\
  Y\")\n    names(Values)[3]<-paste(\"Z\")\n    names(Values)[4]<-paste(\"W\")\n \
  \   names(Values)[5]<-paste(\"M\")\n    g=ggplot(Values,aes(x=X,y=Y,color=Z))+geom_jitter()+facet_grid(\
  \ M ~  W,scales = \"free\")\n    }\n    ```\n\n6.  保存文件。\n\n7.  我们现在必须返回到命令提示符环境，并将目录更改为\
  \ `sampleRHTMLVisual` 文件夹，通过键入 `pbiviz package`（图 4-35）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig35_HTML.jpg](img/463840_1_En_4_Fig35_HTML.jpg)\n\
  \n图 4-35\n\n命令提示符中的 `pbiviz` 命令\n\n8.  运行代码后，我们应该能够在 `dist` 文件夹中看到一个名为 `TableChart`\
  \ 的新 `pbiviz` 文件（图 4-36）。\n\n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig36_HTML.jpg](img/463840_1_En_4_Fig36_HTML.jpg)\n\
  \n图 4-36\n\n表格图表的自定义视觉对象\n\n9.  最后，我们必须将创建的自定义视觉对象导入 Power BI Desktop，并将数据字段传递给该视觉对象。\n\
  \n如前所述，我们必须更改代码，如下所示：\n\n```\nif(ncol(Values)==5)\n{\nnames(Values)[1]<-paste(\"\
  X\")\nnames(Values)[2]<-paste(\"Y\")\nnames(Values)[3]<-paste(\"Z\")\nnames(Values)[4]<-paste(\"\
  W\")\nnames(Values)[5]<-paste(\"M\")\ng=ggplot(Values,aes(x=X,y=Y,color=Z))+geom_jitter()+facet_grid(\
  \ M ~  W,scales = \"free\")\n}\n```\n\n主要数据集是 `Values`。`Values` 数据集中的第一项与 x 轴相关，第二项与\
  \ y 轴相关，依此类推。\n\n因此，在 Power BI Desktop 中，请注意您在 R 代码中指定的轴。\n\n\n\n如图 4-37 所示，导入的视觉对象包含名称和图标。此外，在数据字段中，我们将\
  \ `Values` 作为主数据集，并且我们放入其中的变量顺序与为每个变量指定的代码一致。例如，`cty` 字段将位于 x 轴上，`hwy` 位于 y 轴上（第二个值），以此类推。\n\
  \n![../images/463840_1_En_4_Chapter/463840_1_En_4_Fig37_HTML.jpg](img/463840_1_En_4_Fig37_HTML.jpg)\n\
  \n图 4-37\n\n具有特定 R 代码、名称和图标的自定义视觉对象\n\n可以更改 `Value` 字段，使其拥有独立的 x、y、图例、行和列数据字段。这可以通过\
  \ `capabilities.JSON` 实现。有关如何更改数据字段以及如何添加更多设置的更多信息，可通过其他 Microsoft 来源和 RADACAD 网站获取。\n\
  \n## 总结\n\n本章解释了如何设置 Power BI Desktop 以编写 R 代码。还描述了如何在 Power BI 内部使用 R 包（例如 ggplot2\
  \ 和 Plotly）绘制简单图表。简要介绍了 Power BI 中可用于高级分析的自定义视觉对象。最后，简要介绍了如何通过编写 R 和 JSON 脚本来创建\
  \ R 自定义视觉对象的过程。下一章将解释企业在开始机器学习之前需要理解的主要概念。\n\n## 参考\n\n1.  Dr. Abela，《极致演示™方法：复杂信息的高效沟通》，“选择恰当的图表”，[`http://extremepresentation.typepad.com/blog/2006/09/choosing_a_good.html`](http://extremepresentation.typepad.com/blog/2006/09/choosing_a_good.html)，2006\
  \ 年 9 月 6 日。\n\n"
- '# 第二部分 使用 R 和 Power BI 进行机器学习


  使用 R 和 Power BI 进行机器学习


  如今，各行各业对机器学习的应用兴趣浓厚。将 Power BI 视为一个协作式自助服务工具，它支持描述性分析（数据摄取、转换、建模和可视化）的整个价值链。除了这些功能外，Power
  BI 还提供了用于执行高级分析和机器学习的出色工具。第 5 章至第 8 章主要关注 Power BI 内部的主要机器学习周期。在第 5 章中，将讨论与我们将通过机器学习解决哪些业务问题相关的概念。第
  6 章重点介绍在 Power BI 内部进行数据整理（数据清洗）的可能性。第 7 章和第 8 章重点介绍用于预测性和描述性分析的机器学习算法。


  '
- "# 5. 业务理解\n\n业务理解是在任何平台或语言中开展机器学习的主要且首要的步骤。并非所有业务问题都能通过机器学习方法解决。机器学习分为几个基本类别，包括监督学习和无监督学习。\n\
  \n监督学习是指输入和输出变量都已确定的情况。无监督学习是指只有输入数据，而没有相应输出变量的情况。\n\n另一种机器学习分类由三大类组成：\n\n*   描述性分析\n\
  *   预测性分析\n*   规范性分析\n\n描述性分析主要使用无监督学习方法进行总结、分类和提取规则，以回答已经发生的事情。预测性分析是关于基于过去数据进行预测的机器学习方法。最后，规范性分析使用优化和推荐算法来最大化预期结果。\n\
  \n然而，还有其他分析类型，例如诊断分析，也有助于更好地理解业务。根据 Gartner [1] 的说法，这四种分析方法有助于组织中的决策者做出更好的决策。\n\n\
  这些方法中的每一种（图 5-1）都能为公司提供一些价值，并且实施它们需要一定程度的技能。描述性分析是最简单的方法。它不需要高水平的技能，并且可以使用不同的工具完成。诊断和发现分析能提供对数据更深入的洞察，并且需要更高的技能。\n\
  \n![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig1_HTML.jpg](img/463840_1_En_5_Fig1_HTML.jpg)\n\
  \n图 5-1\n\n分析与信息 [1]\n\n如图 5-2 所示，接下来的两种分析，即预测性分析和规范性分析，能提供对数据更深入的洞察，更好地理解未来可能发生的事情，此外还能提供一些规范性建议。这些分析为公司带来的价值比其他三种分析更大，并且它们需要更高的技能水平。\n\
  \n![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig2_HTML.png](img/463840_1_En_5_Fig2_HTML.png)\n\
  \n图 5-2\n\n高级分析 [1]\n\n在本章中，我将解释每种分析类型的主要概念，以及我们可以针对每种分析采取的不同方法。\n\n## 描述性分析\n\n\
  描述性分析是理解数据和现有模式的主要方法。描述性分析可用于理解数据的结构、现有规则或数据中的模式等。描述性分析可分为三大类。\n\n*   运营报告\n*  \
  \ 统计分析\n*   数据挖掘方法\n\n运营报告主要是侧重于分析过去数据的传统报告。这些报告主要用于判断公司的绩效。图 5-3 展示了这样一份报告，说明了不同行业和收入群体的平均总小时工资率。\n\
  \n![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig3_HTML.jpg](img/463840_1_En_5_Fig3_HTML.jpg)\n\
  \n图 5-3\n\n使用 Power BI 生成的每小时平均总工资报告\n\n这份报告简要描述了不同行业工人的小时工资率。其他类型的报告则涉及数据的统计事实。\n\
  \n统计分析是进行描述性分析的另一种方式，它使我们能够更好地理解数据的统计行为。统计分析有多种类型，例如单变量分析，其中每一列数据被单独考虑，例如数据摘要和数据分布（图\
  \ 5-4）。从上图可以看出，员工的平均小时工资率以直方图的形式呈现，以显示其分布。此外，我们还可以看到最小值、最大值和平均分布。这些数据的中位数以箱线图或表格形式绘制。箱线图显示数据在中位数（中点）处分布平滑，这与数据平均值相同。\n\
  \n![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig4_HTML.jpg](img/463840_1_En_5_Fig4_HTML.jpg)\n\
  \n图 5-4\n\n统计分析——单变量分析\n\n其他形式的统计分析涉及两个不同数据列之间的双变量相关性和回归。\n\n另一种形式是关于寻找规则、数据的自然聚类和现有模式，这可以通过数据挖掘方法（在第\
  \ 8 章中简要说明）来完成。在第 8 章中，我将解释一些旨在进行描述性分析的算法（如聚类、购物篮分析和决策树）的代码和概念。\n\n\n\n## 预测分析\n\
  \n另一种与机器学习相关的分析类型是预测分析。预测分析属于监督学习，意味着我们希望从过去的数据中学习，以预测未来的趋势。预测分析基于某种概率来预测未来。没有任何方法能以\
  \ 100%的概率预测未来。预测分析主要基于统计学的概率。我们可以将预测分析分为两种主要方法：\n\n*   回归\n\n*   分类\n\n回归方法预测一个数值，例如，未来三个月的销售额，或未来三年网站关注者的数量。\n\
  \n分类分析则关注对群体进行预测。分类预测某个人或事物属于哪个或哪些类别。例如，在分析客户流失问题时，分类分析可以预测一个新客户属于可能离开还是留下的群体。\n\
  \n对于回归和分类这两种方法，都有许多相关的算法可以帮助我们。在第 7 章中，我们将探讨其中一些算法。\n\n对于回归分析，有几种相关的算法，例如线性回归、逻辑回归、多项式回归、逐步回归、岭回归、套索回归和弹性网络回归。此外，还有一些其他技术，如神经网络、决策树等（图\
  \ 5-5）。\n\n![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig5_HTML.jpg](img/463840_1_En_5_Fig5_HTML.jpg)\n\
  \n图 5-5\n\n回归分析 [2]\n\n对于分类分析，也有许多相关算法，包括支持向量机（SVM）、决策树和 K 近邻（KNN）（参见第 7 章）。第 7\
  \ 章将介绍一个使用 Power BI 进行分类分析的示例。\n\n时间序列预测是预测分析的一个子领域，与回归算法有一些相似之处。时间序列分析预测的值是基于时间的。时间序列数据可能与趋势和/或季节性相关（图\
  \ 5-6）。\n\n![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig6_HTML.jpg](img/463840_1_En_5_Fig6_HTML.jpg)\n\
  \n图 5-6\n\n牛奶产量的时间序列预测\n\n## 规范分析\n\n规范分析是关于推荐系统的。推荐系统预测用户对某个项目的评分或偏好。推荐系统可以分为两大类：\n\
  \n![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig8_HTML.jpg](img/463840_1_En_5_Fig8_HTML.jpg)\n\
  \n图 5-8\n\n协同过滤 [4]\n\n*   *基于内容的系统*：这些系统寻找项目之间的相似性。基于内容的推荐系统分析项目描述，并推荐与用户兴趣相似度更高的项目\
  \ [3]。例如，如果我们想向客户推荐新电影，基于内容的过滤会检查新提供的电影与客户已看过的电影之间的相似性（图 5-7）。\n\n    ![../images/463840_1_En_5_Chapter/463840_1_En_5_Fig7_HTML.jpg](img/463840_1_En_5_Fig7_HTML.jpg)\n\
  \n    图 5-7\n\n    基于内容的过滤\n\n*   *协同过滤*：这种方法用于根据相似用户对项目的喜好来推荐项目（图 5-8）。\n\n## 业务理解\n\
  \n如前所述，业务理解是关于确定我们可以将业务问题归入哪个类别。重要的是，要确定我们的问题适合特定的类别，例如预测分析、描述性分析或规范分析。业务理解需要与业务专家和业务利益相关者进行互动。此外，我们要解决的业务问题会影响算法选择过程、数据收集和数据清洗。第\
  \ 6 章至第 8 章提供了一些针对不同业务问题的机器学习示例。\n\n## 总结\n\n本章简要介绍了不同的数据分析和机器学习方法，包括描述性分析、预测分析和规范分析。Power\
  \ BI 是一个全面的数据驱动分析工具，为进行任何高级分析提供了基础设施。在下一章中，我将讨论如何在 Power BI 中使用 R 进行数据整理。\n\n"
- '# 6. 预测分析的数据整理


  在机器学习过程中，业务理解之后，下一步是收集正确的数据、特征选择和数据整理。数据整理包括数据清洗、连接不同数据源、质量控制、数据集成、数据转换和数据缩减过程（图
  6-1）。


  ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig1_HTML.png](img/463840_1_En_6_Fig1_HTML.png)


  图 6-1


  机器学习过程


  在本章中，我将向您展示如何在 Power BI Desktop 查询编辑器内执行数据清洗。将简要介绍 Power Query 编辑器，包括如何从不同资源导入数据，如何使用
  Power Query 编辑器进行数据清洗，以及如何在其中编写 R 脚本。


  ## Power Query 编辑器


  Power Query 编辑器是 Power BI 的数据转换工具。它是一个用于获取数据、数据清洗、数据建模以及编写 M、R 或 Python 脚本的综合工具。要访问
  Power BI 中的 Power Query 编辑器，您必须单击“编辑查询”图标（图 6-2）。


  ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig2_HTML.jpg](img/463840_1_En_6_Fig2_HTML.jpg)


  图 6-2


  访问 Power Query 编辑器


  Power Query 编辑器提供不同的数据转换选项。您可以从各种不同的资源获取数据，例如 Excel、CSV、XML、JSON、文件夹、SharePoint、SQL
  Server、SAP、MySQL、Oracle、Azure、Azure Blob、Azure SQL、Azure HDInsight、Google Analytics、Dynamics、Facebook、MailChimp
  等（图 6-3）。


  ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig3_HTML.jpg](img/463840_1_En_6_Fig3_HTML.jpg)


  图 6-3


  Power Query 编辑器中可用的数据资源


  Power Query 编辑器有不同的组件。“主页”选项卡包含用于从不同资源获取数据、执行一些简单数据转换的组件，以及用于编写 M 语言的高级编辑器。使用 Power
  Query，我们可以在一个小窗口中查看应用于数据转换的步骤（图 6-4）。


  ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig4_HTML.jpg](img/463840_1_En_6_Fig4_HTML.jpg)


  图 6-4


  Power Query 中的“主页”选项卡


  Power Query 中的另一个组件是“转换”选项卡。它提供了一些数据转换所需的工具，例如更改日期和时间列、统计转换等（图 6-5）。


  ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig5_HTML.jpg](img/463840_1_En_6_Fig5_HTML.jpg)


  图 6-5


  Power Query 转换


  此外，还有一个名为“运行 R 脚本”的组件，允许用户在 Power Query 内部编写相关的 R 代码。在下一节中，我将向您展示如何使用 Power Query
  进行一些旨在进行机器学习和数据分析的数据转换。




  ## Power Query 中的数据整理


  在进行机器学习之前，我们必须经历两个主要过程：数据准备和数据整理。数据准备涉及从资源中收集数据、整合数据并将其加载到一个资源中，类似于 ETL（提取、转换和加载）过程。


  数据整理则是在应用层加载数据，并执行数据清洗、格式化和集成。


  Python 语言包含一些流行的数据整理过程，例如重塑数据、选择数据和合并数据。


  ### 重塑数据


  重塑数据的主要方法之一是数据透视。这涉及将列数据转换为列名，如图 6-6 所示。


  ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig6_HTML.png](img/463840_1_En_6_Fig6_HTML.png)


  图 6-6


  数据透视


  在 Python 中创建数据的相关代码（图 6-7）如下：


  ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig7_HTML.jpg](img/463840_1_En_6_Fig7_HTML.jpg)


  图 6-7


  使用 Python 代码进行数据透视


  ```

  data=[["2nd March 2018","A",12.36],   ["3rd March 2018","A",23.69],  ["2nd March
  2018","B",25.36],     ["2nd March 2018","C",17.28],    ["3rd March 2018","B",19.2]]

  using package pandas

  import pandas as pd

  df=pd.DataFrame(data)

  pivot table

  df=pd.pivot_table(df,index=[df[0]],columns=df[1])

  ```


  在 R 中，我们可以通过以下代码实现：


  ```

  install.packages("tidyr")

  date=c("2nd March 2018","2nd March 2018","2nd March 2018","2nd March 2018","2nd
  March 2018")

  Type=c("A","A","B","C","B")

  index=c(0,1,2,3,4)

  Value=c(12.36,23.69,25.36,17.28,19.2)

  df=data.frame(index,date,Type,Value)

  library("tidyr")

  spread(df,Type,Value)

  and the result is the same (a bit different out put)

  ```


  现在，我们将了解如何在 Power Query 中无需编写任何代码即可启动此过程。要使用 Power Query 进行数据透视，我们必须通过使用“输入数据”选项（图
  6-8）来输入数据。


  ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig8_HTML.jpg](img/463840_1_En_6_Fig8_HTML.jpg)


  图 6-8


  手动输入数据


  通过单击“输入数据”，我们能够手动将数据放入 Power Query 中（图 6-9）。


  ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig9_HTML.jpg](img/463840_1_En_6_Fig9_HTML.jpg)


  图 6-9


  创建数据表


  我们拥有与 Python 中相同的数据（图 6-10）。


  ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig10_HTML.jpg](img/463840_1_En_6_Fig10_HTML.jpg)


  图 6-10


  Power BI 中的数据集


  现在我们只需单击“类型”列（图 6-11）。然后在“转换”选项卡下单击“透视列”。


  ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig11_HTML.jpg](img/463840_1_En_6_Fig11_HTML.jpg)


  图 6-11


  单击“类型”列和透视选项


  接下来，我们指定要将值放入哪一列以及值的类型（图 6-12）。


  ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig12_HTML.jpg](img/463840_1_En_6_Fig12_HTML.jpg)


  图 6-12


  指定类型和值


  数据透视的结果如图 6-13 所示。


  ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig13_HTML.jpg](img/463840_1_En_6_Fig13_HTML.jpg)


  图 6-13


  数据透视表


  还有其他重塑数据的例子，例如逆透视、融合和迭代，这些都可以在 Power Query 中完成。此外，在 Power Query 中，选择和设置条件来检查数据的过程也可以非常轻松地完成。


  ### 选择数据


  要在 Python 中根据条件选择值，我们使用 `where` 函数，如下所示：


  ```

  df.where(df[2]>17)

  ```


  在 `df` 数据集中，我们将选择大于 17 的值（图 6-14）。


