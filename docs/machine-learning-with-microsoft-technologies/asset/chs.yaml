  \ 年。\n\n20. Microsoft 机器学习工具概述\n\n前 19 章概述了如何使用不同的 Microsoft 产品进行机器学习。首先，介绍了机器学习方法，例如描述性分析、预测性分析和规范性分析。然后讨论了作为机器学习主要语言之一的\
  \ R 语言。接着简要说明了如何使用 Power BI、Azure ML Studio、SQL Server 等工具进行机器学习。本章总结了机器学习技术以及使用特定方法时的最佳实践。\n\
  \nMicrosoft 机器学习技术概述\n人工智能（AI），特别是机器学习，可以为企业带来诸多好处。多年来，许多人一直在使用 Microsoft 数据平台工具。Microsoft\
  \ 运用机器学习创建了 Xbox、必应搜索等产品。然而，从 2014 年开始，Microsoft 开始为高级用户和最终用户提供将机器学习嵌入其报告和软件的功能。\n\
  \n前面的章节根据机器学习的使用方式对相关的 Microsoft 工具进行了分类。在本章中，技术根据以下内容进行分类：\n\n*   是否需要编写 R 或 Python\
  \ 代码\n*   云计算还是本地计算\n\n第一种分类基于这些工具的易用性和准确性程度。\n\n我们可以将相关产品分为两大类：\n\n*   *预构建 AI*：无需编写任何\
  \ R 或 Python 代码即可生成机器学习场景的 Microsoft 机器学习工具。\n*   *自定义 AI*：需要了解如何编写 R 或 Python 代码的\
  \ Microsoft 机器学习工具。\n\n第一组易于使用，你只需遵循提供的说明即可。使用预构建 AI 工具的主要好处是无需了解机器学习概念，或者至少了解一些概念，大多数人都能够创建\
  \ AI 应用程序。预构建 AI 工具可以解决一般问题，但对于某些业务问题，其他类别的工具（例如，用于编写 R 或 Python 代码的工具）更有效。在本书中，认知服务（第\
  \ 18 章）和机器人框架（第 19 章）是你可以嵌入到 Power BI、Windows 或其他 Web 应用程序中而无需编写任何 R 或 Python 代码的工具。正如相关章节所述，没有直接方法可以访问预构建自定义\
  \ AI 工具背后的代码，因此无法更改该代码和算法。\n\n相比之下，使用自定义 AI 工具需要了解如何编码以及如何为机器学习目的编写代码。然而，对于某些工具，例如\
  \ Azure ML Studio，可以在不编写 R 或 Python 代码的情况下进行机器学习，尽管至少需要对机器学习的工作原理有一定的了解。一些自定义 AI\
  \ 工具涉及在其他 Microsoft 工具内部编写 R 或 Python 代码，例如在以下工具中使用 R 或 Python：\n\n*   Power BI（第\
  \ 6、7 和 8 章）\n*   SQL Server 2016 的 R Services 和 SQL Server 2017 的机器学习（ML）Services（第\
  \ 9 章）\n*   Azure Data Lake Analytics（第 11 章）\n*   Azure Databricks（第 10 章）\n* \
  \  Azure HDInsight（第 15 章）\n\n\n\n*   .NET 应用程序（第 13 章）\n\n*   以及其他\n\n对于 Azure\
  \ 机器学习工具，也可以编写 R 或 Python 代码。此外，拖放式环境也非常易于使用。\n第二种分类是关于云端与本地 AI 工具。许多公司仍然倾向于将工具保留在本地，而另一些公司则更愿意将所有业务产品迁移到云端。介于两者之间，有些公司同时拥有云端和本地工具。\n\
  如果一家公司的主要策略是将所有内容保留在本地，那么使用 Power BI 或 SQL Server 来编写 R 或 Python 可能更合适。然而，如果倾向于在云端进行机器学习，那么\
  \ Azure ML Studio（第 12 章）、用于在 Databricks 上编写 R 或 Python 的工具以及 Azure Data Analytics\
  \ 将最有帮助。\n\n第三类工具旨在解决业务问题。在选择特定工具时，问题的性质以及我们希望用 AI 增强的场景也很重要，例如：\n\n*   在物联网（IoT）用例场景中应用机器学习\n\
  *   使用文本分析、语音、图像等进行分析\n*   将机器学习应用于 ETL（提取、转换、加载）项目\n*   使用 Azure Machine Studio\
  \ 为客户快速构建原型\n\n物联网场景\n分析实时数据的需求已由诸如事件中心、流分析（第 13 章）、Databricks（第 10 章）等 Microsoft\
  \ 工具解决。借助 Power BI，可以根据来自传感器、应用程序等的真实数据创建实时流报告。\n在此类场景中，大多数情况下需要识别数据中的异常或将预期数据分类到不同的组中。通过将\
  \ Azure 机器学习与流分析或 Databricks 结合使用，我们可以将机器学习应用于物联网场景。\n\n图像、文本和语音分析\n在 Microsoft\
  \ 技术栈中，有用于图像、文本和语音分析的不同工具。认知服务（第 18 章）是用于文本、语音和图像分析的流行工具之一，它提供了可在其他应用程序中使用的 API。\n\
  然而，也可以使用 CNTK 平台进行图像处理和语音识别，这将在第 17 章中介绍。这些 Microsoft 包和库为开发人员提供了便利，使他们能够采用深度学习方法执行机器学习。\n\
  \nETL 上的机器学习\n另一个可能的需求是将机器学习应用于已加载和转换的数据，以实现可视化和创建报告。在将数据展示给最终用户之前，通常需要对其应用一些描述性或预测性分析。因此，使用\
  \ Power BI 自助式 BI 的用户可以利用机器学习，使用 R 和 Python 脚本使报告更具洞察力。\n另一种方法是在 SQL Server 2016\
  \ 或 2017 中使用 R 或 Python。此外，如果数据在云端，则可以同时使用 Databricks 进行 ETL 和机器学习。\n\n机器学习原型\n\
  对于首次希望在其数据上使用机器学习的公司来说，Azure 机器学习工作室是一个很好的工具，它展示了从收集数据到训练和测试模型的完整机器学习过程。此外，管理人员和利益相关者能够快速跟进机器学习过程，并了解它如何作为\
  \ API 在其他应用程序或简单的 Excel 文件中使用。\n总而言之，机器学习工具的选择取决于所使用的架构、愿意在编程上投入多少精力以及将要实施的具体场景。与第一个需求相关的工具基于预构建\
  \ AI 和自定义 AI。与第二个需求相关的工具取决于当前的架构（本地或云端）。最后，需要考虑的最后一个需求是与要实施的特定场景（例如物联网、ETL 或原型创建）相关的合适工具。\n\
