  ## 总结


  本章简要概述了如何使用 Azure Databricks 进行机器学习。它讨论了如何使用 Databricks 环境编写 R 和 Scala 脚本，以及如何将数据从
  Databricks 环境中的一个单元格传递到另一个单元格。最后，您了解了如何应用 R 代码来训练模型并将其用于预测。还解释了如何导入数据以及如何进行机器学习的过程。下一章将概述如何在
  Azure Data Lake 中进行机器学习。


