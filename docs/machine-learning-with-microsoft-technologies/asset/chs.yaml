  NameOnly <- packagematrix[,1]; OutputDataSet <- as.data.frame(NameOnly);'\n,@input_data_1\
  \ = N'SELECT 1 as col'\nWITH RESULT SETS ((PackageName nvarchar(250) ))\n```\n\n\
  运行代码后，你可以看到 SQL Server 中现有的 R 包。\n\n如图 9-9 所示，显示了 R 包的列表。这里有来自 Microsoft 的各种库，以及其他一些开源或第三方包。在下一节中，我将介绍其中的两个。\n\
  \n![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig9_HTML.jpg](img/463840_1_En_9_Fig9_HTML.jpg)\n\
  \n图 9-9\n\nSQL Server 机器学习服务中的 R 包\n\n### RevoScaleR 包\n\nRevoScaleR 是由 Revolutionary\
  \ Analytics（现归 Microsoft 所有）创建的一个包，旨在大规模地导入、转换和分析数据。该包提供了不同类别的函数，涵盖数据存储、导入与另存为、数据转换、绘制图表（如直方图、折线图等）、描述性分析、预测分析、包管理等\
  \ [3]。\n\n在本节中，我将介绍一些你可能用于机器学习目的的函数。示例将在 SQL Server 2017 中展示。\n\n### rxLinMod\n\n\
  `rxLinMode` 用于对数据拟合线性模型。在下面的示例中，我将向你展示如何使用此函数创建一个模型，用于预测混凝土强度与用水量、水泥用量、粉煤灰用量和龄期等输入变量的关系。`rxLinMode`\
  \ 函数基于一个公式和一个训练数据集创建模型。\n\n正如你在以下代码中看到的，第一行是 `EXECUTE sp_execute_external_script\
  \ @language=N'R'`，它调用了一个存储过程，允许用户在 SQL Server 内部编写 R 脚本。该存储过程负责在 SQL Server 代码中使用\
  \ R 或 Python 等外部脚本。\n\n```\nEXECUTE sp_execute_external_script @language=N'R'\n\
  ,@script = N'require(\"RevoScaleR\")\nformula=strength~cement+ash+age+water\nModel_1=rxLinMod(formula,data=inputDataSet)\n\
  Model=data.frame(payload = as.raw(serialize(Model_1, connection=NULL)))'\n,@input_data_1\
  \ = N'Select strength,cement,ash,age,water from [dbo].[concrete]; '\n, @output_data_1_name\
  \ = N'Model'\n,@input_data_1_name = N'inputDataSet'\nWITH RESULT SETS (([concreteModel]\
  \ varbinary(max) NOT NULL  ));\n```\n\n代码中的第二行包含了存储在 `\"@script\"` 参数中的相关 R 代码。该代码通过使用\
  \ `require` 函数引用了 RevoScaleR 包。无需安装此包，因为它已存在于机器学习/R 服务中。第二行 R 代码是关于创建公式的。我们的任务是根据其他一些变量（如用水量、水泥用量等）来预测混凝土强度。允许我们执行此操作的公式是\
  \ `strength~cement+ash+age+water`，它将公式存储在一个名为 `\"formula\"` 的变量中。第三行包含 `rxLinMod`\
  \ 函数，该函数根据公式创建一个线性模型。最后，代码的最后一行将公式存储在一个名为 `\"Model\"` 的输出变量中。\n\n`@input_data_1`\
  \ 使用 SQL 查询 `N'Select strength,cement,ash,age,water from [dbo].[concrete]'` 存储从\
  \ SQL 数据库收集的数据。最后，输出变量 `Model` 将存储线性模型。\n\n创建模型后，我想将其存储起来，用于预测新的数据系列。要存储模型，请使用以下代码：\n\
  \n```\nIF NOT EXISTS (SELECT 1 FROM sys.objects\nWHERE object_id = OBJECT_ID(N'[dbo].[LinearModel]')\n\
  AND [type] IN (N'U'))\nBEGIN\nCREATE TABLE [dbo].LinearModel NULL\n);\nEND\n```\n\
  \n接下来，我们必须将模型插入到表中。以下代码将模型插入到 `LinearModel` 表中。\n\n```\nInsert into [dbo].[LinearModel]\n\
  EXECUTE sp_execute_external_script @language=N'R'\n,@script = N'require(\"RevoScaleR\"\
  )\nformula=strength~cement+ash+age+water\nModel_1=rxLinMod(formula,data=inputDataSet)\n\
  Model=data.frame(payload = as.raw(serialize(Model_1, connection=NULL)))'\n,@input_data_1\
  \ = N'Select strength,cement,ash,age,water from [dbo].[concrete]; '\n, @output_data_1_name\
  \ = N'Model'\n,@input_data_1_name = N'inputDataSet'\n```\n\n模型已经存储在数据库中。现在，在另一个存储过程中，我们将使用该模型来预测数据。\n\
  \n```\ndeclare @rx_model varbinary(max) = (select [Model] from [dbo].[LinearModel]\
  \ );\nexec sp_execute_external_script\n@language = N'R'\n, @script = N'\nrequire(\"\
  RevoScaleR\");\ncdr_model<-unserialize(rx_model);\npredictions <- rxPredict(modelObject\
  \ = cdr_model,\ndata = PredictionData)\nprediction <-as.data.frame(predictions);'\n\
  , @input_data_1 = N'Select strength,cement,ash,age,water from [dbo].[concrete]'\n\
  , @input_data_1_name = N'PredictionData'\n, @output_data_1_name=N'prediction'\n\
  , @params = N'@rx_model varbinary(max)'\n, @rx_model = @rx_model\nwith result sets\
  \ ((\"prediction\" float not null ))  ;\n```\n\n存储过程还有另一个输入，它不仅仅是一个数据集。它包含我们已经存储在数据库中的模型的输入。\n\
  \n通过运行存储过程，将显示以下预测结果（图 9-10）。\n\n![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig10_HTML.jpg](img/463840_1_En_9_Fig10_HTML.jpg)\n\
  \n图 9-10\n\n混凝土强度预测的线性模型\n\n还有其他用于回归分析的模型。这些包括用于逻辑回归的 `rxLogit`；用于将线性模型推广到数据的 `rxGlm`；以及其他模型。此外，对于其他类型的分析，例如群体预测（分类），还有诸如\
  \ `rxDTree`、`rxBTree`、`rxDForest` 和 `rxNaiveBayes` 等算法 [3]。\n\n### Azure ML 包\n\n\
  Azure ML 是另一个用于管理在 Azure ML Studio 中创建的实验的包（参见第 12 章）。该包包含一些常用函数，并允许用户从 R 函数创建 Web\
  \ 服务。该包还允许 R 用户探索 Azure ML 数据集、浏览现有数据集等。有关如何使用此包的详细信息，请参阅第 12 章，该章在解释 Azure 机器学习工作室之后提供。\n\
  \n\n\n## 在 SQL Server Reporting Services 中创建 R 可视化图表\n\n可以在 SQL Server 中生成 R 图表，并在\
  \ SQL Server Reporting Services (SSRS) 中显示该图表。第一步是将所需的包安装到机器学习服务中。为此，我们可以在外部脚本存储过程中使用\
  \ `install.packages()` 命令，如下所示：\n\n```\nEXECUTE sp_execute_external_script @language=N'R'\n\
  ,@script = N' install.packages(\"ggplot2\");'\n,@input_data_1 = N'SELECT 1 as col'\n\
  WITH RESULT SETS ((PackageName nvarchar(250) ))\n```\n\n上述代码可能有效，但有时由于管理员权限问题，它可能无法工作。你可能会在\
  \ `install.packages(\"arules\")` 中收到类似以下警告的消息：\n\n```\n'lib = \"C:/Program Files/Microsoft\
  \ SQL Server/MSSQL14.ML2017/R_SERVICES/library\"' is not writable\nError in install.packages(\"\
  ggplot2\") : unable to install packages\nCalls: source -> withVisible -> eval ->\
  \ eval -> install.packages\n```\n\n要解决此问题，我们必须以管理员身份运行 `Rugi.exe` 来安装包。此外，我们必须指定包的安装位置。因此，需要\
  \ SQL Server 中 R 的机器学习服务的路径。R 中有一个函数 `.libPaths()`，它可以显示已安装包的位置。所以，我们必须在 SQL Server\
  \ 2017 中运行此代码，以找出 R 库路径。\n\n```\nEXECUTE sp_execute_external_script  @language =\
  \ N'R'\n, @script = N'OutputDataSet <- data.frame(.libPaths());'\nWITH RESULT SETS\
  \ (([DefaultLibraryName] VARCHAR(MAX) NOT NULL));\nGO\n```\n\n运行代码后，机器学习服务库路径将显示在\
  \ SQL Server 输出窗口中（图 9-11）。\n\n![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig11_HTML.jpg](img/463840_1_En_9_Fig11_HTML.jpg)\n\
  \n图 9-11\n\n机器学习服务的库路径\n\n安装 ggplot2 时，可能会收到另一条消息，要求安装其他包。安装 ggplot2 库后，我们可以编写 R\
  \ 代码来创建图表并将其存储在 SQL Server 中。我将使用以下 SQL 代码绘制图表：\n\n```\nexec sp_execute_external_script\
  \ @language =N'R', @script=N'library(\"ggplot2\") fields<-inputDataSet fields<-na.omit(fields)\
  \ image_file = tempfile(); jpeg(filename = image_file, width=1000, height=1000);\
  \ print(ggplot(fields,aes(x=fields$TaxAmt,y=fields$TaxAmt))+geom_boxplot()+facet_grid(fields$Color~.)\
  \ ) dev.off(); OutputDataset <- data.frame(data=readBin(file(image_file,\"rb\"),what=raw(),n=1e6))\
  \ ',@input_data_1 =N'select Color,Size,class,TaxAmt,SalesAmount from [dbo].[FactInternetSales]\
  \ FIS inner join [dbo].[DimProduct] DP on FIS.ProductKey=dp.ProductKey' ,@input_data_1_name\
  \ = N'inputDataSet' ,@output_data_1_name = N'OutputDataset' WITH RESULT SETS ((plot\
  \ varbinary(max)));\n```\n\n### R 代码部分\n\n```\nlibrary(\"ggplot2\")\nfields<-inputDataSet\n\
  fields<-na.omit(fields)\nimage_file = tempfile();\njpeg(filename = image_file, width=1000,\
  \ height=1000);\nprint(ggplot(fields,aes(x=fields$TaxAmt,y=fields$TaxAmt))+geom_boxplot()+facet_grid(fields$Color~.)\n\
  )\ndev.off();\nOutputDataset <- data.frame(data=readBin(file(image_file,\"rb\"),what=raw(),n=1e6\n\
  ```\n\n以下是对上述代码的简要说明：\n\n`library(\"ggplot2\")`：引用该包。\n\n`fields<-inputDataSet:`：获取数据。\n\
  \n```\nimage_file = tempfile();\n```\n\n`jpeg(filename = image_file, width=500,\
  \ height=500);`：从 ggplot2 包创建图像文件。\n\n`ggplot(fields,aes(x=fields$TaxAmt,y=fields$TaxAmt))+geom_boxplot()+facet_grid(fields$Color~.)`：指代之前文章中已解释过的代码。\n\
  \n```\ndev.off();\nOutputDataset <- data.frame(data=readBin(file(image_file,\"rb\"\
  ),what=raw(),n=1e6\n```\n\n此代码创建一个 Var 二进制变量，用于将绘图转换为二进制类型的变量。上述代码创建了一个带有箱线图的表格图表。\n\
  \n下一步是从 SQL Server 获取数据。\n\n### 输入数据\n\n```\n@input_data_1 =N'select Color,Size,class,TaxAmt,SalesAmount\
  \ from [dbo].[FactInternetSales] FIS inner join [dbo].[DimProduct] DP on FIS.ProductKey=dp.ProductKey'\
  \ ,@input_data_1_name = N'inputDataSet' ,@output_data_1_name = N'OutputDataset'\n\
  ```\n\n相关的数据集 AdventureWorks* 可以从 [`www.microsoft.com/en-us/download/details.aspx?id=49502`](http://www.microsoft.com/en-us/download/details.aspx%253Fid%253D49502)\
  \ [4] 下载。\n\n### 返回数据\n\n```\nWITH RESULT SETS ((plot varbinary(max)));\n```\n\n\
  最后，我们必须以二进制变量的形式返回绘图。\n\n运行代码后，我们可能会得到如图 9-12 所示的结果。\n\n![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig12_HTML.jpg](img/463840_1_En_9_Fig12_HTML.jpg)\n\
  \n图 9-12\n\n为图表创建二进制值\n\n现在我们必须将数据存储在表中。首先，我们使用以下代码在 SQL Server 中创建一个名为 ggplot 的表：\n\
  \n```\nIF NOT EXISTS (SELECT 1 FROM sys.objects WHERE object_id = OBJECT_ID(N'[dbo].[ggplot]')\
  \ AND [type] IN (N'U')) BEGIN alter TABLE [dbo].ggplot NULL ); END\n```\n\n然后，通过插入以下命令将绘图输入到表中：\n\
  \n```\ninsert into [dbo].[ggplot] exec sp_execute_external_script @language =N'R',\
  \ @script=N'library(\"ggplot2\") fields<-inputDataSet fields<-na.omit(fields) image_file\
  \ = tempfile(); jpeg(filename = image_file, width=1000, height=1000); print(ggplot(fields,aes(x=fields$TaxAmt,y=fields$TaxAmt))+geom_boxplot()+facet_grid(fields$Color~.)\
  \ ) dev.off(); OutputDataset <- data.frame(data=readBin(file(image_file,\"rb\"),what=raw(),n=1e6))\
  \ ', @input_data_1 =N'select Color,Size,class,TaxAmt,SalesAmount from [dbo].[FactInternetSales]\
  \ FIS inner join [dbo].[DimProduct] DP on FIS.ProductKey=dp.ProductKey' ,@input_data_1_name\
  \ = N'inputDataSet' ,@output_data_1_name = N'OutputDataset'\n```\n\n现在，我们已经在数据库中创建并存储了一个图表。\n\
  \n### 在 SSRS 中显示图表\n\n要在 SQL Server 数据工具中显示图表，我们必须创建一个新的 SSRS 项目（图 9-13）。\n\n![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig13_HTML.jpg](img/463840_1_En_9_Fig13_HTML.jpg)\n\
  \n图 9-13\n\n在 SQL Server 数据工具中创建 SSRS 项目\n\n接下来，我们按照创建 SSRS 报表所需的步骤进行操作（图 9-14）。\n\
  \n![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig14_HTML.jpg](img/463840_1_En_9_Fig14_HTML.jpg)\n\
  \n图 9-14\n\n使用数据工具创建 SSRS 项目\n\n然后必须创建一个查询，从 ggplot 表中获取绘图（图 9-15）。\n\n![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig15_HTML.jpg](img/463840_1_En_9_Fig15_HTML.jpg)\n\
  \n图 9-15\n\n在 SSRS 中从 SQL Server 表获取数据\n\n接下来，我们必须将图像插入到报表区域，并查看预览选项卡（图 9-16）以检查图表。\n\
  \n![../images/463840_1_En_9_Chapter/463840_1_En_9_Fig16_HTML.jpg](img/463840_1_En_9_Fig16_HTML.jpg)\n\
  \n图 9-16\n\nSSRS 中的箱线图\n\n## 总结\n\n本章简要说明了如何在 SQL Server 2016 和 2017 中运行 R 脚本。它概述了如何通过外部脚本和存储过程运行必要的代码。此外，还讨论了如何使用\
  \ RevoScaleR 和 Azure ML 等包来访问额外的机器学习和 R 服务。此外，通过一个示例解释了如何进行预测分析的过程。下一章将概述如何在 Azure\
  \ Databricks 中进行机器学习。\n\n\n\n"
- '# 10. Azure Databricks


  Databricks 是一项基于 Apache Spark 开源项目的分析服务。Apache Spark 是一个批处理和实时处理环境。Apache Spark
  因其能够分析海量数据、具备流处理能力、图计算、机器学习以及交互式查询引擎，而在数据科学家中颇受欢迎。Spark 提供内存集群计算。Databricks 是 Spark
  上用于大数据分析的流行工具之一。Databricks 已被用于摄取大量数据、清洗数据、应用机器学习等场景。2018 年 2 月，Microsoft Azure
  与 Databricks 进行了集成，为数据工程师、数据科学家和数据分析师提供了更好的协作。此次集成为数据科学和数据工程团队在 Azure 中提供了一个快速、简单且基于
  Spark 的协作平台 [1]。Azure Databricks 是一个用于大数据分析和机器学习的新平台。Azure Databricks 中的笔记本使数据工程师、数据科学家和业务分析师能够使用单一工具进行协作。本章概述了
  Azure Databricks 是什么、它所处的环境及其在数据科学中的应用。


  ## Databricks 环境


  要在 Azure 环境中创建 Azure Databricks，请登录你的一个 Azure 账户。然后，创建一个 Azure Databricks 模块（图 10-1）。


  ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig1_HTML.jpg](img/463840_1_En_10_Fig1_HTML.jpg)


  图 10-1


  Azure Databricks 环境


  创建 Azure Databricks 模块后，Azure 将导航到一个新页面。要访问 Azure Databricks，请单击“启动工作区”（图 10-2）。


  ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig2_HTML.jpg](img/463840_1_En_10_Fig2_HTML.jpg)


  图 10-2


  启动工作区


  如图 10-3 所示，Azure Databricks 环境包含不同的组件。主要组件是工作区和集群。启动后的第一步是创建一个集群。Databricks 中的集群为
  ETL（提取、转换、加载）、流分析和机器学习提供了一个统一平台。集群分为两种类型：交互式集群和作业集群。笔记本集群用于协作分析数据。而作业集群则用于使用 API
  快速、稳健地运行自动化工作负载。集群页面可能包含这两种集群类型。每个集群可以有不同的节点。首先，你必须创建一个集群。单击“创建集群”选项（图 10-3）。


  ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig3_HTML.jpg](img/463840_1_En_10_Fig3_HTML.jpg)


  图 10-3


  在 Databricks 中创建集群


  在“创建集群”页面（图 10-4）上，输入相关信息，例如集群名称、版本（默认）、Python 版本、最小和最大工作节点数等。


  ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig4_HTML.jpg](img/463840_1_En_10_Fig4_HTML.jpg)


  图 10-4


  Azure Databricks 中的“创建集群”页面


  如图 10-4 所示，我们有一个驱动节点和一个工作节点。工作节点用于分配你的工作负载。驱动节点负责维护 SparkContext。可以自动调整和自动缩放集群的大小。通过启用自动缩放，可以在集群的生命周期内限制最小和最大工作节点数。


  要使用集群，你应该等待状态变为“正在运行”（图 10-5）。通过创建交互式集群，你可以创建一个笔记本，在其中编写代码并快速获取结果。


  ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig5_HTML.jpg](img/463840_1_En_10_Fig5_HTML.jpg)


  图 10-5


  正在运行的集群


  要创建笔记本，请单击“工作区”选项并创建一个新笔记本（图 10-6）。


  ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig6_HTML.jpg](img/463840_1_En_10_Fig6_HTML.jpg)


  图 10-6


  在 Databricks 中创建笔记本


  通过创建新笔记本，你可以指定该笔记本属于哪个集群，以及笔记本的主要语言（Python、Scala、R 和 SQL）是什么。在此示例中，R 语言已被选为默认语言。但是，你仍然可以在笔记本中使用其他语言编写，方法是在脚本前写入
  `%scala`、`%python`、`%sql` 或 `%r`（图 10-7）。


  ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig7_HTML.jpg](img/463840_1_En_10_Fig7_HTML.jpg)


  图 10-7


  在 Databricks 中创建 R 笔记本




  默认情况下，笔记本中有一个用于编写代码的区域。如图 10-8 所示，有一个名为 Cmd1 的编辑器节点，您可以在其中编写代码并一次性运行所有代码。在我们的示例中，只有一个节点，编写代码的主要语言是
  R。此外，我们通过编写以下代码，使用了 `gpplot2` 包中名为 `mpg` 的现有数据集：


  ```

  library(ggplot2)

  display(mpg)

  ```


  `display` 命令用于在 Databricks 中显示数据集。要运行代码，请点击节点右侧的箭头，然后选择“运行单元格”（图 10-8）。


  ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig8_HTML.jpg](img/463840_1_En_10_Fig8_HTML.jpg)


  图 10-8


  在 Databricks 中编写 R 笔记本


  运行代码后，结果将以表格形式显示在单元格末尾。如图 10-9 所示，初始结果以表格形式呈现；不过，也可以将结果显示为与其他图表相同的格式。


  ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig9_HTML.jpg](img/463840_1_En_10_Fig9_HTML.jpg)


  图 10-9


  运行 R 代码


  要显示图表，您必须点击单元格底部的图表图标（图 10-10）。


  ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig10_HTML.jpg](img/463840_1_En_10_Fig10_HTML.jpg)


  图 10-10


  在 Databricks 中显示图表


  您可以通过点击“绘图选项”来更改要在图表中显示的项目（图 10-11）。


  ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig11_HTML.jpg](img/463840_1_En_10_Fig11_HTML.jpg)


  图 10-11


  Databricks 中的图表选项


  可以创建新的单元格来编写更多 R 或 Scala 代码。在我们的示例中，我们必须将一个名为 Titanic 的数据集上传到 Azure Databricks。


  要导入数据，请点击窗口左侧的“数据”选项（图 10-12），然后点击“添加数据”。这将导航到一个新页面（图 10-12）。然后点击“上传文件”。只需浏览并上传
  `titanic` 文件。如果您需要此文件，可以从 [`www.kaggle.com/c/titanic`](http://www.kaggle.com/c/titanic)
  获取。


  ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig12_HTML.jpg](img/463840_1_En_10_Fig12_HTML.jpg)


  图 10-12


  使用“数据”选项导入数据


  如图 10-13 所示，我们必须使用用户界面 (UI) 创建一个表，并选择要上传到的相关集群。


  ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig13_HTML.jpg](img/463840_1_En_10_Fig13_HTML.jpg)


  图 10-13


  将数据导入 Azure Databricks


  我们现在创建一个新的工作区，命名为


  ```

  val titanic = spark.table("titanic")

  display(titanic.select("∗"))

  ```


  为了处理 Titanic 数据集，我们只需要选择 Survived、Sex、Age 和 PClass 列（见图 10-14）。


  ![../images/463840_1_En_10_Chapter/463840_1_En_10_Fig14_HTML.jpg](img/463840_1_En_10_Fig14_HTML.jpg)


  图 10-14


  运行 Scala 语言从 Azure Data Lake Store 获取数据


  ```

  val specificColumnsDf = titanic.select("Survived", "Pclass", "Sex", "Age")

  val renamedColumnsDF = specificColumnsDf.withColumnRenamed("Sex", "Gender")

  display(renamedColumnsDF)

  ```


  现在，出于机器学习的目的，我们将预测特定年龄、性别和乘客等级的新乘客是否幸存。为此，我们必须在另一个单元格中对该数据运行 R 代码，以创建一个模型并预测特定年龄、性别和乘客等级的乘客是否幸存。我们必须将数据从
  Scala 传递到 R。为此，我们必须创建一个临时表，将该表提供给 R 代码，使用以下代码：


  ```

  renamedColumnsDF.createOrReplaceTempView("TempTable")

  ```


  我们通过点击最新单元格下方的加号来添加一个新单元格。在新单元格中，我们必须编写 R 代码。因此，我们必须通过在代码开头放置 `%r` 来指明语言。此外，我们使用了
  SparkR 中的一些包，因此我们使用 `SQL` 函数从上一个 Scala 单元格中获取数据。最后，我们将数据存储在一个 `dataset` 变量中。


  ```

  %r

  library(SparkR)

  sql("REFRESH TABLE TempTable")

  df <- sql("SELECT ∗ FROM TempTable")

  dataset<-as.data.frame(df)

  display(df)

  ```


  在同一个单元格或新单元格中，您可以编写一些用于机器学习的代码。在我们的示例中，我们旨在检查特定乘客等级、年龄和性别的乘客是否幸存。*rpart* 包可用于创建决策树。该包帮助我们预测生存概率。


  ```

  %r

  library(SparkR)

  sql("REFRESH TABLE TempTable")

  df <- sql("SELECT ∗ FROM TempTable")

  dataset<-as.data.frame(df)

  library(rpart)

  DT<-rpart(Survived~.,data=dataset,method="class")

  test<-dataset[,2:4]

  Prediction<-predict(DT,test)

  output<-data.frame(test,Prediction)

  display(output)

  ```


  运行该单元格后，将显示输出（图 10-15）。


