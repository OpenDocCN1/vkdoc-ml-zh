  本章旨在介绍神经网络及相关深度学习概念。随后讨论了如何在 DSVM 上设置和运行 CNTK。接着对神经网络相关概念、其结构等进行了详细阐述。然后介绍了如何在 Windows
  上为 Python 语言设置 CNTK。最后，简要说明了如何使用 CNTK 库进行预测。


