  ## 使用 R 脚本进行数据转换


  并非所有数据转换都能通过 Power Query 中的现有菜单轻松完成。为了提升数据转换能力，我们可以在 Power Query 内部使用 R 语言。Kaggle
  网站（[`https://www.kaggle.com/lbronchal/breast-cancer-dataset-analysis`](https://www.kaggle.com/lbronchal/breast-cancer-dataset-analysis)）上有一个关于女性乳腺癌的数据集。该数据集包含
  569 行和 32 列。第一列是患者 ID，第二列是诊断结果。其余列与癌细胞的规格相关。


  第 2 列到第 32 列包含一些数值，但这些数值不在同一范围内。例如，“radius_mean”列的值范围是 6.9 到 22，而“compactness_mean”列的值范围是
  0.019 到 0.34。还有另一种数据准备过程，称为归一化，用于将数据统一到同一尺度。这个过程对某些算法（如 lKNN）很有用；但并非总是推荐使用（见图 6-22）。


  ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig22_HTML.jpg](img/463840_1_En_6_Fig22_HTML.jpg)


  图 6-22


  与女性乳腺癌相关的数据集


  ### 归一化


  数据归一化意味着将数据调整到特定范围内，例如 0 到 1。我将使用一种遵循“MinMax”方法的公式来归一化名称。在此示例中，我将把癌症数据集中所有列的数据（患者
  ID 和诊断列除外，因为它们包含文本）调整到 0 到 1 的范围内。


  首先，对于每一列，我们必须找到最小值和最大值。对于每个值，我们必须按如下公式进行计算：


  ![$$ Normalize\ value=\left(\frac{\min (x)-x}{\max (x)-\min (x)}\right) $$](img/463840_1_En_6_Chapter_TeX_Equa.png)


  我们可以使用 Power Query 中的 R 语言将此转换应用于数据。


  在 Power Query 中，有一个用于编写 R 代码的选项：运行 R 脚本（图 6-23）。


  ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig23_HTML.jpg](img/463840_1_En_6_Fig23_HTML.jpg)


  图 6-23


  在 Power Query 中运行 R 脚本


  “运行 R 脚本”编辑器并非十分高级。您想要转换的数据存储在变量名 `dataset` 下。


  因此，我们将使用 `dataset` 变量和归一化数据的公式。


  在 R 中，我将编写一个函数来放置 MinMax 公式。


  ```

  Normalize<- function (x)

  {

  return ((x-min(x))/(max(x)-min(x)))

  }

  ```


  然后，我必须将此函数应用于数据集。为此，我必须使用 R 中的另一个函数，名为 `lapply`。


  `lapply` 函数接收数据集和归一化函数的名称。然后，它将函数应用于数据集。在我的示例中，您不需要对第一列和第二列应用 MinMax 归一化，因此只需使用
  `dataset[3:32]` 而不是 `dataset`。


  ```

  NormalizedData<-as.data.frame(lapply(dataset[3:32],Normalize))

  ```


  如图 6-24 所示，编写代码后，我们需要按下“确定”按钮。Power Query 将对数据应用归一化转换。


  ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig24_HTML.jpg](img/463840_1_En_6_Fig24_HTML.jpg)


  图 6-24


  R 脚本编辑器


  运行代码后，数据转换的结果如图 6-25 所示。您可以在“运行 R 脚本”中看到已应用的步骤。


  ![../images/463840_1_En_6_Chapter/463840_1_En_6_Fig25_HTML.jpg](img/463840_1_En_6_Fig25_HTML.jpg)


  图 6-25


