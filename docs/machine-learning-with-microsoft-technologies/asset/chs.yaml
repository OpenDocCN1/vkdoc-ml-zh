  ## 智能应用：面部识别服务


  认知服务的另一个功能是人脸（面部识别）API。该 API 除了能检测情绪以及找出两张图片中人脸的相似面部特征外，还能从图像中执行人脸检测。


  在应用程序中使用人脸 API 之前，可以先试用一下。要查看演示，请导航至认知服务网站，然后进入视觉类别（图 18-16）。在视觉类别下，点击“图像中的情绪识别”演示。要测试该
  API，请浏览并选择一张图片，然后提交。上传图片后，点击“提交”按钮。


