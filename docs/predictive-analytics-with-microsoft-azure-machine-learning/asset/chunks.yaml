    \ 表。\n*   **写入器**：此模块用于将数据写入 Azure SQL 数据库、Azure Blob 存储或 Hadoop 分布式文件系统 (HDFS)。\n\
    *   **移动平均筛选器**：为给定数据集创建移动平均值。\n*   **联接**：此模块基于用户指定的键联接两个数据集。它对两个数据集执行内联接、左外联接、完全外联接和左半联接。\n\
    *   **拆分**：此模块将一个数据集拆分为两部分。它通常用于将数据集拆分为独立的训练数据集和测试数据集。\n*   **基于筛选器的特征选择**：此模块用于查找建模中最重要的变量。它使用七种不同的技术（例如，斯皮尔曼相关系数、皮尔逊相关系数、互信息、卡方检验等）从原始数据中对最重要的变量进行排序。\n\
    *   **基础统计**：计算给定数据集的基础统计信息，例如平均值、标准差等。\n*   **线性回归**：可用于使用线性回归算法创建预测模型。\n*  \
    \ **训练模型**：此模块使用给定的训练数据集训练选定的分类或回归算法。\n*   **扫描参数**：对于给定的学习算法以及训练和验证数据集，此模块会查找能产生最佳训练模型的参数。\n\
    *   **评估模型**：此模块用于评估已训练的分类或回归模型的性能。\n*   **交叉验证模型**：此模块用于执行交叉验证以避免过拟合。默认情况下，此模块使用\
    \ 10 折交叉验证。\n*   **为模型评分**：为已训练的分类或回归模型评分。\n\n所有可用的模块都组织在图 2-1 所示的菜单下。每个模块都提供一组参数，您可以使用这些参数来微调该模块所用算法的行为。当选中一个模块时，您将在画布的右侧窗格中看到该模块的参数。\n\
    \n创建实验的五个简单步骤\n\n在本节中，您将学习如何使用 Azure Machine Learning Studio 开发一个简单的预测分析模型。要设计一个实验，您需要组装一组用于创建、训练、测试和评估模型的组件。此外，您还可以利用其他模块来预处理数据、执行特征选择和/或降维、将数据拆分为训练集和测试集，以及评估或交叉验证模型。以下五个基本步骤可作为创建实验的指南。\n\
    \n***创建模型***\n\n*   步骤 1：获取数据\n*   步骤 2：预处理数据\n*   步骤 3：定义特征\n\n***训练模型***\n\n\
    *   步骤 4：选择并应用学习算法\n\n***测试模型***\n\n*   步骤 5：对新数据进行预测\n\n步骤 1：获取数据\n\nAzure Machine\
    \ Learning Studio 提供了许多示例数据集。此外，您还可以从许多不同的源导入数据。在此示例中，您将使用名为**汽车价格数据（原始）**的包含示例数据集，该数据集代表汽车价格数据。\n\
    \n1.  要开始一个新实验，请单击 Machine Learning Studio 窗口底部的 **+新建**，然后选择**实验**。\n2.  将实验重命名为“第\
    \ 02 章 – Hello ML”。\n3.  在 Machine Learning Studio 的左侧，您将看到实验项目列表（参见图 2-1）。单击**已保存的数据集**，然后在搜索框中键入“automobile”。找到**汽车价格数据（原始）**。\n\
    \n![9781484204467_Fig02-01.jpg](img/00016.jpeg)\n\n图 2-1。调色板搜索\n\n4.  将数据集拖入实验。您也可以双击数据集以将其包含在实验中（参见图\
    \ 2-2）。\n\n![9781484204467_Fig02-02.jpg](img/00017.jpeg)\n\n图 2-2。使用数据集\n\n通过单击数据集的输出端口，您可以选择**可视化**，这将允许您探索数据并了解每个列的关键统计信息（参见图\
    \ 2-3）。\n\n![9781484204467_Fig02-03.jpg](img/00018.jpeg)\n\n图 2-3。数据集可视化\n\n通过单击右上角的\
    \ **x** 关闭可视化窗口。\n\n步骤 2：预处理数据\n\n在开始设计实验之前，预处理数据集非常重要。在大多数情况下，原始数据需要经过预处理才能用作训练预测分析模型的输入。\n\
    \n从之前的探索中，您可能已经注意到数据中存在缺失值。作为分析数据的先决条件，需要清理这些缺失值。对于此实验，您将用指定的值替换缺失值。此外，将删除 normalized-losses\
    \ 列，因为该列包含太多缺失值。\n\n![Image](img/00013.jpeg) **提示**  清理输入数据中的缺失值是使用大多数模块的先决条件。\n\
    \n1.  要删除 normalized-losses 列，请拖动**投影列**模块，并将其连接到**汽车价格数据（原始）**数据集的输出端口。此模块允许您选择要在模型中包含或排除哪些数据列。\n\
    2.  选择**投影列**模块，然后在属性窗格（即右侧窗格）中单击**启动列选择器**。\n\n1.  确保在名为**起始于**的筛选器下拉菜单中选择了**所有列**。这将指示投影列传递所有列（除了您即将排除的列）。\n\
    \    2.  在下一行中，选择**排除**和**列名**，然后在文本框内单击。将显示一个列列表；选择“normalized-losses”，它将被添加到文本框中。如图\
    \ 2-4 所示。\n    3.  单击复选标记确定按钮关闭列选择器。\n\n![9781484204467_Fig02-04.jpg](img/00019.jpeg)\n\
    \n图 2-4。选择列\n\n除 normalized-losses 列外，所有列都将通过。您可以在**投影列**的属性窗格中看到这一点。如图 2-5 所示。\n\
    \n![9781484204467_Fig02-05.jpg](img/00020.jpeg)\n\n图 2-5。投影列属性\n\n![Image](img/00013.jpeg) **提示**  在设计实验时，您可以通过双击模块并输入文本来向模块添加注释。这使其他人能够理解实验中每个模块的用途，并可以帮助您记录实验设计。\n\
    \n3.  将**缺失值清理器**模块拖到实验画布上，并将其连接到**投影列**模块。您将使用默认属性，该属性将缺失值替换为 0。详细信息请参见图 2-6。\n\
    \n![9781484204467_Fig02-06.jpg](img/00021.jpeg)\n\n图 2-6。缺失值清理器属性\n\n4.  现在单击**运行**。\n\
    5.  当实验成功完成时，每个模块都会有一个绿色的复选标记，表示其成功完成（参见图 2-7）。\n\n![9781484204467_Fig02-07.jpg](img/00022.jpeg)\n\
    \n图 2-7。首次实验运行\n\n此时，您已经通过清理和转换数据预处理了数据集。要查看清理后的数据集，请双击**缺失值清理器**模块的输出端口，然后选择**可视化**。请注意，normalized-losses\
    \ 列不再包含在内，并且没有缺失值。\n\n步骤 3：定义特征\n"
- fmt: "在机器学习中，特征是源自原始数据的单个可测量属性，用于帮助算法学习当前任务。理解每个特征所扮演的角色非常重要。例如，某些特征在预测目标方面比其他特征更有效。此外，某些特征可能与其他特征存在强相关性（例如，`city-mpg`与`highway-mpg`）。将高度相关的特征作为输入可能没有用处，因为它们包含相似的信息。\n\
    \n在本练习中，您将构建一个预测模型，该模型使用**Automobile price data (Raw)**数据集的一个特征子集来预测新汽车的价格。每一行代表一辆汽车，每一列是该汽车的一个特征。识别可用于创建预测模型的一组良好特征非常重要。这通常需要实验和对问题领域的了解。出于说明目的，您将使用`Project\
    \ Columns`模块选择以下特征：`make`、`body-style`、`wheel-base`、`engine-size`、`horsepower`、`peak-rpm`、`highway-mpg`和`price`。\n\
    \n1.  将`Project Columns`模块拖到实验画布上。将其连接到`Missing Values Scrubber`模块。\n2.  在属性窗格中单击**Launch\
    \ column selector**。\n3.  在列选择器中，对于**Begin With**选择**No columns**，然后在筛选行中选择**Include**和**column\
    \ names**。输入以下列名：`make`、`body-style`、`wheel-base`、`engine-size`、`horsepower`、`peak-rpm`、`highway-mpg`和`price`。这将指示模块仅传递这些列。\n\
    4.  单击**OK**。\n\n![Image](images/00013.jpeg) **提示** 在构建实验时，您将运行它。通过运行实验，您可以使数据的列定义能够在`Missing\
    \ Values Scrubber`模块中使用。\n\n当您将`Project Columns`连接到`Missing Values Scrubber`时，`Project\
    \ Columns`模块会感知到数据中的列定义。当您单击列名框时，会显示一个列列表，然后您可以一次选择一个要添加到列表中的列。\n\n![9781484204467_Fig02-08.jpg](images/00023.jpeg)\n\
    \n[Figure 2-8](#part0010.html#_Fig8). 选择列\n\n[Figure 2-8](#part0010.html#Fig8)显示了`Project\
    \ Columns`模块中选定列的列表。当您训练预测模型时，需要提供目标变量。这是模型将要预测的特征。在本练习中，您将根据汽车的几个关键特征（例如`horsepower`、`make`等）预测汽车的价格。\n\
    \n**步骤 4：选择并应用机器学习算法**\n\n在构建预测模型时，您首先需要训练模型，然后验证模型是否有效。在本实验中，您将构建一个回归模型。\n\n\
    ![Image](images/00013.jpeg) **提示** 分类和回归是两种常见的预测模型类型。在分类中，目标是预测给定数据行是否属于某个类别（例如，客户是否会流失？此信用卡交易是否欺诈？）。在回归中，目标是预测一个连续结果（例如，汽车的价格或明天的温度）。\n\
    \n在本实验中，您将训练一个回归模型，并用它来预测汽车的价格。具体来说，您将训练一个简单的*线性回归*模型。模型训练完成后，您将使用Machine Learning\
    \ Studio中可用的某些模块来验证模型。\n\n1.  **将数据拆分为训练集和测试集**：选择`Split`模块并将其拖到实验画布上，然后将其连接到最后一个`Project\
    \ Columns`模块的输出。将**Fraction of rows in the first output dataset**设置为`0.8`。这样，您将使用80%的数据来训练模型，并保留20%用于测试。\n\
    \n![Image](images/00013.jpeg) **提示** 通过更改**Random seed**参数，您可以生成不同的随机样本用于训练和测试。此参数控制`Split`模块中伪随机数生成器的种子设定。\n\
    \n2.  运行实验。这允许`Project Columns`和`Split`模块将列定义传递给您接下来要添加的模块。\n3.  要选择学习算法，请展开画布左侧模块面板中的**Machine\
    \ Learning**类别，然后展开**Initialize Model**。这将显示几个可用于初始化学习算法的模块类别。\n4.  对于此示例实验，请在**Regression**类别下选择`Linear\
    \ Regression`模块，并将其拖到实验画布上。\n5.  找到`Train Model`模块并将其拖到实验中。单击**Launch column selector**并选择`price`列。这是您的模型将要预测的特征。[Figure\
    \ 2-9](#part0010.html#Fig9)显示了此目标选择。\n\n![9781484204467_Fig02-09.jpg](images/00024.jpeg)\n\
    \n[Figure 2-9](#part0010.html#_Fig9). 选择`price`列\n\n6.  将`Linear Regression`模块的输出连接到`Train\
    \ Model`模块的左侧输入端口。\n7.  同时，将`Split`模块的训练数据输出（即左侧端口）连接到`Train Model`模块的右侧输入端口。\n\
    8.  运行实验。\n\n结果是一个训练好的回归模型，可用于对新样本进行评分以做出预测。[Figure 2-10](#part0010.html#Fig10)显示了截至步骤7的实验。\n\
    \n![9781484204467_Fig02-10.jpg](images/00025.jpeg)\n\n[Figure 2-10](#part0010.html#_Fig10).\
    \ 应用学习算法\n\n**步骤 5：对新数据进行预测**\n\n现在您已经训练好了模型，可以使用它对另外20%的数据进行评分，并查看模型在未见数据上的预测效果。\n\
    \n1.  找到`Score Model`模块并将其拖到实验画布上，将其左侧输入端口连接到`Train Model`模块的输出，右侧输入端口连接到`Split`模块的测试数据输出（右侧端口）。详情请参见[Figure\
    \ 2-11](#part0010.html#Fig11)。\n\n![9781484204467_Fig02-11.jpg](images/00026.jpeg)\n\
    \n[Figure 2-11](#part0010.html#_Fig11). `Score Model`模块\n\n2.  运行实验并查看`Score Model`模块的输出（通过双击输出端口并选择**Visualize**）。输出将显示`price`的预测值以及来自测试数据的已知值。\n\
    3.  最后，要测试结果的质量，请选择`Evaluate Model`模块并将其拖到实验画布上，将其左侧输入端口连接到`Score Model`模块的输出（有两个输入端口，因为`Evaluate\
    \ Model`模块可用于比较两个不同的模型）。\n4.  运行实验并查看`Evaluate Model`模块的输出（双击输出端口并选择**Visualize**）。您的模型将显示以下统计信息：\n\
    \    1.  **Mean Absolute Error** (MAE)：绝对误差的平均值（*误差*是预测值与实际值之间的差值）。\n    2.  **Root\
    \ Mean Squared Error** (RMSE)：均方误差的平方根。\n    3.  **Relative Absolute Error**：绝对误差相对于所有实际值的平均值与实际值之间绝对差值的平均值。\n\
    \    4.  **Relative Squared Error**：均方误差相对于所有实际值的平均值与实际值之间平方差值的平均值。\n    5.  **Coefficient\
    \ of Determination**：也称为R平方值，这是一个统计指标，指示模型对数据的拟合程度。"
  raw: "In machine learning, features are individual measurable properties created\
    \ from the raw data to help the algorithms to learn the task at hand. Understanding\
    \ the role played by each feature is super important. For example, some features\
    \ are better at predicting the target than others. In addition, some features\
    \ can have a strong correlation with other features (e.g. city-mpg vs. highway-mpg).\
    \ Adding highly correlated features as inputs might not be useful, since they\
    \ contain similar information.\n\nFor this exercise, you will build a predictive\
    \ model that uses a subset of the features of the **Automobile price data (Raw)**\
    \ dataset to predict the price for new automobiles. Each row represents an automobile.\
    \ Each column is a feature of that automobile. It is important to identify a good\
    \ set of features that can be used to create the predictive model. Often, this\
    \ requires experimentation and knowledge about the problem domain. For illustration\
    \ purpose, you will use the **Project Columns** module to select the following\
    \ features: make, body-style, wheel-base, engine-size, horsepower, peak-rpm, highway-mpg,\
    \ and price.\n\n1.  Drag the **Project Columns** module to the experiment canvas.\
    \ Connect it to the **Missing Values Scrubber** module.\n2.  Click **Launch column\
    \ selector** in the properties pane.\n3.  In the column selector, select **No\
    \ columns** for **Begin With**, then select **Include** and **column names** in\
    \ the filter row. Enter the following column names: make, body-style, wheel-base,\
    \ engine-size, horsepower, peak-rpm, highway-mpg, and price. This directs the\
    \ module to pass through only these columns.\n4.  Click **OK**.\n\n![Image](images/00013.jpeg) **Tip**  As\
    \ you build the experiment, you will run it. By running the experiment, you enable\
    \ the column definitions of the data to be used in the **Missing Values Scrubber**\
    \ module.\n\nWhen you connect **Project Columns** to **Missing Values Scrubber**,\
    \ the **Project Columns** module becomes aware of the column definitions in your\
    \ data. When you click the column names box, a list of columns is displayed and\
    \ you can then select the columns, one at a time, that you wish to add to the\
    \ list.\n\n![9781484204467_Fig02-08.jpg](images/00023.jpeg)\n\n[Figure 2-8](#part0010.html#_Fig8).\
    \ Select columns\n\n[Figure 2-8](#part0010.html#Fig8) shows the list of selected\
    \ columns in the **Project Columns** module. When you train the predictive model,\
    \ you need to provide the target variable. This is the feature that will be predicted\
    \ by the model. For this exercise, you are predicting the price of an automobile,\
    \ based on several key features of an automobile (e.g. horsepower, make, etc.)\n\
    \nStep 4: Choose and Apply Machine Learning Algorithms\n\nWhen constructing a\
    \ predictive model, you first need to train the model, and then validate that\
    \ the model is effective. In this experiment, you will build a regression model.\n\
    \n![Image](images/00013.jpeg) **Tip**  Classification and regression are two common\
    \ types of predictive models. In classification, the goal is to predict if a given\
    \ data row belongs to one of several classes (e.g. will a customer churn or not?\
    \ Is this credit transaction fraudulent?). With regression, the goal is to predict\
    \ a continuous outcome (e.g. the price of an automobile or tomorrow’s temperature).\n\
    \nIn this experiment, you will train a regression model and use it to predict\
    \ the price of an automobile. Specifically, you will train a simple *linear regression*\
    \ model. After the model has been trained, you will use some of the modules available\
    \ in Machine Learning Studio to validate the model.\n\n1.  **Split the data into\
    \ training and testing sets**: Select and drag the **Split** module to the experiment\
    \ canvas and connect it to the output of the last **Project Columns** module.\
    \ Set **Fraction of rows in the first output dataset** to 0.8\\. This way, you\
    \ will use 80% of the data to train the model and hold back 20% for testing.\n\
    \n![Image](images/00013.jpeg) **Tip**  By changing the Random seed parameter,\
    \ you can produce different random samples for training and testing. This parameter\
    \ controls the seeding of the pseudo-random number generator in the **Split**\
    \ module.\n\n2.  Run the experiment. This allows the **Project Columns** and **Split**\
    \ modules to pass along column definitions to the modules you will be adding next.\n\
    3.  To select the learning algorithm, expand the **Machine Learning** category\
    \ in the module palette to the left of the canvas and then expand **Initialize\
    \ Model**. This displays several categories of modules that can be used to initialize\
    \ a learning algorithm.\n4.  For this example experiment, select the **Linear\
    \ Regression** module under the **Regression** category and drag it to the experiment\
    \ canvas.\n5.  Find and drag the **Train Model** module to the experiment. Click\
    \ **Launch column selector** and select the price column. This is the feature\
    \ that your model is going to predict. [Figure 2-9](#part0010.html#Fig9) shows\
    \ this target selection.\n\n![9781484204467_Fig02-09.jpg](images/00024.jpeg)\n\
    \n[Figure 2-9](#part0010.html#_Fig9). Select the price column\n\n6.  Connect the\
    \ output of the **Linear Regression** module to the left input port of the **Train\
    \ Model** module.\n7.  Also, connect the training data output (i.e. the left port)\
    \ of the **Split** module to the right input port of the **Train Model** module.\n\
    8.  Run the experiment.\n\nThe result is a trained regression model that can be\
    \ used to score new samples to make predictions. [Figure 2-10](#part0010.html#Fig10)\
    \ shows the experiment up to Step 7.\n\n![9781484204467_Fig02-10.jpg](images/00025.jpeg)\n\
    \n[Figure 2-10](#part0010.html#_Fig10). Applying the learning algorithm\n\nStep\
    \ 5: Predict Over New Data\n\nNow that you’ve trained the model, you can use it\
    \ to score the other 20% of your data and see how well your model predicts on\
    \ unseen data.\n\n1.  Find and drag the **Score Model** module to the experiment\
    \ canvas and connect the left input port to the output of the **Train Model**\
    \ module, and the right input port to the test data output (right port) of the\
    \ **Split** module. See [Figure 2-11](#part0010.html#Fig11) for details.\n\n![9781484204467_Fig02-11.jpg](images/00026.jpeg)\n\
    \n[Figure 2-11](#part0010.html#_Fig11). Score Model module\n\n2.  Run the experiment\
    \ and view the output from the **Score Model** module (by double-clicking the\
    \ output port and selecting **Visualize**). The output will show the predicted\
    \ values for price along with the known values from the test data.\n3.  Finally,\
    \ to test the quality of the results, select and drag the **Evaluate Model** module\
    \ to the experiment canvas, and connect the left input port to the output of the\
    \ **Score Model** module (there are two input ports because the **Evaluate Model**\
    \ module can be used to compare two different models).\n4.  Run the experiment\
    \ and view the output from the **Evaluate Model** module (double-click the output\
    \ port and select **Visualize**). The following statistics are shown for your\
    \ model:\n    1.  **Mean Absolute Error** (MAE): The average of absolute errors\
    \ (an *error* is the difference between the predicted value and the actual value).\n\
    \    2.  **Root Mean Squared Error** (RMSE): The square root of the average of\
    \ squared errors.\n    3.  **Relative Absolute Error**: The average of absolute\
    \ errors relative to the absolute difference between actual values and the average\
    \ of all actual values.\n    4.  **Relative Squared Error**: The average of squared\
    \ errors relative to the squared difference between the actual values and the\
    \ average of all actual values.\n    5.  **Coefficient of Determination**: Also\
    \ known as the R squared value, this is a statistical metric indicating how well\
    \ a model fits the data."
  trans: "\n在机器学习中，特征是依据原始数据创建的独立可测量属性，用于帮助算法学习当前任务。理解每个特征所扮演的角色至关重要。例如，某些特征比其他特征更能预测目标变量。此外，有些特征可能与其他特征存在强相关性（例如城市油耗与高速公路油耗）。将高度相关的特征作为输入可能并无益处，因为它们包含相似的信息。\n\
    \n在本练习中，你将构建一个预测模型，使用**汽车价格数据（原始）**数据集中的部分特征来预测新汽车的价格。每一行代表一辆汽车，每一列是该汽车的一个特征。识别出一组可用于构建预测模型的优质特征非常重要。这通常需要实验和对问题领域的了解。出于演示目的，你将使用**项目列**模块选择以下特征：制造商、车身样式、轴距、发动机尺寸、马力、最高转速、高速公路油耗和价格。\n\
    \n1.  将**项目列**模块拖到实验画布上。将其连接到**缺失值清理器**模块。\n2.  在属性窗格中，单击**启动列选择器**。\n3.  在列选择器中，将**起始于**设置为**无列**，然后在筛选行中选择**包含**和**列名**。输入以下列名：制造商、车身样式、轴距、发动机尺寸、马力、最高转速、高速公路油耗和价格。这将指示模块仅传递这些列。\n\
    4.  单击**确定**。\n\n![Image](img/00013.jpeg) **提示**  在构建实验时，你将运行它。通过运行实验，你可以启用**缺失值清理器**模块中使用的数据列定义。\n\
    \n当你将**项目列**连接到**缺失值清理器**时，**项目列**模块会识别数据中的列定义。当你单击列名框时，会显示一个列列表，然后你可以一次选择一列，将其添加到列表中。\n\
    \n![9781484204467_Fig02-08.jpg](img/00023.jpeg)\n\n图 2-8. 选择列\n\n图 2-8 显示了**项目列**模块中选定的列列表。当你训练预测模型时，需要提供目标变量。这是模型将要预测的特征。在本练习中，你将根据汽车的几个关键特征（例如马力、制造商等）来预测汽车价格。\n\
    \n步骤 4：选择并应用机器学习算法\n\n构建预测模型时，首先需要训练模型，然后验证模型是否有效。在本实验中，你将构建一个回归模型。\n\n![Image](img/00013.jpeg) **提示**  分类和回归是两种常见的预测模型类型。在分类中，目标是预测给定数据行是否属于某个类别（例如，客户是否会流失？这笔信用卡交易是否欺诈？）。在回归中，目标是预测一个连续结果（例如，汽车价格或明天的温度）。\n\
    \n在本实验中，你将训练一个回归模型，并用它来预测汽车价格。具体来说，你将训练一个简单的*线性回归*模型。模型训练完成后，你将使用机器学习工作室中提供的一些模块来验证模型。\n\
    \n1.  **将数据拆分为训练集和测试集**：选择**拆分**模块并将其拖到实验画布上，然后将其连接到上一个**项目列**模块的输出。将**第一个输出数据集中的行比例**设置为\
    \ 0.8。这样，你将使用 80% 的数据来训练模型，并保留 20% 用于测试。\n\n![Image](img/00013.jpeg) **提示**  通过更改随机种子参数，你可以生成不同的随机样本用于训练和测试。该参数控制**拆分**模块中伪随机数生成器的种子设定。\n\
    \n2.  运行实验。这允许**项目列**和**拆分**模块将列定义传递给你接下来要添加的模块。\n3.  要选择学习算法，请展开画布左侧模块面板中的**机器学习**类别，然后展开**初始化模型**。这将显示几个可用于初始化学习算法的模块类别。\n\
    4.  对于本示例实验，请在**回归**类别下选择**线性回归**模块，并将其拖到实验画布上。\n5.  找到**训练模型**模块并将其拖到实验中。单击**启动列选择器**，然后选择价格列。这是你的模型将要预测的特征。图\
    \ 2-9 显示了此目标选择。\n\n![9781484204467_Fig02-09.jpg](img/00024.jpeg)\n\n图 2-9. 选择价格列\n\
    \n6.  将**线性回归**模块的输出连接到**训练模型**模块的左侧输入端口。\n7.  同时，将**拆分**模块的训练数据输出（即左侧端口）连接到**训练模型**模块的右侧输入端口。\n\
    8.  运行实验。\n\n结果是一个经过训练的回归模型，可用于对新样本进行评分以做出预测。图 2-10 显示了截至步骤 7 的实验。\n\n![9781484204467_Fig02-10.jpg](img/00025.jpeg)\n\
    \n图 2-10. 应用学习算法\n\n步骤 5：对新数据进行预测\n\n现在你已经训练好了模型，可以使用它对另外 20% 的数据进行评分，看看模型在未见数据上的预测效果如何。\n\
    \n1.  找到**评分模型**模块并将其拖到实验画布上，然后将左侧输入端口连接到**训练模型**模块的输出，将右侧输入端口连接到**拆分**模块的测试数据输出（右侧端口）。详情请参见图\
    \ 2-11。\n\n![9781484204467_Fig02-11.jpg](img/00026.jpeg)\n\n图 2-11. 评分模型模块\n\n\
    2.  运行实验并查看**评分模型**模块的输出（双击输出端口并选择**可视化**）。输出将显示价格的预测值以及测试数据中的已知值。\n3.  最后，要测试结果的质量，请选择**评估模型**模块并将其拖到实验画布上，然后将左侧输入端口连接到**评分模型**模块的输出（有两个输入端口，因为**评估模型**模块可用于比较两个不同的模型）。\n\
    4.  运行实验并查看**评估模型**模块的输出（双击输出端口并选择**可视化**）。你的模型将显示以下统计信息：\n    1.  **平均绝对误差**\
    \ (MAE)：绝对误差的平均值（*误差*是预测值与实际值之间的差值）。\n    2.  **均方根误差** (RMSE)：平方误差平均值的平方根。\n\
    \    3.  **相对绝对误差**：绝对误差相对于实际值与所有实际值平均值之间绝对差值的平均值。\n    4.  **相对平方误差**：平方误差相对于实际值与所有实际值平均值之间平方差值的平均值。\n\
    \    5.  **决定系数**：也称为 R 平方值，这是一个统计指标，表示模型对数据的拟合程度。\n"
- fmt: "# For each of the error statistics, smaller is better; a smaller value indicates\
    \ that the predictions more closely match the actual values. For `Coefficient\
    \ of Determination`, the closer its value is to one (1.0), the better the predictions\
    \ (see [Figure 2-12](#part0010.html#Fig12)). If it is 1.0, this means the model\
    \ explains 100% of the variability in the data, which is pretty unrealistic!\n\
    \n![9781484204467_Fig02-12.jpg](images/00027.jpeg)\n\n[Figure 2-12](#part0010.html#_Fig12).\
    \ Evaluation results\n\nThe final experiment should look like the screenshot in\
    \ [Figure 2-13](#part0010.html#Fig13).\n\n![9781484204467_Fig02-13.jpg](images/00028.jpeg)\n\
    \n[Figure 2-13](#part0010.html#_Fig13). Regression Model experiment\n\nCongratulations!\
    \ You have created your first machine learning experiment in Machine Learning\
    \ Studio. In Chapters 5-8, you will see how to apply these five steps to create\
    \ predictive analytics solutions that address business challenges from different\
    \ domains such as buyer propensity, churn analysis, customer segmentation, and\
    \ predictive maintenance. In addition, [Chapter 3](#part0011.html) shows how to\
    \ use R scripts as part of your experiments in Azure Machine Learning.\n\n## Deploying\
    \ Your Model in Production\n\nToday it takes too long to deploy machine learning\
    \ models in production. The process is typically inefficient and often involves\
    \ rewriting the model to run on the target production platform, which is costly\
    \ and requires considerable time and effort. Azure Machine Learning simplifies\
    \ the deployment of machine learning models through an integrated process in the\
    \ cloud. You can deploy your new predictive model in a matter of minutes instead\
    \ of days or weeks. Once deployed, your model runs as a web service that can be\
    \ called from different platforms including servers, laptops, tablets, or even\
    \ smartphones. To deploy your model in production follow these two steps.\n\n\
    1.  Deploy your model to staging in Azure Machine Learning Studio.\n2.  In Azure\
    \ Management portal, move your model from the staging environment into production.\n\
    \n### Deploying Your Model into Staging\n\nTo deploy your model into staging,\
    \ follow these steps in Azure Machine Learning Studio.\n\n1.  Save your trained\
    \ mode using the `Save As` button at the bottom of Azure Machine Learning Studio.\
    \ Rename it to a new name of your choice.\n    1.  `Run` the experiment.\n   \
    \ 2.  Right-click the output of the training module (e.g. `Train Model`) and select\
    \ the option `Save As Trained Model`.\n    3.  Delete any modules that were used\
    \ for training (e.g. `Split`, `Train Model`, `Evaluate Model`).\n    4.  Connect\
    \ the newly saved model directly to the `Score Model` module.\n    5.  Rerun your\
    \ experiment.\n2.  Before the deletion in Step 1c your experiment should appear\
    \ as shown [Figure 2-14](#part0010.html#Fig14).\n\n![9781484204467_Fig02-14.jpg](images/00029.jpeg)\n\
    \n[Figure 2-14](#part0010.html#_Fig14). Predictive model before the training modules\
    \ were deleted\n\nAfter deleting the training modules (i.e. `Split`, `Linear Regression`,\
    \ `Train Model`, and `Evaluate Model`) and then replacing those with the saved\
    \ training model, the experiment should now appear as shown in [Figure 2-15](#part0010.html#Fig15).\n\
    \n![Image](images/00013.jpeg) **Tip**  You may be wondering why you left the `Automobile\
    \ price data (Raw)` dataset connected to the model. The service is going to use\
    \ the user’s data, not the original dataset, so why leave them connected?\n\n\
    It’s true that the service doesn’t need the original automobile price data. But\
    \ it does need the schema for that data, which includes information such as how\
    \ many columns there are and which columns are numeric. This schema information\
    \ is necessary in order to interpret the user’s data. You leave these components\
    \ connected so that the scoring module will have the dataset schema when the service\
    \ is running. The data isn’t used, just the schema.\n\n![9781484204467_Fig02-15.jpg](images/00030.jpeg)\n\
    \n[Figure 2-15](#part0010.html#_Fig15). The experiment that uses the saved training\
    \ model\n\n3.  Next, set your publishing input and output. To do this, follow\
    \ these steps.\n\n    1.  Right-click the right input of the module named `Score\
    \ Model`. Select the option `Set As Publish Input`.\n    2.  Right-click the output\
    \ of the `Score Model` module and select `Set As Publish Output`.\n\nAfter these\
    \ two steps you will see two circles highlighting the chosen publish input and\
    \ output on the `Score Model` module. This is shown in [Figure 2-15](#part0010.html#Fig15).\n\
    \n4.  Once you assign the publish input and output, run the experiment and then\
    \ publish it into staging by clicking `Publish Web Service` at the bottom of the\
    \ screen.\n\n![Image](images/00013.jpeg) **Tip**  You can update the web service\
    \ after you’ve published it. For example, if you want to change your model, just\
    \ edit the training experiment you saved earlier, tweak the model parameters,\
    \ and save the trained model (overwriting the one you saved before). When you\
    \ open the scoring experiment again, you’ll see a notice telling you that something\
    \ has changed (that will be your trained model) and you can update the experiment.\
    \ When you publish the experiment again, it will replace the web service, now\
    \ using your updated model.\n\nYou can configure the service by clicking the `Configuration`\
    \ tab. Here you can modify the service name (it’s given the experiment name by\
    \ default) and give it a description. You can also give more friendly labels for\
    \ the input and output columns.\n\n### Testing the Web Service\n\nOn the `Dashboard`\
    \ page, click the `Test` link under `Staging Services`. A dialog will pop up that\
    \ asks you for the input data for the service. These are the same columns that\
    \ appeared in the original `Automobile price data (Raw)` dataset. Enter a set\
    \ of data and then click `OK`.\n\nThe results generated by the web service are\
    \ displayed at the bottom of the dashboard. The way you have the service configured,\
    \ the results you see are generated by the scoring module.\n\n### Moving Your\
    \ Model from Staging into Production\n\nAt this point your model is now in staging,\
    \ but is not yet running in production. To publish it in production you need to\
    \ move it from the staging to the production environment through the following\
    \ steps.\n\n1.  Configure your new web service in Azure Machine Learning Studio\
    \ and make it ready for production as follows.\n    1.  In Azure Machine Learning\
    \ Studio, click the menu called `Web Services` on the right pane. It will show\
    \ a list of all your web services.\n    2.  Click the name of the new service\
    \ you just created. You can test it by clicking the `Test` URL.\n    3.  Now click\
    \ the configuration tab, and then select `yes` for the option `Ready For Production?`\
    \ Then click the `Save` button at the bottom of the screen. Now your model is\
    \ ready to be published in production.\n2.  Now switch to the Azure Management\
    \ Portal and publish your web service into production as follows.\n    1.  Select\
    \ `Machine Learning` on the left pane in Azure Management Portal.\n    2.  Choose\
    \ the workspace with the experiment you want to deploy in production.\n    3.\
    \  Click on the name of your workspace, and then click the tab named `Web Services`.\n\
    \    4.  Choose the `+Add` button at the bottom of the Azure Management Portal\
    \ window.\n\n![9781484204467_Fig02-16.jpg](images/00031.jpeg)\n\nFigure 2-16\\\
    . A dialog box that promotes the machine learning model from the staging server\
    \ to a live production web service"
