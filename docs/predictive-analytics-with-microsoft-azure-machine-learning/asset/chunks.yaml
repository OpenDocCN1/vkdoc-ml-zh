    [Chapter 4](#part0013.html) provides more details on some of these algorithms.


    Classification Algorithms


    Classification algorithms are commonly used to classify people or things into
    one of many groups. They are also widely used for predictions. For example, to
    prevent fraud, a card issuer will classify a credit card transactions as either
    fraudulent or not. The card issuer typically has a large volume of historical
    credit card transactions and knows the status of each of these transactions. Many
    of these cases are reported by the legitimate cardholder who does not want to
    pay for unauthorized charges. So the issuer knows whether each transaction was
    fraudulent or not. Using this historical data the issuer can now build a model
    that predicts whether a new credit card transaction is likely to be fraudulent
    or not. This is a binary classification problem in which all cases fall into one
    of two classes.


    Another classification problem is the customers’ propensity to upgrade to a premium
    phone plan. In this case, the wireless carrier needs to know if a customer will
    upgrade to a premium plan or not. Using sales and usage data, the carrier can
    determine which customers upgraded in the past. Hence they can classify all customers
    into one of two groups: whether they upgraded or not. Since the carrier also has
    information on demographic and behavioral data on new and existing customers,
    they can build a model to predict a new customer’s probability to upgrade; in
    other words, the model will group each customer into one of two classes.


    Statistics and data mining offer many great tools for classification: this includes
    logistic regression, which is widely used by statisticians for building credit
    scorecards, or propensity-to-buy models, or neural networks algorithms such as
    backpropagation, radial basis functions, or ridge polynomial networks. Others
    include decision trees or ensemble models such as boosted decision trees or random
    forests. For more complex classification problems with more than two classes you
    can use multimodal techniques that predict multiple classes. Classification problems
    generally use supervised learning algorithms that use label data for training.
    Azure Machine Learning offers several algorithms for classification including
    logistic regression, decision trees, boosted decision trees, multimodal neural
    networks, etc. See [Chapter 4](#part0013.html) for more details.


    Clustering Algorithms


    Clustering uses unsepuervised learning to group data into distinct classes. A
    major difference between clustering and classification problems is that the outcome
    of clustering is unknown beforehand. Before clustering we do not know the cluster
    to which each data point belongs. In contrast, with classification problems we
    have historical data that shows to which class each a data point belongs. For
    example, the lender knows from historical data whether a customer defaulted on
    their car loans or not.


    A good application of clustering is customer segmentation where we group customers
    into distinct segments for marketing purposes. In a good segmentation model, the
    data within each segment is very similar. However, data across different segments
    is very different. For example, a marketer in the gaming segment needs to understand
    his or her customers better in order to create the right offers for them. Let’s
    assume that he or she only has two variables on the customers, namely age and
    gaming intensity. Using clustering, the marketer finds that there are three distinct
    segments of gaming customers, as shown in [Figure 1-7](#part0009.html#Fig7). Segment
    1 is the intense gamers who play computer games passionately every day and are
    typically young. Segment 2 is the casual gamers who only play occasionally and
    are typically in their thirties or forties. The non-gamers rarely ever play computer
    games and are typically older; they make up Segment 3.


    ![9781484204467_Fig01-07.jpg](images/00015.jpeg)


    [Figure 1-7](#part0009.html#_Fig7). Simple hypothetical customer segments from
    a clustering algorithm


    Statistics offers several tools for clustering, but the most widely used is the
    k-means algorithm that uses a distance metric to cluster similar data together.
    With this algorithm you decide apriori how many clusters you want; this is the
    constant K. If you set K = 3, the algorithm produces three clusters. Refer to
    Haralambos Marmanis and Dmitry Babenko’s book for more details on the k-means
    algorithm. Machine learning also offers more sophisticated algorithms such as
    self-organizing maps (also known as Kohonen networks) developed by Teuvo Kohonen,
    or adaptive resonance theory (ART) networks developed by Stephen Grossberg and
    Gail Carpenter. Clustering algorithms typically use unsupervised learning since
    the outcome is not known during training.


    ![Image](images/00013.jpeg) **Note**  You can read more about clustering algorithms
    in the following books and paper:


    “Algorithms of the Intelligent Web”, Haralambos Marmanis and Dmitry Babenko. Manning
    Publications Co., Stamford CT. January 2011.


    “Self-Organizing Maps. Third, extended edition”.


    Springer. Kohonen, T. 2001.“Art2-A: an adaptive resonance algorithm for rapid
    category learning and recognition”, Carpenter, G., Grossberg, S., and Rosen, D.
    Neural Networks, 4:493-504\. 1991a.


    Regression Algorithms


    Regression techniques are used to predict response variables with numerical outcomes.
    For example, a wireless carrier can use regression techniques to predict call
    volumes at their customer service centers. With this information they can allocate
    the right number of call center staff to meet demand. The input variables for
    regression models may be numeric or categorical. However, what is common with
    these algorithms is that the output (or response variable) is typically numeric.
    Some of the most commonly used regression techniques include linear regression,
    decision trees, neural networks, and boosted decision tree regression.


    Linear regression is one of the oldest prediction techniques in statistics and
    its goal is to predict a given outcome from a set of observed variables. A simple
    linear regression model is a linear function. If there is only one input variable,
    the linear regression model is the best line that fits the data. For two or more
    input variables, the regression model is the best hyperplane that fits the underlying
    data.


    Artificial neural networks are a set of algorithms that mimic the functioning
    of the brain. They learn by example and can be trained to make predictions from
    a dataset even when the function that maps the response to independent variables
    is unknown. There are many different neural network algorithms, including backpropagation
    networks, and radial basis function (RBF). However, the most common is backpropagation,
    also known as multilayered perceptron. Neural networks are used for regression
    or classification.


    Decision tree algorithms are hierarchical techniques that work by splitting the
    dataset iteratively based on certain statistical criteria. The goal of decision
    trees is to maximize the variance across different nodes in the tree, and minimize
    the variance within each node. Some of the most commonly used decision tree algorithms
    include Iterative Dichotomizer 3 (ID3), C4.5 and C5.0 (successors of ID3), Automatic
    Interaction Detection (AID), Chi Squared Automatic Interaction Detection (CHAID),
    and Classification and Regression Tree (CART). While very useful, the ID3, C4.5,
    C5.0, and CHAID algorithms are classification algorithms and are not useful for
    regression. The CART algorithm, on the other hand, can be used for either classification
    or regression.


