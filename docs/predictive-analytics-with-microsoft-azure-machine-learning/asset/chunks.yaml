  trans: "\n图 8-12. 使用已保存训练模型的实验\n\n2.  接下来，设置你的发布输入和输出数据端口。为此，请执行以下操作：\n\n1.  右键单击名为\
    \ **评分模型** 的模块的右侧输入端口。选择选项 **设置为发布输入**。\n    2.  右键单击 **评分模型** 模块的输出端口，然后选择 **设置为发布输出**。\n\
    \n完成这两个步骤后，你将在评分模型模块上看到两个圆圈，分别高亮显示所选的发布输入和输出。如图 8-12 所示。\n\n3.  分配好发布输入和输出端口后，运行实验，然后通过单击屏幕底部的\
    \ **发布 Web 服务** 将其发布到暂存环境。\n\n将模型从暂存环境迁移到生产环境\n\n此时，你的模型已位于暂存环境中，但尚未在生产环境中运行。要将其发布到生产环境，你需要通过以下步骤将其从暂存环境迁移到生产环境。\n\
    \n1.  在 Azure 机器学习工作室中配置新的 Web 服务，并使其准备好投入生产，具体操作如下：\n    1.  在 Azure 机器学习工作室中，单击右侧窗格中名为\
    \ **Web 服务** 的菜单。它将显示所有 Web 服务的列表。\n    2.  单击你刚刚创建的新服务的名称。通过单击 **测试** URL 对其进行测试。\n\
    \    3.  单击配置选项卡，然后为 **准备好投入生产？** 选项选择“是”。单击窗口底部的 **保存** 按钮。现在，你的模型已准备好发布到生产环境。\n\
    2.  现在切换到 Azure 管理门户，并按如下方式将你的 Web 服务发布到生产环境：\n    1.  在 Azure 管理门户的右侧窗格中选择 **机器学习**。\n\
    \    2.  选择包含要部署到生产环境的实验的工作区。\n    3.  单击你的工作区名称，然后单击名为 **Web 服务** 的选项卡。\n   \
    \ 4.  选择 Azure 管理门户窗口底部的 **+添加** 按钮。\n\n恭喜，你已成功将机器学习模型发布到生产环境。如果你从 **Web 服务**\
    \ 选项卡单击你的模型，你将看到详细信息，例如模型在七天内做出的预测次数。该服务还会显示可用于将模型作为 Web 服务调用的 API，支持请求/响应或批处理执行模式。此外，你还会获得可用于在\
    \ C#、Python 或 R 中调用新 Web 服务的示例代码。\n\n总结\n\n本章从探索预测性维护开始，展示了商业机会和机器学习的潜力。使用来自加州大学欧文分校机器学习数据仓库的\
    \ SECOM 半导体制造数据，你学习了如何在 Azure 机器学习中构建和部署预测性维护解决方案。在本分步指南中，我们解释了如何执行数据预处理和分析，这对于理解数据至关重要。基于对数据的理解，你使用了二元逻辑回归和二元提升决策树算法进行分类。你还了解了如何评估模型性能并避免过拟合。最后，你了解了如何将完成的模型作为机器学习\
    \ Web 服务部署到 Microsoft Azure 的生产环境中。\n\n索引\n\n![images](img/00013.jpeg)  A\n\n\
    分析谱系\n\n类别\n\n数据分析\n\n描述性分析\n\n诊断性分析\n\n预测性分析\n\n规范性分析\n\n曲线下面积 (AUC)\n\n平均计算机内存价格\n\
    \nAzure 机器学习\n\n算法\n\n汽车价格数据\n\n构建与测试\n"
