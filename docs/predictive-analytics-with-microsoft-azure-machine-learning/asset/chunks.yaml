- fmt: '# Building an Ensemble Model


    The first step to build an ensemble model is data selection for the classifier
    models. When sampling the data, a key goal is to maximize diversity of the models,
    since this improves the accuracy of the solution. In general, the more diverse
    your models, the better the performance of your final classifier, and the smaller
    the variance of its predictions.


    Step 2 of the process entails training several individual classifiers. But how
    do you assign the classifiers? Of the many available strategies, the two most
    popular are bagging and boosting. The `bagging` algorithm uses different random
    subsets of the data to train each model. The models can then be trained in parallel
    over their random subset of training data. In contrast, the `boosting` algorithm
    improves overall performance by sequentially training the models, testing the
    performance of each on the training data. The examples in the training set that
    were misclassified are given more importance in subsequent training. Thus, during
    training, each additional model focuses more on the misclassified data. The boosted
    decision tree algorithm uses the boosting strategy. In this case, every new decision
    tree is trained with emphasis on the misclassified cases to reduce the error rates.
    This is how a boosted decision tree produces superior results from weak decision
    trees.


    It is important to watch two key parameters of the boosted decision tree: the
    number of leaves in each decision tree and the number of boosting iterations.
    The number of leaves in each tree determines the amount of interaction allowed
    between variables in the model. If this number is set to 2, then no interaction
    is allowed. If it is set to 3, the model can include effects of interaction of
    at most two variables. You need to try different values to find the one that works
    best for your dataset. It has been reported that 4-8 leaves per tree yields good
    results for most applications. In contrast, having only two leaves per tree leads
    to poor results. The second important parameter to tweak is the number of boosting
    iterations (i.e. the number of trees in the model). A very large number of trees
    reduces the errors, but easily leads to over-fitting. To avoid over-fitting, you
    need to find an optimal number of trees that minimizes the error on a validation
    dataset.


    Finally, once you train all the classifiers, the final step is to combine their
    results to make a final prediction. There are several approaches to combining
    the outcomes, ranging from a simple majority to a weighted majority voting.


    ![Image](images/00013.jpeg)


    **Note** You can learn more about boosted decision trees from the book *Ensemble
    Machine Learning, methods and applications* by C. Zhang and Y. Ma (New York, NY:
    pp. 1 - 34, Springer, 2012) and at [http://en.wikipedia.org/wiki/Gradient_boosting#Gradient_tree_boosting](http://en.wikipedia.org/wiki/Gradient_boosting#Gradient_tree_boosting).


    # Classification Algorithms


    Classification is a type of supervised machine learning. In supervised learning,
    the goal is to infer a function using labeled training data. The function can
    then be used to determine the label for a new dataset (where the labels are unknown).
    A non-exhaustive list of classification algorithms that can be used for building
    the model includes decision trees, logistic regression, neural networks, support
    vector machines, naïve Bayes, and Bayes point machines.


    Classification algorithms are used to predict the label for input data (where
    the label is unknown). Labels are also referred to as classes, groups, or target
    variables. For example, a telecommunication company wants to predict the following:


    *   *Churn*: Customers who have an inclination to switch to a different telecommunication
    provider

    *   *Propensity to Buy*: Customers willing to buy new products or services

    *   *Up-selling*: Customers willing to buy upgraded services or add-ons


    To achieve this, the telecommunication company builds a classification model using
    training data (where the labels are known or have already been predefined). In
    this section, you’ll look at several common classification algorithms that can
    be used for building the model. Once the model has been built and validated using
    test data, data scientists at the telecommunication company can use the model
    to predict churn, propensity to buy, and up-selling labels for customers (where
    the labels are unknown). Consequently, the telecommunication company can use these
    predictions to design marketing strategies that can reduce the customer churn
    and offer services to the customers that are more willing to buy new services
    or up-sell.


    Other scenarios where classification algorithms are commonly used include financial
    institutions, where models are used to determine whether a credit card transaction
    is a fraudulent case or if a loan application should be approved based on the
    financial profile of the customer. Hotels and airlines use models to determine
    whether a customer should be upgraded to a higher level of service (e.g. from
    economy to business class, from a normal room to a suite, etc.).


    The classification problem is defined as follows: given an input sample of *X*
    = (*x*[1], *x*[2], ... *x*[*d*]), where *x*[*i*] refers to an item in the sample
    of size d. The goal of classification is to learn the mapping *X* → *Y*, where
    *y* Î *Y* is a class.


    An instance of data belongs to one of J groups (or classes), such as *C*[1], *C*[2],
    ..., *C*[*j*]. For example, in a two-class classification problem for the telecommunication
    scenario, Class *C*[1] refers to customers that will churn and switch to a new
    telecommunication provider, and Class *C*[2] refers to customers that will not
    churn.


    To achieve this, labeled training data is first used to train a model using one
    of the classification algorithms. This is then validated by using test data to
    determine the number of mistakes made by the trained model (i.e. the classifier).
    Various metrics are used to measure the performance of the classifier. These include
    measuring the accuracy, precision, recall, and the area under curve (AUC) of the
    trained model.


    In the earlier sections, you learned how decision trees, boosted decision trees
    and neural networks work. These algorithms are useful for both regression and
    classification. In this section, you will learn how support vector machines and
    Bayes point machines work.


    ## Support Vector Machines


    Support vector machines (SVMs) were introduced by Bernhard E. Boser, Isabelle
    Guyon, and Vladimir N. Vapnik at the Conference on Learning Theory (COLOT) IN
    1992. A SVM is based on techniques grounded in statistical learning theory, and
    is considered a type of kernel-based learning algorithm.


    The core idea of SVMs is to find the separating hyperplane that separates the
    training data into two classes, with a gap (or margin) that is as wide as possible.
    When there are only two input variables, a straight line separates the data into
    two classes. In higher-dimensional space (i.e. more than two input variables),
    a hyperplane separates the training data into two classes. [Figure 4-5](#part0013.html#Fig5)
    shows how a hyperplane separates the two classes, and the margin. The circled
    items are the support vectors because they define the optimal hyperplane, which
    provides the maximum margin.


    ![9781484204467_Fig04-05.jpg](images/00064.jpeg)


    [Figure 4-5](#part0013.html#_Fig5). Support vector machine, separating hyperplane
    and margin'
