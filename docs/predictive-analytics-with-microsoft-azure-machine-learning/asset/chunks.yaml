    ![9781484204467_unFig-02.jpg](img/00004.jpeg)


    **Roger Barga** 是亚马逊网络服务（Amazon Web Services）的总经理兼开发总监。在加入亚马逊之前，Roger 是微软云与企业部门中云机器学习组的集团项目经理，其团队负责
    Azure 机器学习服务的产品管理。Roger 于 1997 年加入微软，担任微软研究院数据库组的研究员，负责数据库、工作流和流处理系统的系统研究和产品开发工作。他将基础研究的想法，通过概念验证原型，推进到产品组的孵化工作中。在加入微软之前，Roger
    是太平洋西北国家实验室机器学习组的研究科学家，负责构建和部署基于机器学习的解决方案。Roger 还是华盛顿大学的附属教授，在数据科学和机器学习项目中担任讲师。


    Roger 拥有计算机科学博士学位、计算机科学硕士学位（主攻机器学习方向），以及数学与计算科学学士学位。他发表了 90 多篇经过同行评审的技术论文和书籍章节，从
    1991 年到 2013 年与 214 位合著者合作，被 1,084 位作者引用超过 700 次。


    ![9781484204467_unFig-01.jpg](img/00005.jpeg)


    **Valentine Fontama** 是微软数据与决策科学组（DDSG）的首席数据科学家，负责领导外部咨询项目，为微软客户提供世界级的高级分析解决方案。Val
    在数据科学和商业领域拥有超过 18 年的经验。在获得人工神经网络博士学位后，他将数据挖掘应用于环境科学和信贷行业。在加入微软之前，Val 是伦敦 Equifax
    公司的新技术顾问，率先将数据挖掘应用于消费信贷行业的风险评估和市场营销。他目前是华盛顿大学数据科学专业的附属教授。


    在微软的上一任职位中，Val 是高级产品营销经理，负责云和企业营销中的大数据和预测分析。在此职位上，他领导了 Microsoft Azure 机器学习、微软首个
    Hadoop 服务 HDInsight、微软首个数据仓库设备并行数据仓库，以及三个版本的 Fast Track 数据仓库的产品管理工作。他还在定义微软的内存计算战略和定位方面发挥了关键作用。


    Val 拥有沃顿商学院的战略管理与营销 MBA 学位、神经网络博士学位、计算硕士学位，以及数学与电子学学士学位（一等荣誉）。他合著了《Introducing
    Microsoft Azure HDInsight》一书，并发表了 11 篇学术论文，被超过 227 位作者引用 152 次。


    ![9781484204467_unFig-03.jpg](img/00006.jpeg)


    **Wee-Hyong Tok** 是微软 SQL Server 团队的高级项目经理。Wee-Hyong 拥有超过 12 年的数据库系统经验（其中在工业界拥有超过
    6 年的数据平台经验，在学术界拥有 6 年的经验）。


    在攻读博士学位之前，Wee-Hyong 是新加坡一家大型电信公司的系统分析师，负责市场营销决策支持系统。在获得新加坡国立大学数据流系统博士学位后，他加入微软并加入了
    SQL Server 团队。在过去的六年里，Wee-Hyong 积累了与来自亚洲和美国的分布式工程团队合作的丰富经验，并负责塑造 SSIS 服务器，将其从概念引入到
    SQL Server 2012 的发布。最近，Wee-Hyong 加入了 Azure 数据工厂团队，该团队提供用于编排和管理数据转换与移动的服务。

