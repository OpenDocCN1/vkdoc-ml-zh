    \nFigure 6-13\\. Quantize properties\n\n3.  For the remaining 40 columns, perform\
    \ the following steps:\n    1.  Use the **Missing Values Scrubber** to substitute\
    \ it with 0\\. [Figure 6-14](#part0016.html#Fig14) shows the properties.\n\n![9781484204467_Fig06-14.jpg](images/00106.jpeg)\n\
    \n[Figure 6-14](#part0016.html#_Fig14). Missing Values Scrubber (for the remaining\
    \ 40 columns)\n\n2.  Use the **Metadata Editor** to change the type for all columns\
    \ to be **categorical**. [Figure 6-15](#part0016.html#Fig15) shows the properties.\n\
    \n![9781484204467_Fig06-15.jpg](images/00107.jpeg)\n\n[Figure 6-15](#part0016.html#_Fig15).\
    \ Using the Metadata Editor to mark the columns as containing categorical data\n\
    \n4.  Combine it with the labels from the **ChurnLabel** dataset. [Figure 6-16](#part0016.html#Fig16)\
    \ shows the combined data.\n\n![9781484204467_Fig06-16.jpg](images/00108.jpeg)\n\
    \n[Figure 6-16](#part0016.html#_Fig16). Combining training data and training label\n\
    \n5.  Rename the label column as **ChurnLabel**. [Figure 6-17](#part0016.html#Fig17)\
    \ shows how you can use the Metadata Editor to rename the column.\n\n![9781484204467_Fig06-17.jpg](images/00109.jpeg)\n\
    \n[Figure 6-17](#part0016.html#_Fig17). Renaming the label column as ChurnLabel\n\
    \nClassification Model for Predicting Churn\n\nIn this section, you will start\
    \ building the customer churn model using the classification algorithms provided\
    \ in Azure Machine Learning Studio. For predicting customer churn, you will use\
    \ two classification algorithms, a two-class boosted decision tree and a two-class\
    \ decision forest.\n\nA decision tree is a machine learning algorithm for classification\
    \ or regression. During training, it splits the data using the input variables\
    \ that give the highest information gain. The process is repeated on each subset\
    \ of the data until splitting is no longer required. The leaf of the decision\
    \ tree identifies the label to be predicted (or class). This prediction is provided\
    \ based on a probability distribution.\n\nThe boosted decision tree and decision\
    \ forest algorithms build an ensemble of  decision trees and use them for predictions.\
    \ The key difference between the two approaches is that, in boosted decision tree\
    \ algorithms, multiple decision trees are grown in series such that the output\
    \ of one tree is provided as input to the next tree. This is a boosting approach\
    \ to ensemble modeling. In contrast, the decision forest algorithm grows each\
    \ decision tree independently of each other; each tree in the ensemble uses a\
    \ sample of data drawn from the original dataset. This is the bagging approach\
    \ of ensemble modeling. See [Chapter 4](#part0013.html) for more details on decision\
    \ trees, decision forests, and boosted decision trees. [Figure 6-18](#part0016.html#Fig18)\
    \ shows how the data is split and used as inputs to train the two classification\
    \ models.\n\n![9781484204467_Fig06-18.jpg](images/00110.jpeg)\n\n[Figure 6-18](#part0016.html#_Fig18).\
    \ Splitting the data into training and testing, and training the customer churn\
    \ model\n\nFrom [Figure 6-18](#part0016.html#Fig18), you can see that the following\
    \ steps are performed.\n\n1.  Splitting the input data into training and test\
    \ data: In this exercise, you split the data by specifying the **Fraction of rows\
    \ in the first output** dataset, and set it as **0.7**. This assigns 70% of data\
    \ to the training set and the remaining 30% to the test dataset.\n\n[Figure 6-19](#part0016.html#Fig19)\
    \ shows the properties for Split.\n\n![9781484204467_Fig06-19.jpg](images/00111.jpeg)\n\
    \n[Figure 6-19](#part0016.html#_Fig19). Properties of the Split module\n\n2. \
    \ Training the model using the training data: In this exercise, you will be training\
    \ two classification models, a two-class boosted decision tree and two-class decision\
    \ forest. [Figures 6-20](#part0016.html#Fig20) and [6-21](#part0016.html#Fig21)\
    \ show the properties for each of the classification algorithms.\n\n![9781484204467_Fig06-20.jpg](images/00112.jpeg)\n\
    \n[Figure 6-20](#part0016.html#_Fig20). Properties for two-class boosted decision\
    \ tree\n\n![9781484204467_Fig06-21.jpg](images/00113.jpeg)\n\n[Figure 6-21](#part0016.html#_Fig21).\
    \ Properties for two-class decision forest\n\n3.  Training the model using the\
    \ **Train Model** module: To train the model, you need to select the label column.\
    \ In this exercise, you will be using the **ChurnLabel** column. [Figure 6-22](#part0016.html#Fig22)\
    \ shows the properties for **Train Model**.\n\n![9781484204467_Fig06-22.jpg](images/00114.jpeg)\n\
    \n[Figure 6-22](#part0016.html#_Fig22). Using ChurnLabel as the Label column\n\
    \nScoring the model: After training the customer churn model, you can use the\
    \ **Score Model** module to predict the label column for a test dataset. The output\
    \ of **Score Model** will be used in **Evaluate Model** to understand the performance\
    \ of the model.\n\nCongratulations, you have successfully built a customer churn\
    \ model! You learned how to use two of the classification algorithms available\
    \ in Machine Learning Studio. You also learned how to evaluate the performance\
    \ of the model. In the next few chapters, you will learn how to deploy the model\
    \ to production and operationalize it.\n\nEvaluating the Performance of the Customer\
    \ Churn Models"
  trans: "\n在本练习中，您将不会使用这些特征选择模块。图 6-7 展示了数据预处理步骤。\n\n![9781484204467_Fig06-07.jpg](img/00099.jpeg)\n\
    \n图 6-7. 数据预处理步骤\n\n为简化操作，请执行以下步骤来预处理数据。\n\n1.  将变量分为前 190 列（数值数据）和剩余 40 列（分类数据）。为此，请添加两个**投影列**模块。\n\
    \n对于第一个**投影列**模块，选择**列索引：1-190**（图 6-8）。\n\n![9781484204467_Fig06-08.jpg](img/00100.jpeg)\n\
    \n图 6-8. 选择列索引 1-190（数值列）\n\n对于第二个**投影列**模块，选择**列索引：191-230**（图 6-9）。\n\n![9781484204467_Fig06-09.jpg](img/00101.jpeg)\n\
    \n图 6-9. 选择列索引 191-230（分类列）\n\n2.  对于前 190 列，执行以下操作：\n    1.  使用**投影列**选择包含数值数据的列（并移除包含零值或极少值的列）。这些列包括：Var6、Var8、Var15、Var20、Var31、Var32、Var39、Var42、Var48、Var52、Var55、Var79、Var141、Var167、Var175\
    \ 和 Var185。图 6-10 展示了被排除的列。\n\n![9781484204467_Fig06-10.jpg](img/00102.jpeg)\n\
    \n图 6-10. 排除不包含有效值的列\n\n2.  应用一个数学运算，为每一行加 1。这样做的理由是，这使您能够区分列中实际为 0 的行与替换值 0（当您使用缺失值清理器时）。图\
    \ 6-11 展示了**数学运算**模块的属性。\n\n![9781484204467_Fig06-11.jpg](img/00103.jpeg)\n\n\
    图 6-11. 为现有数值变量加 1\n\n3.  使用**缺失值清理器**将缺失值替换为 0。图 6-12 展示了其属性。\n\n![9781484204467_Fig06-12.jpg](img/00104.jpeg)\n\
    \n图 6-12. 缺失值清理器属性\n\n4.  使用**量化**模块，通过量化函数将输入值映射到更少的箱中。在本练习中，您将使用**等宽分箱**模式。图\
    \ 6-13 展示了所使用的属性。\n\n![9781484204467_Fig06-13.jpg](img/00105.jpeg)\n\n图 6-13.\
    \ 量化属性\n\n3.  对于剩余的 40 列，执行以下步骤：\n    1.  使用**缺失值清理器**将其替换为 0。图 6-14 展示了其属性。\n\
    \n![9781484204467_Fig06-14.jpg](img/00106.jpeg)\n\n图 6-14. 缺失值清理器（用于剩余 40 列）\n\
    \n2.  使用**元数据编辑器**将所有列的类型更改为**分类**。图 6-15 展示了其属性。\n\n![9781484204467_Fig06-15.jpg](img/00107.jpeg)\n\
    \n图 6-15. 使用元数据编辑器将列标记为包含分类数据\n\n4.  将其与**ChurnLabel**数据集中的标签合并。图 6-16 展示了合并后的数据。\n\
    \n![9781484204467_Fig06-16.jpg](img/00108.jpeg)\n\n图 6-16. 合并训练数据和训练标签\n\n5. \
    \ 将标签列重命名为**ChurnLabel**。图 6-17 展示了如何使用元数据编辑器重命名列。\n\n![9781484204467_Fig06-17.jpg](img/00109.jpeg)\n\
    \n图 6-17. 将标签列重命名为 ChurnLabel\n\n用于预测客户流失的分类模型\n\n在本节中，您将开始使用 Azure 机器学习工作室中提供的分类算法构建客户流失模型。为了预测客户流失，您将使用两种分类算法：双类提升决策树和双类决策森林。\n\
    \n决策树是一种用于分类或回归的机器学习算法。在训练过程中，它会使用能带来最高信息增益的输入变量来分割数据。这个过程会在每个数据子集上重复，直到不再需要分割为止。决策树的叶节点标识了要预测的标签（或类别）。该预测基于概率分布给出。\n\
    \n提升决策树和决策森林算法构建了一个决策树集成，并使用它们进行预测。这两种方法的主要区别在于，在提升决策树算法中，多个决策树按顺序生长，使得一棵树的输出作为下一棵树的输入。这是一种集成建模的提升方法。相比之下，决策森林算法中每棵决策树彼此独立生长；集成中的每棵树都使用从原始数据集中抽取的数据样本。这是集成建模的装袋方法。有关决策树、决策森林和提升决策树的更多详细信息，请参见第\
    \ 4 章。图 6-18 展示了数据如何被分割并用作输入来训练这两个分类模型。\n\n![9781484204467_Fig06-18.jpg](img/00110.jpeg)\n\
    \n图 6-18. 将数据分割为训练集和测试集，并训练客户流失模型\n\n从图 6-18 中，您可以看到执行了以下步骤。\n\n1.  将输入数据分割为训练数据和测试数据：在本练习中，您通过指定**第一个输出数据集中的行比例**并将其设置为**0.7**来分割数据。这将\
    \ 70%的数据分配给训练集，剩余 30%分配给测试数据集。\n\n图 6-19 展示了分割模块的属性。\n\n![9781484204467_Fig06-19.jpg](img/00111.jpeg)\n\
    \n图 6-19. 分割模块的属性\n\n2.  使用训练数据训练模型：在本练习中，您将训练两个分类模型：双类提升决策树和双类决策森林。图 6-20 和 6-21\
    \ 展示了每个分类算法的属性。\n\n![9781484204467_Fig06-20.jpg](img/00112.jpeg)\n\n图 6-20. 双类提升决策树的属性\n\
    \n![9781484204467_Fig06-21.jpg](img/00113.jpeg)\n\n图 6-21. 双类决策森林的属性\n\n3.  使用**训练模型**模块训练模型：要训练模型，您需要选择标签列。在本练习中，您将使用**ChurnLabel**列。图\
    \ 6-22 展示了**训练模型**的属性。\n\n![9781484204467_Fig06-22.jpg](img/00114.jpeg)\n\n图 6-22.\
    \ 使用 ChurnLabel 作为标签列\n\n对模型进行评分：训练完客户流失模型后，您可以使用**评分模型**模块来预测测试数据集的标签列。**评分模型**的输出将用于**评估模型**，以了解模型的性能。\n\
    \n恭喜，您已成功构建了一个客户流失模型！您学习了如何使用机器学习工作室中提供的两种分类算法。您还学习了如何评估模型的性能。在接下来的几章中，您将学习如何将模型部署到生产环境并使其可操作化。\n\
    \n评估客户流失模型的性能\n"
- fmt: 'After you use the `Score Model` to predict whether a customer will churn,
    the output of the `Score Model` module is passed to the `Evaluate Model` to generate
    evaluation metrics for each of the model. [Figure 6-23](#part0016.html#Fig23)
    shows the `Score Model` and `Evaluate Model` modules.


    ![9781484204467_Fig06-23.jpg](images/00115.jpeg)


    [Figure 6-23](#part0016.html#_Fig23). Scoring and evaluating the model


    After you have evaluated the model, you can right-click the circle at the bottom
    of `Evaluate Model` to see the performance of the two customer churn models. [Figure
    6-24](#part0016.html#Fig24) shows the Receiver Operating Characteristic (ROC curve)
    while [Figure 6-25](#part0016.html#Fig25) shows the accuracy, precision, recall,
    and F1 scores for the two customer churn models.


    ![9781484204467_Fig06-24.jpg](images/00116.jpeg)


    [Figure 6-24](#part0016.html#_Fig24). ROC curve for the two customer churn models


    ![9781484204467_Fig06-25.jpg](images/00117.jpeg)


    [Figure 6-25](#part0016.html#_Fig25). Accuracy, precision, recall, and F1 scores
    for the customer churn models


    The ROC curve shows the performance of the customer churn models. The diagonal
    line from (0,0) to (1,1) on the chart shows the performance of random guessing.
    For example, if you randomly guessed which customer would churn, the curve will
    be on the diagonal line. A good predictive model should perform better than random
    guessing, and the ROC curve should be above the diagonal line. The performance
    of a customer churn model can be measured by considering the area under the curve
    (AUC). The higher the area under the curve, the better the model’s performance.
    The ideal model will have an AUC of 1.0, while a random guess will have an AUC
    of 0.5.


    From the visualization, you can see that the customer churn models have a cumulative
    AUC, accuracy, and precision of 0.698, 0.907, and 0.283, respectively. You can
    also see that the customer models have a F1 score of 0.204.


    ![Image](images/00013.jpeg) **Note** See [http://en.wikipedia.org/wiki/F1_score](http://en.wikipedia.org/wiki/F1_score)
    for a good discussion on the use of the F1 score to measure the accuracy of the
    machine learning model.


    ## Summary


    Using the KDD Cup 2009 Orange telecommunication dataset, you learned step by step
    how to build customer churn models using Azure Machine Learning. Before building
    the model, you took time to first understand the data and perform data preprocessing.
    Next, you learned how to use the two-class boosted decision tree and two-class
    decision forest algorithms to perform classification, and to build a model for
    predicting customer churn with the telecommunication dataset. After building the
    model, you also learned how to measure the performance of the models.


    # CHAPTER 7


    ![image](images/00007.jpeg)


    # Customer Segmentation Models


    In this chapter, you will learn how to build customer segmentation models in Microsoft
    Azure Machine Learning. Using a practical example, we present a step-by-step guide
    on using Microsoft Azure Machine Learning to easily build segmentation models
    using k-means clustering. After the models have been built, you will learn how
    to perform validation and deploy it in production.


    ## Customer Segmentation Models in a Nutshell


    In order for companies to compete effectively, and build products and services
    that sell, it is super important to figure out the target customer segments and
    the characteristics of each segment. Identifying customer segments is critical
    since it helps companies to better target their marketing campaigns to win the
    most profitable customers. Data analysts in companies are tasked with sifting
    through data from both internal and external data sources to identify the magical
    ingredients that will appeal to specific customer segments (which might not be
    known a priori).


    Customer segmentation empowers companies with the ability to craft marketing strategies
    and execute marketing campaigns that target and appeal to specific customer segments.
    In addition, customer segmentation leads to greater customer satisfaction because
    different needs in different segmentations can be addressed appropriately.


    ![Image](images/00013.jpeg) **Note** Learn more about market segmentation at [http://en.wikipedia.org/wiki/Market_segmentation](http://en.wikipedia.org/wiki/Market_segmentation).


    Companies must be able to master the deluge of information that is available (e.g.
    market research reports, concept/market testing, etc.). While this market research
    data provides a good balance of qualitative and quantitative information on the
    market, companies can compete even more effectively if they can tap the huge treasure
    trove of data that they already have (e.g. membership/loyalty program databases,
    billing data from online services/retail outlets, CRM systems, etc.). Somewhere
    in the treasure trove lies insights that companies can turn to their competitive
    advantage. These insights enable companies to be cognizant of potential customer
    segments and their characteristics.


    For example, in the United States, many people are familiar with the use of the
    consumer credit score. The consumer credit score helps banks understand the risk
    profile of customers applying for loans (auto loans, mortgage loans, etc.). This
    in turn enables banks to tune their interest rates based on the risk segment to
    which an individual belongs.


    Another example is the telecommunication industry. Many telecommunication providers
    strive to gain insights on how to sell effectively to their customers falling
    into the two broad groups, corporate business and consumers. In order to figure
    out effective marketing strategies for consumers, telecommunication providers
    are often interested in the profile of the person that uses the service. Folks
    with similar profiles are grouped together, and offered discounts or value-added
    services that appeal to that profile. A non-exhaustive list of features that a
    telecommunication provider considers include income group, call frequency of friends
    and family members, number of calls/short messages and when they happened, how
    they pay their monthly bill (online, self-service kiosks, physical stores), delays
    in payment, etc.


    Amongst the different types of unsupervised machine learning techniques, k-means
    clustering is a common technique used to perform customer segmentation. In this
    chapter, you will learn how to use Microsoft Azure Machine Learning to perform
    k-means clustering on the Wikipedia SP 500 dataset (one of the sample datasets
    available in ML Studio).


    The Wikipedia SP 500 dataset contains the following information: industry category,
    and text describing each of the 500 Standard & Poor’s (SP500) companies. You will
    build and deploy a k-means clustering model to perform segmentation of the companies.
    Due to the large number of features that are extracted from the text, you will
    execute an R script to perform principal component analysis to identify the top
    10 features, which will be used for determining the clusters. After k-means clustering
    has been performed, companies that are similar to each other (based on features
    extracted from the companies’ descriptive text) will be assigned to the same segment.


    ![Image](images/00013.jpeg) **Note** See [Chapter 4](#part0013.html) for an overview
    of the different statistical and machine learning algorithms. In the chapter,
    you will also learn about the categories of clustering algorithms, and how K-Means
    Clustering works.


    ## Building and Deploying Your First K-Means Clustering Model


    To help you get started building your first k-means clustering model, you will
    use one of the sample experiments provided in the ML Studio. The experiment uses
    k-means clustering to perform segmentation of companies in the Standard & Poor’s
    (S&P) 500 list of companies.'
