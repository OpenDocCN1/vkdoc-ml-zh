    构建客户倾向模型


    本章将提供构建机器学习模型的实用指南。它侧重于买家倾向模型，展示了如何将数据科学流程应用于此业务问题。通过逐步指南，本章将解释如何应用关键概念并利用 Microsoft
    Azure 机器学习的功能进行倾向建模。


    业务问题


    假设你是一家大型自行车制造商的营销经理。你需要开展一次邮件营销活动，以吸引更多客户购买你的自行车。你的预算有限，管理层希望你最大化投资回报率（ROI）。因此，你的邮件营销活动的目标是找到最有可能购买你自行车的潜在客户。


    如果预算无限，任务就很简单：你可以直接购买名单并给每个人发送邮件。然而，这种蛮力方法效率低下，并且会产生有限的 ROI，因为对大多数收件人来说，这无异于垃圾邮件。使用这种无针对性的方法，你不太可能实现目标，因为它会导致非常低的响应率。


    更好的方法是使用预测分析来定位最有可能购买你自行车的潜在客户，例如最有可能购买自行车的客户。这类预测分析被称为买家倾向模型或客户定位模型。通过这种方法，你可以构建模型来预测潜在客户对你的邮件营销活动做出响应的可能性。


    在本章中，我们将向你展示如何在 Azure 机器学习中构建这类模型。使用完成的模型，你将给潜在客户打分，并且只给那些最有可能对你的活动做出响应的客户发送邮件。我们还将展示如何在有限的营销预算下最大化
    ROI。


    ![Image](img/00013.jpeg) **注意**  你需要拥有一个 Azure 机器学习帐户。如果你还没有帐户，请参阅第 2 章了解如何设置新帐户的说明。


    正如你在第 1 章中看到的，数据科学流程通常遵循以下五个步骤。


    1.  定义业务问题。

    2.  数据获取与准备。

    3.  模型开发。

    4.  模型部署。

    5.  监控模型性能。


    在定义了业务问题之后，你将在本章的其余部分探索数据获取与准备、模型开发和评估。


    数据获取与准备

    '
- fmt: "# In this section, you will see how to load data from different sources and\
    \ analyze it in Azure Machine Learning\n\nIn this section, you will see how to\
    \ load data from different sources and analyze it in Azure Machine Learning. Azure\
    \ Machine Learning enables you to load data from several sources including your\
    \ local machine, the Web, a SQL database on Azure, Hive tables, or Azure Blob\
    \ Storage.\n\n## Loading Data from Your Local File System\n\nThe easiest way to\
    \ load data is from your local machine. Follow these steps.\n\n1. Point your browser\
    \ to the URL [https://studio.azureml.net](https://studio.azureml.net) and log\
    \ into your workspace in Azure Machine Learning.\n2. Next, click the **Experiments**\
    \ item from the menu on the left pane.\n3. Click the **+New** button at the bottom\
    \ left side of the window, and then select **Dataset** from the new menu shown\
    \ in [Figure 5-1](#part0015.html#Fig1).\n\n![9781484204467_Fig05-01.jpg](images/00071.jpeg)\n\
    \n[Figure 5-1](#part0015.html#_Fig1). Loading a new dataset from your local machine\n\
    \n4. When you choose the option **From Local File** you will be prompted to select\
    \ the data file to load from your machine.\n\nYou used these steps to load the\
    \ `BikeBuyer.csv` file from your local file system into Azure Machine Learning.\n\
    \n## Loading Data from Other Sources\n\nYou can load data from non-local sources\
    \ using the `Reader` module in Azure Machine Learning. Specifically, with the\
    \ `Reader` module you can load data from the Web, a SQL database on Azure, Azure\
    \ table, Azure Blob storage, or Hive tables. To do this you will have to create\
    \ a new experiment before calling the `Reader` module. Use the following steps\
    \ to load data from any of the above sources with the `Reader` module.\n\n1. Point\
    \ your browser to the URL [https://studio.azureml.net](https://studio.azureml.net)\
    \ and log into your workspace in Azure Machine Learning.\n2. Next, click the **Experiments**\
    \ item from the menu on the left pane.\n3. Click the **+New** button at the bottom\
    \ left side of the window, and then select **Experiment** from the new menu. A\
    \ new experiment is launched with a blank canvas, as shown in [Figure 5-2](#part0015.html#Fig2).\n\
    \n![9781484204467_Fig05-02.jpg](images/00072.jpeg)\n\n[Figure 5-2](#part0015.html#_Fig2).\
    \ Starting a new experiment in Azure Machine Learning\n\n4. Open the **Data Input\
    \ and Output** menu item and you will see two modules, **Reader** and **Writer**.\n\
    5. Drag the **Reader** module from the menu to any position on the canvas.\n6.\
    \ Click the **Reader** module in the canvas and its properties will be shown on\
    \ the right pane under **Reader**. Now specify the data source in the dropdown\
    \ menu and then enter the values of all required parameters. [Figure 5-3](#part0015.html#Fig3)\
    \ shows the completed parameters we entered to read the `BikeBuyer.csv` file from\
    \ our Azure Blob storage account. The `Account Name` and `Account Key` refer to\
    \ a storage account on Microsoft Azure. You can obtain these parameters from the\
    \ Azure portal as follows.\n   1. Login to Microsoft Azure at [http://azure.microsoft.com](http://azure.microsoft.com).\n\
    \   2. On the top menu, click **Portal**. This takes you to the Azure portal.\n\
    \   3. Select **storage** from the menu on the left pane. This lists all your\
    \ storage accounts in the right pane.\n   4. Click the storage account that contains\
    \ the data you need for your machine learning model.\n   5. At the bottom of the\
    \ screen, click the key icon labeled **Manage Access Keys**. Your storage account\
    \ name and access keys will be displayed. Use the Primary Access Key as your `Account\
    \ Key` in the **Reader** module in Azure Machine Learning.\n\n![9781484204467_Fig05-03.jpg](images/00073.jpeg)\n\
    \n[Figure 5-3](#part0015.html#_Fig3). Loading the `BikeBuyer.csv` file from Azure\
    \ Blob storage using the `Reader` module\n\n![Image](images/00013.jpeg) **Note**\
    \ You can load several datasets from multiple sources into Azure Machine Learning\
    \ using the above instructions. Note, however, that each `Reader` module only\
    \ loads a single dataset at a time.\n\n## Data Analysis\n\nWith the data loaded\
    \ in Azure Machine Learning, the next step is to do pre-processing to prepare\
    \ the data for modeling. It is always very useful to visualize the data as part\
    \ of this process. You can visualize the Bike Buyer dataset either from the `Reader`\
    \ module or by selecting `BikeBuyer.csv` from the **Saved Datasets** menu item\
    \ in the left pane. When you hover over the small circle at the bottom of the\
    \ `Reader` module, a menu is opened giving you two options: **Download** or **Visualize**.\
    \ See [Figure 5-4](#part0015.html#Fig4) for details. If you choose the **Download**\
    \ option, you can save the data to your local machine and open it in Excel to\
    \ view the data. Alternatively, you can visualize the data in Azure Machine Learning\
    \ by choosing the **Visualize** option.\n\n![9781484204467_Fig05-04.jpg](images/00074.jpeg)\n\
    \n[Figure 5-4](#part0015.html#_Fig4). Two options for visualizing data in Azure\
    \ Machine Learning\n\nIf you choose the **Visualize** option, the data will be\
    \ rendered in a new window, as shown in [Figure 5-5](#part0015.html#Fig5). [Figure\
    \ 5-5](#part0015.html#Fig5) shows the `BikeBuyer.csv` dataset that has historical\
    \ sales data on all customers. You can see that this dataset has 10,000 rows and\
    \ 13 columns including demographic variables such as marital status, gender, yearly\
    \ income, number of children, occupation, age, etc. Other variables include home\
    \ ownership status, number of cars, and commute distance. The last column, called\
    \ `Bike Buyer`, is very important since it shows which customers bought bikes\
    \ from your stores in the past.\n\n![9781484204467_Fig05-05.jpg](images/00075.jpeg)\n\
    \n[Figure 5-5](#part0015.html#_Fig5). Visualizing the Bike Buyer dataset in Azure\
    \ Machine Learning\n\n[Figure 5-5](#part0015.html#Fig5) also shows descriptive\
    \ statistics such as mean, median, standard deviation, etc. for all variables\
    \ in the dataset. In addition, it shows the data type of each variable and the\
    \ number of missing values. By scrolling down you will see a sample of the dataset\
    \ showing actual values.\n\nThe first row at the top of the feature list is a\
    \ set of thumbnails showing the distribution of each variable. You can see the\
    \ full distribution by clicking on the thumbnail. For instance, if you click the\
    \ thumbnail above yearly income, Azure Machine Learning opens the full histogram\
    \ in the right pane of the screen; this is shown in [Figure 5-6](#part0015.html#Fig6).\
    \ This histogram shows you the distribution of the selected variable, and you\
    \ can start to think about the ways in which it can be used in your model. For\
    \ instance, in [Figure 5-6](#part0015.html#Fig6), you can see clearly that yearly\
    \ income is not drawn from a normal distribution. If anything, it looks more like\
    \ a lognormal distribution. You can also spot outliers in the histogram. Azure\
    \ Machine Learning lets you overlay a probability density function or a cumulative\
    \ distribution on the histogram.\n\n![9781484204467_Fig05-06.jpg](images/00076.jpeg)\n\
    \n[Figure 5-6](#part0015.html#_Fig6). A histogram of yearly income\n\nWith Azure\
    \ Machine Learning, you can also transform your data to a log scale. This is an\
    \ important technique for capturing valid outliers that cannot be dropped. For\
    \ instance, if your prospective targets include high income customers, it would\
    \ be unwise to simply drop high income people as outliers. Log transformation\
    \ is a better way to capture extreme incomes. [Figure 5-7](#part0015.html#Fig7)\
    \ shows the yearly income transformed with the log scale on the x-axis.\n\n![9781484204467_Fig05-07.jpg](images/00077.jpeg)\n\
    \n[Figure 5-7](#part0015.html#_Fig7). Transforming yearly income on a log scale\n\
    \nAnother useful visualization tool in Azure Machine Learning is the box-and-whisker\
    \ plot that is widely used in statistics. You can visualize your continuous variables\
    \ with a box-and-whisker plot instead of a histogram. To do this, select the box-and-whisker\
    \ icon in the first thumbnail labeled **view as**."
