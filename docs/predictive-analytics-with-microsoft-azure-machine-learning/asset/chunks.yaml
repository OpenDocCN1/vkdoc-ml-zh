    Foreword


    Few people appreciate the enormous potential of machine learning (ML) in enterprise
    applications. I was lucky enough to get a taste of its potential benefits just
    a few months into my first job. It was 1995 and credit card issuers were beginning
    to adopt neural network models to detect credit card fraud in real time. When
    a credit card is used, transaction data from the point of sale system is sent
    to the card issuer’s credit authorization system where a neural network scores
    for the probability of fraud. If the probability is high, the transaction is declined
    in real time. I was a scientist building such models and one of my first model
    deliveries was for a South American bank. When the model was deployed, the bank
    identified over a million dollars of previously undetected fraud on the very first
    day. This was a big eye-opener. In the years since, I have seen ML deliver huge
    value in diverse applications such as demand forecasting, failure and anomaly
    detection, ad targeting, online recommendations, and virtual assistants like Cortana.
    By embedding ML into their enterprise systems, organizations can improve customer
    experience, reduce the risk of systemic failures, grow revenue, and realize significant
    cost savings.


    However, building ML systems is slow, time-consuming, and error prone. Even though
    we are able to analyze very large data sets these days and deploy at very high
    transaction rates, the following bottlenecks remain:


    *   ML system development requires deep expertise. Even though the core principles
    of ML are now accessible to a wider audience, talented data scientists are as
    hard to hire today as they were two decades ago.

    *   Practitioners are forced to use a variety of tools to collect, clean, merge,
    and analyze data. These tools have a steep learning curve and are not integrated.
    Commercial ML software is expensive to deploy and maintain.

    *   Building and verifying models requires considerable experimentation. Data
    scientists often find themselves limited by compute and storage because they need
    to run a large number of experiments that generate considerable new data.

    *   Software tools do not support scalable experimentation or methods for organizing
    experiment runs. The act of collaborating with a team on experiments and sharing
    derived variables, scripts, etc. is manual and ad-hoc without tools support. Evaluating
    and debugging statistical models remains a challenge.


    Data scientists work around these limitations by writing custom programs and by
    doing undifferentiated heavy lifting as they perform their ML experiments. But
    it gets harder in the deployment phase. Deploying ML models in a mission-critical
    business process such as real-time fraud prevention or ad targeting requires sophisticated
    engineering. The following needs must be met:


    *   Typically, ML models that have been developed offline now have to be reimplemented
    in a language such as C++, C#, or Java.

    *   The transaction data pipelines have to be plumbed. Data transformations and
    variables used in the offline models have to be recoded and compiled.

    *   These reimplementations inevitably introduce bugs, requiring verification
    that the models work as originally designed.

    *   A custom container for the model has to be built, with appropriate monitors,
    metrics, and logging.

    *   Advanced deployments require A/B testing frameworks to evaluate alternative
    models side-by-side. One needs mechanisms to switch models in or out, preferably
    without recompiling and deploying the entire application.

    *   One has to validate that the candidate production model works as originally
    designed through statistical tests.


    The automated decisions made by the system and the business outcomes have to be
    logged for refining the ML models and for monitoring.


    The service has to be designed for high availability, disaster recovery, and geo-proximity
    to end points.


    When the service has to be scaled to meet higher transaction rates and/or low
    latency, more work is required to provision new hardware, deploy the service to
    new machines, and scale out.


    All of these are time-consuming and engineering-intensive steps, expensive in
    terms of both infrastructure and manpower. The end-to-end engineering and maintenance
    of a production ML application requires a highly skilled team that few organizations
    can build and sustain.


    Microsoft Azure ML was designed to solve these problems.'
