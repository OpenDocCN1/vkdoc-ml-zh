- fmt: 'When performing clustering, the user will need to specify the distance measure
    between any two points in the space. In ML Studio, this is defined by the `Metric`
    property. Two distance measures are supported: Euclidean (also known as L2 norm)
    and cosine distance. Depending on the characteristics of the input data and the
    use case, the user should select the relevant `Metric` property used by k-means
    clustering.


    ![Image](images/00013.jpeg) **Note** When performing clustering, it is important
    to be able to measure the distance (or similarity) between points and vectors.
    The Euclidean and cosine distances are common distance measures that are used.


    *Euclidean distance*: Given two points, `p1` and `p2`, the Euclidean distance
    between `p1` and `p2` is the length of the line segment that connects the two
    points. The Euclidean distance can also be used to measure the distance between
    two vectors.


    *Cosine distance*: Given two vectors `v1` and `v2`, the cosine distance is the
    cosine of the angle between `v1` and `v2`.


    The choice of the distance measure to use is often domain-specific.


    Euclidean distance is sensitive to the scale/magnitude of the vectors that are
    compared. It is important to note that even though two vectors can be relatively
    similar, but if the scale of the features are significantly different, the Euclidean
    distance might show that the two vectors are different. In such cases, cosine
    distance is often used, since regardless of the scale, the cosine angle between
    the two vectors would have been small.


    After selecting the metric for the distance measure, you will need to choose the
    centroid initialization algorithm. In Azure Machine Learning, this is defined
    by the `Initialization` property. Five centroid initialization algorithms are
    supported. [Table 7-1](#part0017.html#Tab1) shows the different centroid initialization
    algorithms.


    [Table 7-1](#part0017.html#_Tab1). K-means Cluster, Centroid Initialization Algorithms


    | Centroid Initialization Algorithm | Description |

    | --- | --- |

    | **Default** | Picks first N points as initial centroids |

    | **Random** | Picks initial centroids randomly |

    | **K-Means++** | K-means++ centroid initialization |

    | **K-Means+ Fast** | K-means++ centroid initialization with P:=1 (where the farthest
    centroid is picked in each iteration of the algorithm) |

    | **Evenly** | Picks N points evenly as initial centroids |


    These properties have already been pre-configured for you in the sample experiments.


    At this point, you are ready to run the experiment. Click **Run** on the bottom
    panel of ML Studio. Once the experiment has successfully executed, two sets of
    clusters have been produced. The **Metadata Editor** module is used to change
    the metadata associated with columns in the dataset to include the assigned cluster.
    In addition, the **Convert to CSV** module is used to convert the results to comma-separate
    values, which allows you to download the result set.


    Congratulations! You have successfully run your first company segmentation experiment
    using the **K-Means Clustering** module in ML Studio.


    ## Customer Segmentation of Wholesale Customers


    From the earlier section, you learned the key modules used in the sample experiment
    (`K-Means Clustering`, `Train Clustering Model`) to perform customer segmentation.


    In this section, you will learn step-by-step how to build the clustering model
    to perform customer segmentation for a wholesale customer dataset.


    ![Image](images/00013.jpeg) **Note** The wholesale customers dataset is available
    on the UCI Machine Learning Repository. The dataset contains eight columns (referred
    to as attributes or features) and contains information on the customers of a wholesale
    distributor, operating in different regions.


    The columns include annual spending on fresh milk, grocery, frozen, detergents,
    paper, and delicatessen products. In addition, it also includes information on
    the channel of the customer (hotel/café/restaurant) or retail.


    Refer to [http://archive.ics.uci.edu/ml/datasets/Wholesale](http://archive.ics.uci.edu/ml/datasets/Wholesale)+customers.


    ## Loading the Data from the UCI Machine Learning Repository


    Let’s get started by using a `Reader` module to retrieve the data from the UCI
    Machine Repository. To do this, drag and drop a **Reader** module (Data Input
    and Output) from the toolbox. Next, configure the `Reader` module to read from
    the Http source, and provide the URL for the dataset: [http://archive.ics.uci.edu/ml/machine-learning-databases/00292/Wholesale%20customers%20data.csv](http://archive.ics.uci.edu/ml/machine-learning-databases/00292/Wholesale%20customers%20data.csv)


    [Figure 7-7](#part0017.html#Fig7). shows the `Reader` module and its configuration.


    ![9781484204467_Fig07-07.jpg](images/00124.jpeg)


    [Figure 7-7](#part0017.html#_Fig7). Using the `Reader` module to read data from
    a HTTP data source


    ## Using K-Means Clustering for Wholesale Customer Segmentation


    For this experiment, you will use all eight columns from the dataset as inputs
    for performing clustering. To do this, drag and drop the **K-Means Clustering**
    and **Train Clustering Model**, and connect the modules together based on what
    is shown in [Figure 7-8](#part0017.html#Fig8).


    ![9781484204467_Fig07-08.jpg](images/00125.jpeg)


    [Figure 7-8](#part0017.html#_Fig8). Using K-Means Clustering and the Train Clustering
    model


    To configure each of the modules, click on the module, and specify the values
    using the **Properties** pane on the right side of the screen. For the `K-Means
    Clustering` module, configure it to identify four clusters (**Number of Centroids
    = 4**), and use the **Euclidean** distance measure. Use the default 100 number
    of iterations. For the `Train Clustering Mode` module, configure it to use **all**
    the features when performing clustering.


    Finally, you will want to visualize the results after the experiment has run successfully.
    To do this, you will use the **Metadata Editor** module. Configure the `Metadata
    Editor` such that it uses **all** the features that are produced by the **Train
    Clustering Model** module. [Figure 7-9](#part0017.html#Fig9). shows the final
    design of the clustering experiment.


    ![9781484204467_Fig07-09.jpg](images/00126.jpeg)


    [Figure 7-9](#part0017.html#_Fig9). Completed experiment to perform wholesale
    customer segmentation


    After the experiment has successfully run, you will be able to right-click the
    **Results** dataset output of the **Metadata Editor** module to see the cluster
    assignment (shown in [Figure 7-10](#part0017.html#Fig10)).


    ![9781484204467_Fig07-10.jpg](images/00127.jpeg)


    [Figure 7-10](#part0017.html#_Fig10). Histogram showing cluster assignments for
    wholesale customers


    ## Cluster Assignment for New Data


    What happens if you have new customers, and you want to assign them to one of
    the clusters that you identified? In this section, you will learn how to use the
    **Assign to Cluster** module.


    In this example, you will first split the input dataset into two sets. The first
    set will be used for training the clustering model, and the second set will be
    used for cluster assignments. For practical use cases, the second dataset will
    be new data that you have newly acquired (e.g. new customers whom you want to
    assign to a cluster). To split the input dataset, you will use the **Split** module
    (in **Data Transformation ![image](images/00044.jpeg) Sample and Split**), and
    configure it such that it redirects 90% of the input data to its first output,
    and the remaining 10% to the second output. You will use the data from the first
    output of the `Split` module to train the clustering model.'
