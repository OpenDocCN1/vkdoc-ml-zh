    # 构建流失模型


    在本章中，我们将揭示构建客户流失模型的秘诀，这类模型需求量很大。许多行业使用流失分析作为减少客户流失的手段。本章将展示在Microsoft Azure机器学习中构建客户流失模型的整体视图。


    ## 流失模型简述


    企业需要制定有效的客户流失管理策略，因为吸引新客户的成本高于留住现有客户。客户流失可以表现为不同形式，例如转向竞争对手的服务、减少使用服务的时间、减少使用的服务数量，或转向低成本服务。零售、媒体、电信和银行业的公司使用流失建模来创造更好的产品、服务和体验，从而提高客户留存率。


    让我们深入探讨为什么流失建模对电信公司如此重要。许多电信公司的消费者业务在一个竞争极其激烈的市场中运营。在许多国家，通常有两家或更多电信公司争夺同一客户。此外，移动号码可携带性使客户更容易切换到其他电信提供商。


    许多电信公司在其年度报告中跟踪流失水平。流失模型的使用使电信提供商能够制定有效的业务策略来留住客户，并防止潜在的收入损失。'
  raw: 'The **Evaluate Model** module is used to measure the performance of a trained
    model. This module takes two datasets as inputs. The first is a scored dataset
    from a tested model. The second is an optional dataset for comparison. After running
    the experiment you can check your model’s performance by clicking the **small
    circle** at the bottom of the module **Evaluate Model**. This module provides
    the following metrics to measure the performance of a classification model such
    as the propensity model:


    *   The **Receiver Operating Characteristic** (ROC) curve that plots the rate
    of true positives to false positives.

    *   The **Lift curve** (also known as the Gains curve) that plots the number of
    true positives versus the positive rate. This is popular in marketing.

    *   **Precision versus recall** chart.

    *   **Confusion matrix** that shows type I and II errors.


    [Figure 5-15](#part0015.html#Fig15) shows the ROC curve for the propensity model
    you built earlier. The ROC curve visually shows the performance of a predictive
    binary classification model. The diagonal line from (0,0) to (1,1) on the chart
    shows the performance of random guessing; so if you randomly selected who to target,
    your response would be on this diagonal line. A good predictive model should do
    much better than random guesses. Hence, on the ROC curve, a good model should
    fall above the diagonal line. The ideal model that is 100% accurate will have
    a vertical line from (0,0) to (0,1), followed by a horizontal line from (0,1)
    to (1,1).


    ![9781484204467_Fig05-15.jpg](images/00086.jpeg)


    [Figure 5-15](#part0015.html#_Fig15). The ROC curve for the customer propensity
    model


    One way to measure the performance from the ROC curve is to measure the area under
    the curve (AUC). The higher the area under the curve, the better the model’s performance.
    The ideal model will have an AUC of 1.0, while a random guess will have an AUC
    of 0.5\. The logistic regression model you built has an AUC of 0.689, which is
    much better random guess!


    [Figure 5-16](#part0015.html#Fig16) shows the confusion matrix for the logistic
    regression model you built earlier. The confusion matrix has four cells, namely


    *   **True positives**: These are cases where the customer actually bought a bike
    and the model correctly predicts this.

    *   **True negatives**: In the historical dataset these customers did not buy
    bikes, and the model correctly predicts that they would not buy.

    *   **False positives**: In this case, the model incorrectly predicts that the
    customer would buy a bike when in fact they did not. This is commonly referred
    to as Type I error. The logistic regression you built had only two false positives.

    *   **False negatives**: Here the model incorrectly predicts that the customer
    would not buy a bike when in real life the customer did buy one. This is also
    known as Type II error. The logistic regression model had up to 276 false negatives.


    ![9781484204467_Fig05-16.jpg](images/00087.jpeg)


    [Figure 5-16](#part0015.html#_Fig16). Confusion matrix and more performance metrics


    In addition, [Figure 5-16](#part0015.html#Fig16) also shows the accuracy, precision,
    and recall of the model. Here are the formulas for these metrics.


    Precision is the rate of true positives in the results.


    ![image](images/00088.jpeg)


    Recall is the percentage of buyers that the model identifies and is measured as


    ![image](images/00089.jpeg)


    Finally, the accuracy measures how well the model correctly identifies buyers
    and non-buyers, as in


    ![image](images/00090.jpeg)


    where tp = true positive, tn = true negative, fp = false positive, and fn = false
    negative.


    You can also compare the performance of two models on a single ROC chart. As an
    example, let’s modify the experiment in [Figure 5-14](#part0015.html#Fig14) to
    use the **Two-class Boosted Decision tree** module as the second trainer instead
    of the **Two-class Logistic Regression** module. Now your experiment has two different
    classifiers, the Two-class Logistic Regression on the left branch and the Two-class
    Boosted Decision Tree on the right branch. You connect the scored datasets from
    both models into the same **Evaluate Model** module. The updated experiment is
    shown in [Figure 5-17](#part0015.html#Fig17) and the results are illustrated in
    [Figure 5-18](#part0015.html#Fig18). On this chart, the curve labeled “scored
    dataset to compare” is the ROC curve for the **Two-class Boosted Decision Tree**
    model, while the one labeled “scored dataset” is the one for the **Two-class Logistic
    Regression**. You can see clearly that the boosted decision tree model outperforms
    the logistic regression model, as it has a higher lift over the diagonal line
    for random guesses. The area under the curve (AUC) for the boosted decision tree
    model is 0.722, which is better than that of the logistic regression model, which
    was 0.689, as you saw earlier.


    ![9781484204467_Fig05-17.jpg](images/00091.jpeg)


    [Figure 5-17](#part0015.html#_Fig17). Updated experiment that compares two models
    with the same Evaluate Model module


    ![9781484204467_Fig05-18.jpg](images/00092.jpeg)


    [Figure 5-18](#part0015.html#_Fig18). ROC curves comparing the performance of
    two predictive models, the boosted decision tree versus logistic regression


    Summary


    In this chapter, we provided a practical guide on how to build buyer propensity
    models with the Microsoft Azure Machine Learning service. Through a step-by-step
    guide in this chapter we explained how to build buyer propensity models in Microsoft
    Azure Machine Learning service. You learned how to perform data pre-processing
    and analysis, which are critical steps towards understanding the data that you
    are using for building customer propensity models. With that understanding of
    the data, you used a two-class logistic regression and a two-class boosted decision
    tree algorithm to perform classification. You also saw how to evaluate the performance
    of your models and avoid over-fitting.


    CHAPTER 6


    ![image](images/00007.jpeg)


    Building Churn Models


    In this chapter, we reveal the secrets of building customer churn models, which
    are in very high demand. Many industries use churn analysis as a means of reducing
    customer attrition. This chapter will show a holistic view of building customer
    churn models in Microsoft Azure Machine Learning.


    Churn Models in a Nutshell


    Businesses need to have an effective strategy for managing customer churn because
    it costs more to attract new customers than to retain existing ones. Customer
    churn can take different forms, such as switching to a competitor’s service, reducing
    the time spent using the service, reducing the number of services used, or switching
    to a lower-cost service. Companies in the retail, media, telecommunication, and
    banking industries use churn modeling to create better products, services, and
    experiences that lead to a higher customer retention rate.


    Let’s drill deeper into why churn modeling matters to telecommunication companies.
    The consumer business of many telecommunication companies operates in an immensely
    competitive market.  In many countries, it is common to have two or more telecommunication
    companies competing for the same customer. In addition, mobile number portability
    makes it easier for customers to switch to another telecommunication provider.


    Many telecommunication companies track churn levels as part of their annual report.
    The use of churn models has enabled telecommunication providers to formulate effective
    business strategies for customer retention, and to prevent potential revenue loss.'
