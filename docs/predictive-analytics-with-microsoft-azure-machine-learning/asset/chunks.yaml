    Buyer`）有两个类别。因此，您可以使用 **Classification** 子类别下的任何两类算法。要查看完整的算法列表，请在左侧窗格中展开名为 **Initialize
    Model** 的类别。展开名为 **Classification** 的子类别，Azure 机器学习将列出所有可用的分类算法。我们建议尝试其中的几种算法，直到找到最适合该任务的算法。[Figure
    5-13](#part0015.html#Fig13) 展示了一个针对自行车购买者倾向性模型的简单但完整的实验。


