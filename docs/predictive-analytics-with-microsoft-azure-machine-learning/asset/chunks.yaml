  trans: "\n使用 R 进行数据预处理\n\n在许多机器学习任务中，降维是一个重要步骤，用于减少机器学习算法的特征数量。主成分分析（PCA）是一种常用的降维技术。PCA\
    \ 通过寻找一组新的变量（主成分）来降低数据集的维度，这些变量是原始数据集的线性组合，并且与所有其他变量不相关。在本节中，您将学习如何使用 R 进行数据预处理并降低数据集的维度。\n\
    \n让我们开始使用 **执行 R 脚本** 模块对 ML Studio 中提供的示例数据集之一进行主成分分析。请按照以下步骤操作。\n\n1.  创建一个新实验。\n\
    2.  从“已保存的数据集”中，选择 **CRM 数据集共享**（参见图 3-6）。\n\n![9781484204467_Fig03-06.jpg](img/00037.jpeg)\n\
    \n图 3-6。使用示例数据集 CRM 数据集共享\n\n3.  右键单击输出节点，然后选择 **可视化**。从图 3-7 所示的可视化中，您将看到有 230\
    \ 列。\n\n![9781484204467_Fig03-07.jpg](img/00038.jpeg)\n\n图 3-7。CRM 共享数据集中的初始 230\
    \ 列\n\n4.  在执行 PCA 之前，您需要确保 **执行 R 脚本** 模块的输入是数值型的。对于 CRM 数据集共享的示例数据集，您知道前 190\
    \ 列是数值型的，其余 40 列是分类型的。您首先使用 **投影列**，并将 **选定列 |** 列索引设置为 1-190。\n5.  接下来，使用 **缺失值清理器**\
    \ 模块将缺失值替换为 0，如下所示：\n    1.  对于缺失值：自定义替换值\n    2.  替换为值：0\n    3.  全部缺失的列：保留列\n\
    \    4.  缺失值指示列：不生成\n6.  清理完缺失值后，使用 **元数据编辑器** 模块将所有列的数据类型更改为整数。\n7.  接下来，将 **执行\
    \ R 脚本** 模块拖放到设计界面并连接模块，如图 3-8 所示。\n\n![9781484204467_Fig03-08.jpg](img/00039.jpeg)\n\
    \n图 3-8。使用执行 R 脚本模块执行 PCA\n\n8.  单击 **执行 R 脚本** 模块。您可以提供以下脚本，该脚本将用于执行 PCA：\n\n\
    ```\n    # 将基于 1 的可选输入端口映射到变量\n    dataset1 <- maml.mapInputPort(1)\n    # 对前\
    \ 190 列执行 PCA\n    pca = prcomp(dataset1[,1:190])\n\n# 返回前 10 个主成分\n    top_pca_scores\
    \ = data.frame(pca$x[,1:10])\n    data.set = top_pca_scores\n    plot(data.set)\n\
    \    # 选择要发送到输出数据集端口的数据框\n    maml.mapOutputPort(\"data.set\");\n    ```\n\n图\
    \ 3-9 展示了如何在 ML Studio 中使用该脚本。\n\n![9781484204467_Fig03-09.jpg](img/00040.jpeg)\n\
    \n图 3-9。对前 190 列执行 PCA\n\n9.  单击 **运行**。\n10.  实验成功执行后，单击 **执行 R 脚本** 模块的 **结果数据集**\
    \ 节点。单击 **可视化**。\n11.  图 3-10 显示了 CRM 共享数据集的前十个主成分。这些主成分将在后续步骤中用于构建分类模型。\n\n![9781484204467_Fig03-10.jpg](img/00041.jpeg)\n\
    \n图 3-10。为 CRM 共享数据集识别的主成分\n\n![Image](img/00013.jpeg) **提示** 您还可以提供一个包含 R 脚本的\
    \ Zip 文件作为脚本包，并在 **执行 R 脚本** 模块中使用它。\n\n使用脚本包（Zip）\n\n如果您有一个一直在使用的 R 脚本，并希望将其用作实验的一部分，您可以将该\
    \ R 脚本打包成 Zip 文件，然后作为数据集上传到 ML Studio。要配合 **执行 R 脚本** 模块使用脚本包，您首先需要将文件打包成 Zip\
    \ 格式，请按照以下步骤操作。\n\n1.  导航到包含您打算在实验中使用的 R 脚本的文件夹（参见图 3-11）。\n\n![9781484204467_Fig03-11.jpg](img/00042.jpeg)\n\
    \n图 3-11。包含 R 脚本 pcaexample.r 的文件夹\n\n2.  选择所有要打包的文件并右键单击。在本示例中，右键单击文件 **pcaexample.r**，然后选择\
    \ **发送到压缩（zipped）文件夹**，如图 3-12 所示。\n\n![9781484204467_Fig03-12.jpg](img/00043.jpeg)\n\
    \n图 3-12。将 R 脚本打包为 ZIP 文件\n\n3.  接下来，将 zip 文件上传到 ML Studio。为此，选择 **新建数据集 ![image](img/00044.jpeg)\
    \ 来自本地文件**。选择您要上传的 Zip 文件，如图 3-13 和图 3-14 所示。\n\n![9781484204467_Fig03-13.jpg](img/00045.jpeg)\n\
    \n图 3-13。新建数据集 ![image](img/00044.jpeg) 来自本地文件\n\n![9781484204467_Fig03-14.jpg](img/00046.jpeg)\n\
    \n图 3-14。上传新数据集\n\n4.  数据集上传后，您可以在实验中使用它。为此，从 **已保存的数据集** 中选择 **上传的 Zip 文件**，并将其拖放到实验中。\n\
    5.  将上传的 Zip 文件连接到 **执行 R 脚本** 模块的 **脚本包（Zip）** 输入，如图 3-15 所示。\n\n![9781484204467_Fig03-15.jpg](img/00047.jpeg)\n\
    \n图 3-15。使用脚本包作为执行 R 脚本模块的输入\n\n6.  在 **执行 R 脚本** 模块中，指定 R 脚本的位置，如下所示，如图 3-16\
    \ 所示：\n\n```\n    # 将基于 1 的可选输入端口映射到变量\n    dataset1 <- maml.mapInputPort(1)\n\
    \    # 可选 Zip 端口的内容位于 ./src/ 中\n    source(\"src/pcaexample.r\");\n\n# 选择要发送到输出数据集端口的数据框\n\
    \    maml.mapOutputPort(\"data.set\");\n    ```\n\n![9781484204467_Fig03-16.jpg](img/00048.jpeg)\n\
    \n图 3-16。使用脚本包作为执行 R 脚本模块的输入\n\n7.  现在，您可以使用已上传到 ML Studio 的 Zip 文件中的 R 脚本运行实验。使用脚本包可以轻松引用一个您可以在\
    \ ML Studio 外部测试的 R 脚本文件。要更新脚本，您需要重新上传 Zip 文件。\n\n使用 R 构建和部署决策树\n\n在本节中，您将学习如何使用\
    \ R 构建机器学习模型。使用 R 时，您可以利用大量 R 包，这些包实现了各种机器学习算法，用于分类、聚类、回归、K 近邻、购物篮分析等。\n\n![Image](img/00013.jpeg)\
    \ **注意** 当您使用 R 中可用的机器学习算法并通过 **执行 R** 模块执行它们时，您只能可视化模型和参数。您无法保存训练好的模型并将其用作其他\
    \ ML Studio 模块的输入。\n\n使用 ML Studio，提供了几种 R 机器学习算法。例如，您可以使用 **R 自动 ARIMA** 模块为单变量时间序列构建最优自回归移动平均模型。您还可以使用\
    \ **R K 近邻分类** 模块创建 K 近邻（KNN）分类模型。\n\n在本节中，您将学习如何使用一个名为 **rpart** 的 R 包来构建决策树。**rpart**\
    \ 包为您提供了用于执行分类和回归的递归划分算法。\n"
- fmt: "![Image](images/00013.jpeg) **Note** Learn more about the **rpart** R package\
    \ at [http://cran.r-project.org/web/packages/rpart/rpart.pdf](http://cran.r-project.org/web/packages/rpart/rpart.pdf).\n\
    \nFor this exercise, you will use the Adult Census Income Binary Classification\
    \ dataset. Let’s get started.\n\n1.  From the toolbox, drag and drop the following\
    \ modules on the experiment design area:\n    1.  **Adult Census Income Binary\
    \ Classification** dataset (available under **Saved Datasets**)\n    2.  **Project\
    \ Columns** (available from Data **Transformation ![image](images/00044.jpeg)\
    \ Manipulation**)\n    3.  **Execute R Script** module (found under **R Language**\
    \ modules)\n2.  Connect the **Adult Census Income Binary Classification** dataset\
    \ to **Project Columns**.\n3.  Click **Project Columns** to select the columns\
    \ that will be used in the experiment. Select the following columns: `age`, `sex`,\
    \ `education`, `income`, `marital-status`, `occupation`.\n\n[Figure 3-17](#part0011.html#Fig17)\
    \ shows the selection of the columns and [Figure 3-18](#part0011.html#Fig18) shows\
    \ the completed experiment and the Project Columns properties.\n\n![9781484204467_Fig03-17.jpg](images/00049.jpeg)\n\
    \n[Figure 3-17](#part0011.html#_Fig17). Selecting columns that will be used\n\n\
    ![9781484204467_Fig03-18.jpg](images/00050.jpeg)\n\n[Figure 3-18](#part0011.html#_Fig18).\
    \ Complete Experiment\n\n4.  Connect the **Project Columns** to **Execute R Script**.\n\
    5.  Click **Execute R Script** and provide the following script. [Figure 3-19](#part0011.html#Fig19)\
    \ shows the R script in ML studio.\n\n```\nlibrary(rpart)\n\n# Map 1-based optional\
    \ input ports to variables\nDataset1 <- maml.mapInputPort(1) # class: data.frame\n\
    \nfit <- rpart(income ~ age + sex + education + occupation, method=\"class\",\
    \ data=Dataset1)\n\n# display the results, and summary of the splits\nprintcp(fit)\n\
    plotcp(fit)\nsummary(fit)\n\n# plot the decision tree\nplot(fit, uniform=TRUE,\
    \ margin = 0.1, compress = TRUE, main=\"Classification Tree for Census Dataset\"\
    )\ntext(fit, use.n=TRUE, all=TRUE, cex=0.8, pretty=1)\n\ndata.set = Dataset1\n\
    \n# Select data.frame to be sent to the output Dataset port\nmaml.mapOutputPort(\"\
    data.set\");\n```\n\n![9781484204467_Fig03-19.jpg](images/00051.jpeg)\n\nFigure\
    \ 3-19\\. Experiment for performing classification using R script\n\nIn the R\
    \ script, first load the `rpart` library using `library()`. Next, map the dataset\
    \ that is passed to the **Execute R Script** module to a data frame.\n\nTo build\
    \ the decision tree, you will use the `rpart` function. Several type of methods\
    \ are supported by `rpart`: `class` (classification), and `anova` (regression).\
    \ In this exercise, you will use `rpart` to perform classification (i.e. `method=\"\
    class\"`), as follows:\n\n![9781484204467_unFig03-01.jpg](images/00052.jpeg)\n\
    \nThe formula specified uses the format: `predictionVariable ~ inputfeature1 +\
    \ inputfeature2 + ...`\n\nAfter the decision tree has been constructed, the R\
    \ script invokes the `printcp()`, `plotcp()`, and `summary()` functions to display\
    \ the results, and a summary of each of the split values in the tree. In the R\
    \ script, the `plot()` function is used to plot the `rpart` model. By default,\
    \ when the `rpart` model is plotted, an abbreviated representation is used to\
    \ denote the split value. In the R script, the setting of `pretty=1` is added\
    \ to enable the actual split values to be shown (see [Figure 3-20](#part0011.html#Fig20)).\n\
    \n![9781484204467_Fig03-20.jpg](images/00053.jpeg)\n\n[Figure 3-20](#part0011.html#_Fig20).\
    \ The R script in ML Studio\n\nYou are now ready to run the experiment. To do\
    \ this, click the Run icon at the bottom pane of ML Studio. Once the experiment\
    \ has executed successfully, you can view the details of the decision tree and\
    \ also visualize the overall shape of the decision tree.\n\nTo view the details\
    \ of the decision tree, click the **Execute R Script** module and **View output\
    \ log** (shown in [Figure 3-21](#part0011.html#Fig21)) in the **Properties** pane.\n\
    \n![9781484204467_Fig03-21.jpg](images/00054.jpeg)\n\n[Figure 3-21](#part0011.html#_Fig21).\
    \ View output log for Execute R Script"
