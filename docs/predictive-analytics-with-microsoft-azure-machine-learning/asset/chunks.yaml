    we tend to seek a second opinion from other doctors to improve our confidence.
    In the same way, ensemble models use a set of algorithms as a panel of experts
    to improve the accuracy and reduce the variance of classification problems.


    The machine learning community has worked on ensemble models for decades. In fact,
    seminal papers were published as early as 1979 by Dasarathy and Sheela. However,
    since the mid-1990s, this area has seen rapid progress with several important
    contributions resulting in very successful real world applications.


    Real World Applications of Ensemble Models


    In the last few years ensemble models have been found in great real-world applications
    including face recognition in cameras, bioinformatics, Netflix movie recommendations,
    and Microsoft’s Xbox Kinect. Let’s examine two of these applications.


    First, ensemble models were very instrumental to the success of the Netflix Prize
    competition. In 2006, Netflix ran an open contest with a $1 million prize for
    the best collaborative filtering algorithm that improved their existing solution
    by 10%. In September 2009 the $1 million prize was awarded to BellKor’s Pragmatic
    Chaos, a team of scientists from AT&T Labs joining forces with two lesser known
    teams. At the start of the contest, most teams used single classifier algorithms:
    although they outperformed the Netflix model by 6–8%, performance quickly plateaued
    until teams started applying ensemble models. Leading contestants soon realized
    that they could improve their models by combining their algorithms with those
    of the apparently weaker teams. In the end, most of the top teams, including the
    winners, used ensemble models to significantly outperform Netflix’s recommendation
    engine. For example, the second-place team used more than 900 individual models
    in their ensemble.


    Microsoft’s Xbox Kinect sensor also uses ensemble modeling. Random Forests, a
    form of ensemble model, is used effectively to track skeletal movements when users
    play games with the Xbox Kinect sensor.


    Despite success in real-world applications, a key limitation of ensemble models
    is that they are black boxes in that their decisions are hard to explain. As a
    result, they are not suitable for applications where decisions have to be explained.
    Credit scorecards are a good example because lenders need to explain the credit
    score they assign to each consumer. In some markets, such explanations are a legal
    requirement and hence ensemble models would be unsuitable despite their predictive
    power.


    Building an Ensemble Model


    There are three key steps to building an ensemble model: a) selecting data, b)
    training classifiers, and c) combining classifiers.


    The first step to build an ensemble model is data selection for the classifier
    models. When sampling the data, a key goal is to maximize diversity of the models,
    since this improves the accuracy of the solution. In general, the more diverse
    your models, the better the performance of your final classifier, and the smaller
    the variance of its predictions.'
