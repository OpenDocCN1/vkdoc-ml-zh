  trans: '

    数据科学是从数据中获取有用洞察的实践。虽然它也适用于小数据，但数据科学对大数据尤为重要，因为如今我们从组织内外的众多来源收集了 PB 级别的结构化和非结构化数据。结果，我们变得数据丰富但信息贫乏。数据科学提供了强大的流程和技术，用于从这片数据海洋中挖掘可操作的信息。数据科学借鉴了多个学科，包括统计学、数学、运筹学、信号处理、语言学、数据库与存储、编程、机器学习以及科学计算。图
    1-1 展示了数据科学最常见的学科领域。尽管*数据科学*这个术语在商业领域是新的，但它自 1960 年就已存在，当时彼得·诺尔首次将其用于指代计算机科学中的数据处理方法。自
    20 世纪 90 年代末以来，著名的统计学家如 C.F.吴和威廉·S·克利夫兰也使用了数据科学这一术语，他们认为这门学科与统计学相同或是其延伸。


    ![9781484204467_Fig01-01.jpg](img/00008.jpeg)


    图 1-1. 突出构成数据科学的主要学术学科


    数据科学的实践者是数据科学家，他们的技能涵盖统计学、数学、运筹学、信号处理、语言学、数据库与存储、编程、机器学习以及科学计算。此外，为了有效工作，数据科学家还需要良好的沟通和数据可视化技能。领域知识对于交付有意义的成果也至关重要。如此广泛的技能很难在一个人身上找到，这就是为什么数据科学是一项团队运动，而非个人努力。要有效运作，需要组建一个拥有互补数据科学技能的团队。


    分析光谱


    根据高德纳公司的分类，我们进行的所有分析都可以归为四类：描述性分析、诊断性分析、预测性分析和规范性分析。描述性分析通常有助于描述情况，并能回答诸如*发生了什么？*、*我的客户是谁？*等问题。诊断性分析帮助你理解事情发生的原因，并能回答诸如*为什么会发生？*之类的问题。预测性分析具有前瞻性，可以回答诸如*未来会发生什么？*之类的问题。顾名思义，规范性分析更具指导性，有助于回答诸如*我们应该做什么？*、*到达目的地的最佳路线是什么？*或*我应该如何分配我的投资？*等问题。


    图 1-2 展示了完整的分析光谱。该图也显示了分析的复杂程度。


    ![9781484204467_Fig01-02.jpg](img/00009.jpeg)


    图 1-2. 所有数据分析的光谱


    描述性分析


    描述性分析用于解释在特定情况下正在发生的事情。这类分析通常需要人工干预，可用于回答诸如*发生了什么？*、*我的客户是谁？*、*我们有多少种用户类型？*等问题。常用的技术包括使用图表、直方图、箱线图或数据聚类进行描述性统计。你将在本章后面探讨这些技术。


    诊断性分析


    诊断性分析帮助你理解某些事情发生的原因以及关键驱动因素是什么。例如，无线服务提供商可能会用它来回答诸如*为什么掉线率在增加？*或*为什么我们每个月都在流失更多客户？*等问题。客户诊断分析可以通过聚类、分类、决策树或内容分析等技术来完成。这些技术存在于统计学、数据挖掘和机器学习中。需要注意的是，商业智能也用于诊断性分析。


    预测性分析


    预测性分析帮助你预测未来会发生什么。它用于预测不确定结果的概率。例如，它可以用来预测信用卡交易是否欺诈，或者某个客户是否可能升级到高级电话套餐。统计学和机器学习为预测提供了很好的技术。这包括神经网络、决策树、蒙特卡洛模拟和回归等技术。


    规范性分析


    规范性分析将建议采取最佳行动方案以优化你的业务成果。通常，规范性分析将预测模型与业务规则（例如，如果欺诈概率超过给定阈值则拒绝交易）相结合。例如，它可以建议向特定客户提供的最佳电话套餐，或者基于优化，为你的送货卡车提出最佳路线。规范性分析在渠道优化、投资组合优化或交通优化等场景中非常有用，可以根据当前交通状况找到最佳路线。可以使用决策树、线性和非线性规划、蒙特卡洛模拟或来自统计学和数据挖掘的博弈论等技术来进行规范性分析。参见图
    1-2。


    分析的复杂性从描述性分析到规范性分析逐渐增加。在许多方面，规范性分析是分析的理想境界，通常被分析能力最强的组织所使用。想象一家智能电信公司，它将分析模型嵌入到其业务流程系统中。其客户呼叫中心系统嵌入了以下分析模型：


    *   **客户流失模型**：这是一个预测模型，用于预测客户流失的概率。换句话说，它预测了致电呼叫中心的客户最终转向竞争对手的可能性。

    *   **客户细分模型**：该模型将客户划分为不同的细分市场，用于营销目的。

    *   **客户倾向模型**：该模型预测客户对每个营销优惠（例如升级到高级套餐）的响应倾向。


    当客户来电时，呼叫中心系统会通过其手机号码实时识别客户。然后，呼叫中心系统使用这三个模型对客户进行评分。如果客户在客户流失模型上得分很高，意味着他们非常有可能转向竞争对手。在这种情况下，电信公司会立即将客户转接给一组有权提供有吸引力优惠以防止流失的呼叫中心代理。否则，如果细分模型将客户评分为高价值客户，他/她将被转接到专门的礼宾服务，该服务等待时间更短，客户服务最佳。如果倾向模型显示客户升级倾向很高，呼叫代理会收到提醒，并尝试以有吸引力的升级方案进行向上销售。该解决方案的美妙之处在于，所有模型都融入了电信公司的业务流程中，驱动其代理做出明智的决策，从而提高盈利能力和客户满意度。这在图
    1-3 中进行了说明。


    ![9781484204467_Fig01-03.jpg](img/00010.jpeg)


    图 1-3. 一家使用规范性分析的智能电信公司


    为什么它很重要，为什么是现在？

    '
- fmt: '# Data Science: A Competitive Advantage


    Data science offers customers a real opportunity to make smarter and timely decisions
    based on all the data they collect. With the right tools, data science offers
    customers new and actionable insights not only from their own data, but also from
    the growing sources of data outside their organizations, such as weather data,
    customer demographic data, consumer credit data from the credit bureaus, and data
    from social media sites such as Twitter, Instagram, etc. Here are a few reasons
    why data science is now critical for business success.


    ## Data as a Competitive Asset


    Data is now a critical asset that offers a competitive advantage to smart organizations
    that use it correctly for decision making. McKinsey and Gartner agree on this:
    in a recent paper McKinsey suggests that companies that use data and business
    analytics to make decisions are more productive and deliver a higher return on
    equity than those who don’t. In a similar vein, Gartner posits that organizations
    that invest in a modern data infrastructure will outperform their peers by up
    to 20%. Big data offers organizations the opportunity to combine valuable data
    across silos to glean new insights that drive smarter decisions.


    > “Companies that use data and business analytics to guide decision making are
    more productive and experience higher returns on equity than competitors that
    don’t”

    >

    > —Brad Brown et al., McKinsey Global Institute, 2011


    > “By 2015, organizations integrating high-value, diverse, new information types
    and sources into a coherent information management infrastructure will outperform
    their industry peers financially by more than 20%.”

    >

    > —Regina Casonato et al., Gartner¹


    ## Increased Customer Demand


    Business intelligence has been the key form of analytics used by most organizations
    in the last few decades. However, with the emergence of big data, more customers
    are now eager to use predictive analytics to improve marketing and business planning.
    Traditional BI gives a good rear view analysis of their business, but does not
    help with any forward-looking questions that include forecasting or prediction.


    The past two years have seen a surge of demand from customers for predictive analytics
    as they seek more powerful analytical techniques to uncover value from the troves
    of data they store on their businesses. In our combined experience we have not
    seen as much demand for data science from customers as we did in the last two
    years alone!


    ## Increased Awareness of Data Mining Technologies


    Today a subset of data mining and machine learning algorithms are now more widely
    understood since they have been tried and tested by early adopters such as Netflix
    and Amazon, who use them in their recommendation engines. While most customers
    do not fully understand details of the machine learning algorithms used, their
    application in Netflix movie recommendations or recommendation engines at online
    stores are very salient. Similarly, many customers are now aware of the targeted
    ads that are now heavily used by most sophisticated online vendors. So while many
    customers may not know details of the algorithms used, they now increasingly understand
    their business value.


    ## Access to More Data


    Digital data has been exploding in the last few years and shows no signs of abating.
    Most industry pundits now agree that we are collecting more data than ever before.
    According to IDC, the digital universe will grow to 35 zetabyes (i.e. 35 trillion
    terabytes) globally by 2020. Others posit that the world’s data is now growing
    by up to 10 times every 5 years, which is astounding. In a recent study, McKinsey
    Consulting also found that in 15 of the 17 US economic sectors, companies with
    over 1,000 employees store, on average, over 235 terabytes of data–which is more
    than the data stored by the US Library of Congress! This data explosion is driven
    by the rise of new data sources such as social media, cell phones, smart sensors,
    and dramatic gains in the computer industry.


    The large volumes of data being collected also enables you to build more accurate
    predictive models. We know from statistics that the confidence interval (also
    known as the margin of error) has an inverse relationship with the sample size.
    So the larger your sample size, the smaller the margin of error. This in turn
    increases the accuracy of predictions from your model.


    ## Faster and Cheaper Processing Power


    We now have far more computing power at our disposal than ever before. Moore’s
    Law proposed that computer chip performance would grow exponentially, doubling
    every 18 months. This trend has been true for most of the history of modern computing.
    In 2010, the International Technology Roadmap for Semiconductors updated this
    forecast, predicting that growth would slow down in 2013 when computer densities
    and counts would double every 3 years instead of 18 months. Despite this, the
    exponential growth in processor performance has delivered dramatic gains in technology
    and economic productivity. Today, a smartphone’s processor is up to five times
    more powerful than that of a desktop computer 20 years ago. For instance, the
    Nokia Lumia 928 has a dual-core 1.5 GHz Qualcomm Snapdragon™ S4 that is at least
    five times faster than the Intel Pentium P5 CPU released in 1993, which was very
    popular for personal computers. In the nineties, expensive workstations like the
    DEC VAX mainframes or the DEC Alpha workstations were required to run advanced,
    compute-intensive algorithms. It is remarkable that today’s smartphone is also
    five times faster than the powerful DEC Alpha processor from 1994 whose speed
    was 200-300 MHz! Today you can run the same algorithms on affordable personal
    workstations with multi-core processors. In addition, we can leverage Hadoop’s
    MapReduce architecture to deploy powerful data mining algorithms on a farm of
    commodity servers at a much lower cost than ever before. With data science we
    now have the tools to discover hidden patterns in our data through smart deployment
    of data mining and machine learning algorithms.


    We have also seen dramatic gains in capacity, and an exponential drop in the price
    of computer memory. This is illustrated in [Figures 1-4](#part0009.html#Fig4)
    and [1-5](#part0009.html#Fig5), which show the exponential price drop and growth
    in capacity of computer memory since 1960. Since 1990 the average price per MB
    of memory has dropped from $59 to a meager 0.49 cents–a 99.2% price reduction!
    At the same time, the capacity of a memory module has increased from 8MB to a
    whopping 8GB! As a result, a modest laptop is now more powerful than a high-end
    workstation from the early nineties.


    ![9781484204467_Fig01-04.jpg](images/00011.jpeg)


    [Figure 1-4](#part0009.html#_Fig4). Average computer memory price since 1960


    ![9781484204467_Fig01-05.jpg](images/00012.jpeg)


    [Figure 1-5](#part0009.html#_Fig5). Average computer memory size since 1960


    ![Image](images/00013.jpeg) **Note** For more information on memory price history
    is available at John C. McCallum: [http://www.jcmit.com/mem2012.htm](http://www.jcmit.com/mem2012.htm).


    ## The Data Science Process


    A typical data science project follows the five-step process outlined in [Figure
    1-6](#part0009.html#Fig6). Let’s review each of these steps in detail.'
