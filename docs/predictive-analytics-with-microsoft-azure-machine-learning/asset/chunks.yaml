    ## Feature Hashing


    In machine learning, the input feature(s) can be free text. A common approach
    to representing free text is to use a bag of words. Each word is represented as
    a token. Every time the word appears in the text, a 1 is assigned to the token.
    And if the word does not appear, a 0 is assigned.


    However, the bag of words model will not scale because the number of possible
    words is not known beforehand. Imagine representing a token for every word in
    the descriptive text of each S&P 500 company. The dimensionality of the inputs
    can be potentially large. Hence, a common approach is to use a hash function to
    transform all the tokens into numerical features, and restrict the range of possible
    hash values. To do this, feature hashing (also known as the “hashing trick”) is
    commonly used in machine learning communities to prepare the dataset before it
    is used as input for machine learning algorithms.


    In this example, the **Feature Hashing** module is used to perform hashing on
    the descriptive text of the S&P 500 companies. Underneath the hood, the Feature
    Hashing module uses the Vowpal Wabbit library to perform 32-bit murmurhash hashing.
    For this exercise, the hashing bit size is set to **12**, and **N-grams**. After
    the Feature Hashing module has executed, you will see that the descriptive text
    has been converted into a large number of columns, with column names prefixed
    with `Text_HashingFeature_` (shown in [Figure 7-4](#part0017.html#Fig4)).


    ![9781484204467_Fig07-04.jpg](images/00121.jpeg)


    [Figure 7-4](#part0017.html#_Fig4). Feature hashing


    ![Image](images/00013.jpeg) **Note** The Vowpal Wabbit library is an open source
    machine learning library. See [https://github.com/JohnLangford/vowpal_wabbit/wiki/Tutorial](https://github.com/JohnLangford/vowpal_wabbit/wiki/Tutorial)
    for more information.


    MurmurHash is a family of non-cryptographic hash functions that provide a good
    distribution, avalanche behavior, and collision resistance. See [https://code.google.com/p/smhasher/](https://code.google.com/p/smhasher/)
    for more information on the MurmurHash family of hash functions.


    ## Identifying the Right Features


    When using a k-means cluster for customer segmentation, you will need to identify
    the features that will be used during the clustering process. After feature hashing
    has been performed, a large number of features will have been computed based on
    the descriptive text.


    **Principal Components Analysis** (PCA) is a powerful statistical technique that
    can be used for identifying a smaller number of features (i.e. principal components)
    that captures the key essence of the original features.


    In this sample experiment, you will learn how to perform principal component analysis
    using R. Specifically, you will be using the **Execute R Script** module to execute
    the following R script (which has been provided as part of the sample experiment).


    ```

    # Map 1-based optional input ports to variables

    dataset1 <- maml.mapInputPort(1) # class: data.frame


    # Sample operation

    titles_categories = dataset1[,1:2]

    pca = prcomp(dataset1[,4:4099])

    top_pca_scores = data.frame(pca$x[,1:10])

    data.set = cbind(titles_categories,top_pca_scores)


    # You''ll see this output in the R Device port.

    # It''ll have your stdout, stderr and PNG graphics device(s).

    plot(pca)


    # Select data.frame to be sent to the output Dataset port

    maml.mapOutputPort("data.set");

    ```


    From the R script, you will notice that the R function `prcomp` is used. The input
    to `prcomp` includes column 4 to 4099 of `dataset1`. The computed results are
    stored in the variable `pca`. For this sample experiment, you obtain the top 10
    principal components, and use these as inputs to the k-means clustering algorithm.


    After you have run the experiment, you can click on the **Execute R Script** module,
    and choose to visualize the result dataset. [Figure 7-5](#part0017.html#Fig5)
    shows the result dataset, and the top 10 principal components (PC) that are computed.


    ![9781484204467_Fig07-05.jpg](images/00122.jpeg)


    [Figure 7-5](#part0017.html#_Fig5). Visualization of the result dataset (top 10
    principal components for the dataset)


    ![Image](images/00013.jpeg) **Note** Refer to [http://en.wikipedia.org/wiki/Principal_component_analysis](http://en.wikipedia.org/wiki/Principal_component_analysis)
    to learn more about PCA.


    In R, there are several functions that can be used for performing PCA. These include
    `pca()`, `prcomp()`, and `princomp()`. `prcomp()` is commonly used because it
    is numerically more stable, and returns an R object with the following information:
    eigenvectors, square root of the eigenvalues, and scores.


    See [Chapter 3](#part0011.html) for learning more on how you can use R with Azure
    Machine Learning.


    ## Properties of K-Means Clustering


    From [Figure 7-3](#part0017.html#Fig3), you will see that k-means clustering is
    used twice in the experiment. The main difference between the two k-means clustering
    modules is the number of centroids (i.e. value of k). This is also the same as
    the number of segments or clusters you want from the k-means algorithm. For the
    left k-means clustering, the sample experiment has specified that the value of
    k to be 3 (i.e. the k-means clustering model will identify 3 clusters); whereas
    the right k-means clustering model specified the value of k to be 4.


    You can see the number of centroids specified by clicking on each of the k-means
    clustering rectangles. [Figure 7-6](#part0017.html#Fig6) shows the various properties
    of the K-Means clustering model, which include


    *   Number of centroids

    *   Metric: Metric is used to compute the distance between clusters

    *   Initialization: The method use to specify the seed the initial centroids

    *   Iterations: The number of iterations used


    ![9781484204467_Fig07-06.jpg](images/00123.jpeg)


    [Figure 7-6](#part0017.html#_Fig6). Properties of the k-means clustering model'
