    Statistical and Machine Learning Algorithms


    CHAPTER 4


    ![image](images/00007.jpeg)


    Introduction to Statistical and Machine Learning Algorithms


    This chapter will serve as a reference for some of the most commonly used algorithms
    in Microsoft Azure Machine Learning. We will provide a brief introduction to algorithms
    such as linear and logistic regression, k-means for clustering, decision trees,
    decision forests (random forests, boosted decision trees, and Gemini), neural
    networks, support vector machines, and Bayes point machines.


    This chapter will provide a good foundation and reference material for some of
    the algorithms you will encounter in the rest of the book. We group these algorithms
    into the following categories:


    *   Regression

    *   Classification

    *   Clustering


    Regression Algorithms


    Let’s first talk about the commonly used regression techniques in the Azure Machine
    Learning service. Regression techniques are used to predict response variables
    with numerical outcomes, such as predicting the miles per gallon of a car or predicting
    the temperature of a city. The input variables may be numeric or categorical.
    However, what is common with these algorithms is that the output (or response
    variable) is numeric. We’ll review some of the most commonly used regression techniques
    including linear regression, neural networks, decision trees, and boosted decision
    tree regression.


    Linear Regression


    Linear regression is one of the oldest prediction techniques in statistics. In
    fact, it traces its roots back to the work of Carl Friedrich Gauss in 1795\. The
    goal of linear regression is to fit a linear model between the response and independent
    variables, and use it to predict the outcome given a set of observed independent
    variables. A simple linear regression model is a formula with the structure of


    ![Eqn4-01.jpg](images/00056.jpeg)


    where


    *   Y is the response variable (i.e. the outcome you are trying to predict) such
    as miles per gallon.

    *   *X*[1], *X*[2], *X*[3], etc. are the independent variables used to predict
    the outcome.

    *   *β*[0] is a constant that is the intercept of the regression line.

    *   *β*[1], *β*[2], *β*[3], etc. are the coefficients of the independent variables.
    These refer to the partial slopes of each variable.

    *   *ε* is the error or noise associated with the response variable that cannot
    be explained by the independent variables X1, X2, and X3.


    A linear regression model has two components: a deterministic portion (i.e. *β*[1]*X*[1]
    + *β*[2]*X*[2] + ...) and a random portion (i.e. the error, *ε*). You can think
    of these two components as the signal and noise in the model.


    If you only have one input variable, X, the regression model is the best line
    that fits the data. [Figure 4-1](#part0013.html#Fig1) shows an example of a simple
    linear regression model that predicts a car’s miles per gallon from its horsepower.
    With two input variables, the linear regression is the best plane that fits a
    set of data points in a 3D space. The coefficients of the variables (i.e. *β*[1],
    *β*[2], *β*[3], etc.) are the partial slopes of each variable. If you hold all
    other variables constant, then the outcome Y will increase by *β*[1] when the
    variable *X*[1] increases by 1\. This is why economists typically use the phrase
    “*ceteris paribus*”“ or ”*all other things being equal*” to describe the effect
    of one independent variable on a given outcome.


    ![9781484204467_Fig04-01.jpg](images/00057.jpeg)


    [Figure 4-1](#part0013.html#_Fig1). A simple linear regression model that predicts
    a car’s miles per gallon from its horsepower


    Linear regression uses the least squares or gradient descent methods to find the
    best model coefficients for a given dataset. The least squares method achieves
    this by minimizing the sum of the squared error between the fitted and actual
    values of each observation in the training data. The gradient descent finds the
    optimal model coefficients by updating the coefficients in each iteration. The
    updates go in the direction so that the sum of errors between the model fitted
    and the actual values of the training data are reduced. Through several iterations
    it finds the local minimum by moving in the direction of the negative gradient,
    hence the name.


    ![Image](images/00013.jpeg) **Note**  You can learn more about linear regression
    from the book *Business Analysis Using Regression: A Casebook* (Foster, D. P.,
    Stine, R.H., Waterman, R.P.; New York, USA; Springer-Verlag, 1998).


    Neural Networks


    Artificial neural networks are a set of algorithms that mimic the functioning
    of the brain. There are many different neural network algorithms, including backpropagation
    networks, Hopfield networks, Kohonen networks (also known as self-organizing maps),
    and adaptive resonance theory (or ART) networks. However, the most common is the
    back-propagation algorithm, also known as multilayered perceptron.


    The back-propagation network has several neurons arranged in layers. The most
    commonly used architecture is the three-layered network shown in [Figure 4-2](#part0013.html#Fig2).
    This architecture has one input, one hidden, and one output layer. However, you
    can also have two or more hidden layers. The number of input and output nodes
    are determined by the dataset. Basically, the number of input nodes equals the
    number of independent variables you want to use to predict the output. The number
    of output nodes is the same as the number of response variables. In contrast,
    the number of hidden nodes is more flexible.'
