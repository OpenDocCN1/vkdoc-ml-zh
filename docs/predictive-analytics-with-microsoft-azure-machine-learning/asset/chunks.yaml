    http://en.wikipedia.org/wiki/Predictive_maintenance  和

    ```


    Ahmet Duyar, “Simplifying predictive maintenance”, Orbit Vol. 31 No.1, pp. 38-45,
    2011.


    业务问题


    假设您是半导体制造商的数据科学家。您的雇主希望您执行以下操作：


    *   构建一个预测其制造过程中良率故障的模型，并且

    *   通过您的分析，提供导致其过程中良率故障的因素。'
- fmt: "# Semiconductor Manufacturing Yield Improvement\n\nThis is a very important\
    \ business problem for semiconductor manufacturers since their process can be\
    \ complex and involves several stages from raw sand to the final integrated circuits.\
    \ Given the complexity, there are several factors that can lead to yield failures\
    \ downstream in the manufacturing process. Identifying the most important factors\
    \ will help process engineers to improve the yield and reduce error rates and\
    \ cost of production, leading to increased productivity.\n\n![Image](images/00013.jpeg)\
    \ **Note** You will need to have an account on Azure Machine Learning. Please\
    \ refer to [Chapter 2](#part0010.html) for instructions to set up your new account\
    \ if you do not have one yet.\n\nIn [Chapter 1](#part0009.html), you saw that\
    \ the data science process typically follows these five steps.\n\n1.  Define the\
    \ business problem\n2.  Data acquisition and preparation\n3.  Model development\n\
    4.  Model deployment\n5.  Monitoring model performance\n\nHaving defined the business\
    \ problem, you will explore data acquisition and preparation, model development,\
    \ evaluation, and deployment in the remainder of this chapter.\n\n## Data Acquisition\
    \ and Preparation\n\nLet’s explore how to load data from source systems and analyze\
    \ the data in Azure Machine Learning.\n\n### The Dataset\n\nFor this exercise,\
    \ you will use the SECOM dataset from the University of California at Irvine’s\
    \ machine learning database. This dataset from the semiconductor manufacturing\
    \ industry was provided by Michael McCann and Adrian Johnston.\n\n![Image](images/00013.jpeg)\
    \ **Note** The SECOM data set is available at the University of California at\
    \ Irvine’s Machine Learning Repository. The dataset contains 1,567 examples, each\
    \ with 591 features. Of the 1567 examples, 104 of them represent yield failures.\n\
    \nThe features or columns represent sensor readings from 590 points in the manufacturing\
    \ process. In addition, it also includes a timestamp and the yield result (i.e.\
    \ a simple pass or fail) for each example.\n\nRefer to [http://archive.ics.uci.edu/ml/machine-learning-databases/secom/](http://archive.ics.uci.edu/ml/machine-learning-databases/secom/).\n\
    \n### Data Loading\n\nAzure Machine Learning enables you to load data from several\
    \ sources including your local machine, the Web, SQL Database on Azure, Hive tables,\
    \ or Azure Blob storage.\n\n#### Loading Data from Your Local File System\n\n\
    The easiest way to load data is from your local machine. You can do this through\
    \ the following steps.\n\n1.  Point your browser to [https://studio.azureml.net](https://studio.azureml.net)\
    \ and log into your workspace in Azure Machine Learning.\n2.  Next, click the\
    \ **Experiments** item from the menu on the left pane.\n3.  Click the **+New**\
    \ button at the bottom left side of the window, and then select **Dataset** from\
    \ the new menu shown in [Figure 8-1](#part0018.html#Fig1).\n\n![9781484204467_Fig08-01.jpg](images/00129.jpeg)\n\
    \n[Figure 8-1](#part0018.html#_Fig1). Loading a new dataset from your local machine\n\
    \n4.  When you choose the option **From Local File** you will be prompted to select\
    \ the data file to load from your machine.\n\n#### Loading Data from Other Sources\n\
    \nYou can load data from non-local sources using the **Reader** module in Azure\
    \ Machine Learning. Specifically, with the **Reader** module you can load data\
    \ from the Web, SQL Database on Azure, Azure Table, Azure Blob storage, or Hive\
    \ tables. To do this you will have to create a new experiment before calling the\
    \ **Reader** module. Use the following steps to load data from any of the above\
    \ sources with the **Reader** module.\n\n1.  Point your browser to [https://studio.azureml.net](https://studio.azureml.net)\
    \ and log into your workspace in Azure Machine Learning.\n2.  Next, click the\
    \ **Experiments** item from the menu on the left pane.\n3.  Click the **+New**\
    \ button at the bottom left side of the window, and then select **Experiment**\
    \ from the new menu. A new experiment is launched with a blank canvas, as shown\
    \ in [Figure 8-2](#part0018.html#Fig2).\n\n![9781484204467_Fig08-02.jpg](images/00130.jpeg)\n\
    \n[Figure 8-2](#part0018.html#_Fig2). Starting a new experiment in Azure Machine\
    \ Learning\n\n4.  Open the menu item **Data Input and Output** and you will see\
    \ two modules, **Reader** and **Writer**.\n5.  Drag the **Reader** module from\
    \ the menu to any position on the canvas.\n6.  Click the **Reader** module in\
    \ the canvas and its properties will be shown on the right pane under **Reader**.\
    \ Now specify the data source in the drop-down menu and then enter the values\
    \ of all required parameters. The Account Name and Account Key refer to a storage\
    \ account on Microsoft Azure. You can obtain these parameters from the Azure portal\
    \ as follows:\n    1.  Log in to Microsoft Azure at [http://azure.microsoft.com](http://azure.microsoft.com).\n\
    \    2.  On the top menu, click **Portal**. This takes you to the Azure portal.\n\
    \    3.  Select **storage** from the menu on the left pane. This lists all your\
    \ storage accounts in the right pane.\n    4.  Click the storage account that\
    \ contains the data you need for your machine learning model.\n    5.  At the\
    \ bottom of the screen, click the key icon labeled **Manage Access Keys**. Your\
    \ storage account name and access keys will be displayed. Use the **Primary Access\
    \ Key** as your Account Key in the **Reader** module in Azure Machine Learning.\n\
    \n![Image](images/00013.jpeg) **Note** You can load several datasets from multiple\
    \ sources into Azure Machine Learning using the above instructions. Note, however,\
    \ that each **Reader** module only loads a single dataset at a time.\n\nFor this\
    \ project, import the two SECOM datasets from the UCI Machine Learning database\
    \ and join them into a new file stored locally. The first dataset only has the\
    \ sensor readings, while the second dataset has the labels (i.e. the yield data).\
    \ Then load the joined dataset into Azure Machine Learning using the first approach\
    \ above.\n\n## Data Analysis\n\n[Figure 8-3](#part0018.html#Fig3) shows the first\
    \ part of the experiment that covers data preparation. The data is loaded and\
    \ preprocessed for missing values using the **Missing Values Scrubber** module.\
    \ Following this, summary statistics are obtained and the **Filter Based Feature\
    \ Selection** module is used to determine the most important variables for prediction.\n\
    \n![9781484204467_Fig08-03.jpg](images/00131.jpeg)\n\n[Figure 8-3](#part0018.html#_Fig3).\
    \ Preprocessing the SECOM dataset\n\n[Figure 8-4](#part0018.html#Fig4) shows a\
    \ snapshot of the SECOM data as seen in Azure Machine Learning. As you can see,\
    \ there are 1,567 rows and 592 columns in the dataset. In addition, Azure Machine\
    \ Learning also shows the number of unique values per feature and the number of\
    \ missing values. You can see that many of the sensors have missing values. Further,\
    \ some of the sensors have a constant reading for all rows. For example, sensor\
    \ #6 has a reading of 100 for all rows. Such features will have to be eliminated\
    \ as they add no value to the prediction since there is no variation in their\
    \ readings.\n\n![9781484204467_Fig08-04.jpg](images/00132.jpeg)\n\n[Figure 8-4](#part0018.html#_Fig4).\
    \ Visualizing the SECOM dataset in Azure Machine Learning\n\n## Feature Selection"
