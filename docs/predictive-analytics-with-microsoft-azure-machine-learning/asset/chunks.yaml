    ![9781484204467_unFig-02.jpg](images/00004.jpeg)


    **Roger Barga** is a General Manager and Director of Development at Amazon Web
    Services. Prior to joining Amazon, Roger was Group Program Manager for the Cloud
    Machine Learning group in the Cloud & Enterprise division **at** Microsoft, where
    his team was responsible for product management of the Azure Machine Learning
    service. Roger joined Microsoft in 1997 as a Researcher in the Database Group
    of Microsoft Research, where he directed both systems research and product development
    efforts in database, workflow**,** and stream processing systems. He has developed
    ideas from basic research, through proof of concept prototypes**,** to incubation
    efforts in product groups. Prior to joining Microsoft, Roger was a **R**esearch
    **S**cientist in the **M**achine **L**earning **G**roup at the Pacific Northwest
    National Laboratory where he built and deployed machine learning**-**based solutions.
    Roger is also an **A**ffiliate **P**rofessor at the University of Washington,
    where he is a lecturer in the Data Science and Machine Learning programs.


    Roger holds a PhD in Computer Science, a M.Sc. in Computer Science with an emphasis
    on Machine Learning, and **a** B.Sc. in Mathematics and Computing Science. He
    has published over 90 peer**-**reviewed technical papers and book chapters, collaborated
    with 214 co-authors from 1991 to 2013, with over 700 citations by 1**,**084 authors.


