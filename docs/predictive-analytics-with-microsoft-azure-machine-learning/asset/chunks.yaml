    ![9781484204467_Fig04-03.jpg](images/00062.jpeg)


    [Figure 4-3](#part0013.html#_Fig3). A simple decision tree with two data splits


    [Figure 4-4](#part0013.html#Fig4) shows a fictional example of a very simple decision
    tree that predicts whether a customer will buy a bike or not. In this example,
    the original dataset has 100 examples. The most predictive variable is age, so
    the decision first splits the data by age. Customers younger than 30 fall in the
    left branch while those aged 30 or above fall in the right branch. The next most
    important variable is gender, so in the next level the decision tree splits the
    data by gender. In the younger branch (i.e. for customer customers under 30),
    the decision tree splits the data into male and female branches. It also does
    the same for the older branch. Finally, [Figure 4-4](#part0013.html#Fig4) shows
    the number of examples in each node and the probability to purchase. As a result,
    if you have a female customer aged 23, the tree predicts that she only has a 30%
    chance of buying the bike because she will end up in Node 3\. A male customer
    aged 45 will have an 80% chance of buying a bike since he will end up in Node
    6 in the tree.


    ![9781484204467_Fig04-04.jpg](images/00063.jpeg)


    [Figure 4-4](#part0013.html#_Fig4). A simple decision tree to predict likelihood
    to buy bikes


    Some of the most commonly used decision tree algorithms include Iterative Dichotomizer
    3 (ID3), C4.5 and C5.0 (successors of ID3), Automatic Interaction Detection (AID),
    Chi Squared Automatic Interaction Detection (CHAID), and Classification and Regression
    Tree (CART). While very useful, the ID3, C4.5, C5.0, and CHAID algorithms are
    classification algorithms and are not useful for regression. As the name suggests,
    the CART algorithm can be used for either classification or regression.


    How do you choose the variable to use for splitting data at each level? Each decision
    tree algorithm uses a different statistic to choose the best variable for splitting.
    ID3, C4.5, and C5.0 use information gain, while CART uses a metric called Gini
    impunity. Gini impunity measures the misclassification rate of a randomly chosen
    example.


    ![Image](images/00013.jpeg) **Note**  More information on decision trees is available
    in the book *Data Mining and Market Intelligence for Optimal Market Returns* by
    S. Chiu and D. Tavella (Oxford, UK, Butterworth-Heinemann, 2008) and at [http://en.wikipedia.org/wiki/Decision_tree_learning](http://en.wikipedia.org/wiki/Decision_tree_learning).


    Boosted Decision Trees


    Boosted decision trees are a form of ensemble models. Like other ensemble models,
    boosted decision trees use several decision trees to produce superior predictors.
    Each of the individual decision trees can be weak predictors. However, when combined
    they produce superior results.


    As discussed in [Chapter 1](#part0009.html), there are three key steps to building
    an ensemble model: a) data selection, b) training classifiers, and c) combining
    classifiers.'
