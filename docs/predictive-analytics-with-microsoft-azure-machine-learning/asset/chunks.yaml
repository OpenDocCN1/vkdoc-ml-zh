    Step 2 of the process entails training several individual classifiers. But how
    do you assign the classifiers? Of the many available strategies, the two most
    popular are bagging and boosting. The bagging algorithm uses different subsets
    of the data to train each model. The Random Forest algorithm uses this bagging
    approach. In contrast, the boosting algorithm improves performance by making misclassified
    examples in the training set more important during training. So during training,
    each additional model focuses on the misclassified data. The boosted decision
    tree algorithm uses the boosting strategy.


    Finally, once you train all the classifiers, the final step is to combine their
    results to make a final prediction. There are several approaches to combining
    the outcomes, ranging from a simple majority to a weighted majority voting.


    Ensemble models are a really exciting part of machine learning with the potential
    for breakthroughs in classification problems.


    ## Summary


    This chapter introduced data science, defining what it is, why it matters, and
    why now. We outlined the key academic disciplines of data science, including statistics,
    mathematics, operations research, signal processing, linguistics, database and
    storage, programming, and machine learning. We covered the key reasons behind
    the heightened interest in data science: increasing data volumes, data as a competitive
    asset, growing awareness of data mining, and hardware economics.


    A simple five-step data science process was introduced with guidelines on how
    to apply it correctly. We also introduced some of the most commonly used techniques
    and algorithms in data science. Finally, we introduced ensemble models, which
    is one of the key technologies on the cutting edge of data science.


