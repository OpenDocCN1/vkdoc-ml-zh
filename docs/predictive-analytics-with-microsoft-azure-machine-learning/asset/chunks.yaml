- fmt: '# Neural Network Models


    The development of neural network models is done in two steps: training and testing.
    During training, you show the neural network a set of examples from the training
    set. Each example has values of the independent as well as the response variables.
    During training, you show the examples several times to the neural network. At
    each iteration, the network predicts the response. In the forward propagation
    phase of training, each node in the hidden and output layers calculates a weighted
    sum of its inputs, and then uses this sum to compute its output through an activate
    function. The output of each neuron in the neural network usually uses the following
    sigmoidal activate function:


    ![image](images/00058.jpeg)


    There are, however, other activation functions that can be used in neural networks,
    such as Gaussian, hyperbolic tangent (`tanh`), linear threshold, and even a simple
    linear function.


    Let’s assume there are `M` input nodes. The connection weights between the input
    nodes and the first hidden layer are denoted by `w¹[ij]`.


    At each hidden node the weighted sum is given by


    ![image](images/00059.jpeg)


    When the weighted sum is calculated, the sigmoidal activate function is calculated
    as follows:


    ![image](images/00060.jpeg)


    After the activation level of the output node is calculated, the backward propagation
    step starts. In this phase, the algorithm calculates the error of its prediction
    based on the actual response value. Using the gradient descent method, it adjusts
    the weights of all connections in proportion the error. The weights are adjusted
    in a way that reduces the error the next time. After several iterations, the neural
    network converges to a solution.


    During testing, you simply use the trained model to score records. For each record,
    the neural network predicts the value of the response for a given set of input
    variables (see [Figure 4-2](#part0013.html#Fig2)).


    ![9781484204467_Fig04-02.jpg](images/00061.jpeg)


    [Figure 4-2](#part0013.html#_Fig2). A neural network with three layers: one input,
    one hidden, and one output layer


    The learning rate determines the rate of convergence to a solution. If the learning
    rate is too low, the algorithm will need more learning iterations (and hence more
    time) to converge to the minimum. In contrast, if the learning rate is too large,
    the algorithm bounces around and may never find the local minimum. Hence the neural
    net will be a poor predictor.


    Another important parameter is the number of hidden nodes. The accuracy of the
    neural network may increase with the number of hidden nodes. However, this increases
    the processing time and can lead to over-fitting. In general, increasing the number
    of hidden nodes or hidden layers can easily lead to over-parameterization, which
    will increase the risk of over-fitting. One rule of thumb is to start with the
    number of hidden nodes equal roughly to the square root of the number of input
    nodes. Another general rule of thumb is that the number of neurons in the hidden
    layer should be between the size of the input layer and the size of the output
    layer. For example, `(Number of input nodes + number of output nodes) x 2/3`.
    These rules of thumb are merely starting points, intended to avoid over-fitting;
    the optimal number can only be found through experimentation and validation of
    performance on test data.


    # Decision Trees


    Decision tree algorithms are hierarchical techniques that work by splitting the
    dataset iteratively based on certain statistical criteria. The goal of decision
    trees is to maximize the variance across different nodes in the tree, and minimize
    the variance within each node. [Figure 4-3](#part0013.html#Fig3) shows a simple
    decision tree created with two splits of the data. The root node (Node 0) contains
    all the data in the dataset. The algorithm splits the data based on a defined
    statistic, creating three new nodes (Node 1, Node 2, and Node 3). Using the same
    statistic, it splits the data again at Node 1, creating two more leaf nodes (i.e.
    Nodes 4 and 5). The decision tree makes its prediction for each data row by traversing
    to the leaf nodes (i.e. one of the terminal nodes: Node 2, 3, 4, or 5).


    ![9781484204467_Fig04-03.jpg](images/00062.jpeg)


    [Figure 4-3](#part0013.html#_Fig3). A simple decision tree with two data splits


    [Figure 4-4](#part0013.html#Fig4) shows a fictional example of a very simple decision
    tree that predicts whether a customer will buy a bike or not. In this example,
    the original dataset has 100 examples. The most predictive variable is age, so
    the decision first splits the data by age. Customers younger than 30 fall in the
    left branch while those aged 30 or above fall in the right branch. The next most
    important variable is gender, so in the next level the decision tree splits the
    data by gender. In the younger branch (i.e. for customer customers under 30),
    the decision tree splits the data into male and female branches. It also does
    the same for the older branch. Finally, [Figure 4-4](#part0013.html#Fig4) shows
    the number of examples in each node and the probability to purchase. As a result,
    if you have a female customer aged 23, the tree predicts that she only has a 30%
    chance of buying the bike because she will end up in Node 3. A male customer aged
    45 will have an 80% chance of buying a bike since he will end up in Node 6 in
    the tree.


    ![9781484204467_Fig04-04.jpg](images/00063.jpeg)


    [Figure 4-4](#part0013.html#_Fig4). A simple decision tree to predict likelihood
    to buy bikes


    Some of the most commonly used decision tree algorithms include Iterative Dichotomizer
    3 (`ID3`), `C4.5` and `C5.0` (successors of `ID3`), Automatic Interaction Detection
    (`AID`), Chi Squared Automatic Interaction Detection (`CHAID`), and Classification
    and Regression Tree (`CART`). While very useful, the `ID3`, `C4.5`, `C5.0`, and
    `CHAID` algorithms are classification algorithms and are not useful for regression.
    As the name suggests, the `CART` algorithm can be used for either classification
    or regression.


    How do you choose the variable to use for splitting data at each level? Each decision
    tree algorithm uses a different statistic to choose the best variable for splitting.
    `ID3`, `C4.5`, and `C5.0` use information gain, while `CART` uses a metric called
    Gini impunity. Gini impunity measures the misclassification rate of a randomly
    chosen example.


    ![Image](images/00013.jpeg) **Note**  More information on decision trees is available
    in the book *Data Mining and Market Intelligence for Optimal Market Returns* by
    S. Chiu and D. Tavella (Oxford, UK, Butterworth-Heinemann, 2008) and at [http://en.wikipedia.org/wiki/Decision_tree_learning](http://en.wikipedia.org/wiki/Decision_tree_learning).


    # Boosted Decision Trees


    Boosted decision trees are a form of ensemble models. Like other ensemble models,
    boosted decision trees use several decision trees to produce superior predictors.
    Each of the individual decision trees can be weak predictors. However, when combined
    they produce superior results.


    As discussed in [Chapter 1](#part0009.html), there are three key steps to building
    an ensemble model: a) data selection, b) training classifiers, and c) combining
    classifiers.'
