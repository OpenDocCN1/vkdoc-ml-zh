    客户细分模型


    在本章中，您将学习如何在 Microsoft Azure 机器学习中构建客户细分模型。通过一个实际示例，我们提供了一份逐步指南，介绍如何使用 Microsoft
    Azure 机器学习通过 k-means 聚类轻松构建细分模型。模型构建完成后，您将学习如何执行验证并将其部署到生产环境中。


    客户细分模型概述


    为了有效竞争并构建畅销的产品和服务，公司必须找出目标客户细分群体以及每个细分群体的特征。识别客户细分群体至关重要，因为它有助于公司更好地定位营销活动，以赢得最有利可图的客户。公司的数据分析师负责筛选来自内部和外部数据源的数据，以找出能够吸引特定客户细分群体（这些群体可能事先未知）的神奇要素。


    客户细分使公司能够制定营销策略并执行针对特定客户细分群体的营销活动。此外，客户细分还能带来更高的客户满意度，因为不同细分群体的不同需求可以得到适当满足。


    ![Image](img/00013.jpeg) **注意** 在 [`en.wikipedia.org/wiki/Market_segmentation`](http://en.wikipedia.org/wiki/Market_segmentation)
    了解更多关于市场细分的知识。


    公司必须能够掌握海量可用信息（例如市场研究报告、概念/市场测试等）。虽然这些市场研究数据提供了关于市场的定性和定量信息的良好平衡，但如果公司能够利用其已有的巨大数据宝库（例如会员/忠诚度计划数据库、来自在线服务/零售店的计费数据、CRM
    系统等），它们可以更有效地竞争。在这个数据宝库中，蕴藏着公司可以转化为竞争优势的洞察。这些洞察使公司能够了解潜在的客户细分群体及其特征。


    例如，在美国，许多人熟悉消费者信用评分的使用。消费者信用评分帮助银行了解申请贷款（汽车贷款、抵押贷款等）的客户的风险状况。这反过来使银行能够根据个人所属的风险细分群体调整其利率。


    另一个例子是电信行业。许多电信提供商努力获取洞察，以了解如何有效地向属于两大群体（企业客户和个人消费者）的客户进行销售。为了找出针对消费者的有效营销策略，电信提供商通常对使用服务的个人画像感兴趣。具有相似画像的人被归为一组，并提供吸引该画像的折扣或增值服务。电信提供商考虑的特征（非详尽列表）包括收入群体、亲友通话频率、通话/短信次数及发生时间、如何支付月账单（在线、自助服务终端、实体店）、付款延迟等。


    在各类无监督机器学习技术中，k-means 聚类是用于执行客户细分的常用技术。在本章中，您将学习如何使用 Microsoft Azure 机器学习对 Wikipedia
    SP 500 数据集（ML Studio 中可用的示例数据集之一）执行 k-means 聚类。


    Wikipedia SP 500 数据集包含以下信息：行业类别，以及描述标准普尔 500 指数（SP500）中每家公司的文本。您将构建并部署一个 k-means
    聚类模型来对公司进行细分。由于从文本中提取的特征数量众多，您将执行一个 R 脚本来执行主成分分析，以识别用于确定聚类的前 10 个特征。执行 k-means
    聚类后，彼此相似的公司（基于从公司描述性文本中提取的特征）将被分配到同一细分群体。


    ![Image](img/00013.jpeg) **注意** 有关不同统计和机器学习算法的概述，请参阅第 4 章。在本章中，您还将了解聚类算法的类别，以及
    K-Means 聚类的工作原理。


    构建和部署您的第一个 K-Means 聚类模型


    为了帮助您开始构建第一个 k-means 聚类模型，您将使用 ML Studio 中提供的示例实验之一。该实验使用 k-means 聚类对标准普尔 500
    指数（S&P 500）列表中的公司进行细分。

