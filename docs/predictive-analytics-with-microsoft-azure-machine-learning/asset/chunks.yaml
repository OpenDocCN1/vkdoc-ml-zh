    # 构建预测性维护模型


    领先的制造商现在正在投资预测性维护，这有可能降低成本，同时提高利润率和客户满意度。尽管统计和制造等传统技术有所帮助，但该行业仍然受到严重质量问题和组件故障时业务中断的高成本的困扰。机器学习的进步为提高客户满意度和减少服务停机时间提供了独特的机会。本章展示了如何使用
    Microsoft Azure Machine Learning 构建预测性维护模型。通过示例，我们将演示如何使用 Microsoft Azure Machine
    Learning 构建、验证和部署用于预测性维护的预测模型。


    ## 概述


    据故障检测专家、前 NASA 访问研究员 Ahmet Duyar 称，制造业生产力下降的一个关键原因是设备故障和不必要的维护干预导致的低资产效率。仅在美国，过度维护和生产力损失的成本估计为
    7400 亿美元，因此我们显然需要更好的维护方法（Duyar, 2011）。


    预测性维护技术旨在预测何时应对设备进行维护，甚至在设备发生故障之前。通过准确预测组件故障，您可以减少计划外停机时间并延长设备寿命。预测性维护还可以节省成本，因为它提高了维修效率：工程师可以将维修工作定位到预测的故障，从而更快地完成工作。他们无需花费太多时间试图找出设备故障的原因。通过预测性维护，工厂操作员可以更加主动，甚至在设备发生故障之前解决问题。


    值得澄清预测性维护和预防性维护之间的区别，因为两者经常被混淆。预防性维护是指通常提前计划的定期维护。虽然有用且在許多情况下是必要的，但预防性维护可能成本高昂，并且在捕捉计划维护间隔期间出现的问题方面效果不佳。相比之下，预测性维护旨在预测故障发生之前。


    让我们以汽车保养为例来说明区别。当您购买汽车时，经销商通常会根据时间或里程推荐定期保养。例如，一些汽车制造商建议在 6,000 和 10,000 英里后进行全面保养。这是预防性维护的一个很好的例子。当您接近
    6,000 英里时，您的经销商会发送提醒，让您安排全面保养。相比之下，通过预测性维护，许多汽车制造商更愿意通过传感器从您的汽车中继到数据库系统的数据，持续监控您的汽车性能。有了这些数据，他们可以检测到您的变速箱或正时皮带何时开始出现即将发生故障的迹象，并会致电您进行维护，无论您的汽车里程数如何。


    预测性维护是一种在设备正常运行期间进行的非破坏性监控形式。安装在设备上的传感器收集有价值的数据，可用于预测和防止故障。


    当前的预测性维护技术包括振动分析、声学分析、红外监测、油液分析和基于模型的状态建模。振动分析使用安装在电机上的加速度计等传感器来确定其何时运行异常。据 Ahmet
    Duyar 称，振动分析是使用最广泛的状态监测方法，占所有销售系统的 85%。声学分析使用声波或超声波分析来检测旋转机器中的异常摩擦和应力。虽然声波技术可以检测机械机器中的问题，但超声波更灵活，可以检测机械和电气设备中的问题。红外分析具有最广泛的应用范围，涵盖低速到高速设备以及机械和电气设备。


    基于模型的状态监测使用数学模型来预测故障。该技术最初由 NASA 开发，有一个学习阶段，在此阶段学习正常运行状态的特征。学习阶段完成后，系统进入生产阶段，在此阶段监控设备状况。它将设备的性能与学习阶段收集的数据进行比较，如果检测到机器正常运行状态出现严重偏差，则会标记问题。这是一种异常检测形式，当机器显著偏离正常运行状态时，监控系统会标记问题。


    ![Image](images/00013.jpeg) **注意** 有关预测性维护的更多详细信息，请参阅以下资源：


    ```

    http://en.wikipedia.org/wiki/Predictive_maintenance

    ```


    以及 Ahmet Duyar, “Simplifying predictive maintenance”, Orbit Vol. 31 No.1, pp.
    38-45, 2011。


