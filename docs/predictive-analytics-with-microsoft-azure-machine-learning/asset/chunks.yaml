    ## Building Customer Propensity Models


    This chapter will provide a practical guide for building machine learning models.
    It focuses on buyer propensity models, showing how to apply the data science process
    to this business problem. Through a step-by-step guide, this chapter will explain
    how to apply key concepts and leverage the capabilities of Microsoft Azure Machine
    Learning for propensity modeling.


    ### The Business Problem


    Imagine that you are a marketing manager of a large bike manufacturer. You have
    to run a mailing campaign to entice more customers to buy your bikes. You have
    a limited budget and your management wants you to maximize the return on investment
    (ROI). So the goal of your mailing campaign is to find the best prospective customers
    who will buy your bikes.


    With an unlimited budget the task is easy: you can simply buy lists and mail everyone.
    However, this brute force approach is wasteful and will yield a limited ROI since
    it will simply amount to junk mail for most recipients. It is very unlikely that
    you will meet your goals with this untargeted approach since it will lead to very
    low response rates.


    A better approach is to use predictive analytics to target the best potential
    customers for your bikes, such as customers who are most likely to buy bikes.
    This class of predictive analytics is called buyer propensity models or customer
    targeting models. With this approach, you build models that predict the likelihood
    that a prospective customer will respond to your mailing campaign.


    In this chapter, we will show you how to build this class of models in Azure Machine
    Learning. With the finished model you will score prospective customers and only
    mail those who are most likely to respond to your campaign. We will also show
    how you can maximize the ROI on your limited marketing budget.


    ![Image](images/00013.jpeg) **Note** You will need to have an account on Azure
    Machine Learning. Refer to [Chapter 2](#part0010.html) for instructions to set
    up your new account if you do not have one yet.


    As you saw in [Chapter 1](#part0009.html), the data science process typically
    follows these five steps.


    1.  Define the business problem.

    2.  Data acquisition and preparation.

    3.  Model development.

    4.  Model deployment.

    5.  Monitor model performance.


    Having defined the business problem, you will explore data acquisition and preparation,
    model development, and evaluation in the rest of this chapter.


