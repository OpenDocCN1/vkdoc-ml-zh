    神经网络模型的开发分为两个步骤：训练和测试。在训练过程中，你将训练集中的一组样本展示给神经网络。每个样本都包含自变量和响应变量的值。在训练过程中，你会多次向神经网络展示这些样本。在每次迭代中，网络都会预测响应值。在训练的前向传播阶段，隐藏层和输出层中的每个节点都会计算其输入的加权和，然后通过激活函数利用这个和来计算其输出。神经网络中每个神经元的输出通常使用以下
    S 型激活函数：


    ![image](img/00058.jpeg)


    然而，神经网络中也可以使用其他激活函数，例如高斯函数、双曲正切函数（tanh）、线性阈值函数，甚至简单的线性函数。


    假设有 M 个输入节点。输入节点与第一个隐藏层之间的连接权重用 *w*¹[*ij*] 表示。


    在每个隐藏节点处，加权和的计算公式如下：


    ![image](img/00059.jpeg)


    计算出加权和后，S 型激活函数的计算方式如下：


    ![image](img/00060.jpeg)


    在计算出输出节点的激活水平后，反向传播阶段开始。在此阶段，算法根据实际的响应值计算其预测的误差。利用梯度下降法，它根据误差按比例调整所有连接的权重。权重的调整方式旨在减少下一次的误差。经过多次迭代，神经网络会收敛到一个解。


    在测试过程中，你只需使用训练好的模型对记录进行评分。对于每条记录，神经网络会根据给定的输入变量集预测响应变量的值（参见图 4-2）。


    ![9781484204467_Fig04-02.jpg](img/00061.jpeg)


    图 4-2. 一个包含三层的神经网络：一个输入层、一个隐藏层和一个输出层


    学习率决定了收敛到解的速度。如果学习率过低，算法将需要更多的学习迭代（因此也需要更多时间）才能收敛到最小值。相反，如果学习率过大，算法会来回震荡，可能永远找不到局部最小值。因此，神经网络将成为一个糟糕的预测器。


    另一个重要参数是隐藏节点的数量。神经网络的准确性可能会随着隐藏节点数量的增加而提高。然而，这也会增加处理时间，并可能导致过拟合。通常，增加隐藏节点或隐藏层的数量很容易导致参数过多，从而增加过拟合的风险。一个经验法则是，初始隐藏节点数大致等于输入节点数的平方根。另一个通用经验法则是，隐藏层中的神经元数量应介于输入层大小和输出层大小之间。例如，（输入节点数
    + 输出节点数）× 2/3。这些经验法则仅仅是起点，旨在避免过拟合；最佳数量只能通过实验和在测试数据上验证性能来找到。


    决策树


    决策树算法是一种分层技术，它通过基于特定的统计标准迭代地分割数据集来工作。决策树的目标是最大化树中不同节点之间的方差，并最小化每个节点内部的方差。图 4-3
    展示了一个简单的决策树，它通过两次数据分割创建而成。根节点（节点 0）包含数据集中的所有数据。算法根据定义的统计量分割数据，创建三个新节点（节点 1、节点
    2 和节点 3）。使用相同的统计量，它在节点 1 处再次分割数据，创建出另外两个叶节点（即节点 4 和节点 5）。决策树通过遍历到叶节点（即终端节点之一：节点
    2、3、4 或 5）来对每一行数据进行预测。


    ![9781484204467_Fig04-03.jpg](img/00062.jpeg)


    图 4-3. 一个包含两次数据分割的简单决策树


    图 4-4 展示了一个虚构的非常简单的决策树示例，用于预测客户是否会购买自行车。在这个例子中，原始数据集包含 100 个样本。预测能力最强的变量是年龄，因此决策首先按年龄分割数据。年龄小于
    30 岁的客户进入左分支，而年龄在 30 岁及以上的客户进入右分支。下一个最重要的变量是性别，因此在下一层，决策树按性别分割数据。在年轻分支（即针对 30
    岁以下的客户）中，决策树将数据分割为男性和女性分支。对于年长分支，它也执行相同的操作。最后，图 4-4 显示了每个节点中的样本数量以及购买概率。因此，如果你有一位
    23 岁的女性客户，该树预测她只有 30%的几率购买自行车，因为她最终会进入节点 3。一位 45 岁的男性客户将有 80%的几率购买自行车，因为他最终会进入树中的节点
    6。


    ![9781484204467_Fig04-04.jpg](img/00063.jpeg)


    图 4-4. 一个用于预测购买自行车可能性的简单决策树


    一些最常用的决策树算法包括迭代二分器 3（ID3）、C4.5 和 C5.0（ID3 的后继者）、自动交互检测（AID）、卡方自动交互检测（CHAID）以及分类与回归树（CART）。虽然非常有用，但
    ID3、C4.5、C5.0 和 CHAID 算法是分类算法，不适用于回归。顾名思义，CART 算法既可用于分类也可用于回归。


    如何选择在每个层级用于分割数据的变量？每个决策树算法使用不同的统计量来选择最佳的分割变量。ID3、C4.5 和 C5.0 使用信息增益，而 CART 使用一种称为基尼不纯度的度量。基尼不纯度衡量随机选择样本的错误分类率。


    ![Image](img/00013.jpeg) **注意**  关于决策树的更多信息，可参阅 S. Chiu 和 D. Tavella 合著的《Data
    Mining and Market Intelligence for Optimal Market Returns》（英国牛津，Butterworth-Heinemann
    出版社，2008 年）以及[`en.wikipedia.org/wiki/Decision_tree_learning`](http://en.wikipedia.org/wiki/Decision_tree_learning)。


    提升决策树


    提升决策树是集成模型的一种形式。与其他集成模型一样，提升决策树使用多个决策树来产生更优的预测器。每个单独的决策树可能是弱预测器。然而，当它们组合在一起时，会产生更优的结果。


    如第 1 章所述，构建集成模型有三个关键步骤：a) 数据选择，b) 训练分类器，c) 组合分类器。

