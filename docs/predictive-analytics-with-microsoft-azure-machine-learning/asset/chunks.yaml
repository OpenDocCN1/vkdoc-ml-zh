    *   Are the values in each column numeric or categorical?

    *   Does a column consists of many missing values?


    Once you understand the data, you can start building the churn model using the
    following steps.


    1.  Data preparation and understanding

    2.  Data preprocessing and feature selection

    3.  Classification model for predicting customer churn

    4.  Evaluating the performance of the model

    5.  Operationalizing the model


    In this chapter, you will learn how to perform each of these steps to build a
    churn model for a telecommunication use case. You will learn the different tools
    that are available in Azure Machine Learning Studio for understanding the data
    and performing data preprocessing. And you will learn the different performance
    metrics that are used for evaluating the effectiveness of the model. Let’s get
    started!


    Building and Deploying a Customer Churn Model


    In this section, you will learn how to build a customer churn model using different
    classification algorithms. For building the customer churn model, you will be
    using a telecommunication dataset from KDD Cup 2009\. The dataset is provided
    by a leading French telecommunication company, Orange. Based on the Orange 2013
    Annual Report, Orange has 236 million customers globally (15.5 million fixed broadband
    customers and 178.5 million mobile customers).


    The goal of the KDD Cup 2009 challenge is to build an effective machine learning
    model for predicting customer churn, willingness to buy new products/services
    (appetency), and opportunities for up-selling. In this section, you will focus
    on predicting customer churn.


    ![Image](images/00013.jpeg) **Note**  KDD Cup is an annual competition organized
    by the ACM Special Interest Group on Knowledge Discovery and Data Mining (SIGKDD).
    Each year, data scientists participate in various data mining and knowledge discovery
    challenges. These challenges range from predicting who is most likely to donate
    to a charity (1997), clickstream analysis for an online retailer (2000), predicting
    movie rating behavior (2007), to predicting the propensity of customers to switch
    providers (2009).


    Preparing and Understanding Data


    In this exercise, you will use the small Orange dataset, which consists of 50,000
    rows. Each row has 230 columns (referred to as variables). The first 190 variables
    are numerical and the last 40 variables are categorical.


    Before you start building the experiment, download the following small dataset
    and the churn labels from the KDD Cup web site:


    *   orange_small_train.data.zip - [www.sigkdd.org/site/2009/files/orange_small_train.data.zip](http://www.sigkdd.org/site/2009/files/orange_small_train.data.zip)

    *   orange_small_train_churn.labels - [www.sigkdd.org/site/2009/files/orange_small_train_churn.labels](http://www.sigkdd.org/site/2009/files/orange_small_train_churn.labels)


    In the orange_small_train_churn.labels file, each line consists of a +1 or -1
    value. The +1 value refers to a positive example (the customer churned), and the
    -1 value refers to a negative example (the customer did not churn).


    Once the file has been uploaded, you should upload the dataset and the labels
    to Machine Learning Studio, as follows:


    1.  Click **New** and choose **Dataset ![image](images/00044.jpeg) From Local
    File** ([Figure 6-2](#part0016.html#Fig2)).


    ![9781484204467_Fig06-02.jpg](images/00094.jpeg)


    [Figure 6-2](#part0016.html#_Fig2). Uploading the Orange dataset using Machine
    Learning Studio


    2.  Next, choose the file to upload: **orange_small_train.data** ([Figure 6-3](#part0016.html#Fig3))
    .


    ![9781484204467_Fig06-03.jpg](images/00095.jpeg)


    [Figure 6-3](#part0016.html#_Fig3). Uploading the dataset


    3.  Click **OK**.


    After the Orange dataset has been uploaded, repeat the steps to upload the churn
    labels file to Machine Learning Studio. Once this is done, you should be able
    to see the two Orange datasets when you create a new experiment. To do this, create
    a new experiment, and expand the Saved Datasets menu in the left pane. [Figure
    6-4](#part0016.html#Fig4) shows the Orange training and churn labels datasets
    that you uploaded.


    ![9781484204467_Fig06-04.jpg](images/00096.jpeg)


    [Figure 6-4](#part0016.html#_Fig4). Saved Datasets, Orange Training Data and Churn
    Labels


    When building any machine learning model, it is very important to understand the
    data before trying to build the model. To do this, create a new experiment as
    follows.


    1.  Click **New** ![image](images/00044.jpeg) **Experiment**.

    2.  Name the experiment - **Understanding the Orange Dataset**.

    3.  From **Saved Datasets**, choose the **orange_small_train.data** dataset (double-click
    it).

    4.  From **Statistical Functions**, choose **Descriptive Statistics** (double-click
    it).

    5.  You will see both modules. Connect the dataset with the **Descriptive Statistics**
    module. [Figure 6-5](#part0016.html#Fig5) shows the completed experiment.


    ![9781484204467_Fig06-05.jpg](images/00097.jpeg)


    [Figure 6-5](#part0016.html#_Fig5). Understanding the Orange dataset


    6.  Click **Run**.

    7.  Once the run completes successfully, right-click the circle below **Descriptive
    Statistics** and choose **Visualize**.

    8.  You will see an analysis of the data, which covers Unique Value Count, Missing
    Value Count, Min, and Max for each of the variables ([Figure 6-6](#part0016.html#Fig6)).


    ![9781484204467_Fig06-06.jpg](images/00098.jpeg)


    [Figure 6-6](#part0016.html#_Fig6). Descriptive statistics for the Orange dataset


    This provides useful information on each of the variables. From the visualization,
    you will observe that there are lots of variables with missing values (e.g., Var1,
    Var8). For example, Var8 is practically a column with no useful information.


    ![Image](images/00013.jpeg) **Tip**  When visualizing the output of **Descriptive
    Statistics**, it shows the top 100 variables. To see all the statistics for all
    the 230 variables, right-click the bottom circle of **Descriptive Statistic**
    module and choose **Save as dataset**. After the dataset has been saved, you can
    choose to download the file and see all the rows in Excel.


    Data Preprocessing and Feature Selection


    In most classification tasks, you will often have to identify which of the variables
    should be used to build the model. Machine Learning Studio provides two feature
    selection modules that can be used to determine the right variables for modeling.
    This includes filter-based feature selection and linear discriminant analysis.'
