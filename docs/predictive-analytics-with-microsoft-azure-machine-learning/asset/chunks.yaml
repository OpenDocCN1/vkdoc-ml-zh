    ## 引言


    数据科学和机器学习需求旺盛，因为客户越来越多地寻求从其数据中收集见解的方法。现在，越来越多的客户意识到商业智能是不够的，因为数据的数量、速度和复杂性已经超越了传统的分析工具。虽然商业智能处理描述性和诊断性分析，但数据科学通过预测性和规范性分析开启了新的机遇。


    本书概述了数据科学，并深入介绍了微软最新的预测分析服务——`Microsoft Azure Machine Learning`。本书提供了一种结构化的数据科学方法，以及解决实际业务问题（如买家倾向建模、客户流失分析、预测性维护和产品推荐）的实用指南。微软这项新服务的简洁性将有助于将数据科学和机器学习带给比现有产品更广泛的受众。了解如何使用微软新的
    `Azure Machine Learning` 服务，快速构建和部署复杂的预测模型作为机器学习 Web 服务。


    ## 本书读者对象


    本书面向数据科学家、业务分析师、BI 专业人员和开发人员。


    读者需要具备统计学和数据分析的基本技能。尽管如此，读者无需成为数据科学家或拥有深厚的数据挖掘技能即可从本书中受益。


    ## 您将学到什么


    本书将提供以下内容：


    *   数据科学的深厚背景知识，以及如何使用结构化的方法和最佳实践解决业务数据科学问题

    *   如何使用 `Microsoft Azure Machine Learning` 服务有效地构建和部署预测模型作为机器学习 Web 服务

    *   展示如何解决典型预测分析问题（如倾向建模、流失分析和产品推荐）的实用示例。


    在本书结束时，您将获得基本数据科学、数据挖掘过程的基本技能，并对新的 `Microsoft Azure Machine Learning` 服务有清晰的理解。您还将拥有使用机器学习解决实际业务问题的框架。


    ## 第一部分


    ![image](images/00007.jpeg)


    ### 介绍数据科学和 Microsoft Azure Machine Learning


    ## 第一章


