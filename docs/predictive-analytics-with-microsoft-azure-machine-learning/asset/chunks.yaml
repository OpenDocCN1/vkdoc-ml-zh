    第 4 章提供了其中一些算法的更多细节。


    分类算法


    分类算法通常用于将人或事物划分到多个组别中的某一个。它们也广泛用于预测。例如，为了防止欺诈，发卡机构会将信用卡交易分类为欺诈性或非欺诈性。发卡机构通常拥有大量历史信用卡交易数据，并了解每笔交易的状态。其中许多案例是由合法的持卡人报告的，他们不想为未经授权的费用买单。因此，发卡机构知道每笔交易是否属于欺诈。利用这些历史数据，发卡机构现在可以构建一个模型，用于预测新的信用卡交易是否可能属于欺诈。这是一个二元分类问题，所有案例都归属于两个类别之一。


    另一个分类问题是客户升级到高级电话套餐的倾向性。在这种情况下，无线运营商需要知道客户是否会升级到高级套餐。利用销售和使用数据，运营商可以确定哪些客户过去曾升级过。因此，他们可以将所有客户分为两组：升级或未升级。由于运营商还拥有新老客户的人口统计和行为数据，他们可以构建一个模型来预测新客户升级的可能性；换句话说，该模型会将每个客户归入两个类别之一。


    统计学和数据挖掘提供了许多优秀的分类工具：包括逻辑回归（统计学家广泛用于构建信用评分卡或购买倾向模型）、或神经网络算法（如反向传播、径向基函数或岭多项式网络）。其他还包括决策树或集成模型，如提升决策树或随机森林。对于具有两个以上类别的更复杂的分类问题，可以使用预测多个类别的多模态技术。分类问题通常使用监督学习算法，这些算法使用带标签的数据进行训练。Azure
    机器学习提供了多种分类算法，包括逻辑回归、决策树、提升决策树、多模态神经网络等。更多详情请参见第 4 章。


    聚类算法


    聚类使用无监督学习将数据分组到不同的类别中。聚类问题和分类问题的一个主要区别在于，聚类的结果事先是未知的。在聚类之前，我们不知道每个数据点属于哪个簇。相比之下，对于分类问题，我们有历史数据显示每个数据点属于哪个类别。例如，贷款机构从历史数据中知道客户是否拖欠了汽车贷款。


    聚类的一个很好的应用是客户细分，我们将客户划分为不同的细分市场以进行营销。在一个好的细分模型中，每个细分市场内的数据非常相似。然而，不同细分市场之间的数据差异很大。例如，游戏行业的营销人员需要更好地了解其客户，以便为他们制定合适的优惠方案。假设他/她只有关于客户的两个变量，即年龄和游戏强度。通过聚类，营销人员发现游戏客户存在三个不同的细分市场，如图
    1-7 所示。细分市场 1 是重度游戏玩家，他们每天热衷于玩电脑游戏，并且通常很年轻。细分市场 2 是休闲游戏玩家，他们只是偶尔玩游戏，通常在三四十岁。非游戏玩家很少玩电脑游戏，通常年龄较大；他们构成了细分市场
    3。


    ![9781484204467_Fig01-07.jpg](img/00015.jpeg)


    图 1-7。来自聚类算法的简单假设客户细分


    统计学提供了几种聚类工具，但最广泛使用的是 k-means 算法，它使用距离度量将相似的数据聚类在一起。使用此算法，您可以预先决定想要多少个簇；这就是常数
    K。如果您设置 K = 3，算法将生成三个簇。有关 k-means 算法的更多详细信息，请参考 Haralambos Marmanis 和 Dmitry Babenko
    的著作。机器学习还提供了更复杂的算法，例如由 Teuvo Kohonen 开发的自组织映射（也称为 Kohonen 网络），或由 Stephen Grossberg
    和 Gail Carpenter 开发的自适应共振理论（ART）网络。聚类算法通常使用无监督学习，因为在训练期间结果是未知的。


    ![Image](img/00013.jpeg) **注意**  您可以在以下书籍和论文中阅读更多关于聚类算法的内容：


    《智能网络算法》，Haralambos Marmanis 和 Dmitry Babenko 著。Manning Publications Co.，斯坦福德，康涅狄格州。2011
    年 1 月。


    《自组织映射。第三扩展版》。


    Springer。Kohonen, T. 2001 年。“Art2-A：一种用于快速类别学习和识别的自适应共振算法”，Carpenter, G., Grossberg,
    S., 和 Rosen, D. 著。Neural Networks, 4:493-504。1991a。


    回归算法


    回归技术用于预测具有数值结果的响应变量。例如，无线运营商可以使用回归技术来预测其客服中心的呼叫量。有了这些信息，他们可以分配适当数量的客服中心人员以满足需求。回归模型的输入变量可以是数值型或分类型。然而，这些算法的共同点是输出（或响应变量）通常是数值型的。一些最常用的回归技术包括线性回归、决策树、神经网络和提升决策树回归。


    线性回归是统计学中最古老的预测技术之一，其目标是根据一组观测变量预测给定的结果。一个简单的线性回归模型是一个线性函数。如果只有一个输入变量，线性回归模型就是最适合数据的直线。对于两个或更多输入变量，回归模型就是最适合底层数据的超平面。


    人工神经网络是一组模仿大脑功能的算法。它们通过示例学习，并且即使映射响应变量与自变量之间的函数未知，也能被训练从数据集中进行预测。有许多不同的神经网络算法，包括反向传播网络和径向基函数（RBF）。然而，最常见的是反向传播，也称为多层感知器。神经网络用于回归或分类。


    决策树算法是一种分层技术，它基于某些统计标准迭代地分割数据集。决策树的目标是最大化树中不同节点之间的方差，并最小化每个节点内部的方差。一些最常用的决策树算法包括迭代二分器
    3（ID3）、C4.5 和 C5.0（ID3 的后继者）、自动交互检测（AID）、卡方自动交互检测（CHAID）以及分类与回归树（CART）。虽然非常有用，但
    ID3、C4.5、C5.0 和 CHAID 算法是分类算法，不适用于回归。另一方面，CART 算法既可用于分类也可用于回归。


