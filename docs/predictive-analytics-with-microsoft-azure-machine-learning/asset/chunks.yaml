    衡量ROC曲线性能的一种方法是测量曲线下面积（AUC）。曲线下面积越高，模型性能越好。理想模型的AUC为1.0，而随机猜测的AUC为0.5。您构建的逻辑回归模型的AUC为0.689，这比随机猜测好得多！


