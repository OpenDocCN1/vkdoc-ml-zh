    ![9781484204467_Fig07-02.jpg](img/00119.jpeg)


    图 7-2. ML Studio 中的实验示例


    ![9781484204467_Fig07-03.jpg](img/00120.jpeg)


    图 7-3. 在 ML Studio 中创建您的第一个 k-means 聚类模型


    特征哈希


    在机器学习中，输入特征可以是自由文本。表示自由文本的一种常见方法是使用词袋模型。每个单词被表示为一个标记。每当该单词在文本中出现时，该标记被赋值为 1。如果单词未出现，则赋值为
    0。


    然而，词袋模型无法扩展，因为事先无法知道可能的单词数量。想象一下为每个 S&P 500 公司描述文本中的每个单词都表示一个标记。输入的维度可能会非常大。因此，一种常见的方法是使用哈希函数将所有标记转换为数值特征，并限制可能的哈希值范围。为此，特征哈希（也称为“哈希技巧”）在机器学习社区中被广泛用于在数据集用作机器学习算法的输入之前对其进行预处理。


    在此示例中，**特征哈希**模块用于对 S&P 500 公司的描述文本执行哈希运算。在底层，特征哈希模块使用 Vowpal Wabbit 库执行 32 位
    MurmurHash 哈希。在本练习中，哈希位大小设置为 **12**，并使用 **N-grams**。执行特征哈希模块后，您将看到描述文本已被转换为大量列，列名以
    Text_HashingFeature_ 为前缀（如图 7-4 所示）。


    ![9781484204467_Fig07-04.jpg](img/00121.jpeg)


    图 7-4. 特征哈希


    ![Image](img/00013.jpeg) **注意**  Vowpal Wabbit 库是一个开源机器学习库。有关更多信息，请参阅 [`github.com/JohnLangford/vowpal_wabbit/wiki/Tutorial`](https://github.com/JohnLangford/vowpal_wabbit/wiki/Tutorial)。


    MurmurHash 是一族非加密哈希函数，具有良好的分布性、雪崩效应和抗碰撞性。有关 MurmurHash 哈希函数族的更多信息，请参阅 [`code.google.com/p/smhasher/`](https://code.google.com/p/smhasher/)。


    识别正确的特征


    当使用 k-means 聚类进行客户细分时，您需要识别将在聚类过程中使用的特征。执行特征哈希后，将基于描述文本计算出大量特征。


    **主成分分析** (PCA) 是一种强大的统计技术，可用于识别较少数量的特征（即主成分），这些特征能够捕捉原始特征的关键本质。


    在此示例实验中，您将学习如何使用 R 执行主成分分析。具体来说，您将使用**执行 R 脚本**模块来执行以下 R 脚本（该脚本已作为示例实验的一部分提供）。


    ```

    # 将基于 1 的可选输入端口映射到变量

    dataset1 <- maml.mapInputPort(1) # 类别: data.frame


    # 示例操作

    titles_categories = dataset1[,1:2]

    pca = prcomp(dataset1[,4:4099])

    top_pca_scores = data.frame(pca$x[,1:10])

    data.set = cbind(titles_categories,top_pca_scores)


    # 您将在 R 设备端口中看到此输出。

    # 它将包含您的 stdout、stderr 和 PNG 图形设备。

    plot(pca)


    # 选择要发送到输出数据集端口的数据框

    maml.mapOutputPort("data.set");

    ```


    从 R 脚本中，您会注意到使用了 R 函数 prcomp。prcomp 的输入包括 dataset1 的第 4 列到第 4099 列。计算结果存储在变量 pca
    中。对于此示例实验，您将获取前 10 个主成分，并将它们用作 k-means 聚类算法的输入。


    运行实验后，您可以单击**执行 R 脚本**模块，并选择可视化结果数据集。图 7-5 显示了结果数据集以及计算出的前 10 个主成分 (PC)。


    ![9781484204467_Fig07-05.jpg](img/00122.jpeg)


    图 7-5. 结果数据集的可视化（数据集的前 10 个主成分）


    ![Image](img/00013.jpeg) **注意**  请参阅 [`en.wikipedia.org/wiki/Principal_component_analysis`](http://en.wikipedia.org/wiki/Principal_component_analysis)
    以了解有关 PCA 的更多信息。


    在 R 中，有几个函数可用于执行 PCA。这些函数包括 pca()、prcomp() 和 princomp()。prcomp() 是常用的函数，因为它在数值上更稳定，并且返回一个包含以下信息的
    R 对象：特征向量、特征值的平方根以及得分。


    请参阅第 3 章 以了解有关如何将 R 与 Azure 机器学习结合使用的更多信息。


    K-Means 聚类的属性


    从图 7-3 中，您将看到 k-means 聚类在实验中使用了两次。两个 k-means 聚类模块之间的主要区别在于质心数量（即 k 值）。这也与您希望从
    k-means 算法中获得的片段或聚类数量相同。对于左侧的 k-means 聚类，示例实验指定 k 值为 3（即 k-means 聚类模型将识别 3 个聚类）；而右侧的
    k-means 聚类模型指定 k 值为 4。


    您可以通过单击每个 k-means 聚类矩形来查看指定的质心数量。图 7-6 显示了 K-Means 聚类模型的各种属性，包括


    *   质心数量

    *   度量：用于计算聚类之间距离的度量

    *   初始化：用于指定初始质心种子的方法

    *   迭代次数：使用的迭代次数


    ![9781484204467_Fig07-06.jpg](img/00123.jpeg)


    图 7-6. k-means 聚类模型的属性

