    Training the Model


    Once the data pre-processing is done, you are ready to train the predictive model.
    The first step is to choose the right type of algorithm for the problem at hand.
    For a propensity model, you will need a classification algorithm since your target
    variable is Boolean. The goal of your model is to predict whether a prospective
    customer will buy your bikes or not. Hence, it is a great example of a binary
    classification problem. As you saw in [Chapters 1](#part0009.html) and [4](#part0013.html),
    classification algorithms use supervised learning for training. The training data
    has known outcomes for each feature set; in other words, each row in the historical
    data has the Bike Buyer field that shows whether the customer bought a bike or
    not. The Bike Buyer field is the dependent variable (also known as the response
    variable) that you have to predict. The input variables are the predictors (also
    known as independent variables or regressors) such as age, cars, commuting distance,
    education, region, etc. If you use logistic regression, your model can be represented
    as follows:


    ![image](images/00083.jpeg)


    where b0 is a constant which is the intercept of the regression line; b1, b2,
    b3, etc. are the coefficients of the independent variables. e is the error that
    represents the variability in the data that is not explained by the selected variables.
    In this equation, *BikeBuyer* is the probability that a customer will buy a bike.
    Its value ranges from 0 to 1\. *Age, cars,* and *Communte_distance* are the predictor
    variables.


    During training, you present both the input and the output variables to the selected
    algorithm. At each learning iteration, the algorithm will try to predict the known
    outcome, using the current weights that have been learned so far. Initially, the
    prediction error is high because the weights have not been learned adequately.
    In subsequent iterations, the algorithm will adjust its weights to reduce the
    predictive error to the minimum. Note that each algorithm uses a different strategy
    to adjust the weights such that predictive error can be reduced. See [Chapter
    4](#part0013.html) for more details on the statistical and machine learning algorithms
    in Azure Machine Learning.


    Azure Machine Learning offers a wide range of classification algorithms from multiclass
    decision forest and jungle to two-class logistic regression, neural network, and
    support vector machines. For a customer propensity model, a two-class classification
    algorithm is appropriate since the response variable (Bike Buyer) has two classes.
    So you can use any of the two-class algorithms under the **Classification** sub-category.
    To see the full list of algorithms, expand the category named **Initialize Model**
    in the left pane. Expand the sub-category named **Classification** and Azure Machine
    Learning will list all available classification algorithms. We recommend experimenting
    with a few of these algorithms until you find the best one for the job. [Figure
    5-13](#part0015.html#Fig13) shows a simple but complete experiment for the bike
    buyer propensity model.


    ![9781484204467_Fig05-13.jpg](images/00084.jpeg)


    [Figure 5-13](#part0015.html#_Fig13). A simple experiment for customer propensity
    modeling


    The **Project Columns** module simply excluded the column named ID since it is
    not relevant to the model. Use the **Missing Values Scrubber** module to handle
    missing values as discussed in the previous section. The **Split** module splits
    the data into two samples, one for training and the second for testing. In this
    experiment, you reserved 70% of the data for training and the remaining 30% for
    testing. This is one strategy commonly used to avoid over-fitting. Without the
    test sample, the model can easily memorize the data and noise. In that case, it
    will show very high accuracy for the training data but will perform poorly when
    tested with unseen data in production. Another good strategy to avoid over-fitting
    is cross-validation; this will be discussed later in this chapter.


    Two modules are used for training the predictive model: the **Two-class Logistic
    Regression** module implements the logistic regression algorithm, while the **Train
    Model** actually does the training. The **Train Model** module trains any suitable
    algorithm to which it is connected. So it can be used to train any of the classification
    modules discussed earlier, such as **Two-class Boosted Decision Tree, Two-class
    Decision Forest, Two-class Decision Jungle, Two-class Neural Network,** or **Two-class
    Support Vector Machine**.


    Model Testing and Validation


    After the model is trained, the next step is to test it with a hold-out sample
    to avoid over-fitting. In this example, your test set is the 30% sample you created
    earlier with the Split module. [Figure 5-13](#part0015.html#Fig13) shows how you
    use the module named **Score Model** to test the trained model.


    Finally, the module named **Evaluate Model** is used to evaluate the performance
    of the model. [Figure 5-13](#part0015.html#Fig13) shows how to use this module
    to evaluate the model’s performance on the test sample. The next section also
