  trans: '

    图 5-8 以箱线图而非直方图的形式展示了年收入。在此图中，箱体底部的 y 值为第 25 百分位数，箱体顶部的 y 值为第 75 百分位数。箱体中间的线代表年收入的中位数。箱线图能更清晰地显示异常值：在图
    5-8 中，异常值以三个点的形式显示在须线边缘的上方。异常值是如何确定的？一个经验法则是，任何位于 1.5 倍 IQR 之上或之下的点都是异常值。IQR 是四分位距，计算方法为第
    75 百分位数减去第 25 百分位数。在箱线图中，IQR 是箱体顶部和底部之间的距离。由于你在此案例中不打算剔除异常值，一个很好的替代方案是使用对数函数对年收入进行转换。结果如图
    5-9 所示。现在你可以看到，经过对数转换后，箱线图中的三个点消失了。这意味着三个极端的年收入值不再被视为异常值。这是将有效的极端值纳入模型的一个绝佳方法。这种处理方式还能提高预测模型的效能。


    ![9781484204467_Fig05-08.jpg](img/00078.jpeg)


    图 5-8. 年收入的箱线图


    ![9781484204467_Fig05-09.jpg](img/00079.jpeg)


    图 5-9. 年收入对数的箱线图


    更多数据处理方法


    除了可视化之外，Azure 机器学习还提供了许多其他数据预处理选项。左侧窗格的菜单包含许多按功能组织的模块。其中许多模块可用于数据预处理。


    **数据格式转换** 项下有五个用于转换数据格式的不同模块。例如，名为**转换为 CSV** 的模块可将不同类型的数据（如**数据集、DataTableDotNet**
    等）转换为 CSV 格式。


    菜单中的**数据转换**项包含数据筛选、数据处理、数据采样和缩放等子类别。名为**统计函数**的菜单项也包含许多与数据预处理相关的模块。


    图 5-10 展示了其中一些模块的实际应用。**联接**模块（位于**处理**子类别下）使您能够联接数据集。例如，如果倾向模型有第二个相关数据，您可以使用联接模块将其与自行车购买者数据集联接起来。


    ![9781484204467_Fig05-10.jpg](img/00080.jpeg)


    图 5-10. 更多数据准备选项


    名为**描述性统计**的模块会显示数据集的描述性统计信息。例如，如果您单击此模块底部的小圆圈，Azure 机器学习会显示自行车购买者数据集的描述性统计信息，如均值、中位数、标准差、偏度、峰度等。它还会显示每个变量中缺失值的数量。根据经验法则，如果一个变量有
    40%或更多的缺失值，除非该变量对业务至关重要，否则可以将其从分析中剔除。


    您可以使用名为**缺失值清理器**的模块来处理缺失值。与 Azure 机器学习中的任何其他模块一样，当您选择此模块时，其参数会显示在右侧窗格中。此模块允许您以多种方式处理缺失值。首先，您可以删除包含缺失值的列。默认情况下，该工具会保留所有包含缺失值的变量。其次，您可以在参数框中用硬编码值替换缺失值。默认情况下，该工具会将所有缺失值替换为数字
    0。或者，您也可以使用给定变量的均值、中位数或众数来替换缺失值。


    **线性相关**模块对于计算数据集中变量的相关性也很有用。如果您单击线性相关模块底部的小圆圈，然后选择“可视化”，该工具会显示一个相关矩阵。在此矩阵中，您可以查看数据集中所有变量之间的两两相关性。此模块计算的是皮尔逊相关系数。因此，此模块不支持其他相关类型，如斯皮尔曼相关。此外，请注意此模块仅计算连续变量的相关性。对于分类变量，该模块会显示
    NaN。


    特征选择


    特征选择是数据预处理中非常重要的一部分。也称为变量选择，这是为预测模型寻找正确变量的过程。在处理包含数百个变量的大型数据集时，这一点尤为关键。将超过 600
    个变量扔给预测模型会浪费计算机资源，同时也会降低其预测准确性。通过特征选择，您可以找到对预测最有影响力的变量。由于自行车购买者数据集只有 13 个变量，您可以跳过此步骤。但是，让我们看看如何在
    Azure 机器学习中进行特征选择，因为这对于大型数据集非常重要。


    要在 Azure 机器学习中进行特征选择，请从左侧窗格的模块列表中拖拽名为**基于筛选器的特征选择**的模块。您可以通过在搜索框中搜索或打开**特征选择**类别来找到此模块。要使用此模块，您需要将其作为输入连接到数据集。图
    5-11 展示了它作为自行车购买者数据集的特征选择的使用情况。在运行实验之前，请使用右侧窗格中的**启动列选择器**来定义预测的目标变量。在此案例中，选择**自行车购买者**列作为目标，因为这是您需要预测的内容。


    ![9781484204467_Fig05-11.jpg](img/00081.jpeg)


    图 5-11. Azure 机器学习中的特征选择


    您还需要选择将用于特征选择的评分方法。Azure 机器学习提供以下评分选项：


    *   皮尔逊相关

    *   互信息

    *   肯德尔相关

    *   斯皮尔曼相关

    *   卡方检验

    *   费舍尔分数

    *   基于计数


    相关方法会找出一组与输出高度相关，但彼此之间相关性较低的变量。相关性是使用皮尔逊、肯德尔或斯皮尔曼相关系数计算的，具体取决于您选择的选项。


    费舍尔分数使用统计学中的费舍尔准则对变量进行排序。相比之下，互信息选项是一种信息论方法，它使用互信息对变量进行排序。互信息衡量每个变量的概率密度与结果变量的概率密度之间的依赖性。


    最后，卡方检验选项使用独立性检验来选择最佳特征；换句话说，它检验每个变量是否与结果变量独立。然后，它根据卡方检验对变量进行排序。


    ![Image](img/00013.jpeg) **注意**   有关特征选择策略的更多信息，请参见 [`en.wikipedia.org/wiki/Feature_selection#Correlation_feature_selection`](http://en.wikipedia.org/wiki/Feature_selection#Correlation_feature_selection)
    或 [`jmlr.org/papers/volume3/guyon03a/guyon03a`](http://jmlr.org/papers/volume3/guyon03a/guyon03a).pdf。

    '
- fmt: '# 运行实验时的输出


    当您运行实验时，**Filter Based Feature Selection** 模块会产生两个输出。首先，过滤后的数据集列出了最重要变量的实际数据。其次，该模块会按重要性显示变量列表，并附有每个选定变量的得分。[Figure
    5-12](#part0015.html#Fig12) 展示了特征选择的结果。在此案例中，您将特征数量设置为五个，并使用卡方检验（Chi Squared）进行评分。[Figure
    5-12](#part0015.html#Fig12) 显示了六列，因为结果集包含了目标变量（即 `Bike Buyer`）以及排名前十的变量，包括年龄（`age`）、汽车数量（`cars`）、通勤距离（`commute
    distance`）、教育程度（`education`）和地区（`region`）。结果集的最后一行显示了每个选定变量的得分。由于变量已排序，得分从左到右递减。


    ![9781484204467_Fig05-12.jpg](images/00082.jpeg)


    [Figure 5-12](#part0015.html#_Fig12). 针对 Bike Buyer 数据集的特征选择结果，展示了排名靠前的变量


    请注意，选定的变量会因评分方法的不同而有所差异。因此，在确定最终的变量集之前，尝试不同的评分方法是值得的。对于 BikeBuyer 数据集，卡方检验（Chi
    Squared）和互信息（Mutual Information）评分方法产生了相似的变量排名。


    # 训练模型


    数据预处理完成后，您就可以开始训练预测模型了。第一步是为手头的问题选择合适的算法类型。对于倾向性模型，您需要一个分类算法，因为您的目标变量是布尔型。模型的目标是预测潜在客户是否会购买您的自行车。因此，这是一个典型的二分类问题示例。正如您在[第
    1 章](#part0009.html)和[第 4 章](#part0013.html)中所见，分类算法使用监督学习进行训练。训练数据中每个特征集都有已知的结果；换句话说，历史数据中的每一行都包含
    `Bike Buyer` 字段，该字段指示客户是否购买了自行车。`Bike Buyer` 字段是您需要预测的因变量（也称为响应变量）。输入变量是预测变量（也称为自变量或回归变量），例如年龄（`age`）、汽车数量（`cars`）、通勤距离（`commuting
    distance`）、教育程度（`education`）、地区（`region`）等。如果您使用逻辑回归，您的模型可以表示如下：


    ![image](images/00083.jpeg)


    其中 `b0` 是一个常数，即回归线的截距；`b1`、`b2`、`b3` 等是自变量的系数。`e` 是误差项，表示所选变量无法解释的数据变异性。在此方程中，`BikeBuyer`
    是客户购买自行车的概率。其值范围从 0 到 1。`Age`、`cars` 和 `Commute_distance` 是预测变量。


    在训练过程中，您将输入变量和输出变量都提供给所选算法。在每个学习迭代中，算法将尝试使用当前已学习的权重来预测已知结果。最初，由于权重尚未充分学习，预测误差会很高。在后续迭代中，算法将调整其权重，以将预测误差降至最低。请注意，每种算法都使用不同的策略来调整权重，从而减少预测误差。有关
    Azure 机器学习中统计和机器学习算法的更多详细信息，请参阅[第 4 章](#part0013.html)。


