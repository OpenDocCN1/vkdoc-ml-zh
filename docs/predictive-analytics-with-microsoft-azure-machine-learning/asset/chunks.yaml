    As mentioned earlier, another strategy for avoiding over-fitting is cross-validation
    where you use not just two, but multiple samples of the data to train and test
    the model. Azure Machine Learning uses 10-fold validation where the original dataset
    is split into 10 samples. [Figure 5-14](#part0015.html#Fig14) shows a modified
