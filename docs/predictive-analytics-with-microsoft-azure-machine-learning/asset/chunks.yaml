    *   这是一项完全托管的云服务，无需安装软件、管理硬件，也无需处理操作系统版本或开发环境。

    *   数据科学家只需一个浏览器，即可从任何地点、任何设备登录 Azure 并开始开发机器学习模型。他们可以在 Azure 存储中托管几乎无限数量的文件。

    *   ML Studio 是一个用于机器学习的集成开发环境，它允许你通过易于使用的拖放连接范式，将实验设置为简单的数据流图。数据科学家可以避免为大量常见任务编写程序，从而专注于实验设计和迭代。

    *   提供了许多示例实验，方便你快速上手。

    *   内置了微软研究院开发的一系列精选算法，并支持自定义 R 代码。超过 350 个开源 R 包可以在 Azure ML 中安全使用。

    *   数据流图可以包含多个并行路径，这些路径会自动并行运行，使科学家能够执行复杂的实验并进行并排比较，而无需受限于通常的计算约束。

    *   实验易于共享，因此其他人可以接手你的工作，在你停下的地方继续推进。


    Azure ML 还使得在云中大规模创建生产部署变得简单。预训练的机器学习模型可以整合到评分工作流中，只需点击几下，即可创建一个新的云托管 REST API。该
    REST API 经过精心设计，能够实现低延迟响应。无需重新实现或移植——这是相对于传统数据分析软件的一个关键优势。来自互联网任何地方（笔记本电脑、网站、移动设备、可穿戴设备和联网机器）的数据都可以发送到新创建的
    API 以获取预测结果。例如，数据科学家可以创建一个欺诈检测 API，该 API 将交易信息作为输入，并返回低/中/高风险指标作为输出。这样的 API 随后将在云端“上线”，随时准备接收开发者选择调用的任何软件的调用。API
    后端可以弹性伸缩，因此当交易率飙升时，Azure ML 服务可以自动处理负载。数据科学家可以创建和部署的机器学习 API 数量几乎没有限制——而且这一切都无需依赖工程团队。对于工程和
    IT 团队来说，使用这些 REST API 集成新的机器学习模型变得简单，并且在部署前轻松并排测试多个模型，从而以低成本实现显著更高的敏捷性。Azure 提供了在生产环境中扩展和管理
    API 的机制，包括衡量可用性、延迟和性能的机制。因此，为企业构建稳健、高可用、可靠的机器学习系统并管理生产部署，变得异常快速、廉价和简单，并带来巨大的商业利益。


    我们相信 Azure ML 是一项颠覆性的技术。它使初创公司和大型企业都能利用机器学习的巨大潜力。初创公司现在能够使用以前只有最成熟的企业才能使用的相同能力。大型企业则能够释放其大数据中的潜在价值，以产生显著更多的收入和效率。最重要的是，现在可能实现的迭代和实验速度将允许快速创新，并为我们周围所有云连接设备中的智能铺平道路。


    当我于 1995 年开始职业生涯时，构建和部署信用卡欺诈检测系统需要一个大型组织。借助 Azure ML 这样的工具和云的力量，一位才华横溢的数据科学家就能完成同样的壮举。本书的作者们在数据科学领域拥有丰富的经验，他们编写本书旨在帮助你开启使用
    Azure ML 的精彩旅程。


    —Joseph Sirosh

    微软公司机器学习部门企业副总裁


    引言


    数据科学和机器学习需求旺盛，因为客户越来越多地寻求从其数据中挖掘洞察的方法。现在，越来越多的客户意识到，由于数据的数量、速度和复杂性已经超越了传统分析工具的能力范围，商业智能已不足以应对。虽然商业智能处理描述性和诊断性分析，但数据科学通过预测性和规范性分析开启了新的机遇。


    本书概述了数据科学，并深入介绍了微软最新的预测分析服务——Microsoft Azure Machine Learning。本书提供了一种结构化的数据科学方法，以及解决实际业务问题（如买家倾向性建模、客户流失分析、预测性维护和产品推荐）的实用指南。微软这项新服务的简洁性将有助于将数据科学和机器学习推广到比现有产品更广泛的受众群体。了解如何使用微软新的
    Azure Machine Learning 服务，快速构建和部署复杂的预测模型作为机器学习 Web 服务。


    谁应该阅读本书？


    本书面向数据科学家、业务分析师、商业智能专业人士和开发者。


    读者需要具备统计学和数据分析的基本技能。不过，读者无需是数据科学家或拥有深厚的数据挖掘技能，也能从本书中获益。


    你将学到什么


    本书将提供以下内容：


    *   数据科学的深厚背景知识，以及如何使用结构化方法和最佳实践解决业务数据科学问题

    *   如何使用 Microsoft Azure Machine Learning 服务有效地构建和部署预测模型作为机器学习 Web 服务

    *   展示如何解决典型预测分析问题（如倾向性建模、流失分析和产品推荐）的实践示例


    在本书结束时，你将掌握基础数据科学、数据挖掘过程的基本技能，并对新的 Microsoft Azure Machine Learning 服务有清晰的理解。你还将获得使用机器学习解决实际业务问题的框架。


    第一部分


    ![image](img/00007.jpeg)


    介绍数据科学与 Microsoft Azure Machine Learning


    第一章


    ![image](img/00007.jpeg)


    数据科学导论


    那么，什么是数据科学？为什么它如此热门？它只是另一个在炒作过后就会消失的时尚吗？我们将从数据科学的简单介绍开始，定义它是什么、为什么重要以及为什么是现在。本章重点介绍数据科学过程，并提供指导原则和最佳实践。它介绍了数据科学中一些最常用的技术和算法。并探讨了集成模型，这是数据科学前沿的一项关键技术。


    什么是数据科学？

