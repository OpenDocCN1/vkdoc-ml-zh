    Model Testing and Validation'
  trans: '

    特征选择在此案例中至关重要，因为它能解答你的第二个业务问题。确实，面对超过 590 个特征，你必须执行特征选择，以识别出有助于构建良好模型的特征子集，并剔除无关和冗余的特征。特征过多会带来维度灾难的风险。如果特征数量庞大，学习问题会变得困难，因为大量“额外”特征可能混淆学习算法，导致其产生高方差。同样重要的是，机器学习算法计算量极大，减少特征数量能大幅缩短模型训练所需时间，使数据科学家能在更短时间内进行实验。通过细致的特征选择，你可以找到对预测最具影响力的变量。接下来，让我们看看如何在
    Azure Machine Learning 中进行特征选择。


    要在 Azure Machine Learning 中执行特征选择，请从左侧窗格的模块列表中拖拽名为**基于筛选器的特征选择**的模块。你可以通过在搜索框中搜索，或展开**特征选择**类别来找到该模块。要使用此模块，你需要将其作为输入连接到一个数据集。图
    8-5 展示了如何使用它对 SECOM 数据集进行特征选择。在运行实验之前，请使用右侧窗格中的**启动列选择器**来定义用于预测的目标变量。在此案例中，选择**Yield_Pass_Fail**列作为目标，因为这是你想要预测的内容。完成后，将所需特征数量设置为
    100。这将指示 Azure Machine Learning 中的特征选择器找出前 100 个变量。


    ![9781484204467_Fig08-05.jpg](img/00133.jpeg)


    图 8-5. Azure Machine Learning 中的特征选择


    你还需要选择用于特征选择的评分方法。Azure Machine Learning 提供以下评分选项：


    *   Pearson 相关性

    *   互信息

    *   Kendall 相关性

    *   Spearman 相关性

    *   卡方检验

    *   Fisher 得分

    *   基于计数


    相关性方法会找出一组与输出高度相关，但彼此之间相关性较低的变量。相关性计算使用 Pearson、Kendall 或 Spearman 相关系数，具体取决于你选择的选项。


    Fisher 得分使用统计学中的 Fisher 准则对变量进行排序。相比之下，互信息选项是一种信息论方法，利用互信息对变量进行排序。互信息衡量每个变量的概率密度与结果变量概率密度之间的依赖性。


    最后，卡方检验选项通过独立性检验来选择最佳特征；换句话说，它检验每个变量是否与结果变量独立。然后，它使用卡方检验对变量进行排序。


    ![Image](img/00013.jpeg) **注意**  有关特征选择策略的更多信息，请参见 [`en.wikipedia.org/wiki/Feature_selection#Correlation_feature_selection`](http://en.wikipedia.org/wiki/Feature_selection#Correlation_feature_selection)
    或 [`jmlr.org/papers/volume3/guyon03a/guyon03a.pdf`](http://jmlr.org/papers/volume3/guyon03a/guyon03a.pdf)。


    当你运行实验时，**基于筛选器的特征选择**模块会产生两个输出：首先，筛选后的数据集列出了最重要变量的实际数据。其次，该模块会按重要性显示变量列表，并附有每个选定变量的得分。图
    8-6 展示了特征选择的结果。在此案例中，你将特征数量设置为 100，并使用互信息对变量进行评分和排序。图 8-6 显示了 101 列，因为结果集包含了目标变量（即
    Yield_Pass_Fail）以及前 100 个变量，包括传感器#60、传感器#248、传感器#520、传感器#104 等。结果的最后一行显示了每个选定变量的得分。由于变量已排序，得分从左到右递减。


    ![9781484204467_Fig08-06.jpg](img/00134.jpeg)


    图 8-6. SECOM 数据集特征选择的结果，显示了最重要的变量


    请注意，选定的变量会因评分方法而异，因此在选择最终变量集之前，值得尝试不同的评分方法。对于 SECOM 数据集，卡方检验和互信息评分方法会产生相似的变量排序。


    训练模型


    完成数据预处理后，下一步是训练模型以预测良率。由于响应变量是二元的，你可以将其视为二元分类问题。你可以使用 Azure Machine Learning 中的任何二元分类算法，例如二元逻辑回归、二元提升决策树、二元决策森林、二元神经网络等。


    ![Image](img/00013.jpeg) **注意**  并非所有预测性维护问题都相同。有些问题除了分类之外还需要不同的技术。例如，如果目标是确定部件***何时***会失效，你将需要使用生存分析。或者，如果目标是预测能耗，你可以使用预测技术或预测连续结果的回归方法。因此，你需要理解业务问题，才能找到最合适的技术。没有一种方法能放之四海而皆准！


    图 8-7 展示了根据 SECOM 数据预测良率的完整实验。实验的上半部分，直到**拆分**模块，实现了数据预处理阶段。**拆分**模块将数据分为两个样本：一个训练样本，包含初始数据集的
    70%；以及一个测试样本，包含剩余的 30%。


    ![9781484204467_Fig08-07.jpg](img/00135.jpeg)


    图 8-7. 根据 SECOM 数据预测良率的实验


    在此实验中，你比较两种分类算法，以找到最佳的良率预测器。**拆分**模块后的左侧分支使用二元提升决策树，而右侧分支使用统计学中广泛使用的二元逻辑回归算法。每种算法都使用相同的训练样本进行训练，并使用相同的测试样本进行测试。你使用名为**训练模型**的模块来训练每种算法，并使用**评分模型**进行测试。名为**评估模型**的模块用于评估这两个分类模型的准确性。


    模型测试与验证

    '
- fmt: '一旦模型训练完成，下一步是使用留出样本对其进行测试，以避免过拟合并评估模型的泛化能力。我们已经展示了如何使用30%的样本对训练好的模型进行测试。另一种避免过拟合并评估模型泛化能力的策略是交叉验证，这在[第6章](#part0016.html)中讨论过。默认情况下，Azure
    Machine Learning使用10折交叉验证。使用这种方法，你将使用10个留出样本而不是一个进行测试。要针对此问题执行交叉验证，你可以简单地将任何一对`Train
    Model`和`Score Model`模块替换为名为`Cross Validate Model`的模块。[图8-8](#part0018.html#Fig8)展示了如何使用本实验中的`Two-Class
    Logistic Regression`部分执行交叉验证。你还需要使用来自`Filter Based Feature Selection`的整个数据集作为输入数据集。对于交叉验证，无需使用`Split`模块将数据拆分为训练集和测试集，因为名为`Cross
    Validate Model`的模块会执行所需的数据拆分。


    ![9781484204467_Fig08-08.jpg](images/00136.jpeg)


    [图8-8](#part0018.html#_Fig8). 使用交叉验证修改后的实验


    ## 模型性能


    `Evaluate Model`模块用于衡量训练后模型的性能。该模块接受两个数据集作为输入。第一个是来自已测试模型的评分数据集。第二个是用于比较的可选数据集。运行实验后，你可以通过点击名为`Evaluate
    Model`的模块底部的小圆圈来检查模型的性能。该模块提供了以下方法来衡量分类模型（如倾向模型）的性能：


    *   接收者操作特征曲线（ROC曲线），绘制真正例率与假正例率的关系

    *   提升曲线（也称为增益曲线），绘制真正例数量与正例率的关系

    *   精确率与召回率图表

    *   显示第一类和第二类错误的混淆矩阵


    [图8-9](#part0018.html#Fig9)显示了你之前构建的倾向模型的ROC曲线。ROC曲线直观地展示了预测性二元分类模型的性能。图表上从(0,0)到(1,1)的对角线显示了随机猜测的性能；因此，如果你随机选择产量，你的响应将落在这条对角线上。一个好的预测模型应该比随机猜测好得多。因此，在ROC曲线上，一个好的模型应该位于对角线上方。100%准确的理想或完美模型将有一条从(0,0)到(0,1)的垂直线，接着是一条从(0,1)到(1,1)的水平线。


    ![9781484204467_Fig08-09.jpg](images/00137.jpeg)


    [图8-9](#part0018.html#_Fig9). 比较逻辑回归和提升决策树模型在产量预测中性能的两条ROC曲线


    衡量ROC曲线性能的一种方法是测量曲线下面积（AUC）。曲线下面积越高，模型性能越好。理想模型的AUC为1.0，而随机猜测的AUC为0.5。你构建的逻辑回归模型的AUC为0.667，而提升决策树模型的AUC略高，为0.741！在本实验中，二元提升决策树具有以下参数：


    *   每棵树的最大叶子数 = 50

    *   形成叶子所需的最大训练实例数 = 10

    *   学习率 = 0.4

    *   构建的树数量 = 1000

    *   随机数种子 = 1


    此外，Azure Machine Learning还提供了两个模型的混淆矩阵以及精确率和召回率。通过点击两条曲线中的任意一条，工具会显示所选模型的混淆矩阵、精确率和召回率。如果你点击底部曲线或名为“scored
    dataset to compare”的图例，工具会显示逻辑回归模型的性能数据。


    [图8-10](#part0018.html#Fig10)显示了逻辑回归模型的混淆矩阵。混淆矩阵包含以下四个单元格：


    *   **真正例**：这些是产量失败且模型正确预测的情况。

    *   **真负例**：在历史数据集中，产量通过，且模型正确预测通过。

    *   **假正例**：在这种情况下，模型错误地预测产量会失败，而实际上它是通过的。这通常被称为第一类错误。你构建的提升决策树模型只有两个假正例。

    *   **假负例**：这里模型错误地预测产量会通过，而实际上它失败了。这也被称为第二类错误。提升决策树模型有27个假负例。


    ![9781484204467_Fig08-10.jpg](images/00138.jpeg)


    [图8-10](#part0018.html#_Fig10). 混淆矩阵及更多性能指标


    此外，[图8-10](#part0018.html#Fig10)显示了模型的准确率、精确率和召回率。以下是这些指标的计算公式：


    精确率是结果中真正例的比率。


    ![image](images/00139.jpeg)


    召回率是模型识别出的购买者的百分比，其计算公式为：


    ![image](images/00140.jpeg)


    最后，准确率衡量模型正确识别购买者和非购买者的程度，如下所示：


    ![image](images/00141.jpeg)


    其中`tp` = 真正例，`tn` = 真负例，`fp` = 假正例，`fn` = 假负例。`F1`分数是精确率和召回率的加权平均值。在这种情况下，由于召回率非常低，`F1`分数也相当低。


    ## 模型部署


    当你构建并测试了一个满足需求的预测模型后，可以使用Azure Machine Learning将其部署到生产环境中以供业务使用。Azure Machine
    Learning的一个关键区别在于其易于部署到生产环境。一旦模型完成，就可以非常容易地作为Web服务部署到生产环境。部署后，可以从多种设备（包括服务器、笔记本电脑、平板电脑甚至智能手机）将模型作为Web服务调用。


    将模型部署到生产环境需要以下两个步骤：


    1.  将你的实验发布到Azure Machine Learning Studio中的暂存环境。

    2.  从Azure管理门户，将实验从暂存环境移至生产环境。


    让我们详细回顾这些步骤，并了解它们如何应用于你在前面章节中构建的已完成模型。


    ### 将模型发布到暂存环境


    要将模型部署到暂存环境，请在Azure Machine Learning Studio中执行以下步骤：


    1.  使用Azure Machine Learning Studio底部的`Save As`按钮保存你训练好的模型。将其重命名为你选择的新名称。

    2.  运行实验。

    3.  右键单击训练模块（例如`Train Model`）的输出，并选择选项`Save As Trained Model`。

    4.  删除任何用于训练的模块（例如`Split`、`Two-Class Boosted Decision Tree`、`Train Model`、`Evaluate
    Model`）。

    5.  将新保存的模型直接连接到`Score Model`模块。

    6.  重新运行你的实验。


    在步骤1c删除之前，你的实验应如[图8-11](#part0018.html#Fig11)所示。


    ![9781484204467_Fig08-11.jpg](images/00142.jpeg)


    [图8-11](#part0018.html#_Fig11). 删除训练模块之前的预测模型


    删除训练模块并用保存的训练模型替换后，实验现在应如[图8-12](#part0018.html#Fig12)所示。


    ![9781484204467_Fig08-12.jpg](images/00143.jpeg)'
  raw: "Once the model is trained, the next step is to test it with a hold-out sample\
    \ to avoid over-fitting and evaluate model generalization. We have shown how we\
    \ performed this using a 30% sample for testing the trained model. Another strategy\
    \ to avoid over-fitting and evaluate model generalization is cross-validation,\
    \ which was discussed in [Chapter 6](#part0016.html). By default, Azure Machine\
    \ Learning uses 10-fold cross-validation. With this approach, you use 10 hold-out\
    \ samples instead of one for testing. To perform cross-validation for this problem\
    \ you can simply replace any pair of the **Train Model** and **Score Model** modules\
    \ with the module named **Cross Validate Model**. [Figure 8-8](#part0018.html#Fig8)\
    \ shows how to perform cross-validation with the **Two-Class Logistic Regression**\
    \ portion of this experiment. You will also need to use the whole dataset from\
    \ the **Filter Based Feature Selection** as your input dataset. For cross-validation\
    \ there is no need to split the data into training and test sets with the **Split**\
    \ module since the module named **Cross Validate Model** will do the required\
    \ data splits.\n\n![9781484204467_Fig08-08.jpg](images/00136.jpeg)\n\n[Figure\
    \ 8-8](#part0018.html#_Fig8). A modified experiment with cross-validation\n\n\
    Model Performance\n\nThe **Evaluate Model** module is used to measure the performance\
    \ of a trained model. This module takes two datasets as inputs. The first is a\
    \ scored dataset from a tested model. The second is an optional dataset for comparison.\
    \ After running the experiment, you can check your model’s performance by clicking\
    \ the small circle at the bottom of the module named **Evaluate Model**. This\
    \ module provides the following methods to measure the performance of a classification\
    \ model such as the propensity model:\n\n*   The receiver operating characteristic,\
    \ or ROC curve, which plots the rate of true positives to false positives\n* \
    \  The lift curve (also known as the gains curve), which plots the number of true\
    \ positives vs. the positive rate\n*   Precision vs. recall chart\n*   Confusion\
    \ matrix that shows type I and II errors\n\n[Figure 8-9](#part0018.html#Fig9)\
    \ shows the ROC curve for the propensity model you built earlier. The ROC curve\
    \ visually shows the performance of a predictive binary classification model.\
    \ The diagonal line from (0,0) to (1,1) on the chart shows the performance of\
    \ random guessing; so if you randomly selected the yield, your response would\
    \ be on this diagonal line. A good predictive model should do much better than\
    \ random guessing. Hence, on the ROC curve, a good model should lie above the\
    \ diagonal line. The ideal or perfect model that is 100% accurate will have a\
    \ vertical line from (0,0) to (0,1), followed by a horizontal line from (0,1)\
    \ to (1,1).\n\n![9781484204467_Fig08-09.jpg](images/00137.jpeg)\n\n[Figure 8-9](#part0018.html#_Fig9).\
    \ Two ROC curves comparing the performance of logistic regression and boosted\
    \ decision tree models for yield  prediction\n\nOne way to measure the performance\
    \ from the ROC curve is to measure the area under the curve (AUC).  The higher\
    \ the area under the curve, the better the model’s performance. The ideal model\
    \ will have an AUC of 1.0, while random guessing will have an AUC of 0.5.  The\
    \ logistic regression model you built has an AUC of 0.667 while the boosted decision\
    \ tree model has a slightly higher AUC of 0.741! In this experiment, the two-class\
    \ boosted decision tree had the following parameters:\n\n*   Maximum number of\
    \ leaves per tree = 50\n*   Maximum number of training instances required to form\
    \ a leaf = 10\n*   Learning rate = 0.4\n*   Number of trees constructed = 1000\n\
    *   Random number seed = 1\n\nIn addition, Azure Machine Learning also provides\
    \ the confusion matrix as well as precision and recall rates for both models.\
    \ By clicking each of the two curves, the tool shows the confusion matrix, precision,\
    \ and recall rates for the select model. If you click the bottom curve or the\
    \ legend named “scored dataset to compare,” the tool shows the performance data\
    \ for the logistic regression model.\n\n[Figure 8-10](#part0018.html#Fig10) shows\
    \ the confusion matrix for the logistic regression model. The confusion matrix\
    \ has the following four cells:\n\n*   **True positives**: These are cases where\
    \ yield failed and the model correctly predicts this.\n*   **True negatives**:\
    \ In the historical dataset, the yield passed, and the model correctly predicts\
    \ a pass.\n*   **False positives**: In this case, the model incorrectly predicts\
    \ that the yield would fail when in fact it was a pass. This is commonly referred\
    \ to as Type I error. The boosted decision tree model you built had only two false\
    \ positives.\n*   **False negatives**: Here the model incorrectly predicts that\
    \ the yield would pass when in reality it failed. This is also known as Type II\
    \ error. The boosted decision tree model had 27 false negatives.\n\n![9781484204467_Fig08-10.jpg](images/00138.jpeg)\n\
    \n[Figure 8-10](#part0018.html#_Fig10). Confusion matrix and more performance\
    \ metrics\n\nIn addition, [Figure 8-10](#part0018.html#Fig10) shows the accuracy,\
    \ precision, and recall of the model. Here are the formulas for these metrics:\n\
    \nPrecision is the rate of true positives in the results.\n\n![image](images/00139.jpeg)\n\
    \nRecall is the percentage of buyers that the model identifies and is measured\
    \ as\n\n![image](images/00140.jpeg)\n\nFinally, the accuracy measures how well\
    \ the model correctly identifies buyers and non-buyers, shown as\n\n![image](images/00141.jpeg)\n\
    \nwhere tp = true positive, tn = true negative, fp = false positive, and fn =\
    \ false negative. The F1 score is a weighted average of precision and recall.\
    \ In this case, it is quite low since the recall is very low.\n\nModel Deployment\n\
    \nWhen you build and test a predictive model that meets your needs, you can use\
    \ Azure Machine Learning to deploy it into production for business use. A key\
    \ differentiator of Azure Machine Learning is the ease of deployment in production.\
    \ Once a model is complete, it can be deployed very easily into production as\
    \ a web service. Once deployed, the model can be invoked as a web service from\
    \ multiple devices including servers, laptops, tablets, or even smart phones.\n\
    \nThe following two steps are required to deploy a model into production.\n\n\
    1.  Publish your experiment into the staging environment in Azure Machine Learning\
    \ Studio.\n2.  From the Azure Management portal, move the experiment from the\
    \ staging environment into production.\n\nLet’s review these steps in detail and\
    \ see how they apply to your finished model built in the previous sections.\n\n\
    Publishing Your Model into Staging\n\nTo deploy your model into staging, follow\
    \ these steps in Azure Machine Learning Studio.\n\n1.  Save your trained mode\
    \ using the **Save As** button at the bottom of Azure Machine Learning Studio.\
    \ Rename it to a new name of your choice.\n\n1.  **Run** the experiment.\n   \
    \ 2.  Right-click the output of the training module (e.g. **Train Model**) and\
    \ select the option **Save As Trained Model.**\n    3.  Delete any modules that\
    \ were used for training (e.g. the **Split, Two-Class Boosted Decision Tree, Train\
    \ Model, Evaluate Model**).\n    4.  Connect the newly saved model directly to\
    \ the **Score Model** module.\n    5.  Re-run your experiment.\n\nBefore the deletion\
    \ in Step 1c, your experiment should be as shown [Figure 8-11](#part0018.html#Fig11).\n\
    \n![9781484204467_Fig08-11.jpg](images/00142.jpeg)\n\n[Figure 8-11](#part0018.html#_Fig11).\
    \ Predictive model before the training modules were deleted\n\nAfter deleting\
    \ the training modules and replacing them with the saved training model, the experiment\
    \ should now appear as shown in [Figure 8-12](#part0018.html#Fig12).\n\n![9781484204467_Fig08-12.jpg](images/00143.jpeg)"
  trans: "\n模型训练完成后，下一步是使用留出样本进行测试，以避免过拟合并评估模型的泛化能力。我们已展示了如何使用 30%的样本测试训练好的模型。另一种避免过拟合和评估模型泛化能力的策略是交叉验证，这在第\
    \ 6 章中讨论过。默认情况下，Azure 机器学习使用 10 折交叉验证。使用这种方法，你将使用 10 个留出样本而不是一个进行测试。要针对此问题执行交叉验证，只需将任意一对**训练模型**和**评分模型**模块替换为名为**交叉验证模型**的模块。图\
    \ 8-8 展示了如何使用本实验中的**双类逻辑回归**部分执行交叉验证。你还需要使用来自**基于筛选的特征选择**的整个数据集作为输入数据集。对于交叉验证，无需使用**拆分**模块将数据拆分为训练集和测试集，因为名为**交叉验证模型**的模块会执行所需的数据拆分。\n\
    \n![9781484204467_Fig08-08.jpg](img/00136.jpeg)\n\n图 8-8. 使用交叉验证修改后的实验\n\n模型性能\n\
    \n**评估模型**模块用于衡量训练后模型的性能。该模块接受两个数据集作为输入。第一个是来自已测试模型的评分数据集。第二个是用于比较的可选数据集。运行实验后，你可以通过点击名为**评估模型**模块底部的小圆圈来检查模型的性能。该模块提供了以下方法来衡量分类模型（如倾向模型）的性能：\n\
    \n*   接收者操作特征曲线（ROC 曲线），绘制真正例率与假正例率的关系\n*   提升曲线（也称为增益曲线），绘制真正例数量与正例率的关系\n*  \
    \ 精确率与召回率图表\n*   显示第一类和第二类错误的混淆矩阵\n\n图 8-9 显示了你之前构建的倾向模型的 ROC 曲线。ROC 曲线直观地展示了预测性二元分类模型的性能。图表上从(0,0)到(1,1)的对角线显示了随机猜测的性能；因此，如果你随机选择产量，你的响应将落在这条对角线上。一个好的预测模型应该比随机猜测好得多。因此，在\
    \ ROC 曲线上，一个好的模型应该位于对角线上方。理想或完美的模型（100%准确）将有一条从(0,0)到(0,1)的垂直线，接着是一条从(0,1)到(1,1)的水平线。\n\
    \n![9781484204467_Fig08-09.jpg](img/00137.jpeg)\n\n图 8-9. 比较逻辑回归和提升决策树模型在产量预测性能上的两条\
    \ ROC 曲线\n\n衡量 ROC 曲线性能的一种方法是测量曲线下面积（AUC）。曲线下面积越高，模型性能越好。理想模型的 AUC 为 1.0，而随机猜测的\
    \ AUC 为 0.5。你构建的逻辑回归模型的 AUC 为 0.667，而提升决策树模型的 AUC 略高，为 0.741！在本实验中，双类提升决策树具有以下参数：\n\
    \n*   每棵树的最大叶节点数 = 50\n*   形成叶节点所需的最大训练实例数 = 10\n*   学习率 = 0.4\n*   构建的树数量 = 1000\n\
    *   随机数种子 = 1\n\n此外，Azure 机器学习还提供了两个模型的混淆矩阵以及精确率和召回率。通过点击两条曲线中的任意一条，工具会显示所选模型的混淆矩阵、精确率和召回率。如果你点击底部的曲线或名为“要比较的评分数据集”的图例，工具会显示逻辑回归模型的性能数据。\n\
    \n图 8-10 显示了逻辑回归模型的混淆矩阵。混淆矩阵包含以下四个单元格：\n\n*   **真正例**：这些是产量失败且模型正确预测的情况。\n*  \
    \ **真负例**：在历史数据集中，产量通过，且模型正确预测通过。\n*   **假正例**：在这种情况下，模型错误地预测产量会失败，而实际上它是通过的。这通常被称为第一类错误。你构建的提升决策树模型只有两个假正例。\n\
    *   **假负例**：这里模型错误地预测产量会通过，而实际上它失败了。这也被称为第二类错误。提升决策树模型有 27 个假负例。\n\n![9781484204467_Fig08-10.jpg](img/00138.jpeg)\n\
    \n图 8-10. 混淆矩阵及更多性能指标\n\n此外，图 8-10 显示了模型的准确率、精确率和召回率。以下是这些指标的计算公式：\n\n精确率是结果中真正例的比率。\n\
    \n![image](img/00139.jpeg)\n\n召回率是模型识别出的购买者的百分比，其计算公式为\n\n![image](img/00140.jpeg)\n\
    \n最后，准确率衡量模型正确识别购买者和非购买者的能力，表示为\n\n![image](img/00141.jpeg)\n\n其中 tp = 真正例，tn\
    \ = 真负例，fp = 假正例，fn = 假负例。F1 分数是精确率和召回率的加权平均值。在这种情况下，由于召回率非常低，F1 分数也相当低。\n\n模型部署\n\
    \n当你构建并测试了满足需求的预测模型后，可以使用 Azure 机器学习将其部署到生产环境中以供业务使用。Azure 机器学习的一个关键区别在于生产环境部署的简便性。一旦模型完成，就可以非常容易地作为\
    \ Web 服务部署到生产环境。部署后，可以从多种设备（包括服务器、笔记本电脑、平板电脑甚至智能手机）作为 Web 服务调用该模型。\n\n将模型部署到生产环境需要以下两个步骤。\n\
    \n1.  将你的实验发布到 Azure 机器学习工作室的暂存环境中。\n2.  从 Azure 管理门户，将实验从暂存环境移动到生产环境。\n\n让我们详细回顾这些步骤，并了解它们如何应用于你在前面章节中构建的已完成模型。\n\
    \n将模型发布到暂存环境\n\n要将模型部署到暂存环境，请在 Azure 机器学习工作室中执行以下步骤。\n\n1.  使用 Azure 机器学习工作室底部的**另存为**按钮保存你训练好的模型。将其重命名为你选择的新名称。\n\
    \n1.  **运行**实验。\n    2.  右键单击训练模块（例如**训练模型**）的输出，并选择**另存为训练模型**选项。\n    3.  删除任何用于训练的模块（例如**拆分**、**双类提升决策树**、**训练模型**、**评估模型**）。\n\
    \    4.  将新保存的模型直接连接到**评分模型**模块。\n    5.  重新运行你的实验。\n\n在步骤 1c 删除之前，你的实验应如图 8-11\
    \ 所示。\n\n![9781484204467_Fig08-11.jpg](img/00142.jpeg)\n\n图 8-11. 删除训练模块之前的预测模型\n\
    \n删除训练模块并用保存的训练模型替换后，实验现在应如图 8-12 所示。\n\n![9781484204467_Fig08-12.jpg](img/00143.jpeg)\n"
- fmt: "[Figure 8-12](#part0018.html#_Fig12). The experiment that uses the saved training\
    \ model\n\n2.  Next, set your publishing input and output data ports. To do this,\n\
    \n1.  Right-click the right input port of the module named `Score Model`. Select\
    \ the option `Set As Publish Input`.\n2.  Right-click the output port of the `Score\
    \ Model` module and select `Set As Publish Output`.\n\nAfter these two steps,\
    \ you will see two circles highlighting the chosen publish input and output on\
    \ the `Score Model` module. This is shown in [Figure 8-12](#part0018.html#Fig12).\n\
    \n3.  Once you assign the publish input and output ports, run the experiment and\
    \ then publish it into staging by clicking `Publish Web Service` at the bottom\
    \ of the screen.\n\n## Moving Your Model from Staging into Production\n\nAt this\
    \ point your model is now in the staging environment, but is not yet running in\
    \ production. To publish it into production, you need to move it from the staging\
    \ environment to the production environment through the following steps.\n\n1.\
    \  Configure your new web service in Azure Machine Learning Studio and make it\
    \ ready for production as follows:\n    1.  In Azure Machine Learning Studio,\
    \ click the menu called `Web Services` on the right pane. It will show a list\
    \ of all your web services.\n    2.  Click the name of the new service you just\
    \ created. Test it by clicking the `Test` URL.\n    3.  Click the configuration\
    \ tab, and then select yes for the option `Ready For Production?` Click the `Save`\
    \ button at the bottom of the window. Now your model is ready to be published\
    \ in production.\n2.  Now switch to Azure Management Portal and publish your web\
    \ service into production as follows:\n    1.  Select `Machine Learning` on the\
    \ right-hand pane in Azure Management Portal.\n    2.  Choose the workspace with\
    \ the experiment you want to deploy in production.\n    3.  Click the name of\
    \ your workspace, and then click the tab named `Web Services`.\n    4.  Choose\
    \ the `+Add` button at the bottom of the Azure Management Portal window.\n\nCongratulations,\
    \ you have just published your machine learning model into production. If you\
    \ click your model from the `Web Services` tab, you will see details such as the\
    \ number of predictions made by your model over a seven-day window. The service\
    \ also shows the APIs you can use to call your model as a web service either in\
    \ a request/response or batch execution mode. In addition, you also get sample\
    \ code you can use to invoke your new web service in C#, Python, or R.\n\n## Summary\n\
    \nYou began this chapter by exploring predictive maintenance, which shows the\
    \ business opportunity and the promise of machine learning. Using the SECOM semiconductor\
    \ manufacturing data from the University of California at Irvine’s Machine Learning\
    \ Data Repository, you learned how to build and deploy a predictive maintenance\
    \ solution in Azure Machine Learning. In this step-by-step guide, we explained\
    \ how to perform data preprocessing and analysis, which are critical for understanding\
    \ the data. With that understanding of the data, you used a two-class logistic\
    \ regression and a two-class boosted decision tree algorithm to perform classification.\
    \ You also saw how to evaluate the performance of your models and avoid over-fitting.\
    \ Finally, you saw how to deploy the finished model in production as a machine\
    \ learning web service on Microsoft Azure.\n\n## Index\n\n![images](images/00013.jpeg)\
    \ A\n\n[Analytics spectrum](#part0009.html#cXXX.k1)\n\n[categories](#part0009.html#cXXX.5)\n\
    \n[data analysis](#part0009.html#cXXX.6)\n\n[descriptive analysis](#part0009.html#cXXX.7)\n\
    \n[diagnostic analysis](#part0009.html#cXXX.8)\n\n[predictive analysis](#part0009.html#cXXX.9)\n\
    \n[prescriptive analysis](#part0009.html#cXXX.10)\n\n[Area under curve (AUC)](#part0015.html#cXXX.k5)\n\
    \n[Average computer memory price](#part0009.html#cXXX.16)\n\n[Azure machine learning](#part0015.html#cXXX.122)\n\
    \n[algorithms](#part0010.html#cXXX.43)\n\n[automobile price data](#part0010.html#cXXX.35)\n\
    \n[building and testing](#part0010.html#cXXX.32)"
