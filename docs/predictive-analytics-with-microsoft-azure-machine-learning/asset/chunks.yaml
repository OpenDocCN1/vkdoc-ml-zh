    Building Predictive Maintenance Models


    The leading manufacturers are now investing in predictive maintenance, which holds
    the potential to reduce cost yet increase margin and customer satisfaction. Though
    traditional techniques such as statistics and manufacturing have helped, the industry
    is still plagued by serious quality issues and the high cost of business disruption
    when components fail.  Advances in machine learning offer a unique opportunity
    to improve customer satisfaction and reduce service downtime.   This chapter shows
    how to build models for predictive maintenance using Microsoft Azure Machine Learning.
    Through examples we will demonstrate how you can use Microsoft Azure Machine Learning
    to build, validate, and deploy a predictive model for predictive maintenance.


    Overview


    According to Ahmet Duyar, an expert in fault detection and former Visiting Researcher
    at NASA, a key cause of reduced productivity in the manufacturing industry is
    low asset effectiveness that results from equipment breakdowns and unnecessary
    maintenance interventions. In the US alone, the cost of excess maintenance and
    lost productivity is estimated at $740B, so we clearly need better approaches
    to maintenance (Duyar, 2011).


    Predictive maintenance techniques are designed to predict when maintenance should
    be performed on a piece of equipment even before it breaks down. By accurately
    predicting the failure of a component you can reduce unplanned downtime and extend
    the lifetime of your equipment. Predictive maintenance also offers cost savings
    since it increases the efficiency of repairs: an engineer can target repair work
    to the predicted failure and complete the work faster as a result. They don’t
    need to spend too much time trying to find the cause of the equipment failure.
    With predictive maintenance, plant operators can be more proactive and fix issues
    even before their equipment breaks down.


    It is worth clarifying the difference between predictive and preventive maintenance
    since the two are often confused. Preventive maintenance refers to scheduled maintenance
    that is typically planned in advance. While useful and in many cases necessary,
    preventive maintenance can be expensive and ineffective at catching issues that
    develop in between scheduled appointments. In contrast, predictive maintenance
    aims to predict failures before they happen.


    Let’s use car servicing as an example to illustrate the difference. When you buy
    a car, the dealer typically recommends regular services based on time or mileage.
    For instance some car manufacturers recommend a full service after 6,000 and 10,000
    miles. This is a good example of preventive maintenance. As you approach 6,000
    miles, your dealer will send a reminder for you to schedule your full service.
    In contrast, through predictive maintenance, many car manufacturers would prefer
    to monitor the performance of your car on an ongoing basis through data relayed
    by sensors from your car to a database system. With this data, they can detect
    when your transmission or timing belt are beginning to show signs of impending
    failure and will call you for maintenance, regardless of your car’s mileage.


    Predictive maintenance is a form of non-destructive monitoring that occurs during
    the normal operation of the equipment. Sensors installed on the equipment collect
    valuable data that can be used to predict and prevent failures.


    Current techniques for predictive maintenance include vibration analysis, acoustical
    analysis, infrared monitoring, oil analysis, and model-based condition modeling.
    Vibration analysis uses sensors such as accelerometers installed on a motor to
    determine when it is operating abnormally. According to Ahmet Duyar, vibration
    analysis is the most widely used approach to condition monitoring, accounting
    for up 85% of all systems sold. Acoustical analysis uses sonic or ultrasound analysis
    to detect abnormal friction and stress in rotating machines. While sonic techniques
    can detect problems in mechanical machines, ultrasound is more flexible and can
    detect issues in both mechanical and electrical machines. Infrared analysis has
    the widest range of applications, spanning low- to high-speed equipment and also
    mechanical and electrical devices.


    Model-based condition monitoring uses mathematical models to predict failures.
    First developed by NASA, this technique has a learning phase in which it learns
    the characteristics of normal operating conditions. On completion of the learning
    phase, the system enters the production phase where it monitors the equipment’s
    condition. It compares the performance of the equipment to the data collected
    in the learning phase, and will flag an issue if it detects a serious deviation
    from the normal operation of the machine. This is a form of anomaly detection
    where the monitoring system flags an issue when the machine deviates significantly
    from normal operating conditions.


    ![Image](images/00013.jpeg) **Note**  Refer to the following resources for more
    details on predictive maintenance:


    ```

    http://en.wikipedia.org/wiki/Predictive_maintenance  and

    ```


    Ahmet Duyar, “Simplifying predictive maintenance”, Orbit Vol. 31 No.1, pp. 38-45,
    2011.


    The Business Problem


    Imagine that you are a data scientist at a semiconductor manufacturer. Your employer
    wants you to do the following:


    *   Build a model that predicts yield failure on their manufacturing process,
    and

    *   Through your analysis provide the factors that lead to yield failures in their
    process.'
