  trans: "\n对于每个误差统计量，数值越小越好；较小的值表示预测值与实际值更接近。对于**决定系数**，其值越接近 1（1.0），预测效果越好（参见图 2-12）。如果值为\
    \ 1.0，意味着模型解释了数据中 100%的变异性，这相当不切实际！\n\n![9781484204467_Fig02-12.jpg](img/00027.jpeg)\n\
    \n图 2-12。评估结果\n\n最终的实验应类似于图 2-13 中的截图。\n\n![9781484204467_Fig02-13.jpg](img/00028.jpeg)\n\
    \n图 2-13。回归模型实验\n\n恭喜！你已在机器学习工作室中创建了第一个机器学习实验。在第 5 章至第 8 章中，你将了解如何应用这五个步骤来创建预测分析解决方案，以应对来自不同领域的业务挑战，例如买家倾向性、流失分析、客户细分和预测性维护。此外，第\
    \ 3 章展示了如何在 Azure 机器学习实验中使用 R 脚本。\n\n在生产环境中部署模型\n\n目前，将机器学习模型部署到生产环境所需时间过长。该过程通常效率低下，且往往需要重写模型以在目标生产平台上运行，这成本高昂且需要大量时间和精力。Azure\
    \ 机器学习通过云中的集成流程简化了机器学习模型的部署。你可以在几分钟内（而非数天或数周）部署新的预测模型。部署后，你的模型将作为 Web 服务运行，可从不同平台（包括服务器、笔记本电脑、平板电脑甚至智能手机）进行调用。要将模型部署到生产环境，请遵循以下两个步骤。\n\
    \n1.  在 Azure 机器学习工作室中将模型部署到过渡环境。\n2.  在 Azure 管理门户中，将模型从过渡环境移至生产环境。\n\n将模型部署到过渡环境\n\
    \n要将模型部署到过渡环境，请在 Azure 机器学习工作室中执行以下步骤。\n\n1.  使用 Azure 机器学习工作室底部的**另存为**按钮保存你训练好的模型。将其重命名为你选择的新名称。\n\
    \    1.  **运行**实验。\n    2.  右键单击训练模块（例如**训练模型**）的输出，然后选择**另存为已训练模型**选项。\n    3.\
    \  删除用于训练的任何模块（例如**拆分、训练模型、评估模型**）。\n    4.  将新保存的模型直接连接到**评分模型**模块。\n    5. \
    \ 重新运行实验。\n2.  在步骤 1c 中删除之前，你的实验应如图图 2-14 所示。\n\n![9781484204467_Fig02-14.jpg](img/00029.jpeg)\n\
    \n图 2-14。删除训练模块之前的预测模型\n\n删除训练模块（即**拆分、线性回归、训练模型**和**评估模型**）并用保存的训练模型替换后，实验现在应如图图\
    \ 2-15 所示。\n\n![Image](img/00013.jpeg) **提示** 你可能想知道为什么将**汽车价格数据（原始）**数据集保留连接到模型。服务将使用用户的数据，而不是原始数据集，那么为什么还要保留连接呢？\n\
    \n确实，服务不需要原始的汽车价格数据。但它确实需要该数据的架构，其中包括列数以及哪些列是数值列等信息。需要此架构信息才能解释用户的数据。你保留这些组件的连接，以便在服务运行时评分模块能够拥有数据集架构。数据不会被使用，仅使用架构。\n\
    \n![9781484204467_Fig02-15.jpg](img/00030.jpeg)\n\n图 2-15。使用保存的训练模型的实验\n\n3. \
    \ 接下来，设置发布输入和输出。为此，请执行以下步骤。\n\n1.  右键单击名为**评分模型**的模块的右侧输入。选择**设置为发布输入**选项。\n \
    \   2.  右键单击**评分模型**模块的输出，然后选择**设置为发布输出**。\n\n完成这两个步骤后，你将看到两个圆圈突出显示**评分模型**模块上选定的发布输入和输出。如图图\
    \ 2-15 所示。\n\n4.  分配发布输入和输出后，运行实验，然后通过单击屏幕底部的**发布 Web 服务**将其发布到过渡环境。\n\n![Image](img/00013.jpeg)\
    \ **提示** 发布 Web 服务后，你可以对其进行更新。例如，如果你想更改模型，只需编辑之前保存的训练实验，调整模型参数，然后保存训练后的模型（覆盖之前保存的模型）。当你再次打开评分实验时，会看到一条通知，告知你某些内容已更改（即你的训练模型），并且你可以更新实验。当你再次发布实验时，它将替换\
    \ Web 服务，现在使用你更新后的模型。\n\n你可以通过单击**配置**选项卡来配置服务。在此处，你可以修改服务名称（默认使用实验名称）并为其添加描述。你还可以为输入和输出列提供更友好的标签。\n\
    \n测试 Web 服务\n\n在**仪表板**页面上，单击**过渡服务**下的**测试**链接。将弹出一个对话框，要求你输入服务的输入数据。这些列与原始**汽车价格数据（原始）**数据集中出现的列相同。输入一组数据，然后单击**确定**。\n\
    \nWeb 服务生成的结果显示在仪表板底部。根据你配置服务的方式，你看到的结果由评分模块生成。\n\n将模型从过渡环境移至生产环境\n\n此时，你的模型已处于过渡环境，但尚未在生产环境中运行。要将其发布到生产环境，你需要通过以下步骤将其从过渡环境移至生产环境。\n\
    \n1.  在 Azure 机器学习工作室中配置新的 Web 服务，并使其准备好投入生产，如下所示。\n    1.  在 Azure 机器学习工作室中，单击右侧窗格中名为**Web\
    \ 服务**的菜单。它将显示所有 Web 服务的列表。\n    2.  单击你刚刚创建的新服务的名称。你可以通过单击**测试**URL 来测试它。\n \
    \   3.  现在单击配置选项卡，然后为**准备好投入生产？**选项选择**是**。然后点击屏幕底部的**保存**按钮。现在你的模型已准备好发布到生产环境。\n\
    2.  现在切换到 Azure 管理门户，并将你的 Web 服务发布到生产环境，如下所示。\n    1.  在 Azure 管理门户的左侧窗格中选择**机器学习**。\n\
    \    2.  选择包含要部署到生产环境的实验的工作区。\n    3.  单击工作区的名称，然后单击名为**Web 服务**的选项卡。\n    4.\
    \  选择 Azure 管理门户窗口底部的**+添加**按钮。\n\n![9781484204467_Fig02-16.jpg](img/00031.jpeg)\n\
    \n图 2-16\\. 一个对话框，用于将机器学习模型从过渡服务器提升为实时生产 Web 服务\n"
- fmt: "# Congratulations! You have just published your very first machine learning\
    \ model into production. If you click your model from the Web Services tab, you\
    \ will see details such as the number of predictions made by your model over a\
    \ seven-day window. The service also shows the APIs you can use to call your model\
    \ as a web service either in a request/response or batch execution mode. As if\
    \ this is not enough, you also get sample code you can use to invoke your new\
    \ web service in C#, Python, or R. You can use this sample code to call your model\
    \ as a web service from a web form in a browser or from any other application\
    \ of your choice.\n\n## Accessing the Azure Machine Learning Web Service\n\nTo\
    \ be useful as a web service, users need to be able to send data to the service\
    \ and receive results. The web service is an Azure web service that can receive\
    \ and return data in one of two ways:\n\n* **Request/Response**: The user can\
    \ send a single set of Automobile price data to the service using an HTTP protocol,\
    \ and the service responds with a single result predicting the price.\n* **Batch\
    \ Execution**: The user can send to the service the URL of an Azure BLOB that\
    \ contains one or more rows of Automobile price data. The service stores the results\
    \ in another BLOB and returns the URL of that container.\n\nOn the **Dashboard**\
    \ tab for the web service, there are links to information that will help a developer\
    \ write code to access this service. Click the API help page link on the REQUEST/RESPONSE\
    \ row and a page opens that contains sample code to use the service’s request/response\
    \ protocol. Similarly, the link on the BATCH EXECUTION row provides example code\
    \ for making a batch request to the service.\n\nThe API help page includes samples\
    \ for R, C#, and Python programming languages. For example, [Listing 2-1](#part0010.html#list1)\
    \ shows the R code that you could use to access the web service you published\
    \ (the actual service URL would be displayed in your sample code).\n\n[***Listing\
    \ 2-1***](#part0010.html#_list1). R Code Used to Access the Service Programmatically\n\
    \n```r\nlibrary(\"RCurl\")\nlibrary(\"RJSONIO\")\n\n# Accept SSL certificates\
    \ issued by public Certificate Authorities\noptions(RCurlOptions = list(sslVersion=3L,\
    \ cainfo = system.file(\"CurlSSL\", \"cacert.pem\", package = \"RCurl\")))\n\n\
    h = basicTextGatherer()\nreq = list(Id=\"score00001\",\n Instance=list(FeatureVector=list(\n\
    \    \"symboling\"= \"0\",\n    \"make\"= \"0\",\n    \"body-style\"= \"0\",\n\
    \    \"wheel-base\"= \"0\",\n    \"engine-size\"= \"0\",\n    \"horsepower\"=\
    \ \"0\",\n    \"peak-rpm\"= \"0\",\n    \"highway-mpg\"= \"0\",\n    \"price\"\
    = \"0\"\n ),GlobalParameters=fromJSON('{}')))\n\nbody = toJSON(req)\napi_key =\
    \ \"abc123\" # Replace this with the API key for the web service\nauthz_hdr =\
    \ paste('Bearer', api_key, sep=' ')\n\nh$reset()\ncurlPerform(url = \"https://ussouthcentral.services.azureml.net/workspaces/fcaf778fe92f4fefb2f104acf9980a6c/services/ca2aea46a205473aabca2670c5607518/score\"\
    ,\n            httpheader=c('Content-Type' = \"application/json\", 'Authorization'\
    \ = authz_hdr),\n            postfields=body,\n            writefunction = h$update,\n\
    \            verbose = TRUE\n            )\n\nresult = h$value()\nprint(result)\n\
    ```\n\n## Summary\n\nIn this chapter, you learned how to use Azure Machine Learning\
    \ Studio to create your first experiment. You saw how to perform data preprocessing,\
    \ and how to train, test, and evaluate your model in Azure Machine Learning Studio.\
    \ In addition, you also saw how to deploy your new model in production. Once deployed,\
    \ your machine learning model runs as a web service on Azure that can be called\
    \ from a web form or any other application from a server, laptop, tablet, or smartphone.\
    \ In the remainder of this book, you will learn how to use Azure Machine Learning\
    \ to create experiments that solve various business problems such as customer\
    \ propensity, customer churn, and predictive maintenance. In addition, you will\
    \ also learn how to extend Azure Machine Learning with R scripting. Also, [Chapter\
    \ 4](#part0013.html) introduces the most commonly used statistics and machine\
    \ learning algorithms in Azure Machine Learning.\n\n# CHAPTER 3\n\n![image](images/00007.jpeg)\n\
    \n## Integration with R\n\nThis chapter will introduce R and show how it is integrated\
    \ with Microsoft Azure Machine Learning. Through simple examples, you will learn\
    \ how to write and run your own R code when working with Azure Machine Learning.\
    \ You will also learn the R packages supported by Azure Machine Learning, and\
    \ how you can use them in the Azure Machine Learning Studio (ML Studio).\n\n###\
    \ R in a Nutshell\n\nR is an open source statistical programming language that\
    \ is commonly used by the computational statistics and data science community\
    \ for solving an extensive spectrum of business problems. These problems span\
    \ the following areas:\n\n* Bioinformatics (e.g. genome analysis)\n* Actuarial\
    \ sciences (e.g. figuring out risk exposures for insurance, finance, and other\
    \ industries)\n* Telecommunication (analyzing churn in corporate and consumer\
    \ customer base, fraudulent SIM card usage, or mobile usage patterns)\n* Finance\
    \ and banking (e.g. identifying fraud in financial transactions), manufacturing\
    \ (e.g. predicting hardware component failure times), and many more.\n\nWhen using\
    \ R, users feel empowered by its toolbox of R packages that provides powerful\
    \ capabilities for data analysis, visualization, and modeling. As of 2014, the\
    \ Comprehensive R Archive Network (CRAN) provides a large collection of more than\
    \ 5000 R packages. Besides CRAN, there are many other R packages available on\
    \ Github (https://github.com/trending?l=r) and specialized R packages for bioinformatics\
    \ in the Bioconductor R repository ([www.bioconductor.org/](http://www.bioconductor.org/)).\n\
    \n![Image](images/00013.jpeg) **Note** R was created at the University of Auckland\
    \ by Joss Ihaka and Robert Gentleman in 1994. Since R’s creation, many leading\
    \ computer scientists and statisticians have fueled R’s success by contributing\
    \ to the R codebase or providing R packages that enable R users to leverage the\
    \ latest techniques for statistical analysis, visualization, and data mining.\
    \ This has propelled R to become one of the languages for data scientists. Learn\
    \ more about R at [www.r-project.org/](http://www.r-project.org/).\n\nGiven the\
    \ momentum in the data science community in using R to tackle machine learning\
    \ problems, it is super important for a cloud-based machine learning platform\
    \ to empower data scientists to continue using the familiar R scripts that they\
    \ have written, and continue to be productive. Currently, more than 400 R packages\
    \ are supported by Azure Machine Learning. [Table 3-1](#part0011.html#Tab1) shows\
    \ a subset of the R packages currently supported. These R packages enable you\
    \ to model a wide spectrum of machine learning problems from market basket analysis,\
    \ classification, regression, forecasting, and visualization.\n\n[Table 3-1](#part0011.html#_Tab1).\
    \ R Packages Supported by Azure Machine Learning"
  raw: 'Congratulations! You have just published your very first machine learning
    model into production. If you click your model from the Web Services tab, you
    will see details such as the number of predictions made by your model over a seven-day
    window. The service also shows the APIs you can use to call your model as a web
    service either in a request/response or batch execution mode. As if this is not
    enough, you also get sample code you can use to invoke your new web service in
    C#, Python, or R. You can use this sample code to call your model as a web service
    from a web form in a browser or from any other application of your choice.


    Accessing the Azure Machine Learning Web Service


    To be useful as a web service, users need to be able to send data to the service
    and receive results. The web service is an Azure web service that can receive
    and return data in one of two ways:


    *   **Request/Response**: The user can send a single set of Automobile price data
    to the service using an HTTP protocol, and the service responds with a single
    result predicting the price.

    *   **Batch Execution**: The user can send to the service the URL of an Azure
    BLOB that contains one or more rows of Automobile price data. The service stores
    the results in another BLOB and returns the URL of that container.


    On the **Dashboard** tab for the web service, there are links to information that
    will help a developer write code to access this service. Click the API help page
    link on the REQUEST/RESPONSE row and a page opens that contains sample code to
    use the service’s request/response protocol. Similarly, the link on the BATCH
    EXECUTION row provides example code for making a batch request to the service.


    The API help page includes samples for R, C#, and Python programming languages.
    For example, [Listing 2-1](#part0010.html#list1) shows the R code that you could
    use to access the web service you published (the actual service URL would be displayed
    in your sample code).


    [***Listing 2-1***](#part0010.html#_list1). R Code Used to Access the Service
    Programmatically


    ```

    library("RCurl")

    library("RJSONIO")


    # Accept SSL certificates issued by public Certificate Authorities

    options(RCurlOptions = list(sslVersion=3L, cainfo = system.file("CurlSSL", "cacert.pem",
    package = "RCurl")))


    h = basicTextGatherer()

    req = list(Id="score00001",

     Instance=list(FeatureVector=list(

        "symboling"= "0",

        "make"= "0",

        "body-style"= "0",

        "wheel-base"= "0",

        "engine-size"= "0",

        "horsepower"= "0",

        "peak-rpm"= "0",

        "highway-mpg"= "0",

        "price"= "0"

     ),GlobalParameters=fromJSON(''{}'')))


    body = toJSON(req)

    api_key = "abc123" # Replace this with the API key for the web service

    authz_hdr = paste(''Bearer'', api_key, sep='' '')


    h$reset()

    curlPerform(url = "https://ussouthcentral.services.azureml.net/workspaces/fcaf778fe92f4fefb2f104acf9980a6c/services/ca2aea46a205473aabca2670c5607518/score",

                httpheader=c(''Content-Type'' = "application/json", ''Authorization''
    = authz_hdr),

                postfields=body,

                writefunction = h$update,

                verbose = TRUE

                )


    result = h$value()

    print(result)

    ```


    Summary


    In this chapter, you learned how to use Azure Machine Learning Studio to create
    your first experiment. You saw how to perform data preprocessing, and how to train,
    test, and evaluate your model in Azure Machine Learning Studio. In addition, you
    also saw how to deploy your new model in production. Once deployed, your machine
    learning model runs as a web service on Azure that can be called from a web form
    or any other application from a server, laptop, tablet, or smartphone. In the
    remainder of this book, you will learn how to use Azure Machine Learning to create
    experiments that solve various business problems such as customer propensity,
    customer churn, and predictive maintenance. In addition, you will also learn how
    to extend Azure Machine Learning with R scripting. Also, [Chapter 4](#part0013.html)
    introduces the most commonly used statistics and machine learning algorithms in
    Azure Machine Learning.


    CHAPTER 3


    ![image](images/00007.jpeg)


    Integration with R


    This chapter will introduce R and show how it is integrated with Microsoft Azure
    Machine Learning. Through simple examples, you will learn how to write and run
    your own R code when working with Azure Machine Learning. You will also learn
    the R packages supported by Azure Machine Learning, and how you can use them in
    the Azure Machine Learning Studio (ML Studio).


    R in a Nutshell


    R is an open source statistical programming language that is commonly used by
    the computational statistics and data science community for solving an extensive
    spectrum of business problems. These problems span the following areas:


    *   Bioinformatics (e.g. genome analysis)

    *   Actuarial sciences (e.g. figuring out risk exposures for insurance, finance,
    and other industries)

    *   Telecommunication (analyzing churn in corporate and consumer customer base,
    fraudulent SIM card usage, or mobile usage patterns)

    *   Finance and banking (e.g. identifying fraud in financial transactions), manufacturing
    (e.g. predicting hardware component failure times), and many more.


    When using R, users feel empowered by its toolbox of R packages that provides
    powerful capabilities for data analysis, visualization, and modeling. As of 2014,
    the Comprehensive R Archive Network (CRAN) provides a large collection of more
    than 5000 R packages. Besides CRAN, there are many other R packages available
    on Github (https://github.com/trending?l=r) and specialized R packages for bioinformatics
    in the Bioconductor R repository ([www.bioconductor.org/](http://www.bioconductor.org/)).


    ![Image](images/00013.jpeg) **Note**  R was created at the University of Auckland
    by Joss Ihaka and Robert Gentleman in 1994\. Since R’s creation, many leading
    computer scientists and statisticians have fueled R’s success by contributing
    to the R codebase or providing R packages that enable R users to leverage the
    latest techniques for statistical analysis, visualization, and data mining. This
    has propelled R to become one of the languages for data scientists. Learn more
    about R at [www.r-project.org/](http://www.r-project.org/).


    Given the momentum in the data science community in using R to tackle machine
    learning problems, it is super important for a cloud-based machine learning platform
    to empower data scientists to continue using the familiar R scripts that they
    have written, and continue to be productive. Currently, more than 400 R packages
    are supported by Azure Machine Learning. [Table 3-1](#part0011.html#Tab1) shows
    a subset of the R packages currently supported. These R packages enable you to
    model a wide spectrum of machine learning problems from market basket analysis,
    classification, regression, forecasting, and visualization.


    [Table 3-1](#part0011.html#_Tab1). R Packages Supported by Azure Machine Learning'
  trans: "\n恭喜！您刚刚将第一个机器学习模型部署到了生产环境。如果从“Web 服务”选项卡点击您的模型，您将看到详细信息，例如模型在七天内做出的预测次数。该服务还会显示您可用于以请求/响应或批处理执行模式将模型作为\
    \ Web 服务调用的 API。不仅如此，您还会获得可用于在 C#、Python 或 R 中调用新 Web 服务的示例代码。您可以使用此示例代码，从浏览器中的\
    \ Web 表单或您选择的任何其他应用程序，将模型作为 Web 服务进行调用。\n\n访问 Azure 机器学习 Web 服务\n\n要作为 Web 服务发挥作用，用户需要能够向服务发送数据并接收结果。该\
    \ Web 服务是一个 Azure Web 服务，可以通过以下两种方式之一接收和返回数据：\n\n*   **请求/响应**：用户可以使用 HTTP 协议向服务发送一组汽车价格数据，服务会响应一个预测价格的单一结果。\n\
    *   **批处理执行**：用户可以向服务发送一个 Azure BLOB 的 URL，该 BLOB 包含一行或多行汽车价格数据。服务将结果存储在另一个 BLOB\
    \ 中，并返回该容器的 URL。\n\n在 Web 服务的**仪表板**选项卡上，有指向信息的链接，这些信息将帮助开发人员编写代码来访问此服务。单击“请求/响应”行上的\
    \ API 帮助页面链接，将打开一个页面，其中包含使用服务请求/响应协议的示例代码。同样，“批处理执行”行上的链接提供了向服务发出批处理请求的示例代码。\n\
    \nAPI 帮助页面包含 R、C# 和 Python 编程语言的示例。例如，清单 2-1 显示了可用于访问您发布的 Web 服务的 R 代码（实际的服务 URL\
    \ 将显示在您的示例代码中）。\n\n***清单 2-1***。用于以编程方式访问服务的 R 代码\n\n```\nlibrary(\"RCurl\")\n\
    library(\"RJSONIO\")\n\n# 接受由公共证书颁发机构颁发的 SSL 证书\noptions(RCurlOptions = list(sslVersion=3L,\
    \ cainfo = system.file(\"CurlSSL\", \"cacert.pem\", package = \"RCurl\")))\n\n\
    h = basicTextGatherer()\nreq = list(Id=\"score00001\",\n Instance=list(FeatureVector=list(\n\
    \    \"symboling\"= \"0\",\n    \"make\"= \"0\",\n    \"body-style\"= \"0\",\n\
    \    \"wheel-base\"= \"0\",\n    \"engine-size\"= \"0\",\n    \"horsepower\"=\
    \ \"0\",\n    \"peak-rpm\"= \"0\",\n    \"highway-mpg\"= \"0\",\n    \"price\"\
    = \"0\"\n ),GlobalParameters=fromJSON('{}')))\n\nbody = toJSON(req)\napi_key =\
    \ \"abc123\" # 将此替换为 Web 服务的 API 密钥\nauthz_hdr = paste('Bearer', api_key, sep='\
    \ ')\n\nh$reset()\ncurlPerform(url = \"https://ussouthcentral.services.azureml.net/workspaces/fcaf778fe92f4fefb2f104acf9980a6c/services/ca2aea46a205473aabca2670c5607518/score\"\
    ,\n            httpheader=c('Content-Type' = \"application/json\", 'Authorization'\
    \ = authz_hdr),\n            postfields=body,\n            writefunction = h$update,\n\
    \            verbose = TRUE\n            )\n\nresult = h$value()\nprint(result)\n\
    ```\n\n总结\n\n在本章中，您学习了如何使用 Azure 机器学习工作室创建您的第一个实验。您了解了如何执行数据预处理，以及如何在 Azure 机器学习工作室中训练、测试和评估您的模型。此外，您还了解了如何将新模型部署到生产环境。部署后，您的机器学习模型将作为\
    \ Azure 上的 Web 服务运行，可以从 Web 表单或任何其他应用程序（服务器、笔记本电脑、平板电脑或智能手机）进行调用。在本书的其余部分，您将学习如何使用\
    \ Azure 机器学习创建实验，以解决各种业务问题，例如客户倾向、客户流失和预测性维护。此外，您还将学习如何使用 R 脚本扩展 Azure 机器学习。同时，第\
    \ 4 章 介绍了 Azure 机器学习中最常用的统计和机器学习算法。\n\n第 3 章\n\n![image](img/00007.jpeg)\n\n与\
    \ R 的集成\n\n本章将介绍 R，并展示它如何与 Microsoft Azure 机器学习集成。通过简单的示例，您将学习在使用 Azure 机器学习时如何编写和运行自己的\
    \ R 代码。您还将了解 Azure 机器学习支持的 R 包，以及如何在 Azure 机器学习工作室（ML Studio）中使用它们。\n\nR 简介\n\n\
    R 是一种开源统计编程语言，计算统计和数据科学社区通常使用它来解决广泛的业务问题。这些问题涵盖以下领域：\n\n*   生物信息学（例如基因组分析）\n*\
    \   精算科学（例如计算保险、金融和其他行业的风险敞口）\n*   电信（分析企业和消费者客户群中的流失、欺诈性 SIM 卡使用或移动使用模式）\n* \
    \  金融和银行业（例如识别金融交易中的欺诈）、制造业（例如预测硬件组件故障时间）等等。\n\n使用 R 时，用户会因其 R 包工具箱而感到强大，该工具箱提供了用于数据分析、可视化和建模的强大功能。截至\
    \ 2014 年，综合 R 档案网络（CRAN）提供了超过 5000 个 R 包的大型集合。除了 CRAN，Github（https://github.com/trending?l=r）上还有许多其他\
    \ R 包，以及 Bioconductor R 存储库（[www.bioconductor.org/](http://www.bioconductor.org/)）中用于生物信息学的专用\
    \ R 包。\n\n![Image](img/00013.jpeg) **注意** R 由奥克兰大学的 Joss Ihaka 和 Robert Gentleman\
    \ 于 1994 年创建。自 R 创建以来，许多顶尖的计算机科学家和统计学家通过为 R 代码库做出贡献或提供 R 包，使 R 用户能够利用最新的统计分析、可视化和数据挖掘技术，从而推动了\
    \ R 的成功。这促使 R 成为数据科学家的语言之一。在 [www.r-project.org/](http://www.r-project.org/) 上了解更多关于\
    \ R 的信息。\n\n鉴于数据科学社区在使用 R 解决机器学习问题方面的势头，对于一个基于云的机器学习平台来说，让数据科学家能够继续使用他们熟悉的 R 脚本并保持高效至关重要。目前，Azure\
    \ 机器学习支持超过 400 个 R 包。表 3-1 显示了当前支持的 R 包的一个子集。这些 R 包使您能够对广泛的机器学习问题进行建模，从购物篮分析、分类、回归、预测到可视化。\n\
    \n表 3-1。Azure 机器学习支持的 R 包\n"
- fmt: "| R packages | Description |\n| --- | --- |\n| `Arules` | Frequent itemsets\
    \ and association rule mining |\n| `FactoMineR` | Data exploration |\n| `Forecast`\
    \ | Univariate time series forecasts (exponential smoothing and automatic ARIMA)\
    \ |\n| `ggplot2` | Graphics |\n| `Glmnet` | Linear regression, logistics and multinomial\
    \ regression models, poisson regression, and Cox Model |\n| `Party` | Tools for\
    \ decision tree |\n| `randomForest` | Classification and regression models based\
    \ on a forest of trees |\n| `Rsonlp` | General non-linear optimization using augmented\
    \ lagrange multipliers |\n| `Xts` | Time series |\n| `Zoo` | Time series |\n\n\
    ![Image](images/00013.jpeg) **Tip** To get the complete list of installed packages,\
    \ create a new experiment in Cloud Machine Learning, use the `Execute R Script`\
    \ module, provide the following script in the body of the `Execute R Script` module,\
    \ and run the experiment. After the experiment\n\n```\nout <- data.frame(installed.packages())maml.mapOutputPort(\"\
    out\")\n```\n\ncompletes, right-click the left output portal of the module and\
    \ select `Visualize`. The packages that have been installed in Cloud Machine Learning\
    \ will be listed.\n\nAzure Machine Learning provides R language modules to enable\
    \ you to integrate R into your machine learning experiments. Currently, the R\
    \ language module that can be used within the Azure Machine Learning Studio (ML\
    \ Studio) is the `Execute R Script` module.\n\nThe `Execute R Script` module enables\
    \ you to specify input datasets (at most two datasets), an R script, and a Zip\
    \ file containing a set of R scripts (optional). After the module processes the\
    \ data, it produces a result dataset and an R device output. In Azure Machine\
    \ Learning, the R scripts are executed using R 4.1.0.\n\n![Image](images/00013.jpeg)\
    \ **Note** The R Device output shows the console output and graphics that are\
    \ produced during the execution of the R script. For example, in the R script,\
    \ you might have used the R `plot()` function. The output of `plot()` can be visualized\
    \ when you right-click on the R Device output and choose `Visualize`.\n\nML Studio\
    \ enables you to monitor and troubleshoot the progress of the experiment. Once\
    \ the execution has completed, you can view the output log of each run of the\
    \ R module. The output log will also enable you to troubleshoot issues if the\
    \ execution failed.\n\nIn this chapter, you will learn how to integrate R with\
    \ Azure Machine Learning. Through the use of simple examples and datasets available\
    \ in ML Studio, you will gain essential skills to unleash the power of R to create\
    \ exciting and useful experiments with Azure Machine Learning. Let’s get started!\n\
    \n## Building and Deploying Your First R Script\n\nTo build and deploy your first\
    \ R script module, first you need to create a new experiment. After you create\
    \ the experiment, you will see the `Execute R Script` module that is provided\
    \ in the Azure Machine Learning Studio (ML Studio). The script will be executed\
    \ by Azure Machine Learning using R 3.1.0 (the version that was installed on Cloud\
    \ Machine Learning at the time of this book). [Figure 3-1](#part0011.html#Fig1)\
    \ shows the R Language modules.\n\n![9781484204467_Fig03-01.jpg](images/00032.jpeg)\n\
    \n[Figure 3-1](#part0011.html#_Fig1). R Language modules in ML Studio\n\nIn this\
    \ section, you will learn how to use the `Execute R Script` to perform sampling\
    \ on a dataset. Follow these steps.\n\n1.  From the toolbox, expand the `Saved\
    \ Datasets` node, and click the `Adult Census Income Binary Classification` dataset.\
    \ Drag and drop it onto the experiment design area.\n2.  From the toolbox, expand\
    \ the `R Language Modules` node, and click the `Execute R Script` module. Drag\
    \ and drop it onto the experiment design area.\n3.  Connect the dataset to the\
    \ `Execute R Script` module. [Figure 3-2](#part0011.html#Fig2) shows the experiment\
    \ design.\n\n![9781484204467_Fig03-02.jpg](images/00033.jpeg)\n\n[Figure 3-2](#part0011.html#_Fig2).\
    \ Using the `Execute R Script` to perform sampling on the `Adult Census Income\
    \ Binary Classification` dataset\n\nThe `Execute R Script` module provides two\
    \ input ports for datasets that can be used by the R script. In addition, it allows\
    \ you to specify a Zip file that contains the R source script files that are used\
    \ by the module. You can edit the R source script files on your local machine\
    \ and test them. Then, you can compress the needed files into a Zip file and upload\
    \ it to Azure Machine Learning through `New > Dataset > From Local File` path.\
    \ After the `Execute R Script` module processes the data, the module provides\
    \ two output ports: `Result Dataset` and an `R Device`. The `Result Dataset` corresponds\
    \ to output from the R script that can be passed to the next module. The `R Device`\
    \ output port provides you with an easy way to see the console output and graphics\
    \ that are produced by the R interpreter.\n\nLet’s continue creating your first\
    \ R script using ML Studio.\n\n4.  Click the `Execute R Script` module.\n5.  On\
    \ the Properties pane, write the following R script to perform sampling:\n\n```\n\
    \    # Map 1-based optional input ports to variables\n    dataset1 <- maml.mapInputPort(1)\
    \ # class: data.frame\n    mysample <- dataset1[sample(1:nrow(dataset1), 50, replace=FALSE),]\n\
    \ndata.set = mysample\n    print (mysample)\n\n# Select data.frame to be sent\
    \ to the output Dataset port\n    maml.mapOutputPort(\"data.set\");\n\nR Script\
    \ to perform sampling\n```\n\nTo use the `Execute R Script` module, the following\
    \ pattern is often used:\n\n*   Map the input ports to R variables or data frame.\n\
    *   Main body of the R Script.\n*   Map the results to the output ports (see [Figure\
    \ 3-3](#part0011.html#Fig3)).\n\n![9781484204467_Fig03-03.jpg](images/00034.jpeg)\n\
    \n[Figure 3-3](#part0011.html#_Fig3). Successful execution of the sampling experiment\n\
    \nTo see this pattern in action, observe that in the R script provided, the `maml.mapInputPort(1)`\
    \ method is used to map the dataset that was passed in from the first input port\
    \ of the module to an R data frame. Next, see the R script that is used to perform\
    \ sampling of the data. For debugging purposes, we also printed out the results\
    \ of the sample. In the last step of the R script, the results are assigned to\
    \ `data.set` and mapped to the output port using `maml.mapOutputPort(\"data.set\"\
    )`.\n\nYou are now ready to run the experiment. To do this, click the `Run` icon\
    \ at the bottom pane of ML Studio. [Figure 3-3](#part0011.html#Fig3) shows that\
    \ the experiment has successfully completed execution.\n\nOnce the experiment\
    \ has finished running, you can see the output of the R script. To do this, right-click\
    \ on the `Result Dataset` of the `Execute R Script` module. [Figure 3-4](#part0011.html#Fig4).\
    \ shows the options available when you right-click on the `Result Dataset` of\
    \ the `Execute R Script` module. Choose `Visualize`.\n\n![9781484204467_Fig03-04.jpg](images/00035.jpeg)\n\
    \n[Figure 3-4](#part0011.html#_Fig4). Visualizing the output of the R script\n\
    \nAfter you click `Visualize`, you will see that the sample consists of 50 rows.\
    \ Each of the rows has 15 columns and the data distribution for the data. [Figure\
    \ 3-5](#part0011.html#Fig5) shows the visualization for the Result dataset.\n\n\
    ![9781484204467_Fig03-05.jpg](images/00036.jpeg)\n\n[Figure 3-5](#part0011.html#_Fig5).\
    \ Visualization of result dataset produced by the R script\n\nCongratulations,\
    \ you have just successfully completed the integration of your first simple R\
    \ script in Azure Machine Learning! In the next section, you will learn how to\
    \ use Azure Machine Learning and R to create a machine learning model.\n\n![Image](images/00013.jpeg)\
    \ **Note** Learn more about R and Machine Learning at [http://ocw.mit.edu/courses/sloan-school-of-management/15-097-prediction-machine-learning-and-statistics-spring-2012/lecture-notes/MIT15_097S12_lec02.pdf](http://ocw.mit.edu/courses/sloan-school-of-management/15-097-prediction-machine-learning-and-statistics-spring-2012/lecture-notes/MIT15_097S12_lec02.pdf)."
