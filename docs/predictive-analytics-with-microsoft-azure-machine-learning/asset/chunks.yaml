    # CHAPTER 2


    ![image](images/00007.jpeg)


    ## Introducing Microsoft Azure Machine Learning


    *Azure Machine Learning, where data science, predictive analytics, cloud computing,
    and your data meet!*


    Azure Machine Learning empowers data scientists and developers to transform data
    into insights using predictive analytics. By making it easier for developers to
    use the predictive models in end-to-end solutions, Azure Machine Learning enables
    actionable insights to be gleaned and operationalized easily.


    Using Machine Learning Studio, data scientists and developers can quickly build,
    test, and develop the predictive models using state-of-the art machine learning
    algorithms.


    ### Hello, Machine Learning Studio!


    *Azure Machine Learning Studio provides an interactive* *visual workspace* *that
    enables you to easily build, test, and deploy predictive analytic models.*


    In Machine Learning Studio, you construct a predictive model by dragging and dropping
    datasets and analysis modules onto the design surface. You can iteratively build
    predictive analytic models using experiments in Azure Machine Learning Studio.
    Each experiment is a complete workflow with all the components required to build,
    test, and evaluate a predictive model. In an experiment, machine learning modules
    are connected together with lines that show the flow of data and parameters through
    the workflow. Once you design an experiment, you can use Machine Learning Studio
    to execute it.


    Machine Learning Studio allows you to iterate rapidly by building and testing
    several models in minutes. When building an experiment, it is common to iterate
    on the design of the predictive model, edit the parameters or modules, and run
    the experiment several times. Often, you will save multiple copies of the experiment
    (using different parameters). When you first open Machine Learning Studio, you
    will notice it is organized as follows:


    *   **Experiments**: Experiments that have been created, run, and saved as drafts.
    These include a set of sample experiments that ship with the service to help jumpstart
    your projects.

    *   **Web Services**: A list of experiments that you have published as web services.
    This list will be empty until you publish your first experiment.

    *   **Settings**: A collection of settings that you can use to configure your
    account and resources. You can use this option to invite other users to share
    your workspace in Azure Machine Learning.


    To develop a predictive model, you will need to be able to work with data from
    different data sources. In addition, the data needs to be transformed and analyzed
    before it can be used as input for training the predictive model. Various data
    manipulation and statistical functions are used for preprocessing the data and
    identifying the parts of the data that are useful. As you develop a model, you
    go through an iterative process where you use various techniques to understand
    the data, the key features in the data, and the parameters that are used to tune
    the machine learning algorithms. You continuously iterate on this until you get
    to point where you have a trained and effective model that can be used.


    ### Components of an Experiment


    An experiment is made of the key components necessary to build, test, and evaluate
    a predictive model. In Azure Machine Learning, an experiment contains two main
    components: datasets and modules.


    A dataset contains data that has been uploaded to Machine Learning Studio. The
    dataset is used when creating a predictive model. Machine Learning Studio also
    provides several sample datasets to help you jumpstart the creation of your first
    few experiments. As you explore Machine Learning Studio, you can upload additional
    datasets.


    A module is an algorithm that you will use when building your predictive model.
    Machine Learning Studio provides a large set of modules to support the end-to-end
    data science workflow, from reading data from different data sources; preprocessing
    the data; to building, training, scoring, and validating a predictive model. These
    modules include the following:'
