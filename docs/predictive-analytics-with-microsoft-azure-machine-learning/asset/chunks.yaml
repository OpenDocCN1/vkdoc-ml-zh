  trans: '

    在执行聚类分析时，用户需要指定空间中任意两点之间的距离度量。在 ML Studio 中，这由 **Metric** 属性定义。支持两种距离度量：欧几里得距离（也称为
    L2 范数）和余弦距离。根据输入数据的特性和用例，用户应选择 k-means 聚类所使用的相关 **Metric** 属性。


    ![Image](img/00013.jpeg) **注意**  在执行聚类分析时，能够测量点与向量之间的距离（或相似度）非常重要。欧几里得距离和余弦距离是常用的距离度量。


    *欧几里得距离*：给定两点 p1 和 p2，p1 与 p2 之间的欧几里得距离是连接这两点的线段的长度。欧几里得距离也可用于测量两个向量之间的距离。


    *余弦距离*：给定两个向量 v1 和 v2，余弦距离是 v1 与 v2 之间夹角的余弦值。


    选择使用哪种距离度量通常取决于具体领域。


    欧几里得距离对所比较向量的尺度/幅度很敏感。需要注意的是，即使两个向量可能相对相似，但如果特征的尺度差异显著，欧几里得距离可能会显示这两个向量是不同的。在这种情况下，通常使用余弦距离，因为无论尺度如何，两个向量之间的余弦夹角都会很小。


    选择距离度量的指标后，您需要选择质心初始化算法。在 Azure 机器学习中，这由 **Initialization** 属性定义。支持五种质心初始化算法。表
    7-1 展示了不同的质心初始化算法。


    表 7-1. K-Means 聚类，质心初始化算法


    | 质心初始化算法 | 描述 |

    | --- | --- |

    | **默认** | 选取前 N 个点作为初始质心 |

    | **随机** | 随机选取初始质心 |

    | **K-Means++** | K-Means++ 质心初始化 |

    | **K-Means+ 快速** | K-Means++ 质心初始化，其中 P:=1（在算法的每次迭代中选取最远的质心） |

    | **均匀** | 均匀选取 N 个点作为初始质心 |


    这些属性已在示例实验中为您预先配置好。


    至此，您可以准备运行实验了。点击 ML Studio 底部面板上的 **运行**。实验成功执行后，将生成两组聚类。**元数据编辑器** 模块用于更改数据集中与列关联的元数据，以包含分配的聚类。此外，**转换为
    CSV** 模块用于将结果转换为逗号分隔值，以便您下载结果集。


    恭喜！您已成功使用 ML Studio 中的 **K-Means 聚类** 模块运行了第一个公司细分实验。


    批发客户的客户细分


    通过上一节，您了解了示例实验中用于执行客户细分的核心模块（K-Means 聚类、训练聚类模型）。


    在本节中，您将逐步学习如何构建聚类模型，以对批发客户数据集执行客户细分。


    ![Image](img/00013.jpeg) **注意**  批发客户数据集可在 UCI 机器学习库中找到。该数据集包含八列（称为属性或特征），并包含一家在不同地区运营的批发分销商的客户信息。


    这些列包括在鲜奶、食品杂货、冷冻食品、洗涤剂、纸张和熟食产品上的年度支出。此外，它还包含客户渠道（酒店/咖啡馆/餐厅）或零售的信息。


    请参考 [`archive.ics.uci.edu/ml/datasets/Wholesale`](http://archive.ics.uci.edu/ml/datasets/Wholesale)+customers。


    从 UCI 机器学习库加载数据


    让我们开始使用 **读取器** 模块从 UCI 机器学习库检索数据。为此，从工具箱中拖放一个 **读取器** 模块（数据输入和输出）。接下来，配置 **读取器**
    模块以从 Http 源读取数据，并提供数据集的 URL：[`archive.ics.uci.edu/ml/machine-learning-databases/00292/Wholesale%20customers%20data.csv`](http://archive.ics.uci.edu/ml/machine-learning-databases/00292/Wholesale%20customers%20data.csv)


    图 7-7 展示了 **读取器** 模块及其配置。


