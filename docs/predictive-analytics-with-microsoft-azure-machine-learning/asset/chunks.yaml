  trans: "\n| R 包 | 描述 |\n| --- | --- |\n| **Arules** | 频繁项集与关联规则挖掘 |\n| **FactoMineR**\
    \ | 数据探索 |\n| **Forecast** | 单变量时间序列预测（指数平滑与自动 ARIMA） |\n| **ggplot2** | 图形绘制\
    \ |\n| **Glmnet** | 线性回归、逻辑回归与多项回归模型、泊松回归及 Cox 模型 |\n| **Party** | 决策树工具 |\n|\
    \ **randomForest** | 基于树状森林的分类与回归模型 |\n| **Rsonlp** | 使用增广拉格朗日乘子法进行通用非线性优化 |\n\
    | **Xts** | 时间序列 |\n| **Zoo** | 时间序列 |\n\n![Image](img/00013.jpeg) **提示**  要获取已安装包的完整列表，请在云机器学习中创建一个新实验，使用**执行\
    \ R 脚本**模块，在**执行 R 脚本**模块的主体中提供以下脚本，并运行实验。实验完成后\n\n```\nout <- data.frame(installed.packages())maml.mapOutputPort(\"\
    out\")\n```\n\n，右键单击模块的左侧输出端口并选择**可视化**。云机器学习中已安装的包将被列出。\n\nAzure 机器学习提供了 R 语言模块，使您能够将\
    \ R 集成到机器学习实验中。目前，可在 Azure 机器学习工作室（ML Studio）中使用的 R 语言模块是**执行 R 脚本**模块。\n\n**执行\
    \ R 脚本**模块允许您指定输入数据集（最多两个数据集）、一个 R 脚本以及一个包含一组 R 脚本的 Zip 文件（可选）。模块处理数据后，会生成一个结果数据集和一个\
    \ R 设备输出。在 Azure 机器学习中，R 脚本使用 R 4.1.0 执行。\n\n![Image](img/00013.jpeg) **注意**  R\
    \ 设备输出显示 R 脚本执行期间生成的控制台输出和图形。例如，在 R 脚本中，您可能使用了 R 的 plot() 函数。当您右键单击 R 设备输出并选择**可视化**时，可以查看\
    \ plot() 的输出。\n\nML Studio 使您能够监控和排查实验的进度。执行完成后，您可以查看 R 模块每次运行的输出日志。如果执行失败，输出日志还将帮助您排查问题。\n\
    \n在本章中，您将学习如何将 R 与 Azure 机器学习集成。通过使用 ML Studio 中提供的简单示例和数据集，您将掌握基本技能，以释放 R 的强大功能，使用\
    \ Azure 机器学习创建令人兴奋且有用的实验。让我们开始吧！\n\n构建和部署您的第一个 R 脚本\n\n要构建和部署您的第一个 R 脚本模块，首先需要创建一个新实验。创建实验后，您将看到\
    \ Azure 机器学习工作室（ML Studio）中提供的**执行 R 脚本**模块。该脚本将由 Azure 机器学习使用 R 3.1.0（本书撰写时云机器学习上安装的版本）执行。图\
    \ 3-1 显示了 R 语言模块。\n\n![9781484204467_Fig03-01.jpg](img/00032.jpeg)\n\n图 3-1. ML\
    \ Studio 中的 R 语言模块\n\n在本节中，您将学习如何使用执行 R 脚本对数据集执行采样。请按照以下步骤操作。\n\n1.  从工具箱中，展开**已保存数据集**节点，单击**成人普查收入二元分类**数据集。将其拖放到实验设计区域。\n\
    2.  从工具箱中，展开**R 语言模块**节点，单击**执行 R 脚本**模块。将其拖放到实验设计区域。\n3.  将数据集连接到**执行 R 脚本**模块。图\
    \ 3-2 显示了实验设计。\n\n![9781484204467_Fig03-02.jpg](img/00033.jpeg)\n\n图 3-2. 使用执行\
    \ R 脚本对成人普查收入二元分类数据集执行采样\n\n**执行 R 脚本**模块为 R 脚本可使用的数据集提供了两个输入端口。此外，它还允许您指定一个包含模块使用的\
    \ R 源脚本文件的 Zip 文件。您可以在本地机器上编辑并测试 R 源脚本文件。然后，将所需文件压缩成 Zip 文件，并通过“新建 > 数据集 > 来自本地文件”路径上传到\
    \ Azure 机器学习。**执行 R 脚本**模块处理数据后，该模块提供两个输出端口：结果数据集和 R 设备。结果数据集对应于 R 脚本的输出，可以传递给下一个模块。R\
    \ 设备输出端口为您提供了一种简便的方式来查看 R 解释器生成的控制台输出和图形。\n\n让我们继续使用 ML Studio 创建您的第一个 R 脚本。\n\
    \n4.  单击**执行 R 脚本**模块。\n5.  在属性窗格中，编写以下 R 脚本以执行采样：\n\n```\n    # 将基于 1 的可选输入端口映射到变量\n\
    \    dataset1 <- maml.mapInputPort(1) # 类别: data.frame\n    mysample <- dataset1[sample(1:nrow(dataset1),\
    \ 50, replace=FALSE),]\n\ndata.set = mysample\n    print (mysample)\n\n# 选择要发送到输出数据集端口的数据框\n\
    \    maml.mapOutputPort(\"data.set\");\n\n用于执行采样的 R 脚本\n    ```\n\n要使用**执行 R 脚本**模块，通常采用以下模式：\n\
    \n*   将输入端口映射到 R 变量或数据框。\n*   R 脚本的主体部分。\n*   将结果映射到输出端口（参见图 3-3）。\n\n![9781484204467_Fig03-03.jpg](img/00034.jpeg)\n\
    \n图 3-3. 采样实验成功执行\n\n要查看此模式的实际应用，请注意在提供的 R 脚本中，使用了 maml.mapInputPort(1) 方法将从模块第一个输入端口传入的数据集映射到\
    \ R 数据框。接下来，查看用于对数据执行采样的 R 脚本。出于调试目的，我们还打印了采样的结果。在 R 脚本的最后一步，将结果分配给 data.set，并使用\
    \ maml.mapOutputPort(\"data.set\") 映射到输出端口。\n\n现在您可以运行实验了。为此，请单击 ML Studio 底部窗格的“运行”图标。图\
    \ 3-3 显示实验已成功完成执行。\n\n实验运行完成后，您可以查看 R 脚本的输出。为此，请右键单击**执行 R 脚本**模块的**结果数据集**。图\
    \ 3-4 显示了右键单击**执行 R 脚本**模块的**结果数据集**时可用的选项。选择**可视化**。\n\n![9781484204467_Fig03-04.jpg](img/00035.jpeg)\n\
    \n图 3-4. 可视化 R 脚本的输出\n\n单击**可视化**后，您将看到样本包含 50 行。每行有 15 列以及数据的数据分布。图 3-5 显示了结果数据集的可视化。\n\
    \n![9781484204467_Fig03-05.jpg](img/00036.jpeg)\n\n图 3-5. R 脚本生成的结果数据集的可视化\n\n\
    恭喜，您已成功完成了在 Azure 机器学习中集成第一个简单 R 脚本！在下一节中，您将学习如何使用 Azure 机器学习和 R 创建机器学习模型。\n\n\
    ![Image](img/00013.jpeg) **注意**  了解更多关于 R 和机器学习的信息，请访问 [`ocw.mit.edu/courses/sloan-school-of-management/15-097-prediction-machine-learning-and-statistics-spring-2012/lecture-notes/MIT15_097S12_lec02.pdf`](http://ocw.mit.edu/courses/sloan-school-of-management/15-097-prediction-machine-learning-and-statistics-spring-2012/lecture-notes/MIT15_097S12_lec02.pdf)。\n"
- fmt: "# Using R for Data Preprocessing\n\nIn many machine learning tasks, dimensionality\
    \ reduction is an important step that is used to reduce the number of features\
    \ for the machine learning algorithm. Principal component analysis (PCA) is a\
    \ commonly used dimensionality reduction technique. PCA reduces the dimensionality\
    \ of the dataset by finding a new set of variables (principal components) that\
    \ are linear combinations of the original dataset, and are uncorrelated with all\
    \ other variables. In this section, you will learn how to use R for preprocessing\
    \ the data and reducing the dimensionality of dataset.\n\nLet’s get started with\
    \ using the `Execute R Script` module to perform principal component analysis\
    \ of one of the sample datasets available in ML Studio. Follow these steps.\n\n\
    1. Create a new experiment.\n2. From Saved Datasets, choose `CRM Dataset Shared`\
    \ (see [Figure 3-6](#part0011.html#Fig6)).\n\n![9781484204467_Fig03-06.jpg](images/00037.jpeg)\n\
    \n[Figure 3-6](#part0011.html#_Fig6). Using the sample dataset, CRM Dataset Shared\n\
    \n3. Right-click the output node, and choose `Visualize`. From the visualization\
    \ shown in [Figure 3-7](#part0011.html#Fig7), you will see that are 230 columns.\n\
    \n![9781484204467_Fig03-07.jpg](images/00038.jpeg)\n\n[Figure 3-7](#part0011.html#_Fig7).\
    \ Initial 230 columns from the CRM Shared dataset\n\n4. Before you perform PCA,\
    \ you need to make sure that the inputs to the `Execute R Script` module are numeric.\
    \ For the sample dataset of CRM Dataset Shared, you know that the first 190 columns\
    \ are numeric, and the remaining 40 columns are categorical. You first use the\
    \ `Project Columns`, and set the `Selected Column |` column indices to be 1-190.\n\
    5. Next, use the `Missing Values Scrubber` module to replace the missing value\
    \ with 0, as follows:\n   1. For missing values: Custom substitution value\n \
    \  2. Replace with Value: 0\n   3. Cols with all MV: KeepColumns\n   4. MV indicator\
    \ column: DoNotGenerate\n6. Once the missing values have been scrubbed, use the\
    \ `Metadata Editor` module to change the data type for all the columns to be Integer.\n\
    7. Next, drag and drop the `Execute R Script` module to the design surface and\
    \ connect the modules, as shown in [Figure 3-8](#part0011.html#Fig8).\n\n![9781484204467_Fig03-08.jpg](images/00039.jpeg)\n\
    \n[Figure 3-8](#part0011.html#_Fig8). Using the Execute R Script module to perform\
    \ PCA\n\n8. Click the `Execute R Script` module. You can provide the following\
    \ script that will be used to perform PCA:\n\n```\n    # Map 1-based optional\
    \ input ports to variables\n    dataset1 <- maml.mapInputPort(1)\n    # Perform\
    \ PCA on the first 190 columns\n    pca = prcomp(dataset1[,1:190])\n\n# Return\
    \ the top 10 principal components\n    top_pca_scores = data.frame(pca$x[,1:10])\n\
    \    data.set = top_pca_scores\n    plot(data.set)\n    # Select data.frame to\
    \ be sent to the output Dataset port\n    maml.mapOutputPort(\"data.set\");\n\
    ```\n\n[Figure 3-9](#part0011.html#Fig9) shows how to use the script in ML Studio.\n\
    \n![9781484204467_Fig03-09.jpg](images/00040.jpeg)\n\n[Figure 3-9](#part0011.html#_Fig9).\
    \ Performing PCA on the first 190 columns\n\n9. Click `Run`.\n10. Once the experiment\
    \ has successfully executed, click the `Result dataset` node of the `Execute R\
    \ Script` module. Click `Visualize`.\n11. [Figure 3-10](#part0011.html#Fig10)\
    \ shows the top ten principal components for the CRM Shared dataset. The principal\
    \ components are used in the subsequent steps for building the classification\
    \ model.\n\n![9781484204467_Fig03-10.jpg](images/00041.jpeg)\n\n[Figure 3-10](#part0011.html#_Fig10).\
    \ Principal components identified for the CRM Shared dataset\n\n![Image](images/00013.jpeg)\
    \ **Tip** You can also provide a script bundle containing the R script in a Zip\
    \ file, and use it in the `Execute R Script` module.\n\n## Using a Script Bundle\
    \ (Zip)\n\nIf you have an R script that you have been using and want to use it\
    \ as part of the experiment, you can Zip up the R script, and upload it to ML\
    \ Studio as a dataset. To use a script bundle with the `Execute R Script` module,\
    \ you will first need to package up the file in Zip format, so follow these steps.\n\
    \n1. Navigate to the folder containing the R scripts that you intend to use in\
    \ your experiment (see [Figure 3-11](#part0011.html#Fig11)).\n\n![9781484204467_Fig03-11.jpg](images/00042.jpeg)\n\
    \n[Figure 3-11](#part0011.html#_Fig11). Folder containing the R script pcaexample.r\n\
    \n2. Select all the files that you want to package up and right-click. In this\
    \ example, right-click the file `pcaexample.r`, and choose `Send to Compressed\
    \ (zipped) folder`, as shown in [Figure 3-12](#part0011.html#Fig12).\n\n![9781484204467_Fig03-12.jpg](images/00043.jpeg)\n\
    \n[Figure 3-12](#part0011.html#_Fig12). Packaging the R scripts as a ZIP file\n\
    \n3. Next, upload the zip file to ML Studio. TO do this, choose `New DATASET`\
    \ ![image](images/00044.jpeg) `From Local File`. Select the Zip file that you\
    \ want to upload, as shown in [Figures 3-13](#part0011.html#Fig13) and [3-14](#part0011.html#Fig14).\n\
    \n![9781484204467_Fig03-13.jpg](images/00045.jpeg)\n\n[Figure 3-13](#part0011.html#_Fig13).\
    \ New Dataset ![image](images/00044.jpeg) From Local File\n\n![9781484204467_Fig03-14.jpg](images/00046.jpeg)\n\
    \n[Figure 3-14](#part0011.html#_Fig14). Uploading a new dataset\n\n4. Once the\
    \ dataset has been uploaded, you can use it in your experiment. To do this, from\
    \ `Saved Datasets`, select the `uploaded Zip file`, and drag and drop it to the\
    \ experiment.\n5. Connect the uploaded Zip file to the `Execute R Script` module\
    \ – `Script Bundle (Zip)` input, as shown in [Figure 3-15](#part0011.html#Fig15).\n\
    \n![9781484204467_Fig03-15.jpg](images/00047.jpeg)\n\n[Figure 3-15](#part0011.html#_Fig15).\
    \ Using the script bundle as an input to the Execute R Script module\n\n6. In\
    \ the `Execute R Script` module, specify where the R script can be found, as follows\
    \ and as shown in [Figure 3-16](#part0011.html#Fig16):\n\n```\n    # Map 1-based\
    \ optional input ports to variables\n    dataset1 <- maml.mapInputPort(1)\n  \
    \  # Contents of optional Zip port are in ./src/\n    source(\"src/pcaexample.r\"\
    );\n\n# Select data.frame to be sent to the output Dataset port\n    maml.mapOutputPort(\"\
    data.set\");\n```\n\n![9781484204467_Fig03-16.jpg](images/00048.jpeg)\n\n[Figure\
    \ 3-16](#part0011.html#_Fig16). Using the script bundle as inputs to the Execute\
    \ R Script module\n\n7. You are now ready to run the experiment using the R script\
    \ in the Zip file that you have uploaded to ML Studio. Using the script bundle\
    \ allows you to easily reference an R script file that you can test outside of\
    \ ML Studio. In order to update the script, you will have to re-upload the Zip\
    \ file.\n\n## Building and Deploying a Decision Tree Using R\n\nIn this section,\
    \ you will learn how to use R to build a machine learning model. When using R,\
    \ you can tap into the large collection of R packages that implement various machine\
    \ learning algorithms for classification, clustering, regression, K-Nearest Neighbor,\
    \ market basket analysis, and much more.\n\n![Image](images/00013.jpeg) **Note**\
    \ When you use the machine learning algorithms available in R and execute them\
    \ using the `Execute R` module, you can only visualize the model and parameters.\
    \ You cannot save the trained model and use it as input to other ML Studio modules.\n\
    \nUsing ML studio, several R machine learning algorithms are provided. For example,\
    \ you can use the `R Auto-ARIMA` module to build an optimal autoregressive moving\
    \ average model for a univariate time series. You can also use the `R K-Nearest\
    \ Neighbor Classification` module to create a k-nearest neighbor (KNN) classification\
    \ model.\n\nIn this section, you will learn how to use an R package called `rpart`\
    \ to build a decision tree. The `rpart` package provides you with recursive partitioning\
    \ algorithms for performing classification and regression."
