  trans: '

    数据科学为客户提供了基于其收集的所有数据做出更明智、更及时决策的真正机会。借助合适的工具，数据科学不仅能从客户自身数据中，还能从其组织外日益增长的数据源（如天气数据、客户人口统计数据、来自信用机构的消费者信用数据，以及来自
    Twitter、Instagram 等社交媒体网站的数据）中，为客户提供新颖且可操作的见解。以下是数据科学如今对企业成功至关重要的几个原因。


    **数据作为竞争资产**


    数据如今已成为一种关键资产，为那些正确利用数据进行决策的明智组织提供了竞争优势。麦肯锡和 Gartner 都认同这一点：在最近的一篇论文中，麦肯锡指出，使用数据和业务分析进行决策的公司比不这样做的公司生产力更高，股本回报率也更高。类似地，Gartner
    认为，投资于现代数据基础设施的组织将比其同行表现高出多达 20%。大数据为组织提供了机会，可以跨数据孤岛整合有价值的数据，以获取推动更明智决策的新见解。


    *“使用数据和业务分析指导决策的公司比不这样做的竞争对手生产力更高，股本回报率也更高。”*


    ——Brad Brown 等人，麦肯锡全球研究所，2011 年


    *“到 2015 年，将高价值、多样化的新型信息类型和来源整合到连贯信息管理基础设施中的组织，其财务表现将比行业同行高出 20% 以上。”*


    ——Regina Casonato 等人，Gartner¹


    **客户需求增长**


    在过去的几十年里，商业智能一直是大多数组织使用的关键分析形式。然而，随着大数据的出现，越来越多的客户现在渴望使用预测分析来改进营销和业务规划。传统的 BI
    能很好地提供对业务的回顾性分析，但无助于解决任何涉及预测或预报的前瞻性问题。


    过去两年，客户对预测分析的需求激增，因为他们寻求更强大的分析技术，从存储的大量业务数据中挖掘价值。根据我们的综合经验，我们从未见过客户对数据科学的需求像过去两年这样旺盛！


    **对数据挖掘技术的认识提高**


    如今，一部分数据挖掘和机器学习算法已被更广泛地理解，因为它们已被 Netflix 和 Amazon 等早期采用者试用和测试，这些公司在其推荐引擎中使用这些算法。虽然大多数客户不完全理解所用机器学习算法的细节，但它们在
    Netflix 电影推荐或在线商店推荐引擎中的应用非常显著。同样，许多客户现在也意识到了大多数成熟的在线供应商大量使用的定向广告。因此，虽然许多客户可能不了解所用算法的细节，但他们现在越来越理解其商业价值。


    **获取更多数据**


    数字数据在过去几年中呈爆炸式增长，并且没有放缓的迹象。大多数行业专家现在都同意，我们收集的数据比以往任何时候都多。根据 IDC 的数据，到 2020 年，全球数字宇宙将增长到
    35 ZB（即 35 万亿 TB）。其他人认为，全球数据现在每 5 年增长多达 10 倍，这令人震惊。在最近的一项研究中，麦肯锡咨询公司还发现，在美国 17
    个经济部门中的 15 个部门中，拥有超过 1000 名员工的公司平均存储超过 235 TB 的数据——这比美国国会图书馆存储的数据还要多！这种数据爆炸是由社交媒体、手机、智能传感器等新数据源的兴起以及计算机行业的巨大进步所驱动的。


    收集的大量数据也使您能够构建更准确的预测模型。我们从统计学中知道，置信区间（也称为误差范围）与样本量成反比。因此，样本量越大，误差范围越小。这反过来又提高了模型预测的准确性。


    **更快、更便宜的处理能力**


    我们现在拥有的计算能力比以往任何时候都强大得多。摩尔定律提出，计算机芯片的性能将呈指数级增长，每 18 个月翻一番。这一趋势在现代计算的大部分历史中都是正确的。2010
    年，国际半导体技术路线图更新了这一预测，预测增长将在 2013 年放缓，届时计算机密度和数量将每 3 年翻一番，而不是 18 个月。尽管如此，处理器性能的指数级增长已经带来了技术和经济生产力的巨大提升。如今，智能手机的处理能力比
    20 年前的台式电脑强大五倍。例如，诺基亚 Lumia 928 配备的双核 1.5 GHz 高通骁龙™ S4 处理器，其速度至少是 1993 年发布的、在个人电脑中非常流行的英特尔奔腾
    P5 CPU 的五倍。在九十年代，需要像 DEC VAX 大型机或 DEC Alpha 工作站这样昂贵的工作站才能运行先进的、计算密集型算法。值得注意的是，今天的智能手机也比
    1994 年速度在 200-300 MHz 的强大 DEC Alpha 处理器快五倍！如今，您可以在配备多核处理器的经济型个人工作站上运行相同的算法。此外，我们可以利用
    Hadoop 的 MapReduce 架构，以比以往低得多的成本在商品服务器集群上部署强大的数据挖掘算法。借助数据科学，我们现在拥有了通过智能部署数据挖掘和机器学习算法来发现数据中隐藏模式的工具。


    我们还看到了容量的巨大提升以及计算机内存价格的指数级下降。这在图 1-4 和 1-5 中得到了说明，这些图表显示了自 1960 年以来计算机内存价格的指数级下降和容量的增长。自
    1990 年以来，每 MB 内存的平均价格已从 59 美元降至微不足道的 0.49 美分——价格降低了 99.2%！与此同时，内存模块的容量已从 8MB 增加到惊人的
    8GB！因此，一台普通的笔记本电脑现在比九十年代初的高端工作站还要强大。


    ![9781484204467_Fig01-04.jpg](img/00011.jpeg)


    图 1-4. 自 1960 年以来的平均计算机内存价格


    ![9781484204467_Fig01-05.jpg](img/00012.jpeg)


    图 1-5. 自 1960 年以来的平均计算机内存大小


    ![Image](img/00013.jpeg) **注意** 有关内存价格历史的更多信息，请访问 John C. McCallum 的网站：[`www.jcmit.com/mem2012.htm`](http://www.jcmit.com/mem2012.htm)。


    **数据科学流程**


    一个典型的数据科学项目遵循 图 1-6 中概述的五步流程。让我们详细回顾每个步骤。

    '
- fmt: '1. **Define the business problem**: This is critical as it guides the rest
    of the project. Before building any models, it is important to work with the project
    sponsor to identify the specific business problem he or she is trying to solve.
    Without this, one could spend weeks or months building sophisticated models that
    solve the wrong problem, leading to wasted effort. A good data science project
    gleans good insights that drive smarter business decisions. Hence the analysis
    should serve a business goal. It should not be a hammer in search of a nail! There
    are formal consulting techniques and frameworks (such as guided discovery workshops
    and six sigma methodology) used by practitioners to help business stakeholders
    prioritize and scope their business goals.

    2. **Acquire and prepare data**: This step entails two activities. The first is
    the acquisition of raw data from several source systems including databases, CRM
    systems, web log files, etc. This may involve ETL (extract, transform, and load)
    processes, database administrators, and BI personnel. However, the data scientist
    is intimately involved to ensure the right data is extracted in the right format.
    Working with the raw data also provides vital context that is required downstream.
    Second, once the right data is pulled, it is analyzed and prepared for modelling.
    This involves addressing missing data, outliers in the data, and data transformations.
    Typically, if a variable has over 40% of missing values, it can be rejected, unless
    the fact that it is missing (or not) conveys critical information. For example,
    there might be a strong bias in the demographics of who fills in the optional
    field of “age” in a survey. For the rest, we need to decide how to deal with missing
    values; should we impute with the average value, median or something else? There
    are several statistical techniques for detecting outliers. With a box and whisker
    plot, an outlier is a sample (value) greater or smaller than 1.5 times the interquartile
    range (IQR). The interquartile range is the 75th percentile-25th percentile. We
    need to decide whether to drop an outlier or not. If it makes sense to keep it,
    we need to find a useful transformation for the variable. For instance, log transformation
    is generally useful for transforming incomes.


    Correlation analysis, principal component analysis, or factor analysis are useful
    techniques that show the relationships between the variables. Finally, feature
    selection is done at this stage to identify the right variables to use in the
    model in the next step.


    This step can be laborious and time-consuming. In fact, in a typical data science
    project, we spend up to 75 to 80% of time in data acquisition and preparation.
    That said, it is the vital step that coverts raw data into high quality gems for
    modelling. The old adage is still true: *garbage in, garbage out*. Investing wisely
    in data preparation improves the success of your project.


    3. **Develop the model**: This is the most fun part of the project where we develop
    the predictive models. In this step, we determine the right algorithm to use for
    modeling given the business problem and data. For instance, if it is a binary
    classification problem we can use logistic regression, decision trees, boosted
    decision trees, or neural networks. If the final model has to be explainable,
    this rules out algorithms like boosted decision trees. Model building is an iterative
    process: we experiment with different models to find the most predictive one.
    We also validate it with the customer a few times to ensure it meets their needs
    before exiting this stage.

    4. **Deploy the model**: Once built, the final model has to be deployed in production
    where it will be used to score transactions or by customers to drive real business
    decisions. Models are deployed in many different ways depending on the customer’s
    environment. In most cases, deploying a model involves reimplementing the data
    transformations and predictive algorithm developed by the data scientist in order
    to integrate with an existing decision management platform. Suffice to say is
    a cumbersome process today. Azure Machine Learning dramatically simplifies model
    deployment by enabling data scientists to deploy their finished models as web
    services that can be invoked from any application on any platform, including mobile
    devices.

    5. **Monitor model’s performance**: Data science does not end with deployment.
    It is worth noting that every statistical or machine learning model is only an
    approximation of the real world, and hence is imperfect from the very beginning.
    When a validated model is tested and deployed in production, it has to be monitored
    to ensure it is performing as planned. This is critical because any data-driven
    model has a fixed shelf life. The accuracy of the model degrades with time because
    fundamentally the data in production will vary over time for a number of reasons,
    such as the business may launch new products to target a different demographic.
    For instance, the wireless carrier we discussed earlier may choose to launch a
    new phone plan for teenage kids. If they continue to use the same churn and propensity
    models, they may see a degradation in their models’ performance after the launch
    of this new product. This is because the original dataset used to build the churn
    and propensity models did not contain significant numbers of teenage customers.
    With close monitoring of the model in production we can detect when its performance
    starts to degrade. When its accuracy degrades significantly, it is time to rebuild
    the model by either re-training it with the latest dataset including production
    data, or completely rebuilding it with additional datasets. In that case, we return
    to Step 1 where we revisit the business goals and start all over.


    How often should we rebuild a model? The frequency varies by business domain.
    In a stable business environment where the data does not vary too quickly, models
    can be rebuilt once every year or two. A good example is retail banking products
    such as mortgages and car loans. However, in a very dynamic environment where
    the ambient data changes rapidly, models can be rebuilt daily or weekly. A good
    case in point is the wireless phone industry, which is fiercely competitive. Churn
    models need to be retrained every few days since customers are being lured by
    ever more attractive offers from the competition.


