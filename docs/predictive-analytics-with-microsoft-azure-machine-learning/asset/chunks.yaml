    **评估模型**模块用于衡量已训练模型的性能。该模块接收两个数据集作为输入：第一个是来自已测试模型的评分数据集，第二个是用于比较的可选数据集。运行实验后，您可以通过点击**评估模型**模块底部的**小圆圈**来检查模型的性能。该模块提供以下指标来衡量分类模型（如倾向模型）的性能：


    *   **受试者工作特征**（ROC）曲线，绘制了真正例率与假正例率的关系。

    *   **提升曲线**（也称为增益曲线），绘制了真正例数量与正例率的关系。这在市场营销中很常见。

    *   **精确率与召回率**图表。

    *   **混淆矩阵**，展示了第一类和第二类错误。


    图 5-15 展示了您之前构建的倾向模型的 ROC 曲线。ROC 曲线直观地展示了预测性二分类模型的性能。图表中从(0,0)到(1,1)的对角线代表了随机猜测的性能；因此，如果您随机选择目标客户，您的响应将落在这条对角线上。一个好的预测模型应该远优于随机猜测。因此，在
    ROC 曲线上，一个好的模型应位于对角线上方。理想模型（100%准确）将有一条从(0,0)到(0,1)的垂直线，接着是一条从(0,1)到(1,1)的水平线。


    ![9781484204467_Fig05-15.jpg](img/00086.jpeg)


    图 5-15. 客户倾向模型的 ROC 曲线


    衡量 ROC 曲线性能的一种方法是测量曲线下面积（AUC）。曲线下面积越大，模型性能越好。理想模型的 AUC 为 1.0，而随机猜测的 AUC 为 0.5。您构建的逻辑回归模型的
    AUC 为 0.689，这远优于随机猜测！


    图 5-16 展示了您之前构建的逻辑回归模型的混淆矩阵。混淆矩阵包含四个单元格，即：


    *   **真正例**：这些是客户实际购买了自行车且模型正确预测的情况。

    *   **真负例**：在历史数据集中，这些客户没有购买自行车，且模型正确预测他们不会购买。

    *   **假正例**：在这种情况下，模型错误地预测客户会购买自行车，而实际上他们并未购买。这通常被称为第一类错误。您构建的逻辑回归模型仅有 2 个假正例。

    *   **假负例**：在这种情况下，模型错误地预测客户不会购买自行车，而实际上客户购买了。这也被称为第二类错误。该逻辑回归模型有多达 276 个假负例。


    ![9781484204467_Fig05-16.jpg](img/00087.jpeg)


    图 5-16. 混淆矩阵及更多性能指标


    此外，图 5-16 还展示了模型的准确率、精确率和召回率。以下是这些指标的计算公式。


    精确率是结果中真正例的比例。


    ![image](img/00088.jpeg)


    召回率是模型识别出的购买者百分比，其计算公式为：


    ![image](img/00089.jpeg)


    最后，准确率衡量模型正确识别购买者和非购买者的能力，公式如下：


    ![image](img/00090.jpeg)


    其中 tp = 真正例，tn = 真负例，fp = 假正例，fn = 假负例。


    您还可以在单个 ROC 图表上比较两个模型的性能。例如，让我们修改图 5-14 中的实验，使用**两类提升决策树**模块作为第二个训练器，而不是**两类逻辑回归**模块。现在您的实验有两个不同的分类器：左侧分支的两类逻辑回归和右侧分支的两类提升决策树。您将两个模型的评分数据集连接到同一个**评估模型**模块。更新后的实验如图
    5-17 所示，结果如图 5-18 所示。在此图表中，标记为“用于比较的评分数据集”的曲线是**两类提升决策树**模型的 ROC 曲线，而标记为“评分数据集”的曲线是**两类逻辑回归**模型的
    ROC 曲线。您可以清楚地看到，提升决策树模型优于逻辑回归模型，因为它在随机猜测的对角线上方具有更高的提升度。提升决策树模型的曲线下面积（AUC）为 0.722，优于您之前看到的逻辑回归模型的
    0.689。


    ![9781484204467_Fig05-17.jpg](img/00091.jpeg)


    图 5-17. 使用同一个评估模型模块比较两个模型的更新后实验


    ![9781484204467_Fig05-18.jpg](img/00092.jpeg)


    图 5-18. 比较两个预测模型（提升决策树与逻辑回归）性能的 ROC 曲线


