    模块将数据分成两个样本，一个用于训练，另一个用于测试。在此实验中，您保留了 70% 的数据用于训练，剩余的 30% 用于测试。这是避免过拟合的常用策略之一。如果没有测试样本，模型很容易记住数据和噪声。在这种情况下，模型在训练数据上会表现出非常高的准确率，但在生产环境中使用未见过的数据进行测试时，性能会很差。避免过拟合的另一个好策略是交叉验证；这将在本章后面讨论。


