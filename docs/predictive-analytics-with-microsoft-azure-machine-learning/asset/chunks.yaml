    请考虑以下示例。假设一家电信公司拥有以下由 *n* 个客户组成的训练数据。在这 n 个客户中，我们假设有 50 个客户会流失，另外 50 个客户不会流失。对于每个客户，你提取
    10 个输入变量（或特征）来表示该客户。给定一个已经使用服务一段时间的客户，该电信公司的数据科学家和业务分析师希望确定该客户是否会流失并转向其他电信服务提供商。


    假设训练数据包含以下内容：(*x*[1],*y*[1]), ... ,(*x*[*n*],*y*[*n*])，其中 (*x*[*i*],*y*[*j*])
    表示将 *x*[*i*] 映射到类别 *y*[*j*]。超平面决策函数为


    ![image](img/00065.jpeg)


    其中 *w* 和 *w*[0] 是系数。一个分离超平面将满足以下约束条件：


    ![image](img/00066.jpeg)


    ![image](img/00067.jpeg)


    最优分离超平面是能够在两个类别之间实现最大间隔的超平面。描述超平面的这两个约束条件可以用以下方程表示：


    ![image](img/00068.jpeg)


    该方程可用于表示所有可用于分离数据的超平面。通常，由于直接计算 ||*w*|| 范数的值存在困难，因此不会直接以其当前形式（也称为原始形式）求解该方程。在实践中，使用该方程的对偶形式来求解优化问题，从而确定最优超平面。


    ![Image](img/00013.jpeg) **注意**  你可以从以下书籍中了解更多关于支持向量机以及如何最大化间隔的信息：


    Vladimir, C. and Filip, M., *Learning From Data (Concepts, Theory and Methods)*.

    pp. 353 – 384 (Wiley-Interscience, 1998).


    关于支持向量机的优秀概述可以在 [`en.wikipedia.org/wiki/Support_vector_machine`](http://en.wikipedia.org/wiki/Support_vector_machine)
    找到。


    Azure 机器学习提供了一个**两类支持向量机**模块，使您能够构建支持二元预测的模型。该模块的输入可以是连续变量和/或分类变量。该模块提供了多个参数，可用于微调支持向量机算法的行为。这些参数包括：


    *   *迭代次数*：决定模型训练的速度。此参数使您能够在训练速度和模型准确性之间取得平衡。默认值设置为 1。

    *   *Lambda*：用于调整所生成模型复杂度的 L1 正则化权重。Lambda 的默认值设置为 0.001。使用非零值是为了避免模型过拟合。

    *   *标准化特征*：决定算法是否对值进行标准化。

    *   *投影到单位球面*：决定算法是否将值投影到单位球面。

    *   *随机数种子*：计算模型时用于随机数生成的种子值。

    *   *允许未知分类级别*：决定算法是否支持未知的分类值。如果设置为 True，算法会为每个分类列创建一个额外的级别。该额外级别用于映射测试数据集中未在训练数据集中找到的级别。


    贝叶斯点机


    贝叶斯点机（BPM）是一种线性分类算法，由 Ralf Herbrich、Thore Grapel 和 Colin Campbell 于 2001 年提出。贝叶斯点机算法的核心思想是识别一个“平均”分类器，该分类器能够有效且高效地逼近多个线性分类器（基于其泛化能力）的理论最优贝叶斯平均。这个“平均”分类器被称为贝叶斯点。在实证研究中，贝叶斯点机在实验室数据和真实世界数据上的表现始终优于支持向量机。


    ![Image](img/00013.jpeg) **注意**  Azure 机器学习中使用的贝叶斯点机算法基于 Infer.Net，并对原始贝叶斯点机算法进行了改进。这些改进使得
    Azure 机器学习中使用的贝叶斯点机更加稳健，并且不易过拟合数据。它还减少了执行性能调优的需求。


