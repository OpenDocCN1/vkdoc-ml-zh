  trans: '

    构建集成模型的第一步是为分类器模型选择数据。在采样数据时，一个关键目标是最大化模型的多样性，因为这能提升解决方案的准确性。通常，模型越多样化，最终分类器的性能就越好，其预测结果的方差也越小。


    该过程的第二步是训练多个独立的分类器。但如何分配这些分类器呢？在众多可用策略中，最流行的两种是装袋（bagging）和提升（boosting）。装袋算法使用不同的随机数据子集来训练每个模型。这些模型可以在其随机训练数据子集上并行训练。相比之下，提升算法通过顺序训练模型、在训练数据上测试每个模型的性能来提升整体表现。训练集中被错误分类的样本会在后续训练中获得更高的权重。因此，在训练过程中，每个新增的模型都会更关注那些被错误分类的数据。提升决策树算法就采用了这种提升策略。在这种情况下，每一棵新的决策树在训练时都会重点处理被错误分类的案例，以降低错误率。这就是提升决策树如何从弱决策树中产生卓越结果的原因。


    关注提升决策树的两个关键参数非常重要：每棵决策树的叶子数量以及提升迭代次数。每棵树中的叶子数量决定了模型中变量之间允许的交互程度。如果该值设为 2，则不允许任何交互。如果设为
    3，则模型最多可以包含两个变量的交互效应。你需要尝试不同的值，以找到最适合你数据集的那个。据报道，对于大多数应用，每棵树 4-8 个叶子能产生良好效果。相比之下，每棵树只有两个叶子会导致结果不佳。第二个需要调整的重要参数是提升迭代次数（即模型中树的数量）。非常多的树可以减少误差，但容易导致过拟合。为了避免过拟合，你需要找到一个最优的树的数量，使验证数据集上的误差最小化。


    最后，一旦你训练好了所有分类器，最后一步就是结合它们的结果来做出最终预测。有多种方法可以结合这些结果，从简单的多数投票到加权多数投票。


    ![Image](img/00013.jpeg) **注意** 你可以从 C. Zhang 和 Y. Ma 合著的《集成机器学习：方法与运用》（纽约，纽约州：Springer
    出版社，2012 年，第 1-34 页）以及 [`en.wikipedia.org/wiki/Gradient_boosting#Gradient_tree_boosting`](http://en.wikipedia.org/wiki/Gradient_boosting#Gradient_tree_boosting)
    了解更多关于提升决策树的信息。


    分类算法


    分类是监督式机器学习的一种类型。在监督式学习中，目标是利用带标签的训练数据推断出一个函数。然后，该函数可用于确定新数据集（其中标签未知）的标签。可用于构建模型的分类算法（非详尽列表）包括决策树、逻辑回归、神经网络、支持向量机、朴素贝叶斯和贝叶斯点机。


    分类算法用于预测输入数据（其中标签未知）的标签。标签也被称为类别、分组或目标变量。例如，一家电信公司想要预测以下内容：


    *   *流失*：有倾向转向其他电信提供商的客户

    *   *购买倾向*：愿意购买新产品或服务的客户

    *   *向上销售*：愿意购买升级服务或附加服务的客户


    为了实现这一点，电信公司使用训练数据（其中标签已知或已预先定义）构建一个分类模型。在本节中，你将了解几种可用于构建模型的常见分类算法。一旦模型构建完成并通过测试数据验证，电信公司的数据科学家就可以使用该模型来预测客户的流失、购买倾向和向上销售标签（其中标签未知）。因此，电信公司可以利用这些预测来设计营销策略，以减少客户流失，并向更愿意购买新服务或进行向上销售的客户提供服务。


    分类算法常用的其他场景包括金融机构，在这些机构中，模型用于判断信用卡交易是否为欺诈案例，或者根据客户的财务状况决定是否批准贷款申请。酒店和航空公司使用模型来判断是否应将客户升级到更高级别的服务（例如，从经济舱升级到商务舱，从普通房间升级到套房等）。


    分类问题定义如下：给定一个输入样本 *X* = (*x*[1], *x*[2], ... *x*[*d*])，其中 *x*[*i*] 指的是大小为 d 的样本中的一个项目。分类的目标是学习映射
    *X* → *Y*，其中 *y* Î *Y* 是一个类别。


    一个数据实例属于 J 个组（或类别）之一，例如 *C*[1], *C*[2], ..., *C*[*j*]。例如，在电信场景的二分类问题中，类别 *C*[1]
    指的是将会流失并转向新电信提供商的客户，而类别 *C*[2] 指的是不会流失的客户。


    为了实现这一点，首先使用带标签的训练数据，通过一种分类算法来训练模型。然后，通过使用测试数据来验证模型，以确定训练好的模型（即分类器）所犯的错误数量。使用各种指标来衡量分类器的性能。这些指标包括测量训练模型的准确率、精确率、召回率和曲线下面积（AUC）。


    在前面的章节中，你了解了决策树、提升决策树和神经网络的工作原理。这些算法对于回归和分类都很有用。在本节中，你将学习支持向量机和贝叶斯点机的工作原理。


    支持向量机


    支持向量机（SVM）由 Bernhard E. Boser、Isabelle Guyon 和 Vladimir N. Vapnik 于 1992 年在学习理论会议（COLOT）上提出。SVM
    基于植根于统计学习理论的技术，被认为是一种基于核的学习算法。


    SVM 的核心思想是找到能将训练数据分成两个类别的分离超平面，并且该超平面具有尽可能宽的间隔（或边距）。当只有两个输入变量时，一条直线即可将数据分成两个类别。在高维空间（即超过两个输入变量）中，一个超平面将训练数据分成两个类别。图
    4-5 展示了超平面如何分隔两个类别以及间隔。圈出的项目是支持向量，因为它们定义了提供最大间隔的最优超平面。


    ![9781484204467_Fig04-05.jpg](img/00064.jpeg)


    图 4-5. 支持向量机、分离超平面与间隔

