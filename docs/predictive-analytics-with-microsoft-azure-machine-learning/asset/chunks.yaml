  trans: "\n这对半导体制造商来说是一个非常重要的业务问题，因为其工艺可能非常复杂，涉及从原始沙粒到最终集成电路的多个阶段。鉴于这种复杂性，有多个因素可能导致制造流程下游的良率失败。识别出最重要的因素将有助于工艺工程师提高良率，降低错误率和生产成本，从而提高生产力。\n\
    \n![Image](img/00013.jpeg) **注意** 您需要拥有一个 Azure Machine Learning 账户。如果您还没有账户，请参考第\
    \ 2 章中的说明来设置您的新账户。\n\n在第 1 章中，您了解到数据科学流程通常遵循以下五个步骤。\n\n1.  定义业务问题\n2.  数据获取与准备\n\
    3.  模型开发\n4.  模型部署\n5.  监控模型性能\n\n在定义了业务问题之后，您将在本章的剩余部分探索数据获取与准备、模型开发、评估和部署。\n\
    \n数据获取与准备\n\n让我们探讨如何从源系统加载数据并在 Azure Machine Learning 中分析数据。\n\n数据集\n\n在本练习中，您将使用来自加州大学尔湾分校机器学习数据库的\
    \ SECOM 数据集。这个来自半导体制造业的数据集由 Michael McCann 和 Adrian Johnston 提供。\n\n![Image](img/00013.jpeg)\
    \ **注意** SECOM 数据集可在加州大学尔湾分校的机器学习库中找到。该数据集包含 1,567 个样本，每个样本有 591 个特征。在这 1,567\
    \ 个样本中，有 104 个代表良率失败。\n\n这些特征或列代表了制造过程中 590 个点的传感器读数。此外，它还包括每个样本的时间戳和良率结果（即简单的通过或失败）。\n\
    \n请参考 [`archive.ics.uci.edu/ml/machine-learning-databases/secom/`](http://archive.ics.uci.edu/ml/machine-learning-databases/secom/)。\n\
    \n数据加载\n\nAzure Machine Learning 使您能够从多个来源加载数据，包括您的本地机器、Web、Azure 上的 SQL 数据库、Hive\
    \ 表或 Azure Blob 存储。\n\n从本地文件系统加载数据\n\n加载数据最简单的方法是从您的本地机器进行。您可以通过以下步骤完成此操作。\n\n\
    1.  将浏览器指向 [`studio.azureml.net`](https://studio.azureml.net) 并登录到您在 Azure Machine\
    \ Learning 中的工作区。\n2.  接下来，单击左侧窗格菜单中的 **Experiments** 项。\n3.  单击窗口左下角的 **+New**\
    \ 按钮，然后从 图 8-1 所示的新菜单中选择 **Dataset**。\n\n![9781484204467_Fig08-01.jpg](img/00129.jpeg)\n\
    \n图 8-1. 从本地机器加载新数据集\n\n4.  当您选择 **From Local File** 选项时，系统将提示您选择要从机器加载的数据文件。\n\
    \n从其他来源加载数据\n\n您可以使用 Azure Machine Learning 中的 **Reader** 模块从非本地来源加载数据。具体来说，使用\
    \ **Reader** 模块，您可以从 Web、Azure 上的 SQL 数据库、Azure 表、Azure Blob 存储或 Hive 表加载数据。为此，您需要在调用\
    \ **Reader** 模块之前创建一个新的实验。使用以下步骤通过 **Reader** 模块从上述任何来源加载数据。\n\n1.  将浏览器指向 [`studio.azureml.net`](https://studio.azureml.net)\
    \ 并登录到您在 Azure Machine Learning 中的工作区。\n2.  接下来，单击左侧窗格菜单中的 **Experiments** 项。\n\
    3.  单击窗口左下角的 **+New** 按钮，然后从新菜单中选择 **Experiment**。一个新的实验将启动，并带有一个空白画布，如 图 8-2\
    \ 所示。\n\n![9781484204467_Fig08-02.jpg](img/00130.jpeg)\n\n图 8-2. 在 Azure Machine\
    \ Learning 中启动新实验\n\n4.  打开 **Data Input and Output** 菜单项，您将看到两个模块：**Reader**\
    \ 和 **Writer**。\n5.  将 **Reader** 模块从菜单拖到画布上的任意位置。\n6.  单击画布中的 **Reader** 模块，其属性将显示在右侧窗格的\
    \ **Reader** 下。现在，在下拉菜单中指定数据源，然后输入所有必需参数的值。Account Name 和 Account Key 指的是 Microsoft\
    \ Azure 上的存储帐户。您可以通过以下方式从 Azure 门户获取这些参数：\n    1.  在 [`azure.microsoft.com`](http://azure.microsoft.com)\
    \ 登录 Microsoft Azure。\n    2.  在顶部菜单中，单击 **Portal**。这将带您进入 Azure 门户。\n    3. \
    \ 从左侧窗格的菜单中选择 **storage**。这将在右侧窗格中列出您所有的存储帐户。\n    4.  单击包含您的机器学习模型所需数据的存储帐户。\n\
    \    5.  在屏幕底部，单击标有 **Manage Access Keys** 的密钥图标。将显示您的存储帐户名称和访问密钥。使用 **Primary\
    \ Access Key** 作为 Azure Machine Learning 中 **Reader** 模块的 Account Key。\n\n![Image](img/00013.jpeg)\
    \ **注意** 您可以使用上述说明将多个来源的多个数据集加载到 Azure Machine Learning 中。但请注意，每个 **Reader** 模块一次只能加载一个数据集。\n\
    \n对于本项目，请从 UCI 机器学习数据库导入两个 SECOM 数据集，并将它们合并到一个本地存储的新文件中。第一个数据集仅包含传感器读数，而第二个数据集包含标签（即良率数据）。然后使用上述第一种方法将合并后的数据集加载到\
    \ Azure Machine Learning 中。\n\n数据分析\n\n图 8-3 显示了涵盖数据准备的实验的第一部分。数据被加载，并使用 **Missing\
    \ Values Scrubber** 模块对缺失值进行预处理。之后，获取汇总统计信息，并使用 **Filter Based Feature Selection**\
    \ 模块来确定用于预测的最重要变量。\n\n![9781484204467_Fig08-03.jpg](img/00131.jpeg)\n\n图 8-3.\
    \ 预处理 SECOM 数据集\n\n图 8-4 显示了在 Azure Machine Learning 中看到的 SECOM 数据快照。如您所见，数据集中有\
    \ 1,567 行和 592 列。此外，Azure Machine Learning 还显示了每个特征的唯一值数量和缺失值数量。您可以看到许多传感器都有缺失值。此外，一些传感器对所有行都有恒定的读数。例如，传感器\
    \ #6 对所有行的读数都是 100。此类特征必须被剔除，因为它们对预测没有增加任何价值，因为它们的读数没有变化。\n\n![9781484204467_Fig08-04.jpg](img/00132.jpeg)\n\
    \n图 8-4. 在 Azure Machine Learning 中可视化 SECOM 数据集\n\n特征选择\n"
- fmt: '# Feature Selection in Azure Machine Learning


    Feature selection is critical in this case since it provides the answer to your
    second business problem. Indeed, with over 590 features, you must perform feature
    selection to identify the subset of features that are useful to build a good model
    and eliminate irrelevant and redundant features. With so many features, you risk
    the curse of dimensionality. If there are a large number of features, the learning
    problem can be difficult because the many “extra” features can confuse the learning
    algorithm and cause it to have high variance. It’s also important to note that
    machine learning algorithms are very computationally intensive, and reducing the
    number of features can greatly reduce the time required and train the model, enabling
    the data scientist to perform experiments in less time. Through careful feature
    selection, you can find the most influential variables for the prediction. Let’s
    see how to do feature selection in Azure Machine Learning.


    To perform feature selection in Azure Machine Learning, drag the module named
    `Filter Based Feature Selection` from the list of modules in the left pane. You
    can find this module by either searching for it in the search box or by opening
    the `Feature Selection` category. To use this module, you need to connect it to
    a dataset as the input. [Figure 8-5](#part0018.html#Fig5) shows how to use it
    to perform feature selection on the SECOM dataset. Before running the experiment,
    use the `Launch column selector` in the right pane to define the target variable
    for prediction. In this case, choose the column `Yield_Pass_Fail` as the target
    since this is what you wish to predict. When you are done, set the number of desired
    features to 100. This instructs the feature selector in Azure Machine Learning
    to find the top 100 variables.


    ![9781484204467_Fig08-05.jpg](images/00133.jpeg)


    [Figure 8-5](#part0018.html#_Fig5). Feature selection in Azure Machine Learning


    You also need to choose the scoring method that will be used for feature selection.
    Azure Machine Learning offers the following options for scoring:


    *   Pearson correlation

    *   Mutual information

    *   Kendall correlation

    *   Spearman correlation

    *   Chi Squared

    *   Fischer score

    *   Count-based


    The correlation methods find the set of variables that are highly correlated with
    the output, but have low correlation among themselves. The correlation is calculated
    using Pearson, Kendall, or Spearman correlation coefficients, depending on the
    option you choose.


    The Fisher score uses the Fisher criterion from statistics to rank variables.
    In contrast, the mutual information option is an information theoretic approach
    that uses mutual information to rank variables. The mutual information measures
    the dependence between the probability density of each variable and that of the
    outcome variable.


    Finally, the Chi Squared option selects the best features using a test for independence;
    in other words, it tests whether each variable is independent of the outcome variable.
    It then ranks the variables using the Chi Squared test.


    ![Image](images/00013.jpeg) **Note** See [http://en.wikipedia.org/wiki/Feature_selection#Correlation_feature_selection](http://en.wikipedia.org/wiki/Feature_selection#Correlation_feature_selection)
    or [http://jmlr.org/papers/volume3/guyon03a/guyon03a.pdf](http://jmlr.org/papers/volume3/guyon03a/guyon03a.pdf)
    for more information on feature selection strategies.


    When you run the experiment, the `Filter Based Feature Selection` module produces
    two outputs: first, the filtered dataset lists the actual data for the most important
    variables. Second, the module shows a list of the variables by importance with
    the scores for each selected variable. [Figure 8-6](#part0018.html#Fig6) shows
    the results of the features. In this case, you set the number of features to 100
    and you use mutual information for scoring and ranking the variables. [Figure
    8-6](#part0018.html#Fig6) shows 101 columns since the results set includes the
    target variable (i.e. `Yield_Pass_Fail`) plus the top 100 variables including
    sensor #60, sensor #248, sensor #520, sensor #104, etc. The last row of the results
    shows the score for each selected variable. Since the variables are ranked, the
    scores decrease from left to right.


    ![9781484204467_Fig08-06.jpg](images/00134.jpeg)


    [Figure 8-6](#part0018.html#_Fig6). The results of feature selection for the SECOM
    dataset showing the top variables


    Note that the selected variables will vary based on the scoring method, so it
    is worth experimenting with different scoring methods before choosing the final
    set of variables. The Chi Squared and mutual information scoring methods produce
    a similar ranking of variables for the SECOM dataset.


    ## Training the Model


    Having completed the data preprocessing, the next step is to train the model to
    predict the yield. Since the response variable is binary, you can treat this as
    a binary classification problem. You can use any of the two-class classification
    algorithms in Azure Machine Learning such as two-class logistic regression, two-class
    boosted decision trees, two-class decision forest, two-class neural networks,
    etc.


    ![Image](images/00013.jpeg) **Note** All predictive maintenance problems are not
    created equal. Some problems will require different techniques besides classification.
    For instance, if the goal is to determine ***when*** a part will fail, you will
    need to use survival analysis. Alternatively, if the goal is to predict energy
    consumption, you may use a forecasting technique or a regression method that predicts
    continuous outcomes. Hence you need to understand the business problem in order
    to find the most appropriate technique to use. One size does not fit all!


    [Figure 8-7](#part0018.html#Fig7) shows the full experiment to predict the yield
    from SECOM data. The top half of the experiment, up to the `Split` module, implements
    the data preprocessing phase. The `Split` module splits the data into two samples,
    a training sample comprising 70% of the initial dataset, and a test sample with
    the remaining 30%.


    ![9781484204467_Fig08-07.jpg](images/00135.jpeg)


    [Figure 8-7](#part0018.html#_Fig7). An experiment for predicting the yield from
    SECOM data


    In this experiment, you compare two classification algorithms to find the best
    predictor of yield. The left branch after the `Split` module uses the two-class
    boosted decision tree, while the right branch uses the two-class logistic regression
    algorithm that is widely used in statistics. Each of these algorithms are trained
    with the same training sample and tested with the same test sample. You use the
    module named `Train Model` to train each algorithm, and the `Score Model` for
    testing. The module named `Evaluate Model` is used to evaluate the accuracy of
    these two classification models.


    ## Model Testing and Validation'
  raw: 'Feature selection is critical in this case since it provides the answer to
    your second business problem. Indeed, with over 590 features, you must perform
    feature selection to identify the subset of features that are useful to build
    a good model and eliminate irrelevant and redundant features. With so many features,
    you risk the curse of dimensionality. If there are a large number of features,
    the learning problem can be difficult because the many “extra” features can confuse
    the learning algorithm and cause it to have high variance. It’s also important
    to note that machine learning algorithms are very computationally intensive, and
    reducing the number of features can greatly reduce the time required and train
    the model, enabling the data scientist to perform experiments in less time. Through
    careful feature selection, you can find the most influential variables for the
    prediction. Let’s see how to do feature selection in Azure Machine Learning.


    To perform feature selection in Azure Machine Learning, drag the module named
    **Filter Based Feature Selection** from the list of modules in the left pane.
    You can find this module by either searching for it in the search box or by opening
    the **Feature Selection** category. To use this module, you need to connect it
    to a dataset as the input. [Figure 8-5](#part0018.html#Fig5) shows how to use
    it to perform feature selection on the SECOM dataset. Before running the experiment,
    use the **Launch column selector** in the right pane to define the target variable
    for prediction. In this case, choose the column **Yield_Pass_Fail** as the target
    since this is what you wish to predict. When you are done, set the number of desired
    features to 100\. This instructs the feature selector in Azure Machine Learning
    to find the top 100 variables.


    ![9781484204467_Fig08-05.jpg](images/00133.jpeg)


    [Figure 8-5](#part0018.html#_Fig5). Feature selection in Azure Machine Learning


    You also need to choose the scoring method that will be used for feature selection.
    Azure Machine Learning offers the following options for scoring:


    *   Pearson correlation

    *   Mutual information

    *   Kendall correlation

    *   Spearman correlation

    *   Chi Squared

    *   Fischer score

    *   Count-based


    The correlation methods find the set of variables that are highly correlated with
    the output, but have low correlation among themselves. The correlation is calculated
    using Pearson, Kendall, or Spearman correlation coefficients, depending on the
    option you choose.


    The Fisher score uses the Fisher criterion from statistics to rank variables.
    In contrast, the mutual information option is an information theoretic approach
    that uses mutual information to rank variables. The mutual information measures
    the dependence between the probability density of each variable and that of the
    outcome variable.


    Finally, the Chi Squared option selects the best features using a test for independence;
    in other words, it tests whether each variable is independent of the outcome variable.
    It then ranks the variables using the Chi Squared test.


    ![Image](images/00013.jpeg) **Note**  See [http://en.wikipedia.org/wiki/Feature_selection#Correlation_feature_selection](http://en.wikipedia.org/wiki/Feature_selection#Correlation_feature_selection)  or
