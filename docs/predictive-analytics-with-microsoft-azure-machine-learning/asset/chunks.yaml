- fmt: '# Data Science Overview


    Data science is the practice of obtaining useful insights from data. Although
    it also applies to small data, data science is particularly important for big
    data, as we now collect petabytes of structured and unstructured data from many
    sources inside and outside an organization. As a result, we are now data rich
    but information poor. Data science provides powerful processes and techniques
    for gleaning actionable information from this sea of data. Data science draws
    from several disciplines including statistics, mathematics, operations research,
    signal processing, linguistics, database and storage, programming, machine learning,
    and scientific computing. [Figure 1-1](#part0009.html#Fig1) illustrates the most
    common disciplines of data science. Although the term *data science* is new in
    business, it has been around since 1960 when it was first used by Peter Naur to
    refer to data processing methods in Computer Science. Since the late 1990s notable
    statisticians such as C.F. Jeff Wu and William S. Cleveland have also used the
    term data science, a discipline they view as the same as or an extension of statistics.


    ![9781484204467_Fig01-01.jpg](images/00008.jpeg)


    [Figure 1-1](#part0009.html#_Fig1). Highlighting the main academic disciplines
    that constitute data science


    Practitioners of data science are data scientists, whose skills span statistics,
    mathematics, operations research, signal processing, linguistics, database and
    storage, programming, machine learning, and scientific computing. In addition,
    to be effective, data scientists need good communication and data visualization
    skills. Domain knowledge is also important to deliver meaningful results. This
    breadth of skills is very hard to find in one person, which is why data science
    is a team sport, not an individual effort. To be effective, one needs to hire
    a team with complementary data science skills.


    ## Analytics Spectrum


    According to Gartner, all the analytics we do can be classified into one of four
    categories: descriptive, diagnostic, predictive, and prescriptive analysis. Descriptive
    analysis typically helps to describe a situation and can help to answer questions
    like *What happened?, Who are my customers?*, etc. Diagnostic analysis help you
    understand why things happened and can answer questions like *Why did it happen?*
    Predictive analysis is forward-looking and can answer questions such as *What
    will happen in the future?* As the name suggests, prescriptive analysis is much
    more prescriptive and helps answer questions like *What should we do?, What is
    the best route to my destination?*, or *How should I allocate my investments?*


    [Figure 1-2](#part0009.html#Fig2) illustrates the full analytics spectrum. It
    also shows the degree of sophistication in this diagram.


    ![9781484204467_Fig01-02.jpg](images/00009.jpeg)


    [Figure 1-2](#part0009.html#_Fig2). Spectrum of all data analysis


    ### Descriptive Analysis


    Descriptive analysis is used to explain what is happening in a given situation.
    This class of analysis typically involves human intervention and can be used to
    answer questions like *What happened?, Who are my customers?, How many types of
    users do we have?*, etc. Common techniques used for this include descriptive statistics
    with charts, histograms, box and whisker plots, or data clustering. You’ll explore
    these techniques later in this chapter.


    ### Diagnostic Analysis


    Diagnostic analysis helps you understand why certain things happened and what
    are the key drivers. For example, a wireless provider would use this to answer
    questions such as *Why are dropped calls increasing?* or *Why are we losing more
    customers every month?* A customer diagnostic analysis can be done with techniques
    such as clustering, classification, decision trees, or content analysis. These
    techniques are available in statistics, data mining, and machine learning. It
    should be noted that business intelligence is also used for diagnostic analysis.


    ### Predictive Analysis


    Predictive analysis helps you predict what will happen in the future. It is used
    to predict the probability of an uncertain outcome. For example, it can be used
    to predict if a credit card transaction is fraudulent, or if a given customer
    is likely to upgrade to a premium phone plan. Statistics and machine learning
    offer great techniques for prediction. This includes techniques such as neural
    networks, decision trees, monte carlo simulation, and regression.


    ### Prescriptive Analysis


    Prescriptive analysis will suggest the best course of action to take to optimize
    your business outcomes. Typically, prescriptive analysis combines a predictive
    model with business rules (e.g. decline a transaction if the probability of fraud
    is above a given threshold). For example, it can suggest the best phone plan to
    offer a given customer, or based on optimization, can propose the best route for
    your delivery trucks. Prescriptive analysis is very useful in scenarios such as
    channel optimization, portfolio optimization, or traffic optimization to find
    the best route given current traffic conditions. Techniques such as decision trees,
    linear and non-linear programming, monte carlo simulation, or game theory from
    statistics and data mining can be used to do prescriptive analysis. See [Figure
    1-2](#part0009.html#Fig2).


    The analytical sophistication increases from descriptive to prescriptive analytics.
    In many ways, prescriptive analytics is the nirvana of analytics and is often
    used by the most analytically sophisticated organizations. Imagine a smart telecommunications
    company that has embedded analytical models in its business workflow systems.
    It has the following analytical models embedded in its customer call center system:


    *   **A customer churn model**: This is a predictive model that predicts the probability
    of customer attrition. In other words, it predicts the likelihood of the customer
    calling the call center ultimately defecting to the competition.

    *   **A customer segmentation model**: This segments customers into distinct segments
    for marketing purposes.

    *   **A customer propensity model**: This model predicts the customer’s propensity
    to respond to each of the marketing offers, such as upgrades to premium plans.


    When a customer calls, the call center system identifies him or her in real time
    from their cell phone number. Then the call center system scores the customer
    using these three models. If the customer scores high on the customer churn model,
    it means they are very likely to defect to the competitor. In that case, the telecommunications
    company will immediately route the customer to a group of call center agents who
    are empowered to make attractive offers to prevent attrition. Otherwise, if the
    segmentation model scores the customer as a profitable customer, he/she is routed
    to a special concierge service with shorter wait lines and the best customer service.
    If the propensity model scores the customer high for upgrades, the call agent
    is alerted and will try to upsell the customer with attractive upgrades. The beauty
    of this solution is that all the models are baked into the telecommunication company’s
    business workflow, driving their agents to make smart decisions that improve profitability
    and customer satisfaction. This is illustrated in [Figure 1-3](#part0009.html#Fig3).


    ![9781484204467_Fig01-03.jpg](images/00010.jpeg)


    [Figure 1-3](#part0009.html#_Fig3). A smart telco using prescriptive analytics


    ## Why Does It Matter and Why Now?'
