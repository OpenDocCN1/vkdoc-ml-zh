    ![image](images/00066.jpeg)


    ![image](images/00067.jpeg)


    An optimal separating hyperplane is one that enables the maximum margin between
    the two classes. These two constraints for describing the hyperplane can be represented
    using the equation


    ![image](images/00068.jpeg)


    This equation can be used for representing all hyperplanes that can be used for
    separating the data. Often, the equation is not solved directly in its current
    form (also referred to as the primal form), due to the difficulty in directly
    computing the value of the norm of `||w||`. In practice, the dual form of the
    equation is used for solving the optimization problem that will identify the optimal
    hyperplane.


    ![Image](images/00013.jpeg) **Note**  You can learn more about support vector
    machines and how the margin can be maximized from the following book:


    Vladimir, C. and Filip, M., *Learning From Data (Concepts, Theory and Methods)*.

    pp. 353 – 384 (Wiley-Interscience, 1998).


    A good overview of support vector machines can be found at [http://en.wikipedia.org/wiki/Support_vector_machine](http://en.wikipedia.org/wiki/Support_vector_machine).


    Azure Machine Learning provides a **Two-Class Support Vector Machine** module,
    which enables you to build a model that supports binary predictions. The inputs
    to the module can be either continuous and/or categorical variables. The module
    provides several parameters that can be used to fine-tune the behavior of the
    support vector machine algorithm. These include


    *   *Number of iterations*: Determines the speed of training the model. This parameter
    enables you to balance between training speed and model accuracy. The default
    value is set to 1.

    *   *Lambda*: Weight for L1 regularization used for tuning the complexity of the
    model that is produced. The default value of `Lambda` is set to 0.001. A non-zero
    value is used to avoid over-fitting the model.

    *   *Normalize features*: Determines whether the algorithm normalizes the values.

    *   *Project to unit-sphere*: Determines whether the algorithm projects the values
    to a unit-sphere.

    *   *Random Number Seed*: The seed value used for random number generation when
    computing the model.

    *   *Allow unknown categorical levels*: Determines whether the algorithm supports
    unknown categorical values. If this is set to `True`, the algorithm creates an
    additional level for each categorical column. The additional level is used for
    mapping levels in the test dataset that are not found in the training dataset.


    ## Bayes Point Machines


    Bayes point machines (BPMs) are a type of linear classification algorithm that
    was introduced by Ralf Herbrich, Thore Grapel, and Colin Campbell in 2001. The
    core idea of the Bayes point machine algorithm is to identify an “average” classifier
    that is able to effectively and efficiently approximate the theoretical optimal
    Bayesian average of several linear classifiers (based on their ability to generalize).
    The “average” classifier is known as the Bayes point. In empirical studies, Bayes
    point machines have consistently outperformed support vector machines for both
    lab and real-world data.


    ![Image](images/00013.jpeg) **Note**  The Bayes point machine algorithm used in
    Azure Machine Learning is based on `Infer.Net` and provides improvements to the
    original Bayes point machine algorithm. These improvements enable the Bayes point
    machine used in Azure Machine Learning to be more robust and less prone to over-fitting
    of the data. It also reduces the need to perform performance tunings.


    Some of these improvements include the use of expectation propagation as the message-passing
    algorithm. In addition, the implementation does not require the use of parameter
    sweeping and having normalized data.


    Recall the earlier definition of the classification problem: given an input sample
    `X = (x[1], x[2], . . ., x[d])`, where `x[i]` refer to an item in the sample of
    size `d`. The goal of classification is to learn the mapping `X → Y`, where `y
    ∈ Y` is a class.


    Given an item in the sample `x[i]`, where `x[i]` is a vector with one or more
    variables. The BPM figures out the class label for `x[i]` by performing the following
    steps:


    *   Computing the inner product of `x[i]` with a weight vector `w`.

    *   Determining whether `x[i]` belongs to a class `y`, if `(x[i]·w)` is positive.
    (`x[i]·w` is the inner product of the vectors `x[i]` and `w`). Gaussian noise
    is added to the computation.


    During training, the BPM algorithm learns the posterior distribution for `w` using
    a prior and the training data. The Gaussian noise used in the computation helps
    to address cases where there is no `w` that can perfectly classify the training
    data (i.e. when the two classes in the training data are not linearly separable).


    ![Image](images/00013.jpeg) **Note**  You can learn more about BPMs at [http://research.microsoft.com/apps/pubs/default.aspx?id=65611](http://research.microsoft.com/apps/pubs/default.aspx?id=65611).


    In addition, the following tutorial for using `Infer.Net` and BPMs provides insights
    into how the algorithm works: [http://research.microsoft.com/en-us/um/cambridge/projects/infernet/docs/Bayes%20Point%20Machine%20tutorial.aspx](http://research.microsoft.com/en-us/um/cambridge/projects/infernet/docs/Bayes%20Point%20Machine%20tutorial.aspx).


    Azure Machine Learning provides a **Two-Class Bayes Point Machine** module, which
    enables you to build a model that supports binary predictions. The module provides
    several parameters that can be used to fine-tune the behavior of the **Bayes Point
    Machine** module. These include


    *   *Number of training iterations*: Determines the number of iterations used
    by the message-passing algorithm in training. Generally, the expectation is that
    more iterations improve the accuracy of the predictions made by the model. The
    default number of training iterations is 30.

    *   *Include bias*: Determines whether a constant bias value is added to each
    training and prediction instance.


    Similar to the **Support Vector Machine** Module, the parameter called **Allow
    unknown categorical levels** is supported.


