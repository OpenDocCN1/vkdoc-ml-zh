    流失模型使企业能够预测哪些客户最有可能流失，并理解导致流失发生的因素。在用于构建流失模型的不同机器学习技术中，分类算法是常用的一种。Azure 机器学习提供了多种分类算法，包括决策森林、决策丛林、逻辑回归、神经网络、贝叶斯点机和支持向量机。图
    6-1 展示了可在 Azure 机器学习工作室中使用的不同分类算法。


    ![9781484204467_Fig06-01.jpg](img/00093.jpeg)


    图 6-1. ML 工作室中可用的分类算法


    在构建（基于分类算法的）流失模型之前，理解数据非常重要。对于用于训练和测试流失模型的数据集，你应该提出以下（非详尽）问题：


    *   每一列捕获了哪种信息？

    *   是直接使用每一列的信息，还是应该从每一列计算出更有意义的派生值？

    *   数据分布是怎样的？

    *   每一列的值是数值型还是分类型？

    *   某一列是否包含许多缺失值？


    一旦理解了数据，你就可以按照以下步骤开始构建流失模型。


    1.  数据准备与理解

    2.  数据预处理与特征选择

    3.  用于预测客户流失的分类模型

    4.  评估模型性能

    5.  模型运营化


    在本章中，你将学习如何执行这些步骤中的每一步，为电信业务场景构建一个流失模型。你将学习 Azure 机器学习工作室中用于理解数据和执行数据预处理的不同工具。你还将学习用于评估模型有效性的不同性能指标。让我们开始吧！


    构建和部署客户流失模型


    在本节中，你将学习如何使用不同的分类算法构建客户流失模型。为了构建客户流失模型，你将使用来自 KDD Cup 2009 的电信数据集。该数据集由法国领先的电信公司
    Orange 提供。根据 Orange 2013 年度报告，Orange 在全球拥有 2.36 亿客户（1550 万固定宽带客户和 1.785 亿移动客户）。


    KDD Cup 2009 挑战的目标是构建一个有效的机器学习模型，用于预测客户流失、购买新产品/服务的意愿（倾向性）以及向上销售的机会。在本节中，你将专注于预测客户流失。


    ![Image](img/00013.jpeg) **注意**  KDD Cup 是由 ACM 知识发现与数据挖掘特别兴趣小组（SIGKDD）组织的年度竞赛。每年，数据科学家都会参与各种数据挖掘和知识发现挑战。这些挑战的范围从预测谁最有可能向慈善机构捐款（1997
    年）、在线零售商的点击流分析（2000 年）、预测电影评分行为（2007 年），到预测客户更换服务提供商的倾向（2009 年）。


    准备和理解数据


    在本练习中，你将使用较小的 Orange 数据集，该数据集包含 50,000 行。每行有 230 列（称为变量）。前 190 个变量是数值型，最后 40 个变量是分类型。


    在开始构建实验之前，请从 KDD Cup 网站下载以下小数据集和流失标签：


    *   orange_small_train.data.zip - [www.sigkdd.org/site/2009/files/orange_small_train.data.zip](http://www.sigkdd.org/site/2009/files/orange_small_train.data.zip)

    *   orange_small_train_churn.labels - [www.sigkdd.org/site/2009/files/orange_small_train_churn.labels](http://www.sigkdd.org/site/2009/files/orange_small_train_churn.labels)


    在 orange_small_train_churn.labels 文件中，每一行包含一个 +1 或 -1 值。+1 值表示正例（客户已流失），-1 值表示负例（客户未流失）。


    文件上传后，你应该按照以下步骤将数据集和标签上传到机器学习工作室：


    1.  点击 **新建** 并选择 **数据集 ![image](img/00044.jpeg) 来自本地文件**（图 6-2）。


    ![9781484204467_Fig06-02.jpg](img/00094.jpeg)


    图 6-2. 使用机器学习工作室上传 Orange 数据集


    2.  接下来，选择要上传的文件：**orange_small_train.data**（图 6-3）。


    ![9781484204467_Fig06-03.jpg](img/00095.jpeg)


    图 6-3. 上传数据集


    3.  点击 **确定**。


    Orange 数据集上传后，重复步骤将流失标签文件上传到机器学习工作室。完成后，当你创建新实验时，应该能够看到这两个 Orange 数据集。为此，创建一个新实验，并展开左侧窗格中的“已保存数据集”菜单。图
    6-4 显示了您上传的 Orange 训练数据和流失标签数据集。


    ![9781484204467_Fig06-04.jpg](img/00096.jpeg)


    图 6-4. 已保存数据集：Orange 训练数据和流失标签


    在构建任何机器学习模型时，在尝试构建模型之前理解数据非常重要。为此，请按如下步骤创建一个新实验。


    1.  点击 **新建** ![image](img/00044.jpeg) **实验**。

    2.  命名实验为 - **理解 Orange 数据集**。

    3.  从 **已保存数据集** 中，选择 **orange_small_train.data** 数据集（双击它）。

    4.  从 **统计函数** 中，选择 **描述性统计**（双击它）。

    5.  你将看到这两个模块。将数据集与 **描述性统计** 模块连接起来。图 6-5 显示了完成的实验。


    ![9781484204467_Fig06-05.jpg](img/00097.jpeg)


    图 6-5. 理解 Orange 数据集


    6.  点击 **运行**。

    7.  运行成功完成后，右键单击 **描述性统计** 下方的圆圈，然后选择 **可视化**。

    8.  你将看到数据的分析结果，其中涵盖了每个变量的唯一值计数、缺失值计数、最小值和最大值（图 6-6）。


    ![9781484204467_Fig06-06.jpg](img/00098.jpeg)


    图 6-6. Orange 数据集的描述性统计


    这提供了关于每个变量的有用信息。从可视化结果中，你将观察到有许多变量存在缺失值（例如，Var1、Var8）。例如，Var8 实际上是一个没有有用信息的列。


    ![Image](img/00013.jpeg) **提示**  当可视化 **描述性统计** 的输出时，它只显示前 100 个变量。要查看所有 230 个变量的全部统计信息，请右键单击
    **描述性统计** 模块的底部圆圈，然后选择 **另存为数据集**。数据集保存后，你可以选择下载文件并在 Excel 中查看所有行。


    数据预处理与特征选择


    在大多数分类任务中，你通常需要确定哪些变量应用于构建模型。机器学习工作室提供了两个特征选择模块，可用于确定建模的正确变量。这包括基于筛选器的特征选择和线性判别分析。

