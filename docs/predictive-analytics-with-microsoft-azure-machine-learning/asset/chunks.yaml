    聚类算法


    聚类是一种无监督机器学习。在聚类中，目标是将相似的对象分组在一起。大多数现有的聚类算法可以分为以下几类：

    '
- fmt: '*   *Partitioning*: Divide a data set into `k` partitions of data. Each partition
    corresponds to a cluster.

    *   *Hierarchical*: Given a data set, hierarchical approaches start either bottom-up
    or top-down when constructing the clusters. In the bottom-up approach (also known
    as agglomerative approach), the algorithm starts with each item in the data set
    assigned to one cluster. As the algorithm moves up the hierarchy, it merges the
    individual clusters (that are similar) into bigger clusters. This continues until
    all the clusters have been merged into one (root of the hierarchy). In the top-down
    approach (also known as divisive approach), the algorithm starts with all the
    items in one cluster, and in each iteration, divides into smaller clusters.

    *   *Density*: Density-based algorithms grow clusters by considering the density
    (number of items) in the “neighborhood” of each item. They are often used for
    identifying clusters that have “arbitrary” shapes. In contrast, most partitioning-based
    algorithms rely on the use of a distance measure. This produces clusters that
    have regular shapes (e.g. spherical).


    ![Image](images/00013.jpeg) **Note** Read a good overview of various clustering
    algorithms at [http://en.wikipedia.org/wiki/Cluster_analysis](http://en.wikipedia.org/wiki/Cluster_analysis).


    In this chapter, we will focus on partitioning-based clustering algorithms. Specifically,
    you will learn how k-means clustering works.


    For partitioning-based cluster algorithms, it is important to be able to measure
    the distance (or similarity) between points and vectors. Various distance measures
    include Euclidean, Cosine, Manhattan (also known as City-block) distance, Chebychev,
    Minkowski, and Mahalanobis distance.


    In Azure Machine Learning, the **K-Means Clustering** module supports Euclidean
    and Cosine distance measures. Given two points, `p1` and `p2`, the Euclidean distance
    between `p1` and `p2` is the length of the line segment that connects the two
    points. The Euclidean distance can also be used to measure the distance between
    two vectors. Given two vectors, `v1` and `v2`, the Cosine distance is the cosine
    of the angle between `v1` and `v2`.


    The distance measure used for clustering is chosen based on the type of data being
    clustered. Euclidean distance is sensitive to the scale/magnitude of the vectors
    that are compared. For example, even though two vectors seem relatively similar,
    the scale of the features can affect the value of the Euclidean distance. In this
    case, the Cosine distance measure is more appropriate, as it is less susceptible
    to scale. The cosine angle between the two vectors would have been small.


    K-means clustering works as follows:


    1.  Randomly choose `k` items from the data set as the initial center for `k`
    clusters.

    2.  For each of the remaining items, assign each one of them to the `k` clusters
    based on the distance between the item and the cluster centers.

    3.  Compute the new center for each of the clusters.

    4.  Keep repeating step 2 and 3 until there are no more changes to the clusters,
    or when the maximum number of iterations is reached.


    To illustrate, [Figure 4-6](#part0013.html#Fig6) presents a data set for k-means
    clustering. There are three distinct clusters in this data, which are illustrated
    with different colors.


    ![9781484204467_Fig04-06.jpg](images/00069.jpeg)


    [Figure 4-6](#part0013.html#_Fig6). Data set for k-means clustering


    [Figure 4-7](#part0013.html#Fig7) illustrates k-means clustering with `k=3` and
    how the three cluster centroids, represented as `+` symbols, move each iteration
    to reduce the mean squared error and more accurately reflect the cluster centers.


    ![9781484204467_Fig04-07.jpg](images/00070.jpeg)


    [Figure 4-7](#part0013.html#_Fig7). Iterations of the K-means clustering algorithm
    with `k=3` in which the cluster centroids are moving to minimize error


    The **K-Means Clustering** module in Azure Machine Learning supports different
    centroid initialization algorithms. This is specified by the **Initialization**
    property. Five centroid initialization algorithms are supported. [Table 4-1](#part0013.html#Tab1)
    shows the different centroid initialization methods supported.


    [Table 4-1](#part0013.html#_Tab1). K-Means Cluster - Centroid Initialization Algorithms


    | Centroid Initialization Algorithm | Description |

    | --- | --- |

    | **Default** | Picks first N points as initial centroids |

    | **Random** | Picks initial centroids randomly |

    | **K-Means++** | K-Means++ centroid initialization |

    | **K-Means+ Fast** | K-Means++ centroid initialization with P:=1 (where the farthest
    centroid is picked in each iteration of the algorithm) |

    | **Evenly** | Picks N points evenly as initial centroids |


