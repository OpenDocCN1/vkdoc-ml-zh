    clustering is a common technique used to perform customer segmentation. In this
    chapter, you will learn how to use Microsoft Azure Machine Learning to perform
    k-means clustering on the Wikipedia SP 500 dataset (one of the sample datasets
    available in ML Studio).


    The Wikipedia SP 500 dataset contains the following information: industry category,
    and text describing each of the 500 Standard & Poor’s (SP500) companies. You will
    build and deploy a k-means clustering model to perform segmentation of the companies.
    Due to the large number of features that are extracted from the text, you will
    execute an R script to perform principal component analysis to identify the top
    10 features, which will be used for determining the clusters. After k-means clustering
    has been performed, companies that are similar to each other (based on features
    extracted from the companies’ descriptive text) will be assigned to the same segment.


    ![Image](images/00013.jpeg) **Note**  See [Chapter 4](#part0013.html) for an overview
    of the different statistical and machine learning algorithms. In the chapter,
    you will also learn about the categories of clustering algorithms, and how K-Means
    Clustering works.


    Building and Deploying Your First K-Means Clustering Model


    To help you get started building your first k-means clustering model, you will
    use one of the sample experiments provided in the ML Studio. The experiment uses
    k-means clustering to perform segmentation of companies in the Standard & Poor’s
    (S&P) 500 list of companies.'
