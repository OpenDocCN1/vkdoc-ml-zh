  trans: "\n在本节中，你将了解如何从不同来源加载数据并在 Azure Machine Learning 中进行分析。Azure Machine Learning\
    \ 支持从多种来源加载数据，包括本地计算机、Web、Azure 上的 SQL 数据库、Hive 表或 Azure Blob 存储。\n\n从本地文件系统加载数据\n\
    \n最简单的数据加载方式是从本地计算机加载。请按照以下步骤操作。\n\n1.  在浏览器中访问 URL [`studio.azureml.net`](https://studio.azureml.net)，并登录到你在\
    \ Azure Machine Learning 中的工作区。\n2.  接着，点击左侧窗格菜单中的 **Experiments** 项。\n3.  点击窗口左下角的\
    \ **+New** 按钮，然后从新出现的菜单中选择 **Dataset**，如图 5-1 所示。\n\n![9781484204467_Fig05-01.jpg](img/00071.jpeg)\n\
    \n图 5-1. 从本地计算机加载新数据集\n\n4.  当你选择 **From Local File** 选项时，系统会提示你选择要从本地计算机加载的数据文件。\n\
    \n你已使用这些步骤将 BikeBuyer.csv 文件从本地文件系统加载到 Azure Machine Learning 中。\n\n从其他来源加载数据\n\
    \n你可以使用 Azure Machine Learning 中的 Reader 模块从非本地来源加载数据。具体来说，使用 Reader 模块可以从 Web、Azure\
    \ 上的 SQL 数据库、Azure 表、Azure Blob 存储或 Hive 表加载数据。为此，你需要在调用 Reader 模块之前创建一个新实验。请按照以下步骤使用\
    \ Reader 模块从上述任何来源加载数据。\n\n1.  在浏览器中访问 URL [`studio.azureml.net`](https://studio.azureml.net)，并登录到你在\
    \ Azure Machine Learning 中的工作区。\n2.  接着，点击左侧窗格菜单中的 **Experiments** 项。\n3.  点击窗口左下角的\
    \ **+New** 按钮，然后从新出现的菜单中选择 **Experiment**。一个新的实验将启动，并带有一个空白画布，如图 5-2 所示。\n\n![9781484204467_Fig05-02.jpg](img/00072.jpeg)\n\
    \n图 5-2. 在 Azure Machine Learning 中启动新实验\n\n4.  打开 **Data Input and Output** 菜单项，你将看到两个模块：**Reader**\
    \ 和 **Writer**。\n5.  将 **Reader** 模块从菜单拖放到画布上的任意位置。\n6.  点击画布上的 **Reader** 模块，其属性将显示在右侧窗格的\
    \ **Reader** 下。现在，在下拉菜单中指定数据源，然后输入所有必需参数的值。图 5-3 显示了为从我们的 Azure Blob 存储帐户读取 BikeBuyer.csv\
    \ 文件而输入的完整参数。Account Name 和 Account Key 指的是 Microsoft Azure 上的一个存储帐户。你可以通过以下方式从\
    \ Azure 门户获取这些参数。\n    1.  登录 Microsoft Azure，网址为 [`azure.microsoft.com`](http://azure.microsoft.com)。\n\
    \    2.  在顶部菜单中，点击 **Portal**。这将带你进入 Azure 门户。\n    3.  从左侧窗格的菜单中选择 **storage**。这将在右侧窗格中列出你所有的存储帐户。\n\
    \    4.  点击包含你的机器学习模型所需数据的存储帐户。\n    5.  在屏幕底部，点击标有 **Manage Access Keys** 的钥匙图标。将显示你的存储帐户名称和访问密钥。使用主访问密钥作为\
    \ Azure Machine Learning 中 **Reader** 模块的 Account Key。\n\n![9781484204467_Fig05-03.jpg](img/00073.jpeg)\n\
    \n图 5-3. 使用 Reader 模块从 Azure Blob 存储加载 BikeBuyer.csv 文件\n\n![Image](img/00013.jpeg)\
    \ **注意**  你可以使用上述说明将多个来源的多个数据集加载到 Azure Machine Learning 中。但请注意，每个 Reader 模块一次只能加载一个数据集。\n\
    \n数据分析\n\n将数据加载到 Azure Machine Learning 后，下一步是进行预处理，为建模准备数据。作为此过程的一部分，对数据进行可视化总是非常有用的。你可以通过\
    \ Reader 模块或从左侧窗格的 Saved Datasets 菜单项中选择 BikeBuyer.csv 来可视化 Bike Buyer 数据集。当鼠标悬停在\
    \ Reader 模块底部的小圆圈上时，会打开一个菜单，提供两个选项：**Download** 或 **Visualize**。详情请参见图 5-4。如果选择\
    \ Download 选项，你可以将数据保存到本地计算机，并在 Excel 中打开以查看数据。或者，你也可以通过选择 Visualize 选项在 Azure\
    \ Machine Learning 中可视化数据。\n\n![9781484204467_Fig05-04.jpg](img/00074.jpeg)\n\n\
    图 5-4. 在 Azure Machine Learning 中可视化数据的两个选项\n\n如果选择 Visualize 选项，数据将在一个新窗口中呈现，如图\
    \ 5-5 所示。图 5-5 显示了 BikeBuyer.csv 数据集，其中包含所有客户的历史销售数据。你可以看到该数据集有 10,000 行和 13 列，包括人口统计变量，如婚姻状况、性别、年收入、子女数量、职业、年龄等。其他变量包括房屋所有权状况、汽车数量和通勤距离。最后一列名为\
    \ Bike Buyer，非常重要，因为它显示了哪些客户过去曾从你的商店购买过自行车。\n\n![9781484204467_Fig05-05.jpg](img/00075.jpeg)\n\
    \n图 5-5. 在 Azure Machine Learning 中可视化 Bike Buyer 数据集\n\n图 5-5 还显示了数据集中所有变量的描述性统计信息，如均值、中位数、标准差等。此外，它还显示了每个变量的数据类型和缺失值的数量。向下滚动，你将看到显示实际值的数据集样本。\n\
    \n特征列表顶部的第一行是一组缩略图，显示了每个变量的分布情况。你可以通过点击缩略图查看完整的分布。例如，如果你点击年收入上方的缩略图，Azure Machine\
    \ Learning 会在屏幕右侧窗格中打开完整的直方图；如图 5-6 所示。该直方图显示了所选变量的分布情况，你可以开始思考如何在模型中使用它。例如，在图\
    \ 5-6 中，你可以清楚地看到年收入并非来自正态分布。如果非要描述，它看起来更像是对数正态分布。你还可以在直方图中发现异常值。Azure Machine\
    \ Learning 允许你在直方图上叠加概率密度函数或累积分布。\n\n![9781484204467_Fig05-06.jpg](img/00076.jpeg)\n\
    \n图 5-6. 年收入直方图\n\n使用 Azure Machine Learning，你还可以将数据转换为对数尺度。这是一种捕获不能丢弃的有效异常值的重要技术。例如，如果你的潜在目标包括高收入客户，那么简单地将高收入人群作为异常值丢弃是不明智的。对数变换是捕获极端收入的更好方法。图\
    \ 5-7 显示了在 x 轴上使用对数尺度变换后的年收入。\n\n![9781484204467_Fig05-07.jpg](img/00077.jpeg)\n\
    \n图 5-7. 在对数尺度上变换年收入\n\nAzure Machine Learning 中另一个有用的可视化工具是统计学中广泛使用的箱线图。你可以使用箱线图而不是直方图来可视化你的连续变量。为此，请在第一个标有\
    \ **view as** 的缩略图中选择箱线图图标。\n"
- fmt: '[Figure 5-8](#part0015.html#Fig8) shows yearly income as a box-and-whisker
    plot instead of a histogram. On this plot, the y-value at the bottom of the box
    is the 25th percentile and the value at the top of the box is the 75th percentile.
    The line in the middle of the box is the median yearly income. The box-and-whisker
    plot shows outliers much more clearly: in [Figure 5-8](#part0015.html#Fig8) the
    outliers are shown as three dots above the edge of the whisker. How are outliers
    determined? A rule of thumb is that any point that lies above or below `1.5*IQR`
    is an outlier. `IQR` is the interquartile range measured as the 75th percentile
    - 25th percentile. On the box-and-whisker plot, `IQR` is the distance between
    the top and bottom of the box. Since you don’t plan to drop the outliers in this
    case, a good alternative is to transform yearly income with the `log` function.
    The result is shown in [Figure 5-9](#part0015.html#Fig9). Now you see that after
    the `log` transformation the three dots disappear from the box-and-whisker plot.
    This means the three extreme yearly incomes no longer appear as outliers. This
    is a great way to include valid extreme values in your model. This treatment can
    also increase the power of your predictive model.


    ![9781484204467_Fig05-08.jpg](images/00078.jpeg)


    [Figure 5-8](#part0015.html#_Fig8). A box-and-whisker plot of yearly income


    ![9781484204467_Fig05-09.jpg](images/00079.jpeg)


    [Figure 5-9](#part0015.html#_Fig9). A box-and-whisker plot of the log of yearly
    income


    ## More Data Treatment


    In addition to visualization, Azure Machine Learning provides many other options
    for data pre-processing. The menu on the left pane has many modules organized
    by function. Many of these modules are useful for data pre-processing.


    The `Data Format Conversions` item has five different modules for converting data
    formats. For instance, the module named `Convert to CSV` converts data from different
    types such as `Dataset`, `DataTableDotNet`, etc., to CSV format.


    The `Data Transformation` item in the menu has sub-categories for data filtering,
    data manipulation, data sampling, and scaling. The menu item named `Statistical
    Functions` also has many relevant modules for data pre-processing.


    [Figure 5-10](#part0015.html#Fig10) shows some of these modules in action. The
    `Join` module (found under the `Manipulation` sub-category) enables you to join
    datasets. For instance, if there was a second relevant data for the propensity
    model, you could use the `Join` module to join it with the `Bike Buyer` dataset.


    ![9781484204467_Fig05-10.jpg](images/00080.jpeg)


    [Figure 5-10](#part0015.html#_Fig10). More options for data preparation


    The module named `Descriptive Statistics` shows descriptive statistics of your
    dataset. For example, if you click the small circle at the bottom of this module,
    Azure Machine Learning shows descriptive statistics such as mean, median, standard
    deviation, skewness kurtosis, etc. of the `Bike Buyer` dataset. It also shows
    the number of missing values in each variable. As a rule of thumb, if a variable
    has 40% or more missing values, it can be dropped from the analysis, unless it
    is business critical.


    You can resolve missing values with the module named `Missing Values Scrubber`.
    Like any other module in Azure Machine Learning, when you select this module,
    its parameters are shown on the right pane. This module allows you to handle missing
    values in a number of ways. First, you can remove columns with missing values.
    By default, the tool keeps all variables with missing values. Second, you can
    replace missing values with a hard-coded value in the parameter box. By default,
    the tool will replace any missing values with the number 0. Alternatively, you
    can replace missing values with the mean, median, or mode of the given variable.


    The `Linear Correlation` module is also useful for computing the correlation of
    variables in your dataset. If you click on the small circle at the bottom of the
    `Linear Correlation` module, and then select `Visualize`, the tool displays a
    correlation matrix. In this matrix, you can see the pairwise correlation of all
    variables in the dataset. This module calculates the Pearson correlation coefficient.
    So other correlation types such as Spearman are not supported by this module.
    In addition, note that this module only calculates the correlation for continuous
    variables. For categorical variables, the module shows `NaN`.


    ## Feature Selection


    Feature selection is a very important part of data pre-processing. Also known
    as variable selection, this is the process of finding the right variables to use
    in the predictive model. It is particularly critical when dealing with large datasets
    involving hundreds of variables. Throwing over 600 variables at a predictive model
    is wasteful of computer resources, and also reduces its predictive accuracy. Through
    feature selection you can find the most influential variables for the prediction.
    Since the `Bike Buyer` dataset only has 13 variables, you could skip this step.
    However, let’s see how to do feature selection in Azure Machine Learning because
    it is very important for large datasets.


    To do feature selection in Azure Machine Learning, drag the module named `Filter
    Based Feature Selection` from the list of modules in the left pane. You can find
    this module by searching for it in the search box or by opening the `Feature Selection`
    category. To use this module, you need to connect it to a dataset as the input.
    [Figure 5-11](#part0015.html#Fig11) shows it in use as a feature selection for
    the `Bike Buyer` dataset. Before running the experiment, use the `Launch column
    selector` in the right pane to define the target variable for prediction. In this
    case, choose the column `Bike Buyer` as the target since this is what you have
    to predict.


    ![9781484204467_Fig05-11.jpg](images/00081.jpeg)


    [Figure 5-11](#part0015.html#_Fig11). Feature selection in Azure Machine Learning


    You also need to choose the scoring method that will be used for feature selection.
    Azure Machine Learning offers the following options for scoring:


    *   Pearson correlation

    *   Mutual information

    *   Kendall correlation

    *   Spearman correlation

    *   Chi Squared

    *   Fischer score

    *   Count based


    The correlation methods find the set of variables that are highly correlated with
    the output, but have low correlation among themselves. The correlation is calculated
    using Pearson, Kendall, or Spearman correlation coefficients, depending on the
    option you choose.


    The Fisher score uses the Fisher criterion from Statistics to rank variables.
    In contrast, the mutual information option is an information theoretic approach
    that uses mutual information to rank variables. The mutual information measures
    the dependence between the probability density of each variable and that of the
    outcome variable.


    Finally, the Chi Squared option selects the best features using a test for independence;
    in other words, it tests whether each variable is independent of the outcome variable.
    It then ranks the variables based on the Chi Squared test.


    ![Image](images/00013.jpeg) **Note** See [http://en.wikipedia.org/wiki/Feature_selection#Correlation_feature_selection](http://en.wikipedia.org/wiki/Feature_selection#Correlation_feature_selection)
    or [http://jmlr.org/papers/volume3/guyon03a/guyon03a](http://jmlr.org/papers/volume3/guyon03a/guyon03a).pdf
    for more information on feature selection strategies.'
