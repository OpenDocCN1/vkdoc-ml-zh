  \n**跳转到** 是一个条件语句，提供创建分支的选项，当满足特定条件时，可以从工作流中的一个节点跳转到另一个节点。你需要选择要跳转的源节点，然后选择工作流中要跳转到的目标节点，并配置以下三个选项之一，如图\
  \ 4-68 所示。\n\n***图 4-68.** 跳转到选项*\n\n**等待用户输入** 会等待用户输入查询，然后将工作流移至下一步。在用户提供更多输入之前，对话不会继续。\n\
  \n**场景 1：带有子节点的节点**\n\n当用户输入查询时，会触发匹配的节点并等待用户输入内容。如果该用户输入与后续子节点（子节点 1、子节点 2）中定义的条件匹配，则会执行该特定子节点。\n\
  \n![](img/index-113_1.jpg)\n\n![](img/index-113_2.jpg)\n\n第 4 章 使用 Watson Assistant\
  \ 构建你的第一个机器人\n\n***图 4-69.** 用户输入及从主节点到子节点的遍历*\n\n**场景 2：同一层级节点间的跳转**\n\n当节点 1 因匹配的查询被触发，并且存在从节点\
  \ 1 到节点 2 的跳转时，可以选择在跳转到节点 2 之前等待用户输入。\n\n***图 4-70.** 用户输入及同一层级节点间的遍历*\n\n**如果机器人识别条件**\
  \ 意味着，如果目标节点中指定的条件评估为真，工作流将执行目标节点的响应语句。如果评估不为真，则不执行响应语句。\n\n![](img/index-114_1.jpg)\n\
  \n![](img/index-114_2.jpg)\n\n第 4 章 使用 Watson Assistant 构建你的第一个机器人\n\n***图 4-71.**\
  \ 跳转到（如果机器人识别）——条件为真时在同一层级节点间跳转*\n\n如果条件评估不为真，系统会移动到目标节点，但不执行目标节点的响应语句。它不会评估子节点中的任何条件，而是移动到下一个兄弟节点，以自上而下的方式继续评估条件。\n\
