  \ गमय, मृत्योर मा अमृतम् गमय\n\n(Asato Ma Sad Gamaya, Tamaso Ma Jyotir Gamaya, Mrityor\
  \ Ma Amritam Gamaya)\n\n引领我们从无知走向真理，从黑暗走向光明，从死亡走向永生。\n\nxvi\n\n**第 1 章**\n\n**认知虚拟机器人简介**\n\
  \n昨天还是科幻小说的事物，今天正在成为现实。许多技术都是如此，认知虚拟助手就是这样一种应运而生的技术。\n\n几年前，我读过一本书，书中主角创建了一个具有认知能力的自学习聊天程序，能够像任何人类一样做出回应。当时，这看起来只是一个与科幻惊悚片相关的故事情节。然而，直到几年前还只是一个概念的东西，如今由于*认知虚拟助手*（更常被称为*聊天机器人*）的出现，已经大规模成为现实。\n\
  \n聊天机器人是一种计算机程序，它通过听觉或文本方式进行自然语言对话，理解用户的意图，并根据业务规则和组织数据发送响应。它的表现方式与人类在双向对话中的表现相同。\n\
  \n从 1950 年艾伦·图灵在《计算机器与智能》([`en.wikipedia.org/wiki/Computing_`](https://en.wikipedia.org/wiki/Computing_Machinery_and_Intelligence)\
  \ [Machinery_and_Intelligence](https://en.wikipedia.org/wiki/Computing_Machinery_and_Intelligence))\
  \ 一文中提出的概念，以及 1966 年第一个名为 Eliza 的聊天机器人的诞生，发展到今天，它已经演变成一个由人工智能技术和机器学习算法驱动的、非常复杂的互联生态系统。如今，聊天机器人可以帮助用户订披萨、预订假期、购买保险单，或执行像管理企业\
  \ IT 基础设施这样非常复杂的任务，以及更多其他功能。\n\n© Navin Sabharwal, Sudipta Barua, Neha Anand, Pallavi\
  \ Aggarwal 2020\nN. Sabharwal 等人著，《使用 IBM Watson 引擎开发认知机器人》，\n`doi.org/10.1007/978-1-4842-5555-1_1`\n\
  \n第 1 章 认知虚拟机器人简介\n\n随着以客户为中心的个性化体验的兴起，当今企业必须能够在较短的周转时间内，以更高的个性化程度，并且在客户历史和画像方面零延迟地与其最终用户进行相关对话。根据高德纳公司的数据，到\
  \ 2020 年，25% 的客户服务运营将使用虚拟客户助手\n([`www.gartner.com/en/newsroom/press-releases/2018-02-19-`](https://www.gartner.com/en/newsroom/press-releases/2018-02-19-gartner-says-25-percent-of-customer-service-operations-will-use-virtual-customer-assistants-by-2020)\
  \ [gartner-says-25-percent-of-customer-service-operations-will-](https://www.gartner.com/en/newsroom/press-releases/2018-02-19-gartner-says-25-percent-of-customer-service-operations-will-use-virtual-customer-assistants-by-2020)\
  \ [use-virtual-customer-assistants-by-2020)。](https://www.gartner.com/en/newsroom/press-releases/2018-02-19-gartner-says-25-percent-of-customer-service-operations-will-use-virtual-customer-assistants-by-2020)\
  \ 它进一步预测，虚拟聊天代理有望丰富客户体验，在整个互动过程中帮助客户，并代表客户处理交易。有趣的是，由谷歌、IBM、Facebook、微软等公司提供的开源平台推动的技术民主化，使得即使没有专业程序员也能创建聊天机器人。\n\
  \n如果这些数据点让你感到兴奋，并且你想探索构建自己的虚拟聊天代理的可能性，那么这本书就是为你准备的。\n\n本书可作为在 IBM 开发的 Watson 平台上构建聊天机器人的指南。我们将为银行、金融、保险、旅游、股票市场等不同用例开发聊天机器人。我们还将讨论其他认知平台，如\
  \ LUIS、Lex 和 Dialogflow。在本书的后续部分，我们将探索不同的机器人框架，例如 Microsoft Bot Framework 和 Bot\
  \ Builder。\n\n让我们更深入地探讨本书的主题：认知虚拟助手。*助手*一词指的是协助执行任务或活动的人或物。*虚拟*一词很容易让人联想到软件以及存在于虚拟世界中的事物。*认知*一词则与人类的认知能力有关。\n\
  \n让我们看看认知是如何被定义的。认知是“通过思考、经验和感官获取知识和理解的心理活动或过程。”它涵盖了智力功能和过程的许多方面，例如注意力、知识的形成、记忆和工作记忆、判断和评估、\n\
  \n\n\n推理与计算、问题解决与决策、\n\n第 1 章 认知虚拟机器人简介\n\n语言的理解与生成。认知过程利用现有知识并产生新知识。\n\n简单来说，认知是人类的一种能力，它帮助我们\n\
  \n获取知识、执行所有心智功能、理解我们所处的环境，并创造新知识。\n\n认知型或智能虚拟助手旨在变得更像人类，并具备人类所拥有的类似能力，尽管距离这一目标成为现实，我们仍有很长的路要走。\n\
  \n认知虚拟代理（CVA）具备上述部分能力，\n\n但在理解我们世界中纷繁复杂的语境方面，它们可能还无法与人类匹敌。然而，在某些领域，它们超越了人类，因为它们没有生物性的处理能力限制，并且能够同时扩展并与数百万用户\n\
  \n进行沟通，这是人类无法做到的。\n\n让我们来定义一下认知虚拟助手。CVA 是一种软件代理，它基于文本、语音、手势或视觉输入为个人或系统执行任务。它在不同程度上具备理解所提供输入、解释输入、应用逐步逻辑、探询用户意图和对话语境的能力，并据此提供信息或执行预期任务。它能理解自然语言对话，并维持对话的语境以实现目标。\n\
  \n一些 CVA 能够通过首先使用语音转文本来解释语音指令，而另一些则能识别图像并据此采取行动。\n\n在回应方面，CVA 可以在通信模式为消息系统时使用文本回复，可以通过语音频道\n\
  \n使用语音回复，并且可以通过机器人外观展示手势、表情或动作来表达自己。CVA 也被嵌入到扬声器和汽车导航系统等设备中。\n\n这些设备中一些支持语音的具体例子有\
  \ Google Home 和 Amazon Echo。\n\n第 1 章 认知虚拟机器人简介\n\nCVA 可在多种设备和界面上使用，并且可以通过\n\n移动手持设备、笔记本电脑或个人电脑访问。它们也可以通过不同的消息平台访问，例如\
  \ Facebook Messenger、Skype、Telegram 等。\n\nCVA 被嵌入到大众使用的移动应用程序中，这些应用程序被称为*数字个人助理*。数字个人助理的几个例子包括苹果的\
  \ Siri、谷歌的 Google Assistant 和微软的 Cortana。数字个人助理帮助用户完成搜索、导航和通信等任务。数字个人助理需要通过一个命令来激活，以便它们知道用户正在尝试发起对话。这些语音命令的一些例子有“OK\n\
  \nGoogle”、“Alexa”等。\n\n虚拟助手可以被用来提供各种服务。以下是一些例子。\n\n• 充当搜索和检索代理，从各种来源检索结果，\n\n例如天气、股票\n\
  \n更新、市场信息、价格、目录、利率等。\n\n• 充当配置代理，配置提醒、闹钟、\n\n创建待办事项列表、购物清单、旅行行程等。\n\n• 从目录和订阅服务中播放视频或音乐，\n\
  \n例如 Spotify、Netflix、Amazon Prime 等。\n\n• 充当 IT 服务台代理，解决 IT 设备的问题和\n\n故障。\n\n• 在专业服务中充当助手，例如\n\
  \n医疗保健、法律、行政和金融。\n\n• 充当设备（扬声器、\n\n电视和其他设备）中的嵌入式代理。\n\n第 1 章 认知虚拟机器人简介\n\n• 充当车辆和汽车中的代理，以辅助导航\n\
  \n和操作娱乐设备，例如音乐播放器等。\n\n**认知虚拟助手的隐私问题**\n\n\n\nCVA（认知虚拟助手）存在明显且实际的安全隐患。一些\n\n消费级认知虚拟助手始终处于“监听模式”，等待语音激活关键词。这意味着人与人之间的私密对话会不断被\
  \ CVA 的麦克风捕捉。这些\n\n消费级 CVA 公司会录制部分数据，并将其用于训练系统，以更好地识别人类语音和意图。毕竟，在 CVA 后台运行的深度学习系统需要海量真实数据来进行训练和优化。\n\
  \n由于 CVA 基于音频指令工作，因此有可能通过嵌入人耳无法察觉的音频指令来欺骗或入侵它们——例如将这些指令隐藏在音乐中，或通过电子设备播放的语音文本中。这些手段可被用来操纵\
  \ CVA 执行黑客控制的动作。与 CVA 相关的另一个风险是，黑客可以操纵虚拟助手入侵系统，甚至获得进入住宅和办公室的物理权限。\n\nAI 技术提供了像 CVA\
  \ 这样的能力，但也使得模仿和重建某人的声纹变得更加容易。如今，已有技术可以创建某人带有精确声纹的伪造视频；这项技术正日益精进。\n\n这些担忧在近期已成为新闻头条。CVA\
  \ 的\n\n制造商已经发布了使用建议，让用户能够更好地控制自己的数据是否被存储，以及是否被提供商使用。作为这些系统的消费者，我们应当充分了解私人数据泄露的风险。我们应当知晓如何根据自身的隐私需求来使用系统。\n\
  \n第 1 章 认知虚拟机器人简介\n\n**CVA 的开发平台**\n\n有多个平台可供你利用核心技术创建 CVA，并为企业打造自定义虚拟助手。\n\n以下列出了一些主流平台。\n\
  \n• IBM Watson 是一套人工智能产品。它提供对话、翻译等 API，以及一个名为 Watson Assistant 的开箱即用解决方案，用于快速创建和配置认知虚拟助手。\n\
  \n• Amazon Lex 和 Polly 是亚马逊云服务（AWS）提供的工具，用于快速创建和配置认知虚拟助手。AWS 还提供其他服务，帮助用户增强 CVA\
  \ 的功能。\n\n• Google 提供 Dialogflow 供开发者创建引人入胜的虚拟代理。它还提供其他服务，包括语言翻译和语音识别，以增强认知虚拟助手的基本功能。\n\
  \n**机器人 vs. 认知虚拟助手**\n\n当今技术领域存在多种术语；其中最流行的是聊天机器人、虚拟代理、虚拟助手和机器人。尽管这些术语听起来相似，但它们在功能和特性上存在重大差异。让我们来理解这些术语。\n\
  \n• *Bot* 是 *robot*（机器人）的简称。它指代任何在互联网上运行的自动化程序。你可能听说过诸如 *Twitter 机器人* 和 *聊天机器人*\
  \ 之类的术语。它们是提供特定类型功能的机器人或软件机器人的具体实例。\n\n第 1 章 认知虚拟机器人简介\n\n聊天机器人是一种特定类型的软件机器人，用于对用户查询或任何其他类型的对话提供自动回复。\n\
  \n• 虚拟助手是一种特定类型的机器人，它执行助手的职能，协助用户完成其意图执行的功能；例如，设置闹钟、管理日历、阅读邮件、播放歌曲等。\n\n• 聊天机器人和虚拟助手都可以是脚本化的，或者具备人工智能特性。当它们只是简单的脚本，并且不使用自然语言理解（NLU）时，它们不被视为认知聊天机器人或认知虚拟助手。\n\
  \n以下是认知聊天机器人或认知虚拟代理的特性和功能。\n\n• 自然语言理解能力，这意味着机器人具备理解查询或对话意图的智能。\n\n• 从模型中学习的机器学习能力；基本输入包括多个聊天对话、词典和语料库。\n\
  \n• 从错误中学习并增强对对话上下文和意图理解的能力。\n\n• 与其他基于 AI 的服务（如拼写检查器、语言翻译和语气分析器）集成的能力。与普通的聊天机器人或助手相比，这些额外的\
  \ AI 服务使认知聊天机器人或助手变得非常强大。\n\n第 1 章 认知虚拟机器人简介\n\n• 进行更类人对话的能力，因为上述所有特性使得认知代理在对话中比普通机器人更接近人类。\n\
  \n• 自然语言生成（NLG）能力；这些机器人能够根据与聊天机器人对话的用户个性来生成对话回复。\n\n另一个显著差异在于维护对话流程方面。在与聊天机器人交互时，如果你中断对话，机器人将无法记住交互的上下文。另一方面，虚拟助手利用动态对话流技术来理解人类意图，从而丰富与人类的对话。\n\
  \n**对企业与生态系统的影响**\n\n传统上，企业使用网站和网络应用程序作为提供信息和收集客户信息的手段。想想当今的任何企业服务，你会发现它都有一个网站和各种可供授权用户使用的应用程序。用户体验是当今任何数字企业的信条，它们一直在大力投资，通过利用各种技术创新来改善用户体验。在当今世界，数字企业有两个目标。一是通过缩短周期时间和降低成本来提高效率，二是增强用户体验。认知虚拟助手正成为同时满足这两种需求的关键技术。\n\
  \n第 1 章 认知虚拟机器人简介\n\n认知助手正在提供改进的用户体验，同时带来更高的安全性、更简单的业务流程，并减少人类代理的单调工作，使他们能够接受培训以解决更复杂的问题。认知虚拟代理正成为第一道防线，而当\
  \ CVA 无法回答最终用户的问题或解决问题时，人类代理则成为后备力量。\n\n越来越多的网站现在将虚拟助手作为面向客户的交互界面，客户可以在其中寻求信息、提供输入、搜索网站上的特定内容、获取导航帮助、填写表格、请求服务和更新。其中一些由认知技术驱动，而另一些则是简单的脚本化机器人。认知助手正在被迅速采用，大多数大型组织已经实施或正在实施认知虚拟助手技术。\n\
  \n**认知虚拟助手的用例**\n\n**IT 服务的自助服务/服务台**\n\n利用认知虚拟助手实现 IT 服务的自助服务是一个用例，它具有巨大潜力来减少 IT\
  \ 服务台团队的工作量。在竞争异常激烈的环境中，大多数组织的优先事项是降低提供 IT 服务的成本，同时确保用户获得最佳服务。\n\n由于 CVA 可以全天候在线，并且能够同时处理数百个\n\
  \n\n\n同时进行的对话中，IT 服务台里人们等待响应的任何高峰都被消除了。借助 CVA 提供的自助服务功能，用户可以解决大部分与笔记本电脑、台式机、电子邮件、Microsoft\
  \ Office 套件或其他企业应用相关的查询或问题。\n\n第 1 章 认知虚拟机器人简介\n\n像密码重置或访问应用程序帮助这样简单但通常量很大的用例，可以轻松由\
  \ CVA 完成，从而腾出 IT 资源的时间，去帮助用户解决更复杂的问题。\n\n由于 IT 贯穿各个垂直行业，这里创建的用例可以跨多个行业垂直领域复用。许多垂直行业（包括银行与金融服务、旅游、医疗保健、酒店和零售）已经在为\
  \ IT 服务台用例部署 CVA 的道路上。\n\n一些机器人捆绑了 IT 服务台用例，以便更快地采用并实现即用型消费。其中一个这样的机器人框架是 DRYiCE\
  \ Lucy，它为 IT 提供了数百个开箱即用的用例\n([www.dryice.ai/](http://www.dryice.ai/))。\n\n**分类**\n\
  \n分类类别下有许多用例。一些 IT 服务台用例也属于分类范畴。一个分类 CVA 可以询问和探究用户面临的问题，然后将其引导或分类到正确的信息或正确的人工客服那里去解决问题。\n\
  \n为了更好地理解分类用例，可以将其视为一个智能 IVR。IVR 要求用户在电话网络中选择一个选项，并根据所选选项提供信息或转接给人工客服。电信公司、宽带公司或银行的\
  \ IVR 系统是分类如何工作的一个很好的例子。\n\n组织可以利用 CVA 的能力将 IVR 转变为智能通信，从而提升用户体验。\n\n智能 CVA 可以解读用户想要什么，并且比\
  \ IVR 更快地提供正确的信息。由于 CVA 可以与企业应用集成，像查询账户余额或证券余额这样的信息，用 CVA 实现起来很容易。\n\n第 1 章 认知虚拟机器人简介\n\
  \n**线索生成**\n\n线索生成，曾被认为是一项需要人类完成大部分任务的活动，正在迅速实现自动化。\n\n线索生成 CVA 大多嵌入在网站中。当你进入组织网站的任何页面时，会弹出一个\
  \ CVA 弹窗，并与访问者开始对话。\n\n使用 CVA 作为网站上的线索生成前端正在迅速普及，如今，大多数网站都有 CVA 协助访问者获取信息。\n\nCVA\
  \ 在网站上的好处是，访问者可以快速直观地获取信息，无需浏览整个网站并逐页导航来获取所需信息。\n\n在这种情况下，由于访问者正在与 CVA 交互，用户不再是被动的访问者，而是活跃的访问者，他们通过聊天对话提供信息，这些信息随后可用作线索、反馈等。\n\
  \n**电子商务**\n\n电子商务虚拟助手正在帮助数百万消费者通过直观的界面浏览、选择和购买产品和服务。\n\n由于电子商务网站上列出了数百万种产品，用户越来越难以搜索和找到他们想要购买的商品和服务。CVA\
  \ 具有利用机器学习技术进行对话和快速搜索信息的广泛能力，这使得在线买卖变得更加容易。\n\n电子商务 CVA 具有扩展功能和能力，包括匹配买家和卖家的算法。\n\
  \n有了 CVA，整个交易变得自然且双向，这与静态且没有对话流程的网站形成对比。\n\n想象一个场景，你在询问一个产品，CVA 可以精确定位并向你展示你想要的\
  \ exact 产品。在一个静态的\n第 1 章 认知虚拟机器人简介\n\n网站上，如果价格不符合你的预期，你可能不会购买该产品。然而，CVA 可能会查找其他优惠，并根据智能算法为你提供更好的价格。这极大地提升了用户体验。\n\
  \n**与企业应用集成**\n\n我们大多数人都熟悉集成到智能手机或音箱中的流行虚拟助手，例如苹果的 Siri 和亚马逊的 Echo (Alexa)。在企业方面，我们看到领先的\
  \ SaaS 公司正在将流行的消息机器人（如 Facebook Messenger）集成到他们的应用程序中。\n\n主要的 ERP 提供商，如 SAP 和 Oracle，也在为其应用程序开发虚拟助手。该领域的一些聊天机器人示例包括\
  \ Salesforce 的 Einstein Bot。\n\n**任务跟踪与项目管理**\n\n任务管理、提醒和报告是项目中的典型活动。\n\n认知虚拟助手可以查找信息、整理信息并与企业项目管理系统集成，这使得它们非常适合简化和自动化项目管理流程。\n\
  \n用户可以使用 CVA 来设置提醒、请求项目状态、安排会议以及搜索项目相关文档。具有机器学习能力的 CVA 可以轻松完成所有这些任务。\n\n如今，项目跨越多个地理位置和时区，与多个团队的协调对项目经理来说可能是一个挑战。借助使用\
  \ CVA 提供的自动化，曾经复杂的事情现在变得简单了。\n\nCVA 与大多数企业项目管理工具集成，以自动化流程，并为项目经理、协调员和团队成员提供直观、易于使用的用户界面。\n\
  \n第 1 章 认知虚拟机器人简介\n\nCVA 可能还不足以智能到可以规划项目或做出决策，但在不久的将来，这些复杂的任务很可能在 AI 驱动的 CVA 的能力范围之内。\n\
  \n**人力资源**\n\n从招聘到员工生命周期的整个人力资源流程，如今都已相当标准化。大多数企业使用 ERP 产品自动化了这些流程。\n\nCVA 在人力资源流程中非常契合。招聘、日常员工互动、问题解答、评估周期等都可以通过认知虚拟助手完全自动化。\n\
  \nCVA 处理候选人筛选、安排面试、确保面试进行、收集面试反馈、协助填写所需信息表格等任务。\n\nCVA 也用于员工加入组织后的入职流程。这项任务需要 CVA\
  \ 引导员工了解各种政策和程序。\n\n大多数新员工都有疑问，他们依赖同事或伙伴来获取这些信息。部署了 CVA 后，任务变得更快，并消除了依赖性。这带来了更快的入职速度和更好的员工体验。在日常工作中，与流程、政策、政策变更、休假、差旅、薪酬、福利、保险以及人力资源相关领域的查询，都可以由\
  \ CVA 准确且以更短的周转时间进行解答。\n\n**结论**\n\n既然我们已经讨论了认知虚拟助手及其用途，我们准备利用 Watson 平台来构建我们自己的虚拟助手。但在那之前，让我们深入了解\
  \ Watson。\n\n**第 2 章**\n\n**各种认知**\n\n**平台/引擎**\n\n\n\n人工智能（AI）已席卷数字世界。AI 在各类应用和用例中日益重要。它被用于多种个人数字助手，包括\
  \ Siri、Cortana、Alexa 和 Google Assistant，以解决消费者的日常使用场景。*认知计算*定义了一种试图模拟人类思维方式的系统。这两个术语使用相同的技术，包括机器学习、神经网络、自然语言处理和情感分析。IBM\
  \ 将认知计算定义为“能够大规模学习、有目的地推理、并与人类自然交互的系统”。认知计算通过使用自学习算法来实现决策，并让人类生活更轻松，其核心在于人机交互。\n\
  \n通俗地说，当机器模仿人类与*人类思维*相关的认知功能（如学习、推理和解决问题）时，就应用了*人工智能*这一术语。\n\n**Watson**\n\nWatson\
  \ 是 IBM 面向企业级 AI 服务、应用和工具的一套产品组合。它是一系列运行在 IBM 云平台上的云服务，旨在提供卓越的性能。Watson 使用\n\n自然语言处理、自然语言理解以及\n\
  \n© Navin Sabharwal, Sudipta Barua, Neha Anand, Pallavi Aggarwal 2020\n\nN. Sabharwal\
  \ 等，《使用 IBM Watson 引擎开发认知机器人》，\n\n`doi.org/10.1007/978-1-4842-5555-1_2`\n\n第 2 章\
  \ 各种认知平台/引擎\n\n机器学习，将大量非结构化数据转化为具体且有洞察力的信息。\n\nWatson 在电视游戏节目《*Jeopardy*》中击败世界冠军\
  \ Ken\n\nJennings 和 Brad Rutter 后获得了广泛认可。由于《*Jeopardy*》涵盖的主题范围极广，这展示了 Watson 超越数据库分析（相对于更复杂的算法系统）的能力，包括持续学习模型、假设和决策能力，这些能力使其有资格赢得比赛。Watson\
  \ 被认为是一台能够通过将人类认知过程分为四个不同部分来模拟该过程的超级计算机。\n\n第一部分是*观察*的能力。Watson 能在百万分之一秒内从各种网络来源和庞大的数据库存储库中学习信息。\n\
  \n第二部分是*解释*的能力。Watson 消化所有接收到的信息，并将其处理成更高效、更易于处理的格式。由于计算机只理解二进制，Watson 会将数据（无论是文本、语音还是图像）校准为二进制。\n\
  \n然而，在此步骤中，Watson 需要依赖人类来指示它如何解释这些信息。这是通过一个问答模型完成的，在该模型中，Watson 被训练去理解数据超越其已接触事实的含义，然后逻辑地构建事实之间的关系。\n\
  \n第三部分是*评估*，Watson 可以根据从其收集信息的来源收到的反馈来评估信息的相关性。它可以基于评分系统过滤掉不相关的信息。\n\n第四部分是*决策*。在评估信息的准确性后，Watson\
  \ 可以基于信息的现有模式构建多种模式，其方式类似于人脑的做法。这使得 Watson 能够收集信息、\n\n智能地处理信息，并解决与其正在处理的主题相关的问题。通过其假设和证据评分，Watson\
  \ 16\n\n![](img/index-30_1.png)\n\n第 2 章 各种认知平台/引擎\n\n不仅可以基于从外部来源建立的信息提出可能的解决方案，而且可以根据所学内容，调整置信度分数，从而智能地为其正在处理的问题选择最佳解决方案。\n\
  \n**产品与服务**\n\n借助 Watson Assistant 服务，我们可以构建能够理解自然语言输入并与最终用户模拟对话（模仿人与人之间的对话）的应用程序和代理。构建支持\
  \ AI 的生态系统所需的元素如图 2-1 所示。\n\nAI\n\n助手\n\nWatson\n\n同理心\n\n助手\n\n语言\n\n数据\n\nWatson\n\
  \n服务\n\n语音\n\n知识\n\nWatson\n\n视觉\n\n发现\n\n***图 2-1.** Watson 服务*\n\n第 2 章 各种认知平台/引擎\n\
  \n**AI 助手**\n\n助手使您能够将最终用户的请求路由到最佳可能的解决方案。此功能整合了专门用于帮助解决最终用户请求的渠道，并使管理请求变得更加容易。\n\
  \n**Watson Assistant**\n\nWatson Assistant 是一种产品，用于在任何应用程序、设备或渠道中构建对话界面。它知道何时从知识库中搜索答案，何时请求澄清，以及何时将用户引导至人工助手。Watson\
  \ Assistant 运行在 IBM\n\n云上，从而使企业能够将 AI、可扩展性和敏捷性结合起来，以增强最终用户的体验。\n\n**数据**\n\n组织最聪明的资源是其数据。然而，从数据中产生价值是一个复杂且耗时的过程。Watson\
  \ Data 服务使用户能够收集、组织和分析数据。\n\n它自动化了自学习模型的创建、数据标记、数据偏差减少、数据清理和数据可视化。\n\n**Watson Studio**\n\
  \nWatson Studio 通过启用协作式数据科学和机器学习环境，帮助您从数据中提取价值和洞察，以在单个集成环境中构建和训练 AI 模型，并准备和分析数据。\n\
  \n第 2 章 各种认知平台/引擎\n\n**Watson Machine Learning**\n\n此服务使您能够利用数据来创建、训练和部署自学习模型。它利用自动化的协作工作流程来构建智能应用程序。\n\
  \n**Watson Knowledge Catalog**\n\nWatson Knowledge Catalog 是一个协作式资产目录，旨在发现和分类分布在异构来源中的海量数据。\n\
  \n**Watson OpenScale**\n\nWatson OpenScale 是一个可扩展的平台，为用户提供其 AI 系统的清晰准确视图，有助于在其整个生命周期中跟踪和优化其性能。\n\
  \n**知识**\n\n在人工智能领域，学习和知识收集是一个持续的过程。AI 系统不依赖于从数据存储库或现有运行手册中推导结果，而是像人脑一样，通过每次交互的协作学习来构建更新的知识库。Watson\
  \ Knowledge 服务有助于开发这种整体演化的知识系统。\n\n**Watson Discovery**\n\nWatson Discovery 是一种\
  \ AI 搜索技术，可消除数据孤岛并检索埋藏在企业数据中的信息。Watson Discovery 应用了机器学习的最新突破，包括自然 19\n\n第 2 章 各种认知平台/引擎\n\
  \n语言处理和自然语言理解能力，并且易于针对用户领域进行训练。借助 IBM\n\n云的灵活性，用户可以在任何地方操作，提供其规模和敏捷性。用户甚至可以通过使用\
  \ Watson Knowledge Studio 针对特定领域对其进行训练。\n\n**Watson Discovery News**\n\n\n\n数据搅拌的结果不仅取决于数据本身，还受到其他环境因素的影响。例如，如果某国遭受病毒袭击且只有特定药物才能治愈的新闻传出，该药物的股价必然上涨。Watson\
  \ Discovery 新闻是一个强大的工具，能够将这种智能构建到 AI 系统中。它是一个经过预处理的索引数据集，包含以下认知洞察：关键词提取、实体提取、语义角色提取、情感分析、关系提取和类别分类。为了使系统更稳健，系统还提供过去\
  \ 60 天新闻数据的历史搜索功能。\n\n**Watson 自然语言理解（NLU）**\n\n由于社交媒体及其他类似渠道的出现，非结构化数据的数量每时每刻都在成倍增长。这种数据爆炸使得理解人类语言的复杂性变得困难。Watson\
  \ 自然语言理解是一套精炼的自然语言能力，结合了高级文本分析技术，能够从非结构化数据中提取关系、关键词和情感等洞察，并产生有意义的结果。\n\n第 2 章 各种认知平台/引擎\n\
  \n**Watson 知识工作室**\n\n该服务无需编写任何代码，即可教会 Watson 从非结构化数据中发现有意义的洞察。这使得任何领域的领域专家能够协同工作，让\
  \ Watson 理解该领域或行业特有的语言。例如，病毒在医学科学中的定义与在网络安全生态系统中的含义截然不同。该服务还允许 Watson 通过使用 Watson\
  \ 知识工作室中的模型，在 Watson Discovery、Watson 自然语言理解和 Watson Explorer 等多个应用中应用其获取的知识。\n\n\
  **视觉**\n\n作为人类，我们所学到的大部分知识都源于所见之物。然而，对于计算机系统来说，理解此类视觉数据非常困难，更不用说对如此复杂的数据集进行分类和分析。Watson\
  \ 内置了 Watson 视觉识别服务，该服务能够理解视觉数据，并将大量视觉数据组织成结构化的、带标签的数据集。Watson 通过一组相关数据进行训练。例如，你可能想教会\
  \ Watson 区分汽车和卡车。Watson 视觉识别需要接触各种汽车和卡车的图像，这样它才能告诉你，你提供给 Watson 的随机图像是汽车还是卡车。这一复杂功能非常重要，它将\
  \ Watson 的能力提升到了更高的智能水平。\n\n**语音**\n\n与视觉类似，语音是另一个重要的数据生成平台。人类以语音为媒介，无缝地相互交流，以生成、记录和理解数据。Watson\
  \ 的语音转文本和文本转语音服务不仅有助于将数据从一种格式转换为另一种格式，还能让 Watson 理解不同的方言、发音和语言，并以类似人类的声音与用户对话。语音转文本服务可自动将语音数据转换为书面文本。同样，Watson\
  \ 引擎生成的文本数据可以以逼真的人类对话形式传递给最终用户，从而提升用户体验和用户旅程。\n\n**LUIS**\n\nLUIS（语言理解智能服务）是一项微软服务，提供基于云的\
  \ API 服务，将自定义机器学习智能引入用户对话中，并解码自然语言文本以预测对话的含义。基本上，LUIS 的客户端应用是一种对话式应用，它使用自然语言与用户交流以完成任务。LUIS\
  \ 使用机器学习模型，允许开发者构建\n\n\n\n能够以自然语言接收用户输入并从中提取含义的应用程序。LUIS 经过原型设计，可识别对话中的有价值信息，它能够解读用户意图，并从实体中提取有价值的信息，从而作为语言模型提供高质量的输出。LUIS\
  \ 可与 Azure 机器人服务轻松同步，便于创建复杂的机器人。\n\nLUIS 应用程序包含一个特定领域的自然语言模型。编译 LUIS 应用程序有多种方式，包括使用预构建领域模型、自定义模型，或将预构建领域与自定义信息相结合。LUIS\
  \ 拥有许多预构建领域模型，包括意图、表述和实体。它还有助于完成整个设计。LUIS 有几种识别自定义意图和实体的方法，包括机器学习实体、特定或字面实体，或机器学习实体与字面实体的组合。\n\
  \n![](img/index-36_1.jpg)\n\n第 2 章 各种认知平台/引擎\n\n**Azure 产品与服务**\n\n借助 Azure 机器人服务，我们可以构建能够解读自然语言输入并模拟与最终用户对话（模拟人与人之间的对话）的应用程序和代理。构建这样一个由认知服务组成的、支持人工智能的生态系统所需元素如图\
  \ 2-2 所示。\n\n**语言**\n\n**视觉**\n\n**语音**\n\n**Azure**\n\n**服务**\n\n**决策**\n\n**搜索**\n\
  \n***图 2-2.** Azure 服务*\n\n**语言**\n\n语言是确保应用程序和服务能够充分理解非结构化文本的价值，或能够识别说话者话语背后意图的基本要素。它分为三个部分：文本分析、QnA\
  \ Maker 和翻译文本 API。\n\n第 2 章 各种认知平台/引擎\n\n**文本分析**\n\n文本分析是一项基于云的服务，可对输入文本提供高级自然语言处理，并处理四大主要功能：情感分析、关键短语提取、语言检测和实体识别。\n\
  \n[*情感分析* 1](https://docs.microsoft.com/en-in/azure/cognitive-services/text-analytics/how-tos/text-analytics-how-to-sentiment-analysis)\
  \ 通过分析原始文本来发现客户的情绪倾向，判断其是正面还是负面。*关键短语提取* 用于识别短语中的要点。*语言检测* 可解读文本的书写变体，并为请求中提交的每个文档（涵盖多种语言、变体和方言）转换单一语言代码。*实体识别*\
  \ [识别并分类](https://docs.microsoft.com/en-in/azure/cognitive-services/text-analytics/how-tos/text-analytics-how-to-entity-linking)\
  \ [实体](https://docs.microsoft.com/en-in/azure/cognitive-services/text-analytics/how-tos/text-analytics-how-to-entity-linking)，如人物、2\
  \ 地点、组织、日期和时间、数量、百分比以及货币。\n\n**QnA Maker**\n\n这是一项基于云的服务，可帮助在现有数据之上创建对话式问答平台。它通过从半结构化内容（包括常见问题解答、手册和文档）中提取查询来构建知识库。使用来自\
  \ QnA 的最佳答案来回答用户问题，从而创建知识库。QnA Maker 最棒的一点是，它会不断从用户行为中学习，从而变得越来越智能。\n\n1 [`docs.microsoft.com/en-in/azure/cognitive-services/`](https://docs.microsoft.com/en-in/azure/cognitive-services/text-analytics/how-tos/text-analytics-how-to-sentiment-analysis)\n\
  [text-analytics/how-tos/text-analytics-how-to-sentiment-analysis](https://docs.microsoft.com/en-in/azure/cognitive-services/text-analytics/how-tos/text-analytics-how-to-sentiment-analysis)\n\
  2 [`docs.microsoft.com/en-in/azure/cognitive-services/`](https://docs.microsoft.com/en-in/azure/cognitive-services/text-analytics/how-tos/text-analytics-how-to-entity-linking)\n\
  \n\n\n[文本分析/操作指南/文本分析实体链接](https://docs.microsoft.com/en-in/azure/cognitive-services/text-analytics/how-tos/text-analytics-how-to-entity-linking)\n\
  \n第 2 章 各类认知平台/引擎\n\n**翻译器文本**\n\n翻译器文本是一种机器翻译服务，可轻松集成到应用程序、网站、工具和解决方案中。它允许开发者添加多语言用户体验，支持[超过\
  \ 60 种语言](https://docs.microsoft.com/en-in/azure/cognitive-services/translator/languages)3，并可用于文本到文本的语言翻译。\n\
  \n**语音服务**\n\n语音是另一个重要的数据生成平台。人类通过语音作为媒介进行无缝交互，以生成、记录和理解数据。语音服务是音频转文本、语音翻译和文本转语音功能的集合。我们也可以说，它能将口语转换为文本，或使用标准语音从文本生成自然的信息语音。它还提供说话人识别服务，可识别单个说话者，或将语音用作身份验证机制，因为每个人的声音都具有独特的特征，就像指纹一样可以识别个人身份。\n\
  \n**搜索**\n\nLUIS 中的搜索服务赋予应用程序跨网络搜索海量无广告信息的能力。它有助于从数十亿网页、图像、视频和新闻搜索结果中找到精确需求。\n\n\
  **必应拼写检查**\n\n必应拼写检查执行上下文相关的语法和拼写检查。必应开发了一种基于网络的拼写检查器，具备机器学习和统计机器翻译能力。它基于大量的网络搜索和文档数据，可帮助用户检查拼写错误和俚语，并识别名称与品牌名称之间的差异等。\n\
  \n**必应网页搜索**\n\n这是一种 RESTful 服务，可为用户查询提供即时解答。搜索结果可轻松配置为包含网页、图像、视频、新闻等内容。必应网页搜索根据订阅的搜索相关性提供结果。\n\
  \n**必应实体搜索**\n\n必应实体搜索将搜索查询发送至必应，并获取相关结果，包括实体和地点。地点包括餐厅和其他本地商业中心。如果查询指定了本地企业名称或询问某类业务（例如，我附近的餐厅），必应会返回地点。如果查询指定了知名人物和地点（旅游景点、州、国家、地区），必应会返回实体。\n\
  \n**决策**\n\n决策 API 内置了多项服务，如内容审查器、异常检测器和个性化器。内容审查器是一项 Azure 认知服务，是一种机器辅助的内容审查 API，可增强图像、文本和视频的审查能力。它能检测攻击性和不良图像、种族歧视和成人视频内容，以及粗俗和不良文本。当发现此类内容时，该服务会添加适当的标签并将其标记给内容审查员。然后，应用程序可以根据定义的规则管理被标记的内容，并为用户维护预期的环境。软件工程师可以使用内容审查器服务的几个例子包括：审核产品目录和其他用户生成内容的在线市场、审核用户生成游戏制品和聊天室的游戏公司，以及审核用户以图像、文本和视频形式生成内容的社交消息平台。\n\
  \n**视觉**\n\n作为人类，我们学到的大部分知识都来自所见之物。然而，对于计算机系统来说，理解此类视觉数据非常困难，更不用说分类和分析如此复杂的数据集了。Azure\
  \ 的认知服务使得准确识别和分析图像、视频和数字墨迹中的内容成为可能。\n\n**计算机视觉**服务使用先进的算法处理图像并返回信息。要分析图像，您可以上传图像或通过\
  \ URL 指定图像。根据用户感兴趣的视觉特征，图像处理算法可以相应地分析内容，并提供关于其特征的见解。从数千个可识别的物体、生物、场景和动作中，它能识别图像中的视觉特征，并能从包含数千个全球标志的数据库中识别图像或视频中的商业品牌。\n\
  \n**认知服务人脸 API**提供用于检测、识别和分析图像中人脸的先进算法。人脸信息在许多不同的软件场景中非常有用。当前流行的场景包括安全、自然用户界面、图像内容分析与管理、移动应用和机器人技术。\n\
  \n**墨迹识别器**是一种 AI 服务，可识别数字手写内容、常见形状以及墨迹文档的布局。它能识别常见的几何形状——例如数字墨迹中的多边形——以及它们的几何热点和布局坐标。墨迹识别器有潜力为笔记记录、表单填写、内容搜索和文档注释增加价值。\n\
  \n**亚马逊 AI 服务**\n\n亚马逊网络服务（AWS）一直是技术如何影响和增强用户体验的颠覆者。借助 AWS 人工智能服务，亚马逊将这种体验变为现实。无论是在亚马逊无人商店的无缝结账，还是让\
  \ Alexa 在疲惫的一天结束时为你煮咖啡、打开电视、播放音乐，AWS AI 服务都在与用户的每一次交互中日益成熟。亚马逊的 AI 服务赋予用户自然语言、视频分析、虚拟助手、个性化推荐和预测等能力，而无需具备深厚的机器学习专业知识。这对企业非常有利，因为它能轻松实现业务与技术的对话与集成，并促成更快、更具价值的结果。\n\
  \n**产品与服务**\n\n亚马逊 AI 的演进始于 20 世纪 90 年代末，当时它有一个发现代理，可以根据订阅者喜爱的作者、类型或其他参数推荐可能喜欢的书籍。自那时起，亚马逊的\
  \ AI 不断演进和成熟，现在可以在自然语言理解、物体和人脸识别、聊天机器人、语音对话、自动语音识别等领域运行复杂算法。亚马逊 AI 服务还满足了企业扩展人工智能以驱动业务成果的一个非常重要的需求。其\
  \ AI 服务可以独立使用，也可以相互结合使用，为用户提供速度、敏捷性和灵活性，以开展有效的业务运营并增强最终用户体验。\n\n**Amazon Lex**\n\
  \nAmazon Lex 是亚马逊 AI 旗下的一项服务，您可以使用它构建能够识别、理解并以语音转文本或文本转语音形式进行对话、实现类人对话的聊天机器人。Amazon\
  \ Lex 可用于创建使用语音或文本作为聊天媒介的对话式界面。它利用自然语言理解来理解\n\n\n对话上下文和自动语音识别技术可将语音转换为文本。这使得用户无需掌握复杂技术就能构建高级聊天机器人。Lex\
  \ 使用与 Amazon Alexa 相同的深度学习算法，并将其开放给开发者，从而缩短开发周期、简化开发流程，构建出复杂且支持自然语言的对话机器人。可以毫不夸张地说，Lex\
  \ 普及了深度学习技术，并构建出智能且响应迅速的机器人。由于 Lex 可根据使用情况轻松扩展或缩减，它为运行服务所需的 IT 基础设施带来了弹性。以下是 Amazon\
  \ Lex 的其他优势。\n\n• **易于使用：** 它提供了一个易于使用的控制台，可快速构建你的聊天机器人。如果你不熟悉 Amazon Lex 控制台，它还提供了预定义的机器人。Lex\
  \ 还具有这样的能力：即使只提供几个短语，它也能构建完整的自然语言模型，并智能地将机器人训练到更高水平。\n\n• **无缝部署和扩展：** 使用控制台，开发者可以立即构建、测试和部署机器人。它还提供了轻松集成到各种应用程序的能力，并能轻松地将语音或文本聊天机器人发布到移动设备、Web\
  \ 应用以及 Facebook Messenger、Slack、Twilio 等聊天服务。由于 Lex 采用 SaaS 模式，其基础设施完全具有弹性，你无需担心随着用户量和对话量的增减而扩展基础设施。\n\
  \n• **成本效益：** Lex 采用高性价比的模式。与其他服务不同，Lex 不收取任何预付费或最低费用。它还提供 Amazon Lex 免费套餐，让用户无需任何初始投资即可试用\
  \ Lex。Amazon Lex 采用按使用量付费的模式，每次请求的成本很低，从而优化了用户的成本支出。\n\n• **与 AWS 的内置集成：** Lex 拥有许多内置集成——例如\
  \ Lambda、MobileHub 和 CloudWatch——允许用户与许多其他 AWS 服务集成，如 Cognito、DynamoDB、Amazon Polly\
  \ 等。此功能使 Lex 能够利用 AWS 平台进行监控、安全、业务逻辑、用户认证、存储和移动开发。\n\n**Amazon Polly**\n\n人类语音是最强大的沟通方式之一。同一个词，根据其语调、语境和音高，可能具有不同的含义。AWS\
  \ Polly 是一项基于云的服务，它使用先进的深度学习技术将文本转换为类人语音。它支持多种语言，并拥有一个强大的逼真语音库，使其能够灵活地用于构建支持语音的应用程序，并根据业务场景和最终用户的情感选择合适的语音。Polly\
  \ 使用多种神经文本转语音（NTTS）声音，这些声音每天都在进化和学习。NTTS 技术还赋予 Polly 合成新闻播音员说话风格的能力，这种风格针对新闻叙述风格进行了个性化定制。Polly\
  \ 可用于增强移动应用、电子学习软件、游戏、面向视障人士的无障碍应用程序、物联网及许多其他领域的人类语音。以下是 Polly 的一些优势。\n\n• **丰富的语音和语言库：**\
  \ 与其他服务不同，Polly 提供了大量语言可供选择。它还拥有一个逼真的男性和女性语音库。它同时提供 NTTS 和 TTS 技术，以合成具有高发音准确性的卓越自然语音。\n\
  \n• **低延迟：** 为了提供逼真的对话和对话体验，服务必须具备低延迟和快速响应时间。当文本发送到 Polly 的 API 时，它会返回音频\n\n\n\n\
  以流的形式传输到应用程序，使语音能够立即播放，从而实现低延迟的类人对话与交互。\n\n**Amazon Rekognition**\n\nAWS 的人脸识别技术称为\
  \ Rekognition。这项基于网络的服务使开发者能够为应用程序添加图像和视频分析功能。借助 Rekognition 服务，应用程序可以检测、记忆并理解画面中面部和物体的情绪。更令人印象深刻的是，利用计算机视觉科学家开发的深度学习技术，Rekognition\
  \ 能够读取、分析并存储每天接触到的数百万张图像，且无需任何机器学习方面的先验知识。\n\n它还能提取任何图像或视频中的文字，例如字幕、产品名称、街道名称等。Rekognition\
  \ 正在学习存储在其存储库中的大量视频、图像及其他视觉数据。它从这些数据中学习，同时*持续地*基于置信度评分算法对数据进行标记。\n\n该服务还具备超越物体识别的活动与场景检测能力。例如，Rekognition\
  \ 能够进行实时和批量视频分析。当 Rekognition 捕获视频时，它不仅捕获特定帧，还能智能地捕获并理解该帧前后帧的内容，从而将内容置于上下文中。Rekognition\
  \ 还能识别用户可能不希望出现在应用程序中的不当视觉内容，并提供详细标签，帮助用户根据需要控制不想要的内容。它不仅能够基于已获取的数据存储库识别和标记人脸及视觉内容，还足够成熟，能够识别与人脸识别能力相关的任何情绪。该服务还具备名人识别功能。\n\
  \n另一个独特的 Rekognition 功能称为*人物追踪*。它利用一种名为*骨架建模*的技术，追踪画面中是否有人物存在，即使人物被视线遮挡也能识别。\n\n\
  理解 Rekognition 服务的优势至关重要。\n\n• **低成本：** 与其他 AWS AI 服务一样，Rekognition 采用按需付费模式，无需前期成本。用户只需为已分析的图像和视频以及存储的人脸元数据付费。\n\
  \n• **与其他 AWS 服务集成：** Rekognition 可与 Lambda 和 AWS S3 等其他 AWS 服务无缝协作。作为对 AWS S3 事件的响应，可直接从\
  \ Lambda 调用 Rekognition API。由于 AWS Lambda 和 AWS S3 都会根据应用程序的需求自动扩展，因此您可以构建可扩展、经济实惠且可靠的图像分析应用程序。\n\
  \n还可以直接对存储在 Amazon S3 中的图像运行分析，而无需加载或移动数据。\n\n• **完全托管：** 尽管请求数量大幅增加，但应用程序的延迟仍保持一致。此功能可确保无缝且丰富的最终用户体验。\n\
  \n**Amazon Translate**\n\nAmazon Translate 是一项翻译服务，通过调用 Translate API，消除了在应用程序中构建翻译功能的复杂性。这使得开发者能够通过单个\
  \ API 和几行代码构建多语言应用程序。研究表明，当个人接触到以其母语呈现的对话或信息界面（如网站、客服、博客和帖子）时，用户粘性更高。手动完成这项工作意味着很长的周转时间，更不用说翻译任何组织拥有的所有数字资产所涉及的高昂成本了。\n\
  \nAmazon Translate 基于神经机器翻译技术构建。\n\n\n\n翻译服务利用深度学习模型，基于本地方言、品牌特定风格、语言特定构成等方面，以高准确度和自然流畅的翻译效果，对数字资产进行语言翻译并实现自动化。它通过机器学习和持续学习来逐步提升准确性和效率。Amazon\
  \ Translate 可以与其他服务集成，例如 Amazon Comprehend，用于从社交媒体或其他短文本中提取预定义的实体、情感或关键词。它还可以与 Amazon\
  \ Polly 集成，将翻译后的数据转换为语音并传递给用户。\n\n第 2 章 各种认知平台/引擎\n\n目前，Amazon Translate 支持 25 种语言，并支持近\
  \ 600 种翻译组合。在未指定内容源语言的情况下，Translate 能够高精度地检测源语言。它还具备批量翻译能力，适用于数据量非常大的场景；以及实时翻译能力，用于按需提供内容翻译，例如在机器人界面中。\n\
  \n**Amazon Transcribe**\n\nAmazon Transcribe 利用一种称为自动语音识别的深度学习过程，使开发者能够将语音转录为文本。通过使用此\
  \ API 服务，可以分析存储在 Amazon S3 中的音频文件，并以转录文本格式返回音频文件的内容。\n\n过去，我们不得不依靠人工来将此类音频转换为文本转录。借助\
  \ Amazon Transcribe，整个过程实现了自动化、可扩展、成本效益高且周转时间更快。它具备智能能力，可以自动添加标点和格式，从而使转换后的输出更加准确。音频可以批量处理或近乎实时地处理，这意味着可以输入实时音频数据流，并并行获得转录文本形式的输出。\n\
  \n此 API 会为每个单词添加时间戳，这在您想要在原始音频中查找特定单词或在视频的特定位置插入字幕时非常有用。Amazon Transcribe 足够灵活，可以将新单词添加到基础词汇表中，以生成更准确的转录。这允许添加特定领域的单词和短语，例如产品名称、技术术语或个人姓名、地点等。此外，Translate\
  \ 可以与其他 Amazon API（如 Amazon Translate）集成，从而实现音频和启用音频的视频内容的本地化。\n\n第 2 章 各种认知平台/引擎\n\
  \n**Dialogflow**\n\nDialogflow 是谷歌旗下基于自然语言对话的人机交互技术平台。谷歌提供了 Speaktoit，这是一个适用于 Android\
  \ 和 iOS 的虚拟伙伴，能够执行任务并以自然语言回答用户查询。Speaktoit 创建了一个自然语言处理引擎，有助于处理对话上下文，如对话历史、位置和用户偏好。它作为一个自然语言理解平台，使得将对话式用户界面设计并整合到移动端、网页和设备等任何平台变得容易。它还有助于为用户提供与产品互动的新颖且引人入胜的方式。\n\
  \n该技术擅长同时分析来自客户的多种输入，包括文本或音频输入（例如来自手机或录音）。它还有助于通过文本或合成语音等多种方式回应用户。这为用户提供了与产品互动的新方式，通过构建由谷歌\
  \ AI 技术驱动的、引人入胜的语音和文本对话界面，例如语音应用和聊天机器人。这是一个端到端的工具，由自然语言理解驱动，以促进丰富且自然的对话。\n\n**谷歌产品与服务**\n\
  \n借助谷歌 AI 认知服务，我们可以构建能够解读自然语言输入、模拟与最终用户对话以及模仿人与人对话的应用程序和代理。接下来将介绍可用于构建认知虚拟代理的谷歌服务。\n\
  \n第 2 章 各种认知平台/引擎\n\n**语音转文本**\n\nGoogle Cloud Speech-to-Text 通过一个易于使用的 API，利用强大的神经网络模型，使开发者能够将音频转换为文本。Speech-to-Text\
  \ API 可识别 120 种语言和版本，以支持您的全球用户群。该服务还具有启用语音命令和控制、转录来自呼叫中心的音频等功能。\n\n利用谷歌机器学习技术，它可以处理实时流式音频或预先录制的音频。\n\
  \n为了执行语音识别，Cloud Speech-to-Text 有三种主要方法。\n\n• **同步识别：** 将音频数据发送到 Speech-to-Text\
  \ API，然后对该数据执行识别，并在所有音频处理完毕后返回结果。同步识别请求仅限于持续时间不超过 1 分钟的音频数据。\n\n• **异步识别：** 将音频数据发送到\
  \ Speech-to-Text API，并以一个长时间运行的操作开始。使用此操作，您可以定期处理以获取识别结果。异步请求可以处理任何持续时间长达 480 分钟的音频数据。\n\
  \n• **流式识别：** 对在 gRPC 双向流中提供的音频数据执行识别.4。对于实时识别场景，流式请求被设计用于从麦克风录制实时音频。流式识别在捕获音频的同时提供阶段性结果，从而允许在用户说话时实时显示结果。\n\
  \n4 [`www.grpc.io/docs/guides/concepts.html#bidirectional-streaming-rpc`](http://www.grpc.io/docs/guides/concepts.html#bidirectional-streaming-rpc)\n\
  \n第 2 章 各种认知平台/引擎\n\n**文本转语音**\n\nGoogle Cloud Text-to-Speech 可将文本转换为语音，支持超过 30\
  \ 种人类语言及其变体中的 180 多种语音。它应用了语音合成方面的创新研究，并利用谷歌强大的神经网络技术来提供高保真音频。此 API 使交互变得简单，并可改变客户服务、设备交互以及更多应用。\n\
  \n文本转语音使开发者能够创建听起来自然、合成的人类语音，作为可播放的音频。它可以轻松地将任意字符串、单词和句子转换为说话人的声音。想象一下，您有一个语音助手应用程序，能够以自然语言的可播放音频形式接收用户反馈。将此\
  \ API 集成后，应用程序可以执行操作，然后以人类语音的形式向用户提供反馈。\n\n**语言翻译**\n\nLanguage Translation API\
  \ 使用谷歌预训练的神经机器翻译来提供快速、强大的结果。在 Translation API 和相同的客户端库中，用户现在甚至可以选择使用自定义模型翻译。翻译功能易于集成到应用程序、网站、工具和解决方案中。它支持[超过\
  \ 100 种语言](https://docs.microsoft.com/en-in/azure/cognitive-services/translator/languages)的多语言用户体验\
  \ 5 fr，涵盖从南非荷兰语到祖鲁语的翻译，并允许用户在超过 50 种语言对中构建自定义模型。\n\n**自然语言**\n\nNatural Language\
  \ Services 使用谷歌机器学习从非结构化文本中提取洞察。它利用机器学习来提取结构。5 [`cloud.google.com/translate/`](https://cloud.google.com/translate/)\n\
  \n第 2 章 各种认知平台/引擎\n\n\n\n文本的含义。通过此服务，用户可以提取关于人物、地点和事件的信息，并更好地理解社交媒体情绪和客户对话。自然\n\n\
  语言处理提供了分析文本并将其与 Google Cloud Storage 上的文档存储集成的能力。\n\n使用 AutoML Natural Language，用户可以上传自己的数据，\n\
  \n并在自定义的高质量机器学习模型上进行训练，通过调用 API 来分类、提取和检测情绪，无需任何额外工作即可获得相关洞察。Natural Language API\
  \ 强大的预训练模型通过提供情感分析、实体分析、实体情感分析、内容分类和语法分析等功能，使开发变得简单。\n\n**结论**\n\n本章介绍了认知虚拟助手领域的一些主要参与者。IBM\
  \ Watson、Microsoft Azure、Amazon Web Services 和 Google\n\nCloud 平台都提供了基于云的服务，我们可以利用这些服务来创建认知虚拟\n\
  \n助手。用户可以从单一云服务中评估和利用所有必需的服务，或者通过跨云选择最佳服务来采用多云架构。这个领域正在快速变化，了解哪个提供商提供哪些服务对于架构师和开发人员来说至关重要，以便根据需求选择最佳且最具成本效益的选项。\n\
  \n![](img/index-52_1.jpg)\n\n**第 3 章**\n\n**机器人框架**\n\n[机器人框架](https://dev.botframework.com/)为开发人员提供了一个平台，用于构建智能对话代理（机器人），并通过\
  \ Skype、Slack、Facebook Messenger、Telegram 等消息渠道连接它们。\n\n机器人框架与 Watson、LUIS、\n\n\
  Lex 和 Dialogflow 等认知服务相结合，为用户提供丰富且有用的交互。\n\n图 3-1 描绘了机器人框架及其与认知服务和渠道的集成。\n\n***图\
  \ 3-1.** 机器人框架架构*\n\n机器人框架有助于开发和绑定应用程序的各个组件。\n\n它是一个用于构建、连接、测试和部署智能机器人的平台接口。它有助于构建和连接智能机器人，以便与用户交互。\n\
  \n© Navin Sabharwal, Sudipta Barua, Neha Anand, Pallavi Aggarwal 2020\n\nN. Sabharwal\
  \ 等人，《使用 IBM Watson 引擎开发认知机器人》，\n\n`doi.org/10.1007/978-1-4842-5555-1_3`\n\n第 3\
  \ 章 机器人框架\n\n连接到多个渠道是机器人框架的特性之一。\n\n它支持 Skype、Slack、Facebook Messenger 以及其他此类消息服务。\n\
  \nBot Connector 提供以下服务以简化机器人和用户之间的通信。\n\n• 机器人注册\n\n• 连接和消息路由，包含一系列\n\n可触达用户的渠道\n\
  \n• 对话和状态管理\n\n接下来，我们将讨论几个流行的机器人框架及其一些重要特性。用户可以根据功能、定价以及它如何最适合应用程序的需求来选择机器人框架。\n\
  \n**Microsoft Bot Framework**\n\nMicrosoft Bot Framework 拥有全面的开源 SDK 和工具，可以轻松地将机器人连接到流行的渠道和设备。它通过原生集成\
  \ Azure 认知服务，赋予机器人说话、倾听和理解用户的能力。\n\nMicrosoft Bot Framework1 pr 为开发人员提供了快速构建机器人的\
  \ SDK。它与 Microsoft AI 服务和 LUIS 框架紧密集成，可快速创建强大的对话能力。\n\n与其他机器人框架一样，Microsoft 提供了连接器，用于连接到各种消息平台，例如\
  \ Twitter、Slack 和 Skype。它有一个独特的功能，使您能够搜索和发现现有的机器人及其提供的服务。\n\n1 [`dev.botframework.com`](https://dev.botframework.com/)\n\
  \n第 3 章 机器人框架\n\n开源 Microsoft SDK 提供了与\n\n\n\nAzure 认知服务让开发者能够更简单、更快速地创建直观的对话式机器人。微软提供的示例和代码有助于快速启动机器人项目，并缩短完成项目所需的时间。\n\
  \n微软机器人框架提供的实用工具范围包括：\n\n翻译服务集成、对话状态管理、\n\n调试工具以及可嵌入的网页聊天控件。针对不同领域的各种用例和示例的代码示例可供开发者使用。\n\
  \n**微软机器人框架功能**\n\n微软机器人框架集成了语音、语言理解、翻译以及 Azure 认知服务提供的其他服务。来自 Azure 的云服务构成了任何机器人的骨干。有一个庞大的\
  \ .NET 开发者社区，他们发现通过使用 SDK 创建认知机器人，可以轻松地将他们在 C# 中的框架和语言技能提升到新的水平。\n\n该 SDK 是开源的，并包含关于如何构建、测试以及将机器人投入生产的生命周期指导。这种生命周期指导是微软机器人框架独有的，使得新的认知机器人开发者更容易学习和实施。\n\
  \n微软的企业解决方案库与机器人框架集成，这省去了在其他机器人框架中可能需要的大量管道工作。这种与微软企业生态系统的开箱即用集成使其成为微软客户的一个不错选择。\n\
  \n![](img/index-55_1.jpg)\n\n第 3 章 机器人框架\n\n许多企业开始将 Cortana、Teams 和 Skype 作为标准协作平台。微软机器人框架提供的深度集成和示例使开发者更容易利用现有的协作工具部署，并将机器人嵌入这些工具中。用户可以继续使用他们选择的渠道，并通过熟悉的企业协作平台用户界面与机器人进行通信。\n\
  \n**微软机器人连接器**\n\n机器人连接器 or2 连接到文本/短信、Office 365 邮件、Skype、Slack 以及其他服务（见图 3-2）。\n\
  \n***图 3-2.** 机器人连接器*\n\n**机器人 SDK**\n\n开源的微软机器人 SDK 拥有构建机器人所需的所有工具，包括生命周期指导和大量以代码和构建块形式提供的示例。\n\
