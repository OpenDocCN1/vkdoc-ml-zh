  \n***图 4-54.** 在机器人上进行测试*\n\n**对话与条件**\n\n**对话节点**\n\n一个对话节点包含一个条件和一个响应。\n\n• 条件：触发特定对话节点所需的信息或检查。它可以是一个意图、一个实体、意图和实体的组合、实体值或一个上下文变量。Watson\
  \ 还提供了一些预定义条件可供使用；例如，true、false、welcome、anything_else、conversation_start 等。\n\n\
  ![](img/index-104_1.jpg)\n\n第 4 章 使用 Watson Assistant 构建您的第一个机器人\n\n• 响应：节点响应字段中提到的响应；当条件为真时执行。\n\
  \n**单节点**\n\n一个单节点可以处理简单的用户查询（即简单的一问一答）。但实际用例更为复杂；机器人和用户之间需要进行来回沟通。您可以在同一层级中使用多个节点。您也可以使用子节点来创建工作流。\n\
  \n\n\nWatson 采用自上而下的方式处理或遍历树中的所有节点。它从第一个节点开始，一直遍历到最后一个节点。\n\n***图 4-55.** 单个节点表示*\n\
  \n**多个节点**\n\n在遍历节点时，如果条件匹配，则会进入/触发该节点并执行工作流。它会执行每个子节点，直到条件满足为止。\n\n![](img/index-105_1.jpg)\n\
  \n第 4 章 使用 Watson Assistant 构建你的第一个机器人\n\n***图 4-56.** 多个节点间的遍历*\n\n**带有子节点的节点**\n\
  \n假设用户的查询与节点 2 中的条件匹配。当从节点 1 遍历时，它会触发节点 2，然后评估子节点（子节点 1、子节点 2）。满足条件的子节点将被执行。之后，程序会退出子节点工作流，并继续向下移动，直到父分支中的最后一个节点（即节点\
  \ 3）。\n\n![](img/index-106_1.jpg)\n\n![](img/index-106_2.jpg)\n\n第 4 章 使用 Watson\
  \ Assistant 构建你的第一个机器人\n\n***图 4-57.** 带有子节点的节点间的遍历*\n\n现在你已经了解了如何使用对话，让我们看看可用的各种选项。在“对话”页面上，单击**创建对话**，如图\
