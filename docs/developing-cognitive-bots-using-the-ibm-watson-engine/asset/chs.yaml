  \n4. 对话返回到原始的“重置密码”工作流。\n\n5. 用户完成了“重置密码”场景。\n\n第 5 章 Watson 智能体的高级概念\n\n**消歧**\n\
  \n消歧是指系统处理模糊数据并从中理解含义的能力。\n\n在 Watson 对话中，当用户的表述可能表示多种含义，且 Watson 中配置的两个或多个用例存在冲突时，就会遇到歧义问题。\n\
