  \ 章 使用 Watson Assistant 构建你的第一个机器人\n\n**响应** 会执行目标节点上定义的响应，无论条件是否满足。\n\n***图 4-73.**\
  \ 跳转到（响应）——在同一层级节点间跳转*\n\n**结论**\n\n本章深入探讨了 IBM Cloud 提供的 Watson Assistant 服务。内容涵盖了我们如何使用该服务从零开始构建一个虚拟认知机器人。\n\
  \n我们从设置账户开始，并尝试了内置助手提供的机器人。你学习了基本概念，如意图、实体和用于配置用例的对话。我们详细介绍了 Watson 对话提供的所有功能，以使机器人能够与用户进行无缝对话。\n\
  \n**第 5 章**\n\n**Watson Agent 的**\n\n**高级概念**\n\n你已经学会了如何创建一个简单但有用的聊天机器人。本章涵盖高级主题，例如上下文实体、上下文变量、槽位和离题处理，以及如何处理多个意图。IBM\
  \ Watson 平台的这些高级功能有助于解决复杂的用例并创建高级工作流。\n\n**上下文实体**\n\n在上一章中，我们使用 @Policies 实体来训练\
  \ IBM Watson 引擎，以判断对话中提到的保单是健康保险还是汽车保险。\n\n\n\n另一种直接标记实体的方式是：在输入意图的变体时，可以将变体的一部分标记为实体值，这被称为*标注*。\n\
  \n被标记为实体值的意图部分被称为*提及*。\n\n以这种方式标记的实体被称为*上下文实体*。\n\n© Navin Sabharwal, Sudipta Barua,\
  \ Neha Anand, Pallavi Aggarwal 2020\n\nN. Sabharwal 等人著，《使用 IBM Watson 引擎开发认知机器人》，\n\
  \n`doi.org/10.1007/978-1-4842-5555-1_5`\n\n第 5 章 Watson 智能体高级概念\n\n你可以通过一个示例更好地理解这一点。我们以\
  \ Outlook 或 Gmail 的“重置密码”用例为例，为其定义各种元素。\n\n• **意图**：#Reset_Password\n\n• **实体**：Mailbox\n\
  \n• **实体值**：Outlook, Gmail\n\n• **变体**：Reset Password\n\n• 帮我重置密码。\n\n• 我想重置 Outlook\
  \ 中的密码。\n\n• 我想重置 Gmail 中的密码。\n\n• 重置我的 Gmail 密码。\n\n• 重置我的 Outlook 密码。\n\n在上述意图中，Gmail\
  \ 和 Outlook 是可以标记为上下文实体的实体值。它们会被自动添加到实体中，并显示在实体的标注部分。标注选项卡会显示这些实体被标记的意图。\n\n图 5-1\
  \ 展示了添加到意图中的变体。\n\n![](img/index-118_1.jpg)\n\n第 5 章 Watson 智能体高级概念\n\n***图 5-1.**\
  \ 已添加的变体*\n\n接下来，我们从这些意图中标记实体。\n\n我们将选择要添加为实体值的部分或术语。选中后，会弹出一个窗口，如图 5-2 所示。\n\n\
  如果该实体尚未定义，你可以在**输入实体名称**字段中添加实体。\n\n这会添加该实体以及我们之前标记的文本部分（即 Outlook），如图 5-3 所示。\n\
