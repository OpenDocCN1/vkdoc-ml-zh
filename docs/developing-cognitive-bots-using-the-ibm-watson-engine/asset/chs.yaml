  \ Watson Assistant 构建你的第一个机器人\n\n默认情况下，对话有两个节点，名为“欢迎”和“其他内容”，如图 4-59 所示。这些名称不是固定的，你可以修改它们。\n\
  \n• **欢迎节点**：机器人的欢迎消息，当用户开始与机器人对话时显示给用户。\n\n• **其他内容节点**：创建对话时随欢迎节点一起出现的一个特殊节点。如果层次结构中的任何节点都没有匹配的条件，则执行此节点。如果工作流匹配了任何其他节点的条件，则不执行此节点。\n\
