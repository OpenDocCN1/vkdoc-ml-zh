  \ Cloud Functions 的流程。接下来，我们将通过 IBM Cloud 中的 Cloud Functions 创建一个操作来调用 API。\n\n\
  **创建操作**\n\n定义 Cloud Functions 操作，如图 7-47 所示。\n\n1.  输入你的操作名称（例如，[action_name]，\n\
  \    Tone-Analyzer）。\n2.  在 **封闭包** 下创建一个包，并指定任意 [package_name]（例如，Assistant-Function）。\n\
  3.  选择 **运行时** 语言。在此示例中，我们\n    使用了 Node.js。\n4.  点击 **创建** 按钮。\n\n***图 7-47.**\
  \ IBM Cloud 创建操作页面*\n\n第 7 章 与高级服务集成\n\n在你的 Cloud Functions 操作中，替换用于调用 IBM Tone\
  \ Analyzer 服务的现有示例代码，如图 7-48 所示。\n\n在 **url** 字段和 **iam_apikey** 字段中，替换你在创建 Tone\
  \ Analyzer 服务时复制的相同 URL 和 API 密钥。\n\nfunction main(param) {\n\nconst ToneAnalyzerV3\
