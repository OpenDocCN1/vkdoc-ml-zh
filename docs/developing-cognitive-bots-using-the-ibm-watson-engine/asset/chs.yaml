  \n• **自然语言处理（NLP）**：根据企业需求，利用任何现有的 NLP 引擎。它使用 NLP 通过理解含义、确定适当操作并响应用户来解释用户的意图。\n\n\
  • **企业集成**：与多个企业系统和知识源集成，使用户能够将 Lucy 作为来自不同来源的单一信息源。\n\n• **企业级安全**：提供基于端点的安全性和第三方集成的数据区域灵活性。当前版本的\
  \ Lucy 支持 SAML 和 SSO。\n\n• **灵活计费**：提供多种计费模板和使用类别的定制化计费模式。\n\n• **上下文切换**：多级上下文切换允许用户返回到未完成的对话或偏离主题的对话。\n\
  \n• **按需扩展**：为满足业务需求而构建的可扩展平台。\n\n• **全渠道**：提供多种开箱即用的渠道，易于配置。\n\n• **开箱即用的第三方集成**：提供与运维管理、机器人流程自动化和\
  \ CRM 提供商的开箱即用第三方集成。\n\n• **配置管理**：作为认知虚拟助手，Lucy 可以充当用户与跨领域和业务职能的多个企业应用之间的接口。\n\n\
  • **平台无关性**：跨平台工作，包括 Skype、Facebook Messenger、Microsoft Teams、Slack 等。\n\n**结论**\n\
  \n本章概述了开发者可以选择的多种机器人框架，以便通过集成认知平台快速创建认知机器人应用。\n\n**第 4 章**\n\n**使用 Watson Assistant**\n\
  \n**构建你的第一个机器人**\n\nWatson Assistant 是 IBM 提供的一项认知云服务，它使开发者能够更轻松地构建对话界面并将其嵌入到任何应用程序中。Watson\
  \ Assistant 与 IBM Watson 平台提供的多种认知服务集成，通过拼写检查、语气分析器和其他服务来丰富对话内容。\n\n\n\nWatson Assistant\
  \ 可以轻松集成到 Facebook Messenger 和 Slack 等流行的消息平台。开发者还可以选择\n\n创建自定义用户界面应用程序，并通过 API\
  \ 与配置的工作流进行交互。\n\n接下来，我们将逐步创建一个简单的 CVA。首先，创建一个 IBM Cloud 账户，我们将使用该账户来使用 Watson Assistant\
  \ 服务。\n\n**创建 IBM Cloud 账户**\n\n导航至 [`cloud.ibm.com/registration`](https://cloud.ibm.com/registration)\
  \ 注册一个 IBM\n\nCloud 账户。图 4-1 显示了 IBM Cloud 账户注册页面。\n\n© Navin Sabharwal, Sudipta\
