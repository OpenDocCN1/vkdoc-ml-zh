  \n**使用其他高级 Watson 服务**\n\n**Watson Discovery 服务**\n\nWatson Discovery 服务使您能够快速摄取、规范化、丰富、索引和搜索非结构化数据。它简化了与丰富和分析大型数据集相关的基础设施、规模和算法挑战。它使您能够生成多种格式的数据，包括\
  \ PDF、Word 文档、HTML 和 JSON 类型文件。\n\n***图 7-21.** Watson Discovery 服务架构*\n\n第 7 章\
  \ 集成高级服务\n\nWatson Discovery 只需几个步骤即可分析和总结大型非结构化数据，创建提供所需信息的查询，然后将这些洞察集成到新应用程序或现有解决方案中。\n\
  \nIBM Watson Discovery 汇集了一套功能丰富的集成式自动化 Watson API，可执行以下操作：\n\n• 训练非结构化数据。上传您自己的文档，或从\
  \ Box、Salesforce、Microsoft SharePoint Online、IBM Cloud Object Storage 和 Microsoft\
  \ SharePoint 2016 数据源进行爬取，或使用 Discovery 工具进行网络爬取。Discovery 环境可以容纳多个私有集合。每个集合都与一个配置配对，该配置告诉\
  \ Discovery 如何上传和处理文件。我们可以指定如何转换数据集中的不同文件类型，并选择要对每个文档文本应用哪些自然处理增强，以及如何清理和规范化生成的数据。\n\
  \n• 将要摄取、索引、规范化的文档/数据分组，并准备好进行查询。对文档应用增强。通过自然语言理解（NLU），Discovery 会自动对文本字段应用实体提取、情感分析、类别分类和概念标记等增强。\n\
  \n• 数据增强后，构建查询以搜索信息。\n\n让我们深入探讨 Watson Discovery 服务，了解如何根据输入查询从数据集合中获取结果。\n\n要设置\
