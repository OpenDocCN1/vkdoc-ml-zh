    Chapter 3 Bot Frameworks


    **Botpress**


    Botpres[s3](#index_split_000.html#p56) is an open source platform popular among
    developers. It is a lightweight framework for rapidly prototyping and building
    conversational bots. Similar to the Microsoft Bot Framework, it comes bundled
    with various features to make it easier for developers to build bots that can
    converse over voice and chat channels.


    Powered by an expanding community, Botpress boasts a GUI-driven


    approach to create compelling bots where there is less need to code.


    If you are constrained on time and need a lightweight engine to create your bot
    or are experimenting with bot frameworks, Botpress may be your platform of choice.


    Since Botpress is a completely standalone framework (unlike other


    frameworks), it is flexible, extensible, and integratable with most cognitive
    offerings.


    It is available in-premise, so you don’t have to depend on cloud


    providers. If your use case needs in-premise deployment due to security or compliance
    concerns, Botpress may be your platform of choice.


    Botpress comes with the following components.


    • **Natural language understanding (NLU) engine**. It


    does post processing of text using Natural Language


    processing Algorithm. Natural language understanding


    analyzes text to extract the information (concepts,


    entities, keywords, topics, categories, relationships, and


    so forth). The structured data is ready to be consumed


    by the other components. This module comes bundled


    with the Botpress Framework.'
