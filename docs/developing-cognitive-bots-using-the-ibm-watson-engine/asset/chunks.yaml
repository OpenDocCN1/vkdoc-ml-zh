- fmt: '# Chapter 1 Introduction to Cognitive Virtual Bots


    Reasoning and computation, problem solving and decision making, comprehension,
    and the production of language. Cognitive processes use existing knowledge and
    generate new knowledge.


    In simple terms, cognition is the human ability that helps us acquire knowledge,
    perform all our mental functions, understand our environment, and create new knowledge.


    Cognitive or intelligent virtual assistants aspire to be more human-like and have
    similar capabilities that humans have, albeit we still have miles to go before
    that becomes reality.


    Cognitive virtual agents (CVAs) possess some of the capabilities mentioned, but
    they may not have the ability to compete with humans when it comes to understanding
    the vast array of contexts there are in our world. However, there are certain
    areas in which they supersede humans, because they do not have the biological
    limitations of processing power, and they can scale and communicate with millions
    of users simultaneously, which a human being cannot.


    Let’s define a cognitive virtual assistant. A CVA is a software agent that performs
    tasks for an individual or a system based on text, voice, gestures, or visual
    input. It has varying degrees of ability to understand the input provided, interpret
    the input, apply step-by-step logic, probe the user for the intent and context
    of the conversation, and as a result, provide information or execute the intended
    task. It can understand a conversation in natural language and maintain the context
    of the conversation to achieve the objective.


    Some CVAs are able to interpret voice commands by first using speech to text,
    while others can recognize images and take actions accordingly.


    When it comes to responding, a CVA can respond using text when the mode of communication
    is a messaging system, it can use voice to respond over voice channels, and it
    could show gestures, expressions, or movements to express itself in a robotic
    appearance. CVAs are also embedded in devices like speakers and automobile navigation
    systems. Some specific voice-enabled examples of these devices are Google Home
    and Amazon Echo.


    ## Chapter 1 Introduction to Cognitive Virtual Bots


    CVAs are available on multiple devices and interfaces, and can be accessed via
    mobile handheld devices, laptops, or PCs. They can also be accessed through different
    messaging platforms, like Facebook Messenger, Skype, Telegram, and so forth.


    CVAs are embedded for mass use as mobile applications, which are called *digital
    personal assistants*. A few examples of digital personal assistants are Siri by
    Apple, Google Assistant by Google, and Cortana by Microsoft. Digital personal
    assistants help users with tasks such as search, navigation, and communication.
    Digital personal assistants need to be activated with a command so that they know
    that the user is trying to initiate a conversation. Some examples of these voice
    commands are “OK Google,” “Alexa,” and so forth.


    Virtual assistants can be leveraged to provide a variety of services. The following
    are a few examples.


    - Act as a search and retrieve agent to retrieve results from various sources
    for things like weather, stock updates, market information, prices, catalogs,
    interest rate, and so forth.

    - Act as configuration agents to configure alerts, alarms, create to-do lists,
    shopping lists, travel itineraries, and so forth.

    - Play videos or music from catalogs and subscriptions, such as Spotify, Netflix,
    Amazon Prime, and so forth.

    - Act as an IT service desk agent to resolve problems and issues with IT equipment.

    - Act as an assistant in specialized services, such as healthcare, legal, administration,
    and finance.

    - Act as an embedded agent in devices (speakers, televisions, and other equipment).


    ## Chapter 1 Introduction to Cognitive Virtual Bots


    - Act as agents in vehicles and cars to aid with navigation and operate entertainment
    devices such as music players and so forth.


