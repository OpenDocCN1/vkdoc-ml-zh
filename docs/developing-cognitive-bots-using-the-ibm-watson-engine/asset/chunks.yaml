    Botpress Framework 捆绑在一起。'
  raw: 'Azure Cognitive Services, which makes it simpler and faster for developers
    to create intuitive conversational bots. The samples and code provided by Microsoft
    help kick-start bot projects and cuts down on the time required to complete them.


    The range of utilities by the Microsoft Bot Framework include


    translation services integration, conversation state management,


    debugging tools, and embeddable web chat control. Code samples for


    various use cases and examples from different domains are available for developers
    to use.


    **Microsoft Bot Framework Features**


    The Microsoft Bot Framework integrates voice, speech, language


    understanding, translation, and other services available from Azure Cognitive
    Services. The cloud services from Azure form the backbone of any bot. There is
    a large community of .NET developers who find it easy to take their framework
    and language skills in C# to the next level by using the SDK to create cognitive
    bots.


    The SDK is open source and includes lifecycle guidance on how to


    build, test, and take a bot to production. This lifecycle guidance is unique to
    the Microsoft Bot Framework and makes it easier for new cognitive bot developers
    to learn and implement.


    Microsoft’s repository of enterprise solutions integrate with the


    Bot Framework, which takes out a lot of plumbing work that may be


    required in other bot frameworks. This out-of-the-box integration with the Microsoft
    enterprise ecosystem makes it a good option for Microsoft customers.


    ![](index-55_1.jpg)


    Chapter 3 Bot Frameworks


    Many enterprises are starting to use Cortana, Teams, and Skype as


    standard collaboration platforms. The deep integration and samples


    provided with the Microsoft Bot Framework make it easier for developers to leverage
    the existing deployment of collaboration tools and embed the bot within these
    tools. Users can continue to use their channel of choice and communicate with
    the bot with the familiar user interface of an enterprise collaboration platform.


    **Microsoft Bot Connector**


    The Bot Connect[or2](#index_split_000.html#p55) connects to text/SMS, Office 365
    mail, Skype, Slack, and other services (see Figure [3-2](#index_split_000.html#p55)).


    ***Figure 3-2.** Bot Connector*


