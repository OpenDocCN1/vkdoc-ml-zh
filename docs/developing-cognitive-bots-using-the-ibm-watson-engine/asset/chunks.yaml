- fmt: '# The Outcome of Data Churning


    The outcome of data churning is not only a function of the data itself but is
    also influenced by other environmental factors. For example, if there were news
    of a country being hit by a virus that is only curable by a particular drug, the
    stock price of that drug would invariably rise. `Watson Discovery` news is a powerful
    tool with the ability to build such intelligence into an AI system. It is an indexed
    dataset that is pre-enriched with the following cognitive insights: keyword extraction,
    entity extraction, semantic role extraction, sentiment analysis, relation extraction,
    and category classification. To make the system more robust, the historical search
    is available for the past 60 days of news data.


    ## Watson Natural Language Understanding (NLU)


    The volume of unstructured data is multiplying manifold every moment thanks to
    the advent of social media and other such channels. It has become difficult to
    understand the complexities of the human language due to this data explosion.
    `Watson Natural Language Understanding` is a set of refined natural language capabilities
    with advanced text analytics to derive insights like relationships, keywords,
    and sentiments from such unstructured data and create meaningful outcomes.


    ## Chapter 2 Various Cognitive Platforms/Engines


    ### Watson Knowledge Studio


    This service enables to teach `Watson` to discover meaningful insights in unstructured
    data without writing any code. This allows the domain SMEs in any field to work
    collaboratively to empower `Watson` to understand the language specific to that
    domain or industry. For example, the definition of a virus in medical science
    is very different from the meaning of a virus in the cybersecurity ecosystem.
    It also enables `Watson` to apply the knowledge it has acquired across multiple
    applications by using models from `Watson Knowledge Studio` in `Watson Discovery`,
    `Watson Natural Language Understanding`, and `Watson Explorer`.


    ### Vision


    As humans, a lot of what we learn is through the things that we see. However,
    for a computer system it is very hard to understand such visual data, let alone
    classify and analyze such complex data set. `Watson` is built with the `Watson
    Visual Recognition` service, which understands visual data and organizes large
    volumes of visual data into structured, labeled data sets. `Watson` is trained
    using a set of related data. For example, you may want to teach `Watson` to recognize
    a car from a truck. `Watson Visual Recognition` needs to be exposed to a variety
    of car and truck images so that it can tell you if the random image that you expose
    `Watson` to is a car or a truck. This complex feature is very significant and
    takes `Watson`''s capabilities to the next level of intelligence.


    ### Speech


    Like visuals, speech is another significant platform for data generation. Humans
    seamlessly interact with each other using speech as a medium to generate, document
    and understand data. `Watson`''s `Speech to Text` and `Text to Speech` services
    not only help in converting data from one format to another, it also enables `Watson`
    to understand different dialects, pronunciations, languages and talk back to the
    user in a human-like voice. The `Speech to Text` service automates converting
    spoken data to written transcripts. Similarly, textual data generated by the `Watson`
    engine can be delivered in form of a real human-like conversational to the end
    user, thus enhancing the user experience and the user journey.


    ### LUIS


    `LUIS` (Language Understanding Intelligence Service) is a Microsoft service that
    provides a cloud-based API services that bring custom Machine Learning Intelligence
    to a user’s conversation and in decoding Natural Language text to predict the
    meaning of the conversation. Basically, a client application for `LUIS` is a conversational
    application that communicates with a user in natural language to complete a task.
    `LUIS` uses machine learning models to allow developers to build'
