    另一种直接标记实体的方式是：在输入意图的变体时，可以将变体的一部分标记为实体值，这被称为*标注*。


    被标记为实体值的意图部分被称为*提及*。


    以这种方式标记的实体被称为*上下文实体*。


    © Navin Sabharwal, Sudipta Barua, Neha Anand, Pallavi Aggarwal 2020


    N. Sabharwal 等人著，《使用 IBM Watson 引擎开发认知机器人》，


    `doi.org/10.1007/978-1-4842-5555-1_5`


    第 5 章 Watson 智能体高级概念


    你可以通过一个示例更好地理解这一点。我们以 Outlook 或 Gmail 的“重置密码”用例为例，为其定义各种元素。


    • **意图**：#Reset_Password


    • **实体**：Mailbox


    • **实体值**：Outlook, Gmail


    • **变体**：Reset Password


    • 帮我重置密码。


    • 我想重置 Outlook 中的密码。


    • 我想重置 Gmail 中的密码。


    • 重置我的 Gmail 密码。


    • 重置我的 Outlook 密码。


    在上述意图中，Gmail 和 Outlook 是可以标记为上下文实体的实体值。它们会被自动添加到实体中，并显示在实体的标注部分。标注选项卡会显示这些实体被标记的意图。


    图 5-1 展示了添加到意图中的变体。


    ![](img/index-118_1.jpg)


    第 5 章 Watson 智能体高级概念


    ***图 5-1.** 已添加的变体*


    接下来，我们从这些意图中标记实体。


    我们将选择要添加为实体值的部分或术语。选中后，会弹出一个窗口，如图 5-2 所示。


    如果该实体尚未定义，你可以在**输入实体名称**字段中添加实体。


    这会添加该实体以及我们之前标记的文本部分（即 Outlook），如图 5-3 所示。


    我们将该实体命名为 @Mailbox，Outlook 被添加到此实体中。


    ![](img/index-119_1.jpg)


    ![](img/index-119_2.jpg)


    第 5 章 Watson 智能体高级概念


    ***图 5-2.** 向实体添加值（上下文实体）*


    ***图 5-3.** 已向实体添加值（上下文实体）*


    ![](img/index-120_1.jpg)


    ![](img/index-120_2.jpg)


    第 5 章 Watson 智能体高级概念


    返回技能页面并点击该实体。创建的实体 @Mailbox 带有 Outlook 值，如图 5-4 和 5-5 所示。


    ***图 5-4.** 实体页面上反映的实体*


    点击 **@Mailbox** 实体，然后点击**标注**选项卡。你会看到你在输入变体时标记的标注和实体，如图 5-6 所示。


    ***图 5-5.** 已向实体添加值（上下文实体）*


    ![](img/index-121_1.jpg)


    第 5 章 Watson 智能体高级概念


    ***图 5-6.** 已添加的标注*


    如果我们选择另一个变体并尝试标记一个实体以添加为值，之前标记的实体（即 @Mailbox）会作为一个可选选项出现。


    如果实体值属于一种新类型的实体，你可以通过同一个下拉菜单继续添加它们。


    如果实体值已经存在，而你标记了同义词，Watson 引擎会智能地将其添加为同义词，而不是新的实体值。你可以通过添加更多变体并标注这些实体来尝试这些选项。IBM
    Watson 会利用其词典和智能自动完成此操作。


    **上下文变量**


    上下文变量是在节点内定义的，并带有默认值。它非常有用，因为你可以捕获或存储信息，并使用这些信息来执行进一步的操作，例如以下情况。


    ![](img/index-122_1.jpg)


    第 5 章 Watson 智能体高级概念


    • **从应用程序传递上下文：** 通过设置上下文变量并将该上下文变量传递给对话，信息从 API/应用程序传递到对话。


    • **在节点之间传递上下文：** 你可以将上下文变量的值从一个节点传递到另一个节点。

