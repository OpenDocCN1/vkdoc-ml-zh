    ## Creating a Skill for the Use Cases


    Before proceeding with the skill creation, let’s take a deep dive into what a
    skill is and how it is used to create a bot.


    A skill is a container for a specific category of use cases. Think of a skill
    as a repository of use cases that belong to specific domain. For example, if you
    are creating a bot for an organization that plans to use it for multiple domains—like
    HR, finance, end consumers, and IT— you create multiple skills. The bot is able
    to answer queries across all of these domains. Thus, one bot, or `Watson Assistant`,
    in this scenario can connect to multiple skills.


    There are two IBM Watson services that respond to users’ questions.


    `Watson Assistant` uses a workflow or dialog-based approach to configure the system
    to answer a user’s queries. The `Watson Discovery` service uses a search-and-extract
    method to answer user queries and return matching documents. We cover the `Watson
    Assistant` service first to configure our bot, and then provide an overview and
    integration of the `Watson Discovery` service.


    Corresponding to the two services, there are two types of skills that you can
    create in Watson.


    - **Dialog skill:** This corresponds to the `Watson Assistant` service. It contains
    the dialog workflow, which is a step-by-step process on how the conversation flows
    between the user asking the questions and the Watson assistant.'
