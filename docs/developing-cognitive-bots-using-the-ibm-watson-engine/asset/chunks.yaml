    第五章 Watson 助手的高级概念


    ***图 5-40.** 显示选项结果*


    消歧提供了一种简单的方法来处理意图冲突或用户提供的信息不完整的情况。因此，它会根据输入查询时返回的置信度分数来触发相关的用例。置信度分数是 Watson 设定的一个阈值，用于识别从返回的意图数组中匹配到的最高意图。


    **处理多个意图**


    在某些场景下，用户提出的查询包含多个意图，例如：“重置密码并解锁账户。”机器人一次只能执行一个操作。机器人必须理解用户提出的问题包含两个不同的意图，然后逐步执行这两个用例。


    第五章 Watson 助手的高级概念


    为了实现这一点，需要有一个节点来区分不同的意图。


    让我们使用 Watson 的一个名为*置信度分数*的功能来解决这个用例。置信度分数是在查询输入系统时分配给意图数组的一个分数。


    我们将在节点中使用置信度分数，该节点会检查针对输入查询返回的最高意图的置信度分数。它们的定义如下。


    • `Intents[0].confidence` 是最高匹配意图的置信度

    • `Intents[1].confidence` 是第二高匹配意图的置信度


    `Intents[1].confidence` 检查第二高匹配意图的置信度分数是否大于 20%。`Intents[0].confidence` 检查最高匹配意图的置信度是否大于
    95%。用于检查置信度分数的值可以根据用例进行更改。


    如果这些条件都满足，机器人会回复一条消息：“您想执行以下哪个选项？”它会呈现映射到这两个意图的两个选项。


    让我们看看如何在对话中配置这一点。这些用例已配置好，如图 5-41 所示。


    • 在 Outlook 中重置密码

    • 在 Gmail 中重置密码

    • 解锁账户


    ![](img/index-150_1.jpg)


    第五章 Watson 助手的高级概念


    ***图 5-41.** 添加的用例节点*


    提供问候消息的欢迎节点会等待用户输入。添加一个 `$disambiguated` 上下文变量，并将其值设置为 `null`，如图 5-42 所示。


    ![](img/index-151_1.jpg)


    ![](img/index-151_2.jpg)


    第五章 Watson 助手的高级概念


    ***图 5-42.** 在欢迎节点中添加的消歧上下文变量*


    现在，让我们添加一个用于区分意图的节点。在已配置的用例上方添加一个节点，并输入置信度条件为 `(intents[1].confidence>0.2 && intents[0].confidence<0.95)`。这会检查返回的意图的置信度分数。意图数组按降序存储意图的置信度分数。因此，`intents[0]`
    具有最高的置信度分数，其次是 `intents[1]`，如图 5-43 所示。


    ***图 5-43.** 定义的置信度分数条件*


    ![](img/index-152_1.jpg)


    第五章 Watson 助手的高级概念


    为了将捕获到的意图显示为可供用户选择的选项，我们可以将这些值设置在上下文变量中，并进一步将它们作为选项重用，如图 5-44 所示。


    ```

    "intent0label": "<? intents[0].intent.replace(''_'','' '') ?>",

    "intent0score": "<? T(String).format(''%.0f'',intents[0].confidence*100) ?>",

    "intent1label": "<? intents[1].intent.replace(''_'','' '') ?>",

    "intent1score": "<? T(String).format(''%.0f'',intents[0].confidence*100) ?>",

    "disambiguated": true

    ```


    ***图 5-44.** 定义的用于捕获最高匹配意图的上下文变量*


    接下来，我们需要显示这些选项。我们可以在**并回复**字段中执行此操作，如图 5-45 所示。


    ![](img/index-153_1.jpg)


    ![](img/index-153_2.jpg)


    第五章 Watson 助手的高级概念


    ***图 5-45.** 匹配意图的选项*

