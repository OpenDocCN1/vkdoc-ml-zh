    ## Chapter 3 Bot Frameworks


    **Botpress**


    Botpress 是一个在开发人员中流行的开源平台。它是一个用于快速原型设计和构建对话式机器人的轻量级框架。与 Microsoft Bot Framework
    类似，它捆绑了各种功能，使开发人员能够更轻松地构建可以通过语音和聊天渠道进行对话的机器人。


    在不断扩大的社区推动下，Botpress 采用 GUI 驱动的方法来创建引人注目的机器人，从而减少编码需求。如果您时间紧迫，需要一个轻量级引擎来创建您的机器人，或者正在尝试不同的机器人框架，Botpress
    可能是您的平台选择。


    由于 Botpress 是一个完全独立的框架（与其他框架不同），它灵活、可扩展，并且可以与大多数认知产品集成。它可以在本地部署，因此您不必依赖云提供商。如果您的用例由于安全或合规性问题需要本地部署，Botpress
    可能是您的平台选择。


    Botpress 包含以下组件。


