- fmt: "# Advanced Concepts of Watson Agent\n\nThere is another way in which entities\
    \ can be marked directly: when entering variations for intent. A part of the variation\
    \ can be marked as an entity value, which is known as an *annotation*.\n\nThe\
    \ part of the intent that is marked as entity value is called a *mention*.\n\n\
    The entities marked in this manner are called *contextual entities*.\n\n© Navin\
    \ Sabharwal, Sudipta Barua, Neha Anand, Pallavi Aggarwal 2020\n\nN. Sabharwal\
    \ et al., *Developing Cognitive Bots Using the IBM Watson Engine*,\n[https://doi.org/10.1007/978-1-4842-5555-1_5](#index_split_000.html#p116)\n\
    \n## Understanding with an Example\n\nYou can better understand this with an example.\
    \ Let’s use a `Reset Password` use case for Outlook or Gmail. Let’s define various\
    \ elements for it.\n\n- **Intent**: `#Reset_Password`\n- **Entity**: `Mailbox`\n\
    - **Entity Values**: `Outlook`, `Gmail`\n- **Variations**: `Reset Password`\n\
    \  - Help me reset my password.\n  - I want to reset my password in Outlook.\n\
    \  - I want to reset my password in Gmail.\n  - Reset my Gmail password.\n  -\
    \ Reset my Outlook password.\n\nIn the preceding intents, `Gmail` and `Outlook`\
