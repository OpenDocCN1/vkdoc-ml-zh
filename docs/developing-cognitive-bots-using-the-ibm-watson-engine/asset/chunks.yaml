    5\. Enter the variations defined earlier, as shown in


    Figur[e 4-29](#index_split_000.html#p86). These are the sample variations that
    are fed into the Watson engine for training.


    ***Figure 4-29.** Intent page for adding the variations*


    Add at least five examples/variations as intent examples. A higher


    number of variations is better for training purposes, which results in better
