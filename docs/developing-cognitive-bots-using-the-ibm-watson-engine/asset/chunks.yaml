- fmt: '# Translation and Automation


    `translation` and automates language translations using deep learning models to
    translate digital assets with high accuracy and natural-sounding translation based
    on aspects like local dialects, brand-specific style, language-specific composition,
    and so on. It uses machine learning and continuous learning to drive accuracy
    and efficiency over time. `Amazon Translate` can integrate with other services,
    like `Amazon Comprehend`, for extracting predetermined entities, sentiments, or
    key words from social media or other short-form text. It can also integrate with
    `Amazon Polly` to convert to speech and deliver the translated data to the user.


    ## Chapter 2 Various Cognitive Platforms/Engines


    At present `Amazon Translate` supports 25 languages and supports over almost 600
    translation combinations. In cases where the source language of the content is
    not specified, `Translate` can detect the source language with high accuracy.
    It also has the capability to perform batch translation where the volume of data
    is very large or real-time translation to deliver on demand translation of content
    like in case of a bot interface.


    ### Amazon Transcribe


    `Amazon Transcribe` leverages the deep learning process called automatic speech
    recognition service that enables developers to transcribe speech to text. By using
    this API service, it is possible to analyze an audio file that is stored in `Amazon
    S3` and return the content of the audio file in a transcribed text format.


    Historically, we have had to use humans to convert such audio to text transcriptions.
    With `Amazon Transcribe` the entire process is automated, scalable, cost effective
    and has a faster turnaround time. It has the intelligence and the ability to automatically
    add punctuations and formatting thus making the output more accurate in terms
    of the conversion. The audio can be processed in batches or in near real time,
    which means that it is possible to input live stream of audio data and get the
    output in transcribed text in parallel.


    This API puts a timestamp against each word and is quite useful in case you want
    to find a particular word in the original audio or insert subtitles into a particular
    slot in a video. `Amazon Transcribe` is flexible enough for new words to be added
    to the base vocabulary to generate more accurate transcriptions. This allows addition
    of domain-specific words and phrases like product names, technical terminology,
    or names of individuals, places, and so forth. Moreover, `Translate` can integrate
    with other Amazon API like `Amazon Translate` thus enabling localization of audio
    and audio-enabled video content.


    ## Chapter 2 Various Cognitive Platforms/Engines


    ### Dialogflow


    `Dialogflow` is a Google-owned platform of human-computer interaction technologies
    based on natural language conversations. Google provides `Speaktoit`, a virtual
    buddy for Android and iOS that performs tasks and answers users’ queries in a
    natural language. `Speaktoit` has created a natural language processing engine
    that helps in conversation context like dialogue history, location, and user preferences.
    It acts as a natural language understanding platform that makes it easy to design
    and summarize a conversational user interface into any of the platforms like mobile,
    web, and devices. It also helps in providing new and engaging ways for the users
    to interact with the products.


    This technology is proficient in analyzing multiple inputs at the same time from
    customers, including text or audio inputs (like from a mobile phone or voice recording).
    It also helps to revert to the users in a couple of ways, either through text
    or with synthetic speech. This provides users new ways to interact with the product
    by building engaging voice and text-based conversational interfaces such as voice
    apps and chatbots powered by Google''s AI technology. This is an end-to-end tool
    that is powered by natural language understanding to facilitate rich and natural
    conversations.


    ### Google Products and Services


    With the help of the Google AI cognitive service, we can build applications and
    agents that can decipher natural language input, simulate a conversation with
    end users, and emulate a human-to-human conversation. The Google services available
    for us to build cognitive virtual agents are described next.


    ## Chapter 2 Various Cognitive Platforms/Engines


    ### Speech-to-Text


    Google Cloud Speech-to-Text provides developers to convert audio to text by using
    powerful neural network models in an easy-to-use API. The Speech-to-Text API recognizes
    120 languages and versions to support your global user base. This service also
    has the functionality to enable voice command-and-control, transcribe audio from
    call centers, and more.


    Using Google machine learning technology, it can process real-time streaming or
    prerecorded audio.


    To perform speech recognition, Cloud Speech-to-Text has three main methods.


    - **Synchronous recognition:** It sends audio data to the Speech-to-Text API,
    then performs recognition on that data, and returns results after all audio has
    been processed. Synchronous recognition requests are limited to audio data of
    1 minute or less in duration.

    - **Asynchronous recognition:** It sends audio data to the Speech-to-Text API
    and starts with a Long Running Operation. Using this operation, you can periodically
    process for recognition results. Asynchronous requests can handle audio data of
    any duration up to 480 minutes.

    - **Streaming recognition:** It performs recognition on audio data provided within
    a gRPC bidirectional stream[.4](#index_split_000.html#p49) For real-time recognition
    scenarios, streaming requests are designed and used for recording live audio from
    a microphone. Streaming recognition provides interval results while audio is being
    captured, hence allowing the result to appear in between while the user is speaking.


    4 [http://www.grpc.io/docs/guides/concepts.html#bidirectional-streaming-rpc](http://www.grpc.io/docs/guides/concepts.html#bidirectional-streaming-rpc)


    ## Chapter 2 Various Cognitive Platforms/Engines


    ### Text-to-Speech


    Google Cloud Text-to-Speech converts text into speech in more than 180 voices
    in more than 30 human languages and variants. It applies innovative research in
    speech synthesis and uses Google’s powerful neural network technology to deliver
    high-fidelity audio. This API makes user interaction easy and can transform customer
    services, device interaction and many more applications.


    Text-to-speech makes it possible for developers to create natural-sounding, synthetic
    human speech as playable audio. It easily converts arbitrary strings, words, and
    sentences into the sound of a person speaking. Imagine that you have an application
    that is a voice assistant with the capability to take feedback from a user as
    playable audio in natural language. Integrating it with this API, the application
    might take an action and then provide human speech as feedback to the user.


    ### Language Translation


    Language Translation API uses Google’s pretrained neural machine translation to
    deliver fast, powerful results. Within Translation API and same client library,
    users can now even choose to use custom model translations. Translations is easy
    to integrate in applications, websites, tools, and solutions. It supports multilanguage
    user experiences in more than 100 languages, [5 fr](#index_split_000.html#p50)om
    Afrikaans to Zulu translation, and allows users to build custom models in more
    than 50 language pairs.


    ### Natural Language


    Natural Language Services derives insights from unstructured text using Google
    machine learning. It uses machine learning to extract the structure 5 [https://cloud.google.com/translate/](https://cloud.google.com/translate/)


    ## Chapter 2 Various Cognitive Platforms/Engines'
