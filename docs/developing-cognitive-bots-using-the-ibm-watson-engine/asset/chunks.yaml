- fmt: "# Chapter 5 Advanced Concepts of Watson Agent\n\n***Figure 5-31.** Trying\
    \ out the use case*\n\n***Figure 5-32.** Digression done*\n\nYou can see that\
    \ the conversation took the following route.\n\n1. The user selects the `Reset\
    \ Password` use case.\n2. The intent changes to the `Configure Out of Office`\
    \ use case.\n3. The dialog moves the user to the correct workflow and completes\
    \ the `Configure Out of Office` workflow.\n4. The dialog moves back to the original\
    \ `Reset Password` workflow.\n5. The user completes the `Reset Password` scenario.\n\
    \n## Disambiguation\n\nDisambiguation is the ability of the system to take ambiguous\
    \ data and make sense out of it.\n\nAmbiguity in terms of Watson conversations\
    \ is encountered when the utterances from a user can mean one of many things and\
    \ two or more use cases configured in Watson are in conflict.\n\nWe’ll use an\
    \ example to better understand the disambiguation feature.\n\nLet’s use the `Reset\
    \ Password` use case for this scenario. The user simply asks `reset my password`\
    \ without specifying either Gmail or Outlook. Since the user has provided ambiguous\
    \ or incomplete information, the system should probe to disambiguate the scenario.\
    \ Let’s get this configured to see how it works.\n\nYou can download the skill\
    \ JSON that has the use case configured for disambiguation.\n\nGo to GitHub (https://github.com/watson05/Cognitive-Bot)\
    \ to download `Advance_Topics-Disambiguation.json`.\n\nThe intents and variations\
