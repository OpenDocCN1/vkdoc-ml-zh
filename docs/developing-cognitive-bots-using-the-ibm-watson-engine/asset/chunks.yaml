- fmt: '# interfaces for employees, customers, and partners


    In fact, the possibility is that everyone will have their own digital personal
    assistants connected to specialized consumer and enterprise bots for leveraging
    the specific capabilities of those bots. This is akin to an API marketplace where
    programmers can choose specific APIs and create mashup applications.


    The personal bot will have adaptors or connectors to connect to various bots,
    along with a mechanism to decide which specific intent or topic should go to which
    bot for resolution. There is no standardization today for bot-to-bot communications,
    but in the future, it is entirely possible that a universal bot framework and
    a mechanism to exchange data between bots is created and standardized. This will
    help address the problems of multiple bots and increase the pace of innovation
    in this space, with many individuals and startups creating bots for specific tasks.


    The existence of a global bot, a universal interconnected hive brain that is able
    to see all conversations, transactions, and interactions will have both positive
    and negative consequences; positive in the sense that it is able to connect both
    environments. The first is the physical environment of the planet we live in,
    and the second one includes the objects that we have created in the digital environment
    in the form of processes and systems, data, and so forth. Such an ecosystem will
    have the potential to simplify and change the lives of everyone on the planet
    by automatically completing transactions, setting reminders, coordinating between
    people and processes, processes and other processes, people and other people,
    and machines and other machines. Personal bots will talk through this universal
    API to other bots and complete things that humans do by talking to others, emailing,
    and meeting people.


    Bots will handle many of our mundane daily tasks in the home and in the workplace.
    They will progress to independently evaluate situations and solve problems by
    providing proactive suggestions rather than being reactive. The ability of bots
    to integrate with massive back-end databases and machine learning engines will
    lead to a situation where the bot knows more about the environment by virtue of
    faster processing of data and access to a larger and better database. The role
    of the CVA will evolve from something that sits passively and gives suggestions
    to something that makes decisions on behalf of a human. That will be a tipping
    point when humanity and machines switch roles.


    On the flip side, the universal bot will know everything about everyone. Imagine
    the power of the universal bot to change preferences of people, to alter the way
    we think, to try and alter our social and political views slowly but surely by
    feeding us the information that best suits its needs rather than ours. Imagine
    the power of the data that resides with the universal bot; it knows the emotions
    and intent of people at a global scale and cannot use it to advance a particular
    agenda, or manipulate the economic and political systems but perhaps alter humanity
    forever.


