    any conditions in the child nodes. It moves to the next sibling node to continue
    the evaluation of conditions in a top-down fashion.


    ***Figure 4-72.** Jump To (If bot recognises) with True condition for node to
    node on the same level*


    ![](index-115_1.jpg)


