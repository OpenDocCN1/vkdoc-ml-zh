    第 2 章 各类认知平台/引擎


    **翻译器文本**


    翻译器文本是一种机器翻译服务，可轻松集成到应用程序、网站、工具和解决方案中。它允许开发者添加多语言用户体验，支持[超过 60 种语言](https://docs.microsoft.com/en-in/azure/cognitive-services/translator/languages)3，并可用于文本到文本的语言翻译。


    **语音服务**


    语音是另一个重要的数据生成平台。人类通过语音作为媒介进行无缝交互，以生成、记录和理解数据。语音服务是音频转文本、语音翻译和文本转语音功能的集合。我们也可以说，它能将口语转换为文本，或使用标准语音从文本生成自然的信息语音。它还提供说话人识别服务，可识别单个说话者，或将语音用作身份验证机制，因为每个人的声音都具有独特的特征，就像指纹一样可以识别个人身份。


    **搜索**


    LUIS 中的搜索服务赋予应用程序跨网络搜索海量无广告信息的能力。它有助于从数十亿网页、图像、视频和新闻搜索结果中找到精确需求。


    **必应拼写检查**


    必应拼写检查执行上下文相关的语法和拼写检查。必应开发了一种基于网络的拼写检查器，具备机器学习和统计机器翻译能力。它基于大量的网络搜索和文档数据，可帮助用户检查拼写错误和俚语，并识别名称与品牌名称之间的差异等。


    **必应网页搜索**


    这是一种 RESTful 服务，可为用户查询提供即时解答。搜索结果可轻松配置为包含网页、图像、视频、新闻等内容。必应网页搜索根据订阅的搜索相关性提供结果。


    **必应实体搜索**


    必应实体搜索将搜索查询发送至必应，并获取相关结果，包括实体和地点。地点包括餐厅和其他本地商业中心。如果查询指定了本地企业名称或询问某类业务（例如，我附近的餐厅），必应会返回地点。如果查询指定了知名人物和地点（旅游景点、州、国家、地区），必应会返回实体。


    **决策**


    决策 API 内置了多项服务，如内容审查器、异常检测器和个性化器。内容审查器是一项 Azure 认知服务，是一种机器辅助的内容审查 API，可增强图像、文本和视频的审查能力。它能检测攻击性和不良图像、种族歧视和成人视频内容，以及粗俗和不良文本。当发现此类内容时，该服务会添加适当的标签并将其标记给内容审查员。然后，应用程序可以根据定义的规则管理被标记的内容，并为用户维护预期的环境。软件工程师可以使用内容审查器服务的几个例子包括：审核产品目录和其他用户生成内容的在线市场、审核用户生成游戏制品和聊天室的游戏公司，以及审核用户以图像、文本和视频形式生成内容的社交消息平台。


    **视觉**


    作为人类，我们学到的大部分知识都来自所见之物。然而，对于计算机系统来说，理解此类视觉数据非常困难，更不用说分类和分析如此复杂的数据集了。Azure 的认知服务使得准确识别和分析图像、视频和数字墨迹中的内容成为可能。


    **计算机视觉**服务使用先进的算法处理图像并返回信息。要分析图像，您可以上传图像或通过 URL 指定图像。根据用户感兴趣的视觉特征，图像处理算法可以相应地分析内容，并提供关于其特征的见解。从数千个可识别的物体、生物、场景和动作中，它能识别图像中的视觉特征，并能从包含数千个全球标志的数据库中识别图像或视频中的商业品牌。


    **认知服务人脸 API**提供用于检测、识别和分析图像中人脸的先进算法。人脸信息在许多不同的软件场景中非常有用。当前流行的场景包括安全、自然用户界面、图像内容分析与管理、移动应用和机器人技术。


    **墨迹识别器**是一种 AI 服务，可识别数字手写内容、常见形状以及墨迹文档的布局。它能识别常见的几何形状——例如数字墨迹中的多边形——以及它们的几何热点和布局坐标。墨迹识别器有潜力为笔记记录、表单填写、内容搜索和文档注释增加价值。


    **亚马逊 AI 服务**


    亚马逊网络服务（AWS）一直是技术如何影响和增强用户体验的颠覆者。借助 AWS 人工智能服务，亚马逊将这种体验变为现实。无论是在亚马逊无人商店的无缝结账，还是让
    Alexa 在疲惫的一天结束时为你煮咖啡、打开电视、播放音乐，AWS AI 服务都在与用户的每一次交互中日益成熟。亚马逊的 AI 服务赋予用户自然语言、视频分析、虚拟助手、个性化推荐和预测等能力，而无需具备深厚的机器学习专业知识。这对企业非常有利，因为它能轻松实现业务与技术的对话与集成，并促成更快、更具价值的结果。


    **产品与服务**


    亚马逊 AI 的演进始于 20 世纪 90 年代末，当时它有一个发现代理，可以根据订阅者喜爱的作者、类型或其他参数推荐可能喜欢的书籍。自那时起，亚马逊的 AI
    不断演进和成熟，现在可以在自然语言理解、物体和人脸识别、聊天机器人、语音对话、自动语音识别等领域运行复杂算法。亚马逊 AI 服务还满足了企业扩展人工智能以驱动业务成果的一个非常重要的需求。其
    AI 服务可以独立使用，也可以相互结合使用，为用户提供速度、敏捷性和灵活性，以开展有效的业务运营并增强最终用户体验。


    **Amazon Lex**


    Amazon Lex 是亚马逊 AI 旗下的一项服务，您可以使用它构建能够识别、理解并以语音转文本或文本转语音形式进行对话、实现类人对话的聊天机器人。Amazon
    Lex 可用于创建使用语音或文本作为聊天媒介的对话式界面。它利用自然语言理解来理解'
- fmt: '# Amazon Lex


    The context of the conversation and automatic speech recognition that can convert
    speech to text. This enables the user to build advanced chatbot without having
    the proficiency of complex technologies. `Lex` uses the same deep learning algorithms
    that power `Amazon Alexa` and makes it accessible to developers, thus enabling
    faster cycle time and ease of development to build sophisticated, natural language-enabled
    conversational bots. It won’t be wrong to say that `Lex` has democratized deep
    learning technologies and built smart and responsive bots. Since `Lex` can easily
    scale up or down depending on the usage, it brings elasticity to the IT infrastructure
    required to run the service. The following are additional benefits of `Amazon
    Lex`.


    - **Ease of use:** It offers an easy-to-use console to quickly build your chatbot.
    It has predefined bots if you are not familiar with the `Amazon Lex` console.
    `Lex` also has the capability where it can build a complete natural language model
    even if it is supplied with just a few phrases, `Lex` can intelligently train
    the bot to the next level.

    - **Seamlessly deployment and scaling:** Using the console, the developer can
    build, test, and deploy the bot straightaway. It also provides ease of integration
    to various applications and easily publish the voice or text chatbots to mobile
    devices, web apps, and chat services such as `Facebook Messenger`, `Slack`, `Twilio`
    and more. Since `Lex` is on a `SaaS` model, the infrastructure is completely elastic,
    and you don’t have to worry about scaling the infrastructure as the user volume
    and conversations increases or decreases.

    - **Cost efficacy:** `Lex` works on a cost-effective model. Unlike other services,
    `Lex` doesn’t charge any upfront charges or any minimum fee. It also provides
    the `Amazon Lex` free tier so that the user can try `Lex` without any initial
    investment. `Amazon Lex` works on a pay per use model and has a low cost per request,
    thus optimizing on the cost implications for the user.

    - **Built-in integration with AWS:** `Lex` has many built-in integrations—like
    `Lambda`, `MobileHub`, and `CloudWatch`—that allow the user to integrate with
    many other `AWS` services, like `Cognito`, `DynamoDB`, `Amazon Polly`, and many
    others. This feature enables `Lex` to leverage `AWS`’ platforms for monitoring,
    security, business logic, user authentication, storage, and mobile development.


    # Amazon Polly


    Human speech is one of the most powerful ways to communicate. The same word can
    have different connotation based on the tonality, context, and pitch of the word
    that is spoken. `AWS Polly` is a cloud-based service that uses advanced deep learning
    technologies to convert text to human-like speech. It can support multiple languages
    and has a strong repository of life like voices that gives it the agility to be
    used to build speech-enabled applications and use the appropriate voice depending
    on the business case and the end user’s sentiment. `Polly` uses a variety of `Neural
    Text to Speech (NTTS)` voices, which is evolving and learning every day. The `NTTS`
    technology also gives `Polly` the ability to synthesize a newscaster’s speaking
    style that is personalized to the news narration speaking style. `Polly` can be
    used to augment human voice across mobile application, e-learning software, games,
    accessibility applications for visually impaired, `IoT` and many other domains.
    The following are some of the benefits of `Polly`.


    - **Large portfolio of voices and language:** Unlike other services, `Polly` provides
    a vast array of languages to choose from. It also has a repository of human-like
    male and female voices. It offers both `NTTS` and `TTS` technology to synthesize
    the superior natural speech with high pronunciation accuracy.

    - **Low latency:** To deliver life-like conversations and conversational experiences,
    it is imperative that the service has a low latency and fast response time. When
    text is sent to `Polly`’s `API`, it returns the audio.'
