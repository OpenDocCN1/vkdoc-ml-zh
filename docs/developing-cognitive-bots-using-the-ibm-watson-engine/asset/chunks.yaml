- fmt: '# Chapter 5 Advanced Concepts of Watson Agent


    ***Figure 5-16.** Enabling the slots for a node*


    After the slots are enabled for the node, the node appears, as shown in Figure
    [5-17.](#index_split_000.html#p129)


    ![](index-129_1.jpg)


    ***Figure 5-17.** Slots enabled for a node*


    After the slots are enabled, you see the **Then Check for** option.


    You can define the conditions as follows:


    - **CHECK FOR**: Defines the conditions.

    - **SAVE IT AS**: Saves the value in context variables.

    - **IF NOT PRESENT ASK**: If the condition is not matched, then you can ask the
    prompting question.


    Finally, enter a response in the **Response** field.


    Let’s better understand this by using the “Reset Password” example. We will define
    the slots in the node that check the condition (i.e., whether the account the
    user wants to reset password for is defined or not).


    Enable the slots in the node by clicking the **Customize** button and then selecting
    **Slots**. Tick **Prompt for everything**. The steps to enable slots were covered
