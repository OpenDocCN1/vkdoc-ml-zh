    to integrate with popular messaging apps.


    • **Chat emulator**. The emulator helps developers test their bots and see how
    the bot responds to various input. It is an essential tool to make bots production
    grade.


    ## Lucy Bot


    Lucy[4](https://www.dryice.ai/products-and-platforms/lucy) is a cognitive virtual
    assistant. It mimics human interaction and learns. It adapts to a user’s needs
    through smart conversations by leveraging enterprise-grade natural language processing
    (NLP) and machine learning (ML).


    Lucy finds relevant information available across different enterprise systems.
    Lucy helps organizations move up the maturity curve and enhance the user experience
    for employees and customers. By leveraging advanced natural language processing,
    Lucy reduces human errors and increases productivity. It comes with out-of-the-box
    use cases for various scenarios, and it can be easily extended to cover the “cognitive
    chatbot” needs of modern enterprises.


    The three key components of Lucy’s architecture are shown in Figure[3-3.](#index_split_000.html#p58)


    ![Figure 3-3. Lucy architectural overview](index-58_1.jpg)


    • **Channel of interaction:** Converses with users in the medium of choice. It
    supports web, voice, chat, mobile apps, and humanoids.


    • **Natural language processing (NLP):** Leverages any existing NLP engine based
    on the enterprise requirements. It uses NLP to interpret the intent of the user
    by comprehending the meaning, determining the appropriate action, and responding
    to users.


    • **Enterprise integration:** Integrates with multiple enterprise systems and
    knowledge sources so that users can rely on Lucy as a single source of information
    from disparate sources.


    • **Enterprise-grade security:** Provides data region flexibility with endpoint-based
    security and third-party integrations. The current version of Lucy is SAML and
    SSO-enabled.


    • **Flexible billing:** Offers a custom-fit billing model with numerous billing
    templates and usage categories.


    • **Context Switching:** Multilevel context switching allows users to get back
    to incomplete conversations or digressed conversation.


    • **On-demand scalability:** A scalable platform for a business’s needs.


    • **Omnichannel:** Various OTB channels are available to easily configure.


    • **OTB third-party integration:** Offers out-of-the-box third-party integration
    with service management, robotic process automation, and CRM providers.


    • **Configuration management:** As a cognitive virtual assistant, Lucy can act
    as an interface between the users and multiple enterprise applications across
    domains and business functions.


    • **Platform agnostic:** Works across platforms, including Skype, Facebook Messenger,
    Microsoft Teams, Slack, and many more.


    ## Conclusion


    This chapter overviewed various bot frameworks that a developer can chose from
    to rapidly create cognitive bot applications by integrating with cognitive platforms.


