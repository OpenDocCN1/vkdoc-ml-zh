- fmt: '# Developing Cognitive Virtual Bots


    ## About the Authors


    **Neha Anand** is a data scientist and AI evangelist. She has worked on developing
    avenues to drive end-to-end solution and leverage levers of cognitive, AI, and
    ML solutions. She is reachable at `NehaAnand0511@gmail.com` and [https://www.linkedin.com/in/neha-anand-05](https://www.linkedin.com/in/neha-anand-05).


    **Pallavi Aggarwal** is a solutions architect for Automation. She has worked on
    the development and integration of various automation projects using natural language
    processing and machine learning. She is experienced in the development of various
    cognitive chatbots. She is reachable at `pallaviaggarwal123@gmail.com` and [www.linkedin.com/in/pallavi-aggarwal-1003](http://www.linkedin.com/in/pallavi-aggarwal-1003).


    ## About the Technical Reviewer


    **Amit Agrawal** is a principal data scientist currently working in HCL-DRYiCE.
    He is based out of Noida and holds a master''s degree in technology and information
    security from the Motilal Nehru Institute of Technology (MNNIT)–Allahabad. He
    has experience in big data systems, such as Apache Hadoop and Apache HBase. He
    has architected HCL-DRYiCE AI products using NLP and machine learning.


    ## Acknowledgments


    To my family, Shweta and Soumil, for being by my side and letting me sacrifice
    time for my intellectual and spiritual pursuits, and for taking care of everything
    while I am immersed in authoring. This and other accomplishments of my life wouldn''t
    have been possible without your love and support. To my Mom and my sister for
    the love and support as always; without your blessings, nothing is possible.


    To my coauthors Neha, Pallavi, and Sudipta—thank you for the hard work and quick
    turnarounds to deliver this. It was an enriching experience; looking forward to
    working with you again soon.


    To my team at HCL, who has been a source of inspiration with their hard work,
    ever-engaging technical conversations, and technical depth. Your ever-flowing
    ideas are a source of happiness and excitement every single day. Piyush Pandey,
    Sarvesh Pandey, Amit Agrawal, Vasand Kumar, Punith Krishnamurthy, Sandeep Sharma,
    Amit Dwivedi, Gaurav Bhardwaj, Nitin Narotra, Shoyeb, Divjot, Nitin Chand, and
    Vivek—thank you for being there and making technology fun.


    To Celestine and Aditee and the entire team at Apress for turning our ideas into
    reality. It has been an amazing experience authoring with you; and over the years,
    the speed of decision-making and the editorial support has been excellent.


    To all that I have had the opportunity to work with—my co-authors, colleagues,
    managers, mentors, and guides, in this world of 7 billion people, it was a coincidence
    that brought us together. It was and is an enriching experience to be associated
    with you and learn from you. All ideas and paths are an assimilation of conversations
    that I have had and experiences I have shared. Thank you.


    Thank you goddess Saraswati for guiding me to the path of knowledge and spirituality,
    and keep me on this path till salvation.


    असतो मा साद गमय, तमसो मा ज्योतिर् गमय, मृत्योर मा अमृतम् गमय

    (Asato Ma Sad Gamaya, Tamaso Ma Jyotir Gamaya, Mrityor Ma Amritam Gamaya)


    Lead us from ignorance to truth, lead us from darkness to light, lead us from
    death to deathlessness.


    # CHAPTER 1


    ## Introduction to Cognitive Virtual Bots


    What was science fiction yesterday is becoming reality today. This is true for
    many technologies, and the cognitive virtual assistant is one such technology
    whose time has come.


    A couple of years ago, I read a book where the protagonist created a self-learning
    chat program that had cognitive abilities to respond, just as any human being
    would. At that time, it looked like a plot that was only relevant to a sci-fi
    thriller. What was just a concept until a few years ago, however, is now a reality
    at scale due to the advent of *cognitive virtual assistants*—more commonly known
    as *chatbots*.


    A chatbot is a computer program that converses in natural language via auditory
    or textual methods, understands the intent of the user, and sends a response based
