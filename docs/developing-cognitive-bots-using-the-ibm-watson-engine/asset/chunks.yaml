    数据搅拌的结果不仅取决于数据本身，还受到其他环境因素的影响。例如，如果某国遭受病毒袭击且只有特定药物才能治愈的新闻传出，该药物的股价必然上涨。Watson
    Discovery 新闻是一个强大的工具，能够将这种智能构建到 AI 系统中。它是一个经过预处理的索引数据集，包含以下认知洞察：关键词提取、实体提取、语义角色提取、情感分析、关系提取和类别分类。为了使系统更稳健，系统还提供过去
    60 天新闻数据的历史搜索功能。


    **Watson 自然语言理解（NLU）**


    由于社交媒体及其他类似渠道的出现，非结构化数据的数量每时每刻都在成倍增长。这种数据爆炸使得理解人类语言的复杂性变得困难。Watson 自然语言理解是一套精炼的自然语言能力，结合了高级文本分析技术，能够从非结构化数据中提取关系、关键词和情感等洞察，并产生有意义的结果。


    第 2 章 各种认知平台/引擎


    **Watson 知识工作室**


    该服务无需编写任何代码，即可教会 Watson 从非结构化数据中发现有意义的洞察。这使得任何领域的领域专家能够协同工作，让 Watson 理解该领域或行业特有的语言。例如，病毒在医学科学中的定义与在网络安全生态系统中的含义截然不同。该服务还允许
    Watson 通过使用 Watson 知识工作室中的模型，在 Watson Discovery、Watson 自然语言理解和 Watson Explorer
    等多个应用中应用其获取的知识。


    **视觉**


    作为人类，我们所学到的大部分知识都源于所见之物。然而，对于计算机系统来说，理解此类视觉数据非常困难，更不用说对如此复杂的数据集进行分类和分析。Watson
    内置了 Watson 视觉识别服务，该服务能够理解视觉数据，并将大量视觉数据组织成结构化的、带标签的数据集。Watson 通过一组相关数据进行训练。例如，你可能想教会
    Watson 区分汽车和卡车。Watson 视觉识别需要接触各种汽车和卡车的图像，这样它才能告诉你，你提供给 Watson 的随机图像是汽车还是卡车。这一复杂功能非常重要，它将
    Watson 的能力提升到了更高的智能水平。


    **语音**


    与视觉类似，语音是另一个重要的数据生成平台。人类以语音为媒介，无缝地相互交流，以生成、记录和理解数据。Watson 的语音转文本和文本转语音服务不仅有助于将数据从一种格式转换为另一种格式，还能让
    Watson 理解不同的方言、发音和语言，并以类似人类的声音与用户对话。语音转文本服务可自动将语音数据转换为书面文本。同样，Watson 引擎生成的文本数据可以以逼真的人类对话形式传递给最终用户，从而提升用户体验和用户旅程。


    **LUIS**


    LUIS（语言理解智能服务）是一项微软服务，提供基于云的 API 服务，将自定义机器学习智能引入用户对话中，并解码自然语言文本以预测对话的含义。基本上，LUIS
    的客户端应用是一种对话式应用，它使用自然语言与用户交流以完成任务。LUIS 使用机器学习模型，允许开发者构建

