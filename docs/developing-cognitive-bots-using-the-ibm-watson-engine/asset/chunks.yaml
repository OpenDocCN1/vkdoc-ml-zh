    人工智能（AI）已席卷数字世界。AI 在各类应用和用例中日益重要。它被用于多种个人数字助手，包括 Siri、Cortana、Alexa 和 Google Assistant，以解决消费者的日常使用场景。*认知计算*定义了一种试图模拟人类思维方式的系统。这两个术语使用相同的技术，包括机器学习、神经网络、自然语言处理和情感分析。IBM
    将认知计算定义为“能够大规模学习、有目的地推理、并与人类自然交互的系统”。认知计算通过使用自学习算法来实现决策，并让人类生活更轻松，其核心在于人机交互。


    通俗地说，当机器模仿人类与*人类思维*相关的认知功能（如学习、推理和解决问题）时，就应用了*人工智能*这一术语。


    **Watson**


    Watson 是 IBM 面向企业级 AI 服务、应用和工具的一套产品组合。它是一系列运行在 IBM 云平台上的云服务，旨在提供卓越的性能。Watson 使用


