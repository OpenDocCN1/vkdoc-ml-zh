- fmt: '# Chapter 2 Various Cognitive Platforms/Engines


    ## Translator Text


    `Translator Text` is a machine translation service that is easy to integrate into
    applications, websites, tools, and solutions. It allows developers to add multilanguage
    user experiences in more than 60 languages, and it can be used for text-to-text
    language translation.


    ## Speech Service


    `Speech` is another significant platform of data generation. Humans seamlessly
    interact with each other using speech as a medium to generate, document and understand
    data. Speech services are the union of audio-to-text, speech translation, and
    text-to-speech capabilities. We can also say that it converts spoken language
    into text, or it produces natural information speech from text using standard
    voice. It also provides a speaker recognition service that identifies individual
    speakers or uses speech as an authentication mechanism, since every individual
    voice has unique characteristics that can identify a person, just like a figure
    print.


    ## Search


    The search service in `LUIS` gives the applications the power and the ability
    to search across huge quantum of ad free information across the web. It helps
    to find the exact requirements from billions of webpages, images, videos, and
    news search results.


    ## Bing Spell Check


    `Bing Spell Check` performs contextual grammar and spell checks. Bing has developed
    a web-based spell-checker that has machine learning and statistical machine translation
    capabilities. It is based on a massive body of web searches and documents, and
    it can help users check spelling errors and slang and recognize the differences
    between names and brand names, and so forth.


    ## Bing Web Search


    It is a `RESTful` service that provides instant resolution to user queries. Search
    results are easily configured to include web pages, images, videos, news and more.
    `Bing Web Search` provides the results based on search relevance with subscriptions.


    ## Bing Entity Search


    `Bing Entity Search` sends a search query to Bing and gets relevant results, including
    entities and places. Places include restaurants and other local business hubs.
    Bing returns places if the query specifies the name of the local business or asks
    for a type of business (for example, restaurants near me). Bing returns entities
    if the query specifies well-known people and places (tourist attractions, states,
    countries, regions).


    ## Decision


    The `Decision API` comes with built-in services, like `Content Moderator`, `Anomaly
    Detector`, and `Personalizer`. `Content Moderator` is an Azure Cognitive Service,
    and it is a machine-assisted content moderation API that augments image, text,
    and video moderation capabilities. It can detect offensive and unwanted images,
    racial and adult video content, and profane and undesirable text. When such material
    is found, the service adds an appropriate label and flags it to the content moderator.
    The application can then manage the flagged content as per the defined regulations
    and maintain the planned environment for users. A few examples of where software
    engineers can use the `Content Moderator` service are online marketplaces that
    moderate product catalogs and other user-generated content, gaming companies that
    moderate user-generated game artifacts and chat rooms, and social messaging platforms
    that moderate user-generated content in the form of images, text, and videos.


    ## Vision


    As humans, a lot of what we learn is through the things that we see. However,
    for a computer system it is very hard to understand such visual data, let alone
    classify and analyze such complex data sets. Azure’s Cognitive Services make it
    possible to accurately identify and analyze content within images, videos, and
    digital ink.


    The `Computer Vision` service uses advanced algorithms that process images and
    return information. To analyze an image, you can either upload an image or specify
    an image through a URL. Depending on the visual features that users are interested
    in, image-processing algorithms can analyze the content accordingly and provide
    insights about their characteristics. From a set of thousands of recognizable
    objects, living things, scenery, and actions, it identifies visual features in
    images and can identify commercial brands in images or videos from a database
    of thousands of global logos.


    The `Cognitive Services Face API` provides advanced algorithms that are used to
    detect, recognize, and analyze human faces in images. Human face information is
    useful in many different software scenarios. Trending scenarios are security,
    natural user interfaces, image content analysis and management, mobile apps, and
    robotics.


    `Ink Recognizer` is an AI service that recognizes digital handwriting, common
    shapes, and the layout of inked documents. It identifies common geometric shapes—like
    a polygon in digital ink—along with their geometric hot points and layout coordinates.
    `Ink Recognizer` has the potential to add value to notetaking, completing forms,
    content searches, and document annotation.


    # Amazon AI Services


    Amazon Web Services (AWS) has been a disrupter on how technology can impact and
    enhance the user experience. With AWS Artificial Intelligence Services, Amazon
    has manifested that experience. Whether it is a seamless check-in and checkout
    at a physical Amazon Go store, or getting Alexa to make your coffee, switch on
    your television, and play music at an end of a tiring day, AWS AI services are
    getting matured every day with every interaction it is having with its users.
    AI services from Amazon empowers its users with competencies like natural language,
    video analysis, virtual assistants, personalized recommendations, and forecasting
    without requiring to have a deep expertise in machine learning. This is beneficial
    for businesses since it enables a business to technology conversation and integration
    easily and enables faster and more value driven outcomes.


    ## Products and Services


    The evolution of AI at Amazon started in the late 1990s, when it had a discovery
    agent that recommended books that a subscriber might like based on her favorite
    author, genre, or other parameters. Since then, AI at Amazon has evolved and matured,
    and can now run complex algorithms across natural language understanding, object
    and facial recognition, chatbots, speech-enabled conversations, automatic speech
    recognition, and much more. Amazon AI services also address a very important need
    for the business to scale up artificial intelligence for driving business outcomes.
    Its AI services can be used in silos or in conjunction with each other, giving
    the users the speed, agility, and flexibility to run effective business operations
    and enhance the end user experience.


    ## Amazon Lex


    `Amazon Lex` is a service under Amazon AI where you can build chatbots that can
    recognize, understand, and chat in speech-to-text or text-to-speech form and can
    have human-like conversations. `Amazon Lex` can be used to create conversational
    interfaces using voice or text as a chat medium. It uses natural language understanding
    to understand.'
