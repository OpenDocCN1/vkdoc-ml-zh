- fmt: '# Artificial Intelligence (AI)


    Artificial intelligence (AI) has taken the digital world by storm. AI is increasingly
    relevant in a varied set of applications and use cases. It is used in a variety
    of personal digital assistants, including `Siri`, `Cortana`, `Alexa`, and `Google
    Assistant`, for solving consumers’ day-to-day use cases. *Cognitive computing*
    defines a system that tries to simulate the way a human mind works. These two
    terms use the same technologies, including machine learning, neural networks,
    natural language processing, and sentimental analysis. IBM defines cognitive computing
    as “systems that learn at scale, reason with purpose, and interact with humans
    naturally.” Cognitive computing focuses on human machine interaction by using
    self-learning algorithms to enable decision-making and to make life easier for
    humans.


    Colloquially, the term *artificial intelligence* is applied when a machine mimics
    cognitive functions that humans associate with the human mind, such as learning,
    reasoning, and problem solving.


    ## Watson


    `Watson` is IBM’s suite of enterprise-ready AI services, applications, and tooling.
    It is a collection of cloud services running on the IBM Cloud platform aimed at
    delivering exceptional performance. `Watson` uses natural language processing,
    natural language understanding, and machine learning to convert large amounts
    of unstructured data into something tangible and insightful.


    `Watson` gained recognition when it defeated world champions Ken Jennings and
    Brad Rutter on the *Jeopardy* television gameshow. Since *Jeopardy* covers a vast
    spectrum of subjects, it showcased `Watson`’s ability to go beyond analyzing databases
    (versus a more complex system of algorithms), continuous learning models, hypotheses,
    and decision-making powers that qualified `Watson` to win the game. `Watson` is
    said to be a supercomputer that can mirror human cognition process by dividing
    it into four different sections.


    The first section is the ability to *observe*. `Watson` learns information from
    a variety of web sources and a vast repository of databases in a millionth of
    a second.


    The second section is the ability to *interpret*. `Watson` consumes all the information
    it has received and processes it into a format that is more efficient and easier
    to process. Since a computer only understands binary, `Watson` calibrates the
    data—whether text, speech, or images—into binary. However, at this step, `Watson`
    relies on a human to instruct it as to how to interpret this information. This
    is done by a Q&A model in which `Watson` is trained to understand the meaning
    of the data beyond the facts it has been exposed to, and then logically constructs
    the relationships between the facts.


    The third section is *evaluation*, where `Watson` can evaluate the relevance of
    the information based on the feedback it receives from the sources that it gathered
    the information from. It can filter out the irrelevant information based on a
    scoring system.


    The fourth section is *decision*. After evaluating the accuracy of the information,
    `Watson` can build on a variety of patterns regarding the existing patterns of
    the information in a way that is similar to what a human brain would do. This
    enables `Watson` to gather information, process it intelligently, and solve problems
    related to the subject it is working on. Through its hypothesis and evidence scoring,
    `Watson` can not only suggest possible solutions based on its established information
    from external sources, but based on what it has learned, it can align a confidence
    score and thus intelligently decide on the best solution for the problem it is
    working on.


    ## Products and Services


    With the help of the `Watson Assistant` service, we can build applications and
    agents that can understand natural language input and simulate a conversation
    with the end user that emulates a human-to-human conversation. The elements for
    building an AI-enabled ecosystem is depicted in Figure 2-1.


    ![Figure 2-1. Watson services](index-30_1.png)


    ### AI Assistant


    An assistant enables you to route the end user’s request to the best possible
    solution. This capability integrates the channels dedicated to help solve the
    end user’s request, and makes it easier to manage requests.


    ### Watson Assistant


    `Watson Assistant` is an offering for building conversational interfaces into
    any application, device, or channel. It knows when to search for an answer from
    a knowledge warehouse, when to ask for clarification, and when to direct the user
    to a human assistant. `Watson Assistant` runs on the IBM cloud, thus allowing
    businesses to bring AI, scalability, and agility together to enhance the end user’s
    experience.


    ### Data


    An organization’s smartest resource is its data. However, generating value out
    of the data is a complex and time-consuming process. `Watson Data` services make
    it possible for the user to collect, organize, and analyze data. It automates
    the creation of self-learning models, data labeling, data bias reduction, data
    cleaning, and data visualization.


    #### Watson Studio


    `Watson Studio` helps you to extract value and insights from data by enabling
    collaborative data science and machine learning environments to build and train
    AI models, and prepare and analyze data in a single integrated environment.


    #### Watson Machine Learning


    This service empowers you to use the data to create, train, and deploy self-learning
    models. It leverages an automated, collaborative workflow to build intelligent
    applications.


    #### Watson Knowledge Catalog


    The `Watson Knowledge Catalog` is a collaborative asset catalog that is designed
    to discover and categorize enormous volumes of data spread across disparate sources.


    #### Watson OpenScale


    `Watson OpenScale` is a scalable platform that gives the user a clear and accurate
    view of their AI systems, which helps to track and refine their performance across
    its lifecycle.


    ### Knowledge


    In the space of artificial intelligence, learning, and knowledge gathering is
    a continuous process. The AI system does not rely on deriving outcomes on the
    data repository or pre-existing run books, but works on building a newer knowledge
    repository through collaborative learning over each interaction, just like the
    human brain. `Watson Knowledge` services enable in developing this holistic evolving
    knowledge system.


    #### Watson Discovery


    `Watson Discovery` is an AI search technology that eliminates data silos and retrieves
    information buried inside enterprise data. `Watson Discovery` applies the latest
    breakthroughs in machine learning, including natural language processing and natural
    language understanding capabilities, and it is easily trained to the users’ domain.
    With the flexibility of the IBM Cloud, users can operate anywhere providing it
    scale and agility. The user can even train it for a particular domain by using
    `Watson Knowledge Studio`.


    #### Watson Discovery News'
  raw: 'Artificial intelligence (AI) has taken the digital world by storm. AI is increasingly
    relevant in a varied set of applications and use cases. It is used in a variety
    of personal digital assistants, including Siri, Cortana, Alexa, and Google Assistant,
    for solving consumers’ day-to-day use cases. *Cognitive* *computing* defines a
    system that tries to simulate the way a human mind works. These two terms use
    the same technologies, including machine learning, neural networks, natural language
    processing, and sentimental analysis. IBM defines cognitive computing as “systems
    that learn at scale, reason with purpose, and interact with humans naturally.”
    Cognitive computing focuses on human machine interaction by using self-learning
    algorithms to enable decision-making and to make life easier for humans.


    Colloquially, the term *artificial intelligence* is applied when a machine mimics
    cognitive functions that humans associate with *the* human mind, such as learning,
    reasoning *,* and problem solving.


    **Watson**


    Watson is IBM’s suite of enterprise-ready AI services, applications, and tooling.
    It is a collection of cloud services running on the IBM Cloud platform aimed at
    delivering exceptional performance. Watson uses


    natural language processing, natural language understanding, and


    © Navin Sabharwal, Sudipta Barua, Neha Anand, Pallavi Aggarwal 2020


    N. Sabharwal et al., *Developing Cognitive Bots Using the IBM Watson Engine*,


    [https://doi.org/10.1007/978-1-4842-5555-1_2](#index_split_000.html#p28)


    Chapter 2 Various CognitiVe platforms/engines


    machine learning to convert large amounts of unstructured data into something
    tangible and insightful.


    Watson gained recognition when it defeated world champions Ken


    Jennings and Brad Rutter on the *Jeopardy* television gameshow. Since *Jeopardy*
    covers a vast spectrum of subjects, it showcased Watson’s ability to go beyond
    analyzing databases (versus a more complex system of algorithms), continuous learning
    models, hypotheses, and decision-making powers that qualified Watson to win the
    game. Watson is said to be a supercomputer that can mirror human cognition process
    by dividing it into four different sections.


    The first section is the ability to *observe*. Watson learns information from
    a variety of web sources and a vast repository of databases in a millionth of
    a second.


    The second section is the ability to *interpret*. Watson consumes all the information
    it has received and processes it into a format that is more efficient and easier
    to process. Since a computer only understands binary, Watson calibrates the data—whether
    text, speech, or images—into binary.


    However, at this step, Watson relies on a human to instruct it as to how to interpret
    this information. This is done by a Q&A model in which Watson is trained to understand
    the meaning of the data beyond the facts it has been exposed to, and then logically
    constructs the relationships between the facts.


    The third section is *evaluation*, where Watson can evaluate the relevance of
    the information based on the feedback it receives from the sources that it gathered
    the information from. It can filter out the irrelevant information based on a
    scoring system.


    The fourth section is *decision*. After evaluating the accuracy of the information,
    Watson can build on a variety of patterns regarding the existing patterns of the
    information in a way that is similar to what a human brain would do. This enables
    Watson to gather information,


    process it intelligently, and solve problems related to the subject it is working
    on. Through its hypothesis and evidence scoring, Watson can 16


