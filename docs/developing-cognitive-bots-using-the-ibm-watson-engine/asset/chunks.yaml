- fmt: '# Chapter 5 Advanced Concepts of Watson Assistant


    **Figure 5-40.** Options result shown


    `Disambiguation` provides an easy way to handle conflicts in intents or incomplete
    information provided by the user. So, it triggers the relevant use case based
    on the confidence score returned when the query is entered. The confidence score
    is a threshold value by Watson that helps to recognize the top intents matched
    from the array of intents returned.


    ## Handling Multiple Intents


    There are scenarios when user asks a query that has more than one intent; for
    example, “Reset password and unlock account.” The bot can only perform or execute
    one action at a time. The bot must understand that the user is asking a question
    that has two different intents and then execute the two use cases in a step-by-step
    fashion.


    To achieve this, there is a node that disambiguates the different intents.


    Let’s use the Watson feature called *the confidence score* to solve this use case.
    The confidence score is a score assigned to the array of intents when a query
    is entered into the system.


    We will use the confidence score in a node that checks the confidence score of
    the top intents returned for the query entered. They are defined as follows.


    - `Intents[0].confidence` is the confidence of the highest matching intent

    - `Intents[1].confidence` is the confidence of the second highest matching intent


    `Intents[1].confidence` checks if the confidence score of the second-highest matching
    intent is greater than 20 percent. `Intents[0].confidence` checks if the highest
    matching intent is more than 95 percent. The values set to check the confidence
    score can be changed as per the use case.


    If these conditions are matched, then the bot responds with a message saying,
    “Which of these options do you want to perform?” It presents the two options that
    map to the two intents.


    Let’s see how to get this configured in the dialog. The use cases are configured
    and shown in Figure 5-41.


    - Reset Password in Outlook

    - Reset Password in Gmail

    - Unlock Password


    ![Figure 5-41. Use cases Nodes added](index-150_1.jpg)


    **Figure 5-41.** Use cases Nodes added


    The Welcome node that provides the greeting message waits for user input. Add
    a `$disambiguated` context variable and set its value to `null`, as shown in Figure
    5-42.


    ![Figure 5-42. Disambiguate context variable added in Welcome node](index-151_1.jpg)


    ![Figure 5-42. Disambiguate context variable added in Welcome node](index-151_2.jpg)


    **Figure 5-42.** Disambiguate context variable added in Welcome node


    Now let’s add a node that disambiguates between the intents. Add a node above
    the configured use cases and enter the confidence condition as `(intents[1].confidence
    > 0.2 && intents[0].confidence < 0.95)`. This checks the confidence score of the
    intents returned. An `intents` array stores the confidence score of intents in
    decreasing order. Thus, `intents[0]` has the highest confidence score followed
    by `intents[1]`, as shown in Figure 5-43.


    **Figure 5-43.** Confidence score condition defined


    ![Figure 5-43. Confidence score condition defined](index-152_1.jpg)


    To display the intents captured as options for user to select, we can set these
    values in the context variable and further reuse them as options, as shown in
    Figure 5-44.


    ```

    "intent0label": "<? intents[0].intent.replace(''_'','' '') ?>",

    "intent0score": "<? T(String).format(''%.0f'',intents[0].confidence*100) ?>",

    "intent1label": "<? intents[1].intent.replace(''_'','' '') ?>",

    "intent1score": "<? T(String).format(''%.0f'',intents[0].confidence*100) ?>",

    "disambiguated": true

    ```


    **Figure 5-44.** Context variables defined to capture the top intents matched


    Next, we need to show these options. We can do this in the **And respond with**
    field, as shown in Figure 5-45.


    ![Figure 5-45. Options for the intents matched](index-153_1.jpg)


    ![Figure 5-45. Options for the intents matched](index-153_2.jpg)


    **Figure 5-45.** Options for the intents matched'
