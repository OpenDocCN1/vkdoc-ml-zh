  trans: '

    翻译服务利用深度学习模型，基于本地方言、品牌特定风格、语言特定构成等方面，以高准确度和自然流畅的翻译效果，对数字资产进行语言翻译并实现自动化。它通过机器学习和持续学习来逐步提升准确性和效率。Amazon
    Translate 可以与其他服务集成，例如 Amazon Comprehend，用于从社交媒体或其他短文本中提取预定义的实体、情感或关键词。它还可以与 Amazon
    Polly 集成，将翻译后的数据转换为语音并传递给用户。


    第 2 章 各种认知平台/引擎


    目前，Amazon Translate 支持 25 种语言，并支持近 600 种翻译组合。在未指定内容源语言的情况下，Translate 能够高精度地检测源语言。它还具备批量翻译能力，适用于数据量非常大的场景；以及实时翻译能力，用于按需提供内容翻译，例如在机器人界面中。


    **Amazon Transcribe**


    Amazon Transcribe 利用一种称为自动语音识别的深度学习过程，使开发者能够将语音转录为文本。通过使用此 API 服务，可以分析存储在 Amazon
    S3 中的音频文件，并以转录文本格式返回音频文件的内容。


    过去，我们不得不依靠人工来将此类音频转换为文本转录。借助 Amazon Transcribe，整个过程实现了自动化、可扩展、成本效益高且周转时间更快。它具备智能能力，可以自动添加标点和格式，从而使转换后的输出更加准确。音频可以批量处理或近乎实时地处理，这意味着可以输入实时音频数据流，并并行获得转录文本形式的输出。


    此 API 会为每个单词添加时间戳，这在您想要在原始音频中查找特定单词或在视频的特定位置插入字幕时非常有用。Amazon Transcribe 足够灵活，可以将新单词添加到基础词汇表中，以生成更准确的转录。这允许添加特定领域的单词和短语，例如产品名称、技术术语或个人姓名、地点等。此外，Translate
    可以与其他 Amazon API（如 Amazon Translate）集成，从而实现音频和启用音频的视频内容的本地化。


    第 2 章 各种认知平台/引擎


    **Dialogflow**


    Dialogflow 是谷歌旗下基于自然语言对话的人机交互技术平台。谷歌提供了 Speaktoit，这是一个适用于 Android 和 iOS 的虚拟伙伴，能够执行任务并以自然语言回答用户查询。Speaktoit
    创建了一个自然语言处理引擎，有助于处理对话上下文，如对话历史、位置和用户偏好。它作为一个自然语言理解平台，使得将对话式用户界面设计并整合到移动端、网页和设备等任何平台变得容易。它还有助于为用户提供与产品互动的新颖且引人入胜的方式。


    该技术擅长同时分析来自客户的多种输入，包括文本或音频输入（例如来自手机或录音）。它还有助于通过文本或合成语音等多种方式回应用户。这为用户提供了与产品互动的新方式，通过构建由谷歌
    AI 技术驱动的、引人入胜的语音和文本对话界面，例如语音应用和聊天机器人。这是一个端到端的工具，由自然语言理解驱动，以促进丰富且自然的对话。


    **谷歌产品与服务**


    借助谷歌 AI 认知服务，我们可以构建能够解读自然语言输入、模拟与最终用户对话以及模仿人与人对话的应用程序和代理。接下来将介绍可用于构建认知虚拟代理的谷歌服务。


    第 2 章 各种认知平台/引擎


    **语音转文本**


    Google Cloud Speech-to-Text 通过一个易于使用的 API，利用强大的神经网络模型，使开发者能够将音频转换为文本。Speech-to-Text
    API 可识别 120 种语言和版本，以支持您的全球用户群。该服务还具有启用语音命令和控制、转录来自呼叫中心的音频等功能。


    利用谷歌机器学习技术，它可以处理实时流式音频或预先录制的音频。


    为了执行语音识别，Cloud Speech-to-Text 有三种主要方法。


    • **同步识别：** 将音频数据发送到 Speech-to-Text API，然后对该数据执行识别，并在所有音频处理完毕后返回结果。同步识别请求仅限于持续时间不超过
    1 分钟的音频数据。


    • **异步识别：** 将音频数据发送到 Speech-to-Text API，并以一个长时间运行的操作开始。使用此操作，您可以定期处理以获取识别结果。异步请求可以处理任何持续时间长达
    480 分钟的音频数据。


    • **流式识别：** 对在 gRPC 双向流中提供的音频数据执行识别.4。对于实时识别场景，流式请求被设计用于从麦克风录制实时音频。流式识别在捕获音频的同时提供阶段性结果，从而允许在用户说话时实时显示结果。


    4 [`www.grpc.io/docs/guides/concepts.html#bidirectional-streaming-rpc`](http://www.grpc.io/docs/guides/concepts.html#bidirectional-streaming-rpc)


    第 2 章 各种认知平台/引擎


    **文本转语音**


    Google Cloud Text-to-Speech 可将文本转换为语音，支持超过 30 种人类语言及其变体中的 180 多种语音。它应用了语音合成方面的创新研究，并利用谷歌强大的神经网络技术来提供高保真音频。此
    API 使交互变得简单，并可改变客户服务、设备交互以及更多应用。


    文本转语音使开发者能够创建听起来自然、合成的人类语音，作为可播放的音频。它可以轻松地将任意字符串、单词和句子转换为说话人的声音。想象一下，您有一个语音助手应用程序，能够以自然语言的可播放音频形式接收用户反馈。将此
    API 集成后，应用程序可以执行操作，然后以人类语音的形式向用户提供反馈。


    **语言翻译**


    Language Translation API 使用谷歌预训练的神经机器翻译来提供快速、强大的结果。在 Translation API 和相同的客户端库中，用户现在甚至可以选择使用自定义模型翻译。翻译功能易于集成到应用程序、网站、工具和解决方案中。它支持[超过
    100 种语言](https://docs.microsoft.com/en-in/azure/cognitive-services/translator/languages)的多语言用户体验
