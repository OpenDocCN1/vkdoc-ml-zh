    **Scenario 2: Node to Node on the Same Level**


    When Node 1 is triggered on a matched query, and there is a jump from Node 1 to
    Node 2, it has the option to wait for user input before moving to Node 2.


    ***Figure 4-70.** Input from user & Traversal from Node to Node on the same level*


    `If bot recognizes condition` means that if the condition specified in the target
    node evaluates to true, the workflow executes the response statement of the target
    node. If it does not evaluate to true, the response statement is not executed.


    ![](index-114_1.jpg)


    ![](index-114_2.jpg)


    Chapter 4 Building Your First Bot using Watson assistant


    ***Figure 4-71.** Jump To (If bot recognises) with True condition for node to
