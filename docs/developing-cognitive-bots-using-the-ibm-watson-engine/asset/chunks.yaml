- fmt: 'Azure Cognitive Services 使开发人员能够更简单、更快速地创建直观的对话式机器人。微软提供的示例和代码有助于快速启动机器人项目，并缩短完成项目所需的时间。


    Microsoft Bot Framework 提供的实用工具范围包括：翻译服务集成、对话状态管理、调试工具以及可嵌入的 Web 聊天控件。开发人员可以使用针对各种用例的代码示例以及来自不同领域的示例。


    **Microsoft Bot Framework 功能**


    Microsoft Bot Framework 集成了语音、语言理解、翻译以及 Azure Cognitive Services 提供的其他服务。来自 Azure
    的云服务构成了任何机器人的骨干。有一个庞大的 .NET 开发人员社区，他们发现通过使用 SDK 创建认知机器人，可以轻松地将他们在 C# 中的框架和语言技能提升到一个新的水平。


    该 SDK 是开源的，并包含关于如何构建、测试以及将机器人投入生产的生命周期指导。这种生命周期指导是 Microsoft Bot Framework 独有的，使得新的认知机器人开发人员更容易学习和实现。


    微软的企业解决方案库与 Bot Framework 集成，这消除了在其他机器人框架中可能需要的大量管道工作。这种与微软企业生态系统的开箱即用集成使其成为微软客户的一个不错选择。


    ![](index-55_1.jpg)


