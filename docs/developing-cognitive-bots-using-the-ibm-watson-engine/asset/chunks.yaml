- fmt: '# Cognitive Virtual Assistants


    With simultaneous conversations, any peaks in an IT service desk where people
    are waiting for a response are done away with. With the self-service capabilities
    that a CVA provides, users can solve most of their queries or problems related
    to laptop, desktop, email, Microsoft Office suite, or other enterprise applications.


    Simple but often very voluminous use cases, like password reset or help with accessing
    an application, can easily be done by CVAs, thus freeing up time of IT resources
    to help the users with problems that are more complex.


    Since IT cuts across verticals, the use cases created here can be leveraged across
    multiple industry verticals. Many verticals (including banking and financial services,
    travel, healthcare, hospitality, and retail) are already on the path to deploying
    CVAs for IT service desk use cases.


    A few bots come bundled with IT service desk use cases for readymade consumption
    with faster time to adoption. One such bot framework is `DRYiCE Lucy`, which provides
    hundreds of out-of-the-box use cases for IT ([www.dryice.ai/](http://www.dryice.ai/)).


    ## Triage


    There are many use cases under the triage category. Some of the IT service desk
    use cases also fall under triage. A Triage CVA can ask and probe a user about
    the issue that he is facing, and can then route or triage him to the right information
    or to the right human agent to resolve the problem.


    To better understand triage use cases, think of it as an intelligent IVR. An IVR
    asks the user to select an option on telephony networks, and based on the options
    selected, it provides the information or routes to a human agent. An IVR system
    with a telecom company, broadband company, or a bank is a good example of how
    triaging works.


    Organizations can take advantage of the CVA capabilities to turn IVR into intelligent
    communication, and thus elevate the user’s experience. Intelligent CVAs can decipher
    what the user wants and can provide the right information much faster than an
    IVR. Since CVAs can be integrated with enterprise applications, things like looking
    up information such as an account balance or a securities balance is easy to implement
    with a CVA.


    ## Lead Generation


    Lead generation, which was thought to be an activity that requires humans to do
    majority of the tasks, is fast becoming automated. Lead generation CVAs are mostly
    embedded within a website. When you land on any page of an organization’s website,
    a popup for a CVA opens and starts a conversation with the visitor.


    The use of CVAs as the lead generation front end on websites is quickly catching
    up, and these days, most websites have a CVA assisting visitors with information.
    The benefit of a CVA on websites is that visitors get to know the information
    quickly and intuitively, and they don’t have to go through the entire website
    and navigate from page to page to get the required information.


    In this scenario, since the visitor is interacting with a CVA, the user is no
    longer a passive visitor but an active visitor who is providing information through
    chat conversations, which can then be used as a lead, feedback, and so forth.


    ## Ecommerce


    Ecommerce virtual assistants are helping millions of consumers to browse, select,
    and buy products and services with an intuitive interface. With millions of products
    listed on ecommerce websites, it is becoming difficult for users to search and
    find goods and services that they intend to buy. CVAs, which have extensive capabilities
    to use machine learning technologies to converse and speedily search information,
    are making buying and selling online easier.


    Ecommerce CVAs have extensions and capabilities that include algorithms that match
    a buyer and a seller. With CVAs, the complete transaction becomes natural and
    two-way, in contrast to a website that is static and does not have a conversational
    flow.


    Imagine a scenario where you are asking about a product, and the CVA can pinpoint
    and show you the exact product that you want. On a static website, if the price
    was not up to your expectations, you may not buy the product. However, a CVA may
    look up other offers and provide you a better price—based on an intelligent algorithm.
    This elevates the user experience multifold.


    ## Integration with Enterprise Applications


    Most of us are familiar with the popular virtual assistants programmed into our
    smartphones or speakers, such as Apple’s Siri and Amazon’s Echo (Alexa). On the
    enterprise side, we see leading SaaS companies integrating popular messaging bots
    like Facebook Messenger into their applications.


    Major ERP providers such as SAP and Oracle are developing virtual assistants for
    their applications as well. Some examples of chatbots in this space include the
    Einstein Bot from Salesforce.


    ## Task Tracking and Project Management


    Task management, reminders, and reporting are typical activities in a project.
    Cognitive virtual assistants can look up information, collate information, and
    integrate with enterprise project management systems, which make them ideal for
    simplifying and automating the project management process.


    Users can use a CVA for setting alerts, requesting project status, scheduling
    meetings, and searching project-related documents. CVAs with machine learning
    capabilities can easily accomplish all of these tasks.


    Today, projects span across multiple geographies and time zones, and coordination
    with multiple teams can become a challenge for project managers. With the automation
    provided from using CVAs, what was once complex is now simple.


    CVAs integrate with most enterprise project management tools to automate processes
    and to provide an intuitive, easy-to-use user interface for project managers,
    coordinators, and team members.


    CVAs may not yet be intelligent enough to plan a project or to make decisions,
    but in the near future, such complex tasks may well be within the reach of an
    AI-driven CVA.


    ## Human Resources


    Most processes in human resources—from hiring through the employee lifecycle—are
    pretty standardized these days. Most enterprises have automated these processes
    using ERP products.


    CVAs are a natural fit in HR processes. Recruitment, day-to-day employee interactions,
    query solving, appraisal cycles, and more can be fully automated with cognitive
    virtual assistants.


    CVAs handle shortlisting candidates, scheduling interviews, ensuring that interviews
    happen, getting feedback from interviews, assisting with filling out required
    information forms, and more.


    CVAs are also used in the onboarding process once an employee joins an organization.
    This is a task that requires the CVA to take the employee through the various
    policies and procedures.


    Most new employees have questions and they rely on their colleagues or buddies
    to get this information. With a CVA deployed, the task becomes faster and eliminates
    dependencies. This results in faster onboarding and a better employee experience.
    On an ongoing basis, queries related to processes, policies, changes in policies,
    leaves, travel, emoluments, benefits, insurance, and HR-related areas can be answered
    by CVAs with accuracy and a shorter turnaround time.


    ## Conclusion


    Now that we have discussed cognitive virtual assistants and their uses, we are
    ready to build our own virtual assistant by leveraging the Watson platform. But
    before we do that, let’s deep dive into Watson.


    # Chapter 2: Various Cognitive Platforms/Engines'
