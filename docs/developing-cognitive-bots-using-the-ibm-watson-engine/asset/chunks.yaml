- fmt: "# via Cloud Functions\n\nWe have already covered the step-by-step process\
    \ to create Cloud Functions. Let’s create an action through Cloud Functions in\
    \ IBM Cloud to call the API.\n\n## Creating an Action\n\nDefine the Cloud Functions\
    \ action, as shown in Figure 7-47.\n\n1. Type your Action name (e.g., `action_name`,\
    \ `Tone-Analyzer`).\n2. Create a package under **Enclosing Package** with any\
    \ `package_name` (e.g., `Assistant-Function`).\n3. Select the **Runtime** language.\
    \ In this example, we used Node.js.\n4. Click the **Create** button.\n\n***Figure\
    \ 7-47.** IBM Cloud create Action page*\n\nIn your Cloud Functions actions, replace\
    \ the existing sample code that is used to call the IBM Tone Analyzer service,\
    \ as shown in Figure 7-48.\n\nIn the `url` field and the `iam_apikey` field, replace\
    \ the same URL and API key that you copied while creating the Tone Analyzer service.\n\
    \n```\nfunction main(param) {\n  const ToneAnalyzerV3 = require('ibm-watson/tone-analyzer/v3');\n\
    \  const toneAnalyzer = new ToneAnalyzerV3({\n    version: '2017-09-21',\n   \
    \ url: 'https://gateway-lon.watsonplatform.net/tone-analyzer/api',\n    iam_apikey:\
    \ 'yM29hpdmL6_VDZsxcynOnDy9pl8NW2DVUssu--0i4_Ru',\n    disable_ssl_verification:\
    \ true,\n  });\n  const toneParams = {\n    tone_input: { 'text': param.text },\n\
    \    content_type: 'application/json',\n  };\n  return toneAnalyzer.tone(toneParams)\n\
    \    .then(toneAnalysis => {\n      return { toneAnalysis }\n    });\n}\n```\n\
    \nYou can now start editing the `Tone_Analyzer` function by replacing it with\
    \ the preceding sample code in the **Functions → Actions → Code** console, as\
    \ shown in Figure 7-48.\n\n***Figure 7-48.** IBM Cloud Functions showing code\
    \ snippet*\n\nGo to **Endpoints**. Under the **REST API**, copy and save the URL,\
    \ as shown in Figure 7-49.\n\n***Figure 7-49.** Endpoints page*\n\nClick **API-KEY**.\
    \ Copy and save the API key, as shown in Figure 7-50.\n\n***Figure 7-50.** Namespace\
    \ settings page*\n\nNow let’s call this function in the skill created in the Watson\
    \ Assistant service to fetch the result from the Tone Analyzer service and show\
    \ the response in our bot.\n\n## Calling Cloud Functions in Watson\n\nWe have\
    \ taken a use case in which we are analyzing customers’ shopping experience feedback.\
    \ When a customer gives feedback as input, we capture the text in a variable and\
    \ pass this variable in the cloud function that is calling the Tone Analyzer service.\n\
    \nYou can download the skill JSON that has the use case configured for Tone Analyzer.\n\
    \nGo to GitHub (https://github.com/watson05/Cognitive-Bot) to download the Tone\
    \ Analyzer skill JSON.\n\nImport the downloaded skill in the Watson Assistant\
    \ Service, as explained in the Stock Market Data use case.\n\nOnce you have imported\
    \ the skill, you are directed to the dialog page, where the `Tone_Analyzer` use\
    \ case is configured (see Figure 7-51).\n\n***Figure 7-51.** Dialog page*\n\n\
    Let’s look at the following components defined for the Tone Analyzer use case.\n\
    \n- **Entity:** `@Product`\n- **Entity Values:** Product name, such as Bag, Laptop,\
    \ Mobile Phone, Head Phone, and so forth.\n\nWe have defined the entity as `@Product`\
    \ since we want to know what the customer bought.\n\nWe changed the default Welcome\
    \ message, as shown in Figure 7-52.\n\n***Figure 7-52.** Welcome node*\n\nNavigate\
    \ to the **Dialog** section and click **Dialog**. Click the `Tone_Analyzer` node.\
    \ You see the entity defined as `@Product`. We are asking for overall shopping\
    \ experience feedback with a prompting question, as shown in Figure 7-53.\n\n\
    ***Figure 7-53.** Dialog node with filled in information*"
