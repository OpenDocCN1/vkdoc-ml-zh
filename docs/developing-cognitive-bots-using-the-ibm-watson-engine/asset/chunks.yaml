- fmt: '# Watson Dialog Tree Traversal


    `Watson` processes or traverses all nodes in a top-down approach in the tree.
    It starts with the first node and traverses until the last node.


    ***Figure 4-55.** Single node representation*


    ## Multiple Nodes


    When traversing the nodes, if the condition matches, it enters/triggers the node
    and executes the workflow. It executes each of the child nodes until the condition
    is met.


    ![](index-105_1.jpg)


    Chapter 4 Building Your First Bot using `Watson` assistant


    ***Figure 4-56.** Traversing among Multiple nodes*


    ## Node with Child Nodes


    Let’s say that the user’s query matches the condition in `Node 2`. It triggers
    `Node 2` while traversing from `Node 1`, and then it evaluates the child nodes
    (`Child Node 1`, `Child 2`). Whichever child node’s condition is met executes
    that particular child node. After that will come out of the child node workflow
    and continues moving downward until the last node in the parent branch (i.e.,
    `Node 3`).


    ![](index-106_1.jpg)


    ![](index-106_2.jpg)


