  trans: '

    对话上下文和自动语音识别技术可将语音转换为文本。这使得用户无需掌握复杂技术就能构建高级聊天机器人。Lex 使用与 Amazon Alexa 相同的深度学习算法，并将其开放给开发者，从而缩短开发周期、简化开发流程，构建出复杂且支持自然语言的对话机器人。可以毫不夸张地说，Lex
    普及了深度学习技术，并构建出智能且响应迅速的机器人。由于 Lex 可根据使用情况轻松扩展或缩减，它为运行服务所需的 IT 基础设施带来了弹性。以下是 Amazon
    Lex 的其他优势。


    • **易于使用：** 它提供了一个易于使用的控制台，可快速构建你的聊天机器人。如果你不熟悉 Amazon Lex 控制台，它还提供了预定义的机器人。Lex
    还具有这样的能力：即使只提供几个短语，它也能构建完整的自然语言模型，并智能地将机器人训练到更高水平。


    • **无缝部署和扩展：** 使用控制台，开发者可以立即构建、测试和部署机器人。它还提供了轻松集成到各种应用程序的能力，并能轻松地将语音或文本聊天机器人发布到移动设备、Web
    应用以及 Facebook Messenger、Slack、Twilio 等聊天服务。由于 Lex 采用 SaaS 模式，其基础设施完全具有弹性，你无需担心随着用户量和对话量的增减而扩展基础设施。


    • **成本效益：** Lex 采用高性价比的模式。与其他服务不同，Lex 不收取任何预付费或最低费用。它还提供 Amazon Lex 免费套餐，让用户无需任何初始投资即可试用
    Lex。Amazon Lex 采用按使用量付费的模式，每次请求的成本很低，从而优化了用户的成本支出。


    • **与 AWS 的内置集成：** Lex 拥有许多内置集成——例如 Lambda、MobileHub 和 CloudWatch——允许用户与许多其他 AWS
    服务集成，如 Cognito、DynamoDB、Amazon Polly 等。此功能使 Lex 能够利用 AWS 平台进行监控、安全、业务逻辑、用户认证、存储和移动开发。


    **Amazon Polly**


    人类语音是最强大的沟通方式之一。同一个词，根据其语调、语境和音高，可能具有不同的含义。AWS Polly 是一项基于云的服务，它使用先进的深度学习技术将文本转换为类人语音。它支持多种语言，并拥有一个强大的逼真语音库，使其能够灵活地用于构建支持语音的应用程序，并根据业务场景和最终用户的情感选择合适的语音。Polly
    使用多种神经文本转语音（NTTS）声音，这些声音每天都在进化和学习。NTTS 技术还赋予 Polly 合成新闻播音员说话风格的能力，这种风格针对新闻叙述风格进行了个性化定制。Polly
    可用于增强移动应用、电子学习软件、游戏、面向视障人士的无障碍应用程序、物联网及许多其他领域的人类语音。以下是 Polly 的一些优势。


    • **丰富的语音和语言库：** 与其他服务不同，Polly 提供了大量语言可供选择。它还拥有一个逼真的男性和女性语音库。它同时提供 NTTS 和 TTS
    技术，以合成具有高发音准确性的卓越自然语音。


    • **低延迟：** 为了提供逼真的对话和对话体验，服务必须具备低延迟和快速响应时间。当文本发送到 Polly 的 API 时，它会返回音频

