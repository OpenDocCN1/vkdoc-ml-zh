- fmt: 'There are enterprises that have already implemented cognitive virtual assistants
    (CVA) and are now seeing the benefits in terms of cost savings, elevation of the
    user experience, standardization, simplification, and digitalization.


    These organizations have been able to differentiate themselves from their competition
    and have raised the standards in terms of customer service, net promoter score,
    customer satisfaction scores, and so forth. They have been able to provide a better
    experience to their users by providing an intuitive way to access information
    and data, thus empowering them to better serve their end customers. By leveraging
    CVAs for partners and the ecosystem of suppliers and other stakeholders, the interface
    between enterprises has become simpler and faster. It has enabled quicker dissemination
    of information and eliminated the time waste that arises from multiple communication
    channels and hops.


    Realizing the benefits of cognitive virtual assistants is dependent on the approach
    that an organization wants to take. There are organizations that have created
    a central ecosystem of NLP engines and a single bot instance that is leveraged
    by all departments and functions, which is driven strategically rather than tactically.
    This approach provides the maximum benefit to the organization due to standardization,
    faster learning and adoption, experience sharing between departments, and reuse
    of use cases and data. This also provides a single interface to the customers,
    partners, and employees, albeit with applicable use cases and functionality.


    ## Cognitive Virtual Assistants in the Future


    The rapid adoption of CVAs is an indicator of how things will pan out in the future.
    On the one hand, enterprises are finding newer and more complex use cases for
    deploying CVAs; and on the other hand, technology advancement in the area of natural
    language, speech recognition, image recognition, text extraction, and language
    translation is improving with every passing day.


    When it comes to the Internet-scale consumer side of the CVA story, we are already
    seeing rapid improvements in features, where CVAs are able to mimic language,
    tone, and voice, and talk to humans for specific use cases with such finesse that
    it becomes difficult to gauge that it is a CVA talking on the other end, and not
    a human being.


    Currently, the state-of-the-art CVAs include personal assistants from Google,
    Amazon, Apple, and Microsoft. The current challenge with these personal assistants
    is that they are question-and-answer (Q&A) systems with limited ability to provide
    a context-based complete conversation experience; although Google came out with
    Duplex and demonstrated the capabilities of a fully human-like conversation for
    a few use cases.


    First and foremost, future CVAs will have the ability to converse and understand
    not just one intent but the context of an entire conversation, including deviations
    from the main intent. We humans are not straightforward or predictable when we
    are having conversations, and thus it is challenging for a machine to decipher
    what is coming their way next.


    A lot of AI research is spearheaded by startups, and some of them were acquired
    to rapidly scale up the technology through funding from technology majors. DeepMind,
    the creators of AlphaGo, was acquired by Google in January 2014 for $500 million.
    DeepMind’s technology has since found its way into Google Assistant. Siri was
    acquired by Apple in 2010, and it now powers the virtual assistant in iPhones.
    Facebook bought Wit.ai in 2015; its technology is used by Facebook Messenger.
    Microsoft acquired Maluuba for its AI technology in the area of conversations.'
