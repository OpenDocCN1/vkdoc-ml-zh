- fmt: '# There are obvious and practical security concerns with CVAs. A few consumer
    cognitive virtual assistants are always in “listen mode,” waiting for the voice
    activation keyword. This means that private conversations between humans are constantly
    hitting the CVA’s microphone. The consumer CVA companies are recording some of
    the data and using it for training the system to detect human voice and intent
    better. After all, the deep learning systems working behind the scenes in CVAs
    need massive amounts of real data to be trained and improved.


    Since the CVAs work on audio commands, it is possible to trick them or hack them
    by embedding audio commands that are undetectable by the human ear, by embedding
    these commands in music, or spoken text played out from an electronic device.
    These can be used to manipulate the CVA to do actions controlled by a hacker.
    Another risk associated with CVAs is that hackers can manipulate virtual assistants
    to gain entry into systems, as well as physical access into homes and offices.


    AI technology provides capabilities like CVAs but also makes it easier to impersonate
    and re-create someone’s voice signature. Today, there are technologies that can
    create a fake video of someone with an exact voice signature; this technology
    is getting better by the day.


    These concerns have become news headlines in the recent past. The makers of CVAs
    have come out with recommendations for usage, which provide users better control
    of whether their data is stored and if it used by the provider or not. As consumers
    of these systems, we should be well informed about the risk of private data loss.
    We should be aware of how to use systems in accordance with our privacy needs.


    # Chapter 1 Introduction to Cognitive Virtual Bots


    ## Developer Platforms for CVAs


    There are multiple platforms where you can utilize the core technology for creating
    CVAs and create custom virtual assistants for use by an enterprise.


    The following lists some of the popular platforms.


    - `IBM Watson` is a suite of artificial intelligence products. It offers conversation,
    translation, and other APIs along with an out-of-the-box solution called `Watson
    Assistant` to quickly create and configure a cognitive virtual assistant.

    - `Amazon Lex` and `Polly` are tools provided by Amazon Web Services (AWS) to
    rapidly create and configure a cognitive virtual assistant. AWS has other offerings
    to help users enhance the capabilities of a CVA.

    - `Google` provides `Dialogflow` for developers to create compelling virtual agents.
    It also provides other services, including language translation and speech recognition
    to enhance the basic features of a cognitive virtual assistant.


    ## Bots vs. Cognitive Virtual Assistants


    There are various terms that are used today in the technology space; most popular
    among them are chatbots, virtual agents, virtual assistants, and bots. Although
    these terms sound similar, there are major differences in their functionality
    and features. Let’s try to understand these terms.


    - `Bot` is a short form of `robot`. It defines any automated program that runs
    over the Internet. You may have heard of terms like `Twitter bots` and `chatbots`.
    They are specific examples of bots or software robots that provide a specific
    type of functionality. Chatbots are specific types of software robots that provide
    automated responses to user queries or any other type of conversation.

    - A virtual assistant is a specific type of a bot that performs the function of
    an assistant and assists the user with functions that he intends to perform; for
    example, set an alarm clock, block calendars, read email, play songs, and so forth.

    - Both chatbots and virtual assistants can be scripted or have artificial intelligence
    features. When they are plain scripts, and they do not use natural language understanding
    (NLU), they are not considered a cognitive chatbot or a cognitive virtual assistant.


    The following are features and functions of cognitive chatbots or cognitive virtual
    agents.


    - Natural language understanding capabilities, which means that the bot has the
    intelligence to understand the intent of the query or conversation.

    - Machine learning capabilities that learn from models; the basic input includes
    multiple chat conversations, dictionaries, and language corpuses.

    - The ability to learn from mistakes and increase its understanding of the context
    and intent of a conversation.

    - The ability to integrate with other AI-based services, such as spell checkers,
    language translation, and tone analyzers. These additional AI services make the
    cognitive chatbot or assistant very powerful, as compared to an ordinary chatbot
    or assistant.

    - The ability to have more human-like conversations, since all the above features
    make the cognitive agents more human-like in their conversations as compared to
    ordinary bots.

    - Natural language generation (NLG) capabilities; these bots can generate conversation
    responses as per the personality of the user who is conversing with a chatbot.


    Another significant difference occurs in maintaining the conversational flow.
    While interacting with a chatbot, if you break the conversation, then the bot
    will fail to remember the context of the interaction. On the other hand, a virtual
    assistant utilizes the dynamic conversation flow technique to understand human
    intent, thus enriching the conversation with humans.


    ## Impact on the Enterprises and Ecosystem


    Traditionally, enterprises have used websites and web applications as a means
    of providing information and gathering information from customers. Think of any
    enterprise service today, and you would see that it has a website and various
    applications that are available to authorized users to consume. User experience
    is the mantra today for any digital enterprise, and they have been investing heavily
    to make it better by leveraging various technology innovations. In today’s world,
    digital enterprises have two goals in mind. The first is to become more efficient
    by reducing cycle time and cost, and the other is to enhance the user experience.
    Cognitive virtual assistants are now becoming a key technology to solve both needs.


    Cognitive assistants are delivering an improved user experience along with improved
    security, simpler business processes, and the reduction of monotonous work for
    human agents who can thus be trained to solve problems that are more complex.
    Cognitive virtual agents are becoming the first line of defense, and human agents
    are becoming the fallback when a CVA is unable to answer a query or solve a problem
    for the end user.


    More and more websites are now having virtual assistants as the front-end interaction
    interface for customers, where they can seek information, provide input, search
    for specific content on the website, assist with navigation, fill out forms, request
    services, and updates. Some of these are powered by cognitive technology while
    others are simple scripted bots. Cognitive assistants are being adopted rapidly,
    and most large organizations have implemented or are in the process of implementing
    cognitive virtual assistant technologies.


    ## Use Cases for Cognitive Virtual Assistants


    ### Self Service/Helpdesk for IT Services


    Self-service for IT services by leveraging cognitive virtual assistants is a use
    case, which has tremendous potential to reduce the effort of IT helpdesk teams.
    In a hyper competitive environment, it is a priority for most organizations to
    reduce the cost of delivering IT services while at the same time ensuring that
    the users get the best of the services.


