    ## Slots


    The slots feature helps a dialog node gather or check multiple conditions within
    the same node itself.


    The information that a user provides up front is saved, and the assistant asks
    only for the missing details that it needs to fulfill the request.


    It checks all the conditions defined in the slots and asks a prompting question.
    It proceeds only when all the conditions have been evaluated and met.


    Let’s try to better understand this in the following diagram. When the intent
    for the query is matched, it enters the node and asks the respective questions
    defined in slots 1 and 2 as shown in Figur[e 5-14](#index_split_000.html#p127).
    Once all the slots’ conditions are met, it performs the next action. But if the
    conditions in either slot are not fulfilled, it keeps asking a prompting question.


    ![](index-127_1.jpg)


    ![](index-127_2.jpg)


