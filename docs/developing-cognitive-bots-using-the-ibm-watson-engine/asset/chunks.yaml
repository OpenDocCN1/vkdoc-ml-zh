    **第 1 章**


    **认知虚拟机器人简介**


    昨天还是科幻小说的事物，今天正在成为现实。许多技术都是如此，认知虚拟助手就是这样一种应运而生的技术。


    几年前，我读过一本书，书中主角创建了一个具有认知能力的自学习聊天程序，能够像任何人类一样做出回应。当时，这看起来只是一个与科幻惊悚片相关的故事情节。然而，直到几年前还只是一个概念的东西，如今由于*认知虚拟助手*（更常被称为*聊天机器人*）的出现，已经大规模成为现实。


    聊天机器人是一种计算机程序，它通过听觉或文本方式进行自然语言对话，理解用户的意图，并根据业务规则和组织数据发送响应。它的表现方式与人类在双向对话中的表现相同。


    从 1950 年艾伦·图灵在《计算机器与智能》([`en.wikipedia.org/wiki/Computing_`](https://en.wikipedia.org/wiki/Computing_Machinery_and_Intelligence)
    [Machinery_and_Intelligence](https://en.wikipedia.org/wiki/Computing_Machinery_and_Intelligence))
    一文中提出的概念，以及 1966 年第一个名为 Eliza 的聊天机器人的诞生，发展到今天，它已经演变成一个由人工智能技术和机器学习算法驱动的、非常复杂的互联生态系统。如今，聊天机器人可以帮助用户订披萨、预订假期、购买保险单，或执行像管理企业
    IT 基础设施这样非常复杂的任务，以及更多其他功能。


    © Navin Sabharwal, Sudipta Barua, Neha Anand, Pallavi Aggarwal 2020

    N. Sabharwal 等人著，《使用 IBM Watson 引擎开发认知机器人》，

    `doi.org/10.1007/978-1-4842-5555-1_1`


    第 1 章 认知虚拟机器人简介


    随着以客户为中心的个性化体验的兴起，当今企业必须能够在较短的周转时间内，以更高的个性化程度，并且在客户历史和画像方面零延迟地与其最终用户进行相关对话。根据高德纳公司的数据，到
    2020 年，25% 的客户服务运营将使用虚拟客户助手

    ([`www.gartner.com/en/newsroom/press-releases/2018-02-19-`](https://www.gartner.com/en/newsroom/press-releases/2018-02-19-gartner-says-25-percent-of-customer-service-operations-will-use-virtual-customer-assistants-by-2020)
    [gartner-says-25-percent-of-customer-service-operations-will-](https://www.gartner.com/en/newsroom/press-releases/2018-02-19-gartner-says-25-percent-of-customer-service-operations-will-use-virtual-customer-assistants-by-2020)
    [use-virtual-customer-assistants-by-2020)。](https://www.gartner.com/en/newsroom/press-releases/2018-02-19-gartner-says-25-percent-of-customer-service-operations-will-use-virtual-customer-assistants-by-2020)
    它进一步预测，虚拟聊天代理有望丰富客户体验，在整个互动过程中帮助客户，并代表客户处理交易。有趣的是，由谷歌、IBM、Facebook、微软等公司提供的开源平台推动的技术民主化，使得即使没有专业程序员也能创建聊天机器人。


    如果这些数据点让你感到兴奋，并且你想探索构建自己的虚拟聊天代理的可能性，那么这本书就是为你准备的。


    本书可作为在 IBM 开发的 Watson 平台上构建聊天机器人的指南。我们将为银行、金融、保险、旅游、股票市场等不同用例开发聊天机器人。我们还将讨论其他认知平台，如
    LUIS、Lex 和 Dialogflow。在本书的后续部分，我们将探索不同的机器人框架，例如 Microsoft Bot Framework 和 Bot
    Builder。


    让我们更深入地探讨本书的主题：认知虚拟助手。*助手*一词指的是协助执行任务或活动的人或物。*虚拟*一词很容易让人联想到软件以及存在于虚拟世界中的事物。*认知*一词则与人类的认知能力有关。


