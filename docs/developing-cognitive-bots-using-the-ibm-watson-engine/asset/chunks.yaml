    \ the two intents were identified based on the confidence score, so the bot responded\
    \ with a prompting response with the intents as options.\n\n## Showcasing Solutions\
    \ in Various Formats\n\n### Text\n\nYou can provide the bot’s response in text\
    \ format by selecting **Text** from the responses drop-down in the node field,\
    \ as shown in Figure [5-48](#index_split_001.html#p155).\n\n![](index-155_1.jpg)\n\
    \n![](index-155_2.jpg)\n\nChapter 5 Advanced Concepts of Watson Agent\n\n***Figure\
    \ 5-48.** Response*\n\n### HTML\n\nIf you want to show content in a rich format\
    \ in HTML, like a table or form, you can do it in the response section. Simply\
    \ paste the HTML content in the response section, as shown in Figure [5-49](#index_split_001.html#p155).\n\
    \n***Figure 5-49.** Response added*\n\n### Options\n\nIf you want to showcase\
    \ options as buttons, then select **Options** from the drop-down menu, as shown\
    \ in Figures [5-50 and 5-51](#index_split_001.html#p156).\n\n![](index-156_1.jpg)\n\
    \n![](index-156_2.jpg)\n\nChapter 5 Advanced Concepts of Watson Agent\n\n***Figure\
    \ 5-50.** Drop-down in Then Respond with*\n\n***Figure 5-51.** Option value added*\n\
    \n## Conclusion\n\nThis chapter concludes with various advanced features to enhance\
