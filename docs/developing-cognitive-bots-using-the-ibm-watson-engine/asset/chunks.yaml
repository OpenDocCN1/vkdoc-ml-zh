  trans: '

    已有企业成功部署了认知虚拟助手（CVA），并切实感受到了其在成本节约、用户体验提升、标准化、简化流程及数字化转型方面带来的益处。


    这些组织已能够从竞争中脱颖而出，并在客户服务、净推荐值、客户满意度评分等方面树立了更高标准。通过提供直观的信息与数据访问方式，它们为用户带来了更优质的体验，从而赋能用户更好地服务其终端客户。借助面向合作伙伴、供应商生态系统及其他利益相关方的
    CVA，企业间的交互变得更加简洁高效。这加速了信息传播，消除了因多渠道沟通和层层传递造成的时间浪费。


    实现认知虚拟助手的价值取决于组织所采取的策略。有些组织构建了由自然语言处理引擎和单一机器人组成的中央生态系统，该机器人由所有部门和职能机构共同使用，其驱动方式更具战略意义而非战术性。由于标准化、更快的学习和采纳速度、部门间的经验共享以及用例与数据的复用，这种方法为组织带来了最大化的收益。同时，这也为客户、合作伙伴和员工提供了统一的交互界面，并配备了相应的用例和功能。


    **认知虚拟助手的未来**


    CVA 的快速普及预示着未来的发展趋势。一方面，企业正在为部署 CVA 寻找更新、更复杂的用例；另一方面，自然语言、语音识别、图像识别、文本提取和语言翻译等领域的技术正日新月异地进步。


    就 CVA 在互联网规模的消费端应用而言，我们已经看到其功能在快速提升。CVA 能够模仿语言、语调和声音，并在特定用例中与人类进行如此精妙的对话，以至于人们很难分辨出另一端是
    CVA 在交谈，而非真人。


    目前，最先进的 CVA 包括来自谷歌、亚马逊、苹果和微软的个人助手。这些个人助手当前的挑战在于，它们本质上是问答系统，提供基于上下文的完整对话体验的能力有限；尽管谷歌推出了
    Duplex，并在少数用例中展示了完全类人对话的能力。


    首先，未来的 CVA 将不仅能理解单一意图，还能理解整个对话的上下文，包括偏离主要意图的部分。我们人类在对话时并非直截了当或可预测的，因此，机器要解读接下来可能出现的对话内容颇具挑战性。


    大量人工智能研究由初创公司引领，其中一些公司被收购，以便通过科技巨头的资金支持快速扩展技术。AlphaGo 的创造者 DeepMind 于 2014 年 1
    月被谷歌以 5 亿美元收购。此后，DeepMind 的技术被应用于谷歌助手。Siri 于 2010 年被苹果收购，如今为 iPhone 中的虚拟助手提供支持。Facebook
    于 2015 年收购了 Wit.ai，其技术被用于 Facebook Messenger。微软则收购了 Maluuba，以获取其在对话领域的人工智能技术。'
- fmt: '# The Future of Cognitive Virtual Assistants


    The newer technologies trying to mimic the way the human brain works will make
    it possible for cognitive virtual agents to be more human-like in their conversations.


    We also need CVAs to understand the tone and emotion behind conversations. Language
    is complex; the same sentence spoken in a different context or with a different
    tone of voice can have an entirely different meaning. The huge amounts of data
    that personal cognitive virtual assistants are receiving every day from humans
    interacting with them on a massive global scale, makes it possible to move forward
    and create CVAs that not only understand intent and context but also the emotions
    behind conversations.


    Apart from personal virtual agents, the CVAs in devices and automobiles are gaining
    momentum. Cars and automobiles are an interesting use case because a cognitive
    in-car companion will look after the driver and the passengers in an unobtrusive
    fashion. It can hook onto the data sent from all the vehicle sensors, and it can
    act as a voice assistant to alert the driver and provide directions. This model
    is different from the auto drive model in which the automobile simply takes you
    from one place to another. The CVA can work in an automated mode and help passengers
    with things like choice of music, climate control, the best route, and other aspects
    of the journey.


    Features like `dial-home-in-case-of-emergency` or `dial an ambulance` will be
    common features in a CVA, which will provide complete information in case of an
    accident or an emergency. Personal information about the driver and the passengers
    in an emergency, such as blood type and medical history, can be readily accessed
    by the personal assistant and help save lives.


    CVAs in enterprises will soon become the single application that an employee needs
    to be interviewed, hired, and on-boarded, or to get work completed, submitted,
    and evaluated as well. The whole lifecycle of an employee—from hiring to retiring—will
    be handled by powerful digital assistants that are integrated with back-end ERP
    and HR systems. Employee service bots like `DRYiCE Lucy` are enabling enterprises
    with these features and expanding their use cases and coverage.


    With these capabilities and the rapid expansion of the use cases that CVAs can
    accomplish, low-level tasks like booking tickets, resolving problems, serving
    food, managing orders, responding to email queries, solving IT problems, and so
    forth, will be taken over by CVAs. Conversations will be more human-like, and
    it will be difficult if not impossible to distinguish between a human agent and
    a CVA.


    The CVAs will be able to emulate human behavior, such as empathy and understanding,
    but we must be conscious that this will be an emulation and not a human equivalent
    because humans are driven by emotions, whereas a CVA is using logic to understand
    and respond to an emotion.


    In the service industry, humans are trained to recognize emotions and respond
    in a particular fashion if a customer is frustrated or angry, which is not a true
    emotion but a scripted response to make the customer feel happy. Though based
    on the experience of the conversation, the chances of bias of a human service
    assistant is much higher than a CVA.


    It is also true that such innovations will trigger concerns over the impact of
    CVAs on human jobs and their future. However, you can think of a contrarian view
    in which humans have converted other humans into machines. With the advancement
    in technology, we are trying to reclaim human life and make it better and richer,
    and move humans out of tasks that are mundane and repetitive and do not leverage
    much intelligence. These jobs were not automated sooner because the technology
    and hardware innovations required to solve these problems were complex and not
    scalable, even though the tasks are simpler when compared to an assembly line
    that manufactures automobiles.


    The next frontier beyond voice recognition and understanding the emotions behind
    human conversations is gestures. It will not only require technology advancement
    to recognize gestures but essentially this will be another model of communication
    added back to human modes of communication. Humans will have to learn gestures,
    just like they learned writing and typing to communicate rather than speaking.
    It will be an evolution from both sides: humans using gestures and the CVAs learning
    to understand what they mean.


    It is entirely possible that this may be completely skipped, and we move to a
    model where technology advances to understand and interpret our thoughts—and we
    don’t need gestures to communicate. If this happens, the next level of advancement
    will be CVAs reading our thoughts and taking actions accordingly. The impact of
    this technology advancement will take the world by storm. It will be one more
    science fiction fantasy that turns to reality; but it is an amazing one.


    CVAs will not be limited to question-and-answer systems or systems that aid a
    human in delivering what he or she desires; the next evolution in the CVA technology
    will be a merger of the ability of CVAs to understand instructions with the best
    option for the user. This will be the first step where a human not just orders
    but listens to what a CVA suggests. Examples of these systems are already there.
    Technologies like `Google Maps`, which guides a human rather than takes orders,
    or recommendation systems that suggest what users should buy, or price comparison
    engines that help users compare and buy products online are all available today.


    The role of CVAs in applications and situations that demand collaboration and
    collation of data from various sources will accelerate and expand. Let’s understand
    this with a simple example. Blocking calendars for a large number of people, organizing
    a meeting, and booking meeting rooms are time-consuming tasks that require access
    to calendar information, meeting room booking systems, and other applications.
    Such tasks can be easily automated by a CVA because it has access to all systems
    and can process the data in seconds. For a human being to do this requires multiple
    clicks and interfacing with multiple applications. CVAs are far more efficient
    than humans in repetitive monotonous tasks that require access to information
    and a rule base. The future is not far away when all enterprises will have a cognitive
    virtual agent for booking meetings. It will also keep a track of the availability
    of people, meeting rooms to confirm the meeting, send reminders, or suggest alternate
    meeting slots that are suitable for all the attendees.


    These days, you may find doomsday predictions in news articles about the inevitable
    invention of “general-purpose AI” and the singularity, when humanity creates an
    AI capable of reconfiguring itself over and over again and achieving superintelligence.
    What happens when that becomes a reality is something that will only present itself
    if it happens.


    But if we look at the current applications of AI, the world has moved toward “specific
    AI,” which means a machine does one specific task and accomplishes it well, sometimes
    surpassing human capabilities. If we look at the AI systems created by `OpenAI`
    and `DeepMind`, they are capable of beating the best humans on the planet in games
    for which the system has been trained on. With deep learning it is becoming simpler
    albeit computationally and data intensive to train systems. If we extrapolate
    and look at the technology innovations in cognitive virtual assistants, we see
    the same trends—the advent of specific assistants that do limited tasks really
    well.


    The future of cognitive virtual assistants should be much more interconnected.
    Different specialized bots in enterprise and personal computing spaces will work
    in tandem and provide simple intuitive'
