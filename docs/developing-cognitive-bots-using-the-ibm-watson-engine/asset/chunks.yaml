- fmt: '# Chapter 5 Advanced Concepts of Watson Assistant


    We have simply defined the intent condition. This enables the **Multiple conditioned
    response** option and sets the condition in `IF ASSISTANT RECOGNIZES`. The node
    appears, as shown in Figure [5-25](#index_split_000.html#p135).


    ***Figure 5-25.** Multiple conditioned responses with different conditions within
    the same node*


    This way, we reduce the tree structure and check the condition in the same node,
    showing the respective responses. The same use case can be configured in slots
    using context variables with multiple conditioned responses. We can avoid this
    step and do this from within one node.


    The basic differences between slots and multiple conditioned responses is that
    slots force you to go through all the options and provide the option to set context
    variables. You can choose the right option for your use case based on this.


    ## Digression


    Digression is a way to achieve context switching. You can handle the scenario
    where user starts one use case and moves through the dialog but suddenly asks
    a different query that is related to a different use case.


    In this scenario, we need to complete the digressed workflow and then come back
    to the original use case that the user initiated.


    Let’s discuss digression with the “Reset Password” and the “Configure Out of Office”
    use cases. The example will digress between the dialogs and resume the original
    workflow after completing the digressed workflow.


    Download `Advance_Topics-Slots_Digression.json` for the “Configure Out of Office”
    and “Reset Password” use cases from [https://github.com/watson05/Cognitive-Bot](https://github.com/watson05/Cognitive-Bot).
    Refer to Chapter 4 for how to import a JSON file into a Watson agent.


    The two use cases are configured in the dialog in Figure [5-26](#index_split_001.html#p137).


    ![](index-137_1.jpg)


    ***Figure 5-26.** Two use cases shown for digression*


    The user enters the query as “I want to reset password.” Watson Assistant provides
    options to select either Gmail or Outlook. Rather than selecting an option, the
    user enters, “I want to configure out of office.”


    Since the user has asked something entirely different from the current use case,
    the workflow digresses to the node where the “Configure Out of Office” use case
    is configured, and then performs the steps.


    To achieve this, navigate to the node from where you want to digress. Enable the
    digressions for that node. Click **Customize** and then select **Digressions**.
    The node has a pop-up for selecting and enabling the options, as shown in Figure
    [5-27](#index_split_001.html#p138).


    ![](index-138_1.jpg)


    ![](index-138_2.jpg)


    ***Figure 5-27.** Digression selected*


    Select the first option and switch it On. Click **Apply**, as shown in Figure
    [5-28](#index_split_001.html#p138).


    ***Figure 5-28.** Select option 1 from Digression*


    ![](index-139_1.jpg)


    Let’s see if the dialog handles the change by navigating to the Dialog page and
    clicking **Try it out**, as shown in Figure [5-29](#index_split_001.html#p139).


    ***Figure 5-29.** Try it out result*


    The dialog found the new intent but did not digress to the “Configure Out of Office”
    workflow.


    To achieve a digression to the correct use case, you have to make a few changes
    to the “Configure Out of Office” use case dialog. Click the node and select **Digressions**.
    Select the second option and click **Apply**, as shown in Figure [5-30](#index_split_001.html#p140).


    ![](index-140_1.jpg)


    ***Figure 5-30.** Select option 2 from Digression*


    We are simply configuring this node to allow for digressions to come into this
    node from elsewhere in the workflow. Having done this, use the Try It Out panel
    to see the results, as shown in Figures [5-31](#index_split_001.html#p141) and
    [5-32](#index_split_001.html#p142).'
