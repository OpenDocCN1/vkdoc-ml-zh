    ## Chapter 2 Various Cognitive platforms/engines


    ### Azure Products and Services


    With the help of Azure Bot service, we can build applications and agents that
    can decipher natural language input and simulate a conversation with end users
    that emulates a human to human conversation. The elements of building such an
    AI-enabled ecosystem of cognitive services are depicted in Figure [2-2](#index_split_000.html#p36).


    **Language**


    **Vision**


    **Speech**


    **Azure**


    **Services**


    **Decision**


    **Search**


    ***Figure 2-2.** Azure Services*


    ### Language


    Language is the basic element that ensures that applications and services can
    fully understand the value of unstructured text or can recognize the intent behind
    a speaker’s utterances. It is divided into three parts: Text Analytics, QnA Maker,
    and Translator Text API.


    ### Text Analytics


    Text Analytics is a cloud-based service that provides advanced natural language
    processing over input text, along with processing four major functions: sentiment
    analysis, key phrase extraction, language detection, and entity recognition.


    *Sentiment analysis* discovers a customer’s gestures by analyzing raw text, whether
    it is positive or negative. *Key phrase extraction* identifies the main points
    in the phrase. *Language detection* deciphers the variant in which the text is
    written, and converts a single language code for every document submitted on the
    request in a wide range of languages, variants, and dialects. *Entity recognition*
    identifies and categorizes entities as people, places, organizations, date and
    time, quantities, percentages, and currencies.


    ### QnA Maker


    This is a cloud-based service that helps to create a conversational question/answer
    platform over the existing data. It builds a knowledge base by extracting queries
    from semistructured content, which includes FAQs, manuals, and documents. Answering
    users’ questions with the best possible answers from the QnAs leads to the creation
    of the knowledge base. The best part of QnA Maker is that it becomes smarter as
    it constantly learns from user behavior.


