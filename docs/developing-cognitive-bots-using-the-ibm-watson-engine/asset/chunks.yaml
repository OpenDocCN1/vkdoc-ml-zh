  trans: "\n**通过 Cloud Functions**\n\n我们已经逐步介绍了创建 Cloud Functions 的流程。接下来，我们将通过 IBM\
    \ Cloud 中的 Cloud Functions 创建一个操作来调用 API。\n\n**创建操作**\n\n定义 Cloud Functions 操作，如图\
    \ 7-47 所示。\n\n1.  输入你的操作名称（例如，[action_name]，\n    Tone-Analyzer）。\n2.  在 **封闭包**\
    \ 下创建一个包，并指定任意 [package_name]（例如，Assistant-Function）。\n3.  选择 **运行时** 语言。在此示例中，我们\n\
    \    使用了 Node.js。\n4.  点击 **创建** 按钮。\n\n***图 7-47.** IBM Cloud 创建操作页面*\n\n第 7\
    \ 章 与高级服务集成\n\n在你的 Cloud Functions 操作中，替换用于调用 IBM Tone Analyzer 服务的现有示例代码，如图 7-48\
    \ 所示。\n\n在 **url** 字段和 **iam_apikey** 字段中，替换你在创建 Tone Analyzer 服务时复制的相同 URL 和\
    \ API 密钥。\n\nfunction main(param) {\n\nconst ToneAnalyzerV3 = require('ibm-watson/tone-analyzer/v3');\n\
    \nconst toneAnalyzer = new ToneAnalyzerV3({\n\nversion: '2017-09-21',\n\nurl:\
    \ 'https://gateway-lon.watsonplatform.net/tone-analyzer/\n\napi',\n\niam_apikey:\
    \ 'yM29hpdmL6_VDZsxcynOnDy9pl8NW2DVUssu--0i4_Ru',\n\ndisable_ssl_verification:\
    \ true,\n\n});\n\nconst toneParams = {\n\ntone_input: { 'text': param.text },\n\
    \ncontent_type: 'application/json',\n\n};\n\nreturn toneAnalyzer.tone(toneParams)\n\
    \n.then(toneAnalysis => {\n\nreturn {toneAnalysis\n\n}\n\n});\n\n}\n\n现在，你可以开始编辑\
    \ Tone_Analyzer 函数，方法是在 Functions → Actions → Code 控制台中将上述示例代码替换进去，如图 7-48 所示。\n\
    \n![](img/index-240_1.jpg)\n\n![](img/index-240_2.jpg)\n\n第 7 章 与高级服务集成\n\n***图\
    \ 7-48.** 显示代码片段的 IBM Cloud Functions*\n\n转到 **端点**。在 **REST API** 下，复制并保存该 URL，如图\
    \ 7-49 所示。\n\n***图 7-49.** 端点页面*\n\n点击 **API-KEY**。复制并保存 API 密钥，如图 7-50 所示。\n\n\
    ![](img/index-241_1.jpg)\n\n第 7 章 与高级服务集成\n\n***图 7-50.** 命名空间设置页面*\n\n现在，让我们在\
    \ Watson Assistant 服务中创建的技能里调用此函数，以从 Tone Analyzer 服务获取结果，并在我们的机器人中显示响应。\n\n**在\
    \ Watson 中调用 Cloud Functions**\n\n我们选取了一个分析客户购物体验反馈的用例。当客户输入反馈时，我们将文本捕获到一个变量中，并将此变量传递给调用\
    \ Tone Analyzer 服务的云函数。\n\n你可以下载已配置好 Tone Analyzer 用例的技能 JSON 文件。\n\n前往 GitH[ub\
    \ (https://github.com/watson05/Cognitive-Bot](https://github.com/watson05/Cognitive-Bot))\
    \ 下载 Tone Analyzer 技能 JSON 文件。\n\n按照股票市场数据用例中的说明，将下载的技能导入 Watson Assistant 服务。\n\
    \n导入技能后，你将进入对话框页面，其中已配置好 Tone_Analyzer 用例（参见图 7-51）。\n\n![](img/index-242_1.jpg)\n\
    \n第 7 章 与高级服务集成\n\n***图 7-51.** 对话框页面*\n\n让我们看看为 Tone Analyzer 用例定义的以下组件。\n\n\
    • **实体：** @Product\n• **实体值：** 产品名称，例如包、笔记本电脑、\n    手机、耳机等。\n\n我们定义了实体 @Product，因为我们想知道客户购买了什么。\n\
    \n我们更改了默认的欢迎消息，如图 7-52 所示。\n\n![](img/index-243_1.jpg)\n\n![](img/index-243_2.jpg)\n\
    \n第 7 章 与高级服务集成\n\n***图 7-52.** 欢迎节点*\n\n导航到“对话框”部分并点击 **对话框**。点击 Tone_Analyzer\
    \ 节点。你会看到实体被定义为 @Product。我们通过一个提示性问题来询问整体的购物体验反馈，如图 7-53 所示。\n\n***图 7-53.** 已填写信息的对话框节点*\n"
- fmt: "We have captured the customer shopping experience feedback that was given\
    \ as input text in a `$text` context variable, which is passed in the API, as\
    \ shown in Figure [7-54](#index_split_001.html#p244).\n\n![Figure 7-54. Dialog\
    \ node with information](index-244_1.jpg)\n\nThe following is the sample JSON\
    \ that we are using to call the cloud function.\n\n```json\n{\n  output: {\n \
    \   text: {\n      values: [],\n      selection_policy: sequential\n    }\n  },\n\
    \  actions: [\n    {\n      name: /watsonbot05%40gmail.com_dev/Assistant-Function/Tone_Analyzer,\n\
    \      type: cloud_function,\n      parameters: {\n        text: <? $text ?>\n\
    \      },\n      credentials: $credentials,\n      result_variable: $response\n\
    \    }\n  ],\n  context: {\n    credentials: {\n      api_key: f2a23cdb-5947-4a67-a960-4eef2a9d2a5d:dfXh7zrBUgXqkG51zTGmL3gaXUi57KToRgG7HAOx8qWbgmb0U4E1UcMo7Aul2Hh6\n\
    \    }\n  }\n}\n```\n\nWe’ll call the cloud function in the JSON editor by clicking\
    \ the **Open JSON editor** in the **Then set context** hamburger menu.\n\nReplace\
    \ the code in the open JSON editor, as shown in Figure [7-55](#index_split_001.html#p245).\n\
    \n![Figure 7-55. Open JSON editor](index-245_1.jpg)\n\nFor the action name in\
    \ JSON, you need a part of your cloud function URL, which should look similar\
    \ to this:\n\n`https://eu-gb.functions.cloud.ibm.com/api/v1/namespaces/watsonbot05@gmail.com_dev/actions/Assistant-Function/Tone_Analyzer`\n\
    \nThe actions section needs to be filled in the JSON editor node, like this: `name:\
    \ /watsonbot05%40gmail.com_dev/Assistant-Function/Tone_Analyzer`.\n\nTo enter\
    \ the credentials in the context, replace the `api_key` value with your Cloud\
    \ Functions API key; for example, `api_key: 1234567890-example`. We have called\
    \ the Tone Analyzer API with a shopping experience feedback parameter. Now we\
    \ need to show the result fetched from the API. For this, we added a child node\
    \ with the jump to **Response** from the parent node, as shown in Figure [7-56](#index_split_001.html#p246)\
    \ and Figure [7-57](#index_split_001.html#p247).\n\n![Figure 7-56. Child node\
    \ to capture the response from API](index-247_1.jpg)\n\n![Figure 7-57. Jump to\
    \ Response](index-247_2.jpg)\n\nWe have fetched the response from the API in a\
    \ `$response` context variable, which is mentioned in the `result_variable`, as\
    \ shown in Figure [7-58](#index_split_001.html#p247).\n\n![Figure 7-58. JSON showing\
    \ result_variable](index-248_1.jpg)\n\nNow let’s try our use case on the bot (i.e.,\
    \ assistant). Link the skill with the assistant, as you did earlier in the chapter.\
    \ Try the use case to see tone analyzer of customer feedback given based on their\
    \ recent shopping experience, as shown in Figure [7-59](#index_split_001.html#p248),\
    \ Figure [7-60](#index_split_001.html#p249), and Figure [7-61](#index_split_001.html#p250).\n\
    \n![Figure 7-59. Testing the use case on the bot](index-249_1.jpg)\n\n![Figure\
    \ 7-60. Result shown](index-250_1.jpg)\n\n![Figure 7-61. Result shown](index-250_2.jpg)\n\
    \n## Conclusion\n\nThis concludes the chapter on the various types of use cases\
    \ that we can develop using built-in advanced IBM AI services to further enrich\
