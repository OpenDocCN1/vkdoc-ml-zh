  trans: '

    同时进行的对话中，IT 服务台里人们等待响应的任何高峰都被消除了。借助 CVA 提供的自助服务功能，用户可以解决大部分与笔记本电脑、台式机、电子邮件、Microsoft
    Office 套件或其他企业应用相关的查询或问题。


    第 1 章 认知虚拟机器人简介


    像密码重置或访问应用程序帮助这样简单但通常量很大的用例，可以轻松由 CVA 完成，从而腾出 IT 资源的时间，去帮助用户解决更复杂的问题。


    由于 IT 贯穿各个垂直行业，这里创建的用例可以跨多个行业垂直领域复用。许多垂直行业（包括银行与金融服务、旅游、医疗保健、酒店和零售）已经在为 IT 服务台用例部署
    CVA 的道路上。


    一些机器人捆绑了 IT 服务台用例，以便更快地采用并实现即用型消费。其中一个这样的机器人框架是 DRYiCE Lucy，它为 IT 提供了数百个开箱即用的用例

    ([www.dryice.ai/](http://www.dryice.ai/))。


    **分类**


    分类类别下有许多用例。一些 IT 服务台用例也属于分类范畴。一个分类 CVA 可以询问和探究用户面临的问题，然后将其引导或分类到正确的信息或正确的人工客服那里去解决问题。


    为了更好地理解分类用例，可以将其视为一个智能 IVR。IVR 要求用户在电话网络中选择一个选项，并根据所选选项提供信息或转接给人工客服。电信公司、宽带公司或银行的
    IVR 系统是分类如何工作的一个很好的例子。


    组织可以利用 CVA 的能力将 IVR 转变为智能通信，从而提升用户体验。


    智能 CVA 可以解读用户想要什么，并且比 IVR 更快地提供正确的信息。由于 CVA 可以与企业应用集成，像查询账户余额或证券余额这样的信息，用 CVA
    实现起来很容易。


    第 1 章 认知虚拟机器人简介


    **线索生成**


    线索生成，曾被认为是一项需要人类完成大部分任务的活动，正在迅速实现自动化。


    线索生成 CVA 大多嵌入在网站中。当你进入组织网站的任何页面时，会弹出一个 CVA 弹窗，并与访问者开始对话。


    使用 CVA 作为网站上的线索生成前端正在迅速普及，如今，大多数网站都有 CVA 协助访问者获取信息。


    CVA 在网站上的好处是，访问者可以快速直观地获取信息，无需浏览整个网站并逐页导航来获取所需信息。


    在这种情况下，由于访问者正在与 CVA 交互，用户不再是被动的访问者，而是活跃的访问者，他们通过聊天对话提供信息，这些信息随后可用作线索、反馈等。


    **电子商务**


    电子商务虚拟助手正在帮助数百万消费者通过直观的界面浏览、选择和购买产品和服务。


    由于电子商务网站上列出了数百万种产品，用户越来越难以搜索和找到他们想要购买的商品和服务。CVA 具有利用机器学习技术进行对话和快速搜索信息的广泛能力，这使得在线买卖变得更加容易。


    电子商务 CVA 具有扩展功能和能力，包括匹配买家和卖家的算法。


    有了 CVA，整个交易变得自然且双向，这与静态且没有对话流程的网站形成对比。


    想象一个场景，你在询问一个产品，CVA 可以精确定位并向你展示你想要的 exact 产品。在一个静态的

    第 1 章 认知虚拟机器人简介


    网站上，如果价格不符合你的预期，你可能不会购买该产品。然而，CVA 可能会查找其他优惠，并根据智能算法为你提供更好的价格。这极大地提升了用户体验。


    **与企业应用集成**


    我们大多数人都熟悉集成到智能手机或音箱中的流行虚拟助手，例如苹果的 Siri 和亚马逊的 Echo (Alexa)。在企业方面，我们看到领先的 SaaS 公司正在将流行的消息机器人（如
    Facebook Messenger）集成到他们的应用程序中。


    主要的 ERP 提供商，如 SAP 和 Oracle，也在为其应用程序开发虚拟助手。该领域的一些聊天机器人示例包括 Salesforce 的 Einstein
    Bot。


    **任务跟踪与项目管理**


    任务管理、提醒和报告是项目中的典型活动。


    认知虚拟助手可以查找信息、整理信息并与企业项目管理系统集成，这使得它们非常适合简化和自动化项目管理流程。


    用户可以使用 CVA 来设置提醒、请求项目状态、安排会议以及搜索项目相关文档。具有机器学习能力的 CVA 可以轻松完成所有这些任务。


    如今，项目跨越多个地理位置和时区，与多个团队的协调对项目经理来说可能是一个挑战。借助使用 CVA 提供的自动化，曾经复杂的事情现在变得简单了。


    CVA 与大多数企业项目管理工具集成，以自动化流程，并为项目经理、协调员和团队成员提供直观、易于使用的用户界面。


    第 1 章 认知虚拟机器人简介


    CVA 可能还不足以智能到可以规划项目或做出决策，但在不久的将来，这些复杂的任务很可能在 AI 驱动的 CVA 的能力范围之内。


    **人力资源**


    从招聘到员工生命周期的整个人力资源流程，如今都已相当标准化。大多数企业使用 ERP 产品自动化了这些流程。


    CVA 在人力资源流程中非常契合。招聘、日常员工互动、问题解答、评估周期等都可以通过认知虚拟助手完全自动化。


    CVA 处理候选人筛选、安排面试、确保面试进行、收集面试反馈、协助填写所需信息表格等任务。


    CVA 也用于员工加入组织后的入职流程。这项任务需要 CVA 引导员工了解各种政策和程序。


    大多数新员工都有疑问，他们依赖同事或伙伴来获取这些信息。部署了 CVA 后，任务变得更快，并消除了依赖性。这带来了更快的入职速度和更好的员工体验。在日常工作中，与流程、政策、政策变更、休假、差旅、薪酬、福利、保险以及人力资源相关领域的查询，都可以由
    CVA 准确且以更短的周转时间进行解答。


    **结论**


    既然我们已经讨论了认知虚拟助手及其用途，我们准备利用 Watson 平台来构建我们自己的虚拟助手。但在那之前，让我们深入了解 Watson。


    **第 2 章**


    **各种认知**


    **平台/引擎**

