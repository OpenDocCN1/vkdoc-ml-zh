    **CHAPTER 1**


    **Introduction to**


    **Cognitive Virtual Bots**


    What was science fiction yesterday is becoming reality today. This is true for
    many technologies, and the cognitive virtual assistant is one such technology
    whose time has come.


    A couple of years ago, I read a book where the protagonist created a self-learning
    chat program that had cognitive abilities to respond, just as any human being
    would. At that time, it looked like a plot that was only relevant to a sci-fi
    thriller. What was just a concept until a few years ago, however, is now a reality
    at scale due to the advent of *cognitive virtual* *assistants*—more commonly known
    as *chatbots*.


    A chatbot is a computer program that converses in natural language via auditory
    or textual methods, understands the intent of the user, and sends a response based
    on business rules and organizational data. It demonstrates itself in the same
    way that a human would during a two-way conversation.


    What started as a concept in a 1950 article by Alan Turing in *Computing* *Machinery
    and Intelligence* [(https://en.wikipedia.org/wiki/Computing_](https://en.wikipedia.org/wiki/Computing_Machinery_and_Intelligence)


    [Machinery_and_Intelligence](https://en.wikipedia.org/wiki/Computing_Machinery_and_Intelligence)),
    and the 1966 creation of the first chatbot, known as Eliza, has today evolved
    into a very complex connected


    ecosystem powered by artificial intelligence (AI) technologies and machine learning
    algorithms. Today, a chatbot can help its user with ordering a pizza, booking
    a vacation, buying an insurance policy, or a very complex task like managing the
    IT infrastructure of an enterprise, and much more.


