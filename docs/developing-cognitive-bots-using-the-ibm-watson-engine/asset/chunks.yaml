    `Delete` deletes the node.


    `Skip user input` is used when you want to bypass waiting for user input and go
    directly to the first child node of the current node. It is enabled if a node
    has one or more child nodes.


    `Jump to` is a condition statement that provides an option to create branches
    and jump from one node to another node in the workflow if certain conditions are
    met. You need to select the node from which you want to jump. Select the node
    where you want to jump to in the workflow, and then configure one of the three
    options, as shown in Figure [4-68.](#index_split_000.html#p110)


    ***Figure 4-68.** Jump To option*


    `Wait for user input` waits for the user to input the query, and then it moves
    the workflow to the next step. The dialog will not progress until the user provides
    more input.


    **Scenario 1: Node with Child Nodes**


    When a user enters a query, it triggers the matched node and waits for the user
    to input something. If that user input is matched with the condition defined in
    the subsequent child nodes (Child Node 1, Child Node 2), it executes that particular
    child node.


    ![](index-113_1.jpg)


    ![](index-113_2.jpg)


