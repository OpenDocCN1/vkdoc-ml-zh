    a few lines of code. Research shows that the chances of stickiness is higher when
    individuals are exposed to a conversation or information interface like a website,
    customer agent, or blogs and post that is in their own native language. To do
    so manually would mean a long turnaround time, not to mention the high costs


    involved in the translation of all the digital assets that any organization would
    have.


    Amazon Translate is built on the technology of neural machine'
  trans: '

    以流的形式传输到应用程序，使语音能够立即播放，从而实现低延迟的类人对话与交互。


    **Amazon Rekognition**


    AWS 的人脸识别技术称为 Rekognition。这项基于网络的服务使开发者能够为应用程序添加图像和视频分析功能。借助 Rekognition 服务，应用程序可以检测、记忆并理解画面中面部和物体的情绪。更令人印象深刻的是，利用计算机视觉科学家开发的深度学习技术，Rekognition
    能够读取、分析并存储每天接触到的数百万张图像，且无需任何机器学习方面的先验知识。


    它还能提取任何图像或视频中的文字，例如字幕、产品名称、街道名称等。Rekognition 正在学习存储在其存储库中的大量视频、图像及其他视觉数据。它从这些数据中学习，同时*持续地*基于置信度评分算法对数据进行标记。


    该服务还具备超越物体识别的活动与场景检测能力。例如，Rekognition 能够进行实时和批量视频分析。当 Rekognition 捕获视频时，它不仅捕获特定帧，还能智能地捕获并理解该帧前后帧的内容，从而将内容置于上下文中。Rekognition
    还能识别用户可能不希望出现在应用程序中的不当视觉内容，并提供详细标签，帮助用户根据需要控制不想要的内容。它不仅能够基于已获取的数据存储库识别和标记人脸及视觉内容，还足够成熟，能够识别与人脸识别能力相关的任何情绪。该服务还具备名人识别功能。


    另一个独特的 Rekognition 功能称为*人物追踪*。它利用一种名为*骨架建模*的技术，追踪画面中是否有人物存在，即使人物被视线遮挡也能识别。


    理解 Rekognition 服务的优势至关重要。


    • **低成本：** 与其他 AWS AI 服务一样，Rekognition 采用按需付费模式，无需前期成本。用户只需为已分析的图像和视频以及存储的人脸元数据付费。


    • **与其他 AWS 服务集成：** Rekognition 可与 Lambda 和 AWS S3 等其他 AWS 服务无缝协作。作为对 AWS S3 事件的响应，可直接从
    Lambda 调用 Rekognition API。由于 AWS Lambda 和 AWS S3 都会根据应用程序的需求自动扩展，因此您可以构建可扩展、经济实惠且可靠的图像分析应用程序。


    还可以直接对存储在 Amazon S3 中的图像运行分析，而无需加载或移动数据。


    • **完全托管：** 尽管请求数量大幅增加，但应用程序的延迟仍保持一致。此功能可确保无缝且丰富的最终用户体验。


    **Amazon Translate**


    Amazon Translate 是一项翻译服务，通过调用 Translate API，消除了在应用程序中构建翻译功能的复杂性。这使得开发者能够通过单个 API
    和几行代码构建多语言应用程序。研究表明，当个人接触到以其母语呈现的对话或信息界面（如网站、客服、博客和帖子）时，用户粘性更高。手动完成这项工作意味着很长的周转时间，更不用说翻译任何组织拥有的所有数字资产所涉及的高昂成本了。


    Amazon Translate 基于神经机器翻译技术构建。

