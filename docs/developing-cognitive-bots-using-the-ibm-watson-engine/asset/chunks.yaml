    我们已简单定义了意图条件。这将启用**多重条件响应**选项，并在 IF ASSISTANT RECOGNIZES 中设置条件。节点出现，如图 5-25 所示。


    ***图 5-25.** 同一节点内包含不同条件的多重条件响应*


    第 5 章 Watson Agent 的高级概念


    通过这种方式，我们减少了树形结构，并在同一节点内检查条件，从而显示各自的响应。相同的用例也可以使用上下文变量在槽位中配置多重条件响应。我们可以跳过这一步，直接在一个节点内完成。


    槽位与多重条件响应的基本区别在于，槽位强制你遍历所有选项，并提供设置上下文变量的选项。你可以根据这一点为你的用例选择正确的选项。


    **话题转移**


    话题转移是实现上下文切换的一种方式。你可以处理这样的场景：用户启动一个用例并沿着对话进行，但突然提出一个与不同用例相关的其他查询。


    在这种情况下，我们需要完成转移的工作流，然后回到用户最初发起的原始用例。


    让我们通过“重置密码”和“配置外出回复”用例来讨论话题转移。该示例将在对话之间进行转移，并在完成转移的工作流后恢复原始工作流。


    从 [`github.com/`](https://github.com/watson05/Cognitive-Bot) [watson05/Cognitive-Bot](https://github.com/watson05/Cognitive-Bot)
    下载用于“配置外出回复”和“重置密码”用例的 `Advance_Topics-Slots_Digression.json` 文件。关于如何将 JSON 文件导入
    Watson Agent，请参考第 4 章。


    这两个用例已在图 5-26 的对话框中配置完成。


    ![](img/index-137_1.jpg)


    第 5 章 Watson Agent 的高级概念


    ***图 5-26.** 用于演示话题转移的两个用例*


    用户输入查询“我想重置密码。”Watson Assistant 提供了选择 Gmail 或 Outlook 的选项。用户没有选择选项，而是输入“我想配置外出回复。”


    由于用户询问的内容与当前用例完全不同，工作流会转移到配置了“配置外出回复”用例的节点，然后执行相应步骤。


    要实现这一点，请导航到你想要从中转移的节点。启用该节点的话题转移功能。点击**自定义**，然后选择**话题转移**。该节点会弹出一个窗口，用于选择和启用选项，如图
    5-27 所示。


    ![](img/index-138_1.jpg)


    ![](img/index-138_2.jpg)


    第 5 章 Watson Agent 的高级概念


    ***图 5-27.** 选择话题转移*


    选择第一个选项并将其打开。点击**应用**，如图 5-28 所示。


    ***图 5-28.** 从话题转移中选择选项 1*


    ![](img/index-139_1.jpg)


    第 5 章 Watson Agent 的高级概念


    让我们通过导航到“对话”页面并点击**试用**来查看对话框是否处理了此更改，如图 5-29 所示。


    ***图 5-29.** 试用结果*


    对话框找到了新的意图，但并未转移到“配置外出回复”工作流。


    要实现正确用例的话题转移，你需要对“配置外出回复”用例对话框进行一些更改。点击该节点并选择**话题转移**。选择第二个选项并点击**应用**，如图 5-30
    所示。


    ![](img/index-140_1.jpg)


    第 5 章 Watson Agent 的高级概念


    ***图 5-30.** 从话题转移中选择选项 2*


    我们只是简单配置此节点，以允许从工作流的其他位置转移进入此节点。完成此操作后，使用“试用”面板查看结果，如图 5-31 和 5-32 所示。

