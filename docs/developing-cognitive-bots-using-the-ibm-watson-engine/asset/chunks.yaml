    ## Defining the Intents for the Set of Variations


    Let’s first review some of the key terms.


    - **Use case:** A use case is a scenario or a query initiated by the user. The
    use case includes the various paths that a conversation can take and the end response
    that is provided by the bot. A simple example of a use case is a query like, “What
    is the weather in New York today?” The bot uses the intents, entities, and variations
    to provide the answer to this query. A complex use case scenario is an IT helpdesk
    and a user trying to solve a laptop problem.


    Chapter 4 Building Your First Bot using Watson assistant


    - **Intent:** The verb or action in the conversation with the user. The cognitive
    virtual assistant tries to understand the core intent or verb from the conversation
    with the user. For example, the intent of a user query such as “*Tell me about
    the insurance policy?”* would be *“enquire”* since the user wants to enquire or
    gather information. In this scenario, the object is *“insurance policy.”*


    - **Entities:** Entities are the nouns that combine with the intent to identify
    particular action. In the preceding example, the entity is “insurance policy.”
    This is a simplistic explanation of an entity; we will delve deeper into entities
    and how to define and configure them in Watson.


    - **System entities:** Predefined entities provided by Watson are called system
    entities; for example, `@sys-currency`, `@sys-date`, `@sys-location`, `@sys-time`,
    and so forth. A complete listing is shown in Figur[e 4-25](#index_split_000.html#p79).
    To use these entities, we need to enable them, so check the On status for the
    specific system entities that you want to use.


    ![](index-79_1.jpg)


    Chapter 4 Building Your First Bot using Watson assistant


    ***Figure 4-25.** System entities*


    - **Patterns entities:** Watson provides a feature of defining regular expressions
    in entity values. These entities are useful when we are supposed to identify defined

