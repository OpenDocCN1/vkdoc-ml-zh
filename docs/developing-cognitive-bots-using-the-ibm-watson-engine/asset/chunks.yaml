- fmt: '# Amazon Rekognition


    AWS’s facial recognition technology is called `Rekognition`. This web-based service
    makes it possible for developers to add image and video analysis to the applications.
    With `Rekognition` services the applications can detect, remember, and understand
    emotions of the faces and objects in the frame(s). What is even more impressive
    is that using deep learning technology developed by computer vision scientists,
    `Rekognition` can read, analyze, and store the millions of images that it is exposed
    to every day. It requires no prior knowledge of machine learning.


    It can also extract any text that is written in any image or video, such as captions,
    product names, street names, and so forth. `Rekognition` is learning the quantum
    of videos, images, and other visual data that is stored in its repository. It
    learns from this data while *continuously* labeling the data based on a confidence
    scoring algorithm.


    This service also has the ability to detect activity and scenes beyond recognizing
    objects. For example, `Rekognition` has the capability to do real-time and batch
    video analytics. When `Rekognition` captures a video, it is not only capturing
    the particular frame, but it is cognitive enough to capture and understand the
    frames captured before and after the frame in question, thus contextualizing the
    content. `Rekognition` also has the capability to identify inappropriate visual
    content that the user might not want in the application and provides with detailed
    labels that help the user to control unwanted content on need basis. It is not
    only capable of identifying and labeling faces and visual content based on its
    repository of data that it has acquired, but is also matured enough to know any
    emotions attached to the facial recognition abilities. This service also has the
    ability for celebrity recognition.


    Another unique `Rekognition` feature is called *person tracking*. Using a technology
    called *skeleton modelling*, it tracks whether a person is in the frame or not,
    even if blocked from the line of vision.


    It is important to understand the benefits of the `Rekognition` service.


    - **Low cost:** Like other AWS AI services, `Rekognition` is built on a pay-as-you-go
    model, and there is no upfront cost. The user only pays for the images and videos
    that are analyzed and the face metadata that is stored.

    - **Integration with other AWS services:** `Rekognition` can work seamlessly with
    other AWS services like `Lambda` and `AWS S3`. In response to the `AWS S3` event,
    the `Rekognition` API can be called directly from `Lambda`. Because both `AWS
    Lambda` and `AWS S3` scale automatically basis the response to the application’s
    demand, you can build scalable, affordable, and reliable image analysis applications.
    It is also possible to run analytics directly on images that are stored in `Amazon
    S3` without having to load or move the data.

    - **Fully managed:** Despite the huge increase in the number of requests, there
    is a consistency in the latency of the application. This feature ensures a seamless
    and enriched end-user experience.


    # Amazon Translate


    `Amazon Translate` is a translation service that removes the complexity of building
    translation capabilities into the application by calling the `Translate` API.
    This enables the developer to build multilingual applications with a single API
    and a few lines of code. Research shows that the chances of stickiness is higher
    when individuals are exposed to a conversation or information interface like a
    website, customer agent, or blogs and post that is in their own native language.
    To do so manually would mean a long turnaround time, not to mention the high costs
    involved in the translation of all the digital assets that any organization would
    have.


    `Amazon Translate` is built on the technology of neural machine.'
