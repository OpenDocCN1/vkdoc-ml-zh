    ## Using Other Advanced Watson Services


    ### Watson Discovery Service


    The Watson Discovery service enables you to rapidly ingest, normalize, enrich,
    index, and search your unstructured data. It simplifies the infrastructure, scale,
    and algorithm challenges associated with enriching and analyzing large datasets.
    It gives you the capability to produce data in multiple formats, including PDFs,
    Word docs, HTML, and JSON type files.


    ***Figure 7-21.** Architecture of Watson Discovery service*


    Watson Discovery takes only a few steps to analyze and summarize large unstructured
    data, create a query that provides the information you need, and then integrates
    these insights into a new application or existing solution.


    IBM Watson Discovery brings together a functionally rich set of integrated, automated
    Watson APIs that do the following.


    - Trains unstructured data. Upload your own document or crawl from Box, Salesforce,
    Microsoft SharePoint Online, IBM Cloud Object Storage, and Microsoft SharePoint
    2016 data sources, or do a web crawl with the Discovery tooling. Discovery environment
    can hold multiple private collections. Each collection is paired with a configuration
    that tells Discovery how to upload and process the files. We can specify how to
    convert the different file types in the dataset and choose which natural processing
    enrichments to apply to each document text and how the resulting data should be
    cleaned and normalized.


    - Group documents/data to be ingested, indexed, normalized, and ready to be queried.
    Enrichments applied to documents. The Entity Extraction, Sentiment Analysis, Category
    Classification, and Concept Tagging enrichments are automatically applied to the
    text field by Discovery through natural language understanding (NLU).


    - Once the data has been enriched, builds a query to search information.


    Let’s take a deep dive into the Watson Discovery service to see how results are
    fetched from a data collection based on input query.


    To set up a Watson Discovery service, go to the IBM Cloud Catalog page at `https://cloud.ibm.com/catalog`.


