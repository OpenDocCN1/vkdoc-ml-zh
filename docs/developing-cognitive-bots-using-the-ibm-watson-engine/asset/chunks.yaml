    第 1 章 认知虚拟机器人简介


    语言的理解与生成。认知过程利用现有知识并产生新知识。


    简单来说，认知是人类的一种能力，它帮助我们


    获取知识、执行所有心智功能、理解我们所处的环境，并创造新知识。


    认知型或智能虚拟助手旨在变得更像人类，并具备人类所拥有的类似能力，尽管距离这一目标成为现实，我们仍有很长的路要走。


    认知虚拟代理（CVA）具备上述部分能力，


    但在理解我们世界中纷繁复杂的语境方面，它们可能还无法与人类匹敌。然而，在某些领域，它们超越了人类，因为它们没有生物性的处理能力限制，并且能够同时扩展并与数百万用户


    进行沟通，这是人类无法做到的。


    让我们来定义一下认知虚拟助手。CVA 是一种软件代理，它基于文本、语音、手势或视觉输入为个人或系统执行任务。它在不同程度上具备理解所提供输入、解释输入、应用逐步逻辑、探询用户意图和对话语境的能力，并据此提供信息或执行预期任务。它能理解自然语言对话，并维持对话的语境以实现目标。


    一些 CVA 能够通过首先使用语音转文本来解释语音指令，而另一些则能识别图像并据此采取行动。


    在回应方面，CVA 可以在通信模式为消息系统时使用文本回复，可以通过语音频道


    使用语音回复，并且可以通过机器人外观展示手势、表情或动作来表达自己。CVA 也被嵌入到扬声器和汽车导航系统等设备中。


    这些设备中一些支持语音的具体例子有 Google Home 和 Amazon Echo。


    第 1 章 认知虚拟机器人简介


    CVA 可在多种设备和界面上使用，并且可以通过


    移动手持设备、笔记本电脑或个人电脑访问。它们也可以通过不同的消息平台访问，例如 Facebook Messenger、Skype、Telegram 等。


    CVA 被嵌入到大众使用的移动应用程序中，这些应用程序被称为*数字个人助理*。数字个人助理的几个例子包括苹果的 Siri、谷歌的 Google Assistant
    和微软的 Cortana。数字个人助理帮助用户完成搜索、导航和通信等任务。数字个人助理需要通过一个命令来激活，以便它们知道用户正在尝试发起对话。这些语音命令的一些例子有“OK


    Google”、“Alexa”等。


    虚拟助手可以被用来提供各种服务。以下是一些例子。


    • 充当搜索和检索代理，从各种来源检索结果，


    例如天气、股票


    更新、市场信息、价格、目录、利率等。


    • 充当配置代理，配置提醒、闹钟、


    创建待办事项列表、购物清单、旅行行程等。


    • 从目录和订阅服务中播放视频或音乐，


    例如 Spotify、Netflix、Amazon Prime 等。


    • 充当 IT 服务台代理，解决 IT 设备的问题和


    故障。


    • 在专业服务中充当助手，例如


    医疗保健、法律、行政和金融。


    • 充当设备（扬声器、


    电视和其他设备）中的嵌入式代理。


