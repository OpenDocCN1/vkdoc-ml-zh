- '# 5. 邮件自动化


  电子邮件对于我们日常的组织、沟通和日程安排至关重要。UiPath StudioX 邮件自动化使业务用户能够自动执行这些任务，从而专注于更具创造性的高价值任务。通常，邮箱是自动化的初始输入，在邮箱文件夹之间移动电子邮件可以指示流程的进度，或者邮箱文件夹可以作为供人工审核的异常文件夹。它对于让机器人通知用户可能有待处理的任务，或者通过根据给定的业务规则发送电子邮件来自动化通信也至关重要。




  ## 学习目标


  学完本章后，你将学会如何：


  *   定义用于自动化的 Desktop Outlook、Outlook 365 和 Gmail 账户范围

  *   将电子邮件移动到其他文件夹

  *   将电子邮件标记为已读或未读

  *   转发电子邮件

  *   保存附件和电子邮件

  *   归档电子邮件

  *   发送电子邮件和日历邀请

  *   回复电子邮件

  *   删除电子邮件


  ## 示例概述


  在本章中，我们将使用一个简化版的初始招聘筛选流程来展示所有邮件自动化活动的用法。本章讨论的概念可应用于业务的各个领域，例如供应商管理、采购、销售以及人力资源部门内的其他流程。


  本节将帮助你熟悉本章所有练习的先决条件。


  ### Desktop Outlook 设置


  首先，在你将用于自动化的电子邮件账户的**收件箱**中，创建一个名为 **Initial Screen** 的新文件夹。图 5-1 展示了 Outlook 文件夹结构。


