  \ 以及管理数据包。\n\n\n\n#### 功能区\n\n顶部的功能区，如图 2-13 所示，仅在您打开项目时可用。\n\n![../images/493649_1_En_2_Chapter/493649_1_En_2_Fig13_HTML.jpg](img/493649_1_En_2_Fig13_HTML.jpg)\n\
