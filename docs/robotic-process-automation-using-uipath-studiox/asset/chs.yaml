  ### 筛选


  **Filter** 活动利用 Excel 中的数据筛选选项，允许您根据引用的 Excel 文件中的给定值，对范围、工作表或表格中的列进行筛选。




  #### 配置


  本节提供如何配置**筛选**活动的说明，如图 7-110 所示。


  ![../images/493649_1_En_7_Chapter/493649_1_En_7_Fig110_HTML.jpg](img/493649_1_En_7_Fig110_HTML.jpg)


  图 7-110


  筛选活动卡片


  **源**：这是活动卡片上的一项必填配置。此配置为 StudioX 提供需要筛选的工作表、区域或表格。


  **列名**：这是活动卡片上的一项必填配置。此配置确定需要筛选的区域、工作表或表格中的列标题。例如，如果要筛选“已完成”交易，则可以选择“交易状态”作为列标题。


  **配置筛选条件**：这是活动卡片上的一项必填配置。此配置提供列应依据其进行筛选的值。例如，要查找前面示例中“列名”字段的“已完成”交易，您的 `Configure
  Filter` 值应为“Completed”。


  要配置此字段，请使用 `Basic filter` 选项，该选项允许您使用与 `Column name` 字段中相同的配置选项输入一个或多个值进行筛选。您可以使用此选项通过按
  `Add` 在同一列中添加第二个筛选值来筛选一个或多个值。


  通过 `Advanced filter` 可以使用其他选项，它允许您指定条件筛选，例如 Excel 中的“自定义自动筛选”选项。例如，您可以使用 `Advanced
  filter` 筛选出“数量”列中大于 100 的值。


  **清除任何现有筛选**：这是活动卡片上的一项可选配置。此配置允许您清除在 `Source` 字段中定义的区域、工作表或表格中的任何现有筛选。默认情况下，此选项未选中。


