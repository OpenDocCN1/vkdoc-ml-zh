  **账户**：这是活动卡片上的必填配置。此配置允许您指定用于发送日历邀请的电子邮件地址账户。


  **标题/主题**：这是活动卡片上的可选配置。此配置用于指定日历邀请的标题/主题。


  **必需与会者**：这是活动卡片上的可选配置。此配置用于指定必须参加会议的参与者。


  **可选与会者**：这是活动卡片上的可选配置。此配置用于指定非必须参加会议的参与者。


  **开始日期**：这是活动卡片上的必填配置。此配置允许您指定会议邀请的开始日期。


  **开始时间**：这是活动卡片上的必填配置。此配置允许您指定会议邀请的开始时间。


  **持续时间**：这是活动卡片上的必填配置。此配置允许您指定会议的持续时间。您必须以小时/分钟/秒的形式提供持续时间，或者勾选`全天事件`选项。如果勾选了`全天事件`，则会将会议设置为全天。


  **地点**：这是活动卡片上的可选配置。此配置允许您指定会议的地点。


  **描述**：这是活动卡片上的可选配置。此配置允许您以`文本`格式指定会议邀请的描述或正文。


  **提醒**：这是活动卡片上的必填配置。此配置允许您指定何时显示会议提醒。默认情况下，该值设置为`15 分钟`。


  **显示为**：这是活动卡片上的必填配置。此配置允许您指定会议在参与者日历上的标记方式。您可以选择以下选项之一：`空闲`、`暂定`、`忙碌`或`外出`。默认情况下，此选项设置为`忙碌`。


  **重复周期**：这是活动卡片上的可选配置。此配置允许您将会议设置为按定义的频率重复。图 5-34 显示了定义重复周期的配置。


  ![../images/493649_1_En_5_Chapter/493649_1_En_5_Fig34_HTML.jpg](img/493649_1_En_5_Fig34_HTML.jpg)


  图 5-34


  重复周期配置


  **保存但不发送**：这是活动卡片上的可选配置。此配置默认处于勾选状态，表示日历邀请将被保存但不发送。建议在开发期间进行此设置。


  练习


  **目标**：基于之前的练习，如果申请与职位需求 `888701` 相关，则使用`发送日历邀请`活动向招聘经理和候选人发送初步面试会议邀请。以下是邀请的一些额外配置：


  *   向招聘经理和面试者发送邀请。


  *   提示输入会议邀请的日期和时间。


  *   将会议提醒设置为事件前一小时。


  *   将招聘经理的个人会议室链接指定为邀请的地点。该链接可在 JobPostingDetails.xlsx Excel 文件的`个人会议室`列中找到。


