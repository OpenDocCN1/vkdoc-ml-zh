  注意


  要多次运行练习，请确保所需的文件可用；否则，UiPath StudioX 将抛出错误。


  **Archive**：此文件夹用于归档旧文件夹和文件。已存在一个用于过去日期的示例子文件夹，该子文件夹将在某个练习中使用。


  **Interviews**：此文件夹用于跟踪面试情况。此文件夹包含两个子文件夹：Pending 和 Scheduled。每天结束时，MoveForward 文件夹中的简历会被移动到
  Interviews\Pending 文件夹。面试安排好后，简历会被移动到 Interviews\Scheduled 文件夹。


  **Resumes**：此文件夹用于跟踪每天收到的简历。如图 9-2 所示，每天都会创建一个新文件夹。已存在三个用于过去日期的示例子文件夹，这些子文件夹将在几个练习中使用。


