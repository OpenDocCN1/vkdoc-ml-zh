  New 子文件夹中，审核后，简历会被移动到 MoveForward 或 Reject 子文件夹。


  **Source**：如图 9-3 所示，此文件夹用于接收来自外部招聘机构的压缩文件。这些压缩文件包含候选人的简历。默认情况下，此文件夹包含三个示例提取文件，这些文件将在几个练习中使用。


