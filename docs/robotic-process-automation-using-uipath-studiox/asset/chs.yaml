  **行号**：这是活动卡片上的一个必填配置。仅当在 `Where` 下拉菜单中选择了 `Specific Index` 时才需要此配置。此配置允许您指定一个确切的行号，新行将插入到该行号处。


  **有标题**：这是活动卡片上的一个可选配置。此配置默认被选中，即范围中的第一行将被视为标题。例如，如果您在表格的开头插入三行并且选中了 Has headers，那么这三行将插入到表格的标题行之后。


