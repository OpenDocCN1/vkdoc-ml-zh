  **Excel**：允许您指定项目笔记本或来自父级`使用 Excel 文件`活动的 Excel 文件中的单元格地址、范围、表格或工作表，以存储活动返回的数据。也可以指定单个
  Excel 行中的单元格（详情请参见第 7 章）。


  **保存以备后用**：允许您指定一个变量来存储活动返回的数据。变量可从数据管理器面板访问。您可以命名或重命名变量以使其易于理解。图 3-10 显示了将数据存储在变量中的选项。


