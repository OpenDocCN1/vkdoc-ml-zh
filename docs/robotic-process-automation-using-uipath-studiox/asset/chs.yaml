  \n图 4-79\n\n键盘快捷键活动练习的最终配置\n\n本章的下一组活动侧重于窗口操作。Get Active Window 活动可用于引用当前活动窗口，使您能够执行多个操作。例如，一旦您获得了活动窗口，您就可以选择在自动化中最大化、隐藏、还原或移动该窗口。\n\
  \n### 获取活动窗口\n\n**Get Active Window** 活动允许您获取对运行自动化的机器上当前活动窗口的引用。当您需要获取活动窗口以便稍后在自动化中将其最小化或最大化时，可以使用此活动。\n\
