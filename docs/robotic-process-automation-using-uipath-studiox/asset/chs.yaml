  **要删除什么**：这是活动卡片上的一个必填配置。此配置提供需要删除的行的类型。下拉选择选项包括 `指定行`、`所有可见行`、`所有隐藏行` 和 `所有重复行`。例如，如果有一个表，其中隐藏了三行，并且您选择了
