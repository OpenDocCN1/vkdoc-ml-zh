- "# 4. UI 自动化\n\n与多个桌面和 Web 应用程序交互是我们日常工作中必不可少的一部分。我们使用这些应用程序来完成各种任务，例如在时间跟踪系统中记录工时表，在文档管理系统中存储、组织和检索文档，或在项目管理软件中跟踪项目。为了与这些不同的应用程序交互，我们使用它们的用户界面\
  \ (UI)。同样，UiPath StudioX UI 自动化通过与用户界面交互，复制用户操作（如勾选复选框、选择下拉菜单、输入数据和点击按钮）来自动化所需的任务。\n\
  \n## 学习目标\n\n在本章结束时，您将学习如何\n\n*   加载 Web 和桌面应用程序\n\n*   在表单中输入数据\n\n*   从表单和表格中提取数据\n\
  \n*   执行与用户界面交互的其他活动\n\n*   使用应用程序/Web 录制器生成自动化\n\n\n\n## 示例概述\n\n本章所有练习使用的示例应用程序是**联系人管理**。该应用程序可通过浏览器从\
  \ [`https://therpabook.com/samples/contactsmanagement/`](https://therpabook.com/samples/contactsmanagement/)\
  \ 位置访问。本节提供该示例应用程序的快速概述。\n\n**联系人列表**：这是打开此 Web 应用程序时加载的默认页面。如图 4-1 所示，此页面包含以下部分：\n\
  \n![../images/493649_1_En_4_Chapter/493649_1_En_4_Fig1_HTML.jpg](img/493649_1_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1\n\n联系人管理 Web 应用程序主页\n\n1.  页眉：显示应用程序标题\n2.  按钮：用于打开添加联系人详情对话框、查看联系人详情对话框，以及下载到\
  \ Excel 和 CSV\n3.  表格：包含跨多页的联系人列表\n\n**添加联系人**：当您从主页单击“添加联系人”按钮时，会显示此对话框，如图 4-2\
  \ 所示。此屏幕允许您输入新的联系人详情。该应用程序不可操作，因此不会持久保存任何新联系人。\n\n![../images/493649_1_En_4_Chapter/493649_1_En_4_Fig2_HTML.jpg](img/493649_1_En_4_Fig2_HTML.jpg)\n\
  \n图 4-2\n\n添加联系人对话框\n\n**查看联系人**：当您从主页单击“查看联系人”按钮时，会显示此对话框，如图 4-3 所示。此屏幕允许您查看联系人详情。该应用程序不可操作，因此始终显示相同的联系人信息。\n\
  \n![../images/493649_1_En_4_Chapter/493649_1_En_4_Fig3_HTML.jpg](img/493649_1_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3\n\n查看联系人对话框\n\n**下载**：此按钮允许您以 Excel 和 CSV 格式下载联系人列表。\n\n## 活动参考\n\nUI 自动化活动可从图\
  \ 4-4 所示的“应用程序/Web”类别中获取。以下各节提供了有关如何配置和使用每个活动的说明。\n\n![../images/493649_1_En_4_Chapter/493649_1_En_4_Fig4_HTML.jpg](img/493649_1_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4\n\n用于应用程序/Web 自动化的活动\n\n### 使用应用程序/浏览器\n\n**使用应用程序/浏览器**活动允许您打开、关闭 Web 或桌面应用程序并与之交互。\n\
  \n注意\n\n**使用应用程序/浏览器**活动将包含您要对目标应用程序 UI 执行的所有操作。例如，如果您想单击屏幕上的按钮，则必须将“单击”活动添加到该活动的主体中。\n\
  \n#### 配置\n\n本节提供有关如何配置\n\n的说明，如图 4-5 所示。\n\n![../images/493649_1_En_4_Chapter/493649_1_En_4_Fig5_HTML.jpg](img/493649_1_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5\n\n使用应用程序/浏览器的活动卡片\n\n注意\n\n在自动化 Web 应用程序之前，您需要从 `主页` ➤ `工具` ➤ `UiPath 扩展程序`\
  \ 安装相关的 Web 浏览器扩展。\n\n**指示要自动化的应用程序 (I)**：这是活动卡片上的一项必需配置。此配置允许您指示要自动化的目标应用程序。要配置此活动，请确保您的目标应用程序已打开。一旦您指示了目标应用程序，StudioX\
  \ 将自动识别它是桌面应用程序还是 Web 应用程序。图 4-6 显示了 Web 应用程序的活动卡片，而图 4-7 显示了桌面应用程序的活动卡片。\n\n![../images/493649_1_En_4_Chapter/493649_1_En_4_Fig7_HTML.jpg](img/493649_1_En_4_Fig7_HTML.jpg)\n\
  \n图 4-7\n\n使用应用程序的活动卡片\n\n![../images/493649_1_En_4_Chapter/493649_1_En_4_Fig6_HTML.jpg](img/493649_1_En_4_Fig6_HTML.jpg)\n\
  \n图 4-6\n\n使用浏览器的活动卡片\n\n**浏览器 URL**：这是活动卡片上的一项必需配置。此配置仅在目标是 Web 应用程序时可用。此配置允许您指定\
  \ Web 应用程序的 URL。默认情况下，此字段会填充在指示应用程序配置中识别出的浏览器 URL。\n\n**应用程序路径**：这是活动卡片上的一项必需配置。此配置仅在目标是桌面应用程序时可用。此配置允许您指定本地系统上可执行文件的完整路径。默认情况下，此字段会填充在指示应用程序配置中识别出的应用程序路径。\n\
  \n**应用程序参数**：这是活动卡片上的一项可选配置。此配置仅在目标是桌面应用程序时可用。此配置允许您指定要执行的应用程序的参数。例如，启动记事本时，您可以指定在记事本打开时要加载哪个文件。\n\
  \n**匹配确切标题**：这是活动卡片上的一项可选配置。此配置仅在目标是桌面应用程序时可用。此配置允许您指定自动化是否应精确匹配应用程序标题。默认情况下，此选项未选中，即自动化不会使用精确标题匹配。\n\
  \n**打开**：这是 `属性` 面板上的一项可选配置。此配置允许您指定自动化在执行时是否应打开此应用程序。有三个选项：`从不`（从不打开应用程序，当应用程序可能已经打开时此选项很有用）、`始终`（始终打开应用程序）和\
  \ `如果未打开`（仅在应用程序尚未打开时才打开它）。\n\n**关闭**：这是 `属性` 面板上的一项可选配置。此配置允许您指定自动化完成后是否应关闭目标应用程序。有三个选项：`从不`（从不关闭应用程序，当人员或其他程序可能已经打开了应用程序时此选项很有用）、`始终`（始终关闭应用程序）和\
  \ `如果由应用程序/浏览器打开`（仅在自动化打开了应用程序时才关闭它）。\n\n### 转到 URL\n\n**转到 URL** 活动允许您在浏览器中打开指定的\
  \ URL。\n\n\n\n#### 配置\n\n本节提供如何配置**转到 URL** 活动的说明，如图 4-8 所示。\n\n![../images/493649_1_En_4_Chapter/493649_1_En_4_Fig8_HTML.jpg](img/493649_1_En_4_Fig8_HTML.jpg)\n\
  \n图 4-8\n\n转到 URL 的活动卡片\n\n**URL**：这是活动卡片上的一项必需配置。此配置允许您指定要在浏览器中打开的 URL。\n\n练习\n\
  \n**目标**：使用 `Go To URL` 活动导航至 [`https://therpabook.com/samples/contactsmanagement/`](https://therpabook.com/samples/contactsmanagement/)。\n\
  \n**源代码**：Chapter_4_MiscellaneousActivitiesExercise\n\n**设置**：以下是分步实施说明：\n\n1. \
  \ 打开您选择的浏览器，在地址栏中输入 `about:blank`。这将确保默认情况下不加载任何页面。\n\n2.  在 `StudioX` 中，将 `使用应用程序/浏览器`\
  \ 活动添加到一个空白流程中。\n\n3.  接下来，在 `使用应用程序/浏览器` 活动卡片中点击 `指示应用程序`。您会注意到屏幕上出现蓝色阴影；这是为了引导鼠标指向浏览器以选择窗口。点击浏览器将自动填充活动卡片。\n\
  \n4.  接下来，选择 `使用应用程序/浏览器` 活动卡片，并从 `属性` 中将 `选项` ➤ `打开` 属性设置为 `始终`。这将确保自动化始终打开一个新的浏览器。\n\
  \n5.  接下来，在 `使用应用程序/浏览器` 活动的主体中添加一个 `转到 URL` 活动。\n\n6.  然后，在 `转到 URL` 活动的 `URL`\
  \ 字段中，点击 `加号` 图标，选择 `文本` 选项，并输入 [`https://therpabook.com/samples/contactsmanagement/`](https://therpabook.com/samples/contactsmanagement/)。点击\
  \ `保存`。\n\n完成练习后，**转到 URL** 活动的最终配置应类似于图 4-9。图 4-10 显示了自动化运行完成后目标 Web 应用程序的状态。在此例中，浏览器已重定向到新的\
  \ URL。\n\n![../images/493649_1_En_4_Chapter/493649_1_En_4_Fig10_HTML.jpg](img/493649_1_En_4_Fig10_HTML.jpg)\n\
  \n图 4-10\n\n转到 URL 活动练习的结果\n\n![../images/493649_1_En_4_Chapter/493649_1_En_4_Fig9_HTML.jpg](img/493649_1_En_4_Fig9_HTML.jpg)\n\
  \n图 4-9\n\n转到 URL 活动练习的最终配置\n\n### 导航浏览器\n\n**导航浏览器** 活动允许您执行基本的浏览器导航操作，例如后退、前进、主页、刷新和关闭标签页。\n\
  \n#### 配置\n\n本节提供如何配置**导航浏览器**活动的说明，如图 4-11 所示。\n\n![../images/493649_1_En_4_Chapter/493649_1_En_4_Fig11_HTML.jpg](img/493649_1_En_4_Fig11_HTML.jpg)\n\
  \n图 4-11\n\n导航浏览器的活动卡片\n\n**操作**：这是活动卡片上的一项必需配置。此配置允许您指定要在浏览器上执行的导航操作。表 4-1 提供了每个操作的简要说明。默认情况下，操作设置为\
  \ `后退`。\n\n表 4-1\n\n导航浏览器活动的操作\n\n| 操作 | 说明 |\n| --- | --- |\n| 后退 | 在浏览器中打开上一页；此操作仅在浏览器之前打开过其他页面时有效。\
  \ |\n| 前进 | 在浏览器中打开下一页；此操作仅在之前使用过后退操作时有效。 |\n| 主页 | 打开浏览器的默认主页。 |\n| 刷新 | 刷新页面。\
  \ |\n| 关闭标签页 | 关闭当前活动的标签页。 |\n\n练习\n\n**目标**：使用 `导航浏览器` 活动刷新已打开的网页。此练习建立在 `转到 URL`\
  \ 练习的基础上。图 4-10 显示了此练习之前目标 Web 应用程序的状态。\n\n**源代码**：Chapter_4_MiscellaneousActivitiesExercise\n\
  \n**设置**：以下是分步实施说明：\n\n1.  在 `StudioX` 中，将 `导航浏览器` 活动添加到 `使用应用程序/浏览器` 活动的主体中，位于\
  \ `转到 URL` 活动之后。\n\n2.  接下来，从 `操作` 下拉菜单中选择 `刷新`。\n\n完成练习后，**导航浏览器** 活动的最终配置应类似于图\
  \ 4-12。\n\n![../images/493649_1_En_4_Chapter/493649_1_En_4_Fig12_HTML.jpg](img/493649_1_En_4_Fig12_HTML.jpg)\n\
  \n图 4-12\n\n导航浏览器活动练习的最终配置\n\n### 高亮\n\n**高亮** 活动允许您在自动化运行时以视觉方式高亮显示指定区域。自动化会在指定元素周围创建一个框。\n\
  \n提示\n\n对于希望在流程执行时以视觉方式强调特定 UI 元素的任务，高亮活动是支持此类需求的绝佳方式。\n\n\n\n#### 配置\n\n本节提供如何配置**高亮**活动的说明，如图\
  \ 4-13 所示。\n\n![../images/493649_1_En_4_Chapter/493649_1_En_4_Fig13_HTML.jpg](img/493649_1_En_4_Fig13_HTML.jpg)\n\
  \n图 4-13\n\n高亮活动的活动卡片\n\n**指示屏幕上的目标 (I)**：这是活动卡片上的一项必需配置。此配置允许您指定要在 UI 上高亮的元素或区域。\n\
  \n**持续时间**：这是活动卡片上的一项可选配置。此配置允许您指定（以秒为单位）自动化应高亮指定元素的时长。\n\n**颜色**：这是`属性`面板上的一项可选配置。此配置允许您指定高亮框的颜色，默认设置为金色。\n\
