  ### 重复次数


  **Repeat Number Of Times**活动允许你按指定次数重复一个或多个活动。


  提示


  通常，此活动将与 If、Skip Current 和 Exit Loop 活动结合使用。


  #### 配置


  本节提供如何配置**Repeat Number Of Times**活动的说明，如图 3-50 所示。


