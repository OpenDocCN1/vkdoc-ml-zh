- '# 11. 产品数据录入自动化


  在本章中，我们将自动化一项日常任务，即作为库存管理流程的一部分录入产品数据。


  ## 学习目标


  此自动化将帮助您理解以下主题：


  *   创建文件夹结构、复制和移动文件


  *   获取过滤后的电子邮件列表、保存电子邮件附件、移动电子邮件和发送电子邮件


  *   在 Excel 中读取、过滤和保存数据


  *   使用 Excel 跟踪状态


  *   在 Web 应用程序中输入数据




  ## 手动任务概述


  当库存管理员收到采购团队发来的新库存邮件时，任务便开始了。图 11-1 展示了产品数据录入任务的高级概览。


  ![../images/493649_1_En_11_Chapter/493649_1_En_11_Fig1_HTML.jpg](img/493649_1_En_11_Fig1_HTML.jpg)


  图 11-1


  产品数据录入任务的高级概览


  库存管理员会定期检查 Outlook 收件箱中是否有未读的新库存邮件。图 11-2 展示了一封示例邮件。


  ![../images/493649_1_En_11_Chapter/493649_1_En_11_Fig2_HTML.jpg](img/493649_1_En_11_Fig2_HTML.jpg)


  图 11-2


  新库存邮件示例


  如果存在一封带有产品列表附件的未读新库存邮件，库存管理员会将附件下载到一个文件夹中以便进一步处理。为确保同一封邮件不被重复处理，库存管理员会将该邮件移至 Outlook
  中的“已处理”文件夹。


  如果这是当天的第一封邮件，那么在下载附件之前，库存管理员会创建一个新的文件夹结构来管理处理流程。这个新文件夹以 YYYYMMDD 格式的当前日期命名，位于 DailyProcessing
  文件夹下。在当前日期文件夹下，库存管理员还会创建两个子文件夹：“待处理”和“已处理”。


  所有附件默认下载到“待处理”文件夹，一旦文件中的所有新产品都已录入库存管理系统，文件就会被移至“已处理”文件夹。图 11-3 展示了用于管理产品数据录入任务的文件夹结构。


  ![../images/493649_1_En_11_Chapter/493649_1_En_11_Fig3_HTML.jpg](img/493649_1_En_11_Fig3_HTML.jpg)


  图 11-3


  用于管理产品数据录入任务的文件夹结构


  需要录入库存的产品以 Excel 附件的形式包含在邮件中。该 Excel 文件采用预定义格式，如图 11-4 所示。


  ![../images/493649_1_En_11_Chapter/493649_1_En_11_Fig4_HTML.jpg](img/493649_1_En_11_Fig4_HTML.jpg)


  图 11-4


  产品列表 Excel 附件示例


  库存管理员在 Web 浏览器中启动库存管理系统，如图 11-5 所示。同时，库存管理员在 Excel 中打开产品列表。


  ![../images/493649_1_En_11_Chapter/493649_1_En_11_Fig5_HTML.jpg](img/493649_1_En_11_Fig5_HTML.jpg)


  图 11-5


  库存管理系统


  库存管理员逐行浏览 Excel 文件，从每一列复制数据，并将其粘贴到库存管理系统的“产品详情”对话框中，如图 11-6 所示。


  ![../images/493649_1_En_11_Chapter/493649_1_En_11_Fig7_HTML.jpg](img/493649_1_En_11_Fig7_HTML.jpg)


  图 11-7


  新库存确认邮件示例


  ![../images/493649_1_En_11_Chapter/493649_1_En_11_Fig6_HTML.jpg](img/493649_1_En_11_Fig6_HTML.jpg)


  图 11-6


  库存管理系统的“产品详情”对话框


  所有产品都录入库存管理系统后，库存管理员会向发件人发送一封邮件，确认处理已完成。


  ## 解决方案设计


  本节概述了我们将如何设计自动化流程。图 11-8 展示了产品数据录入任务自动化的流程图。


  ![../images/493649_1_En_11_Chapter/493649_1_En_11_Fig8_HTML.jpg](img/493649_1_En_11_Fig8_HTML.jpg)


  图 11-8


  产品数据录入任务自动化的解决方案设计


  将自动化流程划分为更小、更合乎逻辑的流程有助于简化实施和调试过程。如图 11-8 所示，我们将把自动化流程划分为四个逻辑流程。


  ### 初始化


  在此流程中，自动化将执行以下步骤：


  *   自动化将首先检查当前日期所需的文件夹结构是否存在。


  *   如果文件夹不存在，自动化将创建所需的文件夹结构。这还包括将“确认邮件跟踪器”文件复制到当前日期文件夹。


  ### 处理邮件


  在此流程中，自动化将执行以下步骤：


  *   获取一封或多封未读的新库存邮件。


  *   将附件下载到 `DailyProcessing\YYYYMMDD` 文件夹下的“待处理”文件夹中。


  *   将邮件标记为已读，并将其移至“已处理”文件夹，以确保不会被再次拾取。


  *   保存邮件信息，以便自动化稍后发送确认通知。


  ### 录入数据


  在此流程中，自动化将执行以下步骤：


  *   在浏览器中启动库存管理系统。


  *   获取“待处理”文件夹中的所有新库存 Excel 文件。


  *   在每个 Excel 文件中插入一个“状态”列，以便在单个行级别跟踪处理状态。


  *   自动化将从所有行复制数据，并将数据录入到库存管理 Web 应用程序中。


  *   一旦单行数据录入完成，自动化会将状态更新为“已处理”。


  *   整个文件处理完毕后，自动化会将该文件移至“已处理”文件夹。这将确保文件不会被重复处理。


  ### 发送确认


  在此流程中，自动化将执行以下步骤：


  *   自动化将从“确认邮件跟踪器”中获取状态为“未发送”的邮件列表。


  *   自动化将向所有发件人发送确认邮件。


  ## 实施


  现在我们已经很好地理解了如何设计自动化流程，可以开始实施了。


  ### 步骤 1：设置


  本实施的第一步是确保已从本书的 GitHub 仓库下载了演示应用程序及相关模板。


  注意


  本章假设自动化文件夹 `ProductDataEntryAutomation` 位于 `C:\BookSamples\` 文件夹内。


  `ProductDataEntryAutomation` 文件夹包含三个子文件夹，如图 11-9 所示。


