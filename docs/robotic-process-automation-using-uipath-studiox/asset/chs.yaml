- '# 9. 文件自动化


  管理数据（无论是物理数据还是数字数据）是我们日常工作中的关键部分。随着当今工作环境中可用数据量的不断增长，一个有效的文件和文件夹管理系统变得比以往任何时候都更加重要。我们使用文件夹来帮助组织信息，以便日后可以轻松搜索和检索。文件夹也可以用作待办事项列表，即根据文件的状态将其存储在文件夹中。在日常工作中，文件的使用也相当普遍，例如，从系统中以
  Excel/CSV 格式导出数据、在系统之间移动数据，以及使用 Word 或 Excel 文件模板生成订单和发票。因此，UiPath StudioX 中用于组织、管理和编辑文件和文件夹的文件自动化功能成为一项有用且必不可少的工具。文件夹帮助我们组织信息，以便日后可以轻松搜索和检索。文件夹也可以用作待办事项列表，即根据文件的状态将其存储在文件夹中。


  ## 学习目标


  在本章结束时，您将学习如何：


  *   获取文件夹的属性

  *   检查文件夹是否已存在

  *   创建、删除、复制和移动文件夹

  *   获取文件夹中的所有文件

  *   获取文件的属性

  *   检查文件是否已存在

  *   创建、删除、复制和移动文件

  *   提取压缩文件的内容

  *   创建压缩文件

  *   读取文本文件的内容

  *   向文本文件写入和追加内容


  ## 示例概览


  在本章中，我们将使用一个简化版的招聘流程来展示所有文件自动化活动。


  本节将使您熟悉本章所有练习的先决条件。


  从本书网站下载源代码，并确保将整个 `BookSamples` 文件夹移动到您的 C:\ 驱动器。本章中的所有练习都假定文件夹路径为 **C:\BookSamples\Chapter_09**。图
  9-1 显示了此示例所需的文件夹结构。此文件夹结构随源代码一起提供。


