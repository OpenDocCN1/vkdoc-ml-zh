  ## 活动参考


  如图 7-4 所示，所有 Excel 自动化活动都可以在 Excel 类别/磁贴下找到。以下各节将提供有关如何配置和使用每个活动的说明。


  ![../images/493649_1_En_7_Chapter/493649_1_En_7_Fig4_HTML.jpg](img/493649_1_En_7_Fig4_HTML.jpg)


  图 7-4


  Excel 自动化活动


  ### 使用 Excel 文件


  在“资源”下找到的**使用 Excel 文件**活动允许您创建或打开一个 Excel 文件，以便在自动化中使用该文件的数据。


  这是 Excel 自动化的基础，并作为将 StudioX 与 Excel 集成的父活动。例如，复制粘贴、排序、筛选、插入和删除数据活动可以作为子活动添加到**使用
  Excel 文件**活动中。


  #### 配置


  本节提供如何配置**使用 Excel 文件**活动的说明，如图 7-5 所示。


  ![../images/493649_1_En_7_Chapter/493649_1_En_7_Fig5_HTML.jpg](img/493649_1_En_7_Fig5_HTML.jpg)


  图 7-5


  使用 Excel 文件活动卡片


  **Excel 文件**：这是活动卡片上的一项必需配置。此配置为 StudioX 提供 Excel 自动化将使用的工作簿数据的完整文件路径。


  **引用为**：这是活动卡片上的一项必需配置。建议为此字段填入一个唯一且描述性的名称，以便在自动化项目中引用该 Excel 文件，例如 `InvoiceData`
  或 `EmployeeOnboarding`。默认情况下，该字段填入 `Excel`。


  **保存更改**：这是活动卡片上的一项可选配置。此配置确保在对活动执行每个操作后保存工作簿。默认情况下，此选项处于选中状态。如果取消选中此选项，则会在数据管理器面板中的
  Excel 文件旁边显示消息 `保存关闭`。


  **不存在则创建**：这是活动卡片上的一项可选配置。此配置确保如果目标位置不存在文件，则创建一个空白文件。默认情况下，此选项处于选中状态。


  **编辑密码**：这是 `属性` 面板上的一项可选配置。此字段用于编辑受密码保护的 Excel 文件。如有必要，请在此字段中输入密码。


  **密码**：这是 `属性` 面板上的一项可选配置。此字段用于打开受密码保护的 Excel 文件。如有必要，请在此字段中输入密码。


  **只读**：这是 `属性` 面板上的一项可选配置。如果选中，工作簿将以只读模式打开以供自动化使用。此选项将允许自动化从工作簿中提取数据，即使该工作簿受密码保护。默认情况下，此选项未选中。


