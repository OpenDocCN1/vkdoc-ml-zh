  \n图 4-30\n\n点击活动练习的结果\n\n### 键入\n\n**键入**活动允许您在 UI 上的指定元素中输入文本。\n\n提示\n\n当应用程序的下拉菜单不支持选择项活动（将在下文讨论）时，使用键入活动是支持选择特定下拉选项的一个好方法。\n\
  \n\n#### 配置\n\n本节提供如何配置**键入**活动的说明，如图 4-31 所示。\n\n![../images/493649_1_En_4_Chapter/493649_1_En_4_Fig31_HTML.jpg](img/493649_1_En_4_Fig31_HTML.jpg)\n\
  \n图 4-31\n\n“键入”活动卡片\n\n**指示屏幕上的目标 (I)**：这是活动卡片上的必填配置。此配置允许您指定要输入数据的 UI 元素。\n\n\
  **键入此文本**：这是活动卡片上的可选配置。此配置允许您指定应在目标元素中输入的文本。您还可以选择在文本中包含特殊键，或切换密码模式以安全地键入文本。此文本可以是静态或动态的。\n\
  \n**键入前清空字段**：这是活动卡片上的可选配置。此配置允许您指定是保留目标元素中的现有文本还是将其清除。如果希望保留现有文本不变，请设置为 `None`。如果要清除现有文本，则使用单行或多行选项。如果您处理的是单行文本字段，使用\
  \ `Single line` 将清除文本；如果您处理的是多行组件（如文本区域），则 `Multi line` 选项效果最佳。请注意，字段数据是通过键盘快捷键清除的。\n\
  \n**键入前单击**：这是活动卡片上的可选配置。此配置允许您指定自动化在开始键入之前是否应单击目标元素。您可以选择 `Single` 单击或 `Double`\
  \ 双击。默认情况下，此选项设置为 `Single`。\n\n提示\n\n在文本字段需要单击一次或两次才能变为可编辑状态的情况下，“键入前单击”非常有用。\n\n\
  **按键间延迟**：这是 `Properties` 面板上的可选配置。此配置允许您指定每次击键之间的延迟。默认情况下，不设置延迟。此字段仅适用于硬件事件输入方法。\n\
