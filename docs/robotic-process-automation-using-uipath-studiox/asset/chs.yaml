  **表格名称（可选）**：这是活动卡片上的一个可选配置。此配置用于为表格提供名称。配置此字段最常见的方式是选择 `Text Builder` 选项，然后手动输入所需的名称。如果留空，表格将自动被分配第一个可用的名称，例如“Table1”。


