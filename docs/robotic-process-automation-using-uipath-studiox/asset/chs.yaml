  ### 遍历每封邮件


  **遍历每封邮件**活动允许您对特定文件夹中的每封邮件重复执行一系列操作。您可以配置此活动，以筛选特定数量的邮件、未读邮件、仅含附件的邮件以及更多高级自定义筛选条件。


