  ### 压缩/Zip 文件


  **压缩/Zip 文件**活动允许您使用多个文件或多个文件夹创建一个压缩文件。




  #### 配置


  本节提供如何配置**压缩/Zip 文件**活动的说明，如图 9-33 所示。


  ![../images/493649_1_En_9_Chapter/493649_1_En_9_Fig33_HTML.jpg](img/493649_1_En_9_Fig33_HTML.jpg)


  图 9-33


  压缩/Zip 文件的活动卡片


  **压缩文件名**：这是活动卡片上的一个必填配置。此配置允许您指定将要创建的压缩文件 (.zip) 的名称。


  **要压缩的内容**：这是活动卡片上的一个可选配置。此配置允许您指定希望文件被提取到的目标位置。


  **压缩文件**：这是活动卡片上的一个可选配置。此配置允许您保存有关压缩文件的信息。这将创建一个可在以后使用的变量。


  **压缩级别**：这是 `属性` 面板上的一个可选配置。此配置允许您指定将文件压缩到多小。您想要的压缩率越高，速度就越慢。有四个选项：`无`（默认）、`快速`、`正常`
  和 `最大`。


