  ## 活动参考


  如图 5-4 所示，所有邮件自动化活动都可以在“邮件”类别下找到。以下各节将提供有关如何配置和使用每个活动的说明。


  ![../images/493649_1_En_5_Chapter/493649_1_En_5_Fig4_HTML.jpg](img/493649_1_En_5_Fig4_HTML.jpg)


  图 5-4


  邮件自动化活动


  ### 使用 Desktop Outlook 应用


  **使用 Desktop Outlook 应用**活动允许你选择已在 Outlook 桌面应用程序中配置的 Outlook 账户进行自动化。


  此活动将包含你希望对 Outlook 账户执行的所有操作。例如，假设你想发送一封电子邮件。在这种情况下，**发送电子邮件**活动将嵌套在**使用 Desktop
  Outlook 应用**活动的主体中。


  #### 配置


  本节提供如何配置**使用 Desktop Outlook 应用**活动的说明，如图 5-5 所示。


  ![../images/493649_1_En_5_Chapter/493649_1_En_5_Fig5_HTML.jpg](img/493649_1_En_5_Fig5_HTML.jpg)


  图 5-5


  使用 Desktop Outlook 应用的活动卡片


  注意


  要配置此活动，请确保你的 Microsoft Outlook 桌面应用程序已配置并登录。


  **账户**：这是活动卡片上的一项必需配置。此配置允许你指定计划自动化的 Outlook 账户电子邮件地址。默认情况下，会选择你的 `Default Email
  Account`。如果你有多个 Outlook 账户，则可以使用下拉菜单选择适当的账户。


  提示


  将账户保留为“默认电子邮件账户”选项可以轻松地与其他用户共享自动化。这样，自动化被设计为在运行该流程的工作站的 Outlook 账户上执行。


  **引用为**：这是活动卡片上的一项必需配置。此配置允许你为你的 Outlook 账户提供一个名称。所有需要使用所选 Outlook 账户的活动都将通过此名称来引用它。


  ### 使用 Outlook 365


  **使用 Outlook 365** 活动允许你选择要自动化的 Exchange 账户。


  此活动将包含你希望对 Exchange 账户执行的所有操作。例如，假设你想发送一封电子邮件。在这种情况下，**发送电子邮件**活动将嵌套在**使用 Outlook
  365** 活动的主体中。


  #### 配置


  本节提供如何配置**使用 Outlook 365** 活动的说明，如图 5-6 所示。


