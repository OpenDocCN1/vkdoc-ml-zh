  在整个流程运行过程中，自动化将与订单管理系统进行交互，因此我们将从启动应用程序开始：


  1.  通过单击 `C:\BookSamples\InvoiceGenerationAutomation\App` 文件夹中的可执行文件来启动 `Order Management
  System` 应用程序。


