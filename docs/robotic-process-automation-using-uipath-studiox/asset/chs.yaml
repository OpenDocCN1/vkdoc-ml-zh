- '# 第二部分构建块


  '
- '# 3. 通用概念


  本章将向你介绍在 UiPath StudioX 中构建自动化时常用的概念、属性和活动。


  ## 学习目标


  在本章结束时，你将学习如何：


  *   使用项目笔记本中的公式和创建自定义公式


  *   将数据传递给活动


  *   存储活动返回的数据以供后续使用


  *   在自动化中配置常用活动


  ## 笔记本


  笔记本是一个很棒的概念，它使得 UiPath StudioX 真正实现了无代码化。


  大多数业务用户和公民开发者都熟悉 Excel。默认情况下，每个 UiPath StudioX 自动化都可以访问一个称为笔记本的 Excel 文件。你可以在项目中使用默认笔记本，或配置一个自定义的
  Excel 文件作为你的项目笔记本。


  ### 默认笔记本


  默认笔记本包含一些用于处理日期、文本、数字和文件值的预建公式。图 3-1 显示了笔记本的文本工作表，其中包含一些用于处理文本值的预建公式。


  ![../images/493649_1_En_3_Chapter/493649_1_En_3_Fig1_HTML.jpg](img/493649_1_En_3_Fig1_HTML.jpg)


  图 3-1


  项目笔记本的文本工作表


  对于额外的自定义字段和公式，你可以使用草稿工作表，或者向笔记本添加更多工作表并定义你的公式。


  要将数据传递给你在笔记本中的自定义公式，你可以使用 `Use Excel` 和 `Write Cell` 活动将数据写入特定单元格（参见第 7 章）。


  任何需要输入数据的活动都可以引用笔记本以检索数据输入。


  图 3-2 展示了一个示例，演示了如何将数据传递给笔记本中的自定义公式，然后从笔记本读取结果。在此例中，我们将一个名字“John Doe”写入文本工作表的一个单元格。多个公式会使用此单元格。在我们的例子中，我们感兴趣的是将名字拆分为名和姓，然后在`输出`面板中打印出来，因此我们输出了包含“名”的单元格。


  ![../images/493649_1_En_3_Chapter/493649_1_En_3_Fig2_HTML.jpg](img/493649_1_En_3_Fig2_HTML.jpg)


  图 3-2


  向项目笔记本传递数据以及从中读取数据




  ### 自定义笔记本


  您可以选择配置一个自定义的 Excel 文件作为您的项目笔记本。


  要配置自定义 Excel 文件作为项目笔记本，请单击功能区中“笔记本”菜单项中的`配置笔记本`选项，然后在“笔记本文件”字段中选择自定义的 Excel 文件，如图
  3-3 所示。


  ![../images/493649_1_En_3_Chapter/493649_1_En_3_Fig3_HTML.jpg](img/493649_1_En_3_Fig3_HTML.jpg)


  图 3-3


  配置自定义 Excel 作为项目笔记本


  ## 活动输入


  某些活动需要数据输入才能进行处理。例如，您可以为`写入行`活动提供文本作为输入。它将在输出面板中打印该值，或者您可以为`键入`活动提供文本作为输入，它将在表单字段中输入该值。每个需要输入数据的活动都为您提供了指定输入数据的选项。图
  3-4 显示了数据输入选项的示例菜单。当您单击字段中的`加号`图标时，数据输入选项菜单将变为可用。


  ![../images/493649_1_En_3_Chapter/493649_1_En_3_Fig4_HTML.jpg](img/493649_1_En_3_Fig4_HTML.jpg)


  图 3-4


  数据输入选项的示例菜单


  **Excel**：允许您指定单元格地址、范围、表格、自定义输入，甚至来自笔记本或任何其他 Excel 的工作表作为活动的输入。您还可以选择单个 Excel 行中的值作为数据输入（详情请参见第
  7 章）。


  **邮件**：允许您指定来自电子邮件的数据作为活动的输入（详情请参见第 5 章）。


  **文件**：允许您指定文件的属性作为活动的输入（详情请参见第 9 章），例如，文件的最后修改日期或文件的完整路径。


  **使用保存的值**：允许您指定从前一个活动返回的数据作为另一个活动的输入。


  **文本**：允许您指定静态或动态文本字符串作为活动的输入。此选项将打开`文本生成器`对话框。使用`文本生成器`，您可以将多个输入合并到一个文本字符串中。例如，图
  3-5 显示了两个数据输入与一些静态文本组合以返回单个文本输入。


  ![../images/493649_1_En_3_Chapter/493649_1_En_3_Fig5_HTML.jpg](img/493649_1_En_3_Fig5_HTML.jpg)


  图 3-5


  文本输入选项


  **数字**：允许您指定一个数字计算，可用于将数字、基本计算或来自 Excel 的复杂公式输入到活动中。


  **选择日期/时间**：允许您指定日期或时间作为活动的输入。图 3-6 显示了指定日期的选项，而图 3-7 显示了指定时间的选项。


