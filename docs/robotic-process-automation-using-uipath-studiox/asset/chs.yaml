  **账户**：这是活动卡片上的一项必需配置。此配置允许你指定或添加计划自动化的 Outlook 365 账户电子邮件地址。图 5-7 显示了添加新 Exchange
  账户的界面。此信息很可能由组织的 IT 部门提供。


