  配置自定义笔记本


  1.  在 `StudioX` 中，点击顶部功能区中的 `Notebook` ➤ `Configure Notebook` 菜单。


  2.  在 `Notebook file` 字段中，点击 `...` 并选择 `C:\BookSamples\ProductDataEntryAutomation\Templates\CustomNotebook.xlsx`
  文件，如图 11-14 所示。


  3.  点击 `OK` 按钮。


  ### 步骤 4：检查文件夹结构是否存在


  自动化流程可以在一天内运行多次。当天的首次运行将创建所需的文件夹结构，因此后续运行无需重复此步骤。为此，自动化流程需要检查 `DailyProcessing`
  文件夹下是否已存在当前日期（YYYYMMDD 格式）的文件夹：


  1.  在 `StudioX` 中，将 `Group` 活动添加到一个空白流程中。


  2.  将 `Display Name` 更新为 `Initialize`。


  3.  将 `Folder Exists` 活动添加到 `Initialize` 组活动的主体中。


  4.  将 `Display Name` 更新为 `Check Folder Structure Exists`。


  5.  在 `Folder path` 字段中，选择 `Notebook` ➤ `Indicate in Excel` 选项。从 `Scratchpad` 工作表中选择单元格
  `B5`。如表 11-1 所述，此单元格将包含当前日期文件夹的动态路径。


  6.  在 `Save result` 字段中，使用 `Save for Later Use` 选项，并将保存的值命名为 `CurrentDateFolderExists`。


  在此步骤中，我们不会指定文件夹存在时需要执行的操作。我们将在下一步中进行。图 11-15 展示了此步骤的配置。


  ![../images/493649_1_En_11_Chapter/493649_1_En_11_Fig15_HTML.jpg](img/493649_1_En_11_Fig15_HTML.jpg)


  图 11-15


  “检查文件夹结构是否存在”步骤的配置




  ### 步骤 5：创建新文件夹


  接下来，我们将使用“检查文件夹结构是否存在”活动中的结果 `CurrentDateFolderExists`，并指定自动化需要执行的操作。


  如果 `CurrentDateFolderExists` 为 true，则表示文件夹结构已由之前的运行创建。另一方面，如果 `CurrentDateFolderExists`
  为 false，则自动化需要在继续之前创建必要的文件夹结构。


  创建文件夹结构后，此流程的最后一步是将 `ConfirmationEmailTracker.xlsx` 复制到当前日期文件夹。自动化将使用此 Excel 文件保存电子邮件详细信息，以便在运行结束时向发件人发送完成确认电子邮件：


  1.  在 `StudioX` 中，将 `If` 活动添加到 `Initialize` 组活动主体中，位于 `Check Folder Structure Exists`
  活动之后。


  2.  将 `Display Name` 更新为 `Create` `Folder Structure`。


  3.  使用 `Condition Builder` 创建一个条件 `CurrentDateFolderExists is false`。


  4.  在 `Create Folder Structure` 活动的 `Then` 块中添加一个 `Create Folder` 活动。


  5.  将 `Display Name` 更新为 `Create Current Date Folder`。


  6.  在 `Folder name` 字段中，选择 `Notebook` ➤ `Indicate in Excel` 选项。从 `Scratchpad` 工作表中选择单元格
  `B5`。


  7.  在 `Create Folder Structure` 活动的 `Then` 块中，于 `Create Current Date Folder` 活动之后添加另一个
  `Create Folder` 活动。


  8.  将 `Display Name` 更新为 `Create Pending Sub-Folder`。


  9.  在 `Folder name` 字段中，选择 `Notebook` ➤ `Indicate in Excel` 选项。从 `Scratchpad` 工作表中选择单元格
  `B6`。如表 11-1 所述，此单元格将包含当前日期 Pending 文件夹的动态路径。


  10.  在 `Create Folder Structure` 活动的 `Then` 块中，于 `Create Pending Sub-Folder` 活动之后添加另一个
  `Create Folder` 活动。


  11.  将 `Display Name` 更新为 `Create Processed Sub-Folder`。


  12.  在 `Folder name` 字段中，选择 `Notebook` ➤ `Indicate in Excel` 选项。从 `Scratchpad` 工作表中选择单元格
  `B7`。如表 11-1 所述，此单元格将包含当前日期 Processed 文件夹的动态路径。


  13.  在 `Create Folder Structure` 活动的 `Then` 块中，于 `Create Processed Sub-Folder` 活动之后添加一个
  `Copy File` 活动。


  14.  将 `Display Name` 更新为 `Copy Confirmation Email Tracker`。


  15.  在 `From` 字段中，选择 `Notebook` ➤ `Indicate in Excel` 选项。从 `Scratchpad` 工作表中选择单元格
  `B3`。如表 11-1 所述，此单元格将包含 `ConfirmationEmailTracker.xlsx` 模板文件的静态路径。


  16.  在 `To` 字段中，选择 `Notebook` ➤ `Indicate in Excel` 选项。从 `Scratchpad` 工作表中选择单元格
  `B8`。如表 11-1 所述，此单元格将包含放置跟踪器的动态路径。


  图 11-16 显示了此步骤的配置。


