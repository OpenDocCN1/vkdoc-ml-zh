  ### 如果


  **如果**活动允许您检查一个条件，并根据结果选择自动化应遵循的路径。


  自动化可以遵循 **Then** 路径或 **Else** 路径。当条件为真时，自动化将遵循 **Then** 路径。否则，自动化将遵循 **Else** 路径。


  注意


  If 活动也称为决策活动、条件活动或 if-then-else 活动。




