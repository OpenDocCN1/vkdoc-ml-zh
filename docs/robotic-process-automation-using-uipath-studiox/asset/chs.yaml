  ### 使用 Word 文件


  **使用 Word 文件**活动允许您为自动化定义一个 Word 作用域。当流程执行时，Word 文档会被打开，并在完成后关闭。


  此活动将包含您希望对 Word 文档执行的所有操作。例如，如果您想将文档导出为 PDF，则**将文档另存为 PDF**活动将嵌套在**使用 Word 文件**活动的主体中。


  #### 配置


  本节提供如何配置**使用 Word 文件**活动的说明，如图 6-7 所示。


