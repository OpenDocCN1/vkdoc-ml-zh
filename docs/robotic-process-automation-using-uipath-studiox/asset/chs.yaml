- '# 7. Excel 自动化


  虽然 Excel 功能强大且在现代工作环境中被广泛使用，但历史上 Excel 自动化需要一定的技能和培训。UiPath 的 StudioX 与 Microsoft
  Excel 直观集成，简化了公民开发者在自动化提取、筛选、操作、写入、读取和传输数据等任务时的体验。




  ## 学习目标


  学完本章后，你将学会如何：


  *   定义要自动化的 Excel 范围

  *   插入、删除、复制、重命名和遍历工作表

  *   插入、删除和拆分列

  *   插入、删除和遍历 Excel 行

  *   向单元格写入值和公式

  *   从单元格读取值和公式

  *   创建、更改和刷新数据透视表

  *   复制、追加、填充、写入、自动填充、清除和排序范围

  *   以不同格式保存 Excel 文件，包括 PDF

  *   将数据导出为 CSV 格式

  *   应用筛选器和 VLookup 函数，并运行宏


  ## 示例概览


  本章使用的示例场景是员工入职。练习包含三个 Excel 工作簿，供一家刚招聘了 20 名新员工的小公司的人力资源团队使用。


  这些 Excel 文件的目的是为人力资源团队提供一个集中位置，用于管理新员工数据，并在他们适应组织的过程中报告其入职状态。


  **EmployeeOnboarding.xlsx**：此工作簿用于管理员工列表，包含新员工入职日期、薪资和所需培训等详细信息。这将是本章大部分练习使用的主要文件，用于组织工作表、添加输入数据、填写公式以及创建分析表格。


  **EmployeeOnboardingInput.xlsx**：此文件提供了五名新员工的数据，这些数据需要追加到包含最初 20 名员工的 EmployeeOnboarding
  Excel 文件中。


  **EmployeeOnboarding Final.xlsm**：这是“新员工名单”工作表的最终版本，需要格式化并执行宏，以便准备交付。


  图 7-1、7-2 和 7-3 展示了在执行本章详述的任何 Excel 自动化练习之前的电子表格。


