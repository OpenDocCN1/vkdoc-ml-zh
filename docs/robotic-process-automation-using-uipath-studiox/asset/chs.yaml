  \n图 4-20\n\n截取屏幕截图活动练习的最终配置\n\n\n\n### 检查应用状态\n\n当需要根据特定 UI 元素（例如应用程序上的加载图标）执行操作时，可以使用“检查应用状态”活动。作为人类，我们理解这意味着屏幕仍在加载，但自动化程序并不理解。**检查应用状态**活动是确保屏幕在自动化程序开始与之交互之前已完全加载的好方法。\n\
  \n提示\n\n对于需要根据 UI 元素（例如消息框或错误弹出窗口）执行不同操作的任务，“检查应用状态”活动是支持此类需求的绝佳方式。\n\n#### 配置\n\
  \n本节提供如何配置**检查应用状态**活动的说明，如图 4-22 所示。\n\n![../images/493649_1_En_4_Chapter/493649_1_En_4_Fig22_HTML.jpg](img/493649_1_En_4_Fig22_HTML.jpg)\n\
  \n图 4-22\n\n检查应用状态的活动卡片\n\n**指示屏幕上的目标 (I)**：这是活动卡片上的一项必需配置。此配置允许您指定一个 UI 元素，自动化程序将等待该元素出现或消失，然后再继续。\n\
  \n**等待**：这是活动卡片上的一项必需配置。此配置允许您指定自动化程序在继续之前是否需要等待目标元素出现或消失。默认情况下，此选项设置为`元素出现`。\n\n\
  **秒数**：这是活动卡片上的一项可选配置。此配置允许您指定自动化程序在继续之前等待目标元素出现或消失的时间（以秒为单位）。默认情况下，此选项设置为`5`秒。\n\
  \n**目标出现/消失**：如果目标成功出现或消失，您想要运行的一组活动将添加到此块中。\n\n**目标未出现/消失**：如果目标未出现或消失，您想要运行的一组活动将添加到此块中。\n\
  \n**结果**：这是`属性`面板上的一项可选配置。此配置允许您保存结果（`True` 或 `False`）以供后续使用。\n\n练习\n\n**目标**：使用\
  \ `Check App State` 活动等待旋转图标消失后再继续。\n\n**源代码**：Chapter_4_CheckAppStateExercise\n\
  \n**设置**：以下是分步实施说明：\n\n1.  接下来，在 `目标消失` 块中，添加一个 `消息框` 活动。\n\n2.  接下来，在 `消息框` 活动中，点击\
  \ `加号` 图标，选择 `文本` 选项，然后输入 `目标已消失`。点击 `保存`。\n\n3.  接下来，在 `目标未消失` 块中，添加一个 `消息框` 活动。\n\
  \n4.  接下来，在 `消息框` 活动中，点击 `加号` 图标，选择 `文本` 选项，然后输入 `目标未消失`。点击 `保存`。\n\n1.  接下来，选择\
  \ `使用应用程序/浏览器` 活动卡片，并在 `属性` 中，将 `选项` ➤ `打开` 属性设置为 `始终`。这将确保自动化程序始终打开一个新的浏览器。\n\n\
  2.  接下来，在 `使用应用程序/浏览器` 活动的主体中添加一个 `检查应用状态` 活动。\n\n3.  接下来，在 `检查应用状态` 活动中，点击 `指示屏幕上的目标\
  \ (I)` 链接，并将鼠标指向旋转图标。示例应用程序会显示旋转图标 10 秒钟，因此您需要在该时间范围内指示该元素。如果该时间范围太短，请在指示目标时使用暂停选项（从键盘按\
  \ F2）。此外，您可以在暂停即将结束时点击刷新（F5 或 Ctrl + R），以便有足够的时间指示旋转图标。\n\n4.  接下来，从 `等待` 下拉菜单中，选择\
  \ `元素消失` 选项。\n\n5.  在 `秒数` 字段中，点击 `加号` 图标，选择 `数字` 选项，然后输入 `15` 秒（这增加了 5 秒的缓冲时间）。\n\
  \n    **提示** 当 UI 元素出现或消失可能存在延迟时，为检查应用状态活动的秒数字段添加缓冲时间是支持延迟的好方法。\n\n1.  打开您选择的浏览器，并在\
  \ URL 字段中输入 [`https://therpabook.com/samples/contactsmanagement/home_load.html`](https://therpabook.com/samples/contactsmanagement/home_load.html)。\n\
  \n2.  在 `StudioX` 中，将 `使用应用程序/浏览器` 活动添加到一个空白流程中。\n\n3.  接下来，在 `使用应用程序/浏览器` 活动卡片中，点击\
  \ `指示应用程序`，并将鼠标指向浏览器。这将自动填充活动卡片。\n\n    **注意** 因为使用应用程序/浏览器卡片正在捕获 URL，并且在加载过程中 URL\
  \ 不会改变，所以您可以在页面加载中或加载完成后指示浏览器。\n\n完成练习后，**检查应用状态**活动的最终配置应类似于图 4-23。运行自动化程序后，它将等待\
  \ 15 秒，然后检查旋转图标是否已消失。根据目标应用程序的状态，将出现一个消息框并显示相应的消息。\n\n![../images/493649_1_En_4_Chapter/493649_1_En_4_Fig23_HTML.jpg](img/493649_1_En_4_Fig23_HTML.jpg)\n\
  \n图 4-23\n\n等待旋转图标消失的检查应用状态活动的最终配置\n\n### 点击\n\n**点击**活动允许您在指定的 UI 元素上执行鼠标点击操作。\n\
