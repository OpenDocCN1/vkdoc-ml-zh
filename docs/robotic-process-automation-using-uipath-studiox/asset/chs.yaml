  图 3-50


  Repeat Number Of Times 的活动卡片


  **Repeat number of times**：这是活动卡片上提供的一个必需配置。此配置允许你指定此活动应重复的次数。通常，此配置通过 Number 构建器选项指定。


  **For each**：这是活动卡片上提供的一个必需配置。随着活动重复，索引将不断增加；例如，当活动重复第二次时，索引将为 2。此配置允许你命名索引，以便在活动主体中引用它。你可以使用此索引来决定是否需要跳过特定迭代，或者在达到`Repeat
  Number Of Times`值之前简单地停止迭代。默认情况下，文本设置为`CurrentItem`，并且可以更新以适合你的自动化；例如，你可以将`CurrentItem`重命名为
  Vendor 或 Employee。


