  1.  在 `StudioX` 中，单击顶部功能区中的 `Notebook` ➤ `Configure Notebook` 菜单。


  2.  在 `Notebook file` 字段中，单击 `…` 并选择 `C:\BookSamples\InvoiceGenerationAutomation\Templates\CustomNotebook.xlsx`
  文件，如图 12-13 所示。


  3.  单击 `OK` 按钮。


  ### 步骤 4：初始化


  自动化需要执行的第一个活动是检查 `DailyProcessing` 文件夹下是否已存在当前日期（`YYYYMMDD` 格式）的文件夹。此操作的结果将存储在 `CurrentDateFolderExists`
  变量中。


  接下来，根据结果，我们将指定自动化需要执行的操作。如果 `CurrentDateFolderExists` 为 true，则表示文件夹结构已存在，需要删除。另一方面，如果
  `CurrentDateFolderExists` 为 false，则自动化需要创建必要的文件夹结构。


  最后的初始化步骤要求我们在 `DailyProcessing\Current Date (YYYYMMDD)` 文件夹中创建 `Templates\OrdersList.xlsx`
  的副本。自动化将使用此文件来存储待生成发票的订单列表。


  1.  在 `StudioX` 中，将 `Group` 活动添加到一个空白流程中。


  2.  将 `Display Name` 属性更新为 `Initialize`。


  3.  接下来，将 `Folder Exists` 活动添加到 `Initialize (Group)` 活动的主体中。


  4.  将 `Display Name` 更新为 `Check Folder Structure Exists`。


  5.  在 `Folder path` 字段中，选择 `CustomNotebook` ➤ `Indicate in Excel` 选项。从 `Scratchpad`
  工作表中选择单元格 `B9`。如表 12-1 所述，此单元格将包含当前日期文件夹的动态路径。


  6.  在 `Save result` 字段中，使用 `Save for Later Use` 选项，并将保存的值命名为 `CurrentDateFolderExists`。


  7.  在 `Check Folder Structure Exists` 活动之后添加一个 `If` 活动。


  8.  将 `Display Name` 更新为 `Create Folder Structure`。


  9.  使用 `Condition Builder`，创建一个新条件 `CurrentDateFolderExists is true`。


  10. 在 `Create Folder Structure` 活动的 `Then` 块中添加一个 `Delete Folder` 活动。


  11. 将 `Display Name` 更新为 `Delete Current Date Folder & Contents`。


  12. 在 `Folder name` 字段中，选择 `CustomNotebook` ➤ `Indicate in Excel` 选项。从 `Scratchpad`
  工作表中选择单元格 `B9`。


  13. 在 `Create Folder Structure` 活动的 `Then` 块中，于 `Delete Current Date Folder & Contents`
  活动之后添加一个 `Create Folder` 活动。


  14. 将 `Display Name` 更新为 `Create Current Date Folder`。


  15. 在 `Folder name` 字段中，选择 `CustomNotebook` ➤ `Indicate in Excel` 选项。从 `Scratchpad`
  工作表中选择单元格 `B9`。


  16. 复制 `Create Current Date Folder` 活动，并将其粘贴到 `Create Folder Structure` 活动的 `Else`
  块中。


  17. 接下来，在 `Initialize` 活动的主体中，于 `Create Folder Structure (If)` 活动之后添加 `Copy File`
  活动。


  18. 将 `Display Name` 更新为 `Create Orders List Excel Copy`。


  19. 在 `From` 字段中，选择 `CustomNotebook` ➤ `Indicate in Excel` 选项。从 `Scratchpad` 工作表中选择单元格
  `B5`。如表 12-1 所述，此单元格将包含 `OrdersList.xlsx` 文件的静态路径。


  20. 在 `To` 字段中，选择 `CustomNotebook` ➤ `Indicate in Excel` 选项。从 `Scratchpad` 工作表中选择单元格
  `B10`。如表 12-1 所述，此单元格将包含 `OrdersList.xlsx` 文件的动态路径。


