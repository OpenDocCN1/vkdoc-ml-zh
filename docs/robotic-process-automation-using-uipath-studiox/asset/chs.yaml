  ### 第 9 步：获取所有已下载的文件


  如解决方案设计所述，并在“处理邮件”流程中实现的那样，我们可能会收到一封或多封新的库存邮件。每封邮件都包含一个附件，因此“待处理”文件夹可能包含多个文件（数量与收到的邮件数相同）。在此步骤中，我们将使自动化流程能够从“待处理”文件夹中获取所有文件：


  1.  在 `StudioX` 中，在 `输入数据` 活动主体内的 `刷新网页` 活动之后，添加 `对于文件夹中的每个文件` 活动。


  2.  将 `显示名称` 更新为 `获取所有已下载的文件`。


  3.  在 `对于每个` 字段中，将引用保留为 `CurrentFile`。


  4.  在 `在文件夹中` 字段中，选择 `笔记本` ➤ `在 Excel 中指示` 选项。从 `Scratchpad` 工作表中选择单元格 `B6`。


  5.  取消勾选 `包含子文件夹` 选项，因为没有子文件夹。


  6.  在 `按筛选` 字段中，输入 `*.xlsx`。这将确保只从文件夹中选取 Excel 文件。


  7.  在 `排序方式` 字段中，输入 `创建日期最早的优先`。这将按从旧到新的顺序返回文件。


