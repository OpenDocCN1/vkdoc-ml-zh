  ### 文本转列


  **文本转列**活动允许您将给定单元格、工作表或范围中的文本拆分到单独的列中。


  此活动的常见示例包括将单行中的名字和姓氏拆分到单独的列，或将包含供应清单的单元格拆分为多列。




  #### 配置


  本节提供如何配置**文本分列**活动的说明，如图 7-27 所示。


  ![../images/493649_1_En_7_Chapter/493649_1_En_7_Fig27_HTML.jpg](img/493649_1_En_7_Fig27_HTML.jpg)


  图 7-27


  文本分列活动卡片


  **源**：这是活动卡片上的一个必填配置。此配置用于标识包含需要拆分为列的数据的单元格、区域或表格。


  **目标**：这是活动卡片上的一个必填配置。此配置用于指定拆分后数据应添加到的列的位置。


  注意


  文本分列活动的目标必须与源位于同一工作表中。


  **数据类型**：这是活动卡片上的一个必填配置。此配置指示源区域的数据以何种类型的分隔符进行拆分。此字段的默认选择是`分隔符`，表示源数据由特定字符分隔。如果源数据需要根据特定字符数进行拆分，则可将数据类型更改为`固定宽度`。


  **分隔符**：这是活动卡片上的一个必填配置。此配置仅在`数据类型`为`分隔符`时可用。此配置用于标识用作源区域数据分隔符的字符。默认情况下，`制表符`、`分号`、`逗号`和`空格`选项处于选中状态。`换行符`和`其他`处于未选中状态，如果选中，将打开一个文本字段以指定分隔符字符。


  **连续分隔符视为一个**：这是活动卡片上的一个必填配置。此配置仅在`数据类型`为`分隔符`时可用。此配置允许您指定是否有多个字符分隔数据。默认情况下，此选项处于选中状态。


  例如，如果源单元格包含文本 `notebooks;, clipboards`，则 `;,` 将作为一个分隔符。在这种情况下，`notebooks` 将被添加到第一列，`clipboards`
  将被添加到第二列。


  **文本限定符**：这是活动卡片上的一个必填配置。此配置仅在`数据类型`为`分隔符`时可用。默认情况下，此选项设置为`无`，表示被括起来的文本限定符不定义正在拆分的数据。此选项可以更改为`单引号`或`双引号`。


  例如，如果`分隔符`是逗号，而`文本限定符`是双引号，则文本 `notebooks, pens", clipboards` 将被拆分为第一列的 `notebooks,
  pens` 和第二列的 `clipboards`。


  **每列字符数**：这是活动卡片上的一个必填配置。此配置仅在`数据类型`为`固定宽度`时需要。此字段提供要分组到列中的字符长度。


