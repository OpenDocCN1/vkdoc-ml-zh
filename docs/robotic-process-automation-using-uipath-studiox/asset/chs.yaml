  | 属性 | 说明 |

  | --- | --- |

  | 当前日期 | 单元格 B2 中的公式将生成 YYYYMMDD 格式的当前日期，该日期将被后续行中的所有路径使用。 |

  | 确认邮件追踪器 – 模板路径 | `ConfirmationEmailTracker.xlsx` 模板的静态路径。 |

  | 每日处理 – 文件夹路径 | 自动化流程用于存储每日处理文件夹和文件的静态路径。 |

  | 当前日期 – 文件夹路径 | 自动化流程用于管理当日处理的动态文件夹路径。 |

  | 当前日期\待处理 – 文件夹路径 | 自动化流程用于存储待处理附件的动态文件夹路径。 |

  | 当前日期\已处理 – 文件夹路径 | 自动化流程用于存储已处理附件的动态文件夹路径。 |

  | 确认邮件追踪器 – 路径 | 存放当日 `ConfirmationEmailTracker.xlsx` 副本的动态路径。 |

  | 已处理邮件文件夹 – 路径 | Outlook 文件夹的静态路径，所有邮件在处理后将被移入该文件夹。 |


  以下是配置自定义笔记本的分步说明：


