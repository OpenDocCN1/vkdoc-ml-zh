  \ `StudioX` 中，将`截取屏幕截图`活动添加到`使用应用程序/浏览器`活动主体中，位于`高亮`活动之后。\n\n2.  接下来，在`截取屏幕截图`活动中，单击`指示屏幕上的目标\
