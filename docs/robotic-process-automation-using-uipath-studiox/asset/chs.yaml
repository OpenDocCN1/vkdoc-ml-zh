  ### 步骤 15：为当前订单生成发票


  我们已经有了发票模板的副本以及生成发票所需的所有数据。现在，我们可以配置自动化流程，为当前正在处理的订单生成发票：


  1.  在 `StudioX` 中，将 `使用 Word 文件` 活动添加到 `提取订单详情并生成发票` 活动主体内，位于 `删除多余列` 活动之后。


  2.  将 `显示名称` 更新为 `为当前订单生成发票`。


  3.  在 `Word 文件` 字段中，选择 `CustomNotebook` ➤ `在 Excel 中指示` 选项。从 `Scratchpad` 工作表中选择单元格
  `B12`。


  4.  取消勾选 `不存在则创建` 标志。


  5.  勾选 `保存更改` 标志，以确保每次迭代后文件都被保存。


  6.  在 `为当前订单生成发票` 活动主体内添加一个 `替换文档中的文本` 活动。


  7.  将 `显示名称` 更新为 `输入发票编号`。


  8.  在 `搜索` 字段中，选择 `文本` 选项，并输入 `<INVOICENO>`。这是发票模板中的占位符，将被搜索并替换为下一步配置中提供的值。


  9.  在 `替换为` 字段中，选择 `CustomNotebook` ➤ `在 Excel 中指示` 选项。从 `Scratchpad` 工作表中选择单元格
  `B4`。如表 12-1 所述，此单元格将包含使用自定义公式生成的发票编号。


  10. 在 `为当前订单生成发票` 活动主体内，于 `输入发票编号` 活动之后添加一个 `替换文档中的文本` 活动。


  11. 将 `显示名称` 更新为 `输入发票日期`。


  12. 在 `搜索` 字段中，选择 `文本` 选项，并输入 `<DATE>`。


  13. 在 `替换为` 字段中，选择 `CustomNotebook` ➤ `在 Excel 中指示` 选项。从 `Scratchpad` 工作表中选择单元格
  `B2`。这将提供当前日期的值。


  14. 在 `为当前订单生成发票` 活动主体内，于 `输入发票日期` 活动之后添加一个 `替换文档中的文本` 活动。


  15. 将 `显示名称` 更新为 `输入客户`。


  16. 在 `搜索` 字段中，选择 `文本` 选项，并输入 `<CUSTOMER>`。


  17. 在 `替换为` 字段中，悬停在 `CurrentOrder` 上并选择 `客户` 选项。这将提供当前正在处理的订单的客户值。


  18. 在 `为当前订单生成发票` 活动主体内，于 `输入客户` 活动之后添加一个 `替换文档中的文本` 活动。


  19. 将 `显示名称` 更新为 `输入客户联系方式`。


  20. 在 `搜索` 字段中，选择 `文本` 选项，并输入 `<CUSTOMERCONTACT>`。


  21. 在 `替换为` 字段中，悬停在 `CurrentOrder` 上并选择 `联系方式` 选项。这将提供当前正在处理的订单的客户联系方式值。


  22. 在 `为当前订单生成发票` 活动主体内，于 `输入客户联系方式` 活动之后添加一个 `替换文档中的文本` 活动。


  23. 将 `显示名称` 更新为 `输入收货地址`。


  24. 在 `搜索` 字段中，选择 `文本` 选项，并输入 `<SHIPTOADDRESS>`。


  25. 在 `替换为` 字段中，悬停在 `CurrentOrder` 上并选择 `地址` 选项。这将提供当前正在处理的订单的收货地址值。


  26. 在 `为当前订单生成发票` 活动主体内，于 `输入收货地址` 活动之后添加一个 `替换文档中的文本` 活动。


  27. 将 `显示名称` 更新为 `输入总金额`。


  28. 在 `搜索` 字段中，选择 `文本` 选项，并输入 `<TOTALAMOUNT>`。


  29. 在 `替换为` 字段中，悬停在 `CurrentOrder` 上并选择 `总金额` 选项。这将提供当前正在处理的订单的总金额值。


  30. 到目前为止，我们已经替换了所有单项内容；现在我们要在 Word 中插入一个来自 Excel 的完整表格。在 `为当前订单生成发票` 活动主体内，于 `输入总金额`
  活动之后添加一个 `在文档中插入数据表` 活动。


  31. 将 `显示名称` 更新为 `在发票中插入订单详情表`。


  32. 在 `要插入的表格` 字段中，悬停在 `OrderDetails` 上并选择 `行项目 [Sheet]` 选项。这包含了 Excel 中我们将作为表格插入到
  Word 文档的所有数据。


  33. 在 `插入相对于` 字段中，从下拉菜单中选择 `文本` 选项。


  34. 在 `要搜索的文本` 字段中，选择 `文本` 选项并输入 `<PRODUCTS>`。这是发票模板中将要插入表格的占位符。


  35. 在 `文本出现位置` 字段中，从下拉菜单中选择 `第一个`。


  36. 在 `插入位置` 字段中，选择 `替换` 选项。我们将用实际表格替换 `<PRODUCTS>` 文本。


  37. 此时，发票将以 Word 格式生成。接下来，我们将配置自动化流程以 PDF 格式导出发票。在 `为当前订单生成发票` 活动主体内，于 `在发票中插入订单详情表`
  活动之后添加一个 `将文档另存为 PDF` 活动。


  38. 在 `要保存的文件路径` 字段中，选择 `CustomNotebook` ➤ `在 Excel 中指示` 选项。从 `Scratchpad` 工作表中选择单元格
  `B13`。如表 12-1 所述，此单元格将包含 PDF 文件的动态路径。


  图 12-25 展示了此步骤的配置。


  ![../images/493649_1_En_12_Chapter/493649_1_En_12_Fig25_HTML.jpg](img/493649_1_En_12_Fig25_HTML.jpg)


  图 12-25


  为当前订单生成发票步骤的配置


  ### 步骤 16：将采购订单标记为已处理


  现在发票已生成，我们将在订单管理系统中将当前订单的发票状态标记为“已处理”，并关闭订单详情屏幕：


  1.  在 `StudioX` 中，将 `勾选/取消勾选` 活动添加到 `提取订单详情并生成发票` 活动主体内，位于 `为当前订单生成发票` 活动之后。


  2.  点击 `在屏幕上指示目标 (I)` 链接，并选择 `已处理` 复选框。使用标签作为锚点。


  3.  将 `操作` 字段设置为 `勾选`。这将把发票标记为“已处理”。


  4.  将 `显示名称` 更新为 `将发票标记为已处理`。


  5.  在 `提取订单详情并生成发票` 活动主体内，于 `将发票标记为已处理` 活动之后添加一个 `点击` 活动。


  6.  点击 `在屏幕上指示目标 (I)` 链接，并选择 `保存并关闭` 按钮。对于锚点，请使用 `保存并关闭` 按钮所在的标题区域。


  7.  将 `显示名称` 更新为 `点击保存并关闭按钮`。


  图 12-26 展示了此步骤的配置。


  ![../images/493649_1_En_12_Chapter/493649_1_En_12_Fig26_HTML.jpg](img/493649_1_En_12_Fig26_HTML.jpg)


  图 12-26


  将采购订单标记为已处理步骤的配置


  ### 步骤 17：删除临时订单详情 Excel 文件


  这是自动化的最后一步。既然已为当前正在处理的订单生成了发票，我们可以安全地删除 `OrderDetails.xlsx` 文件。此文件是临时创建的，仅用于存储当前订单的订单详情。


  1.  在 `StudioX` 中，将 `删除文件` 活动添加到 `处理所有采购订单` 活动主体内，位于 `提取订单详情并生成发票` 活动之后。


  2.  将 `显示名称` 更新为 `删除临时订单详情 Excel 文件`。


  3.  在 `文件名` 字段中，选择 `CustomNotebook` ➤ `在 Excel 中指示` 选项。从 `Scratchpad` 工作表中选择单元格
  `B11`。


  图 12-27 展示了此步骤的配置。


  ![../images/493649_1_En_12_Chapter/493649_1_En_12_Fig27_HTML.jpg](img/493649_1_En_12_Fig27_HTML.jpg)


  图 12-27


  删除临时订单详情 Excel 文件步骤的配置




