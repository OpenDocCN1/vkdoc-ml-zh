  ### 对于每个 Excel 行


  **对于每个 Excel 行**活动允许您对同一工作簿中的工作表、表格或范围内的每一行执行一个或多个活动。


  注意


  必须在“对于每个 Excel 行”活动中配置至少一个子活动，才能对多个 Excel 行执行迭代操作。


  #### 配置


  本节提供如何配置**对于每个 Excel 行**活动的说明，如图 7-43 所示。


  ![../images/493649_1_En_7_Chapter/493649_1_En_7_Fig43_HTML.jpg](img/493649_1_En_7_Fig43_HTML.jpg)


  图 7-43


  对于每个 Excel 行活动卡片


  **对于每个**：这是活动卡片上的一个必填配置。此配置允许您提供一个名称来引用当前正在迭代的行；这对于在子活动中进行引用尤其重要。默认文本为`CurrentRow`，您可以根据正在迭代的数据进行更改。例如，当您对多个员工列表执行相同操作时，可以选择将当前行命名为
  Employees。您可以直接输入所需名称来配置此字段，或保留默认值。


  **在范围中**：这是活动卡片上的一个必填配置。此配置提供包含需要迭代的数据行的工作表、范围或表格。


  **有标题行**：这是活动卡片上的一个可选配置。此配置指示`在范围中`的第一行是标题行。选择此选项将有助于在子活动中引用`CurrentRow`数据的特定列名。此选项默认未选中。


  **每行后保存**：这是活动卡片上的一个可选配置。此配置指定是否应在每次迭代一行后保存 Excel 文件。此选项默认未选中，意味着 Excel 文件将根据父级`使用
  Excel 文件`活动中设置的保存配置或使用`保存 Excel 文件`活动进行保存。


  **EmptyRowBehavior**：这是`属性`面板上的一个可选配置。此配置指示自动化在迭代数据时遇到空行时的行为。默认选项设置为`Stop`，意味着活动将停止迭代后续行。此选项可以更改为`Skip`，以便跳过空行并处理迭代中的下一行，或更改为`Process`，以便将空行包含在迭代数据处理中。


