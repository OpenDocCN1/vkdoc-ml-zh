- '# 12. 发票生成自动化


  在本章中，我们将自动化订单管理流程中的发票生成任务。


  ## 学习目标


  此自动化将帮助您理解以下主题：


  *   创建文件夹结构、复制和移动文件


  *   与桌面应用程序交互


  *   从多个表中读取数据


  *   使用 Excel 临时存储和操作数据


  *   在 Word 文档中动态输入单条和表格数据


  *   从 Word 文档生成 PDF 文档




  ## 手动流程概述


  应收账款分析师（以下简称“分析师”）每天运行发票生成流程。图 12-1 展示了发票生成任务的高级概览。


  ![../images/493649_1_En_12_Chapter/493649_1_En_12_Fig1_HTML.jpg](img/493649_1_En_12_Fig1_HTML.jpg)


  图 12-1

  发票生成任务的高级概览


  由于此任务每天执行，为了按天整理发票，分析师首先在 `DailyProcessing` 文件夹下，以 `YYYYMMDD` 格式为当前日期创建一个新文件夹。图
  12-2 展示了 `DailyProcessing` 文件夹的结构。


  ![../images/493649_1_En_12_Chapter/493649_1_En_12_Fig2_HTML.jpg](img/493649_1_En_12_Fig2_HTML.jpg)


  图 12-2

  用于管理每日发票生成任务的文件夹结构


  接下来，分析师启动订单管理系统，并筛选出状态为“待开票”的订单，如图 12-3 所示。


  ![../images/493649_1_En_12_Chapter/493649_1_En_12_Fig3_HTML.jpg](img/493649_1_En_12_Fig3_HTML.jpg)


  图 12-3

  按“待开票”状态筛选后的订单


  对于每个状态为“待开票”的订单，分析师在“搜索”字段中输入订单号，并点击“搜索订单”按钮。这将打开“订单详情”界面，如图 12-4 所示。


  ![../images/493649_1_En_12_Chapter/493649_1_En_12_Fig4_HTML.jpg](img/493649_1_En_12_Fig4_HTML.jpg)


  图 12-4

  订单详情界面


  与此同时，分析师根据 Word 模板（DOCX）创建一份新的发票副本。该发票文件存放在当前日期文件夹中，文件名反映发票编号。


  发票编号的生成方式是将订单号中的 `PO` 前缀替换为 `INV`，例如，`PO00100` 将变为 `INV00100`。


  接着，分析师从“订单详情”界面复制数据，并将其粘贴到发票中。


  所有数据复制到发票后，分析师将其导出为 PDF 格式。图 12-5 展示了一份已生成发票的示例。


  ![../images/493649_1_En_12_Chapter/493649_1_En_12_Fig5_HTML.jpg](img/493649_1_En_12_Fig5_HTML.jpg)


  图 12-5

  已生成发票的示例


  ## 解决方案设计


  本节概述了我们如何设计自动化流程。图 12-6 展示了库存管理流程自动化的流程图。


  ![../images/493649_1_En_12_Chapter/493649_1_En_12_Fig6_HTML.jpg](img/493649_1_En_12_Fig6_HTML.jpg)


  图 12-6

  自动化的解决方案设计


  将自动化流程拆分为更小、更符合逻辑的流程有助于简化实施和调试过程。如图 12-6 所示，我们将把自动化流程分为两个逻辑流程。


  该自动化将每天运行一次。唯一需要在同一天内多次运行的情况是遇到错误并需要重启。每次自动化运行时，我们都要确保清除上一次运行的所有数据。


  ## 实施


  现在我们已经充分了解了如何设计自动化流程，可以开始实施工作了。


  ### 步骤 1：设置


  在开始实施之前，请从本书的 GitHub 仓库下载项目文件夹，其中包含演示应用程序和相关模板。


  注意


  本章假设自动化文件夹 `InvoiceGenerationAutomation` 位于 `C:\BookSamples\` 文件夹内。


  `InvoiceGenerationAutomation` 文件夹包含三个子文件夹，如图 12-7 所示。


