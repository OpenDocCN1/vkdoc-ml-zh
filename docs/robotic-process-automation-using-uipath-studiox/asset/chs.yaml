  ### 第 7 步：保存邮件详情以备确认


  接下来，自动化流程需要将邮件详情保存到 `ConfirmationEmailTracker.xlsx` 中，以便稍后检索并发送确认邮件：


  1.  在 `StudioX` 中，在 `获取匹配邮件` 活动主体内的 `将邮件移至已处理` 活动之后，添加 `使用 Excel 文件` 活动。


  2.  将 `显示名称` 更新为 `保存邮件详情以备确认`。


  3.  在 `Excel` 字段中，选择 `笔记本` ➤ `在 Excel 中指示` 选项。从 `Scratchpad` 工作表中选择单元格 `B8`。如表 11-1
  所述，此单元格将包含 `ConfirmationEmailTracker.xlsx` 放置位置的动态路径。


  4.  将 `引用` 字段更新为 `ConfirmationEmailTracker`。


  5.  勾选 `保存更改` 标志，以确保每次迭代后文件都被保存。


  6.  取消勾选 `不存在则创建` 标志。


  7.  勾选 `模板文件` 标志，选择 `浏览文件` 选项，然后选择 `C:\BookSamples\ProductDataEntryAutomation\Templates\
  ConfirmationEmailTracker.xlsx`。


  8.  现在自动化流程已拥有对 `ConfirmationEmailTracker.xlsx` 的引用，在 `保存邮件详情以备确认` 活动主体内添加一个 `写入单元格`
  活动。


  9.  将 `显示名称` 更新为 `保存发件人邮箱地址`。


  10. 在 `要写入的内容` 字段中，选择 `[当前邮件] 发件人`；这包含了当前邮件的发件人邮箱地址。


  11. 在 `写入位置` 字段中，您需要提供一个要输入数据的单元格。选择 `ConfirmationEmailTracker` ➤ `在 Excel 中指示`
  选项，然后选择单元格 `A2`。您只需提供起始单元格编号。


  12. 勾选 `自动递增行` 选项。如上一所述，您只需提供起始单元格，因为此自动递增配置将确保自动化流程在 `对于每封邮件` 循环的每次迭代中，自动移至下一行。


  13. 复制并粘贴 `写入单元格` 活动。将 `显示名称` 更新为 `保存发送日期`。将 `要写入的内容` 字段更新为 `[当前邮件] 日期`。将 `写入位置`
  字段更新为单元格 `B2`。


  14. 复制并粘贴 `写入单元格` 活动。将 `显示名称` 更新为 `保存邮件主题`。将 `要写入的内容` 字段更新为 `[当前邮件] 主题`。将 `写入位置`
  字段更新为单元格 `C2`。


  15. 复制并粘贴 `写入单元格` 活动。将 `显示名称` 更新为 `保存默认确认状态`。在 `要写入的内容` 字段中，输入 `未发送`。将 `写入位置` 字段更新为单元格
  `D2`。自动化流程稍后会将状态更新为 `已发送`。添加此默认 `未发送` 状态的原因是，如果一天内需要多次发送邮件，自动化流程可以据此在 Excel 中筛选
  `已发送` 和 `未发送` 的行。


