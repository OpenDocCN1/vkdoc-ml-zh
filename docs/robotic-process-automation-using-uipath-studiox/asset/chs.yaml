  ### VLookup


  **VLookup** 活动利用 Excel 的 VLookup 函数在引用的 Excel 文件中的某个区域、工作表或表格中查找数据。


  **VLookup** 活动的常见示例包括查找库存项目，然后定位并返回该项目的确切价格，或者查找员工，然后定位该特定员工的开始日期。




  #### 配置


  本节提供如何配置 **VLookup** 活动的说明，如图 7-107 所示。


  ![../images/493649_1_En_7_Chapter/493649_1_En_7_Fig107_HTML.jpg](img/493649_1_En_7_Fig107_HTML.jpg)


  图 7-107


  VLookup 活动卡片


  **要查找的值**：这是活动卡片上的一个必填配置。`Value to lookup` 字段用于标识您要在目标范围中搜索的值。例如，要查找 John Smith
  的开始日期，则“要查找的值”字段将包含姓氏 Smith 的单元格地址。


  注意


  “要查找的值”字段必须始终位于所标识范围的第一列，这与 Excel 中 VLookup 函数的要求相同。


  **在范围中**：这是活动卡片上的一个必填配置。`In range` 选择用于提供包含要查找值的工作表、表格或范围。


  **列索引**：这是活动卡片上的一个必填配置。此字段用于标识范围中包含要查找并返回的值的列。例如，如果 John Smith 的开始日期位于表格的 D 列，则“列索引”应为数字
  4，表示该值位于范围的第四列。


  **精确匹配**：这是活动卡片上的一个可选配置。勾选此字段意味着 VLookup 活动将仅返回精确匹配项；若未勾选，则活动将返回近似匹配项。此字段的默认选择为勾选状态，通常保持原样。


  **保存到**：这是活动卡片上的一个可选配置；但这是一个输出字段，应为 `VLookup` 活动定义。`Save to` 字段用于提供应保存 `VLookup`
  活动返回值的单元格。


  练习


