  ### 使用 Gmail


  **使用 Gmail** 活动允许你与 Gmail 和 Google 日历集成，以自动化 Gmail 账户的电子邮件活动。


  此活动将包含你希望对 Gmail 账户执行的所有操作。例如，假设你想发送一封电子邮件。在这种情况下，**发送电子邮件**活动将嵌套在**使用 Gmail** 活动的主体中。


