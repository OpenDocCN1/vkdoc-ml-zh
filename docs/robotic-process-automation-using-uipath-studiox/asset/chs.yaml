  ### 创建数据透视表


  **创建数据透视表**活动用于创建数据透视表，帮助您组织、分析和汇总数据。此外，**创建数据透视表**活动还附带**添加数据透视字段**子活动，允许您向新的数据透视表中添加行、列、筛选器或值。




  #### 配置


  本节提供如何配置**创建数据透视表**活动的说明，如图 7-48 所示。


  ![../images/493649_1_En_7_Chapter/493649_1_En_7_Fig48_HTML.jpg](img/493649_1_En_7_Fig48_HTML.jpg)


  图 7-48


  创建数据透视表活动卡片


  **源**：这是活动卡片上的一个必填配置。此配置提供为新数据透视表提供数据的源范围或表。配置此字段的常用方法是选择一个命名表作为源。


  **新表名称**：这是活动卡片上的一个必填配置。此配置提供数据透视表的名称。配置此字段最常见的方式是选择`文本生成器`选项，手动输入所需名称。


  **目标位置**：这是活动卡片上的一个必填配置。此字段标识应在其中创建新数据透视表的工作表、表或范围。通常通过选择一个命名的工作表或表，或使用`在 Excel
  中指示`选项来配置此字段。


  **数据透视字段**：子活动允许您为父级`创建数据透视表`活动中正在创建的新数据透视表添加行、列、值和筛选器。


  **字段**：`字段`值是`添加数据透视字段`子活动配置所必需的。此配置指定应将`源`中的哪个字段添加到新数据透视表中。您可以通过从`范围`选择器中选择一个`列标题`，或使用`在
  Excel 中指示`来选择所需的列标题来进行配置。


