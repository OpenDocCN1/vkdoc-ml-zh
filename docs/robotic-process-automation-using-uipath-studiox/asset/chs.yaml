  ### Switch


  **Switch**活动允许您定义多个分支，然后根据一个表达式执行单个分支。


  If 活动和 Switch 活动都是条件活动，即根据表达式结果，它们会遵循其中一条已定义的路径。当只有两个选择时，可以使用 If 活动；而当有多个选择时，Switch
  活动更为适用。




  #### 配置


  本节提供如何配置**Switch**活动的说明，如图 3-43 所示。


  ![../images/493649_1_En_3_Chapter/493649_1_En_3_Fig43_HTML.jpg](img/493649_1_En_3_Fig43_HTML.jpg)


  图 3-43


  Switch 的活动卡片


  **TypeArgument**：这是`Properties`面板上提供的一个可选配置。从图 3-44 所示的下拉菜单中，你需要选择表达式将返回的值的类型。


  ![../images/493649_1_En_3_Chapter/493649_1_En_3_Fig44_HTML.jpg](img/493649_1_En_3_Fig44_HTML.jpg)


  图 3-44


  参数类型选项


  如果你的表达式结果为 true 或 false，则选择`Boolean`。如果你的表达式结果为数字，例如 1、2、3 等，则选择`Int32`。如果你的表达式结果为文本，例如
  January、February、March 等，则选择`String`。


  **Expression**：这是活动卡片上提供的一个必需配置。此表达式将返回一个被定义为 case 的值。例如，它可以指向 Excel 中具有状态值的一列，然后根据该状态值，你想要执行特定的操作。


  **Add new case**：这是活动卡片上提供的一个必需配置，即必须提供一个 Default case。此配置允许你向 Switch 活动添加一个新的 Case
  值，如图 3-45 所示。


  ![../images/493649_1_En_3_Chapter/493649_1_En_3_Fig45_HTML.jpg](img/493649_1_En_3_Fig45_HTML.jpg)


  图 3-45


  在 Switch 活动中添加新 case


  添加新的`Case`值后，你可以向此`Case`值的主体中添加活动，如图 3-46 所示。在执行过程中，如果表达式返回的值与此 case 匹配，则将执行此 case
  主体中的活动。


