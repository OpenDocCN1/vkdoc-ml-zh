  您也可以在浏览器中通过 [`https://therpabook.com/samples/inventorymanagement/`](https://therpabook.com/samples/inventorymanagement/)
  访问库存管理 Web 应用程序。




  #### 模板


  此子文件夹包含自动化流程使用的两个 Excel 模板。


  `ProductsList.xlsx` 模板帮助 UiPath 理解通过电子邮件接收的 Excel 附件的结构。图 11-10 展示了此 Excel 模板的结构。


