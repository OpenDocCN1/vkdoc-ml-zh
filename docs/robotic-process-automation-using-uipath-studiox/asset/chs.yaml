  **范围**：这是活动卡片上的一个必填配置。`Range` 字段用于标识包含需要排序的列或目标位置的工作表、表格或范围。


  **排序列**：至少需要为`Sort Range`活动配置一个`Sort By Column`子活动。可以通过点击`Sort Range`活动卡片上的`Add
  Sort Column`按钮来添加`Sort By Column`子活动。可以根据需求对同一范围多次使用`Add Sort Column`选项，以按所需数量的列进行排序。`Sort
  By Column`子活动要求配置`Column`和`Direction`字段。


