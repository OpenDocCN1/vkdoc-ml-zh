  \n图 2-10\n\n“工具”选项卡中可用的扩展\n\n#### 设置\n\n**Settings** 选项卡，如图 2-11 所示，提供了更改界面语言、主题、设计首选项、默认位置以及管理您的许可证和个人资料的选项。\n\
