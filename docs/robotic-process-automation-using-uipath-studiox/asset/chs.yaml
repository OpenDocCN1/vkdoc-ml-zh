  为了保持一致性并提高可重用性，应在 Orchestrator 中存储跨多个自动化共享的值。




  #### 配置


  本节提供如何配置**获取 Orchestrator 资产**活动的说明，如图 3-64 所示。


  ![../images/493649_1_En_3_Chapter/493649_1_En_3_Fig64_HTML.jpg](img/493649_1_En_3_Fig64_HTML.jpg)


  图 3-64


  获取 Orchestrator 资产的活动卡片


  **资产名称**：这是活动卡片上的一个必填配置。此配置允许您指定要从 Orchestrator 检索的资产。


  **Orchestrator 文件夹路径**：这是 `Properties` 面板中的一个必填配置。此配置允许您指定资产在 Orchestrator 中的文件夹路径。


  **保存以备后用**：这是活动卡片上的一个可选配置。此配置允许您保存从 Orchestrator 返回的资产，以便在自动化中后续使用。之后您可以从“使用已保存的值”菜单中引用该资产。


  练习


  **目标**：使用 `Get Orchestrator Asset` 活动从 Orchestrator 检索一个 `DocumentPath` 资产，如图 3-65
  所示。


  ![../images/493649_1_En_3_Chapter/493649_1_En_3_Fig65_HTML.jpg](img/493649_1_En_3_Fig65_HTML.jpg)


  图 3-65


  Orchestrator 中的 DocumentPath 资产


  **源代码**：Chapter_3-GetOrchestratorAssetExercise


  **设置**：以下是分步实施说明：


  1.  在 `StudioX` 中，将 `Get Orchestrator Asset` 活动添加到一个空白流程中。


  2.  在 `资产名称` 字段中，点击 `Plus` 图标，选择 `文本` 选项，然后输入 `DocumentPath`。


  3.  在 `Properties` 面板的 `Orchestrator 文件夹路径` 字段中，点击 `Plus` 图标，选择 `文本` 选项，然后输入 `/`。这指定了我们在父文件夹中查找该资产。


  4.  点击 `保存以备后用` 字段，点击 `Plus` 图标，然后选择 `保存以备后用`。输入 `OrchestratorAssetValue` 作为值名称。


  5.  接下来，在 `Get Orchestrator Asset` 活动之后添加 `Write Line` 活动。


  6.  在 `文本` 字段中，点击 `Plus` 图标，然后悬停在 `使用已保存的值` 上，选择 `OrchestratorAssetValue`。


  完成练习后，**获取 Orchestrator 资产**活动的最终配置应类似于图 3-66。


  ![../images/493649_1_En_3_Chapter/493649_1_En_3_Fig66_HTML.jpg](img/493649_1_En_3_Fig66_HTML.jpg)


  图 3-66


  获取 Orchestrator 资产活动练习的配置


