  \n图 4-15\n\n高亮活动练习的最终配置\n\n### 截取屏幕截图\n\n**截取屏幕截图**活动允许您捕获指定区域的屏幕截图。\n\n提示\n\n对于需要为审计目的提供证据以证明已执行特定操作的任务，`截取屏幕截图`活动是支持此类需求的绝佳方式。\n\
