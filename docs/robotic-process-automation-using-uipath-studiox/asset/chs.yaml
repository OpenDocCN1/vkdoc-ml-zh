  3.  单击 `Indicate Application` 链接，并将鼠标指向您刚刚启动的订单管理系统应用程序。`StudioX` 将自动检测到您正在尝试与桌面应用程序交互，并且还会自动填充
  `Application path`。


  4.  从 `Properties` 面板中，为 `Options` ➤ `Open` 属性选择 `Always` 选项。这将确保每次运行自动化时都会创建一个新的应用程序实例。


