  ### 项目工作区\n\n当您打开现有项目或启动新项目时，将显示项目工作区。项目工作区，如图 2-26 所示，为您提供了开发自动化所需的所有工具。\n\n![../images/493649_1_En_2_Chapter/493649_1_En_2_Fig26_HTML.jpg](img/493649_1_En_2_Fig26_HTML.jpg)\n\
  \n图 2-26\n\nUiPath StudioX 中的项目工作区\n\n\n\n#### 活动面板\n\n理解活动的一个好方法是将它们想象成乐高积木。你可以用不同的方式组装单个积木，来搭建最终的乐高模型。同样地，在\
