  **保存到**：这是活动卡片上的一个必填配置。此配置允许您选择一个现有的值名称或创建一个新的值名称，如图 3-69 所示。此值名称将开始显示在 `Data Manager`
  面板中。要在后续活动中使用此值，请点击 `Plus` 图标并从 `使用已保存的值` 菜单中选择它。


