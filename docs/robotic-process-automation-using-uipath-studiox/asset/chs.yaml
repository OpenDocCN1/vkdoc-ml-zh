  **源代码**：Chapter_5-MailAutomationExercise


  **设置**：以下是分步实施说明：


  ![../images/493649_1_En_5_Chapter/493649_1_En_5_Fig35_HTML.jpg](img/493649_1_En_5_Fig35_HTML.jpg)


  图 5-35


  日历邀请的详细描述


  1.  在 `StudioX` 中，将`发送日历邀请`活动添加到上一个练习中`发送电子邮件`活动之后的`If`活动的`Then`块中。


  2.  在`标题/主题`字段中，单击`加号`图标，选择`文本`选项，然后输入`初步面试与`。


  3.  接下来，在`文本生成器`中，单击`加号`图标，将鼠标悬停在`CurrentMail`上，然后选择`发件人`。单击`保存`。这将在日历邀请的标题中指定面试者。


  4.  在`必需与会者`字段中，单击`加号`图标，然后选择`文本`选项。接下来，在`文本生成器`中，单击`加号`图标，将鼠标悬停在`CurrentMail`上，然后选择`发件人`。


  5.  接下来，在`文本生成器`仍处于打开状态时，输入一个分号（`;`）。Outlook 使用分号来分隔多个收件人。


  6.  接下来，在`文本生成器`中，单击`加号`图标，将鼠标悬停在`笔记本`上，然后选择`在 Excel 中指示`。选择单元格 `D2`，然后单击`确认`按钮。单击`保存`。


  7.  在`开始日期`和`开始时间`字段中，单击`加号`图标，然后选择`运行时询问`。


  8.  通过单击`持续时间`字段中的`加号`图标并在`小时`字段中指定`1`，来延长会议的默认持续时间。


  9.  然后，在`地点`字段中，单击`加号`图标，将鼠标悬停在`笔记本`上，然后选择`在 Excel 中指示`。选择单元格 `E2` 以将招聘经理的个人会议室链接指定为会议地点。单击`确认`。


  10. 单击`描述`字段中的`加号`图标后，选择`文本`选项，然后输入图 5-35 中所示的描述。为`职位名称`和`招聘经理姓名`指示单元格 `A2` 和 `C2`。


  11. 将`提醒`字段更改为`1 小时`。


