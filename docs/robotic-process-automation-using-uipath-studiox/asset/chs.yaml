  任何将要与应用程序交互以开始文件下载的活动都必须添加到**等待下载**活动的主体中。


  **监控的文件夹**：这是活动卡片上的一个必填配置。此配置允许您指定自动化将监控文件下载的文件夹。默认情况下，该值为 `User Folder\Downloads`，即自动化监控您的
  Windows 配置文件或浏览器的默认 `Downloads` 文件夹。


  **已下载的文件**：这是活动卡片上的一个可选配置。此配置允许您存储已下载文件的详细信息以供后续使用。例如，您可以使用文件路径将其复制到另一个文件夹进行处理。


  **超时**：这是 `Properties` 面板中的一个可选配置。此配置允许您指定活动在继续之前等待文件下载完成的时长（以秒为单位）。默认情况下，超时值设置为
  300。对于较大的文件，应增加此值。


  本章中没有针对此活动的练习。我们将在第 4 章的 `Hover` 活动练习中使用 `Wait for Download` 活动。图 3-72 显示了此活动配置后的外观。


