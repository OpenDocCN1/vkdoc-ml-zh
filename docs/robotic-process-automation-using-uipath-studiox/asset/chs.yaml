  \ UI 元素。\n\n**输出到**：这是活动卡片上的一项必需配置。此配置允许您指定屏幕截图是应物理保存为文件，还是仅保存在剪贴板内存中。\n\n**文件名**：这是活动卡片上的一项必需配置。仅当您从`输出到`字段中选择`文件`时，此配置才可用。此配置允许您指定屏幕截图应存储的文件夹位置以及屏幕截图的名称。\n\
