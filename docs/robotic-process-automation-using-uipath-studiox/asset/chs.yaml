  **写入内容**：这是活动卡片上的一项必填配置。此字段标识需要写入的工作表、表格或范围源数据。此字段通常通过使用“在 Excel 中指示”选项选择工作表、范围或表格来配置。或者，也可以指示来自
  Excel 或任何其他兼容源的已保存值。


  **目标位置**：这是活动卡片上的一项必填配置。此字段标识应将“写入内容”数据写入的工作表、表格或范围。此字段通常通过选择已命名的工作表或表格，或使用“在 Excel
  中指示”选项来配置。


  **追加**：这是活动卡片上的一项可选配置。此字段决定写入的数据是否应追加到目标范围。如果选中，数据将从范围内的第一个空单元格开始写入。如果未选中，数据将写入目标范围，覆盖任何现有数据。此选项默认未选中。


  **排除标题**：这是活动卡片上的一项可选配置。此字段决定写入的源数据是否应包含或排除标题。如果选中，则“写入内容”源数据中的标题将不会写入“目标位置”范围。如果未选中，则写入的数据将包含标题。此选项默认未选中。


