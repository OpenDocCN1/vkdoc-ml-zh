- '# 8. CSV 自动化


  CSV 是一种以逗号分隔值的文件，它以单一的表格格式保存数据，使组织能够以压缩格式管理和传输大型数据库。常见的用例包括存储大量客户或产品数据以供整个组织使用，这使得
  CSV 自动化成为以数据为中心的组织的一项关键能力。UiPath StudioX CSV 自动化允许公民开发者使用易于使用的 StudioX 设计器执行关键操作，例如读取、追加和写入
  CSV 文件。


  ## 学习目标


  在本章结束时，你将学习如何


  *   将数据写入 CSV 文件

  *   将数据追加到 CSV 文件

  *   读取 CSV 文件并使用数据


  ## 示例概述


  在本章中，我们将使用员工数据来展示所有 CSV 自动化活动。在此用例中，一家小公司的人力资源团队每天检索新入职员工的数据。然后将这些数据追加并编译到一个员工汇总
  CSV 数据文件中，该文件允许组织维护其员工信息，并保持数据准确且最新以供处理。


  本节将帮助你熟悉本章所有练习的先决条件。


  从本书网站下载源代码，并确保将整个 `BookSamples` 文件夹移动到你的 C 盘。本章所有练习均假定文件夹路径为 **C:\BookSamples\Chapter_08**。图
  8-1 显示了此示例所需的物理文件夹结构。此文件夹结构随源代码一起提供。


