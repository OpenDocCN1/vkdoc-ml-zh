  ### 转发邮件


  **转发邮件**活动允许您将邮件转发给特定收件人。




  #### 配置


  本节提供如何配置**转发邮件**活动的说明，如图 5-18 所示。


  ![../images/493649_1_En_5_Chapter/493649_1_En_5_Fig18_HTML.jpg](img/493649_1_En_5_Fig18_HTML.jpg)


