- '# 6. Word 自动化


  Microsoft Word 是全球组织中最流行、最通用的文字处理程序。Word 通常用于创建法律文档、财务文件、采购文档以及自定义模板和需求文档。UiPath
  StudioX Word 自动化为公民开发者提供了关键任务的自动化能力，例如读取内容、编写文本、添加图像、插入表格、导出为 PDF 以及创建包含表格、签名或徽标等内容的富
  HTML 电子邮件正文。


  ## 学习目标


  在本章结束时，您将学习如何


  *   定义要自动化的 Word 作用域


  *   将文档另存为其他文件


  *   从文档中读取文本


  *   替换文档中所有出现的文本


  *   设置文档书签的文本


  *   基于替代文本替换图片


  *   相对于文本或书签插入数据表


  *   在 Word 文档末尾添加图片


  *   在 Word 文档中追加文本


  *   将 Word 文档导出为 PDF


  ## 示例概述


  在本章中，我们将使用一个简化版的发票生成流程来展示所有 Word 自动化活动的用法。本章讨论的概念可应用于从不同数据源填充信息，以完成模板化的 Word 文档，例如主服务协议、工作说明书、提案请求、处方和服务台工单。


  本节将使您熟悉本章所有练习的先决条件。


  ### Word 设置


