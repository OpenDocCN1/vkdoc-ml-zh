  获取文件信息活动返回的属性


  | 属性 | 描述 |

  | --- | --- |

  | Name | 指定文件的名称（不含文件夹路径） |

  | Full Name | 指定文件的名称（含文件夹路径） |

  | Folder | 包含该文件的文件夹路径 |

  | Extension | 指定文件的扩展名（例如，txt 或 docx） |

  | Created date | 指定文件的创建日期和时间 |

  | Last modified date | 指定文件的最后修改日期和时间 |

  | Last accessed date | 指定文件的最后访问日期和时间 |

  | Size | 文件大小（以字节为单位） |

  | Size in KB | 指定文件夹的大小（以千字节 KB 为单位） |

  | IsReadOnly | 指示文件是否为只读的标志，即无法编辑 |


