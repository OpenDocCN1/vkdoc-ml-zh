  \n图 4-28\n\n添加联系人按钮的目标和定位点\n\n1.  打开您选择的浏览器，在地址栏中输入 [`https://therpabook.com/samples/contactsmanagement/`](https://therpabook.com/samples/contactsmanagement/)。\n\
