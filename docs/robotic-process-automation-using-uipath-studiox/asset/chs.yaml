  ### 查找第一个/最后一个数据行


  **查找第一个/最后一个数据行**活动允许您在工作簿的工作表、表或范围中查找包含数据的第一个和最后一个行号。


  提示


  当需要知道数据的最后一行是什么，以便知道在何处追加或写入数据时，此活动会很有帮助。


  #### 配置


  本节提供如何配置**查找第一个/最后一个数据行**活动的说明，如图 7-39 所示。


  ![../images/493649_1_En_7_Chapter/493649_1_En_7_Fig39_HTML.jpg](img/493649_1_En_7_Fig39_HTML.jpg)


  图 7-39


  查找第一个/最后一个数据行活动卡片


  **源**：这是活动卡片上的一个必填配置。此配置提供包含需要搜索第一个和/或最后一个行号的数据的工作表、范围或表。


  **有标题**：这是活动卡片上的一个可选配置。此配置指示 `源` 的第一行是标题行，不会计入输出。例如，如果范围 A1:B20 中有一个表，并且选中了 `有标题`
  选项，则最后一个数据行计数将为 19。默认情况下，此选项处于选中状态，这意味着在计算输出时不会将第一行计入。如果取消选中，则第一行将与已识别范围中的任何其他行一样被计入。


  **列名**：这是活动卡片上的一个必填配置。此配置指定需要搜索第一个和最后一个数据行的列的名称。通常，此字段通过选择在 `范围` 菜单中填充的列标题名称来配置。


  **将第一个行号保存为**：这是活动卡片上的一个可选配置。此配置指定将源范围中包含数据的第一个行的数字索引存储到何处。通常，此值可以保存到 Excel 单元格中、保存以供以后使用，或复制到剪贴板。


  **将最后一个行号保存为**：这是活动卡片上的一个必填配置。此配置指定将源范围中包含数据的最后一个行的数字索引存储到何处。通常，此值可以保存到 Excel 单元格中、保存以供以后使用，或复制到剪贴板。


  **要跳过的空白行数**：这是通过属性面板中“输入”部分的一个可选配置。此配置指定自动化在确定已达到范围末尾之前应遇到的连续空白行数。此配置默认为 1。


  **第一个行偏移**：这是通过属性面板中“输入”部分的一个可选配置。此配置允许用户添加指定数量的行，以偏移活动输出的第一个包含数据的行。例如，您可以输入数字 5；然后活动将搜索第五个包含数据的行的行号。此配置默认为
  0。


  **最后一个行偏移**：这是通过属性面板中“输入”部分的一个可选配置。此配置允许用户减去指定数量的行，以偏移活动输出的最后一个包含数据的行。例如，您可以输入数字
  5；然后活动将从范围底部向上搜索第五个包含数据的行。此配置默认为 0。


