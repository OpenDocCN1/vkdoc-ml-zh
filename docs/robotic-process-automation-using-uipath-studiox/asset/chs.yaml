  某些活动在完成处理后，会返回数据。例如，`读取文本文件`活动将返回文本文件的内容，或者`获取文本`活动将返回表单字段的内容。每个返回数据的活动都允许您指定如何存储该数据。图
  3-9 显示了数据输出选项的示例菜单。当您单击`加号`图标时，此数据输出选项菜单将变为可用。


