  **追加到的区域之后**：这是活动卡片上的一项必需配置。此配置提供数据将被追加到其后的工作表、区域或表格的位置。


  **要追加的内容**：这是活动卡片上的一项必需配置。此配置提供数据将被追加到其后的工作表、区域或表格的位置。


  **要复制的内容**：这是活动卡片上的一项可选配置。此字段决定在此活动期间如何粘贴数据，例如，选择 `All` 会复制 `What to append` 中所选数据的值、格式和所有公式。此字段默认为
