  **要提取的文件**：这是活动卡片上的一个必填配置。此配置允许您指定要提取的压缩文件 (.zip) 的完整路径。


  **目标文件夹**：这是活动卡片上的一个可选配置。此配置允许您指定希望文件被提取到的目标位置。


  **提取到专用文件夹**：这是活动卡片上的一个可选配置。此配置允许您指定是否要将文件提取到 `目标文件夹` 内的一个专用文件夹中。新文件夹的名称将与压缩文件的名称相同。这有助于确保
  `目标文件夹` 中的同名文件不会被覆盖。


  **提取的内容文件夹**：这是活动卡片上的一个可选配置。此配置允许您保存有关提取文件夹的信息。如果选中了 `提取到专用文件夹` 标志，则保存该文件夹的所有属性；否则，将
  `目标文件夹` 的所有属性保存到 `数据管理器` 中。默认情况下，此选项处于未选中状态。


  **密码**：这是 `属性` 面板上的一个可选配置。如果压缩文件受密码保护，此配置允许您指定密码。


  **跳过不支持的文件**：这是 `属性` 面板上的一个可选配置。此配置允许您跳过无法提取的文件。这有助于避免在 StudioX 无法提取指定文件时可能抛出的任何错误。默认情况下，此值未设置。


