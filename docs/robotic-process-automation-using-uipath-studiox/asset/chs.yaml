  ## 通用属性


  通用属性，如图 3-11 所示，可以从`属性`面板的`通用`部分访问。通用属性可能因活动而异。


  ![../images/493649_1_En_3_Chapter/493649_1_En_3_Fig11_HTML.jpg](img/493649_1_En_3_Fig11_HTML.jpg)


  图 3-11


  活动的通用属性


  表 3-1 提供了每个属性的简要说明。


  表 3-1


  通用属性


  | 属性 | 描述 |

  | --- | --- |

  | 出错时继续 | 此属性允许您指定（true 或 false）自动化是否应继续运行，即，即使所选活动在执行期间遇到错误，也继续执行下一个活动。 |

  | 之后延迟 | 此属性允许您指定（以秒为单位）自动化是否应在完成所选活动之后、开始下一个活动之前等待。默认值为 0.3 秒。 |

  | 之前延迟 | 此属性允许您指定（以秒为单位）自动化是否应在开始所选活动之前等待。默认值为 0.2 秒。 |

  | 显示名称 | 此属性允许您更新设计器面板中选定活动的显示名称。 |

  | 超时 | 此属性允许您指定（以秒为单位）自动化应等待所选活动完成多长时间，如果超时则停止等待。默认值为 30 秒。 |


