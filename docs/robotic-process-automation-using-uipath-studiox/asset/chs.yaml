  **遍历对象**：这是活动卡片上的一个必填配置。此配置允许您指定一个名称，用于在活动卡片内引用每封邮件。默认情况下，该值设置为 `CurrentMail`。


  **从以下位置的邮件中**：这是活动卡片上的一个必填配置。当放置在 `使用桌面版 Outlook 应用`、`使用 Outlook 365` 或 `使用 Gmail`
  活动内部时，指定账户中的文件夹会自动填充为选项。您可以选择希望此活动从中读取邮件的邮件文件夹。


  **限制邮件数量为前**：这是活动卡片上的一个必填配置。此配置允许您指定要从指定文件夹中读取的邮件数量。默认情况下，此值设置为 `100`。


  **仅未读邮件**：这是活动卡片上的一个可选配置。勾选后，仅会遍历未读邮件。默认情况下，此选项未勾选。


  **仅含附件的邮件**：这是活动卡片上的一个可选配置。勾选后，仅会遍历包含附件的邮件。默认情况下，此选项未勾选。


  **其他筛选条件**：这是活动卡片上的一个可选配置。此配置允许您创建额外的邮件筛选条件。如图 5-11 所示，您可以构建条件语句，按特定属性筛选邮件。


