  ### 步骤 3：设置项目笔记本


  此自动化将使用自定义公式来生成文件夹和文件路径。


  我们将配置一个自定义笔记本，用于管理所有自定义公式。图 12-12 展示了包含自动化所用全部公式的自定义笔记本。


  ![../images/493649_1_En_12_Chapter/493649_1_En_12_Fig12_HTML.jpg](img/493649_1_En_12_Fig12_HTML.jpg)


  图 12-12


  笔记本中的自定义公式


  表 12-1 描述了图 12-12 中每个值的用途。


  表 12-1


  暂存区中各值的说明


  | 属性 | 说明 |

  | --- | --- |

  | 当前日期 | 单元格 B2 中的公式将生成 `YYYYMMDD` 格式的当前日期，该日期将被后续行中的所有路径使用。 |

  | 订单号 | 单元格 B3 被其他单元格用于生成发票号和文件路径。当自动化处理每个订单时，此字段将填入当前正在处理的订单号。 |

  | 发票号 | 单元格 B4 中的公式使用单元格 B3 中的数值，并将 `PO` 替换为 `INV` 以生成发票号。 |

  | 订单列表 – 模板路径 | `OrdersList.xlsx` 模板的静态路径。 |

  | 订单详情 – 模板路径 | `OrderDetails.xlsx` 模板的静态路径。 |

  | 发票 – 模板路径 | `InvoiceTemplate.docx` 模板的静态路径。 |

  | 每日处理 – 文件夹路径 | 自动化用于存储每日处理文件夹和文件的文件夹的静态路径。 |

  | 当前日期 – 文件夹路径 | 自动化用于存储当天所有文件的文件夹的动态路径。 |

  | 订单列表 – 文件路径 | `OrdersList.xlsx` 副本将被放置的动态路径。 |

  | 订单详情 – 文件路径 | 当前采购订单的 `OrderDetails.xlsx` 副本将被放置的动态路径。 |

  | 发票 – 文件路径 (DOCX) | 当前发票的 MS Word 副本将被创建到的动态路径。 |

  | 发票 – 文件路径 (PDF) | 当前发票的 PDF 版本将被创建到的动态路径。 |


  以下是配置自定义笔记本的分步说明：


