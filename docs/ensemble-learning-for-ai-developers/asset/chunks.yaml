- fmt: '# Microsoft LightGBM


    `LightGBM` is a fast, distributed, high-performance gradient boosting framework
    based on decision tree algorithms. It is used for ranking, classification, and
    many other machine learning tasks.


    If you follow Kaggle competitions, then you know the power and popularity of boosting.
    `XGBoost`, that started it all, became the standard algorithm for winning Kaggle
    competitions. However, with large data, the training time with `XGBoost` goes
    up drastically. `LightGBM` addresses the problem of scalability and speed, with
    significantly lower memory consumption. It is worthwhile to remember that both
    `XGBoost` and `LightGBM` are specific instances of GBT (gradient boosting), and
    they both implement the same underlying algorithm; however, they each introduce
    various tricks to make training more efficient or to improve performance. It is
    designed to be distributed and efficient with the following advantages.


    - Faster training speed and higher efficiency

    - Lower memory usage

    - Better accuracy

    - Support for parallel and GPU learning

    - Capable of handling large-scale data


    ## Why LightGBM Architecture Is Best


    `XGBoost` and `LightGBM`, being part of the same gradient boosted decision trees
    (GBDT) family, have a similar architecture. Here, we focus on architecture ideas
    that make `LightGBM` train accurate models.


    ### Growing the Tree


    In order to split and train each individual decision tree, there are two strategies
    that can be employed: level-wise and leaf-wise.


    The level-wise strategy maintains a balanced tree. A balanced tree is a tree where
    every leaf is "not more than a certain distance" away from the root than any other
    leaf. Essentially, all the leaf nodes are at the same distance from the root.
    You can see in Figure [5-12](#489264_1_En_5_Chapter.xhtml#Fig12) that the splits
    are ensuring that the tree maintains the balance.


    ![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig12_HTML.jpg](images/489264_1_En_5_Chapter/489264_1_En_5_Fig12_HTML.jpg)


    Figure 5-12


    Level-wise tree split strategy (Source: [`https://mlexplained.com`](https://mlexplained.com))


    The leaf-wise strategy splits the leaf that reduces the loss the most (see Figure
    [5-13](#489264_1_En_5_Chapter.xhtml#Fig13)). This makes the training flexible,
    although susceptible to overfitting. `LightGBM` grows trees leaf-wise. It chooses
    the leaf with maximum delta loss to grow. By holding the number of leaves fixed,
    leaf-wise algorithms tend to achieve a lower loss than level-wise algorithms.
    It is interesting to note that leaf-wise growth was an exclusive feature of `LightGBM`,
    but `XGBoost` has also implemented this growth strategy.


    ![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig13_HTML.jpg](images/489264_1_En_5_Chapter/489264_1_En_5_Fig13_HTML.jpg)


    Figure 5-13


    Leaf-wise tree split strategy (Source: [`https://mlexplained.com`](https://mlexplained.com))


    ### Finding the Best Split


    Finding the best split for each leaf is a key challenge in training GBDT.


    You could use brute force and go through every feature to find the best split,
    but that is neither scalable nor practical.


    Think of a dataset containing millions of documents and a vocabulary size of a
    million words. It would take forever for GBDT to train on the tf-idf matrix. The
    only possible way is to approximate the best split in some way. Let''s look at
    a few strategies for this.


    #### Histogram-based Methods


    Histogram-based methods group features into a set of bins and perform splitting
    on the bins instead of the features. This helps speed up the training and reduce
    the complexity, as the features can be binned before building each tree. Note
    that the features must be sorted in advance for this method to be effective.


    #### Treating Missing Values


    The input to `LightGBM` tends to be sparse given the fact that it is used a lot
    on tabular or text data. One possible option is to ignore the missing value and
    then assign it to any side of the split that reduces the loss. This is what `LightGBM`
    does when the `zero_as_missing` parameter is set to `True`. It regards all zero
    values as missing.


    #### Gradient-based One-Side Sampling


    It is a common observation that not all features play an important role in training.
    Such features have a lower gradient. `LightGBM` concentrates on data points with
    high gradients (i.e., during the best split, it tends to ignore low-gradient features).
    However, this comes with the inherent risk of biased sampling. In order to mitigate
    these problems, `LightGBM` applies two tricks: randomly sample data with smaller
    gradients and importance sampling. This essentially increases the weight of the
    samples with small gradients while computing their contributions to the change
    in loss.


    #### Exclusive Feature Bundling


    Exclusive feature bundling is a technique to leverage the sparsity of the large
    datasets. Given the sparsity, some features are never non-zero together; for example,
    Python and politics have very few chances of coming together in a document. They
    can be "bundled" into a single feature without losing any information. Finding
    the best bundle is an NP-hard problem, and hence, `LightGBM` uses an approximation
    technique that tolerates a certain degree of overlap between the non-zero elements
    within a feature bundle. Going into the details of that approximation does not
    have much value here, but if you are interested, you can read the full paper at
    [`www.microsoft.com/en-us/research/wp-content/uploads/2017/11/lightgbm.pdf`](http://www.microsoft.com/en-us/research/wp-content/uploads/2017/11/lightgbm.pdf).


    Now that you know more about the workings of `LightGBM`, understanding its parameters
    should be easy.


    ## Parameters


    As no surprise, the parameters format is `key1=value1 key2=value2 ....`. It can
    be set both in the config file and the command line. By using the command line,
    parameters should not have spaces before and after `=`. By using config files,
    one line can only contain one parameter. You can use `#` to comment.


    If one parameter appears in both the command line and the config file, `LightGBM`
    will use the parameter from the command line. Rather than listing the parameters
    here, read the documentation at [`https://lightgbm.readthedocs.io/en/latest/Parameters.html`](https://lightgbm.readthedocs.io/en/latest/Parameters.html).'
