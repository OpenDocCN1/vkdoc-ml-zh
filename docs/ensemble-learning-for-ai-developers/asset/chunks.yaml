- fmt: '# Isolation Forest for Outlier Detection


    An `isolation forest` is an efficient algorithm for outlier detection, especially
    in high-dimensional datasets. The algorithm builds a random forest by picking
    a random feature and a random threshold value (between the min and max values)
    to split the dataset. The dataset splitting continues until all instances end
    up isolated from other instances. Outliers are less frequent than regular observations
    and usually have different values. On average (across all the decision trees),
    they tend to get isolated in fewer steps than normal instances. Let’s take a look
    at this visually.


    In Figure [6-3](#489264_1_En_6_Chapter.xhtml#Fig3), the red points denote the
    anomalous points.


    ![../images/489264_1_En_6_Chapter/489264_1_En_6_Fig3_HTML.jpg](images/489264_1_En_6_Chapter/489264_1_En_6_Fig3_HTML.jpg)


    Figure 6-3


    A dummy dataset containing regular and abnormal observations


    As you can see, normal points are clustered, whereas anomalous points are further
    away from other points. Thus, while randomly partitioning the domain space, the
    anomaly is detected in a smaller number of partitions than a normal point. A smaller
    number of partitions indicate a shorter distance from the root node (i.e., fewer
    edges traversed to reach the terminal node from the root node). The number of
    splittings (or partitions) required to isolate a sample is equivalent to the path
    length from the root node to the terminating node.


    Random partitioning produces noticeably shorter paths for anomalies. Hence, when
    a forest of random trees collectively produces shorter path lengths for particular
    samples, they are highly likely to be anomalies. Figures [6-4](#489264_1_En_6_Chapter.xhtml#Fig4)
    and [6-5](#489264_1_En_6_Chapter.xhtml#Fig5) illustrate this point.


    ![../images/489264_1_En_6_Chapter/489264_1_En_6_Fig5_HTML.jpg](images/489264_1_En_6_Chapter/489264_1_En_6_Fig5_HTML.jpg)


    Figure 6-5


    Isolating an anomalous point


    ![../images/489264_1_En_6_Chapter/489264_1_En_6_Fig4_HTML.jpg](images/489264_1_En_6_Chapter/489264_1_En_6_Fig4_HTML.jpg)


    Figure 6-4


    Isolating a normal point


    Whether a point is a normal or an anomalous is indicated by the path length. An
    isolation forest algorithm returns the anomaly score of each sample.


    To interpret the score as a probability, it helps to represent the score between
    0 and 1. For example, if we get an anomaly score of 0.7, then we interpret that
    the point has a probability of 70% to be an anomalous point.


    Now that you have an idea of how isolation forests work, let’s use the implementation
    in code.


    Let’s first import the necessary module. We removed some of the imports for brevity.


    ```

    from sklearn.ensemble import IsolationForest

    rng = np.random.RandomState(42)

    ```


    Let’s generate the data. Regular novel observations for train and test are generated
    from a standard normal distribution, whereas the outliers are generated from uniform
    distribution.


    ```

    # Train data

    X = 0.3 ∗ rng.randn(100, 2)

    X_train = np.r_[X + 2, X - 2]

    # Regular novel observations

    X = 0.3 ∗ rng.randn(20, 2)

    X_test = np.r_[X + 2, X - 2]

    # Abnormal novel observations

    X_outliers = rng.uniform(low=-4, high=4, size=(20, 2))

    ```


    It is time to initialize and fit the isolation forest.


    ```

    clf = IsolationForest(max_samples=100, random_state=rng)

    clf.fit(X_train)

    ```


    With the model trained, it’s time to generate the predictions.


    ```

    y_pred_train = clf.predict(X_train)

    y_pred_test = clf.predict(X_test)

    y_pred_outliers = clf.predict(X_outliers)

    ```


    Let’s plot and visualize (see Figure [6-6](#489264_1_En_6_Chapter.xhtml#Fig6))
    the predictions of the isolation forest.


    ![../images/489264_1_En_6_Chapter/489264_1_En_6_Fig6_HTML.jpg](images/489264_1_En_6_Chapter/489264_1_En_6_Fig6_HTML.jpg)


    Figure 6-6


    Isolation forest predictions


    ```

    xx, yy = np.meshgrid(np.linspace(-5, 5, 50), np.linspace(-5, 5, 50))

    Z = clf.decision_function(np.c_[xx.ravel(), yy.ravel()])

    Z = Z.reshape(xx.shape)

    plt.title("IsolationForest")

    plt.contourf(xx, yy, Z, cmap=plt.cm.Blues_r)

    b1 = plt.scatter(X_train[:, 0], X_train[:, 1], c="white",

    s=20, edgecolor="k")

    b2 = plt.scatter(X_test[:, 0], X_test[:, 1], c="green",

    s=20, edgecolor="k")

    c = plt.scatter(X_outliers[:, 0], X_outliers[:, 1], c="red",

    s=20, edgecolor="k")

    plt.axis(''tight'')

    plt.xlim((-5, 5))

    plt.ylim((-5, 5))

    plt.legend([b1, b2, c],

    ["training observations",

    "new regular observations", "new abnormal observations"],

    loc="upper left")

    plt.show()

    ```


    An isolation forest is quite unique when compared with other outlier detection
    algorithms. It introduces the use of isolation as a more effective and efficient
    means to detect anomalies than the commonly used basic distance and density measures.
    It builds a good performing model with a small number of trees using small subsamples
    of fixed size, regardless of the size of a dataset.


    # Scaling Ensembles with Dask


    There are two distinct scaling problems that you might face while ensembling.
    The scaling strategy depends on which problem you’re facing.


    * **Large models**: Although the data fits in RAM, you may have a large ensemble
    of many models.


    * **Large datasets**: The data is larger than the RAM, and sampling isn’t an option.


    Dask can help scale ensembles.


    * For large models, use `dask_ml.joblib` and your favorite scikit-learn estimator.


    * For large datasets, use `dask_ml` estimators.


    To scale an ensemble pipeline, you need to think beyond large models and datasets.
    Recall the pipeline and grid search. Dask has modules for preprocessing and parameter
    space search.'
