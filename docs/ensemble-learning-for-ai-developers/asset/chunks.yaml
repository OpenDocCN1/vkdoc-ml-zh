- fmt: '### Hard Voting


    Let’s first look at one of the most popular ensemble learning techniques: voting
    ensembles. Voting ensembles train different machine learning models. Take a look
    at Figure [3-1](#489264_1_En_3_Chapter.xhtml#Fig1) again, in which the same data
    is trained on three different machine learning models—logistic regression, support
    vector machine (SVM), and random forest. The output of these three models is combined
    to get an ensemble prediction. The first question from any practitioner is how
    to actually combine the results of these models. One of the simplest answers is
    to take inspiration from one of the oldest tried and tested techniques: voting.
    Just as voting is done to elect our leaders, where the majority vote of a diverse
    set of people selects the official, we conduct an election using different machine
    learning models. If it is a classification problem, each ML model votes for a
    particular category. In majority voting, the class that earns the most votes is
    the preferred class. It is widely observed that the resulting class often has
    higher accuracy than any single model.


    The dataset in Listing [3-1](#489264_1_En_3_Chapter.xhtml#PC1) is trained using
    three machine learning models: k-nearest neighbors (KNN), random forest, and logistic
    regression using the scikit-learn Python library. Their output is then combined
    using a `VotingClassifier` implemented in the scikit-learn library. If you measure
    the resultant accuracy of each of the individual models, as well as the combined
    model on the test dataset, you get a very good boost in accuracy. We encourage
    you to run the code as an exercise and check the accuracy of the individual models
    and the combined models.


    A major helper function that you can use for this is the `VotingClassifier` class
    from the `sklearn.ensemble` package of the scikit-learn library.


    ```

    from sklearn.model_selection import train_test_split

    from sklearn.model_selection import GridSearchCV

    from sklearn.datasets import load_breast_cancer

    import numpy as np

    X, y = load_breast_cancer(return_X_y=True)

    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.3, stratify=y,
    random_state=123)

    ### k-Nearest Neighbors (k-NN)

    from sklearn.neighbors import KNeighborsClassifier

    knn = KNeighborsClassifier()

    params_knn = {''n_neighbors'': np.arange(1, 25)}

    knn_gs = GridSearchCV(knn, params_knn, cv=5)

    knn_gs.fit(X_train, y_train)

    knn_best = knn_gs.best_estimator_

    ### Random Forest Classifier

    from sklearn.ensemble import RandomForestClassifier

    rf = RandomForestClassifier(random_state=0)

    params_rf = {''n_estimators'': [50, 100, 200]}

    rf_gs = GridSearchCV(rf, params_rf, cv=5)

    rf_gs.fit(X_train, y_train)

    rf_best = rf_gs.best_estimator_

    ### Logistic Regression

    from sklearn.linear_model import LogisticRegression

    log_reg = LogisticRegression(random_state=123, solver="liblinear", penalty="l2",
    max_iter=5000)

    C = np.logspace(1, 4, 10)

    params_lr = dict(C=C)

    lr_gs = GridSearchCV(log_reg, params_lr, cv=5, verbose=0)

    lr_gs.fit(X_train, y_train)

    lr_best = lr_gs.best_estimator_

    # combine all three Voting Ensembles

    from sklearn.ensemble import VotingClassifier

    estimators=[(''knn'', knn_best), (''rf'', rf_best), (''log_reg'', lr_best)]

    ensemble = VotingClassifier(estimators, voting="soft")

    ensemble.fit(X_train, y_train)

    print("knn_gs.score: ", knn_best.score(X_test, y_test))

    # Output: knn_gs.score:  0.9239766081871345

    print("rf_gs.score: ", rf_best.score(X_test, y_test))

    # Output: rf_gs.score:  0.9766081871345029

    print("log_reg.score: ", lr_best.score(X_test, y_test))

    # Output: log_reg.score:  0.9590643274853801

    print("ensemble.score: ", ensemble.score(X_test, y_test))

    # Output: ensemble.score:  0.9649122807017544

    Listing 3-1

    Max Voting Ensemble

    ```


    ### Averaging/Soft Voting


    Averaging is another way to combine the output of different classifiers. The major
    difference between voting and averaging is that in averaging, we take the prediction
    probability of each class separately from the model and then combine the resulting
    probabilities by taking the average of these predictions. This combination method
    is called **soft voting**.


    In Listing [3-2](#489264_1_En_3_Chapter.xhtml#PC2), the initial steps to train
    different models are the same, but instead of using the `VotingClassifier`, we
    do inference of our model on our test dataset, take out the prediction probabilities
    of each class, and then take out the average of all the probabilities as a resultant
    class probability on the test dataset.


    Note that we have assigned equal weight to all the models when calculating the
    average output. If we think a particular model is more important than the other
    models, however, we can increase the weight of that particular model and decrease
    the weight of all the other models. This approach is called **weighted averaging**.


    ```

    from sklearn.model_selection import train_test_split

    from sklearn.model_selection import GridSearchCV

    from sklearn.datasets import load_breast_cancer

    import numpy as np

    X, y = load_breast_cancer(return_X_y=True)

    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.3, stratify=y,
    random_state=0)

    ### k-Nearest Neighbors (k-NN)

    from sklearn.neighbors import KNeighborsClassifier

    knn = KNeighborsClassifier()

    params_knn = {''n_neighbors'': np.arange(1, 25)}

    knn_gs = GridSearchCV(knn, params_knn, cv=5)

    knn_gs.fit(X_train, y_train)

    knn_best = knn_gs.best_estimator_

    knn_gs_predictions = knn_gs.predict(X_test)

    ### Random Forest Classifier

    from sklearn.ensemble import RandomForestClassifier

    rf = RandomForestClassifier(random_state=0)

    params_rf = {''n_estimators'': [50, 100, 200]}

    rf_gs = GridSearchCV(rf, params_rf, cv=5)

    rf_gs.fit(X_train, y_train)

    rf_best = rf_gs.best_estimator_

    rf_gs_predictions = rf_gs.predict(X_test)

    ### Logistic Regression

    from sklearn.linear_model import LogisticRegression

    log_reg = LogisticRegression(random_state=123, solver="liblinear", penalty="l2",
    max_iter=5000)

    C = np.logspace(1, 4, 10)

    params_lr = dict(C=C)

    lr_gs = GridSearchCV(log_reg, params_lr, cv=5, verbose=0)

    lr_gs.fit(X_train, y_train)

    lr_best = lr_gs.best_estimator_

    log_reg_predictions = lr_gs.predict(X_test)

    # combine all three by averaging the Ensembles results

    average_prediction = (log_reg_predictions + knn_gs_predictions + rf_gs_predictions)/3.0

    # Alternatively combine all through using VotingClassifier with voting="soft"
    parameter

    # combine all three Voting Ensembles

    from sklearn.ensemble import VotingClassifier

    estimators=[(''knn'', knn_best), (''rf'', rf_best), (''log_reg'', lr_best)]

    ensemble = VotingClassifier(estimators, voting="soft")

    ensemble.fit(X_train, y_train)

    print("knn_gs.score: ", knn_gs.score(X_test, y_test))

    # Output: knn_gs.score:  0.9239766081871345

    print("rf_gs.score: ", rf_gs.score(X_test, y_test))

    # Output: rf_gs.score:  0.9532163742690059

    print("log_reg.score: ", lr_gs.score(X_test, y_test))

    # Output: log_reg.score:  0.9415204678362573

    print("ensemble.score: ", ensemble.score(X_test, y_test))

    # Output: ensemble.score:  0.9473684210526315

    Listing 3-2

    Averaging

    ```


    Apart from calculating predicted probability manually, if you want straightforward
    results using averaging you can again use the `VotingClassifier` class from `sklearn.ensemble`
    package. But instead of passing on the `voting=''hard''` parameter, use the `voting=''soft''`
    parameter.'
