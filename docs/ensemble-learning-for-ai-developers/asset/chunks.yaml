    Lastly, we would like to thank the open source community, who has helped democratize
    the knowledge. All the libraries used in this book come from open source projects.


    ## About the Authors About the Technical Reviewer


    # 1. Why Ensemble Techniques Are Needed


    According to the Cambridge dictionary, an **ensemble** is defined as a group of
    **things** or people acting or taken together as a whole. The word **ensemble**
    was first used in the context of musicians who regularly play together. An ensemble
    of musicians is the sum of individual compositions by multiple musicians. Similarly,
    in machine learning, **ensemble learning** is a combination of multiple machine
    learning techniques performed together.


    Ensemble learning is fast becoming a go-to standard for getting an accuracy boost
    in machine learning models in data science. Ensemble methods do this through combining
    the output of machine learning models in many interesting ways; just like an ensemble
    of musicians combine their individual performances in multiple different ways
    to achieve a great composition.


    Your role as a data scientist is to become a concertmaster or architect who can
    leverage the strength of individual machine learning (ML) models and combine them
    in interesting ways to achieve the ML equivalent of a great composition (i.e.,
    a world-class machine learning model).


    Let’s look at another analogy to build a better understanding of the benefit of
    ensemble methods. Let’s suppose that you want to invest in the stock market. You
    are interested in a particular stock, but you are not sure about its future outlook,
    and so you decide to seek advice. You reach out to a financial advisor who has
    a 75% accuracy in making the right predictions. You decide to check with other
    financial advisors, who give you similar advice. In a case where each of the advisors
    suggest that you to buy the stock, what is the accuracy rate of this collective
    advice?


    More often than not, the collective advice of multiple experts beats the accuracy
    of any one advisor, especially in varied financial situations. Similarly, in machine
    learning, ensemble methods from multiple machine learning models tend to have
    a better generalized performance than any single machine learning model, especially
    in varied conditions/cases or in the long run.


    In this book, we take you through ways to combine the output of multiple machine
    learning models under the umbrella of ensemble learning.


    Ensemble learning techniques can be further divided under a broad umbrella of
    three classes: **mixing training data**, **mixing combinations,** and **mixing
    models**. We will briefly try to build your understanding of each class.'
