    ## Introduction


    Ensemble learning is fast becoming a popular choice for machine learning models
    in the data science world. Ensemble methods combine the output of machine learning
    models in many interesting ways. Even after years of working on machine learning
    projects, we were unaware of the power of ensemble methods, as this topic is usually
    neglected or only given a brief overview in most machine learning courses and
    books. Like many others, we came to know about the power of ensemble methods by
    checking competitive machine learning scenarios. Competitive machine learning
    platforms, like Kaggle, offer an unbiased review of machine learning techniques.
    For the past few years, ensemble learning methods have consistently outperformed
    competitive metrics. This itself speaks to the benefit of learning ensembling
    techniques. The objective of this book is to help you learn ensembles and apply
    them effectively in real-world situations.


    This book starts by explaining why ensemble learning techniques are needed. The
    objective of Chapter [1](#489264_1_En_1_Chapter.xhtml) is to build a basic understanding
    of various ensembling techniques. Chapters [2](#489264_1_En_2_Chapter.xhtml),
    [3](#489264_1_En_3_Chapter.xhtml), and [4](#489264_1_En_4_Chapter.xhtml), cover
    various ensemble techniques and are grouped by how we mix training data, models,
    and combinations. In these chapters, you learn about some of the most important
    ensemble learning techniques like random forests, bagging, bootstrap aggregating,
    stacking, and cross validation methods.


    Chapter [5](#489264_1_En_5_Chapter.xhtml) covers ensemble learning libraries.
    The libraries help you accelerate your experimentation and implementation. Chapter
    [6](#489264_1_En_6_Chapter.xhtml) covers techniques for integrating ensembles
    into real-world machine learning workflows.


    This book presents a condensed, easy-to-understand way to learn and apply ensemble
    learning concepts in real-world use-cases, which otherwise takes a lot of back
    and forth learning for a budding data scientist. The code in this book (Python
    scripts) can be used as an extension to your projects or for reference.


