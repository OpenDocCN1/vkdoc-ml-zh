    ## XGBoost


    XGBoost 是一种先进的算法和软件系统，专门研究残差梯度提升技术。它通过添加以下参数（我们不会详细展开）来改进普通的梯度提升技术。


    *   它动态确定用作弱学习器的决策树的深度，并添加惩罚参数以防止树过深。这可以防止过拟合并提升性能。


    *   它对树上的叶节点使用比例收缩。


    *   它使用[牛顿树提升](https://en.wikipedia.org/wiki/Newton%2527s_method_in_optimization)来优化学习树结构。


    *   它添加随机化参数以实现最优学习。


