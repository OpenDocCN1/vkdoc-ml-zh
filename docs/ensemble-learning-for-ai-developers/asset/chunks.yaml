    ### Dask-ML


    如果将 Dask 与 scikit-learn 结合，会得到什么？你将获得一个可扩展的机器学习算法。


    但 scikit-learn 不是已经支持并行计算了吗？是的，但 scikit-learn 仅通过 Joblib 在单机上提供并行计算。让我们使用 LogisticRegression
    构建一个分类器（见代码清单 5-6）。我们将使用 `make_classification` 数据集，该数据集会生成一个随机的 *n* 分类问题。


    ```

    from dask_glm.datasets import make_classification

    from dask_ml.linear_model import LogisticRegression

    from dask_ml.model_selection import train_test_split

    X, y = make_classification()

    X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=42)

    lr = LogisticRegression()

    lr.fit(X_train, y_train)

    lr.predict(X_test)

    代码清单 5-6

    使用 Dask 在单机上运行 LogisticRegression

    ```


    如果发现这段代码与标准的 scikit-learn 代码毫无区别，请不要惊讶。它使用了 Joblib，后者原生支持基于线程和进程的并行计算。在 scikit-learn
    的常规使用中，`n_jobs=` 参数正是由 Joblib 提供支持的。从图形上看，该过程如图 5-9 所示。


    ![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig9_HTML.jpg](img/489264_1_En_5_Fig9_HTML.jpg)


    图 5-9


    Dask 在单机上使用 Joblib 进行基于线程和进程的处理


    注意


    请查阅文档以了解如何安装 dask_ml。


    Dask 可以将这种并行计算扩展到集群中的多台机器上。这对于中等规模的数据集效果良好，但对于大型计算任务（例如随机森林、超参数优化等）也同样适用。在查看代码之前，图
    5-10 展示了分布式计算的样子。


    ![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig10_HTML.jpg](img/489264_1_En_5_Fig10_HTML.jpg)


    图 5-10


    Dask 在集群环境中的并行执行


    在这里，Dask 通过 Joblib 与 scikit-learn 通信，从而利用集群来训练模型。让我们通过代码清单 5-7 中的代码来了解实际运行情况。


    ```

    from dask_ml.model_selection import GridSearchCV

    parameters = {''penalty'': [''l1'', ''l2''], ''C'': [0.5, 1, 2]}

    lr = LogisticRegression()

    est = GridSearchCV(lr, param_grid=parameters)

    est.fit(X_train,y_train)

    代码清单 5-7

    通过 Dask 进行网格搜索和 LogisticRegression

    ```


    到目前为止，一切都很熟悉。我们使用网格搜索来寻找 LogisticRegression 参数的最佳值：惩罚项和系数 C。数据集与我们在代码清单 5-6 中使用的相同。现在，我们希望将训练切换到集群上。


    ```

    from dask_ml.model_selection import GridSearchCV

    parameters = {''penalty'': [''l1'', ''l2''], ''C'': [0.5, 1, 2]}

    lr = LogisticRegression()

    est = GridSearchCV(lr, param_grid=parameters)

    import joblib #--1

    from dask.distributed import Client #--2

    client = Client() #--3

    with joblib.parallel_backend(''dask''): #--4

    est.fit(X_train, y_train) #--5

    代码清单 5-8

    通过 Dask 在集群上进行训练

    ```


    让我们来解析这段代码。请注意，scikit-learn 的网格搜索代码没有变化，并且我们使用的是与代码清单 5-6 中相同的数据。


    1.  我们导入 Joblib 库。回想一下，Joblib 在本地机器的不同线程或进程上运行 scikit-learn 函数。我们导入它是为了注册新的后端，这里就是
    Dask。这本质上是从图 5-9 切换到图 5-10。


    2.  我们从 Dask 的 `dask.distributed` 中导入 **Client**，用于连接到 Dask 集群。


    3.  我们初始化客户端以连接到 Dask 集群。但是我们什么时候启动的集群呢？当客户端不带参数初始化时，集群会在本地运行。要在本地运行集群，我们只需初始化不带任何参数的
    **Client** 即可。


    4.  在 `joblib.parallel_backend` 上下文中，我们指定使用 Dask 后端或集群进行训练。


    5.  现在，估计器是在集群上拟合，而不是在线程或进程上。


    该集群可以在使用 Docker 或 Kubernetes 的云环境中运行。请查阅有关在云机器上设置集群的文档。


    ### 扩展 XGBoost


    你在之前的章节中已经了解了 XGBoost。在这里，你将学习如何使用 Dask 和 XGBoost 并行训练梯度提升树。回想一下，XGBoost 代表 eXtreme
    Gradient Boosting（极端梯度提升），顾名思义，它是梯度提升的一种实现。梯度提升方法试图拟合一个新的预测器来修正前一个预测器产生的*残差*。


    **dask-xgboost** 项目非常小巧且简单（约 200 行代码）。与拥有调度器和工作节点的 Dask 集群类似，Dask 会在运行 Dask 调度器的同一进程中启动一个
    XGBoost 调度器，并在每个 Dask 工作节点中启动一个 XGBoost 工作节点。它们共享相同的物理进程和内存空间。Dask 的设计就是为了支持这种情况，因此它才能如此无缝地工作。在训练期间，Dask
    工作节点将所有 Pandas 数据框（构成 Dask 数据框的组成部分）提供给本地的 XGBoost，并让 XGBoost 自行处理。需要重点注意和记住的是，Dask
    并不驱动 XGBoost；它只是进行设置、提供数据，然后让 XGBoost 在后台完成其工作。


    Dask 和 XGBoost 可以相互共享数据，并且可以相互监控，因为它们可以存在于同一个 Python 进程中。这与 NumPy 和 Pandas 在单个进程内协同工作的方式非常相似。如果你希望轻松使用多个专门服务并避免大型单体框架，那么在多个系统之间共享分布式进程会非常有益。现在，让我们看看如何在代码中使用
    XGBoost 与 Dask（见代码清单 5-9）。


    ![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig11_HTML.jpg](img/489264_1_En_5_Fig11_HTML.jpg)


    图 5-11


    特征重要性得分图


    ```

    from dask.distributed import Client

    client = Client() # --1

    #准备虚拟数据集

    from dask_ml.datasets import make_classification

    X, y = make_classification(n_samples=100000, n_features=20,

    chunks=1000, n_informative=4,

    random_state=0) #--2

    #分割训练集和测试集

    from dask_ml.model_selection import train_test_split

    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.15) #--3

    #训练 Dask-XGBoost

    import xgboost

    import dask_xgboost

    params = {''objective'': ''binary:logistic'',

    ''max_depth'': 4, ''eta'': 0.01, ''subsample'': 0.5,

    ''min_child_weight'': 0.5} #--4

    bst = dask_xgboost.train(client, params, X_train, y_train, num_boost_round=10)
    #--5

    #绘制特征重要性

    %matplotlib inline

    import matplotlib.pyplot as plt

    ax = xgboost.plot_importance(bst, height=0.8, max_num_features=9)

    ax.grid(False, axis="y")

    ax.set_title(''估计的特征重要性'')

    plt.show()

    #结果

    代码清单 5-9

    通过 Dask 扩展 XGBoost

    ```


    让我们来解析这里的代码。


    1.  初始化客户端。你已经知道 Dask 集群将是本地的。你可以检查 `cluster` 的值来查看集群详情。


    2.  使用 `make_classification` 函数生成一个随机的玩具数据集。我们之前也使用过这个函数。


    3.  将数据集分割为训练数据和测试数据，以便通过确保公平测试来辅助评估。


    4.  指定 XGBoost 参数。


    5.  调用 `train` 方法来拟合模型。`dask-xgboost` 是 XGBoost 的一个小型封装。Dask 设置好 XGBoost，将数据提供给
    XGBoost，然后让 XGBoost 利用所有 Dask 工作节点在后台进行训练。`bst` 对象是一个常规的 `xgboost.Booster` 对象，这意味着
    XGBoost 的所有方法在这里都可用。


    6.  使用 `xgboost.plot_importance` 方法绘制特征重要性。

