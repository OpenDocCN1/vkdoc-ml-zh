- fmt: '# Stratified *k*-Fold Cross-Validation


    Stratified *k*-fold cross-validation is another subvariant of *k*-fold cross-validation.
    Like *k*-fold validation, you divide a dataset into different sample sets, and
    rotate testing and training the sets *k* times for uniform cross-validation. But
    there is a twist with the initial sampling. In the stratified *k*-fold cross-validation
    technique, you make sure that each of the initial *k* samples have a data distribution
    such that each of the divided samples has a distribution similar to the overall
    dataset.


    Figure [2-8](#489264_1_En_2_Chapter.xhtml#Fig8) shows 100 randomly generated input
    data points. Three classes are split unevenly across the data points, and 10 “groups”
    are split evenly across the data points. In other words, let’s say in your overall
    dataset there are three classes: class A, class B, and class C. Each of these
    classes has samples in proportions of 30%, 50%, and 20%, respectively. In a stratified
    *k*-fold cross-validation technique, you have to ensure that if you divide this
    dataset in *k* = 5 folds, then each of the five folds have similar 30%, 50%, and
    20% of samples from class A, class B, and class C, respectively.


    ![../images/489264_1_En_2_Chapter/489264_1_En_2_Fig8_HTML.jpg](images/489264_1_En_2_Chapter/489264_1_En_2_Fig8_HTML.jpg)


    Figure 2-8


    Stratified *k*-fold cross-validation (Source: [`https://scikit-learn.org/stable/auto_examples/model_selection/plot_cv_indices.html#sphx-glr-auto-examples-model-selection-plot-cv-indices-py`](https://scikit-learn.org/stable/auto_examples/model_selection/plot_cv_indices.html%2523sphx-glr-auto-examples-model-selection-plot-cv-indices-py))


    Listing [2-8](#489264_1_En_2_Chapter.xhtml#PC8) is Python sample code on how to
    apply a stratified *k*-fold cross-validation technique using `scikit-learn`.


    ```

    import numpy as np

    from sklearn.model_selection import StratifiedKFold

    X = np.array([[1, 2], [3, 4], [1, 2], [3, 4]])

    y = np.array([0, 0, 1, 1])

    skf = StratifiedKFold(n_splits=2)

    skf.get_n_splits(X, y)

    print(skf)

    # Output:

    # StratifiedKFold(n_splits=2, random_state=None, shuffle=False)

    for train_index, test_index in skf.split(X, y):

    print("TRAIN:", train_index, "TEST:", test_index)

    X_train, X_test = X[train_index], X[test_index]

    y_train, y_test = y[train_index], y[test_index]

    # Output:

    # TRAIN: [1 3] TEST: [0 2]

    # TRAIN: [0 2] TEST: [1 3]

    Listing 2-8

    Stratified k-Fold Cross-Validation

    ```


