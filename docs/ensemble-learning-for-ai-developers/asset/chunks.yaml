    ## 分层*k*折交叉验证


    分层*k*折交叉验证是*k*折交叉验证的另一种子类型。与*k*折验证类似，你将数据集划分为不同的样本集，并轮流将各集合作为测试集和训练集进行*k*次旋转，以实现统一的交叉验证。但初始采样方式有所不同。在分层*k*折交叉验证技术中，你需要确保初始的*k*个样本各自的数据分布，使得每个划分出的样本集都具有与整体数据集相似的分布。


    图 2-8 展示了 100 个随机生成的输入数据点。三个类别在数据点中分布不均，而 10 个“组”则均匀分布在数据点上。换句话说，假设你的整体数据集中有三个类别：类别
    A、类别 B 和类别 C。每个类别的样本比例分别为 30%、50%和 20%。在分层*k*折交叉验证技术中，你必须确保：如果将这个数据集划分为*k* = 5
    折，那么这五折中的每一折都分别包含来自类别 A、类别 B 和类别 C 的样本，且比例也分别为 30%、50%和 20%。


