    *   装袋法，即使用有放回采样的自助聚合技术

    *   交叉验证技术，即*k*折交叉验证和分层*k*折交叉验证

    *   通过 scikit-learn 中的代码示例应用这些技术解决问题


    # 3. 混合模型


    在第二章中，你学习了如何以不同方式划分和混合训练数据来构建集成模型，这些模型的表现优于在未划分数据集上训练的单个模型。


    在本章中，你将学习不同的组装方法。与混合训练数据的方法不同，**混合模型**方法在多个不同的机器学习模型上使用相同的数据集，然后以不同方式组合其结果，以获得性能更优的模型。


    首先，让我们看看本章的目标。


    *   介绍并解释基于集成的混合模型

    *   介绍投票集成

    *   通过代码示例介绍并解释软投票和硬投票集成

    *   学习超参数调优集成

    *   研究随机森林超参数调优的示例实现

    *   学习水平投票集成

    *   研究在 CIFAR 数据集上使用 scikit-learn 和 Keras 实现水平投票集成的示例

    *   介绍与循环学习率结合使用的快照集成技术


    在本章中，你将不再依赖单一模型，而是将同一个数据集用于多个不同的机器学习模型进行训练（见图 3-1），然后使用不同技术组合这些模型的结果。首先，你将学习如何以投票和平均的形式组合不同训练模型的输出。接着，你将了解**超参数调优集成**，学习如何使用同一模型但采用不同的超参数设置进行训练，然后组合其结果以获得更好的模型。最后，你将学习相对不太为人所知的**水平投票集成**和**快照集成**技术，这些技术因其潜力而在机器学习社区中逐渐站稳脚跟。


