  trans: '

    ## 用于异常检测的孤立森林


    **孤立森林**是一种高效的异常检测算法，尤其适用于高维数据集。该算法通过随机选取一个特征和一个随机阈值（介于最小值和最大值之间）来分割数据集，从而构建一棵随机森林。数据集的分割过程会持续进行，直到所有实例都与其他实例相互隔离。异常值比正常观测值更少见，并且通常具有不同的数值。平均而言（在所有决策树中），异常值往往比正常实例在更少的步骤中被隔离。让我们通过可视化来理解这一点。


    在图 6-3 中，红点表示异常点。


    ![../images/489264_1_En_6_Chapter/489264_1_En_6_Fig3_HTML.jpg](img/489264_1_En_6_Fig3_HTML.jpg)


    图 6-3


    一个包含常规观测值和异常观测值的虚拟数据集


    如您所见，正常点聚集在一起，而异常点则远离其他点。因此，在随机划分域空间时，异常点比正常点能在更少的分区中被检测到。更少的分区意味着距离根节点更短（即从根节点到终端节点所经过的边更少）。隔离一个样本所需的分割（或分区）次数，等同于从根节点到终止节点的路径长度。


    随机划分会为异常值产生明显更短的路径。因此，当一组随机树对特定样本共同产生较短的路径长度时，这些样本极有可能是异常值。图 6-4 和图 6-5 说明了这一点。


    ![../images/489264_1_En_6_Chapter/489264_1_En_6_Fig5_HTML.jpg](img/489264_1_En_6_Fig5_HTML.jpg)


    图 6-5


    隔离一个异常点


    ![../images/489264_1_En_6_Chapter/489264_1_En_6_Fig4_HTML.jpg](img/489264_1_En_6_Fig4_HTML.jpg)


    图 6-4


    隔离一个正常点


    一个点是正常点还是异常点，由路径长度指示。孤立森林算法会返回每个样本的异常得分。


    为了将得分解释为概率，最好将得分表示在 0 到 1 之间。例如，如果我们得到异常得分为 0.7，那么我们可以解释为该点有 70% 的概率是异常点。


    现在您已经了解了孤立森林的工作原理，让我们在代码中实现它。


    首先导入必要的模块。为简洁起见，我们省略了一些导入语句。


    ```

    from sklearn.ensemble import IsolationForest

    rng = np.random.RandomState(42)

    ```


    让我们生成数据。用于训练和测试的常规新观测值从标准正态分布中生成，而异常值则从均匀分布中生成。


    ```

    # 训练数据

    X = 0.3 ∗ rng.randn(100, 2)

    X_train = np.r_[X + 2, X - 2]

    # 常规新观测值

    X = 0.3 ∗ rng.randn(20, 2)

    X_test = np.r_[X + 2, X - 2]

    # 异常新观测值

    X_outliers = rng.uniform(low=-4, high=4, size=(20, 2))

    ```


    现在是初始化并拟合孤立森林的时候了。


    ```

    clf = IsolationForest(max_samples=100, random_state=rng)

    clf.fit(X_train)

    ```


    模型训练完成后，就可以生成预测结果了。


    ```

    y_pred_train = clf.predict(X_train)

    y_pred_test = clf.predict(X_test)

    y_pred_outliers = clf.predict(X_outliers)

    ```


    让我们绘制并可视化（见图 6-6）孤立森林的预测结果。


    ![../images/489264_1_En_6_Chapter/489264_1_En_6_Fig6_HTML.jpg](img/489264_1_En_6_Fig6_HTML.jpg)


    图 6-6


    孤立森林预测结果


    ```

    xx, yy = np.meshgrid(np.linspace(-5, 5, 50), np.linspace(-5, 5, 50))

    Z = clf.decision_function(np.c_[xx.ravel(), yy.ravel()])

    Z = Z.reshape(xx.shape)

    plt.title("IsolationForest")

    plt.contourf(xx, yy, Z, cmap=plt.cm.Blues_r)

    b1 = plt.scatter(X_train[:, 0], X_train[:, 1], c="white",

    s=20, edgecolor="k")

    b2 = plt.scatter(X_test[:, 0], X_test[:, 1], c="green",

    s=20, edgecolor="k")

    c = plt.scatter(X_outliers[:, 0], X_outliers[:, 1], c="red",

    s=20, edgecolor="k")

    plt.axis(''tight'')

    plt.xlim((-5, 5))

    plt.ylim((-5, 5))

    plt.legend([b1, b2, c],

    ["训练观测值",

    "新的常规观测值", "新的异常观测值"],

    loc="upper left")

    plt.show()

    ```


    与其他异常检测算法相比，孤立森林相当独特。它引入了隔离的概念，作为一种比常用的基本距离和密度度量更有效、更高效的异常检测手段。无论数据集大小如何，它都能使用固定大小的小子样本，通过少量树构建出性能良好的模型。


    ## 使用 Dask 扩展集成


    在集成过程中，您可能会遇到两种不同的扩展问题。扩展策略取决于您面临的具体问题。


    *   **大型模型**：虽然数据可以放入内存，但您可能拥有一个包含许多模型的大型集成。


    *   **大型数据集**：数据量大于内存容量，并且无法进行采样。


    Dask 可以帮助扩展集成。


    *   对于大型模型，请使用 `dask_ml.joblib` 和您最喜欢的 scikit-learn 估计器。


    *   对于大型数据集，请使用 `dask_ml` 估计器。


    要扩展集成管道，您需要考虑的不仅仅是大型模型和数据集。回想一下管道和网格搜索。Dask 提供了用于预处理和参数空间搜索的模块。

    '
- fmt: '### Preprocessing


    `dask_ml.preprocessing` contains some scikit-learn style transformers that can
    be used in pipelines to perform various data transformations as part of the model
    fitting process. These transformers work well on Dask collections (`dask.array`,
    `dask.dataframe`), NumPy arrays, or Pandas dataframes. Again, to reiterate, why
    use Dask for preprocessing? Well, it fits and transforms in parallel.


    Table [6-1](#489264_1_En_6_Chapter.xhtml#Tab1) lists some of the transformers
    that are (mostly) drop-in replacements for their scikit-learn counterparts.


    **Table 6-1.** Dask''s drop-in transformer replacements for scikit-learn counterparts


    | Transformer | Description |

    | --- | --- |

    | `MinMaxScaler([feature_range, copy])` | Transforms features by scaling each
    feature to a given range. |

    | `QuantileTransformer([n_quantiles, …])` | Transforms features using quantile
    information. |

    | `RobustScaler([with_centering, with_scaling, …])` | Scales features using statistics
    that are robust to outliers. |

    | `StandardScaler([copy, with_mean, with_std])` | Standardizes features by removing
    the mean and scaling to unit variance. |

    | `LabelEncoder([use_categorical])` | Encodes labels with a value between 0 and
    n_classes-1. |


    There are two important things to keep in mind while using `dask_ml.preprocessing`.


    - They operate on Dask collections in parallel.

    - `.transform` returns `dask.array` or `dask.dataframe` when the input is a Dask
    collection.


    Table [6-2](#489264_1_En_6_Chapter.xhtml#Tab2) lists a few other Dask transformers
    that are helpful for converting non-numeric data into numeric data.


    **Table 6-2.** Dask transformers to convert non-numeric data into numeric data


    | Transformer | Description |

    | --- | --- |

    | `Categorizer([categories, columns])` | Transforms DataFrame columns to a categorical
    dtype. |

    | `DummyEncoder([columns, drop_first])` | Dummy (one-hot) encode categorical columns.
    |

    | `OrdinalEncoder([columns])` | Ordinal (integer) encode categorical columns.
    |


    These transformers are useful as a preprocessing step in a pipeline where you
    start with heterogeneous data (a mix of numeric and non-numeric), but the estimator
    requires all numeric data.


    Let’s go through a toy pipeline to check the transformer in code. Our pipeline
    will:


    - Categorize the text data

    - Dummy encode the categorical data

    - Fit a `RandomForestClassifier`


    Let’s import the necessary libraries.


    ```python

    from dask_ml.preprocessing import Categorizer, DummyEncoder

    from sklearn.linear_model import RandomForestClassifier

    from sklearn.pipeline import make_pipeline

    import pandas as pd

    import dask.dataframe as dd

    ```


    Initialize the Dask dataframe from the Pandas dataframe.


    ```python

    df = pd.DataFrame({"A": [1, 2, 1, 2], "B": ["a", "b", "c", "c"]})

    X = dd.from_pandas(df, npartitions=2)

    y = dd.from_pandas(pd.Series([0, 1, 1, 0]), npartitions=2)

    ```


    Build and fit the pipeline.


    ```python

    pipe = make_pipeline(Categorizer(), DummyEncoder(), RandomForestClassifier())

    pipe.fit(X, y)

    ```


    The code is self-explanatory if you know about pipelines in general, but the following
    is a quick explanation for the sake of completion.


    `Categorizer` converts a subset of the columns in `X` to a `categorical` dtype.
    By default, it converts all the object dtype columns.


    `DummyEncoder` dummy (or one-hot) encodes the dataset. This replaces a categorical
    column with multiple columns, where the values are either 0 or 1.


    We encourage you to read `sklearn.preprocessing` documentation ([https://scikit-learn.org/stable/modules/preprocessing.html](https://scikit-learn.org/stable/modules/preprocessing.html))
    to learn more about available transformers.


    ### Hyperparameter Search


    There are two kinds of hyperparameter optimization estimators in Dask-ML. The
    appropriate one to use depends on the size of your dataset and whether the underlying
    estimator implements the `partial_fit` method.


    If the dataset is relatively small or the underlying estimator doesn''t implement
    `partial_fit`, `dask_ml.model_selection.GridSearchCV` or `dask_ml.model_selection.RandomizedSearchCV`
    can be used. These are drop-in replacements for their scikit-learn counterparts;
    they should offer better performance and handling of Dask arrays and dataframes.


    #### Drop-in Replacement for scikit-learn


    | Estimator | Description |

    | --- | --- |

    | `dask_ml.model_selection.GridSearchCV` | Exhaustive search over specified parameter
    values for an estimator. |

    | `dask_ml.model_selection.RandomizedSearchCV` | Randomized search on hyperparameters.
    |


    #### Incremental Hyperparameter Optimization


    The second category of hyperparameter optimization uses *incremental* hyperparameter
    optimization. These should be used when your full dataset doesn''t fit in the
    memory of a single machine.


    In Dask, `dask_ml.model_selection.IncrementalSearchCV` is the class that handles
    this. This class incrementally searches for hyperparameters on models that support
    `partial_fit`.


    Broadly speaking, incremental optimization starts with a batch of models (underlying
    estimators and hyperparameter combinations) and repeatedly calls the underlying
    estimator''s `partial_fit` method with batches of data.


    Read the documentation to learn more about it.'
  raw: '### Preprocessing


    `dask_ml.preprocessing` contains some scikit-learn style transformers that can
