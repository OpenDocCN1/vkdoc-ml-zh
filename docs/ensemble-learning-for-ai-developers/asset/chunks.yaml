  trans: '

    ### 预处理


    `dask_ml.preprocessing` 包含一些 scikit-learn 风格的转换器，它们可以在管道中使用，作为模型拟合过程的一部分来执行各种数据转换。这些转换器在
    Dask 集合（`dask.array`、`dask.dataframe`）、NumPy 数组或 Pandas 数据框上都能很好地工作。再次重申，为什么要使用
    Dask 进行预处理？因为它可以并行地进行拟合和转换。


    表 6-1 列出了一些（大部分）可直接替代 scikit-learn 对应转换器的转换器。


    **表 6-1. Dask 对 scikit-learn 对应转换器的直接替代**


    | 转换器 | 描述 |

    | --- | --- |

    | MinMaxScaler([feature_range, copy]) | 通过将每个特征缩放到给定范围来转换特征。 |

    | QuantileTransformer([n_quantiles, …]) | 使用分位数信息转换特征。 |

    | RobustScaler([with_centering, with_scaling, …]) | 使用对异常值具有鲁棒性的统计量来缩放特征。 |

    | StandardScaler([copy, with_mean, with_std]) | 通过移除均值并缩放到单位方差来标准化特征。 |

    | LabelEncoder([use_categorical]) | 使用 0 到 n_classes-1 之间的值对标签进行编码。 |


    在使用 `dask_ml.preprocessing` 时，有两件重要的事情需要牢记。


    *   它们并行地操作 Dask 集合。

    *   当输入是 Dask 集合时，`.transform` 返回 `dask.array` 或 `dask.dataframe`。


    表 6-2 列出了一些其他有助于将非数值数据转换为数值数据的 Dask 转换器。


    **表 6-2. 将非数值数据转换为数值数据的 Dask 转换器**


    | 转换器 | 描述 |

    | --- | --- |

    | Categorizer([categories, columns]) | 将 DataFrame 列转换为分类数据类型。 |

    | DummyEncoder([columns, drop_first]) | 对分类列进行虚拟（独热）编码。 |

    | OrdinalEncoder([columns]) | 对分类列进行序数（整数）编码。 |


    这些转换器在管道中作为预处理步骤非常有用，当你从异构数据（数值和非数值的混合）开始，但估计器需要所有数值数据时。


    让我们通过一个玩具管道来在代码中检查转换器。我们的管道将：


    *   对文本数据进行分类

    *   对分类数据进行虚拟编码

    *   拟合一个随机森林分类器


    让我们导入必要的库。


    ```

    from dask_ml.preprocessing import Categorizer, DummyEncoder

    from sklearn.linear_model import RandomForestClassifier

    from sklearn.pipeline import make_pipeline

    import pandas as pd

    import dask.dataframe as dd

    ```


    从 Pandas 数据框初始化 Dask 数据框。


    ```

    df = pd.DataFrame({"A": [1, 2, 1, 2], "B": ["a", "b", "c", "c"]})

    X = dd.from_pandas(df, npartitions=2)

    y = dd.from_pandas(pd.Series([0, 1, 1, 0]), npartitions=2)

    ```


    构建并拟合管道。


    ```

    pipe = make_pipeline(Categorizer(),DummyEncoder(),RandomForestClassifier())

    pipe.fit(X, y)

    ```


    如果你对管道有一般了解，这段代码是不言自明的，但为了完整起见，下面是一个快速解释。


    `Categorizer` 将 X 中的一部分列转换为 `categorical` 数据类型。默认情况下，它会转换所有对象数据类型的列。


    `DummyEncoder` 对数据集进行虚拟（或独热）编码。这会将一个分类列替换为多个列，其中的值为 0 或 1。


    我们鼓励你阅读 sklearn.preprocessing 文档（[`https://scikit-learn.org/stable/modules/preprocessing.html`](https://scikit-learn.org/stable/modules/preprocessing.html)）以了解更多关于可用转换器的信息。


    ### 超参数搜索


    Dask-ML 中有两种超参数优化估计器。使用哪一种取决于数据集的大小以及底层估计器是否实现了 `partial_fit` 方法。


    如果数据集相对较小，或者底层估计器没有实现 partial_fit，可以使用 `dask_ml.model_selection.GridSearchCV`
    或 `dask_ml.model_selection.RandomizedSearchCV`。这些是 scikit-learn 对应方法的直接替代；它们应该能提供更好的性能以及对
    Dask 数组和数据框的处理能力。


    #### scikit-learn 的直接替代


    | dask_ml.model_selection.GridSearchCV | 对估计器指定的参数值进行穷举搜索。 |

    | --- | --- |

    | dask_ml.model_selection.RandomizedSearchCV | 对超参数进行随机搜索。 |


    #### 增量式超参数优化


    第二类超参数优化使用*增量式*超参数优化。当你的完整数据集无法放入单台机器的内存时，应该使用这些方法。


    在 Dask 中，`dask_ml.model_selection.IncrementalSearchCV` 是处理此问题的类。该类在支持 `partial_fit`
    的模型上增量式地搜索超参数。


    广义上讲，增量式优化从一批模型（底层估计器和超参数组合）开始，并使用数据批次重复调用底层估计器的 partial_fit 方法。


    阅读文档以了解更多信息。

    '
- fmt: '### Distributed Ensemble Fitting


    The remaining pieces are ensemble fitting and predictions. To reiterate, we are
    exploring how Dask is used for ensemble training and prediction.


    Let’s consider a case in which we use the `scikit-learn` estimator, but the dataset
    is larger than the memory. Dask ensures that not all data is loaded at once.


    Let’s import the necessary libraries.


    ```

    from sklearn import datasets

    from sklearn.ensemble import GradientBoostingClassifier

    import dask_ml.datasets

    from dask_ml.wrappers import ParallelPostFit

    ```


    The only new imports are `dask_ml` datasets and `ParallelPostFit`.


    `dask_ml.datasets` is equivalent to `sklearn.datasets`. We use it to create a
    large toy dataset.


    `ParallelPostFit` is a metaestimator for parallel prediction and transformation.
    Think of it as a distributed score function (in `sklearn`). It is important to
    note that this class is not appropriate for parallel or distributed *training*
    on large datasets. For that, use Dask Incremental; it provides distributed (but
    sequential) training.


    Let’s make a small, 1000-sample training dataset and fit normally.


    ```

    X, y = datasets.make_classification(n_samples=1000, random_state=0)

    clf = ParallelPostFit(estimator=GradientBoostingClassifier(),

    scoring=''accuracy'')

    clf.fit(X, y)

    ```


    Let’s build a bigger toy dataset.


    ```

    X_big, y_big = dask_ml.datasets.make_classification(n_samples=100000,

    random_state=0)

    ```


    Prediction on the new Dask input is no different than what you do in `sklearn`.
    The highlight here is that the classifier works on prediction datasets that are
    larger than the memory.


    ![../images/489264_1_En_6_Chapter/489264_1_En_6_Figc_HTML.jpg](images/489264_1_En_6_Chapter/489264_1_En_6_Figc_HTML.jpg)


    ```

    clf.predict(X_big)

    ```


    Let’s build a voting classifier now. Recall that a Voting classifier model combines
    multiple models (i.e., subestimators) into a single model, which is (ideally)
    stronger than any of the individual models alone.


    But why use Dask? Dask provides the software to train individual subestimators
    on different machines in a cluster. This enables users to train more models in
    parallel than is possible on a single machine. Let’s explore the Voting classifier
    with Dask in code.


    Let’s import the necessary modules.


    ```

    from sklearn.ensemble import VotingClassifier

    from sklearn.linear_model import SGDClassifier

    from sklearn.ensemble import RandomForestClassifier

    from sklearn.svm import SVC

    import sklearn.datasets

    X, y = sklearn.datasets.make_classification(n_samples=1_000, n_features=20)

    classifiers = [

    (''sgd'', SGDClassifier(max_iter=1000)),

    (''rf'', RandomForestClassifier()),

    (''svc'', SVC(gamma=''auto'')),

    ]

    clf = VotingClassifier(classifiers, n_jobs=-1)

    ```


    You saw all of this code in earlier chapters.


    Let’s initialize the dask-distributed cluster. Again, we discussed this in Chapter
    [5](#489264_1_En_5_Chapter.xhtml).


    ```

    import joblib

    from distributed import Client

    client = Client()

    with joblib.parallel_backend("dask"):

    clf.fit(X, y)

    ```


    This familiar code is the benefit and beauty of scaling ensembles with Dask. The
    key takeaway is to remember the scalable options available for the preprocessing,
    training, and prediction tasks of your ensemble pipeline.


    ## Summary


    Let’s do a quick recap of what was covered in this chapter.


    *   Random forests are very handy in learning which features matter. You can use
    the `feature_importances_` variable of the estimator.

    *   Forest embedding represents a feature space using a random forest. Embeddings
    give higher dimensionality to features, which help linear classifiers achieve
    excellent accuracy.

    *   `sklearn` offers a good toolset for building an ensembles preprocessing pipeline.
    `sklearn.pipeline` can build a transformer pipeline.

    *   `sklearn` `ColumnTransformer` provides a consistent way to connect pipelines.

    *   An isolation forest is an efficient algorithm for outlier detection, especially
    in highly dimensional datasets. It isolates observations by randomly selecting
    a feature and then randomly selecting a split value between the maximum and minimum
    values of the selected feature.

    *   `dask_ml.preprocessing` contains some scikit-learn style transformers that
    can be used in pipelines to perform various data transformations as part of the
    model-fitting process.

    *   There are two kinds of hyperparameter optimization estimators in Dask-ML.
    The appropriate one to use depends on the size of your dataset and whether the
    underlying estimator implements the `partial_fit` method.

    *   **Dask ParallelPostFit** is a metaestimator for parallel prediction and transformation.

    *   Dask provides the software to train individual subestimators on different
    machines in a cluster. This enables users to train more models in parallel than
    would have been possible on a single machine.


    ## Thank You


    Well, we have reached the end of the book, and we would like to sincerely thank
    you for reading it until the end. We truly hope that you will be able to effectively
    apply ensembling techniques in your projects.


    If there are any errors, please do not hesitate to send feedback. Feel free to
    contact us via Apress or Twitter at @aloksaan and @mayank10j.


    The best way to get maximum value from the book is to do one thing: practice.
    Try running all the codes snippets in the book. Find a project where you can try
    ensembles.


    Our greatest hope is that this book inspires you to add ensembles as a regular
    tool in your machine learning skills toolkit and to push the boundaries of ensembles.
    Happy learning.'
