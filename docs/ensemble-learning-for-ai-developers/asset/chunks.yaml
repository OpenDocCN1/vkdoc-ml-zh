    So far, we have created the categorical and numerical columns transformer separately.
    However, it would be more convenient to have a single transformer that can handle
    all columns and applies the appropriate transformations to each column automatically.
    In version 0.20, scikit-learn introduced **ColumnTransformer**, which offers this
    feature. It also works great with Pandas dataframes.


    ```

    from sklearn.compose import ColumnTransformer

    preprocessor = ColumnTransformer(

    transformers=[

    (''num'', numeric_transformer, numeric_features),

    (''cat'', categorical_transformer, categorical_features)])

    ```


    First, you need to import the `ColumnTransformer` class . Next, you initialize
    ColumnTransformer with the list of numerical and categorical column names. The
    constructor requires a list of tuples, where each tuple contains a name, a transformer,
    and a list of names (or indices) of columns that the transformer should be applied
    to.


    In our case, `numeric_features` should be transformed using `numeric_transformer`,
    and `categorical_features` should be transformed using `categorical_transformer`.


    Our pipeline is almost ready. We finally need to add the classifier, which in
    our case is a random forest.


    ```

    rnd_clf = RandomForestClassifier(n_estimators=255,n_jobs=-1)

    pipeline = Pipeline(steps=[(''preprocessor'', preprocessor),

    (''classifier'', rnd_clf)])

    ```


