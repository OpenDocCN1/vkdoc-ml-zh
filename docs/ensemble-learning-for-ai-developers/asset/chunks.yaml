    ## Stacking


    Stacking 是一种略有不同的混合组合方式。


    在这种集成技术中，我们首先一起训练多个模型（**基学习器**）来获得预测结果。在 Stacking 中，各个预测的结果随后被视为下一组训练数据，并以称为**元学习器**的另一层形式添加（见图
    4-5）。


    你可以将这种技术想象成将一层机器学习学习器堆叠在另一个机器学习学习器之上。


    想象一下，你正在参加一个电视游戏节目，必须回答一个历史问题。你向两位朋友求助；一位是历史专业，另一位是计算机科学专业。你更信任谁能给出正确答案？你的知识让你更信任你历史专业朋友的答案（或者从技术上讲，给其中一个基础学习器更高的权重）。


    Stacking 基于相同的理念：我们不是使用简单的函数（如硬投票）来聚合集成中所有学习器的预测，而是训练一个模型来执行这种聚合。让我们看一个例子来更好地理解这一点。


    ![../images/489264_1_En_4_Chapter/489264_1_En_4_Fig5_HTML.jpg](img/489264_1_En_4_Fig5_HTML.jpg)


    图 4-5


    Stacking


    清单 4-4 是在 scikit-learn 库中使用 Stacking 的示例代码。此外，如果你想将 Stacking 应用于任何回归问题，可以参考清单
    4-5，我们在其中使用 scikit-learn 库对回归问题进行了 Stacking。


    你可以从参考页面 [`https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.StackingClassifier.html`](https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.StackingClassifier.html)
    阅读更多关于 scikit-learn 中 Stacking 分类器不同参数的信息。


    ```

    from sklearn.datasets import load_diabetes

    from sklearn.linear_model import RidgeCV

    from sklearn.svm import LinearSVR

    from sklearn.ensemble import RandomForestRegressor

    from sklearn.ensemble import StackingRegressor

    X, y = load_diabetes(return_X_y=True)

    estimators = [("lr", RidgeCV()), ("svr", LinearSVR(random_state=42))]

    reg = StackingRegressor(

    estimators=estimators,

    final_estimator=RandomForestRegressor(n_estimators=10, random_state=42),

    )

