    ### Snapshot Ensembles


    Snapshot ensembles are an extension of a horizontal voting ensemble. Instead of
    saving models after the minimum threshold, you modify the learning rate of the
    model itself. If you have read or implemented deep learning models, you may already
    know about this phenomenon. When training a machine learning model, it is often
    desirable to start the initial higher learning and then slowly decrease the learning
    rate.


    In Figure [3-4](#489264_1_En_3_Chapter.xhtml#Fig4), we are changing the learning
    rate with a training epoch. But oftentimes, this approach leaves a lot of the
    optimization on the table, as training could be struck at any local minimum.


    One of the leading solutions for this local minimum problem is a **cyclic learning
    rate**, in which we increase and decrease learning rates in cycles.


    Figure [3-4](#489264_1_En_3_Chapter.xhtml#Fig4) shows that after each 400 epochs,
    we change the learning rate back to maximum value and then begin decreasing the
    learning rate from there.


    ![../images/489264_1_En_3_Chapter/489264_1_En_3_Fig4_HTML.jpg](images/489264_1_En_3_Chapter/489264_1_En_3_Fig4_HTML.jpg)


    Figure 3-4


    Snapshot ensemble


    If you want to learn more about snapshot ensembles, refer to a Cornell University
    paper written in 2017 at [`https://arxiv.org/abs/1704.00109`](https://arxiv.org/abs/1704.00109).
    In figure 1 of this paper, there is a loss vs. learning rate graph in standard
    SGD optimizer. It includes a simple learning rate schedule and a cyclic learning
    rate schedule. As a certain minimum is reached, we simply save the state of the
    model in the form of its weights and bias values obtained at that point and increase
    our learning rate (i.e., take a larger step). You can consider this larger step
    a jumping point for landing on a different spot in this plot and start finding
    the next minima. In the end, there are a set of models for which the error rate
    is low.


    Like horizontal voting ensembles, all the models at each of the local minima states
    are combined. This approach results in a very good model when compared to using
    an individual model alone.


