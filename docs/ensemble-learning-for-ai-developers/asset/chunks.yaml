- fmt: '# 2. Mixing Training Data


    In Chapter [1](#489264_1_En_1_Chapter.xhtml), you learned how the role of a data
    scientist is similar to a concertmaster who uses his ensemble of orchestra and
    instruments to compose a beautiful composition. Similarly, a data scientist has
    multiple ensemble tools at his disposal if he wants to squeeze a world-class performance
    out of his data and models. In this chapter, the main goal is to learn different
    ways to mix training data to get ensemble models.


    The following are the goals for this chapter.


    - Build an intuitive understanding of how mixing training data can lead to good
    performance in ensemble learning

    - Introduce decision trees

    - Look at an example implementation of a decision tree using `scikit-learn`

    - Introduce random forests as a collection of decision trees

    - Learn about sampling datasets and two variants: sampling without replacement
    and sampling with replacement by using code examples

    - Learn about bagging (bootstrap aggregating) by using code examples

    - Learn about cross-validation techniques: *k*-fold cross-validation and stratified
    *k*-fold cross-validation


    Let’s start by learning why mixing data is useful. Charles Darwin discovered that
    a species is more vulnerable to extinction if it does not have sufficient genetic
    diversity. Why is that so? A species is more vulnerable to unexpected natural
    disasters and diseases if all members have the same genetics because everyone
    is equally vulnerable to unexpected events.


    How can a species develop sufficient genetic diversity naturally? One of the natural
    ways to develop sufficient genetic diversity happens when the population is divided
    and must evolve inside different environmental conditions. This ensures that if
    a species encounters an adverse and unexpected environment, at least a subset
    of the species has more resilience; so overall, the survival of the species is
    ensured. Dividing a population into different groups and exposing them to different
    environments leads the population to evolve slightly differently, which leads
    to increased genetic diversity.


    Using the same knowledge and applying it to machine learning, if you train a single
    model with whole training data, the machine learning model might perform alright
    if the real-world testing data has a distribution similar to the training data.
    If you use data that does not sufficiently look like the distribution from the
    training data, you could face issues. To solve this issue, it is a good idea to
    divide the training data into different subsets and train the multiple models
    on different subsets of data. By virtue of having different training data distribution,
    each of these models has a slightly different inference (real-world performance)
    characteristics. Then we can combine these models by ensembling them to get better
    results than a single model. This is called **mixing training data**.


    ## Decision Trees


    Let’s learn how to mix data by using an example of a machine learning model called
    a **decision tree** (see Figure [2-1](#489264_1_En_2_Chapter.xhtml#Fig1)).


    ![../images/489264_1_En_2_Chapter/489264_1_En_2_Fig1_HTML.jpg](images/489264_1_En_2_Chapter/489264_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    Simple decision tree


    A decision tree is a top-down flowchart-like method, in which you start from the
    top node. Each node represents a decision that needs to be taken based on one
    or more parameters/variables. You traverse these nodes until you reach sufficient
    depth, which is based on the number of parameters that you want to train on.


    Let’s start with an example dataset to discover how you can apply a decision tree
    to it.


    The iris flower dataset is a widely used standard dataset inside the machine learning
    community. Figure [2-2](#489264_1_En_2_Chapter.xhtml#Fig2) shows the decision
    tree for the iris flower dataset. Our task is to classify iris flowers into three
    different flower species This dataset has 50 samples for each of the three iris
    species. The following parameters are available in each sample: Sepal Length,
    Sepal Width, Petal Length, Petal Width.


    A sample decision tree is created by taking two of the four parameters (Sepal
    Length and Sepal Width) into consideration; all the leaf nodes are assigned to
    a flower species category.


    ![../images/489264_1_En_2_Chapter/489264_1_En_2_Fig2_HTML.jpg](images/489264_1_En_2_Chapter/489264_1_En_2_Fig2_HTML.jpg)


    Figure 2-2


    Decision tree for an iris flower dataset


    A decision tree is applied in practice by taking a sample from a dataset. Tree
    traversal starts from the top node partition sample and goes into buckets based
    on conditions at each node. Each node is based on an answer and then takes a left
    or a right node. It proceeds from there by continuously applying condition testing.
    You eventually reach the bottom leaf nodes, where you get a final assignment.


    To train a decision tree, you can use the `scikit-learn` Python library. Listing
    [2-1](#489264_1_En_2_Chapter.xhtml#PC1) shows how to train a decision tree by
    using the `scikit-learn` library in Python.


    ```

    from sklearn.datasets import load_iris

    from sklearn.tree import DecisionTreeClassifier

    from sklearn.model_selection import train_test_split

    X, y = load_iris(return_X_y=True)

    train_X, test_X, train_Y, test_Y = train_test_split(X, y, test_size = 0.2, random_state
    = 123)

    tree = DecisionTreeClassifier()

    tree.fit(train_X, train_Y)

    print(tree.score(test_X, test_Y))

    # Output: 0.9333333333333333

    Listing 2-1

    Training a Decision Tree Using scikit-learn

    ```


    The greater the depth of a decision tree, the greater the accuracy of the training
    dataset.


    But there are major problems with using decision trees. To get sufficient accuracy
    of your dataset, you need to have a tree with bigger (more depth) trees, but as
    you increase the depth of the tree, you start to encounter overfitting, which
    leads to lower accuracy in your test dataset. So you have to be content with either
    a less accurate, shallower decision tree or an overfitted tree with more depth.


    One of the reasons for this issue is that the variables used using in making decisions
    may not be sufficiently discriminatory for a global perspective.


    One way to solve this problem is to have multiple decision trees instead of one.
    Each decision tree should have a different set of variables or a subset of training
    data. Then, the output of the decision trees is combined in a random forest (see
    Figure [2-3](#489264_1_En_2_Chapter.xhtml#Fig3)).


    ![../images/489264_1_En_2_Chapter/489264_1_En_2_Fig3_HTML.jpg](images/489264_1_En_2_Chapter/489264_1_En_2_Fig3_HTML.jpg)


    Figure 2-3


    Random forest with number of decision trees = 4 for iris flower dataset


    As the name suggests, a **random forest** consists of collection of decision trees,
    with each tree trained on a different set of training data.


    Listing [2-2](#489264_1_En_2_Chapter.xhtml#PC2) is the code snippet for a random
    forest in Python `scikit-learn`.'
