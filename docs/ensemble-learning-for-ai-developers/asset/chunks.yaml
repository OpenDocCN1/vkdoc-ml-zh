    引言


    集成学习正迅速成为数据科学领域中机器学习模型的热门选择。集成方法以多种有趣的方式组合机器学习模型的输出。即使在从事机器学习项目多年之后，我们仍未意识到集成方法的强大之处，因为这一主题在大多数机器学习课程和书籍中通常被忽视或仅作简要概述。与许多人一样，我们是通过研究竞争性机器学习场景才了解到集成方法的威力。像
    Kaggle 这样的竞争性机器学习平台，为机器学习技术提供了公正的评估。在过去几年中，集成学习方法始终在竞争性指标上表现优异。这本身就说明了学习集成技术的好处。本书的目标是帮助你学习集成方法，并将其有效应用于现实场景。


    本书首先解释了为什么需要集成学习技术。第 1 章的目标是建立对各种集成技术的基本理解。第 2、3 和 4 章涵盖了各种集成技术，并根据我们如何混合训练数据、模型和组合方式进行分组。在这些章节中，你将学习一些最重要的集成学习技术，如随机森林、装袋、自助聚合、堆叠和交叉验证方法。


    第 5 章涵盖了集成学习库。这些库有助于加速你的实验和实现。第 6 章介绍了将集成方法集成到现实世界机器学习工作流中的技术。


    本书以简洁易懂的方式呈现，帮助你学习并将集成学习概念应用于实际用例，否则对于初出茅庐的数据科学家来说，这需要大量的反复学习。本书中的代码（Python 脚本）可作为你项目的扩展或参考。


    致谢


    我们衷心感谢 Apress 团队在我们撰写本书过程中提供的所有帮助和支持。撰写本书是一段愉快的经历，Apress 团队无疑是其中重要的一部分。非常感谢策划编辑
    Celestin Suresh John，他在缩小本项目范围并使其更易于理解方面提供了巨大帮助。非常感谢我们的开发协调员和编辑 Aditee Mirashi
    和 Laura C. Berendson。他们持续的跟进极大地帮助我们保持进度和专注。我们也感谢 Ashutosh Parida 提供的宝贵技术反馈。


    一如既往，我们要感谢家人的所有帮助和支持。没有他们的支持和协助，我们无法完成本书。


    最后，我们要感谢开源社区，他们帮助普及了知识。本书中使用的所有库都来自开源项目。


    关于作者 关于技术审校者


    # 1. 为什么需要集成技术


    根据剑桥词典的定义，**集成**（ensemble）是指一组**事物**或人作为一个整体共同行动或组合在一起。**集成**一词最初用于描述经常一起演奏的音乐家群体。一个音乐家集成是多个音乐家个人作品的总和。类似地，在机器学习中，**集成学习**是多种机器学习技术的组合，共同执行。


    集成学习正迅速成为数据科学中提升机器学习模型准确性的首选标准。集成方法通过以多种有趣的方式组合机器学习模型的输出来实现这一点；就像音乐家集成以多种不同方式组合他们的个人表演，以达到伟大的作品。


    你作为数据科学家的角色是成为一位首席演奏家或架构师，能够利用单个机器学习（ML）模型的优势，并以有趣的方式组合它们，以实现相当于伟大作品的机器学习模型（即世界级的机器学习模型）。


    让我们再看一个类比，以更好地理解集成方法的好处。假设你想投资股票市场。你对某只特定股票感兴趣，但不确定其未来前景，因此你决定寻求建议。你找到一位预测准确率为
    75% 的财务顾问。你决定咨询其他财务顾问，他们给出了类似的建议。如果每位顾问都建议你买入该股票，那么这些集体建议的准确率是多少？


    通常情况下，多位专家的集体建议往往胜过任何一位顾问的准确率，尤其是在不同的财务状况下。类似地，在机器学习中，来自多个机器学习模型的集成方法往往比任何单个机器学习模型具有更好的泛化性能，尤其是在不同条件/案例下或长期来看。


    在本书中，我们将带你了解如何在集成学习的框架下组合多个机器学习模型的输出。


    集成学习技术可以进一步分为三大类：**混合训练数据**、**混合组合方式**和**混合模型**。我们将简要地帮助你建立对每一类的理解。'
- fmt: '# Mixing Training Data


    Anyone who has read about the evolution of species knows that it is very important
    for any species to have sufficient genetic diversity. Species that have less genetic
    diversity tend to die out, even if they are fit for the current environment.


    One of the reasons for this phenomenon is that even though a species (or current
    training data) has become expert in its environment, whenever there is an adverse
    environmental condition, like a new lethal disease, it is not able to adapt, and
    the species becomes prone to extinction.


    One of the ways for any species to develop sufficient genetic diversity is to
    divide its population and let them evolve inside different environmental conditions.
    The reason for success in this approach is that dividing the population into different
    groups and exposing them to different environments leads them to evolve based
    on the new environments, which leads to increased genetic diversity. This prevents
    the population from becoming homogeneous, and in adversity, it ensures that at
    least some of the subgroups of species will survive.


    Taking this insight to machine learning leads us to the first ensemble learning
    variant, which is `Mixing training data`. Instead of training a single, large
    classifier on all the training data, we divide the training data into multiple
    chunks, and train separate classifiers on each subset of training data. In the
    end, the output of all of these classifiers are combined (see Figure [1-1](#489264_1_En_1_Chapter.xhtml#Fig1)).


    This approach ensures that classifiers capture sufficient diversity as they are
    trained (evolve) on a subset of the population. By combining the output of these
    diverse learners, we are able to achieve superior accuracy compared to a case
    in which we trained a single learner on a whole population (training data).


    This kind of division of training data is called `bagging`. You learn more about
    this technique in Chapter [2](#489264_1_En_2_Chapter.xhtml).


    ![../images/489264_1_En_1_Chapter/489264_1_En_1_Fig1_HTML.jpg](images/489264_1_En_1_Chapter/489264_1_En_1_Fig1_HTML.jpg)


    Figure 1-1


    Mixing training data using bagging


    # Mixing Combinations


    To better understand what mixing, or varying, combinations mean in the context
    of ensemble learning, let’s look at an analogy of the learning process of students
    in a class.


    Suppose that you want a class of students to perform well in all subjects, but
    we find that some students performed poorly in unit tests. We can identify these
    students and provide more emphasis to the poorly scored topics so that they come
    up to par with other students. In order to give more emphasis, we tweak the learning
    process by adding courses and allocating additional time in the students’ weak
    areas. This ensures that students will perform better in all subjects.


    Let’s use the same analogy in machine learning. We start out with a collection
    of learners, in which each ML learner is trained on a particular subset of training
    objects. If the model learner has a weak performance, we could give more emphasis
    to that particular learner with increased emphasis where previous learner had
    weak performance. This combination of learners is known as `boosting`.


    Let’s look at another different method of mixing machine learning models called
    `Stacking`. To understand this better imagine stacks of plates on top of each
    other, each plate on top of stack is built on foundation of plates on bottom of
    stack. Similarly, in stacking learners, we place one machine learning model on
    top of the output of another to do stacks of machine learning models. In other
    words, in this ensemble technique, we train multiple models together to get a
    predictions/output learner. When we combine these predictions, there could be
    errors.


    In stacking, we treat the result of individual predictions as the next training
    data. (The first layers of machine learning models/learners are called `base learners`.)
    We stack another layer of machine learning models/learners on top of the base
    layers; the second layer is called a `meta learner` (see Figure [1-2](#489264_1_En_1_Chapter.xhtml#Fig2)).
    You can think of this technique as stacking one layer of ML learners on top of
    another ML learner.


    Both of these approaches—`boosting` and `stacking`—involve mixing machine learning
    models in various combinations, which are covered in more detail in Chapter [4](#489264_1_En_4_Chapter.xhtml).


    ![../images/489264_1_En_1_Chapter/489264_1_En_1_Fig2_HTML.jpg](images/489264_1_En_1_Chapter/489264_1_En_1_Fig2_HTML.jpg)


    Figure 1-2


    Stacking'
