- fmt: '# Mixing Models


    The third type of ensemble learning methods involve **varying models**.


    Let’s consider a scenario in which two kids—Ram and Shyam—are learning science.
    Ram is receiving all of his learning from a single person, who is a good teacher
    but teaches in a single, monotonous way. Shyam is taught by multiple teachers,
    as well as his parents; each teacher boosts his science education by varying their
    teaching techniques. Does Ram or Shyam have a better probability of getting good
    grades?


    All other things being equal, Shyam has a better chance of being good in science.


    It is often observed in children’s education that if a child is not dependent
    on a single person or single way of teaching, he or she will be better off in
    life. This happens because learning from different people covers the blind spots
    that are often overlooked by a single person or a single way of teaching.


    Again, using this analogy in machine learning, we can train our network in lots
    of different ways. We can use different models (see Figure [1-3](#489264_1_En_1_Chapter.xhtml#Fig3)),
    and even in the case of a single machine learning model, we can use settings/hyperparameters
    that differ between training runs. Instead of relying on only a single model or
    single hyperparameter settings for our machine learning tasks, we can combine
    them together by either training multiple models or by using multiple training
    runs with different hyperparameter settings. This leads us to have better accuracy
    and lower bias when compared to using a single model or single settings. The types
    of ensembling techniques that combine varying models are discussed in Chapter
    [3](#489264_1_En_3_Chapter.xhtml).


    ![../images/489264_1_En_1_Chapter/489264_1_En_1_Fig3_HTML.jpg](images/489264_1_En_1_Chapter/489264_1_En_1_Fig3_HTML.jpg)


    Figure 1-3


    Mixing models


    All the ensemble techniques discussed so far learn are covered in detail in Chapters
    [2](#489264_1_En_2_Chapter.xhtml), [3](#489264_1_En_3_Chapter.xhtml), and [4](#489264_1_En_4_Chapter.xhtml).
    They are not helpful until you can apply them in real-world data science problems.
    One of the major hindrances in adopting many promising concepts is the access
    to tools and library support. Fortunately, as machine learning researchers have
    realized the power of ensemble techniques, library support has caught up. Nowadays,
    many popular ensemble techniques have implementations in Python and R. In addition
    to ensemble support in general-purpose machine learning libraries like `scikit-learn`,
    libraries dedicated to specific ensemble techniques have been developed. Some
    of these libraries are now standard if you want to achieve state-of-the-art results
    in data science competitions.


    `XGBoost` is a gradient boosting framework that is used in multiple languages,
    including C/C++, Python, Java, and R. It can run on multiple operating systems,
    as well. It can run on a single machine or parallelly run to leverage multiple
    machines. And it provides fast implementation for boosting (which is an ensemble
    learning method).


    `LightGBM` is another very popular gradient boosting framework (as of this writing,
    it has more than 10,000 stars on GitHub) developed and maintained by Microsoft.
    It can run on clusters of machines and be leveraged to use GPUs for speedup.


    `SuperLearner` in R is a very popular package; it makes combining multiple models
    and applying ensemble techniques seamless. It supports dozens of algorithms (for
    example, `XGBoost`, random forest, `GBM`, `Lasso`, `SVM`, `BART`, `KNN`, decision
    trees, and neural networks), which you can simultaneously run and test.


    You learn more about some of the most popular libraries, as well as support for
    ensembling methods in languages like R and Python, in Chapter [5](#489264_1_En_5_Chapter.xhtml).


    The different types of problems that occur in machine learning have different
    constraints and different performance requirements, which lead to situations in
    which we need to pick ensemble techniques based on requirements. Knowledge of
    what works and what does not in a particular problem domain is very helpful to
    a practitioner. In Chapter [6](#489264_1_En_6_Chapter.xhtml) (tips and best practices),
    we apply different ensemble techniques in different problem domains (e.g., image
    classification, natural language processing, etc.).


    One of the reasons for huge recent popularity of ensemble learning techniques
    is the boost it gives to your problem, if you are a team working on a challenging
    machine learning problem with the goal of beating state of the art, with ensemble
    methods you each work on your individual approach and then can combine results
    by simple ensembling methods. This is also the pattern followed by most recent
    winners in various competitive machine learning contests.


    Take the example of a safe driver prediction competition held on Kaggle in 2017,
    in which more than 5000 teams competed for correctly predicting whether a driver
    would file an insurance claim next year based on various parameters. The winning
    solution was developed by Michael Jahrer; it was a blend of six different machine
    learning models. One model used gradient boosting from the `LightGBM` library;
    he then combined the result with five neural networks with different parameters.
    By using this ensemble of results, Jahrer was able to achieve the top ranking—and
    the $25,000 prize money.


    Most of the winners of almost all recent data science competitions relied on ensembling
    techniques to achieve their results.


    Another example is the Avito Demand Prediction Challenge that was held in September
    2019. The goal was to predict the demand for classified ads based on different
    ad parameters, such as an included image, the text description, and so forth.
    More than 1800 teams took part in the competition for a $25,000 prize. The winning
    team named their entry “Dance with Ensembles” and credited ensemble methods for
    their success in the competition. The team of four worked independently, with
    each team member using many ensemble-based methods, including `LightGBM` combined
    with traditional neural networks methods with different parameters. Each of the
    team members later combined their results by using the power of ensembling.


    You can browse blog posts on the winning stories on many competitive coding platforms,
    like Kaggle. Almost all of them boosted their results or combined different algorithms
    using ensemble techniques. This is a strong indicator of the success of ensemble
    learning in real-world machine learning problems.


    ## Summary


    The following is a quick recap of what we covered in this chapter.


    - A basic answer to **What is ensemble learning, and why is it used?**

    - A brief introduction to ensemble learning using **mixing of training data**.

    - A brief introduction to ensemble methods where we **mix models**.

    - A brief introduction to ensemble learning, where we **mix combinations** of
    models with examples of boosting and stacking.

    - A brief introduction to some machine learning libraries.

    - The ways that people are using advanced ensemble learning techniques to achieve
    state-of-the-art results in real-world problems and competitive data science competitions.


    In the next chapter, you learn how to start to build ensemble-based methods, starting
    with methods that mix training data for ensembling.'
