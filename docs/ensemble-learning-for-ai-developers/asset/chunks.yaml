    我们来解析一下这段代码。


    1.  在数据上训练一个随机森林分类器。

    2.  将森林中的树应用于数据（X_train），然后在返回的叶子索引上拟合独热编码器。

    3.  将森林中的树应用于逻辑回归数据子集，使用之前训练好的独热编码器进行转换，然后在其基础上拟合逻辑回归模型。

    4.  计算测试集上的概率估计值，然后计算 roc_curve 值。


