- fmt: '# Bagging (Bootstrap Aggregating)


    You are now familiar with sampling a dataset with or without replacement. This
    section introduces one of the most important ensemble techniques: bagging. Bagging
    is a short form of bootstrap aggregating. It is an ensemble technique that divides
    a dataset into `n` samples with replacement. Each of the divided `n` samples are
    then trained separately into `n` separate machine learning models. Then the output
    of all the separate models are combined into one single output by using voting
    (see Figure [2-6](#489264_1_En_2_Chapter.xhtml#Fig6)).


    ![../images/489264_1_En_2_Chapter/489264_1_En_2_Fig6_HTML.jpg](images/489264_1_En_2_Chapter/489264_1_En_2_Fig6_HTML.jpg)


    Figure 2-6


    Bagging with sampling with replacement


    As you can see, the bagging technique ensures that each classifier gets random
    samples, which ensures a diverse set of trained models. These diverse models provide
    a much better performing model than any of the individual models.


    Bagging consists of three steps: bootstrapping, training, and aggregating. First,
    the bootstrapping step divides a dataset into `n` samples, with each sample a
    subset of the total training data. Each of these samples has its sampling done
    by using sampling by replacement techniques. As we discussed earlier, sampling
    with replacement ensures that the sampling is truly random; the composition of
    one sample does not depend on another sample.


    Next is the training step, in which you train individual models on these samples
    separately. This step ensures that you get lots of relatively weak machine learning
    models trained on each sample.


    The third step is aggregating, in which you combine the results of all the weak
    classifiers using methods like voting (which you learn in Chapter [3](#489264_1_En_3_Chapter.xhtml)).


    Listing [2-5](#489264_1_En_2_Chapter.xhtml#PC5) is sample code that uses all three
    bagging steps.


    ```

    from sklearn.utils import resample

    from sklearn import tree

    from sklearn.model_selection import train_test_split

    from sklearn.datasets import make_classification

    import numpy as np

    from sklearn.metrics import accuracy_score

    # data to be sampled

    n_samples = 100

    X,y = make_classification(n_samples=n_samples, n_features=4, n_informative=2,
    n_redundant=0, random_state=0, shuffle=False)

    #divide data into train and test set

    X_train, X_test, y_train, y_test =  train_test_split(X, y, test_size = 0.1, random_state
    = 123)

    # Number of divisions needed

    num_divisions = 3

    list_of_data_divisions = []

    # Divide data into divisions

    for x in range(0, num_divisions):

    X_train_sample, y_train_sample = resample(X_train, y_train, replace=True, n_samples=7)

    sample = [X_train_sample, y_train_sample]

    list_of_data_divisions.append(sample)

    #print(list_of_data_divisions)

    # Learn a Classifier for each data divisions

    learners = []

    for data_division in list_of_data_divisions:

    data_x = data_division[0]

    data_y = data_division[1]

    decision_tree = tree.DecisionTreeClassifier()

    decision_tree.fit(data_x, data_y)

    learners.append(decision_tree)

    # Combine output of all classifiers using voting

    predictions = []

    for i in range(len(y_test)):

    counts = [0 for _ in range(num_divisions)]

    for j , learner in enumerate(learners):

    prediction = learner.predict([X_test[i]])

    if prediction == 1:

    counts[j] = counts[j] + 1

    final_predictions = np.argmax(counts)

    predictions.append(final_predictions)

    accuracy = accuracy_score(y_test, predictions)

    print("Accuracy:", accuracy)

    # Output: Accuracy: 0.9

    Listing 2-5

    Bagging from Primitives

    ```


    You can directly call the Bagging classifier from the scikit-learn library. Listing
    [2-6](#489264_1_En_2_Chapter.xhtml#PC6) is sample code from a scikit-learn implementation
    of the Bagging classifier.


    ```

    from sklearn.svm import SVC

    from sklearn.ensemble import BaggingClassifier

    from sklearn.model_selection import train_test_split

    from sklearn.datasets import make_classification

    X, y = make_classification(n_samples=100, n_features=4,

    n_informative=2, n_redundant=0,

    random_state=0, shuffle=False)

    #divide data into train and test set

    X_train, X_test, y_train, y_test =  train_test_split(X, y, test_size = 0.2, random_state
    = 123)

    clf = BaggingClassifier(base_estimator=SVC(),

    n_estimators=10, random_state=0).fit(X_train, y_train)

    print(clf.score(X_test, y_test))

    # Output: 0.9

    Listing 2-6

    Bagging scikit-learn

    ```


    ## *k*-Fold Cross-Validation


    Moving further into our exploration of resampling-based machine learning techniques,
    one of the most popular techniques is cross-validation, especially K Fold cross-validation.
    Machine learning researchers often encounter a situation where they achieve good
    accuracy in a training dataset, even in the test dataset; but in the application
    of the same model in a real-world situation or on another hidden test dataset,
    they lose out due to suboptimal accuracy.


    This is especially problematic for people who do competitive machine learning
    on sites like Kaggle. One of the primary reasons for this is because the provided
    validation set does not have all the different distributions that are possible
    in a real-world situation. A very effective solution is to apply a sampling technique
    in the division of training and the validation dataset itself. This approach is
    called cross-validation.


    One of the most popular cross-validation techniques is `k`-fold cross-validation
    (see Figure [2-7](#489264_1_En_2_Chapter.xhtml#Fig7)). In this approach, you divide
    validation and the training dataset by using sampling without replacement, iteratively.
    `k` represents the number of divisions applied to the dataset. For example, with
    `k` = 10, we divide the dataset into 10 different parts; 9/10 of the dataset is
    applied to training and 1/10 is applied to testing the accuracy of the dataset.
    But the division does not stop there. The process is repeated 10 times, in which
    each test and training division is changed and the overall accuracy is recalculated.
    The final accuracy of your model is calculated by averaging each of the individual
    accuracy figures.


    ![../images/489264_1_En_2_Chapter/489264_1_En_2_Fig7_HTML.jpg](images/489264_1_En_2_Chapter/489264_1_En_2_Fig7_HTML.jpg)


    Figure 2-7


    k-fold cross-validation (Source: [`https://scikit-learn.org/stable/auto_examples/model_selection/plot_cv_indices.html#sphx-glr-auto-examples-model-selection-plot-cv-indices-py`](https://scikit-learn.org/stable/auto_examples/model_selection/plot_cv_indices.html%2523sphx-glr-auto-examples-model-selection-plot-cv-indices-py))


    Listing [2-7](#489264_1_En_2_Chapter.xhtml#PC7) is sample code for applying this
    technique using scikit-learn.


    ```

    import numpy as np

    from sklearn.model_selection import KFold

    X = np.array([[1, 2], [3, 4], [1, 2], [3, 4]])

    y = np.array([1, 2, 3, 4])

    kf = KFold(n_splits=2)

    kf.get_n_splits(X)

    print(kf)

    # Output:

    # KFold(n_splits=2, random_state=None, shuffle=False)

    for train_index, test_index in kf.split(X):

    print("TRAIN:", train_index, "TEST:", test_index)

    X_train, X_test = X[train_index], X[test_index]

    y_train, y_test = y[train_index], y[test_index]

    # Output:

    # TRAIN: [2 3] TEST: [0 1]

    # TRAIN: [0 1] TEST: [2 3]

    Listing 2-7

    k-Fold Cross-Validation

    ```'
