  trans: "\n#### Python 代码中的 LightGBM\n\n让我们使用 LightGBM 构建一个二分类器。我们将针对该用例使用 Python\
    \ 接口（参见代码清单 5-10）。\n\n```\nimport lightgbm as lgb # --1\nn_features  = 20\ndata\
    \ = np.random.rand(5000, 20)  # --2\nlabel = np.random.randint(2, size=5000)\n\
    X_trn, X_val, y_trn, y_val = train_test_split(data, label, test_size=0.30)  #\
    \ --3\nfeature_name = ['feature_' + str(col) for col in range(n_features)] # --4\n\
    train_data = lgb.Dataset(X_trn,label=y_trn,feature_name=feature_name, categorical_feature=[feature_name[-1]]\
    \ #--5\nvalidation_data = lgb.Dataset(X_val,label=y_val,reference=train_data)\
    \ # --6\nparam = {'num_leaves': 31, 'objective': 'binary'} # --7\nparam['metric']\
    \ = ['auc', 'binary_logloss'] # --8\nnum_round = 10\nbst = lgb.train(param, train_data,\
    \ num_round, valid_sets=[validation_data]) #--9\nprint('Feature importances:',\
    \ list(bst.feature_importance())) # --10\ndata = np.random.rand(7, 20)\nypred\
    \ = bst.predict(data) # --11\n# --12\nfor i in range(7):\nif ypred[i]>=.5:   \
    \    # setting threshold to .5\nypred[i]=1\nelse:\nypred[i]=0\n代码清单 5-10\n使用 lightGBM\
    \ 的二分类器\n```\n\n让我们来解析这段代码。\n\n1.  导入 LightGBM 库。为简洁起见，省略了其他导入。\n\n    LightGBM\
    \ Python 模块可以从 LibSVM（基于零索引）/TSV/CSV/TXT 格式文件、NumPy 二维数组、Pandas 数据框、H2O DataTable\
    \ 的数据框以及 SciPy 稀疏矩阵 LightGBM 二进制文件加载数据。数据存储在 `Dataset` 对象中。\n\n2.  将数据拆分为训练集和验证集。\n\
    \n3.  为随机生成的特征分配名称。请注意，我们的数据集中有 20 个特征。\n\n4.  准备训练数据集。我们指定了特征名称和分类值。LightGBM\
    \ 可以直接将分类特征作为输入。它不需要转换为独热编码，并且比独热编码快得多（大约快 8 倍）。在加载到数据集之前，将分类值转换为整数非常重要。\n\n5.\
    \  准备验证数据集。在 LightGBM 中，验证数据应与训练数据对齐。这里的 `Dataset` 对象非常节省内存，它只需要保存离散的箱。\n\n6.\
    \  LightGBM 可以使用字典来设置 `Parameters`。由于这是一个二分类问题，我们将目标设置为 `binary`。有关目标的其他可能值，请查看文档。\n\
    \n7.  指定多个评估指标。\n\n8.  通过调用 `train` 方法进行训练。你也可以使用 `fit` 方法，并查看文档了解详情。\n\n9.  使用\
    \ `feature_importance` 方法检查特征重要性。\n\n10. 调用 `predict` 方法计算类别概率。\n\n11. 使用阈值将概率转换为类别预测。\n\
    \n还有一个参数调优的领域，为此我们建议查阅 [`https://lightgbm.readthedocs.io/en/latest/Parameters-Tuning.html`](https://lightgbm.readthedocs.io/en/latest/Parameters-Tuning.html)\
    \ 上的文档。凭借你对架构的新认识，理解起来并不困难。\n\n### AdaNet\n\nAdaNet 是一个轻量级的基于 TensorFlow 的框架，用于以最少的专家干预自动学习高质量模型。它是一种迭代学习神经网络**结构**和**权重**的算法，将其作为**子网络集成**。\n\
    \n该项目基于 AdaNet 算法，该算法在 [ICML 2017](https://icml.cc/Conferences/2017) 上发表的论文“[AdaNet:\
    \ 人工神经网络的适应性结构学习](http://proceedings.mlr.press/v70/cortes17a.html)”中提出，用于学习作为子网络集成的神经网络结构。\n\
    \n一张图有助于理解（见图 5-14）。\n\n![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig14_HTML.png](img/489264_1_En_5_Fig14_HTML.png)\n\
    \n图 5-14\n\nAdaNet 子网络集成神经网络\n\n这里，子网络的输出被组合起来生成一个输出。它本质上使用了集成学习的概念，即最终模型由更简单的模型组成。这使得模型更加复杂，但也能提供更好的准确性。\n\
    \n在每次迭代中，算法会检查一组候选网络，评估哪个网络能提升集成性能（或者从技术上讲，产生更小的损失），然后将其添加到集成中。需要注意的是，每个候选网络架构必须由用户提供。\n\
    \n让我们看几个集成示例，以了解其可能性。\n\n图 5-15 是一个具有不同复杂度的子网络集成。本质上，该集成由复杂度递增的神经网络子网络组成，其输出被简单地平均。\n\
    \n![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig15_HTML.png](img/489264_1_En_5_Fig15_HTML.png)\n\
    \n图 5-15\n\n具有不同复杂度的 AdaNet 子网络集成\n\n图 5-16 是在共享嵌入之上学习的集成。当大部分模型参数是特征的嵌入时，这种集成风格非常有用。各个子网络的预测通过学习的线性组合进行合并。\n\
    \n![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig16_HTML.png](img/489264_1_En_5_Fig16_HTML.png)\n\
    \n图 5-16\n\n从共享嵌入中学习的 AdaNet 集成\n\n现在，让我们通过 Python 对象的视角来看迭代周期。这有助于我们学习和使用该框架（见图\
    \ 5-17）。\n\n![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig17_HTML.png](img/489264_1_En_5_Fig17_HTML.png)\n\
    \n图 5-17\n\nAdaNet 集成生成过程（来源：AdaNet 文档）\n\n*   **子网络生成器**和**子网络**定义在 `adanet.subnetwork`\
    \ 包中。\n\n*   **集成策略**、**集成器**和**集成**定义在 `adanet.ensemble` 包中。\n\n作为练习，我们鼓励你运行托管在\
    \ Google Colab ([`https://github.com/tensorflow/adanet`](https://github.com/tensorflow/adanet))\
    \ 上的示例。这些笔记本注释详尽，并提供了可在你的机器学习任务中使用的现成样板代码。\n\n## 总结\n\n让我们快速回顾一下本章涵盖的内容。\n\n*\
    \   sklearn 没有内置的模块堆叠功能。ML-Ensemble（也称为 mlens）是一个开源库，简化了集成实验。其 API 风格类似于 Keras，可以通过分层基础学习器和元学习器轻松构建堆叠。\n\
    \n*   我们研究了选择有效学习器及相关超参数的技术。\n\n*   Dask 是一个用于 Python 并行计算的灵活库，包含两部分：动态任务调度和大数据集合。动态任务调度类似于\
    \ Airflow，但针对交互式计算工作负载进行了优化。\n\n*   Dask 可以并行训练 XGBoost 树，为其提供了巨大的可扩展性。\n\n* \
    \  LightGBM 是一种梯度提升树算法，作为微软的一个库提供。\n\n*   基于直方图的方法、处理缺失值、基于梯度的单边采样和互斥特征捆绑帮助 LightGBM\
    \ 表现优于 XGBoost。\n\n*   AdaNet 是一个轻量级的基于 TensorFlow 的框架，用于以最少的专家干预自动学习高质量模型。它是一种迭代学习神经网络**结构**和**权重**的算法，将其作为**子网络集成**。\n\
    \n如你所见，这些库为构建集成提供了灵活性、可重用性和速度。在第 6 章中，你将学习将集成有效应用于实际场景的艺术。\n"
- fmt: '# 6. Tips and Best Practices


    In order to fully extract the power of ensembling, you need to learn the art of
    effectively applying it to real-world situations.


    If you have heard of the 80/20 rule for data wrangling in machine learning, then
    you know that a vast amount of time is spent beyond searching and optimizing models.
    By the end of this chapter, you will have a good collection of reusable solutions
    to integrate ensembles into your real-world ML workflows.


    The following are your learning goals for this chapter.


    * Feature selection using a random forest model. It should not come as a surprise
    that feature selection and feature relevance benefits from the performance and
    interpretation of machine learning algorithms.

    * Feature transformations with ensembles of trees.

    * Building a preprocessing pipeline for a random forest regressor.

    * Isolation forests, an efficient algorithm for outlier detection, especially
    in high-dimensional datasets.

    * Scaling ensembles with Dask.


    ## Feature Selection Using Random Forests


    It is quite common to have hundreds of features available for your ML task, but
    they may not all play equal roles, and some may play no role at all. Features
    that have very low or no importance can be safely removed from the features list.
    This feature pruning (or the selection of important ones) offers three benefits.


    * It reduces the computational cost and time of training a model.

    * It makes trained model interpretation easier.

    * It reduces overfitting by reducing the variance.


    Random forests (an ensemble of decision trees) are popular for feature selection.
    You can intuitively measure a feature’s importance by looking at how much the
    tree nodes that use that feature improve purity on average (across all trees in
    the forest). Thus, by pruning trees below a particular node, you can create a
    subset of the most important features.


    Fortunately, `scikit-learn` computes each feature’s importance score automatically
    after training and then scales the results so that the sum of all the feature
    importances is equal to 1. You can access the result using the `feature_importances_`
    variable. Let’s go through the code in Listing [6-1](#489264_1_En_6_Chapter.xhtml#PC1).
    We skipped the imports for brevity.


    ```

    iris = datasets.load_iris() # -1

    feature_list = iris.feature_names # -2

    print(feature_list)

    [''sepal length (cm)'',

    ''sepal width (cm)'',

    ''petal length (cm)'',

    ''petal width (cm)'']

    X = iris.data # -3

    y = iris.target # -4

    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.33, random_state=42)
    # -5

    rf_clf = RandomForestClassifier(n_estimators=10000, random_state=42, n_jobs=-1)
    # -6

    rf_clf.fit(X_train, y_train) # -7

    for name, score in zip(iris["feature_names"], rf_clf.feature_importances_):

    print(name, score) # -8

    sepal length (cm) 0.09906957842524829

    sepal width (cm) 0.03880497890715764

    petal length (cm) 0.4152569088750478

    petal width (cm) 0.4468685337925464

    y_pred = clf.predict(X_test) # -9

    accuracy_score(y_test, y_pred) # -10

    0.9333333333333333

    sfm = SelectFromModel(clf, threshold=0.15) # - 11

    sfm.fit(X_train, y_train) # -12

    X_important_train = sfm.transform(X_train) # -13

    X_important_test = sfm.transform(X_test)

    rf_clf_important = RandomForestClassifier(n_estimators=500, random_state=0, n_jobs=-1)
    # -14

    rf_clf_important.fit(X_important_train, y_train)

    y_important_pred = rf_clf_important.predict(X_important_test) # - 15

    accuracy_score(y_test, y_important_pred)

    0.9166666666666666

    Listing 6-1

    Computing feature importance in scikit-learn

    ```


    Let’s unpack the code to better understand it.


    1. Use the iris dataset. It is available along with the `sklearn` library, and
    hence, you don’t need to download the data separately.

    2. Retrieve the feature list by using the dataset.`feature_names` property.

    3. Extract the features from the dataset.

    4. Extract the target from the dataset.

    5. Split the data into train and test by using the `train_test_split` method available
    in `sklearn`.

    6. Initialize `RandomForestClassifier` with 10K estimators.

    7. Call the `fit` method.

    8. Once the training is complete, use the `feature_importances_` variable to check
    the importance score. It seems that in the iris dataset, petal length and width
    are more important.

    9. Predict the test set.

    10. Calculate the accuracy score. We recalculate the accuracy after feature selection.

    11. Create a selector object that will use a random forest classifier to identify
    features that have an importance of more than 0.15.

    12. Train the selector.

    13. Create a new dataset by transforming the data containing the important features
    only.

    14. Initialize a new `RandomForestClassifier` with 500 estimators.

    15. Fit the classifier and predict the newly created `X_important_test`.


    Even though accuracy dropped when trained with only important features, the dataset
    size reduced by 50%. There was a 2% drop in accuracy with a 50% drop in number
    of features—that’s not bad!


    Even if you use other techniques for feature selection, random forests are very
    handy for quickly understanding which features actually matter in initial experiments.'
