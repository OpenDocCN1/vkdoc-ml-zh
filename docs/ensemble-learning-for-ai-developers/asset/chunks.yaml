- fmt: '### Dask-ML


    What would you get if you combine `Dask` with `scikit-learn`? You get a scalable
    ML algorithm.


    But isn’t `scikit-learn` already parallel? Yes, but `scikit-learn` only provides
    parallel computing on a single machine with `Joblib`. Let’s build a classifier
    using `LogisticRegression` (see Listing [5-6](#489264_1_En_5_Chapter.xhtml#PC18)).
    We will use the `make_classification` dataset that generates a random *n* classification
    problem.


    ```

    from dask_glm.datasets import make_classification

    from dask_ml.linear_model import LogisticRegression

    from dask_ml.model_selection import train_test_split

    X, y = make_classification()

    X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=42)

    lr = LogisticRegression()

    lr.fit(X_train, y_train)

    lr.predict(X_test)

    Listing 5-6

    Single Machine logisticRegression with Dask

    ```


    Don’t be surprised to find this code no different from standard `scikit-learn`
    code. It is using `Joblib`, which natively provides thread-based and process-based
    parallelism. `Joblib` is what backs the `n_jobs=` parameter in normal use of `scikit-learn`.
    Pictorially, the process looks like Figure [5-9](#489264_1_En_5_Chapter.xhtml#Fig9).


    ![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig9_HTML.jpg](images/489264_1_En_5_Chapter/489264_1_En_5_Fig9_HTML.jpg)


    Figure 5-9


    Dask thread and process-based processing on a single machine using `Joblib`


    Note


    Please check documentation for installing `dask_ml`.


    `Dask` can extend this parallelism to many machines in a cluster. This works well
    for modest data sizes, but large computations, such as random forests, hyperparameter
    optimization, and more. Before we look at the code, Figure [5-10](#489264_1_En_5_Chapter.xhtml#Fig10)
    shows what the distributed computation looks like.


    ![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig10_HTML.jpg](images/489264_1_En_5_Chapter/489264_1_En_5_Fig10_HTML.jpg)


    Figure 5-10


    Dask parallel execution in a clustered environment


    Here, `Dask` is talking to `scikit-learn` via `Joblib` so that a cluster is used
    to train a model. Let’s go through the code in Listing [5-7](#489264_1_En_5_Chapter.xhtml#PC19)
    to see things in action.


    ```

    from dask_ml.model_selection import GridSearchCV

    parameters = {''penalty'': [''l1'', ''l2''], ''C'': [0.5, 1, 2]}

    lr = LogisticRegression()

    est = GridSearchCV(lr, param_grid=parameters)

    est.fit(X_train,y_train)

    Listing 5-7

    GridSearch and LogisticRegression via dask

    ```


    No surprises until now. We are using the grid search to find the best value for
    `LogisticRegression` parameters: `penalty` and coefficient `C`. The dataset is
    the same as the one we used in Listing [5-6](#489264_1_En_5_Chapter.xhtml#PC18).
    Now we want to switch the training on a cluster.


    ```

    from dask_ml.model_selection import GridSearchCV

    parameters = {''penalty'': [''l1'', ''l2''], ''C'': [0.5, 1, 2]}

    lr = LogisticRegression()

    est = GridSearchCV(lr, param_grid=parameters)

    import joblib #--1

    from dask.distributed import Client #--2

    client = Client() #--3

    with joblib.parallel_backend(''dask''): #--4

    est.fit(X_train, y_train) #--5

    Listing 5-8

    Training on a cluster via dask

    ```


    Let’s unpack the code. Note that there is no change in `scikit-learn` grid search
    code and we are using the same data as in Listing [5-6](#489264_1_En_5_Chapter.xhtml#PC18).


    1.  We import the `Joblib` library. Recall that `Joblib` runs the `scikit-learn`
    function on different threads or processes on a local machine. We are importing
    this to register the new back end, which is `Dask` here. It is essentially to
    change from Figure [5-9](#489264_1_En_5_Chapter.xhtml#Fig9) to Figure [5-10](#489264_1_En_5_Chapter.xhtml#Fig10).


    2.  We import the `Client` from `Dask` `dask.distributed` to connect to the `Dask`
    cluster.


    3.  We are initializing the client to connect to the `Dask` cluster. But when
    did we start the cluster? The cluster is run locally when the client is initialized
    with no parameter. To run the cluster locally, all we need to do is initialize
    the `Client` without any parameter.


    4.  With the `joblib.parallel_backend` context, we are specifying to use the `Dask`
    back end or cluster for training.


    5.  Now the estimator is fit onto the cluster rather than on threads or processes.


    The cluster could be run in a cloud environment with Docker or Kubernetes. Please
    check the documentation for setting up clusters on cloud machines.


    ### Scaling XGBoost


    You learned about `XGBoost` in previous chapters. Here you learn how to train
    gradient boosting trees in parallel using `Dask` and `XGBoost`. Recall that `XGBoost`
    stands for eXtreme Gradient Boosting, and as the name suggests, it is an implementation
    of gradient boosting. The gradient boosting method tries to fit a new predictor
    to the *residual errors* made by the previous predictor.


    The `dask-xgboost` project is pretty small and pretty simple (200 TLOC). Like
    a `Dask` cluster that has scheduler(s) and worker(s), `Dask` starts up an `XGBoost`
    scheduler in the same process running the `Dask` scheduler and an `XGBoost` worker
    within each of the `Dask` workers. They share the same physical processes and
    memory spaces. `Dask` is built to support this kind of situation, which is why
    it is so seamless. During training, `Dask` workers give all the `Pandas` dataframes
    (that are constituents of the `Dask` dataframe) to the local `XGBoost` and let
    `XGBoost` do its thing. It is important to note and remember that `Dask` doesn’t
    power `XGBoost`; it just sets it up, gives it data, and lets it do its work in
    the background.


    `Dask` and `XGBoost` can share data with each other and can monitor each other
    because they can live in the same Python process. It is very similar to the way
    `NumPy` and `Pandas` operate together within a single process. Sharing distributed
    processes with multiple systems can be really beneficial if you want to use multiple
    specialized services easily and avoid large monolithic frameworks. Let’s now look
    at how to use `XGBoost` with `Dask` in code (see Listing [5-9](#489264_1_En_5_Chapter.xhtml#PC21)).


    ![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig11_HTML.jpg](images/489264_1_En_5_Chapter/489264_1_En_5_Fig11_HTML.jpg)


    Figure 5-11


    Feature importance score plot


    ```

    from dask.distributed import Client

    client = Client() # --1

    #Prepare dummy dataset

    from dask_ml.datasets import make_classification

    X, y = make_classification(n_samples=100000, n_features=20,

    chunks=1000, n_informative=4,

    random_state=0) #--2

    #Split for training and testing

    from dask_ml.model_selection import train_test_split

    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.15) #--3

    #Train Dask-XGBoost

    import xgboost

    import dask_xgboost

    params = {''objective'': ''binary:logistic'',

    ''max_depth'': 4, ''eta'': 0.01, ''subsample'': 0.5,

    ''min_child_weight'': 0.5} #--4

    bst = dask_xgboost.train(client, params, X_train, y_train, num_boost_round=10)
    #--5

    #Plot feature importance

    %matplotlib inline

    import matplotlib.pyplot as plt

    ax = xgboost.plot_importance(bst, height=0.8, max_num_features=9)

    ax.grid(False, axis="y")

    ax.set_title(''Estimated feature importance'')

    plt.show()

    #Results

    Listing 5-9

    Scaling XGBoost via dask

    ```


    Let’s unpack the code here.


    1.  Initialize the client. You already know that `Dask` cluster will be a local
    one. You can check the value of cluster to see the cluster details.


    2.  Generate a random toy dataset using the `make_classification` function. We
    have used this before as well.


    3.  Split the dataset into training and testing data to aid evaluation by making
    sure we have a fair test.


    4.  Specify the `XGBoost` parameters.


    5.  Call the `train` method to fit the model. `dask-xgboost` is a small wrapper
    around `XGBoost`. `Dask` sets up `XGBoost`, gives `XGBoost` data, and lets `XGBoost`
    do its training in the background using all the `Dask` workers. The `bst` object
    is a regular `xgboost.Booster` object, which means all the methods of `XGBoost`
    are available here.


    6.  Plot the feature importance using `xgboost.plot_importance` method.'
