- fmt: '### Dask Arrays and Dataframes


    A picture speaks a thousand words. A logical structure of the Dask array is shown
    in Figure [5-5](#489264_1_En_5_Chapter.xhtml#Fig5).


    ![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig5_HTML.jpg](images/489264_1_En_5_Chapter/489264_1_En_5_Fig5_HTML.jpg)


    Figure 5-5


    Logical structure of Dask array


    You can see in Figure [5-5](#489264_1_En_5_Chapter.xhtml#Fig5) that the Dask array
    essentially manages the collection of NumPy arrays, even though it gives a single
    logical view to the user. This picture might trigger ideas in your mind, and yes,
    they are true. You can assign individual NumPy arrays that process to different
    threads, cores, or machines. It doesn’t matter where they live. Dask is a wonderful
    secretary that manages all the coordination internally.


    The same picture (see Figure [5-6](#489264_1_En_5_Chapter.xhtml#Fig6)) can be
    used for dataframes as well. Dask dataframes coordinate many Pandas dataframes,
    partitioned along an index.


    ![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig6_HTML.jpg](images/489264_1_En_5_Chapter/489264_1_En_5_Fig6_HTML.jpg)


    Figure 5-6


    Logical structure of a Dask dataframe


    Let’s look at the code to see how to read a CSV in a Dask dataframe.


    ```

    import dask.dataframe as dd

    df = pd.read_csv("hdfs://mycsv.csv", parse_dates =[''timestamp''])

    ```


    Let’s also look at how it would have been done in Pandas.


    ```

    import pandas as pd

    df = dd.read_csv("hdfs://mycsv.csv", parse_dates =[''timestamp''])

    ```


    The code is identical across two libraries, and this is not a copy/paste error.
    The Dask API was designed keeping Python style in mind to ensure that the learning
    curve is minimal. Almost all packages in the Python data computing ecosystem can
    derive the benefits of distributed and parallel processing without much change.


    In addition to distributed processing, parallel processing is another Dask feature
    to scale data processing tasks. Let’s look at how Dask can parallelize custom
    algorithms using the simpler `dask.delayed` interface. Let’s go through the code
    in Listing [5-3](#489264_1_En_5_Chapter.xhtml#PC14).


    ```

    def inc(x):

    return x + 1

    def double(x):

    return x ∗ 2

    def add(x, y):

    return x + y

    data = [1, 2, 3, 4, 5]

    output = []

    for x in data:

    a = inc(x)

    b = double(x)

    c = add(a, b)

    output.append(c)

    total = sum(output)

    Listing 5-3

    Dask delayed interface for parallel processing

    ```


    Although the code is trivial, you can clearly see that the processing can be parallelized.
    `inc` and `double` can be executed in parallel.


    The Dask `delayed` function can decorate the preceding functions so that they
    operate *lazily*. Rather than executing the function immediately, it defers execution,
    placing the function and its arguments into a task graph. Let’s now wrap the custom
    functions within the `delayed` function, as shown in Listing [5-4](#489264_1_En_5_Chapter.xhtml#PC15).


    ```

    import dask

    output = []

    for x in data:

    a = dask.delayed(inc)(x)

    b = dask.delayed(double)(x)

    c = dask.delayed(add)(a, b)

    output.append(c)

    total = dask.delayed(sum)(output)

    Listing 5-4

    Dask lazy execution

    ```


    It is important to note that None of the `inc`, `double`, `add`, or `sum` calls
    have happened yet. Instead, the object `total` is a `delayed` result that contains
    a task graph of the entire computation.


    Fortunately, you can view the task graph by calling the `total.visualize()` method,
    as shown in Figure [5-7](#489264_1_En_5_Chapter.xhtml#Fig7).


    ![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig7_HTML.jpg](images/489264_1_En_5_Chapter/489264_1_En_5_Fig7_HTML.jpg)


    Figure 5-7


    Dask tasks graph


    Each of the nodes in the graph are tasks that can be assigned to different threads,
    pools, or even machines. The nodes are executed when the operation is run. For
    the code in Listing [5-2](#489264_1_En_5_Chapter.xhtml#PC15), it would be a call
    to the compute function.


    ```

    total.compute()

    ```


    It is important to be clear on what is happening here. It is not a large dataset
    problem but a computation challenge. When you hear about “messy data,” the majority
    of the time, it is a combination of a large dataset and custom data processing
    logic. Dask operates at both levels: large data and parallelizing tasks in an
    execution. Listing [5-5](#489264_1_En_5_Chapter.xhtml#PC17) is the graph of the
    Dask array task.


    ```

    import dask.array as da

    x = da.ones((15, 15), chunks=(5, 5))

    y = x + x.T

    y.visualize()

    Listing 5-5

    Dask task graph

    ```


    Here we are creating a Dask 2D array made from three chunks of a shape (5,5) and
    then adding the array with its transpose. Figure [5-8](#489264_1_En_5_Chapter.xhtml#Fig8)
    is the task graph for the computation.


    ![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig8_HTML.jpg](images/489264_1_En_5_Chapter/489264_1_En_5_Fig8_HTML.jpg)


    Figure 5-8


    Dask 2D arrays tasks graph'
