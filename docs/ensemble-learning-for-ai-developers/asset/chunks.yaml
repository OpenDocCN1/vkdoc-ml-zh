    #### 总结


    让我们快速回顾一下。ML-Ensemble 提供了类似 Keras 风格的 API 来构建集成模型。Superlearner 类有助于构建堆叠集成。mlens
    提供了不同类型的堆叠层，例如堆叠层、混合层和子集层。多次运行整个集成以比较不同的元学习器可能代价高昂。ML-Ensemble 实现了一个充当转换器的类，允许您将传入层用作“预处理”步骤，这样您只需迭代评估元学习器即可。您可以在
    [`http://ml-ensemble.com/info/index.html`](http://ml-ensemble.com/info/index.html)
    找到项目文档。


    ## 通过 Dask 扩展 XGBoost


    如您所知，XGBoost 是梯度提升的一种优化实现，而 Dask 是 Python 中用于并行计算的灵活库。


    您可以结合两者来并行训练梯度提升树。


    在通过 Dask 扩展 XGBoost 之前，您需要了解 Dask。


    要理解并体会 Dask 的价值，您需要了解 Python 科学计算生态系统。图 5-3 让您大致了解如此多有用库和框架的广泛可用性。


    ![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig3_HTML.jpg](img/489264_1_En_5_Fig3_HTML.jpg)


    图 5-3


    Python 科学计算生态系统


    然而，这些包并非为扩展到单机之外而设计。Dask 的开发目的是为了扩展这些包及其周边生态系统。它与现有的 Python 生态系统协同工作，将其扩展到多核机器和分布式集群。这些库中的大多数是不可扩展的。对于无法放入计算机内存的数据集，您将如何使用
    NumPy 或 Pandas？Dask 使 NumPy 和 Pandas 能够处理分布式数据。分布式 NumPy 和 Pandas 的想法是不是很酷、很令人兴奋？不过，Dask
    并不局限于扩展 NumPy 和 Pandas；其可扩展性优势扩展到了整个生态系统。


    从高层次来看，Dask 帮助您解决两个问题。


    *   处理大于 RAM 的数据集。（您已经知道 Pandas 和 NumPy 需要将整个数据集加载到内存中。）


    *   将任务分配到线程、核心或不同的机器上。


    最棒的是，由于 Dask 基于 Python，并且其 API 与大多数 scikit-learn 库接口相匹配，您会感到非常熟悉。


    Dask 在两个层面上运行。


    *   在高层，Dask 提供了高级的 Array、Bag 和 DataFrame 集合，它们模仿了 NumPy、列表和 Pandas，但可以在无法放入主内存的数据集上并行操作。对于大型数据集，Dask
    的高级集合是 NumPy 和 Pandas 的替代方案。


    *   在底层，Dask 提供了动态任务调度器，可以并行执行任务图。在复杂情况下，Dask 的调度器是直接使用线程或多处理库，或其他任务调度系统（如 Luigi
    或 IPython Parallel）的替代方案。


    Dask 的逻辑架构（见图 5-4）可以帮助您更好地理解这些概念。


    ![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig4_HTML.jpg](img/489264_1_En_5_Fig4_HTML.jpg)


    图 5-4


    Dask 架构


    现在，让我们深入了解一下 Dask 数组和数据框的内部机制。

