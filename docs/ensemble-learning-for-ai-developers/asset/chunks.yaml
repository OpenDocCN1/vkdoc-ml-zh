    ### 超参数调优集成


    到目前为止，你已经看到了两个训练不同机器学习模型并组合其输出的示例。超参数调优集成是另一种获取集成输出的方法。它不依赖不同的模型来构建集成模型，而是使用一个优秀的机器学习模型，并通过不同的超参数设置来训练该模型。


    图 3-2 使用了相同的机器学习模型——随机森林，但通过不同的超参数设置实例化了该模型的三个实例。在随机森林算法中，最重要的超参数之一是树的数量，在 scikit-learn
    API 中称为 *n_estimators*。三个不同的随机森林分别使用不同数量的树（分别为 10、50 和 100）进行训练。类似地，这三个实例的训练数据循环次数（即**轮次**）也各不相同。然后，使用之前的技术（例如投票或平均）组合这些实例的输出，以获得集成输出。


    ![../images/489264_1_En_3_Chapter/489264_1_En_3_Fig2_HTML.jpg](img/489264_1_En_3_Fig2_HTML.jpg)


    图 3-2


    超参数调优集成


