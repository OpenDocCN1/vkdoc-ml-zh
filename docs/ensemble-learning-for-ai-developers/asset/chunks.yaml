- fmt: "#### LightGBM in Python Code\n\nLet’s build a binary classifier using LightGBM.\
    \ We will use the Python interface for the use case (see Listing [5-10](#489264_1_En_5_Chapter.xhtml#PC22)).\n\
    \n```\nimport lightgbm as lgb # --1\nn_features  = 20\ndata = np.random.rand(5000,\
    \ 20)  # --2\nlabel = np.random.randint(2, size=5000)\nX_trn, X_val, y_trn, y_val\
    \ = train_test_split(data, label, test_size=0.30)  # --3\nfeature_name = ['feature_'\
    \ + str(col) for col in range(n_features)] # --4\ntrain_data = lgb.Dataset(X_trn,label=y_trn,feature_name=feature_name,\
    \ categorical_feature=[feature_name[-1]] #--5\nvalidation_data = lgb.Dataset(X_val,label=y_val,reference=train_data)\
    \ # --6\nparam = {'num_leaves': 31, 'objective': 'binary'} # --7\nparam['metric']\
    \ = ['auc', 'binary_logloss'] # --8\nnum_round = 10\nbst = lgb.train(param, train_data,\
    \ num_round, valid_sets=[validation_data]) #--9\nprint('Feature importances:',\
    \ list(bst.feature_importance())) # --10\ndata = np.random.rand(7, 20)\nypred\
    \ = bst.predict(data) # --11\n# --12\nfor i in range(7):\nif ypred[i]>=.5:   \
    \    # setting threshold to .5\nypred[i]=1\nelse:\nypred[i]=0\nListing 5-10\n\
    Binary Classifier using lightGBM\n```\n\nLet’s unpack the code.\n\n1.  Import\
    \ the LightGBM library. Other imports have been omitted for brevity.\n\n    The\
    \ LightGBM Python module can load data from a LibSVM (zero-based) /TSV/CSV/ TXT\
    \ format file, a NumPy 2D array(s), a Pandas dataframe, an H2O DataTable’s frame,\
    \ and a SciPy sparse matrix LightGBM binary file. The data is stored in a `Dataset`\
    \ object.\n\n2.  Split the data into train and validation.\n\n3.  Assign names\
    \ to the randomly generated features. Note that we have 20 features in our dataset.\n\
    \n4.  Prepare the training dataset. We are specifying the features names and categorical\
    \ values. LightGBM can use categorical features as input directly. It doesn’t\
    \ need to convert to one-hot coding, and it is much faster than one-hot coding\
    \ (about 8x speed-up). It is important to convert categorical values to int before\
    \ loading into datasets.\n\n5.  Prepare the validation dataset. In LightGBM, the\
    \ validation data should be aligned with training data. The `Dataset` object here\
    \ is very memory-efficient, and it only needs to save discrete bins.\n\n6.  LightGBM\
    \ can use a dictionary to set `Parameters`. Since this is a binary classification\
    \ problem, we are setting up the objective as `binary`. Check the documentation\
    \ for other possible values for objective.\n\n7.  Specify multiple eval metrics.\n\
    \n8.  Train by calling the train method. You can also use fit and check the documentation\
    \ for details.\n\n9.  Check the feature importance by using the `feature_importance`\
    \ method.\n\n10.  Call the `predict` method to calculate the class probabilities.\n\
    \n11.  Convert the probabilities into class predictions using a threshold.\n\n\
    There is one more area of parameter tuning, and for that we recommend going through\
    \ the documentation at [`https://lightgbm.readthedocs.io/en/latest/Parameters-Tuning.html`](https://lightgbm.readthedocs.io/en/latest/Parameters-Tuning.html).\
    \ With your new knowledge of architecture, it won’t be difficult to understand.\n\
    \n### AdaNet\n\nAdaNet is a lightweight TensorFlow-based framework for automatically\
    \ learning high-quality models with minimal expert intervention. It is an algorithm\
    \ for iteratively learning both the **structure** and **weight** of a neural network\
    \ as an **ensemble of subnetworks**.\n\nThis project is based on the AdaNet algorithm,\
    \ presented in “[AdaNet:​ Adaptive Structural Learning of Artificial Neural Networks](http://proceedings.mlr.press/v70/cortes17a.html)”\
    \ at [ICML 2017](https://icml.cc/Conferences/2017), for learning the structure\
    \ of a neural network as an ensemble of subnetworks.\n\nA picture is helpful here\
    \ (see Figure [5-14](#489264_1_En_5_Chapter.xhtml#Fig14)).\n\n![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig14_HTML.png](images/489264_1_En_5_Chapter/489264_1_En_5_Fig14_HTML.png)\n\
    \nFigure 5-14\n\nAdaNet subnetworks ensemble neural network\n\nHere the output\
    \ of the subnetworks is combined to generate one output. It essentially uses the\
    \ ensemble learning concept, where the final model is composed of simpler ones.\
    \ This makes the model more complex, but it can also deliver better accuracy.\n\
    \nAt each iteration, the algorithm checks a set of candidate networks and evaluates\
    \ which one improves the ensemble performance (or technically speaking, produces\
    \ a smaller loss), and then adds that to the ensemble. It is important to note\
    \ that each candidate network architecture must be provided by the user.\n\nLet’s\
    \ look at few ensemble examples to get an idea of the possibilities.\n\nFigure\
    \ [5-15](#489264_1_En_5_Chapter.xhtml#Fig15) is an ensemble of subnetworks with\
    \ different complexities. Essentially, the ensemble is composed of increasingly\
    \ complex neural network subnetworks whose outputs are simply averaged.\n\n![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig15_HTML.png](images/489264_1_En_5_Chapter/489264_1_En_5_Fig15_HTML.png)\n\
    \nFigure 5-15\n\nAdaNet subnetwork ensembles with different complexities\n\nFigure\
    \ [5-16](#489264_1_En_5_Chapter.xhtml#Fig16) is an ensemble learned on top of\
    \ a shared embedding. This ensembling style is useful when the majority of the\
    \ model parameters are an embedding of a feature. The individual subnetworks’\
    \ predictions are combined using a learned linear combination.\n\n![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig16_HTML.png](images/489264_1_En_5_Chapter/489264_1_En_5_Fig16_HTML.png)\n\
    \nFigure 5-16\n\nAdaNet ensembles learned from a shared embedding\n\nLet’s now\
    \ look at the iteration cycle through the lens of Python objects. This helps us\
    \ with learning and using the framework (see Figure [5-17](#489264_1_En_5_Chapter.xhtml#Fig17)).\n\
    \n![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig17_HTML.png](images/489264_1_En_5_Chapter/489264_1_En_5_Fig17_HTML.png)\n\
    \nFigure 5-17\n\nAdaNet ensemble generation process (Source: AdaNet documentation)\n\
    \n*   **Subnetwork Generator** and **Subnetwork** are defined in the `adanet.subnetwork`\
    \ package.\n\n*   **Ensemble Strategy** , **Ensembler** , and **Ensemble** are\
    \ defined in the `adanet.ensemble` package.\n\nAs an exercise, we encourage you\
    \ to run the examples hosted on Google Colab ([`https://github.com/tensorflow/adanet`](https://github.com/tensorflow/adanet)).\
    \ The notebooks are well annotated and provide ready-to-use boilerplate code to\
    \ use in your ML tasks.\n\n## Summary\n\nLet’s do a quick recap of what was covered\
    \ in this chapter.\n\n*   `sklearn` doesn’t have built-in module stacking. ML-Ensemble\
    \ (a.k.a. `mlens`) is an open source library that simplifies experimenting with\
    \ ensembling. The API style is similar to Keras, and stacking can be built easily\
    \ by layering base learners and metalearners.\n\n*   We looked at techniques for\
    \ selecting effective learners and associated hyperparameters.\n\n*   Dask is\
    \ a flexible library for parallel computing in Python and has two parts: dynamic\
    \ task scheduling and Big Data collections. The dynamic task scheduling is similar\
    \ to airflows, but optimized for interactive computational workloads.\n\n*   Dask\
    \ can train XGBoost trees in parallel, offering tremendous scalability to it.\n\
    \n*   LightGBM is a gradient boosting tree algorithm available as a library from\
    \ Microsoft.\n\n*   Histogram-based methods, treating missing values, and gradient-based\
    \ one-side sampling and exclusive feature bundling has helped LightGBM perform\
    \ better than XGBoost.\n\n*   AdaNet is a lightweight TensorFlow-based framework\
    \ for automatically learning high-quality models with minimal expert intervention.\
    \ It is an algorithm for iteratively learning both the **structure** and **weight**\
    \ of a neural network as an **ensemble of subnetworks**.\n\nAs you can see, libraries\
    \ offer flexibility, reusability, and speed for building ensembles. In Chapter\
    \ [6](#489264_1_En_6_Chapter.xhtml), you learn the art of effectively applying\
    \ ensembles to real-world situations."
