  raw: '## Boosting


    Let’s start the discussion of boosting by using an analogy of the learning process.
    Suppose you want a students in a class to perform well in all subjects, but some
    students performed poorly in unit tests. We can identify these students and provide
    more emphasis on the subjects in which they scored poorly so that they come up
    to par with other students. To provide more emphasis, we tweak the learning process
    by adding courses and allocating additional time to address the students’ weak
    areas. This ensures that students perform better in all subjects overall.


    Let’s take this same analogy to machine learning. We start with a collection of
    learners. Each ML learner is trained on a particular subset of training objects.
    If a model learner has a weak performance, we could provide greater emphasis to
    that particular learner. This is known as **boosting** .


    First, let’s discuss one of the simplest but most important of boosting techniques,
    AdaBoost.


    ## AdaBoost


    To better understand AdaBoost, take a look at Figure [4-1](#489264_1_En_4_Chapter.xhtml#Fig1).
    Initially data is trained using the Model classifier. The data subset in the red
    box is misclassified data; whereas the green box represents correctly classified
    data.


    To improve the performance of the model, instead of giving equal weight to all
    data in the classifier model, we increase the weight of the incorrectly classified
    data and run the training again. Since we have increased the weight of incorrectly
    classified data points/observations, in the next iterations, they have a higher
    probability of correct classification because the model will give more importance
    to these data points. We repeat this process until *n* iterations, when we achieve
    our desired model performance. A combination of these weak classification learners
    uses voting (see Figure [4-2](#489264_1_En_4_Chapter.xhtml#Fig2)) to get the final
    model. Please note that this often outperforms very sophisticated techniques.


    In summary, to increase efficiency, we can update the weight of incorrectly classified
    observations. Increasing the weight of incorrectly classified observations slightly
    helps improve the number of correctly classified observations in next iterations.
    By repeating these iterations, we can get a high-quality classifier from a very
    weak classifier. Even if we use a weakly performing machine learning model, we
    can boost output results.


    ![../images/489264_1_En_4_Chapter/489264_1_En_4_Fig2_HTML.jpg](images/489264_1_En_4_Chapter/489264_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    Voting of n learners in AdaBoost boosting


    ![../images/489264_1_En_4_Chapter/489264_1_En_4_Fig1_HTML.jpg](images/489264_1_En_4_Chapter/489264_1_En_4_Fig1_HTML.jpg)


    Figure 4-1


    AdaBoost boosting


    Listing [4-1](#489264_1_En_4_Chapter.xhtml#PC1) shows how to use AdaBoost with
    the scikit-learn library.


    By default, scikit-learn uses a basic learner as a decision tree classifier with
    maximum depth = 1\. To make an AdaBoost classifier, we pass an additional parameter,
    n_estimators (in this example, n_estimators = 100). AdaBoost is run on each additional
    boosted weight copy of the base learner until there is either a perfect data fit
    or the n_estimators limit is reached. At maximum, it will create 100 copies of
    our base decision tree learner with each copy having boosted weight.


    You can read more about the different parameters for the AdaBoost classifier in
    scikit-learn at [`https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.AdaBoostClassifier.html`](https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.AdaBoostClassifier.html).


    ```

    from sklearn.model_selection import cross_val_score

    from sklearn.datasets import load_iris

    from sklearn.ensemble import AdaBoostClassifier

    X, y = load_iris(return_X_y=True)

    clf = AdaBoostClassifier(n_estimators=100)

    scores = cross_val_score(clf, X, y, cv=5)

    print(scores.mean())

    # Output: 0.9466...

    Listing 4-1

    AdaBoost Using scikit-learn

    ```


    ## Gradient Boosting


    Gradient boosting is similar to the general boosting methods. You need to iteratively
    increase or boost weak learners. Unlike AdaBoost, where you add a new learner
    after increasing the weight of badly classified observations, in gradient boosting,
    you train a new model on residual errors made by the previous predictor. If this
    doesn''t make sense, don’t worry. Let’s look at an example.


    First, try to understand the concept of residual errors . Figure [4-3](#489264_1_En_4_Chapter.xhtml#Fig3)
    is an example dataset. X0 to X3 are the features/variables and Y is the ground
    truth, or target value.


    ![../images/489264_1_En_4_Chapter/489264_1_En_4_Fig3_HTML.jpg](images/489264_1_En_4_Chapter/489264_1_En_4_Fig3_HTML.jpg)


    Figure 4-3


    Residual errors


    Now let’s assume there is a trained a simple decision with very low depth (a weak
    learner) on this dataset. After training is completed, the predictions/inference
    on our decision tree is listed in the Pred column.


    The difference between each output of each observation and predicted output from
    the machine learning model is called **residual error** . In Figure [4-3](#489264_1_En_4_Chapter.xhtml#Fig3),
    the Error column represents the residual error field.


    In a gradient-based boosting method, you learn a new classifier; instead of taking
    features X0 to X3, you take the residual error of the previous classifier as the
    new target (YNew) for training new models.


    Let’s summarize all the steps discussed so far.


    1.  Use a decision tree regressor on a training set.


    2.  Use a second decision tree regressor on the residual error of the first.


    3.  Use a third decision tree regressor on the residual error of the second.


    You now have an ensemble containing three trees, and you can make predictions
    on new instances by summing up predictions from all the trees.


    The output of this algorithm is shown in Figure [4-4](#489264_1_En_4_Chapter.xhtml#Fig4).


    ![../images/489264_1_En_4_Chapter/489264_1_En_4_Fig4_HTML.jpg](images/489264_1_En_4_Chapter/489264_1_En_4_Fig4_HTML.jpg)


    Figure 4-4


    Residual error (continuation)


    Listing [4-2](#489264_1_En_4_Chapter.xhtml#PC2) is example code for using gradient
    boosting in the scikit-learn library. By default, scikit-learn uses basic learner
    as decision tree classifier with maximum depth = 1.


    You can read more about parameters for the gradient boosting classifier in scikit-learn
    at [`https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.GradientBoostingClassifier.html`](https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.GradientBoostingClassifier.html).


    ```

    from sklearn.datasets import make_hastie_10_2

    from sklearn.ensemble import GradientBoostingClassifier

    from sklearn.model_selection import cross_val_score

    X, y = make_hastie_10_2(random_state=0)

    clf = GradientBoostingClassifier(

    n_estimators=100, learning_rate=1.0, max_depth=1, random_state=0

    ).fit(X, y)

    scores = cross_val_score(clf, X, y, cv=5)

    print(scores.mean())

    # Output: 0.9225

    Listing 4-2

    Gradient Boosting with scikit-learn

    ```'
