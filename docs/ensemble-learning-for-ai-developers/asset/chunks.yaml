    1.  Import the **SequentialEnsemble** class . The **SequentialEnsemble** allows
    users to build ensembles with different classes of layers. The classes of layers
    are blend, subset, and stack. These three classes are different ways of mapping
    a training set to a prediction set used by the metalearner.


    2.  Use `RandomForest` and `SVM` as the base learners.


    3.  Set up two competing ensemble bases as preprocessing transformers. This one
    is a blended ensemble base with proba. Note that `proba` means whether the layer
    should predict class probabilities. Here the estimators’ **predict_proba** method
    will be called.


    4.  This one is a blended ensemble without proba. Note that the `model_selection`
    parameter is set to `True`. This modifies how the `transform` method behaves and
    ensures `predict` is called on test folds.


    5.  Set up preprocessing mapping. Each pipeline in this map is fitted once on
    each fold before evaluating candidate metalearners.


    6.  Set up candidate metalearners. Here the estimators will run on all preprocessing
    pipelines.


    7.  Set up parameter mappings. Note that the distributions are differentiated
    between cases for the random forest.


    8.  Wrap the score function. You already know why.


    9.  Instantiate the evaluator.


    10.  Call the evaluator fit method .


    11.  This is not required, but you can load the evaluator result in a dataframe
    to view the results in a formatted way. Again, the `-s` and `-m` suffixes stand
    for mean and standard deviation, respectively.


    #### Summary


    Let’s do a quick recap. ML-Ensemble offers Keras-style API build ensembles. The
    superlearner class helps with building stacking ensembles. mlens offers different
    kinds of stacking layers, such as stack, blend, and subset. Running an entire
    ensemble several times to compare different metalearners can be prohibitively
    expensive. ML-Ensemble implements a class that acts as a transformer, allowing
    you to use ingoing layers as a “preprocessing” step, so that you need only to
    evaluate the metalearners iteratively. You can find the project documentation
    at [`http://ml-ensemble.com/info/index.html`](http://ml-ensemble.com/info/index.html).


    ## Scale XGBoost via Dask


    As you already know, XGBoost is an optimized implementation of gradient boosting,
    whereas Dask is a flexible library for parallel computing in Python.


    You can combine the two to train gradient-boosted trees in parallel.


    Before we scale XGBoost via Dask, you need to understand Dask.


    To understand and appreciate the value of Dask, you need to look at the Python
    scientific ecosystem. Figure [5-3](#489264_1_En_5_Chapter.xhtml#Fig3) gives you
    a general idea of the broad availability of so many useful libraries and frameworks.


    ![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig3_HTML.jpg](images/489264_1_En_5_Chapter/489264_1_En_5_Fig3_HTML.jpg)


    Figure 5-3


    Python’s Scientific Ecosystem


    However, these packages were not designed to scale beyond a single machine. Dask
    was developed to scale these packages and the surrounding ecosystem. It works
    with the existing Python ecosystem to scale it to multicore machines and distributed
    clusters. Most of these libraries are not scalable. How would you use NumPy or
    Pandas for datasets that won’t fit in your computer memory? Dask makes NumPy and
    Pandas work with distributed data. Isn’t the idea of distributed NumPy and Pandas
    cool and exciting? Dask isn’t restricted to scaling NumPy and Pandas, though;
    the scalability benefit is extended to the whole ecosystem.


    At a high level, Dask helps you solve two problems.


    *   Handling datasets that are larger than RAM. (You already know that Pandas
    and NumPy require the full dataset in memory.)


    *   Distributing a task across threads, cores, or different machines.


    The best part is that since Dask is Python-based and its API matches most of the
    scikit-learn library interfaces, you already feel at home.


    Dask operates at two levels.


    *   At a high level, Dask provides high-level Array, Bag, and DataFrame collections
    that mimic NumPy, lists, and Pandas but can operate in parallel on datasets that
    don’t fit into main memory. Dask’s high-level collections are alternatives to
    NumPy and Pandas for large datasets.


    *   At low levels, Dask provides dynamic task schedulers that execute task graphs
    in parallel. Dask’s schedulers are an alternative to the direct use of threading
    or multiprocessing libraries in complex cases or other task scheduling systems,
    like Luigi or IPython Parallel.


    A logical architecture of Dask (see Figure [5-4](#489264_1_En_5_Chapter.xhtml#Fig4))
    can help you understand the concepts better.


    ![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig4_HTML.jpg](images/489264_1_En_5_Chapter/489264_1_En_5_Fig4_HTML.jpg)


    Figure 5-4


    Dask architecture


    Let’s now look under the hood to learn about the Dask arrays and dataframes.'
