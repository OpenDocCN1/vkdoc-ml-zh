    ### *k* 折交叉验证


    在我们进一步探索基于重采样的机器学习技术时，最流行的技术之一是交叉验证，尤其是 K 折交叉验证。机器学习研究人员经常遇到这样的情况：他们在训练数据集上取得了很好的准确率，甚至在测试数据集上也是如此；但在实际场景中或另一个隐藏的测试数据集上应用同一个模型时，却因为准确率不够理想而失败。


    这对于在 Kaggle 等网站上进行机器学习竞赛的人来说尤其成问题。其中一个主要原因是提供的验证集并不包含实际场景中可能出现的所有不同分布。一个非常有效的解决方案是在划分训练集和验证集本身时就应用采样技术。这种方法被称为交叉验证。


    最流行的交叉验证技术之一是 *k* 折交叉验证（参见图 2-7）。在这种方法中，你通过迭代地使用无放回采样来划分验证集和训练集。*k* 表示应用于数据集的划分数量。例如，当
    *k* = 10 时，我们将数据集分成 10 个不同的部分；其中 9/10 的数据用于训练，1/10 的数据用于测试数据集的准确率。但划分并不止于此。这个过程会重复
    10 次，每次都会改变测试和训练的划分，并重新计算总体准确率。你模型的最终准确率是通过计算每个单独准确率的平均值得到的。


    ![../images/489264_1_En_2_Chapter/489264_1_En_2_Fig7_HTML.jpg](img/489264_1_En_2_Fig7_HTML.jpg)


    图 2-7


    k 折交叉验证（来源：[`https://scikit-learn.org/stable/auto_examples/model_selection/plot_cv_indices.html#sphx-glr-auto-examples-model-selection-plot-cv-indices-py`](https://scikit-learn.org/stable/auto_examples/model_selection/plot_cv_indices.html%2523sphx-glr-auto-examples-model-selection-plot-cv-indices-py)）


    代码清单 2-7 是使用 scikit-learn 应用此技术的示例代码。


    ```

    import numpy as np

    from sklearn.model_selection import KFold

    X = np.array([[1, 2], [3, 4], [1, 2], [3, 4]])

    y = np.array([1, 2, 3, 4])

    kf = KFold(n_splits=2)

    kf.get_n_splits(X)

    print(kf)

    # 输出:

    # KFold(n_splits=2, random_state=None, shuffle=False)

    for train_index, test_index in kf.split(X):

    print("TRAIN:", train_index, "TEST:", test_index)

    X_train, X_test = X[train_index], X[test_index]

    y_train, y_test = y[train_index], y[test_index]

    # 输出:

    # TRAIN: [2 3] TEST: [0 1]

    # TRAIN: [0 1] TEST: [2 3]

    代码清单 2-7

    k 折交叉验证

    ```

