    *   If `mean`, then replace the missing values using the mean along each column.
    This can only be used with numeric data.


    *   If `median`, then replace the missing values using the median along each column.
    This can only be used with numeric data.


    *   If `most_frequent`, then replace the missing values using the most frequent
    value along each column. This can be used with strings or numeric data.


    *   If `constant`, then replace the missing values with fill_value. This can be
    used with strings or numeric data.


    StandardScaler standardizes features by removing the mean and scaling to unit
    variance.


    The standard score of a sample, *x*`,` is calculated as


    ```

    z = (x - u) / s

    ```


    where *u* is the mean of the training samples or zero if `with_mean=False`, and
    *s* is the standard deviation of the training samples or one if `with_std=False.`'
