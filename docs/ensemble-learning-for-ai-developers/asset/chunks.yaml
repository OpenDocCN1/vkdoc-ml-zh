- fmt: '# ML-Ensemble


    `ML-Ensemble`，也称为`mlens`，是一个开源 Python 库，用于构建与`scikit-learn`兼容的集成估计器。


    你可以通过`pip`安装它。


    ```

    pip install mlens

    ```


    构建集成的 API 风格与`Keras`等库非常相似。它提供了一种非常简单直接的方式来构建具有复杂交互的深度集成。


    但是，为什么我们需要一个单独的库来进行集成呢？嗯，`scikit-learn`不直接支持堆叠。你仍然可以自己编写，但那样你就必须自己维护它。`ML-Ensemble`提供了一种通用的集成估计器的方法，并且有合理的文档。即使你决定不在生产代码中使用它，它也值得探索。该
    API 可以帮助你非常快速地尝试不同的集成。


    让我们通过`mlens`构建一个堆叠集成。回想一下，**堆叠**通过一个元学习器组合多个分类或回归估计器。第一层估计器基于完整的训练集进行训练，然后元学习器在第一层估计器预测的输出上进行训练。


    首先设置数据。我们将使用`make_moons`数据集。如果你不知道，`make_moons`是一个简单的玩具数据集，它生成两个半圆交错的数据。


    ```

    # ---Data setup----

    import numpy as np

    from sklearn.metrics import accuracy_score

    from sklearn.datasets import make_moons

    seed = 42

    X, y = make_moons(n_samples=10000,noise=0.4, random_state=seed)

    # --- 1\. Initialize ---

    from mlens.ensemble import SuperLearner

    ensemble = SuperLearner(scorer=accuracy_score, random_state=seed)

    # --- 2\. Build the first layer ---

    ensemble.add([RandomForestClassifier(random_state=seed), SVC(random_state=seed)])

    # --- 3\. Attach the final meta learner

    ensemble.add_meta(LogisticRegression())

    # --- Train ---

    ensemble.fit(X_train, y_train)

    # --- Predict ---

    preds = ensemble.predict(X_test)

    Listing 5-1

    Stacked ensemble via mlens

    ```


    现在，让我们浏览一下代码。集成本质上是一个三步过程。


    ![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig1_HTML.jpg](images/489264_1_En_5_Chapter/489264_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Single layer stacked ensemble


    1. 初始化集成，这里是`SuperLearner`。

    2. 添加中间估计器。这里我们添加了两个分类器：`RandomForest`和`SVM`。请注意，它们将并行执行。

    3. 添加元学习器，这里是`LogisticRegression`。

    4. 调用`fit`方法并进行预测。从视觉上看，它可以如图 [5-1](#489264_1_En_5_Chapter.xhtml#Fig1) 所示。


    这感觉不就像设置一个神经网络，我们堆叠层来构建网络吗？


    要检查层中估计器的性能，请调用`data`属性。


    ```

    print("Fit data:\n%r" % ensemble.data)

    Fit data:

    score-m score-s ft-m ft-s pt-m  pt-s

    layer-1  randomforestclassifier     0.84    0.00 0.06 0.00 0.01 0.00

    layer-1  svc                        0.86    0.00 0.14 0.00 0.06 0.00

    ```


    第一列`score-m`包含分数。后缀`-m`表示平均值，`-s`表示跨折的标准差（为简洁起见）。`ft`和`pt`分别代表拟合时间和预测时间。我们鼓励你阅读文档以获取更多信息。请注意，我们在`SuperLearner`初始化时提供了评分函数。如果我们可以在第一层添加两个估计器，那么你可以在任何层添加更多估计器也就不足为奇了。


    ### 多层集成


    添加多层同样直接。我们只需要调用`add`函数来添加一个新层。请注意，层是按顺序执行的。然而，在一个层内，估计器可以并行运行。


    ```

    ensemble = SuperLearner(scorer=accuracy_score, random_state=seed, verbose=2)

    # Build the first layer

    ensemble.add([RandomForestClassifier(random_state=seed), LogisticRegression(random_state=seed)])

    # Build the 2nd layer

    ensemble.add([LogisticRegression(random_state=seed), SVC(random_state=seed)])

    # Attach the final meta estimator

    ensemble.add_meta(SVC(random_state=seed))

    ```


    图 [5-2](#489264_1_En_5_Chapter.xhtml#Fig2) 是集成的可视化表示。


    ![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig2_HTML.jpg](images/489264_1_En_5_Chapter/489264_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    Multilayer stacked ensemble


    ### 集成模型选择


    为了充分利用集成中的学习能力，进行超参数调优非常重要，将基学习器的参数视为集成的参数。元学习器是集成的关键部分，但是你如何选择合适的元学习器呢？如果每次都必须评估整个集成，那么选择合适的元学习器的任务将变得计算密集。


    这个问题的一个可能的解决方法是，将集成的较低层视为预处理管道，然后仅对较高层或元学习器执行模型选择。将预处理管道视为只评估一次的缓存结果。为了将集成用于此目的，在拟合之前将`model_selection`参数设置为`True`。这将修改`transform`方法的行为，并确保在测试折上调用`predict`。


    在我们查看模型选择的端到端代码之前，你还需要了解一些库组件。


    #### 评分函数


    我们需要将评分函数包装在`mlens`的`make_scorer()`函数中。


    这本质上是从性能指标或损失函数创建一个评分器。


    ```

    from mlens.metrics import make_scorer

    accuracy_scorer = make_scorer(accuracy_score, greater_is_better=True)

    ```


    `greater_is_better`参数的值`True`表示`accuracy`，而`False`表示`error/loss`。


    但是为什么我们需要这样做？这是为了确保所有学习器的评分方式相同。


    `make_scorer`包装器是`scikit-learn`的`sklearn.metrics.make_scorer()`的副本。`sklearn`的`make_scorer`是一个工厂函数，用于包装评分函数，以便在`GridSearchCV`和`cross_val_score`中使用。它接受一个评分函数，例如`accuracy_score`、`mean_squared_error`、`adjusted_rand_index`或`average_precision`，并返回一个可调用对象，该对象对估计器的输出进行评分。所以，为了不让你在这里迷失，请记住我们的目标是找到合适的元学习器。既然你知道如何使评分一致，让我们讨论一下库如何管理处理管道。


    #### 评估器


    `mlens`的`Evaluator`类允许你跨多个预处理管道并行地对多个模型进行网格搜索。`Evaluator`类预拟合转换器，从而避免在相同数据上重复拟合相同的预处理管道。让我们浏览一下代码以更好地理解它。为简洁起见，我们跳过了一些常见且显而易见的代码。


    ```

    from mlens.model_selection import Evaluator

    from scipy.stats import randint

    from sklearn.naive_bayes import GaussianNB

    from sklearn.neighbors import KNeighborsClassifier

    ```


    现在我们需要命名估计器。


    ```

    ests = [(''gnb'', GaussianNB()), (''knn'', KNeighborsClassifier())]

    ```


    然后我们准备参数列表。这与你在网格搜索或随机搜索中所做的没有什么不同。请注意，`GNB`没有被包含，因为它没有任何参数。


    ```

    pars = {''n_neighbors'': randint(2, 20)}

    params = {''knn'': pars}

    ```


    我们现在可以通过调用`evaluate`方法对这些估计器和参数分布运行评估。


    ```

    evaluator = Evaluator(scorer=accuracy_scorer, cv=10)

    evaluator.fit(X, y, ests, params, n_iter=10)

    ```


    你可以通过`Evaluator`的`cv_results`和`summary`属性检查结果和摘要。'
  raw: '## ML-Ensemble


    ML-Ensemble, also known as mlens, is an open source Python library for building
    scikit-learn-compatible ensemble estimators.


    You can install it via pip.


    ```

    pip install mlens

    ```


    The API style to build the ensembles is very similar to libraries like Keras.
    It offers a very simple and straightforward way to build deep ensembles with complex
    interactions.


    But, why do we need a separate library for ensembling? Well, scikit-learn does
    not support stacking directly. You can still write it, but then you will have
    to maintain it yourself. ML-Ensemble offers a generic way to ensemble estimators
    and has reasonable documentation. It is worth exploring, even if you decide to
    not use it in production code. The API helps you experiment with different ensembles
    very quickly.


    Let’s build a stacked ensemble via mlens. Recall that **stacking** combines multiple
    classification or regression estimators via a metalearner. The first-level estimators
    are trained based on a complete training set, and then the metalearner is trained
    on the output of the first-layer estimators’ predictions.


    Let’s set up the data first. We will use the make_moons dataset. In case you don’t
    know, make_moons is a simple toy dataset that makes two half interleaving circles.


    ```

    # ---Data setup----

    import numpy as np

    from sklearn.metrics import accuracy_score

    from sklearn.datasets import make_moons

    seed = 42

    X, y = make_moons(n_samples=10000,noise=0.4, random_state=seed)

    # --- 1\. Initialize ---

    from mlens.ensemble import SuperLearner

    ensemble = SuperLearner(scorer=accuracy_score, random_state=seed)

    # --- 2\. Build the first layer ---

    ensemble.add([RandomForestClassifier(random_state=seed), SVC(random_state=seed)])

    # --- 3\. Attach the final meta learner

    ensemble.add_meta(LogisticRegression())

    # --- Train ---

    ensemble.fit(X_train, y_train)

    # --- Predict ---

    preds = ensemble.predict(X_test)

    Listing 5-1

    Stacked ensemble via mlens

    ```


    Now, let’s go through the code. The ensembling is essentially a three-step process.


    ![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig1_HTML.jpg](images/489264_1_En_5_Chapter/489264_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Single layer stacked ensemble


    1.  Initialize the ensemble, which is `SuperLearner` here.


    2.  Add the intermediate estimators. Here we are adding two classifiers: `RandomForest`
    and `SVM`. Note that they will execute in parallel.


    3.  Add the metalearner, which is `LogisticRegression` here.


    4.  Call the fit method and do the predictions. Visually, it can be represented
    as shown in Figure [5-1](#489264_1_En_5_Chapter.xhtml#Fig1).


    Doesn’t it feel like setting up a neural network where we stack layers to build
    the network?


    To check the performance of the estimator in the layers, call the `data` attribute.


    ```

    print("Fit data:\n%r" % ensemble.data)

    Fit data:

    score-m score-s ft-m ft-s pt-m  pt-s

    layer-1  randomforestclassifier     0.84    0.00 0.06 0.00 0.01 0.00

    layer-1  svc                        0.86    0.00 0.14 0.00 0.06 0.00

    ```


    The first column, score-m, contains the score. The suffix -`m` denotes mean values,
    and -`s` denotes standard deviation across folds for brevity. `ft` and `pt` stand
    for fit time and prediction time, respectively. We encourage you to read the documents
    for further information. Note that we provided the scoring function during superlearner
    initialization. If we can add two estimators at the first layer, then it should
    not be a surprise that you can add more estimators at any layer.


    ### Multilayer Ensembles


    Adding multiple layers is equally straightforward. We just need to call the `add`
    function to add a new layer. Note that layers are executed in sequence. However,
    within a layer, estimators can run parallel.


    ```

    ensemble = SuperLearner(scorer=accuracy_score, random_state=seed, verbose=2)

    # Build the first layer

    ensemble.add([RandomForestClassifier(random_state=seed), LogisticRegression(random_state=seed)])

    # Build the 2nd layer

    ensemble.add([LogisticRegression(random_state=seed), SVC(random_state=seed)])

    # Attach the final meta estimator

    ensemble.add_meta(SVC(random_state=seed))

    ```


    Figure [5-2](#489264_1_En_5_Chapter.xhtml#Fig2) is a visual representation of
    the ensemble.


    ![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig2_HTML.jpg](images/489264_1_En_5_Chapter/489264_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    Multilayer stacked ensemble


    ### Ensemble Model Selection


    To fully exploit the learning capacity in an ensemble, it is important to conduct
    hyperparameter tuning, treating the base learner’s parameters as the parameters
    of the ensemble. Metalearner is the critical part of the ensemble, but how would
    you select an appropriate metalearner? The task of selecting the appropriate metalearner
    becomes computationally intensive if the entire ensemble has to be evaluated each
    time.


    One possible workaround for this problem is to treat the lower layers of an ensemble
    as a preprocessing pipeline, and then only performing model selection on higher-order
    layers or metalearners. Think of preprocessing pipelines as cached results that
    are evaluated only once. To use an ensemble for this purpose, set the `model_selection`
    parameter to `True` before fitting. This will modify how the `transform` method
    behaves and ensure that `predict` is called on test folds.


    Before we look at the end-to-end code for model selection, there are few more
    library pieces that you need to understand.


    #### The Scoring Function


    We need to wrap the scoring function inside the mlens **make_scorer()** function.


    This essentially makes a scorer from a performance metric or loss function.


    ```

    from mlens.metrics import make_scorer

    accuracy_scorer = make_scorer(accuracy_score, greater_is_better=True)

    ```


    The true value of the `greater_is_better` parameter indicates `accuracy,` whereas
    False indicates `error/loss`.


    But why do we need to do it? This is required to ensure that all learners scoring
    is done in the same way.


    The `make_scorer` wrapper is a copy of scikit-learn’s **sklearn.metrics.make_scorer()**
    . sklearn make_scorer is a factory function that wraps scoring functions for use
    in GridSearchCV and cross_val_score. It takes a score function, such as **accuracy_score,**
    **mean_squared_error**, **adjusted_rand_index**, or **average_precision** and
    returns a callable that scores an estimator’s output. So that you are not lost
    here, remember that our objective is to find the appropriate metalearners. Now
    that you know how to make scoring consistent, let’s discuss how the library manages
    the processing pipeline .


    #### Evaluator


    The mlens Evaluator class allows you to grid search several models in parallel
    across several preprocessing pipelines. The evaluator class prefits transformers,
    thus avoiding fitting the same preprocessing pipelines on the same data repeatedly.
    Let’s go through the code to understand it better. We have skipped some of the
    common and obvious code for brevity.


    ```

    from mlens.model_selection import Evaluator

    from scipy.stats import randint

    from sklearn.naive_bayes import GaussianNB

    from sklearn.neighbors import KNeighborsClassifier

    ```


    Now we need to name the estimators.


    ```

    ests = [(''gnb'', GaussianNB()), (''knn'', KNeighborsClassifier())]

    ```


    Then we prepare the parameters list. This is no different from what you do during
    a grid or random search. Note that GNB is not included because it doesn’t have
    any parameters.


    ```

    pars = {''n_neighbors'': randint(2, 20)}

    params = {''knn'': pars}

    ```


    We can now run an evaluation over these estimators and parameter distributions
    by calling the `evaluate` method .


    ```

    evaluator = Evaluator(scorer=accuracy_scorer, cv=10)

    evaluator.fit(X, y, ests, params, n_iter=10)

    ```


    You can check the results and summary via Evaluator’s `cv_results` and `summary`
    properties.'
