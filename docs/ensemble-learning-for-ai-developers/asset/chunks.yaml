  trans: '

    ### Microsoft LightGBM


    LightGBM 是一个基于决策树算法的快速、分布式、高性能梯度提升框架。它可用于排序、分类以及许多其他机器学习任务。


    如果你关注 Kaggle 竞赛，那么你一定了解 Boosting 的强大与流行。作为先驱的 XGBoost 已成为赢得 Kaggle 竞赛的标准算法。然而，在处理大规模数据时，XGBoost
    的训练时间会急剧增加。LightGBM 解决了可扩展性和速度问题，同时显著降低了内存消耗。值得记住的是，XGBoost 和 LightGBM 都是 GBT（梯度提升）的具体实例，它们都实现了相同的基础算法；然而，它们各自引入了不同的技巧，以使训练更高效或提升性能。它被设计为分布式且高效的，具有以下优势。


    *   更快的训练速度和更高的效率

    *   更低的内存使用

    *   更好的准确性

    *   支持并行和 GPU 学习

    *   能够处理大规模数据


    #### 为什么 LightGBM 架构最佳


    XGBoost 和 LightGBM 同属梯度提升决策树（GBDT）家族，因此具有相似的架构。在此，我们重点介绍使 LightGBM 能够训练出精确模型的架构思想。


    ##### 树的生长


    为了分裂和训练每个单独的决策树，可以采用两种策略：按层生长和按叶生长。


    按层生长策略维护一棵平衡树。平衡树是指每个叶子节点与根节点的“距离”都不超过其他任何叶子节点。本质上，所有叶子节点到根节点的距离相同。你可以在图 5-12
    中看到，分裂确保了树保持平衡。


    ![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig12_HTML.jpg](img/489264_1_En_5_Fig12_HTML.jpg)


    图 5-12


    按层树分裂策略（来源：[`https://mlexplained.com`](https://mlexplained.com)）


    按叶生长策略会分裂那个使损失减少最多的叶子节点（见图 5-13）。这使得训练更加灵活，尽管容易过拟合。LightGBM 按叶生长树。它选择具有最大 delta
    损失的叶子节点进行生长。在保持叶子节点数量固定的情况下，按叶算法往往比按层算法实现更低的损失。有趣的是，按叶生长曾是 LightGBM 的独有特性，但 XGBoost
    也已实现了这种生长策略。


    ![../images/489264_1_En_5_Chapter/489264_1_En_5_Fig13_HTML.jpg](img/489264_1_En_5_Fig13_HTML.jpg)


    图 5-13


    按叶树分裂策略（来源：[`https://mlexplained.com`](https://mlexplained.com)）


    ##### 寻找最佳分裂点


    为每个叶子节点找到最佳分裂点是训练 GBDT 的关键挑战。


    你可以使用暴力方法，遍历每个特征来寻找最佳分裂点，但这既不可扩展也不实用。


    想象一个包含数百万文档和百万词汇量大小的数据集。GBDT 在 tf-idf 矩阵上进行训练将耗费无尽的时间。唯一可行的方法是以某种方式近似最佳分裂点。让我们看看几种实现此目标的策略。


    ###### 基于直方图的方法


    基于直方图的方法将特征分组到一组箱（bin）中，并在箱上执行分裂，而不是在特征上。这有助于加速训练并降低复杂度，因为可以在构建每棵树之前对特征进行分箱。请注意，要使此方法有效，必须预先对特征进行排序。


    ###### 处理缺失值


    鉴于 LightGBM 经常用于表格或文本数据，其输入往往是稀疏的。一种可能的选项是忽略缺失值，然后将其分配给能够减少损失的分裂的任意一侧。当 `zero_as_missing`
    参数设置为 `True` 时，这就是 LightGBM 的做法。它将所有零值视为缺失值。


    ###### 基于梯度的单边采样


    通常观察到，并非所有特征在训练中都扮演重要角色。此类特征的梯度较低。LightGBM 专注于具有高梯度的数据点（即，在寻找最佳分裂点时，它倾向于忽略低梯度特征）。然而，这带来了采样偏差的固有风险。为了缓解这些问题，LightGBM
    应用了两个技巧：随机采样梯度较小的数据，以及重要性采样。这实质上是在计算小梯度样本对损失变化的贡献时，增加了它们的权重。


    ###### 互斥特征捆绑


    互斥特征捆绑是一种利用大规模数据集稀疏性的技术。鉴于稀疏性，某些特征永远不会同时非零；例如，Python 和政治在一篇文档中同时出现的几率非常小。它们可以“捆绑”成一个单一特征，而不会丢失任何信息。寻找最佳捆绑是一个
    NP 难问题，因此，LightGBM 使用一种近似技术，该技术允许特征捆绑内非零元素之间存在一定程度的重叠。深入探讨该近似的细节在此价值不大，但如果你感兴趣，可以在
    [`www.microsoft.com/en-us/research/wp-content/uploads/2017/11/lightgbm.pdf`](http://www.microsoft.com/en-us/research/wp-content/uploads/2017/11/lightgbm.pdf)
    阅读完整论文。


    现在你已经对 LightGBM 的工作原理有了更多了解，理解其参数应该很容易了。


    #### 参数


    毫不意外，参数的格式是 `key1=value1 key2=value2 ....`。它可以在配置文件和命令行中设置。使用命令行时，参数在 = 前后不应有空格。使用配置文件时，一行只能包含一个参数。你可以使用
    # 来添加注释。


    如果某个参数同时出现在命令行和配置文件中，LightGBM 将使用命令行中的参数。此处不再列出参数，请阅读 [`https://lightgbm.readthedocs.io/en/latest/Parameters.html`](https://lightgbm.readthedocs.io/en/latest/Parameters.html)
    上的文档。

