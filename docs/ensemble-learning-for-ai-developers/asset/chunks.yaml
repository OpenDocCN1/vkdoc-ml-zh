    fitting process. These transformers work well on Dask collections (dask.array,
    dask.dataframe), NumPy arrays, or Pandas dataframes. Again, to reiterate, why
    use Dask for preprocessing? Well, it fits and transforms in parallel.


    Table [6-1](#489264_1_En_6_Chapter.xhtml#Tab1) lists some of the transformers
    that are (mostly) drop-in replacements for their scikit-learn counterparts.


    Table 6-1.


    Dasks drop-in transformer replacements for scikit-learn counterparts


