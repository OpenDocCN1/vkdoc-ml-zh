- fmt: '### Hyperparameter Tuning Ensembles


    So far, you have seen two examples of training different machine learning models
    and combining their output. Hyperparameter tuning ensemble is another way to get
    ensemble output. Instead of relying on different models to make ensemble models,
    you use a good machine learning model and train this model using different hyperparameter
    settings.


    Figure [3-2](#489264_1_En_3_Chapter.xhtml#Fig2) uses the same machine learning
    model—a random forest, but instantiates three instances of this model with different
    hyperparameter settings. In the random forest algorithm, one of the most important
    hyperparameters is the number of trees, called `n_estimators` in the `scikit-learn`
    API. Three different random forests are trained with varying numbers of trees
    (10, 50, and 100, respectively). Similarly, the number of training data cycles,
    or `epochs`, that this model is trained on also differs for each of the three
    instances. The output of these instances is then combined using previous techniques
    (e.g., voting or averaging) to get an ensembled output.


    ![../images/489264_1_En_3_Chapter/489264_1_En_3_Fig2_HTML.jpg](images/489264_1_En_3_Chapter/489264_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    Hyperparameter tuning ensembles


    Listing [3-3](#489264_1_En_3_Chapter.xhtml#PC3) trains a random forest using three
    different parameters (i.e., the number of trees or `n_estimators`) to get a combined
    result using voting.


    ```

    from sklearn.model_selection import train_test_split

    from sklearn.model_selection import GridSearchCV

    from sklearn.datasets import load_breast_cancer

    import numpy as np

    X, y = load_breast_cancer(return_X_y=True)

    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.3, stratify=y,
    random_state=0)

    ### Random Forest Classifier

    from sklearn.ensemble import RandomForestClassifier

    rf_1 = RandomForestClassifier(random_state=0, n_estimators=10)

    rf_1.fit(X_train, y_train)

    rf_2 = RandomForestClassifier(random_state=0, n_estimators=50)

    rf_2.fit(X_train, y_train)

    rf_3 = RandomForestClassifier(random_state=0, n_estimators=100)

    rf_3.fit(X_train, y_train)

    # combine all three Voting Ensembles

    from sklearn.ensemble import VotingClassifier

    estimators = [(''rf_1'', rf_1), (''rf_2'', rf_2), (''rf_3'', rf_3)]

    ensemble = VotingClassifier(estimators, voting="hard")

    ensemble.fit(X_train, y_train)

    print("rf_1.score: ", rf_1.score(X_test, y_test))

    # Output: rf_1.score: 0.935672514619883

    print("rf_2.score: ", rf_2.score(X_test, y_test))

    # Output: rf_1.score: 0.9473684210526315

    print("rf_3.score: ", rf_3.score(X_test, y_test))

    # Output: rf_3.score: 0.9532163742690059

    print("ensemble.score: ", ensemble.score(X_test, y_test))

    # Output: ensemble.score:  0.9415204678362573

    Listing 3-3

    Hyperparameter Tuning Ensembles

    ```


    ### Horizontal Voting Ensembles


    The previous examples of mixing models —voting, averaging, and hyperparameter
    tuning—work very effectively in classical machine learning. But sometimes we encounter
    situations (especially in deep learning) in which our training data size, training
    data time, and model size are very large. There might be cases where training
    takes too much computation and time. In these cases, it is not practically possible
    to train multiple ensembles of models in a short amount of time. For example,
    a deep learning model could take two or three days in convergence on a powerful
    GPU machine if trained on a dataset like ImageNet. In situations like this, it
    is often impractical or cost-prohibitive to train multiple models and multiple
    instances of the same model with different hyperparameters. So, one of the techniques
    that you can try is horizontal voting.


    Whenever you run a long machine learning job, you could encounter dilemma that
    after certain number of epoch of training if model accuracy has stopped improving
    or not. In cases like this, it becomes difficult to select an accurate epoch time
    for a model. In a horizontal voting ensemble (see Figure [3-3](#489264_1_En_3_Chapter.xhtml#Fig3)),
    you save models after a minimum number of epochs (here, epoch = 300). The resulting
    models are recombined using voting techniques to get an accuracy boost.


    ![../images/489264_1_En_3_Chapter/489264_1_En_3_Fig3_HTML.jpg](images/489264_1_En_3_Chapter/489264_1_En_3_Fig3_HTML.jpg)


    Figure 3-3


    Horizontal voting ensembles


    Take a look at Listing [3-4](#489264_1_En_3_Chapter.xhtml#PC4) where we have implemented
    horizontal voting ensembles using `keras`, `tensorflow` and `scikit-learn` libraries.'
