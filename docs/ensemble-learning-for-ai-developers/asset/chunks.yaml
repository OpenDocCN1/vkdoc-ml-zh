  trans: '

    # 2. 混合训练数据


    在第 1 章中，你了解到数据科学家的角色类似于一位乐团首席，他利用整个管弦乐团和乐器来谱写优美的乐章。同样地，如果数据科学家想从数据和模型中榨取出世界级的表现，他也可以使用多种集成工具。本章的主要目标是学习混合训练数据的不同方法，以构建集成模型。


    以下是本章的学习目标。


    *   直观理解混合训练数据如何能在集成学习中带来良好表现

    *   介绍决策树

    *   查看使用 scikit-learn 实现决策树的示例

    *   介绍随机森林作为决策树的集合

    *   通过代码示例学习数据集采样及其两种变体：无放回采样和有放回采样

    *   通过代码示例学习装袋法（自助聚合）

    *   学习交叉验证技术：*k* 折交叉验证和分层 *k* 折交叉验证


    让我们从学习为什么混合数据是有用的开始。查尔斯·达尔文发现，如果一个物种没有足够的遗传多样性，它更容易灭绝。为什么会这样？如果所有成员都具有相同的基因，那么该物种在面对意外的自然灾害和疾病时会更加脆弱，因为每个成员对意外事件的抵抗力都相同。


    一个物种如何自然地发展出足够的遗传多样性？当种群被分割并在不同的环境条件下进化时，就会自然产生足够的遗传多样性。这确保了如果物种遇到不利且意外的环境，至少有一部分物种具有更强的韧性；因此，从整体上保证了物种的生存。将种群分成不同的群体，并让它们暴露在不同的环境中，会导致种群以略微不同的方式进化，从而增加遗传多样性。


    将同样的知识应用于机器学习，如果你使用全部训练数据训练单个模型，那么当现实世界的测试数据分布与训练数据相似时，该机器学习模型可能表现良好。如果你使用的数据分布与训练数据不够相似，就可能遇到问题。为了解决这个问题，一个好方法是将训练数据分成不同的子集，并在不同的数据子集上训练多个模型。由于每个模型拥有不同的训练数据分布，因此每个模型都具有略微不同的推理（现实世界表现）特性。然后，我们可以通过集成这些模型来组合它们，从而获得比单个模型更好的结果。这被称为**混合训练数据**。


    ## 决策树


    让我们通过一个名为**决策树**的机器学习模型示例来学习如何混合数据（见图 2-1）。


    ![../images/489264_1_En_2_Chapter/489264_1_En_2_Fig1_HTML.jpg](img/489264_1_En_2_Fig1_HTML.jpg)


    图 2-1


    简单决策树


    决策树是一种自上而下的流程图式方法，从顶部节点开始。每个节点代表一个需要基于一个或多个参数/变量做出的决策。你遍历这些节点，直到达到足够的深度，该深度基于你想要训练的参数量。


    让我们从一个示例数据集开始，探索如何将决策树应用于它。


    鸢尾花数据集是机器学习社区中广泛使用的标准数据集。图 2-2 展示了鸢尾花数据集的决策树。我们的任务是将鸢尾花分为三种不同的花卉物种。该数据集包含三种鸢尾花各
    50 个样本。每个样本包含以下参数：花萼长度、花萼宽度、花瓣长度、花瓣宽度。


    示例决策树是通过考虑四个参数中的两个（花萼长度和花萼宽度）创建的；所有叶节点都被分配到一个花卉物种类别。


    ![../images/489264_1_En_2_Chapter/489264_1_En_2_Fig2_HTML.jpg](img/489264_1_En_2_Fig2_HTML.jpg)


    图 2-2


    鸢尾花数据集的决策树


    决策树在实践中是通过从数据集中取一个样本来应用的。树遍历从顶部节点开始划分样本，并根据每个节点的条件进入不同的桶。每个节点基于一个答案，然后进入左节点或右节点。它从那里开始，通过持续应用条件测试进行下去。最终到达底部的叶节点，在那里得到最终的分类结果。


    要训练决策树，你可以使用 scikit-learn Python 库。代码清单 2-1 展示了如何使用 Python 的 scikit-learn 库训练决策树。


    ```

    from sklearn.datasets import load_iris

    from sklearn.tree import DecisionTreeClassifier

    from sklearn.model_selection import train_test_split

    X, y = load_iris(return_X_y=True)

    train_X, test_X, train_Y, test_Y = train_test_split(X, y, test_size = 0.2, random_state
    = 123)

    tree = DecisionTreeClassifier()

    tree.fit(train_X, train_Y)

    print(tree.score(test_X, test_Y))

    # 输出: 0.9333333333333333

    代码清单 2-1

    使用 scikit-learn 训练决策树

    ```


    决策树的深度越大，训练数据集的准确率就越高。


    但使用决策树存在主要问题。为了在你的数据集上获得足够的准确率，你需要一个更深（更大深度）的树，但随着树深度的增加，你会开始遇到过拟合，这会导致测试数据集的准确率降低。因此，你只能满足于一个准确率较低、较浅的决策树，或者一个过拟合的、深度更大的树。


    造成这个问题的原因之一是，用于决策的变量可能不足以从全局角度进行区分。


    解决这个问题的一个方法是使用多个决策树而不是一个。每个决策树应该使用不同的变量集或训练数据子集。然后，将这些决策树的输出组合成一个随机森林（见图 2-3）。


    ![../images/489264_1_En_2_Chapter/489264_1_En_2_Fig3_HTML.jpg](img/489264_1_En_2_Fig3_HTML.jpg)


    图 2-3


    鸢尾花数据集的随机森林，决策树数量 = 4


    顾名思义，**随机森林**由一组决策树组成，每棵树都在不同的训练数据集上进行训练。


    代码清单 2-2 是 Python scikit-learn 中随机森林的代码片段。

    '
- fmt: '```python

    from sklearn.datasets import load_iris

    from sklearn.ensemble import RandomForestClassifier

    from sklearn.model_selection import train_test_split

    X, y = load_iris(return_X_y=True)

    train_X, test_X, train_Y, test_Y = train_test_split(X, y, test_size = 0.1, random_state
    = 123)

    forest = RandomForestClassifier(n_estimators=8)

    forest = forest.fit(train_X, train_Y)

    print(forest.score(test_X, test_Y))

    # Output: 1.0

    rf_output = forest.predict(test_X)

    print(rf_output)

    # Output: [1 2 2 1 0 2 1 0 0 1 2 0 1 2 2]

    Listing 2-2

    Training Random Forest Using scikit-learn with Number of Decision Trees = 4

    ```


    A random forest from a set of decision trees offers the best of both worlds: better
    accuracy with shallower decision trees and less chance of overfitting.


    A random forest is one example of ensembles of decision trees. We take a single
    machine learning model (a decision tree) and train it with a mix of different
    training data and parameters to make an ensemble model.


    How do we combine training data in different ways to make a combined ensemble
    method? The devil is in the details!


    Let’s start with learning some basics, which you can skip or skim if you already
    know about it.


    First, we talk about sampling, which can be categorized in two ways: sampling
    without replacement (WOR) and sampling with replacement.


    ## Sampling a Dataset


    Sampling is the act of dividing a dataset. Let’s use an analogy of a fisherman
    who is fishing in a small pond with a limited number of fish. He wants to group
    the fish into different divisions. There are two ways he can do this: *sampling
    without replacement* and *sampling with replacement*.


    ### Sampling Without Replacement (WOR)


    Let’s say that the fisherman has two buckets. He takes the fish he caught from
    the pond and throws them into either of the two buckets. His dataset is divided
    into two distinct buckets. Using this method, there is never a case in which a
    single fish belongs in both buckets.


    The method of sampling where you divide your dataset into two or more disjointed
    sets is called **sampling without replacement** (see Figure [2-4](#489264_1_En_2_Chapter.xhtml#Fig4)).


    ![../images/489264_1_En_2_Chapter/489264_1_En_2_Fig4_HTML.jpg](images/489264_1_En_2_Chapter/489264_1_En_2_Fig4_HTML.jpg)


    Figure 2-4


    Sampling without replacement (WOR). There are no common samples from the original
    dataset


    Listing [2-3](#489264_1_En_2_Chapter.xhtml#PC3) shows how to get samples without
    replacement in Python’s scikit-learn.


    ```python

    from sklearn.utils import resample

    import numpy as np

    # Random seed fixed so result could be replicated by Reader

    np.random.seed(123)

    #data to be sampled

    data = [1, 2, 3, 4, 5, 6, 7, 8, 9]

    # Number of divisions needed

    num_divisions = 2

    list_of_data_divisions = []

    for x in range(0, num_divisions):

    sample = resample(data, replace=False, n_samples=5)

    list_of_data_divisions.append(sample)

    print(''Samples'', list_of_data_divisions)

    # Output: Samples [[8, 1, 6, 7, 4], [4, 6, 5, 3, 8]]

    Listing 2-3

