  超参数调优集成

  ```


  ### 水平投票集成


  前面混合模型的例子——投票、平均和超参数调优——在经典机器学习中非常有效。但有时我们会遇到（尤其是在深度学习中）训练数据规模、训练数据时间和模型规模都非常大的情况。可能存在训练需要大量计算和时间的情况。在这些情况下，在短时间内训练多个模型集成实际上是不可能的。例如，一个深度学习模型如果在像
  ImageNet 这样的数据集上训练，即使在强大的 GPU 机器上也可能需要两三天才能收敛。在这种情况下，训练多个模型以及同一模型的多个不同超参数实例通常是不切实际或成本高昂的。因此，你可以尝试的一种技术是**水平投票**。


  每当你运行一个长时间的机器学习任务时，你可能会遇到一个困境：在训练了特定轮次之后，模型准确率是否已经停止提升。在这种情况下，为模型选择一个准确的轮次时间变得困难。在水平投票集成中（见图
  3-3），你在达到最小轮次数（此处为 epoch = 300）后保存模型。然后使用投票技术重新组合生成的模型，以提高准确率。


  ![../images/489264_1_En_3_Chapter/489264_1_En_3_Fig3_HTML.jpg](img/489264_1_En_3_Fig3_HTML.jpg)


  图 3-3


  水平投票集成


  请查看清单 3-4，我们使用 keras、tensorflow 和 scikit learn 库实现了水平投票集成。




  ```

  #!pip install q keras==2.3.1 tensorflow==1.15.2

  import keras

  from keras.datasets import cifar10

  from keras.preprocessing.image import ImageDataGenerator

  from keras.models import Sequential

  from keras.models import load_model

  from keras.layers import Dense, Dropout, Activation, Flatten

  from keras.layers import Conv2D, MaxPooling2D

  import os

  import numpy

  from numpy import array

  from numpy import argmax

  from numpy import mean

  from numpy import std

  from sklearn.metrics import accuracy_score

  from keras.utils import to_categorical

  def make_dir(directory):

  if not os.path.exists(directory):

  os.makedirs(directory)

  # load models from file

  def load_all_models(n_start, n_end):

  all_models = list()

  for epoch in range(n_start, n_end):

  # define filename for this ensemble

  filename = "models/model_" + str(epoch) + ".h5"

  # load model from file

  model = load_model(filename)

  # add to list of members

  all_models.append(model)

  print(">loaded %s" % filename)

  return all_models

  # make an ensemble prediction for multi-class classification

  def ensemble_predictions(members, testX):

  # make predictions

  yhats = [model.predict(testX) for model in members]

  yhats = array(yhats)

  # sum across ensemble members

  summed = numpy.sum(yhats, axis=0)

  # argmax across classes

  result = argmax(summed, axis=1)

  return result

  # evaluate a specific number of members in an ensemble

  def evaluate_n_members(members, n_members, testX, testy):

  # select a subset of members

  subset = members[:n_members]

  # make prediction

  yhat = ensemble_predictions(subset, testX)

  # calculate accuracy

  return accuracy_score(testy, yhat)

  make_dir("models")

  batch_size = 32

  num_classes = 10

  epochs = 100

  num_predictions = 20

  model_name = "keras_cifar10_trained_model.h5"

  # The data, split between train and test sets:

  (x_train, y_train), (x_test, y_test) = cifar10.load_data()

  print("x_train shape:", x_train.shape)

  print(x_train.shape[0], "train samples")

  print(x_test.shape[0], "test samples")

  # Convert class vectors to binary class matrices.

  y_train = keras.utils.to_categorical(y_train, num_classes)

  y_test = keras.utils.to_categorical(y_test, num_classes)

  model = Sequential()

  model.add(Conv2D(32, (3, 3), padding="same", input_shape=x_train.shape[1:]))

  model.add(Activation("relu"))

  model.add(Conv2D(32, (3, 3)))

  model.add(Activation("relu"))

  model.add(MaxPooling2D(pool_size=(2, 2)))

  model.add(Dropout(0.25))

  model.add(Conv2D(64, (3, 3), padding="same"))

  model.add(Activation("relu"))

  model.add(Conv2D(64, (3, 3)))

  model.add(Activation("relu"))

  model.add(MaxPooling2D(pool_size=(2, 2)))

  model.add(Dropout(0.25))

  model.add(Flatten())

  model.add(Dense(512))

  model.add(Activation("relu"))

  model.add(Dropout(0.5))

  model.add(Dense(num_classes))

  model.add(Activation("softmax"))

  # initiate RMSprop optimizer

  opt = keras.optimizers.RMSprop(learning_rate=0.0001, decay=1e-6)

  # Let''s train the model using RMSprop

  model.compile(loss="categorical_crossentropy", optimizer=opt, metrics=["accuracy"])

  x_train = x_train.astype("float32")

  x_test = x_test.astype("float32")

  x_train /= 255

  x_test /= 255

  # fit model

  n_epochs, n_save_after = 15, 10

  for i in range(n_epochs):

  # fit model for a single epoch

  print("Epoch: ", i)

  model.fit(

  x_train,

  y_train,

  batch_size=batch_size,

  epochs=1,

  validation_data=(x_test, y_test),

  shuffle=True,

  )

  # check if we should save the model

  if i >= n_save_after:

  model.save("models/model_" + str(i) + ".h5")

  # load models in order

  members = load_all_models(5, 10)

  print("Loaded %d models" % len(members))

  # reverse loaded models so we build the ensemble with the last models first

  members = list(reversed(members))

  # evaluate different numbers of ensembles on hold out set

  single_scores, ensemble_scores = list(), list()

  for i in range(1, len(members) + 1):

  # evaluate model with i members

  y_test_rounded = numpy.argmax(y_test, axis=1)

  ensemble_score = evaluate_n_members(members, i, x_test, y_test_rounded)

  # evaluate the i''th model standalone

  _, single_score = members[i - 1].evaluate(x_test, y_test, verbose=0)

  # print accuracy of single model vs ensemble output

  print("%d: single=%.3f, ensemble=%.3f" % (i, single_score, ensemble_score))

  ensemble_scores.append(ensemble_score)

  single_scores.append(single_score)

  # Output:

  # 1: single=0.731, ensemble=0.731

  # 2: single=0.710, ensemble=0.728

  # 3: single=0.712, ensemble=0.725

  # 4: single=0.710, ensemble=0.727

  # 5: single=0.696, ensemble=0.724

  Listing 3-4

  水平投票集成

  ```


  ### 快照集成


  快照集成是水平投票集成的一种扩展。它不是在达到最低阈值后保存模型，而是修改模型本身的学习率。如果你阅读或实现过深度学习模型，可能已经了解这一现象。在训练机器学习模型时，通常希望从较高的初始学习率开始，然后逐渐降低学习率。


  在图 3-4 中，我们随着训练周期改变学习率。但通常，这种方法会留下大量优化空间，因为训练可能会停滞在任何局部最小值。


  针对这一局部最小值问题，一个领先的解决方案是**循环学习率**，即我们以循环方式增加和降低学习率。


  图 3-4 显示，每经过 400 个周期，我们将学习率重置为最大值，然后从那里开始降低学习率。


  ![../images/489264_1_En_3_Chapter/489264_1_En_3_Fig4_HTML.jpg](img/489264_1_En_3_Fig4_HTML.jpg)


  图 3-4


  快照集成


  如果你想了解更多关于快照集成的信息，请参考康奈尔大学 2017 年发表的论文，网址为[`https://arxiv.org/abs/1704.00109`](https://arxiv.org/abs/1704.00109)。在该论文的图
  1 中，展示了标准 SGD 优化器下的损失与学习率关系图。其中包含一个简单的学习率调度和一个循环学习率调度。当达到某个最小值时，我们只需以权重和偏置值的形式保存该时刻的模型状态，然后增加学习率（即迈出更大一步）。你可以将这一步视为一个跳跃点，用于在该图中落到不同位置，并开始寻找下一个最小值。最终，我们会得到一组错误率较低的模型。


  与水平投票集成类似，所有处于各个局部最小值状态的模型都会被组合起来。与单独使用单个模型相比，这种方法能产生非常好的模型。


