- '# 4. 混合组合


  在前几章中，我们讨论了如何混合训练数据，以及如何混合机器学习模型以创建更强大的模型——利用集成学习的力量。


  让我们继续这一学习过程。在本章中，我们将介绍并解释两种强大的集成学习技术，它们利用机器学习模型的混合组合来构建更强大的模型。我们将逐一探讨不同的组合方式。


  以下是本章的目标。


  *   介绍并解释**提升法**


  *   研究如何使用 scikit-learn 实现提升法


  *   介绍并解释**堆叠法**


