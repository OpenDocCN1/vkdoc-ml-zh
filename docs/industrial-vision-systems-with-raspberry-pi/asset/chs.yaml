  有了这些基础的 Python 概念作为基础，现在让我们继续学习两个常用于处理图像的 Python 库。




  ### Python 图像处理库（PIL）


  PIL 代表 Python Imaging Library，它是一个免费、开源的 Python 库，可以帮助我们处理不同的图像文件格式。PIL 于 2011 年停止更新，并且不支持
  Python 3。后来，一个名为 Pillow 的新库在 PIL 的基础上构建而成，它支持 Python 3，并且可以在所有操作系统上运行。Pillow 支持多种图像文件格式，例如
  jpeg、png、bmp、gif、tif 等。我们可以对图像执行各种操作，例如过滤、模糊、调整大小、裁剪、添加水印等。可以使用终端命令 *sudo apt-get
  install pillow* 将此库安装到我们的树莓派操作系统中。


  要读取和显示图像，我们可以分别使用 Pillow 库中的 `open()` 和 `show()` 函数。需要在 `open()` 函数内指定图像的文件名以及路径名，该函数将读取图像并创建一个我们指定名称的对象。然后，必须将该对象名称传递给
  `show()` 函数以显示图像。接着，我们可以使用实例属性来获取有关图像的更多详细信息，例如格式、大小和模式。`format` 属性告诉我们图像的类型，例如
  jpeg、png、bmp 等。`size` 属性提供一个包含图像宽度和高度的二元组（以像素为单位）。`mode` 属性给出图像中通道的名称，例如“L”表示灰度图像，“RGB”表示真彩色图像等。表
  3-11 中给出的代码说明了所有这些函数和属性。


  表 3-11


  使用 PIL 读取和显示图像


  | 代码 | 输出 |

  | --- | --- |

  | `from PIL import Image``a=Image.open("C:/Users/User/Pictures/Lenna.png")``a.show()``print("Format
  of a is:",a.format)``print("Size of a is:", a.size)``print("a belongs to category:",a.mode)`
  | ![](img/604620_1_En_3_Figa_HTML.jpg)一张略微放大的年轻女性的输出图像。`Format of a is: PNG``Size
  of a is: (512, 512)``a belongs to category: RGB` |


  我们可以看到该图像是一个 png 文件。图像的大小是 512,512，这意味着它的宽度为 512 像素，高度为 512 像素，并且属于 RGB 图像类别。Pillow
  库提供了许多函数来执行各种图像处理任务。我们将看到其中一些函数的实际应用，其余的函数留给读者自行探索。


  `crop()` 函数可用于从给定图像中获取一个子矩形区域。子矩形区域的边界由一个四元组指定，其坐标格式为：“crop(left, upper, right,
  lower)”。换句话说，我们指定子矩形左上角像素的行号和列号，然后是右下角像素的行号和列号。此操作在表 3-12 中进行了说明。


  表 3-12


  在 PIL 中裁剪图像


  | 代码 | 输出 |

