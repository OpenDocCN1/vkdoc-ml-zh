  ### 字段对话框与画布


  为便于理解，我们之前仅使用简单的标签来演示所讨论的控件。在本节中，我们将学习如何浏览文件、选择图像并将其显示在窗口中，这对于我们的视觉系统至关重要。我们将使用*字段对话框*控件来浏览图像，并使用*画布*控件来显示图像。图像也可以显示在*标签*控件中，但由于它是一个静态控件，无法与显示的图像进行进一步交互。因此，我们选择*画布*控件，这样我们可以在图像上绘制，或对图像进行缩放、旋转等变换操作。


  在以下代码中，我们使用一个按钮控件来打开用于选择图像的对话框控件，并使用一个*画布*控件来绘制图像。我们将根据要显示的图像尺寸来指定画布的宽度和高度。在本例中，我们使用与图像相同的尺寸，即
  512 x 512。在按钮动作对应的函数中，我们使用字段对话框控件的 *askopenfilename* 函数来浏览图像。在我们的代码中，*askopenfilename*
  函数接收三个参数作为输入。第一个参数是初始目录，字段对话框控件将在此目录中打开；第二个参数是对话框窗口上显示的文本；第三个参数是对话框中显示的文件类型。请注意，我们在函数中提供了两种文件类型：“.png”表示
  PNG 图像，“*.*”表示所有其他文件类型。因此，这两种类型将出现在对话框窗口的*文件类型*下拉菜单中，如图 6-9 (a) 所示。我们可以选择初始目录中的图像，也可以导航到其他目录选择图像。*askopenfilename*
  的返回结果将是图像的文件名及其路径。


  为了将文件显示在画布上，我们需要使用 tkinter 库中的 *PhotoImage* 函数来读取文件。但问题是，这个 *PhotoImage* 函数只支持 GIF
  和 PGM/PPM 格式，而我们常用的图像格式是 JPEG 和 PNG。解决这个问题的方法是使用 PIL 库中 *ImageTk* 类提供的替代 *PhotoImage*
  函数。我们首先使用 OpenCV 库的 *imread()* 函数读取图像。这样做的原因是，使用 OpenCV 读取图像时，图像会被读取为 numpy 数组，这允许我们对图像执行大量数值运算，正如我们在第
  5 章中讨论的那样。然后，我们使用 PIL 库中的 *fromarray()* 函数将图像转换为 PIL 图像文件格式，再使用同一库中的 *PhotoImage*
  函数将图像转换为可在画布控件中显示的图像对象。


  接下来，我们可以使用 *create_image* 函数在画布上绘制图像。函数中的前两个数字表示用于定位图像的 (x, y) 坐标。我们可以改变坐标来水平或垂直移动图像的位置。*anchor*
  值决定了图像中与坐标对齐的位置。例如，我们将锚点指定为“nw”，这意味着图像的西北锚点（左上角）将位于画布上的坐标 (0, 0) 处。配置画布后，使用 *PhotoImage*
  函数打开的图像被赋值给画布控件的 *image* 属性。最终在画布控件上显示的图像如图 6-9 (b) 所示。从本章此后的所有 GUI 插图开始，我们将使用一个倾斜锯片的图像。


  ```

  from tkinter import *

  from tkinter import filedialog

  from PIL import Image, ImageTk

  import cv2

  # 创建根窗口

  root = Tk()

  root.title(''带对话框的窗口'')

  # 定义按钮控件的动作

  def click():

  filename = filedialog.askopenfilename(initialdir="C:/Users/user/Pictures", title="浏览",
  filetypes=(("png 文件",

  "*.png"),("所有文件","*.*")))

  o_img = cv2.cvtColor(cv2.imread(filename), cv2.COLOR_BGR2RGB)

  c_img = ImageTk.PhotoImage(Image.fromarray(o_img))

  canvas.create_image(20,20,anchor="nw",image=c_img)

  canvas.image=c_img

  # 创建画布控件

  canvas = Canvas(root,width=500, height=500)

  canvas.pack()

  # 创建按钮控件

  mybutton = Button(root, text=''浏览'', command = click)

  mybutton.pack()

  root.mainloop()

  ```


