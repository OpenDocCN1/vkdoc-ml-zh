  列表是一个有序、可索引且可变的元素集合（元素可以是任何数据类型），元素之间用逗号分隔，并写在方括号内。列表的索引从 0 开始，可以通过索引访问列表中的特定元素。Python
  提供了许多列表方法，用于执行追加、移除、排序等操作，读者可以自行探索以熟练掌握列表操作。元组与列表类似，但有两个不同之处：元组是不可变的（值不能被更改），并且元组的元素（可以是任何数据类型）写在圆括号内。类似地，字符串是一个不可变的字母数字字符集合，写在单引号或双引号内。元组和字符串的索引方式与列表相同。与列表一样，元组和字符串也有一些预定义的方法可供读者探索。表
