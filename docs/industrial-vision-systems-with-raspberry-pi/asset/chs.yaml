  ### 单选按钮


  在本节中，我们将使用单选按钮将整数值推送到标签控件中。如下方代码所示，我们首先使用 *IntVar()* 函数定义一个变量 *r* 来保存整数数据，然后在定义单选按钮控件的操作时，使用
  *get()* 函数来检索该数据。接下来，我们用一个用户自定义函数来定义单选按钮控件的操作，在该函数中使用 *config()* 函数来更新标签控件。随后，我们使用
  *Radiobutton()* 函数创建单选按钮。该函数接收以下输入：单选按钮上要显示的文本、用于跟踪用户选择的控制变量、要分配给控制变量的值，以及点击单选按钮时要启动的操作。请注意，我们使用了
  Lambda 函数，它获取分配给控制变量 *r* 的值，并将其提供给我们之前定义的单选按钮操作函数。最后，我们创建一个文本为空的标签控件，并将其推送到窗口中。当我们点击一个单选按钮时，分配给该按钮对应控制变量的值就会显示在标签控件中，如图
  6-5 所示。


  ![](img/604620_1_En_6_Fig5_HTML.jpg)


  两个单选按钮窗口的截图。显示内容为“选项 1”和“选项 2”。左侧窗口选中了选项 1，右侧窗口选中了选项 2。


  图 6-5


  带有单选按钮控件生成标签文本的 GUI


  ```

  from tkinter import *

  # 创建一个窗口

  root = Tk()

  root.title("单选按钮窗口")

  r=IntVar() # 定义整数变量

  # 定义单选按钮的操作

  def clicked(value):

  mylabel.config(text=value)

  # 定义单选按钮

  Radiobutton(root, text="选项 1", variable=r,

  value=1,command=lambda: clicked(r.get())).pack()

  Radiobutton(root, text="选项 2", variable=r,

  value=2,command=lambda: clicked(r.get())).pack()

  # 定义标签

  mylabel = Label(root, text="")

  mylabel.pack()

  root.mainloop()

  ```




  ### 复选框


  与允许我们在多个选项中仅选一项的单选按钮不同，复选框允许我们同时选择多个选项。在如下所示的代码中，我们使用 *BooleanVar()* 函数与复选框关联，当选中对应按钮时，变量值会自动更新为
  *True*，取消选中时则更新为 *False*。在与按钮组件对应的动作函数中，我们生成与所选复选框对应的文本字符串，并将其追加到一个列表中。之所以追加到列表，是因为我们可以同时选择多个复选框，需要显示所有这些按钮对应的文本字符串。生成的文本字符串随后被配置到标签组件。我们还添加了一个默认文本，用于在未选中任何复选框时显示。与复选框选择对应的不同场景如图
  6-6 所示。


  ![](img/604620_1_En_6_Fig6_HTML.jpg)


  四个复选框窗口的截图。第一个窗口中，未选择任何选项。第二个复选框窗口中，选择了选项 1。第三个复选框窗口中，选择了选项 2。第四个复选框窗口中，选项 1 和选项
  2 都被选中。


  图 6-6


  使用复选框组件生成标签文本的图形用户界面


  ```

  from tkinter import *

  # 创建一个窗口

  root = Tk()

  root.title("复选框窗口")

  # 复选框的动作语句

  def generate_label():

  options = []

  if option1_var.get():

  options.append("选项 1")

  if option2_var.get():

  options.append("选项 2")

  if options:

  mylabel.config(text="已选选项: " + '', ''.join(options))

  else:

  mylabel.config(text="未选择任何选项")

  # 创建变量来存储复选框的状态

  option1_var = BooleanVar()

  option2_var = BooleanVar()

  # 创建复选框

  checkbutton1 = Checkbutton(root, text="选项 1", variable=option1_var, command=generate_label).pack()

  checkbutton2 = Checkbutton(root, text="选项 2", variable=option2_var, command=generate_label).pack()

  # 创建标签以显示已选选项

  mylabel = Label(root, text="未选择任何选项")

  mylabel.pack()

  root.mainloop()

  ```


