  引言


  近年来，由于视觉系统在检测产品质量方面具有非侵入性，工业界对其需求显著增长。工业视觉系统可应用于多种场景，例如识别表面缺陷和故障、验证组件方向和尺寸等。可以利用现代图像处理技术，如图像分割、阈值处理、轮廓提取、特征提取、目标检测、图像分析和帧分析，来创建用于工业质量检测的实时视觉系统。


  本书演示了如何使用 Raspberry Pi 实时实现工业视觉系统。本书旨在为研究生、研究人员和初级视觉工程师提供帮助。本书以介绍性章节开篇，为读者提供此类系统的概述。第二章向读者介绍
  Raspberry Pi 硬件，指导读者完成操作系统安装和摄像头设置，并附有 Python 软件的实践演示。第三章帮助读者学习和实践用于处理图像和视频的基本 Python
  库。


  第四章涵盖了开发标准工业视觉系统所涉及的挑战，包括摄像头的选择、放置位置以及所需的照明条件。第五章详细概述了基本的图像处理技术，从图像属性和类型等基本概念开始，逐步深入到滤波、形态学操作和阈值处理等高级图像操作。


  第六章专门介绍图形用户界面，让读者亲身体验如何使用 Python tkinter 库提供的各种小部件为视觉系统开发交互式用户界面。第七章向读者介绍主要的图像特征，如
  SIFT、SURF 和 FAST，并演示如何从原始图像中提取这些特征，用于识别、分割和匹配等应用。


  第八章讨论图像分割技术，这对大多数视觉系统至关重要，向读者介绍常用的分割技术，用于将图像分割成对象或区域。第九章专注于光学字符识别（OCR）系统，为读者提供使用领先云服务提供商提供的预训练
  API 和可用的 Python 库来开发此类系统的机会。


  第十章讨论机器学习算法，由于计算能力和内存规格的进步，这些算法得到了快速发展。本章快速介绍了传统的机器学习算法，然后详细讨论了神经网络，特别是常用于图像和视频应用的卷积神经网络（CNN）。


  在最后一章，即第十一章，读者将有机会利用本书积累的知识，使用 Raspberry Pi 板开发端到端的标准工业视觉系统。


