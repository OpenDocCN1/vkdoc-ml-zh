  company_label.grid(row=0, column=0, columnspan=4, padx=30, pady=0, sticky=\"ew\"\
  )\nversion_label = Label(root, text=\"版本 1.0\",bg=\"blue\")\nversion_label.grid(row=1,column=2,padx=0,pady=0,sticky=\"\
  e\")\nvision_label = Label(root, text=\"视觉系统\", font=(\"Helvetica\", 16,\"bold\"\
  ), fg=\"red\", bg=\"blue\")\nvision_label.grid(row=2, column=0, columnspan=3, padx=0,\
  \ pady=10, sticky=\"ew\")\n# 创建一个框架来容纳画布\nframe = Frame(root, width=800, height=800,\
  \ relief=\"ridge\", borderwidth=1, bg=\"blue\")\nframe.grid(row=3,column=0,padx=10,pady=0)\n\
  # 创建画布\nvideo_canvas1 = Canvas(frame, borderwidth=2, width=500, height=400, bg=\"\
  blue\")\nvideo_canvas1.grid(row=3,column=0,padx=5,pady=5)\nvideo_canvas2 = Canvas(frame,\
  \ borderwidth=2, width=500, height=400, bg=\"blue\")\nvideo_canvas2.grid(row=3,column=1,padx=5,pady=5)\n\
  video_canvas1.create_text(80, 10, text=\"视频源\", font=(\"Helvetica\", 10), anchor=\"\
  ne\")\nvideo_canvas2.create_text(110, 10, text=\"文本检测\", font=(\"Helvetica\", 10),\
  \ anchor=\"ne\")\n# 创建一个框架来显示提取的文本\nentry_frame = Frame(root, width = 200, height\
  \ = 400, bg=\"blue\")\nentry = Text(entry_frame, borderwidth=2, relief=\"ridge\"\
  , height=10, width=40)\nlabel = Label(entry_frame, text='检测到的文本', font=(\"Helvetica\"\
  , 18), fg=\"black\", bg=\"blue\")\nlabel.grid(row=0, column=0, padx=5, pady=25,\
  \ sticky=\"n\")\nentry.grid(row=1, column=0, padx=5, pady=25, sticky=\"w\")\nentry_frame.grid(row=3,\
  \ column=1, padx=5, pady=5)\n# 创建一个关闭按钮\nclose_button = Button(root, width=15, height=2,\
  \ borderwidth=2, relief=\"ridge\", text=\"退出\", command = close_window)\nclose_button.grid(row=4,\
  \ column=0, columnspan=2, padx=0, pady=50, sticky=\"n\")\n# 使用网络摄像头源更新视频画布的函数\n\
  def update_video_canvas():\nfor frame in camera.capture_continuous(cap, format='bgr',\
  \ use_video_port=True):\n# 在第一个画布中显示原始视频\norig_photo = ImageTk.PhotoImage(image\
  \ = Image.fromarray(frame))\nvideo_canvas1.create_image(0, 30, image=orig_photo,\
  \ anchor=NW)\nvideo_canvas1.photo = orig_photo\n# 使用 easyocr 进行文本检测\nimg, t = ocr_det(frame)\n\
  text_photo = ImageTk.PhotoImage(image = Image.fromarray(img))\nvideo_canvas2.create_image(0,\
  \ 30, image=text_photo, anchor=NW)\nvideo_canvas2.photo = text_photo\n# 将检测到的文本更新到文本输入控件\n\
  entry.delete(0.0, END)\nentry.insert(END, t)\nvideo_canvas1.after(10, update_video_canvas)\n\
  cap.truncate(0)\n# 打开树莓派摄像头\ncamera = PiCamera()\ncap = PiRGBArray(camera)\n# 调用\
  \ update_video_canvas 函数开始显示视频源\nupdate_video_canvas()\n# 启动 tkinter 主循环\nroot.mainloop()\n\
  ```\n\n## 总结\n\n恭喜你，你已经读到了本书的结尾！在本章中，我们为四个不同的工业应用开发了视觉系统：\n\n*   从螺母/螺栓图像中检测螺纹质量\n\
  \n*   从包含多个组件的图像中识别不匹配的组件\n\n*   检测给定螺母图像中的螺纹数量\n\n*   使用 OCR 技术从电子板中提取文本\n\n需要注意的是，本章开发的所有系统均在简单的室内环境中进行了测试。在真实的工业环境中实施相同的系统将面临其自身的一系列挑战。尽管如此，我们鼓励你利用本书所学知识，开发更多此类实时视觉系统。\n\
