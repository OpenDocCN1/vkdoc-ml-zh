  ### 按钮


  现在我们已经知道如何显示标签，接下来尝试使用按钮控件来生成标签。一个按钮控件需要两个要素：按钮上方的文本提示（说明其功能），以及按下按钮时需要执行的操作。在我们的例子中，生成标签的操作可以先用一个用户自定义函数来创建，如下方代码所示。操作定义好后，我们可以使用
  *Button()* 函数来创建按钮。在按钮函数中，*text* 选项用于提供文本提示，*command* 选项用于设置对我们创建的标签生成函数的调用。回想一下，我们需要使用
  *pack()* 函数将按钮推入主窗口。此外，我们还可以通过 *padx* 和 *pady* 选项来设置按钮的高度和宽度，从而自定义按钮。我们也可以使用 *fg*
  和 *bg* 选项分别设置前景色（按钮上文本的颜色）和背景色（按钮的颜色）。读者可以从官方文档中探索 *Button* 函数提供的其他配置选项。代码生成的窗口如图
