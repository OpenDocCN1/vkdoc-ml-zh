  布尔型数据类型仅包含两个值：true 和 false。该数据类型主要与条件语句相关联，其中应用于其他数据类型的条件运算符和逻辑运算符会生成一个布尔型数据类型，并基于该类型执行代码的子集。集合数据类型是一个无序的元素（其他数据类型）集合，元素之间用逗号分隔，并写在花括号内。集合的一个独特特性是不允许重复值。可以对集合执行并集、交集、差集和补集等集合运算。字典用于将数据点存储为键值对，键值对之间用逗号分隔，并写在花括号内。字典中的每个值只能通过其键来访问。这三种数据类型的简单示例如表
