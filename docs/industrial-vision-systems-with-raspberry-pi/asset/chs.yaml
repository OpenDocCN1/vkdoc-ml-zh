  本章让我们得以一窥工业视觉系统的世界，我们讨论了以下主题：


  *   计算机视觉系统入门简介，涉及其历史、与人类视觉的关联性及其应用

  *   工业视觉系统介绍，包括其需求、独特挑战、各种组件及可能的应用

  *   开发工业视觉系统所涉及步骤的分解


  在掌握了工业视觉系统的基本知识后，我们将开始更详细地探索相关概念。在下一章中，我们将学习并熟悉树莓派板，后续将用它来开发用于工业应用的独立视觉系统。接着，我们将熟悉
  Python 库提供的 OpenCV 包，然后在接下来的两章中讨论视觉系统实现中的挑战。我们将学习对实现视觉系统至关重要的图像处理技术基础，然后在接下来的两章中学习开发用户友好的图形用户界面（GUI）。一旦这些基本概念被覆盖，我们将在接下来的四章中开始讨论高级技术，如特征提取、图像分割、OCR
  和深度学习算法。最后，我们将在最后一章中，针对一些通用的工业用例，进行视觉系统的实时实现。


  在简要介绍了工业视觉系统之后，本书的其余章节将讨论构建一个可运行的工业视觉系统所涉及的每个工具和技术方面。在第 2 章中，我们将简要介绍树莓派板，然后介绍安装操作系统、设置环境以及将摄像头与板卡连接的过程。第
  3 章将让我们对 Python 社区提供的 OpenCV 包有一个总体了解。我们将从 Python 编程的简单介绍开始本单元。然后，我们将详细描述 NumPy
  数组，这一点非常重要，因为在处理不同的图像处理技术时，图像被视为数值数组。最后，我们将讨论 OpenCV 包及其提供的用于在 Python 中读取和可视化图像的函数。第
  4 章将涵盖实现视觉系统时面临的不同挑战，如照明要求、摄像头角度等。第 5 章将完全专注于图像处理，我们将讨论与图像处理相关的广泛算法和技术，以及 OpenCV
  包提供的用于实现这些技术的众多函数。第 6 章将介绍图像中的不同特征以及从给定图像中提取这些特征的可用技术。第 7 章将重点介绍图像分割，用于从给定图像中提取特定对象，这是一种可用于视觉系统的强大技术。另一种近年来应用日益广泛的技术是光学字符识别（OCR），可用于识别轴、齿轮、轴承等机械部件上的文本或数字。第
  8 章将完全致力于 OCR 技术。机器学习算法可以极大地提高视觉系统的准确性，因此，第 9 章将涵盖在视觉系统中占主导地位的各种学习算法。本书的最后一章将把前几章学到的所有技术应用于实时案例研究。


  '
- '# 2. 树莓派入门


  树莓派是伦敦树莓派基金会开发的一系列信用卡大小的单板计算机。这些微型计算机便携且价格低廉，并能与显示器、键盘和鼠标等其他硬件实现互操作，从而有效地将其转变为低成本
  PC。这些板卡最初是为教育目的而开发的，后来作为多功能设备变得越来越流行，并在机器人技术、网络管理、天气监测等各个领域找到了应用。它也成为具有计算机或电子背景的人开发业余项目的热门工具。本章首先简要介绍树莓派硬件的组件，让读者感受其能力。然后，深入探讨树莓派操作系统以及
  OpenCV 库的安装，接着是配置板卡以实现远程访问。本章最后演示了如何将摄像头连接到树莓派板，这将使我们能够实时捕获图像或视频。




  ## 树莓派主板与引脚详解


  树莓派主板的工作原理相当直接。它配备了一个板载处理器和 SDRAM，类似于普通计算机，但没有内部存储和额外外设。要使用该主板，我们需要将一张已安装操作系统的外部
  SD 卡插入主板上的指定插槽。操作系统设置完成后，树莓派便可连接鼠标、键盘等输入设备，以及电脑显示器或 HDMI 电视等输出设备，从而将其转变为一台可编程执行各种操作的
  PC。此外，树莓派主板还提供了多个通用输入/输出（GPIO）引脚，可用于连接传感器、LED、电机等各种设备。官方树莓派文档^(¹)中提供的主板引脚详情如图 2-1
  所示。


  目前市面上现有的树莓派主板提供一个 40 引脚的 GPIO 排针，包含 4 个电压引脚（两个 5V 引脚和两个 3.3V 引脚）、8 个接地引脚（不可配置）、2
  个 ID EEPROM（指定为 GPIO 0 和 1 引脚，但保留用于高级用途）以及 26 个 GPIO 引脚。被指定为输入引脚的 GPIO 可读取为高电平（3.3V）或低电平（0V）。同样，被指定为输出引脚的
  GPIO 可设置为高电平（3.3V）或低电平（0V）。这些 GPIO 引脚中的任何一个都可以通过软件指定为输入或输出引脚，并可用于多种用途。


  ![](img/604620_1_En_2_Fig1_HTML.jpg)


  树莓派的引脚配置图。它包括 3.3V 电源、GPIO、接地和 5V 电源。共有 28 个 GPIO 引脚（从 0 到 27）和 8 个接地引脚。


  图 2-1

  树莓派 GPIO 引脚图


