  # 启动 tkinter 主循环\nroot.mainloop()\n```\n\n## 案例研究 11.4：用于文本提取的 OCR 系统\n\n我们已经在第\
  \ 9 章详细讨论过 OCR 系统，并了解了实现它的不同方法。在本节中，让我们采用其中一种方法，实现一个完整的 OCR 系统，该系统能够从视频源中检测图像、提取图像中的文本并显示结果。我们将使用基于\
  \ EasyOCR Python 库的文本提取功能，同时显示来自摄像头的视频源，以及带有提取文本标注的图像和打印出的文本，所有这些都集成在我们于第 6 章构建的\
  \ GUI 中。\n\n首先，我们将基于 easyocr 的 OCR 代码转换为一个用户自定义函数，该函数以图像作为输入，并返回标注后的图像以及检测到的文本作为输出。该函数如下列代码所示。我们将其命名为\
  \ *ocr_det*，它接收由变量 *img* 表示的图像作为输入，并返回标注后的图像（即同一变量中的图像，上面标记了边界框和文本标签）以及由变量 *t* 表示的检测到的文本字符串。在函数内部，使用\
  \ *easyocr* 库中的 *Reader()* 方法创建读取器对象，然后使用该读取器对象的 *readtext*() 方法从图像中检测文本。该方法输出的结果由变量\
  \ *results* 表示，其中包含与图像中不同文本对象对应的多个边界框以及相应的文本字符串。我们遍历此输出，读取文本字符串并在同一输入图像上标记边界框和文本。我们在此添加的额外组件是变量\
  \ *t*，它在循环之前被初始化为空字符串。每次迭代时，*results* 变量中对应的文本都会被拼接到该变量中。\n\n```\nimport easyocr\n\
  import cv2\ndef ocr_det(img):\n# 创建读取器对象并从图像中提取文本\nreader = easyocr.Reader(['en'],gpu=False)\n\
  results = reader.readtext(img,paragraph=True)\n# 创建边界框并在图像上显示提取的文本\nt = ''\nfor\
  \ (bbox, text) in results:\n(tl, tr, br, bl) = bbox\nt += text  + '\\n'\ntl = (int(tl[0]),\
  \ int(tl[1]))\ntr = (int(tr[0]), int(tr[1]))\nbr = (int(br[0]), int(br[1]))\nbl\
  \ = (int(bl[0]), int(bl[1]))\ncv2.rectangle(img, tl, br, (0, 0, 255), 2)\ncv2.putText(img,\
  \ text, (tl[0], tl[1]-5),\ncv2.FONT_HERSHEY_PLAIN, 1,(0,0,255),2)\nreturn img, t\n\
  ```\n\n\n\n现在我们已经使用 *easyocr* 库编写了作为用户自定义函数的 OCR 系统代码，下一步是重新设计 GUI 以适应这一用例。以下代码展示了我们为\
  \ OCR 系统设计的新 GUI。该 GUI 包含两个框架。第一个框架由两个视频画布组成，一个用于显示捕获图像的原始视频，另一个用于显示文本提取后的图像，并在文本区域周围标记边界框及相应的文本标签。第二个框架包含一个用于显示文本输出标题的标签控件和一个用于显示从图像中提取的实际文本的文本控件。要调用我们之前创建的\
  \ *ocr_det* 函数，我们需要通过用于保存代码的文件名从代码中导入该函数。由于在我们的案例中，代码保存的文件名与函数名相同，因此我们按如下方式导入函数：*from\
  \ ocr_det import ocr_det*。导入所有必需的库并创建所有控件后，我们定义一个程序，从视频捕获对象中读取帧，然后应用 *ocr_det* 函数从图像中提取文本。如前所述，该函数将返回一个带有边界框和相应标签的标记图像，以及包含所有提取文本的文本字符串。原始视频帧显示在\
  \ *video_canvas1* 中，由函数创建的带有边界框和标签的帧显示在 *video_canvas2* 中，文本字符串则显示在文本控件中，如图 11-7\
  \ 所示。\n\n![](img/604620_1_En_11_Fig7_HTML.jpg)\n\n一张截图展示了检测光学字符识别的两张照片。a. 树莓派 3\
  \ 型号。b. 带有检测文本的树莓派 3 型号。其中包含一个消息框，显示文本“raspberry P I 3 model raspberry P I 2017\
  \ broad C C M”。\n\n图 11-7\n\nOCR 检测系统示意图\n\n```\nfrom tkinter import *\nfrom tkinter\
  \ import filedialog\nimport cv2\nfrom PIL import Image, ImageTk\nimport datetime\n\
  from picamera import PiCamera\nfrom picamera.array import PiRGBArray\nfrom ocr_det\
