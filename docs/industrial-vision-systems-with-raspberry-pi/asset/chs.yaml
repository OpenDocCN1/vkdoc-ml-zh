  ## 总结


  通过在本章中讨论以下主题，并为每个主题提供示例演示，我们为视觉系统的 GUI 设计奠定了坚实的基础：


  *   对 *tkinter* 库及其提供的各种小部件的基本理解


  *   演示一个示例 GUI，以了解 *tkinter* 库中不同小部件的工作方式


  *   通过将我们之前学到的多个小部件组合在一起，设计一个用于创建简单视觉系统的综合性 GUI


  既然我们已经对 GUI 设计有了扎实的理解，下一章我们将把重点转移到借助各种特征来提取有意义的信息上。


  '
- "# 7. 特征检测与匹配\n\n在上一章中，我们探讨了如何结合 OpenCV 和 Tkinter 来为图像处理应用创建图形用户界面（GUI）。现在，让我们探讨如何从给定的图像中提取有用的特征。特征检测使我们能够识别图像中具有区分性的点或模式，这些点或模式是物体识别、图像分割、模式匹配等应用的基础。在本章中，我们将首先对图像特征是什么有一个基本的理解。然后，我们将继续讨论检测图像中所谓关键点的不同方法。接着，我们将讨论一种特殊的算法，该算法允许我们检测图像中的角点。最后，我们将了解如何检测图像中物体的形状。\n\
  \n## 图像特征\n\n图像特征是图像中提供图像视觉特征信息的独特组成部分或模式。这些特征有助于分解图像的视觉信息，并且是计算机视觉系统的关键方面，因为从图像中学习到的特征有助于执行物体识别、图像分割和分类等任务。特征可以分为两类：全局特征和局部特征。全局特征代表整个图像的整体特征，而局部特征则代表图像中特定区域或物体的信息。\n\
  \n例如，数字图像的颜色直方图给出了图像中颜色分布的表示，而诸如偏度和峰度之类的全局统计量有助于描述图像的像素强度分布。这些特征由一个单一的向量表示，该向量提供了对给定图像的整体理解。另一方面，像点、边缘、角点等特征对于图像中的特定区域是唯一的，并且与其直接邻域不同。\n\
  \n这些局部特征的提取需要两个步骤：检测对尺度、光照和旋转具有不变性的感兴趣点或区域，并将检测到的特征转换为数值表示。这些感兴趣的点也称为关键点，而提供这些关键点描述的数值特征称为描述符。\n\
  \n在本章中，我们将讨论一些广泛用于从图像中提取这些特征的常用技术。\n\n\n\n## SIFT 特征\n\n在计算机视觉中，尺度不变特征变换（SIFT）是一种用于关键点检测和描述的算法，可用于从图像中提取独特的局部特征。正如算法名称所示，提取的特征对由图像尺度或光照水平变化以及图像旋转引起的变化具有鲁棒性。众多应用，如目标检测、图像匹配和图像拼接，都广泛使用了\
  \ SIFT 特征。例如，在目标检测任务中，可以提取图像中物体的关键点来提供对该物体的描述，然后用于在其他图像中检测该物体。\n\nSIFT 特征的提取主要包括四个步骤：\n\
  \n1.  **尺度空间极值检测**：首先，我们创建图像的尺度空间表示，它由一系列不同尺度下的模糊图像组成。接下来，我们使用高斯差分（DoG）方法找到尺度空间中的局部最大值，这些点被视为潜在的关键点。\n\
  \n2.  **关键点定位**：SIFT 使用泰勒级数展开将关键点位置精化到亚像素精度。如果关键点的对比度或边缘响应低于预定水平，则将其剔除。\n\n3.  **方向分配**：然后，根据每个精化后的关键点的局部图像梯度为其分配一个方向。这是通过为每个关键点创建梯度直方图，并将直方图中峰值的方向指定为该关键点的方向来完成的。\n\
  \n4.  **关键点描述符**：最后阶段是为每个关键点创建一个描述符，该描述符是一个向量，表示该点周围图像的局部外观。对于每个关键点，将周围邻域划分为 16\
  \ 个子块，并为每个子块计算梯度方向直方图，然后将这些直方图连接起来形成关键点描述符。\n\n以下代码演示了如何使用 SIFT 特征从齿轮图像中提取关键点。OpenCV\
  \ 库中的 `SIFT_create()` 函数用于创建 SIFT 对象，该对象的 `detectAndCompute` 方法可用于检测图像中的关键点及其描述符。最后，OpenCV\
  \ 库中的 `drawKeypoints()` 函数可用于在原始图像上标记关键点。图 7-1 显示了在齿轮图像上用红色标记的描述符，可以看出它们主要分布在构成齿轮重要特征的轮齿边缘上。在生产线上，齿轮齿在集成到实际产品之前需要验证其对齐情况，这些描述符可以满足此目的，因为它们具有尺度和旋转不变性。\n\
  \n![](img/604620_1_En_7_Fig1_HTML.jpg)\n\n两张插图。左侧的原始图像描绘了一个齿轮。右侧的插图标题为“带有关键点的图像”。它描绘了齿轮，在齿和齿轮的中心孔处有亮点。\n\
  \n图 7-1\n\n使用 SIFT 特征提取关键点的示意图\n\n```\n# 加载图像\nimg = cv2.imread('C:/Users/user/Pictures/gear.jpg',0)\n\
  # 创建 SIFT 检测器\nsift = cv2.SIFT_create()\n# 检测关键点和描述符\nkeypoints, descriptors = sift.detectAndCompute(img,\
  \ None)\n# 使用圆圈在图像上标记关键点\nimg_k=cv2.drawKeypoints(img ,\nkeypoints ,\nimg ,\n(255,\
  \ 0, 0) ,\nflags=cv2.DRAW_MATCHES_FLAGS_DEFAULT)\n# 显示原始图像和带有关键点的图像\nplt.subplot(121)\n\
  plt.imshow(img, cmap='gray')\nplt.title('原始图像')\nplt.subplot(122)\nplt.imshow(img_k)\n\
  plt.title('带有关键点的图像')\nplt.show()\n```\n\n## SURF 特征\n\nSURF，代表加速稳健特征（Speeded-Up\
  \ Robust Features），是 SIFT 特征的一种加速版本，可以检测对尺度、光照和旋转具有不变性的关键点。使用 SURF 特征进行关键点检测和描述的步骤包括四个步骤：\n\
  \n1.  **尺度空间极值检测**：为了识别不同大小的特征，SURF 在多个尺度上对图像进行操作。它使用类似于 SIFT 中使用的高斯差分（DoG）的方法来定位尺度空间中的局部极值。为了找到感兴趣的区域，使用不同尺度的高斯滤波器对图像进行卷积，然后减去连续的模糊图像。\n\
  \n2.  **关键点定位**：在识别出潜在关键点后，SURF 通过在每个候选关键点位置拟合一个 3x3 的 Hessian 矩阵来执行关键点定位，以确定尺度并剔除对比度低或边缘定义不佳的点。\n\
  \n3.  **方向分配**：接下来，SURF 为每个关键点分配一个方向，使其具有旋转不变性。为了创建一个表示主方向的二维向量，计算关键点周围 x 和 y 方向的\
  \ Haar 小波响应。然后根据该向量的角度确定方向。\n\n4.  **描述符计算**：在检测到尺度和关键点方向之后，SURF 为关键点的邻域计算一个描述符，该描述符是一个向量，其值表征了关键点周围的强度分布。\n\
  \n由于 SURF 已获得专利，而 OpenCV 默认排除受专利保护的算法。为了访问 SURF，我们可以在 OpenCV 编译或安装期间显式启用非自由模块。这将激活包含\
  \ SURF 和其他专利算法的 *xfeatures* 库，但我们需要确保已获得必要的许可或法律授权才能使用它们，尤其是在商业用途中。以下代码从齿轮图像中提取对应于\
  \ SURF 特征的关键点。读取齿轮图像后，使用 `xfeatures2d.SURF_create` 方法创建一个 Hessian 阈值为 10000 的 SURF\
  \ 对象。特征检测器的灵敏度由 Hessian 阈值控制，较高的值会检测到更少但更强的关键点。然后，可以使用 SURF 对象的 `detectAndCompute`\
  \ 方法在灰度图像 'img' 中检测关键点并计算描述符。\n\n为了在图像上绘制彩色关键点，我们将灰度图像 '*img*' 转换为 BGR 图像 '*img1_color*'。接下来，我们遍历关键点，并使用\
  \ `circle()` 方法绘制圆圈，以关键点的坐标为中心，半径为关键点大小的四分之一。最后，我们显示带有关键点的齿轮图像以及原始图像，如图 7-2 所示。可以看出，指示关键点的圆圈捕获了齿轮的所有显著特征，包括边缘和齿轮中心。\n\
  \n```\nimport cv2\nimport numpy as np\nimport matplotlib.pyplot as plt\n# 加载齿轮图像\n\
  img = cv2.imread('Gear.jpg', cv2.IMREAD_GRAYSCALE)\n# 创建 SURF 对象\nsurf = cv2.xfeatures2d.SURF_create(10000)\n\
  # 检测关键点并计算描述符\nkeypoints, descriptors = surf.detectAndCompute(img, None)\n# 将灰度图像转换为\
  \ BGR 以显示彩色关键点\nimg1_color = cv2.cvtColor(img, cv2.COLOR_GRAY2BGR)\n# 绘制关键点，增加线条粗细\n\
  for kp in keypoints:\nx, y = int(kp.pt[0]), int(kp.pt[1])\nradius = int(kp.size\
  \ / 4)\n# 设置圆圈线条粗细为 2\nimg1=cv2.circle(img1_color, (x, y), radius, (255, 0, 0),\
  \ thickness=2)\n# 显示图像\nplt.subplot(121)\nplt.imshow(img, cmap='gray')\nplt.title('原始图像')\n\
  plt.subplot(122)\nplt.imshow(img1)\nplt.title('带有关键点的图像')\nplt.show()\n```\n\n![](img/604620_1_En_7_Fig2_HTML.jpg)\n\
  \n\n\n两幅插图。左侧原始图像描绘了一个齿轮。右侧插图则用关键点描绘了该图像。它用一组点簇描绘了齿轮，这些点分布在齿的边界、中心孔以及顶部的背景上。\n\n\
  图 7-2\n\n使用 SURF 特征进行关键点提取的示意图\n\n## FAST 特征\n\nFAST 是“加速段测试特征”（Features from Accelerated\
  \ Segment Test）的缩写。这种角点检测算法于 2006 年发表，计算效率高，因此比其他算法更快，名副其实。因此，该检测器非常适合需要高速计算且资源有限的实时视频处理应用。\n\
  \n使用 FAST 特征确定兴趣点的步骤如下：\n\n1.  选择一个像素，例如 p，判断其是否为兴趣点，并设 I[p] 为该像素的强度。\n2.  为强度选择一个阈值，例如\
  \ T。\n3.  考虑一个由 16 个像素组成的圆，以所选像素 p 为圆心。\n4.  如果圆中存在 n 个连续像素，其强度值比所选像素的强度值大（> I[P]\
  \ + T）或小（< I[P] – T）约 T 个数量级，则所选像素（强度为 I[p]）被视为一个兴趣点。最初提出且常用的 n 值为 12。\n5.  然后，可以利用步骤\
  \ 4 进行高速测试，以更快地检测兴趣点。该测试可分为两部分：\n    1.  首先，测试圆上像素 1、5、9 和 13 的强度是否满足步骤 5 中的阈值条件。如果所选像素\
  \ p 是兴趣点，那么这些像素中至少有三个的强度要么都大于 I[p]+T，要么都小于 I[p]-T。\n    2.  然后，对通过初始四像素测试的候选点，对所有\
  \ n 个像素执行阈值条件。\n\n以下代码说明了如何使用 FAST 特征从齿轮图像中提取关键点。OpenCV 库中的 `FastFeatureDetector_create()`\
  \ 函数可用于创建 FAST 对象，而 `detect()` 方法可用于获取关键点。这里，我们使用 `circle()` 函数绘制关键点以及关键点周围圆上的 16\
  \ 个像素。由于所有这些小圆紧密排列在一起，它们在图像上看起来像圆形斑块，从图 7-3 中我们可以看到，这些斑块大部分分布在齿轮的边缘。\n\n![](img/604620_1_En_7_Fig3_HTML.jpg)\n\
  \n两幅插图。左侧原始图像描绘了一个齿轮。右侧插图则用关键点描绘了该图像。\n\n图 7-3\n\n使用 FAST 特征进行关键点提取的示意图\n\n```\n\
  import cv2\nimport matplotlib.pyplot as plt\n# 读取图像\nimage = cv2.imread('C:/Users/user/Pictures/gear.jpg',\
  \ 0)\n# 显示原始图像\nplt.subplot(121)\nplt.imshow(image,cmap='gray')\nplt.title('原始图像')\n\
  # 定义 FAST 检测器\nfast = cv2.FastFeatureDetector_create()\n# 查找兴趣点\nkeypoints = fast.detect(image,\
  \ None)\n# 绘制兴趣点以及圆上的 16 个像素\nfor keypoint in keypoints:\ncircle = cv2.circle(image,\
  \ (int(keypoint.pt[0]),int( keypoint.pt[1])), 3, (255,0 , 0), 2)\nfor i in range(-7,\
  \ 8):\nfor j in range(-7, 8):\nif (i**2 + j**2) <= 49:\ncv2.circle(image, (int(keypoint.pt[0])\
  \ + i, int(keypoint.pt[1]) + j), 1,\n(255, 0, 0), 1)\n# 显示带有关键点的图像\nplt.subplot(122)\n\
  plt.imshow(image,cmap='gray')\nplt.title('带有关键点的图像')\nplt.show()\n```\n\n## BRIEF\
  \ 特征\n\n在将特征描述符用于对象识别等应用时，需要更快且内存效率更高的匹配，这反过来又需要较短的描述符。实现这一点的一种方法是通过对原始描述符应用降维算法（如\
  \ LDA 或 PCA），然后将描述符向量转换为位数更少的二进制字符串。但这仍然需要我们先计算完整的描述符，然后再应用降维。BRIEF 描述符通过直接从关键点周围的图像块计算二进制字符串来克服这一点，而不是先计算描述符。\n\
  \nBRIEF 是“二进制鲁棒独立基本特征”（Binary Robust Independent Elementary Features）的缩写，它是一种与 SURF、FAST\
  \ 或 HARIS 等关键点检测算法协同工作的特征描述符。如上所述，BRIEF 使用二进制字符串作为高效的关键点描述符，使其成为实时应用的理想选择。以下是确定\
  \ BRIEF 特征的步骤。\n\n1.  使用 SURF、SIFT 或 Harris 角点等关键点检测算法来检测给定图像中独特的兴趣点位置。\n2.  对于每个检测到的关键点，提取该像素邻域内的一个局部正方形像素块。该块的高度和宽度将决定\
  \ BRIEF 描述符的尺度。\n3.  由于 BRIEF 特征处理的是像素级别的强度，因此它对噪声非常敏感。因此，在进一步处理之前，需要使用高斯核对选定的块进行平滑处理。\n\
  4.  对于每个块，选择一组 n 个随机像素位置对 (x, y)，其中 n 是二进制特征向量的长度。对每对像素的强度进行比较，以获得相应的二进制值。例如，如果像素\
  \ x 的强度小于像素 y 的强度，则对应的二进制值为 1；如果 x 的强度大于 y 的强度，则该值为 0。这里的位置对是从高斯分布中随机选择的。\n\n按照这些步骤，将为图像中的每个关键点生成一个二进制描述符。以下代码说明了从齿轮图像中提取描述符的过程。可以看出，图像中的关键点是使用前面讨论的\
  \ FAST 特征检测到的。然后，可以使用 `BriefDescriptorExtractor` 对象的 `create()` 方法从检测到的关键点中提取二进制描述符。从代码后面显示的输出中，我们可以看到提取的描述符变量是一个\
  \ numpy 数组。打印了单个关键点的描述符，可以看出该描述符是一个整数向量。为了获得二进制描述符，我们使用 numpy 库中的 `binary_repr()`\
  \ 函数将向量中的每个整数转换为 8 位二进制表示。\n\n```\nimport cv2\nimport numpy as np\n# 加载输入的齿轮图像\n\
  img = cv2.imread('C:/Users/user/Pictures/gear.jpg', 0)\n# 初始化 FAST 检测器并检测关键点\nf\
  \ = cv2.FastFeatureDetector.create()\nkp= f.detect(img)\n# 初始化提取器并为关键点提取 BRIEF 描述符\n\
  b = cv2.xfeatures2d.BriefDescriptorExtractor.create()\nkeypoints,descriptors = b.compute(img,\
  \ kp)\n# 打印描述符的特征\nprint(\"描述符变量的数据类型是:\",type(descriptors))\nprint(\"\\n 描述符大小:\"\
  , len(descriptors))\n# 打印第一个描述符\nprint(\"\\n 第一个描述符是:\")\nprint(descriptors[0])\n\
  # 以二进制形式打印描述符\nprint(\"\\n 第一个描述符的二进制形式:\")\nprint(' '.join([np.binary_repr(num,8)\
  \ for num in descriptors[0]]))\n输出:\n描述符变量的数据类型是: \n描述符大小: 8802\n第一个描述符是:\n[8  \
  \ 7  12 124  43  50 228  72  16 131  26 152 184 236   0  10  70 248\n82 150 44 \
  \  8 200 44 205 216 164 123 184  76   4 245]\n第一个描述符的二进制形式:\n00001000 00000111 00001100\
  \ 01111100 00101011 00110010 11100100 01001000 00010000 10000011 00011010 10011000\
  \ 10111000 11101100 00000000 00001010 01000110 11111000 01010010 10010110 00101100\
  \ 00001000 11001000 00101100 11001101 11011000 10100100 01111011 10111000 01001100\
  \ 00000100 11110101\n```\n\n\n\n## ORB 特征\n\nORB 是在计算效率和匹配性能方面，作为 SIFT 和 SURF 特征的高效替代方案而开发的。另一个关键方面是，在\
  \ ORB 特征开发时，SIFT 和 SURF 特征均已获得专利，因此 ORB 成为了这些特征的免费替代方案。目前，SIFT 特征的专利已过期，可免费使用，而\
  \ SURF 特征仍受专利保护，若用于商业目的，则需购买许可证。\n\nORB 代表定向 FAST 和旋转 BRIEF。顾名思义，它是 FAST 关键点和 BRIEF\
  \ 描述符的结合，并进行了某些修改以克服其缺点。以下是计算 ORB 特征所涉及的步骤：\n\n1.  **检测 FAST 关键点**：ORB 首先使用 FAST\
  \ 算法检测给定图像中的关键点。在此，ORB 还使用多尺度金字塔方法在不同尺度上应用 FAST，使算法能够捕获不同大小的特征。\n\n2.  **分配方向**：下一步是为每个关键点分配一个方向，以使特征具有旋转不变性。ORB\
  \ 通过计算以关键点为中心的图像块的强度加权质心，然后确定从关键点到质心的向量方向，来为关键点分配方向。\n\n3.  **计算 BRIEF 描述符**：最后，ORB\
  \ 为每个检测到的关键点计算 BRIEF 描述符，并根据分配给每个关键点的方向旋转描述符，以确保旋转不变性。\n\n以下代码展示了从齿轮图像中提取 ORB 特征的过程。我们使用\
  \ OpenCV 库中的 `ORB_create()` 函数创建一个 ORB 对象，然后使用 `detectAndCompute()` 方法检测关键点和描述符。接着，我们使用\
  \ OpenCV 库中的 `drawKeypoints()` 函数绘制图像及其检测到的关键点，如图 7-4 所示。尽管 ORB 在计算上比 SIFT 和 SURF\
  \ 更高效，但从图中可以看出，其精度不如这些特征，因为它未能捕获齿轮图像中的部分齿牙。\n\n![](img/604620_1_En_7_Fig4_HTML.jpg)\n\
  \n两张插图。左侧原始图像描绘了一个齿轮。右侧插图描绘了关键点图像。它在齿轮的齿牙和中心孔处用亮点进行了标记。\n\n图 7-4\n\n使用 FAST 特征提取关键点的示意图\n\
  \n```\nimport cv2\nimport numpy as np\nimport matplotlib.pyplot as plt\n# 读取输入图像\n\
  img = cv2.imread('C:/Users/user/Pictures/gear.jpg',0)\n# 显示原始图像\nplt.subplot(121)\n\
  plt.imshow(img,cmap='gray')\nplt.title('原始图像')\n# 检测并计算关键点和描述符\norb = cv2.ORB_create()\
  \  # 创建一个 ORB 对象\nkp, des = orb.detectAndCompute(img, None)\n# 在图像上绘制关键点\nimg2 =\
  \ cv2.drawKeypoints(img, kp, img, color=(255, 0, 0), flags=cv2.DRAW_MATCHES_FLAGS_DEFAULT)\n\
  # 显示关键点图像\nplt.subplot(122)\nplt.imshow(img2,cmap='gray')\nplt.title('关键点图像')\n\
  plt.show()\n```\n\n## 角点检测\n\n在文献中，关键点、角点和特征这些术语经常互换使用，但角点和关键点之间存在细微差别。角点可以被视为两条边缘或边界的交点，因此它成为物体识别和跟踪等视觉任务的重要特征。在图像处理的背景下，角点可以被视为图像中那些在多个方向上会发生显著强度变化的点。另一方面，关键点可以表示图像中的各种特征，包括角点、孤立的强度极大值或极小值点以及线段端点。\n\
  \n假设我们在图像上移动一个小矩形窗口。当窗口位于非常平坦的区域时，强度不会发生大的变化。如果窗口放置在边缘上，则强度变化仅发生在窗口移动的单一方向上。如果同一个窗口放置在角点上，则所有方向都会发生大的强度变化。最常用的角点检测方法之一是\
  \ Harris 角点检测器，它测量窗口在图像中沿不同方向移动时窗口内的强度变化，并在多个方向上检测到显著强度变化时判断存在角点。以下是 Harris 角点检测所涉及的步骤：\n\
  \n1.  **梯度计算**：第一步是通过在水平和垂直方向上计算偏导数来获得图像梯度。\n\n2.  **结构张量**：然后创建一个结构张量，这是一个由图像导数计算得出的\
  \ 2 x 2 矩阵。\n\n3.  **角点响应函数**：接着使用结构张量计算角点响应函数，该函数对图像块内是否存在角点进行评分。该函数值高表示存在角点。\n\
  \n4.  **非极大值抑制**：应用非极大值抑制（一种用于去除重复点的后处理技术）来仅保留最显著的角点。\n\n以下代码展示了从为此目的专门创建的网格图像中提取角点的过程。使用\
  \ OpenCV 库中的 `cornerHarris()` 函数来检测图像中的角点。该函数将灰度图像以及其他参数作为输入。数字 2 是用于角点检测的邻域块大小，表示一个\
  \ 2x2 的邻域。块大小的选择通常需要权衡，因为较大的尺寸虽然能提供平滑的结果，但可能会遗漏小角点，而较小的尺寸虽然能检测到小角点，但对噪声可能更敏感。由于我们使用的是手动创建的无噪声图像，因此较小的尺寸\
  \ 2 就足够了。\n\n数字 3 是 Sobel 核的大小，用于计算前面第一步中提到的图像导数。因此，我们使用 3 x 3 的核来计算水平和垂直梯度。最后一个数字\
  \ 0.04 是 Harris 角点检测器的一个自由参数，用于调整检测器的灵敏度。在检测器函数之后，对检测结果应用 `dilate()` 函数，然后应用阈值来抑制由图像噪声产生的虚假角点。从图\
  \ 7-5 中可以看出，网格图像中的所有 9 个角点都被准确检测到了。\n\n![](img/604620_1_En_7_Fig5_HTML.jpg)\n\n\
  两张插图。左侧。网格图像描绘了一个 4 乘 4 的网格，颜色交替，类似于棋盘。右侧插图标题为“带角点的网格图像”，描绘了一个类似于棋盘的 4 乘 4 网格。网格的角点处有亮色点。\n\
  \n图 7-5\n\n使用 Harris 检测器进行角点检测的示意图\n\n```\nimport numpy as np\nimport cv2 as cv\n\
  import matplotlib.pyplot as plt\n# 读取网格图像\nimg = cv.imread('C:/Users/user/Pictures/grid.jpg')\n\
  # 显示原始图像\nplt.subplot(121)\nplt.imshow(img)\nplt.title('网格图像')\ngray = cv.cvtColor(img,cv.COLOR_BGR2GRAY)\
  \ # 将图像转换为灰度图\n# 应用 Harris 角点检测器\ndst = cv.cornerHarris(gray,2,3,0.04)\ndst = cv.dilate(dst,None)\n\
  # 应用阈值获取最佳角点\nimg[dst>0.01*dst.max()]=[255,0,0]\n# 显示带角点的网格图像\nplt.subplot(122)\n\
  plt.imshow(img)\nplt.title('带角点的网格图像')\nplt.show()\n```\n\n\n\n## 图像中的直线与形状检测\n\n\
  在各种计算机视觉应用中，检测直线和其他形状是图像中物体检测的关键环节。霍夫变换是实现此目的的常用技术之一。该算法由保罗·霍夫于 1962 年提出，最初用于检测直线，后来经过改进也可用于检测圆形和椭圆等其他形状。此后，该算法在模式识别和计算机视觉领域得到了广泛应用。\n\
  \n传统的边缘检测和阈值分割等技术在检测形状时往往效果不佳，尤其是在形状不完整或发生畸变的情况下。霍夫变换通过将图像空间转换到不同的参数空间来克服这一难题。首先，我们考虑在图像中检测直线的情况，其参数空间由两个参数组成：直线的斜率及其\
  \ y 轴截距。以下是使用霍夫变换检测直线的步骤：\n\n1.  **检测边缘**：第一步通常使用标准技术（如 Canny 边缘检测器）来检测图像中的边缘。\n\
  \n2.  **累加器数组**：对于每个边缘点，可能有多个直线穿过它，从而产生多个斜率 (m) 和截距 (b)。累加器数组就是这些参数的集合。换句话说，累加器数组中的每个单元格可能代表一个特定的\
  \ m 和 b 组合。由于垂直线具有无限大的斜率，这些参数将使用表达式 r = xcosθ + ysinθ 转换为极坐标形式，其中 (x, y) 表示我们正在计算参数的点，r\
  \ 是从原点到直线的垂直距离，θ 是 x 轴与直线之间的夹角。\n\n3.  **投票**：对于图像中的每个边缘点，累加器数组中对应的单元格值会递增，这个过程称为投票。此过程背后的思想是，如果多个边缘点位于同一条直线上，那么它们的投票将累积在累加器数组的相应条目中。\n\
  \n4.  **阈值处理**：投票过程结束后，累加器数组中的峰值代表图像中潜在的直线。应用额外的阈值处理步骤来选择显著的峰值，从而避免噪声干扰。\n\n5. \
  \ **反投影**：然后将累加器数组中选定的峰值转换回原始空间，以获得检测到的直线的参数。\n\n以下代码展示了如何借助霍夫变换，从我们上一节使用的同一网格图像中检测直线。可以看到，我们使用带有两个阈值的\
  \ Canny 边缘检测器来检测图像中的边缘点。然后，我们将这些点传递给 OpenCV 库中的 `HoughLines()` 函数，以检测图像中与某些边缘点相关联的直线。传递给该函数的数字\
  \ 1 是参数 r 的分辨率（以像素为单位），这意味着我们使用的分辨率为 1 像素。类似地，传递给该函数的值 π/180 是参数 θ 的分辨率（以弧度为单位），这意味着我们使用的分辨率为\
  \ 1 度（因为 1 度等于 π/180 弧度）。然后，我们提供了一个阈值为 100，这是被视为一条直线所需的最小投票数。参数 `minLineLength`\
  \ 为 100，意味着短于此长度的线段将被忽略。同样，参数 `maxLineGap` 为 10，是连接同一直线上点之间允许的最大间隙。结果图像如图 7-6 所示，该图显示使用霍夫变换准确地检测到了图像中的每一条直线。\n\
  \n![](img/604620_1_En_7_Fig6_HTML.jpg)\n\n两幅插图。左图：原始图像描绘了一个 4x4 网格，颜色交替，类似棋盘。右图标题为“检测到直线的图像”，描绘了一个类似棋盘的\
  \ 4x4 网格。深色线条构成了每个网格的边界。\n\n图 7-6\n\n使用霍夫变换进行直线检测的示意图\n\n```\nimport cv2\nimport\
  \ numpy as np\nimport matplotlib.pyplot as plt\n# 加载螺母图像\nimage = cv2.imread('C:/Users/user/Pictures/grid.jpg')\n\
  # 显示原始图像\nimage = cv2.cvtColor(image, cv2.COLOR_BGR2RGB)\nplt.subplot(121)\nplt.imshow(image)\n\
  plt.title('原始图像')\n# 将图像转换为灰度图\ngray = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)\n\
  # 应用 Canny 边缘检测\nedges = cv2.Canny(gray, 50, 150)\n# 应用霍夫变换\nlines = cv2.HoughLinesP(edges,\
  \ 1, np.pi / 180, 100,\nminLineLength=100, maxLineGap=10)\n# 在图像上绘制检测到的直线\nfor line\
  \ in lines:\nx1, y1, x2, y2 = line[0]\ncv2.line(image, (x1, y1), (x2, y2), (0, 0,\
  \ 255), 2)\n# 显示图像\nplt.subplot(122)\nplt.imshow(image)\nplt.title('检测到直线的图像')\n\
  plt.show()\n```\n\n霍夫变换的另一个变体称为霍夫圆变换，其工作原理类似，只是它检测的是圆形而非直线。该变换通过将图像空间转换为具有三个参数 x、y、r\
  \ 的参数空间（而不是直线情况下的两个参数：斜率和截距）来实现，其中 x、y 表示圆心的坐标，r 表示圆的半径。以下代码说明了如何使用霍夫圆变换在齿轮图像中检测圆形。我们提供给\
  \ OpenCV 库中 `HoughCircles()` 函数的参数如下：\n\n*   `gray`：输入图像的灰度版本。\n*   `method`：检测方法；有两种方法可用：`HOUGH_GRADIENT`\
  \ 和 `HOUGH_GRADIENT_ALT`。\n*   `dp`：累加器分辨率与图像分辨率的反比；`dp = 1` 意味着累加器与输入图像具有相同的分辨率。\n\
  *   `minDist`：检测到的圆心之间的最小距离；我们选择大小为 20。\n*   `param1`：表示传递给 Canny 边缘检测器的两个阈值中的较高阈值，该检测器由霍夫圆变换内部使用；我们选择值为\
  \ 120。\n*   `param2`：圆心累加器阈值；该值越小，检测到的假圆越多；我们选择值为 50。\n*   `minRadius`：最小圆半径；我们选择值为\
  \ 5。\n*   `maxRadius`：最大圆半径；我们选择值为 100。\n\n最后，借助 OpenCV 库中的 `circle()` 函数将圆绘制在图像上，我们向该函数提供原始图像、圆的坐标\
  \ (x, y, r)、通过指定 (R, G, B) 值所需的颜色，以及所需的线宽。`HoughCircles()` 函数以浮点值形式提供坐标 (x, y, r)。因此，在将它们提供给\
  \ `circle()` 函数时，我们将其转换为整数。图 7-7 显示，齿轮图像中心的圆被完美地检测出来。这可以应用于制造装配线，以无需人工干预的方式验证齿轮的孔径。\n\
  \n![](img/604620_1_En_7_Fig7_HTML.jpg)\n\n两幅插图。左图原始图像描绘了一个浅色齿轮。右图标题为“检测到圆的齿轮图像”，描绘了一个浅色齿轮，中心孔处有一个明亮的边界。\n\
  \n图 7-7\n\n使用霍夫变换进行圆检测的示意图\n\n\n\n```\nimport cv2\nimport matplotlib.pyplot as plt\n\
  # 读取齿轮图像\nimage = cv2.imread('C:/Users/user/Pictures/Gear.jpg')\n# 绘制原始图像\nplt.subplot(121)\n\
  plt.imshow(image)\nplt.title('齿轮图像')\n# 将图像转换为灰度图\ngray = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)\n\
  # 检测圆形\ncircles = cv2.HoughCircles(gray, cv2.HOUGH_GRADIENT, dp=1, minDist=20,\n\
  param1=120, param2=50, minRadius=5, maxRadius=100)\n# 绘制检测到的圆形\nfor (x, y, r) in\
  \ circles[0]:\ncv2.circle(image, (int(x), int(y)), int(r), (255, 0, 0), 10)\n# 显示带有检测圆形的图像\n\
  plt.subplot(122)\nplt.imshow(image)\nplt.title('检测到圆形的齿轮图像')\nplt.show()\n```\n\n\
  在图像中检测其他形状时，轮廓在计算机视觉和图像处理中应用广泛。简单来说，轮廓是沿着图像中物体边界连接所有具有相同颜色或强度的连续点所形成的曲线。因此，轮廓是识别和分析图像中形状的理想选择。以下代码演示了齿轮图像中形状的检测过程。我们首先将图像转换为灰度图，然后应用阈值处理得到二值图像。这里我们使用\
  \ OTSU 阈值法来获取二值图像。接着，我们将二值图像作为输入传递给 OpenCV 库中的 `findContours()` 函数。该函数还接受另外两个参数：轮廓检索算法的模式和轮廓近似算法。对于检索算法，我们使用\
  \ `RETR_TREE`，它会检索图像中的所有轮廓，并重建嵌套轮廓的完整层级结构。对于近似算法，我们使用 `CHAIN_APPROX_SIMPLE`，它会压缩水平、垂直和对角线段，仅保留其端点。然后，我们使用\
  \ `drawContours()` 函数在图像上绘制边界。该函数将图像和检测到的轮廓作为输入，同时接受其他参数，如轮廓索引（应设为 -1 以绘制所有轮廓）、所需的\
  \ (R, G, B) 颜色以及边界的厚度。从图 7-8 中，我们可以看到检测到了三个层次的轮廓：框架的整体边界、外齿轮齿的边界以及齿轮内圆的边界。\n\n![](img/604620_1_En_7_Fig8_HTML.jpg)\n\
  \n两幅插图。左侧的原始图像描绘了一个浅色齿轮。右侧的插图标题为“带有轮廓的齿轮图像”。它描绘了一个浅色齿轮，其齿和中心孔带有明亮的边界。\n\n图 7-8\n\
  \n使用轮廓进行形状检测的示意图\n\n```\nimport cv2\nimport matplotlib.pyplot as plt\n# 加载齿轮图像\n\
  img = cv2.imread('C:/Users/user/Pictures/gear.jpg')\n# 显示原始图像\nplt.subplot(121)\n\
  plt.imshow(img)\nplt.title('原始齿轮图像')\n# 将图像转换为灰度图\ngray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)\n\
  # 应用阈值处理将图像二值化\nthresh = cv2.threshold(gray, 0, 255, cv2.THRESH_BINARY_INV | cv2.THRESH_OTSU)[1]\n\
  # 在图像中查找轮廓\ncontours = cv2.findContours(thresh, cv2.RETR_TREE, cv2.CHAIN_APPROX_SIMPLE)[0]\n\
  # 在图像上绘制轮廓\nfor contour in contours:\ncv2.drawContours(img, [contour], -1, (255,\
  \ 0, 0), 10)\n# 显示带有轮廓的图像\nplt.subplot(122)\nplt.imshow(img)\nplt.title('带有轮廓的齿轮图像')\n\
  plt.show()\n```\n\n## 总结\n\n在本章中，我们探讨了用于从给定图像中提取感兴趣特征的各种技术，这对于计算机视觉中的图像解释至关重要。以下是我们在本章中讨论的关键概念：\n\
  \n*   关键点检测器，如 SIFT、SURF、FAST、BRIEF 和 ORB，用于识别图像中的显著点\n*   Harris 检测器，用于有效检测图像中的角点，这些角点通常位于两条边缘或边界的交汇处\n\
  *   霍夫变换，用于精确检测给定图像中的直线和圆形\n*   轮廓，用于检测图像中物体的其他随机形状或边界\n\n在下一章中，我们将讨论另一组用于检测和提取图像中物体的关键技术，称为分割技术。\n\
  \n"
- "# 8. 图像分割\n\n视觉系统的一个重要方面是区分场景中的物体。实现这一目标的第一步是将给定图像中的各种物体分离出来。这通过一个称为分割的过程来完成，其中对应于不同区域（物体）的所有像素被分组在一起，从而将给定图像分割成其组成物体。在计算机视觉领域，图像分割是一个基础且至关重要的过程，它为许多应用奠定了基础，包括自动驾驶汽车、医学成像、物体识别等。基于前几章获得的知识，本章将深入探讨分割这一复杂领域，重点关注先进的方法和流程。\n\
  \n我们在第 5 章中研究了作为图像分割基础的阈值处理方法，该方法利用强度阈值来帮助区分给定图像中的不同区域。虽然阈值处理在某些情况下效果良好，但对于包含大量噪声、光照变化或复杂结构的图像，它可能不够用。本章将拓宽我们对分割技术的理解，并在阈值处理的基础上探索更先进的方法。\n\
  \n\n\n## 使用阈值法进行图像分割\n\n阈值法是一种简单而强大的图像分割技术，其原理是根据像素值是否大于或小于预定义的阈值，将其设置为两个级别之一。属性值高于或低于阈值的像素会被阈值分为两组，这两组通常代表不同的物体或背景。阈值法技术大致可分为全局法和局部法。我们在第\
  \ 5 章中已经讨论过其中一些技术。在本节中，我们将回顾如何使用全局阈值技术和局部阈值技术对给定图像进行分割。\n\n对于全局阈值技术，我们将采用之前在第 5\
  \ 章中讨论过的大津阈值法。以下代码演示了如何使用大津阈值法对给定图像进行分割。本次演示我们使用一张 U 型螺栓的图像。第一步是读取图像并将其转换为灰度图像。然后，我们将使用*GaussianBlur()*函数，并设置滤波器大小为\
  \ 7 x 7，对图像应用高斯滤波器，这有助于去除图像中存在的任何高频噪声。接着，使用*threshold()*函数对滤波后的图像应用阈值处理。属性*THRESH_OTSU*用于确定图像的最佳阈值，其初始值由函数中提供的\
  \ 0 开始，然后使用属性*THRESH_BINARY*根据确定好的阈值对图像应用二值阈值处理。可以看出，U 型螺栓物体已从背景中清晰地分割出来，如图 8-1\
  \ 所示。同时也可以观察到，由光照产生的阴影也被分割为物体的一部分，这再次强调了均匀光照条件的重要性。确定的最佳阈值显示在图中分割图像的标题中，其值为 146。\n\
  \n![](img/604620_1_En_8_Fig1_HTML.jpg)\n\n两张插图，分别展示了原始图像和阈值为 146 的分割图像。照片中的 U 型螺栓物体在分割过程中已去除背景。\n\
  \n图 8-1\n使用大津阈值法进行分割\n\n```\nimport cv2\nimport numpy as np\nimport matplotlib.pyplot\
  \ as plt\n# 以灰度模式加载图像\nimage = cv2.imread('C:/Users/User/Pictures/New folder/U-Bolt.jpg',\
  \ cv2.IMREAD_GRAYSCALE)\nblurred = cv2.GaussianBlur(image, (7, 7), 0)\n# 应用大津阈值法\n\
  (T, thresh) = cv2.threshold(blurred, 0, 255,\ncv2.THRESH_BINARY | cv2.THRESH_OTSU)\n\
  # 显示原始图像和二值图像\nplt.subplot(121)\nplt.imshow(image, cmap='gray')\nplt.title('原始图像')\n\
  plt.subplot(122)\nplt.imshow(thresh, cmap='gray')\nplt.title('分割图像（大津阈值法），阈值 = '+str(T))\n\
  plt.show()\n```\n\n大津法是一种全局阈值方法，它会在整个图像上应用单一的阈值（在我们的例子中是 146）。由于图像的不同区域可能适用不同的阈值，接下来我们对同一张图像应用自适应阈值法。该方法会考虑给定图像中的多个小区域，并利用这些区域中的像素集计算出一个阈值。以下代码演示了如何对同一张\
  \ U 型螺栓图像应用自适应阈值法。OpenCV 库中的*adaptiveThreshold()*函数用于完成此任务。属性*ADAPTIVE_THRESHOLD_GAUSSIAN_C*表示阈值将是所选区域内邻域值的高斯加权和减去一个常数“c”，该常数值在函数中指定为\
  \ 3。函数中的数字 17 表示阈值处理应用于给定图像中 17 x 17 的区域。图 8-2 所示的分割图像表明，其分割效果远优于受图像中阴影影响严重的大津阈值法。\n\
  \n![](img/604620_1_En_8_Fig2_HTML.jpg)\n\n两张插图，分别展示了原始图像和采用自适应阈值的分割图像。照片中的 U 型螺栓物体在分割过程中已去除背景。\n\
  \n图 8-2\n使用自适应阈值法进行分割\n\n```\nimport cv2\nimport numpy as np\nimport matplotlib.pyplot\
  \ as plt\n# 以灰度模式加载图像\nimage = cv2.imread('C:/Users/User/Pictures/New folder/U-Bolt.jpg',\
  \ cv2.IMREAD_GRAYSCALE)\nblurred = cv2.GaussianBlur(image, (7,7), 0)\n# 应用大津阈值法\n\
  thresh = cv2.adaptiveThreshold(blurred, 255,\ncv2.ADAPTIVE_THRESH_GAUSSIAN_C,cv2.THRESH_BINARY,\
  \ 17, 3)\n# 显示原始图像和二值图像\nplt.subplot(121)\nplt.imshow(image, cmap='gray')\nplt.title('原始图像')\n\
  plt.subplot(122)\nplt.imshow(thresh, cmap='gray')\nplt.title('分割图像（自适应阈值法）')\nplt.show()\n\
  ```\n\n\n\n## 使用轮廓检测进行图像分割\n\n另一种从给定图像中分割对象的常用方法是使用轮廓检测，该方法依赖于识别和创建图像中对象的边界。连接具有相同颜色或强度点的连续边界或曲线称为轮廓。在尝试从图像中提取相关信息（如对象边界、形状和结构）时，此方法非常有用。通过识别轮廓，可以隔离和描述图像中的特定区域，从而实现对视觉数据进行更复杂的分析和理解。\n\
  \n以下代码演示了使用轮廓检测对齿轮图像进行分割。我们从与阈值处理案例中相同的步骤开始。我们将图像转换为灰度图，应用高斯滤波器去除高频噪声，然后使用大津法提取阈值。接着，我们将大津阈值的\
  \ 0.5 倍作为较低阈值，将实际的大津阈值作为较高阈值，提供给 Canny 边缘检测器，该检测器从滤波后的图像中检测边缘。然后，我们对边缘图像执行膨胀操作，以增强并连接图像中的边缘。这分两步完成。OpenCV\
  \ 库中的`getStructuringElement()`函数用于定义一个 3x3 大小的矩形结构元素，以执行形态学操作。随后，使用`dilate()`函数将该结构元素应用于边缘图像。然后，我们将膨胀后的图像作为输入提供给`findContours()`函数以确定轮廓。该函数除了膨胀后的图像外，还接收另外两个属性作为输入：属性`RETR_EXTERNAL`表示轮廓检索模式，仅检索外部轮廓；参数`CHAIN_APPROX_SIMPLE`表示轮廓近似模式，它压缩水平、垂直和对角线段，仅保留其端点。最后，使用`drawContours()`函数在原始图像的副本上绘制检测到的轮廓，该副本是使用`image.copy()`函数创建的。图\
  \ 8-3 中的分割图像清晰地显示了包围图像中对象的轮廓。\n\n![](img/604620_1_En_8_Fig3_HTML.jpg)\n\n两张插图分别展示了原始图像和通过应用轮廓检测技术创建的分割版本。在图像中，齿轮的锯齿状边界被突出显示。\n\
  \n图 8-3\n使用轮廓检测进行分割\n\n```\nimport cv2\nimport numpy as np\nimport matplotlib.pyplot\
  \ as plt\n# 加载图像\nimage = cv2.imread('C:/Users/User/Pictures/New folder/20230917_113209.jpg')\n\
  gray = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)\nblurred = cv2.GaussianBlur(gray,\
  \ (3, 3), 0)\n# 应用 OTSU 阈值处理\nT, thresh = cv2.threshold(blurred, 0, 255, cv2.THRESH_BINARY\
  \ + cv2.THRESH_OTSU)\nedges = cv2.Canny(blurred, 0.5*T, T)\n# 定义一个 (3, 3) 的结构元素\n\
  kernel = cv2.getStructuringElement(cv2.MORPH_RECT, (3, 3))\n# 对边缘图像应用膨胀操作\ndilate\
  \ = cv2.dilate(edges, kernel, iterations=2)\n# 在边缘图像中查找轮廓\ncontours, _ = cv2.findContours(dilate,\
  \ cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)\nimage_copy = image.copy()\n# 在原始图像的副本上绘制轮廓\n\
  cv2.drawContours(image_copy, contours, -1, (255, 0, 0), 10)\nplt.subplot(121)\n\
  plt.imshow(image)\nplt.title('原始图像')\nplt.subplot(122)\nplt.imshow(image_copy)\n\
  plt.title('使用轮廓检测分割的图像')\nplt.show()\n```\n\n## 使用分水岭算法进行图像分割\n\n分水岭算法是分割给定图像中对象的著名方法之一。该技术的灵感来源于水在地形区域上的流动方式。该算法的目标是将图像划分为有意义的区域，就像地形图中的山谷可能收集雨水一样。为了更形象地理解，可以将图像视为一个景观，其中像素强度代表海拔高度。图像中较暗的区域类似于山谷和洼地，而较亮的区域则类似于山峰和丘陵。分水岭算法旨在定位该地形中的“集水盆地”，即水自然聚集并被山脊分隔开的地方。以下是分水岭算法涉及的步骤：\n\
  \n1.  预处理：为了提高分割精度，通常将图像转换为灰度图并进行预处理（例如降噪）。\n\n2.  标记识别：将确定的背景和确定的前景区域指定为关键区域。这些区域作为水流模拟的起始点。\n\
  \n3.  距离变换：通过应用距离变换，确定从每个像素到最近的确定前景点的“海拔高度”。\n\n4.  模拟注水：想象水开始在指定的前景位置注入。根据地形信息（基于像素强度的变化），水逐渐“淹没”图像。\n\
  \n5.  分水岭线：绘制“分水岭线”以划分来自不同盆地的水开始混合的区域。这些线代表了图像中不同对象之间的边界。\n\n6.  分割图：输出是一幅分割后的图像，其中每个像素根据其所在的集水盆地被标记。\n\
  \n以下代码演示了使用分水岭算法对齿轮图像进行分割。与我们之前所做的类似，我们读取图像，将其转换为灰度图，然后使用大津阈值处理技术创建二值图像。接下来，通过使用\
  \ OpenCV 库中的`cv2.morphologyEx()`函数对二值图像进行膨胀来识别背景区域。我们向该函数提供属性`MORPH_DILATE`以及一个\
  \ 3x3 的全 1 核。膨胀通常会在图像中对象的边界上添加像素，从而能够清晰地识别背景。然后，我们通过使用`distanceTransform()`函数计算每个像素到最近背景像素的距离来寻找前景图像。该函数将膨胀后的图像作为输入，并附带另外两个属性：距离类型属性`DIST_L2`表示简单的欧几里得距离，数字\
  \ 5 表示距离变换掩码的大小，表明我们应用了一个 5x5 的掩码。\n\n对距离变换的输出图像应用阈值，以分离背景和前景像素。然后，使用`connectedComponents()`函数标记阈值化图像的连通分量，接着使用`watershed()`函数对这些标记应用分水岭算法。这些标记随后作为标记点传递给分水岭算法，该算法利用这些标记点，通过如前所述的分水岭线来检测前景和背景之间的精确边界。最后，在对边界线着色之前，我们通过使用\
  \ 5x5 的核进行膨胀来增加线条的厚度。我们使用膨胀后的掩码标记，通过提供颜色属性[255,0,0]（分别对应红色、绿色和蓝色分量的值），以红色在原始图像中标记边界。分割后的图像如图\
  \ 8-4 所示。\n\n![](img/604620_1_En_8_Fig4_HTML.jpg)\n\n\n\n应用分水岭算法处理后的原始图像与分割版本的两幅示意图。图像中，齿轮的跷跷板状边界清晰可见。\n\
  \n图 8-4\n\n使用分水岭算法进行分割\n\n```\nimport cv2\nimport numpy as np\nimport matplotlib.pyplot\
  \ as plt\n# 加载图像\nimg = cv2.imread('C:/Users/User/Pictures/New folder/20230917_113209.jpg')\n\
  imgRGB = cv2.cvtColor(img, cv2.COLOR_BGR2RGB)\n# 将图像转换为灰度图\ngray = cv2.cvtColor(img,\
  \ cv2.COLOR_BGR2GRAY)\n# 应用阈值处理创建二值图像\nret, thresh = cv2.threshold(gray, 0, 255,\
  \ cv2.THRESH_BINARY_INV + cv2.THRESH_OTSU)\n# 寻找背景区域\nkernel = np.ones((3, 3), np.uint8)\n\
  imgD = cv2.morphologyEx(thresh, cv2.MORPH_DILATE, kernel)\n# 寻找前景区域\ndisT = cv2.distanceTransform(imgD,\
  \ cv2.DIST_L2, 5)\n_,disThres = cv2.threshold(disT, 5, 255, cv2.THRESH_BINARY)\n\
  # 标记连通分量\ndisThres = np.uint8(disThres)\n_,labels = cv2.connectedComponents(disThres)\n\
  # 应用分水岭算法\nlabels = np.int32(labels)\nlabels = cv2.watershed(img, labels)\n# 通过膨胀分割掩码来增加线条厚度\n\
  dilate_kernel = np.ones((5, 5), np.uint8)\nsegmented_mask = np.zeros_like(gray)\n\
  segmented_mask[labels == -1] = 255\ndilated_mask = cv2.dilate(segmented_mask, dilate_kernel)\n\
  # 将膨胀后的掩码应用于原始图像\nimg[dilated_mask == 255] = [255, 0, 0]\nplt.subplot(121)\nplt.imshow(gray,cmap='gray')\n\
  plt.title('原始图像')\nplt.subplot(122)\nplt.imshow(img)\nplt.title('使用分水岭算法分割后的图像')\n\
  plt.show()\n```\n\n## 使用聚类进行图像分割\n\nK-means 聚类因其有效性和简单性，是一种广泛使用的图像分割算法。K-means 聚类是一种无监督机器学习技术，用于将数据集划分为\
  \ K 个唯一且不重叠的组或簇。其最终目标是将每个数据点分配到 K 个簇之一，使得一个簇中的点与该簇质心的距离，比它们到其他簇质心的距离更近。在进入分割过程之前，让我们先尝试理解\
  \ K-means 算法背后的逻辑。以下是 K-means 聚类算法涉及的步骤：\n\n1.  初始化：此步骤涉及两个参数的初始化：\n    1.  希望数据被划分成的簇数\
  \ (K)\n\n2.  K 个簇的随机质心，代表簇的中心\n\n2.  分配：在此步骤中，所有数据点根据其与簇质心的距离（使用欧几里得距离、曼哈顿距离、余弦相似度等距离度量）被分配到其中一个簇。每个数据点被分配给其质心最近的簇。\n\
  \n3.  更新：一旦所有数据点被分配到特定簇，通过计算分配给每个簇的所有数据点的平均值来重新计算簇质心。得到的新质心随后被视为更新后的簇中心。\n\n4. \
  \ 迭代：重复分配和更新步骤，直到收敛，即数据点到簇的分配不再发生显著变化。\n\n与 K-means 算法相关的技术细节还有很多，超出了本书的范围。因此，我们将继续讨论该算法如何帮助我们分割图像中的对象。在我们的图像分割上下文中，数据点对应于图像中的像素，K-means\
  \ 算法用于将相似的像素分组在一起。以下代码说明了使用 K-means 聚类算法对齿轮图像进行分割的过程。在应用算法之前，我们需要将图像重塑为适合聚类的格式。我们的齿轮图像是一个\
  \ RGB 图像，对于 R、G 和 B 三个平面各有一个二维像素矩阵。因此，我们首先使用 *reshape()* 函数将每个平面的二维矩阵重塑为一维矩阵。然后，我们向算法提供簇数\
  \ (K)。由于我们的图像只有一个齿轮对象，并且我们需要将对象从背景中分割出来，因此我们设置 K 值为 2，一个用于对象，一个用于背景。\n\n接下来，我们通过使用\
  \ *n_cluster* 属性提供先前定义的簇数来创建一个 *KMeans* 实例。然后，我们可以使用 *fit()* 函数将模型拟合到重塑后的图像。此函数将产生两个变量\
  \ *labels* 和 *cluster_centers*，其中 *labels* 表示每个像素的标签，由于我们只有两个簇，因此标签可以是 0 或 1；*cluster-centers*\
  \ 表示最终簇的质心。最后，我们可以将每个像素分配给它所属的质心并显示图像。从图 8-5 中的图像可以看出，整个对象被转换为单一颜色，而背景则是另一种颜色（此处为黑色），表明对象已被清晰分割。\n\
  \n![](img/604620_1_En_8_Fig5_HTML.jpg)\n\n应用聚类协议处理后的原始图像与分割版本的两幅示意图。在底部的分割图像中，齿轮表面显得平坦光滑。\n\
  \n图 8-5\n\n使用 K-means 聚类进行分割\n\n```\nfrom sklearn.cluster import KMeans\nimport\
  \ numpy as np\nimport matplotlib.pyplot as plt\nimport cv2\n# 加载图像\nimg = cv2.imread('C:/Users/User/Pictures/New\
  \ folder/20230917_113209.jpg')\nimg = cv2.cvtColor(img, cv2.COLOR_BGR2RGB)\n# 将图像重塑为像素的二维数组\n\
  pix = img.reshape((-1, 3))\nk = 2 # 簇数 (K)\n# 应用 K-means 聚类\nkmeans = KMeans(n_clusters=k)\n\
  kmeans.fit(pix)\n# 获取标签和质心\nlabels = kmeans.labels_\ncentroids = kmeans.cluster_centers_\n\
  # 将每个像素分配给它对应的簇质心\nseg_image = centroids[labels].reshape(img.shape)\n# 显示原始图像和分割后的图像\n\
  plt.subplot(121)\nplt.imshow(img)\nplt.title('原始图像')\nplt.subplot(122)\nplt.imshow(seg_image.astype(np.uint8))\n\
  plt.title('使用 Kmeans 聚类分割后的图像')\nplt.show()\n```\n\n## 总结\n\n从图像中分割对象有助于我们进一步应用于目标检测与跟踪、医学成像、人脸识别等场景。在本章中，我们探讨了在给定图像中分割对象的不同技术，如下所列：\n\
  \n*   使用全局和局部阈值处理技术分割图像中的 U 型螺栓\n\n*   使用轮廓检测、分水岭算法和 K-means 算法等技术分割图像中的齿轮\n\n在下一章中，我们将讨论计算机视觉的另一个关键组成部分，即使用光学字符识别从图像中提取文本。\n\
  \n\n\n"
- "# 9. 光学字符识别\n\n光学字符识别，简称 OCR，是一种用于从扫描的文本文件或相机拍摄的数字图像中检测文本字符，并将其转换为可编辑数据的技术。换句话说，OCR\
  \ 技术能从扫描文档或图像中识别出的文本字符里提取机器编码文本。OCR 技术始于二十世纪初期。早期 OCR 系统的主要目的是识别打字或排版文档中的印刷文本。后来，模式匹配和模板匹配等技术被用于创建商业字符识别系统。随着机器学习方法的普及以及先进计算能力的发展，这些技术在实现高精度\
  \ OCR 系统中变得日益重要。近年来，深度学习方法极大地提升了 OCR 的性能，使其能够识别复杂的手写文本。\n\nOCR 已广泛应用于多种视觉系统应用中，例如验证包装标签上的印刷信息、读取和记录车辆牌照、利用产品上的序列号进行自动库存管理、从发票、账单或检验报告中提取数据以进行进一步分析等。通过集成\
  \ OCR 技术执行这些操作，可以消除人为错误的可能性，从而大幅提高准确性；同时，由于减少了在这些任务上花费的时间，生产力也得以显著提升。与所有技术一样，OCR\
  \ 系统也存在一些局限性。例如，OCR 输出的质量高度依赖于输入图像的质量。因此，低质量的输入会降低系统的性能。此外，由于手写风格的多样性，OCR 系统在手写文本识别方面仍面临诸多挑战。\n\
  \n尽管存在挑战，OCR 已成为全球工业自动化不可或缺的一部分，尤其是在处理各种文档格式方面。在本章中，我们将从 OCR 应用的基础知识开始，探索 OCR 流程的各个阶段。然后，我们将探讨一些可用于实时应用的主流\
  \ OCR 库和 API。\n\n## OCR 流程的阶段\n\n尽管现代 OCR 系统建立在深度学习框架之上，但我们将从讨论传统 OCR 系统开始，这将使我们更深入地了解\
  \ OCR 流程的各个阶段，以及它们如何转换给定图像以识别其中的字符。开发传统 OCR 系统涉及多个阶段，每个阶段都有特定目的，以实现高效的字符识别系统。在这些阶段中，图像将经历各种变换，最终识别出图像中的字符。在本节中，我们将逐一讨论这些阶段，并尝试深入理解每个\
  \ OCR 系统背后的过程。\n\n### 图像预处理\n\n此阶段涉及通过提高输入图像的质量并将其转换为适合进一步处理的形式，为字符识别做准备。此阶段涉及的关键技术讨论如下。\n\
  \n噪声抑制：\n\n正如第 5 章所讨论的，实时捕获的图像通常容易受到噪声的影响，这会降低图像质量，使其难以进行后续处理。因此，需要首先处理这些噪声，通过使用合适的滤波器（如高斯模糊或中值滤波）进行平滑处理来增强图像质量。回顾我们之前的讨论，在应用这些滤波器时，必须选择合适的核大小以获得更好的结果。\n\
  \n1.  对比度增强\n\n    许多照片、工业图像和扫描文档的对比度较低，导致文本和背景显得模糊或融合在一起。因此，OCR 算法难以区分它们，可能导致错误。通过增加对比度，我们可以简化从背景中区分单个字符的过程。通过简化分割过程，OCR\
  \ 软件可以隔离每个字符以确保准确识别。可以使用对比度拉伸、直方图均衡化、自适应直方图均衡化等流行技术来增强图像的对比度。通过使用适当的对比度增强技术，我们可以确保\
  \ OCR 系统接收到最清晰、最易读的输入。\n\n2.  二值化\n\n    由于我们只对识别给定图像中的字符感兴趣，颜色信息变得无关紧要，因此最好将图像转换为黑白两色。这有两个目的：降低计算复杂度（因为三通道\
  \ RGB 图像被转换为只有两个值（0 表示黑色，1 表示白色）的单通道二值图像），并清晰地将文本与背景区分开。回顾我们之前的讨论，对彩色图像进行二值化涉及两个步骤：将图像转换为灰度图像，然后应用阈值处理（全局或局部）将其转换为黑白图像。\n\
  \n3.  倾斜校正\n\n    倾斜校正是纠正图像中倾斜或歪斜文本的过程，通过使其水平来确保准确识别。图像中产生倾斜的常见原因包括：对带有文本的物体（或文档）扫描或拍摄不完美、拍摄时的相机角度，或物体的物理变形。倾斜校正至关重要，因为倾斜的文本会显著阻碍\
  \ OCR 系统的性能，使字符分割变得更加困难。这种未对齐的字符可能导致字符识别错误，降低系统的准确性。可以使用霍夫变换等主流技术来确定文本的倾斜角度，然后应用旋转变换来校正倾斜，使文本水平。\n\
  \n\n\n### 字符分割\n\n当图像准备好进行进一步处理后，流程的下一步是分割图像中的单个字符。本节将讨论一些主流的字符分割技术。\n\n1.  连通分量分析\n\
  \n    OCR 中一种常用的字符分割方法是连通分量分析（CCA）。它涉及定位和分离可能代表图像中不同字符的、相互关联的像素簇。该分析包含以下步骤：\n  \
  \  1.  标记：在二值图像中，为每个黑色像素分配一个唯一的标签。此标记过程会产生初始片段，每个片段代表一个潜在的字符。\n\n    2.  邻域分析：算法在图像中移动时，会比较相邻像素的标签。如果两个相邻像素具有相同的标签，则它们被视为属于同一个连通分量。如果它们的标签不同，则表明字符之间可能存在潜在边界。\n\
  \n    3.  标签传播：标签会进行迭代更新以合并连通分量。当识别出两个具有不同标签的相邻像素属于同一个字符时，该分量被合并，并将其中一个标签更改为另一个。\n\
  \n    4.  分量提取：在标签传播之后，图像中的每个连通分量都被分配一个唯一的标签，该标签对应一个不同的字符或符号。然后，这些分量被提取为独立的图像，以便\
  \ OCR 流程进行后续处理。\n\n    连通分量分析的一个重要方面是它对字体大小和方向的变化具有相当强的鲁棒性。尽管这种技术简单有效，但在处理接触或重叠字符时会遇到困难。该技术是工业应用的理想选择，这些应用通常涉及识别条码、标签或序列号，其中的文本定义明确且可控。\n\
  \n2.  基于投影的方法\n\n    该技术背后的关键思想是将二值图像中的像素强度投影到单个轴（水平或垂直）上，以创建投影轮廓，从而揭示文本排列中的模式。文本行的分割以及行内单词的分割是通过水平轮廓实现的，这涉及对图像每行的像素值求和；而单词内字符的分割则通过垂直轮廓实现，这涉及对图像每列的像素值求和。投影轮廓中的波谷或凹陷可用于识别字符之间的边界。基于投影的方法计算效率高，适用于间距清晰、字体大小一致的文本。与连通分量分析类似，该技术在处理重叠字符时也可能遇到困难。为了提高准确性，该技术通常与连通分量分析等其他技术结合使用。\n\
  \n#### 特征提取\n\n一旦我们完成了字符分割，下一步就是以适合识别算法的方式来表示这些字符。我们将在此讨论一些主流的特征提取技术：\n\n1.  统计特征\n\
  \n    统计特征提取通过将原始像素数据转换为反映字符基本属性的数值表示，在光学字符识别（OCR）中发挥着至关重要的作用。统计特征利用了字符图像中像素强度的统计特性。每个字符区域内的像素强度被用来生成统计特征，例如平均强度、方差、偏度、峰度、直方图属性、纹理特征、共生矩阵特征、游程长度特征和基于矩的特征。每个字符的视觉属性，如形状、纹理、强度分布和空间关系，都可以通过提取的统计特征得到紧凑且信息丰富的表示。此外，还可以使用特征选择技术来识别最具区分力的特征。\n\
  \n2.  形状描述符\n\n    形状描述符是一类重要的特征，它捕捉字符的几何特征和轮廓，这对于区分不同字符至关重要。在使用形状描述符之前，需要对包含文本的输入图像进行预处理和分割，以分离出单个字符。上一章讨论的任何分割技术都可以用于此目的。然后，可以从分割后的字符中提取轮廓或边界来表示其形状。轮廓被表示为一系列坐标，用以描述每个字符的边界。为了捕捉字符的几何属性，使用提取的轮廓生成形状描述符。一些常见的形状描述符包括边界框、傅里叶描述符、基于区域的形状描述符（如矩）等。\n\
  \n\n\n### 字符识别\n\n借助从图像中提取的特征，可以识别并提取出给定图像中的字符。传统 OCR 系统中早期常用的一种技术是模板匹配。一些传统的机器学习技术也常被用于字符识别。我们将简要讨论这两种技术，以理解其基本原理。\n\
  \n1.  模板匹配\n\n    传统的 OCR 系统使用一种称为“模板匹配”的基本技术来识别图像中的字符。该技术将预定义的字符模式或模板与输入图像的对应区域进行比较。首先创建模板，以描绘每个字符在不同尺度和方向下的视觉外观。然后对输入到\
  \ OCR 系统的图像进行预处理，以提高可读性。在匹配过程中，系统会系统地扫描图像，并计算模板与图像区域之间的相似度度量。在字符模板与图像内容高度吻合的区域，会产生高匹配值。显示出高度相似性的区域会被标记为可能的字符匹配。为了识别图像中的每个字符区域，会将匹配值最高的模板与之关联。尽管模板匹配是一种简单直接的技术，但它无法处理尺度、旋转或不同字体样式上的变化。\n\
  \n2.  机器学习\n\n    机器学习技术可以学习从字符中提取的特征之间的模式和关系，并利用这些知识有效地识别图像中的文本。常用的监督学习算法包括 k 近邻（kNN）、支持向量机（SVM）、人工神经网络（ANN）等，这些算法使用包含大量字符图像及其对应标签的数据集进行训练。特征提取技术（如我们在上一节中讨论的那些）可用于从图像中的字符提取有意义的信息。在训练阶段，这些特征可以被输入到机器学习模型中，模型将学习将这些特征与正确的字符标签关联起来。为了达到最佳性能，会迭代地调整模型参数，以最小化训练数据集上的分类误差。然后，训练好的模型可用于对训练数据集中未曾出现过的新字符图像进行分类。尽管基于传统机器学习的\
  \ OCR 系统不如基于现代深度学习的方法那样灵活和适应性强，但当有大量带标签的训练数据可用，并且需要复杂度最低的简单技术时，它们仍然可以很有效。\n\n在下一节中，我们将讨论一个基于传统机器学习的\
  \ OCR 系统，其中我们将使用 kNN 从给定图像中提取手写数字。这将让读者亲身体验如何创建一个在大型数据集上训练的机器学习模型。在后续章节中，我们将讨论一些最先进的基于深度学习的\
  \ API 和库，这些工具甚至可以从复杂图像中提取文本。\n\n## 使用 kNN 提取手写数字\n\n手写数字识别是光学字符识别（OCR）技术的一个关键组成部分，用于从图像中提取数字。为了学习每个手写数字的特征和模式，可以在包含大量手写数字图像的数据集上训练机器学习算法。然后，训练好的模型可用于识别新图像中的数字。在本节中，我们将使用\
  \ MNIST（改进的国家标准与技术研究院数据库）数据集，这是一个包含大量手写数字的集合，常用于训练不同的图像处理系统。该数据集包含 70,000 张手写数字（0-9）的灰度图像。每张图像的大小为\
  \ 28 x 28，并有一个对应的标签表示其所描绘的数字。这些图像被分为 60,000 张训练图像和 10,000 张测试图像。训练图像及其关联标签将提供给模型，以便模型学习如何从图像中确定标签。另一方面，测试图像可用于测试学习到的模型，并通过比较预测标签和实际标签来确定模型的准确性。通过其\
  \ *mnist* 模块，*keras* Python 库提供了对该数据集的便捷访问，使其成为新手和经验丰富的从业者的理想选择。\n\n我们将使用 k 近邻（kNN）算法来训练模型以分类手写数字。kNN\
  \ 是一种简单有效的监督学习算法，常用于分类和回归任务。在 kNN 分类过程中，数据集中的每个数据点都与一个类标签相关联，模型将被训练以确定与数据点对应的标签。当需要对一个没有标签的新数据点进行分类时，该算法使用预定义的距离度量来计算它与训练集中每个其他数据点的距离。然后确定该无标签点的\
  \ k 个最近邻。通过新数据点的 k 个最近邻进行多数投票，来决定该点的类别归属。kNN 分类算法基于这样一个理念：具有相似特征的数据点很可能属于同一类别。这种方法易于使用和理解，使其适用于各种分类问题。\n\
  \n以下代码展示了使用 kNN 实现手写数字识别的过程。让我们逐步讨论这段代码：\n\n1.  我们首先导入实现数字识别系统所需的库。\n\n2.  来自 *keras*\
  \ MNIST 数据集的 *load_data()* 函数加载用于手写数字识别的训练和测试数据。这里，*x_train* 和 *x_test* 分别代表训练和测试图像，*y_train*\
  \ 和 *y_test* 分别代表训练和测试标签。*x_train* 和 *x_test* 的大小分别为 (60000,28,28) 和 (10000,28,28)，而\
  \ *y_train* 和 *y_test* 的大小分别为 (60000) 和 (10000)。\n\n3.  我们绘制 *x_train* 数组中的前四张图像，以可视化手写数字的样本。我们使用\
  \ *y_train* 数组中表示相应数字的标签作为绘图标题，如图 9-1 所示。\n\n4.  接下来，使用 *reshape()* 函数将大小为 28 x\
  \ 28 的图像重塑为大小为 784（即 28*28 的乘积）的一维数组。训练和测试数据集的大小现在将分别为 (60000,784) 和 (10000,784)。\n\
  \n5.  然后，我们使用 *sklearn* 库中的 *StandardScaler()* 函数来缩放图像数据，使其具有零均值和单位方差。相应的缩放后的训练和测试图像数据分别存储在变量\
  \ *x_train_scaled* 和 *x_test_scaled* 中。\n\n\n\n6.  我们继续定义具有五个邻居的 kNN 模型，这意味着对于每张图像数据，将比较其五个最近邻，并通过它们类别值的多数投票来确定标签。使用*sklearn*库中的*KNeighborsClassifier()*函数来定义该模型。\n\
  \n7.  接着使用*fit()*方法训练模型。该方法接收经过缩放的训练图像数据*x_train_scaled*和对应的标签数据*y_train*。\n\n8.\
  \  使用*predict()*函数预测经过缩放的测试图像数据*x_test_scaled*的标签。预测的标签存储在变量*y_pred*中。\n\n9.  然后，*sklearn*库中的*accuracy_score()*方法可以接收实际标签*y_test*和预测标签*y_pred*，并提供预测的准确率，即模型正确识别的图像百分比。该模型对手写数字的预测准确率达到\
  \ 94.43%。\n\n10. 最后，我们从*x_test_scaled*变量中取一个样本图像数据，然后使用*predict()*函数获取该图像的预测标签。接着，我们使用*matplotlib*库显示来自*x_test*变量的对应原始图像，并使用*text()*函数在同一图形中显示标签，如图\
  \ 9-1 和图 9-2 所示。\n\n```\nfrom sklearn.neighbors import KneighborsClassifier\nfrom\
  \ sklearn.preprocessing import StandardScaler\nfrom sklearn.metrics import accuracy_score\n\
  from tensorflow.keras.datasets import mnist\nimport matplotlib.pyplot as plt\n#\
  \ 加载 mnist 数据\n(x_train, y_train), (x_test, y_test) = mnist.load_data()\nprint(x_train.shape)\n\
  print(y_train.shape)\n# 显示训练数据集中的前四张图像\nfor i in range(4):\nplt.subplot(2,2,i+1)\n\
  plt.imshow(x_train[i],cmap='gray')\nplt.title('标签: {}'.format(y_train[i]))\nplt.show()\n\
  # 将数据重塑为一维数组\nx_train = x_train.reshape(len(x_train), 28 * 28)\nx_test = x_test.reshape(len(x_test),\
  \ 28 * 28)\nprint(x_train.shape)\n# 缩放数据\nscaler = StandardScaler()\nx_train_scaled\
  \ = scaler.fit_transform(x_train)\nx_test_scaled = scaler.transform(x_test)\n# 定义\
  \ KNN 模型\nknn = KneighborsClassifier(n_neighbors=5)\n# 训练模型并进行预测\nknn.fit(x_train_scaled,\
  \ y_train)\ny_pred = knn.predict(x_test_scaled)\n# 评估性能\naccuracy = accuracy_score(y_test,\
  \ y_pred)\nprint(\"准确率: {}%\".format(accuracy*100))\n# 样本预测\nnew_image = x_test_scaled[0].reshape(1,\
  \ 28 * 28)\nprediction = knn.predict(new_image)\nplt.imshow(x_test[0].reshape(28,28),cmap='gray')\n\
  plt.title('测试图像')\nplt.text(10, 3, '标签: {}'.format(prediction[0]), fontsize=12,\
  \ bbox=dict(facecolor='white', alpha=0.9))\nplt.show()\n```\n\n![](img/604620_1_En_9_Fig2_HTML.jpg)\n\
  \n一张测试图像。它在深色背景上以像素化视图显示数字 7。数字上方显示：标签、冒号、7。\n\n图 9-2\n\nkNN 模型检测到标签的测试图像\n\n![](img/604620_1_En_9_Fig1_HTML.jpg)\n\
  \n四幅插图在深色背景上描绘了手写数字的像素化视图。标签 5 描绘数字 5。标签 0 描绘数字 0。标签 4 描绘数字 4。标签 15 描绘数字 1。\n\n\
  图 9-1\n\nMNIST 数据集中的样本图像\n\n## 用于 OCR 的云 API\n\nAPI，即应用程序编程接口，是一组促进不同软件程序之间通信的规则和工具。API\
  \ 可用于多种用途，包括开发利用其他软件组件功能的应用程序、集成第三方功能以及访问网络服务。在云计算背景下，API 至关重要，因为它们使开发者能够以编程方式与云资源和云服务进行交互。\n\
  \n云 API 为开发者提供了可扩展且实用的方式，利用基于云的服务从文档或图像中提取文本。这些 API 通常为开发者提供一个易于使用的标准化接口，通过该接口，他们可以将\
  \ OCR 功能集成到自己的应用程序中，而无需从头开始构建和维护 OCR 能力。用户可以将文件提交到云服务，云服务使用先进的 OCR 算法处理内容。提取的文本连同边界框、置信度分数等其他元数据一起返回给用户。云\
  \ OCR API 利用深度学习技术和强大的计算资源，在文本提取活动中实现高效率和准确性。在本节中，我们将讨论由全球领先的云服务提供商 Google®和 Microsoft®提供的两个最著名的计算机视觉\
  \ API。这些 API 能够从更复杂的图像中检测多种语言。\n\n\n\n### 使用 Google^® Cloud Vision API 进行 OCR\n\n\
  Google^® 在 Google^® Cloud Platform (GCP) 套件下提供了一系列云计算服务。借助其广泛的平台和基础设施服务，客户可以在 Google^®\
  \ 云基础设施上构建、部署和扩展应用程序和服务。GCP 提供的关键组件和服务可分为计算服务、存储和数据库、网络、大数据和机器学习、身份与安全、开发者工具、物联网\
  \ (IoT) 以及管理工具。开发者可以通过使用 Google^® Cloud Platform 提供的大量 API，将其应用程序与不同的 Google^® Cloud\
  \ 服务集成。\n\nGCP 提供的关键 API 之一是 Google^® Cloud Vision API，它提供了强大的预训练机器学习模型，允许开发者执行各种图像分析任务，如分类、目标检测、OCR\
  \ 等。OCR 由两个注释功能支持：`TEXT_DETECTION`（用于检测和提取任何类型图像中的文本）和 `DOCUMENT_TEXT_DETECTION`（针对密集文本和文档进行了优化）。Google^®\
  \ Cloud 通过提供可经由 API 部署的预训练 ML 模型来提供这些 OCR 解决方案。在我们讨论如何使用此 API 之前，特此告知读者，需要使用已配置了结算账户的\
  \ Google^® Cloud 订阅才能使用该 API。此外，还需要在 Google^® Cloud Console 中创建一个新项目以开始配置 API，并且该项目需要链接到结算账户。这些方面超出了本书的范围，在本节中，我们将把讨论限制在\
  \ API 的配置和使用上。\n\n使用 Google^® Cloud Vision API 实现 OCR 需要两个独立的步骤。第一步是配置 Vision API\
  \ 并创建一个访问密钥以使用该 API，第二步是下载用于 Python 的 Google^® Cloud Vision 库以实现文本检测算法。让我们从使用 Google^®\
