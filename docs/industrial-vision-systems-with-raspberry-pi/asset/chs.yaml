  ## 图像数据类型之间的转换


  在处理图像时，我们经常发现需要根据每个应用的特定要求来更改图像的数据类型。例如，从前一节的示例中我们看到，Matplotlib 包中的 *imshow* 函数会以
  BGR 通道顺序显示使用 OpenCV 包读取的图像。因此，为了正确显示彩色图像，有必要将 BGR 图像转换为 RGB 图像。这可以通过使用 OpenCV 函数
  `cv2.cvtColor` 来实现，该函数将包含输入图像的变量和转换类型的函数作为参数。


  通过将函数 `cv2.COLOR_BGR2RGB` 作为参数提供给 `cvtColor` 函数，可以实现从 BGR 图像到 RGB 图像的转换。类似地，用于将
  BGR 图像转换为 2D 灰度图像的函数是 `cv2.COLOR_BGR2GRAY`。另一方面，转换为二值图像是使用 `cv2.threshold` 函数通过阈值操作完成的。该函数接受四个参数：包含灰度输入图像的变量、阈值、最大值（对于灰度图像为
  255）以及阈值方法。两种常用的阈值方法是二值阈值法和 OTSU 阈值法。我们将在本书的第 5 章讨论这两种类型，而在以下代码中，我们将使用 `cv2.THRESH_BINARY`
  函数说明二值阈值法。图 3-9 显示了上面讨论的不同图像转换。可以观察到，在 *imshow* 函数中，必须将颜色映射函数“gray”与图像变量一起提供，才能显示单通道图像，如灰度图像和二值图像。鼓励读者从
  OpenCV 文档中探索其他图像转换。


  ![](img/604620_1_En_3_Fig9_HTML.jpg)


  一张年轻女性的照片，呈现四种不同模式。a. 原始 BGR 图像。b. RGB 图像。c. 灰度图像。d. 二值图像。


  图 3-9


  图像数据类型转换


  ```

  import cv2

  import matplotlib.pyplot as plt

  a=cv2.imread("C:/Users/Lenovo/Pictures/Lenna.png")

  plt.subplot(221)

  plt.imshow(a)

  plt.title(''原始 BGR 图像'')

  b=cv2.cvtColor(a, cv2.COLOR_BGR2RGB)

  plt.subplot(222)

  plt.imshow(b)

  plt.title(''RGB 图像'')

  c=cv2.cvtColor(a, cv2.COLOR_BGR2GRAY)

  plt.subplot(223)

  plt.imshow(c,cmap=''gray'')

  plt.title(''灰度图像'')

  d=cv2.threshold(c,127,255,cv2.THRESH_BINARY)[1]

  plt.subplot(224)

  plt.imshow(d,cmap=''gray'')

  plt.title(''二值图像'')

  plt.show()

  ```




  ## OpenCV 中的基本图像操作


  裁剪、调整大小、旋转、翻转和模糊等基本图像操作也可以使用 OpenCV 执行。在本节中，我们将进行简要讨论并举例说明这些过程。图像的裁剪可以简单地通过我们之前在
  numpy 数组部分讨论过的索引切片来执行。调整大小操作可以使用 OpenCV 中的 `resize()` 函数执行。我们必须提供包含输入图像的变量、包含输出数组大小的元组（即输出图像所需行数和列数），以及用于调整大小操作的插值类型。有许多不同类型的插值函数，如
  `AREA`、`LINEAR`、`CUBIC` 等。如果未提供该参数，则默认采用 `LINEAR` 插值。


  OpenCV 中的 `rotate()` 函数可用于以 90 度的倍数旋转二维数组。包含二维输入图像的变量和旋转函数（例如 `ROTATE_90_CLOCKWISE`）必须作为参数提供给
  `rotate()` 函数。OpenCV 中的 `flip()` 函数可用于翻转输入图像。包含输入图像的变量和图像要围绕其翻转的轴（0 表示 x 轴，1 表示
  y 轴）必须作为参数提供给该函数。`blur()` 函数可用于模糊输入图像。模糊操作基本上是通过对输入图像应用平滑滤波器（低通滤波器）来执行的，这涉及将图像与核（掩码）矩阵进行卷积。滤波操作的细节将在第
  5 章中详细讨论。核矩阵的大小（以元组形式）必须与包含输入图像的变量一起作为参数提供给 `blur()` 函数。所有这些操作都在以下代码中进行了说明，相应的结果显示在图
  3-10 中。由于这些操作不需要颜色信息，因此原始图像首先被转换为灰度图像，然后进行上述所有操作。


