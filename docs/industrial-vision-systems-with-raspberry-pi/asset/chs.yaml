  \n在本节中，我们将讨论如何实现一个视觉系统，以确保螺栓的螺纹数量符合预定义的标准。我们首先定义一个函数 *thread_count()*，用于计算给定螺栓图像中的螺纹数量。该函数将图像和用于二值化阈值操作的阈值作为输入，如下代码所示。由于我们不关心颜色信息，因此首先将输入图像转换为灰度图像，然后使用\
  \ opencv 库中的 *bitwise_not()* 函数对其进行反转，并将其输入到我们在第 5 章中讨论过的 *threshold()* 函数中。我们作为\
  \ *thread_count()* 函数输入获得的阈值将提供给这个 *threshold()* 方法。然后，通过从最大像素值 255 中减去阈值图像中的像素值来反转这些像素，从而在白色背景上得到螺栓的黑色图像。接下来，我们使用\
  \ *findContours()* 方法从图像中提取轮廓，这有助于识别图像中由螺纹形成的不同形状。然后使用 *contourArea()* 方法确定每个轮廓的面积，该面积可用于过滤掉由图像中的噪声分量形成的虚假轮廓。这里我们使用面积阈值\
  \ 4，这意味着一个轮廓的面积必须大于 4 才能被视为一个螺纹。因此，可以通过计算面积大于 4 的轮廓数量来确定螺纹数量。\n\n```\nimport cv2\n\
  def thread_count(img, thres):\nimg_gray=cv2.cvtColor(img,cv2.COLOR_BGR2GRAY)\ninv_img=cv2.bitwise_not(img_gray)\
  \   #invert b&w colors\nres,thresh_img=cv2.threshold(inv_img, thres, 255, cv2.THRESH_BINARY_INV)\n\
  thresh_img=255- thresh_img\ncontours,hierarchy=cv2.findContours(thresh_img, cv2.RETR_TREE,cv2.CHAIN_APPROX_SIMPLE)\n\
  area = []\nfor i in range(len(contours)):\narea.append(cv2.contourArea(contours[i]))\n\
  count=len([num for num in area if num > 4])\nreturn count, thresh_img\n```\n\n现在，我们可以从\
  \ GUI 代码内部调用此函数，如下所示，将其应用于从视频中捕获的实时帧。与我们之前的螺纹质量检测系统一样，我们在一个框架内放置了两个视频画布，一个用于显示捕获的视频帧，另一个用于显示使用\
  \ *thread_count()* 函数进行阈值处理后的反转帧。另一个框架包含两个标签：一个标签带有文本 *Thread count*，旁边是一个用于显示计数的文本小部件；另一个标签用于显示是否在螺栓图像中检测到故障。我们将捕获的帧传递给\
  \ *thread_count()* 函数，该函数将产生两个输出：存储在变量 *sumt* 中的螺纹计数，以及存储在变量 *thresh_img* 中的阈值图像的反转版本。在我们的示例中，为该函数提供了阈值\
  \ 202，但该值将根据图像的性质而变化。原始视频帧显示在第一个画布中，反转帧显示在第二个画布中。\n\n然后，对 *sumt* 变量使用条件语句来确定螺栓是否存在任何故障。我们使用阈值\
  \ 20，这意味着输入的螺栓图像应至少有 20 个螺纹，如果少于这个数量，则判定为故障部件。因此，在条件为“*True*”的情况下，我们将字符串“*No fault\
  \ is detected*”传递给文本小部件；在条件为“*False*”的情况下，传递字符串“*Fault detected*”。为了使消息具有区分性，我们将“*True*”条件的结果显示为绿色，“*False*”条件的结果显示为红色。此外，在检测到故障部件时，我们使用\
  \ *winsound* 库中的 *beep()* 方法产生三声蜂鸣。我们可以通过调整 *beep()* 函数的两个输入参数来配置声音的频率和持续时间。两种用例分别如图\
