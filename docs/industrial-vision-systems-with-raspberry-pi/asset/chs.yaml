  \    import cv2\n    video_capture = cv2.VideoCapture('video.mp4')\n    while True:\n\
  \    ret, frame = video_capture.read()\n    # 在此处编写您的图像处理代码\n    cv2.imshow('Video',\
  \ frame)\n    if cv2.waitKey(1) & 0xFF == ord('q'):\n    break\n    video_capture.release()\n\
  \    cv2.destroyAllWindows()\n    ```\n\n\n\n## 案例研究 11.1：检测螺母和螺栓的螺纹质量\n\n视觉系统能够显著提升螺母和螺栓的质量控制流程，通过提供关于螺纹质量和特性的详细洞察。利用高分辨率摄像头和复杂的图像处理算法，视觉系统可以捕捉并分析螺纹的各个方面，包括螺距、深度、形状和表面光洁度。视觉系统的一个关键优势是能够检测肉眼可能无法发现的缺陷。例如，它可以识别不完整的螺纹，这可能导致装配不当并降低连接强度。它还可以检测螺纹损伤，如刻痕或毛刺，这些都可能损害紧固件的完整性。此外，视觉系统可以评估螺纹的整体质量，包括其均匀性和一致性。通过分析一批螺母和螺栓样本中的多个螺纹，系统可以检测出可能表明制造问题的螺距或深度变化。而且，视觉系统可以提供关于螺纹尺寸和特性的定量数据。这些数据可用于确保螺母和螺栓符合指定的标准和公差，也可用于工艺优化，使制造商能够识别并纠正生产过程中的问题。总体而言，视觉系统为评估螺母和螺栓的螺纹质量提供了一种全面且可靠的方法。其检测缺陷、评估螺纹质量以及提供定量数据的能力，使其成为确保紧固件在各种应用中可靠性和性能的宝贵工具。\n\
  \n在本案例研究中，我们将开发一个视觉系统来检查螺栓是否具有均匀间隔的螺纹，这对于确保螺栓的可靠性和安装便利性至关重要。我们首先设置一个连接到树莓派板的 Pi\
  \ 摄像头，用于捕捉实时视频流。此设置如图 11-1 所示。一旦摄像头设置好以捕捉其视线内的螺栓图像，我们需要按照第 2 章的讨论，在树莓派操作系统中进行初始配置。然后，我们需要使用\
  \ pip 安装 *picamera* 库。完成这些初始步骤后，我们就可以继续开发用于捕捉视频帧并确定螺纹质量的代码了。\n\n![](img/604620_1_En_11_Fig1_HTML.jpg)\n\
  \n一张照片展示了连接到树莓派板的 Pi 摄像头的设置。\n\n图 11-1\n\n将摄像头连接到树莓派板以捕捉螺栓图像\n\n我们将首先创建一个用于检测螺纹质量的函数，如下所示，开始代码开发。该函数为确定螺栓图像中螺纹间距所执行的操作如下：\n\
  \n1.  将输入帧转换为灰度图。\n2.  使用 *GaussianBlur*() 函数应用高斯模糊以减少噪声。\n3.  使用 *threshold()*\
  \ 函数应用阈值处理以获得二值图像。\n4.  轮廓检测：应用 *findContours()* 函数在二值图像中查找代表螺母螺纹的轮廓。\n5.  轮廓过滤：过滤掉过大或过小、可能是噪声的轮廓。这是通过对检测到的轮廓应用\
  \ *contourArea()* 函数确定的轮廓面积设置下限和上限阈值来实现的。\n6.  中心计算：对于每个有效轮廓，我们通过寻找其质心来计算轮廓的中心。这是通过以下步骤将轮廓近似为多边形来完成的：\n\
  \    1.  我们首先确定轮廓近似的容差参数 *epsilon*。这是通过将该参数设置为轮廓周长的一个小百分比（0.02）来实现的，周长使用 *arcLength()*\
  \ 函数确定。\n    2.  然后使用 *approxPolyDP()* 函数，利用上一步计算出的容差参数将轮廓近似为多边形。\n    3.  接下来，使用\
  \ *moments()* 函数计算近似多边形的矩。\n    4.  如果表示总像素数的零阶矩不为零，则我们使用一阶矩 *M[\"m10\"]* 和 *M[\"\
  m01\"]* 除以零阶矩 *M[\"m00\"]* 来计算近似多边形质心的 x 和 y 坐标。\n7.  最后，我们计算相邻螺纹中心之间的距离，然后计算螺纹之间的平均距离。如果螺纹之间的距离与平均距离的偏差在\
  \ 5 个像素的容差范围内，则认为螺纹是均匀间隔的。\n8.  为了在图像上显示螺纹是否均匀间隔的结果，我们使用 *putText()* 函数。\n\n该函数返回最终的图像，其中包含间距细节以及螺纹质量状态（“良好！”或“不良！”），如下代码所示。\n\
  \n```\nimport cv2\nimport numpy as np\nfrom picamera import PiCamera\nfrom picamera.array\
  \ import PiRGBArray\ndef detect_thread_quality(image):\ngray = cv2.cvtColor(image,\
  \ cv2.COLOR_BGR2GRAY)\n# 应用高斯模糊以减少噪声\nblur = cv2.GaussianBlur(gray, (5, 5), 0)\n\
  # 应用阈值处理以获得二值图像\n_, thresh = cv2.threshold(blur, 200, 255, cv2.THRESH_BINARY)\n\
  # 查找轮廓\ncontours, _ = cv2.findContours(thresh, cv2.RETR_TREE, cv2.CHAIN_APPROX_SIMPLE)\n\
  # 过滤掉过大或过小的轮廓\nvalid_contours = []\nfor contour in contours:\narea = cv2.contourArea(contour)\n\
  if 100 < area < 500:\nvalid_contours.append(contour)\n# 计算每个有效轮廓的中心\ncenters = []\n\
  for contour in valid_contours:\nepsilon = 0.02 * cv2.arcLength(contour, True)\n\
  approx = cv2.approxPolyDP(contour, epsilon, True)\nM = cv2.moments(approx)\nif M[\"\
  m00\"] != 0:\ncX = int(M[\"m10\"] / M[\"m00\"])\ncY = int(M[\"m01\"] / M[\"m00\"\
  ])\ncenters.append((cX, cY))\n# 计算相邻中心之间的距离\nif len(centers) > 1:\ndistances = [centers[i+1][0]\
  \ - centers[i][0] for i in range(len(centers)-1)]\navg_distance = sum(distances)\
  \ / len(distances)\nis_evenly_spaced = all(abs(d - avg_distance) < 12 for d in distances)\n\
  # 根据平均距离显示螺纹是否均匀间隔\nif is_evenly_spaced:\ncv2.putText(image, \"Threads are evenly\
  \ spaced\", (20, 30), cv2.FONT_HERSHEY_SIMPLEX, 0.8, (0, 255, 0), 2)\nstatus = 'Good!'\n\
  else:\ncv2.putText(image, \"Threads are not evenly spaced\", (20, 30), cv2.FONT_HERSHEY_SIMPLEX,\
  \ 0.8, (0, 0, 255), 2)\nstatus = 'Bad!'\n# 在螺纹周围画圆\nfor center in centers:\ncv2.circle(image,\
  \ center, 5, (0, 0, 255), -1)\nreturn status, image\n```\n\n在下一阶段，我们将使用该函数从视频流中的螺栓图像检测螺纹质量，并将结果显示在图形用户界面中。为此，我们将重用我们在第\
  \ 6 章中开发的图形用户界面，并根据我们的用例进行一些改进，如下所示。首先，我们从 picamera 库中导入 *picamera* 方法，该方法允许我们使用\
  \ Pi 摄像头捕捉图像，并导入 *PiRGBArray* 方法，该方法允许我们将捕捉到的帧作为原始 numpy 数组读取。图形用户界面由两个框架组成。第一个框架包含两个视频画布，第一个画布用于显示\
  \ Pi 摄像头捕捉到的帧，第二个画布用于显示由我们的函数返回的处理后的帧，并标记有螺纹中心以及包含螺纹间距细节的文本。第二个框架与包含画布的第一个框架平行放置，包含一个带有文本\
  \ *Thread Quality* 的标签小部件和一个用于显示从我们的函数接收到的螺纹质量状态的输入小部件。图形用户界面中显示的最终输出如图 11-2 所示。\n\
