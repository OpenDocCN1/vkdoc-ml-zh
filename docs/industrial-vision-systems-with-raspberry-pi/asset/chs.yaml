  ```\n\n## 案例研究 11.2：识别一组组件中的不匹配组件\n\n识别工业组件涉及识别其特性、功能和规格。这项技能对于制造、汽车和电子等行业的维护、维修和更换活动至关重要。以下是在工业环境中识别合格与不合格零件的方法：\n\
  \n*   **物理检查**：首先目视检查组件。寻找任何损坏、磨损或腐蚀的迹象。检查是否有任何可见的标记或标签，指示零件编号、制造商或规格。\n\n*   **测量**：使用精密测量工具，如卡尺、千分尺或量规，测量组件的尺寸。将测量值与制造商提供的规格进行比较，以确保其在公差范围内。\n\
  \n*   **功能测试**：如果可能，测试组件以确保其功能正常。这可能涉及将其连接到测试台或系统以验证其性能。\n\n*   **文档查阅**：参考技术文档，如手册、数据表或原理图，以识别组件并验证其规格。将信息与组件的物理特性进行交叉引用。\n\
  \n*   **制造商信息**：查找任何指示组件制造商的标记或标签。这有助于验证其真实性和质量。\n\n*   **在线资源**：使用在线资源，如制造商网站、论坛或数据库，来研究组件并查找相关信息。\n\
  \n*   **咨询**：如果对组件的识别不明确，请咨询可能具有类似组件经验的同事、行业专家或供应商。\n\n在工业环境中识别合格与不合格零件对于保持运营效率、确保安全和避免代价高昂的停机时间至关重要。通过遵循这些指南并使用正确的工具和资源，可以准确识别工业组件，从而对其维护和更换做出明智的决策。\n\
  \n实施用于识别合格与不合格零件的工业视觉系统具有众多优势。首先，此类系统提供高精度，超越人工检测方法并减少错误。其次，它们高速运行，提高生产效率并最大限度地减少停机时间。第三，工业视觉系统确保结果一致，对所有零件应用相同的检测标准。此外，虽然可能存在初始设置成本，但由于减少了劳动力支出并提高了运营效率，这些系统从长远来看可能具有成本效益。而且，这些系统非常灵活，可以轻松适应检测不同零件或适应生产过程的变化。它们还能实现数据收集，用于分析和流程改进。此外，将视觉系统与其他工业系统集成，可以实现完全自动化的生产线。通过及早发现缺陷，这些系统提高了产品质量并减少了浪费。最后，通过自动化检测过程，工业视觉系统最大限度地减少了在危险环境中进行人工检测的需求，从而提高了工作场所的安全性。\n\
  \n在本案例研究中，我们将开发一个系统，使用一种称为模板匹配的技术来识别不匹配的组件。我们将首先定义一个用于识别不匹配组件的函数，然后像之前的用例一样，在 GUI\
  \ 代码内部调用此函数，以将函数应用于实时视频帧。以下代码说明了此函数，该函数将捕获的视频帧以及合格和不合格图像的模板图像作为输入，并生成一张图像，其中每个组件的状态都标记在其上，并带有一个边界框。以下是代码中涉及的步骤：\n\
  \n\n\n*   **模板匹配**：使用 *OpenCV 的 matchTemplate()* 函数在视频的每一帧中查找模板。该函数的参数包括输入帧、模板图像以及模板匹配模式。在我们的示例中，我们使用了\
  \ *TM_CCOEFF_NORMED* 模式，该模式利用归一化互相关系数来衡量捕获帧与模板图像之间的相似度。\n\n*   **寻找最佳匹配**：接着，使用\
  \ *numpy* 库中的 *where()* 函数，通过与一个阈值进行比较，来定位每一帧中每个模板的最佳匹配位置。这个阈值有助于过滤掉置信度较低的匹配，从而减少误报。上述两个步骤分别针对\
  \ OK 图像和 Not OK 图像各执行一次。\n\n*   **绘制矩形**：然后，使用 *rectangle()* 函数在检测到的区域周围为 OK 和 Not\
  \ OK 图像分别创建边界框，并使用 *putText()* 函数将这些区域分别标记为“OK”或“Not OK”。\n\n```\nimport cv2\nimport\
  \ numpy as np\nimport cv2\nimport numpy as np\ndef component_id(frame, template_ok,\
  \ template_not_ok):\nw_ok, h_ok = template_ok.shape[::-1]\nw_not_ok, h_not_ok =\
  \ template_not_ok.shape[::-1]\n# Convert frame to grayscale\ngray_frame = cv2.cvtColor(frame,\
  \ cv2.COLOR_BGR2GRAY)\n# Perform template matching for \"OK\" part\nres_ok = cv2.matchTemplate(gray_frame,\
  \ template_ok, cv2.TM_CCOEFF_NORMED)\nthreshold_ok = 0.8\nloc_ok = np.where(res_ok\
  \ >= threshold_ok)\n# Perform template matching for \"Not OK\" part\nres_not_ok\
  \ = cv2.matchTemplate(gray_frame, template_not_ok, cv2.TM_CCOEFF_NORMED)\nthreshold_not_ok\
  \ = 0.8\nloc_not_ok = np.where(res_not_ok >= threshold_not_ok)\n# Draw rectangles\
  \ for \"OK\" part\nfor pt in zip(*loc_ok[::-1]):\ncv2.rectangle(frame, pt, (pt[0]\
  \ + w_ok, pt[1] + h_ok), (0, 255, 0), 2)\ncv2.putText(frame, 'OK', pt, cv2.FONT_HERSHEY_SIMPLEX,\
  \ 0.5, (255, 255, 255), 2)\n# Draw rectangles for \"Not OK\" part\nfor pt in zip(*loc_not_ok[::-1]):\n\
  cv2.rectangle(frame, pt, (pt[0] + w_not_ok, pt[1] + h_not_ok), (0, 0, 255), 2)\n\
  cv2.putText(frame, 'Not OK', pt, cv2.FONT_HERSHEY_SIMPLEX, 0.5, (255, 255, 255),\
  \ 2)\nreturn  frame\n```\n\n该函数将返回处理后的帧，其中每个对象都被边界框包围并带有相应的标签。下一步是在 GUI 代码中调用此函数，将其应用于网络摄像头捕获的帧上，如下所示。GUI\
