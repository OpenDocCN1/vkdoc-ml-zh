  ### 缩放


  在基于视觉的图形用户界面中，滑块常被用于实时调整图像的某些参数。缩放小部件允许我们在图形用户界面中创建一个覆盖一定数值范围的滑块。在以下代码中，我们通过点击按钮来浏览并选择一张图像，然后使用滑块对图像进行放大或缩小。与之前的示例不同，这里的画布小部件需要同时响应按钮操作和滑块操作。因此，我们将加载和显示图像的功能分别封装成独立的函数（之前它们是在同一个函数中实现的），这样显示函数就可以同时被按钮操作和滑块操作调用了。


  让我们逐一分析这些函数。`load()` 函数用于触发按钮小部件的操作，与之前示例中的 `click()` 函数类似，它通过对话框窗口浏览并选择图像。不同之处在于，一旦我们从选中的图像获取文件名，并使用
  `imread()` 函数读取文件后，我们会调用 `display()` 函数将图像推送到画布小部件上。我们对这个 `display()` 函数也做了一点小调整。由于每次移动滑块时，显示内容都需要更新为对应的缩放图像，因此我们首先检查画布上是否已经显示了一张图像，并确保在更新新图像之前将其移除。


  在显示图像之前，我们调用 `update()` 函数，将从滑块获取的缩放设置应用到原始图像上。在这个函数中，我们首先使用 `get()` 函数从缩放小部件获取缩放比例，并将其归一化。接着，我们将这个归一化后的值乘以原始图像的宽度和高度，从而确定新的宽度和高度。有了新的尺寸后，我们就可以使用
  `resize()` 函数相应地缩放原始图像。我们需要指定用于缩放图像的插值类型，在本例中我们使用了线性插值。最后，我们使用 `PhotoImage()` 函数将调整大小后的图像转换为适合显示的格式，然后在
  `display()` 函数内部通过 `create_image()` 函数将其推送到画布小部件上。


  最后一个函数是 `zoom_image()` 函数，它用于触发缩放小部件的操作。在这个函数内部，我们只需调用 `update()` 和 `display()`
  这两个函数来执行缩放操作，并将结果显示在画布小部件上。请注意，我们将包含原始图像、已显示图像和缩放后图像的变量声明为全局变量，以便在不同函数之间实现顺畅的通信。在函数定义之后，我们创建了应用程序窗口中将要使用的所有小部件。请注意，`Scale()`
  函数用于创建缩放小部件，该函数接收缩放功能的起始和结束范围、小部件的方向、指示小部件功能的标签以及触发缩放操作的函数作为输入。`set()` 函数用于将缩放小部件的初始位置设置为
  100。请注意，在 `update()` 函数中，这个值会被归一化为 1，这表示原始图像大小，因为将原始图像的宽度和高度乘以 1 会得到相同的图像。


  这里另一个需要注意的重要事项是，我们将之前描述的所有全局参数都初始化为 `None` 类型。这会导致在运行代码时，`update()` 函数中出现 `AttributeError`，因为缩放小部件会自动触发操作，而由于原始图像被初始化为
  `None` 类型，我们将无法在 `update()` 函数内部获取其高度或宽度。为了避免出现此错误，我们创建了一个异常处理，用空响应来替换错误提示。图 6-10
  展示了显示倾斜锯片图像在三种不同缩放比例下的图形用户界面窗口。


  ![](img/604620_1_En_6_Fig10_HTML.jpg)


  图像缩放应用程序窗口的 3 张截图。左图，缩放设置为 100。中图，缩放设置为 55。右图，缩放设置为 130。


  图 6-10


  带有缩放小部件用于缩放图像的图形用户界面


  ```

  from tkinter import *

  from tkinter  import filedialog

  from PIL import Image, ImageTk

  import cv2

  # action for Button widget

  def load():

  filename = filedialog.askopenfilename(filetypes=[("Image files", "*.png *.jpg *")])

  if filename:

  global displayed_img, img_cv, img

  img_cv=cv2.cvtColor(cv2.imread(filename), cv2.COLOR_BGR2RGB)

  display()

  # function to update the canvas widget

  def display():

  global displayed_img, img_cv, img

  if displayed_img:

  canvas.delete(displayed_img)

  displayed_img = None

  if img_cv is not None:

  update()

  displayed_img = canvas.create_image(0, 0, image=img, anchor=NW)

  canvas.image = img

  # resize the image to the new dimensions

  def update():

  try:

  global displayed_img, img_cv, img

  zoom_level= zoom_scale.get() / 100.0

  h,w,c=img_cv.shape

  width = int(w * zoom_level)

  height = int(h * zoom_level)

  resized_img=cv2.resize(img_cv,(width,height),interpolation= cv2.INTER_LINEAR)

  img = ImageTk.PhotoImage(Image.fromarray(resized_img))

  except AttributeError:

  print("")

  # action for Scale widget

  def zoom_image(value):

  update()

  display()

  # create the root window

  root = Tk()

  root.title("Image Zoom App")

  # create a canvas to display the image

  canvas = Canvas(root, width=512, height=512)

  canvas.pack()

  # create a button to load the image

  load_button = Button(root, text="Load Image", command=load)

  load_button.pack()

  # create a scale widget to zoom the image

  zoom_scale = Scale(root, from_=10, to=200, orient="horizontal", label="Zoom", command=zoom_image)

  zoom_scale.set(100)  # Initial zoom level (100%)

  zoom_scale.pack()

  # intialize the global variables

  img_cv = None

  displayed_img = None

  img = None

  root.mainloop()

  ```




  ## 工业视觉系统图形用户界面


  现在我们已经逐一介绍了图形用户界面应用程序中常用的组件，接下来我们将把多个图形组件整合在一起，构建一个可用于识别装配线中缺陷产品的综合视觉系统。我们使用网格布局来放置图
  6-11 所示的 GUI 组件。GUI 窗口被划分为五行两列的网格。


  ![](img/604620_1_En_6_Fig11_HTML.jpg)


  图形用户界面截图。显示内容为：加载参考图像、合格产品数量、不合格产品数量以及退出选项。


  图 6-11


  用于识别装配线缺陷产品的图形用户界面


  第一行包含一个显示该 GUI 所开发组织名称的*标签*控件。此处为便于说明，使用了一个由作者姓名首字母组成的虚构公司名称。通过在`grid()`函数中指定`columnspan`和`sticky`选项的值，该控件被扩展为跨越两列。`sticky`选项的`"ew"`值表示标签必须从其使用`columnspan`选项定义的区域左侧（西侧）拉伸至右侧（东侧）。此外，在`Label()`函数中使用了`borderwidth`和`relief`选项，为*标签*控件创建视觉边界效果。


  在第二行中，GUI 的版本号显示在该行末尾的第二列。通过将`grid()`函数中的`sticky`选项设置为`"e"`，实现了控件位于第二列最右侧的定位。为便于说明，我们仅提供了一个虚构的版本号
  1.0。应用程序的标题位于第三行中央，其实现方式与第一个标签类似，使用了`columnspan`和`sticky`选项。同样，为便于说明，我们仅提供了标题“视觉系统”。


  在第四行中，我们使用了两个*框架*控件，本章此前尚未讨论过该控件。*框架*控件仅用于将多个控件组合在一起。在第一个框架中，两个*画布*控件被组合在一起。第一个画布用于显示来自
  USB 摄像头的实时视频流。我们已在第 2 章中讨论了如何捕获视频和读取帧。此处我们仅做了一件事：使用`datetime`库中的`datetime.now()`获取当前时间，并使用
  OpenCV 库中的`putText()`函数将时间戳叠加到视频帧上。时间戳对装配线的管理人员来说可能非常方便，因为保存每个产品的检测时间戳有助于他们后续进行一些分析。第二个画布用于对视频帧执行边缘检测，并显示边缘检测后的视频。此处使用了第
  5 章讨论的 Canny 边缘检测器。


  第二个框架包含一个按钮控件以及一组标签和输入控件。按钮控件用于浏览并选择一张参考图像，随后可借助图像处理算法将该图像与装配线上捕获的产品图像进行比较，以识别缺陷产品。第一个和第三个输入控件用于显示装配线上合格与不合格产品的数量。每当我们的视觉系统检测到一个产品时，这些控件就会更新。第二个输入控件用于提供延迟时间，该时间根据装配线上两个连续产品到达的时间间隔进行设置。最后，在第五行提供了一个退出按钮，用于关闭根窗口。按钮的动作通过`close_window()`函数定义，如代码所示。代码中提供了充分的注释来解释每一部分。由于本章主要关注
  GUI 设计，因此说明重点在于构建 GUI，而不涉及通过将捕获的产品图像与参考图像进行比较来识别缺陷产品的后台过程。这将在后续章节中讨论。




