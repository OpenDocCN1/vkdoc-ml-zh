  ## 使用 Matplotlib 可视化图像


  Matplotlib 是一个用于 Python 编程的开源绘图库，可用于在 Python 中创建静态、动画和交互式可视化。Matplotlib 库提供了许多优势，使其成为
  Python 中流行的绘图库之一。其中一些优势如下：


  *   提供出版级别的质量绘图

  *   提供视觉样式和布局方面的自定义选项

  *   能够将绘图导出为多种文件格式

  *   提供类似 MATLAB 的界面


  Matplotlib 库的一个重要特性是能够创建子图，这有助于在单个窗口中可视化多个图形。子图选项基本上将图形窗口划分为多个网格，并允许用户在每个网格中显示不同的视觉效果。创建子图的格式是“subplot(*nrows,ncols,index*)”，其中
  *nrows* 表示行数，*ncols* 表示列数，*index* 表示网格编号（以锯齿形方式编号）。例如，“subplot(2,2,x)”将窗口划分为两行两列，x
  被替换为我们需要显示视觉效果的网格编号。此过程如图 3-5 所示。


  ![](img/604620_1_En_3_Fig5_HTML.png)


  Matplotlib 中的示例网格格式。它有四个分区，第一个网格中标记为 2, 2, 1，第二个网格中标记为 2, 2, 2，第三个网格中标记为 2, 2, 3，第四个网格中标记为
  2, 2, 4。


  图 3-5


  Matplotlib 中子图的网格格式


  `imshow()` 函数用于使用 Matplotlib 库可视化图像，我们需要将保存图像的变量传递给该函数。在上一节中，我们讨论了 Pillow 库提供的许多函数。现在，我们将把这些函数应用于我们的图像，并使用子图显示输出图像。此外，我们可以使用
  `title()` 函数为每个子图添加标题，我们需要将图像标题（用单引号或双引号括起来）传递给该函数。最后，应在末尾使用 `show()` 函数来显示图形窗口。如果不提供此函数，则不会产生任何视觉效果。以下代码说明了图像处理函数的应用。代码中的注释行使读者更容易理解。代码后面的图形显示了这些函数在子图中可视化的输出。以下代码和图
