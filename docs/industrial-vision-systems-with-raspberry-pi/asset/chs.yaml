  ### OpenCV 中的图像属性


  使用 PIL 包（即使用 `Image.open` 命令）和 OpenCV 包（即使用 `cv2.imread` 命令）读取图像所创建的变量之间存在一个重要区别。使用
  PIL 包读取“Lenna”图像创建的变量“a”的数据类型是“PngImageFile”。这种数据类型不支持对图像像素进行索引，因此难以手动使用数学运算来操作像素值。使用
  PIL 包处理像素的唯一方法是使用该包提供的预定义命令，例如我们之前讨论过的 `crop()`、`resize()` 等。


  使用 OpenCV 包读取“Lenna”图像创建的变量“a”的数据类型是“ndarray”。因此，可以通过索引访问单个像素，并且可以将 numpy 包提供的不同函数应用于此变量。例如，对包含“Lenna”图像的变量“a”应用
  `shape()` 命令将得到元组 (512, 512, 3)，这表明该变量是一个 3D 数组，包含三个大小为 512 x 512 的矩阵，分别对应蓝色、绿色和红色三个颜色通道。


  这引出了使用 PIL 和 OpenCV 包读取的图像类型之间的另一个显著区别。“png”、“jpeg”以及大多数其他相关文件扩展名的彩色图像基本上由这三个颜色通道组成：蓝色
  (B)、绿色 (G) 和红色 (R)。PIL 包使用 RGB 通道顺序，而 OpenCV 包使用 BGR 通道顺序。OpenCV 包中的 `imshow()`
  命令会将顺序更改为 RGB，然后显示图像。但是，如果我们使用 Matplotlib 包中的 *imshow* 函数，它将按照相同的 BGR 通道顺序显示图像。


  由于图像由三个颜色通道组成，图像中的每个像素都由对应于这三种颜色的三个值组成。从技术上讲，这意味着每个像素的颜色是通过混合蓝色、绿色和红色这三种基本颜色的不同深浅（强度）获得的。由于
  OpenCV 实现中包含图像的变量是一个 numpy 数组，因此可以使用本章前面讨论过的常规数组索引来访问像素值。例如，存储在变量“a”中的“Lenna”图像（矩阵）的第一个像素可以使用索引
  `a[1,1,:]` 获取，这意味着我们从所有三个颜色通道中访问第一行和第一列交叉处的值。


  另一个区别是 PIL 和 OpenCV 中的 size 函数提供不同的值。在 PIL 中，对于包含“Lenna”图像的变量“a”，size 函数产生元组 (512,
  512)，这基本上是 2D 图像的尺寸。第三个维度，即颜色通道数，不会在输出中显示，而在 OpenCV 的情况下，可以使用 numpy 的 shape 函数来显示它。OpenCV
  中的 size 函数提供图像中的总像素数，这实际上是从 shape 函数获得的元组中三个值的乘积，即 512 x 512 x 3 = 786432 像素。我们上面讨论的所有这些属性都使用表
  3-17 中的代码以及代码后的图形进行了说明。图 3-8 显示了这两个不同包中通道顺序引起的差异。


