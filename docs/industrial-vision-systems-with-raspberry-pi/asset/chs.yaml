  ## 使用 OpenCV 捕获视频


  在本节中，我们将了解如何使用 OpenCV 捕获视频并将视频保存到所需位置。第一步是使用 `VideoCapture(0)` 类创建一个用于捕获视频的对象，正如我们在前一章中所见。然后，我们需要使用
  `VideoWriter()` 类创建一个用于写入捕获视频的对象。我们需要向这个 Writer 类提供四个参数。第一个参数是视频要保存到的路径名和文件名。第二个参数是用于压缩帧的编解码器的
  4 字符代码。有许多不同的选项，例如 `H264`、`MPG1`、`WMVA`、`XVID` 等。我们可以使用 `VideoWriter_fourcc` 函数来设置所需的编解码器。第三个参数是视频的所需帧率。最后一个参数是一个元组，包含视频帧的大小（分辨率）。


  下一步将使用为视频捕获创建的对象的 `read()` 方法捕获帧，然后使用为写入捕获视频创建的对象的 `write()` 方法将帧保存到输出视频。这两个操作将在无限循环中执行，该循环可以通过指定的按键终止，正如我们在前一章中讨论的那样。循环终止后，我们可以销毁所有窗口并释放
  Capture 和 Writer 对象。我们还可以使用 `imshow()` 函数来显示我们正在录制的帧。以下代码总结了使用 OpenCV 捕获和保存视频的整个过程。


  ```

  import cv2

  vid=cv2.VideoCapture(0)

  filename = "C:/Users/User/Pictures/out.mp4"

  codec = cv2.VideoWriter_fourcc(''H'',''2'',''6'',''4'')

  framerate = 30

  resolution = (640,480)

  vid_out =cv2.VideoWriter(filename,codec,framerate,resolution)

  while(True):

  ret,frame=vid.read()

  vid_out.write(frame)

  cv2.imshow(''frame'',frame)

  key = cv2.waitKey(1)

  if key == ord("x"):

  break

  vid.release()

  vid_out.release()

  cv2.destroyAllWindows()

  ```


  ### 视频变换


  在大多数应用中，视频帧在分析信息之前需要进行变换。上一节讨论的图像操作可以应用于实时捕获的视频帧。例如，如果颜色信息不重要，则可以在进一步处理之前将帧转换为灰度图像。以下代码说明了实时应用于视频帧的三种不同操作。首先，将捕获的帧转换为灰度图像。接下来，将灰度图像裁剪成更小的尺寸。裁剪操作通常用于捕获感兴趣的区域。在此示例中，使用帧的高度和宽度来创建用于裁剪图像数组的索引。请注意，使用双斜杠（`//`）运算符进行除法，这表示整数除法，因为数组索引必须是整数。最后，使用模糊操作来平滑帧。


  ```

  import cv2

  vid=cv2.VideoCapture(0)

  framerate = 30

  resolution = (640,480)

  while(True):

  ret,frame=vid.read()

  gray = cv2.cvtColor(frame, cv2.COLOR_BGR2GRAY)

  h=gray.shape[0]

  w=gray.shape[1]

  gaussianblur = cv2.GaussianBlur(gray[h//2:3*h//2,w//2:3*w//2], (5, 5), 0)

  cv2.imshow(''blur'',gaussianblur)

  key = cv2.waitKey(1)

  if key == ord("x"):

  break

  vid.release()

  cv2.destroyAllWindows()

  ```


