  Maker 创新系列


  通过 Apress 的 Maker 创新系列，开启你的探索之旅！从基础的电学和元器件知识，到机器人技术和机器学习领域最前沿的选择，你将逐步学会打造精巧的硬件，并用尖端的软件对其进行控制。同时，你将掌握常用工具集的新技能和经验，这些技能可以应用于新项目，甚至开启全新的职业生涯。


  Apress 的 Maker 创新系列提供基于项目的学习，同时始终将理论和最佳实践置于核心位置。因此，你不仅能获得动手实践经验，还能学习行业术语，了解企业家、发明家和工程师是如何构思并执行硬件项目的。你将学会设计电路、编写
  AI 程序、为家庭甚至城市创建物联网系统，以及更多精彩内容！


  无论你是初出茅庐的爱好者，还是在自家地下室或车库里工作的经验丰富的创业者，你都能提升自己的技能，成为硬件设计和工程方面的专家。而且，通常使用的是低成本的开源软件，例如
  Raspberry Pi、Arduino、PIC 微控制器和机器人操作系统（ROS）。程序员和软件工程师也有很好的学习机会，因为许多项目和控制环境都基于流行的编程语言和操作系统，如
  Python 和 Linux。


  如果你想制造一个机器人、搭建智能家居、组装一个气象监测系统，或者使用面包板和电路设计软件创建一个全新的电路，这个系列都能满足你的需求！本系列书籍由富有创造力且经验丰富的创客编写，每一本都探讨了经过验证的和前沿的方法与技术，助你将愿景和项目变为现实。


  关于本系列的更多信息，请访问 [`https://link.springer.com/bookseries/17311`](https://link.springer.com/bookseries/17311)。


