  \ 库以访问 Vision API。以下是通过我们的 Python 代码利用 Vision API 服务所需的基本库：\n    1.  `google-auth-oauthlib`：此函数旨在通过与\
  \ OAuth 2.0（一种标准授权协议）集成来验证我们的用户凭据。\n\n2.  `google-cloud-vision`：此库将允许我们将视觉检测功能（包括\
  \ OCR）集成到各种应用程序中。\n\n\n\n这些库可以使用我们在前几章讨论过的 pip 函数进行安装。例如，云视觉库可以通过在命令提示符或终端中执行命令\
  \ *pip install google-cloud-vision* 来安装。一旦云配置完成并且所需的库安装完毕，我们就可以继续开发用于文本检测的代码。在本示例中，我们将使用图\
  \ 9-10 中所示的锯片图像。我们的目标是检测锯片标签上的文本。\n\n![](img/604620_1_En_9_Fig10_HTML.jpg)\n\n标题为“齿轮图像”的窗口截图。其中包含一张钢制齿轮的照片，中心有一个标签，上面写着\
  \ Powertex 品牌以及齿轮尺寸和安装细节。\n\n图 9-10\n\n尖头锯片图像\n\n以下代码演示了从锯片图像中提取文本的过程。像往常一样，我们首先导入代码所需的库。函数\
  \ *service_account.Credentials.from_service_account_file* 会根据我们之前创建的服务账号 JSON 密钥文件创建一个\
  \ *Credentials* 对象。该文件的路径作为输入传递给 *filename* 参数。参数 *scopes* 定义了授予服务账号的权限，而提供给此参数的\
  \ Cloud Vision API URL 则允许服务账号访问以使用 API 服务。*ImageAnnotatorClient* 类使用上一步创建的凭据创建一个客户端对象。\n\
  \n然后，我们使用 *io.open* 函数将输入的锯片图像作为原始二进制文件加载，以便将其提交给 Google^® Cloud Vision API。接下来，我们使用\
  \ *vision.Image* 函数从二进制文件创建一个图像对象，然后通过使用 *client.text_detection* 函数向 Cloud Vision\
  \ API 发出请求，以检测图像中的文本。生成的文本注释将存储在 *response* 对象中，然后可以通过遍历结果并在每次迭代中将文本描述保存到名为 *ocr*\
  \ 的变量中来提取这些注释。最后，我们可以打印这个 *ocr* 变量，以显示从标签中提取的全部文本，如下面的代码所示。可以看出，Google^® Cloud Vision\
  \ API 产生了相当不错的结果。您可能会注意到文本中存在一些细微错误，这可能是由于图像质量造成的。\n\n```\nfrom google.oauth2 import\
  \ service_account\nfrom google.cloud import vision\nimport cv2\nimport io\nimport\
  \ matplotlib.pyplot as plt\n# 创建客户端接口\ncredentials = service_account.Credentials.from_service_account_file(\n\
  filename=\"C:/Users/User/Downloads/storied-fuze-356305-48525d5682b6.json\",\nscopes=[\"\
  https://www.googleapis.com/auth/cloud-platform\"])\nclient = vision.ImageAnnotatorClient(credentials=credentials)\n\
  # 加载输入图像\nfilename = \"C:/Users/Lenovo/Downloads/Gear_new.png\"\nwith io.open(filename,\
  \ \"rb\") as f:\nbyteImage = f.read()\n# 创建图像对象并向 Vision API 发出请求\nimage = vision.Image(content=byteImage)\n\
  response = client.text_detection(image=image)\n# 遍历结果\nocr=''\nfor text in response.text_annotations[1::]:\n\
  ocr+= text.description+' '\nprint(\"检测到的文本: \\n\", ocr)\n检测到的文本:\n110mm 4³1 , 3\
  \ \" 20 to 16 mm N.MAX 14000RPM POWFRIEE PPT FOWER HOOLD POWERTEX 30T POWER TOOLS\
  \ QUALITY BLIM GUT TDKWA10430 Tungsten Carbide Tipped Saw Blade SKU NO.182100 Unplug\
  \ saw before mounting blade . Do not operate without saw blade querd . Always wear\
  \ eye protection.Pailure to head all warnings could resultin serious bodily injury\
  \ .\n```\n\n### 使用 Azure 计算机视觉 API 进行 OCR\n\n与 Google 类似，Microsoft^® 提供了一个名为 Azure\
  \ 的全方位云计算平台，该平台通过 Microsoft^® 管理的数据中心提供各种服务，用于开发、实施和管理应用程序及服务。无需投资和维护物理基础设施，Azure\
  \ 的基础设施即服务 (IaaS)、平台即服务 (PaaS) 和软件即服务 (SaaS) 功能使企业能够利用可扩展的计算资源、存储、网络和其他功能。\n\n在本节中，我们将讨论如何利用\
  \ Azure 的计算机视觉 API 服务对同一张锯片图像执行文本提取。与我们之前关于 Google 云的讨论类似，我们需要在 Azure 门户中创建和配置 Vision\
