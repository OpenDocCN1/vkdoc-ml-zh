  ## 树莓派中的 Python IDE


  在树莓派中，有许多不同的集成开发环境（IDE）可用于处理 Python 程序。我们将讨论三种最常见的 IDE，其中两种在树莓派操作系统中默认可用（Thonny
  和 Geany），第三种是随 Python 包新安装一起下载的默认 IDE（IDLE）。


