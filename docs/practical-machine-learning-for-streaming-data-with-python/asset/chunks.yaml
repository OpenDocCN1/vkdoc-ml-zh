    The `FileStream` method in a scikit-multiflow data module creates a data stream
    from a file source. As of September 2020, only CSV files were supported. You can
    take any static/batch dataset and convert it to streaming data.


    As a demonstration, let’s look at an absenteeism at the workplace dataset [[15](#499734_1_En_1_Chapter.xhtml#Par116)]
    that is publicly available on the UCI Machine Learning Repository [[16](#499734_1_En_1_Chapter.xhtml#Par117)].
    The dataset is in CSV format. It contains various attributes: employee ID, the
    reason for absence, month/day/season of absence, employee age, average workload
    per day, education, body mass index, absenteeism time in hours, and more. This
    dataset has 21 attributes and 740 observations.


    Figure [1-7](#499734_1_En_1_Chapter.xhtml#Fig7) is a snapshot of the dataset containing
    19 rows and 11 columns. Listing [1-7](#499734_1_En_1_Chapter.xhtml#PC9) uses the
    `FileStream` method to load the absenteeism-at-work CSV file and then convert
    it to a data stream. The `next_sample()` function retrieves the next sample. Also,
    the built-in functions, `has_more_samples()` and `n_remaining_samples()`, tell
    you if there are more samples and the number of remaining samples, respectively.


