    使用移动加权平均检验（HDDM_W）进行漂移检测基于 McDiarmid 界 [11]。McDiarmid 界是 Hoeffding 界的一种推广。HDDM_W
    涉及 *W 检验*，该检验使用加权移动平均值 [8]。


    清单 2-7 展示了在 scikit-multiflow 中使用 HDDM_W 进行概念漂移检测和警告区域检测。实验设置与清单 2-5 相同。唯一的区别在于此处使用的是
