    # 导入相关库

    import numpy as np

    from skmultiflow.drift_detection.hddm_w import HDDM_W

    # 初始化 HDDM_W 对象

    HW = HDDM_W()

    # 设置随机种子以确保结果可复现

    np.random.seed(123)

    # 从二项分布模拟一个大小为 1000 的数据流

    # 这里，n= 试验次数，p= 每次试验的概率

    n, p = 10, 0.6

    stream = np.random.binomial(n, p, 1000)

    stream[:10]

    # 输出 - array([5, 7, 7, 6, 5, 6, 3, 5, 6, 6])

    # 数据概念从索引 299 到 500 发生变化

    for j in range(299, 500):

    stream[j] = np.random.randint(5, high=9)

    # 将流元素添加到 DDM 并检查是否发生漂移

    for j in range(1000):

    HW.add_element(stream[j])

    if HW.detected_change():

    print(''在数据 '' + str(stream[j]) + '' 中检测到概念漂移 - 索引：'' + str(j))

