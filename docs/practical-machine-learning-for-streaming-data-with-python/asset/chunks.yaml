    ## 本章小结


    在本章中，你学习了流式数据及其相关的各种挑战、实际业务应用、窗口技术以及增量学习和在线学习算法。你还了解了 Python 中的 scikit-multiflow
    框架。


    下一章将讨论概念漂移检测和异常检测算法，以及如何使用 scikit-multiflow 框架在各种数据集上实现这些算法。


    # 2. 数据流中的概念漂移检测


    在上一章中，你了解了流式数据、其应用、窗口技术以及增量学习和在线学习算法。你还了解了 Python 中的 scikit-multiflow 框架以及各种流式数据生成器。本章将讨论在流式数据上下文中进行概念漂移检测的算法，并探讨相关技术以及如何使用
    Python 的 scikit-multiflow 框架实现它们。


    注意


    本章应用了 scikit-multiflow 框架（版本 0.5.3）漂移检测模块中的部分函数。此外，本章提供的代码参考了 scikit-multiflow
    框架的 API 参考文档（[`https://scikit-multiflow.readthedocs.io/en/stable/api/api.html`](https://scikit-multiflow.readthedocs.io/en/stable/api/api.html)）。


    ## 概念漂移


    第 1 章讨论了流式数据的各种挑战。其中一个主要挑战是概念漂移，即数据流的分布可能随时间发生变化。过去数据中存在的特定模式，在当前数据中可能变成另一种模式。因此，任何在历史数据上训练的批量学习模型都会因概念漂移而过时。


    在机器学习中，*概念* 指的是机器学习模型试图预测的变量或数量。*概念漂移* 指的是目标概念的统计属性随时间变化的现象 [1]。


    数据流的变化或概念漂移模式可以是渐变的，也可以是突变的 [2]。数据流的突变或突变概念漂移，意味着数据特征发生突然变化，例如均值变化、方差变化等。检测这些变化非常重要，因为它们在质量控制、系统监控、故障检测等方面有许多实际应用。然而，数据流的渐变或渐变概念漂移，指的是在比突变长得多的时间尺度上发生的*数据分布变化*。渐变相对更难识别。


    其他类型的数据流或概念漂移变化包括*增量概念漂移*和*循环概念漂移* [3]。在增量概念漂移中，数据流中的旧模式随时间逐步转变为新模式；然而，其转变时间远短于渐变概念漂移。在循环概念漂移中，你会看到旧数据流的特定特征在一段时间后再次出现。


    概念漂移检测算法有多种类型。本章重点介绍以下概念漂移检测算法：(a) 用于概念漂移检测的自适应窗口方法 (ADWIN)，(b) 漂移检测方法 (DDM)，(c)
    早期漂移检测方法 (EDDM)，(d) 基于霍夫丁界与移动平均检验的漂移检测方法 (HDDM_A)，(e) 基于霍夫丁界与移动加权平均检验的漂移检测方法 (HDDM_W)，以及
    (f) 使用 Page-Hinkley 方法的漂移检测。

