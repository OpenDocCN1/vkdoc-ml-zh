- fmt: '# Hoeffding Adaptive Tree Classifier


    第[2](#499734_1_En_2_Chapter.xhtml)章介绍了用于概念漂移检测的自适应窗口方法（`ADWIN`），该方法使用动态大小的滑动窗口。窗口大小不是固定的，而是根据窗口中观察到的数据变化率在线计算得出。`ADWIN`算法在未检测到数据流变化时增加窗口大小，在检测到数据流变化时减小窗口大小。


    `Hoeffding Adaptive Tree`使用`ADWIN`方法，是`Hoeffding`树的修改版本。首先，你需要理解概念自适应极速决策树（`CVFDT`）方法[[6](#499734_1_En_3_Chapter.xhtml#Par76)]。`CVFDT`方法更适合具有固有概念漂移的数据流。它更新内部节点和叶子节点的统计信息。核心思想是：每当在子树检测到变化时，它会生成一个候选子树，最终要么保留当前子树，要么丢弃候选子树。


    `Hoeffding Adaptive Tree`在分裂测试不再适用的节点处生成替代决策树[[6](#499734_1_En_3_Chapter.xhtml#Par76)]。旧树被更准确的新树替换。叶子节点上的决策基于最近的样本/观察窗口。需要为样本窗口分配内存；然而，`CVFDT`没有严格的性能保证。


    `Hoeffding Adaptive Tree`是对使用`ADWIN`的`CVFDT`的轻微修改。`ADWIN`的目的是监控每个子树和替代树的错误率。`Hoeffding
    Adaptive Tree`方法使用`ADWIN`估计值来做出叶子节点上的决策，以及决定是否生长新树或替代树。该方法无需为样本窗口分配内存；其准确率几乎与`CVFDT`相当，有时甚至表现更好。此外，还可以提供严格的性能保证。


