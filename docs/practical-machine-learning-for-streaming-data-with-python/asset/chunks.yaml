    ## Drift Detection Method


    The Drift Detection Method (DDM) was first proposed by Gama et al. [[6](#499734_1_En_2_Chapter.xhtml#Par33)].
    The DDM method can be applied with any learning algorithm; that is, with either
    incremental/online learning algorithms or batch learning algorithms. The idea
    is to keep track of the learning algorithm’s error rate. In a sample of *n* examples,
    the number of errors from the learning algorithm is a random variable from Bernoulli
    trials. You can use the binomial distribution to model the number of errors in
    *n* examples. At instant j, the error rate is denoted by p[j] with a standard
    deviation of σ[j] = sqrt(p[j](1-p[j])/j).


    The DDM method keeps a record of the p[min] and σ[min] while training the learning
    algorithm [[6](#499734_1_En_2_Chapter.xhtml#Par33)]. If p[j] + σ[j] >= p[min]
    + 2 * σ[min], then a warning is declared, which means that there is a change in
    the data stream. But if p[j] + σ[j] >= p[min] + 3 * σ[min], a change in the data
    stream is declared [[5](#499734_1_En_2_Chapter.xhtml#Par32)].


    Listing [2-3](#499734_1_En_2_Chapter.xhtml#PC3) illustrates concept drift detection
    using DDM. It simulates a data stream of size 1000 from a standard normal distribution
    and then changes the data concept from index 299 to 599 (i.e., replace values
    with integers between 5 and 9). It then calls the DDM() object and uses the detected_change()
    and detected_warning_zone() functions to identify concept drift in data streams
    and provide a warning about a change in the data streams, respectively. The final
    output is shown in Listing [2-4](#499734_1_En_2_Chapter.xhtml#PC4).


    ```

