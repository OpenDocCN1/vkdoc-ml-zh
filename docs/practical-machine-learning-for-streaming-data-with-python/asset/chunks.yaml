    ### 聚类


    k-means 聚类是一种适用于批量数据的流行聚类算法。它将数据划分为 k 个互不重叠的独立簇。其目标是使*簇内变异* [1] 非常低。该算法会为每个观测值随机分配一个
    1 到 k 之间的数字，从而创建初始的簇集合。然后，为这 k 个簇分别计算簇质心。接着，根据观测值与簇质心的接近程度（即距离度量，如欧氏距离）重新分配观测值。这些步骤会重复进行。当簇的分配不再发生变化时，迭代停止。（请注意，k
    值由用户提供。）


    *小批量 k-means 聚类方法*是 k-means 聚类算法的一种增量学习版本，可直接应用于数据流。它是 k-means 算法的一个变体，处理的是数据的小批量样本，而非整个数据集。由于在任何时间点都无法获得完整数据集，因此它特别适用于流式数据。小批量是输入数据流的子集，每次训练迭代时都会从中随机采样。


    小批量 k-means 聚类算法会选择一个由随机采样样本组成的小批量。然后执行通用的 k-means 算法，为每个样本分配最近的质心。下一步，针对小批量中的每个样本更新已分配的质心。重复执行这些步骤，直到达到收敛或指定的迭代次数。


    此外，除了使用随机采样来选择初始簇中心集，还可以使用 k-means++ 算法 [3] 作为一种随机播种技术来选择初始簇中心的初始值，这能实现更快的收敛。


    小批量 k-means 聚类算法可在 scikit-learn (sklearn) 库中找到。更多信息请访问 [`https://scikit-learn.org/stable/modules/generated/sklearn.cluster.MiniBatchKMeans.html`](https://scikit-learn.org/stable/modules/generated/sklearn.cluster.MiniBatchKMeans.html)。


    代码清单 4-1 将小批量 k-means 聚类应用于鸢尾花数据集。该数据集在 sklearn 库中公开可用，包含四个特征：花萼长度（厘米）、花萼宽度（厘米）、花瓣长度（厘米）和花瓣宽度（厘米）。代码清单
    4-1 应用了 **MiniBatchKMeans()**，并将簇数量指定为 3，小批量大小指定为 50。该代码清单在鸢尾花数据集上训练了小批量 k-means
    聚类模型，并在图 4-1 中展示了簇中心。


    ![../images/499734_1_En_4_Chapter/499734_1_En_4_Fig1_HTML.jpg](img/499734_1_En_4_Fig1_HTML.jpg)


    图 4-1

    小批量 k-means 聚类模型的簇中心


    ```

    ###############################################################

    # 导入相关库

    from sklearn import datasets

    from sklearn.preprocessing import StandardScaler

    from sklearn.cluster import MiniBatchKMeans

    # 加载数据

    iris = datasets.load_iris()

    X = iris.data

    # 数据快照

    X[0:6,]

    # 输出

    #array([[5.1, 3.5, 1.4, 0.2],

    #       [4.9, 3\. , 1.4, 0.2],

    #       [4.7, 3.2, 1.3, 0.2],

    #       [4.6, 3.1, 1.5, 0.2],

    #       [5\. , 3.6, 1.4, 0.2],

    #       [5.4, 3.9, 1.7, 0.4]])

    # 特征名称

    iris.feature_names

    # 输出:

    #[''sepal length (cm)'',

    # ''sepal width (cm)'',

    # ''petal length (cm)'',

    # ''petal width (cm)'']

    # 创建 k-means 对象

    clust_kmeans = MiniBatchKMeans(n_clusters=3, batch_size=50, random_state=333)

    # 训练模型

    model = clust_kmeans.fit(X)

    # 找出簇中心

    model.cluster_centers_

    ###############################################################

    代码清单 4-1

    在鸢尾花数据集上进行小批量 k-means 聚类

    ```


    scikit-learn 提供了小批量 k-means 聚类的一种替代方法，称为 *Birch 聚类* [7]。这是一种在线学习算法，它创建一种树形数据结构，簇质心可从叶子节点读取。建议您将此技术作为练习进行探索。有关
    scikit-learn 中 Birch 聚类的更多信息，请阅读官方文档：[`https://scikit-learn.org/stable/modules/generated/sklearn.cluster.Birch.html`](https://scikit-learn.org/stable/modules/generated/sklearn.cluster.Birch.html)。


    Apache Spark 的机器学习库 MLlib 中提供了*流式 k-means 聚类算法*。该算法能够动态估计簇，并在新数据到达时更新簇。该算法包含一个名为*半衰期*的参数，用于控制估计值的“衰减”。衰减因子决定了需要赋予历史数据多少权重。流式
    k-means 聚类算法使用了小批量 k-means 更新规则的泛化形式。


    本书不涉及其他增量聚类算法。


    一些最早的流式数据在线聚类算法已在 MOA 软件中实现。一种经过充分研究的数据流聚类方法是微聚类算法，它包含两个阶段。第一阶段是在线阶段，将数据流总结为局部模型（微簇）。第二阶段则根据这些微簇生成全局聚类模型。CluStream
    和 DenStream 是 MOA 中可用的两种基于微簇的在线聚类算法。


    接下来将讨论 Apache Spark、MOA 以及其他一些数据流挖掘工具。

    '
- fmt: '### Anomaly Detection


    `Anomaly detection` (or `outlier detection`) is the science of identifying events
    or examples that differ from the norm [[4](#499734_1_En_4_Chapter.xhtml#Par49)]
    (known as `anomalies`). Machine learning literature is replete with techniques
    for anomaly detection, especially in a batch learning context. Some of the unique
    characteristics associated with these anomalies are that they rarely occur in
    a dataset and their features are different from normal examples. Some of the practical
    applications of anomaly detection are intrusion detection, fraud detection, surveillance
    analytics, medical applications, and data leakage prevention.


    This chapter focuses on the `streaming half-space trees` (`SHST`) technique for
    anomaly detection in a streaming data context. The `SHST` algorithm is an incremental
    one-class anomaly detector for streaming data [[5](#499734_1_En_4_Chapter.xhtml#Par50)].
    One of the most useful features of this algorithm is that it can be trained with
    only genuine or normal instances and works well even when anomalies are extremely
    rare. This method is a random ensemble of half-space trees. A half-space tree
    (`HS-tree`) of depth `d` is defined as a full binary tree having `2^(d+1) − 1`
    nodes, where all leaves are at the same depth (i.e., `d`).


    Streaming half-space trees can create the tree structure from the data space dimensions
    alone and don’t need actual training examples. So, this method doesn’t need to
    perform any model restructuring to adapt to the streaming data. The model can
    be deployed before the arrival of streaming data. Moreover, the `SHST` algorithm
    has constant memory requirements and constant amortized time complexity.


    Listing [4-2](#499734_1_En_4_Chapter.xhtml#PC2) generates a data stream with anomalies
    using `AnomalySineGenerator`, available in the `scikit-multiflow` framework. It
    generates a data stream with 500 observations, out of which 100 are anomalies.
    A snapshot of the generated data stream is shown in Figure [4-2](#499734_1_En_4_Chapter.xhtml#Fig2).
    The rightmost column indicates whether an example is anomalous (i.e., if its 1,
    it is an anomaly; if it’s 0, it is normal). It then applies the `SHST` algorithm
    on this data stream using the `HalfSpaceTrees()` method available in the `scikit-multiflow`
    framework. It trains the model and performs a prediction, as shown in Listing
    [4-2](#499734_1_En_4_Chapter.xhtml#PC2).


    ![../images/499734_1_En_4_Chapter/499734_1_En_4_Fig2_HTML.jpg](images/499734_1_En_4_Chapter/499734_1_En_4_Fig2_HTML.jpg)


    **Figure 4-2** Snapshot of the data stream with anomalies


    ```

    ###############################################################

    # Import the relevant libraries

    import pandas as pd

    from skmultiflow.anomaly_detection import HalfSpaceTrees

    from skmultiflow.data import AnomalySineGenerator

    # Generate a data stream with anomalies

    dstream = AnomalySineGenerator(n_samples=500, n_anomalies=100, random_state=333)

    # Instantiate the Half-Space Trees estimator

    HS_trees = HalfSpaceTrees(random_state=333)

    #prep the data stream

    dstream.prepare_for_use()

    X, Y = dstream.next_sample(500)

    data = pd.DataFrame(np.hstack((X, np.array([Y]).T)))

    data.head()

    # Incrementally fit the model

    HS_trees_model= HS_trees.partial_fit(X, Y)

    # Predict the classes of the passed observations

    pred = HS_trees_model.predict(X)

    # Estimate the probability of a sample being anomalous or genuine

    prob = HS_trees_model.predict_proba(X)

    ###############################################################

    Listing 4-2

    Anomaly Detection Using Streaming Half-Space Trees

    ```


    ## Other Tools and Technologies for Data Stream Mining


    This section provides a high-level introduction to eight open source software
    tools for data stream mining: `MOA`, `Apache Spark`, `Apache Flink`, `Apache Storm`,
    `Apache Kafka`, `Faust`, `Creme`, and `River`. There are other tools available
    (both commercial and open source) for data stream mining, but they are outside
    the scope of this book.


    ### Massive Online Analysis (MOA)


    `Massive Online Analysis` (`MOA`) is an open source framework for mining data
    streams developed in Java. `MOA` is a GUI-based tool. It contains a collection
    of streaming data algorithms for supervised (classification, regression, etc.)
    and unsupervised learning (clustering, etc.) along with model evaluation tools
    [[6](#499734_1_En_4_Chapter.xhtml#Par51)]. Most of the supervised and unsupervised
    learning discussed in this book are available in `MOA`.


    Since `MOA` is GUI-based and primarily developed in Java, it may not appeal to
    Python developers/users. I recommend that you explore this tool. It can be downloaded
    from [`https://moa.cms.waikato.ac.nz`](https://moa.cms.waikato.ac.nz).


    ### Apache Spark


    `Apache Spark` is a software environment for performing high-speed processing
    and analytics on both batch and streaming data. It provides support for multiple
    languages such as Java, Python, and R. That’s why `Spark` (or `pyspark`) is a
    good alternative option for a Python user. `Spark` can access diverse data sources.
    It can run in the cloud or on `Mesos`, `Hadoop`, and `Kubernetes`. `Spark`’s stack
    of libraries includes `Spark SQL`, `Spark Streaming`, `MLlib` (for machine learning),
    and `GraphX` (for graph analytics). To download the latest version and to access
    the documentation, please visit [`https://spark.apache.org`](https://spark.apache.org).


    `Spark Streaming` is an extension of the core `Spark API`. It is a powerful tool
    for processing data streams at scale. It contains many high-level functions, such
    as `map`, `reduce`, `join`, and `window` for processing high-velocity data streams.
    `Spark Streaming` supports `MLlib` operations (i.e., streaming k-means clustering,
    streaming linear regression (a linear regression model with stochastic gradient
    descent fitted for each batch of the data), and more). The official `Spark Streaming`
    guide is at [`https://spark.apache.org/docs/latest/streaming-programming-guide.html`](https://spark.apache.org/docs/latest/streaming-programming-guide.html).


    ### Apache Flink


    `Apache Flink` is a unified batch and streaming data analytics engine. It provides
    highly flexible streaming windows for a continuous streaming model. It can perform
    in-memory computations at scale. `Flink` is integrated with many other open source
    data processing ecosystems, such as `YARN` and `Mesos`. `Flink` is very useful
    for event-driven applications such as anomaly detection, rule-based alerts, fraud
    detection, and business process monitoring. Please visit [`https://flink.apache.org`](https://flink.apache.org)
    to learn more about `Apache Flink`.


    ### Apache Storm


    `Apache Storm` is an open source distributed stream-processing computation framework.
    It is primarily developed in Clojure but works with multiple languages, such as
    Java and Python. `Apache Storm` is a very powerful tool for performing real-time
    processing on streaming data. It is a stream processing engine without batch support.
    It is a true real-time processing framework, taking in a stream as an entire event
    instead of series of small batches. It is scalable and works on parallel calculations
    that run across a cluster of machines.


    A `Storm` cluster is similar to what a `Hadoop` cluster is for batch data. To
    perform real-time computations in `Storm`, you create a `topology`, which is a
    directed acyclic graph of computation. A `topology` is made of `streams` (i.e.,
    an unbounded pipeline of tuples) and `spouts` (i.e., source of the data stream).
    A `Storm` cluster comprises two nodes: master nodes and worker nodes. The master
    node assigns tasks to machines and monitors their performance. A worker node assign
    tasks to other worker nodes.


    To download the latest version of `Apache Storm` and access the official documentation,
    please visit [`https://storm.apache.org/index.html`](https://storm.apache.org/index.html).'
