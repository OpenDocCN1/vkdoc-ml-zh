- fmt: '### Adaptive Random Forests


    A *random forest* is a very popular and widely used technique for machine learning
    on batch (non-streaming) data. In a random forest, multiple decision trees (built
    using resampled data and with a random subset of features) are combined to improve
    a model’s performance in terms of prediction accuracy. However, random forests
    can’t handle concept drift and require multiple passes over the dataset. It is
    not suitable for analysis in a streaming data context.


    An *adaptive random forest* (ARF) is an adaptation of the random forest technique
    in a streaming data context [[13](#499734_1_En_3_Chapter.xhtml#Par83)]. The ARF
    method uses online bagging to approximate resampling with replacement. However,
    instead of using a (λ = 1) Poisson distribution in online bagging, ARF uses a
    (λ = 6) Poisson distribution. (An overview of the online bagging method is presented
    later in this chapter.)


    The base model in ARF (i.e., random forest tree training (`RFTreeTrain`)) is based
    on the Hoeffding tree algorithm, but it has a few differences. One difference
    is that the `RFTreeTrain` doesn’t allow early tree pruning. Another difference
    is that whenever a new node is created, a random subset of features is created,
    and splits are limited to only these features. The ARF uses drift detectors in
    base trees that cause resets whenever there is a drift. ARF allows training background
    trees, which replace active trees if a drift is detected.


    The ARF technique can be used in classification tasks and regression tasks. Listing
    [3-22](#499734_1_En_3_Chapter.xhtml#PC22) illustrates applying the ARF classifier
