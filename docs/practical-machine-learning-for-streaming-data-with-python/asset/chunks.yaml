  raw: '### Hoeffding Adaptive Tree Classifier


    Chapter [2](#499734_1_En_2_Chapter.xhtml) introduced the adaptive windowing method
    for concept drift detection (ADWIN), in which a sliding window of dynamic size
    is used. The window size is not fixed; it is computed online based on the rate
    of change observed from the data in the window. The ADWIN algorithm increases
    the window size if it doesn’t see any change in the data stream and reduces the
    window size when there’s a change detected in the data stream.


    The Hoeffding Adaptive Tree uses the ADWIN method and is a modified version of
    the Hoeffding tree. First, you need to understand the Concept Adapting Very Fast
    Decision Tree (CVFDT) method [[6](#499734_1_En_3_Chapter.xhtml#Par76)]. The CVFDT
    method is more appropriate for data streams with inherent concept drift. It updates
    statistics at inner nodes and leaves. The core idea is that whenever a change
    is detected at a subtree, it grows a candidate subtree, and eventually, either
    the current subtree or the candidate subtree is dropped.


    The Hoeffding Adaptive Tree generates an alternate decision tree at nodes where
    the splitting test is no longer appropriate [[6](#499734_1_En_3_Chapter.xhtml#Par76)].
    The old tree is replaced by a new one, which is more accurate. The decisions made
    on the leaf are based on a recent examples/observations window. Memory needs to
    be allocated for an example window; however, there’s no rigorous performance guarantee
    with CVFDT.


    The Hoeffding Adaptive Tree is a slight modification of the CVFDT, which uses
    ADWIN. The purpose of ADWIN is to monitor the error of each subtree and the alternate
    trees. The Hoeffding Adaptive Tree method uses the ADWIN estimates to make decisions
    on the leaf and on growing new trees or alternate trees. This method doesn’t need
    to allocate memory for an example window; it is almost as accurate as of the CVFDT
    and sometimes even performs better. Also, a rigorous performance guarantee is
    possible.


    Listing [3-4](#499734_1_En_3_Chapter.xhtml#PC4) simulates a synthetic data stream
    with concept drift using the Agrawal generator. The Hoeffding Adaptive Tree classifier
    is applied to the synthetic data stream and evaluates the model’s performance
    using both a prequential evaluation and a Holdout evaluation.


    Listing [3-5](#499734_1_En_3_Chapter.xhtml#PC5) shows the output of the prequential
    evaluation approach. The accuracy obtained is 99.72%, whereas in the holdout approach,
    the accuracy obtained is 99.09% (as shown in Listing [3-6](#499734_1_En_3_Chapter.xhtml#PC6)).


