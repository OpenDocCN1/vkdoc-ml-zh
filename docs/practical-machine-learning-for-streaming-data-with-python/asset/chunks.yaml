    eval1 = EvaluatePrequential(pretrain_size=400, max_samples=300000,batch_size=1,n_wait=100,
    max_time=2000,show_plot=False, metrics=[''accuracy''])

    eval1.evaluate(stream=ds, model=model_hat)

    # 留出评估

    eval2 = EvaluateHoldout(max_samples=30000,

    max_time=2000,

    show_plot=False,

    metrics=[''accuracy''],

    dynamic_test_set=True)

    eval2.evaluate(stream=ds, model=model_hat)

    ###############################################################

    清单 3-4

    在合成数据流上应用霍夫丁自适应树分类器

