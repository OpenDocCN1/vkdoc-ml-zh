    import numpy as np

    from skmultiflow.drift_detection.adwin import ADWIN

    # set seed for reproducibility

    np.random.seed(123)

    # Simulate a data stream of size 1000 from a Standard normal distribution

    stream = np.random.randn(1000)

    stream[:10]

    # Output:

