    Now, let’s look at another type of KNN-based classifier: the Self Adjusting Memory
    (SAM) model for the KNN algorithm [[11](#499734_1_En_3_Chapter.xhtml#Par81)].
    This method is known as `SAM-KNN` for the rest of this chapter. The `SAM-KNN`
    technique effectively handles the heterogeneous concept drift and doesn’t require
    optimization of metaparameters. This technique derives inspiration from the dual-store
    model in human memory research, where knowledge is partitioned into short-term
    memory (STM) and long-term memory (LTM) [[12](#499734_1_En_3_Chapter.xhtml#Par82)].


    In `SAM-KNN`, memory is partitioned into STM and LTM. STM contains data related
    to the recent concepts in a dynamic sliding window. LTM maintains knowledge of
    past information. There is a cleaning process to keep the size of the STM under
    control. Moreover, there is a transfer of filtered knowledge from STM to LTM.
    LTM ensures that none of its compressed stored information contradicts that of
    STM. The combined memory (CM) is the union of STM and LTM.


    The idea is to combine/ensemble dedicated models (distance weighted KNN) for the
    latest concepts and all the past concepts to maximize the prediction accuracy.


    Listing [3-18](#499734_1_En_3_Chapter.xhtml#PC18) applies the `SAM-KNN` classifier
    and performs prequential evaluation on the same data stream used in Listing [3-16](#499734_1_En_3_Chapter.xhtml#PC16).
    In Listing [3-19](#499734_1_En_3_Chapter.xhtml#PC19), the accuracy obtained is
    64.66%.


