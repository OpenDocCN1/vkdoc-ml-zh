    ## 使用 Page-Hinkley 方法进行漂移检测


    基于 Page-Hinkley (PH) 检验 [12] 的漂移检测方法是一种序贯分析方法，用于检测高斯信号均值的突变 [13]。该方法追踪观测值与其截至当前时刻的均值之间的累积差异
    [14]。通常，当某一时刻的观测均值大于给定阈值 λ 时，该方法会发出概念漂移警报。λ 的值由可接受的误报率决定。如果增大 λ 的值，可能会减少误报，但也会遗漏数据分布变化的一些实例。


    清单 2-9 展示了使用 Page-Hinkley 方法进行概念漂移检测。它模拟了一个来自正态分布、大小为 1000 的数据流，然后将索引 299 到 799
    的数据概念进行了更改（即，将值替换为 5 到 8 之间的整数），如图 2-2 所示。然而，与前面讨论的一些方法不同，Page-Hinkley 方法不会输出警告区域。它仅显示概念漂移的实例，如清单
    2-10 所示。


    ![../images/499734_1_En_2_Chapter/499734_1_En_2_Fig2_HTML.jpg](img/499734_1_En_2_Fig2_HTML.jpg)


    图 2-2


    从索引 299 到 799 概念发生更改的数据流


    ```

    ###############################################################

    ### 输出：

    在数据中检测到概念漂移：5.0 - 位于索引：306

    ###############################################################

    清单 2-10

    使用 Page-Hinkley 方法检测到概念漂移的输出

    ```


    ```

    ###############################################################

    # 导入相关库

    import numpy as np

    from skmultiflow.drift_detection import PageHinkley

    # 初始化 PageHinkley 对象

    ph = PageHinkley()

    # 设置随机种子以确保可重复性

    np.random.seed(123)

    # 模拟一个来自正态分布、大小为 1000 的数据流

    # 均值为 0，标准差为 0.1

    stream = np.random.normal(0, 0.1, 1000)

    # 数据概念从索引 299 到 799 被更改

    for j in range(299, 800):

    stream[j] = np.random.randint(5, high=9)

    # 将数据流元素添加到 PageHinkley 漂移检测器，并验证是否发生漂移

    for j in range(1000):

    ph.add_element(stream[j])

    if ph.detected_change():

    print(''在数据中检测到概念漂移：'' + str(stream[j]) + '' - 位于索引：'' + str(j))

    ###############################################################

    清单 2-9

    在 scikit-multiflow 中使用 Page-Hinkley 方法进行概念漂移检测的示例

    ```


    ## 总结


    本章讨论了在流数据环境下用于概念漂移检测的各种算法。同时，也探讨了相关技术，并使用 Python 中的 scikit-multiflow 框架对其进行了实现。


    下一章将讨论流数据的各种监督学习技术，并使用 scikit-multiflow 框架实现其中的一些技术。


    # 3. 流数据的监督学习


    在上一章中，你学习了一些概念漂移检测算法。本章将重点介绍流数据环境下的监督学习算法（用于分类任务和回归任务）。在监督学习中，存在一个目标变量或响应变量，以及一些预测变量。学习器/模型的目标是理解目标变量与预测变量之间的关系。然后，这可用于对预测变量的未来观测值进行目标变量的预测
    [1]。（我假设你已经熟悉了批处理环境中使用的监督学习技术。）


    第 1 章涵盖了流数据的挑战，以及流数据算法与批处理学习算法的不同之处。本章将深入探讨一些用于流数据的机器学习技术及其使用 scikit-multiflow
    框架的实现。


    在第 1 章中，你了解了数据流生成器以及如何从源文件（CSV 格式）创建数据流。这些思想几乎被用于本章的所有工作示例中。


    本章首先介绍流数据环境中使用的评估方法。然后讨论监督学习方法——基于树的方法、惰性学习、朴素贝叶斯等。最后，解释了流数据环境下的集成学习技术。


    本章仅限于二分类方法和单目标回归（即，多类分类和多目标回归技术超出了本书的范围）。本章的所有实验均在配置为 1.6 GHz 双核 Intel Core i5
    处理器、4 GB RAM 和 macOS 的系统上执行。然而，代码应在类似或更高配置的系统或操作系统上运行，无需任何更改或修改。本书使用 2020 年 6
    月发布的 scikit-multiflow 包版本 0.5.3。


    ## 评估方法


    本节介绍在流数据环境中评估监督学习方法性能时常用的模型评估方法。这些方法被称为*保留评估方法*和*序贯评估方法*（也称为*交错测试-训练方法*）。


    在保留评估方法中，性能评估在每批一定数量的样本或观测值之后进行。学习器或模型的性能是在由未见过的样本组成的测试数据集上进行评估的。这些未见过的样本仅用于评估目的，不用于训练模型。同一个测试数据集可以在多次评估运行中使用。然而，也可以创建动态测试数据集。可以使用
    scikit-multiflow 框架评估模块中的 `EvaluateHoldout()` 函数来应用保留评估方法。


    序贯评估方法，或称交错测试-训练方法，是专门为评估流数据环境中的模型而设计的。每个样本都根据其到达顺序进行分析。在这种评估方法中，数据流中新到的未见样本首先用于测试（即，模型/学习器进行预测）。这些未见过的样本也用于在下一轮测试之前训练模型。可以使用
    scikit-multiflow 框架评估模块中的 `EvaluatePrequential()` 函数来应用序贯评估方法。


    scikit-multiflow 框架中还有另一种评估方法（*序贯延迟评估方法*）；然而，本书坚持使用保留评估方法和序贯评估方法，并更侧重于后者。


    本章使用这些评估方法来跟踪接下来几节中讨论的各种监督学习算法的性能。在使用 `EvaluateHoldout()` 函数或 `EvaluatePrequential()`
    函数时，你需要指定评估指标。


    在本章中，分类问题通常使用预测准确率和 F1 分数（精确率和召回率的调和平均值）等指标。对于回归问题，则使用均方误差和平均绝对误差等指标。


    ## 流数据的决策树


    本节讨论流数据环境下用于分类和回归任务的一些基于树的技术。它涵盖了 Hoeffding 树、Hoeffding 自适应树分类器、极速决策树分类器、Hoeffding
    树回归器和 Hoeffding 自适应树回归器，这些技术使用 scikit-multiflow 应用于不同的数据集。

