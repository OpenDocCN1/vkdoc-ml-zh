    ### Applying the SAM-KNN Classifier to a Synthetic Data Stream


    ```

    ###############################################################

    # Import the relevant libraries

    from skmultiflow.lazy import SAMKNNClassifier

    from skmultiflow.evaluation import EvaluatePrequential

    from skmultiflow.data.sea_generator import SEAGenerator

    # Simulate the data stream

    dstream = SEAGenerator(classification_function = 2, balance_classes = True, noise_percentage
    = 0.3, random_state = 333)

    #Retrieve five samples

    dstream.next_sample(5)

    # Instantiate the SAM-KNN classifier method

    sam_knn_class = SAMKNNClassifier(n_neighbors=10, weighting="distance", stm_size_option="maxACCApprox",
    max_window_size=1000,use_ltm=True)

    # Prequential Evaluation

    evaluate1 = EvaluatePrequential(show_plot=False,

    pretrain_size=1000,

    max_samples=10000,

    metrics=[''accuracy'']

    )

    # Run the evaluation

    evaluate1.evaluate(stream=dstream, model=sam_knn_class)

    ###############################################################

    Listing 3-18

    Applying the SAM-KNN Classifier to a Synthetic Data Stream

    ```


