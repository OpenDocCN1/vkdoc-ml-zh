    Figure [1-1](#499734_1_En_1_Chapter.xhtml#Fig1) shows the streaming data analytics
    process flow. High-velocity data from various sources (sensor data, stock-tick
    data, etc.) are ingested, processed, and analyzed by a streaming data analytics
    engine in real time or near real time. The output generated is displayed via dashboards,
    apps, or any other means.


    ![../images/499734_1_En_1_Chapter/499734_1_En_1_Fig1_HTML.jpg](images/499734_1_En_1_Chapter/499734_1_En_1_Fig1_HTML.jpg)


    Figure 1-1


    Streaming data analytics process flow


    Streaming data analytics and insights empower an organization’s decision-makers
    to make value-added decisions in real time. That is why many researchers in academia
    and industry are working on new methods for real-time analytics. Conventional
    machine learning algorithms do not work because streaming data provides a new
    set of challenges.


    The next section discusses the challenges of handling streaming data.


    ## The Challenges of Streaming Data


    The following are some of the major challenges of handling streaming data.


    *   Multiple passes on data are no longer possible. Data needs to be processed
    in one pass.


    *   Data streams may evolve over time, which is a behavior called *concept drift*
    . Mining algorithms for streaming data need to address this issue so that the
    model does quickly become outdated.


    *   The high speed needed to stream data.


    *   Higher memory requirements.


    New methodologies are needed for the machine learning and data mining algorithms
    used with streaming data. The batch processing algorithms for static data don’t
    work. Let’s look at a simple linear regression method. In batch processing, entire
    training datasets are available. Linear regression is applied to the whole dataset
    using OLS (ordinary least squares) to get beta coefficients to find the relation
    between the dependent and the independent variable (i.e., beta coefficients signify
    the amount of change in the dependent variable (*y*) on an average for a unit
    change in the independent variable (*x*)).


    In streaming data, however, this is not feasible. You never have access to all
    the data because it is continuously flowing in. Here you need online learning
    or incremental learning algorithms, which take each example or tuple of data as
    it comes and updates the parameters (in this case, the beta coefficients). One
    such implementation is linear regression with SGD (stochastic gradient descent).
    A deeper look at online learning/incremental learning techniques is provided in
    the upcoming chapters.


    Importantly, unlike typical big data analysis, streaming data doesn’t require
    more storage because older data is discarded after a while. Smarter and faster
    algorithms are needed to process and analyze the incoming fast-streaming data.
    Algorithms should be capable of generating output anytime it’s queried.


    You should now understand why machine learning with streaming data is different
    from that of batch data. The next section discusses some of the real-world applications
    of streaming data.'
  trans: '

    ## 流式数据


    近年来，世界见证了数据的洪流。从各种来源生成的数据量大幅增长。主要数据来源包括互联网、日志数据、传感器数据、电子邮件、RFID、POS 交易数据等。从这些来源收集的数据可分为结构化、半结构化和非结构化数据。近期的技术进步是这场“数据爆炸”的主要原因，它使数据存储成本更低，并使得持续收集数据成为可能。几乎所有零售、社交媒体和
    IT 等行业的公司都面临着数据爆炸。他们正试图找到处理和分析自身产生的海量数据的方法，并从中获得可操作的见解。


    大数据


    我们大多数人都听说过*大数据*这个术语。麦肯锡全球研究院将大数据定义为“其规模超出了典型数据库软件工具捕获、存储、管理和分析能力的数据集”[1]。大数据的基本特征可以用四个以字母
    V 开头的词来定义：体量（Volume）、速度（Velocity）、多样性（Variety）和真实性（Veracity）。大数据中的“大”不仅仅指数据的大小或体量——其他几个“V”也需要考虑。


    技术的进步使得持续收集数据成为可能。我们在各种日常交易（例如，沃尔玛、塔吉特等零售店的 POS 交易）、传感器数据、网络数据、社交媒体数据、股票价格、搜索查询、点击流数据等中都被数据淹没。这些都是高速数据的来源；也就是流式数据。其他持续数据流的来源包括运营监控、在线广告、移动数据和物联网（IoT）。


    流式数据，或称数据流，是从源头以极快速度到达的、无限且连续的数据流。因此，流式数据是大数据的一个子集，它处理的是大数据的*速度*方面。流式数据与静态数据之间的一些区别特征在于数据的松散结构化、始终在线和持续流动的特性[2]。与静态数据不同，流式数据的结构并非严格定义。它是“始终在线”的；也就是说，由于新数据不断生成，数据始终可用。


    作为流式数据如何在商业中应用的例子，我们来看看在线广告。像 Facebook 这样的社交媒体巨头实时收集用户行为数据。Facebook 每月有超过 20 亿活跃用户[4]，这让你对正在收集的数据规模有所了解。


    Facebook 的大部分收入来自向用户展示广告。许多广告商入驻该平台。Facebook 利用用户行为数据来选择与其用户相关的广告（即，那些最有可能以点击或购买形式产生互动的广告）。他们在在线广告中执行其他重要步骤（例如，在“拍卖”中“出价”）。所有这些几乎都是实时发生的（例如，当你加载
    Facebook 的新闻推送页面或与 Messenger 或 Instagram 等其他应用互动时）。


    ### 处理和分析流式数据的必要性


    流式数据提供实时或近实时的分析。由于它持续产生且永无止境，存储这些海量数据然后对其进行分析（如同批处理中所做的那样）是不可行的。流式数据必须“即时”分析，以便实时或近实时地获取洞察。


    图 1-1 展示了流式数据分析处理流程。来自各种来源（传感器数据、股票报价数据等）的高速数据由流式数据分析引擎实时或近实时地摄取、处理和分析。生成的输出通过仪表盘、应用程序或任何其他方式显示。


    ![../images/499734_1_En_1_Chapter/499734_1_En_1_Fig1_HTML.jpg](img/499734_1_En_1_Fig1_HTML.jpg)


    图 1-1


    流式数据分析处理流程


    流式数据分析和洞察使组织的决策者能够实时做出增值决策。这就是为什么学术界和工业界的许多研究人员正在研究实时分析的新方法。传统的机器学习算法不起作用，因为流式数据带来了一系列新的挑战。


    下一节将讨论处理流式数据的挑战。


    ## 流式数据的挑战


    以下是处理流式数据的一些主要挑战。


    *   无法再对数据进行多次遍历。数据需要一次遍历处理完毕。

    *   数据流可能随时间演变，这种行为称为*概念漂移*。用于流式数据的挖掘算法需要解决这个问题，以免模型迅速过时。

    *   流式数据所需的高速处理能力。

    *   更高的内存需求。


    用于流式数据的机器学习和数据挖掘算法需要新的方法论。用于静态数据的批处理算法不起作用。让我们看一个简单的线性回归方法。在批处理中，整个训练数据集都是可用的。使用
    OLS（普通最小二乘法）将线性回归应用于整个数据集，以获得贝塔系数，从而找到因变量和自变量之间的关系（即，贝塔系数表示自变量（*x*）每变化一个单位，因变量（*y*）平均变化的量）。


    然而，在流式数据中，这是不可行的。你永远无法访问所有数据，因为数据是持续流入的。这里需要在线学习或增量学习算法，这些算法在数据（每个样本或元组）到来时进行处理，并更新参数（在本例中为贝塔系数）。一种这样的实现是使用
    SGD（随机梯度下降）的线性回归。后续章节将更深入地探讨在线学习/增量学习技术。


    重要的是，与典型的大数据分析不同，流式数据不需要更多存储空间，因为旧数据在一段时间后会被丢弃。需要更智能、更快速的算法来处理和分析快速流入的流式数据。算法应能够在任何被查询时生成输出。


    你现在应该理解为什么使用流式数据的机器学习与使用批处理数据的不同了。下一节将讨论流式数据的一些实际应用。

