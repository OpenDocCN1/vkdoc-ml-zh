  trans: '

    ### 在线装袋法


    装袋法是一种在批量（非流式）学习中广泛使用的集成学习技术。在此方法中，X 个基模型在大小为 N 的自助样本集上进行训练。这些自助样本集是通过从原始训练数据集中进行有放回抽样创建的。


    每个基模型的训练集包含原始训练样本 K 次，其中 P(K = k)服从二项分布。当 N 趋于无穷大时，K 的分布趋于泊松(1)分布（即 K ~ exp(–1)/k!）[15]。Oza
    和 Russell [15]利用这一思想提出了装袋算法的在线学习版本，该版本适用于流数据场景。


    在在线装袋法中，当一个新的训练样本到达时，算法会为每个基模型选择该样本 K ~ 泊松(1)次，并相应地更新基模型。新实例通过 X 个基模型的多数投票进行分类。这一步在批量装袋法和在线装袋法中都是相同的。在线装袋法被认为是批量装袋法的一个良好近似
    [15]。


    在 scikit-multiflow 中，可以使用`OzaBaggingClassifier()`方法应用在线装袋分类技术。清单 3-26 将 Oza 装袋分类器应用于清单
    3-16 中使用的合成数据集。KNN ADWIN 分类器模型作为基模型。清单 3-26 构建了六个基模型。KNN ADWIN 分类器的超参数与清单 3-16
    中使用的相同（即邻居数为 10，最大窗口大小为 1000）。应用了预排序评估，输出结果如清单 3-27 所示。获得的准确率为 66.21%。


