  trans: '

    ### 在线提升（Online Boosting）


    另一种著名的集成学习技术是*提升法*。其基本原理是顺序组合一组“弱学习器”，以创建一个“强学习器”。AdaBoost 技术是最早用于批量数据的提升技术之一
    [17]。（AdaBoost 是*自适应提升*的缩写。）首先，使用加权样本在训练数据上准备一个弱分类器（即决策树），然后计算训练模型的误分类错误率。当前分类器误分类的样本在下一个分类器的训练数据集中会被赋予更高的权重。后续的学习器会更关注这些困难样本，这个过程一直持续到算法性能不再有显著提升为止。


    Wang 和 Pineau [18] 提出了*在线提升分类器*，这是 AdaBoost 算法的在线版本。在在线学习环境中，每个到达的样本会根据二项分布被训练
    K 次。由于数据流中样本数量巨大（趋于无穷），二项分布趋近于泊松(λ)分布，其中 λ 的值通过跟踪误分类和正确分类样本的权重来计算。在线提升算法使用 ADWIN
    窗口技术来处理数据流中固有的概念漂移。


    可以使用 scikit-multiflow 框架中实现的 `OnlineBoostingClassifier()` 方法来应用在线 AdaBoost 算法。代码清单
    3-30 将在线提升分类器应用于代码清单 3-28 中使用的相同数据流。执行了预序评估，输出结果如代码清单 3-31 所示。获得的准确率为 58%。


    ```

    ###############################################################

    Prequential Evaluation

    Evaluating 1 target(s).

    Pre-training on 1000 sample(s).

    Evaluating...

    #################### [100%] [669.82s]

    Processed samples: 10000

    Mean performance:

    M0 - Accuracy     : 0.5800

    ###############################################################

    代码清单 3-31

    在线提升分类器的预序评估输出

    ```


    ```

    ###############################################################

    # 导入相关库

    from skmultiflow.meta import OnlineBoostingClassifier

    from skmultiflow.evaluation import EvaluatePrequential

    from skmultiflow.data.sea_generator import SEAGenerator

    # 模拟数据流

    dstream = SEAGenerator(classification_function = 2, balance_classes = True, noise_percentage
    = 0.3, random_state = 333)

    # 实例化在线提升分类器方法

    boost_class = OnlineBoostingClassifier(random_state = 333)

    # 预序评估

    evaluate1 = EvaluatePrequential(show_plot=False,

    pretrain_size=1000,

    max_samples=10000,

    metrics=[''accuracy'']

    )

    # 运行评估

    evaluate1.evaluate(stream=dstream, model=boost_class) ###############################################################

    代码清单 3-30

    将在线提升分类器应用于合成数据流

    ```


    至此，我们已经涵盖了流数据上下文中大多数重要的监督学习算法。下一节将简要介绍一些数据流预处理方法。


    ## 数据流预处理


    到目前为止，本章涵盖了数据流上回归和分类问题的算法。所有实验都使用了干净的数据集（即不需要进行数据预处理）。然而，在现实世界中，你无法期望得到干净的数据流，因此需要进行一些基本的数据流预处理。以下是
    scikit-multiflow 框架中提供的一些可应用于数据流的数据预处理方法。


    *   **缺失值清理器**：`MissingValueCleaner()` 方法可以使用诸如用零、均值、中位数或众数替换缺失值等策略来清理数据流中的缺失值。


    *   **独热编码**：`OneHotToCategorical()` 方法对数据流中的分类变量执行独热编码。


    *   **窗口化最小-最大缩放器**：`WindowedMinmaxScaler(window_size=200)` 方法用于数据流的特征变换。每个特征都被缩放到一个给定的范围（0
    到 1 之间）。窗口大小由用户输入，用于计算最小值和最大值。


    *   **窗口化标准缩放器**：`WindowedStandardScaler(window_size=200)` 方法用于标准化特征。窗口大小由用户输入，用于计算均值和标准差。


    ## 总结


    本章涵盖了 scikit-multiflow 框架中用于数据流挖掘的大多数重要的在线监督学习技术。然而，你应该探索本章未讨论的两种方法：scikit-multiflow
    的贝叶斯模块中的朴素贝叶斯分类器，以及 scikit-multiflow 框架的神经网络模块中的感知机分类器。


    下一章将讨论一些用于流数据无监督学习的在线/增量学习算法。同时还将讨论其他一些可用于流数据分析的工具。


    # 4. 用于数据流挖掘的无监督学习及其他工具


    在第 3 章中，你学习了流数据上下文中用于回归和分类问题的监督机器学习技术。本章从流数据的无监督学习开始，然后概述其他一些可用于数据流挖掘的软件环境。


    ## 流数据的无监督学习


    在前面的章节中，你学习了用于流数据的概念漂移检测和监督机器学习的各种方法。现在，让我们通过首先关注聚类，然后转向异常检测来了解无监督学习。

    '
- fmt: '### Clustering


    `k-means clustering` is a popular clustering algorithm for batch data. It partitions
    the data into distinct and non-overlapping `k` clusters. The objective is to have
    a very low *within-cluster variation* [[1](#499734_1_En_4_Chapter.xhtml#Par46)].
    The algorithm randomly assigns a number from 1 to `k` to the observations. This
    creates the initial set of clusters. The cluster centroids are computed for each
    of the `k` clusters. Observations based on the nearness (i.e., a distance metric,
    such as Euclidean distance) to a cluster centroid are reassigned. These steps
    are reiterated. The iteration stops when there are no further changes in the cluster
    assignments. (Please note that the user provides the value of `k`.)


    The *mini-batch k-means clustering method* is an incremental learning version
    of the `k-means clustering` algorithm that you can directly apply to a data stream.
    It is a variant of the `k-means` algorithm that works on a mini-batch of the data
    instead of the entire dataset. It is suitable for streaming data since an entire
    dataset is never available at any point in time. Mini-batches are the subsets
    of the input data stream. They are randomly sampled for each training iteration.


    The `mini-batch k-means clustering` algorithm chooses a mini-batch comprising
    randomly sampled examples. A generic `k-means` algorithm is then executed, in
    which the nearest centroid is assigned. In the next step, the assigned centroids
    are updated for each sample in the mini-batch. These steps are performed until
    either convergence or a specific number of iterations is reached.


    Also, instead of using random sampling to choose the initial set of cluster centers,
    the `k-means++` algorithm [[3](#499734_1_En_4_Chapter.xhtml#Par48)] can be used
    as a randomized seeding technique to choose the initial cluster centers’ first
    values, which achieves convergence faster.


    The `mini-batch k-means clustering` algorithm is available in the `scikit-learn`
    (`sklearn`) library. Go to [`https://scikit-learn.org/stable/modules/generated/sklearn.cluster.MiniBatchKMeans.html`](https://scikit-learn.org/stable/modules/generated/sklearn.cluster.MiniBatchKMeans.html)
    for more information.


    Listing [4-1](#499734_1_En_4_Chapter.xhtml#PC1) applies the `mini-batch k-means
    clustering` on the Iris dataset. The Iris dataset is publicly available in the
    `sklearn` library. The dataset contains four features regarding sepal and petal
    length (in cm) and width (in cm). Listing [4-1](#499734_1_En_4_Chapter.xhtml#PC1)
    applies `MiniBatchKMeans()` and specifies the number of clusters as 3 and the
    mini-batch size as 50. Listing [4-1](#499734_1_En_4_Chapter.xhtml#PC1) trained
    the `mini-batch k-means clustering` model on the Iris dataset and shown the cluster
    centers in Figure [4-1](#499734_1_En_4_Chapter.xhtml#Fig1).


    ![../images/499734_1_En_4_Chapter/499734_1_En_4_Fig1_HTML.jpg](images/499734_1_En_4_Chapter/499734_1_En_4_Fig1_HTML.jpg)


    **Figure 4-1** – Cluster centers of the mini-batch k-means clustering model


    ```

    ###############################################################

    # Import the relevant libraries

    from sklearn import datasets

    from sklearn.preprocessing import StandardScaler

    from sklearn.cluster import MiniBatchKMeans

    # Load data

    iris = datasets.load_iris()

    X = iris.data

    #Data snapshot

    X[0:6,]

    #Output

    #array([[5.1, 3.5, 1.4, 0.2],

    #       [4.9, 3\. , 1.4, 0.2],

    #       [4.7, 3.2, 1.3, 0.2],

    #       [4.6, 3.1, 1.5, 0.2],

    #       [5\. , 3.6, 1.4, 0.2],

    #       [5.4, 3.9, 1.7, 0.4]])

    #feature names

    iris.feature_names

    #Output:

    #[''sepal length (cm)'',

    # ''sepal width (cm)'',

    # ''petal length (cm)'',

    # ''petal width (cm)'']

    # Create k-mean object

    clust_kmeans = MiniBatchKMeans(n_clusters=3, batch_size=50, random_state=333)

    # Train model

    model = clust_kmeans.fit(X)

    # Figure out the cluster centers

    model.cluster_centers_

    ###############################################################

    Listing 4-1

    Mini-Batch k-means Clustering on the Iris Dataset

    ```


    An alternative to `mini-batch k-means clustering` is available at `scikit-learn`.
    This method is known as *Birch clustering* [[7](#499734_1_En_4_Chapter.xhtml#Par52)].
    It is an online learning algorithm that creates a tree data structure where the
    cluster centroids are read off the leaf. I suggest that you explore this technique
    as an exercise. For more information on Birch clustering in `scikit-learn`, read
    the official documentation at [`https://scikit-learn.org/stable/modules/generated/sklearn.cluster.Birch.html`](https://scikit-learn.org/stable/modules/generated/sklearn.cluster.Birch.html).


    A *streaming k-means clustering algorithm* is available in Apache Spark’s machine
    learning library, `MLlib`. This streaming `k-means clustering` algorithm dynamically
    estimates the clusters and updates the clusters when new data arrive. This algorithm
    contains a parameter called a *half-life* that controls the “decay” of the estimates.
    A decay factor determines how much weight needs to be given to past data. The
    streaming `k-means clustering` algorithm uses a generalization of the `mini-batch
    k-means` update rule.


    Other incremental clustering algorithms are not covered in this book.


    Some of the earliest online clustering algorithms for streaming data are implemented
    in `MOA` software. One well-researched approach for data stream clustering is
    the microclustering algorithm, which has two phases. The first phase is online
    and summarizes a data stream in local models (microclusters). The second phase
    generates a global cluster model from the micro-clusters. `CluStream` and `DenStream`
    are two of the microcluster-based online clustering algorithms available in `MOA`.


    Apache Spark, `MOA`, and a few other data stream mining tools are discussed next.'
