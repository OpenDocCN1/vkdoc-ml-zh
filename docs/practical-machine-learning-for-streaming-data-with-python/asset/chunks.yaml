    ## 漂移检测方法


    漂移检测方法（DDM）由 Gama 等人首次提出 [6]。DDM 方法可以应用于任何学习算法；也就是说，既可以用于增量/在线学习算法，也可以用于批量学习算法。其核心思想是追踪学习算法的错误率。在一个包含
    *n* 个样本的样本集中，学习算法产生的错误数量是一个来自伯努利试验的随机变量。你可以使用二项分布来对 *n* 个样本中的错误数量进行建模。在时刻 j，错误率记为
    p[j]，标准差为 σ[j] = sqrt(pj/j)。


    DDM 方法在训练学习算法时会记录 p[min] 和 σ[min] [6]。如果 p[j] + σ[j] >= p[min] + 2 * σ[min]，则会发出警告，这意味着数据流发生了变化。但如果
    p[j] + σ[j] >= p[min] + 3 * σ[min]，则声明数据流发生了改变 [5]。


    清单 2-3 展示了使用 DDM 进行概念漂移检测的过程。它模拟了一个来自标准正态分布、大小为 1000 的数据流，然后从索引 299 到 599 改变数据概念（即，将值替换为
    5 到 9 之间的整数）。接着，它调用 DDM() 对象，并使用 `detected_change()` 和 `detected_warning_zone()`
    函数分别识别数据流中的概念漂移并提供关于数据流变化的警告。最终输出如清单 2-4 所示。


