    ## 用于概念漂移检测的自适应窗口方法


    在用于概念漂移检测的自适应窗口方法（ADWIN）中，使用了一个动态大小的滑动窗口；也就是说，窗口的大小不是固定的，而是根据从窗口内数据观察到的变化率在线计算得出的
    [4]。我在第 1 章中已经讨论过滑动窗口的概念，即维护一个包含数据流中最新数据点的窗口，并不断丢弃较旧的数据点。窗口内的数据点会获取数据流的更新统计信息，检测概念漂移，并更新模型。


    通常建议使用可变大小的窗口。其理念是尽可能长时间地保留数据点或观测值，因为用户并不知道变化的时间尺度 [4]。ADWIN 算法在未检测到数据流发生变化时会增大窗口大小，而在检测到数据流发生变化时则会减小窗口大小。其核心思想是追踪窗口
    W 中数据点的均值。零假设是窗口 W 内的均值没有变化。当有足够证据表明新数据点的均值与窗口其余部分的均值不同时，窗口中的较旧数据点就会被丢弃 [5]。


    为了进一步深入探讨 ADWIN 算法的实现，会执行一个统计检验，以检查两个子窗口（W[1] 和 W[2]）的均值之差是否超过某个阈值。W[1] 和 W[2]
    是主窗口 W 的子窗口。如果子窗口的均值存在显著差异，则丢弃窗口 W 中较旧的数据点。然而，如果子窗口的均值没有显著差异，则假定数据流的分布没有发生变化 [4]。


    清单 2-1 展示了在模拟数据流上使用 ADWIN 进行概念漂移检测的过程。`drift_detection` 模块用于 scikit-multiflow
    框架中。清单 2-1 模拟了一个来自标准正态分布、大小为 1000 的数据流，然后从索引 599 开始改变数据概念（即，将值替换为 5 到 8 之间的整数），如图
    2-1 所示。接着，它调用 ADWIN() 对象，并使用 `detected_change()` 函数来识别数据流中的概念漂移。最终输出如清单 2-2 所示。


