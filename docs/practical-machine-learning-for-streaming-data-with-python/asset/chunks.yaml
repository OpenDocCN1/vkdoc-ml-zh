- fmt: '# Incremental Learning and Online Learning


    Most standard machine learning techniques (supervised or unsupervised) are *batch
    learning* methods. That is, they typically work on static/batch datasets (i.e.,
    non-streaming datasets), where the entire data is available, and multiple passes
    for any algorithm are possible. However, these batch learning methods become outdated
    over time when applied to streaming data due to concept drift. There is a need
    for a different class of machine learning algorithms in the streaming data context
    that can address its challenges. This class of algorithms is known as *incremental*
    or *online learning algorithms*.


    Incremental learning algorithms work with limited resources and frequently update
    model parameters whenever a new batch/mini-batch of data arrives. Incremental
    learning algorithms can handle concept drift inherent in streaming data. Online
    learning algorithms differ from incremental learning algorithms in that the model
    parameters are updated whenever a new observation arrives. In online learning
    algorithms, you don’t wait for a mini-batch of the data to arrive to update the
    model parameters.


    An incremental learning algorithm can be approximated by using a batch learner
    with a sliding window. In this case, the model is retrained every time a new window
    (comprising data points) arrives. You can apply any batch learner, such as linear
    regression or logistic regression algorithms, with a sliding window on a data
    stream to approximate an incremental learning algorithm.


    Let’s look at a mini-batch gradient descent method and the *stochastic gradient
    descent* (SGD) method. The gradient descent method is a very popular technique
    for finding a function’s minimum, which in this context is the cost function.
    The following explains how to do a gradient descent algorithm.


    1. Initialize the parameters with random values.

    2. Compute the gradient of the objective function.

    3. Update the parameters using the gradients.

    4. The step size calculation for each feature: `step size = gradient * learning
    rate`. The *learning rate* is a hyperparameter that directly impacts the convergence
    of the algorithm. A very small learning rate takes a very long time for the gradient
    descent algorithm to converge. A very high value of the learning rate makes the
    algorithm take large steps down the slope, such that it may miss the global minima.

    5. Calculate the new parameters: `new parameters = old parameters – step size`.

    6. Repeat steps 2–5 until the gradient is close to zero.


    The gradient descent method is a batch learning method. The entire training data
    is considered before taking a step in the direction of the gradient. In large
    datasets, a single update of parameters takes a long time. However, a mini-batch
    gradient descent algorithm is an incremental learning algorithm where the parameters
    are changed each time a mini-batch is processed. But SGD algorithm always updates
    the model parameters for each training observation. The SGD technique is an example
    of an online learning algorithm.


    Let’s now look at the linear regression method, which is a linear model to understand
    the relationship between the target variable (`Y`) and the predictor variables
    (`X`) by computing the beta coefficients for each predictor variables using the
    *ordinary least square* (OLS) method.


    You can implement the linear regression method by using the gradient descent optimization
    technique. Linear regression is a batch learning technique in which the gradient
    descent algorithm is applied on the entire training to update the model parameters.
    However, you can convert this method into an incremental learner by using the
    mini-batch gradient descent algorithm.


    Listing 1-3 implements the function for linear regression with the mini-batch
    gradient descent algorithm in Python. These functions are then applied to a simulated
    dataset.


    ```

    ###############################################################

    # Import the libraries

    import numpy as np

    import matplotlib.pyplot as plt

    import pandas as pd

    from pandas import read_csv

    np.random.seed(111)

    # creating data

    mean = np.array([6.0, 7.0])

    covariance = np.array([[1.0, 0.94], [0.95, 1.2]])

    df = np.random.multivariate_normal(mean, covariance, 500)

    df.shape

    # output- (10000, 2)

    df

    #Output-

    #array([[6.97833668, 8.30414776],

    #       [4.66509294, 5.31806407],

    #       [6.88804517, 7.71734893],

    #       ...,

    #       [5.75153443, 6.73145512],

    #       [4.93357924, 6.72570148],

    #       [7.31794626, 8.4076224 ]])

    X = df[:,:-1]

    Y = df[:,-1]

    # A column with all 1''s is added

    X_new = np.c_[np.ones((500, 1)), X]

    # Random initialization of the estimate "reg_coef"

    np.random.seed(333)

    reg_coef = np.random.randn(2,1)

    # here, size_batch_mini= minibatch size

    # lr= learning rate

    #  max_iters= number of batches used

    lr=0.01

    num = 100

    max_iters = 100

    size_batch_mini = 50

    t0, t1 = 400, 1200

    def lrs(step):

    return t0 / (step + t1)

    reg_coef_all = []

    step = 0

    for j in range(max_iters):

    batches_index  = np.random.permutation(num)

    X_batches = X_new[batches_index]

    y_batches = Y[batches_index]

    for i in range(0, num, size_batch_mini):

    step += 1

    Yi = y_batches[i:i+size_batch_mini]

    Xi = X_batches[i:i+size_batch_mini]

    # compute the gradient

    gradient = 2/size_batch_mini * Xi.T.dot(Xi.dot(reg_coef) - Yi)

    lr = lrs(step)

    # update

    reg_coef = reg_coef - lr * gradient

    reg_coef_all.append(reg_coef)

    # Output

    reg_coef

    reg_coef_all

    ###############################################################

    Listing 1-3

    Implementation of Linear Regression with Mini-Batch Gradient Descent

    ```


    Similarly, the linear regression method can be converted to an online learning
    method by using the SGD method. I urge you to implement the function for the linear
    regression method with SGD using the ideas discussed so far. You can refer to
    Listing 1-3, but make sure that the update step happens for each observation.


    The `scikit-learn` library has an `SGDRegressor()` function to apply linear regression
    with SGD. Listing 1-4 is a code snippet for applying linear regression using SGD
    on a simulated dataset.'
