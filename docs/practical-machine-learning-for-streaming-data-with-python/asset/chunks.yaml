    Most of the important supervised learning algorithms in the streaming data context
    have been covered. The next section briefly covers some of the data stream preprocessing
    methods.


    ## Data Stream Preprocessing


    So far, this chapter has covered algorithms for both regression and classification
    problems on data streams. All the experiments used clean datasets (i.e., data
    preprocessing wasn’t necessary). However, you can’t expect clean data streams
    in the real world, so you need to do some basic data stream preprocessing. The
    following are some of the data preprocessing methods available in the `scikit-multiflow`
    framework to apply to a data stream.


    *   **Missing Value Cleaner**: The `MissingValueCleaner()` method can replace
    missing values in a data stream using strategies such as replacing missing values
    with zero, mean, median, or mode.

    *   **One-hot encoding**: The `OneHotToCategorical()` method performs one-hot
    encoding on categorical variables in a data stream.

    *   **Windowed Minmax Scaler**: The `WindowedMinmaxScaler(window_size=200)` method
    is for feature transformation on a data stream. Each feature is scaled to a given
    range (between 0 and 1). The window size is user input to compute the min and
    the max values.

    *   **Windowed Standard Scaler**: The `WindowedStandardScaler(window_size=200)`
    method standardizes the features. The window size is user input to compute the
    mean and the standard deviation values.


    ## Summary


    This chapter covered most of the important online supervised learning techniques
    for data stream mining in the `scikit-multiflow` framework. However, you should
    explore two methods that I didn’t discuss in this chapter: the Naïve Bayes classifier
    and the Perceptron classifier available in the `scikit-multiflow`’s `Bayes` module
    and the `scikit-multiflow` framework’s neural network module.


    The next chapter discusses some of the online/incremental learning algorithms
    for unsupervised learning of streaming data. It also discusses some other tools
    available for streaming data analysis.


    # 4. Unsupervised Learning and Other Tools for Data Stream Mining


    In Chapter [3](#499734_1_En_3_Chapter.xhtml), you learned supervised machine learning
    techniques for both regression and classification problems in a streaming data
    context. This chapter starts with unsupervised learning for streaming data and
    then overviews some of the other software environments available for data stream
    mining.


    ## Unsupervised Learning for Streaming Data


    In the previous chapters, you learned about the various methods for concept drift
    detection and supervised machine learning for streaming data. Let’s now look at
    unsupervised learning by first focusing on clustering and then moving on to anomaly
    detection.'
  raw: '### Online Boosting


    Another well-known ensemble learning technique is *boosting* . Its basic principle
    is to sequentially combine a set of “weak learners” to create a “strong learner.”
    The AdaBoost technique is one of the first boosting techniques for batch data
    [[17](#499734_1_En_3_Chapter.xhtml#Par87)]. (AdaBoost is short for *adaptive boosting*
    .) A weak classifier (i.e., a decision tree) is prepared on training data using
    weighted samples, and then the misclassification error rate is calculated for
    the trained model. The misclassified examples by the current classifier are given
    more weight in the training dataset for the next classifier. The subsequent learners
    focus more on the difficult examples, which goes on until there is no more significant
    improvement in the algorithm’s performance.


    Wang and Pineau [[18](#499734_1_En_3_Chapter.xhtml#Par88)] proposed the *online
    boosting classifier* , which is the online version of the AdaBoost algorithm.
    In an online learning context, each arriving example is trained K times, drawn
    from a binomial distribution. As in a data stream, the number of examples is large
    (tends to infinity), so the binomial distribution tends to a Poisson(λ) distribution
    where the value of λ is calculated by keeping track of the weight of misclassified
    and correctly classified examples. The online boosting algorithm uses the ADWIN
    windowing technique for handling inherent concept drift in a data stream.


    The online AdaBoost algorithm can be applied using the OnlineBoostingClassifier()
    method implemented in the scikit-multiflow framework. Listing [3-30](#499734_1_En_3_Chapter.xhtml#PC30)
    applies the online boosting classifier on the same data stream used in Listing
    [3-28](#499734_1_En_3_Chapter.xhtml#PC28). A prequential evaluation is performed,
    and the output is shown in Listing [3-31](#499734_1_En_3_Chapter.xhtml#PC31).
    The accuracy obtained is 58%.


    ```

    ###############################################################

    Prequential Evaluation

    Evaluating 1 target(s).

    Pre-training on 1000 sample(s).

    Evaluating...

    #################### [100%] [669.82s]

    Processed samples: 10000

    Mean performance:

    M0 - Accuracy     : 0.5800

    ###############################################################

    Listing 3-31

    Prequential Evaluation Output of the Online Boosting Classifier

    ```


    ```

    ###############################################################

    # Import the relevant libraries

    from skmultiflow.meta import OnlineBoostingClassifier

    from skmultiflow.evaluation import EvaluatePrequential

    from skmultiflow.data.sea_generator import SEAGenerator

    # Simulate the data stream

    dstream = SEAGenerator(classification_function = 2, balance_classes = True, noise_percentage
    = 0.3, random_state = 333)

    # Instantiate the Online Boosting Classifier method

    boost_class = OnlineBoostingClassifier(random_state = 333)

    # Prequential Evaluation

    evaluate1 = EvaluatePrequential(show_plot=False,

    pretrain_size=1000,

    max_samples=10000,

    metrics=[''accuracy'']

    )

    # Run the evaluation

    evaluate1.evaluate(stream=dstream, model=boost_class) ###############################################################

    Listing 3-30

    Applying the Online Boosting Classifier to a Synthetic Data Stream

    ```


