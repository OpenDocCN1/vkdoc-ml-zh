    ### 自适应随机森林


    *随机森林*是一种非常流行且广泛使用的批处理（非流式）数据机器学习技术。在随机森林中，多棵决策树（使用重采样数据构建，并采用随机特征子集）被组合在一起，以提高模型在预测准确性方面的性能。然而，随机森林无法处理概念漂移，并且需要对数据集进行多次遍历。它不适用于流式数据上下文中的分析。


    *自适应随机森林*（ARF）是随机森林技术在流式数据上下文中的一种改编形式 [13]。ARF 方法使用在线装袋来近似有放回的重采样。但是，与在线装袋中使用
    (λ = 1) 泊松分布不同，ARF 使用 (λ = 6) 泊松分布。（本章后面将介绍在线装袋方法的概述。）


    ARF 中的基础模型（即随机森林树训练（RFTreeTrain））基于霍夫丁树算法，但存在一些差异。一个区别是 RFTreeTrain 不允许早期树剪枝。另一个区别是，每当创建新节点时，都会创建一个随机特征子集，并且分裂仅限于这些特征。ARF
    在基础树中使用漂移检测器，一旦发生漂移就会触发重置。ARF 允许训练后台树，如果检测到漂移，这些后台树将替换活动树。


    ARF 技术可用于分类任务和回归任务。清单 3-22 演示了将 ARF 分类器应用于合成数据流（与清单 3-18 中使用的数据流相同）。ARF 分类器的超参数是估计器/树的数量为
