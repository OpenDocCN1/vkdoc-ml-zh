- fmt: '### Hoeffding Tree Classifier


    One of the challenges of streaming data is the memory requirements; it is impossible
    to store all the data. In a batch setting, a decision tree reuses instances or
    observations to compute the best split attributes. Thus, using decision tree methods
    such as `CART` and `CHAID`, which are generally used in batch data, aren’t effective
    in a streaming data context. To solve this issue, Domingos and Hulten [[2](#499734_1_En_3_Chapter.xhtml#Par72)]
    proposed the Hoeffding tree, which is an incremental decision tree learner that
    uses new instances to build a tree, making it more suitable to a streaming data
    context. The Hoeffding tree is also known as the Very Fast Decision Tree (`VFDT`)
    algorithm.


    The Hoeffding tree converges to a tree built by a batch learner with sufficiently
    large data. Thus, the Hoeffding tree uses the idea that a small sample is often
    enough for choosing an optimal splitting attribute [[3](#499734_1_En_3_Chapter.xhtml#Par73)].
    This idea is supported by the statistical result known as the *Hoeffding bound*.
    The Hoeffding bound states (with a probability of 1–£) that after `n` independent
    observations of a real valued random variable, `x`, with range `R`, the true mean
    of `x` is at least μ – € where μ is the observed mean of the random variable `x`
    and `€ = sqrt((R^2 * ln(1/£)) / (2n))` [[4](#499734_1_En_3_Chapter.xhtml#Par74)].


    The `VFDT` method is an implementation of Hoeffding trees. `VFDT` is a decision
    tree that uses the Hoeffding bound and accumulates sufficient statistics of new
    incoming observations in a data stream while converting a tree leaf to a tree
    node. However, streaming data can be very noisy, which affects the performance
    of `VFDT` (in terms of prediction accuracy). Also, with noisy incoming streaming
    data, `VFDT` faces tree-size explosion [[5](#499734_1_En_3_Chapter.xhtml#Par75)].
    There are documented techniques to address these `VFDT` issues.


    Listing [3-1](#499734_1_En_3_Chapter.xhtml#PC1) creates a synthetic dataset using
    the hyperplane generator discussed in Chapter [1](#499734_1_En_1_Chapter.xhtml).
    Figure [3-1](#499734_1_En_3_Chapter.xhtml#Fig1) is a snapshot of the synthetic
    data stream.


    ![../images/499734_1_En_3_Chapter/499734_1_En_3_Fig1_HTML.jpg](images/499734_1_En_3_Chapter/499734_1_En_3_Fig1_HTML.jpg)


    **Figure 3-1** Snapshot of the synthetic dataset


    The Hoeffding tree method is applied to the synthetic dataset using the `scikit-multiflow`
    framework, as shown in Listing [3-2](#499734_1_En_3_Chapter.xhtml#PC2). The prequential
    evaluation method (with prediction accuracy as a metric) is used in performance
    evaluation. Listing [3-3](#499734_1_En_3_Chapter.xhtml#PC3) shows the output of
    the prequential evaluation. The accuracy obtained is 92.07%.


    ```

    ###############################################################

    # Import the relevant libraries

    from skmultiflow.data import HyperplaneGenerator

    import pandas as pd

    import numpy as np

    create = HyperplaneGenerator(random_state = 888, n_features= 10, noise_percentage
    = 0)

    create.prepare_for_use()

    X , Y = create.next_sample(10000)

    data = pd.DataFrame(np.hstack((X, np.array([Y]).T)))

    data.shape

    # output- (10000, 11)

    print(data.head())

    # Store it in csv

    data.to_csv(''data_stream.csv'', index=False)

    ###############################################################

    Listing 3-1

    Creating a Synthetic Dataset Using the Hyperplane Generator

    ```


    ```

    ###############################################################

    Prequential Evaluation

    Evaluating 1 target(s).

    Pre-training on 400 sample(s).

    Evaluating...

    ##------------------ [10%]

    #################### [100%] [3.95s]

    Processed samples: 10000

    Mean performance:

    M0 - Accuracy     : 0.9207

    ###############################################################

    Listing 3-3

    Prequential Evaluation Output of the Hoeffding Tree Classifier

    ```


    ```

    ###############################################################

    from skmultiflow.trees import HoeffdingTreeClassifier

    from skmultiflow.evaluation import EvaluatePrequential

    from skmultiflow.data.file_stream import FileStream

    import pandas as pd

    import numpy as np

    # Load the synthetic data stream

    dstream = FileStream(''data_stream.csv'')

    dstream.prepare_for_use()

    # Create the model instance

    ht_class = HoeffdingTreeClassifier()

    # perform prequential evaluation

    evaluate1 = EvaluatePrequential(show_plot=False,

    pretrain_size=400,

    max_samples=10000,

    metrics=[''accuracy'']

    )

