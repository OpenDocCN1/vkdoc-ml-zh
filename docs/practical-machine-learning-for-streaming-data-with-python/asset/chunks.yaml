  raw: '## Streaming Data Generators


    The scikit-multiflow framework contains many streaming data generators to create
    simulated data streams for experimental and research-related work. One of the
    popular streaming data generators is the hyperplane generator. A hyperplane in
    a *p*-dimensional space is the set of points (*x*) that satisfy the following.


    ![$$ {\sum}_{j=1}^p{w}_j{x}_j={w}_0 $$](images/499734_1_En_1_Chapter/499734_1_En_1_Chapter_TeX_Equb.png)


    *x*[*j*] is the *j* ^(th) coordinate of *x*. *w* is the weight [[13](#499734_1_En_1_Chapter.xhtml#Par114)].


    For the target variable, the following types of observations are labeled as positive.


    ![$$ {\sum}_{j=1}^p{w}_j{x}_j&gt;={w}_0 $$](images/499734_1_En_1_Chapter/499734_1_En_1_Chapter_TeX_Equc.png)


    The following types of observations are labeled as negative.


    ![$$ {\sum}_{j=1}^p{w}_j{x}_j&lt;{w}_0 $$](images/499734_1_En_1_Chapter/499734_1_En_1_Chapter_TeX_Equd.png)


    Hyperplanes are useful for simulating time-changing concepts as the orientation.
    The position of the hyperplane can be changed by adjusting the relative size of
    the weight. Listing [1-5](#499734_1_En_1_Chapter.xhtml#PC7) generates a data stream
    using scikit-multiflow comprising ten features and a target variable. It generates
    10,000 observations before storing the simulated data in a CSV file. Figure [1-5](#499734_1_En_1_Chapter.xhtml#Fig5)
    is a snapshot of the generated dataset.


    ![../images/499734_1_En_1_Chapter/499734_1_En_1_Fig5_HTML.jpg](images/499734_1_En_1_Chapter/499734_1_En_1_Fig5_HTML.jpg)


    Figure 1-5


    Snapshot of the dataset generated using the hyperplane generator


    ```

    #############################################################

    # Import the relevant libraries

    from skmultiflow.data import HyperplaneGenerator

    import pandas as pd

    import numpy as np

    # Apply the HyperplaneGenerator() function

    create = HyperplaneGenerator(random_state = 888, n_features= 10, noise_percentage
    = 0)

    create.prepare_for_use()

    X , Y = create.next_sample(10000)

    data = pd.DataFrame(np.hstack((X, np.array([Y]).T)))

    data.shape

    # output- (10000, 11)

    print(data.head())

    # Output:

    #         0         1         2         3   ...        7         8         9    10

    #0  0.899478  0.248365  0.030172  0.072447  ...  0.633460  0.283253  0.365369  1.0

    #1  0.705171  0.648509  0.040909  0.211732  ...  0.026095  0.446087  0.239105  0.0

    #2  0.091587  0.977452  0.411501  0.458305  ...  0.181444  0.303406  0.174454  0.0

    #3  0.635272  0.496203  0.014126  0.627222  ...  0.517752  0.570683  0.546333  1.0

    #4  0.450078  0.876507  0.537356  0.495684  ...  0.606895  0.217841  0.912944  1.0

    #

    #[5 rows x 11 columns]

    # Store the data in csv

    data.to_csv(''data_stream_hyperplane.csv'', index=False)

    ###############################################################

    Listing 1-5

    Streaming Data Generation Using the Hyperplane Generator

    ```


    Another popular streaming data generator is the Agarwal generator. The Agarwal
    stream generator is one of the earliest data sources for training decision tree
