    earlier, the idea was to keep track of the number of errors in the learning algorithms,
    whereas in EDDM, the mean distance of two errors is tracked [[7](#499734_1_En_2_Chapter.xhtml#Par34)].
    Thus, EDDM stores the average distance between two errors (p′[j] and its standard
    deviation σ′[j]) and the maximum values p′[max] and σ′[max.] Similar to that of
    DDM, based on certain thresholds, either a concept drift or a warning zone is
    declared. Please refer to Baena-Garcia et al. [[7](#499734_1_En_2_Chapter.xhtml#Par34)]
