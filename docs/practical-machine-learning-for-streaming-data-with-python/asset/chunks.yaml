    ###############################################################

    # 导入相关库

    import numpy as np

    from skmultiflow.drift_detection.hddm_a import HDDM_A

    # 初始化 HDDM_A 对象

    HA = HDDM_A()

    # 设置随机种子以确保可重复性

    np.random.seed(123)

    # 从二项分布模拟一个大小为 1000 的数据流

    # 这里，n= 试验次数，p= 每次试验的概率

    n, p = 10, 0.6

    stream = np.random.binomial(n, p, 1000)

    stream[:10]

    # 输出- array([5, 7, 7, 6, 5, 6, 3, 5, 6, 6])

    # 数据概念从索引 299 到 499 发生变化

    for j in range(299, 500):

    stream[j] = np.random.randint(5, high=9)

    # 将流元素添加到 DDM 并检查是否发生漂移

    for j in range(1000):

    HA.add_element(stream[j])

    if HA.detected_change():

    print(''数据中检测到概念漂移：'' + str(stream[j]) + '' - 索引：'' + str(j))

    if HA.detected_warning_zone():

    print(''数据中检测到警告：'' + str(stream[j]) + '' - 索引：'' + str(j))

