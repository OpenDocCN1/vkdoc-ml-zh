- fmt: '## Early Drift Detection Method


    The Early Drift Detection Method (`EDDM`) is an improvement of the `DDM` method,
    especially for detecting slow, gradual changes in a data stream. In the `DDM`
    method discussed earlier, the idea was to keep track of the number of errors in
    the learning algorithms, whereas in `EDDM`, the mean distance of two errors is
    tracked [[7](#499734_1_En_2_Chapter.xhtml#Par34)]. Thus, `EDDM` stores the average
    distance between two errors (`p′[j]` and its standard deviation `σ′[j]`) and the
    maximum values `p′[max]` and `σ′[max]`. Similar to that of `DDM`, based on certain
    thresholds, either a concept drift or a warning zone is declared. Please refer
    to Baena-Garcia et al. [[7](#499734_1_En_2_Chapter.xhtml#Par34)] for a detailed
    review of the `EDDM`.


    Concept drift detection using `EDDM` can be implemented in the same way as in
    Listing [2-3](#499734_1_En_2_Chapter.xhtml#PC3). Instead of using the `DDM()`
    method, however, you need to apply the `EDDM()` method. You are encouraged to
    change the distribution of the data stream and note the output.


    ## Drift Detection Using HDDM_A and HDDM_W


    Drift detection using moving average-test (`HDDM_A`) is based on Hoeffding’s bound
    [[10](#499734_1_En_2_Chapter.xhtml#Par37)]. Hoeffding’s inequality does not assume
    a probability function; it assumes independent and bounded random variables [[8](#499734_1_En_2_Chapter.xhtml#Par35)].
    `HDDM_A` performs an *A-test*, in which given a sequence of random variables,
    changes in the population mean can be detected by monitoring the difference between
    the moving averages [[8](#499734_1_En_2_Chapter.xhtml#Par35)]. The `HDDM_A` method
    is implemented in `scikit-multiflow`. The implementation of `HDDM_A` is based
    on `MOA` [[9](#499734_1_En_2_Chapter.xhtml#Par36)].


    Listing [2-5](#499734_1_En_2_Chapter.xhtml#PC5) illustrates concept drift detection
    and warning zone detection using the `HDDM_A` method in `scikit-multiflow`. It
    simulates a data stream of size 1000 from a binomial distribution and changes
    the data concepts from index 299 to 499. The final output is shown in Listing
    [2-6](#499734_1_En_2_Chapter.xhtml#PC6).'
