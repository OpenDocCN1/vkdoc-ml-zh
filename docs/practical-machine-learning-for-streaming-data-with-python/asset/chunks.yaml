  trans: '

    ### 异常检测


    *异常检测*（或*离群点检测*）是一门识别与常态相异的事件或样本的科学 [4]（这些样本被称为*异常值*）。机器学习文献中充满了异常检测技术，尤其是在批量学习场景下。这些异常值的一些独特特征包括：它们在数据集中很少出现，并且其特征与正常样本不同。异常检测的一些实际应用包括入侵检测、欺诈检测、监控分析、医疗应用以及数据泄露防护。


    本章重点介绍用于流数据上下文中的异常检测的*流式半空间树*（SHST）技术。SHST 算法是一种用于流数据的增量式单类异常检测器 [5]。该算法最有用的特性之一是，它仅使用真实或正常的实例进行训练，即使在异常值极其罕见的情况下也能表现良好。该方法是一个由半空间树组成的随机集成。深度为
    d 的半空间树（HS-tree）被定义为一棵具有 2^(d+1) − 1 个节点的满二叉树，其中所有叶子节点都位于同一深度（即 d）。


    流式半空间树可以仅从数据空间的维度创建树结构，并且不需要实际的训练样本。因此，该方法无需执行任何模型重构来适应流数据。该模型可以在流数据到达之前部署。此外，SHST
    算法具有恒定的内存需求和恒定的均摊时间复杂度。


    清单 4-2 使用 scikit-multiflow 框架中提供的 `AnomalySineGenerator` 生成了一个包含异常值的数据流。它生成了一个包含
    500 个观测值的数据流，其中 100 个是异常值。生成的数据流快照如图 4-2 所示。最右侧的列指示一个样本是否为异常值（即，如果为 1，则为异常值；如果为
    0，则为正常值）。然后，它使用 scikit-multiflow 框架中提供的 `HalfSpaceTrees()` 方法，将 SHST 算法应用于此数据流。它训练模型并执行预测，如清单
    4-2 所示。


    ![../images/499734_1_En_4_Chapter/499734_1_En_4_Fig2_HTML.jpg](img/499734_1_En_4_Fig2_HTML.jpg)


    图 4-2

    包含异常值的数据流快照


    ```

    ###############################################################

    # 导入相关库

    import pandas as pd

    from skmultiflow.anomaly_detection import HalfSpaceTrees

    from skmultiflow.data import AnomalySineGenerator

    # 生成包含异常值的数据流

    dstream = AnomalySineGenerator(n_samples=500, n_anomalies=100, random_state=333)

    # 实例化半空间树估计器

    HS_trees = HalfSpaceTrees(random_state=333)

    # 准备数据流

    dstream.prepare_for_use()

    X, Y = dstream.next_sample(500)

    data = pd.DataFrame(np.hstack((X, np.array([Y]).T)))

    data.head()

    # 增量拟合模型

    HS_trees_model= HS_trees.partial_fit(X, Y)

    # 预测传入观测值的类别

    pred = HS_trees_model.predict(X)

    # 估计样本为异常值或真实值的概率

    prob = HS_trees_model.predict_proba(X)

    ###############################################################

    清单 4-2

    使用流式半空间树进行异常检测

    ```


    ## 用于数据流挖掘的其他工具和技术


    本节将高层次介绍八种用于数据流挖掘的开源软件工具：MOA、Apache Spark、Apache Flink、Apache Storm、Apache Kafka、Faust、Creme
    和 River。还有其他可用于数据流挖掘的工具（包括商业和开源工具），但它们不在本书的讨论范围之内。


    ### 大规模在线分析（MOA）


    大规模在线分析（MOA）是一个用 Java 开发的开源数据流挖掘框架。MOA 是一个基于 GUI 的工具。它包含一系列用于监督学习（分类、回归等）和无监督学习（聚类等）的流数据算法，以及模型评估工具
    [6]。本书讨论的大多数监督和无监督学习方法都可以在 MOA 中找到。


    由于 MOA 基于 GUI 且主要用 Java 开发，它可能对 Python 开发者/用户没有吸引力。我建议你探索一下这个工具。可以从 [`https://moa.cms.waikato.ac.nz`](https://moa.cms.waikato.ac.nz)
    下载。


    ### Apache Spark


    Apache Spark 是一个用于对批处理和流数据进行高速处理和分析的软件环境。它支持多种语言，如 Java、Python 和 R。这就是为什么 Spark（或
    pyspark）对于 Python 用户来说是一个很好的替代选择。Spark 可以访问多种数据源。它可以在云上或 Mesos、Hadoop 和 Kubernetes
    上运行。Spark 的库栈包括 Spark SQL、Spark Streaming、MLlib（用于机器学习）和 GraphX（用于图分析）。要下载最新版本并访问文档，请访问
    [`https://spark.apache.org`](https://spark.apache.org)。


    Spark Streaming 是核心 Spark API 的扩展。它是一个用于大规模处理数据流的强大工具。它包含许多高级函数，例如 `map`、`reduce`、`join`
    和 `window`，用于处理高速数据流。Spark Streaming 支持 MLlib 操作（即流式 k-means 聚类、流式线性回归（一种对每个数据批次使用随机梯度下降拟合的线性回归模型）等）。官方
    Spark Streaming 指南位于 [`https://spark.apache.org/docs/latest/streaming-programming-guide.html`](https://spark.apache.org/docs/latest/streaming-programming-guide.html)。


    ### Apache Flink


    Apache Flink 是一个统一的批处理和流数据分析引擎。它为连续流模型提供了高度灵活的流式窗口。它可以大规模执行内存计算。Flink 与许多其他开源数据处理生态系统集成，例如
    YARN 和 Mesos。Flink 对于事件驱动型应用非常有用，例如异常检测、基于规则的警报、欺诈检测和业务流程监控。请访问 [`https://flink.apache.org`](https://flink.apache.org)
    了解更多关于 Apache Flink 的信息。


    ### Apache Storm


    Apache Storm 是一个开源的分布式流处理计算框架。它主要用 Clojure 开发，但也支持多种语言，如 Java 和 Python。Apache
    Storm 是一个对流数据进行实时处理的非常强大的工具。它是一个不支持批处理的流处理引擎。它是一个真正的实时处理框架，将流作为完整的事件而不是一系列小批量来处理。它具有可扩展性，并且可以在跨机器集群运行的并行计算上工作。


    Storm 集群类似于 Hadoop 集群对批数据的作用。要在 Storm 中执行实时计算，你需要创建一个*拓扑*，它是一个有向无环计算图。拓扑由*流*（即，一个无界的元组管道）和*喷口*（即，数据流的来源）组成。一个
    Storm 集群包含两种节点：主节点和工作节点。主节点将任务分配给机器并监控其性能。工作节点将任务分配给其他工作节点。


    要下载最新版本的 Apache Storm 并访问官方文档，请访问 [`https://storm.apache.org/index.html`](https://storm.apache.org/index.html)。

    '
- fmt: '# Apache Kafka


    Apache Kafka is an open source distributed event streaming platform. What is *event
    streaming*? It is the phenomenon of capturing real-time data streams from various
    sources (`databases`, `sensors`, etc.) and then storing and processing them to
    generate insights. Some of the real-world use-cases for event streaming are processing
    financial transactions in stock exchanges, analyzing IoT device data, self-driving
    applications, web analytics, log aggregation, and real-time patient health monitoring.
    The official documentation is available at [`https://kafka.apache.org/documentation/`](https://kafka.apache.org/documentation/).


    Apache Kafka introduced a powerful but lightweight data stream processing library
    known as Kafka Streams. Developers can build Java and Scala applications at scale
    using Kafka Streams. Applications built using it can be deployed to VMs, containers,
    or the cloud. Documentation on Kafka Streams is available at [`https://kafka.apache.org/documentation/streams/`](https://kafka.apache.org/documentation/streams/).


    # Faust


    Faust is a library for building streaming applications in Python. It is useful
    for event streaming and is similar to Kafka Streams. But Faust lets you use Python
    syntax and other popular libraries in Python, such as `NumPy`, `TensorFlow`, and
    `Django`, for processing data streams. The official documentation is available
    at [`https://faust.readthedocs.io/en/latest/`](https://faust.readthedocs.io/en/latest/).
    You can also visit its GitHub page at [`https://github.com/robinhood/faust`](https://github.com/robinhood/faust).


    # Creme


    Creme is an open source library for online machine learning in Python. It is a
    powerful tool used to learn from streaming data. It shares many similarities with
    the `scikit-multiflow` framework. Creme can be installed from PyPI using the following
    command.


    ```

    >>> pip install creme

    ```


    Please visit Creme’s GitHub page to explore this tool further: [`https://github.com/MaxHalford/creme`](https://github.com/MaxHalford/creme).


    # River


    River [[8](#499734_1_En_4_Chapter.xhtml#Par520)] is a new library for online machine
    learning of streaming data using Python. It is the result of the merger of Creme
    and `scikit-multiflow`. At the time of writing this chapter (November 2020), the
    developers of both packages (Creme and `scikit-multiflow`) announced the merger
    and attested the common shared vision and goals. Figures [4-3](#499734_1_En_4_Chapter.xhtml#Fig3)
    and [4-4](#499734_1_En_4_Chapter.xhtml#Fig4) show the merger announcement on the
    `scikit-multiflow` and Creme GitHub pages. Both of these screenshots/images were
    taken on 22nd November, 2020.


    ![../images/499734_1_En_4_Chapter/499734_1_En_4_Fig4_HTML.jpg](images/499734_1_En_4_Chapter/499734_1_En_4_Fig4_HTML.jpg)


    Figure 4-4: Screenshot of the merger announcement in Creme’s GitHub page


    ![../images/499734_1_En_4_Chapter/499734_1_En_4_Fig3_HTML.jpg](images/499734_1_En_4_Chapter/499734_1_En_4_Fig3_HTML.jpg)


    Figure 4-3: Screenshot of the merger announcement on `scikit-multiflow`’s GitHub
    page


    The new package resulting from the merger is known as River. Creme and `scikit-multiflow`
    remain on PyPI, GitHub, and conda-forge. The River package is available in GitHub
    at [`https://github.com/online-ml/river`](https://github.com/online-ml/river).
    The API reference document is available at [`https://riverml.xyz/latest/api/overview/`](https://riverml.xyz/latest/api/overview/).


    At the time of writing this chapter, the River package was too new to discuss
    anything further. Many features still need to be developed. I believe that River
    has the potential to be a one-stop solution in Python for online machine learning
    with streaming data. Maybe I can focus on this package in the next edition of
    this book.


    # Conclusion and the Path Forward


    The purpose of this book is to introduce online/incremental machine learning with
    streaming data using Python. The real-time or near real-time analytics is the
    *next big thing* (especially with the advent of IoT devices, wearables, sensors,
    etc.). Many organizations and research institutes are focusing on this.


    Chapter [1](#499734_1_En_1_Chapter.xhtml) explained how machine learning with
    streaming data is different. Many machine learning methods that most of us use
    daily in a batch context aren’t effective for data stream mining.


    This book introduced the various online/incremental learning algorithms for concept
    drift detection, supervised learning, and unsupervised learning with streaming
    data. Given the demand of these skills, I strongly believe that these techniques
    should be in the repertoire of any data scientist, researcher, machine learning
    engineers, analytics professional, or data science aspirants.


    The book primarily focused on a Python-based library for data stream processing
    (i.e., the `scikit-multiflow` framework). This makes sense given the fact that
    Python is the most widely used language by data scientists. I discussed quite
    a few other tools in this chapter, and there are plenty of books and other resources
    available (especially on Spark, Kafka, and MOA). However, few books deal with
    machine learning with streaming data. This book is a step in this direction.


    `scikit-multiflow` is a very powerful tool for online/incremental machine learning
    with streaming data. You used it to implement various supervised and unsupervised
    learning techniques in a streaming data context in this book.


    I recommend that you start with `scikit-multiflow` to learn and explore the online/incremental
    machine learning techniques discussed in this book. Again, the package has merged
    with the Creme library, and the new package is known as River. I suggest that
    you transition to the River library once you are comfortable with the nitty-gritty
    of the `scikit-multiflow` framework. Please note that most of the techniques you
    learned in the `scikit-multiflow` framework should be integrated into the River
    package.


    Again, at the time of writing this chapter, the River package is too new to discuss
    in more detail. But I may cover this package or any other package that comes up
    as a suitable alternative to `scikit-multiflow` in the next edition of this book.


    The path forward is to learn the nuances of various online/incremental machine
    learning algorithms using the `scikit-multiflow` framework on various data streams
    and then move on to explore other Python-based tools for data stream mining, such
    as River, Spark, and Faust.


    Happy learning! ☺'
