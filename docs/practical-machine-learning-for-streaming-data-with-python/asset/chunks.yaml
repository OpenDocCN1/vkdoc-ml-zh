    ## Introduction to the Scikit-Multiflow Framework


    `scikit-multiflow` is a framework for the analysis of streaming data in Python
    [[9](#499734_1_En_1_Chapter.xhtml#Par110)]. It is an open source software distributed
    under the BSD license. There was a need for an open source machine learning library
    in Python for streaming data, similar to what the `scikit-learn` library [[10](#499734_1_En_1_Chapter.xhtml#Par111)]
    has been doing for static/batch data for years. The `scikit-multiflow` framework
    is built upon other famous open source frameworks, such as `scikit-learn`, `MOA`
    [[11](#499734_1_En_1_Chapter.xhtml#Par112)], and `MEKA` [[12](#499734_1_En_1_Chapter.xhtml#Par113)].


    `MOA` is among the oldest and most popular open source software for data stream
    mining. It contains a collection of streaming data algorithms for supervised (classification,
    regression, etc.) and unsupervised learning (clustering, etc.). `MOA` is developed
    in Java.


    `MEKA` is an open source software for multilabel learning and evaluation. `scikit-multiflow`
    complements `scikit-learn` (whose primary focus is on batch learning) and helps
    with machine learning in streaming data research.


    The `scikit-multiflow` website ([`https://scikit-multiflow.github.io/`](https://scikit-multiflow.github.io/))
    provides official documentation and the user guide.


    The API reference documentation is available at [`https://scikit-multiflow.readthedocs.io/en/stable/api/api.html`](https://scikit-multiflow.readthedocs.io/en/stable/api/api.html).


    The `scikit-multiflow` package source code is publicly available at [`https://github.com/scikit-multiflow/scikit-multiflow`](https://github.com/scikit-multiflow/scikit-multiflow).


    `numpy` and `cython` are two dependencies that need to be installed before you
    install `scikit-multiflow`.


    `scikit-multiflow` only works only on Python 3.5+ versions.


    To install `scikit-multiflow` from the Python Package Index (PyPI), use the following
    command in the command prompt/terminal.


    ```

    $ pip install -U scikit-multiflow

    ```


    `scikit-multiflow` can also be installed from `conda-forge` using the following
    command.


    ```

    $ conda install -c conda-forge scikit-multiflow

    ```


    This book uses the version 0.5.3 package, released in June 2020.


    In the next section, you learn about the various streaming data generators available
    in the `scikit-multiflow` framework.'
