  raw: '## Drift Detection Using the Page-Hinkley Method


    The drift detection method based on the Page-Hinkley (PH) test [[12](#499734_1_En_2_Chapter.xhtml#Par39)]
    is a sequential analysis method that detects the sudden change in the mean of
    a Gaussian signal [[13](#499734_1_En_2_Chapter.xhtml#Par40)]. This method tracks
    the cumulated difference between the observed values and their mean up to the
    current moment [[14](#499734_1_En_2_Chapter.xhtml#Par41)]. Generally, this method
    sends an alarm for concept drift when the observed mean at some instant is greater
    than a given threshold λ. The value of λ is determined by the admissible false
    alarm rate. If you increase the value of λ, you may be able to reduce the false
    alarms, but you miss some instances of changes in the data distribution.


    Listing [2-9](#499734_1_En_2_Chapter.xhtml#PC9) illustrates concept drift detection
    using the Page-Hinkley method. It simulates a data stream of size 1000 from a
    normal distribution and then changes the data concept from index 299 to 799 (i.e.,
    replace values with integers between 5 and 8), as shown in Figure [2-2](#499734_1_En_2_Chapter.xhtml#Fig2).
    However, unlike some of the methods discussed earlier, the Page-Hinkley method
    doesn’t output warning zones. It only shows the instance of concept drift, as
    shown in Listing [2-10](#499734_1_En_2_Chapter.xhtml#PC10).


    ![../images/499734_1_En_2_Chapter/499734_1_En_2_Fig2_HTML.jpg](images/499734_1_En_2_Chapter/499734_1_En_2_Fig2_HTML.jpg)


    Figure 2-2


    The data stream with changed concept from index 299 to 799


    ```

    ###############################################################

    ### Output:

    Concept drift detected in data: 5.0 - at index: 306

    ###############################################################

    Listing 2-10

    Output for Concept Drift Detected Using the Page-Hinkley Method

    ```


    ```

    ###############################################################

    # Import the relevant libraries

    import numpy as np

    from skmultiflow.drift_detection import PageHinkley

    # Initialize the PageHinkley object

    ph = PageHinkley()

    # set seed for reproducibility

    np.random.seed(123)

    # Simulate a data stream of size 1000 from a normal distribution

    # with mean=0 and standard deviation=0.1

    stream = np.random.normal(0, 0.1, 1000)

    # Data concept are changed from index 299 to 799

    for j in range(299, 800):

    stream[j] = np.random.randint(5, high=9)

    # Adding stream elements to the PageHinkley drift detector and verifying if drift
    occurred

    for j in range(1000):

    ph.add_element(stream[j])

    if ph.detected_change():

    print(''Concept drift detected in data: '' + str(stream[j]) + '' - at index: ''
    + str(j))

    ###############################################################

    Listing 2-9

    Illustration for Concept Drift Detection Using the Page-Hinkley Method in scikit-multiflow

    ```


    ## Summary


    This chapter discussed the various algorithms for concept drift detection in a
    streaming data context. It also explored the relevant techniques and implemented
    them using the scikit-multiflow framework in Python.


    The next chapter discusses various supervised learning techniques for streaming
    data and implements some of them using the scikit-multiflow framework.


    # 3. Supervised Learning for Streaming Data


    In the last chapter, you learned some concept drift detection algorithms. This
    chapter focuses on supervised learning algorithms (for classification tasks and
    regression tasks) in a streaming data context. In supervised learning, there is
    a target or a response variable and there are predictor variables. The goal of
    the learner/model is to understand the relationship between the target and the
    predictor variables. This can then be used to make predictions on the target variable
    for future observations of the predictor variables [[1](#499734_1_En_3_Chapter.xhtml#Par71)].
    (I assume that you are already familiar with the supervised learning techniques
    used in a batch setting.)


    Chapter [1](#499734_1_En_1_Chapter.xhtml) covered the challenges of streaming
    data and how the streaming data algorithms are different from batch learning algorithms.
    This chapter dives into some machine learning techniques for streaming data and
    their implementation using the scikit-multiflow framework.


    In Chapter [1](#499734_1_En_1_Chapter.xhtml), you learned about data stream generators
    and how to create a data stream from a source file (CSV format). Those ideas are
    used in nearly all the working examples in this chapter.


    The chapter starts with the evaluation methods used in a streaming data context.
    It then discusses supervised learning approaches—tree-based, lazy learning, Naïve
    Bayes, and more. Finally, the ensemble learning techniques in the streaming data
    context are explained.


    This chapter is restricted to binary classification methods and single target
    regression (i.e., multiclass classification and multitarget regression techniques
    are beyond the scope of this book). All the experiments in this chapter are performed
    on a system with a configuration of 1.6 GHz dual-core Intel Core i5 processor,
    4 GB RAM, and macOS. However, the code should run on a similar or greater configuration
    system or operating system without any changes or modifications. This book uses
    the scikit-multiflow package version 0.5.3, which was released in June 2020.


    ## Evaluation Methods


    This section introduces model evaluation methods that are often used in evaluating
    the performance of supervised learning methods in a streaming data context. These
    methods are known as the *holdout evaluation method* and the *prequential evaluation
    method* (a.k.a., the *interleaved test-then-train method*).


    In the holdout evaluation method, the performance evaluation happens after every
    batch of a certain number of examples or observations. The learner’s or model’s
    performance is evaluated on a test dataset formed by unseen examples. These unseen
    examples are used only for evaluation purposes and are not used to train the model.
    The same test dataset can be used in multiple evaluation runs. However, it is
    also possible to create dynamic test datasets. The holdout evaluation method can
    be applied using the EvaluateHoldout() function available in the scikit-multiflow
    framework’s evaluation module.


    The prequential evaluation method, or the interleaved test-then-train method,
    is specifically designed for evaluating models in a streaming data context. Each
    of the examples is analyzed according to its order of arrival. In this evaluation
    method, the incoming unseen example in the data stream is first used for testing
    (i.e., the model/learner makes predictions). These unseen examples are also used
    to train the model before the next round of testing. The prequential evaluation
    method can be applied using the EvaluatePrequential() function in the scikit-multiflow
    framework’s evaluation module.


    There is another evaluation method available in the scikit-multiflow framework
    (the *prequential evaluation delayed method*); however, this book sticks to the
    holdout evaluation method and the prequential evaluation method, with more emphasis
    on the latter.


    This chapter uses these evaluation methods to track the performance of various
    supervised learning algorithms discussed in the next few sections. You need to
    specify the metrics when using either the EvaluateHoldout() function or the EvaluatePrequential()
    function.


    In this chapter, classification problems generally use metrics such as prediction
    accuracy and the f1 score (the harmonic mean of precision and recall). For regression
    problems, metrics such as mean squared error and mean absolute error are used.


    ## Decision Trees for Streaming Data


    This section discusses some of the tree-based techniques for classification and
    regression tasks in the streaming data context. It covers Hoeffding trees, Hoeffding
    Adaptive Tree classifiers, the Extremely Fast Decision Tree classifiers, Hoeffding
    tree regressors, and Hoeffding Adaptive Tree regressors, which are applied to
    different datasets using scikit-multiflow.'
