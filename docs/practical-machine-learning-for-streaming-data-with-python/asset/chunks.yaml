    The next section focuses on ensemble learning for streaming data.


    ## Ensemble Learning for Streaming Data


    Ensemble learning combines multiple models to improve the prediction accuracy
    for out-of-sample data. Typically (though not guaranteed), an ensemble learner
    performs better than the stand-alone base methods. Ensemble learning is a very
    popular technique in machine learning for both regression and classification purposes.
    Some of the well-known ensemble learning techniques in a batch data context are
    random forests, bagging, and boosting. This section focuses on some of the ensemble
    learning techniques for streaming data implemented in the `scikit-multiflow` framework.

