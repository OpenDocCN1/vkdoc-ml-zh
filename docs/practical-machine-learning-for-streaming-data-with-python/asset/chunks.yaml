    现在，让我们来看另一种基于 KNN 的分类器：KNN 算法的自调整记忆（SAM）模型 [11]。在本章后续部分，该方法被称为 SAM-KNN。SAM-KNN
    技术能有效处理异质性概念漂移，且无需优化元参数。该技术的灵感来源于人类记忆研究中的双存储模型，在该模型中，知识被划分为短期记忆（STM）和长期记忆（LTM）[12]。


    在 SAM-KNN 中，记忆被划分为 STM 和 LTM。STM 包含动态滑动窗口中与近期概念相关的数据。LTM 则维护过去信息的知识。存在一个清理过程来控制
    STM 的大小。此外，经过筛选的知识会从 STM 转移到 LTM。LTM 确保其存储的压缩信息与 STM 的信息不冲突。组合记忆（CM）是 STM 和 LTM
    的并集。


    其思想是组合/集成针对最新概念和所有过去概念的专用模型（距离加权 KNN），以最大化预测准确率。


