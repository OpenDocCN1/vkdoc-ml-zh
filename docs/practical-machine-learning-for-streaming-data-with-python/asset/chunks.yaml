- fmt: '# Online Bagging


    Bagging is a widely used ensemble learning technique in batch (non-streaming)
    learning. Here, `X` base models are trained on bootstrap sample sets of size `N`.
    The bootstrapped sample sets are created using sampling with replacement from
    the original training dataset.


    The training set of each of the base models contains the original training examples
    `K` times, where `P(K = k)` follows a binomial distribution. And when `N` tends
    to be infinity, the distribution of `K` tends to be a `Poisson(1)` distribution
    (i.e., `K ~ exp(–1)/k!`) [[15](#499734_1_En_3_Chapter.xhtml#Par85)]. Oza and Russell
    [[15](#499734_1_En_3_Chapter.xhtml#Par85)] used this idea to propose the online
    learning version of the bagging algorithm, which is suitable in a streaming data
    context.


    In online bagging, as a new training example arrives, the algorithm chooses the
    example `K ~ Poisson(1)` times for each base model and updates the base model
    accordingly. New instances are classified by performing majority voting of the
    `X` base models. This step is the same for both batch and online bagging methods.
    Online bagging is considered a good approximation to batch bagging [[15](#499734_1_En_3_Chapter.xhtml#Par85)].


    In scikit-multiflow, the online bagging classification technique can be applied
    using the `OzaBaggingClassifier()` method. Listing [3-26](#499734_1_En_3_Chapter.xhtml#PC26)
    applies the Oza bagging classifier to the synthetic dataset used in Listing [3-16](#499734_1_En_3_Chapter.xhtml#PC16).
    The `KNN ADWIN` classifier model is the base model. Listing [3-26](#499734_1_En_3_Chapter.xhtml#PC26)
    built six base models. The hyperparameters of the `KNN ADWIN` classifier are the
    same as that used in Listing [3-16](#499734_1_En_3_Chapter.xhtml#PC16) (i.e.,
    number of neighbors is 10 and maximum window size is 1000). A prequential evaluation
    is applied, and the output is shown in Listing [3-27](#499734_1_En_3_Chapter.xhtml#PC27).
    The accuracy obtained is 66.21%.


    ```

    ###############################################################

    Prequential Evaluation

    Evaluating 1 target(s).

    Pre-training on 1000 sample(s).

    Evaluating...

    #################### [100%] [61.53s]

    Processed samples: 10000

    Mean performance:

    M0 - Accuracy     : 0.6621

    ###############################################################

    Listing 3-27

    Prequential Evaluation Output of the Oza Bagging Classifier

    ```


    ```

    ###############################################################

    # Import the relevant libraries

    from skmultiflow.meta import OzaBaggingClassifier

    from skmultiflow.lazy import KNNADWINClassifier

    from skmultiflow.evaluation import EvaluatePrequential

    from skmultiflow.data.sea_generator import SEAGenerator

    # Simulate the data stream

    dstream = SEAGenerator(classification_function = 2, balance_classes = True, noise_percentage
    = 0.3, random_state = 333)

    # Instantiate the Oza Bagging classifier method with KNN ADWIN classifier as the
    base model

    oza_class = OzaBaggingClassifier(base_estimator=KNNADWINClassifier(n_neighbors=10,
    max_window_size=1000), n_estimators=4, random_state = 333)

    # Prequential Evaluation

    evaluate1 = EvaluatePrequential(show_plot=False,

    pretrain_size=1000,

    max_samples=10000,

    metrics=[''accuracy'']

    )

    # Run the evaluation

    evaluate1.evaluate(stream=dstream, model=oza_class)

    ###############################################################

    Listing 3-26

    Applying the Oza Bagging Classifier to a Synthetic Data Stream

    ```


    Now, let’s talk about the online bagging method known as the *leveraging bagging
    method*, proposed by Bifet et al. [[16](#499734_1_En_3_Chapter.xhtml#Par86)].
    Here, bagging is leveraged by increasing resampling and using output detection
    codes. In the Oza Bagging technique, a sampling with replacement uses the (`λ
    = 1`) Poisson distribution. But in the leveraging bagging method, the value of
    `λ` is larger. For example, instead of using the (`λ = 1`) Poisson distribution,
    it uses the (`λ = 6`) Poisson distribution. The output detection code helps correct
    errors. Each class is assigned a binary string of length `L`, and then an ensemble
    of `L` binary classifiers is built. This leads to better performance in multiclass
    classification tasks. Also, the leveraging bagging algorithm uses the `ADWIN`
    windowing technique for handling inherent concept drift in a data stream.


    In scikit-multiflow, the leveraging bagging classification technique can be applied
    using the `LeveragingBaggingClassifier()` method. Listing [3-28](#499734_1_En_3_Chapter.xhtml#PC28)
    replicates the same experiment performed in Listing [3-26](#499734_1_En_3_Chapter.xhtml#PC26)
    (i.e., the same data stream and hyperparameters for the six base models (`KNN
    ADWIN` classifiers)). However, the `OzaBaggingClassifier()` method is replaced
    with the `LeveragingBaggingClassifier()` method. A prequential evaluation is performed,
    and the output is shown in Listing [3-29](#499734_1_En_3_Chapter.xhtml#PC29).
    The accuracy obtained is 58.68%.


    ```

    ###############################################################

    Prequential Evaluation

    Evaluating 1 target(s).

    Pre-training on 1000 sample(s).

    Evaluating...

    #################### [100%] [310.46s]

    Processed samples: 10000

    Mean performance:

    M0 - Accuracy     : 0.5868

    ###############################################################

    Listing 3-29

    Prequential Evaluation Output of the Leveraging Bagging Classifier

    ```


    ```

    ###############################################################

    # Import the relevant libraries

    from skmultiflow.meta import LeveragingBaggingClassifier

    from skmultiflow.lazy import KNNADWINClassifier

    from skmultiflow.evaluation import EvaluatePrequential

    from skmultiflow.data.sea_generator import SEAGenerator

    # Simulate the data stream

    dstream = SEAGenerator(classification_function = 2, balance_classes = True, noise_percentage
    = 0.3, random_state = 333)

    # Instantiate the Leveraging Bagging classifier method with KNN ADWIN classifier
    as the base model

    leverage_class = LeveragingBaggingClassifier(base_estimator=KNNADWINClassifier(n_neighbors=10,
    max_window_size=1000), n_estimators=6, random_state = 333)

    # Prequential Evaluation

    evaluate1 = EvaluatePrequential(show_plot=False,

    pretrain_size=1000,

    max_samples=10000,

    metrics=[''accuracy'']

    )

    # Run the evaluation

    evaluate1.evaluate(stream=dstream, model=leverage_class)

    ###############################################################

    Listing 3-28

    Applying the Leveraging Bagging Classifier to a Synthetic Data Stream

    ```'
