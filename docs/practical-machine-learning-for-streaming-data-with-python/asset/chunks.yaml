- fmt: '### Extremely Fast Decision Tree Classifier


    The Extremely Fast Decision Tree (EFDT) (an instantiation of the Hoeffding Anytime
    Tree) is an incremental decision tree. The Hoeffding Anytime Tree operates almost
    like a Hoeffding tree, but the difference lies in the way they split at a node.
    The Hoeffding tree delays the split at a node until it identifies the best split
    and doesn’t revisit the decision. The Hoeffding Anytime Tree splits at a node
    as soon as it seems to be a useful split and does revisit the decision in the
    availability of a better split. The Hoeffding Anytime Tree is not computationally
    as efficient as the Hoeffding tree, but it is statistically more efficient [[7](#499734_1_En_3_Chapter.xhtml#Par77)].


