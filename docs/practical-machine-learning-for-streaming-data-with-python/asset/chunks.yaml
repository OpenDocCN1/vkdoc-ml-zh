    本节解释了增量学习和在线学习算法，并在线性回归背景下使用 Python 实现了其中几种算法。下一节将介绍 scikit-multiflow。


    ## Scikit-Multiflow 框架简介


    scikit-multiflow 是一个用于在 Python 中分析流数据的框架 [9]。它是一个根据 BSD 许可证分发的开源软件。业界需要一个用于流数据的
    Python 开源机器学习库，类似于 scikit-learn 库 [10] 多年来为静态/批量数据所做的工作。scikit-multiflow 框架建立在其他著名的开源框架之上，例如
    scikit-learn、MOA [11] 和 MEKA [12]。


    MOA 是历史最悠久、最流行的数据流挖掘开源软件之一。它包含一系列用于监督学习（分类、回归等）和无监督学习（聚类等）的流数据算法。MOA 使用 Java 开发。


    MEKA 是一个用于多标签学习和评估的开源软件。scikit-multiflow 补充了 scikit-learn（其主要关注点是批量学习），并有助于流数据研究中的机器学习。


    scikit-multiflow 网站 ([`https://scikit-multiflow.github.io/`](https://scikit-multiflow.github.io/))
    提供了官方文档和用户指南。


    API 参考文档可在 [`https://scikit-multiflow.readthedocs.io/en/stable/api/api.html`](https://scikit-multiflow.readthedocs.io/en/stable/api/api.html)
    获取。


    scikit-multiflow 包的源代码可在 [`https://github.com/scikit-multiflow/scikit-multiflow`](https://github.com/scikit-multiflow/scikit-multiflow)
    公开获取。


    在安装 scikit-multiflow 之前，需要先安装两个依赖项：numpy 和 cython。


    scikit-multiflow 仅适用于 Python 3.5+ 版本。


    要从 Python 包索引 (PyPI) 安装 scikit-multiflow，请在命令提示符/终端中使用以下命令。


    ```

    $ pip install -U scikit-multiflow

    ```


    也可以使用以下命令从 conda-forge 安装 scikit-multiflow。


    ```

    $ conda install -c conda-forge scikit-multiflow

    ```


