- fmt: '### Online Boosting


    Another well-known ensemble learning technique is *boosting*. Its basic principle
    is to sequentially combine a set of “weak learners” to create a “strong learner.”
    The `AdaBoost` technique is one of the first boosting techniques for batch data
    [[17](#499734_1_En_3_Chapter.xhtml#Par87)]. (`AdaBoost` is short for *adaptive
    boosting*.) A weak classifier (i.e., a decision tree) is prepared on training
    data using weighted samples, and then the misclassification error rate is calculated
    for the trained model. The misclassified examples by the current classifier are
    given more weight in the training dataset for the next classifier. The subsequent
    learners focus more on the difficult examples, which goes on until there is no
    more significant improvement in the algorithm’s performance.


    Wang and Pineau [[18](#499734_1_En_3_Chapter.xhtml#Par88)] proposed the *online
    boosting classifier*, which is the online version of the `AdaBoost` algorithm.
    In an online learning context, each arriving example is trained `K` times, drawn
    from a binomial distribution. As in a data stream, the number of examples is large
    (tends to infinity), so the binomial distribution tends to a `Poisson(λ)` distribution
    where the value of `λ` is calculated by keeping track of the weight of misclassified
    and correctly classified examples. The online boosting algorithm uses the `ADWIN`
    windowing technique for handling inherent concept drift in a data stream.


    The online `AdaBoost` algorithm can be applied using the `OnlineBoostingClassifier()`
    method implemented in the `scikit-multiflow` framework. Listing [3-30](#499734_1_En_3_Chapter.xhtml#PC30)
    applies the online boosting classifier on the same data stream used in Listing
    [3-28](#499734_1_En_3_Chapter.xhtml#PC28). A prequential evaluation is performed,
    and the output is shown in Listing [3-31](#499734_1_En_3_Chapter.xhtml#PC31).
    The accuracy obtained is 58%.


    ```

    ###############################################################

    Prequential Evaluation

    Evaluating 1 target(s).

    Pre-training on 1000 sample(s).

    Evaluating...

    #################### [100%] [669.82s]

    Processed samples: 10000

    Mean performance:

    M0 - Accuracy     : 0.5800

    ###############################################################

    Listing 3-31

    Prequential Evaluation Output of the Online Boosting Classifier

    ```


    ```

    ###############################################################

    # Import the relevant libraries

    from skmultiflow.meta import OnlineBoostingClassifier

    from skmultiflow.evaluation import EvaluatePrequential

    from skmultiflow.data.sea_generator import SEAGenerator

    # Simulate the data stream

