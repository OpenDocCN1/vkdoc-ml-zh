    This section discussed some of the prominent tree-based techniques for classification
    and regression in a streaming data context. The next section focuses on some of
    the lazy learning techniques.


    ## Lazy Learning Methods for Streaming Data


    Let’s talk a bit about the k-nearest neighbor (`KNN`) method for classification
    and regression in a batch context. `KNN` is a non-parametric method that keeps
    all the observations in memory and classifies a new incoming observation based
    on a similarity metric/distance function [[9](#499734_1_En_3_Chapter.xhtml#Par79)].
    Euclidean distance, Mahalanobis distance, and the Manhattan distance are three
    of the commonly used distance functions.


    In a new observation, the `KNN` algorithm selects the nearest `k` neighbors in
    the dataset based on the distance function and then combines the values of the
    `k` nearest neighbors for prediction (i.e., in a regression context, it takes
    the average, and in a classification context, it performs majority voting).


    `scikit-multiflow` has an implementation of the `KNN` method for classification
    in streaming data context (`KNNClassifier()`). The modus-operandi of this technique
    is the same as that of `KNN`, along with a window on the training samples. The
    user can fix the maximum size of the window. The `KNNClassifier()` method treats
    all features in a data stream as continuous and is not recommended for datasets
    with a mix of categorical and continuous features.


    Listing [3-14](#499734_1_En_3_Chapter.xhtml#PC14) applies the `KNN` classifier
    (where `K = 10`) on a synthetic dataset, and prequential evaluation is applied.
    The same synthetic dataset generated using `HyperplaneGenerator()` in Listing
    [3-1](#499734_1_En_3_Chapter.xhtml#PC1) is exported to a CSV file (`data_stream.csv`).
    A snapshot of the dataset is shown in Figure [3-1](#499734_1_En_3_Chapter.xhtml#Fig1).
    The output of the prequential evaluation is shown in Listing [3-15](#499734_1_En_3_Chapter.xhtml#PC15).
    The accuracy obtained is `87.99%`.


    ```

    ###############################################################

    Prequential Evaluation

    Evaluating 1 target(s).

    Pre-training on 1000 sample(s).

    Evaluating...

    ##------------------ [10%]

    #################### [100%] [7.31s]

