- fmt: "# Applications of Streaming Data\n\nReal-time analytics using streaming data\
    \ is going to be a game-changer in this era of big data. The mantra for real-time\
    \ analytics is to get good solutions quickly. The following are some applications\
    \ or use-cases for streaming data real-time analytics.\n\n- **Fraud detection\
    \ in real time or near real time**. Let’s look at Amazon as an example. There\
    \ are approximately one billion daily transactions on Amazon.com, but not all\
    \ the transactions are genuine.\n- **Real-time recommendations** can lead to impulsive\
    \ customer purchases, which is a very important proposition for e-commerce firms.\n\
    - **Real-time weather detection** is useful for disaster and warning systems.\n\
    - **Network management in real time** involves monitoring and configuring network\
    \ hardware and software to ensure smooth operation. Use-cases include real-time\
    \ fault detection, monitoring link bandwidth usage in real time, improving network\
    \ resource utilization, and more.\n- **Real-time operations management** include\
    \ supply chain decision-making, such as when to refuel or reorder.\n- **Algorithmic\
    \ trading using stock tick data.** Monitoring stock trends in real time helps\
    \ trading-related decision-making.\n- **Real-time sports analytics.** Relevant\
    \ use-cases include player-movement tracking and performance analytics using streaming\
    \ data sources, such as video feeds and sensor data.\n- **Precision agriculture.**\
    \ A simple use-case is collecting sensor-based data on farm equipment health and\
    \ minimizing its downtime by predicting when and where equipment failure occurs\
    \ and making alternative arrangements.\n- **Security event monitoring** includes\
    \ real-time monitoring of log data, host systems, and security devices to flag\
    \ incidents (e.g., send alerts) such as failed logins, malware activity, and other\
    \ suspicious activities.\n- **Real-time trends** are a feature in Twitter and\
    \ Google Trends.\n- **Automated annotation**. Real-time annotation of objects\
    \ in a live video feed is a relevant use-case. The same is applicable for a stream\
    \ of images or speech data.\n\nIn the next section, you learn about the various\
    \ Windowing techniques for analyzing streaming data.\n\n# Windowing Techniques\n\
    \nA window can be defined as a snapshot of data—either observation-count-based\
    \ or time-based [[3](#499734_1_En_1_Chapter.xhtml#Par104)]. This is a very useful\
    \ technique in a streaming data context since at no point in time do you have\
    \ the “entire data” available. A window can effectively handle *concept drift*\
    \ because more importance is given to recent data points; the older data points\
    \ are periodically discarded. A batch learning method can be converted to an incremental\
    \ method by using a *windowing technique* [[5](#499734_1_En_1_Chapter.xhtml#Par106)].\
    \ The types of windowing techniques include the sliding window model, the damped\
    \ window model, and the landmark window model [[6](#499734_1_En_1_Chapter.xhtml#Par107)].\
    \ The following explains each of these windowing techniques.\n\n- **Landmark window\
    \ model**. Older data points are not discarded. All data points are accumulated\
    \ in the window. Figure [1-2](#499734_1_En_1_Chapter.xhtml#Fig2) depicts this\
    \ model. The rectangle represents the window, and the blue circles are the data.\n\
    - **Sliding window model**. This is a popular way to discard older data points\
    \ and consider only the recent data points for analysis. Figure [1-3](#499734_1_En_1_Chapter.xhtml#Fig3)\
    \ depicts this model.\n- **Damped window model**. The data points are weighted.\
    \ Higher weight is given to recent data points. An *exponential fading strategy*\
    \ is used to discard old data. An aging function `g(t)` is used.\n\n![$$ g(t)=1/{2}^{\\\
    uplambda \\left({t}_x-{t}_o\\right)} $$](images/499734_1_En_1_Chapter/499734_1_En_1_Chapter_TeX_Equa.png)\n\
    \n`λ` is the fading factor, `t[x]` is the current timestamp, and `t[o]` is the\
    \ origin timestamp (i.e., the time that the window was created). You can influence\
    \ discarding older data points by changing the value of `λ` [[7](#499734_1_En_1_Chapter.xhtml#Par108)].\
    \ A higher `λ` value means less weight is given to older data points. Figure [1-4](#499734_1_En_1_Chapter.xhtml#Fig4)\
    \ shows the exponential fading of data points in a damped window model over time.\n\
    \n![../images/499734_1_En_1_Chapter/499734_1_En_1_Fig4_HTML.jpg](images/499734_1_En_1_Chapter/499734_1_En_1_Fig4_HTML.jpg)\n\
    \nFigure 1-4: Exponential fading of data points in a damped window model\n\n![../images/499734_1_En_1_Chapter/499734_1_En_1_Fig3_HTML.jpg](images/499734_1_En_1_Chapter/499734_1_En_1_Fig3_HTML.jpg)\n\
    \nFigure 1-3: Sliding window model\n\n![../images/499734_1_En_1_Chapter/499734_1_En_1_Fig2_HTML.jpg](images/499734_1_En_1_Chapter/499734_1_En_1_Fig2_HTML.jpg)\n\
    \nFigure 1-2: Landmark window model\n\nFigure [1-2](#499734_1_En_1_Chapter.xhtml#Fig2)\
    \ shows that a landmark window accumulates data points over time. The window size\
    \ increases as more data points arrive. This windowing technique requires large\
    \ memory resources, especially when dealing with large data streams.\n\nIn a sliding\
    \ window model, as shown in Figure [1-3](#499734_1_En_1_Chapter.xhtml#Fig3), “time”\
    \ is the x axis, and the observations (i.e., the blue dots) arrive sequentially\
    \ from left to right. The leftmost observation is the oldest data, and the most\
    \ recent observations are on the right.\n\nFigure [1-3](#499734_1_En_1_Chapter.xhtml#Fig3)\
    \ shows that the older points are continuously discarded; only the recent points\
    \ are considered in the window. Figure [1-3](#499734_1_En_1_Chapter.xhtml#Fig3)\
    \ also shows a window of size = 8 (i.e., it contains eight data points in an instant\
    \ of time). The window moves in step = 1 (i.e., the window slides in step 1, where\
    \ the oldest data is discarded).\n\nAlso in Figure [1-3](#499734_1_En_1_Chapter.xhtml#Fig3),\
    \ window `W[1]` at time `t[1]` contains eight data points. When a new data point\
    \ arrives at time `t[2]`, the oldest data point in `W1` is discarded to form window\
    \ `W[2]` with eight data points, including the most recent one. The sliding windows\
    \ model only considers recent data points; it discards the older ones.\n\nA sliding\
    \ window is implemented in Python 3, as shown in Listing [1-1](#499734_1_En_1_Chapter.xhtml#PC1).\
    \ It creates a window of size = 4 and shifts in steps of 1. The input array (`y`)\
    \ consists of ten integers from 0 to 9. The sliding window implementation output\
    \ is shown in Listing [1-2](#499734_1_En_1_Chapter.xhtml#PC2). The sliding windows\
    \ at the end have `None`, which indicates an empty value, as no new data point\
    \ is arriving, but the window size is fixed to 4.\n\n```\n###############################################################\n\
    [0, 1, 2, 3]\n[1, 2, 3, 4]\n[2, 3, 4, 5]\n[3, 4, 5, 6]\n[4, 5, 6, 7]\n[5, 6, 7,\
    \ 8]\n[6, 7, 8, 9]\n[7, 8, 9, None]\n[8, 9, None, None]\n[9, None, None, None]\n\
    ###############################################################\nListing 1-2:\
    \ Sliding Window Function Output\n```\n\n```\n###############################################################\n\
    # Import the relevant libraries\nimport itertools\nfrom itertools import tee\n\
    from itertools import zip_longest as zip\ndef window(iterations, size):\n    n\
    \ = tee(iterations, size)\n    for i in range(1, size):\n        for each in n[i:]:\n\
    \            next(each, None)\n    return zip(*n)\ny = range(10)\nfor each in\
    \ window(y, 4):\n    print(list(each))\n###############################################################\n\
    Listing 1-1: Sliding Window Implementation\n```\n\nUnlike the sliding windowing\
    \ technique, the damped window model gives recent data points a higher weight.\
    \ The older data points are discarded using an exponential fading strategy, as\
    \ shown in Figure [1-4](#499734_1_En_1_Chapter.xhtml#Fig4). The relatively older\
    \ data points are discarded faster than the newer data points. This way, the window\
    \ stores both older and newer data points. However, the sliding window technique\
    \ is much more popular in a streaming data context. It is the primary windowing\
    \ technique in this book.\n\nIn the next section, you learn about incremental\
    \ learning and online learning algorithms."
  raw: '## Applications of Streaming Data


    Real-time analytics using streaming data is going to be a game-changer in this
    era of big data. The mantra for real-time analytics is to get good solutions quickly.
    The following are some applications or use-cases for streaming data real-time
    analytics .


    *   **Fraud detection in real time or near real time**. Let’s look at Amazon as
    an example. There are approximately one billion daily transactions on Amazon.com,
    but not all the transactions are genuine.


    *   **Real-time recommendations** can lead to impulsive customer purchases, which
    is a very important proposition for e-commerce firms.


    *   **Real-time weather detection** is useful for disaster and warning systems.


    *   **Network management in real time** involves monitoring and configuring network
    hardware and software to ensure smooth operation. Use-cases include real-time
    fault detection, monitoring link bandwidth usage in real time, improving network
    resource utilization, and more.


    *   **Real-time operations management** include supply chain decision-making,
    such as when to refuel or reorder.


    *   **Algorithmic trading using stock tick data.** Monitoring stock trends in
    real time helps trading-related decision-making.


    *   **Real-time sports analytics.** Relevant use-cases include player-movement
    tracking and performance analytics using streaming data sources, such as video
    feeds and sensor data.


    *   **Precision agriculture.** A simple use-case is collecting sensor-based data
    on farm equipment health and minimizing its downtime by predicting when and where
    equipment failure occurs and making alternative arrangements.


    *   **Security event monitoring** includes real-time monitoring of log data, host
    systems, and security devices to flag incidents (e.g., send alerts) such as failed
    logins, malware activity, and other suspicious activities.


    *   **Real-time trends** are a feature in Twitter and Google Trends.


    *   **Automated annotation**. Real-time annotation of objects in a live video
    feed is a relevant use-case. The same is applicable for a stream of images or
    speech data.


    In the next section, you learn about the various Windowing techniques for analyzing
    streaming data.


    ## Windowing Techniques


    A window can be defined as a snapshot of data—either observation-count-based or
    time-based [[3](#499734_1_En_1_Chapter.xhtml#Par104)]. This is a very useful technique
    in a streaming data context since at no point in time do you have the “entire
    data” available. A window can effectively handle *concept drift* because more
    importance is given to recent data points; the older data points are periodically
    discarded. A batch learning method can be converted to an incremental method by
    using a *windowing technique* [[5](#499734_1_En_1_Chapter.xhtml#Par106)]. The
    types of windowing techniques include the sliding window model, the damped window
    model, and the landmark window model [[6](#499734_1_En_1_Chapter.xhtml#Par107)].
    The following explains each of these windowing techniques.


    *   *Landmark window model* . Older data points are not discarded. All data points
    are accumulated in the window. Figure [1-2](#499734_1_En_1_Chapter.xhtml#Fig2)
    depicts this model. The rectangle represents the window, and the blue circles
    are the data.


    *   *Sliding window model* . This is a popular way to discard older data points
    and consider only the recent data points for analysis. Figure [1-3](#499734_1_En_1_Chapter.xhtml#Fig3)
    depicts this model.


    *   *Damped window model* . The data points are weighted. Higher weight is given
    to recent data points. An *exponential fading strategy* is used to discard old
    data. An aging function *g*(*t*) is used.


    ![$$ g(t)=1/{2}^{\uplambda \left({t}_x-{t}_o\right)} $$](images/499734_1_En_1_Chapter/499734_1_En_1_Chapter_TeX_Equa.png)


    λ is the fading factor, *t*[*x*] is the current timestamp, and *t*[*o*] is the
    origin timestamp (i.e., the time that the window was created). You can influence
    discarding older data points by changing the value of λ [[7](#499734_1_En_1_Chapter.xhtml#Par108)].
    A higher λ value means less weight is given to older data points. Figure [1-4](#499734_1_En_1_Chapter.xhtml#Fig4)
    shows the exponential fading of data points in a damped window model over time.


    ![../images/499734_1_En_1_Chapter/499734_1_En_1_Fig4_HTML.jpg](images/499734_1_En_1_Chapter/499734_1_En_1_Fig4_HTML.jpg)


    Figure 1-4


    Exponential fading of data points in a damped window model


    ![../images/499734_1_En_1_Chapter/499734_1_En_1_Fig3_HTML.jpg](images/499734_1_En_1_Chapter/499734_1_En_1_Fig3_HTML.jpg)


    Figure 1-3


    Sliding window model


    ![../images/499734_1_En_1_Chapter/499734_1_En_1_Fig2_HTML.jpg](images/499734_1_En_1_Chapter/499734_1_En_1_Fig2_HTML.jpg)


    Figure 1-2


    Landmark window model


    Figure [1-2](#499734_1_En_1_Chapter.xhtml#Fig2) shows that a landmark window accumulates
    data points with over time. The window size increases as more data points arrive.
    This windowing technique requires large memory resources, especially when dealing
    with large data streams.


    In a sliding window model, as shown in Figure [1-3](#499734_1_En_1_Chapter.xhtml#Fig3),
    “time” is the x axis, and the observations (i.e., the blue dots) arrive sequentially
    from left to right. The leftmost observation is the oldest data, and the most
    recent observations are on the right.


    Figure [1-3](#499734_1_En_1_Chapter.xhtml#Fig3) shows that the older points are
    continuously discarded; only the recent points are considered in the window. Figure
    [1-3](#499734_1_En_1_Chapter.xhtml#Fig3) also shows a window of size = 8 (i.e.,
    it contains eight data points in an instant of time). The window moves in step
    = 1 (i.e., the window slides in step 1, where the oldest data is discarded).


    Also in Figure [1-3](#499734_1_En_1_Chapter.xhtml#Fig3), window W[1] at time t[1]
    contains eight data points. When a new data point arrives at time t[2], the oldest
    data point in W1 is discarded to form window W[2] with eight data points, including
    the most recent one. The sliding windows model only considers recent data points;
    it discards the older ones.


    A sliding window is implemented in Python 3, as shown in Listing [1-1](#499734_1_En_1_Chapter.xhtml#PC1).
    It creates a window of size = 4 and shifts in steps of 1\. The input array (`y`)
    consists of ten integers from 0 to 9\. The sliding window implementation output
    is shown in Listing [1-2](#499734_1_En_1_Chapter.xhtml#PC2). The sliding windows
    at the end have `None`, which indicates an empty value, as no new data point is
    arriving, but the window size is fixed to 4.


    ```

    ###############################################################

    [0, 1, 2, 3]

    [1, 2, 3, 4]

    [2, 3, 4, 5]

    [3, 4, 5, 6]

    [4, 5, 6, 7]

    [5, 6, 7, 8]

    [6, 7, 8, 9]

    [7, 8, 9, None]

    [8, 9, None, None]

    [9, None, None, None]

    ###############################################################

    Listing 1-2

    Sliding Window Function Output

    ```


    ```

    ###############################################################

    # Import the relevant libraries

    import itertools

    from itertools import tee

    from itertools import zip_longest as zip

    def window(iterations, size):

    n = tee(iterations, size)

    for i in range(1, size):

    for each in n[i:]:

    next(each, None)

    return zip(*n)

    y=range(10)

    for each in window(y, 4):

    print(list(each))

    ###############################################################

    Listing 1-1

    Sliding Window Implementation

    ```


    Unlike the sliding windowing technique, the damped window model gives recent data
    points a higher weight. The older data points are discarded using an exponential
    fading strategy, as shown in Figure [1-4](#499734_1_En_1_Chapter.xhtml#Fig4).
    The relatively older data points are discarded faster than the newer data points.
    This way, the window stores both older and newer data points. However, the sliding
    window technique is much more popular in a streaming data context. It is the primary
    windowing technique in this book.


    In the next section, you learn about incremental learning and online learning
    algorithms.'
  trans: '

    ## 流式数据的应用


    在大数据时代，利用流式数据进行实时分析将带来颠覆性变革。实时分析的核心要义是快速获得优质解决方案。以下是流式数据实时分析的一些应用场景或用例。


    *   **实时或近实时欺诈检测**。以亚马逊为例，其网站每日交易量约达十亿笔，但并非所有交易都是真实的。


    *   **实时推荐**能够激发用户的冲动消费，这对电商企业而言至关重要。


    *   **实时天气监测**可用于灾害预警系统。


    *   **实时网络管理**涉及对网络硬件和软件的监控与配置，以确保其平稳运行。用例包括实时故障检测、实时监控链路带宽使用率、提升网络资源利用率等。


    *   **实时运营管理**包括供应链决策，例如何时补充燃料或重新订货。


    *   **基于股票行情数据的算法交易**。实时监控股票趋势有助于做出交易相关决策。


    *   **实时体育分析**。相关用例包括利用视频流和传感器数据等流式数据源进行球员运动轨迹追踪和表现分析。


    *   **精准农业**。一个简单的用例是收集基于传感器的农机设备健康数据，通过预测设备故障发生的时间和地点并做出替代安排，来最大限度地减少停机时间。


    *   **安全事件监控**包括实时监控日志数据、主机系统及安全设备，以标记（例如发送警报）登录失败、恶意软件活动及其他可疑行为等事件。


    *   **实时趋势**是 Twitter 和 Google Trends 中的一项功能。


    *   **自动标注**。对实时视频流中的对象进行实时标注是一个相关用例。该技术同样适用于图像流或语音数据流。


    下一节，您将了解用于分析流式数据的各种窗口技术。


    ## 窗口技术


    窗口可以定义为数据的快照——可以是基于观测计数或基于时间的快照[3]。这在流式数据上下文中是一项非常有用的技术，因为在任何时间点你都无法获得“完整数据”。窗口可以有效地处理*概念漂移*，因为它更重视最近的数据点；较旧的数据点会被定期丢弃。通过使用*窗口技术*，可以将批处理方法转换为增量方法[5]。窗口技术的类型包括滑动窗口模型、衰减窗口模型和地标窗口模型[6]。以下是对每种窗口技术的解释。


    *   *地标窗口模型*。不会丢弃较旧的数据点。所有数据点都累积在窗口中。图 1-2 描绘了此模型。矩形代表窗口，蓝色圆圈代表数据。


    *   *滑动窗口模型*。这是一种流行的丢弃较旧数据点、仅考虑最近数据点进行分析的方法。图 1-3 描绘了此模型。


    *   *衰减窗口模型*。数据点被赋予权重。较新的数据点被赋予更高的权重。使用*指数衰减策略*来丢弃旧数据。使用一个老化函数 *g*(*t*)。


    ![$$ g(t)=1/{2}^{\uplambda \left({t}_x-{t}_o\right)} $$](img/499734_1_En_1_Chapter_TeX_Equa.png)


    λ 是衰减因子，*t*[*x*] 是当前时间戳，*t*[*o*] 是起始时间戳（即窗口创建的时间）。你可以通过改变 λ 的值来影响丢弃较旧数据点的策略[7]。λ
    值越高，意味着赋予较旧数据点的权重越低。图 1-4 显示了衰减窗口模型中数据点随时间呈指数衰减的情况。


    ![../images/499734_1_En_1_Chapter/499734_1_En_1_Fig4_HTML.jpg](img/499734_1_En_1_Fig4_HTML.jpg)


    图 1-4

    衰减窗口模型中数据点的指数衰减


    ![../images/499734_1_En_1_Chapter/499734_1_En_1_Fig3_HTML.jpg](img/499734_1_En_1_Fig3_HTML.jpg)


    图 1-3

    滑动窗口模型


    ![../images/499734_1_En_1_Chapter/499734_1_En_1_Fig2_HTML.jpg](img/499734_1_En_1_Fig2_HTML.jpg)


    图 1-2

    地标窗口模型


    图 1-2 显示地标窗口会随时间累积数据点。随着更多数据点的到达，窗口大小会增加。这种窗口技术需要大量的内存资源，尤其是在处理大型数据流时。


    在滑动窗口模型中，如图 1-3 所示，“时间”是 x 轴，观测值（即蓝点）从左到右依次到达。最左边的观测值是最旧的数据，最新的观测值在右侧。


    图 1-3 显示较旧的点被持续丢弃；窗口中只考虑最近的点。图 1-3 还显示了一个大小为 8 的窗口（即它在某个时间点包含八个数据点）。窗口以步长 = 1
    移动（即窗口以步长 1 滑动，丢弃最旧的数据）。


    同样在图 1-3 中，时间 t[1] 处的窗口 W[1] 包含八个数据点。当新数据点在时间 t[2] 到达时，W1 中最旧的数据点被丢弃，形成包含八个数据点（包括最新数据点）的窗口
    W[2]。滑动窗口模型只考虑最近的数据点；它丢弃较旧的数据点。


    滑动窗口在 Python 3 中实现，如代码清单 1-1 所示。它创建一个大小为 4 的窗口，并以步长 1 移动。输入数组 (`y`) 包含从 0 到 9
    的十个整数。滑动窗口实现的输出如代码清单 1-2 所示。末尾的滑动窗口包含 `None`，表示空值，因为没有新数据点到达，但窗口大小固定为 4。


    ```

    ###############################################################

    [0, 1, 2, 3]

    [1, 2, 3, 4]

    [2, 3, 4, 5]

    [3, 4, 5, 6]

    [4, 5, 6, 7]

    [5, 6, 7, 8]

    [6, 7, 8, 9]

    [7, 8, 9, None]

    [8, 9, None, None]

    [9, None, None, None]

    ###############################################################

    代码清单 1-2

    滑动窗口函数输出

    ```


    ```

    ###############################################################

    # 导入相关库

    import itertools

    from itertools import tee

    from itertools import zip_longest as zip

    def window(iterations, size):

    n = tee(iterations, size)

    for i in range(1, size):

    for each in n[i:]:

    next(each, None)

    return zip(*n)

    y=range(10)

    for each in window(y, 4):

    print(list(each))

    ###############################################################

    代码清单 1-1

    滑动窗口实现

    ```


    与滑动窗口技术不同，衰减窗口模型赋予较新的数据点更高的权重。较旧的数据点使用指数衰减策略丢弃，如图 1-4 所示。相对较旧的数据点比较新的数据点被丢弃得更快。这样，窗口同时存储了较旧和较新的数据点。然而，在流式数据上下文中，滑动窗口技术更为流行。它是本书中主要的窗口技术。


    下一节，您将了解增量学习和在线学习算法。

