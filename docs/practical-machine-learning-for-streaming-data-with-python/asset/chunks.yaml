- fmt: '# Adaptive Windowing Method for Concept Drift Detection


    In the adaptive windowing method for concept drift detection (`ADWIN`), a sliding
    window of dynamic size is used; that is, the window’s size is not fixed, but it
    is computed online based on the rate of change observed from the data in the window
    [[4](#499734_1_En_2_Chapter.xhtml#Par31)]. I already discussed the idea of sliding
    windows in Chapter [1](#499734_1_En_1_Chapter.xhtml), where a window is maintained
    with the most recent data points in a data stream, and the older data points are
    continuously discarded. The data points within the window get the data stream’s
    updated statistics, detect concept drift, and update the model.


    It is generally recommended to use windows with a variable size. The idea is to
    keep data points or observations for as long as possible since the change time
    scale is unknown to the users [[4](#499734_1_En_2_Chapter.xhtml#Par31)]. The `ADWIN`
    algorithm increases the window size if it doesn’t see any change in the data stream,
    and reduces the window size when a change is detected in the data stream. The
    idea is to track the mean of the data points in window `W`. The null hypothesis
    is that there is no change in the mean value inside window `W`. The older data
    points in the window are dropped when there is enough evidence that the mean value
    of the new data points differs from that of the rest of the window [[5](#499734_1_En_2_Chapter.xhtml#Par32)].


    To dive further into the implementation of the `ADWIN` algorithm, a statistical
    test is performed to check if the mean value in two windows (`W[1]` and `W[2]`)
    differs by more than a threshold. `W[1]` and `W[2]` are the subwindows of the
    main window, `W`. If the subwindows’ means are significantly different, the older
    data points of window `W` are dropped. However, if the mean of subwindows are
    not significantly different, it is assumed that there is no change in the distribution
    of the data stream [[4](#499734_1_En_2_Chapter.xhtml#Par31)].


    Listing [2-1](#499734_1_En_2_Chapter.xhtml#PC1) illustrates concept drift detection
    using `ADWIN` on a simulated data stream. The `drift_detection` module is used
    in the `scikit-multiflow` framework. Listing [2-1](#499734_1_En_2_Chapter.xhtml#PC1)
    simulates a data stream of size 1000 from a standard normal distribution and then
    changes the data concept from index 599 onward (i.e., replaces values with integers
    between 5 and 8), as shown in Figure [2-1](#499734_1_En_2_Chapter.xhtml#Fig1).
    It then calls the `ADWIN()` object and uses the `detected_change()` function to
    identify concept drift in the data stream. The final output is shown in Listing
    [2-2](#499734_1_En_2_Chapter.xhtml#PC2).


