- fmt: "# Drift Detection Using the Page-Hinkley Method\n\nThe drift detection method\
    \ based on the Page-Hinkley (PH) test [[12](#499734_1_En_2_Chapter.xhtml#Par39)]\
    \ is a sequential analysis method that detects the sudden change in the mean of\
    \ a Gaussian signal [[13](#499734_1_En_2_Chapter.xhtml#Par40)]. This method tracks\
    \ the cumulated difference between the observed values and their mean up to the\
    \ current moment [[14](#499734_1_En_2_Chapter.xhtml#Par41)]. Generally, this method\
    \ sends an alarm for concept drift when the observed mean at some instant is greater\
    \ than a given threshold `λ`. The value of `λ` is determined by the admissible\
    \ false alarm rate. If you increase the value of `λ`, you may be able to reduce\
    \ the false alarms, but you miss some instances of changes in the data distribution.\n\
    \nListing [2-9](#499734_1_En_2_Chapter.xhtml#PC9) illustrates concept drift detection\
    \ using the Page-Hinkley method. It simulates a data stream of size 1000 from\
    \ a normal distribution and then changes the data concept from index 299 to 799\
    \ (i.e., replace values with integers between 5 and 8), as shown in Figure [2-2](#499734_1_En_2_Chapter.xhtml#Fig2).\
    \ However, unlike some of the methods discussed earlier, the Page-Hinkley method\
    \ doesn’t output warning zones. It only shows the instance of concept drift, as\
    \ shown in Listing [2-10](#499734_1_En_2_Chapter.xhtml#PC10).\n\n![../images/499734_1_En_2_Chapter/499734_1_En_2_Fig2_HTML.jpg](images/499734_1_En_2_Chapter/499734_1_En_2_Fig2_HTML.jpg)\n\
    \n**Figure 2-2** The data stream with changed concept from index 299 to 799\n\n\
    ```\n###############################################################\n### Output:\n\
    Concept drift detected in data: 5.0 - at index: 306\n###############################################################\n\
    Listing 2-10\nOutput for Concept Drift Detected Using the Page-Hinkley Method\n\
    ```\n\n```\n###############################################################\n\
    # Import the relevant libraries\nimport numpy as np\nfrom skmultiflow.drift_detection\
