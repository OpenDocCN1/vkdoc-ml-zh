    can’t handle concept drift and require multiple passes over the dataset. It is
    not suitable for analysis in a streaming data context.


    An *adaptive random forest* (ARF) is an adaptation of the random forest technique
    in a streaming data context [[13](#499734_1_En_3_Chapter.xhtml#Par83)]. The ARF
