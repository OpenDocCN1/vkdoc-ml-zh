  raw: '### Hoeffding Tree Classifier


    One of the challenges of streaming data is the memory requirements; it is impossible
    to store all the data. In a batch setting, a decision tree reuses instances or
    observations to compute the best split attributes. Thus, using decision tree methods
    such as CART and CHAID, which are generally used in batch data, aren’t effective
    in a streaming data context. To solve this issue, Domingos and Hulten [[2](#499734_1_En_3_Chapter.xhtml#Par72)]
    proposed the Hoeffding tree, which is an incremental decision tree learner that
    uses new instances to build a tree, making it more suitable to a streaming data
    context. The Hoeffding tree is also known as the Very Fast Decision Tree (VFDT)
    algorithm.


    The Hoeffding tree converges to a tree built by a batch learner with sufficiently
    large data. Thus, the Hoeffding tree uses the idea that a small sample is often
    enough for choosing an optimal splitting attribute [[3](#499734_1_En_3_Chapter.xhtml#Par73)].
    This idea is supported by the statistical result known as the *Hoeffding bound*
    . The Hoeffding bound states (with a probability of 1–£) that after n independent
    observations of a real valued random variable, x, with range *R*, the true mean
    of x is at least μ − € where μ is the observed mean of the random variable x and
    ![$$ \mathit{\text{\EUR}}=\sqrt{\left(R\hat{\mkern6mu} 2\ \ln \right(1/}\hbox{\pounds}\left)/2\mathrm{n}\right)
    $$](images/499734_1_En_3_Chapter/499734_1_En_3_Chapter_TeX_IEq1.png) [[4](#499734_1_En_3_Chapter.xhtml#Par74)].


    The VFDT method is an implementation of Hoeffding trees. VFDT is a decision tree
    that uses the Hoeffding bound and accumulates sufficient statistics of new incoming
    observations in a data stream while converting a tree leaf to a tree node. However,
    streaming data can be very noisy, which affects the performance of VFDT (in terms
    of prediction accuracy). Also, with noisy incoming streaming data, VFDT faces
    tree-size explosion [[5](#499734_1_En_3_Chapter.xhtml#Par75)]. There are documented
    techniques to address these VFDT issues.


    Listing [3-1](#499734_1_En_3_Chapter.xhtml#PC1) creates a synthetic dataset using
    the hyperplane generator discussed in Chapter [1](#499734_1_En_1_Chapter.xhtml).
