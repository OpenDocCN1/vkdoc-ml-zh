    ## Summary


    In this chapter, you learned about streaming data, the various challenges associated
    with it, real-world business applications, windowing techniques, and incremental
    and online learning algorithms. You were also introduced to the scikit-multiflow
    framework in Python.


    The next chapter discusses concept drift detection and anomaly detection algorithms
    and their implementation in various datasets using the scikit-multiflow framework.


    # 2. Concept Drift Detection in Data Streams


    In the last chapter, you were introduced to streaming data, its applications,
    windowing techniques, and incremental and online learning algorithms. You were
    also introduced to the scikit-multiflow framework in Python and the various streaming
    data generators. This chapter discusses algorithms for concept drift detection
    in a streaming data context. It explores relevant techniques and how to implement
    them using the scikit-multiflow framework in Python.


    Note


    This chapter applies some of the scikit-multiflow framework’s (version 0.5.3)
    drift detection module functions. Also, I refer to the scikit-multiflow framework’s
    API reference document for the codes provided in this chapter ([`https://scikit-multiflow.readthedocs.io/en/stable/api/api.html`](https://scikit-multiflow.readthedocs.io/en/stable/api/api.html)).


    ## Concept Drift


    Chapter [1](#499734_1_En_1_Chapter.xhtml) discussed streaming data’s various challenges.
    One of the major challenges is concept drift, in which the distribution of data
    streams may change over time. A particular pattern present in the past data may
    become a different kind of pattern in current data. So, any batch learner model
    trained on past data becomes outdated due to concept drift.


    In machine learning, *concept* refers to a variable or a quantity that a machine
    learning model is trying to predict. *Concept drift* refers to the phenomenon
    in which the target concept’s statistical properties change over time [[1](#499734_1_En_2_Chapter.xhtml#Par28)].


    The changes in data streams or concept drift patterns can be either gradual or
    abrupt [[2](#499734_1_En_2_Chapter.xhtml#Par29)]. Abrupt changes in data streams,
    or abrupt concept drift, mean the sudden change in the characteristics of the
    data, such as a change in mean, change in variance, and so forth. It is important
    to detect these changes because they have many practical applications in quality
    control, systems monitoring, fault detection, and more. However, gradual changes
    in data streams or gradual concept drift are referred to as the *change in the
    data distribution* over a much longer time than that of the abrupt changes. Gradual
    changes are relatively more difficult to identify.


    The other types of data streams or concept drift changes are *incremental concept
    drift* and *recurring concept drift* [[3](#499734_1_En_2_Chapter.xhtml#Par30)].
    In incremental concept drift, the older patterns in data streams incrementally
    change to newer patterns over time; however, the time taken is much shorter than
    that of the gradual concept drift. In recurring concept drift, you see specific
    characteristics of older data streams reoccurring after a time.


    There are various types of concept drift detection algorithms. This chapter focuses
    on concept drift detection algorithms such as (a) the *adaptive windowing method*
    for concept drift detection (ADWIN), (b) the Drift Detection Method (DDM), (c)
    the Early Drift Detection Method (EDDM), (d) Drift Detection Method based on Hoeffding’s
    bound with moving average-test (HDDM_A), (e) Drift Detection Method based on Hoeffding’s
    bound with moving weighted average-test (HDDM_W), and (f) drift detection using
    the Page-Hinkley method.'
