    引言


    技术的进步使得持续收集数据成为可能。我们在各种日常交易（例如，沃尔玛、塔吉特等零售店的 POS 交易）、传感器数据、网络数据、社交媒体数据、股票价格、搜索查询、点击流数据等中都被数据淹没。这些都是高速数据的来源；即，流数据。


    本书是一本面向初学者的快速入门指南，旨在帮助读者学习、理解并使用 Python 在流数据上实现各种机器学习模型，以生成实时洞察。流数据被定义为高速、无限且持续的数据流入。我们处理的大多数机器学习模型都是批处理模式。然而，批处理学习模型不适合处理流数据，因为无法对数据进行多次遍历。由于*概念漂移*（即数据分布随时间变化），批处理模型可能很快过时。流数据的其他挑战包括内存限制和数据积累的高速性，这导致了另一类方法的发展，即*增量学习*或*在线学习方法*。


    多年来，业界对各种在线学习/增量学习方法的采用一直相当缓慢，但由于实时机器学习的广泛应用，情况正在迅速改变。因此，这些技术应该成为数据科学家技能库的一部分！


    本书适合数据科学家、机器学习工程师、研究人员、软件工程师、学者以及具备 Python 基础编程技能并热衷于探索流数据机器学习以用于职业发展或企业/学术项目的数据科学爱好者。


    本书侧重于端到端的加速路径，深入探讨一种整体方法，以开发概念漂移检测算法、监督学习算法（用于回归和分类任务）以及用 Python 实现的无监督学习算法。总体而言，本书包含四个章节。


    第 1 章介绍了流数据的概念、其各种挑战、一些现实世界的商业应用以及各种窗口技术。本章还介绍了增量学习和在线学习算法的概念以及 Python 中的 scikit-multiflow
    框架。


    第 2 章涵盖了各种变化检测/概念漂移检测算法，以及如何使用 scikit-multiflow 在各种数据集上实现这些算法。


    第 3 章讨论了流数据的各种回归和分类算法（包括集成学习）及其在各种数据集上的实现。


    最后，第 4 章介绍了流数据的无监督学习。它还简要概述了其他用于处理流数据的开源工具，例如 Spark Streaming、大规模在线分析（MOA）等。


    致谢


    我要感谢所有为本书出版做出贡献的人，感谢他们的帮助、支持和意见。我衷心感谢我的母亲（米莉·普塔通达夫人）和我的父亲（苏普里亚·普塔通达先生）在我生活的各个方面给予我终生的爱、支持和鼓励。特别感谢我的妻子（斯里贾尼·普塔通达夫人）的支持和鼓励。我感谢我的论文导师，阿纳布·库马尔·拉哈教授，感谢他在我在印度管理学院艾哈迈德巴德分校攻读博士期间向我介绍这个精彩的研究课题（即流数据分析），并感谢他与我进行无数次引人入胜且耐心的交谈。


    我还要感谢并赞赏本书编辑，Apress/Springer 的塞莱斯廷·约翰、詹姆斯·马克汉姆和什里坎特·维什瓦卡玛的努力，感谢他们给予的重要鼓励。


    > 萨扬·普塔通达博士


    > 印度加尔各答


    > 2021 年 1 月


    关于作者 关于技术审稿人


    # 1. 流数据简介


    本章将向你介绍流数据、其各种挑战、一些现实世界的商业应用、各种窗口技术，以及增量学习和在线学习算法的概念。本章还将介绍 Python 中的 scikit-multiflow
    框架和一些流数据生成器。


    请注意，Python 中还有其他一些可用于流数据机器学习的框架。本书使用 scikit-multiflow 框架，因为我坚信这个包（鉴于其广泛实现的技术和出色的文档）是
    Python 用户学习流数据在线/增量机器学习技术的一个良好起点。'
- fmt: '# Streaming Data


    The world has witnessed a data deluge in recent years. There has been a huge increase
    in the volume of data generated from various sources. The major data sources are
    the Internet, log data, sensor data, emails, RFID, POS transaction data, and so
    forth. The data gathered from these sources can be categorized into structured,
    semi-structured, and unstructured data. Recent technological advances are a major
    reason for this “data explosion,” making data storage cheaper and a continuous
    collection of data possible. Almost all companies in sectors such as retail, social
    media, and IT are facing a data explosion. They are trying to figure out ways
    to process and analyze the massive data that they are generating and gain actionable
    insights.


    ## Big Data


    Most of us have heard of the term *big data*. The McKinsey Global Institute define
    big data as “datasets whose size is beyond the ability of typical database software
    tools to capture, store, manage, and analyze” [[1](#499734_1_En_1_Chapter.xhtml#Par102)].
    Big data’s basic characteristics can be defined with four words that begin with
    the letter V: volume, velocity, variety, and veracity. The “big” in big data is
    not only about the size or volume of the data—the other “V”s also need to be considered.


    Advancements in technology have made the continuous collection of data possible.
    We are inundated with data in various daily transactions (e.g., POS transactions
    in retail outlets like Walmart, Target, etc.), sensor data, web data, social media
    data, stock prices, search queries, clickstream data, and so forth. This is all
    a source for high-velocity data; that is, streaming data. Other sources of continuous
    data streams include operational monitoring, online advertising, mobile data,
    and the Internet of Things (IoT).


    Streaming data, or data streams, are an infinite and continuous flow of data from
    a source that arrives at a very high speed. Thus, streaming data is a subset of
    big data that addresses the *velocity* aspect of big data. Some of the differentiating
    characteristics between streaming data and static data are the loosely structured,
    always on, and always flowing of data [[2](#499734_1_En_1_Chapter.xhtml#Par103)].
    Unlike static data, structure is not rigidly defined in streaming data. It is
    “always on;” that is, data is always available because new data is continuously
    generated.


    As an example of how streaming data is harnessed in business, let’s look at online
    advertising. Social media giants like Facebook collect user behavior data in real
    time. Facebook has more than two billion active users every month [[4](#499734_1_En_1_Chapter.xhtml#Par105)],
    which gives you an idea of the scale of the data being collected.


    Facebook earns most of its revenue by showing ads to its users. Many advertisers
    are onboarded in the platform. Facebook uses user behavior data to select ads
    that are relevant to its users (i.e., ads that have the maximum chance of interaction
    in the form of clicks or purchase). They perform other important steps in online
    advertising (such as placing a “bid” in an “auction”). All of this happens in
    near real time (i.e., whenever you load your News Feed page in Facebook or interact
    with other apps, such as Messenger or Instagram).


    ### The Need to Process and Analyze Streaming Data


    Streaming data offers real time or near real-time analytics. Since it’s ever-producing
    and never-ending, storing this enormous data and then running analytics on it
    (as done in batch processing) is not feasible. Streaming data must be analyzed
    “on the fly” to gain insights in real time or near real time.


    Figure [1-1](#499734_1_En_1_Chapter.xhtml#Fig1) shows the streaming data analytics
    process flow. High-velocity data from various sources (sensor data, stock-tick
    data, etc.) are ingested, processed, and analyzed by a streaming data analytics
    engine in real time or near real time. The output generated is displayed via dashboards,
    apps, or any other means.


    ![../images/499734_1_En_1_Chapter/499734_1_En_1_Fig1_HTML.jpg](images/499734_1_En_1_Chapter/499734_1_En_1_Fig1_HTML.jpg)


    Figure 1-1


    Streaming data analytics process flow


    Streaming data analytics and insights empower an organization’s decision-makers
    to make value-added decisions in real time. That is why many researchers in academia
    and industry are working on new methods for real-time analytics. Conventional
    machine learning algorithms do not work because streaming data provides a new
    set of challenges.


    The next section discusses the challenges of handling streaming data.


    ## The Challenges of Streaming Data


    The following are some of the major challenges of handling streaming data.


    * Multiple passes on data are no longer possible. Data needs to be processed in
    one pass.

    * Data streams may evolve over time, which is a behavior called *concept drift*.
    Mining algorithms for streaming data need to address this issue so that the model
    does quickly become outdated.

    * The high speed needed to stream data.

    * Higher memory requirements.


    New methodologies are needed for the machine learning and data mining algorithms
    used with streaming data. The batch processing algorithms for static data don’t
    work. Let’s look at a simple linear regression method. In batch processing, entire
    training datasets are available. Linear regression is applied to the whole dataset
    using OLS (ordinary least squares) to get beta coefficients to find the relation
    between the dependent and the independent variable (i.e., beta coefficients signify
    the amount of change in the dependent variable (`y`) on an average for a unit
    change in the independent variable (`x`)).


    In streaming data, however, this is not feasible. You never have access to all
    the data because it is continuously flowing in. Here you need online learning
    or incremental learning algorithms, which take each example or tuple of data as
    it comes and updates the parameters (in this case, the beta coefficients). One
    such implementation is linear regression with SGD (stochastic gradient descent).
    A deeper look at online learning/incremental learning techniques is provided in
    the upcoming chapters.


    Importantly, unlike typical big data analysis, streaming data doesn’t require
    more storage because older data is discarded after a while. Smarter and faster
    algorithms are needed to process and analyze the incoming fast-streaming data.
    Algorithms should be capable of generating output anytime it’s queried.


    You should now understand why machine learning with streaming data is different
    from that of batch data. The next section discusses some of the real-world applications
    of streaming data.'
