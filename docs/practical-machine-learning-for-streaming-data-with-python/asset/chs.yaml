  scikit-learn 提供了小批量 k-means 聚类的一种替代方法，称为 *Birch 聚类* [7]。这是一种在线学习算法，它创建一种树形数据结构，簇质心可从叶子节点读取。建议您将此技术作为练习进行探索。有关
  scikit-learn 中 Birch 聚类的更多信息，请阅读官方文档：[`https://scikit-learn.org/stable/modules/generated/sklearn.cluster.Birch.html`](https://scikit-learn.org/stable/modules/generated/sklearn.cluster.Birch.html)。


  Apache Spark 的机器学习库 MLlib 中提供了*流式 k-means 聚类算法*。该算法能够动态估计簇，并在新数据到达时更新簇。该算法包含一个名为*半衰期*的参数，用于控制估计值的“衰减”。衰减因子决定了需要赋予历史数据多少权重。流式
  k-means 聚类算法使用了小批量 k-means 更新规则的泛化形式。


  本书不涉及其他增量聚类算法。


  一些最早的流式数据在线聚类算法已在 MOA 软件中实现。一种经过充分研究的数据流聚类方法是微聚类算法，它包含两个阶段。第一阶段是在线阶段，将数据流总结为局部模型（微簇）。第二阶段则根据这些微簇生成全局聚类模型。CluStream
  和 DenStream 是 MOA 中可用的两种基于微簇的在线聚类算法。


  接下来将讨论 Apache Spark、MOA 以及其他一些数据流挖掘工具。




  ### 异常检测


  *异常检测*（或*离群点检测*）是一门识别与常态相异的事件或样本的科学 [4]（这些样本被称为*异常值*）。机器学习文献中充满了异常检测技术，尤其是在批量学习场景下。这些异常值的一些独特特征包括：它们在数据集中很少出现，并且其特征与正常样本不同。异常检测的一些实际应用包括入侵检测、欺诈检测、监控分析、医疗应用以及数据泄露防护。


  本章重点介绍用于流数据上下文中的异常检测的*流式半空间树*（SHST）技术。SHST 算法是一种用于流数据的增量式单类异常检测器 [5]。该算法最有用的特性之一是，它仅使用真实或正常的实例进行训练，即使在异常值极其罕见的情况下也能表现良好。该方法是一个由半空间树组成的随机集成。深度为
  d 的半空间树（HS-tree）被定义为一棵具有 2^(d+1) − 1 个节点的满二叉树，其中所有叶子节点都位于同一深度（即 d）。


  流式半空间树可以仅从数据空间的维度创建树结构，并且不需要实际的训练样本。因此，该方法无需执行任何模型重构来适应流数据。该模型可以在流数据到达之前部署。此外，SHST
  算法具有恒定的内存需求和恒定的均摊时间复杂度。


  清单 4-2 使用 scikit-multiflow 框架中提供的 `AnomalySineGenerator` 生成了一个包含异常值的数据流。它生成了一个包含
  500 个观测值的数据流，其中 100 个是异常值。生成的数据流快照如图 4-2 所示。最右侧的列指示一个样本是否为异常值（即，如果为 1，则为异常值；如果为
  0，则为正常值）。然后，它使用 scikit-multiflow 框架中提供的 `HalfSpaceTrees()` 方法，将 SHST 算法应用于此数据流。它训练模型并执行预测，如清单
  4-2 所示。


  ![../images/499734_1_En_4_Chapter/499734_1_En_4_Fig2_HTML.jpg](img/499734_1_En_4_Fig2_HTML.jpg)


  图 4-2

  包含异常值的数据流快照


  ```

  ###############################################################

  # 导入相关库

  import pandas as pd

  from skmultiflow.anomaly_detection import HalfSpaceTrees

  from skmultiflow.data import AnomalySineGenerator

  # 生成包含异常值的数据流

  dstream = AnomalySineGenerator(n_samples=500, n_anomalies=100, random_state=333)

  # 实例化半空间树估计器

  HS_trees = HalfSpaceTrees(random_state=333)

  # 准备数据流

  dstream.prepare_for_use()

  X, Y = dstream.next_sample(500)

  data = pd.DataFrame(np.hstack((X, np.array([Y]).T)))

  data.head()

  # 增量拟合模型

  HS_trees_model= HS_trees.partial_fit(X, Y)

  # 预测传入观测值的类别

  pred = HS_trees_model.predict(X)

  # 估计样本为异常值或真实值的概率

  prob = HS_trees_model.predict_proba(X)

  ###############################################################

