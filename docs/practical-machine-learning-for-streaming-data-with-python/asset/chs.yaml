  至此，我们已经涵盖了流数据上下文中大多数重要的监督学习算法。下一节将简要介绍一些数据流预处理方法。


  ## 数据流预处理


  到目前为止，本章涵盖了数据流上回归和分类问题的算法。所有实验都使用了干净的数据集（即不需要进行数据预处理）。然而，在现实世界中，你无法期望得到干净的数据流，因此需要进行一些基本的数据流预处理。以下是
  scikit-multiflow 框架中提供的一些可应用于数据流的数据预处理方法。


  *   **缺失值清理器**：`MissingValueCleaner()` 方法可以使用诸如用零、均值、中位数或众数替换缺失值等策略来清理数据流中的缺失值。


  *   **独热编码**：`OneHotToCategorical()` 方法对数据流中的分类变量执行独热编码。


  *   **窗口化最小-最大缩放器**：`WindowedMinmaxScaler(window_size=200)` 方法用于数据流的特征变换。每个特征都被缩放到一个给定的范围（0
  到 1 之间）。窗口大小由用户输入，用于计算最小值和最大值。


  *   **窗口化标准缩放器**：`WindowedStandardScaler(window_size=200)` 方法用于标准化特征。窗口大小由用户输入，用于计算均值和标准差。


  ## 总结


  本章涵盖了 scikit-multiflow 框架中用于数据流挖掘的大多数重要的在线监督学习技术。然而，你应该探索本章未讨论的两种方法：scikit-multiflow
  的贝叶斯模块中的朴素贝叶斯分类器，以及 scikit-multiflow 框架的神经网络模块中的感知机分类器。


  下一章将讨论一些用于流数据无监督学习的在线/增量学习算法。同时还将讨论其他一些可用于流数据分析的工具。


  '
- '# 4. 用于数据流挖掘的无监督学习及其他工具


  在第 3 章中，你学习了流数据上下文中用于回归和分类问题的监督机器学习技术。本章从流数据的无监督学习开始，然后概述其他一些可用于数据流挖掘的软件环境。


  ## 流数据的无监督学习


  在前面的章节中，你学习了用于流数据的概念漂移检测和监督机器学习的各种方法。现在，让我们通过首先关注聚类，然后转向异常检测来了解无监督学习。




  ### 聚类


  k-means 聚类是一种适用于批量数据的流行聚类算法。它将数据划分为 k 个互不重叠的独立簇。其目标是使*簇内变异* [1] 非常低。该算法会为每个观测值随机分配一个
  1 到 k 之间的数字，从而创建初始的簇集合。然后，为这 k 个簇分别计算簇质心。接着，根据观测值与簇质心的接近程度（即距离度量，如欧氏距离）重新分配观测值。这些步骤会重复进行。当簇的分配不再发生变化时，迭代停止。（请注意，k
  值由用户提供。）


  *小批量 k-means 聚类方法*是 k-means 聚类算法的一种增量学习版本，可直接应用于数据流。它是 k-means 算法的一个变体，处理的是数据的小批量样本，而非整个数据集。由于在任何时间点都无法获得完整数据集，因此它特别适用于流式数据。小批量是输入数据流的子集，每次训练迭代时都会从中随机采样。


  小批量 k-means 聚类算法会选择一个由随机采样样本组成的小批量。然后执行通用的 k-means 算法，为每个样本分配最近的质心。下一步，针对小批量中的每个样本更新已分配的质心。重复执行这些步骤，直到达到收敛或指定的迭代次数。


  此外，除了使用随机采样来选择初始簇中心集，还可以使用 k-means++ 算法 [3] 作为一种随机播种技术来选择初始簇中心的初始值，这能实现更快的收敛。


  小批量 k-means 聚类算法可在 scikit-learn (sklearn) 库中找到。更多信息请访问 [`https://scikit-learn.org/stable/modules/generated/sklearn.cluster.MiniBatchKMeans.html`](https://scikit-learn.org/stable/modules/generated/sklearn.cluster.MiniBatchKMeans.html)。


  代码清单 4-1 将小批量 k-means 聚类应用于鸢尾花数据集。该数据集在 sklearn 库中公开可用，包含四个特征：花萼长度（厘米）、花萼宽度（厘米）、花瓣长度（厘米）和花瓣宽度（厘米）。代码清单
  4-1 应用了 **MiniBatchKMeans()**，并将簇数量指定为 3，小批量大小指定为 50。该代码清单在鸢尾花数据集上训练了小批量 k-means
  聚类模型，并在图 4-1 中展示了簇中心。


  ![../images/499734_1_En_4_Chapter/499734_1_En_4_Fig1_HTML.jpg](img/499734_1_En_4_Fig1_HTML.jpg)


  图 4-1

  小批量 k-means 聚类模型的簇中心


  ```

  ###############################################################

  # 导入相关库

  from sklearn import datasets

  from sklearn.preprocessing import StandardScaler

  from sklearn.cluster import MiniBatchKMeans

  # 加载数据

  iris = datasets.load_iris()

  X = iris.data

  # 数据快照

  X[0:6,]

  # 输出

  #array([[5.1, 3.5, 1.4, 0.2],

