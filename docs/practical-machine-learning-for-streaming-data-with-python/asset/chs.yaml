  # 从索引 599 到 999 改变数据概念

  for j in range(599, 1000):

  stream[j] = np.random.randint(5, high=9)

  # 初始化 ADWIN 对象

  A = ADWIN(delta=0.002)

  # 将数据流元素添加到 ADWIN 并检查是否发生漂移

  for j in range(1000):

  A.add_element(stream[j])

  if A.detected_change():

  print(''在数据中检测到概念漂移：'' + str(stream[j]) + '' - 位于索引：'' + str(j))

