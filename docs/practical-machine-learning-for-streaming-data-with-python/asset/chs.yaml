  ### 在线提升（Online Boosting）


  另一种著名的集成学习技术是*提升法*。其基本原理是顺序组合一组“弱学习器”，以创建一个“强学习器”。AdaBoost 技术是最早用于批量数据的提升技术之一 [17]。（AdaBoost
  是*自适应提升*的缩写。）首先，使用加权样本在训练数据上准备一个弱分类器（即决策树），然后计算训练模型的误分类错误率。当前分类器误分类的样本在下一个分类器的训练数据集中会被赋予更高的权重。后续的学习器会更关注这些困难样本，这个过程一直持续到算法性能不再有显著提升为止。


  Wang 和 Pineau [18] 提出了*在线提升分类器*，这是 AdaBoost 算法的在线版本。在在线学习环境中，每个到达的样本会根据二项分布被训练 K
  次。由于数据流中样本数量巨大（趋于无穷），二项分布趋近于泊松(λ)分布，其中 λ 的值通过跟踪误分类和正确分类样本的权重来计算。在线提升算法使用 ADWIN 窗口技术来处理数据流中固有的概念漂移。


  可以使用 scikit-multiflow 框架中实现的 `OnlineBoostingClassifier()` 方法来应用在线 AdaBoost 算法。代码清单
  3-30 将在线提升分类器应用于代码清单 3-28 中使用的相同数据流。执行了预序评估，输出结果如代码清单 3-31 所示。获得的准确率为 58%。


