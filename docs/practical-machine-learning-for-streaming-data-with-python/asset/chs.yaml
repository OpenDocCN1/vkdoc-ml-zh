  现在，我们来谈谈被称为*杠杆装袋法*的在线装袋方法，该方法由 Bifet 等人提出 [16]。这里，通过增加重采样和使用输出检测码来增强装袋效果。在 Oza 装袋技术中，有放回抽样使用(λ
  = 1)的泊松分布。但在杠杆装袋法中，λ的值更大。例如，它不使用(λ = 1)的泊松分布，而是使用(λ = 6)的泊松分布。输出检测码有助于纠正错误。每个类别被分配一个长度为
  L 的二进制字符串，然后构建一个由 L 个二元分类器组成的集成。这能在多分类任务中带来更好的性能。此外，杠杆装袋算法使用 ADWIN 窗口技术来处理数据流中固有的概念漂移。


  在 scikit-multiflow 中，可以使用`LeveragingBaggingClassifier()`方法应用杠杆装袋分类技术。清单 3-28 重复了清单
