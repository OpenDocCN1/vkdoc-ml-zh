  ## 早期漂移检测方法


  早期漂移检测方法（EDDM）是对 DDM 方法的改进，尤其适用于检测数据流中缓慢、渐进的变化。在之前讨论的 DDM 方法中，其思路是跟踪学习算法中的错误数量，而在
  EDDM 中，则跟踪两次错误之间的平均距离 [7]。因此，EDDM 会存储两次错误之间的平均距离（p′[j]及其标准差σ′[j]），以及最大值 p′[max]和σ′[max]。与
  DDM 类似，根据特定阈值，系统会声明发生了概念漂移或进入警告区域。有关 EDDM 的详细回顾，请参阅 Baena-Garcia 等人的文献 [7]。


  使用 EDDM 进行概念漂移检测的实现方式与清单 2-3 相同。不过，你需要使用`EDDM()`方法，而不是`DDM()`方法。建议你更改数据流的分布，并观察输出结果。


  ## 使用 HDDM_A 和 HDDM_W 进行漂移检测


  基于移动平均检验的漂移检测方法（HDDM_A）以霍夫丁界 [10] 为基础。霍夫丁不等式不假设概率函数，它假设随机变量是独立且有界的 [8]。HDDM_A 执行一种*A
  检验*，在给定一系列随机变量的情况下，通过监测移动平均值之间的差异，可以检测总体均值的变化 [8]。HDDM_A 方法已在 scikit-multiflow 中实现，其实现基于
  MOA [9]。


