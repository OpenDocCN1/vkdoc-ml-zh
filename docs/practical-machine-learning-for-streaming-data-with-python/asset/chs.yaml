  与滑动窗口技术不同，衰减窗口模型赋予较新的数据点更高的权重。较旧的数据点使用指数衰减策略丢弃，如图 1-4 所示。相对较旧的数据点比较新的数据点被丢弃得更快。这样，窗口同时存储了较旧和较新的数据点。然而，在流式数据上下文中，滑动窗口技术更为流行。它是本书中主要的窗口技术。


  下一节，您将了解增量学习和在线学习算法。




  ## 增量学习与在线学习


  大多数标准机器学习技术（监督式或无监督式）都属于*批量学习*方法。也就是说，它们通常处理静态/批量数据集（即非流式数据集），其中所有数据都是可用的，并且可以对任何算法进行多次遍历。然而，当这些批量学习方法应用于流式数据时，由于概念漂移，它们会随着时间的推移而过时。在流式数据场景下，需要一种不同的机器学习算法来应对其挑战。这类算法被称为*增量学习*或*在线学习算法*。


  增量学习算法在资源有限的情况下运行，每当新的一批/小批量数据到达时，就会频繁更新模型参数。增量学习算法能够处理流式数据中固有的概念漂移。在线学习算法与增量学习算法的不同之处在于，每当有新观测数据到达时，模型参数就会更新。在在线学习算法中，你无需等待一小批数据到达后再更新模型参数。


  可以通过使用带有滑动窗口的批量学习器来近似实现增量学习算法 [5]。在这种情况下，每当新窗口（包含数据点）到达时，模型就会重新训练。你可以将任何批量学习器（例如线性回归或逻辑回归算法）与滑动窗口结合应用于数据流，以近似实现增量学习算法。


  让我们来看一下小批量梯度下降法和*随机梯度下降*（SGD）法。梯度下降法是一种非常流行的寻找函数最小值的技术，在此上下文中，该函数即为代价函数。以下内容解释了如何执行梯度下降算法。


  1.  用随机值初始化参数。

  2.  计算目标函数的梯度。

  3.  使用梯度更新参数。

  4.  每个特征的步长计算：步长 = 梯度 * 学习率。*学习率*是一个直接影响算法收敛性的超参数。学习率非常小会导致梯度下降算法收敛需要很长时间。学习率值非常高会使算法沿着斜率迈出大步，从而可能错过全局最小值。

  5.  计算新参数：新参数 = 旧参数 – 步长。

  6.  重复步骤 2-5，直到梯度接近零。


  梯度下降法是一种批量学习方法。在沿着梯度方向迈出一步之前，会考虑整个训练数据。在大型数据集中，单次参数更新需要很长时间。然而，小批量梯度下降算法是一种增量学习算法，其中每次处理一个小批量时都会更改参数。但
  SGD 算法总是针对每个训练观测值更新模型参数。SGD 技术是在线学习算法的一个例子。


  现在让我们来看一下线性回归方法，这是一种线性模型，通过使用*普通最小二乘法*（OLS）计算每个预测变量的 beta 系数，来理解目标变量（Y）与预测变量（X）之间的关系。


  你可以使用梯度下降优化技术来实现线性回归方法。线性回归是一种批量学习技术，其中梯度下降算法应用于整个训练集以更新模型参数。但是，你可以通过使用小批量梯度下降算法将此方法转换为增量学习器。


  清单 1-3 使用 Python 实现了带有小批量梯度下降算法的线性回归函数 [8]。然后将这些函数应用于模拟数据集。


  ```

  ###############################################################

  # 导入库

  import numpy as np

  import matplotlib.pyplot as plt

  import pandas as pd

  from pandas import read_csv

  np.random.seed(111)

  # 创建数据

  mean = np.array([6.0, 7.0])

  covariance = np.array([[1.0, 0.94], [0.95, 1.2]])

  df = np.random.multivariate_normal(mean, covariance, 500)

  df.shape

  # 输出- (10000, 2)

  df

  #输出-

  #array([[6.97833668, 8.30414776],

  #       [4.66509294, 5.31806407],

  #       [6.88804517, 7.71734893],

  #       ...,

  #       [5.75153443, 6.73145512],

  #       [4.93357924, 6.72570148],

  #       [7.31794626, 8.4076224 ]])

  X = df[:,:-1]

  Y = df[:,-1]

  # 添加一列全为 1 的列

  X_new = np.c_[np.ones((500, 1)), X]

  # 随机初始化估计值 "reg_coef"

  np.random.seed(333)

  reg_coef = np.random.randn(2,1)

  # 这里，size_batch_mini= 小批量大小

  # lr= 学习率

  #  max_iters= 使用的批次数

  lr=0.01

  num = 100

  max_iters = 100

  size_batch_mini = 50

  t0, t1 = 400, 1200

  def lrs(step):

  return t0 / (step + t1)

  reg_coef_all = []

  step = 0

  for j in range(max_iters):

  batches_index  = np.random.permutation(num)

  X_batches = X_new[batches_index]

  y_batches = Y[batches_index]

  for i in range(0, num, size_batch_mini):

  step += 1

  Yi = y_batches[i:i+size_batch_mini]

  Xi = X_batches[i:i+size_batch_mini]

  # 计算梯度

  gradient = 2/size_batch_mini * Xi.T.dot(Xi.dot(reg_coef) - Yi)

  lr = lrs(step)

  # 更新

  reg_coef = reg_coef - lr * gradient

  reg_coef_all.append(reg_coef)

  # 输出

  reg_coef

  reg_coef_all

  ###############################################################

  清单 1-3

  使用小批量梯度下降实现线性回归

  ```


  类似地，线性回归方法可以通过使用 SGD 方法转换为在线学习方法。我鼓励你利用到目前为止讨论的思路，使用 SGD 实现线性回归函数。你可以参考清单 1-3，但要确保更新步骤针对每个观测值进行。


  scikit-learn 库有一个 `SGDRegressor()` 函数，用于应用带有 SGD 的线性回归。清单 1-4 是在模拟数据集上使用 SGD 应用线性回归的代码片段。




  ```

  ###############################################################

  # 导入相关库

  import numpy as np

  import pandas as pd

  from sklearn.model_selection import train_test_split

  from sklearn.linear_model import SGDRegressor

  from sklearn.metrics import mean_squared_error, r2_score

  np.random.seed(111)

  # 创建数据集

  mean = np.array([6.0, 7.0])

  covariance = np.array([[1.0, 0.94], [0.95, 1.2]])

  df = np.random.multivariate_normal(mean, covariance, 10000)

  df.shape

  # 输出 - (10000, 2)

  df

  #输出 -

  #array([[6.97833668, 8.30414776],

  #       [4.66509294, 5.31806407],

  #       [6.88804517, 7.71734893],

  #       ...,

  #       [5.75153443, 6.73145512],

  #       [4.93357924, 6.72570148],

  #       [7.31794626, 8.4076224 ]])

  X = df[:,:-1]

  Y = df[:,-1]

  ## 分割为训练集和测试集

  train_X, test_X, train_y, test_y = train_test_split(X, Y, test_size=0.20, random_state=333)

  ### 使用 SGD 回归器

  mod = SGDRegressor()

  ### 拟合模型

  mod.fit(train_X, train_y)

  #SGDRegressor(alpha=0.0001, average=False, early_stopping=False, epsilon=0.1,

  #             eta0=0.01, fit_intercept=True, l1_ratio=0.15,

  #             learning_rate=''invscaling'', loss="squared_loss", max_iter=1000,

  #             n_iter_no_change=5, penalty="l2", power_t=0.25, random_state=None,

  #             shuffle=True, tol=0.001, validation_fraction=0.1, verbose=0,

  #             warm_start=False)

  ### 打印系数和截距值

  print("系数: \n", mod.coef_)

  #系数: [0.95096598]

  print("截距", mod.intercept_)

  #截距 [1.17712595]

  ### 在测试数据上进行预测

  pred = mod.predict(test_X)

  # 计算预测误差

  error = np.sum(np.abs(test_y - pred) / test_y.shape[0])

  print("平均绝对误差 (MAE) = ", error)

  # 平均绝对误差 (MAE) =  0.4493164833335055 ###############################################################

  清单 1-4

  使用 scikit-learn 实现随机梯度下降

  ```


  本节解释了增量学习和在线学习算法，并在线性回归背景下使用 Python 实现了其中几种算法。下一节将介绍 scikit-multiflow。


  ## Scikit-Multiflow 框架简介


  scikit-multiflow 是一个用于在 Python 中分析流数据的框架 [9]。它是一个根据 BSD 许可证分发的开源软件。业界需要一个用于流数据的
  Python 开源机器学习库，类似于 scikit-learn 库 [10] 多年来为静态/批量数据所做的工作。scikit-multiflow 框架建立在其他著名的开源框架之上，例如
  scikit-learn、MOA [11] 和 MEKA [12]。


  MOA 是历史最悠久、最流行的数据流挖掘开源软件之一。它包含一系列用于监督学习（分类、回归等）和无监督学习（聚类等）的流数据算法。MOA 使用 Java 开发。


  MEKA 是一个用于多标签学习和评估的开源软件。scikit-multiflow 补充了 scikit-learn（其主要关注点是批量学习），并有助于流数据研究中的机器学习。


  scikit-multiflow 网站 ([`https://scikit-multiflow.github.io/`](https://scikit-multiflow.github.io/))
  提供了官方文档和用户指南。


  API 参考文档可在 [`https://scikit-multiflow.readthedocs.io/en/stable/api/api.html`](https://scikit-multiflow.readthedocs.io/en/stable/api/api.html)
  获取。


  scikit-multiflow 包的源代码可在 [`https://github.com/scikit-multiflow/scikit-multiflow`](https://github.com/scikit-multiflow/scikit-multiflow)
  公开获取。


  在安装 scikit-multiflow 之前，需要先安装两个依赖项：numpy 和 cython。


  scikit-multiflow 仅适用于 Python 3.5+ 版本。


  要从 Python 包索引 (PyPI) 安装 scikit-multiflow，请在命令提示符/终端中使用以下命令。


  ```

  $ pip install -U scikit-multiflow

  ```


  也可以使用以下命令从 conda-forge 安装 scikit-multiflow。


  ```

  $ conda install -c conda-forge scikit-multiflow

  ```


  本书使用 2020 年 6 月发布的 0.5.3 版本包。


  在下一节中，您将了解 scikit-multiflow 框架中可用的各种流数据生成器。




  ## 流式数据生成器


  scikit-multiflow 框架包含许多流式数据生成器，用于创建模拟数据流，以支持实验和研究相关工作。其中一种流行的流式数据生成器是超平面生成器。*p*
  维空间中的超平面是满足以下条件的点集 (*x*)。


  ![$$ {\sum}_{j=1}^p{w}_j{x}_j={w}_0 $$](img/499734_1_En_1_Chapter_TeX_Equb.png)


  *x*[*j*] 是 *x* 的第 *j* 个坐标。*w* 是权重 [13]。


  对于目标变量，以下类型的观测值被标记为正类。


  ![$$ {\sum}_{j=1}^p{w}_j{x}_j&gt;={w}_0 $$](img/499734_1_En_1_Chapter_TeX_Equc.png)


  以下类型的观测值被标记为负类。


  ![$$ {\sum}_{j=1}^p{w}_j{x}_j&lt;{w}_0 $$](img/499734_1_En_1_Chapter_TeX_Equd.png)


  超平面在模拟随时间变化的概念（如方向）方面非常有用。通过调整权重的相对大小，可以改变超平面的位置。代码清单 1-5 使用 scikit-multiflow 生成了一个包含十个特征和一个目标变量的数据流。它生成了
  10,000 个观测值，然后将模拟数据存储在一个 CSV 文件中。图 1-5 是生成数据集的快照。


  ![../images/499734_1_En_1_Chapter/499734_1_En_1_Fig5_HTML.jpg](img/499734_1_En_1_Fig5_HTML.jpg)


  图 1-5


  使用超平面生成器生成的数据集快照


  ```

