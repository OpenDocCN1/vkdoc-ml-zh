  ### 霍夫丁自适应树分类器


  第 2 章介绍了用于概念漂移检测的自适应窗口方法（ADWIN），该方法使用一个动态大小的滑动窗口。窗口大小并非固定不变，而是根据窗口中数据观察到的变化率在线计算得出。如果数据流未检测到任何变化，ADWIN
  算法会增大窗口大小；若检测到数据流发生变化，则会减小窗口大小。


  霍夫丁自适应树采用了 ADWIN 方法，是霍夫丁树的一个改进版本。首先，你需要理解概念自适应极速决策树（CVFDT）方法 [6]。CVFDT 方法更适用于存在固有概念漂移的数据流。它会在内部节点和叶节点更新统计信息。其核心思想是：每当在某个子树检测到变化时，就生成一个候选子树，并最终丢弃当前子树或候选子树。


  当节点的分裂测试不再适用时，霍夫丁自适应树会生成一个备选决策树 [6]。旧的树会被更准确的新树所取代。在叶节点上做出的决策基于一个近期样本/观测窗口。需要为样本窗口分配内存；然而，CVFDT
  并没有严格的性能保证。


  霍夫丁自适应树是对使用 ADWIN 的 CVFDT 的轻微修改。ADWIN 的目的是监控每个子树和备选树的误差。霍夫丁自适应树方法利用 ADWIN 的估计值来在叶节点做出决策，并决定是生长新树还是备选树。该方法无需为样本窗口分配内存；其准确率几乎与
  CVFDT 相当，有时甚至表现更优。此外，还能提供严格的性能保证。


  清单 3-4 使用 Agrawal 生成器模拟了一个带有概念漂移的合成数据流。将霍夫丁自适应树分类器应用于该合成数据流，并通过预评估和留出评估两种方式评估模型性能。


