  地标窗口模型


  图 1-2 显示地标窗口会随时间累积数据点。随着更多数据点的到达，窗口大小会增加。这种窗口技术需要大量的内存资源，尤其是在处理大型数据流时。


  在滑动窗口模型中，如图 1-3 所示，“时间”是 x 轴，观测值（即蓝点）从左到右依次到达。最左边的观测值是最旧的数据，最新的观测值在右侧。


  图 1-3 显示较旧的点被持续丢弃；窗口中只考虑最近的点。图 1-3 还显示了一个大小为 8 的窗口（即它在某个时间点包含八个数据点）。窗口以步长 = 1 移动（即窗口以步长
  1 滑动，丢弃最旧的数据）。


  同样在图 1-3 中，时间 t[1] 处的窗口 W[1] 包含八个数据点。当新数据点在时间 t[2] 到达时，W1 中最旧的数据点被丢弃，形成包含八个数据点（包括最新数据点）的窗口
  W[2]。滑动窗口模型只考虑最近的数据点；它丢弃较旧的数据点。


