  ## 总结


  本章讨论了在流数据环境下用于概念漂移检测的各种算法。同时，也探讨了相关技术，并使用 Python 中的 scikit-multiflow 框架对其进行了实现。


  下一章将讨论流数据的各种监督学习技术，并使用 scikit-multiflow 框架实现其中的一些技术。


  '
- '# 3. 流数据的监督学习


  在上一章中，你学习了一些概念漂移检测算法。本章将重点介绍流数据环境下的监督学习算法（用于分类任务和回归任务）。在监督学习中，存在一个目标变量或响应变量，以及一些预测变量。学习器/模型的目标是理解目标变量与预测变量之间的关系。然后，这可用于对预测变量的未来观测值进行目标变量的预测
  [1]。（我假设你已经熟悉了批处理环境中使用的监督学习技术。）


  第 1 章涵盖了流数据的挑战，以及流数据算法与批处理学习算法的不同之处。本章将深入探讨一些用于流数据的机器学习技术及其使用 scikit-multiflow 框架的实现。


  在第 1 章中，你了解了数据流生成器以及如何从源文件（CSV 格式）创建数据流。这些思想几乎被用于本章的所有工作示例中。


  本章首先介绍流数据环境中使用的评估方法。然后讨论监督学习方法——基于树的方法、惰性学习、朴素贝叶斯等。最后，解释了流数据环境下的集成学习技术。


  本章仅限于二分类方法和单目标回归（即，多类分类和多目标回归技术超出了本书的范围）。本章的所有实验均在配置为 1.6 GHz 双核 Intel Core i5 处理器、4
  GB RAM 和 macOS 的系统上执行。然而，代码应在类似或更高配置的系统或操作系统上运行，无需任何更改或修改。本书使用 2020 年 6 月发布的 scikit-multiflow
  包版本 0.5.3。


  ## 评估方法


  本节介绍在流数据环境中评估监督学习方法性能时常用的模型评估方法。这些方法被称为*保留评估方法*和*序贯评估方法*（也称为*交错测试-训练方法*）。


  在保留评估方法中，性能评估在每批一定数量的样本或观测值之后进行。学习器或模型的性能是在由未见过的样本组成的测试数据集上进行评估的。这些未见过的样本仅用于评估目的，不用于训练模型。同一个测试数据集可以在多次评估运行中使用。然而，也可以创建动态测试数据集。可以使用
  scikit-multiflow 框架评估模块中的 `EvaluateHoldout()` 函数来应用保留评估方法。


  序贯评估方法，或称交错测试-训练方法，是专门为评估流数据环境中的模型而设计的。每个样本都根据其到达顺序进行分析。在这种评估方法中，数据流中新到的未见样本首先用于测试（即，模型/学习器进行预测）。这些未见过的样本也用于在下一轮测试之前训练模型。可以使用
  scikit-multiflow 框架评估模块中的 `EvaluatePrequential()` 函数来应用序贯评估方法。


  scikit-multiflow 框架中还有另一种评估方法（*序贯延迟评估方法*）；然而，本书坚持使用保留评估方法和序贯评估方法，并更侧重于后者。


  本章使用这些评估方法来跟踪接下来几节中讨论的各种监督学习算法的性能。在使用 `EvaluateHoldout()` 函数或 `EvaluatePrequential()`
  函数时，你需要指定评估指标。


  在本章中，分类问题通常使用预测准确率和 F1 分数（精确率和召回率的调和平均值）等指标。对于回归问题，则使用均方误差和平均绝对误差等指标。


  ## 流数据的决策树


  本节讨论流数据环境下用于分类和回归任务的一些基于树的技术。它涵盖了 Hoeffding 树、Hoeffding 自适应树分类器、极速决策树分类器、Hoeffding
  树回归器和 Hoeffding 自适应树回归器，这些技术使用 scikit-multiflow 应用于不同的数据集。




  ### 霍夫丁树分类器


  流式数据面临的挑战之一在于内存需求：不可能存储所有数据。在批量处理场景中，决策树会重复使用实例或观测值来计算最佳分裂属性。因此，使用诸如 CART 和 CHAID
  这类通常用于批量数据的决策树方法，在流式数据环境中效果不佳。为了解决这个问题，Domingos 和 Hulten [2] 提出了霍夫丁树，这是一种增量式决策树学习器，它利用新实例来构建树，因此更适合流式数据环境。霍夫丁树也被称为极速决策树（VFDT）算法。


  当数据量足够大时，霍夫丁树会收敛到由批量学习器构建的树。因此，霍夫丁树利用了这样一个思想：小样本通常足以选择最优分裂属性 [3]。这一思想得到了被称为*霍夫丁界*的统计结果的支持。霍夫丁界指出（概率为
  1–£），在对一个取值范围为 *R* 的实值随机变量 x 进行 n 次独立观测后，x 的真实均值至少为 μ − €，其中 μ 是随机变量 x 的观测均值，且 ![$$
  \mathit{\text{\EUR}}=\sqrt{\left(R\hat{\mkern6mu} 2\ \ln \right(1/}\hbox{\pounds}\left)/2\mathrm{n}\right)
  $$](img/499734_1_En_3_Chapter_TeX_IEq1.png) [4]。


  VFDT 方法是霍夫丁树的一种实现。VFDT 是一棵使用霍夫丁界的决策树，它在将树叶节点转换为树节点时，会累积数据流中新到达观测值的充分统计量。然而，流式数据可能噪声很大，这会影响
  VFDT 的性能（就预测准确率而言）。此外，面对带有噪声的流式数据，VFDT 还会面临树规模爆炸的问题 [5]。已有文献记载了解决这些 VFDT 问题的技术。


  清单 3-1 使用第 1 章讨论的超平面生成器创建了一个合成数据集。图 3-1 是该合成数据流的一个快照。


