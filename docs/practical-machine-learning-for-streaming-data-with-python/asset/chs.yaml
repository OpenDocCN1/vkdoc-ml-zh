  ## 用于数据流挖掘的其他工具和技术


  本节将高层次介绍八种用于数据流挖掘的开源软件工具：MOA、Apache Spark、Apache Flink、Apache Storm、Apache Kafka、Faust、Creme
  和 River。还有其他可用于数据流挖掘的工具（包括商业和开源工具），但它们不在本书的讨论范围之内。


  ### 大规模在线分析（MOA）


  大规模在线分析（MOA）是一个用 Java 开发的开源数据流挖掘框架。MOA 是一个基于 GUI 的工具。它包含一系列用于监督学习（分类、回归等）和无监督学习（聚类等）的流数据算法，以及模型评估工具
  [6]。本书讨论的大多数监督和无监督学习方法都可以在 MOA 中找到。


  由于 MOA 基于 GUI 且主要用 Java 开发，它可能对 Python 开发者/用户没有吸引力。我建议你探索一下这个工具。可以从 [`https://moa.cms.waikato.ac.nz`](https://moa.cms.waikato.ac.nz)
  下载。


  ### Apache Spark


  Apache Spark 是一个用于对批处理和流数据进行高速处理和分析的软件环境。它支持多种语言，如 Java、Python 和 R。这就是为什么 Spark（或
  pyspark）对于 Python 用户来说是一个很好的替代选择。Spark 可以访问多种数据源。它可以在云上或 Mesos、Hadoop 和 Kubernetes
  上运行。Spark 的库栈包括 Spark SQL、Spark Streaming、MLlib（用于机器学习）和 GraphX（用于图分析）。要下载最新版本并访问文档，请访问
  [`https://spark.apache.org`](https://spark.apache.org)。


  Spark Streaming 是核心 Spark API 的扩展。它是一个用于大规模处理数据流的强大工具。它包含许多高级函数，例如 `map`、`reduce`、`join`
  和 `window`，用于处理高速数据流。Spark Streaming 支持 MLlib 操作（即流式 k-means 聚类、流式线性回归（一种对每个数据批次使用随机梯度下降拟合的线性回归模型）等）。官方
  Spark Streaming 指南位于 [`https://spark.apache.org/docs/latest/streaming-programming-guide.html`](https://spark.apache.org/docs/latest/streaming-programming-guide.html)。


  ### Apache Flink


  Apache Flink 是一个统一的批处理和流数据分析引擎。它为连续流模型提供了高度灵活的流式窗口。它可以大规模执行内存计算。Flink 与许多其他开源数据处理生态系统集成，例如
  YARN 和 Mesos。Flink 对于事件驱动型应用非常有用，例如异常检测、基于规则的警报、欺诈检测和业务流程监控。请访问 [`https://flink.apache.org`](https://flink.apache.org)
  了解更多关于 Apache Flink 的信息。


  ### Apache Storm


  Apache Storm 是一个开源的分布式流处理计算框架。它主要用 Clojure 开发，但也支持多种语言，如 Java 和 Python。Apache Storm
  是一个对流数据进行实时处理的非常强大的工具。它是一个不支持批处理的流处理引擎。它是一个真正的实时处理框架，将流作为完整的事件而不是一系列小批量来处理。它具有可扩展性，并且可以在跨机器集群运行的并行计算上工作。


  Storm 集群类似于 Hadoop 集群对批数据的作用。要在 Storm 中执行实时计算，你需要创建一个*拓扑*，它是一个有向无环计算图。拓扑由*流*（即，一个无界的元组管道）和*喷口*（即，数据流的来源）组成。一个
  Storm 集群包含两种节点：主节点和工作节点。主节点将任务分配给机器并监控其性能。工作节点将任务分配给其他工作节点。


  要下载最新版本的 Apache Storm 并访问官方文档，请访问 [`https://storm.apache.org/index.html`](https://storm.apache.org/index.html)。




  ### Apache Kafka


  Apache Kafka 是一个开源的分布式事件流平台。什么是*事件流*？它是一种从各种来源（数据库、传感器等）捕获实时数据流，然后进行存储和处理以生成洞察的现象。事件流的一些实际应用场景包括处理证券交易所的金融交易、分析物联网设备数据、自动驾驶应用、网络分析、日志聚合以及实时患者健康监测。官方文档位于
  [`https://kafka.apache.org/documentation/`](https://kafka.apache.org/documentation/)。


  Apache Kafka 引入了一个名为 Kafka Streams 的强大但轻量级的数据流处理库。开发者可以使用 Kafka Streams 大规模构建 Java
  和 Scala 应用程序。使用它构建的应用程序可以部署到虚拟机、容器或云端。Kafka Streams 的文档位于 [`https://kafka.apache.org/documentation/streams/`](https://kafka.apache.org/documentation/streams/)。


  ### Faust


  Faust 是一个用于在 Python 中构建流式应用程序的库。它适用于事件流处理，并且与 Kafka Streams 类似。但 Faust 允许你使用 Python
  语法以及 Python 中的其他流行库（如 NumPy、TensorFlow 和 Django）来处理数据流。官方文档位于 [`https://faust.readthedocs.io/en/latest/`](https://faust.readthedocs.io/en/latest/)。你也可以访问其
  GitHub 页面 [`https://github.com/robinhood/faust`](https://github.com/robinhood/faust)。


  ### Creme


  Creme 是一个用于 Python 在线机器学习的开源库。它是一个用于从流式数据中学习的强大工具。它与 scikit-multiflow 框架有许多相似之处。Creme
  可以通过以下命令从 PyPI 安装。


  ```

  >>> pip install creme

  ```


  请访问 Creme 的 GitHub 页面以进一步探索此工具——[`https://github.com/MaxHalford/creme`](https://github.com/MaxHalford/creme)。


  ### River


  River [8] 是一个用于使用 Python 对流式数据进行在线机器学习的新库。它是 Creme 和 scikit-multiflow 合并的成果。在撰写本章时（2020
  年 11 月），这两个包（Creme 和 scikit-multiflow）的开发者宣布了合并，并证实了共同的愿景和目标。图 4-3 和图 4-4 显示了 scikit-multiflow
  和 Creme GitHub 页面上的合并公告。这两张截图/图片均拍摄于 2020 年 11 月 22 日。


  ![../images/499734_1_En_4_Chapter/499734_1_En_4_Fig4_HTML.jpg](img/499734_1_En_4_Fig4_HTML.jpg)


  图 4-4


  Creme GitHub 页面上合并公告的截图


  ![../images/499734_1_En_4_Chapter/499734_1_En_4_Fig3_HTML.jpg](img/499734_1_En_4_Fig3_HTML.jpg)


  图 4-3


  scikit-multiflow GitHub 页面上合并公告的截图


  合并产生的新包名为 River。Creme 和 scikit-multiflow 仍保留在 PyPI、GitHub 和 conda-forge 上。River
  包在 GitHub 上的地址为 [`https://github.com/online-ml/river`](https://github.com/online-ml/river)。API
  参考文档位于 [`https://riverml.xyz/latest/api/overview/`](https://riverml.xyz/latest/api/overview/)。


  在撰写本章时，River 包还太新，无法进一步讨论。许多功能仍有待开发。我相信 River 有潜力成为 Python 中用于流式数据在线机器学习的一站式解决方案。也许我可以在本书的下一版中重点关注这个包。


  ## 结论与未来方向


  本书旨在介绍使用 Python 对流式数据进行在线/增量机器学习。实时或近实时分析是*下一件大事*（尤其是在物联网设备、可穿戴设备、传感器等出现之后）。许多组织和研究机构都在关注这一点。


  第 1 章解释了流式数据的机器学习有何不同。我们大多数人在批处理环境中日常使用的许多机器学习方法对于数据流挖掘并不有效。


  本书介绍了用于概念漂移检测、监督学习和无监督学习的各种在线/增量学习算法，这些算法均适用于流式数据。鉴于对这些技能的需求，我坚信这些技术应该成为任何数据科学家、研究员、机器学习工程师、分析专业人士或数据科学爱好者的必备技能。


  本书主要关注一个基于 Python 的数据流处理库（即 scikit-multiflow 框架）。考虑到 Python 是数据科学家使用最广泛的语言，这是合理的。我在本章中讨论了不少其他工具，并且有大量的书籍和其他资源可用（尤其是关于
  Spark、Kafka 和 MOA 的）。然而，很少有书籍涉及流式数据的机器学习。本书正是朝着这个方向迈出的一步。


  Scikit-multiflow 是一个用于流式数据在线/增量机器学习的非常强大的工具。你在本书中使用了它来实现流式数据环境下的各种监督和无监督学习技术。


  我建议你从 scikit-multiflow 开始，学习和探索本书中讨论的在线/增量机器学习技术。再次提醒，该包已与 Creme 库合并，新包名为 River。我建议，一旦你熟悉了
  scikit-multiflow 框架的细节，就过渡到 River 库。请注意，你在 scikit-multiflow 框架中学到的大多数技术都应该已集成到 River
  包中。


  再次说明，在撰写本章时，River 包还太新，无法更详细地讨论。但我可能会在本书的下一版中介绍这个包，或者任何其他作为 scikit-multiflow 合适替代品出现的包。


  未来的方向是，使用 scikit-multiflow 框架在各种数据流上学习各种在线/增量机器学习算法的细微差别，然后继续探索其他基于 Python 的数据流挖掘工具，例如
  River、Spark 和 Faust。


  祝学习愉快！☺

