  ### 极速决策树分类器


  极速决策树（EFDT）（霍夫丁任意时刻树的一个实例）是一种增量式决策树。霍夫丁任意时刻树的运行方式与霍夫丁树几乎相同，但区别在于它们在节点上进行分裂的方式。霍夫丁树会延迟节点分裂，直到确定最佳分裂点，并且不会重新审视该决策。而霍夫丁任意时刻树一旦某个分裂看起来有用，就会立即进行节点分裂，并且在出现更好的分裂点时，会重新审视之前的决策。霍夫丁任意时刻树在计算效率上不如霍夫丁树，但在统计效率上更高[7]。


