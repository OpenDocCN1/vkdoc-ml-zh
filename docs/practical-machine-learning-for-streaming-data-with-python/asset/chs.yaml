  本节讨论了流数据场景中一些主流的基于树的分类与回归技术。下一节将重点介绍一些懒惰学习技术。


  ## 流数据的懒惰学习方法


  我们先来谈谈批量场景中用于分类和回归的 k 近邻（KNN）方法。KNN 是一种非参数方法，它将所有观测值保存在内存中，并基于相似度度量/距离函数对新的输入观测值进行分类
  [9]。欧几里得距离、马氏距离和曼哈顿距离是三种常用的距离函数。


  对于一个新的观测值，KNN 算法会根据距离函数在数据集中选择最近的 k 个邻居，然后结合这 k 个最近邻的值进行预测（即在回归场景中取平均值，在分类场景中执行多数投票）。


  scikit-multiflow 提供了用于流数据分类场景的 KNN 方法实现（KNNClassifier()）。该技术的运作模式与 KNN 相同，并增加了对训练样本的窗口处理。用户可以固定窗口的最大大小。KNNClassifier()
  方法将数据流中的所有特征视为连续型，不推荐用于混合了类别型和连续型特征的数据集。


