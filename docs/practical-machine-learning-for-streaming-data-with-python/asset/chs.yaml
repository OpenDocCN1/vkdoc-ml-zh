  import numpy as np

  from skmultiflow.drift_detection.adwin import ADWIN

  # 设置随机种子以确保结果可重现

  np.random.seed(123)

  # 模拟一个来自标准正态分布、大小为 1000 的数据流

  stream = np.random.randn(1000)

  stream[:10]

  # 输出：

  #array([-1.0856306 ,  0.99734545,  0.2829785 , -1.50629471, -0.57860025,

